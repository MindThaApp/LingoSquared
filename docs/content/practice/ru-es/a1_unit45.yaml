schema_version: '1.0'
pack_key: practice.ru-es.a1.unit45
source_language: ru
target_language: es
unit_content_key: es.a1.unit45.money
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_amable
    - w_cambio
    - w_dividimos
    - w_efectivo
    - w_euros
    - w_paga
    - w_pagar
    - w_pago
    - w_pedimos
    - w_platos
    - w_puedo
    - w_separado
    - w_tarjeta
    - w_total
templates:
- content_key: practice.ru-es.es.a1.unit45.lesson01.choose.001
  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_total
        - w_euros
        - w_pagar
        - w_tarjeta
        - w_efectivo
        - w_puedo
        - w_pago
        - w_dividimos
        - w_separado
        - w_cambio
        - w_platos
        - w_pedimos
        - w_amable
        - w_paga
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Сколько это стоит всего?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson02.listen.001
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Картой или наличными?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson03.translate.001
  lesson_content_key: es.a1.unit45.lesson03.dividir_la_cuenta
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Делим счёт».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson04.match.001
  lesson_content_key: es.a1.unit45.lesson04.el_cambio
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое испанское слово с его русским значением; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson05.choose.001
  lesson_content_key: es.a1.unit45.lesson05.leer_un_ticket_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Читаем ресторанный чек».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson06.translate.001
  lesson_content_key: es.a1.unit45.lesson06.elena_y_mateo_pagan
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Елена и Матео оплачивают счёт».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson01.order.002
  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: word_order
  frame:
    text: ¿Cuánto cuesta en {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_total
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto cuesta en {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Сколько это стоит всего? Слова en total уточняют, что нужна полная общая цена, а не цена одной вещи.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson01.fill.003
  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: fill_in_blank
  frame:
    text: Cuesta veinticinco {item} en total. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_euros
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_euros
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Всего это стоит двадцать пять евро. Cuesta — форма 3-го лица единственного числа от costar (стоить); гласная корня меняется с o на ue, когда на неё падает ударение.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson02.order.002
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: word_order
  frame:
    text: ¿Puedo {item} con tarjeta aquí?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_pagar
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedo {item} con tarjeta aquí?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Можно здесь заплатить картой? pagar значит «платить».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson02.fill.003
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: fill_in_blank
  frame:
    text: ¿Quiere pagar en efectivo o con {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tarjeta
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tarjeta
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Вы хотите заплатить наличными или картой? Quiere — вежливая форма usted от querer; её здесь использует незнакомый кассир, а с другом ты бы сказал: ¿quieres pagar...?'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson02.translate.004
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: translation
  frame:
    text: Я плачу наличными.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_efectivo
  answer_derivation:
    kind: render_frame
    frame:
      text: Pago en {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Я плачу наличными. efectivo значит «наличные».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson03.order.002
  lesson_content_key: es.a1.unit45.lesson03.dividir_la_cuenta
  type: word_order
  frame:
    text: ¿Puedo pagar por {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_separado
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedo pagar por {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Можно заплатить отдельно? Por separado («отдельно») говорит о том, как платить; pagar («платить») — обычный глагол для этого.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson04.order.002
  lesson_content_key: es.a1.unit45.lesson04.el_cambio
  type: word_order
  frame:
    text: Aquí tiene su {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_cambio
  answer_derivation:
    kind: render_frame
    frame:
      text: Aquí tiene su {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Вот ваша сдача. cambio значит «сдача»; также «обмен, перемена».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit45.lesson06.order.002
  lesson_content_key: es.a1.unit45.lesson06.elena_y_mateo_pagan
  type: word_order
  frame:
    text: Mateo {item} la cuenta.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_paga
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo {item} la cuenta.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Матео оплачивает счёт. Paga — форма 3-го лица единственного числа от pagar (платить): Mateo paga la cuenta.'
    language_code: ru
    direction: ltr
