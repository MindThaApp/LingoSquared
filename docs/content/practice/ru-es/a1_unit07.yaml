schema_version: '1.0'
pack_key: practice.ru-es.a1.unit07
source_language: ru
target_language: es
unit_content_key: es.a1.unit07.shopping
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - es_a1_u07
    - es_a1_u07_l01
    - es_a1_u07_l06
    - w_cuesta
    - w_cuestan
    - w_docena
    - w_necesita
    - w_todo
    - w_ingredientes
slot_presets:
  market: &id001
    language_code: es
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: es_a1_u07_l01
  nouns: &id002
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: es_a1_u07
  content: &id008
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u07
  dialogue: &id010
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u07_l06
  cuesta: &id003
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_cuesta
  cuestan: &id004
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_cuestan
  docena: &id005
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_docena
  necesita: &id006
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_necesita
  todo: &id007
    language_code: es
    part_of_speech: pronoun
    agreement_tags:
      semantic: w_todo
  ingredientes: &id009
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_ingredientes
templates:
- content_key: practice.ru-es.es.a1.unit07.lesson01.choose.001
  lesson_content_key: es.a1.unit07.lesson01.el_mercado
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Прилагательные согласуются с существительным: la fruta fresca, los tomates frescos.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit07.lesson01.listen.002
  lesson_content_key: es.a1.unit07.lesson01.el_mercado
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Verdura — это один овощ; на рынке обычно просят verduras.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit07.lesson02.order.001
  lesson_content_key: es.a1.unit07.lesson02.preguntar_el_precio
  type: word_order
  frame:
    text: ¿Cuánto {item} el kilo de tomates?
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto {item} el kilo de tomates?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Сколько стоит килограмм помидоров? Cuesta употребляется про одну вещь, cuestan — про несколько.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit07.lesson02.translate.002
  lesson_content_key: es.a1.unit07.lesson02.preguntar_el_precio
  type: translation
  frame:
    text: Сколько стоят яйца?
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto {item} los huevos?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Huevos — множественное число, поэтому глагол cuestan; про хлеб было бы cuesta.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit07.lesson03.order.001
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: word_order
  frame:
    text: Una {item} de huevos, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Una {item} de huevos, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Десяток яиц, пожалуйста. После слов количества перед названием продукта стоит de: un kilo de tomates.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit07.lesson03.match.002
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Medio kilo — это полкило; перед medio не ставится un.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit07.lesson03.translate.003
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Слова на -o обычно мужского рода (el mercado), а на -a — женского (la fruta).
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit07.lesson04.fill.001
  lesson_content_key: es.a1.unit07.lesson04.una_compra_sencilla
  type: fill_in_blank
  frame:
    text: ¿{item} algo más? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Продавцы на рынке обращаются к покупателям на usted: ¿Necesita algo más?'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit07.lesson04.translate.002
  lesson_content_key: es.a1.unit07.lesson04.una_compra_sencilla
  type: translation
  frame:
    text: У нас уже есть всё.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ya tenemos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ya («уже») в испанском обычно стоит перед глаголом.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit07.lesson05.choose.001
  lesson_content_key: es.a1.unit07.lesson05.leer_las_etiquetas_de_precio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Todos los días значит «каждый день», буквально «все дни».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit07.lesson06.order.001
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: word_order
  frame:
    text: Necesitamos {item} para la próxima clase.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Necesitamos {item} para la próxima clase.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Нам нужны ингредиенты для следующего занятия. Necesitamos — форма «мы» глагола necesitar.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit07.lesson06.translate.002
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¡Qué tomates tan frescos! — так по-испански говорят «какие свежие помидоры!»
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit07.lesson06.listen.003
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vamos значит и «пойдёмте», и «мы идём»; различить их помогает контекст.
    language_code: ru
    direction: ltr
