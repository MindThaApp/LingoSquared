    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Apartamento распространено в Латинской Америке; в Испании также говорят piso.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit14.lesson02.order.001
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: word_order
  frame:
    text: Quiero {item} un apartamento cerca del parque.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero {item} un apartamento cerca del parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Я хочу снять квартиру рядом с парком. Querer + инфинитив говорит о том, что ты хочешь делать.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit14.lesson02.fill.002
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: fill_in_blank
  frame:
    text: Hay un apartamento {item} en este edificio. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Desocupado описывает квартиру, в которой сейчас никто не живёт; это слово стоит после существительного.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit14.lesson03.translate.001
  lesson_content_key: es.a1.unit14.lesson03.cuantos_dormitorios_tiene
  type: translation
  frame:
    text: Сколько в ней спален?
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuántos {item} tiene?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Cuántos согласуется с существительным мужского рода во множественном числе; с существительным женского рода — cuántas.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit14.lesson05.fill.001
  lesson_content_key: es.a1.unit14.lesson05.leer_el_anuncio
  type: fill_in_blank
  frame:
    text: ¿Hay {item} en casa? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alguien значит «кто-то»; противоположное слово — nadie, «никто».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit14.lesson06.order.001
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: word_order
  frame:
    text: Voy a llamar a la {item} hoy mismo.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Voy a llamar a la {item} hoy mismo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Я собираюсь позвонить в агентство сегодня же. Hoy mismo добавляет значение «именно сегодня».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit14.lesson06.translate.002
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Pequeño меняется на pequeña с существительным женского рода: una cocina pequeña.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit14.lesson06.choose.003
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Alquilar — арендовать (снимать или сдавать); сама ежемесячная плата — el alquiler.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit14.lesson02.translate.003
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Edificio — любое здание, в том числе многоквартирный дом; casa — это дом или жильё.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit14.lesson02.order.004
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: word_order
  frame:
    text: El {item} está cerca del parque.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} está cerca del parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Здание находится рядом с парком. Cerca de + el сливается в cerca del.
    language_code: ru
    direction: ltr
