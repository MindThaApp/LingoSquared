  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Dormitorio происходит от dormir, «спать»: комната, где спят.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit14.lesson01.match.003
  lesson_content_key: es.a1.unit14.lesson01.el_apartamento_vocabulario
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
