templates:
- content_key: practice.ru-es.es.a1.unit14.lesson01.choose.001
  lesson_content_key: es.a1.unit14.lesson01.el_apartamento_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Baño — это и ванная комната, и ванна; sala — гостиная.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit14.lesson01.listen.002
  lesson_content_key: es.a1.unit14.lesson01.el_apartamento_vocabulario
