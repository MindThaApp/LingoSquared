schema_version: '1.0'
pack_key: practice.ru-es.a1.unit52
source_language: ru
target_language: es
unit_content_key: es.a1.unit52.appearance
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_alto
    - w_azul
    - w_bajo
    - w_castaño
    - w_chica
    - w_conocerte
    - w_conoces
    - w_dar
    - w_diferentes
    - w_edad
    - w_encantado
    - w_gris
    - w_joven
    - w_largo
    - w_mayor
    - w_negro
    - w_nueva
    - w_ojos
    - w_pelo
    - w_personas
    - w_reconoceré
    - w_rubio
    - w_verde
templates:
- content_key: practice.ru-es.es.a1.unit52.lesson01.choose.001
  lesson_content_key: es.a1.unit52.lesson01.alto_bajo_mayor_y
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_alto
        - w_bajo
        - w_mayor
        - w_joven
        - w_dar
        - w_edad
        - w_pelo
        - w_negro
        - w_rubio
        - w_castaño
        - w_gris
        - w_largo
        - w_ojos
        - w_azul
        - w_verde
        - w_chica
        - w_nueva
        - w_reconoceré
        - w_diferentes
        - w_conoces
        - w_personas
        - w_encantado
        - w_conocerte
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о росте и возрасте: высокий, низкий, старый и молодой.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit52.lesson02.listen.001
  lesson_content_key: es.a1.unit52.lesson02.describir_el_pelo
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока об описании волос.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit52.lesson03.translate.001
  lesson_content_key: es.a1.unit52.lesson03.los_ojos_y_como
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о глазах и о том, как выглядит человек.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit52.lesson04.match.001
  lesson_content_key: es.a1.unit52.lesson04.elena_describe_a_nina
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое испанское слово с его русским значением; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
