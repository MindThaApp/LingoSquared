templates:
- content_key: practice.ru-es.es.a1.unit02.lesson01.choose.001
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Перед существительным мужского рода uno сокращается до un (un huevo), а перед существительным женского рода превращается в una (una taza).
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson01.listen.002
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В слове seis один слог, а в siete два (sie-te); прислушайся к звуку t.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson02.match.001
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Числа от одиннадцати до пятнадцати имеют собственные формы (once, doce, trece, catorce, quince); начиная с шестнадцати они образуются от diez: dieciséis.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson02.translate.002
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cien означает ровно сто; после ста используется ciento: ciento uno.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson03.order.001
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: Tengo {age} años.
    language_code: es
    direction: ltr
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Возраст в испанском выражается глаголом tener («иметь»): человеку не «является» столько-то лет, а он их «имеет».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson03.translate.002
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: Мне {age} лет.
    language_code: ru
    direction: ltr
    slot_rendering:
      age: english_gloss
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Для возраста никогда не используй soy: Tengo veinte años, а не Soy veinte.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson03.fill.003
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: fill_in_blank
  frame:
    text: ¿Cuántos años {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'При обращении на «вы» (usted) вопрос звучит так: ¿Cuántos años tiene usted?'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson04.choose.001
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Номера телефонов в испанском часто читают парами: 62 41 ... как sesenta y dos, cuarenta y uno.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson04.order.002
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: word_order
  frame:
    text: ¿Puedes {item}, por favor?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedes {item}, por favor?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Puedes + инфинитив — просьба к другу; при обращении на «вы» говорят ¿Puede repetir, por favor?
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson04.translate.003
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Por favor («пожалуйста») и claro («конечно») — два из самых полезных слов в любом разговоре.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson05.choose.001
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Количество связывается с продуктом через de: dos tazas de harina.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson05.translate.002
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Во множественном числе в испанском добавляется -s после гласной (taza, tazas) и -es после согласной.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson05.translate.003
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: 'Мне нужно три штуки: {item}.'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Necesito tres {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Necesito («мне нужно») происходит от necesitar; чтобы спросить другого человека, используй ¿Cuántos necesitas?
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson05.fill.004
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: fill_in_blank
  frame:
    text: Media taza de {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Taza — женского рода, поэтому «полчашки» — media taza; с существительным мужского рода говорят medio: medio kilo.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson06.listen.001
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Oye — дружеский способ привлечь внимание, как русское «слушай» или «эй».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson06.translate.002
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: translation
  frame:
    text: Ещё один вопрос.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Una {item} más.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Más обычно стоит после существительного: una pregunta más — «ещё один вопрос».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit02.lesson06.match.003
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Tengo, tienes и tiene — формы глагола tener: у меня есть, у тебя есть, у него или у неё есть.'
    language_code: ru
    direction: ltr
