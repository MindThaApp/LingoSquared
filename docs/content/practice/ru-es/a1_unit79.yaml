  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_arena
    - w_caliente
    - w_mar
    - w_nado
    - w_ola
    - w_sombrilla
    - w_sombrillas
    - w_zoo
templates:
- content_key: practice.ru-es.es.a1.unit79.lesson01.choose.001
  lesson_content_key: es.a1.unit79.lesson01.vamos_a_la_playa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_mar
        - w_arena
        - w_caliente
        - w_ola
        - w_sombrilla
        - w_nado
        - w_sombrillas
        - w_zoo
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Пойдём на пляж?».'
    language_code: ru
    direction: ltr
