templates:
- content_key: practice.ru-es.es.a1.unit08.lesson01.choose.001
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Biblioteca — это библиотека, а книжный магазин — librería; это частый «ложный друг».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit08.lesson01.listen.002
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Banco также означает «скамейка»; в этом уроке это банк на улице.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit08.lesson01.order.003
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: word_order
  frame:
    text: La {item} está cerca de aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: La {item} está cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Для места нахождения чего-либо используется estar: la farmacia está cerca.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit08.lesson01.translate.004
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: translation
  frame:
    text: '{item} рядом с рынком.'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} está al lado del mercado.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'De + el сливается в del: al lado del mercado — рядом с рынком.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit08.lesson02.fill.001
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: fill_in_blank
  frame:
    text: La farmacia está {item} del mercado. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: После enfrente de, al lado de, lejos de и cerca de перед названием места всегда нужен de.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit08.lesson02.order.002
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: word_order
  frame:
    text: El parque está {item} del mercado.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: El parque está {item} del mercado.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Парк далеко от рынка. Противоположность — cerca de, «близко к».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit08.lesson02.translate.003
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: translation
  frame:
    text: Библиотека находится между банком и парком.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La biblioteca está {item} el banco y el parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: После entre идут два места, соединённые через y, и de после него не нужен.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit08.lesson04.fill.001
  lesson_content_key: es.a1.unit08.lesson04.preguntar_si_esta_lejos
  type: fill_in_blank
  frame:
    text: Sí, está {item} lejos. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bastante означает «довольно»: bastante lejos — довольно далеко; bastante cerca — довольно близко.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit08.lesson05.match.001
  lesson_content_key: es.a1.unit08.lesson05.leer_sobre_el_barrio
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'En este barrio hay muchos lugares útiles: hay вводит то, что есть в данном месте.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit08.lesson05.translate.002
  lesson_content_key: es.a1.unit08.lesson05.leer_sobre_el_barrio
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Útil во множественном числе становится útiles, потому что оканчивается на согласную.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit08.lesson06.choose.001
  lesson_content_key: es.a1.unit08.lesson06.lugares_del_barrio_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Donde без ударения соединяет две части предложения; ¿dónde? с ударением задаёт вопрос.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit08.lesson06.translate.002
  lesson_content_key: es.a1.unit08.lesson06.lugares_del_barrio_dialogue
  type: translation
  frame:
    text: Это рядом с рынком, где мы покупали яйца.
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Está al lado del mercado donde {item} los huevos.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Compramos означает и «мы покупаем», и «мы купили»; время понятно из контекста.
    language_code: ru
    direction: ltr
