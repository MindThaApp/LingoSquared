schema_version: '1.0'
pack_key: practice.ru-es.a1.unit55
source_language: ru
target_language: es
unit_content_key: es.a1.unit55.vervoer
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_andando
    - w_bici
    - w_camina
    - w_caminar
    - w_centro
    - w_coche
    - w_compro
    - w_conduce
    - w_conducir
    - w_estación
    - w_normalmente
    - w_prefiere
    - w_transporte
    - w_vas
    - w_viaja
    - w_viajar
    - w_viajas
    - w_viajo
templates:
- content_key: practice.ru-es.es.a1.unit55.lesson01.choose.001
  lesson_content_key: es.a1.unit55.lesson01.el_tren_la_bici
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_bici
        - w_viaja
        - w_coche
        - w_caminar
        - w_conduce
        - w_camina
        - w_viajar
        - w_viajas
        - w_viajo
        - w_transporte
        - w_estación
        - w_compro
        - w_centro
        - w_vas
        - w_normalmente
        - w_prefiere
        - w_conducir
        - w_andando
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока о поезде, велосипеде, машине и ходьбе.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit55.lesson02.listen.001
  lesson_content_key: es.a1.unit55.lesson02.cada_persona_viaja_de
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока о том, что все ездят по-разному.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit55.lesson03.translate.001
  lesson_content_key: es.a1.unit55.lesson03.comprar_un_billete
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о покупке билета.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit55.lesson04.match.001
  lesson_content_key: es.a1.unit55.lesson04.lucia_le_pregunta_a
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое испанское слово с его русским значением; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit55.lesson05.choose.001
  lesson_content_key: es.a1.unit55.lesson05.quien_viaja_como
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока о том, кто как добирается.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit55.lesson06.translate.001
  lesson_content_key: es.a1.unit55.lesson06.vamos_juntos_en_bici
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока «Поедем вместе на велосипедах?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit55.lesson01.order.002
  lesson_content_key: es.a1.unit55.lesson01.el_tren_la_bici
  type: word_order
  frame:
    text: Mateo va en {item} al trabajo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_bici
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo va en {item} al trabajo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Матео ездит на работу на велосипеде. bici означает «велосипед».
    language_code: ru
    direction: ltr
