      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_coche
  answer_derivation:
    kind: render_frame
    frame:
      text: Diego conduce el {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Диего водит машину. coche означает «машина».
    language_code: ru
    direction: ltr
- content_key: practice.ru-es.es.a1.unit55.lesson02.order.002
  lesson_content_key: es.a1.unit55.lesson02.cada_persona_viaja_de
