  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    text_blocks:
    - text: Выбери значение на русском.
      language_code: ru
      direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — глагол повседневного распорядка из этого урока.'
    language_code: ru
    direction: ltr
