  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-nl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - routine_verb_infinitive
    - sequence_word
    - drukkeweek_daarna_single
    - appearance_eruit_single
slot_presets:
  routine_verb_infinitive: &id001
    language_code: nl
    part_of_speech: verb
    agreement_tags:
      semantic: routine_verb_infinitive
  sequence_word: &id002
    language_code: nl
    part_of_speech:
    - adverb
    - particle
    agreement_tags:
      semantic: sequence_word
