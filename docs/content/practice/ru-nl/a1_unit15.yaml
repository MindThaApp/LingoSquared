schema_version: '1.0'
pack_key: practice.ru-nl.a1.unit15
source_language: ru
target_language: nl
unit_content_key: nl.a1.unit15.travel
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-nl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - travel_noun
    - travel_noun_pure
    - station_place
    - reisvertraging_vertraging_single
slot_presets:
  travel_noun:
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: travel_noun
  travel_noun_pure: &id001
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: travel_noun_pure
  station_place: &id003
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: station_place
  vertraging_single: &id002
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: reisvertraging_vertraging_single
templates:
- content_key: practice.ru-nl.nl.a1.unit15.lesson01.choose.001
  lesson_content_key: nl.a1.unit15.lesson01.een_kaartje_kopen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    text_blocks:
    - text: Выбери значение на русском.
      language_code: ru
      direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — слово на тему путешествий из этого урока.'
    language_code: ru
    direction: ltr
