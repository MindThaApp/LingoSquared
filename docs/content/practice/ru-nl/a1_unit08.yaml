  place_non_station:
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: place_non_station
  position:
    language_code: nl
    part_of_speech: preposition
    agreement_tags:
      semantic: position
  common_place: &id001
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: common_place
  position_no_voor: &id002
    language_code: nl
    part_of_speech: preposition
    agreement_tags:
      semantic: position_no_voor
