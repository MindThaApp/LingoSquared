    kind: render_frame
    frame:
      text: अर्जुन कैसा {item} कर रहा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ¿Cómo se siente Arjun? कैसा महसूस कर रहा है significa '¿cómo se siente?'. कैसा concuerda con la persona, así que para una mujer se dice कैसी.
    language_code: es
    direction: ltr
