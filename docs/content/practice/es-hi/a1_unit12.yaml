templates:
- content_key: practice.es-hi.hi.a1.unit12.lesson01.choose.001
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'था y थी sustituyen a है en pasado y concuerdan con el sujeto: दिन अच्छा था, फ़िल्म अच्छी थी.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson01.order.002
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: कल का दिन {item} था?
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: कल का दिन {item} था?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा concuerda con el sustantivo masculino दिन; con un sustantivo femenino sería कैसी.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson01.order.003
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: चाय की दुकान बहुत {item} थी।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अच्छी es femenino porque दुकान es femenino, y थी concuerda con ese sustantivo.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson01.fill.004
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: fill_in_blank
  frame:
    text: फ़िल्म अच्छी {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थी es el pasado femenino de «ser/estar» y concuerda con el sustantivo femenino फ़िल्म.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson01.translate.005
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: La película era buena.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फ़िल्म अच्छी {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म es femenino, así que tanto el adjetivo como el pasado de «ser/estar» toman la forma femenina.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson01.translate.006
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: La tienda de té era muy buena.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की une चाय con el sustantivo femenino दुकान, y अच्छी y थी concuerdan con él.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson02.choose.001
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Los pasados de जाना y मिलना terminan en -आ para un hombre y en -ई para una mujer: गया o गई, मिला o मिली.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson02.order.002
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: word_order
  frame:
    text: मैं वहाँ प्रिया से {item}।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं वहाँ प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'से aquí significa «con»: प्रिया से मिला es «me encontré con Priya», y la terminación depende de quien habla.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson02.fill.003
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं कल बाज़ार {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La terminación -ई indica que quien habla es una mujer.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson02.fill.004
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं वहाँ अर्जुन से {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: El pasado de मिलना concuerda con quien habla, así que una mujer dice मिली.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson02.translate.005
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: Fui a casa. (lo dice una mujer)
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं घर {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Una mujer usa गई; un hombre diría गया.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson02.translate.006
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: Me encontré con Priya. (lo dice una mujer)
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से después de la persona con quien te encuentras significa «con»; la terminación del verbo depende de quien habla.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson02.translate.007
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'El pasado de un verbo concuerda con quien realiza la acción: un hombre dice मिला y una mujer dice मिली.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson03.choose.001
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'मिले se usa con हम, तुम y वे: हम मिले, nos encontramos.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson03.fill.002
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: fill_in_blank
  frame:
    text: वहाँ हम {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Con हम, la forma de pasado termina en -ए, igual que el plural masculino.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit12.lesson03.translate.003
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: translation
  frame:
    text: Nos encontramos.
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: हम {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: हम toma la forma plural मिले, sea quien sea el grupo.
    language_code: es
    direction: ltr
