templates:
- content_key: practice.es-hi.hi.a1.unit05.lesson01.choose.001
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: माता-पिता («padres») une माता, una palabra formal para «madre», con पिता («padre»), igual que दादा-दादी une a ambos abuelos.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson02.listen.001
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: El hindi distingue entre los abuelos paternos (दादा, दादी) y los abuelos maternos (नाना, नानी); el español no tiene esa distinción con palabras distintas.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson03.choose.001
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'बड़ा y छोटा se usan con sustantivos masculinos, y बड़ी y छोटी con sustantivos femeninos; además, cada uno expresa la edad: mayor o menor.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson02.match.002
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Las palabras de familia en hindi forman pares masculino y femenino: भाई y बहन, दादा y दादी, नाना y नानी.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson01.order.002
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरा {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: भाई es masculino, por eso lleva मेरा; una palabra femenina como बहन lleva मेरी.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson01.order.003
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहन es femenino, así que el posesivo es मेरी, no मेरा.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson01.order.004
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरे {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Por respeto a una persona mayor, मेरा pasa a मेरे y है pasa a हैं, incluso si es una sola persona.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson02.order.003
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: word_order
  frame:
    text: मेरे माता-पिता {city} में रहते हैं।
    language_code: hi
    direction: ltr
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में después de una ciudad significa «en», y el verbo con un sujeto plural de respeto es रहते हैं.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson03.order.002
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: word_order
  frame:
    text: मेरा एक {item} भाई भी है।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा एक {item} भाई भी है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बड़ा y छोटा concuerdan con el sustantivo masculino भाई, y एक aquí significa «un/una» más que «uno» como cifra.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson01.fill.005
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: fill_in_blank
  frame:
    text: तुम्हारा {item} कहाँ रहता है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: परिवार se trata como singular y masculino, por eso el verbo es रहता है.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson02.fill.004
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: fill_in_blank
  frame:
    text: मेरे दादा-दादी दिल्ली में {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Con los abuelos, que son personas respetadas y se usan en plural, el verbo es रहते हैं y no रहता है.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson03.fill.003
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: fill_in_blank
  frame:
    text: मेरी भी एक {item} बहन है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: छोटी es la forma femenina porque बहन es femenino; para un hermano sería छोटा.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson02.translate.005
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: translation
  frame:
    text: Mis padres viven en {city}.
    language_code: es
    direction: ltr
    slot_rendering:
      city: english_gloss
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Los padres son mayores a quienes se respeta, por eso se usan मेरे y el verbo en plural रहते हैं.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson01.translate.006
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: ¿Dónde vive tu familia? (informal)
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा {item} कहाँ रहता है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Con el आप formal dirías आपका परिवार कहाँ रहता है?
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson01.translate.007
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: Este es mi padre. (dicho con respeto)
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'El respeto se marca dos veces: मेरे en lugar de मेरा y हैं en lugar de है.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit05.lesson01.translate.008
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: El hindi tiene dos palabras para «abuelo» y dos para «abuela», según sean del lado del padre o del lado de la madre.
    language_code: es
    direction: ltr
