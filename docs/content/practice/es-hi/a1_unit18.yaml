templates:
- content_key: practice.es-hi.hi.a1.unit18.lesson01.choose.001
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कमरा es una habitación y कमरे es más de una; बाथरूम y बेडरूम son préstamos del inglés, mientras que रसोई es la palabra hindi para «cocina».
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit18.lesson01.listen.002
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
