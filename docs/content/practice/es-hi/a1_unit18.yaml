    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Un sustantivo masculino terminado en -ा cambia a -े en plural: कमरा, कमरे.'
    language_code: es
    direction: ltr
