templates:
- content_key: practice.es-hi.hi.a1.unit17.lesson01.choose.001
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: शिक्षक es un profesor y शिक्षिका una profesora; इंजीनियर se usa para ambos.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson01.listen.002
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Algunas profesiones en hindi tienen una forma femenina propia, como शिक्षक y शिक्षिका, mientras que los préstamos como इंजीनियर no la tienen.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson01.order.003
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: मैं {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'La palabra para «profesor» depende del género de quien habla: शिक्षक para un hombre, शिक्षिका para una mujer.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson01.order.004
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: प्रिया {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: प्रिया es una mujer, así que es शिक्षिका.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson01.fill.005
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: शिक्षिका forma el femenino con -इका, un patrón que aparece en varias palabras de origen sánscrito.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson01.fill.006
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: fill_in_blank
  frame:
    text: अर्जुन {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इंजीनियर es la misma palabra para un hombre y para una mujer.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson01.translate.007
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Soy profesora. (lo dice una mujer)
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Una mujer dice शिक्षिका; un hombre diría शिक्षक.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson01.translate.008
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Soy profesor. (lo dice un hombre)
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Un hombre dice शिक्षक; una mujer diría शिक्षिका.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson01.translate.009
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Soy ingeniero.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: इंजीनियर no cambia según el género, y el hindi no usa artículo indefinido (un/una).
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson02.choose.001
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दफ़्तर es un sustantivo masculino que significa «oficina», y में después de él significa «en la oficina».
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson02.order.002
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: word_order
  frame:
    text: मैं {item} में काम करता हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में después del lugar significa «en», y el lugar va antes del verbo.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson02.fill.003
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: fill_in_blank
  frame:
    text: अर्जुन {item} में काम करता है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: काम करना significa «trabajar», y el lugar de trabajo lleva में.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson02.translate.004
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: Trabajo en una oficina. (lo dice un hombre)
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: El hindi no usa artículo indefinido (un/una), y el lugar va antes de काम करता हूँ.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson02.translate.005
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: Arjun trabaja en una oficina.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: अर्जुन {item} में काम करता है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Con un nombre el verbo termina en है, no en हूँ, y -ता indica que Arjun es un hombre.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson03.choose.001
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाते en तुम रोज़ दफ़्तर जाते हो es la forma en -ते que se usa con तुम al hablar con un hombre.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson03.order.002
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: word_order
  frame:
    text: तुम रोज़ दफ़्तर {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Con तुम el verbo termina en -ते y va seguido de हो cuando se habla con un hombre.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson03.fill.003
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: fill_in_blank
  frame:
    text: तुम रोज़ दफ़्तर {item} हो? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Una pregunta de sí o no puede empezar con क्या, que es opcional, pero basta con la entonación ascendente.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit17.lesson03.translate.004
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: translation
  frame:
    text: Todos los días vas a la oficina. (informal, hablando con un hombre)
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Con तुम el verbo termina en -ते y va seguido de हो, para un hombre.
    language_code: es
    direction: ltr
