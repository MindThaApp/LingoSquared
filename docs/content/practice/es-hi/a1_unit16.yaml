templates:
- content_key: practice.es-hi.hi.a1.unit16.lesson01.choose.001
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दर्द es un sustantivo masculino que significa «dolor», y मुझे सिर दर्द है es la forma habitual de decir «tengo dolor de cabeza».
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson01.listen.002
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'El hindi dice literalmente «a mí fiebre es»: मुझे बुखार है, con है y no con un verbo como «tener».'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson01.order.003
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: word_order
  frame:
    text: मुझे {item} दर्द है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} दर्द है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: El hindi dice «cabeza dolor» para «dolor de cabeza», con सिर antes de दर्द.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson01.order.004
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: word_order
  frame:
    text: मुझे सिर {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे सिर {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: दर्द va después de सिर y antes de है, como en सिर दर्द है.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson01.fill.005
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: fill_in_blank
  frame:
    text: मुझे {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Las enfermedades usan मुझे ... है: literalmente, «a mí fiebre es».'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson01.fill.006
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: fill_in_blank
  frame:
    text: मुझे सिर {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: सिर दर्द es un compuesto de «cabeza» y «dolor».
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson01.translate.007
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: translation
  frame:
    text: Tengo fiebre.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Aquí el hindi no usa un verbo para «tener»; bastan मुझे y है.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson01.translate.008
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: translation
  frame:
    text: 'Tengo dolor de cabeza. (literalmente: a mí dolor de cabeza es)'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे सिर {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'El hindi no usa artículo: सिर दर्द es un compuesto que se emplea sin «un».'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson02.choose.001
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: आराम करो es el imperativo informal «¡descansa!», formado por el sustantivo आराम más करो.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson02.order.002
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
    text: मुझे {item} के पास जाना है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} के पास जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के पास después de una persona significa «a casa de / junto a esa persona», así que डॉक्टर के पास जाना es «ir al médico».
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson02.order.003
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
    text: तुम्हें {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चाहिए va después de lo que se necesita y normalmente no lleva है detrás.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson02.order.004
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
    text: आराम {item} और डॉक्टर के पास जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आराम {item} और डॉक्टर के पास जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Las dos órdenes terminan en -ो porque se dirigen a alguien a quien se trata de तुम.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson02.fill.005
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: fill_in_blank
  frame:
    text: मुझे {item} चाहिए। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lo que se necesita va entre मुझे y चाहिए.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson02.fill.006
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: fill_in_blank
  frame:
    text: आराम {item}! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: करो es el imperativo informal de करना, y आराम करो significa «descansa».
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson02.translate.007
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: Necesito medicina.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए se usa para «necesitar» y para «querer», sea quien sea el que habla.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson02.translate.008
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: Tengo que ir al médico.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} के पास जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के पास va después de «el médico» y significa «al lugar donde está el médico».
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson02.translate.009
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: ¡Descansa! (informal)
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आराम {item}!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: El imperativo informal termina en -ो, el sonido que se usa con तुम.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit16.lesson02.translate.010
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: Necesitas descansar. (informal)
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: तुम्हें cumple el papel de मुझे para la persona a quien tratas de तुम.
    language_code: es
    direction: ltr
