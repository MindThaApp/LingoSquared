templates:
- content_key: practice.es-hi.hi.a1.unit01.lesson01.choose.001
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'El hindi tiene dos palabras para «tú/usted»: आप es formal y respetuosa, mientras que तुम es informal y se usa con amigos y con personas de tu edad o más jóvenes.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson01.fill.002
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'El verbo «ser/estar» cambia según el sujeto: हूँ va con मैं, हो con तुम y हैं con आप.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson01.order.003
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: word_order
  frame:
    text: आप {item} हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'La palabra interrogativa concuerda con la persona a quien se pregunta: कैसे para un hombre y कैसी para una mujer, mientras que आप siempre lleva हैं.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson01.translate.004
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: ¿Cómo estás? (informal, a un hombre)
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Con तुम el verbo es हो; si preguntas a una mujer, कैसे pasa a कैसी: तुम कैसी हो?'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson01.translate.005
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: ¿Cómo está usted? (formal, a una mujer)
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: El आप formal lleva हैं, de aspecto plural, aunque sea una sola persona, y कैसी es la forma femenina de «cómo».
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson02.listen.001
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अलविदा es una despedida; en el habla cotidiana नमस्ते sirve tanto para saludar como para despedirse.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson02.order.002
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: word_order
  frame:
    text: आपका {item} अच्छा रहे।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} अच्छा रहे।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रहे convierte la frase en un deseo (que siga bien), y आपका indica que se dice con el आप formal; con तुम sería तुम्हारा.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson02.match.003
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'El hindi no tiene palabras para «un» o «el»: नाम puede significar nombre, un nombre o el nombre según la frase.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson03.choose.001
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Las preguntas en hindi mantienen el orden de la afirmación: la palabra interrogativa कहाँ ocupa el lugar de la respuesta (आप कहाँ से हैं? y मैं भारत से हूँ).'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson03.order.002
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मेरा नाम {name} है।
    language_code: hi
    direction: ltr
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: El hindi pone el verbo al final, así que मेरा नाम ... है es literalmente «Mi nombre ... es».
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson03.order.003
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मैं {place} से हूँ।
    language_code: hi
    direction: ltr
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से va después del lugar y significa «de, desde»; es una posposición, no una preposición.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson03.fill.004
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: fill_in_blank
  frame:
    text: आपसे मिलकर {item} हुई। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Es el «Encantado/a de conocerte» formal, literalmente «la alegría ocurrió al conocerte»; la versión informal es तुमसे मिलकर अच्छा लगा.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson03.translate.005
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Me llamo {name}.
    language_code: es
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नाम es un sustantivo masculino, así que todos, hombres y mujeres, dicen मेरा नाम.
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson03.translate.006
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Soy de {place}.
    language_code: es
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Una mujer también dice मैं भारत से हूँ: el verbo हूँ no cambia según el género de quien habla.'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson03.translate.007
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: ¿De dónde eres? (informal)
    language_code: es
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} से हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Para hacer la misma pregunta de forma formal, usa आप con हैं: आप कहाँ से हैं?'
    language_code: es
    direction: ltr
- content_key: practice.es-hi.hi.a1.unit01.lesson03.translate.008
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Los sustantivos hindis son masculinos o femeninos: दिन, नाम y योग son masculinos; खुशी es femenino.'
    language_code: es
    direction: ltr
