templates:
- content_key: practice.zh-pl.pl.a1.unit10.lesson01.choose.001
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 这里的每个动词都有原形（wstawać、jeść、pić）和“我”的形式（wstaję、jem、piję）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson01.listen.002
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: “我”的形式通常以 -ę 或 -m 结尾，如 wstaję、piję 和 jem。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson01.match.003
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 动词不定式和“我”的形式是不同的词，所以两个都要学：jeść 和 jem。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson01.order.004
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: word_order
  frame:
    text: Rano {item} o siódmej.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Rano {item} o siódmej.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rano 放在最前面说明什么时候，o siódmej 给出具体时间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson01.fill.005
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: fill_in_blank
  frame:
    text: Rano {item} śniadanie. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Jem 是 jeść 的不规则“我”的形式，值得背下来。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson01.translate.006
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: translation
  frame:
    text: 我吃早饭。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jem {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Śniadanie 是中性名词，所以它的宾格形式和原形相同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson01.translate.007
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Piję 和 wstaję 都以 -ę 结尾，这是这类动词典型的“我”的词尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson02.choose.001
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pracować 意思是“工作”，wracać 意思是“返回”；它们“我”的形式是 pracuję 和 wracam。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson02.listen.002
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Obiad 是一天中的主餐，在中午前后吃，所以可以是午饭，也可以是正餐。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson02.match.003
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Wracam 和 pracuję 是读音相近的不同动词，要注意辨别元音。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson02.order.004
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: word_order
  frame:
    text: Wracam do {item} wieczorem.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Wracam do {item} wieczorem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: do 后面的名词要用属格，dom 变成 domu，就像 bank 变成 banku 一样。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson02.fill.005
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: fill_in_blank
  frame:
    text: Po południu {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Po południu 说明时间，动词仍然用“我”的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson02.translate.006
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: translation
  frame:
    text: 我晚上回家。
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Wracam do {item} wieczorem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 属格词尾 -u 在 domu 中再次出现，就像 banku 和 parku 一样。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson02.translate.007
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dom 的意思是“家”或“房子”，要看上下文。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson03.choose.001
  lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Też 的意思是“也”，通常放在它所指的词后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson03.order.002
  lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
  type: word_order
  frame:
    text: Śpię {item}, o dziesiątej wieczorem.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Śpię {item}, o dziesiątej wieczorem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Wcześnie 的意思是“早”，是副词，所以永远不变形。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson03.fill.003
  lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
  type: fill_in_blank
  frame:
    text: Ja {item} jem śniadanie rano. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ja też 的意思是“我也”；też 通常紧跟在它所指的代词后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit10.lesson03.translate.004
  lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Śpię 是 spać 的“我”的形式，元音和不定式不同。
    language_code: zh
    direction: ltr
