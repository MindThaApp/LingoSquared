    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Niebieska 和 czerwona 是阴性形式，分别与 koszula 和 sukienka 一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit20.lesson02.listen.002
  lesson_content_key: pl.a1.unit20.lesson02.jaki_kolor
  type: listen_select
