    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 颜色形容词要与名词一致：搭配阴性名词时，以 -a 结尾。
    language_code: zh
    direction: ltr
