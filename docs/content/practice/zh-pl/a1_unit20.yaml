      direction: ltr
  feedback_frame:
    text: Niebieska 是阴性形式，与 koszula 一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit20.lesson02.fill.004
  lesson_content_key: pl.a1.unit20.lesson02.jaki_kolor
  type: fill_in_blank
