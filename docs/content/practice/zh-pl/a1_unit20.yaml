    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Jaki 是阳性形式，与 kolor 一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit20.lesson03.choose.001
  lesson_content_key: pl.a1.unit20.lesson03.kupujemy_ubrania
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chce 是 chcieć 的第三人称单数形式，也用于礼貌的“您”；Co pan chce? 是礼貌的问法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit20.lesson03.listen.002
  lesson_content_key: pl.a1.unit20.lesson03.kupujemy_ubrania
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rozmiar 的意思是“尺码”，是阳性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit20.lesson03.order.003
  lesson_content_key: pl.a1.unit20.lesson03.kupujemy_ubrania
  type: word_order
  frame:
    text: Co pan {item} kupić?
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Co pan {item} kupić?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Pan 搭配“他”的形式 chce，而不是 chcesz。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit20.lesson03.translate.004
  lesson_content_key: pl.a1.unit20.lesson03.kupujemy_ubrania
  type: translation
  frame:
    text: 您想买什么？（对男士，礼貌称呼 pan）
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Co pan {item} kupić?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Pan 搭配 chce，与“他”用的形式相同。
    language_code: zh
    direction: ltr
