    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit20.lesson01.fill.005
  lesson_content_key: pl.a1.unit20.lesson01.w_sklepie
  type: fill_in_blank
  frame:
    text: Chcę kupić {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 kupić 后面，以 -a 结尾的阴性名词要变成以 -ę 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit20.lesson01.translate.006
  lesson_content_key: pl.a1.unit20.lesson01.w_sklepie
  type: translation
  frame:
    text: 这是裤子。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: To są {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Spodnie 是复数，所以动词用 są。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit20.lesson01.translate.007
  lesson_content_key: pl.a1.unit20.lesson01.w_sklepie
  type: translation
  frame:
    text: 我想买一件衬衫。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Chcę kupić {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 所买的东西要用宾语形式 koszulę。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit20.lesson02.choose.001
  lesson_content_key: pl.a1.unit20.lesson02.jaki_kolor
