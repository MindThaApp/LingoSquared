    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Koszula、sukienka 和 spodnie 都是衣物；koszula 和 sukienka 是阴性单数，spodnie 是复数。
    language_code: zh
    direction: ltr
