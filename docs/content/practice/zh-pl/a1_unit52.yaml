schema_version: '1.0'
pack_key: practice.zh-pl.a1.unit52
source_language: zh
target_language: pl
unit_content_key: pl.a1.unit52.silownia
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_bieżni
    - w_bieżnia
    - w_chciałybyśmy
    - w_ciężary
    - w_ciężarów
    - w_dzienny
    - w_grafik
    - w_instruktor
    - w_instruktorem
    - w_karnet
    - w_plaża
    - w_podnoszę
    - w_siłowni
    - w_siłownię
    - w_zaczynają
    - w_zajęcia
    - w_zmęczona
templates:
- content_key: practice.zh-pl.pl.a1.unit52.lesson01.choose.001
  lesson_content_key: pl.a1.unit52.lesson01.chodzmy_na_silownie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_siłownię
        - w_karnet
        - w_bieżnia
        - w_bieżni
        - w_ciężary
        - w_podnoszę
        - w_ciężarów
        - w_zajęcia
        - w_zaczynają
        - w_instruktor
        - w_instruktorem
        - w_grafik
        - w_dzienny
        - w_chciałybyśmy
        - w_plaża
        - w_siłowni
        - w_zmęczona
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“我们去健身房好吗?”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit52.lesson02.listen.001
