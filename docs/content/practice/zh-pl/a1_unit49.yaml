- content_key: practice.zh-pl.pl.a1.unit49.lesson04.match.001
  lesson_content_key: pl.a1.unit49.lesson04.w_muzeum
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
