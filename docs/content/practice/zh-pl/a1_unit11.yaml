templates:
- content_key: practice.zh-pl.pl.a1.unit11.lesson01.choose.001
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chcę 是 chcieć 的“我”形式,chcesz 是 ty(你)形式,用于朋友和家人。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson01.listen.002
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 词尾 -sz 表示非正式的“你”:chcesz、możesz、masz(jesteś 是例外,词尾为 -ś)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson01.match.003
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Chcieć 和 móc 的变位规律相同:“我”用 -ę,“你”用 -sz。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson01.order.004
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: word_order
  frame:
    text: Dziś {item} iść do kina.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziś {item} iść do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 在 chcę 或 mogę 之后,第二个动词用原形。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson01.fill.005
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: fill_in_blank
  frame:
    text: Czy {item} iść razem do kina? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 问朋友时用 ty(你)形式 chcesz,并以 czy 开头构成问句。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson01.translate.006
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: translation
  frame:
    text: 今天我想去看电影。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziś {item} iść do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Chcę 后面接动词原形,所以 iść 保持词典中的原形。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson01.translate.007
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Móc 意为“能”或“可以”,用法和 chcieć 相同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson02.choose.001
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chętnie 和 niestety 是副词,所以形式永远不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson02.listen.002
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sobotę 是用在 w 之后的形式:阴性的星期名称词尾 -a 变为 -ę,所以 sobota 变成 sobotę。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson02.match.003
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Przyjść 意为“来”,接在 mogę 或 możesz 之后时用原形。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson02.order.004
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: word_order
  frame:
    text: Czy możesz {item} w piątek?
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy możesz {item} w piątek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Czy możesz 加动词原形,可以礼貌地问朋友能不能做某事。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson02.order.005
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: word_order
  frame:
    text: Czy możesz przyjść w {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy możesz przyjść w {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 阳性的星期名称如 piątek 在 w 之后不变,但阴性的如 sobota 会变成 sobotę。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson02.fill.006
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: fill_in_blank
  frame:
    text: Niestety, nie {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nie mogę 是礼貌地表示你去不了的说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson02.fill.007
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: fill_in_blank
  frame:
    text: Tak, bardzo {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bardzo chętnie 是热情地接受邀请的说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson02.translate.008
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: translation
  frame:
    text: 很遗憾,我不行。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Niestety, nie {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Nie 放在动词前面,表示否定。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit11.lesson02.translate.009
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Przyjść 是“来”的原形,这里用在 mogę 之后。
    language_code: zh
    direction: ltr
