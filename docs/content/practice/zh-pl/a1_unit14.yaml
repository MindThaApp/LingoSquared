    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gorsza 是阴性形式,与 herbata 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson02.fill.007
  lesson_content_key: pl.a1.unit14.lesson02.lepszy_i_gorszy
  type: fill_in_blank
  frame:
    text: On jest {item} niż ja. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 niż 之后,代词保持基本形式:niż ja;而用 od 的说法要用另一种形式:ode mnie。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson02.translate.008
  lesson_content_key: pl.a1.unit14.lesson02.lepszy_i_gorszy
  type: translation
  frame:
    text: 咖啡比茶好。(使用 niż)
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Kawa jest {item} niż herbata.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Kawa 是阴性,所以用 lepsza,而不是 lepszy。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson02.translate.009
  lesson_content_key: pl.a1.unit14.lesson02.lepszy_i_gorszy
  type: translation
  frame:
    text: 他比我差。(使用 niż;要包含代词)
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: On jest {item} niż ja.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: On 是阳性,所以比较级用 gorszy。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson02.translate.010
  lesson_content_key: pl.a1.unit14.lesson02.lepszy_i_gorszy
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lepszy 和 gorszy 是反义词;它们的阴性形式是 lepsza 和 gorsza。
    language_code: zh
    direction: ltr
