    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Niż 连接被比较的两个事物,相当于汉语的“比”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson01.fill.006
  lesson_content_key: pl.a1.unit14.lesson01.starszy_i_mlodszy
  type: fill_in_blank
  frame:
    text: Ewa jest {item} niż Marek. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 形容词要与所描述的人一致:Ewa 是女性,所以用 starsza。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson01.translate.007
  lesson_content_key: pl.a1.unit14.lesson01.starszy_i_mlodszy
  type: translation
  frame:
    text: 爷爷比爸爸年纪大。(使用 niż)
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziadek jest {item} niż ojciec.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 阳性名词 dziadek 搭配阳性比较级 starszy。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson01.translate.008
  lesson_content_key: pl.a1.unit14.lesson01.starszy_i_mlodszy
  type: translation
  frame:
    text: 奶奶比妈妈年纪大。(使用 niż)
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Babcia jest {item} niż matka.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 阴性名词 babcia 搭配阴性比较级 starsza。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson02.choose.001
