  frame:
    text: Kawa jest {item} niż herbata.
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Kawa jest {item} niż herbata.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Kawa 是阴性,所以比较级用 lepsza。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson02.order.005
  lesson_content_key: pl.a1.unit14.lesson02.lepszy_i_gorszy
  type: word_order
  frame:
    text: To jest {item} dzień.
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest {item} dzień.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 这里 zły 用阳性,因为 dzień 是阳性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson02.fill.006
  lesson_content_key: pl.a1.unit14.lesson02.lepszy_i_gorszy
