    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziadek jest {item} niż ojciec.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dziadek 是阳性,所以形容词用 starszy,而不是 starsza。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson01.fill.005
  lesson_content_key: pl.a1.unit14.lesson01.starszy_i_mlodszy
  type: fill_in_blank
