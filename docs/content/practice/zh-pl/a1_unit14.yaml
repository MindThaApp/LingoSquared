    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 像 starszy 和 młodszy 这样的比较级，是把词尾 -y 改成 -szy 构成的。
    language_code: zh
    direction: ltr
