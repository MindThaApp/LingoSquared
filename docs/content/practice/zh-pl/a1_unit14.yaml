- content_key: practice.zh-pl.pl.a1.unit14.lesson01.choose.001
  lesson_content_key: pl.a1.unit14.lesson01.starszy_i_mlodszy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Starszy 和 młodszy 是阳性形式；starsza 和 młodsza 是同一比较级的阴性形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson01.listen.002
  lesson_content_key: pl.a1.unit14.lesson01.starszy_i_mlodszy
