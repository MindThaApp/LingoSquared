  feedback_frame:
    text: 每个比较级都有阳性和阴性两种形式，就像 byłem 和 byłam 一样。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit14.lesson01.order.004
  lesson_content_key: pl.a1.unit14.lesson01.starszy_i_mlodszy
  type: word_order
