    frame:
      text: O której {item} się basen?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 游泳池几点开门？otwiera 的意思是开门、打开。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit46.lesson05.order.002
  lesson_content_key: pl.a1.unit46.lesson05.czytanie_godzin_otwarcia
  type: word_order
  frame:
    text: Biorę {item} przed pływaniem.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_prysznic
  answer_derivation:
    kind: render_frame
    frame:
      text: Biorę {item} przed pływaniem.
      language_code: pl
      direction: ltr
  feedback_frame:
