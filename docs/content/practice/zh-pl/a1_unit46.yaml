  lesson_content_key: pl.a1.unit46.lesson03.o_ktorej_otwiera_sie
  type: translation
  frame:
    text: 游泳池几点开门？
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_otwiera
  answer_derivation:
