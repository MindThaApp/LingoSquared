schema_version: '1.0'
pack_key: practice.zh-pl.a1.unit46
source_language: zh
target_language: pl
unit_content_key: pl.a1.unit46.basen
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_basen
    - w_basenowa
    - w_dziewiątej
    - w_godziny
    - w_otwarcia
    - w_otwarty
    - w_otwiera
    - w_prysznic
    - w_przyszłą
    - w_pływaniem
    - w_szafkę
    - w_szóstej
    - w_torba
    - w_wynająć
    - w_zamyka
    - w_zasada
    - w_złotych
templates:
- content_key: practice.zh-pl.pl.a1.unit46.lesson01.choose.001
  lesson_content_key: pl.a1.unit46.lesson01.chce_isc_na_basen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_basen
        - w_złotych
        - w_otwarty
        - w_dziewiątej
        - w_godziny
        - w_otwarcia
        - w_otwiera
        - w_wynająć
        - w_szafkę
        - w_zamyka
        - w_szóstej
        - w_zasada
        - w_prysznic
        - w_pływaniem
        - w_torba
        - w_basenowa
        - w_przyszłą
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“我想去游泳池”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit46.lesson02.listen.001
  lesson_content_key: pl.a1.unit46.lesson02.ile_kosztuje_bilet
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“一张票多少钱？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit46.lesson03.translate.001
  lesson_content_key: pl.a1.unit46.lesson03.o_ktorej_otwiera_sie
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“游泳池几点开门？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit46.lesson04.match.001
  lesson_content_key: pl.a1.unit46.lesson04.na_basenie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个波兰语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit46.lesson05.choose.001
  lesson_content_key: pl.a1.unit46.lesson05.czytanie_godzin_otwarcia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“阅读营业时间”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit46.lesson06.translate.001
  lesson_content_key: pl.a1.unit46.lesson06.marek_na_basenie
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自“马雷克在游泳池”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit46.lesson01.order.002
  lesson_content_key: pl.a1.unit46.lesson01.chce_isc_na_basen
  type: word_order
  frame:
    text: Idę na {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_basen
  answer_derivation:
    kind: render_frame
    frame:
      text: Idę na {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 我去游泳池。basen 的意思是游泳池。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit46.lesson02.order.002
  lesson_content_key: pl.a1.unit46.lesson02.ile_kosztuje_bilet
  type: word_order
  frame:
    text: Bilet kosztuje dwadzieścia {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_złotych
  answer_derivation:
    kind: render_frame
    frame:
      text: Bilet kosztuje dwadzieścia {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 一张票二十兹罗提。złotych 的意思是兹罗提（五以上所用的形式）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit46.lesson03.order.002
  lesson_content_key: pl.a1.unit46.lesson03.o_ktorej_otwiera_sie
  type: word_order
  frame:
    text: Basen jest {item} od dziewiątej.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_otwarty
  answer_derivation:
    kind: render_frame
    frame:
      text: Basen jest {item} od dziewiątej.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 游泳池九点开放。otwarty 的意思是开放的（阳性）。
    language_code: zh
    direction: ltr
