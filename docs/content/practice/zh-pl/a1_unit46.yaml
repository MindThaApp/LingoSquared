  frame:
    text: Czytam {item} otwarcia. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_godziny
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_godziny
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我在看营业时间。godziny 的意思是小时、时间。
    language_code: zh
    direction: ltr
