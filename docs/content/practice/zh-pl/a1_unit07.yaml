templates:
- content_key: practice.zh-pl.pl.a1.unit07.lesson01.choose.001
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 与动词 kosztować 搭配时，波兰语用副词：kosztuje tanio（很便宜）和 kosztuje drogo（很贵）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson01.listen.002
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cebula 以 -a 结尾，是阴性名词；banan、pomidor、ogórek 和 ziemniak 是阳性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson01.order.003
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: word_order
  frame:
    text: Ile kosztuje {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile kosztuje 问的是一件东西的价格，所以名词保持基本的单数形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson01.fill.004
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: fill_in_blank
  frame:
    text: Banany {item} tanio. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 动词要与数量一致：一件东西用 kosztuje，多于一件用 kosztują。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson01.translate.005
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: 香蕉很便宜。（请使用表示“价钱为”的动词）
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Banan kosztuje {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 波兰语不用单独的形容词，而是用副词来说香蕉“便宜地”值钱。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson01.translate.006
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kosztować 是词典形式；在句子中要变成 kosztuje 或 kosztują。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson02.choose.001
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pół 的意思是“一半”，放在 kilo 之前：pół kilo 就是半公斤。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson02.listen.002
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poproszę 是点餐或买东西时使用的礼貌请求用语。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson02.match.003
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 在 kilo 和 pół kilo 之后，名词要用以 -ów 结尾的复数形式：banan 变成 bananów，pomidor 变成 pomidorów。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson02.order.004
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: word_order
  frame:
    text: Poproszę kilo {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Poproszę kilo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 在 kilo 这类表示数量的词之后，名词要用复数第二格，这些词的复数第二格以 -ów 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson02.fill.005
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: fill_in_blank
  frame:
    text: Poproszę pół {item} bananów. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pół kilo 的意思是半公斤；这里 kilo 本身不变化。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson02.translate.006
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: translation
  frame:
    text: 我想要一公斤西红柿。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Poproszę kilo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Pomidor 在 kilo 之后变成 pomidorów，因为这个名词跟在表示数量的词后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson02.translate.007
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mandarynka 和 pomarańcza 是阴性名词，而 grejpfrut 是阳性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson03.choose.001
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Świeże 是“新鲜”的复数形式，所以可以搭配 pomidory 和 banany。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson03.match.002
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Pomidory 是 pomidor 的复数，所以形容词是 świeże。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson03.fill.003
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: fill_in_blank
  frame:
    text: Pomidory są {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 像 pomidory 这样的复数名词需要复数形容词，所以“新鲜”要写成 świeże。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson03.fill.004
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: fill_in_blank
  frame:
    text: To {item} pani. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dla 的意思是“为了、给”，后面接得到东西的人，这里是 pani。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit07.lesson03.translate.005
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Razem 用于把价格加起来的时候，比如在市场上算总价。
    language_code: zh
    direction: ltr
