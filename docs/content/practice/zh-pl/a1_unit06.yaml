templates:
- content_key: practice.zh-pl.pl.a1.unit06.lesson01.choose.001
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 波兰语的每个名词都有性：chleb 和 ser 是阳性，kawa、herbata 和 woda 是阴性，masło 和 mleko 是中性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson01.listen.002
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 波兰语没有相当于“一个”或“这个”的冠词，所以 chleb 既可以指“面包”，也可以指“那个面包”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson01.order.003
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: word_order
  frame:
    text: Proszę o {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę o {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 在 proszę o 之后，以 -a 结尾的阴性名词变为 -ę（kawa，kawę），而 chleb、mleko 这类阳性和中性名词保持不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson01.fill.004
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: fill_in_blank
  frame:
    text: Proszę o {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Proszę o 加上宾格形式，是礼貌地请求某物的说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson01.translate.005
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: translation
  frame:
    text: 请给我水。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę o {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: proszę o 之后的名词要用宾格形式：woda 变成 wodę。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson01.translate.006
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Masło 和 mleko 以 -o 结尾，是典型的中性词尾；而 chleb 和 ser 以辅音结尾，是阳性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson02.choose.001
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lubić 是词典形式；说自己时用 lubię，说别人时用 lubi。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson02.match.002
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 动词词尾体现人称：“我”用 -ę（lubię），“他”或“她”用 -i（lubi）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson02.order.003
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: word_order
  frame:
    text: Lubię {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 在 lubię 之后，喜欢的东西要用宾格形式：zupa 变成 zupę，而 sok、chleb 和 ser 保持不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson02.fill.004
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: fill_in_blank
  frame:
