    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lubi 是“他”或“她”的形式，所以可以和代词 on 搭配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson02.translate.005
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: translation
  frame:
    text: 我喜欢汤。
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 以 -a 结尾的阴性名词作宾语时变为 -ę，所以 zupa 变成 zupę。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson02.translate.006
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: lubię 和 lubi 这一对体现了规律：每个人称有不同的词尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson03.listen.001
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Polecać 和 lubić 类似：polecam 是“我推荐”，poleca 是“他、她推荐”，与 pan 或 pani 连用时是“您推荐”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson03.match.002
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Co pan poleca? 用的是“他”或“她”的形式 poleca，因为 pan 和 pani 要搭配第三人称动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson03.order.003
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: word_order
  frame:
    text: Polecam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Polecam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Polecam 之后的名词也和 lubię 一样要用宾格形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson03.fill.004
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: fill_in_blank
  frame:
    text: Już {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 服务员用“我”的形式 podaję 说话，因为上菜的人是他自己。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson03.translate.005
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: translation
  frame:
    text: 您推荐什么？（对男士，正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Co pan {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 与 pan 或 pani 连用时，动词是 poleca，和“他”或“她”的形式相同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit06.lesson03.translate.006
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Już 可以表示“已经”，也可以像 Już podaję 里那样表示“马上”。
    language_code: zh
    direction: ltr
