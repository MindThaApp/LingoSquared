schema_version: '1.0'
pack_key: practice.zh-pl.a1.unit32
source_language: zh
target_language: pl
unit_content_key: pl.a1.unit32.obowiazki
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aspektowa
    - w_bałagan
    - w_bałaganu
    - w_czynność
    - w_domem
    - w_efekt
    - w_gotowy
    - w_kuchnię
    - w_naczynia
    - w_napijemy
    - w_odkurza
    - w_odkurzam
    - w_odkurzać
    - w_para
    - w_pomagać
    - w_pomogę
    - w_posprzątam
    - w_pozmywam
    - w_pracują
    - w_pranie
    - w_robi
    - w_salon
    - w_skończony
    - w_sprząta
    - w_sprzątam
    - w_sprzątamy
    - w_sprzątać
    - w_wczorajszej
    - w_zajmuje
    - w_zająć
    - w_zmywaniem
    - w_zmywać
    - w_zmęczony
    - w_zrobić
templates:
- content_key: practice.zh-pl.pl.a1.unit32.lesson01.choose.001
  lesson_content_key: pl.a1.unit32.lesson01.sprzatanie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_sprzątać
        - w_sprzątam
        - w_para
        - w_aspektowa
        - w_czynność
        - w_posprzątam
        - w_skończony
        - w_efekt
        - w_sprząta
        - w_salon
        - w_bałagan
        - w_bałaganu
        - w_odkurzać
        - w_odkurzam
        - w_sprzątamy
        - w_odkurza
        - w_pomagać
        - w_zmywaniem
        - w_pomogę
        - w_naczynia
        - w_zmywać
        - w_zmęczony
        - w_wczorajszej
        - w_zająć
        - w_domem
        - w_zrobić
        - w_pozmywam
        - w_zajmuje
        - w_kuchnię
        - w_robi
        - w_pranie
        - w_pracują
        - w_gotowy
        - w_napijemy
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“整理收拾”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit32.lesson02.listen.001
  lesson_content_key: pl.a1.unit32.lesson02.balagan_i_odkurzanie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“凌乱与吸尘”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit32.lesson03.translate.001
  lesson_content_key: pl.a1.unit32.lesson03.mozesz_pomoc
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“你能帮忙吗?”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit32.lesson04.match.001
  lesson_content_key: pl.a1.unit32.lesson04.ewa_pomaga_markowi_w
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个波兰语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit32.lesson05.choose.001
  lesson_content_key: pl.a1.unit32.lesson05.kto_co_robi_w
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“谁在做哪些家务?”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit32.lesson06.translate.001
  lesson_content_key: pl.a1.unit32.lesson06.mieszkanie_jest_gotowe
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“公寓收拾好了”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit32.lesson01.order.002
  lesson_content_key: pl.a1.unit32.lesson01.sprzatanie
  type: word_order
  frame:
    text: Kto {item} mieszkanie?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_sprząta
  answer_derivation:
    kind: render_frame
    frame:
      text: Kto {item} mieszkanie?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 谁在打扫公寓?sprząta 的意思是“他/她打扫”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit32.lesson02.order.002
  lesson_content_key: pl.a1.unit32.lesson02.balagan_i_odkurzanie
  type: word_order
  frame:
    text: Po imprezie jest dużo {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_bałaganu
  answer_derivation:
    kind: render_frame
    frame:
      text: Po imprezie jest dużo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 聚会之后很乱。bałaganu 的意思是“杂乱的”(表示“……的乱”)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit32.lesson03.order.002
  lesson_content_key: pl.a1.unit32.lesson03.mozesz_pomoc
  type: word_order
  frame:
    text: Możesz mi pomóc ze {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmywaniem
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz mi pomóc ze {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 你能帮我洗碗吗?zmywaniem 的意思是“用洗碗这件事”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit32.lesson03.fill.003
  lesson_content_key: pl.a1.unit32.lesson03.mozesz_pomoc
  type: fill_in_blank
  frame:
    text: Tak, chętnie ci {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_pomogę
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_pomogę
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 好的,我很乐意帮你。pomogę 的意思是“我会帮忙”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit32.lesson05.order.002
  lesson_content_key: pl.a1.unit32.lesson05.kto_co_robi_w
  type: word_order
  frame:
    text: Marek sprząta {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_kuchnię
  answer_derivation:
    kind: render_frame
    frame:
      text: Marek sprząta {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Marek 在收拾厨房。kuchnię 的意思是“厨房”(作宾语)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit32.lesson05.fill.003
  lesson_content_key: pl.a1.unit32.lesson05.kto_co_robi_w
  type: fill_in_blank
  frame:
    text: Ewa i Marek dobrze razem {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_pracują
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_pracują
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ewa 和 Marek 合作得很好。pracują 的意思是“他们工作”。
    language_code: zh
    direction: ltr
