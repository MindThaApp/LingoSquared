    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自关于信和包裹的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit34.lesson01.order.003
  lesson_content_key: pl.a1.unit34.lesson01.list_i_paczka
  type: word_order
  frame:
    text: Mam {item} dla dziadka.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_list
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} dla dziadka.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 我有一封给爷爷的信。list 的意思是信。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit34.lesson01.fill.004
  lesson_content_key: pl.a1.unit34.lesson01.list_i_paczka
  type: fill_in_blank
  frame:
    text: Wysyłam list i paczkę do {item} i babci w Gdańsku. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_dziadka
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_dziadka
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我给格但斯克的爷爷和奶奶寄一封信和一个包裹。dziadka 的意思是爷爷(用在“给”之后)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit34.lesson01.translate.005
  lesson_content_key: pl.a1.unit34.lesson01.list_i_paczka
  type: translation
  frame:
    text: Ewa 把包裹寄给爷爷奶奶。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_babci
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa wysyła paczkę do dziadka i {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 埃娃给爷爷和奶奶寄一个包裹。babci 的意思是奶奶(用在“给”之后)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit34.lesson02.order.002
  lesson_content_key: pl.a1.unit34.lesson02.znaczek_adres_i_pisanie
  type: word_order
  frame:
