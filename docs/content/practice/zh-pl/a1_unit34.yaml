  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_znaczek
  answer_derivation:
    kind: render_frame
    frame:
      text: Kupuję {item} do listu.
      language_code: pl
      direction: ltr
  feedback_frame:
