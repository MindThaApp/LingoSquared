- content_key: practice.zh-pl.pl.a1.unit55.lesson01.order.002
  lesson_content_key: pl.a1.unit55.lesson01.pojdziemy_dzis_wieczorem_na
  type: word_order
  frame:
    text: Rejs był fajny, a teraz idę na {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_mecz
  answer_derivation:
