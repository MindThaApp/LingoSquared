    frame:
      text: Rejs był fajny, a teraz idę na {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 游船之旅很愉快,现在我要去看比赛了。mecz 的意思是比赛。
    language_code: zh
    direction: ltr
