schema_version: '1.0'
pack_key: practice.zh-pl.a1.unit62
source_language: zh
target_language: pl
unit_content_key: pl.a1.unit62.ksiegarnia
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_autor
    - w_interesująca
    - w_książeczka
    - w_książeczki
    - w_książka
    - w_książki
    - w_księgarnia
    - w_popularna
    - w_powieści
    - w_powieść
    - w_sklepu
    - w_szukam
    - w_tytuł
    - w_tytułem
    - w_zakładka
    - w_zakładką
    - w_znany
    - w_zoologicznego
templates:
- content_key: practice.zh-pl.pl.a1.unit62.lesson01.choose.001
  lesson_content_key: pl.a1.unit62.lesson01.pojdziemy_do_ksiegarni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_księgarnia
        - w_książka
        - w_powieść
        - w_szukam
        - w_powieści
        - w_tytuł
        - w_tytułem
        - w_autor
        - w_znany
        - w_książeczka
        - w_książki
        - w_popularna
        - w_książeczki
        - w_zakładka
        - w_zakładką
        - w_interesująca
        - w_sklepu
        - w_zoologicznego
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语，出自“我们去书店好吗？”这一课。'
    language_code: zh
    direction: ltr
