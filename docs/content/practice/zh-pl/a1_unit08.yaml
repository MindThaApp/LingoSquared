    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poczta、apteka 和 restauracja 以 -a 结尾，是阴性名词；bank、hotel 和 park 是阳性名词。
    language_code: zh
    direction: ltr
