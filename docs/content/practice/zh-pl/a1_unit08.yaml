templates:
- content_key: practice.zh-pl.pl.a1.unit08.lesson01.choose.001
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 波兰语没有冠词，表示地点的名词前不加任何限定词，所以 bank 既可以指“一家银行”，也可以指“那家银行”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit08.lesson01.listen.002
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
