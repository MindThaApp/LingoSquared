      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Naprzeciwko 后面要用属格，所以 hotel 变成 hotelu。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit08.lesson02.translate.006
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: translation
  frame:
    text: 药店在银行旁边。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Apteka jest obok {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 在 obok 之后，地点名词要加属格词尾，所以 bank 变成 banku。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit08.lesson02.translate.007
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Niedaleko 是 nie 加 daleko，字面意思是“不远”，所以表示相当近。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit08.lesson03.choose.001
  lesson_content_key: pl.a1.unit08.lesson03.gdzie_jest_apteka
