  answer_derivation:
    kind: render_frame
    frame:
      text: Gdzie jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gdzie jest 用来询问某物在哪里，地点保持基本形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit08.lesson01.fill.005
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: fill_in_blank
  frame:
