    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: To jest 用来介绍一样东西，后面的名词保持基本形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit08.lesson01.translate.006
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: translation
  frame:
    text: 药店在哪里？
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gdzie jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gdzie jest 加上地点，是寻找某个地方时通用的问法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit08.lesson01.translate.007
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Poczta 是表示邮局的日常简短说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit08.lesson02.choose.001
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Obok 和 naprzeciwko 后面要用属格，所以 bank 变成 banku。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit08.lesson02.listen.002
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 像 bank、hotel 和 park 这样的阳性名词，在 obok、naprzeciwko 和 blisko 之后要加 -u。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit08.lesson02.order.003
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: word_order
  frame:
    text: Apteka jest obok {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Apteka jest obok {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 这些阳性名词的属格词尾是 -u，例如 banku、hotelu 和 parku。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit08.lesson02.order.004
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: word_order
  frame:
    text: Park jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Park jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Blisko、daleko 和 niedaleko 是副词，所以无论搭配哪个名词，它们的形式都不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit08.lesson02.fill.005
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
