schema_version: '1.0'
pack_key: practice.zh-pl.a1.unit57
source_language: zh
target_language: pl
unit_content_key: pl.a1.unit57.teatr
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aktorzy
    - w_byli
    - w_dobrzy
    - w_dwudziesta
    - w_gwiazda
    - w_kurtyna
    - w_miejsca
    - w_otwarta
    - w_podróż
    - w_popularne
    - w_przedstawienie
    - w_przerwą
    - w_scenę
    - w_sztuka
    - w_teatr
    - w_zadowolony
    - w_świetni
templates:
- content_key: practice.zh-pl.pl.a1.unit57.lesson01.choose.001
  lesson_content_key: pl.a1.unit57.lesson01.pojdziemy_dzis_do_teatru
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_teatr
        - w_przedstawienie
        - w_popularne
        - w_kurtyna
        - w_scenę
        - w_aktorzy
        - w_dobrzy
        - w_otwarta
        - w_gwiazda
        - w_sztuka
        - w_podróż
        - w_dwudziesta
        - w_przerwą
        - w_miejsca
        - w_zadowolony
        - w_byli
        - w_świetni
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“我们今天去剧院好吗？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit57.lesson02.listen.001
  lesson_content_key: pl.a1.unit57.lesson02.scena_i_kurtyna
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“舞台和幕布”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit57.lesson03.translate.001
  lesson_content_key: pl.a1.unit57.lesson03.aktorzy_i_kasa
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“演员和售票处”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit57.lesson04.match.001
  lesson_content_key: pl.a1.unit57.lesson04.program_przedstawienia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个波兰语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit57.lesson05.choose.001
  lesson_content_key: pl.a1.unit57.lesson05.przy_kasie_w_teatrze
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“在剧院售票处”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit57.lesson06.translate.001
  lesson_content_key: pl.a1.unit57.lesson06.nina_dowiaduje_sie_o
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自“Nina 听说了剧院的事”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit57.lesson01.order.002
  lesson_content_key: pl.a1.unit57.lesson01.pojdziemy_dzis_do_teatru
  type: word_order
  frame:
    text: O której zaczyna się {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_przedstawienie
  answer_derivation:
    kind: render_frame
    frame:
      text: O której zaczyna się {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 演出几点开始？przedstawienie 的意思是“演出”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit57.lesson01.fill.003
  lesson_content_key: pl.a1.unit57.lesson01.pojdziemy_dzis_do_teatru
  type: fill_in_blank
  frame:
    text: Przedstawienie jest {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_popularne
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_popularne
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这场演出很受欢迎。popularne 的意思是“受欢迎的”（中性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit57.lesson02.order.002
  lesson_content_key: pl.a1.unit57.lesson02.scena_i_kurtyna
  type: word_order
  frame:
    text: Widzę {item} i kurtynę.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_scenę
  answer_derivation:
    kind: render_frame
    frame:
      text: Widzę {item} i kurtynę.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 我看到舞台和幕布。scenę 的意思是“舞台”（作动词的宾语）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit57.lesson03.order.002
  lesson_content_key: pl.a1.unit57.lesson03.aktorzy_i_kasa
  type: word_order
  frame:
    text: Aktorzy są {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_dobrzy
  answer_derivation:
    kind: render_frame
    frame:
      text: Aktorzy są {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 演员们很优秀。dobrzy 的意思是“好的”（阳性复数，指人）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit57.lesson03.fill.003
  lesson_content_key: pl.a1.unit57.lesson03.aktorzy_i_kasa
  type: fill_in_blank
  frame:
    text: Kasa jest {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_otwarta
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_otwarta
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 售票处开着。otwarta 的意思是“开着的”（阴性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit57.lesson05.order.002
  lesson_content_key: pl.a1.unit57.lesson05.przy_kasie_w_teatrze
  type: word_order
  frame:
    text: Czy mamy dobre {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_miejsca
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy mamy dobre {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa：我们有好位子吗？miejsca 的意思是“座位”。
    language_code: zh
    direction: ltr
