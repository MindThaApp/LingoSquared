  lesson_content_key: pl.a1.unit28.lesson01.pociag_rower_samochod_i
  type: word_order
  frame:
    text: Ewa {item} pociągiem.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_podróżuje
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa {item} pociągiem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa 坐火车出行。podróżuje 的意思是“出行；旅行（他；她）”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit28.lesson01.fill.003
  lesson_content_key: pl.a1.unit28.lesson01.pociag_rower_samochod_i
  type: fill_in_blank
  frame:
    text: Wtedy jadę {item}, razem z Ewą. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_pociągiem
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_pociągiem
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 然后我和 Ewa 一起坐火车。pociągiem 的意思是“火车”（用于“乘坐”之后）。
    language_code: zh
    direction: ltr
