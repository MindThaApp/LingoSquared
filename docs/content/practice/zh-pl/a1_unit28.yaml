  type: translation
  frame:
    text: Marek 骑自行车去上班。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_jeździ
  answer_derivation:
    kind: render_frame
    frame:
      text: Marek {item} rowerem do pracy.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Marek 骑自行车去上班。jeździ 的意思是“去；骑；开（他；她；经常）”。
    language_code: zh
    direction: ltr
