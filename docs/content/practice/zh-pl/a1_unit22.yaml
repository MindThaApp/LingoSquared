        - w_być
        - w_myśleć
        - w_słyszeć
        - w_dumna
        - w_dużo
        - w_znaczy
        - w_dzwoni
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“我会给你打电话”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit22.lesson02.listen.001
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“请问您是哪位？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit22.lesson03.translate.001
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“你能再说一遍吗？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit22.lesson04.match.001
  lesson_content_key: pl.a1.unit22.lesson04.wysylanie_sms_a
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个波兰语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit22.lesson05.choose.001
  lesson_content_key: pl.a1.unit22.lesson05.czytanie_rozmowy_sms_owej
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“阅读短信对话”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit22.lesson06.translate.001
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“下班后的一通电话”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 请问您是哪位？Z kim rozmawiam?（字面意思是“我在和谁说话？”）是对陌生来电者的标准问法；kim 是 z 后面的工具格。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 你能再说一遍吗？Możesz（你能……吗，来自 móc）+ 动词不定式 powtórzyć（重复）+ to（那个）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 请不要说得这么快。Nie mów 是否定命令式（不要说）；tak szybko 的意思是“这么快”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: 我听不清你说话。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 我听不清你说的。Nie słyszę cię dobrze 表示听不清楚；cię 是 ty 的四格，dobrze 的意思是“好地”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 你的第一个班上得怎么样？Jak ci poszła ...?（字面意思是“……对你来说进展得怎样？”）用来询问已经发生的事。Ci 是 ty 的三格，poszła 与阴性名词 zmiana 一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 他的第一个班上得非常顺利。Jego（他的）形式不变，放在名词前：jego pierwsza zmiana；阴性名词不会影响它。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: 进展得非常顺利，比我想的还要好。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 进展得非常顺利，比我想的还要好。Poszło 是 iść 的过去时，词尾 -o 表示中性（这里指“结果如何”）；myślałem 是 myśleć（想）的过去时，用于男性说话者。
    language_code: zh
    direction: ltr
