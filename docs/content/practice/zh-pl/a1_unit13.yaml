templates:
- content_key: practice.zh-pl.pl.a1.unit13.lesson01.choose.001
  lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Muzyka 是这个名词的基本形式；在 lubię 或 lubisz 之后会变成 muzykę。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson01.listen.002
  lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lubisz 是 lubić 的“你”的形式，用于朋友之间；lubię 是“我”的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson01.order.003
  lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
  type: word_order
  frame:
    text: Czy lubisz {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy lubisz {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 以 -a 结尾的阴性名词在 lubić 之后变为 -ę，和 kawa 变 kawę 一样。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson01.order.004
  lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
  type: word_order
  frame:
    text: Bardzo lubię {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bardzo 放在动词前面，使语气更强，相当于汉语的“很”“非常”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson01.fill.005
  lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
  type: fill_in_blank
  frame:
    text: Czy {item} muzykę? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 词干加 -sz 就是对朋友说话的形式：lubię（我）变成 lubisz（你）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson01.fill.006
  lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
  type: fill_in_blank
  frame:
    text: Lubię {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 lubię 之后，所喜欢的东西要用宾格，所以 muzyka 变成 muzykę。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson01.translate.007
  lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
  type: translation
  frame:
    text: 我真的很喜欢音乐。
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 波兰语的简短回答不重复名词，但完整的句子需要用宾格形式 muzykę。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson01.translate.008
  lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
  type: translation
  frame:
    text: 你喜欢音乐吗？（对朋友说，用 ty；以 czy 开头）
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy lubisz {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 句首的 czy 把陈述句变成是非问句。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson01.translate.009
  lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 宾格形式 muzykę 和基本形式 muzyka 是同一个名词的两种形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson02.choose.001
  lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Wolę 是 woleć（更喜欢）的“我”的形式；用法和 lubię 相似。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson02.listen.002
  lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Wolę 和 lubię 一样以 -ę 结尾，这标志着“我”的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson02.order.003
  lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
  type: word_order
  frame:
    text: Ja też {item} herbatę.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Ja też {item} herbatę.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ja też 的意思是“我也是”，后面接的动词与第一个人说的句子中的动词相同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson02.fill.004
  lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
  type: fill_in_blank
  frame:
    text: Ja {item} herbatę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wolę 后面接宾格，所以 herbata 变成 herbatę。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson02.translate.005
  lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
  type: translation
  frame:
    text: 我也是：我更喜欢茶。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Ja też {item} herbatę.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 加上 ja 是为了强调；动词词尾 -ę 本身已经表示“我”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit13.lesson02.translate.006
  lesson_content_key: pl.a1.unit13.lesson02.kawa_czy_herbata
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wolę 是“我更喜欢”；与 lubię 不同，它表示在两者之间选择其一。
    language_code: zh
    direction: ltr
