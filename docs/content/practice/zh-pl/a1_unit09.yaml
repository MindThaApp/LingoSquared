templates:
- content_key: practice.zh-pl.pl.a1.unit09.lesson01.choose.001
  lesson_content_key: pl.a1.unit09.lesson01.jak_dojsc
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dojść 的意思是到达某个地方，而 iść 只是指步行前往。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson01.listen.002
  lesson_content_key: pl.a1.unit09.lesson01.jak_dojsc
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Proszę 加动词不定式是礼貌地给出指示的方式，例如 Proszę iść prosto。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson01.match.003
  lesson_content_key: pl.a1.unit09.lesson01.jak_dojsc
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 指路时常用 potem 连接各个步骤，它的意思是“然后”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson01.order.004
  lesson_content_key: pl.a1.unit09.lesson01.jak_dojsc
  type: word_order
  frame:
    text: Proszę iść prosto, {item} skręcić na prawo.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę iść prosto, {item} skręcić na prawo.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Potem 按动作发生的先后顺序连接两个步骤：先直走，然后转弯。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson01.fill.005
  lesson_content_key: pl.a1.unit09.lesson01.jak_dojsc
  type: fill_in_blank
  frame:
    text: Jak {item} do banku? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Jak dojść do 加二格，用来询问怎么去某个地方。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson01.translate.006
  lesson_content_key: pl.a1.unit09.lesson01.jak_dojsc
  type: translation
  frame:
    text: 银行在那里。
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Bank jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Tam 的意思是“那里”，在任何表示位置的句子里形式都不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson01.translate.007
  lesson_content_key: pl.a1.unit09.lesson01.jak_dojsc
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Prosto 的意思是“一直向前”，常与 iść 搭配使用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson02.choose.001
  lesson_content_key: pl.a1.unit09.lesson02.na_prawo_na_lewo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Na prawo 和 na lewo 表示转弯的方向，na 后面的词形固定不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson02.listen.002
  lesson_content_key: pl.a1.unit09.lesson02.na_prawo_na_lewo
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Skręcić 是表示转弯的动词；礼貌的指示是 Proszę skręcić。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson02.match.003
  lesson_content_key: pl.a1.unit09.lesson02.na_prawo_na_lewo
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Prawo 和 lewo 用在 na 之后，表示在右边或左边、向右或向左。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson02.order.004
  lesson_content_key: pl.a1.unit09.lesson02.na_prawo_na_lewo
  type: word_order
  frame:
    text: Proszę skręcić na {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę skręcić na {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 表示方向时，na prawo 和 na lewo 都跟在动词 skręcić 后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson02.fill.005
  lesson_content_key: pl.a1.unit09.lesson02.na_prawo_na_lewo
  type: fill_in_blank
  frame:
    text: Proszę {item} na lewo. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: proszę 后面的动词保持不定式，例如 Proszę skręcić。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson02.translate.006
  lesson_content_key: pl.a1.unit09.lesson02.na_prawo_na_lewo
  type: translation
  frame:
    text: 公园在左边。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Park jest na {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Na lewo 表示在左边；与之对应的“右边”是 na prawo。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson02.translate.007
  lesson_content_key: pl.a1.unit09.lesson02.na_prawo_na_lewo
  type: translation
  frame:
    text: 银行在右边。
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Bank jest na {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: na 后面的词形不变：na prawo。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson02.translate.008
  lesson_content_key: pl.a1.unit09.lesson02.na_prawo_na_lewo
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ulica 是阴性名词，因为它以 -a 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson03.choose.001
  lesson_content_key: pl.a1.unit09.lesson03.jak_dojsc_do_parku
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rozumiem 是第一人称“我”的形式，表示你听懂了指路。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson03.match.002
  lesson_content_key: pl.a1.unit09.lesson03.jak_dojsc_do_parku
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 听完指路后，人们会用 rozumiem 来确认，意思是“我明白”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit09.lesson03.translate.003
  lesson_content_key: pl.a1.unit09.lesson03.jak_dojsc_do_parku
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
