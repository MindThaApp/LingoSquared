schema_version: '1.0'
pack_key: practice.zh-pl.a1.unit21
source_language: zh
target_language: pl
unit_content_key: pl.a1.unit21.emocje
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_będziesz
    - w_czuje
    - w_deszcz
    - w_dumny
    - w_martw
    - w_myślę
    - w_mówiąc
    - w_naprawdę
    - w_nowe
    - w_pewno
    - w_pierwszą
    - w_pomaga
    - w_poradzisz
    - w_pracę
    - w_samodzielną
    - w_smutny
    - w_szczerze
    - w_szczęśliwy
    - w_zdenerwowany
    - w_zmianą
templates:
- content_key: practice.zh-pl.pl.a1.unit21.lesson01.choose.001
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_szczęśliwy
        - w_smutny
        - w_nowe
        - w_deszcz
        - w_zdenerwowany
        - w_pierwszą
        - w_zmianą
        - w_martw
        - w_czuje
        - w_samodzielną
        - w_pracę
        - w_myślę
        - w_szczerze
        - w_mówiąc
        - w_poradzisz
        - w_naprawdę
        - w_pomaga
        - w_pewno
        - w_będziesz
        - w_dumny
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“开心、难过还是生气？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson02.listen.001
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“你为什么开心？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson03.translate.001
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“对某事感到紧张”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson04.match.001
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个波兰语单词与它的中文意思配对；这些单词来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson05.choose.001
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“阅读关于心情的消息”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson06.translate.001
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自“埃娃安慰马雷克”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson01.order.002
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: word_order
  frame:
    text: Dlaczego jesteś {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_szczęśliwy
  answer_derivation:
    kind: render_frame
    frame:
      text: Dlaczego jesteś {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 你为什么高兴？Dlaczego（为什么）是询问原因的标准疑问词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson01.fill.003
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: fill_in_blank
  frame:
    text: Nie jestem zły, jestem {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smutny
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smutny
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我不生气，我很难过。Nie 要放在动词前面：Nie jestem zły。第二个分句再说出真正的感受。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson02.order.002
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: word_order
  frame:
    text: Jestem szczęśliwy, bo mam {item} mieszkanie.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nowe
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem szczęśliwy, bo mam {item} mieszkanie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 我很高兴，因为我有了新公寓。Bo（因为）引出原因；在 mam（我有）之后名词用宾格：nowe mieszkanie。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson02.fill.003
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: fill_in_blank
  frame:
    text: Jestem smutny, bo pada {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_deszcz
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_deszcz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我很难过，因为下雨了。Pada deszcz（下雨，字面意思是“雨落下”）是常用的天气说法，这里用作原因。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson03.order.002
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: word_order
  frame:
    text: Jestem {item} przed pierwszą zmianą.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_zdenerwowany
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem {item} przed pierwszą zmianą.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 我对第一次上班感到紧张。zdenerwowany 的意思是紧张（阳性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson03.fill.003
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: fill_in_blank
  frame:
    text: Cześć, Marku, jak się czujesz przed {item} zmianą? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 你好，马雷克，第一次上班前你感觉怎么样？Przed pierwszą zmianą（对第一次上班）再次用到第3课的 przed + 工具格结构。Czujesz się 是 ty 的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson03.translate.004
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
    text: 别担心。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_martw
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} się.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 别担心。Nie martw się（字面意思是“不要让自己担心”）是标准的安慰用语；się 是反身代词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson04.order.002
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: word_order
  frame:
    text: Jak {item} się Marek?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_czuje
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak {item} się Marek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 马雷克感觉怎么样？Czuć się（感觉，反身动词）是询问或描述情绪状态的标准说法：Jak czuje się Marek?
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson05.order.002
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: word_order
  frame:
    text: Tak, ja też tak {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_myślę
  answer_derivation:
    kind: render_frame
    frame:
      text: Tak, ja też tak {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 是的，我也这么想。Ja też tak myślę（字面意思是“我也这样想”）是表示同意的自然说法；这里加上 ja 是为了对比强调。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson06.order.002
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: word_order
  frame:
    text: Szczerze {item}, jestem trochę zdenerwowany.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mówiąc
  answer_derivation:
    kind: render_frame
    frame:
      text: Szczerze {item}, jestem trochę zdenerwowany.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 说实话，我有点紧张。Szczerze mówiąc（说实话，字面意思是“真诚地说”）让坦白显得更委婉。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson06.fill.003
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: fill_in_blank
  frame:
    text: Nie martw się, dobrze sobie {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 别担心，你能做好的！Dobrze sobie poradzisz（字面意思是“你会应付得很好”）是带有鼓励意味的固定表达；poradzisz 是 poradzić sobie 的 ty 将来时形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit21.lesson06.translate.004
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame:
    text: 谢谢，这真的帮了我大忙。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_naprawdę
  answer_derivation:
    kind: render_frame
    frame:
      text: Dzięki, to {item} pomaga.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 谢谢，这真的很有帮助。Pomaga 是 pomagać（帮助）的 on/ona/ono 形式；dzięki 是非正式的“谢谢”。
    language_code: zh
    direction: ltr
