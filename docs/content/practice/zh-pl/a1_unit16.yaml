    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mnie 和 cię 分别是 ja 和 ty 的宾格形式：我疼、你疼。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit16.lesson01.order.004
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: word_order
  frame:
