  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Boli 用于一个疼的部位，bolą 用于多个部位，所以 zęby 要搭配 bolą。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit16.lesson01.listen.002
