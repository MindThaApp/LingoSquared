  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: translation
  frame:
    text: Marek 生病了。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Marek jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Marek 是男性，所以形容词用 chory。
    language_code: zh
    direction: ltr
