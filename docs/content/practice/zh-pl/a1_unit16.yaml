    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa 是女性，所以形容词用阴性词尾 -a。
    language_code: zh
    direction: ltr
