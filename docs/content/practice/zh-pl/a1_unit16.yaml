- content_key: practice.zh-pl.pl.a1.unit16.lesson01.choose.001
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
