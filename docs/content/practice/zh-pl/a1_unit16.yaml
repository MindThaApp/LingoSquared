    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Gardło {item} boli.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mnie 的意思是“我”；Gardło mnie boli 字面意思是“喉咙疼我”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit16.lesson01.fill.005
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: fill_in_blank
  frame:
    text: Co cię {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Boli 是“他、她、它”的形式；疑问词 Co 指的是疼的那个东西。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit16.lesson01.translate.006
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: translation
  frame:
    text: 我的喉咙疼。（以“喉咙”开头）
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gardło mnie {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gardło 是中性单数，所以动词用 boli。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit16.lesson01.translate.007
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: translation
  frame:
    text: 你哪里疼？（对朋友说，用 ty）
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Co {item} boli?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Cię 是 ty 的宾格短形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-pl.pl.a1.unit16.lesson02.choose.001
