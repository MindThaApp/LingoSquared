templates:
- content_key: practice.ar-pl.pl.a1.unit02.lesson01.choose.001
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ليس في البولندية نمط يربط الأعداد من واحد إلى عشرة، لذا يجب تعلّم كل كلمة على حدة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson01.listen.002
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يُنطق الحرفان sz قريبًا من «ش»، ويُنطق الحرفان cz قريبًا من «تش»، ولذلك تبدأ sześć وcztery بهذين الصوتين.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson01.translate.003
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: الحرف ć في آخر pięć وsześć وdziewięć وdziesięć صوت ناعم قريب من «تش»؛ والعلامة فوق الحرف مهمة في الإملاء.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson01.match.004
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: تنتهي pięć وsześć وdziewięć وdziesięć بالحرف ć، أما siedem وosiem فلا، لذا يحتاج إملاء كل منها إلى انتباه.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson01.order.005
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: word_order
  frame:
    text: Mam {item} lat.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} lat.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: التركيب Mam + العدد + lat يعبّر عن العمر، كما في Mam trzydzieści lat.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson02.listen.001
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تسأل Ile عن «كم» (المقدار أو العدد)، وkosztuje هو الفعل الذي يقترن بها عند السؤال عن السعر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson02.choose.002
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تنتهي الأعداد jedenaście وdwanaście وpiętnaście بـ -naście، وهذا يدل على أنها من الأعداد 11 إلى 19.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson02.translate.003
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني Ile «بكم» عند السؤال عن الأسعار، و«كم» عند السؤال عن الأشياء المعدودة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson02.order.004
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: To kosztuje {item} złotych.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje {item} złotych.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: يأتي بعد أعداد مثل pięć وdwanaście وtrzydzieści لفظ złotych، بينما يأتي بعد dwa وtrzy وcztery لفظ złote.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson02.fill.005
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: To kosztuje dwadzieścia {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Złotych هي الصيغة المستعملة بعد pięć وdwadzieścia وpięćdziesiąt وما شابهها من الأعداد؛ أما بعد dwa وtrzy وcztery فتأتي złote.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson02.translate.006
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: كم يكلف هذا؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile to kosztuje? هو سؤال السعر المعتاد، وتعني to هنا «هذا» أو «ذلك».
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson03.choose.001
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pana هو ضمير الملكية الرسمي عند مخاطبة رجل (pana numer)، أما twój فهو ضمير الملكية غير الرسمي (twój numer).
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson03.translate.002
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Numer telefonu تعني حرفيًا «رقم الهاتف»، والكلمة الثانية صيغة متغيّرة من كلمة «هاتف».
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson03.order.003
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: Jaki jest {item} numer telefonu?
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest {item} numer telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój هو ضمير الملكية غير الرسمي، وpana هو الرسمي عند مخاطبة رجل؛ وكلاهما يصلح قبل numer telefonu.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson03.fill.004
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: Ile masz {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تأتي lat بعد أعداد مثل pięć وdwadzieścia وtrzydzieści؛ وتأتي lata بعد dwa وtrzy وcztery والأعداد المركبة المنتهية بها، كما في trzydzieści dwa lata.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson03.translate.005
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: عمري اثنتان وثلاثون سنة.
    language_code: ar
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam trzydzieści dwa {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: لأن العدد ينتهي بـ dwa، تكون كلمة «سنوات» هي lata وليست lat.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit02.lesson03.translate.006
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: ما رقم هاتفك؟ (بصيغة غير رسمية؛ استخدم jest)
    language_code: ar
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest twój {item} telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój هو ضمير الملكية غير الرسمي؛ أما الصيغة الرسمية عند مخاطبة رجل فهي Jaki jest pana numer telefonu?
    language_code: ar
    direction: rtl
