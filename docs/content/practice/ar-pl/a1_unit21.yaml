- content_key: practice.ar-pl.pl.a1.unit21.lesson01.order.002
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: word_order
  frame:
    text: Dlaczego jesteś {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_szczęśliwy
  answer_derivation:
    kind: render_frame
    frame:
      text: Dlaczego jesteś {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: لماذا أنت سعيد؟ Dlaczego (لماذا) هي أداة الاستفهام المعتادة عن السبب.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit21.lesson01.fill.003
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: fill_in_blank
  frame:
    text: Nie jestem zły, jestem {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smutny
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smutny
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'أنا لست غاضبًا، أنا حزين. تأتي Nie مباشرة قبل الفعل: Nie jestem zły. ثم تذكر الجملة الثانية الشعور الفعلي.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit21.lesson02.order.002
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: word_order
  frame:
    text: Jestem szczęśliwy, bo mam {item} mieszkanie.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nowe
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem szczęśliwy, bo mam {item} mieszkanie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'أنا سعيد لأن لدي شقة جديدة. Bo (لأن) تُدخل السبب؛ وبعد mam (عندي) يأتي الاسم في حالة المفعول به: nowe mieszkanie.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit21.lesson02.fill.003
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: fill_in_blank
  frame:
    text: Jestem smutny, bo pada {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_deszcz
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_deszcz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنا حزين لأن المطر يتساقط. Pada deszcz (تمطر، وحرفيًا «المطر يسقط») هي العبارة المعتادة للحديث عن الطقس، وتُستعمل هنا سببًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit21.lesson03.order.002
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: word_order
  frame:
    text: Jestem {item} przed pierwszą zmianą.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_zdenerwowany
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem {item} przed pierwszą zmianą.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: أنا متوتر قبل ورديتي الأولى. zdenerwowany تعني «متوتر» (مذكر).
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit21.lesson03.fill.003
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: fill_in_blank
  frame:
    text: Cześć, Marku, jak się czujesz przed {item} zmianą? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مرحبًا Marek، كيف تشعر قبل ورديتك الأولى؟ Przed pierwszą zmianą (قبل ورديتك الأولى) تعيد نمط przed + الحالة الأداتية من الدرس 3. وCzujesz się هي صيغة المخاطب ty.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit21.lesson03.translate.004
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
    text: لا تقلق.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_martw
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} się.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: لا تقلق. Nie martw się (وحرفيًا «لا تُقلق نفسك») هي عبارة الطمأنة المعتادة؛ و się ضمير انعكاسي.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit21.lesson04.order.002
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: word_order
  frame:
    text: Jak {item} się Marek?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_czuje
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak {item} się Marek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'كيف يشعر Marek؟ Czuć się (يشعر، فعل انعكاسي) هو الطريقة المعتادة للسؤال عن الحالة الشعورية أو وصفها: Jak czuje się Marek?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit21.lesson05.order.002
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: word_order
  frame:
    text: Tak, ja też tak {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_myślę
  answer_derivation:
    kind: render_frame
    frame:
      text: Tak, ja też tak {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: نعم، أنا أظن ذلك أيضًا. Ja też tak myślę (وحرفيًا «أنا أيضًا أفكر هكذا») هي الطريقة الطبيعية للموافقة؛ وأُضيف ja هنا للتوكيد.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit21.lesson06.order.002
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: word_order
  frame:
    text: Szczerze {item}, jestem trochę zdenerwowany.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mówiąc
  answer_derivation:
    kind: render_frame
    frame:
      text: Szczerze {item}, jestem trochę zdenerwowany.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: بصراحة، أنا متوتر قليلًا. Szczerze mówiąc (بصراحة، وحرفيًا «أقول بصدق») تخفف وقع الاعتراف.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit21.lesson06.fill.003
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: fill_in_blank
  frame:
    text: Nie martw się, dobrze sobie {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: لا تقلق، ستتدبر أمرك جيدًا! Dobrze sobie poradzisz (وحرفيًا «ستتدبر أمرك جيدًا») عبارة تشجيع ثابتة؛ وporadzisz هي صيغة المستقبل للمخاطب ty من poradzić sobie.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit21.lesson06.translate.004
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame:
    text: شكرًا، هذا يساعدني فعلًا.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_naprawdę
  answer_derivation:
    kind: render_frame
    frame:
      text: Dzięki, to {item} pomaga.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: شكرًا، هذا يساعدني فعلًا. Pomaga هي صيغة المفرد الغائب (on/ona/ono) من الفعل pomagać (يساعد)؛ وdzięki هي «شكرًا» في الكلام غير الرسمي.
    language_code: ar
    direction: rtl
