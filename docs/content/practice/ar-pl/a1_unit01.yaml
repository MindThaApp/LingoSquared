templates:
- content_key: practice.ar-pl.pl.a1.unit01.lesson01.choose.001
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'في البولندية نوعان من «أنت»: ty مع الأصدقاء والعائلة، وpan (لرجل) أو pani (لامرأة) مع الغرباء وللتعبير عن الاحترام.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson01.fill.002
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: fill_in_blank
  frame:
    text: Jak się {item} ma? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'مع pan أو pani يكون الفعل ma، وكأنك تقول «كيف حال السيد أو السيدة؟»؛ أما مع ty فيصبح masz: Jak się masz?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson01.translate.003
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'لا يمكن تبديل pan وpani: فـ pan تخاطب بها رجلًا وpani تخاطب بها امرأة، أما ty فهي للأشخاص الذين تعرفهم جيدًا.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson01.order.004
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: word_order
  frame:
    text: Jak się {item} ma?
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item} ma?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Jak się ma? سؤال عن حال شخص ما؛ تأتي pan أو pani في الوسط، ويبقى الفعل ma كما هو.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson01.translate.005
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: كيف حالك؟ (لصديق، بصيغة غير رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: مع الصديق ينتهي السؤال بـ masz؛ أما الصيغة الرسمية فتستخدم ma مع pan أو pani.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson02.listen.001
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dzień dobry تحية تُقال طوال النهار حتى المساء، وdobry wieczór تُقال في المساء، وdobranoc لا تُقال إلا عند الفراق قبل النوم.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson02.match.002
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cześć كلمة غير رسمية تعني «مرحبًا» و«مع السلامة» معًا، لذلك تناسب ty وليس pan أو pani.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson02.order.003
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Do {item}!
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Do {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Do widzenia هي عبارة الوداع المعتادة، أما do zobaczenia فهي «أراك قريبًا» الأكثر ودًّا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson02.fill.004
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: fill_in_blank
  frame:
    text: Dobry {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تُستخدم Dobry wieczór في المساء؛ أما في النهار فتقول dzień dobry.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson02.translate.005
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تصلح Cześć للتحية وللوداع، لكن فقط مع من تخاطبهم بـ ty.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson02.translate.006
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: أتمنى لك يومًا سعيدًا!
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Miłego {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Miłego dnia أمنية، ولهذا تتغير نهاية كلمة «يوم» إلى dnia.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson03.choose.001
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تحذف البولندية الضمير في الغالب لأن نهاية الفعل تدل على الشخص: jestem تعني «أنا (أكون)»، وjesteś تعني «أنت (تكون)».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson03.listen.002
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jestem z + اسم البلد تدل على البلد الذي أنت منه، وmieszkam w + اسم المدينة تدل على المدينة التي تسكن فيها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson03.translate.003
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تدل نهايات الأفعال على الشخص: -m للمتكلم (jestem, mieszkam) و-sz أو -ś للمخاطب في الصيغة غير الرسمية (masz, jesteś).'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson03.order.004
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: word_order
  frame:
    text: Jestem z {item}, ale mieszkam w Warszawie.
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem z {item}, ale mieszkam w Warszawie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'بعد z (من) يتغير آخر اسم البلد: Kanady.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson03.fill.005
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: fill_in_blank
  frame:
    text: Czy pan {item} po polsku? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'السؤال الرسمي عن رجل يستخدم صيغة الغائب للفعل: Czy pan mówi po polsku?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson03.translate.006
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: من أين أنت؟ (لصديق، بصيغة غير رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Skąd {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Skąd تسأل عن المكان الذي جاء منه الشخص؛ ومع الصديق يكون الفعل jesteś، أما الصيغة الرسمية فهي Skąd pan jest?
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit01.lesson03.translate.007
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: تشرفنا، سعدت جدًا بلقائك.
    language_code: ar
    direction: rtl
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo mi {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bardzo mi miło تعني حرفيًا «لطيف جدًا بالنسبة لي»، وهي الردّ المعتاد عند التعرف على شخص ما.
    language_code: ar
    direction: rtl
