templates:
- content_key: practice.ar-pl.pl.a1.unit05.lesson01.choose.001
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تأتي كلمات العائلة في البولندية في أزواج مذكر ومؤنث مثل ojciec وmatka أو brat وsiostra.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson01.listen.002
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: كلمة Rodzice (الوالدان) جمع دائمًا، ولذلك تأخذ moi بدل mój أو moja.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson01.match.003
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'تتزاوج كلمات العائلة بحسب الجنس: dziadek وbabcia، وwujek وciotka، وsyn وcórka.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson01.order.004
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest mój {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest mój {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: تأتي mój مع الأسماء المذكرة مثل ojciec وbrat وdziadek.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson01.order.005
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest moja {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest moja {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: تأتي moja مع الأسماء المؤنثة، ومعظمها ينتهي بـ -a.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson01.fill.006
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: fill_in_blank
  frame:
    text: To jest {item} ojciec. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تتطابق صيغة الملكية مع الاسم: mój ojciec، لكن moja matka.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson01.translate.007
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: هذه أمي.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest {item} matka.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja هي صيغة «ي» المؤنثة، أما المذكرة فهي mój.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson01.translate.008
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: هذان والداي.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To są {item} rodzice.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rodzice جمع يدل على أشخاص، ولذلك تكون صيغة الملكية moi، ويكون الفعل są بدل jest.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson02.choose.001
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mieć تعني «لدى»، ويحدد صاحب الفعل صيغته: mam وmasz وma.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson02.translate.002
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieć («لدى») هي صيغة المعجم، وتظهر في الجمل بصيغة mam أو masz أو ma.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson02.order.003
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: word_order
  frame:
    text: Mam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'بعد mam يأخذ الشيء الذي تملكه صيغة المفعول به: يصبح brat هو brata، ويصبح siostra هو siostrę.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson02.fill.004
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: fill_in_blank
  frame:
    text: Tak, mam brata {item} siostrę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: الكلمة i تربط بين شيئين، كما في brata i siostrę، ولا تتغير صيغتها أبدًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson02.translate.005
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: لدي ابن وابنة.
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam syna i {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'تتحول الأسماء المؤنثة المنتهية بـ -a إلى -ę عندما تكون مفعولًا به: يصبح córka هو córkę.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson03.choose.001
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تستعمل البولندية on لـ «هو» وona لـ «هي»، ويناسب الفعل mieszka كليهما.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson03.translate.002
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني tylko «فقط»، أما lub فهي «أو» للتخيير، كما في brata lub siostrę.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson03.order.003
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: word_order
  frame:
    text: Mój brat mieszka w {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mój brat mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: بعد w تأخذ أسماء المدن نهاية خاصة، كما في w Gdańsku وw Krakowie.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson03.fill.004
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: fill_in_blank
  frame:
    text: Ona {item} w Krakowie. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieszka هي صيغة الغائب (هو/هي) من الفعل، أما mieszkam من الوحدة الأولى فهي صيغة المتكلم (أنا).
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit05.lesson03.translate.005
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: هو يسكن في غدانسك. (مع ذكر الضمير)
    language_code: ar
    direction: rtl
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: On mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'النهاية -u بعد w تدل على مكان السكن: w Gdańsku.'
    language_code: ar
    direction: rtl
