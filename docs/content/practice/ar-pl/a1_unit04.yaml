  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rano تعني في الصباح، وwieczorem في المساء، وw nocy في الليل.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit04.lesson02.listen.002
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
