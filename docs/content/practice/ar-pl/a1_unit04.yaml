templates:
- content_key: practice.ar-pl.pl.a1.unit04.lesson01.choose.001
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تستعمل ساعات الساعة أعدادًا ترتيبية مؤنثة (pierwsza, druga, trzecia) لأنها تتطابق مع كلمة godzina المقدَّرة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit04.lesson01.listen.002
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: في قول الوقت تستعمل البولندية pierwsza وdruga وtrzecia، لا pierwszy وdrugi وtrzeci.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit04.lesson01.translate.003
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'الساعات أعداد ترتيبية: pierwsza تعني حرفيًا «الأولى»، فالساعة الواحدة هي الساعة الأولى.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit04.lesson01.order.004
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: word_order
  frame:
    text: Która jest godzina? Jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Która jest godzina? Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: جواب Która jest godzina? هو ببساطة Jest + الساعة، باستعمال العدد الترتيبي المؤنث.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit04.lesson01.fill.005
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: fill_in_blank
  frame:
    text: Która jest {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Która jest godzina? هي الطريقة المعتادة للسؤال عن الوقت؛ وكلمة która مؤنثة لأن godzina مؤنثة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit04.lesson01.translate.006
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: إنها الساعة الثالثة. (كلمتان)
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ساعة الساعة عدد ترتيبي مؤنث، لذا الساعة الثالثة هي trzecia وليس trzy.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit04.lesson02.choose.001
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: multiple_choice
