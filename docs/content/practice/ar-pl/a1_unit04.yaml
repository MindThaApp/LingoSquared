    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może تعني «ربما» وتخفف الاقتراح، مثل «ربما في الرابعة؟».
    language_code: ar
    direction: rtl
