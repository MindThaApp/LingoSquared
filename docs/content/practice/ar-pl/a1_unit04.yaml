    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje هي صيغة الغائب المفرد من الفعل، ولهذا تناسب Ewa.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit04.lesson02.translate.008
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: في أي ساعة؟ (كلمتان)
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: O której {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: O której godzinie تسأل «في أي ساعة؟»، وتأخذ الكلمتان معًا النهاية المستعملة بعد o.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit04.lesson02.translate.009
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: ينطلق القطار في الرابعة بعد الظهر.
    language_code: ar
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg {item} o czwartej po południu.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'بعد o تتغير نهاية الساعة: czwarta تصبح o czwartej.'
    language_code: ar
    direction: rtl
