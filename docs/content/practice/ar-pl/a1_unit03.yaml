templates:
- content_key: practice.ar-pl.pl.a1.unit03.lesson01.choose.001
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تُكتب أيام الأسبوع والأشهر في البولندية بحرف أول صغير.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson01.translate.002
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تنتهي Środa وsobota وniedziela بالحرف a، بينما تنتهي أيام الأسبوع الأربعة الأخرى بحرف ساكن؛ ويظهر أثر هذا الاختلاف في عبارة w + اليوم.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson01.match.003
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: تعني Dziś «اليوم»، أما tygodnia فصيغة متغيرة من كلمة «أسبوع»، كما في dzień tygodnia.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson01.order.004
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: W {item} idę do kina.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: W {item} idę do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: مع w («في يوم») تحتفظ poniedziałek وczwartek وpiątek بصيغتها، لكن wtorek تصبح we wtorek لسهولة النطق.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson01.fill.005
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: fill_in_blank
  frame:
    text: W {item} idę do kina. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Idę do kina تعني «أذهب إلى السينما»، وw + اسم اليوم تعني «في ذلك اليوم».
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson01.order.006
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: Jaki dziś jest dzień {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki dziś jest dzień {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dzień tygodnia تعني «يوم من أيام الأسبوع»، وتغيّر الكلمة الثانية نهايتها إلى tygodnia.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson02.choose.001
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: لا تحتاج أسماء الأشهر البولندية إلى حرف كبير، وليس لها أداة تعريف ولا سابقة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson02.listen.002
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: في التاريخ المنطوق يأتي اليوم أولًا وينتهي بـ -ego، ثم الشهر بصيغة التاريخ، وتنتهي عادةً بـ -a (dziesiątego maja)، لكن فبراير هو lutego.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson02.translate.003
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: لا تُكتب الأشهر البولندية بحرف كبير، وكلمة urodziny («عيد الميلاد») جمع دائمًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson02.match.004
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: تنتهي بعض الأشهر بـ -eń (styczeń وkwiecień وsierpień وwrzesień)، وهذا يساعدك على تمييزها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson02.order.005
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: word_order
  frame:
    text: Spotkanie jest piętnastego {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Spotkanie jest piętnastego {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: في التاريخ ينتهي اليوم بـ -ego ويأخذ الشهر النهاية -a، إلا فبراير فهو lutego.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson02.fill.006
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: fill_in_blank
  frame:
    text: Kiedy są twoje {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كلمة urodziny جمع في البولندية، لذا يكون الفعل są («يكونون») وليس jest.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson02.translate.007
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
    text: متى الاجتماع؟
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Kiedy jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: تسأل Kiedy عن الوقت، والاسم المفرد مثل spotkanie يأتي معه jest.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson03.choose.001
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تعني Panu وci كلتاهما «لك»؛ panu صيغة رسمية لرجل، وci صيغة غير رسمية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson03.translate.002
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Możemy هي صيغة «نحن» من الفعل «يستطيع»، كما في Kiedy możemy się znowu spotkać?
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson03.order.003
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: word_order
  frame:
    text: Czy piątek {item} odpowiada?
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy piątek {item} odpowiada?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'يأتي مع Odpowiada الشخص المخاطَب في حالة الجرّ بحرف «لـ»: panu (رسمي، لرجل) أو ci (غير رسمي).'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit03.lesson03.fill.004
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: fill_in_blank
  frame:
    text: Kiedy możemy się znowu {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعد możemy يبقى الفعل الثاني في صيغته الأساسية: spotkać.'
    language_code: ar
    direction: rtl
