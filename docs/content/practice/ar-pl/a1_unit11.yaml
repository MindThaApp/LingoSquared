- content_key: practice.ar-pl.pl.a1.unit11.lesson01.choose.001
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chcę هي صيغة المتكلم من chcieć، وchcesz صيغة المخاطب ty، وتُستخدم مع الأصدقاء والعائلة.
    language_code: ar
    direction: rtl
