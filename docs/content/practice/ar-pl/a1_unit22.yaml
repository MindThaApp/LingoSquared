  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} من كلمات هذه الوحدة، من درس مكالمة هاتفية بعد المناوبة.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'مع من أتحدث؟ تُستخدم عبارة Z kim rozmawiam? (حرفيًا: «مع من أتحدث؟») مع متصل لا تعرفه؛ وkim في حالة الأداة بعد z.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: هل يمكنك أن تعيد ذلك؟ Możesz (هل تستطيع، من móc) + المصدر powtórzyć (يعيد) + to (ذلك).
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: لا تتكلم بهذه السرعة من فضلك. Nie mów هي صيغة النهي (لا تتكلم)؛ وtak szybko تعني «بهذه السرعة».
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: لا أسمعك جيداً.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: لا أسمعك جيدًا. تعبّر Nie słyszę cię dobrze عن مشكلة في السمع؛ وcię هي المفعول به (حالة النصب) من ty، وdobrze تعني «جيدًا».
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'كيف كانت مناوبتك الأولى؟ تسأل العبارة Jak ci poszła ...? (حرفيًا: «كيف سارت ... معك؟») عن أمر انتهى. Ci هي حالة الجر باللام من ty، وposzła تتوافق مع الاسم المؤنث zmiana.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'سارت مناوبته الأولى بشكل جيد جدًا. الكلمة Jego (له/ـه) لا تتغير وتأتي قبل الاسم: jego pierwsza zmiana؛ والاسم المؤنث لا يؤثر فيها.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: سار الأمر بشكل جيد جدًا، أفضل مما ظننت.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: سار الأمر بشكل جيد جدًا، أفضل مما ظننت. Poszło هو ماضي iść بالنهاية -o (للغائب غير العاقل؛ ومعناه هنا «انتهى إلى نتيجة»)؛ وmyślałem ماضي myśleć (يفكر/يظن) بنهاية المتكلم المذكر.
    language_code: ar
    direction: rtl
