    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Gară ist der Bahnhof, magazin das Geschäft und bancă die Bank; aproape und departe sagen, wie weit etwas entfernt ist.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson01.listen.002
