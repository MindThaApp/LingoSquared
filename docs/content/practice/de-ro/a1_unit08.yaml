    text: Bancă, poștă und bibliotecă enden auf -ă und sind weiblich; magazin, spital und autobuz haben keine solche Endung.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson01.translate.004
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gară, magazin und bancă sind die Grundformen; mit angehängtem Artikel werden sie zu gara, magazinul und banca.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson01.order.005
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: word_order
  frame:
    text: Da, magazinul este {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, magazinul este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aproape heißt nah; Este aproape? fragt, ob etwas nah ist.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson01.fill.006
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: fill_in_blank
  frame:
    text: Unde este {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Der Artikel steht am Ende: bancă wird zu banca, also heißt Unde este banca? „Wo ist die Bank?“'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson01.translate.007
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
    text: Wo ist der Bahnhof?
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Gară wird mit dem am Ende angehängten Artikel zu gara.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson01.translate.008
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
    text: Das Geschäft ist nah.
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Magazinul este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Magazinul ist magazin plus der Artikel -ul; aproape ist ein Adverb und verändert sich nie.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson02.choose.001
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lângă, vizavi und între stehen vor dem Ort, auf den sie sich beziehen: lângă bibliotecă, vizavi de magazin.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson02.listen.002
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poștă ist die Post und bibliotecă die Bibliothek; stație ist eine Haltestelle und autobuz ein Bus.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson02.translate.003
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Spital und bibliotecă sind Nomen; lângă, vizavi und între sind Ortsangaben ohne Endungen.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson02.order.004
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: word_order
  frame:
    text: Spitalul este {item} de magazin.
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Spitalul este {item} de magazin.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Auf vizavi folgt immer de: vizavi de magazin heißt „gegenüber vom Geschäft“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson02.order.005
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: word_order
  frame:
    text: Stația de autobuz este {item} bibliotecă.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Stația de autobuz este {item} bibliotecă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Lângă heißt neben und wird direkt mit dem Nomen verbunden: lângă bibliotecă.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson02.fill.006
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: fill_in_blank
  frame:
    text: Stația de {item} este lângă bibliotecă. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Stația de autobuz ist eine Bushaltestelle: Der Artikel hängt an stație, nicht an autobuz.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson02.translate.007
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
    text: Das Krankenhaus liegt gegenüber dem Geschäft.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Spitalul este {item} de magazin.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Spital plus -ul ergibt spitalul; vizavi braucht de vor dem zweiten Ort.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit08.lesson02.translate.008
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
    text: Wo ist die Post?
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Poștă wird mit dem Artikel zu poșta; das Fragewort unde bleibt gleich.
    language_code: de
    direction: ltr
