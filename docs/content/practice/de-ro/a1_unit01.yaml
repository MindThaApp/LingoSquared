templates:
- content_key: practice.de-ro.ro.a1.unit01.lesson01.choose.001
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Das Rumänische hat zwei Wörter für „du/Sie“: tu bei Freunden und Familie, dumneavoastră bei Fremden und um Respekt zu zeigen.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson01.listen.002
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Faceți gehört zu dumneavoastră und faci zu tu, daher zeigt schon die Verbendung das Register.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson01.match.003
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Bună ziua passt zu dumneavoastră und salut zu tu: Die gewählte Begrüßung bestimmt das Register des ganzen Gesprächs.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson01.translate.004
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mulțumesc ist das alltägliche Danke und passt sowohl zu tu als auch zu dumneavoastră.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson01.order.005
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: word_order
  frame:
    text: Bună {item}!
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Bună {item}!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Bună ziua ist die höfliche Begrüßung am Tag für Fremde; bei Freunden sagt man salut.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson01.fill.006
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: fill_in_blank
  frame:
    text: Bine, mulțumesc. Și {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Și dumneavoastră? gibt die höfliche Frage zurück; bei einem Freund sagt man Și tu?
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson01.translate.007
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: Wie geht es dir? (informell, zu einem Freund)
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faci? gilt für einen Freund (tu); bei einer fremden Person sagt man Ce mai faceți?
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson01.translate.008
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: Wie geht es Ihnen? (formell, zu jemandem, den Sie mit dumneavoastră ansprechen)
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faceți? ist die höfliche Frage; die höfliche Antwort lautet Bine, mulțumesc. Și dumneavoastră?
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson02.order.001
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: word_order
  frame:
    text: Mă numesc {name}.
    language_code: ro
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Mă numesc {name}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mă numesc bedeutet wörtlich „ich nenne mich“; Mă cheamă bedeutet „ich werde gerufen“, also „ich heiße“.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson02.fill.002
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: fill_in_blank
  frame:
    text: Îmi {item} bine! ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Îmi pare bine bedeutet wörtlich „es scheint mir gut“; die Antwort lautet Și mie îmi pare bine.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson02.translate.003
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: Wie heißt du? (informell, zu einem Freund)
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum te {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cum te cheamă? verwendet te für einen Freund; bei einer fremden Person sagt man Cum vă numiți?
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson02.choose.004
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cum vă numiți? ist die höfliche Frage nach dem Namen und verwendet vă; bei einem Freund wird daraus Cum te cheamă?
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson02.listen.005
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Numesc ist die ich-Form (mă numesc) und numiți ist die dumneavoastră-Form (cum vă numiți).
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson02.translate.006
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Și bedeutet „und“ und leitet auch die Rückfrage ein: Și dumneavoastră? oder Și tu?'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson02.match.007
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Das Rumänische stellt in diesen Namenswendungen das Pronomen vor das Verb: mă numesc, vă numiți, te cheamă.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson03.translate.001
  lesson_content_key: ro.a1.unit01.lesson03.street_meeting
  type: translation
  frame:
    text: Gut, danke.
    language_code: de
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Bine, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Nach Bine, mulțumesc geben Sie die Frage zurück: Și dumneavoastră? (formell) oder Și tu? (informell).'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit01.lesson03.order.002
  lesson_content_key: ro.a1.unit01.lesson03.street_meeting
  type: word_order
  frame:
    text: Și {item} îmi pare bine!
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Și {item} îmi pare bine!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Și mie îmi pare bine bedeutet „freut mich auch“; mie betont „mir“ und bezieht sich auf die andere Person.
    language_code: de
    direction: ltr
