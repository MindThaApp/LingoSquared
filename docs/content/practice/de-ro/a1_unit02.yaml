templates:
- content_key: practice.de-ro.ro.a1.unit02.lesson01.choose.001
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Zwei hat zwei Formen: doi bei maskulinen Substantiven und două bei femininen und neutralen Substantiven.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson01.listen.002
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
