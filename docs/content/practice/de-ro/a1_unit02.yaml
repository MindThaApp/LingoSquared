    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sută bedeutet hundert; „einhundert“ heißt o sută, mit dem femininen o.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson03.order.001
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Am {item} ani.
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Von zwei bis neunzehn steht kein de: am nouăsprezece ani. Ab zwanzig kommt es hinzu: am treizeci de ani.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson02.translate.005
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: translation
  frame:
    text: Ich bin dreißig Jahre alt.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} de ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Ab zwanzig folgt auf die Zahl vor dem Substantiv de: treizeci de ani.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson03.choose.002
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ai ist die tu-Form von „haben“ und aveți die dumneavoastră-Form: Câți ani ai? oder Câți ani aveți?'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson03.fill.003
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: fill_in_blank
  frame:
    text: Am treizeci {item} ani. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De steht nach Zahlen ab zwanzig: treizeci de ani, aber nouăsprezece ani.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson03.translate.004
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: Wie alt bist du? (informell, zu einem Freund)
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Câți ani ai? fragt wörtlich, wie viele Jahre Sie haben: Das Rumänische verwendet für das Alter „haben“, nicht „sein“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson03.translate.005
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: Wie alt sind Sie? (förmlich, zu jemandem, den Sie mit dumneavoastră ansprechen)
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți ist die höfliche Form von „haben“ und wird mit dumneavoastră verwendet.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson03.order.006
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Care e numărul {item} de telefon?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Care e numărul {item} de telefon?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Numărul ist ein Neutrum, und ein neutrales Substantiv im Singular steht mit der maskulinen Form tău; die höfliche Version lautet Care este numărul dumneavoastră de telefon?
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson03.translate.007
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Das Rumänische sagt „Ich habe dreißig Jahre“: am treizeci de ani, nicht „ich bin“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson03.match.008
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ani ist der Plural von an; die Frage Câți ani ai? fragt nach der Anzahl der Jahre.
    language_code: de
    direction: ltr
