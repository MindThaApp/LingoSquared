    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Die Zehner bestehen aus der Einerziffer plus -zeci: aus trei wird treizeci, aus patru wird patruzeci.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson02.translate.004
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: translation
