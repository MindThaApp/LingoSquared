    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Doi ist die maskuline Form von zwei und două die feminine und neutrale Form; die anderen Zahlen ändern sich nicht.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson01.translate.004
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
