  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vor einem Substantiv ändern sich eins und zwei je nach Genus (un oder o, doi oder două); beim bloßen Zählen sagt man unu, doi.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson02.choose.001
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Die Zahlen von elf bis neunzehn bestehen aus der Einerziffer plus -sprezece: doisprezece ist zwei plus zehn.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson02.listen.002
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Die Zehner enden auf -zeci: douăzeci, treizeci, patruzeci und so weiter bis nouăzeci.'
    language_code: de
    direction: ltr
