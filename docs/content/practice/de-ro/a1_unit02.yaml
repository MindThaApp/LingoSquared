    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Null bis zehn sind die Bausteine: Die Zahlen von elf bis neunzehn hängen -sprezece an (unsprezece, doisprezece), die Zehner hängen -zeci an.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit02.lesson01.match.003
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
