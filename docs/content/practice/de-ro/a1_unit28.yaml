- content_key: practice.de-ro.ro.a1.unit28.lesson01.order.002
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: word_order
  frame:
    text: Trebuie să te {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_sun
  answer_derivation:
    kind: render_frame
    frame:
      text: Trebuie să te {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ich muss dich anrufen. sun bedeutet „ich rufe an“.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit28.lesson02.order.002
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: word_order
  frame:
    text: Cu cine {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbesc
  answer_derivation:
    kind: render_frame
    frame:
      text: Cu cine {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mit wem spreche ich? Cu cine vorbesc? (wörtlich „mit wem spreche ich?“) ist die übliche Art zu fragen, wer ein unbekannter Anrufer ist.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit28.lesson03.order.002
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: word_order
  frame:
    text: Poți să {item} asta?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_repeți
  answer_derivation:
    kind: render_frame
    frame:
      text: Poți să {item} asta?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Kannst du das wiederholen? Poți să ... (Kannst du ...?) plus repeți (du wiederholst) plus asta (das).
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit28.lesson03.fill.003
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: fill_in_blank
  frame:
    text: Nu {item} atât de repede, te rog. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sprich bitte nicht so schnell. Nu vorbi („sprich nicht“) ist nu + die tu-Form; atât de repede bedeutet „so schnell“.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit28.lesson03.translate.004
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: Ich kann dich nicht gut hören.
    language_code: de
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_aud
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu te {item} bine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Ich kann dich nicht gut hören. Nu te aud bine: aud heißt „ich höre“, te („dich“) steht vor dem Verb, und bine bedeutet „gut“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit28.lesson04.order.002
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: word_order
  frame:
    text: Îți {item} un mesaj.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_trimit
  answer_derivation:
    kind: render_frame
    frame:
      text: Îți {item} un mesaj.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Ich schicke dir eine SMS. Îți („dir“) ist ein Dativpronomen vor dem Verb: Îți trimit un mesaj.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit28.lesson04.fill.003
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: fill_in_blank
  frame:
    text: Te sun {item} mai târziu. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ich rufe dich später zurück. Înapoi („zurück“) steht nach dem Verb: te sun înapoi heißt „ich rufe dich zurück“, und mai târziu bedeutet „später“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit28.lesson06.order.002
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: word_order
  frame:
    text: A {item} foarte bine, mai bine decât credeam.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_mers
  answer_derivation:
    kind: render_frame
    frame:
      text: A {item} foarte bine, mai bine decât credeam.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Es ist sehr gut gelaufen, besser, als ich dachte. A mers ist die Vergangenheitsform von a merge (gehen, hier „verlaufen“); credeam bedeutet „ich dachte“ (eine Vergangenheitsform von a crede).
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit28.lesson06.fill.003
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: fill_in_blank
  frame:
    text: Îți mulțumesc, {item} mult pentru mine. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Danke, das bedeutet mir viel. Înseamnă ist die er/sie/es-Form von a însemna (bedeuten); pentru mine („für mich“) sagt, wem es wichtig ist.
    language_code: de
    direction: ltr
