templates:
- content_key: practice.de-ro.ro.a1.unit04.lesson01.choose.001
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jumătate bedeutet halb und un sfert ein Viertel; beide werden mit și an die Stunde angehängt.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson01.listen.002
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
