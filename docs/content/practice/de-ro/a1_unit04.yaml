    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ora ist die Stunde oder die Uhrzeit; fără und și verschieben die Zeit nach vorn oder zurück.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson01.order.004
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: word_order
  frame:
    text: Este {item} unu.
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Este {item} unu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Nach ora steht unu für eins und două für zwei: ora unu, ora două.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson01.fill.005
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: fill_in_blank
  frame:
    text: Este ora unu și {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Și jumătate fügt dreißig Minuten hinzu: ora unu și jumătate ist halb zwei.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson01.translate.006
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: translation
  frame:
    text: Wie spät ist es?
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât este ora? fragt wörtlich, wie viel die Stunde ist; antworten Sie mit Este ora + Zahl.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson01.translate.007
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fără bedeutet normalerweise ohne; bei der Uhrzeit bedeutet fără un sfert Viertel vor.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson02.translate.001
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: translation
  frame:
    text: Es ist Viertel nach zwei.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Este ora două și un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Și un sfert fügt fünfzehn Minuten hinzu; fără un sfert zieht fünfzehn ab.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson02.fill.002
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: fill_in_blank
  frame:
    text: Este ora trei {item} un sfert. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Fără un sfert zieht fünfzehn Minuten ab: ora trei fără un sfert ist 2:45.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson02.translate.003
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: translation
  frame:
    text: Um wie viel Uhr?
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: La ce {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'La ce oră? fragt, wann etwas stattfindet; antworten Sie mit la ora + Zahl: la ora nouă.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson02.order.004
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: word_order
  frame:
    text: Este ora trei fără un {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Este ora trei fără un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sfert ist ein Neutrum und steht im Singular mit un; die Uhrzeitangabe zählt von der nächsten Stunde rückwärts.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson03.choose.001
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dimineața, seara und noaptea sind Tageszeiten und enden auf -a, weil sie den bestimmten Artikel tragen.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson03.listen.002
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cursul ist der Kurs; „beginnt“ heißt începe, für Kurse wie für Veranstaltungen.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson03.order.003
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: word_order
  frame:
    text: Cursul {item} la ora nouă.
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul {item} la ora nouă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Începe ist die Form für er, sie oder es von „beginnen“ und passt zum Subjekt im Singular, cursul.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson03.translate.004
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: translation
  frame:
    text: Der Kurs beginnt um neun Uhr morgens.
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul începe la ora nouă, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Setzen Sie die Tageszeit hinter die Uhrzeit: la ora nouă, dimineața oder la ora nouă, seara.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit04.lesson03.fill.005
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: fill_in_blank
  frame:
    text: Când începe {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Când începe cursul? fragt, wann der Kurs beginnt; die Antwort lautet Cursul începe la ora nouă.
    language_code: de
    direction: ltr
