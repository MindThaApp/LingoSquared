    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Frate, fiu und copil sind maskulin und stehen mit un; soră und fiică sind feminin und stehen mit o.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson02.translate.004
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
