    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Părinți bedeutet „Eltern“ und ist ein Plural; die beiden Elternteile sind mamă und tată.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson01.match.003
