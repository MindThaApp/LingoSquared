    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Frați ist der Plural von frate und surori der Plural von soră.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson02.order.005
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: word_order
  frame:
    text: Ai {item}?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ai frați? ist die Frage an eine befreundete Person; mit dumneavoastră wird daraus Aveți frați?
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson02.fill.006
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: fill_in_blank
  frame:
    text: Am un {item} și o soră. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Un steht bei maskulinen Nomen (un frate) und o bei femininen (o soră).
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson02.translate.007
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: Ich habe eine Tochter.
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Am o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fiică ist feminin, deshalb steht o; ein Sohn ist un fiu.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson02.translate.008
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: Wie viele Kinder hast du?
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți {item} ai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Câți ist die maskuline Pluralform von „wie viele“ und steht bei copii, dem Plural von copil.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson03.translate.001
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: translation
  frame:
    text: Haben Sie Geschwister, Mihai? (formell)
    language_code: de
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aveți {item}, Mihai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Aveți ist die höfliche Form von „haben“; mit einem Freund würden Sie fragen: Ai frați?'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson03.order.002
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: word_order
  frame:
    text: Da, am un frate și o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, am un frate și o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un frate ist maskulin und o soră feminin; der Satz beantwortet die Frage Aveți frați?
    language_code: de
    direction: ltr
