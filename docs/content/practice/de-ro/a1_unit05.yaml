templates:
- content_key: practice.de-ro.ro.a1.unit05.lesson01.choose.001
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Meu und mea bedeuten beide „mein/meine“: meu steht bei maskulinen und neutralen Nomen (tatăl meu), mea bei femininen (mama mea).'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson01.listen.002
