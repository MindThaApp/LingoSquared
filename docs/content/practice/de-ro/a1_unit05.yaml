    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mamă und tată sind die Nomen ohne Artikel; mama und tatăl haben den bestimmten Artikel am Ende.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson01.translate.004
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Im Rumänischen steht der bestimmte Artikel am Ende des Nomens: Aus mamă wird mama und aus tată wird tatăl.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson01.order.005
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: word_order
  frame:
    text: Mama {item} și tatăl meu.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item} și tatăl meu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Das Possessivwort richtet sich nach dem Nomen: mama mea (feminin), aber tatăl meu (maskulin).'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson01.fill.006
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: fill_in_blank
  frame:
    text: Mama mea și tatăl {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tatăl ist maskulin, deshalb steht meu; mama ist feminin und verlangt mea.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson01.translate.007
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: Meine Mutter.
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Das Possessivwort steht im Rumänischen nach dem Nomen: mama mea, nicht mea mama.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson02.choose.001
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Im Rumänischen ändert sich im Plural die Endung: frate wird zu frați, soră zu surori, copil zu copii.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson02.listen.002
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fiu heißt „Sohn“ und fiică „Tochter“; ein verheirateter Mann ist căsătorit.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit05.lesson02.match.003
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
