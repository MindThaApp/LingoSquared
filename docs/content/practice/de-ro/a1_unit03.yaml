    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mehrere Monate ähneln den deutschen (februarie, septembrie), werden aber kleingeschrieben.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit03.lesson02.order.004
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: word_order
  frame:
    text: Astăzi este trei {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este trei {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Daten bestehen aus Zahl + Monat: trei aprilie. Für den Ersten des Monats steht întâi, nicht unu.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit03.lesson02.translate.005
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: Heute ist der erste August.
    language_code: de
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este întâi {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Der Erste des Monats heißt întâi, nicht unu: întâi august; ab dem Zweiten verwendet man die gewöhnliche Zahl.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit03.lesson02.fill.006
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: fill_in_blank
  frame:
    text: La {item} ani! ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La mulți ani! bedeutet wörtlich „auf viele Jahre“; man wünscht damit jemandem alles Gute zum Geburtstag oder ein frohes neues Jahr.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit03.lesson02.translate.007
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: Welches Datum ist heute?
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} este astăzi?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce dată este astăzi? fragt nach dem Datum; Ce zi este astăzi? fragt nach dem Wochentag.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit03.lesson03.order.001
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: word_order
  frame:
    text: Mihai, {item} este întâlnirea?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai, {item} este întâlnirea?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Când? fragt nach dem Zeitpunkt; die Antwort nennt Wochentag und Datum ohne Wort für „am“: vineri, întâi august.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit03.lesson03.translate.002
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: translation
  frame:
    text: Wann ist das Treffen?
    language_code: de
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Când este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Bei Tagen und Daten steht kein Wort für „am“: Întâlnirea este vineri, întâi august.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit03.lesson03.choose.003
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lunile bedeutet die Monate: luni, der Plural von lună, plus der Artikel -le; für sich allein bedeutet luni auch Montag.'
    language_code: de
    direction: ltr
