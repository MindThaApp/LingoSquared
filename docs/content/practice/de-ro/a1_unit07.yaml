    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Costă ist das Verb für den Preis; kilogram, piață und die Lebensmittel sind das, was man einkauft.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson01.translate.003
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Costă ist die Form für „es kostet“: Cât costă? fragt nach dem Preis, Costă opt lei nennt ihn.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson01.order.004
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: word_order
  frame:
    text: Costă cinci {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Nach den Zahlen zwei bis neunzehn steht der Plural lei ohne de: opt lei. Ab zwanzig erscheint es: treizeci de lei.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson01.fill.005
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: fill_in_blank
  frame:
    text: Cât {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cât costă? ist die grundlegende Preisfrage; costă ist die Form des Verbs für „es“.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson01.translate.006
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: translation
  frame:
    text: Es kostet acht Lei.
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Lei ist der Plural von leu und steht bei Zahlen: opt lei.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson02.choose.002
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vreau bedeutet „ich will/möchte“; unde bedeutet „wo“, und pot bedeutet in Unde pot...? „ich kann“.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson02.listen.003
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cumpăr heißt „ich kaufe“; nach pot folgt să: pot să cumpăr, „ich kann kaufen“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson02.translate.004
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vreau ist direkt, wie „ich will“; aș dori ist die höflichere Art, um etwas zu bitten.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson02.order.005
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: word_order
  frame:
    text: Cât costă un {item} de roșii?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un {item} de roșii?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Zwischen einer Mengenangabe und dem Gemessenen steht im Rumänischen de: un kilogram de roșii.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson02.order.006
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: word_order
  frame:
    text: Unde pot să {item} roșii?
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să {item} roșii?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Nach pot folgt im Rumänischen să und ein zweites Verb: pot să cumpăr, „ich kann kaufen“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson02.fill.007
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: fill_in_blank
  frame:
    text: Vreau un kilogram de {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cartofi ist Plural; nach un kilogram de bleibt das Gemessene im Plural.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson02.translate.008
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: Wo kann ich Tomaten kaufen?
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să cumpăr {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Roșii ist Plural, daher steht kein un oder o davor; pot să cumpăr bedeutet „ich kann kaufen“.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson02.translate.009
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: Ich möchte ein Kilo Kartoffeln.
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Vreau un kilogram de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un kilogram de plus der Plural cartofi nennt Menge und Ware.
    language_code: de
    direction: ltr
- content_key: practice.de-ro.ro.a1.unit07.lesson02.translate.010
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: Wie viel kostet ein Kilo Tomaten?
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un kilogram de {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât costă fragt nach dem Preis; der Singular costă passt zu einem Kilo.
    language_code: de
    direction: ltr
