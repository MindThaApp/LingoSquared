    language_code: nl
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: On mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'De uitgang -u na w geeft aan waar iemand woont: w Gdańsku.'
    language_code: nl
    direction: ltr
