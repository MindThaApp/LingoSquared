    text: To jest mój {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest mój {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mój hoort bij mannelijke woorden zoals ojciec, brat en dziadek.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson01.order.005
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest moja {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest moja {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja hoort bij vrouwelijke woorden, de meeste daarvan eindigen op -a.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson01.fill.006
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: fill_in_blank
  frame:
    text: To jest {item} ojciec. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Het bezittelijk voornaamwoord past zich aan het zelfstandig naamwoord aan: mój ojciec, maar moja matka.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson01.translate.007
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: Dit is mijn moeder.
    language_code: nl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest {item} matka.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja is het vrouwelijke 'mijn'; het mannelijke 'mijn' is mój.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson01.translate.008
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: Dit zijn mijn ouders.
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To są {item} rodzice.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rodzice is meervoud en verwijst naar personen, dus het bezittelijk voornaamwoord is moi en het werkwoord is są in plaats van jest.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson02.choose.001
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mieć betekent hebben, en de persoon die iets heeft bepaalt de werkwoordsvorm: mam, masz, ma.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson02.translate.002
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieć (hebben) is de woordenboekvorm; in zinnen verschijnt het als mam, masz of ma.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson02.order.003
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: word_order
  frame:
    text: Mam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Na mam krijgt datgene wat je hebt de objectvorm: brat wordt brata en siostra wordt siostrę.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson02.fill.004
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: fill_in_blank
  frame:
    text: Tak, mam brata {item} siostrę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Het woord i verbindt twee dingen, zoals in brata i siostrę, en verandert nooit van vorm.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson02.translate.005
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: Ik heb een zoon en een dochter.
    language_code: nl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam syna i {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Vrouwelijke woorden op -a krijgen als object -ę: córka wordt córkę.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson03.choose.001
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Het Pools gebruikt on voor 'hij' en ona voor 'zij', en het werkwoord mieszka past bij beide.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson03.translate.002
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tylko betekent 'alleen', terwijl lub een 'of' is om alternatieven te geven, zoals in brata lub siostrę.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson03.order.003
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: word_order
  frame:
    text: Mój brat mieszka w {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mój brat mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Na w krijgen plaatsnamen een bijzondere uitgang, zoals in w Gdańsku en w Krakowie.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson03.fill.004
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: fill_in_blank
  frame:
    text: Ona {item} w Krakowie. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieszka is de hij/zij-vorm van het werkwoord, en mieszkam uit de eerste unit is de ik-vorm.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson03.translate.005
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
