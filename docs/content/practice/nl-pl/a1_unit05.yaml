    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Familiewoorden vormen paren naar geslacht: dziadek en babcia, wujek en ciotka, syn en córka.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit05.lesson01.order.004
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
