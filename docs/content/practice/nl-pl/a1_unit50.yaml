  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_miejsce
    - w_początek
    - w_publiczność
    - w_scena
    - w_trwa
    - w_trwać
    - w_wspaniały
    - w_wędrowcy
    - w_zadowolona
    - w_zespołu
    - w_zespół
templates:
