templates:
- content_key: practice.nl-pl.pl.a1.unit02.lesson01.choose.001
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: In het Pools is er geen patroon dat de getallen van één tot tien verbindt, dus je moet elk woord apart leren.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson01.listen.002
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Het Poolse sz klinkt als de sj in sjaal en cz als tsj in tjilpen, dus sześć en cztery beginnen met die klanken.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson01.translate.003
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De slotklank ć in pięć, sześć, dziewięć en dziesięć is een zachte tsj-achtige klank; het accent is belangrijk voor de spelling.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson01.match.004
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Pięć, sześć, dziewięć en dziesięć eindigen op de letter ć, siedem en osiem niet, dus let goed op de spelling.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson01.order.005
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: word_order
  frame:
    text: Mam {item} lat.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} lat.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mam + getal + lat geeft je leeftijd aan, zoals in Mam trzydzieści lat.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson02.listen.001
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ile vraagt naar hoeveel, en kosztuje is het werkwoord dat erbij hoort als je naar een prijs vraagt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson02.choose.002
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: De getallen jedenaście, dwanaście en piętnaście eindigen op -naście, waaraan je de 'tien-getallen' (11–19) herkent.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson02.translate.003
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ile betekent 'hoeveel', zowel bij prijzen als bij telbare dingen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson02.order.004
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: To kosztuje {item} złotych.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje {item} złotych.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Na getallen als pięć, dwanaście of trzydzieści staat złotych, terwijl dwa, trzy en cztery złote krijgen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson02.fill.005
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: To kosztuje dwadzieścia {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Złotych is de vorm die na pięć, dwadzieścia, pięćdziesiąt en vergelijkbare getallen staat; dwa, trzy en cztery krijgen złote.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson02.translate.006
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: Hoeveel kost dit?
    language_code: nl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile to kosztuje? is de standaardvraag naar de prijs, waarbij to 'dit' of 'het' betekent.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson03.choose.001
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pana is het formele 'uw' voor een man (pana numer), terwijl twój het informele 'jouw' is (twój numer).
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson03.translate.002
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Numer telefonu betekent letterlijk 'het nummer van de telefoon'; het tweede woord is een vervormde vorm van het woord voor telefoon.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson03.order.003
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: Jaki jest {item} numer telefonu?
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest {item} numer telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój is het informele 'jouw' en pana het formele 'uw' voor een man; allebei passen ze voor numer telefonu.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson03.fill.004
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: Ile masz {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lat staat na getallen als pięć, dwadzieścia of trzydzieści; lata staat na dwa, trzy, cztery en samengestelde getallen die daarop eindigen, zoals in trzydzieści dwa lata.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson03.translate.005
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Ik ben tweeëndertig jaar oud.
    language_code: nl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam trzydzieści dwa {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Omdat het getal op dwa eindigt, is het woord voor jaren lata en niet lat.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit02.lesson03.translate.006
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Wat is jouw telefoonnummer? (informeel; gebruik jest)
    language_code: nl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest twój {item} telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój is het informele 'jouw'; de formele versie voor een man is Jaki jest pana numer telefonu?
    language_code: nl
    direction: ltr
