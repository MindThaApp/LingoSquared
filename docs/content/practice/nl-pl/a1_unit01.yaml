templates:
- content_key: practice.nl-pl.pl.a1.unit01.lesson01.choose.001
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'In het Pools zijn er twee manieren om "u/jij" te zeggen: ty bij vrienden en familie, en pan (tegen een man) of pani (tegen een vrouw) bij onbekenden en om respect te tonen.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson01.fill.002
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: fill_in_blank
  frame:
    text: Jak się {item} ma? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bij pan of pani is het werkwoord ma, alsof je zegt: hoe gaat het met de heer of mevrouw? Bij ty wordt het masz: Jak się masz?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson01.translate.003
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Pan en pani zijn niet uitwisselbaar: pan gebruik je voor een man en pani voor een vrouw, terwijl ty is voor mensen die je goed kent.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson01.order.004
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: word_order
  frame:
    text: Jak się {item} ma?
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item} ma?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Jak się ma? vraagt hoe het met iemand gaat; pan of pani komt in het midden en het werkwoord blijft ma.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson01.translate.005
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: Hoe gaat het met je? (tegen een vriend, informeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bij een vriend eindigt de vraag op masz; de beleefde vorm gebruikt ma plus pan of pani.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson02.listen.001
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dzień dobry is de groet voor de hele dag tot de avond, dobry wieczór zeg je 's avonds en dobranoc zeg je alleen als je afscheid neemt voor de nacht.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson02.match.002
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cześć is het informele woord voor zowel hallo als tot ziens, dus het hoort bij ty en niet bij pan of pani.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson02.order.003
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Do {item}!
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Do {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Do widzenia is het gewone tot ziens; do zobaczenia is het vriendelijkere tot ziens.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson02.fill.004
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: fill_in_blank
  frame:
    text: Dobry {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dobry wieczór gebruik je 's avonds; overdag zeg je dzień dobry.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson02.translate.005
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cześć werkt zowel als hallo als als tot ziens, maar alleen bij mensen die je met ty aanspreekt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson02.translate.006
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: Een fijne dag!
    language_code: nl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Miłego {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Miłego dnia is een wens, daarom krijgt het woord voor dag de uitgang dnia.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson03.choose.001
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'In het Pools laat men het persoonlijk voornaamwoord meestal weg, omdat de werkwoordsuitgang de persoon aangeeft: jestem betekent ik ben, jesteś betekent jij bent.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson03.listen.002
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jestem z + land zegt waar je vandaan komt, en mieszkam w + stad zegt waar je woont.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson03.translate.003
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De werkwoordsuitgangen geven de persoon aan: -m voor ik (jestem, mieszkam) en -sz of -ś voor informeel jij (masz, jesteś).'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson03.order.004
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: word_order
  frame:
    text: Jestem z {item}, ale mieszkam w Warszawie.
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem z {item}, ale mieszkam w Warszawie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Na z (uit, van) krijgt de landnaam een andere uitgang: Kanady.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson03.fill.005
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: fill_in_blank
  frame:
    text: Czy pan {item} po polsku? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Een beleefde vraag aan een man gebruikt de werkwoordsvorm van de derde persoon: Czy pan mówi po polsku?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson03.translate.006
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: Waar kom je vandaan? (tegen een vriend, informeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Skąd {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Skąd vraagt waarvandaan; bij een vriend is het werkwoord jesteś, terwijl de beleefde vorm Skąd pan jest? is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit01.lesson03.translate.007
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: Zeer aangenaam kennis te maken.
    language_code: nl
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo mi {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bardzo mi miło zegt letterlijk heel aangenaam voor mij en is het gebruikelijke antwoord als je iemand ontmoet.
    language_code: nl
    direction: ltr
