  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'De uitgang -sz kenmerkt informeel ''jij'': chcesz, możesz, masz (jesteś is de uitzondering, met de uitgang -ś).'
    language_code: nl
    direction: ltr
