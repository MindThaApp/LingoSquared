    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziś {item} iść do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Na Chcę volgt een infinitief, dus iść blijft in de hoofdvorm.
