templates:
- content_key: practice.nl-pl.pl.a1.unit11.lesson01.choose.001
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chcę is de ik-vorm van chcieć en chcesz is de jij-vorm, die je gebruikt bij vrienden en familie.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit11.lesson01.listen.002
