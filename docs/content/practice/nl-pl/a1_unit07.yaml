templates:
- content_key: practice.nl-pl.pl.a1.unit07.lesson01.choose.001
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Bij het werkwoord kosztować gebruikt het Pools bijwoorden: kosztuje tanio (is goedkoop) en kosztuje drogo (is duur).'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit07.lesson01.listen.002
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cebula is vrouwelijk omdat het op -a eindigt; banan, pomidor, ogórek en ziemniak zijn mannelijk.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit07.lesson01.order.003
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: word_order
  frame:
    text: Ile kosztuje {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile kosztuje vraagt naar de prijs van één ding, dus het zelfstandig naamwoord blijft in de gewone enkelvoudsvorm.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit07.lesson01.fill.004
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: fill_in_blank
  frame:
    text: Banany {item} tanio. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Het werkwoord past zich aan het aantal aan: kosztuje voor één ding, kosztują voor meer dan één.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit07.lesson01.translate.005
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: Een banaan is goedkoop. (gebruik het werkwoord voor 'kosten')
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Banan kosztuje {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Het Pools zegt letterlijk dat een banaan goedkoop kost, in plaats van een apart adjectief te gebruiken.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit07.lesson01.translate.006
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
