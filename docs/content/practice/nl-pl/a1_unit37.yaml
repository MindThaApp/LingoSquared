schema_version: '1.0'
pack_key: practice.nl-pl.a1.unit37
source_language: nl
target_language: pl
unit_content_key: pl.a1.unit37.kolory
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dutch). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_biały
    - w_chciałaby
    - w_czerwony
    - w_fioletowy
    - w_idą
    - w_językową
    - w_kawiarnię
    - w_koloru
    - w_kończy
    - w_kupują
    - w_kwiatowy
    - w_pomarańczowy
    - w_różowy
    - w_targ
    - w_tulipany
    - w_tulipanów
    - w_tutaj
    - w_upiększają
    - w_wybierasz
    - w_ładne
    - w_żółty
templates:
- content_key: practice.nl-pl.pl.a1.unit37.lesson01.choose.001
  lesson_content_key: pl.a1.unit37.lesson01.czerwony_i_zolty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_tulipany
        - w_tutaj
        - w_czerwony
        - w_żółty
        - w_koloru
        - w_biały
        - w_pomarańczowy
        - w_różowy
        - w_wybierasz
        - w_kończy
        - w_fioletowy
        - w_tulipanów
        - w_idą
        - w_targ
        - w_kwiatowy
        - w_chciałaby
        - w_kupują
        - w_ładne
        - w_upiększają
        - w_kawiarnię
        - w_językową
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een woord uit deze unit, uit de les over rood en geel.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit37.lesson02.listen.001
  lesson_content_key: pl.a1.unit37.lesson02.bialy_i_pomaranczowy
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een woord uit deze unit, uit de les over wit en oranje.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit37.lesson03.translate.001
  lesson_content_key: pl.a1.unit37.lesson03.rozowy_i_fioletowy
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} is een woord uit deze unit, uit de les over roze en paars.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit37.lesson04.match.001
  lesson_content_key: pl.a1.unit37.lesson04.nina_i_ewa_na
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Koppel elk Pools woord aan de Nederlandse betekenis; de woorden komen uit de lessen van dit deel.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit37.lesson05.choose.001
  lesson_content_key: pl.a1.unit37.lesson05.nina_i_ewa_kupuja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over Nina en Ewa die tulpen kopen.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit37.lesson06.translate.001
  lesson_content_key: pl.a1.unit37.lesson06.tulipany_dla_kawiarni_jezykowej
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
