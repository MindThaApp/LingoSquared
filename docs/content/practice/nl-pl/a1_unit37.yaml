  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze les, uit de les over tulpen voor het taalcafé.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit37.lesson01.order.002
  lesson_content_key: pl.a1.unit37.lesson01.czerwony_i_zolty
  type: word_order
  frame:
    text: Tulipany są {item}.
    language_code: pl
