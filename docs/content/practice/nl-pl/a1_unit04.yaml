templates:
- content_key: practice.nl-pl.pl.a1.unit04.lesson01.choose.001
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Klokuren gebruiken vrouwelijke rangtelwoorden (pierwsza, druga, trzecia), omdat ze overeenkomen met het gedachte woord godzina.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson01.listen.002
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Voor kloktijden zegt het Pools pierwsza, druga, trzecia, niet pierwszy, drugi, trzeci.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson01.translate.003
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Uren zijn rangtelwoorden: pierwsza is letterlijk ''eerste'', dus één uur is ''het eerste uur''.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson01.order.004
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: word_order
  frame:
    text: Która jest godzina? Jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Która jest godzina? Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Het antwoord op Która jest godzina? is gewoon Jest + het uur, met het vrouwelijke rangtelwoord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson01.fill.005
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: fill_in_blank
  frame:
    text: Która jest {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Która jest godzina? is de standaardmanier om de tijd te vragen; która is vrouwelijk omdat godzina dat is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson01.translate.006
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: Het is drie uur. (twee woorden)
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Het klokuur is een vrouwelijk rangtelwoord, dus drie uur is trzecia, niet trzy.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson02.choose.001
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rano is 's ochtends, wieczorem 's avonds en w nocy 's nachts.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson02.listen.002
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: In Ewa wstaje o siódmej rano komt eerst het uur en daarna het dagdeel.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson02.translate.003
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje en odjeżdża zijn vormen voor hij/zij/het en eindigen op -e of -a, niet op -m.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson02.match.004
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Rano ('s ochtends) en wieczorem ('s avonds) hebben geen voorzetsel nodig, maar 's middags om twaalf uur en 's nachts zijn w południe en w nocy.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson02.order.005
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: word_order
  frame:
    text: Ewa wstaje o siódmej {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa wstaje o siódmej {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa wstaje o siódmej rano noemt eerst het uur en dan het dagdeel.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson02.order.006
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: word_order
  frame:
    text: Pociąg odjeżdża o czwartej po {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg odjeżdża o czwartej po {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Po południu betekent 's middags', terwijl 'om twaalf uur 's middags' w południe is, met een andere uitgang.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson02.fill.007
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: fill_in_blank
  frame:
    text: Ewa {item} o siódmej rano. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje is de hij/zij-vorm van het werkwoord, en daarom past het bij Ewa.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson02.translate.008
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: Hoe laat? (drie woorden)
    language_code: nl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: O której {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: O której godzinie vraagt 'hoe laat', en beide woorden krijgen de uitgang die na o hoort.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson02.translate.009
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: De trein vertrekt om vier uur 's middags.
    language_code: nl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg {item} o czwartej po południu.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Na o verandert de uitgang van het uur: czwarta wordt o czwartej.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson03.order.001
  lesson_content_key: pl.a1.unit04.lesson03.ustalamy_godzine_spotkania
  type: word_order
  frame:
    text: Dobrze, {item} o czwartej po południu?
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może betekent 'misschien' en maakt een voorstel zachter, zoals in 'Misschien om vier uur?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit04.lesson03.translate.002
  lesson_content_key: pl.a1.unit04.lesson03.ustalamy_godzine_spotkania
  type: translation
  frame:
    text: Oké, misschien om vier uur 's middags?
    language_code: nl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może maakt van een voorstel een beleefde suggestie, zoals in Może o czwartej?
    language_code: nl
    direction: ltr
