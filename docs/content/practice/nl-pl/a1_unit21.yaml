  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over waarom je blij bent.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit21.lesson03.translate.001
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over nerveus zijn voor iets.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit21.lesson04.match.001
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Koppel elk Pools woord aan de Nederlandse betekenis; de woorden komen uit de lessen van dit deel.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit21.lesson05.choose.001
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: multiple_choice
  frame:
