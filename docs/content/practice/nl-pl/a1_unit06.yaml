  feedback_frame:
    text: 'Elk Pools zelfstandig naamwoord heeft een geslacht: chleb en ser zijn mannelijk, kawa, herbata en woda zijn vrouwelijk, en masło en mleko zijn onzijdig.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit06.lesson01.listen.002
