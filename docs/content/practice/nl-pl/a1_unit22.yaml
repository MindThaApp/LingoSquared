    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Koppel elk Pools woord aan de Nederlandse betekenis; de woorden komen uit de lessen van dit deel.
    language_code: nl
