    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over een telefoongesprek na de dienst.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Met wie spreek ik? Z kim rozmawiam? (letterlijk 'met wie praat ik?') is de standaardzin voor een beller die je niet kent; kim is de instrumentalis na z.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Kun je dat herhalen? Możesz (kun je, van móc) + de infinitief powtórzyć (herhalen) + to (dat).
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Praat niet zo snel, alsjeblieft. Nie mów is de ontkennende gebiedende wijs (praat niet); tak szybko betekent 'zo snel'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: Ik hoor je niet goed.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ik kan je niet goed horen. Nie słyszę cię dobrze geeft een probleem met horen aan; cię is de accusatief van ty en dobrze betekent 'goed'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Hoe ging je eerste dienst? Jak ci poszła ...? (letterlijk 'hoe ging ... voor je?') vraagt naar iets wat al gebeurd is. Ci is de datief van ty, en poszła congrueert met het vrouwelijke zelfstandig naamwoord zmiana.
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Zijn eerste dienst ging heel goed. Jego (zijn) verandert nooit en staat voor het zelfstandig naamwoord: jego pierwsza zmiana; het vrouwelijke zelfstandig naamwoord heeft er geen invloed op.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: Het ging heel goed, beter dan ik dacht.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Het ging heel goed, beter dan ik dacht. Poszło is de verleden tijd van iść met de uitgang -o ('het'; hier 'uitpakken'); myślałem is de verleden tijd van myśleć (denken), met de uitgang voor een mannelijke spreker.
    language_code: nl
    direction: ltr
