schema_version: '1.0'
pack_key: practice.en-fa.a2.unit38
source_language: en
target_language: fa
unit_content_key: fa.a2.unit38.indirect_questions
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 37-41 pass; 2 fixes): every slot pool dumped at unit and course scope with the .a2.unit38. filter and every gloss read; sentence frames use single-candidate anchors (1 course-scope candidate each). (1) lesson04 order.006/fill.007/sentence.008 said دفتر ساعت هشت بسته می‌شه (the office closes at eight), contradicting the unit dialogue (the office closes at five); now the unit''s own fact موزه ساعت هشت باز می‌شه / The museum opens at eight o''clock. (2) lesson04.sentence.005 (Go straight ahead.) accepted only the polite مستقیم برید; the English prompt does not mark register and مستقیم برو is taught in A1 unit05, so it is now an accepted_variant. NATIVE FLAGS: bare-word MC pools contain both راست (right) and مستقیم (straight ahead); راست can also mean straight (راست برو), so a راست prompt offering straight ahead as a distractor is arguable. Capacity numbers are in the coordinator report. Authored 2026-11-15 for en-fa A2 unit 38 (indirect questions). Mirrors PR #242 (units 22-26): the backfill emits only unit and lesson tags (en_fa_a2_unit38_words, en_fa_a2_unit38_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two both fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). English source_gloss lexemes and phrase lexemes (word lists and dialogue lines) are not drilled. Spoken Tehrani register; no native review yet (the owner approved unreviewed). NATIVE QUESTIONS: (1) Is ببخشید، می‌دونید موزه کجاست؟ the expected polite form? Recommended: yes. (2) Is دفتر ساعت هشت بسته می‌شه natural word order? Recommended: yes.'
