schema_version: '1.0'
pack_key: practice.en-fa.a1.unit37
source_language: en
target_language: fa
unit_content_key: fa.a1.unit37.colors
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored against docs/content/PRACTICE_PACK_RECIPE.md for the en-fa a1
    colors unit (37 lexemes, 6/6 lessons hostable). Semantic tags used are
    all unit37-exclusive (new_color_word 5, color_state_verb 7,
    colored_object_word 8, color_question_word 3, color_reading_word 4)
    except reviewed_phrase, which was deliberately NOT used in any
    frame-literal template (word_order / fixed-sentence translation) because
    it pools 519 course-wide members -- only used implicitly via the
    lesson-anchored MC/translate reuse pattern (§8), which is safe at any
    scope. §0.1 gloss read: no mis-glosses found; color_state_verb glosses
    ("is X (spoken)") are a little unusual as translation prompts but
    grammatically accurate. §1.1 course-scope check: new_color_word (5) and
    color_state_verb (7) are unit37-exclusive tags (confirmed via a
    corpus-wide grep before authoring), so course scope == unit scope for
    every word_order frame below; all pool members re-read against each
    frame and confirmed grammatical (see per-frame notes at each template).
    20 templates, all 6 lessons covered in recognition + production,
    structured tier covers 5/6 lessons (lesson06 has only 2 lexemes, both
    full-sentence phrases, so no structured template was authorable there
    without forcing an ungrammatical or self-referential frame -- reused the
    lesson06-anchored MC/translate on new_color_word instead per rule 3,
    capacity not padding).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - new_color_word
    - color_state_verb
    - colored_object_word
    - color_question_word
    - color_reading_word

templates:
- content_key: practice.en-fa.fa.a1.unit37.lesson01.choose.001
  lesson_content_key: fa.a1.unit37.lesson01.new_colors_one
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: adjective
      agreement_tags: {semantic: new_color_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is one of this unit''s new color words.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit37.lesson01.translate.002
  lesson_content_key: fa.a1.unit37.lesson01.new_colors_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: adjective
      agreement_tags: {semantic: new_color_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: '{item} is one of this unit''s new color words.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit37.lesson01.order.003
  lesson_content_key: fa.a1.unit37.lesson01.new_colors_one
  type: word_order
  frame: {text: 'موز {item}.', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: verb
      agreement_tags: {semantic: color_state_verb}
  answer_derivation:
    kind: render_frame
    frame: {text: 'موز {item}.', language_code: fa, direction: rtl}
  feedback_frame:
    text: 'موز means "banana"; each option is a fused color-copula form ("is X").'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit37.lesson01.match.004
  lesson_content_key: fa.a1.unit37.lesson01.new_colors_one
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth} · {seventh} · {eighth}'
    language_code: fa
    direction: rtl
  slots:
    first: &unit37_l1_match
      language_code: fa
      part_of_speech: [adjective, noun, phrase]
      agreement_tags: {semantic: [new_color_word, colored_object_word]}
    second: *unit37_l1_match
    third: *unit37_l1_match
    fourth: *unit37_l1_match
    fifth: *unit37_l1_match
    sixth: *unit37_l1_match
    seventh: *unit37_l1_match
    eighth: *unit37_l1_match
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth, seventh, eighth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth, seventh, eighth]
  feedback_frame:
    text: 'These are new color words and the objects they describe in this unit.'
    language_code: en
    direction: ltr

