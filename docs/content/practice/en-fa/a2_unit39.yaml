  fresh_context: 'false'
  notes: 'Authored 2026-11-15 for en-fa A2 unit 39 (passing on a message). Mirrors PR #242 (units 22-26): the backfill emits only unit and lesson tags (en_fa_a2_unit39_words, en_fa_a2_unit39_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two both fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). English source_gloss lexemes and phrase lexemes (word lists and dialogue lines) are not drilled. Spoken Tehrani register; no native review yet (Ramin approved unreviewed). NATIVE QUESTIONS: (1) Is فردا بهت جواب می‌دم natural? Recommended: yes. (2) Is همکارت چی می‌گه؟ natural for what does your colleague say? Recommended: yes.'
