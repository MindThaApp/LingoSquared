schema_version: '1.0'
pack_key: practice.en-fa.a2.unit21
source_language: en
target_language: fa
unit_content_key: fa.a2.unit21.reschedule_appointment
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-11-06 for the new en-fa A2 unit 21 ''Rescheduling an appointment'' (fa.a2.unit21.reschedule_appointment). Pools are the unit''s own first-introduction lexemes only, via curated tags added in scripts/backfill_lexemes.py (FA_A2U21_EXTRA_TAGS): nouns, verbs, function, cant_forms, reasons and one-member anchors (*_single_*). No listen_select (no TTS for fa in the practice runtime). Fixed-sentence translations and fill_in_blank use single-member anchors only and carry accepted_variants for the word orders and pronoun drops the unit teaches. Glosses overridden for the A2 rows of بیاد, قبل and خواهش (inherited A1 glosses hid the sense taught here). NATIVE SPEAKER CHECK: (1) accepted variants for ''Does Saturday suit you?'' include the informal برات as well as the polite براتون; (2) the single-anchor frame ''ببخشید بابت {item}'' (only زحمت fits); (3) ''I''ll call a day before'' as یه روز قبل زنگ می‌زنم; (4) spelling متأسفانه (typed answers use the hamza form; the lesson overlay also accepts متاسفانه, the practice grader does not). Persian-script codepoint purity checked; the prs (Dari) lane was not opened.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_fa_a2_unit21_nouns
    - en_fa_a2_unit21_cant_forms
    - en_fa_a2_unit21_function
    - en_fa_a2_unit21_reasons
    - en_fa_a2_unit21_verbs
    - en_fa_a2_unit21_single_unfortunately
    - en_fa_a2_unit21_single_suits
    - en_fa_a2_unit21_single_trouble
    - en_fa_a2_unit21_single_cant_i
    - en_fa_a2_unit21_single_ill
    - en_fa_a2_unit21_single_call
    - en_fa_a2_unit21_phrases
