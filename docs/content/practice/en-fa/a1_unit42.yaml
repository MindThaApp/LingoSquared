schema_version: '1.0'
pack_key: practice.en-fa.a1.unit42
source_language: en
target_language: fa
unit_content_key: fa.a1.unit42.library
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored against docs/content/PRACTICE_PACK_RECIPE.md for the en-fa a1
    library unit. §0 capacity is the THINNEST unit in this batch: only 9
    lexemes total, and only 4 of 6 lessons have any new fa lexeme
    (lesson01: 1, lesson02: 1, lesson03: 2, lesson04: 2); lesson05
    (reading_library_note) and lesson06 (wrap_up) have ZERO new fa lexemes
    -- unhostable no matter what (§0/§10 rule 1), flagged for the
    coordinator. Semantic tags used: library_word (2, unit42-exclusive),
    return_word (1, unit42-exclusive); تا (lesson03, "until/up to") carries
    NO semantic tag at all and was deliberately left OUT of every slot --
    including it would require omitting the semantic constraint entirely,
    which pools every course-wide fa preposition and was judged too broad
    to be a real, controlled slot (capacity, not padding). person_name
    (course-wide) and reviewed_phrase (course-wide) are used only in
    MC/translate (frame-literal-safe types), never in a fixed frame.
    §0.1: no mis-glosses found. Two structured-tier templates were
    authorable: lesson03.fill.003 narrows return_word by part_of_speech
    (its only member, پس, is the sole adverb) -- frame "کتاب رو {item}
    می‌دم." = "I'll give the book back"; lesson03.order.004 uses
    library_word (2 members, both nouns) in frame "{item} رو می‌خوام." =
    "I want X," grammatical for both کتابخونه and امانت. No
    matching_pairs was authored: the unit's total distinct in-unit pool
    across every safe tag (library_word + return_word + person_name +
    reviewed_phrase) is only 5, below the hard 6-pair floor (rule 5/§16),
    and forcing تا in via an untagged slot would have pooled a huge,
    uncontrolled course-wide preposition set -- correctly left out per
    rule 3 (capacity, don't pad). Only 10 templates total and only 2
    structured-tier templates (below the ≥3 tier floor) -- FLAGGING AS
    CHECKPOINT-THIN (<12 items) AND STRUCTURED-TIER-THIN, a genuine
    capacity ceiling from this unit's real lexeme pool, not an authoring
    shortfall.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - library_word
    - return_word
    - person_name
    - reviewed_phrase

templates:
- content_key: practice.en-fa.fa.a1.unit42.lesson01.choose.001
  lesson_content_key: fa.a1.unit42.lesson01.new_library_one
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, adverb, phrase]
      agreement_tags: {semantic: [library_word, return_word, reviewed_phrase]}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is a library-related word from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit42.lesson01.translate.002
  lesson_content_key: fa.a1.unit42.lesson01.new_library_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
