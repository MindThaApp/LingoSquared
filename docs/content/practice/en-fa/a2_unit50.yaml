schema_version: '1.0'
pack_key: practice.en-fa.a2.unit50
source_language: en
target_language: fa
unit_content_key: fa.a2.unit50.changing_arrangement
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 47-51 pass): 3 fixes - (1) the backfill glosses قطعی as outage (in power outage), while this unit teaches قرارمون قطعی شد (confirmed); every unit-wide slot that admitted adjectives showed that gloss as a correct answer, so those slots now union the lesson01/02/04/06 tags (dropping lesson03, the only one carrying قطعی), and lesson03 choose.001 narrows to noun/verb; lesson06 tag added to tag_schema; (2) added lesson03 translate.002 (noun/verb, unit-wide, 6 candidates) and (3) lesson03 match.004 (noun/verb/adverb, unit-wide, 7) so lesson03 keeps structured and production coverage. Dumped every pool at unit and course scope (unit-only tags) and read every gloss; عقب (behind, as in to be delayed) is loose for عقب بندازیم (postpone) but not wrong. Capacity: 16 templates, R5/S5/P6, 11/31 lexemes hosted (35%), 5/6 lessons (lesson05 has only a phrase lexeme); 19 of the 31 lexemes are card-target phrase lists, so 11 of 12 content lexemes are hosted, all but قطعی. ROUTE: قطعی needs the gloss confirmed / definite for this unit. Authored 2026-11-15 for en-fa A2 unit 50 (changing an arrangement). Mirrors PR #250 (units 27-39): the backfill emits only unit and lesson tags (en_fa_a2_unit50_words, en_fa_a2_unit50_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two or more all fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). Phrase lexemes (word lists and dialogue lines) are not drilled, and tokens first introduced in earlier units belong to those units'' pools. Spoken Tehrani register; no native review yet. NOTE: very thin unit (6 content lexemes): the 12-item checkpoint bar cannot be met from this unit alone; it needs new vocabulary introduced in the unit. NATIVE QUESTIONS: (1) Is فردا نمی‌تونیم بیایم natural? Recommended: yes. (2) Is جمعه ساعت چهار برات خوبه؟ natural? Recommended: yes.'
