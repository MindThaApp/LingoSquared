schema_version: '1.0'
pack_key: practice.en-fa.b1.unit14
source_language: en
target_language: fa
unit_content_key: fa.b1.unit14.reported_messages
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: |-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 4 fixes).
    (1) All six choose templates had no semantic tag (course 449: whole B1 level in Endless) -> unit words (en_fa_b1_unit14_words, 17). (2) The six translate templates likewise untagged -> lesson01/03/04/05/06 words (15): lesson02 is left out because aamaade-st 'is ready' shares its gloss with haazere elsewhere in B1 (underdetermined typed answer). (3) lesson05.match.003 pooled 9 message words for 8 pairs (same cards every time) -> unit words (17). (4) choose feedback 'introduced in this unit' -> 'from this unit'.
    Checked: order.003 'علی گفت که جلسه عقب افتاده.' natural; azam/azat/azesh/behesh carry only pronoun_incorporated_prep and stay out of the pools.
    NATIVE FLAGS: confirm aamaade-st (آماده‌ست) is the spelling the unit wants (spoken also آماده‌س); glosses 'behind (as in to be delayed)' / 'has fallen / has been' describe the idiom 'aghab oftaade' piecewise.

    21 distinct fa lexemes across 6 lessons with lexemes (goft_ke_message, khabar_dad_ke, azm_khast_ke, dialogue_messages, reading_messages, wrapup_production). matching_pairs anchored to reading_messages (8 pairs), pooled over the unit-wide non-proper-noun distinct tokens (21 available). Template mix: recognition(multiple_choice)=6, structured(matching_pairs x2, word_order x1)=3, production(translation)=6, total=15. No listen_select authored (fa has no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes such templates). No mis-glossed lexemes found in this pool (every gloss checked against what the unit realization teaches). Polish 2026-07-25: match.003 slots switched from bare-POS to message_summary_word (9 unit tokens, no course-scope extras) so Endless Practice stays on-theme; added a reporting-verb matching (reported_speech_verb, 8 tokens) and a word_order mirroring the realization (goft ke jalase aghab oftaade) anchored by reported_speech_verb narrowed to part_of_speech adverb (single distinct course candidate aghab).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - message_summary_word
    - reported_speech_verb
    - en_fa_b1_unit14_words
    - en_fa_b1_unit14_lesson01_words
    - en_fa_b1_unit14_lesson03_words
    - en_fa_b1_unit14_lesson04_words
    - en_fa_b1_unit14_lesson05_words
    - en_fa_b1_unit14_lesson06_words
