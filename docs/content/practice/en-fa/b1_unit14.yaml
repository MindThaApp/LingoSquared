schema_version: '1.0'
pack_key: practice.en-fa.b1.unit14
source_language: en
target_language: fa
unit_content_key: fa.b1.unit14.reported_messages
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    21 distinct fa lexemes across 6 lessons with lexemes (goft_ke_message, khabar_dad_ke, azm_khast_ke,
    dialogue_messages, reading_messages, wrapup_production). matching_pairs anchored to reading_messages
    (8 pairs), pooled over the unit-wide non-proper-noun distinct tokens (21 available). Template mix:
    recognition(multiple_choice)=6, structured(matching_pairs x2, word_order x1)=3, production(translation)=6, total=15.
    No listen_select authored (fa has no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes
    such templates). No mis-glossed lexemes found in this pool (every gloss checked against what the unit
    realization teaches).
    Polish 2026-07-25: match.003 slots switched from bare-POS to message_summary_word (9 unit tokens,
    no course-scope extras) so Endless Practice stays on-theme; added a reporting-verb matching
    (reported_speech_verb, 8 tokens) and a word_order mirroring the realization (goft ke jalase aghab
    oftaade) anchored by reported_speech_verb narrowed to part_of_speech adverb (single distinct
    course candidate aghab).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - message_summary_word
    - reported_speech_verb
