- content_key: practice.en-fa.fa.b1.unit14.lesson01.choose.001
  lesson_content_key: fa.b1.unit14.lesson01.goft_ke_message
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
