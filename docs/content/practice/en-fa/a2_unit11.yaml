schema_version: '1.0'
pack_key: practice.en-fa.a2.unit11
source_language: en
target_language: fa
unit_content_key: fa.a2.unit11.banking
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (en-fa/en-prs practice pass, fresh context; 4 fixes across 15
    templates). (1) Answer leakage at A2 in production: the five bare-word translation
    templates used part_of_speech-only pools, which at unit scope include حساب "account;
    bill (in حساب کردن ...)", بانکی "(adjective, from بانک)", لازمه "(contraction of لازم
    است)", ملیم "(short for کارت ملیم)", خونه‌ی "(ezafe form of خونه)", روزی "(indefinite
    form of روز)", تحویل "(in تحویل گرفتن/می‌گیرید ...)", جدیدم "(possessive form of جدید)",
    and at course scope every other A2 gloss of that shape: the English prompt printed the
    Persian answer. Slots now use the unit's own lesson tags plus clean course-wide
    singletons: nouns = money_word/time_period/lesson02/lesson03 (بانک, مدارکتون, صبح,
    بعدازظهر, روز); noun/adj/adv = money_word/time_period/weather_time_word/lesson03 (+
    امروز, لازم); verbs = lesson01/02/04 + accept_word (کردن, می‌تونید, کنید, بکنم, آوردم,
    عالیه, می‌گیرم, می‌گیرید). (2) The five multiple_choice templates had the same untagged
    pools (gloss options containing the token = near-giveaway; off-unit words in Endless
    Practice) and feedback that was false for most of the pool ("appears in the bank
    notice", "is said in the bank counter conversation", "used ... when asking to open an
    account"): same clean pools, feedback now "a word / verb form from this unit's banking
    lessons". (3) The two list word_order frames ("{a} و {b}", "{a}، {b} و {c}") pooled
    every noun, rendering ungrammatical or meaningless lists with the bound forms خونه‌ی /
    روزی / ملیم / رمزش and bare numerals ۸ / ۲ (and 150+ A2 nouns at course scope): now the
    lesson01 + lesson03 nouns (بانک, حساب, رمز, موجودی, صبح, بعدازظهر). (4) The three
    matching_pairs dropped payment_word, which only added حساب with its self-revealing
    gloss. Coverage cost, accepted: رمز, موجودی, آماده, سه, دیگه no longer appear in
    production/MC (their lesson tags also carry leaky tokens). Remaining, backfill-side: the
    lesson04 phrase lexemes are glossed as narration ("سارا says yes, she brought ...", "The
    employee says great -- ...") rather than as translations; بکنم's gloss shows کنم. NATIVE
    FLAGS: none on frames (list frames only use و and ،).

    Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md to unblock this
    unit's checkpoint (the unit had lexemes in scripts/backfill_lexemes.py but no
    practice pack at all, so generate_checkpoint() returned checkpoint_unavailable).


    15 templates across all 4 lessons: multiple_choice x5, matching_pairs x3,
    word_order x2, translation x5 -- 5 per difficulty tier, so all three
    CHECKPOINT_MASTERY_BANDS (0.0/0.5/0.8) have real depth. Every slot is
    satisfiable from THIS unit's own lessons, because generate_checkpoint() calls
    _material() with only this unit's lesson ids.


    SLOT CONSTRAINTS ARE PART-OF-SPEECH ONLY, DELIBERATELY. scripts/backfill_lexemes.py
    never gave fa A2 units 11-18 any unit-specific semantic tags (unlike a2_unit10's
    curated opinion_word/opinion_phrase, or en-nl unit73's job_interview_vocab_pure).
    The only semantic tags reaching these units are course-wide singletons plus the
    auto-derived "reviewed_phrase", none of which isolate this unit. Editing the
    backfill script is out of scope for this pass (recipe DO-NOT #16), so every slot
    is constrained by language_code + part_of_speech. That is exactly unit-scoped at
    checkpoint time; in Endless Practice the same slots pool the whole A2 course, which
    is the known, accepted cost -- see the reviewer notes below.


    NO listen_select (AZURE_SPEECH_KEY is unset, so tts_actually_configured('fa') is
    false and _material() would delete those templates -- recipe DO-NOT #3). NO
    fill_in_blank: the AUTHORING_GUIDE #17 ambiguity check pools candidates across the
    whole en/fa pair, and with no single-member semantic tag available in this unit no
    part-of-speech-only slot can ever have exactly one course-wide candidate. NO
    part_of_speech: phrase anywhere -- four fa A2 "phrase" lexemes carry an English
    parenthetical inside the TOKEN itself ("باز کردن (to open, light verb)" unit11,
    "به خاطر (because of + noun)" unit15, "وقت تلف کردن (to waste time, light verb)"
    unit16, "پس دادن (to return an item, light verb)" unit18) and many phrase glosses are
    third-person narration ("سارا says hello, my bathroom pipe is leaking") rather than
    translations -- both would leak straight into learner-facing options/answers. NO
    proper_noun (self-glossing) and NO symbol/particle/preposition/pronoun in any slot.


    REVIEWER MUST DOUBLE-CHECK:
    (1) Endless Practice pools the whole A2 course for these part-of-speech-only slots.
    The measured course-wide gloss-collision density for the sets actually used is low
    ([noun] 11 near-collisions in 171; [noun, adverb] 14 in 195) but two EXACT duplicate
    glosses exist in fa A2 and are a genuine underdetermined-production risk for the
    typed translation templates: بیایید (unit12) / بیاید (unit13), both glossed
    "come (polite imperative)", and خوب (unit16) / خوبی (unit17), both glossed "good".
    Neither pair can co-occur inside a single unit checkpoint. The real fix is a gloss
    disambiguation in scripts/backfill_lexemes.py, which this pass may not touch.
    (2) Homograph check (defect 1.29): the only fa A2 surface-form homograph is تو
    (pronoun "you" in unit09/unit14-adjacent lessons vs preposition "in/inside/within"
    in unit14). Both senses carry separate part_of_speech values and neither
    part_of_speech is used by any slot in this pack, so no slot here can confuse them.
    (3) Grading now normalizes ZWNJ (U+200C) and harakat (backend/app/review/grading.py),
    so natural correctly-spelled Persian with ZWNJ is used throughout and no ZWNJ-free
    accepted-answer variants are needed.


    Iranian Persian only; the prs (Dari) lane was not opened or consulted at any point
    (defect class 1.28). Persian-script codepoint purity: no Arabic Yeh U+064A and no
    Arabic Kaf U+0643 -- every fa block is direction: rtl and every en block ltr.
    Needs the standard fresh-context review before import.


    MEASURED (recipe #9 step 4, this unit): 46 target-language (fa) lexemes across
    all 4 lessons. Target coverage ALL 74%, recognition 74%, structured 63%,
    production 74% -- and all three tiers host >=1 lexeme in EVERY one of the 4
    lessons (4/4 in each tier). Coverage is quoted against the fa denominator on
    purpose: this unit's lexeme table also holds 38 English "source_gloss" rows
    whose token IS their english_gloss, so they are structurally unhostable in an
    en->fa pack (any slot serving them would render a self-glossing question); they
    inflate the raw denominator to 84 and cost only wasted generation attempts,
    which the checkpoint's max_attempts budget absorbs. No template has a
    zero-candidate slot, no multiple_choice/matching_pairs slot falls under its
    minimum, and no template is thin (every one has >=4 unit-scoped variants; the
    matching_pairs templates are combinatorial). A faithful offline port of
    generate_checkpoint() returns 15/15 DISTINCT items on 5 different RNG seeds,
    with a real 5 recognition / 5 structured / 5 production format mix every time.


    POLISH 2026-07-24 (POS-only matching_pairs fix): the three matching_pairs
    templates now constrain their slots with a semantic union of the tags that
    actually reach this unit's lexemes (reviewed_phrase + money_word +
    payment_word + time_period + weather_time_word, plus accept_word on
    match.003), so Endless Practice no longer pools every A2 noun/adverb into
    the matching exercises. Measured: unit-scope pools 8/8/9 distinct tokens
    (floors 6/6/8), A2 course-scope pools 26-28 clean discriminable vocab
    cards, no duplicate glosses. All non-matching slots remain POS-only as
    documented above (the unit still has no curated unit-specific tag).
