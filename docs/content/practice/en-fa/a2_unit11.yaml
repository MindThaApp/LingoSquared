  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - reviewed_phrase
    - money_word
    - payment_word
    - time_period
    - weather_time_word
    - accept_word
    - en_fa_a2_unit11_lesson01_words
    - en_fa_a2_unit11_lesson02_words
    - en_fa_a2_unit11_lesson03_words
    - en_fa_a2_unit11_lesson04_words
