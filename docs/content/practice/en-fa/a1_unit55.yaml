schema_version: '1.0'
pack_key: practice.en-fa.a1.unit55
source_language: en
target_language: fa
unit_content_key: fa.a1.unit55.gym
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 2 fixes). (1) multiple_choice x3
    and translation x3 had no semantic tag (part_of_speech only), so Endless Practice pooled the
    whole A1 level (~1200 items) while the feedback said "a word introduced in this unit": all
    six now carry en_fa_a1_unit55_words (same 3 items at checkpoint: روزانه, وزنه, خانم شریفی);
    feedback reworded (خانم شریفی is a name phrase, not a word). (2) lesson04.order.003 (bare
    phrase word_order) had no semantic tag (every A1 phrase in Endless Practice): now
    en_fa_a1_unit55_words (خانم شریفی). Frames کارت روزانه می‌خوام. / باشگاه وزنه داره. checked
    against the realization examples: correct. NATIVE FLAGS: none.

    4 distinct fa lexemes across 3 lessons with lexemes (new_gym_one, new_gym_two, gym_dialogue). CAPACITY-THIN
    unit: far below the recipe's 40-distinct-item pack floor and 12-template floor by construction --
    the realization itself introduces very few fa lexemes in this unit (a themed vocabulary unit with
    1-4 content words per lesson plus proper names / a reading sign / a wrap-up sentence). Authored what
    the pool supports; not padded with untaught vocabulary. NO matching_pairs authored: unit-wide distinct-token
    pool (3 non-proper, 4 total) is below the 6-pair floor. No word_order/fill_in_blank authored either
    -- no verb/sentence structure in this unit supports a safe course-scope-grammatical frame without
    forward-referencing or excluding proper nouns from an already-thin pool. Structured tier is genuinely
    capacity-blocked for this unit; flagging rather than padding. Proper nouns (شریفی) excluded from multiple_choice
    and matching_pairs (self-gloss transliteration, near-trivial); reached only via the dedicated proper_noun
    translation drill(s). Template mix: recognition(multiple_choice)=3, structured(matching_pairs)=0,
    production(translation)=4, total=7. No listen_select authored (fa has no TTS configured -- AZURE_SPEECH_KEY
    unset -- _material() deletes such templates). No mis-glossed lexemes found in this pool (every gloss
    checked against what the unit realization teaches).
    POLISH 2026-07-24 (wave 2): the earlier "structured tier is capacity-blocked" claim was too
    strong -- matching_pairs stays impossible (4 unit tokens < 6-pair floor), but word_order has no
    candidate floor and the unit realization provides safe hero frames. Structured tier brought 0 ->
    3 live word_order templates, each mirroring a realization example sentence: lesson01.order.003
    ("کارت {item} می‌خوام." -> "کارت روزانه می‌خوام."; gym_word+adjective = روزانه, single member
    course-wide), lesson02.order.003 ("باشگاه {item} داره." -> "باشگاه وزنه داره."; gym_word+noun =
    وزنه, single member course-wide), lesson04.order.003 (bare '{item}' phrase word_order over the
    unit's reviewed phrase خانم شریفی; a bare frame is grammatical for every course-scope phrase).
    No frame word is a slot candidate. Template mix now: recognition=3, structured=3 (word_order),
    production=4, total=10.

    Added 2026-10-25 (session 12): two fill_in_blank, two word_order and two fixed-sentence translation templates over the unit's dialogue sentences, because the unit's checkpoint returned only 9 items; each slot is single-candidate (gym_word with the noun / adjective part of speech), no frame word is a candidate, no vocabulary added. NATIVE FLAGS: accepted variants (یه for یک, dropped یک, دارین for دارید) need a native glance.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - gym_word
    - en_fa_a1_unit55_words
