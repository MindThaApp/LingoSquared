schema_version: '1.0'
pack_key: practice.en-fa.b1.unit17
source_language: en
target_language: fa
unit_content_key: fa.b1.unit17.advice_and_suggestions
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: |-
    2026-11-06 fresh-context review (Claude Sonnet, cold). Checked Iranian colloquial register (اگه / می‌شه / می‌رسن / فکر خوبیه), ZWNJ in می‌ forms, language_code on text blocks, no answer leakage in prompts and options, distractor plausibility, grammar notes and continuity with fa B1 units 01-16. Widened accepted_answers with natural variants (که after پیشنهاد می‌کنم, چرا فردا نمی‌ری پیش دکتر, دو تا دوست, و بعد, آخرش می‌رسن خونه, من before verbs, امشب before بهتره). NATIVE FLAG: none blocking; a native pass may still polish word choice.
    Authoring notes: Authored 2026-11-06 with the unit (en-fa B1 slot fill). Capacity-thin like units 15-16: the unit introduces few new fa lexemes per lesson, so bare-word templates pool over the unit-wide tag and word_order frames use single-member anchor tags. NATIVE FLAGS: the pooled bare-word glosses come from earlier-level glosses for a few shared tokens; check them in the native pass.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_fa_b1_unit17_words
    - advice_sleep_verb
    - advice_drink_verb
    - negative_suggestion_verb
