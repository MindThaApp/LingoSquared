schema_version: '1.0'
pack_key: practice.en-fa.a2.unit41
source_language: en
target_language: fa
unit_content_key: fa.a2.unit41.the_best
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 37-41 pass; 1 fix): every slot pool dumped at unit and course scope with the .a2.unit41. filter and every gloss read. (1) lesson02.order.005 این آپارتمان از اون {item}. drew lesson02 verbs, so it could render the ungrammatical این آپارتمان از اون قشنگه / نزدیکه / بزرگ‌ترینه (a comparison with از needs a comparative); the slot now uses the comparative_word tag: 4 unit-scope candidates (بزرگ‌تره، کوچیک‌تره، ارزون‌تره، گرون‌تره) and 5 course-scope (adds بهتره from unit10), all grammatical. Other frames re-read at course scope: گوشی {item} بود (10 adjectives, the unit itself uses ارزون‌ترین بود), این گوشی {item} داره (camera, battery), من {item} رو دوست دارم (sea, mountain), اون گوشی {item} (گرون‌تره، ارزون‌ترینه) are grammatical for every member. Capacity: 20 templates (R6/S8/P6), 45/60 lexemes hosted (75%) in every tier, 6/6 lessons, no dead templates, MC pools >= 3 glosses, matching pools >= 6. Authored 2026-11-15 for en-fa A2 unit 41 (comparing and the best). Mirrors PR #250 (units 27-39): the backfill emits only unit and lesson tags (en_fa_a2_unit41_words, en_fa_a2_unit41_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two or more all fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). Phrase lexemes (word lists and dialogue lines) are not drilled, and tokens first introduced in earlier units belong to those units'' pools. Spoken Tehrani register; no native review yet. NATIVE QUESTIONS: (1) Is گوشی بهترین بود / این آپارتمان از اون قشنگه natural? Recommended: yes. (2) Are the spoken -e forms (ارزونه, گرونه, بزرگه) accepted as separate vocabulary? Recommended: yes.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_fa_a2_unit41_lesson01_words
    - en_fa_a2_unit41_lesson02_words
    - en_fa_a2_unit41_lesson03_words
    - en_fa_a2_unit41_lesson05_words
    - en_fa_a2_unit41_lesson06_words
    - en_fa_a2_unit41_words
    - comparative_word
