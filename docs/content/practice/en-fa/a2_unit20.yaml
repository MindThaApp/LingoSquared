unit_content_key: fa.a2.unit20.holiday_plans
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-11-06 for the new en-fa A2 unit 20 ''Holiday plans'' (fa.a2.unit20.holiday_plans). Pools are the unit''s own first-introduction lexemes only, via curated tags added in scripts/backfill_lexemes.py (FA_A2U20_EXTRA_TAGS): nouns, family, seasons, adverbs, verbs, you_forms, plan_words, convo and one-member anchors (*_single_*). No listen_select (no TTS for fa in the practice runtime). Fixed-sentence translations and fill_in_blank use single-member anchors only and carry accepted_variants for the word orders and pronoun drops the unit teaches (من / ما dropped or added, به before the place, یه / یک). NATIVE SPEAKER CHECK: (1) glosses of the Iranian month names (مرداد, تیر) as shown in matching and multiple choice; (2) the word_order frame ''{season} می‌رم شمال'' with مرداد and تیر; (3) the fill_in_blank شاید _ برم شمال: only شاید fits before the short verb برم; (4) accepted variants for the fixed sentences, especially ''مرداد به ترکیه می‌رم''. Persian-script codepoint purity checked; the prs (Dari) lane was not opened.'
