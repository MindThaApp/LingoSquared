schema_version: '1.0'
pack_key: practice.en-fa.a1.unit45
source_language: en
target_language: fa
unit_content_key: fa.a1.unit45.pharmacy

review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 3 fixes). (1) lesson01.order.003
    'روی نسخه نوشته {item}.' used نسخه (prescription), first taught at A2, and read oddly with
    قبل/روزی/داروخانه: frame is now 'این {item} خوبه.' (the dialogue's 'این قرص خوبه') over the
    lesson01/02 nouns (داروخانه, قرص). (2) lesson02.order.003 'اینجا نوشته {item}.' gave 'اینجا
    نوشته قبل/روزی': frame is now the taught dosage phrase 'روزی دو تا {item}.' anchored on lesson02
    (قرص). (3) lesson03.fill.003 'قرص رو {item} از غذا بخورید.' also accepts بعد (taught, and what
    the pharmacist actually says), but only قبل was graded right: frame now ends '، نه بعد از غذا'
    so only قبل fits; feedback no longer says 'the only adverb in this unit's pharmacy vocabulary'.
    NATIVE FLAGS: none new. Gloss lane: روزی 'day (indefinite form, e.g. the day that.../what day)'
    is taught here as 'per day, daily' ('روزی دو تا'); proposed gloss 'per day, a day'.

    THIN UNIT -- flagging per recipe §0/§3 "capacity, don't pad". Pharmacy has
    only 5 distinct fa lexemes total per backfill_lexemes_en_fa across all 4
    lessons: pharmacy_word 4 (داروخانه "pharmacy" noun, قرص "pill/tablet"
    noun, قبل "before" adverb, روزی "day"/dosage-frequency noun) + 1
    person_name (صالحی, lesson04 only, no other content word in lesson04).
    9 templates total (below the 12 floor -- this is real capacity, not an
    authoring shortfall): 4 lessons x (multiple_choice + bare-word
    translation) over the full 5-token union, plus 1 word_order anchored
    lesson01 over pharmacy_word (frame "روی نسخه نوشته {item}." / "It says on
    the prescription: {item}.") -- re-read at course scope: pharmacy_word is a
    unit-specific coined tag with zero course-wide members outside this unit
    (verified via full iter_specs() scan), so course scope == unit scope here,
    and all 4 members (pharmacy, pill/tablet, before, day) read grammatically
    in that frame (a pharmacy name, a medication, a timing instruction, or a
    dosage frequency, all plausible things written on a prescription).
    matching_pairs is NOT authorable: the unit's total distinct-token pool
    (5) is below the 6-pair floor even after unioning every available tag
    (pharmacy_word + person_name) -- there is no additional vocabulary to pad
    with without violating the no-padding rule. No mis-glossed lexemes found.
    No listen_select (Azure TTS key unset for fa).
    POLISH 2026-07-24: structured tier brought to 3 (was 1). Added
    lesson02.order.003, a second citation-style word_order over pharmacy_word
    (frame "اینجا نوشته {item}." / "Here it says: {item}." -- same
    course==unit scope argument as lesson01.order.003, all 4 members read as
    something written on a sign/label). Added lesson03.fill.003, a
    fill_in_blank whose slot narrows pharmacy_word by part_of_speech: adverb
    -- قبل is the tag's ONLY adverb across the entire direction (verified via
    iter_specs()), so the course-wide candidate pool is exactly 1 and the
    single-candidate compiler rule is satisfied (the earlier note claiming
    fill_in_blank was unusable overlooked this POS narrowing); frame "قرص رو
    {item} از غذا بخورید." has visible text besides the blank and none of the
    slot's candidates appear in the frame literals.
    UPDATED (proper_noun self-gloss sweep): removed proper_noun from every
    MC/translation slot's part_of_speech (was [noun, adverb, proper_noun])
    and dropped person_name from those same slots' semantic list, since a
    name lexeme (صالحی) entering the pool was a self-gloss risk. This
    naturally excludes صالحی (its part_of_speech is proper_noun, not
    noun/adverb) -- pool is now the 4-member pharmacy_word set only, all
    distinct glosses, no floor concern (translation/MC still clear 3).

    Added 2026-10-25 (session 12): four word_order / fill_in_blank templates over the unit's own dialogue sentences (before-food question, where-is-the-pharmacy, two-pills-a-day) because the unit's checkpoint returned only 12 items; every slot is single-candidate (unit lesson tag or part of speech), no frame word is a candidate, no vocabulary added. NATIVE FLAGS: none.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - pharmacy_word
    - person_name
    - en_fa_a1_unit45_lesson01_words
    - en_fa_a1_unit45_lesson02_words
    - en_fa_a1_unit45_lesson03_words
templates:
# --- lesson01 (new_pharmacy_one) ---
- content_key: practice.en-fa.fa.a1.unit45.lesson01.choose.001
  lesson_content_key: fa.a1.unit45.lesson01.new_pharmacy_one
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, adverb]
      agreement_tags:
        semantic: pharmacy_word
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is pharmacy vocabulary from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit45.lesson01.translate.002
  lesson_content_key: fa.a1.unit45.lesson01.new_pharmacy_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, adverb]
      agreement_tags:
        semantic: pharmacy_word
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Farsi word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit45.lesson01.order.003
  lesson_content_key: fa.a1.unit45.lesson01.new_pharmacy_one
  type: word_order
  frame:
    text: این {item} خوبه.
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech: [noun]
      agreement_tags:
        semantic: [en_fa_a1_unit45_lesson01_words, en_fa_a1_unit45_lesson02_words]
  answer_derivation:
    kind: render_frame
    frame:
      text: این {item} خوبه.
      language_code: fa
      direction: rtl
  feedback_frame:
    text: 'این {item} خوبه. -- "This ... is good": این comes before the noun and خوبه closes the sentence.'
    language_code: en
    direction: ltr

