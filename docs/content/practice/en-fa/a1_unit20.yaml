schema_version: '1.0'
pack_key: practice.en-fa.a1.unit20
source_language: en
target_language: fa
unit_content_key: fa.a1.unit20.clothing
review:
  status: reviewed
  fresh_context: true
  notes: 'Authored 2026-07-09 (en-fa overnight units-20+ practice-depth pass, closing the gap where real lesson content had
    grown to a1_unit43+ with zero Endless Practice coverage past unit19). Extends scripts/backfill_lexemes.py''s UNIT_FILES
    tuple with unit20''s own realization/overlay pair, plus 16 new FA_GLOSSES entries, 8 new FA_ADJECTIVES entries (colors
    + sizes + قشنگ), 1 new FA_VERBS entry (قشنگه, the established colloquial -e-copula-contraction precedent), and 6 new semantic
    tags (see backfill_lexemes.py''s own unit20 comment block in fa_agreement_tags() for the full per-tag rationale).

    Six semantic groups, all verified via scripts/_practice_slot_check.py: "clothing_word" pools the 4 clothing-item nouns
    (پیراهن/شلوار/کفش/کت) plus قشنگ (mixed noun/adjective, 5 members, anchored lesson01, mirrors the realization''s own 5-pair
    match_clothing_words exercise). کت is additive here on top of its existing unit07 "coat" entry -- same referent (a jacket/coat),
    reused not re-glossed. "clothing_item_word" is the narrower additive noun-only subset (4 members) used for this pack''s
    generative templates, since قشنگ can''t grammatically fill "{X} می‌خوام" or "این {X} چنده؟". "color_full_word" pools رنگ
    with the 4 color adjectives (5 members, anchored lesson02, mirrors the realization''s own 5-pair match_colors exercise);
    "color_word" is the narrower additive adjective-only subset (4 members) for the generative "یه {item} {color} می‌خوام"
    template, directly mirroring lesson06''s own real dialogue line "یه پیراهن آبی می‌خوام". "size_ full_word" pools سایز
    with the 3 size adjectives (4 members, anchored lesson03, mirrors the realization''s own 4-pair match_sizes exercise);
    "size_word" is the narrower additive adjective-only subset (3 members) for the generative "سایز {size}" template mirroring
    lesson03''s own real "سایز بزرگ" exercise. "try_on_phrase" pools the one non-colliding auto-derived lesson04 phrase lexeme
    ("می‌تونم امتحانش کنم؟") with the two individual review tokens بله/بفرمایید (3 members, mixed phrase/particle/verb, translation/matching-only,
    below the multiple_choice threshold -- same mixed-type class as e.g. unit17''s own help_word).

    Real dead-anchor bug caught and fixed live (not left in): unit20''s own lesson04 "بله، بفرمایید." (kind: phrase, "Yes,
    go ahead [and try it on]") is byte-identical to unit06''s restaurant dialogue''s own "بله، بفرمایید." (lesson06.teach.turn03,
    a waiter confirming an order) -- the phrase-auto-derivation code in _classify_fa uses fa_specs.setdefault() keyed on (level,
    target_text), so without a fix unit20''s occurrence would have silently been swallowed into unit06''s OLD anchor/gloss
    ("The waiter confirms and hands over the menu."), and worse, an un-scoped semantic-tag rule would have ALSO mistakenly
    tagged unit06''s own unrelated phrase as try_on_phrase (since fa_agreement_tags() is a pure function of token+lesson_key,
    not aware of which unit "owns" a given text). Fixed two ways: (1) a new discriminator key ("trying_on_clothes") for unit20''s
    own occurrence in _classify_fa, mirroring the already-established تو location_prep homograph-split pattern, so iter_specs()
    itself yields correct, separately-anchored data for both senses; (2) this pack deliberately does NOT use that specific
    phrase text as a slot member despite the fix -- both senses still collapse to one physical Lexeme row at real DB-persistence
    time (main()''s existing-row lookup matches on token+part_of_speech only, which is identical for both senses), so a generated
    practice item drawing on it could end up with whichever sense''s gloss was written to the DB last. try_on_phrase uses
    بله/بفرمایید as individual review tokens instead, sidestepping the collision entirely (each is its own long-established,
    non-colliding Lexeme, unaffected by this fix or bug).

    Lesson-anchor check: lesson01 (clothing items), lesson02 (colors), lesson03 (sizes), lesson04 (trying on), and lesson05
    (label + full item+color+size request sentence) each genuinely introduce new vocabulary or a new generative sentence pattern
    (confirmed by reading the realization file directly) -- safe anchors. lesson06 hosts a combined review matching_pairs
    template pooling clothing_item_word (4) + color_word (4) + size_word (3) into one 11-pair exercise, the same "final unit
    review" pattern a1_unit17''s/a1_unit19''s own packs already established. lesson05''s own word_order template combines
    all three generative tags (clothing_item_word x color_word x size_word) in the exact real order the realization''s own
    writing_prompt exercises teach: "{item} {color} سایز {size} می‌خوام" mirrors lesson05''s own "پیراهن قرمز سایز بزرگ می‌خوام"
    (and lesson06''s "پیراهن آبی سایز متوسط می‌خوام") verbatim.

    Zero fill_in_blank templates, same standing en-fa precedent as every prior unit in this direction (03-19). scripts/_fill_in_blank_
    ambiguity_check.py reports zero flags. Verified with scripts/ _practice_slot_check.py against backfill_lexemes.py''s actual
    iter_specs() output -- clean, no zero-candidate slots, no under-3 multiple_choice/matching_pairs slots (try_on_phrase
    correctly has only 3 candidates and is never used for multiple_choice here, only matching_pairs/translation). compile_content.py
    practice-validate clean (0 errors/0 warnings). Needs the standard fresh-context review before import.


    REAUTH PASS 2026-07-24 (unit-scope DEAD-template fix, PACK-ONLY): scripts/_practice_unit_scope_check.py found 3 DEAD +
    2 below-floor matching_pairs, all the same root cause -- کت (clothing_word) is anchored to unit07, not unit20, so clothing_word''s
    real unit-scoped pool is 4 not 5; similarly clothing_item_word is 3 not 4. clothing_match.002 (declared 5, unit-scoped
    4 -> DEAD), color_match.002 (declared 5, at its own native ceiling -> below the 6-pair floor), size_match.002 (declared
    4, at its own native ceiling -> below floor), try_on_match.001 (declared 3, unit-scoped try_on_phrase pool is 1 since
    بله/بفرمایید are unit01/unit02, not unit20 -> DEAD), and unit_review_match.001''s cw1-4 group (used clothing_item_word,
    unit-scoped 3 -> DEAD). Fix: added one new shared slot preset "unit20_wide_word" unioning this unit''s own already-declared
    clothing_word + color_full_word + size_full_word + try_on_phrase tags (all reused verbatim, no new backfill tags) --
    unit-scoped pool 14 distinct words/phrases. Re-anchored all four standalone matching_pairs templates to it at 6 slots
    each (clears both the DEAD and the 6-pair floor). unit_review_match.001''s cw group swapped from clothing_item_word to
    clothing_word (id001, 4 native members, matches its own declared 4 slots exactly) -- col/sz groups were already correct
    and untouched. No mis-glossed lexemes found in this unit''s pool. Verified: 0 DEAD, 0 below-floor for this pack per the
    unit-scope checker; practice-validate 0 errors (see coordinator report for the exact invocation covering all 5 units
    in this batch).'
