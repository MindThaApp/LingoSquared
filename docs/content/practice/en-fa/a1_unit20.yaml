    semantic:
    - clothing_word
    - clothing_item_word
    - color_full_word
    - color_word
    - size_full_word
    - size_word
    - try_on_phrase
    - volume_en_fa_a1_unit20_size_word_10_single
    - volume_en_fa_a1_unit20_color_word_12_single
slot_presets:
  clothing_word: &id001
    language_code: fa
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: clothing_word
  clothing_item_word: &id002
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic: clothing_item_word
  color_full_word: &id003
    language_code: fa
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: color_full_word
  color_word: &id004
    language_code: fa
    part_of_speech: adjective
    agreement_tags:
      semantic: color_word
  size_full_word: &id005
    language_code: fa
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: size_full_word
  size_word: &id006
    language_code: fa
