review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 47-51 pass): 9 fixes - the pack had 5 templates, no template for lesson03 (5 lexemes), one recognition template and one production template, so the unit could not reach a balanced checkpoint; the backfill now gives the unit 14 content lexemes. Added (1) lesson01 choose.004 and (2) translate.005 over the unit-wide tag (14 candidates), (3) lesson02 translate.010 over the lesson02 tag (9), (4) lesson02 order.011 and (5) sentence.012 on the single-candidate adjective anchor مبارک (تولد مبارک!, the unit''s own phrase), (6) lesson03 choose.001 and (7) translate.002 over the lesson03 tag (4), (8) lesson03 match.003 over the unit-wide tag; (9) match.009 feedback named the because-and-so lesson, which has no lexemes; now names news, celebrations and feelings. Dumped every slot pool at unit and course scope (the tags are unit-only, so both scopes match) and read every gloss: no wrong glosses (ناراحت carries sad while the unit teaches upset; close enough to show as the answer). Capacity: 13 templates, R3/S5/P5, 14/18 lexemes hosted (78%), all 3 lessons with lexemes in every tier; the 4 unhosted lexemes are card-target phrase lists. Authored 2026-11-15 for en-fa A2 unit 48 (a message to a friend). Mirrors PR #250 (units 27-39): the backfill emits only unit and lesson tags (en_fa_a2_unit48_words, en_fa_a2_unit48_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two or more all fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). Phrase lexemes (word lists and dialogue lines) are not drilled, and tokens first introduced in earlier units belong to those units'' pools. Spoken Tehrani register; no native review yet. NOTE: very thin unit (2 content lexemes: فعلا, کادو): most Block G tokens were introduced in earlier units, so the 12-item checkpoint bar cannot be met from this unit alone; it needs new vocabulary introduced in the unit. NATIVE QUESTIONS: (1) Is باشه. فعلا! natural for okay, bye for now? Recommended: yes. (2) Is جمعه رفتم تولد دوستم و کادو خریدم natural? Recommended: yes.'
