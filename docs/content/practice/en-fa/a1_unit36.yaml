schema_version: '1.0'
pack_key: practice.en-fa.a1.unit36
source_language: en
target_language: fa
unit_content_key: fa.a1.unit36.personality
review:
  status: unreviewed
  fresh_context: 'false'
  notes: Authored 2026-07-12 as an additive Endless Practice coverage backfill for en-fa A1 unit 36. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.
    POLISH 2026-07-24 -- (1) matching_pairs stay POS-only BY NECESSITY, honest note per rubric; this unit's fa lexemes
    carry NO semantic tags at all (only reviewed_phrase, whose members are long metalinguistic strings unusable as
    cards), so no semantic union can cover 6 clean tokens; instead both matchers were narrowed from the 9-POS
    everything list to [noun, verb, adjective, adverb] (drops the metalinguistic phrase monsters and function words
    from the cards; unit pool still 32 tokens) and expanded from the defective 4 slots to the standard 6 (recipe
    S6.3, never 2-4). At COURSE scope these pools still pull the whole level's content words -- off-theme pairs in
    Endless Practice remain possible; fixing that needs semantic tags in backfill_lexemes, out of scope here.
    (2) Tier-thinness fixed with unit-native POS pools -- +2 recognition MC (lesson02 adjectives, 9 tokens/9 glosses;
    lesson03 spoken verb forms, 14 tokens/14 glosses), +1 structured (lesson02 adjective-only 6-slot matching), +1
    production (lesson02 adjective bare-word translation). No word_order was added because with zero semantic tags any slot
    is POS-only, and the course-wide adjective/verb pools include numbers and fused-copula forms (بزرگه, شلوغه) that
    are ungrammatical in any predicate frame -- a citation frame was judged padding, so structured depth comes from
    matching_pairs instead.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
slot_presets:
  unit_word:
    language_code: fa
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
templates:
- content_key: practice.en-fa.fa.a1.unit36.lesson01.choose.001
  lesson_content_key: fa.a1.unit36.lesson01.personality_words_one
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - symbol
      - noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Choose the English meaning of {item}.
    language_code: en
    direction: ltr
- content_key: practice.en-fa.fa.a1.unit36.lesson01.match.002
  lesson_content_key: fa.a1.unit36.lesson01.personality_words_one
  type: matching_pairs
  frame:
    text: '{first} — {second} — {third} — {fourth} — {fifth} — {sixth}'
    language_code: fa
    direction: rtl
  slots:
    first: &u36_content_word
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
    second: *u36_content_word
    third: *u36_content_word
    fourth: *u36_content_word
    fifth: *u36_content_word
    sixth: *u36_content_word
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each word with its English meaning.
    language_code: en
    direction: ltr
