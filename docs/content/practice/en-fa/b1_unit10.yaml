- content_key: practice.en-fa.fa.b1.unit10.lesson01.choose.001
  lesson_content_key: fa.b1.unit10.lesson01.subject_relative
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - pronoun
      - adverb
      - verb
      - noun
      - preposition
      - adjective
      - particle
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
    language_code: en
    direction: ltr
- content_key: practice.en-fa.fa.b1.unit10.lesson01.translate.002
  lesson_content_key: fa.b1.unit10.lesson01.subject_relative
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: fa
      part_of_speech:
