review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-11-15 for en-fa A2 unit 25 ''Have you ever'' (fa.a2.unit25.have_you_ever). No curated single-member tags exist for this unit in the en-fa backfill, so pools are unit/lesson tags narrowed by part_of_speech; the one-member anchors are tag+POS combinations resolving to one token (پارسال via lesson03 adverb, دیده via lesson02 noun). No listen_select (no fa TTS). EXCLUDED: the English source_gloss lexemes; منم (glossed ''it''s me'', but the unit uses آره، منم = yes, me too; mis-glossed, and it is the only lesson04 content word, so lesson04 is reached only through the phrase pool); شیراز and آره carry no unit tag (not reachable). Lessons 05 and 06 hold only English junk lexemes and cannot be covered by any fa template. Glosses left in pools: بار ''time(s); occurrence'' (curated sport_question_word tag), غذای ''food of; food (linked form)'', سوار ''riding; mounted'' (unit: سوار اسب = on horseback), دیده labelled noun (it is a past participle), رفته‌م/رفته‌ام differ only in spoken/written (both glossed ''I have gone'', with (spoken)/(written)). NATIVE SPEAKER CHECK: (1) پارسال شیراز رفتم and the variants; (2) اون این فیلم رو دیده as the answer for ''He has seen this film'' (also acceptable: فیلم رو دیده); (3) whether the spoken forms رفته‌م/رفته‌ای/رفته‌یم/رفته‌این/رفته‌ن are right for the Tehran colloquial lane (many speakers say رفتم/رفتی for the perfect). Backfill fix wanted: gloss for منم, POS for دیده.'
