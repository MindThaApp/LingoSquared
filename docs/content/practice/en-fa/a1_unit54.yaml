schema_version: '1.0'
pack_key: practice.en-fa.a1.unit54
source_language: en
target_language: fa
unit_content_key: fa.a1.unit54.park
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    8 distinct fa lexemes across 4 lessons with lexemes (new_park_one, new_park_two, reading_park_sign,
    wrap_up). CAPACITY-THIN unit: far below the recipe's 40-distinct-item pack floor and 12-template floor
    by construction -- the realization itself introduces very few fa lexemes in this unit (a themed vocabulary
    unit with 1-4 content words per lesson plus proper names / a reading sign / a wrap-up sentence). Authored
    what the pool supports; not padded with untaught vocabulary. matching_pairs anchored to new_park_two
    (6 pairs), pooled over the unit-wide non-proper-noun distinct tokens (7 available). Proper nouns (ملت)
    excluded from multiple_choice and matching_pairs (self-gloss transliteration, near-trivial); reached
    only via the dedicated proper_noun translation drill(s). Template mix: recognition(multiple_choice)=4,
    structured(matching_pairs)=1, production(translation)=5, total=10. No listen_select authored (fa has
    no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes such templates). No mis-glossed
    lexemes found in this pool (every gloss checked against what the unit realization teaches).
    POLISH 2026-07-24 (wave 2): match.003's bare-POS slots replaced with the semantic union
    [park_word, reviewed_phrase] -- same 7 unit-scoped fills at checkpoint (4 park words + 3 unit
    phrases), but Endless Practice no longer pulls the whole level's vocab. Structured tier brought
    to 3 live: added lesson02.order.004 ("پارک قدم {item}؟" -- mirrors the lesson02 example
    "پارک قدم بزنیم؟"; slot narrowed to park_word verbs so بزنیم is the only member course-wide)
    and lesson05.order.003 (bare '{item}' phrase word_order, arrange-the-sentence over the unit's
    own reviewed phrases; a bare frame is grammatical for every course-scope phrase). Template mix
    now: recognition=4, structured=3 (1 matching + 2 word_order), production=5, total=12.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - park_word
    - reviewed_phrase
templates:
- content_key: practice.en-fa.fa.a1.unit54.lesson01.choose.001
  lesson_content_key: fa.a1.unit54.lesson01.new_park_one
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
    language_code: en
    direction: ltr
- content_key: practice.en-fa.fa.a1.unit54.lesson01.translate.002
  lesson_content_key: fa.a1.unit54.lesson01.new_park_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
