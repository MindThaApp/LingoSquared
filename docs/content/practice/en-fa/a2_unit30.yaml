schema_version: '1.0'
pack_key: practice.en-fa.a2.unit30
source_language: en
target_language: fa
unit_content_key: fa.a2.unit30.ability_possibility
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 27-31 pass): 0 fixes. Dumped every slot pool at unit and course scope and read every gloss. ROUTING: the backfill glosses زدن as "to ring / to hit (as in ''to call'')", but this unit teaches it only in گیتار زدن (to play the guitar); it is shown as the answer in the lesson01 MC and translation pools and the verb matching pairs; kept, since excluding it would drop every lesson01 verb. All sentence anchors (امشب, ممکنه, جلسه, بتونم, اشکالی) have one course-wide candidate; ممکنه {item} fits نرم and نیام, آخر هفته {item} fits آزادم and مشغولم; no self-reference; every fixed English prompt matches its single rendered answer. Capacity: 30 live templates, no dead or under-floor template, every tier hosts 27/38 lexemes (71%) and 5/5 lessons with lexemes (lesson05 has none). NATIVE FLAGS: none new. Authored 2026-11-15 for en-fa A2 unit 30 (ability and possibility). Mirrors PR #242 (units 22-26): the backfill emits only unit and lesson tags (en_fa_a2_unit30_words, en_fa_a2_unit30_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two both fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). English source_gloss lexemes and phrase lexemes (word lists and dialogue lines) are not drilled. Spoken Tehrani register; no native review yet (the owner approved unreviewed). NATIVE QUESTIONS: (1) Is ممکنه دیر برسم natural (vs ممکنه دیر برسم with subjunctive only)? Recommended: yes. (2) Is شاید بتونم زودتر بیام natural word order? Recommended: yes.'
