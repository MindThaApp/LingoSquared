schema_version: '1.0'
pack_key: practice.en-fa.a2.unit44
source_language: en
target_language: fa
unit_content_key: fa.a2.unit44.not_yet
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 42-46 pass): 0 fixes. Dumped every slot pool at unit and course scope (unit44 tags are unit-only, so both scopes match: 13 content lexemes) and read every gloss; re-read every word_order, fill_in_blank and fixed-sentence translation frame against its pool (هنوز {item} نیومده fits both سفارش and سفارشم; the fixed-sentence translations sit on single-candidate slots); feedback truth, rtl/ltr, Yeh/Kaf purity and MC/matching floors checked. Capacity: 22 live templates (5 recognition / 10 structured / 7 production), 13/22 lexemes hosted (59%) in every tier, lessons 4/6 in every tier: lessons 04 and 05 hold only phrase lexemes and هیچی carries no unit tag, so nothing more is hostable without a backfill change (unchanged; slightly under the 60% bar for that reason). BACKFILL GLOSS FLAG: نمی‌کنه carries he/she does not do; work (spoken), which reads as two senses; the unit uses it as does not (do / work), e.g. کار نمی‌کنه. NATIVE FLAGS: ببخشید، قهوه‌ها کجاست؟ (singular کجاست after an inanimate plural) and the hint-free fill_in_blank frames. Earlier note: Authored 2026-11-15 for en-fa A2 unit 44 (not yet, no longer and none). Mirrors PR #250 (units 27-39): the backfill emits only unit and lesson tags (en_fa_a2_unit44_words, en_fa_a2_unit44_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two or more all fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). Phrase lexemes (word lists and dialogue lines) are not drilled, and tokens first introduced in earlier units belong to those units'' pools. Spoken Tehrani register; no native review yet. NATIVE QUESTIONS: (1) Is این میز خالی نیست the natural way to say a table is not free? Recommended: yes. (2) Is هیچ میزی خالی نیست correct with ی after هیچ? Recommended: yes.'
