schema_version: '1.0'
pack_key: practice.en-fa.a1.unit25
source_language: en
target_language: fa
unit_content_key: fa.a1.unit25.appearance

review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Vocabulary unit (physical appearance: height/hair/eyes/glasses). Lessons
    01-04 and 06 have lexemes (44 fa lexemes total); lesson05
    (reading_about_nima) has ZERO lexemes per backfill_lexemes and is
    therefore not represented by any template -- this is expected per
    recipe §0, not an omission. Recognition/production slots use each
    lesson's own semantic tag (height_word / hair_word / eye_word /
    appearance_question_word); matching_pairs uses the course-wide
    'appearance_adjective' union (6 distinct color/height adjectives,
    verified course-scope-safe: the tag has exactly 6 members in the whole
    a1 course, all from this unit). word_order frames ('او {item}.',
    'موهاش {item}.', 'چشماش {item}.') were re-read against each slot's
    course-wide pool (also unit-unique tags, so course scope == unit scope
    here) and every candidate is grammatical. fill_in_blank anchors عینک
    (appearance_question_word + noun), the only noun in that tag
    course-wide. lesson06's میاد lexeme carries no semantic tag and was
    deliberately left unhosted rather than used in an untagged
    literal-text frame (§3.1c risk) -- not a mis-gloss, just excluded by
    design; noted here per §0.1 anyway since it's the one unhosted lexeme.
    No mis-glossed lexemes found on inspection of every gloss in-pool.
    No listen_select (fa has no TTS configured). RTL throughout for fa
    blocks, ltr for en blocks.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - height_word
    - hair_word
    - eye_word
    - appearance_adjective
    - appearance_question_word

templates:
# --- lesson01 (height) ---
- content_key: practice.en-fa.fa.a1.unit25.lesson01.choose.001
  lesson_content_key: fa.a1.unit25.lesson01.height
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, adjective, verb]
      agreement_tags: {semantic: height_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is height vocabulary from this lesson.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit25.lesson01.order.002
  lesson_content_key: fa.a1.unit25.lesson01.height
  type: word_order
  frame: {text: 'او {item}.', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: verb
      agreement_tags: {semantic: height_word}
  answer_derivation:
    kind: render_frame
    frame: {text: 'او {item}.', language_code: fa, direction: rtl}
  feedback_frame:
    text: '"او {item}." describes someone''s height.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit25.lesson01.translate.003
  lesson_content_key: fa.a1.unit25.lesson01.height
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, adjective]
      agreement_tags: {semantic: height_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: 'Type the Farsi word for {item}.'
    language_code: en
    direction: ltr

