# --- unit-wide matching_pairs over the appearance_adjective union ---
- content_key: practice.en-fa.fa.a1.unit25.lesson03.match.004
  lesson_content_key: fa.a1.unit25.lesson03.eyes
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fa
    direction: rtl
  slots:
    first: &appadj
      language_code: fa
      part_of_speech: adjective
      agreement_tags: {semantic: appearance_adjective}
    second: *appadj
    third: *appadj
    fourth: *appadj
    fifth: *appadj
    sixth: *appadj
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: 'These are the unit''s height/hair/eye-color adjectives.'
    language_code: en
    direction: ltr
