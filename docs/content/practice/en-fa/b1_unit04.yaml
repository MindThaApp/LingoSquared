schema_version: '1.0'
pack_key: practice.en-fa.b1.unit04
source_language: en
target_language: fa
unit_content_key: fa.b1.unit04.debate
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Five lessons with lexemes, only 19 fa lexemes - one of the thinnest B1 units. Drills movaafegh
    / mokhaalef stance marking across every person. The non-verb pool is exactly 6 tokens, so matching_pairs
    uses the verb pool and the full unit pool instead of a non-verb pool.


    Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md to unblock this unit's

    checkpoint: the unit had lexemes but no practice pack, so generate_checkpoint() returned

    checkpoint_unavailable. ZERO listen_select is authored - AZURE_SPEECH_KEY is unset, so

    tts_actually_configured('fa') is false and _material() would delete those templates.

    Every slot is satisfiable from THIS unit's own lexemes, because generate_checkpoint()

    calls _material() with only this unit's lesson ids.


    The en-fa B1 lexeme classification carries almost no usable semantic tags (290 of 382 fa

    B1 lexemes are untagged), so the broad recognition / production / matching slots are

    constrained by language_code + part_of_speech only; the few semantic tags that do exist

    are used for the narrow, grammatically safe word_order / fill_in_blank / fixed-sentence

    slots. Every such tag was checked against the real backfill_lexemes.py data: each

    fill_in_blank anchor has exactly ONE distinct COURSE-WIDE candidate (AUTHORING_GUIDE #17

    hard-fail), and for every word_order frame each candidate in the whole B1 course pool is

    grammatical in that frame.


    proper_noun is deliberately excluded from multiple_choice and matching_pairs (the gloss is

    a transliteration, so those items are near-trivial) and is reachable only through a

    dedicated bare-word translation, which is a genuine script-production drill.


    Reviewer must double-check: (a) the Persian in every word_order / fill_in_blank frame reads

    as natural colloquial Iranian Persian and uses only vocabulary already taught in this course;

    (b) glosses that embed the Persian token in a parenthetical example (a backfill gloss-style

    artifact) partly give away the answer in multiple_choice - flagged, not fixable in a pack.


    Template mix: matching_pairs x3, multiple_choice x3, translation x5, word_order x1 (12 total) anchored
    across the 5 lessons that introduce tokens.


    POLISH 2026-07-25 (POS-only matching_pairs wave): checked and deliberately left
    POS-only. This unit's specs carry only 5 semantically tagged tokens
    (تو، دورکاری، من، می‌کنم، نظر) -- under the 6-pair floor. No valid semantic union
    exists without new backfill tags.

    POLISH WAVE 4 (2026-07-26, commit 05af7ace-successor generated tags): the POS-only honest-leave above is RESOLVED. scripts/backfill_lexemes.py now emits en_fa_b1_unit04_words (and per-lesson en_fa_b1_unit04_lessonNN_words) for every first-introduced content token in this unit, so the matching_pairs slot(s) are re-anchored off bare part_of_speech onto en_fa_b1_unit04_words (15 distinct unit-scoped tokens, each matcher's own content parts of speech); course-scope Endless-Practice pool == unit pool by construction, so the off-theme pulls are eliminated. No duplicate-gloss collisions in the resulting pool. Verified with pool_check.py + unit-scope check (0 DEAD, floor holds).

    FRESH-CONTEXT NATIVE REVIEW 2026-07-27 (batch 1): reviewed against AUTHORING_PREFLIGHT.md with the realization/overlay + live backfill lexeme pools cross-checked. All CRITICAL/MAJOR findings fixed and committed (see docs/RAMIN_REVIEW_BACKLOG.md 'Native review batch 1' for the per-pack findings + residual MINOR/known-limitation notes; some backfill gloss fixes take effect on the next re-backfill). Status -> reviewed.
