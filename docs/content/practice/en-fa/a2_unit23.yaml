review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 22-26 pass): dumped every slot pool at unit and course scope and read every gloss (the stale complaints below are resolved in the current backfill: English source_gloss lexemes are gone, نه is no longer a unit lexeme, POS for می‌رفتم/می‌کردیم/داشتیم is verb). 10 fixes - (1)-(8) feedback frames that described the whole pool wrongly: choose.002/match.010 (said every item describes a place, pool includes قبلا), choose.003/match.011 (said every item is a habit form, pool includes بودم and ساختن), choose.004/match.013 (said possessive or habit form, pool includes چیزی), choose.005/match.012 (said habit past, pool includes داشت/داشتیم); all reworded to true statements; (9) sentence.032 (Every day I used to walk to school.) now also accepts هر روز پیاده مدرسه می‌رفتم and هر روز پیاده به مدرسه می‌رفتم, both accepted by the lesson overlay; (10) the production tier did not reach lesson04 (its only lexeme is the then-versus-now phrase), so lesson04.translate.035 was added: phrase gloss to the taught sentence قبلا محله‌مون آروم بود، حالا شلوغه, single candidate at course scope, ولی join accepted. Course-scope frames: every sentence frame is a single-candidate anchor at course scope (بودی, پیاده, چطور, بزرگ). Capacity (a2 unit23 filter, TTS off): 35 templates, 60 lexemes, ALL 93% / recognition 93% / structured 90% / production 70%, 5/5 lessons with lexemes in every tier (production was 4/5 before fix 10), no dead or under-3 templates. NATIVE FLAGS: fill.022 (محله‌تون ___ بود؟) and fill.023 (یه حیاط ___ داشتیم) have no hint, so only recall of the unit sentence pins چطور/بزرگ; sentence.034 lists the canonical as its own variant (harmless). Authored 2026-11-15 for en-fa A2 unit 23 ''Childhood habits'' (fa.a2.unit23.childhood_habits). No curated single-member unit tags exist in the en-fa backfill, so pools are unit/lesson tags narrowed by part_of_speech; one-member anchors are tag+POS combinations that resolve to one token (بودی via lesson06 verb, پیاده via transport_mode_word, چطور via wellbeing_question, بزرگ via its size-single tag). No listen_select (no fa TTS). EXCLUDED from pools: English source_gloss lexemes (language_code en: formerly, was, child, yard, school, big, near, play, build, walk, were, close, away, any, our ...); lessons 04 and 05 hold only such junk or phrase lexemes so only the phrase pool reaches them; نه (glossed ''nine'', but the unit uses it as ''no'' in حالا، دیگه، نه; kept out by never pooling lesson02 adjectives); شلوغه/lesson02 adjectives for the same reason; وقتی and اونا carry no unit tag (not reachable); the lesson02 adverb pool (عصرها, حالا, چطور) is used for recognition only. Odd POS left in pools: می‌رفتم, می‌کردیم, داشتیم are labelled noun but are verb forms (glosses are right, so they appear in noun-labelled pools beside real nouns); توی is labelled noun; داشتیم ''we were (in the middle of)'' is a half gloss. NATIVE SPEAKER CHECK: (1) هر روز پیاده می‌رفتم مدرسه and the moved-word variants; (2) یه حیاط بزرگ داشتیم vs حیاط بزرگی داشتیم; (3) وقتی بچه بودی، محله‌تون چطور بود؟ with the variant order; (4) محله‌تون چطور بود؟ as a stand-alone question. Backfill fix wanted: gloss and POS for نه, POS for می‌رفتم/می‌کردیم/داشتیم/توی, missing unit tag on وقتی/اونا.'
