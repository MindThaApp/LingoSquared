  fresh_context: 'false'
  notes: 'Authored 2026-11-15 for en-fa A2 unit 46 (referring back (it, them)). Mirrors PR #250 (units 27-39): the backfill emits only unit and lesson tags (en_fa_a2_unit46_words, en_fa_a2_unit46_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two or more all fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). Phrase lexemes (word lists and dialogue lines) are not drilled, and tokens first introduced in earlier units belong to those units'' pools. Spoken Tehrani register; no native review yet. NATIVE QUESTIONS: (1) Is پول بهش قرض دادم natural? Recommended: yes (قرض دادم = I lent). (2) Is کتاب رو خوندی؟ natural for did you read the book? Recommended: yes.'
