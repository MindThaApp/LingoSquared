review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 32-36 pass): 0 fixes. Dumped every slot pool at unit and A2-course scope (identical: unit and lesson tags only) and read every gloss; MC pools 4, 6 and 14 distinct glosses, matching pools 9 and 14 for 6 slots; order.003 سبزی رو {item}. pools شستم/پختم, both grammatical. Capacity: 12 templates, 26 unit lexemes, ALL/recognition/structured/production 54% each (below the 60% bar: the unhosted lexemes are phrase lexemes plus the particle اینکه and the preposition بهم), lessons 4/6 (lesson03 and lesson05 hold only phrase lexemes). Backfill gloss for routing: اینکه carries ''that (complementizer, as in even though)''; here it is part of قبل از اینکه / بعد از اینکه (before / after); it is in no pool. Authored 2026-11-15 for en-fa A2 unit 35 (before, after and when). Mirrors PR #242 (units 22-26): the backfill emits only unit and lesson tags (en_fa_a2_unit35_words, en_fa_a2_unit35_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two both fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). English source_gloss lexemes and phrase lexemes (word lists and dialogue lines) are not drilled. Spoken Tehrani register; no native review yet (the owner approved unreviewed). NATIVE QUESTIONS: (1) Is سبزی رو شستم / پختم natural for the greens? Recommended: شستم yes, پختم acceptable. (2) Spoken برسی vs برسید in قبل از اینکه برسی. Recommended: keep as taught.'
