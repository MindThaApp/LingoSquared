  - particle
  - phrase
  agreement_tags:
    semantic:
    - letter
    - greeting
    - time_period
    - good_wish
    - farewell
    - wellbeing_question
    - wellbeing_question_phrase
    - wellbeing_answer
    - wellbeing_answer_phrase
    - politeness
    - politeness_phrase
    - offered_item
    - person_name
    - identity
    - dialogue_word
    - reviewed_phrase
    - volume_en_fa_a1_unit01_time_period_02_single
    - volume_en_fa_a1_unit01_good_wish_04_single
    - volume_en_fa_a1_unit01_offered_item_08_single
    - volume_en_fa_a1_unit01_person_name_11_single
    - en_fa_a1_unit01_words
    - en_fa_a1_unit01_lesson03_words
    register:
    - neutral
    - polite
    - informal
    - formal
    person:
    - first
    - second
    - third
