schema_version: '1.0'
pack_key: practice.en-fa.a1.unit01
source_language: en
target_language: fa
unit_content_key: fa.a1.unit01.greetings
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-22 (en-fa practice rest pass, fresh context; 9 fixes). (1) salam_meaning.006 and (2)
    welcome_meaning.006 were MC with a fixed answer and a 1-member distractor pool (never generated): now slot_gloss
    over greeting+farewell and over lesson03''s set phrases. (3) greeting_fill.001 and (4) question_fill.001 had a
    bare ''{slot}'' frame (masked to a lone blank, rejected at runtime): greeting now blanks into ''X، حالتون
    چطوره؟''; the question became a fixed translation ''How are you? (polite)''. (5) return_question.006 expected
    حالتون چطوره؟ after خوبم، ممنون. although the dialogue returns the question with شما چطور؟: now blanks چطور in
    ''شما ___؟''. (6) dialogue_word pool re-pooled from the level-wide dialogue_word tag (stage-direction glosses
    such as ''Ali welcomes Narges.'' as translation prompts, other units'' lines in Endless Practice) to this
    unit''s single words; (7) its feedback no longer claims every word is in the dialogue. (8) volume_fill.002 ''___
    بخیر'' was underdetermined (any time word fits): now translation ''Good night.'' (9) volume_order.007 was a
    1-tile word bank: now ''X، حالتون چطوره؟''. NATIVE FLAGS: خداحافظ typed as خدا حافظ is not accepted; خوش آمدید
    written form in spoken scenes (already flagged in the realization). GLOSS LANE: خوبم, خوبی, حالتون چطوره؟,
    letter و (see report).

    Fresh review found and resolved translation-direction, phrase-gloss, recombination, and feedback metadata defects.
    A targeted post-review fix removed leaked review-process language from learner-facing feedback; this was not a new full
    fresh-context review. Second targeted post-review fix, 2026-07-06: scripts/_practice_slot_check.py surfaced that 3 multiple_choice
    templates (greeting_meaning, farewell_choice, question_meaning) each had only 1-2 real distinct lexeme candidates against
    the >=3 multiple_choice/matching_pairs threshold -- these unit01/unit02-era tags were simply never extended with more
    vocabulary, so build_prompt() was silently rejecting these generated-item shapes every time since the pack shipped. Converted
    all 3 to fill_in_blank (same slot, needs only >=1 candidate, matching this file''s own letter_fill.002/farewell_fill.003
    precedent) rather than inventing new tagged vocabulary. Re-verified via compile_content.py practice-validate (0/0) and
    _practice_slot_check.py (all 3 now pass). Third targeted post-review fix, 2026-07-07: the 3 matching_pairs templates left
    open above (greeting_pair.006, question_pair.004, offer_pair.006) are now fixed too, without inventing any vocabulary
    -- verified by hand against backfill_lexemes.py''s iter_specs() (A1-only, no cross-level pooling risk: en-fa''s a2_unit09/10
    don''t touch this vocabulary at all) that ''greeting'' (سلام) and ''offered_item'' (چای) are each genuinely single-candidate
    at this course''s real vocabulary depth (سلام is the only single-token greeting; صبح/عصر بخیر are correctly modeled as
    separate time_period+good_wish tokens, already tested via time_greeting.002; taarof''s lesson literally only teaches one
    offered item), and ''wellbeing_question_phrase'' likewise has only 1 real candidate (حالتون چطوره؟, already tested via
    question_fill.001/return_question.006). Rather than pairing a 1-candidate tag against a fine one (structurally unsatisfiable
    -- matching_pairs needs >=N distinct candidates for N slots on a tag, and 1 can never fill >=2), each was rebuilt as a
    matching_pairs pooling ONLY tags with real headroom, several using each lesson''s own already-tested-elsewhere vocabulary
    per AUTHORING_GUIDE §16: greeting_pair.006 -> closing_pair.006 (farewell x2 + politeness x4 = 6 pairs), question_pair.004
    -> answer_pair.004 (wellbeing_answer x3 + politeness x4 = 7 pairs, politeness newly recapped into lesson04 from lesson02),
    offer_pair.006 -> politeness_pair.006 (politeness x4 alone, offered_item dropped since it''s already covered by offer_order.001/offer_meaning.002).
    Re-verified via _practice_slot_check.py (0 problems in this file) and compile_content.py practice-validate (0/0).

    REAUTH PASS 2026-07-24 (fix DEAD templates at checkpoint/UNIT scope --
    scripts/_practice_unit_scope_check.py, a different check from
    _practice_slot_check.py''s whole-direction scope the notes above used).
    generate_checkpoint() scopes candidates to this unit''s own lexemes
    only. Findings, verified against a fresh iter_specs() dump filtered to
    ''.a1.unit01.'':

    1. letter_pair.004 (matching_pairs) declared 12 slots but this unit
    teaches exactly 4 letters (س ل ا م, spelling سلام) -- REAL DEAD. Shrunk
    to 4 slots (letter_one..letter_four). Honestly thin: 4 is this lesson''s
    genuine ceiling (below the 6-pair floor), documented, not padded.

    2. dialogue_pair.005''s person_name_one..four (4 slots) drew on a real
    unit-scoped pool of only 2 (علی، نرگس) -- REAL DEAD (a 2-member pool
    cannot fill 4 pairwise-distinct slots). Shrunk to person_name_one/two.
    dialogue_word_one..eight (the template''s other, independent distinct
    group) was untouched -- verified 45 distinct unit-scoped dialogue_word
    candidates, nowhere near exhausted. Also reordered the `slots:` mapping
    to list dialogue_word_one..eight before person_name_one/two: this
    template''s two `distinct` groups have very different sizes (2 vs 8),
    and _practice_unit_scope_check.py''s matching_pairs check estimates the
    whole template''s pool from only the FIRST declared slot -- with
    person_name first it would still misreport this fixed, working
    template as DEAD (2 < 8), purely a checker artifact. Listing the
    larger/well-pooled group first is a no-op for the runtime (slot
    mapping order has no effect on fill_slots()/lexeme_matches()) and
    makes the checker read this template correctly too.

    3. name_meaning.003 (multiple_choice, person_name) had only 2 distinct
    unit-scoped glosses (Ali, Narges) -- below the 3-option MC floor, and
    this unit genuinely has no third name (a third would come from a LATER
    unit, forbidden). REPURPOSED to the dialogue_word preset (already
    defined below, 45 distinct candidates) instead of person_name, renamed
    to dialogue_choice.003 with feedback text updated to match.
    identity_order.002 (word_order, person_name, 2 candidates) already
    covers the two names'' word-order pattern, so this MC losing its
    person-specific focus is not a coverage loss.

    4. identity_order.002.volume_fill.011''s slot used semantic tag
    `volume_en_fa_a1_unit01_person_name_11_single` -- a name that promises
    (by its own "_unit01_..._11_single" naming) to identify a single
    unit01 person, but a direct iter_specs() query shows it is actually
    assigned to a1_unit09''s آرش (Arash), not to علی or نرگس here. 0
    unit-scoped candidates -- REAL DEAD, and unfixable from the pack side
    (no other single-candidate tag exists for either name; creating one is
    a backfill_lexemes.py change, out of PACK-ONLY scope). DROPPED.
    LOGGED for the coordinator: this looks like a volume-tag
    misassignment/collision in scripts/backfill_lexemes.py, worth checking
    whether other `volume_..._single` tags in other units have the same
    tag-name-vs-actual-lexeme mismatch.

    5. politeness_pair.006 (4 slots, politeness_phrase only, below the
    6-pair floor) was widened by adding farewell_one/two (2 more slots,
    reusing the farewell tag already proven at 2 distinct elsewhere in this
    file) -- now 6 slots total, meeting the floor.

    6. closing_pair.006 and answer_pair.004 are flagged DEAD by
    _practice_unit_scope_check.py, but this is a VERIFIED FALSE POSITIVE,
    not a real defect -- left UNCHANGED (reordering does not help here,
    see below). Both declare a SINGLE `distinct` relation spanning ALL
    their slots, combining two different semantic tags (farewell +
    politeness_phrase; wellbeing_answer_phrase + politeness_phrase) into
    one matching exercise -- exactly the deliberate technique this file''s
    own 2026-07-07 note above describes. _practice_unit_scope_check.py''s
    matching_pairs check estimates the whole relation''s required pool from
    only the FIRST declared slot''s own candidate count
    (`check_pack()`''s `first_slot = next(iter(slots.values()), {})`),
    which assumes every slot in the group shares one tag -- true for a
    homogeneous matching_pairs, false here. Verified against
    backend/app/practice/service.py''s real `_relation_holds()`/
    `fill_slots()`: a `distinct` relation only requires the ASSIGNED
    lexemes across its listed slots to have distinct ids; each slot draws
    its own candidates from its own constraint, so two disjoint-token
    categories folded into one relation still fill correctly -- the real
    capacity is the SUM of each distinct slot NAME''s own pool, not
    whichever slot happens to be listed first. Because both templates use
    ONE merged relation (not two separate ones), there is no slot order
    that fixes the checker''s estimate -- unlike dialogue_pair.005 above,
    reordering only helps when the groups are declared as SEPARATE
    `distinct` relations. Real math (unit-scoped, matching
    generate_checkpoint()):
      - closing_pair.006: farewell (2: خداحافظ، فعلاً) + politeness_phrase
        (4: خواهش می‌کنم، لطف دارید، زحمت نکشید، ممنون از لطف شما) = 6
        distinct pairs. Meets the 6-pair floor exactly.
      - answer_pair.004: wellbeing_answer_phrase (3: خوبم، خیلی خوبم، بد
        نیستم، ممنون) + politeness_phrase (4, same four as above) = 7
        distinct pairs. Exceeds the floor.
    (time_pair.004 -- time_period x4 + farewell x2, two SEPARATE `distinct`
    relations with time_period, the larger group, already listed first --
    was never actually flagged DEAD by the script, only an informational
    FLOOR line ("declares only 4 slots") that undercounts the same way;
    left as-is, no reorder needed.)
    No pack change was made for closing_pair.006/answer_pair.004 --
    restructuring a working, deliberately-designed two-category matching
    exercise just to satisfy a checker limitation would be a quality
    regression, not a fix. LOGGED for the coordinator:
    scripts/_practice_unit_scope_check.py''s matching_pairs check should sum
    each DISTINCT SLOT NAME''s own candidate count within a relation (and
    account for `same_tag` relations, see a1_unit02''s country_pair.006)
    instead of reading only the first slot, to stop flagging this
    legitimate pattern.

    Re-verified 0 DEAD for this file (the 2 items above are the only
    residual DEAD lines the script prints, both documented as false
    positives or honest thinness) via scripts/_practice_unit_scope_check.py,
    and 0 errors via compile_content.py practice-validate. No backfill/
    realization/overlay edits made.'
