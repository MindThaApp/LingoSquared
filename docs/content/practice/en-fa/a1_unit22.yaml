review:
  status: unreviewed
  required_next_reviewer: codex
  notes: 'Authored 2026-07-09 (en-fa overnight units-20+ practice-depth pass, same batch as a1_unit20.yaml/a1_unit21.yaml
    -- see those files'' own notes for the shared UNIT_FILES-extension pattern). Extends scripts/backfill_lexemes.py with
    16 new FA_GLOSSES entries, 1 new FA_PARTICLES entry (الو), 2 new FA_ADVERBS entries (آهسته‌تر/بعداً), 2 new FA_ADJECTIVES
    entries (قطع/وصل/بهتر -- 3 actually), 6 new FA_VERBS entries, and 8 new semantic tags. تلفن/پیام/زنگ/میشه/برات/ چهار/چطوری/بهتره/آره/حتماً/میام/الان
    already existed (established across units 02/03/07/A2unit10/12/15/16 etc.) -- reused verbatim.

    Real pre-existing content bugs caught and fixed live while extending the classifier (not introduced by this pass): the
    unit22 OVERLAY file (docs/content/overlays/en-fa/a1_unit22.yaml) was missing 2 teaching entries the REALIZATION file already
    references -- fa.a1.unit22.lesson01.teach.va_word (the standard "و (and)" review card every other unit in this course
    already carries) and fa.a1.unit22.lesson06.teach.they_go (the میرن grammar-note card). Both are genuine gaps in the existing
    draft content, not something this pass introduced -- caught because _classify_fa() unconditionally looks up every realization
    teaching item''s content_key in the overlay''s teaching dict, which crashed with a real KeyError until fixed. Added both
    missing overlay entries using the exact title/gloss/note shape every sibling unit''s identical card already uses (va_word
    mirrors a1_unit21''s own, verbatim), a minimal, same-shape fix -- not new content design, and unrelated to this pack''s
    own template design. Flagging explicitly for the fresh-context reviewer since this touches the realization/overlay pair,
    not just the practice pack.

    Eight semantic groups, all verified via scripts/_practice_slot_check.py: "phone_word" pools the 4 core lesson01 items
    -- تلفن/پیام/صدا plus the auto-derived "زنگ زدن" ("to call") phrase lexeme (mixed noun/ phrase, anchored lesson01, mirrors
    match_phone_words). تلفن/پیام already carry unrelated tags from earlier units (unit02''s phone_ number, a2_unit10''s family_message_word)
    -- additive here, same meaning throughout, not a homograph. "phone_answer_word" pools الو/منم (2 members, translation/matching-only,
    anchored lesson02). "repeat_word" pools تکرار/آهسته‌تر/صحبت (3 members, anchored lesson03, mirrors match_repeat_phrases''
    word-level pairs); "repeat_phrase" pools the 2 auto-derived lesson03 sentence-level phrases (translation/matching-only).
    "message_word" pools برات/بیا/کافه (3 members, anchored lesson04 -- برات is additive on top of its existing preposition
    entry, same meaning throughout); "message_phrase" pools the 2 auto-derived lesson04 sentence-level phrases. "call_ending_word"
    pools بعداً/بهتر/شد/الان (4 members, anchored lesson05 -- الان additive on top of its existing entry); "ending_phrase"
    pools the 2 auto-derived lesson05 sentence-level phrases.

    Real dead-anchor risk checked and confirmed clear: none of this unit''s own auto-derivable multi-token phrases ("زنگ زدن",
    "میشه تکرار کنید؟", "لطفاً آهسته‌تر صحبت کنید", "یه پیام برات دارم", "فردا ساعت چهار بیا کافه", "خداحافظ، بعداً صحبت می‌کنیم",
    "الان بهتر شد؟") collide with any earlier unit''s own phrase text (checked via a direct grep across every unit01-21 realization
    file before use, all clean).

    Lesson-anchor check: lesson01 (phone vocabulary), lesson02 (answering), lesson03 (asking to repeat), lesson04 (reading
    a text message), and lesson05 (ending a call) each genuinely introduce new vocabulary (confirmed by reading the realization
    file directly) -- safe anchors. lesson06 hosts a combined review matching_pairs template pooling phone_word (4) + repeat_word
    (3) + message_word (3) into one 10-pair exercise, the same "final unit review" pattern established by a1_unit17/19/20/21''s
    own packs.

    Zero fill_in_blank templates, same standing en-fa precedent as every prior unit in this direction. scripts/_fill_in_blank_ambiguity_
    check.py reports zero flags. Verified with scripts/ _practice_slot_check.py against backfill_lexemes.py''s actual iter_specs()
    output -- clean, no zero-candidate slots, no under-3 multiple_choice/matching_pairs slots (phone_answer_word/repeat_ phrase/message_phrase/ending_phrase
    correctly have only 2 candidates each and are never used for multiple_choice here, only matching_ pairs/translation).
    compile_content.py practice-validate clean (0 errors/0 warnings). Needs the standard fresh-context review before import
    -- including a specific check of the 2 overlay-entry fixes noted above.'
