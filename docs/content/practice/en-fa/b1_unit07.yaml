review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: |-
    Review 2026-10-19 (en-fa/en-prs practice pass, fresh context; 12 fixes).
    (1-7) Answer leakage at B1: the broad untagged pools (all 7 MC/translation templates and 2 matching) held lexemes whose backfill gloss embeds the Persian token (تولد "in جشن تولد", رفته "used in رفته بودم", اشکالی, جات, سر, خوشحال می‌شم, دست, گذاشتن, نشد, شده), so the MC answer / translation prompt / matching card printed the answer. Pools rebuilt from unit/lesson tag unions that exclude them: verbs = lesson01+02+04 verbs + رفت; modifiers = the unit's adverbs/adjectives. Also drops the wrong-sense lexeme می‌دید "you give (polite)" (in the reading it is "he would have seen"), the particle "if" (اگر vs اگه elsewhere in B1 = underdetermined translation) and untagged course-wide pools (in Endless they spanned all 382 B1 lexemes). (8) lesson05.match.002 now drills the wish/counterfactual verbs (lesson01-03); the رفته card's gloss still contains رفته بودم (backfill gloss, flagged). (9) lesson02.match.002 / lesson04.match.001 were fixed 6-member pools that always dealt the same six cards incl. the self-revealing خوشحال می‌شم. (10) order.003 "رضا کمی ناراحت بود" contradicted the reading (Nima is the one who is sad, حالا نیما ناراحته) -> نیما. (11) order.002 is a question: ending "." -> "؟", and restored "این آخر هفته" from the dialogue line. (12) fill.004 feedback said گذاشتن means "to make plans" (it is "they set"; قرار گذاشتن = make plans).
    NATIVE FLAGS: backfill gloss می‌دید = "you give (polite)" is wrong for this unit (he/she would see); glosses with embedded Persian need a backfill clean-up; "I couldn't / wasn't able to" is shared by نتونستم and نمی‌تونستم in B1 (gloss should separate them); confirm "می‌خوام بپرسم می‌تونیم این آخر هفته همدیگه رو ببینیم؟" (course-scope pool member) reads naturally.

    Five lessons with lexemes, 52 fa lexemes. Drills kaash + past copula wishes and agar + past-perfect counterfactuals.

    Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md to unblock this unit's
    checkpoint: the unit had lexemes but no practice pack, so generate_checkpoint() returned
    checkpoint_unavailable. ZERO listen_select is authored - AZURE_SPEECH_KEY is unset, so
    tts_actually_configured('fa') is false and _material() would delete those templates.
    Every slot is satisfiable from THIS unit's own lexemes, because generate_checkpoint()
    calls _material() with only this unit's lesson ids.

    The en-fa B1 lexeme classification carries almost no usable semantic tags (290 of 382 fa
    B1 lexemes are untagged), so the broad recognition / production / matching slots are
    constrained by language_code + part_of_speech only; the few semantic tags that do exist
    are used for the narrow, grammatically safe word_order / fill_in_blank / fixed-sentence
    slots. Every such tag was checked against the real backfill_lexemes.py data: each
    fill_in_blank anchor has exactly ONE distinct COURSE-WIDE candidate (AUTHORING_GUIDE #17
    hard-fail), and for every word_order frame each candidate in the whole B1 course pool is
    grammatical in that frame.

    proper_noun is deliberately excluded from multiple_choice and matching_pairs (the gloss is
    a transliteration, so those items are near-trivial) and is reachable only through a
    dedicated bare-word translation, which is a genuine script-production drill.

    Reviewer must double-check: (a) the Persian in every word_order / fill_in_blank frame reads
    as natural colloquial Iranian Persian and uses only vocabulary already taught in this course;
    (b) glosses that embed the Persian token in a parenthetical example (a backfill gloss-style
    artifact) partly give away the answer in multiple_choice - flagged, not fixable in a pack.

    Template mix: fill_in_blank x1, matching_pairs x3, multiple_choice x3, translation x4, word_order x2 (13 total) anchored across the 5 lessons that introduce tokens.
