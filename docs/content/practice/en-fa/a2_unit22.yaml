review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-11-15 for en-fa A2 unit 22 ''A busy morning'' (fa.a2.unit22.busy_morning). The unit has no curated single-member tags (the en-fa backfill only carries en_fa_a2_unit22_words and _lessonNN_words), so pools are the unit/lesson tags narrowed by part_of_speech; one-member anchors are lesson-tag + POS combinations that resolve to exactly one token (دیر, بیدار, پیدا, یادم) plus the curated transport_mode and lost_item tags. No listen_select (no fa TTS). EXCLUDED from recognition/matching/translation pools: the English source_gloss lexemes (language_code en: shower, clothes, woke, took, got, dressed, opened, closed, called, wrote, letter, etc.); lesson05 has only such junk, so it cannot be covered by any fa template; نزدم (gloss ''I didn''t hit; make'' is garbled; the unit teaches the negated light-verb form, kept out by using noun/adjective pools for lesson03); بهت (preposition, no unit tag). KEPT but flagged (lexical-only glosses): روشن ''clear'' (unit: ماشین رو روشن کردم = turn on), زدم ''I hit / I called (past)'', پیدا ''found (as in to find)'', یادم ''my mind; my memory'' (unit: یادم رفت = I forgot); نوشتم is labelled noun. Phrase lexemes (comma lists) are used only in one multiple_choice and one matching_pairs. NATIVE SPEAKER CHECK: (1) accepted variant کلیدمو for کلیدم رو; (2) ببخشید، یادم رفت as the ''Sorry, I forgot'' answer; (3) با اتوبوس/قطار رفتم frame (spoken register, past tense); (4) من امروز صبح دیر بیدار شدم word order and the dropped-من/امروز variants. Backfill fix wanted: gloss for روشن, نزدم, زدم, یادم and POS for نوشتم/می‌چسبه.'
