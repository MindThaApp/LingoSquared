review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 22-26 pass): dumped every slot pool at unit and course scope and read every gloss (the stale complaints below are resolved in the current backfill: درست, داشتم, داشتی, صبر, شدن now carry the taught senses). 1 fix - choose.002 feedback said every item is a form of داشتن, false for وایساد and افتاد in the same pool; reworded. Course-scope frames: every sentence frame is a single-candidate anchor at course scope (معمولاً, لحظه, راه, می‌کردی). Capacity (a2 unit24 filter, TTS off): 30 templates, 31 lexemes, ALL 97% / recognition 97% / structured 97% / production 58%, 6/6 lessons in every tier, no dead or under-3 templates. NATIVE FLAGS: match.008 pools داشتی (you were, in the middle of) beside می‌کردی (you were doing) and داشتم beside می‌شدم (I was crossing); the parenthetical glosses keep them apart but a native/content pass may prefer narrower pools; sentence.030 repeats its canonical as a variant (harmless). Authored 2026-11-15 for en-fa A2 unit 24 ''What was happening'' (fa.a2.unit24.what_was_happening). The en-fa backfill has no curated single-member tags for this unit, so pools are unit/lesson tags narrowed by part_of_speech; one-member anchors are tag+POS combinations that resolve to exactly one token (معمولاً, لحظه, راه, می‌کردی). No listen_select (no fa TTS). EXCLUDED: only the English source_gloss lexemes (language_code en). KEPT but flagged: درست is glossed ''true; right'' (a correct bare-word gloss, but the unit uses it inside درست کردن = to make/cook), so answers teach the lexical sense only. Glosses left in pools but worth fixing: داشتم ''I had'' and داشتی ''you had'' (here they are the progressive auxiliary ''was/were''); رد ''across; past'' labelled noun; صبر ''wait (noun)'' (the unit uses صبر کردم = I waited); شدن/می‌شدم ''to become; would become'' (unit: از خیابون رد شدن = to cross). NATIVE SPEAKER CHECK: (1) the frame اون لحظه داشتم کتاب می‌خوندم and its variants; (2) اتوبوس دوباره راه افتاد with the variant order; (3) داشتی چیکار می‌کردی؟ ; (4) معمولاً با اتوبوس می‌رم خونه (می‌رم vs میرم written form, معمولا spelling). Backfill fix wanted: gloss for درست, داشتم/داشتی, صبر, شدن.'
