unit_content_key: fa.a2.unit45.self_care
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 42-46 pass): 2 fixes - (1) lesson06 sentence.005 showed the English prompt Take care of yourself and accepted only از خودت مراقبت کن, but this unit teaches Take care of yourself as مواظب خودت باش (lesson02 and the dialogue), so a learner following the course was marked wrong; the prompt now reads Look after yourself, the unit''s own gloss for از خودت مراقبت; (2) lesson01 sentence.011 (How are you feeling today?) now also accepts the equally natural order حالت امروز چطوره؟ through accepted_variants. Dumped every slot pool at unit and course scope (unit45 tags are unit-only, so both scopes match: 17 content lexemes) and read every gloss; re-read every word_order, fill_in_blank and fixed-sentence translation frame against its pool (امروز {item}. fits every feeling word in both its adjective and verb pools); feedback truth, rtl/ltr, Yeh/Kaf purity and MC/matching floors checked. Capacity: 23 live templates (5 recognition / 11 structured / 7 production), 17/42 lexemes hosted (40%) in every tier, lessons 4/6 in every tier: 19 of the 42 lexemes are phrase lexemes (word lists and dialogue lines, not drilled), lessons 04 and 05 hold only phrase lexemes, and the six خود pronouns carry no unit tag, so the 40% is a backfill limit, unchanged by this review. BACKFILL GLOSS NOTE: ناراحتم carries I am sad where the unit teaches I am upset (close enough to keep in pools); the خود pronouns carry only the generic pronoun tag, so they are not hostable here. NATIVE FLAGS: the hint-free fill_in_blank frames. Earlier note: Authored 2026-11-15 for en-fa A2 unit 45 (self-care). Mirrors PR #250 (units 27-39): the backfill emits only unit and lesson tags (en_fa_a2_unit45_words, en_fa_a2_unit45_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two or more all fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). Phrase lexemes (word lists and dialogue lines) are not drilled, and tokens first introduced in earlier units belong to those units'' pools. Spoken Tehrani register; no native review yet. NATIVE QUESTIONS: (1) Is مواظب خودت باش the natural order for take care? Recommended: yes. (2) Is از خودت مراقبت کن natural? Recommended: yes.'
