schema_version: '1.0'
pack_key: practice.en-fa.a1.unit50
source_language: en
target_language: fa
unit_content_key: fa.a1.unit50.restaurant

review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (en-fa/en-prs practice pass, fresh context; 3 fixes). (1) Answer
    printed in the prompt: the four bare-word translation templates pooled سفارش, whose
    backfill gloss "order (in سفارش دادن, 'to order')" shows the Persian answer; they now
    pool the lesson02-04 items (چلوکباب, دوغ, خانم رحیمی). (2) lesson01 order.003 rendered
    "یک سفارش دیگه هم می‌خوام" and (3) lesson02 order.003 "لطفاً یک سفارش می‌خوام" ("I want
    another order too" / "please, I want an order"), not natural requests: both now pool
    only the dishes (lesson02 + lesson03 tags: چلوکباب, دوغ). lesson03 order.003 keeps
    سفارش, since "می‌شه سفارش رو بیارید؟" (could you bring the order?) is natural.
    Remaining, backfill-side: سفارش's gloss is a near-giveaway as a multiple_choice option.
    NATIVE FLAGS: "لطفاً یک چلوکباب می‌خوام." is correct but stiff; colloquial ordering is
    closer to "یه چلوکباب لطفاً".

    THIN UNIT -- flagging per recipe §3 "capacity, don't pad". Restaurant has
    only 5 distinct fa lexemes/phrases total per backfill_lexemes_en_fa
    across all 4 lessons: restaurant_order_word 3 (سفارش "order" noun,
    چلوکباب "chelo kabab" noun, دوغ "doogh (yogurt drink)" noun), 1
    person_name (رحیمی), 1 additional reviewed_phrase (خانم رحیمی "Ms.
    Rahimi"). Union of all 3 tags gives only 5 distinct tokens -- below the
    6-pair matching_pairs floor, so no matching_pairs is authored (padding
    with untaught vocabulary would violate the no-padding rule). 9 templates
    total (below the 12 floor -- real capacity, not an authoring shortfall):
    4 lessons x (multiple_choice + bare-word translation) over the full
    5-token union, plus 1 word_order anchored lesson02 over
    restaurant_order_word (frame "لطفاً یک {item} می‌خوام." / "I would like a
    {item}, please.") -- re-read at course scope: restaurant_order_word is a
    unit-specific coined tag with zero course-wide members outside this unit
    (verified via full iter_specs() scan), so course scope == unit scope
    here, and all 3 members (order, chelo kabab, doogh) read grammatically in
    that frame. fill_in_blank is not usable (no tag in this unit has exactly
    1 course-wide candidate, even after POS narrowing -- all 3
    restaurant_order_word members are nouns). No mis-glossed lexemes found.
    No listen_select (Azure TTS key unset for fa).
    POLISH 2026-07-24: structured tier brought to 3 (was 1) with two more
    word_order templates over restaurant_order_word (course scope == unit
    scope, tag is unit-exclusive; re-read: all 3 members are grammatical in
    both new frames): lesson01.order.003 "یک {item} دیگه هم می‌خوام." = "I
    want another {item} too", lesson03.order.003 "می‌شه {item} رو بیارید؟" =
    "Could you bring the {item}?". matching_pairs remains unauthorable
    (5 distinct tokens < 6-pair floor, unchanged).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - restaurant_order_word
    - person_name
    - reviewed_phrase
    - en_fa_a1_unit50_lesson02_words
    - en_fa_a1_unit50_lesson03_words
    - en_fa_a1_unit50_lesson04_words

templates:
# --- lesson01 (new_restaurant_one) ---
- content_key: practice.en-fa.fa.a1.unit50.lesson01.choose.001
  lesson_content_key: fa.a1.unit50.lesson01.new_restaurant_one
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, phrase]
      agreement_tags:
        semantic: [restaurant_order_word, person_name, reviewed_phrase]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is restaurant vocabulary from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit50.lesson01.translate.002
  lesson_content_key: fa.a1.unit50.lesson01.new_restaurant_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, phrase]
      agreement_tags:
        semantic: [en_fa_a1_unit50_lesson02_words, en_fa_a1_unit50_lesson03_words, en_fa_a1_unit50_lesson04_words]
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Farsi word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit50.lesson01.order.003
  lesson_content_key: fa.a1.unit50.lesson01.new_restaurant_one
  type: word_order
  frame:
    text: یک {item} دیگه هم می‌خوام.
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags:
        semantic: [en_fa_a1_unit50_lesson02_words, en_fa_a1_unit50_lesson03_words]
  answer_derivation:
    kind: render_frame
    frame:
      text: یک {item} دیگه هم می‌خوام.
      language_code: fa
      direction: rtl
  feedback_frame:
    text: یک دوغ دیگه هم می‌خوام. -- I want another doogh too.
    language_code: en
    direction: ltr

