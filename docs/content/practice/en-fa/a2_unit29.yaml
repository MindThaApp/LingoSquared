review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 27-31 pass): 2 fixes - (1) lesson05 sentence.005 asked "In the gym you must wear sports shoes." but the only answer is the polite بپوشید, while lesson02 teaches the same sentence with the informal بپوشی; the prompt now asks for the notice-style polite form, and the باید توی باشگاه word order is accepted; (2) lesson04 sentence.007 now also accepts نباید شب بلند حرف بزنی (the order asked about in native question 1). Dumped every slot pool at unit and course scope and read every gloss. ROUTING: the backfill glosses بخوری as "(that) you drink (subjunctive)", but this unit teaches it as "eat" (نباید غذا بخوری); it is shown as the answer in the lesson01 MC and translation pools and in the verb matching pairs; not excludable with the current tags. Sentence anchors (ممنوعه, بلند, بپوشید) have one course-wide candidate; باید {item} بیاری fits both حوله and کفش; no self-reference. Capacity: 23 live templates, no dead or under-floor template, every tier hosts 44/60 lexemes (73%) and 5/6 lessons (lesson06 has only its dialogue phrase lexeme). NATIVE FLAGS: none new. Authored 2026-11-15 for en-fa A2 unit 29 (rules and permission). Mirrors PR #242 (units 22-26): the backfill emits only unit and lesson tags (en_fa_a2_unit29_words, en_fa_a2_unit29_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two both fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). English source_gloss lexemes and phrase lexemes (word lists and dialogue lines) are not drilled. Spoken Tehrani register; no native review yet (the owner approved unreviewed). NATIVE QUESTIONS: (1) Is شب نباید بلند حرف بزنی the natural order (vs نباید شب بلند حرف بزنی)? Recommended: keep as taught. (2) بپوشید in توی باشگاه باید کفش ورزشی بپوشید: polite/plural spoken form is correct. Recommended: yes.'
