review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-11-15 for en-fa A2 unit 29 (rules and permission). Mirrors PR #242 (units 22-26): the backfill emits only unit and lesson tags (en_fa_a2_unit29_words, en_fa_a2_unit29_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two both fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). English source_gloss lexemes and phrase lexemes (word lists and dialogue lines) are not drilled. Spoken Tehrani register; no native review yet (the owner approved unreviewed). NATIVE QUESTIONS: (1) Is شب نباید بلند حرف بزنی the natural order (vs نباید شب بلند حرف بزنی)? Recommended: keep as taught. (2) بپوشید in توی باشگاه باید کفش ورزشی بپوشید: polite/plural spoken form is correct. Recommended: yes.'
