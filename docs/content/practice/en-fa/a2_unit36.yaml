review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 32-36 pass): 1 fix - (1) the pack had no matching_pairs and its structured tier hosted only 2 of 26 lexemes (فرستادن, اومدی); added lesson01.match.003, six pairs over the unit''s nouns and verbs (12 distinct tokens and glosses, no confusable pair). The authoring note about 4 content lexemes is out of date: the backfill now gives 12 (lesson01 adds the errand and travel nouns). Dumped every slot pool at unit and A2-course scope (identical) and read every gloss; the two sentence anchors (فرستادن, اومدی) are single-member at course scope and their frames match the realization. Capacity after the fix: 14 templates, 26 unit lexemes, ALL/recognition/structured/production 46% each (below the 60% bar: the rest are phrase lexemes), lessons 3/6 (lessons 03-05 hold only phrase lexemes). NATIVE FLAGS: none. Authored 2026-11-15 for en-fa A2 unit 36 (in order to). Mirrors PR #242 (units 22-26): the backfill emits only unit and lesson tags (en_fa_a2_unit36_words, en_fa_a2_unit36_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two both fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). English source_gloss lexemes and phrase lexemes (word lists and dialogue lines) are not drilled. Spoken Tehrani register; no native review yet (the owner approved unreviewed). NOTE: very thin unit (4 content lexemes: پست, بازار, فرستادن, اومدی); the 12-item checkpoint bar cannot be met from this unit alone and needs a content-word backfill from the realization. NATIVE QUESTIONS: (1) Is رفتم پست برای فرستادن یه نامه natural? Recommended: yes. (2) Is دیروز رفتم بازار natural without به? Recommended: yes in speech.'
