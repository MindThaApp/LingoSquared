schema_version: '1.0'
pack_key: practice.en-fa.b1.unit16
source_language: en
target_language: fa
unit_content_key: fa.b1.unit16.goals_and_plans
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    6 distinct fa lexemes across 3 lessons with lexemes (study_goal, saving_goal, work_goal). CAPACITY-THIN
    unit: far below the recipe's 40-distinct-item pack floor and 12-template floor by construction --
    the realization itself introduces very few fa lexemes in this unit (a themed vocabulary unit with
    1-4 content words per lesson plus proper names / a reading sign / a wrap-up sentence). Authored what
    the pool supports; not padded with untaught vocabulary. matching_pairs anchored to work_goal (6 pairs),
    pooled over the unit-wide non-proper-noun distinct tokens (6 available). Template mix: recognition(multiple_choice)=3,
    structured(matching_pairs x1, word_order x2)=3, production(translation)=3, total=9. No listen_select authored (fa has
    no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes such templates). No mis-glossed
    lexemes found in this pool (every gloss checked against what the unit realization teaches).
    Polish 2026-07-25: match.003 slots switched from bare-POS to teamwork_word + ability_purpose_verb
    (exactly the unit's 6 content tokens, no course-scope extras) so Endless Practice stays on-theme;
    structured tier brought to 3 live with two word_order templates: one on the dialogue's
    yaaddaasht-haa sentence (personal_progress_word noun slot; course extras faarsi-am/faarsi-ash both
    grammatical objects of morur kardan) and one drilling ro-before-verb order with a teamwork_word
    noun slot (all four course candidates grammatical objects of shoru kardan). Unit stays
    capacity-thin by construction (7 fa lexemes) -- not padded with untaught vocabulary.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - teamwork_word
    - ability_purpose_verb
    - personal_progress_word
templates:
- content_key: practice.en-fa.fa.b1.unit16.lesson01.choose.001
  lesson_content_key: fa.b1.unit16.lesson01.study_goal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
    language_code: en
    direction: ltr
- content_key: practice.en-fa.fa.b1.unit16.lesson01.translate.002
  lesson_content_key: fa.b1.unit16.lesson01.study_goal
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: fa
