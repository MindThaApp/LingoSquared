schema_version: '1.0'
pack_key: practice.en-fa.b1.unit16
source_language: en
target_language: fa
unit_content_key: fa.b1.unit16.goals_and_plans
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    6 distinct fa lexemes across 3 lessons with lexemes (study_goal, saving_goal, work_goal). CAPACITY-THIN
    unit: far below the recipe's 40-distinct-item pack floor and 12-template floor by construction --
    the realization itself introduces very few fa lexemes in this unit (a themed vocabulary unit with
    1-4 content words per lesson plus proper names / a reading sign / a wrap-up sentence). Authored what
    the pool supports; not padded with untaught vocabulary. matching_pairs anchored to work_goal (6 pairs),
    pooled over the unit-wide non-proper-noun distinct tokens (6 available). Template mix: recognition(multiple_choice)=3,
    structured(matching_pairs)=1, production(translation)=3, total=7. No listen_select authored (fa has
    no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes such templates). No mis-glossed
    lexemes found in this pool (every gloss checked against what the unit realization teaches).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
templates:
- content_key: practice.en-fa.fa.b1.unit16.lesson01.choose.001
  lesson_content_key: fa.b1.unit16.lesson01.study_goal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
    language_code: en
    direction: ltr
- content_key: practice.en-fa.fa.b1.unit16.lesson01.translate.002
  lesson_content_key: fa.b1.unit16.lesson01.study_goal
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
