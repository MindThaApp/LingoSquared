schema_version: "1.0"
pack_key: practice.en-fa.a1.unit15
source_language: en
target_language: fa
unit_content_key: fa.a1.unit15.comparisons
review:
  status: reviewed
  fresh_context: true
  notes: >-
    Authored 2026-07-07 by the practice-content-gap-closing pass (en-fa
    units 12-15), same pass as a1_unit12.yaml/a1_unit13.yaml/
    a1_unit14.yaml -- see a1_unit12.yaml's notes for the shared
    backfill_lexemes.py coordination with the parallel 09-11 lane.

    Two semantic groups: "comparative_word" pools ALL 8 colloquial
    comparative forms taught across this unit's four vocabulary lessons
    (بزرگ‌تره/کوچیک‌تره/گرون‌تره/ارزون‌تره/بلند‌تره/جوون‌تره/بهتره/
    بد‌تره) into one set rather than fragmenting into four separate
    2-member per-lesson groups, since every member shares the exact same
    "-تره/-ه" contracted comparative-copula form -- this gives a much
    richer 8-candidate pool for multiple_choice/matching_pairs/
    translation than any per-lesson subset would (بهتره already existed
    from unit07 with no semantic tag of its own; this is a clean
    additive tag). "demonstrative_word" (این/اون, 2 members course-wide,
    matching/translation-only) is intentionally kept separate rather
    than folded into comparative_word since این/اون are pronouns, not
    comparative forms.

    2026-07-24 RE-AUTHORED (unit-scope DEAD-template fix pass, PACK-ONLY,
    per docs/content/PRACTICE_PACK_RECIPE.md). scripts/_practice_unit_scope_check.py
    flagged 5 DEAD template-slots -- all recipe DO-NOT #2 (a slot constrained to
    vocabulary taught in an EARLIER unit is invisible to generate_checkpoint(),
    which scopes candidates to THIS unit's own lexemes only):

    (a) demonstrative_match.001 (matching_pairs, needed 2 distinct
    "demonstrative_word" fills). This unit's OWN lesson01 genuinely teaches BOTH
    این and اون (confirmed directly in docs/content/realizations/fa/
    a1_unit15_comparisons.yaml), but backfill_lexemes.py keys a bare token to only
    the FIRST unit that ever introduces it project-wide, and این was already
    claimed by unit03/lesson05 -- so unit15's own demonstrative_word pool is really
    just {اون}, 1 member: never enough for a 2-pair (let alone the recipe's 6-pair
    floor) matching_pairs. DROPPED -- not fixable PACK-ONLY (would need a
    unit15-scoped "این" provenance in the backfill script); LOGGED for the
    coordinator's backfill lane, not attempted here.

    (b) person_taller_order.005 and person_younger_order.006 (word_order)
    constrained person_name_one/two to the course-wide "person_name" tag
    (نیما/سارا), which THIS unit's own lessons never introduce (established in
    units 01/02/07/09-11) -- 0 unit-scoped candidates, DEAD by construction.
    DROPPED and REPLACED with per-lesson templates (see below) so lesson03 stays
    represented in the checkpoint without leaning on an earlier unit's names.

    Also found and fixed BY HAND two more instances of the identical defect that
    scripts/_practice_unit_scope_check.py's per-slot check does not catch (it flags
    a slot with ZERO unit-scoped candidates, but not a `distinct`-related slot pair
    whose unit-scoped pool has only 1 member -- exactly این/اون's situation):
    basic_comparison_order.003 and full_comparison_reason_order.007 both declared
    demonstrative_word_one/word_two as a DISTINCT pair. At unit (checkpoint) scope
    the pool is {اون} only (1 member) -- fill_slots() can never pick 2 distinct
    values from it, so both templates were silently dead at the checkpoint despite
    validating clean and despite genuinely working in Endless Practice, where
    course scope (a1) also has unit03's این and the pool is 2. This is recipe
    SS1.1's unit-vs-course distinction exactly. FIXED by keeping این/اون as
    literal, non-slotted frame text (decorative connective words here, not the
    slot under test; neither is a candidate value of any slot in the same frame,
    so there is no self-reference conflict) and slotting only comparative_word,
    whose unit-native pool is 7 members (8 at a1-course scope with unit07's
    بهتره; re-checked by hand that "این از اون {comparative_word}" and
    "... {comparative_word_one} چون {comparative_word_two}" stay grammatical for
    every member at both scopes -- unit07's بهتره carries a parenthetical
    "(spoken, 'we'd better')" note in its gloss, but the core comparative sense is
    identical and this unit's own lesson04 exercise IS literally "این از اون بهتره").

    Widened the pack from 10 to 14 templates using ONLY this unit's own
    comparative_word (7 native members) and demonstrative_word (اون, 1 native
    member) pools -- no new backfill tag, no vocabulary from another unit. Added
    one word_order ("این از اون {comparative_word}"), one multiple_choice, and one
    bare-word translation per lesson01-03 (comparative_word union, per SS8.1 step
    2's "anchor per lesson, pool across the unit" pattern), so every lesson with
    real vocabulary (01-04; 05/06 introduce no new tokens at all per
    backfill_lexemes.py's iter_specs -- genuinely un-coverable, not a gap fixable
    PACK-ONLY) now has a live template in all three tiers. Final: 14 templates,
    recognition 4 / structured 6 / production 4, lessons 01-04 each represented in
    every tier. This unit's real vocabulary remains genuinely thin (~10 distinct fa
    tokens total) -- volume comes from re-anchoring the same union pool per lesson,
    not from padding with untaught/other-unit vocabulary.

    scripts/_practice_unit_scope_check.py: 0 DEAD (was 5), 0 below-floor.
    compile_content.py practice-validate: 0 errors. No fill_in_blank in this pack.
    No mis-glossed lexeme found in this unit's own pool (every gloss re-read
    against docs/content/realizations/fa/a1_unit15_comparisons.yaml).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic: [comparative_word, demonstrative_word]
slot_presets:
  comparative_word: &comparative_word {language_code: fa, part_of_speech: verb, agreement_tags: {semantic: comparative_word}}
  demonstrative_word: &demonstrative_word {language_code: fa, part_of_speech: pronoun, agreement_tags: {semantic: demonstrative_word}}
templates:
  # lesson01 -- basic_comparative (اون, بزرگ‌تره, کوچیک‌تره)
  - content_key: practice.en-fa.fa.a1.unit15.lesson01.comparative_choice.001
    lesson_content_key: fa.a1.unit15.lesson01.basic_comparative
    type: multiple_choice
    frame: {text: "{comparative_word}", language_code: fa, direction: rtl}
    slots: {comparative_word: *comparative_word}
    answer_derivation: {kind: slot_gloss, slot: comparative_word}
    feedback_frame: {text: "{comparative_word} is a comparative form from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit15.lesson01.basic_comparison_order.002
    lesson_content_key: fa.a1.unit15.lesson01.basic_comparative
    type: word_order
    frame: {text: "این از اون {comparative_word}", language_code: fa, direction: rtl}
    slots: {comparative_word: *comparative_word}
    answer_derivation: {kind: render_frame, frame: {text: "این از اون {comparative_word}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "این از اون marks the comparison point, like این از اون بزرگ‌تره.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit15.lesson01.demonstrative_translate.003
    lesson_content_key: fa.a1.unit15.lesson01.basic_comparative
    type: translation
    frame: {text: "{demonstrative_word}", language_code: en, direction: ltr, slot_rendering: {demonstrative_word: english_gloss}}
    slots: {demonstrative_word: *demonstrative_word}
    answer_derivation: {kind: slot_text, slot: demonstrative_word}
    feedback_frame: {text: "The Farsi word is {demonstrative_word}.", language_code: en, direction: ltr}

