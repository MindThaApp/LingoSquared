schema_version: '1.0'
pack_key: practice.en-fa.b1.unit13
source_language: en
target_language: fa
unit_content_key: fa.b1.unit13.time_clauses
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    19 distinct fa lexemes across 6 lessons with lexemes (future_when_done, past_when_arrived, habitual_whenever,
    dialogue_after_meeting, reading_schedule, wrapup_production). matching_pairs anchored to dialogue_after_meeting
    (8 pairs), pooled over the unit-wide non-proper-noun distinct tokens (19 available). Template mix:
    recognition(multiple_choice)=6, structured(matching_pairs x1, word_order x2)=3, production(translation)=6, total=15.
    No listen_select authored (fa has no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes
    such templates). No mis-glossed lexemes found in this pool (every gloss checked against what the unit
    realization teaches).
    Polish 2026-07-25: match.003 slots switched from bare-POS to time_clause_verb + polite_request_verb
    (10 unit verb tokens, no course-scope extras) so Endless Practice stays on-theme; added a word_order
    on the realization hero (vaghti kelaas tamoom beshe, behet zang mizanam) anchored by class_word
    (single distinct course token kelaas) and a word_order acceptance-reply frame anchored by accept_word
    (unit candidate aalie; course extras baashe/ghabuleh both grammatical in the frame).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - time_clause_verb
    - polite_request_verb
    - class_word
    - accept_word
templates:
- content_key: practice.en-fa.fa.b1.unit13.lesson01.choose.001
  lesson_content_key: fa.b1.unit13.lesson01.future_when_done
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
    language_code: en
    direction: ltr
