schema_version: '1.0'
pack_key: practice.en-fa.b1.unit13
source_language: en
target_language: fa
unit_content_key: fa.b1.unit13.time_clauses
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: |-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 3 fixes).
    (1) All six choose + six translate templates had no semantic tag (course 449: the whole B1 level in Endless, incl. later units) -> unit words (en_fa_b1_unit13_words; noun/verb/adjective, 18). (2) lesson04.match.003 pooled 10 verbs for 8 pairs (almost the same cards every time) -> all 13 unit verbs; feedback no longer says 'verb form' (pool now includes aalie / roshane). (3) choose feedback 'introduced in this unit' -> 'from this unit'.
    Checked: order.003 'وقتی کلاس تموم بشه، بهت زنگ می‌زنم.' and order.004 'عالیه، پس ساعت پنج می‌بینمت.' natural, single course candidates.
    NATIVE FLAGS: backfill gloss of mi-zane is 'he/she wears (glasses); he/she hits' but this unit uses it in zang mi-zane 'he/she calls'; behetoon (preposition) carries the verb tag polite_request_verb (harmless here, pos filters it).

    19 distinct fa lexemes across 6 lessons with lexemes (future_when_done, past_when_arrived, habitual_whenever, dialogue_after_meeting, reading_schedule, wrapup_production). matching_pairs anchored to dialogue_after_meeting (8 pairs), pooled over the unit-wide non-proper-noun distinct tokens (19 available). Template mix: recognition(multiple_choice)=6, structured(matching_pairs x1, word_order x2)=3, production(translation)=6, total=15. No listen_select authored (fa has no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes such templates). No mis-glossed lexemes found in this pool (every gloss checked against what the unit realization teaches). Polish 2026-07-25: match.003 slots switched from bare-POS to time_clause_verb + polite_request_verb (10 unit verb tokens, no course-scope extras) so Endless Practice stays on-theme; added a word_order on the realization hero (vaghti kelaas tamoom beshe, behet zang mizanam) anchored by class_word (single distinct course token kelaas) and a word_order acceptance-reply frame anchored by accept_word (unit candidate aalie; course extras baashe/ghabuleh both grammatical in the frame).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - time_clause_verb
    - polite_request_verb
    - class_word
    - accept_word
    - en_fa_b1_unit13_words
