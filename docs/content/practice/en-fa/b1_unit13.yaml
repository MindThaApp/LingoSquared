    language_code: fa
    direction: rtl
  slots:
    first: &id001
      language_code: fa
      part_of_speech:
      - verb
      agreement_tags:
        semantic:
        - time_clause_verb
        - polite_request_verb
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
    seventh: *id001
    eighth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
    - seventh
    - eighth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Match each Persian verb form from this unit with its English meaning.
    language_code: en
    direction: ltr
