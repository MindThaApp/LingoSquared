schema_version: '1.0'
pack_key: practice.en-fa.b2.unit08
source_language: en
target_language: fa
unit_content_key: fa.b2.unit08.synthesis
review:
  status: unreviewed
  fresh_context: 'false'
  required_next_reviewer: native_speaker_review
  notes: 'Authored 2026-10-19 against docs/content/PRACTICE_PACK_RECIPE.md so the en-fa B2 unit08 checkpoint
    can generate (before this, en-fa B2 had no lexemes and no packs). Lexemes come from the B2 extension
    of scripts/backfill_lexemes.py (same branch). Grammar/discourse unit, so the 8.1 pattern is used:
    unit-wide curated pools, every template anchored to one lesson. 14 templates over all 3 lessons: multiple_choice
    x3 (nouns / adjectives / verbs+adverbs over b2u08_core), matching_pairs x2 (nouns; adjectives+adverbs+verbs),
    word_order x6 (two per lesson, each the unit''s own example sentence with one single-member anchor
    b2u08_<word>_single, exactly 1 course-wide candidate, not a literal of its own frame), translation
    x3 (bare-word, one per lesson over b2u08_vert_l<N>: nouns/adjectives/adverbs, no verbs, minus tokens
    with a second common Persian answer). No listen_select (no fa TTS), no fill_in_blank (the runtime
    shows no English cue for the blank), no fixed-sentence translation. All tags are unit-specific, so
    course scope == unit scope for every slot. Glosses are English-only, so no MC option or translation
    prompt contains Persian script. MEASURED (recipe 9 step 4, filter .b2.unit08.): 39/45 fa lexemes hostable;
    recognition and structured host 39, production 27; 3/3 lessons in every tier; no dead template, every
    MC pool >=3 distinct glosses, every matching pool >=6. Offline port of generate_checkpoint(): 15/15
    items on 5 seeds. practice-validate: 0 errors. Native review: khanandeh is re-glossed ''reader'' (earlier
    levels: ''singer''); kholaseh is kept out of the pools so ''summary'' and jam''bandi ''summing-up;
    synthesis'' never meet in one matching item. Glosses are draft (backfill), pending native-Persian
    review together with this pack.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - b2u08_core
    - b2u08_vert_l1
    - b2u08_vert_l2
    - b2u08_vert_l3
    - b2u08_bagh_single
    - b2u08_manabe_single
    - b2u08_ghanekonandehtar_single
    - b2u08_davari_single
    - b2u08_moshtarak_single
    - b2u08_etelaat_single
