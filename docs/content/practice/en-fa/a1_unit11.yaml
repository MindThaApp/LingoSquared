schema_version: "1.0"
pack_key: practice.en-fa.a1.unit11
source_language: en
target_language: fa
unit_content_key: fa.a1.unit11.routines
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 4 fixes). (1)
    routine_phrase_translate.010: dropped the long sentence شب‌ها ساعت یازده می‌خوابم
    from typed production (the unit overlay accepts several word orders, practice
    translation can only accept one): pool now the lesson02/lesson05 phrases (4). (2)
    routine_verb_match.002 frame said "Persian phrase" for a mixed word/phrase pool. (3)
    routine_connector_match.006 frame said "word" and feedback claimed "these words
    sequence and compare" for a pool that includes verbs/phrases: reworded. (4)
    unit_review_match.011 frame text cleaned. NATIVE FLAGS / LIMITATION: typed answers
    accept only the taught order (میرم سر کار, not سر کار میرم; ساعت چند بیدار می‌شی؟
    without تو), as the schema has no alternative-answer field for translation.

    Authored 2026-07-07, part of the same pass as a1_unit09.yaml/
    a1_unit10.yaml closing the practice-content gap for A1 units 09-11 --
    see a1_unit09.yaml's notes for the shared scripts/backfill_lexemes.py
    UNIT_FILES/FA_GLOSSES extension this pass made.

    Three semantic groups, all verified against the real iter_specs()
    output before authoring: "routine_verb_phrase" (بیدار می‌شم/صبحونه
    می‌خورم/میرم سر کار/می‌خوابم, 4 members -- three auto-derived
    multi-token phrase lexemes plus می‌خوابم, which only has one
    introduced_token but is still a genuine member of the same closed
    set of core routine verbs, anchored lesson01) and "routine_connector"
    (هر/بعدش/یه‌کم/دیرتر/معمولاً, 5 members, the sequencing/comparison
    adverbs used to describe a routine -- anchored lesson06, the
    "completing" lesson, since معمولاً isn't taught until then).
    "routine_phrase" pools this unit's own genuine taught full-question/
    full-statement phrases (auto-derived by iter_specs() from this
    unit's own multi-token teaching cards: ساعت چند بیدار می‌شی؟ / هر
    روز / شب‌ها ساعت یازده می‌خوابم / تو چی؟ / یه‌کم دیرتر, 5 members) --
    same explicit-allow-list approach as a1_unit09.yaml's time_phrase and
    a1_unit10.yaml's date_phrase, for the same reason (avoids sweeping in
    lesson06's third_person_forms grammar_note card, whose auto-derived
    phrase includes an awkward "(او)" parenthetical not fit for a clean
    practice item).

    Left out: بیدار می‌شه/می‌خوابه (lesson06's third-person verb forms) --
    می‌شه collides in FA_GLOSSES with the unrelated existing A2
    bureaucracy sense ("would it be possible", from می‌شه بگید) since
    FA_GLOSSES is keyed on bare token text project-wide; reusing it here
    for its different "becomes" sense would show a misleading gloss in a
    generated exercise, so this 2-member set was deliberately not tagged
    or used, matching this task's instruction that thin/messy real
    vocabulary is better left out than forced in. This is a pre-existing
    corpus-wide homograph limitation (also true of نه "no"/"nine" in
    a1_unit10's dialogue), not something this pass's own additions
    caused, and out of scope to fix here.

    Verified with scripts/_practice_slot_check.py's lexeme_matches()/
    check_pack() logic against the real (updated) iter_specs() output --
    clean, no zero-candidate slots, no under-3 multiple_choice/
    matching_pairs slots. scripts/_fill_in_blank_ambiguity_check.py: zero
    fill_in_blank templates authored -- same reasoning as a1_unit09.yaml/
    a1_unit10.yaml (every multi-member group has genuinely distinct,
    non-synonymous candidates -- e.g. a "بعدش {routine_verb_phrase}"
    frame would NOT safely disambiguate which of the 4 routine verbs
    comes next, and a bare "{slot}" frame is disallowed by
    AUTHORING_GUIDE.md #13 regardless -- and the compiler's own #17
    ambiguity hard-fail would reject such a template anyway).
    compile_content.py practice-validate clean (0 errors/0 warnings) for
    the full en-fa pack including this new file. Needs the standard
    fresh-context review before import.

    REAUTH 2026-07-24 (unit-scope DEAD fix, pack-only):
    scripts/_practice_unit_scope_check.py found 5 DEAD template-slots here.
    Two distinct root causes:
    (1) lesson06.routine_and_day_part_match.012's dp1-4 slots referenced
    "day_part_word" -- a tag that has ZERO real unit-scoped candidates in
    this unit (it is a1_unit09.yaml's tag, apparently copy-pasted here by
    mistake; this unit's only real day-part content is a single combined
    reviewed_phrase "صبح، ظهر، عصر، شب" = "morning, noon, afternoon, night",
    not four standalone day-part lexemes). DROPPED the whole template
    (pack-only cannot invent the 4 missing day_part_word-tagged lexemes it
    would need; a genuine fix would need backfill_lexemes.py to classify
    the four words inside that combined phrase as their own lexemes --
    logged for the coordinator, not attempted here). Pack stays viable
    without it: 11 templates remain (was 12), still 3 recognition / 5
    structured / 3 production, all lessons with lexemes still represented.
    (2) lesson06.unit_review_match.011's two-subgroup structure (rv-group
    of 4 over routine_verb_phrase, rc-group of 5 over routine_connector)
    was flagged DEAD by the checker's simplified matching_pairs check
    (which only tests ONE slot's tag pool against the template's largest
    distinct-group size) even though each subgroup's own pool exactly
    matched its own need (4-for-4, 5-for-5) -- so it was not literally
    dead at runtime, only exact-fit (0 variety: every generated instance
    used the identical 9 members). Fixed properly rather than leaving a
    validator-placating no-op: flattened it into ONE 9-slot distinct group
    over a new `unit_review_word` union preset (this unit's own 3 real
    semantic tags -- routine_verb_phrase + routine_connector +
    routine_phrase -- 14 distinct total), so it now genuinely varies
    (draws 9 of 14 per instance) instead of being a fixed set.
    Also widened the three below-floor matching_pairs (each declared
    4-5 slots, exactly matching one narrow tag's own pool, <6-pair floor)
    to the same `unit_review_word` union at 6 slots each: lesson01.
    routine_verb_match.002 (was routine_verb_phrase alone, 4), lesson06.
    routine_connector_match.006 (was routine_connector alone, 5), lesson06.
    routine_phrase_match.009 (was routine_phrase alone, 5). This is the
    SS8.1-point-2 pattern deliberately: several templates anchored to
    different lessons, all pooling the same unit-wide union, each drawing
    a different random subset per instance.
    Checked the 14-item union pool by hand for confusable glosses: هر
    "every" / بعدش "after that" / یه‌کم "a little (spoken)" / دیرتر
    "later" / معمولاً "usually" plus the 4 routine_verb_phrase and 5
    routine_phrase entries are all distinct; یه‌کم "a little" and یه‌کم
    دیرتر "a little later" are related but not interchangeable paraphrases
    (kept both, per recipe SS6.3). All 3 tags are unit11-exclusive
    (grepped scripts/backfill_lexemes.py), so course scope == unit scope
    here; no Endless-Practice-only risk introduced.
    After fix: scripts/_practice_unit_scope_check.py reports 0 DEAD, 0
    below-floor for this pack. Tiers: recognition 3, structured 5,
    production 3, 11 templates total (was 12; the one drop is 012, logged
    above).
tag_schema:
  part_of_speech: [phrase, verb, adjective, adverb, noun]
  agreement_tags:
    semantic: [routine_verb_phrase, routine_connector, routine_phrase,
      en_fa_a1_unit11_lesson02_words, en_fa_a1_unit11_lesson05_words]
slot_presets:
  routine_verb_phrase: &routine_verb_phrase {language_code: fa, part_of_speech: [phrase, verb], agreement_tags: {semantic: routine_verb_phrase}}
  routine_connector: &routine_connector {language_code: fa, part_of_speech: [adjective, adverb], agreement_tags: {semantic: routine_connector}}
  routine_phrase: &routine_phrase {language_code: fa, part_of_speech: phrase, agreement_tags: {semantic: routine_phrase}}
  # REAUTH 2026-07-24: union of this unit's own 3 real semantic tags (14
  # distinct: 4 routine_verb_phrase + 5 routine_connector + 5 routine_phrase),
  # per SS3.1a/SS8.1 -- used to re-anchor the below-floor matching_pairs
  # templates that were declaring only their own narrow tag's exact pool size.
  unit_review_word: &unit_review_word {language_code: fa, part_of_speech: [phrase, verb, adjective, adverb], agreement_tags: {semantic: [routine_verb_phrase, routine_connector, routine_phrase]}}
  # Review 2026-10-22: short routine phrases only for typed production (the
  # long lesson03 sentence has several accepted word orders in the unit).
  routine_phrase_short: &routine_phrase_short {language_code: fa, part_of_speech: phrase, agreement_tags: {semantic: [en_fa_a1_unit11_lesson02_words, en_fa_a1_unit11_lesson05_words]}}
templates:
  - content_key: practice.en-fa.fa.a1.unit11.lesson01.routine_verb_choice.001
    lesson_content_key: fa.a1.unit11.lesson01.routine_verbs
    type: multiple_choice
    frame: {text: "{routine_verb_phrase}", language_code: fa, direction: rtl}
    slots: {routine_verb_phrase: *routine_verb_phrase}
    answer_derivation: {kind: slot_gloss, slot: routine_verb_phrase}
    feedback_frame: {text: "{routine_verb_phrase} is one of the core routine verbs from this lesson.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit11.lesson01.routine_verb_match.002
    lesson_content_key: fa.a1.unit11.lesson01.routine_verbs
    type: matching_pairs
    frame: {text: "Match each word or phrase with its meaning.", language_code: en, direction: ltr}
    slots: {first: *unit_review_word, second: *unit_review_word, third: *unit_review_word, fourth: *unit_review_word, fifth: *unit_review_word, sixth: *unit_review_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "These are core words and phrases for describing a daily routine.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit11.lesson01.routine_verb_translate.003
    lesson_content_key: fa.a1.unit11.lesson01.routine_verbs
    type: translation
    frame: {text: "{routine_verb_phrase}", language_code: en, direction: ltr, slot_rendering: {routine_verb_phrase: english_gloss}}
    slots: {routine_verb_phrase: *routine_verb_phrase}
    answer_derivation: {kind: slot_text, slot: routine_verb_phrase}
    feedback_frame: {text: "The Persian phrase is {routine_verb_phrase}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit11.lesson01.routine_verb_word_order.004
    lesson_content_key: fa.a1.unit11.lesson01.routine_verbs
    type: word_order
    frame: {text: "{routine_verb_phrase_one} و {routine_verb_phrase_two}", language_code: fa, direction: rtl}
    slots: {routine_verb_phrase_one: *routine_verb_phrase, routine_verb_phrase_two: *routine_verb_phrase}
    slot_relations: [{kind: distinct, slots: [routine_verb_phrase_one, routine_verb_phrase_two]}]
    answer_derivation: {kind: render_frame, frame: {text: "{routine_verb_phrase_one} و {routine_verb_phrase_two}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "و joins two routine activities, like بیدار می‌شم و صبحونه می‌خورم.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit11.lesson06.routine_connector_choice.005
    lesson_content_key: fa.a1.unit11.lesson06.routine_dialogue
    type: multiple_choice
    frame: {text: "{routine_connector}", language_code: fa, direction: rtl}
    slots: {routine_connector: *routine_connector}
    answer_derivation: {kind: slot_gloss, slot: routine_connector}
    feedback_frame: {text: "{routine_connector} is used to sequence or compare parts of a daily routine.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit11.lesson06.routine_connector_match.006
    lesson_content_key: fa.a1.unit11.lesson06.routine_dialogue
    type: matching_pairs
    frame: {text: "Match each word or phrase with its meaning.", language_code: en, direction: ltr}
    slots: {first: *unit_review_word, second: *unit_review_word, third: *unit_review_word, fourth: *unit_review_word, fifth: *unit_review_word, sixth: *unit_review_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each word or phrase to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit11.lesson06.routine_connector_translate.007
    lesson_content_key: fa.a1.unit11.lesson06.routine_dialogue
    type: translation
    frame: {text: "{routine_connector}", language_code: en, direction: ltr, slot_rendering: {routine_connector: english_gloss}}
    slots: {routine_connector: *routine_connector}
    answer_derivation: {kind: slot_text, slot: routine_connector}
    feedback_frame: {text: "The Persian word is {routine_connector}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit11.lesson06.routine_phrase_choice.008
    lesson_content_key: fa.a1.unit11.lesson06.routine_dialogue
    type: multiple_choice
    frame: {text: "{routine_phrase}", language_code: fa, direction: rtl}
    slots: {routine_phrase: *routine_phrase}
    answer_derivation: {kind: slot_gloss, slot: routine_phrase}
    feedback_frame: {text: "{routine_phrase} is one of this unit's key routine phrases.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit11.lesson06.routine_phrase_match.009
    lesson_content_key: fa.a1.unit11.lesson06.routine_dialogue
    type: matching_pairs
    frame: {text: "Match each phrase with its meaning.", language_code: en, direction: ltr}
    slots: {first: *unit_review_word, second: *unit_review_word, third: *unit_review_word, fourth: *unit_review_word, fifth: *unit_review_word, sixth: *unit_review_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each phrase to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit11.lesson06.routine_phrase_translate.010
    lesson_content_key: fa.a1.unit11.lesson06.routine_dialogue
    type: translation
    frame: {text: "{routine_phrase}", language_code: en, direction: ltr, slot_rendering: {routine_phrase: english_gloss}}
    slots: {routine_phrase: *routine_phrase_short}
    answer_derivation: {kind: slot_text, slot: routine_phrase}
    feedback_frame: {text: "The Farsi phrase is {routine_phrase}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit11.lesson06.unit_review_match.011
    lesson_content_key: fa.a1.unit11.lesson06.routine_dialogue
    type: matching_pairs
    frame: {text: "Match each word or phrase with its meaning.", language_code: en, direction: ltr}
    slots:
      first: *unit_review_word
      second: *unit_review_word
      third: *unit_review_word
      fourth: *unit_review_word
      fifth: *unit_review_word
      sixth: *unit_review_word
      seventh: *unit_review_word
      eighth: *unit_review_word
      ninth: *unit_review_word
    slot_relations:
      - {kind: distinct, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth, ninth]}
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth, ninth]}
    feedback_frame: {text: "This reviews the core routine verbs and the sequencing/comparison words taught in this unit.", language_code: en, direction: ltr}
