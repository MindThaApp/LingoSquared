schema_version: '1.0'
pack_key: practice.en-fa.a1.unit34
source_language: en
target_language: fa
unit_content_key: fa.a1.unit34.post
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-12 as an additive Endless Practice coverage backfill for en-fa A1 unit 34. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.

    POLISH 2026-07-24 (tier-thinness + POS-only matching_pairs pass):
    (1) POS-only matching (lesson01.match.002 + its volume_match.003
    duplicate) is LEFT POS-only, honestly: this unit's backfilled lexemes
    carry no semantic tags at all (only reviewed_phrase on full review
    phrases, plus an occasional pronoun tag), so no union of unit-native
    tags can cover the 6-pair floor, and adding tags would mean editing
    scripts/backfill_lexemes.py -- off-limits to this lane. A wrong union
    is worse than the status quo (rubric class 1 exception). Both raised
    from 4 slots to the 6-pair floor (defect 1.19); the unit-scope pool is
    23 distinct tokens / 23 glosses, so the floor holds at checkpoint scope.
    (2) Tiers were 1 recognition / 2 structured / 2 production; brought all
    three to >=3 live using part_of_speech-subset pools -- the only honest
    differentiation available in an untagged unit; each new pool differs
    from the broad choose.001/translate.003 pools: recognition +=
    lesson01.choose.002 (nouns, 4 unit tokens / 4 glosses) and
    lesson02.choose.001 (verb forms, 7 unit tokens / 7 glosses); structured +=
    lesson01.order.001 ('{first} و {second}', the unit06
    food_item_order.009 coordination precedent: every course-scope pool
    member is a noun and any two nouns coordinate grammatically with و;
    و itself is POS particle so it is never a slot candidate -- no
    defect-1.14 self-reference; the gloss hint fixes the tile order, so
    the answer is not ambiguous); production += lesson05.translate.001
    (bare-word verb translation; POS-only is sanctioned for bare-word
    shapes). The noun MC is anchored to lesson01 (seq 002) because this unit's nouns all live there.

    POLISH WAVE 4 (2026-07-26, commit 05af7ace-successor generated tags): the POS-only honest-leave above is RESOLVED. scripts/backfill_lexemes.py now emits en_fa_a1_unit34_words (and per-lesson en_fa_a1_unit34_lessonNN_words) for every first-introduced content token in this unit, so the matching_pairs slot(s) are re-anchored off bare part_of_speech onto en_fa_a1_unit34_words (12 distinct unit-scoped tokens, POS [noun,verb,adjective,adverb]); course-scope Endless-Practice pool == unit pool by construction, so the off-theme pulls are eliminated. No duplicate-gloss collisions in the resulting pool. Verified with pool_check.py + unit-scope check (0 DEAD, floor holds).

    CRITICAL FIX 2026-07-27 (native review): lesson01.choose.001, translate.003 and its volume_translate were drawing this unit's junk label-phrase lexemes (POS 'phrase' tokens like 'امروز (today) / سال (year) / ...' -- authoring labels the backfill persists because _label_guarded is scoped to units 25-30/37-57, leaving 31-36 in the gap). choose.001 showed the English answer inside the prompt; translate.003's only accepted answer was the unanswerable label string. Narrowed all three item slots from the full unit_word POS list to [noun,verb,adjective,adverb] (mirrors match.002), excluding every 'phrase' lexeme and thus all the junk. Durable source fix (widen _label_guarded + delete the persisted rows) still needs a dev DB and is queued in the backlog.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_fa_a1_unit34_words
slot_presets:
  unit_word:
    language_code: fa
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
