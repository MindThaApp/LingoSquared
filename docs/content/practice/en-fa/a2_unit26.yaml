review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-11-15 for en-fa A2 unit 26 ''It had already happened'' (fa.a2.unit26.already_happened). No curated single-member tags exist for this unit in the en-fa backfill, so pools are unit/lesson tags narrowed by part_of_speech; the only one-member anchor is برگشته (lesson05 verb). No listen_select (no fa TTS). EXCLUDED: the English source_gloss lexemes (language_code en); lessons 03, 04 have no usable lexemes and lesson06 holds only a phrase, so they are reached only through the phrase pool. KEPT but flagged: بسته glossed ''package'' (the unit uses بسته شده = was closed, so the bare-word answer teaches the other sense); تازه, خریده, گذاشته are labelled noun but are an adverb / past participles; جا ''place (as in leave behind)'' is a half gloss for جا گذاشته; رسیده ''arrived; having arrived''. The phrase ''رفته بودم، رفته بود'' has the gloss ''past participle + past of بودن'' (a grammar note, not a translation); it is reachable through the phrase pool. NATIVE SPEAKER CHECK: (1) نیما به خونه برگشته بود as the answer for ''Nima had gone back home'' and its variants; (2) the spoken contraction خونه vs خانه. Backfill fix wanted: gloss for بسته, POS for تازه/خریده/گذاشته, and more content-word lexemes for lessons 03-04 (this unit is thin).'
