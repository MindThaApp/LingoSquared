schema_version: '1.0'
pack_key: practice.en-fa.a1.unit40
source_language: en
target_language: fa
unit_content_key: fa.a1.unit40.lost_items
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (en-fa/en-prs practice pass, fresh context; 2 fixes).
    (1) lesson04 choose.001 unioned reviewed_phrase (~519 phrases course-wide),
    so in Endless Practice "appears in this unit's lost-bag dialogue" could show
    any A1 sentence: replaced by the unit's lesson04 tag (unit pool now آقای +
    the two lesson04 dialogue lines, 3 options). (2) fill.003 feedback leaked the
    internal tag name lost_found_verb_word: rewritten.
    Left (no pack-side lever, gloss lane): backfill glosses embed the Persian
    (گم "in گم کردن", پیدا "in پیدا کردن", آقای "ezafe-linked form of آقا"), which
    makes lesson04 translate.002 (single member آقای) near-trivial; گم "lost (in
    گم کردن ...)" and گمشده "lost (item)" sit together in the lesson05 MC and
    match.003 -- distinguishable only through the embedded Persian.
    NATIVE FLAGS: fill.003 "کیف رو ___؟" also admits دیدی / پیدا کردید; only
    دیدید is taught in this unit.

    Authored against docs/content/PRACTICE_PACK_RECIPE.md for the en-fa a1
    lost-items unit. §0 capacity: 19 lexemes across 5/5 lessons that have
    any new fa lexeme. Semantic tags used: lost_item_word (3,
    unit40-exclusive), lost_found_verb_word (3, unit40-exclusive),
    notice_status_word (2, unit40-exclusive), courtesy_title_word (shared
    with unit41's خانم -- used only in the lesson04 MC/translate, a
    frame-literal-safe type), person_name (course-wide, 34 members --
    likewise only used in lesson04 MC/translate), reviewed_phrase (used
    only in lesson04 MC/translate). §0.1: no mis-glosses found. Both
    word_order frames ("{item} رو گم کردم." and "{item} رو پیدا کردم.") use
    lost_item_word (unit-exclusive, 3 members: کیف/کلید/گذرنامه) and were
    re-read against all three -- "I lost/found my bag/key/passport" is
    grammatical for each. The lesson03 fill_in_blank narrows
    lost_found_verb_word by part_of_speech: verb, which isolates the single
    member دیدید (a genuine single-member anchor, not a union -- گم/پیدا are
    adjectives, not verbs). The lesson05 word_order frame "کیف {item}" uses
    notice_status_word (unit-exclusive, 2 members: گمشده/پیداشده), a
    telegraphic notice-style label ("lost bag" / "found bag") matching the
    unit's own lost-and-found-notice register. 15 templates across all 5
    hostable lessons; tiers: 5 recognition / 5 structured / 5 production.
    REAUTH FIX 2026-07-24: lesson01.match.003 declared 8 matching_pairs
    slots but its part_of_speech: [noun, adjective] constraint excludes
    دیدید (the set's only verb), leaving just 7 unit-scoped distinct
    fills -- DEAD at checkpoint scope per _practice_unit_scope_check.py.
    Trimmed to 7 slots (still above the 6-pair floor) rather than widening
    part_of_speech, to keep the exercise's noun/adjective register intact.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - lost_item_word
    - lost_found_verb_word
    - notice_status_word
    - courtesy_title_word
    - person_name
    - reviewed_phrase
    - en_fa_a1_unit40_lesson04_words

templates:
- content_key: practice.en-fa.fa.a1.unit40.lesson01.choose.001
  lesson_content_key: fa.a1.unit40.lesson01.new_lost_items_one
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, adjective]
      agreement_tags: {semantic: [lost_item_word, lost_found_verb_word]}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is a lost-and-found word from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit40.lesson01.translate.002
  lesson_content_key: fa.a1.unit40.lesson01.new_lost_items_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, adjective]
      agreement_tags: {semantic: [lost_item_word, lost_found_verb_word]}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: '{item} is a lost-and-found word from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit40.lesson01.match.003
  lesson_content_key: fa.a1.unit40.lesson01.new_lost_items_one
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth} · {seventh}'
    language_code: fa
    direction: rtl
  slots:
    first: &unit40_l1_match
      language_code: fa
      part_of_speech: [noun, adjective]
      agreement_tags: {semantic: [lost_item_word, lost_found_verb_word, notice_status_word]}
    second: *unit40_l1_match
    third: *unit40_l1_match
    fourth: *unit40_l1_match
    fifth: *unit40_l1_match
    sixth: *unit40_l1_match
    seventh: *unit40_l1_match
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth, seventh]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth, seventh]
  feedback_frame:
    text: 'Lost items, lost/found verbs, and notice-status words from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit40.lesson01.order.004
  lesson_content_key: fa.a1.unit40.lesson01.new_lost_items_one
  type: word_order
  frame: {text: '{item} رو گم کردم.', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags: {semantic: lost_item_word}
  answer_derivation:
    kind: render_frame
    frame: {text: '{item} رو گم کردم.', language_code: fa, direction: rtl}
  feedback_frame:
    text: 'X رو گم کردم means "I lost X" -- grammatical for bag, key, or passport.'
    language_code: en
    direction: ltr

