    slots: {dialogue_role_word: *dialogue_role_word}
    answer_derivation: {kind: slot_text, slot: dialogue_role_word}
    feedback_frame: {text: "The Farsi word is {dialogue_role_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit16.lesson06.unit_review_match.001
    lesson_content_key: fa.a1.unit16.lesson06.confirming_travel_plans
    type: matching_pairs
    frame: {text: "Match each word with its meaning -- a review of this whole unit's travel vocabulary.", language_code: en, direction: ltr}
    slots:
      tv1: *travel_vocab_word
      tv2: *travel_vocab_word
      tv3: *travel_vocab_word
      tv4: *travel_vocab_word
      dd1: *departure_detail_word
      dd2: *departure_detail_word
      dd3: *departure_detail_word
    slot_relations:
      - {kind: distinct, slots: [tv1, tv2, tv3, tv4]}
      - {kind: distinct, slots: [dd1, dd2, dd3]}
    answer_derivation: {kind: matching_pairs, slots: [tv1, tv2, tv3, tv4, dd1, dd2, dd3]}
    feedback_frame: {text: "This reviews both the basic travel vocabulary and the departure-detail words taught in this unit.", language_code: en, direction: ltr}
