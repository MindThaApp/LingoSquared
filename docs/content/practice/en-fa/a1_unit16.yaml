    slots: {travel_confirmation_word: *travel_confirmation_word}
    answer_derivation: {kind: slot_text, slot: travel_confirmation_word}
    feedback_frame: {text: "The Farsi word is {travel_confirmation_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit16.lesson05.dialogue_role_match.001
    lesson_content_key: fa.a1.unit16.lesson05.ticket_counter_dialogue
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *dialogue_role_word, second: *dialogue_role_word}
    slot_relations: [{kind: distinct, slots: [first, second]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second]}
