schema_version: '1.0'
pack_key: practice.en-fa.a1.unit47
source_language: en
target_language: fa
unit_content_key: fa.a1.unit47.bike_rental

review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 3 fixes). (1) All five choose.001
    unioned reviewed_phrase + person_name (course-wide, ~399 A1 phrases/names in Endless Practice):
    replaced with en_fa_a1_unit47_words (unit pool unchanged at 6). (2) The shared matching_pairs
    anchor had the same leak and a unit pool equal to its slot count: now [rental_word,
    rental_question_phrase, en_fa_a1_unit47_words, salon_word] -- checkpoint scope stays the unit's
    6, Endless adds unit46's barbershop words. (3) All five translate.002 typed pools included
    دوچرخه‌ی 'bicycle of (ezafe-linked form)', a construct form nobody can type from that gloss:
    pooled on the lesson01/lesson02 tags + rental_question_phrase (کرایه, ودیعه, the two questions).
    NATIVE FLAGS: none. Gloss lane: دوچرخه‌ی should be backfilled as bare دوچرخه 'bicycle' (the
    ezafe form stays a recognition-only item until then).

    Vocabulary unit (bike_rental, 7 distinct fa lexemes/phrases across all 5
    lessons per backfill_lexemes_en_fa: rental_word 3 (کرایه "rent/rental
    fee" noun, ودیعه "deposit" noun, دوچرخه‌ی "bicycle of" ezafe-linked noun),
    rental_question_phrase 2 (کوچیک می‌خوای یا بزرگ؟ "Do you want small or
    big?", کی پس می‌دم؟ "When do I give it back?"), 1 person_name (مرادی), 1
    additional reviewed_phrase (آقای مرادی "Mr. Moradi"). Union of all 4 tags
    gives 7 distinct tokens with 7 distinct English glosses -- clears both the
    multiple_choice floor (3) and the matching_pairs floor (6) with 1 to
    spare. 13 templates: 5 lessons x (multiple_choice + bare-word
    translation, both over the full unit-wide union), plus 3 matching_pairs
    over the same 7-token union anchored to lessons01/03/05. word_order
    skipped: rental_word mixes a rent-fee noun, a deposit noun and an
    ezafe-linked bicycle-possessive noun with no single grammatical carrier
    frame found within time budget; rental_question_phrase is two full
    fixed questions, unsuitable for a slot inside another frame. No
    mis-glossed lexemes found. No listen_select (Azure TTS key unset for fa).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - rental_word
    - rental_question_phrase
    - person_name
    - en_fa_a1_unit47_words
    - salon_word
    - en_fa_a1_unit47_lesson01_words
    - en_fa_a1_unit47_lesson02_words

templates:
# --- lesson01 (new_bike_rental_one) ---
- content_key: practice.en-fa.fa.a1.unit47.lesson01.choose.001
  lesson_content_key: fa.a1.unit47.lesson01.new_bike_rental_one
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, phrase]
      agreement_tags:
        semantic: [rental_word, rental_question_phrase, en_fa_a1_unit47_words]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is bike-rental vocabulary from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit47.lesson01.translate.002
  lesson_content_key: fa.a1.unit47.lesson01.new_bike_rental_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, phrase]
      agreement_tags:
        semantic: [en_fa_a1_unit47_lesson01_words, en_fa_a1_unit47_lesson02_words, rental_question_phrase]
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Farsi word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit47.lesson01.match.003
  lesson_content_key: fa.a1.unit47.lesson01.new_bike_rental_one
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fa
    direction: rtl
  slots:
    first: &rental_pool
      language_code: fa
      part_of_speech: [noun, phrase]
      agreement_tags:
        semantic: [rental_word, rental_question_phrase, en_fa_a1_unit47_words, salon_word]
    second: *rental_pool
    third: *rental_pool
    fourth: *rental_pool
    fifth: *rental_pool
    sixth: *rental_pool
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each Farsi word with its English meaning.
    language_code: en
    direction: ltr

