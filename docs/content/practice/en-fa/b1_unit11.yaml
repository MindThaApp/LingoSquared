schema_version: '1.0'
pack_key: practice.en-fa.b1.unit11
source_language: en
target_language: fa
unit_content_key: fa.b1.unit11.reported_speech
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Five lessons with lexemes, 25 fa lexemes. Drills reported yes/no and wh-questions, pronoun shift,
    and plural goftan.


    Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md to unblock this unit's

    checkpoint: the unit had lexemes but no practice pack, so generate_checkpoint() returned

    checkpoint_unavailable. ZERO listen_select is authored - AZURE_SPEECH_KEY is unset, so

    tts_actually_configured('fa') is false and _material() would delete those templates.

    Every slot is satisfiable from THIS unit's own lexemes, because generate_checkpoint()

    calls _material() with only this unit's lesson ids.


    The en-fa B1 lexeme classification carries almost no usable semantic tags (290 of 382 fa

    B1 lexemes are untagged), so the broad recognition / production / matching slots are

    constrained by language_code + part_of_speech only; the few semantic tags that do exist

    are used for the narrow, grammatically safe word_order / fill_in_blank / fixed-sentence

    slots. Every such tag was checked against the real backfill_lexemes.py data: each

    fill_in_blank anchor has exactly ONE distinct COURSE-WIDE candidate (AUTHORING_GUIDE #17

    hard-fail), and for every word_order frame each candidate in the whole B1 course pool is

    grammatical in that frame.


    proper_noun is deliberately excluded from multiple_choice and matching_pairs (the gloss is

    a transliteration, so those items are near-trivial) and is reachable only through a

    dedicated bare-word translation, which is a genuine script-production drill.


    Reviewer must double-check: (a) the Persian in every word_order / fill_in_blank frame reads

    as natural colloquial Iranian Persian and uses only vocabulary already taught in this course;

    (b) glosses that embed the Persian token in a parenthetical example (a backfill gloss-style

    artifact) partly give away the answer in multiple_choice - flagged, not fixable in a pack.


    Template mix: matching_pairs x3, multiple_choice x3, translation x4, word_order x2 (12 total) anchored
    across the 5 lessons that introduce tokens.


    Polish 2026-07-25: the three matching_pairs remain POS-only DELIBERATELY - this unit's fa verbs
    carry no semantic tags at all, and the only tags that could reach 6 unit tokens (pronoun,
    reviewed_phrase) are course-scope-toxic (43-member pronoun pool with confusable kei/ki glosses;
    519 full-sentence reviewed_phrase members). A wrong union is worse than the status quo. Only
    change: match.001 dropped part_of_speech 'phrase' so COURSE-scope Endless Practice stops
    pulling full-sentence phrase cards into the pairs.

    POLISH WAVE 4 (2026-07-26, commit 05af7ace-successor generated tags): the POS-only honest-leave above is RESOLVED. scripts/backfill_lexemes.py now emits en_fa_b1_unit11_words (and per-lesson en_fa_b1_unit11_lessonNN_words) for every first-introduced content token in this unit, so the matching_pairs slot(s) are re-anchored off bare part_of_speech onto en_fa_b1_unit11_words (19 distinct unit-scoped tokens, each matcher's own content parts of speech); course-scope Endless-Practice pool == unit pool by construction, so the off-theme pulls are eliminated. No duplicate-gloss collisions in the resulting pool. Verified with pool_check.py + unit-scope check (0 DEAD, floor holds).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - possession_verb
    - routine_connector
    - en_fa_b1_unit11_words
templates:
- content_key: practice.en-fa.fa.b1.unit11.lesson01.choose.001
  lesson_content_key: fa.b1.unit11.lesson01.reported_yes_no_question
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - verb
      - pronoun
      - adverb
      - noun
      - preposition
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
    language_code: en
    direction: ltr
- content_key: practice.en-fa.fa.b1.unit11.lesson01.order.002
  lesson_content_key: fa.b1.unit11.lesson01.reported_yes_no_question
  type: word_order
  frame:
    text: سارا پرسید که آیا وقت {item}.
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - verb
      agreement_tags:
        semantic: possession_verb
  answer_derivation:
    kind: render_frame
    frame:
      text: سارا پرسید که آیا وقت {item}.
      language_code: fa
      direction: rtl
  feedback_frame:
    text: A reported yes/no question keeps statement order after ke aayaa.
    language_code: en
    direction: ltr
