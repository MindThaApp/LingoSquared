unit_content_key: fa.a2.unit40.the_one_that
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-11-15 for en-fa A2 unit 40 (the one that (relative clauses)). Mirrors PR #250 (units 27-39): the backfill emits only unit and lesson tags (en_fa_a2_unit40_words, en_fa_a2_unit40_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two or more all fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). Phrase lexemes (word lists and dialogue lines) are not drilled, and tokens first introduced in earlier units belong to those units'' pools. Spoken Tehrani register; no native review yet. NATIVE QUESTIONS: (1) Is کیفی که گم کردم / مردی که اونجا نشسته natural spoken relative-clause order? Recommended: yes. (2) Is the indefinite stem (کیفی, مردی) the right thing to show as a vocabulary item? Recommended: keep, glossed before ''that''.'
