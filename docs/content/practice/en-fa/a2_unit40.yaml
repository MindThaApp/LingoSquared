  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_fa_a2_unit40_lesson01_words
    - en_fa_a2_unit40_lesson02_words
    - en_fa_a2_unit40_lesson04_words
    - en_fa_a2_unit40_lesson05_words
