schema_version: "1.0"
pack_key: practice.en-fa.a1.unit06
source_language: en
target_language: fa
unit_content_key: fa.a1.unit06.food
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 6
    fixes). (1) food_match.002 (4 cards) and (2) food_drink_match.002 (6
    cards) showed the same cards every time: now 6 pairs from 8 and 10
    words. (3) quantity_choice/quantity_match pooled every dialogue noun
    of the level (greetings, weather...) with feedback claiming they
    were from this unit: now this unit's lesson02/03/04/06 nouns. (4)
    register_match.004 pooled every dialogue verb of the level with
    feedback claiming they appear in this unit's dialogues: now this
    unit's verbs. (5) drink_choice feedback claimed 'from this lesson'
    for a pool that includes چای; (6) register_translate feedback used
    the label 'ordering-register'. NATIVE FLAGS: written نان in 'من نان
    می‌خوام' vs spoken نون. GLOSS LANE: نوش / جان (see report).

    Authored 2026-07-06 by the practice-pool-sync lane (fa/prs bundle),
    closing the en-fa gap noted in a1_unit05.yaml's own sibling entry
    (scripts/backfill_lexemes.py covered fa units 1-5, but the fa
    realization had grown to unit06/food -- with zero practice coverage).
    Extended scripts/backfill_lexemes.py's UNIT_FILES to include units
    06-08 and a2 units 09-10 in one pass, plus the matching FA_GLOSSES/
    classification-set/agreement-tag additions.

    Three semantic groups, all recognition-only (multiple_choice/
    matching_pairs) plus translation, verified >=3-distinct-candidate via
    a standalone slot-matching check against this script's real
    iter_specs() output before authoring: "food_item" (نان/برنج/مرغ/میوه,
    4 members, anchored lesson01), "drink_item" (چای/آب/قهوه, 3 members,
    anchored lesson01), and "quantity_unit_word" (لیوان/بشقاب, both
    introduced in THIS unit's lesson04, plus کیلو/نصف introduced later in
    a1_unit08 -- deliberately anchored here at lesson04 rather than
    duplicated in both packs, since the tag only needs >=1 real candidate
    lexeme to exist by generation time, not that every candidate be
    introduced in the anchor lesson itself).

    Left out, matching a1_unit05's own established precedent of not
    forcing unrelated single-candidate words into a shared tag: رستوران
    and مشتری (lesson06, 2 members, translation-only territory but not
    worth a dedicated tag given the proportionate scope of this pass),
    and every lesson02/03/05/06 register/politeness phrase (می‌خواستم vs.
    می‌خوام, منو دارید؟, صورت‌حساب رو لطف می‌کنید؟, etc.) -- these are
    single-candidate dialogue phrases, not a natural recognition set.

    Lesson-anchor check per tonight's own found-and-fixed fa-en unit08
    bug: lesson01 and lesson04 both genuinely introduce new vocabulary
    (confirmed by reading the realization file directly), not review-only
    lessons -- safe anchors.

    Verified with scripts/_practice_slot_check.py's lexeme_matches()/
    check_pack() logic against this script's actual iter_specs() output
    (ad hoc harness, not committed) -- all three groups clean, no
    zero-candidate slots, no under-3 multiple_choice/matching_pairs
    slots. compile_content.py practice-validate also clean (0 errors/0
    warnings) for the full en-fa pack (units 01-06 together). Needs the
    standard fresh-context review before import. Same standing blocker as
    every pack in this bundle: no backfill_lexemes.py run has actually
    happened against a real database yet in this pass.

    DEPTH PASS, added 2026-07-06 (practice-pool-sync lane, closing the
    units 06-10 template-density audit gap -- this unit went 9->16).
    Added two new tags to scripts/backfill_lexemes.py's
    fa_agreement_tags(): "ordering_register" (می‌خواستم/می‌خوام, the exact
    2-member polite/informal contrast this unit's own realization already
    drills in lesson02.exercise04 -- matching_pairs/translation only,
    below the >=3 multiple_choice threshold, same class as a1_unit05's
    is_on_side). Also added two safe generative sentence frames using
    ALREADY-fully-covered tags plus a fixed, already-taught connector
    word (never inventing new vocabulary): "من {food_item} می‌خوام."/
    "من {drink_item} می‌خوام." (می‌خوام itself is real taught vocabulary
    from this unit's own lesson02, hardcoded as frame text, not a slot --
    grammatical for every food_item/drink_item member, verified by
    reading each candidate) as new fill_in_blank/word_order templates,
    and "{food_item} و {food_item}"/"{drink_item} یا {drink_item}" word_order
    templates directly mirroring this unit's own realization exercises
    (lesson01.exercise05's "نان و برنج و مرغ" word_bank uses و for
    co-occurring foods; lesson01.exercise07's writing prompt "چای یا قهوه"
    uses یا for an either/or drink choice -- both connectors already
    taught in this unit, and both grammatical for every same-tag pairing
    since there's no semantic clash between any two food items or any two
    drink items). Re-verified with scripts/_practice_slot_check.py against
    the updated iter_specs() output (all new slots have their expected
    real candidate counts: ordering_register=2, food_item/drink_item
    unchanged at 4/3) and compile_content.py practice-validate (0 errors/0
    warnings, full en-fa pack). review.status left unreviewed -- this pass
    does not self-certify review.

    REAUTH PASS 2026-07-24 (fix DEAD templates at checkpoint/unit scope --
    scripts/_practice_unit_scope_check.py, not the whole-direction check the
    notes above describe). generate_checkpoint() scopes candidates to THIS
    unit's own lexemes only; several slots above were satisfiable at
    whole-direction scope but NOT at unit scope, per docs/content/
    PRACTICE_PACK_RECIPE.md DO-NOT #2. Found (each verified against a fresh
    iter_specs() dump filtered to '.a1.unit06.'):
    - drink_item is genuinely only 2 at unit scope (آب, قهوه -- چای is
      drink_item too but was introduced back in a1_unit01, so it doesn't
      count here). drink_choice.001/drink_match.002 were DEAD/below-floor.
      RE-ANCHORED both to a new food_or_drink preset (semantic union
      [food_item, drink_item], both native to THIS unit's own lesson01) --
      6 distinct (نان/برنج/مرغ/میوه/آب/قهوه). drink_match.002 renamed to
      food_drink_match.002 (6 slots, was 3) since it's no longer drink-only;
      drink_choice.001 kept its content_key (still anchors lesson01, wider
      pool now). food_choice/food_match/food_translate untouched (4
      distinct food_item is fine on its own; not duplicating the union
      there to avoid two near-identical 6-pair matches on the same lesson).
    - quantity_unit_word is genuinely only 2 at unit scope (لیوان, بشقاب --
      کیلو/نصف are a1_unit08's own). quantity_choice.001/quantity_match.002
      were DEAD/below-floor. RE-ANCHORED both to a new quantity_or_dialogue
      preset (union [quantity_unit_word, dialogue_word] restricted to
      part_of_speech: noun, all native to this unit) -- 11 distinct nouns
      (لیوان/بشقاب plus 9 dialogue_word nouns from lessons02/03/05/06:
      گارسون/منو/توصیه/میل/جوجه‌کباب/صورت‌حساب/مشتری/البته/برنج).
      quantity_translate.003 untouched (translation has no floor; still
      fine at 2).
    - ordering_register is genuinely only 1 at unit scope (می‌خواستم --
      می‌خوام, the register contrast partner the original notes assumed
      would also be native here, actually first appears in a1_unit03).
      register_match.004 was DEAD (needed 2, had 1). RE-ANCHORED by dropping
      the semantic tag entirely and constraining part_of_speech: verb only
      (safe here -- the frame is the generic "Match each ... with its
      meaning", no literal Persian text, so a broader unit-scoped verb pool
      carries no course-scope grammaticality risk per recipe SS3.1c) -- 6
      distinct unit-scoped verbs (می‌خواستم/می‌کنید/خوبه/بود/میارم/اومدید).
      register_translate.005 untouched (translation, no floor, still fine
      at 1 -- a legitimate single-member anchor).
    dialogue_word added to tag_schema for the above. Re-verified 0 DEAD for
    this file via scripts/_practice_unit_scope_check.py and 0 errors via
    compile_content.py practice-validate. No backfill/realization/overlay
    edits made; food_match's own 4<6 matching_pairs floor gap is left as
    honestly-thin (food_item's real native ceiling in this unit is 4; a
    union with drink_item would just duplicate the widened food_drink_match
    above at the same lesson01 anchor, so it's left alone rather than
    padded into a redundant near-clone).

    POLISH 2026-07-24 (POS-only matching_pairs pass): register_match.004's
    slots were bare part_of_speech verb (the any_verb preset) -- safe at
    unit scope but pulling every A1 verb (~93 tokens) at Endless-Practice
    COURSE scope. Re-anchored to a dialogue_verb preset, semantic union
    [ordering_register, dialogue_word] with part_of_speech verb: at unit
    scope this is the exact same 6 verbs the REAUTH pass measured
    (می‌خواستم/می‌کنید/خوبه/بود/میارم/اومدید, 6 distinct glosses), and at
    course scope it narrows the pool to dialogue-tagged verbs only. Frame
    is English-only, so the wider course pool carries no grammaticality
    risk; both tag values were already in tag_schema. any_verb preset
    removed (register_match.004 was its only user). food_match.002's
    pre-existing 4-pair/4-token floor gap remains the documented
    honest-thin exception above (not part of this pass).
tag_schema:
  part_of_speech: [noun, verb]
  agreement_tags:
    semantic: [food_item, drink_item, quantity_unit_word, ordering_register, dialogue_word, en_fa_a1_unit06_words, en_fa_a1_unit06_lesson02_words, en_fa_a1_unit06_lesson03_words, en_fa_a1_unit06_lesson04_words, en_fa_a1_unit06_lesson06_words]
slot_presets:
  food_item: &food_item {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: food_item}}
  drink_item: &drink_item {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: drink_item}}
  food_or_drink: &food_or_drink {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: [food_item, drink_item]}}
  quantity_unit_word: &quantity_unit_word {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: quantity_unit_word}}
  # Re-pooled 2026-10-22: the bare dialogue_word tag pulled every dialogue
  # noun of the level (greetings, weather, ...) in Endless Practice. Now this
  # unit's own nouns from lessons 02/03/04/06 (lesson05's نوش/جان, glossed
  # only as "part of the phrase", are left out).
  quantity_or_dialogue: &quantity_or_dialogue {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: [en_fa_a1_unit06_lesson02_words, en_fa_a1_unit06_lesson03_words, en_fa_a1_unit06_lesson04_words, en_fa_a1_unit06_lesson06_words]}}
  # Food/drink plus quantity words, so food_match has 6 pairs from 8+ words.
  food_drink_quantity: &food_drink_quantity {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: [food_item, drink_item, quantity_unit_word]}}
  # Food/drink plus the menu-lesson nouns, so food_drink_match is not the same 6 cards every time.
  food_drink_menu: &food_drink_menu {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: [food_item, drink_item, en_fa_a1_unit06_lesson03_words]}}
  ordering_register: &ordering_register {language_code: fa, part_of_speech: verb, agreement_tags: {semantic: ordering_register}}
  # This unit's own verbs (was: every dialogue verb of the level).
  dialogue_verb: &dialogue_verb {language_code: fa, part_of_speech: verb, agreement_tags: {semantic: en_fa_a1_unit06_words}}
templates:
  - content_key: practice.en-fa.fa.a1.unit06.lesson01.food_choice.001
    lesson_content_key: fa.a1.unit06.lesson01.food_and_drink_vocabulary
    type: multiple_choice
    frame: {text: "{food_item}", language_code: fa, direction: rtl}
    slots: {food_item: *food_item}
    answer_derivation: {kind: slot_gloss, slot: food_item}
    feedback_frame: {text: "{food_item} is a food word from this lesson.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson01.food_match.002
    lesson_content_key: fa.a1.unit06.lesson01.food_and_drink_vocabulary
    type: matching_pairs
    frame: {text: "Match each Farsi word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *food_drink_quantity, second: *food_drink_quantity, third: *food_drink_quantity, fourth: *food_drink_quantity, fifth: *food_drink_quantity, sixth: *food_drink_quantity}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each Farsi word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson01.food_translate.003
    lesson_content_key: fa.a1.unit06.lesson01.food_and_drink_vocabulary
    type: translation
    frame: {text: "{food_item}", language_code: en, direction: ltr, slot_rendering: {food_item: english_gloss}}
    slots: {food_item: *food_item}
    answer_derivation: {kind: slot_text, slot: food_item}
    feedback_frame: {text: "The Farsi word is {food_item}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson01.drink_choice.001
    lesson_content_key: fa.a1.unit06.lesson01.food_and_drink_vocabulary
    type: multiple_choice
    frame: {text: "{drink_item}", language_code: fa, direction: rtl}
    slots: {drink_item: *food_or_drink}
    answer_derivation: {kind: slot_gloss, slot: drink_item}
    feedback_frame: {text: "{drink_item} is a food or drink word.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson01.food_drink_match.002
    lesson_content_key: fa.a1.unit06.lesson01.food_and_drink_vocabulary
    type: matching_pairs
    frame: {text: "Match each Farsi word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *food_drink_menu, second: *food_drink_menu, third: *food_drink_menu, fourth: *food_drink_menu, fifth: *food_drink_menu, sixth: *food_drink_menu}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each Farsi word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson01.drink_translate.003
    lesson_content_key: fa.a1.unit06.lesson01.food_and_drink_vocabulary
    type: translation
    frame: {text: "{drink_item}", language_code: en, direction: ltr, slot_rendering: {drink_item: english_gloss}}
    slots: {drink_item: *drink_item}
    answer_derivation: {kind: slot_text, slot: drink_item}
    feedback_frame: {text: "The Farsi word is {drink_item}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson04.quantity_choice.001
    lesson_content_key: fa.a1.unit06.lesson04.quantities
    type: multiple_choice
    frame: {text: "{quantity_unit_word}", language_code: fa, direction: rtl}
    slots: {quantity_unit_word: *quantity_or_dialogue}
    answer_derivation: {kind: slot_gloss, slot: quantity_unit_word}
    feedback_frame: {text: "{quantity_unit_word} has this meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson04.quantity_match.002
    lesson_content_key: fa.a1.unit06.lesson04.quantities
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *quantity_or_dialogue, second: *quantity_or_dialogue, third: *quantity_or_dialogue, fourth: *quantity_or_dialogue, fifth: *quantity_or_dialogue, sixth: *quantity_or_dialogue}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson04.quantity_translate.003
    lesson_content_key: fa.a1.unit06.lesson04.quantities
    type: translation
    frame: {text: "{quantity_unit_word}", language_code: en, direction: ltr, slot_rendering: {quantity_unit_word: english_gloss}}
    slots: {quantity_unit_word: *quantity_unit_word}
    answer_derivation: {kind: slot_text, slot: quantity_unit_word}
    feedback_frame: {text: "The Farsi word is {quantity_unit_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson02.register_match.004
    lesson_content_key: fa.a1.unit06.lesson02.polite_ordering_register
    type: matching_pairs
    frame: {text: "Match each Farsi verb with its meaning.", language_code: en, direction: ltr}
    slots: {first: *dialogue_verb, second: *dialogue_verb, third: *dialogue_verb, fourth: *dialogue_verb, fifth: *dialogue_verb, sixth: *dialogue_verb}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each Farsi verb to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson02.register_translate.005
    lesson_content_key: fa.a1.unit06.lesson02.polite_ordering_register
    type: translation
    frame: {text: "{ordering_register}", language_code: en, direction: ltr, slot_rendering: {ordering_register: english_gloss}}
    slots: {ordering_register: *ordering_register}
    answer_derivation: {kind: slot_text, slot: ordering_register}
    feedback_frame: {text: "{ordering_register} is the verb form for this meaning when ordering.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson02.food_want_order.007
    lesson_content_key: fa.a1.unit06.lesson02.polite_ordering_register
    type: word_order
    frame: {text: "من {food_item} می‌خوام", language_code: fa, direction: rtl}
    slots: {food_item: *food_item}
    answer_derivation: {kind: render_frame, frame: {text: "من {food_item} می‌خوام", language_code: fa, direction: rtl}}
    feedback_frame: {text: "Word order: subject, food item, verb.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson01.food_item_order.009
    lesson_content_key: fa.a1.unit06.lesson01.food_and_drink_vocabulary
    type: word_order
    frame: {text: "{food_item_one} و {food_item_two}", language_code: fa, direction: rtl}
    slots: {food_item_one: *food_item, food_item_two: *food_item}
    slot_relations: [{kind: distinct, slots: [food_item_one, food_item_two]}]
    answer_derivation: {kind: render_frame, frame: {text: "{food_item_one} و {food_item_two}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "و joins two food words, like نان و برنج.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit06.lesson01.drink_item_order.010
    lesson_content_key: fa.a1.unit06.lesson01.food_and_drink_vocabulary
    type: word_order
    frame: {text: "{drink_item_one} یا {drink_item_two}", language_code: fa, direction: rtl}
    slots: {drink_item_one: *drink_item, drink_item_two: *drink_item}
    slot_relations: [{kind: distinct, slots: [drink_item_one, drink_item_two]}]
    answer_derivation: {kind: render_frame, frame: {text: "{drink_item_one} یا {drink_item_two}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "یا joins two drink words as an either/or choice, like چای یا قهوه.", language_code: en, direction: ltr}
