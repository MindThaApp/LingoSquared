schema_version: "1.0"
pack_key: practice.en-fa.a1.unit23
source_language: en
target_language: fa
unit_content_key: fa.a1.unit23.emotions
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Authored 2026-07-09 (en-fa overnight units-20+ practice-depth pass,
    same batch as a1_unit20-22.yaml -- see those files' own notes for
    the shared UNIT_FILES-extension pattern). Extends
    scripts/backfill_lexemes.py with 17 new FA_GLOSSES entries, 2 new
    FA_ADVERBS entries (زیاد/فقط), 6 new FA_ADJECTIVES entries (the core
    feeling words), 9 new FA_VERBS entries (colloquial copula
    contractions + کرده), and 8 new semantic tags. خسته‌ام/خوب/نیستم/
    چطوری/خوبم/من/یکم/چرا/هستی/کار/کردم/چون/امروز/سارا/چه/نیما/تو/نیست
    already existed (established across many earlier units) -- reused
    verbatim.

    Eight semantic groups, all verified via scripts/_practice_slot_check.py:
    "basic_feeling_word" pools the 3 core lesson01 adjectives (خوشحال/
    ناراحت/خسته, anchored lesson01, all 3 genuinely available there).
    "feeling_word" is the FULL growing 6-member superset (adds گشنه at
    lesson02, عصبانی/نگران at lesson03) -- anchored lesson03, the
    completing lesson, same growing-pool precedent already established
    by a1_unit17's own symptom_word (anchored at ITS completing lesson,
    not lesson01, despite 2 of 5 members being taught there). "hunger_
    word" pools گشنه with یکم (2 members, mixed adjective/adverb,
    translation/matching-only, anchored lesson02). "feeling_1st_person_
    word" pools the 5 colloquial "I am X" contractions (anchored
    lesson03, where عصبانی‌ام completes the set) -- deliberately NOT
    built as a generative "{feeling_word}م" word_order frame, since the
    correct contraction suffix genuinely varies by word ending
    (خوشحالم has no inserted vowel, گشنه‌ام/عصبانی‌ام do) and can't be
    derived generically per candidate, the same caution already applied
    to a1_unit19's is_location_verb. "asking_state_word" pools چرا/
    نگرانی (2 members, anchored lesson03, translation/matching-only).
    "reason_word" pools تعطیله/امروز/زیاد (3 members, anchored lesson04).
    "reading_word" pools فقط/خسته‌ست/کرده/نیست (4 members, anchored
    lesson05). "reaction_word" pools چه/خوشحاله (2 members, anchored
    lesson06, translation/matching-only). One generative template
    reuses feeling_word: "{feeling_a} و {feeling_b}" (a distinct pair
    joined by و) is always grammatical regardless of which two feelings
    are picked, the same "join any two words with و" pattern already
    used by units 20-22 -- deliberately NOT attempting any "I am X and
    Y" or "X because Y" generative combo across the full feeling pool,
    since e.g. "sad because today is a holiday" is grammatical but
    pragmatically bizarre (a real risk this guide's own caution against
    generating semantically odd combinations flags).

    No pre-existing content gaps found this pass (unlike a1_unit22's
    overlay, which was missing 2 teaching entries) -- a1_unit23's
    realization/overlay pair already has full content_key parity,
    confirmed via a direct cross-check script before authoring began.

    Lesson-anchor check: lesson01 (basic feelings), lesson02 (asking how
    someone is / hunger), lesson03 (more feelings, the completing
    lesson for the growing feeling_word/feeling_1st_person_word groups),
    lesson04 (giving a reason), and lesson05 (reading about feelings)
    each genuinely introduce new vocabulary (confirmed by reading the
    realization file directly) -- safe anchors. lesson06 hosts a
    combined review matching_pairs template pooling feeling_word (6) +
    reading_word (4) + reaction_word (2) into one 12-pair exercise, the
    same "final unit review" pattern established by a1_unit17/19/20/21/
    22's own packs.

    Zero fill_in_blank templates, same standing en-fa precedent as every
    prior unit in this direction. scripts/_fill_in_blank_ambiguity_
    check.py reports zero flags. Verified with scripts/
    _practice_slot_check.py against backfill_lexemes.py's actual
    iter_specs() output -- clean, no zero-candidate slots, no under-3
    multiple_choice/matching_pairs slots (hunger_word/asking_state_word/
    reaction_word correctly have only 2 candidates each and are never
    used for multiple_choice here, only matching_pairs/translation).
    compile_content.py practice-validate clean (0 errors/0 warnings).
    Needs the standard fresh-context review before import.
tag_schema:
  part_of_speech: [adjective, adverb, verb, pronoun]
  agreement_tags:
    semantic:
      [basic_feeling_word, feeling_word, hunger_word,
       feeling_1st_person_word, asking_state_word, reason_word,
       reading_word, reaction_word]
slot_presets:
  basic_feeling_word: &basic_feeling_word {language_code: fa, part_of_speech: adjective, agreement_tags: {semantic: basic_feeling_word}}
  feeling_word: &feeling_word {language_code: fa, part_of_speech: adjective, agreement_tags: {semantic: feeling_word}}
  hunger_word: &hunger_word {language_code: fa, part_of_speech: [adjective, adverb], agreement_tags: {semantic: hunger_word}}
  feeling_1st_person_word: &feeling_1st_person_word {language_code: fa, part_of_speech: verb, agreement_tags: {semantic: feeling_1st_person_word}}
  asking_state_word: &asking_state_word {language_code: fa, part_of_speech: [adverb, verb], agreement_tags: {semantic: asking_state_word}}
  reason_word: &reason_word {language_code: fa, part_of_speech: [verb, adverb], agreement_tags: {semantic: reason_word}}
  reading_word: &reading_word {language_code: fa, part_of_speech: [verb, adverb], agreement_tags: {semantic: reading_word}}
  reaction_word: &reaction_word {language_code: fa, part_of_speech: [pronoun, verb], agreement_tags: {semantic: reaction_word}}
templates:
  # Lesson 1: basic feelings.
  - content_key: practice.en-fa.fa.a1.unit23.lesson01.basic_feeling_choice.001
    lesson_content_key: fa.a1.unit23.lesson01.basic_feelings
    type: multiple_choice
    frame: {text: "{basic_feeling_word}", language_code: fa, direction: rtl}
    slots: {basic_feeling_word: *basic_feeling_word}
    answer_derivation: {kind: slot_gloss, slot: basic_feeling_word}
    feedback_frame: {text: "{basic_feeling_word} describes how someone feels.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson01.basic_feeling_match.002
    lesson_content_key: fa.a1.unit23.lesson01.basic_feelings
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *basic_feeling_word, second: *basic_feeling_word, third: *basic_feeling_word}
    slot_relations: [{kind: distinct, slots: [first, second, third]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third]}
    feedback_frame: {text: "These three cover the basic feeling vocabulary for this lesson.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson01.basic_feeling_translate.003
    lesson_content_key: fa.a1.unit23.lesson01.basic_feelings
    type: translation
    frame: {text: "{basic_feeling_word}", language_code: en, direction: ltr, slot_rendering: {basic_feeling_word: english_gloss}}
    slots: {basic_feeling_word: *basic_feeling_word}
    answer_derivation: {kind: slot_text, slot: basic_feeling_word}
    feedback_frame: {text: "The Farsi word is {basic_feeling_word}.", language_code: en, direction: ltr}

  # Lesson 2: asking how someone is / hunger.
  - content_key: practice.en-fa.fa.a1.unit23.lesson02.hunger_match.001
    lesson_content_key: fa.a1.unit23.lesson02.asking_how_someone_is
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *hunger_word, second: *hunger_word}
    slot_relations: [{kind: distinct, slots: [first, second]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson02.hunger_translate.002
    lesson_content_key: fa.a1.unit23.lesson02.asking_how_someone_is
    type: translation
    frame: {text: "{hunger_word}", language_code: en, direction: ltr, slot_rendering: {hunger_word: english_gloss}}
    slots: {hunger_word: *hunger_word}
    answer_derivation: {kind: slot_text, slot: hunger_word}
    feedback_frame: {text: "The Farsi word is {hunger_word}.", language_code: en, direction: ltr}

  # Lesson 3: more feelings (the completing lesson for the full pool).
  - content_key: practice.en-fa.fa.a1.unit23.lesson03.feeling_choice.001
    lesson_content_key: fa.a1.unit23.lesson03.more_feelings
    type: multiple_choice
    frame: {text: "{feeling_word}", language_code: fa, direction: rtl}
    slots: {feeling_word: *feeling_word}
    answer_derivation: {kind: slot_gloss, slot: feeling_word}
    feedback_frame: {text: "{feeling_word} describes how someone feels.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson03.feeling_match.002
    lesson_content_key: fa.a1.unit23.lesson03.more_feelings
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *feeling_word, second: *feeling_word, third: *feeling_word, fourth: *feeling_word, fifth: *feeling_word, sixth: *feeling_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "These six words cover all the feeling vocabulary taught in this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson03.feeling_translate.003
    lesson_content_key: fa.a1.unit23.lesson03.more_feelings
    type: translation
    frame: {text: "{feeling_word}", language_code: en, direction: ltr, slot_rendering: {feeling_word: english_gloss}}
    slots: {feeling_word: *feeling_word}
    answer_derivation: {kind: slot_text, slot: feeling_word}
    feedback_frame: {text: "The Farsi word is {feeling_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson03.feeling_pair_order.004
    lesson_content_key: fa.a1.unit23.lesson03.more_feelings
    type: word_order
    frame: {text: "{feeling_a} و {feeling_b}", language_code: fa, direction: rtl}
    slots: {feeling_a: *feeling_word, feeling_b: *feeling_word}
    slot_relations: [{kind: distinct, slots: [feeling_a, feeling_b]}]
    answer_derivation: {kind: render_frame, frame: {text: "{feeling_a} و {feeling_b}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "و joins two words, like خوشحال و ناراحت (happy and sad).", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson03.feeling_1st_person_match.005
    lesson_content_key: fa.a1.unit23.lesson03.more_feelings
    type: matching_pairs
    frame: {text: "Match each phrase with its meaning.", language_code: en, direction: ltr}
    slots: {first: *feeling_1st_person_word, second: *feeling_1st_person_word, third: *feeling_1st_person_word, fourth: *feeling_1st_person_word, fifth: *feeling_1st_person_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth]}
    feedback_frame: {text: "These are the colloquial \"I am ...\" forms of the feeling words.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson03.feeling_1st_person_translate.006
    lesson_content_key: fa.a1.unit23.lesson03.more_feelings
    type: translation
    frame: {text: "{feeling_1st_person_word}", language_code: en, direction: ltr, slot_rendering: {feeling_1st_person_word: english_gloss}}
    slots: {feeling_1st_person_word: *feeling_1st_person_word}
    answer_derivation: {kind: slot_text, slot: feeling_1st_person_word}
    feedback_frame: {text: "The Farsi phrase is {feeling_1st_person_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson03.asking_state_match.007
    lesson_content_key: fa.a1.unit23.lesson03.more_feelings
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *asking_state_word, second: *asking_state_word}
    slot_relations: [{kind: distinct, slots: [first, second]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 4: giving a reason.
  - content_key: practice.en-fa.fa.a1.unit23.lesson04.reason_choice.001
    lesson_content_key: fa.a1.unit23.lesson04.giving_a_reason
    type: multiple_choice
    frame: {text: "{reason_word}", language_code: fa, direction: rtl}
    slots: {reason_word: *reason_word}
    answer_derivation: {kind: slot_gloss, slot: reason_word}
    feedback_frame: {text: "{reason_word} is used when giving a reason for a feeling.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson04.reason_match.002
    lesson_content_key: fa.a1.unit23.lesson04.giving_a_reason
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *reason_word, second: *reason_word, third: *reason_word}
    slot_relations: [{kind: distinct, slots: [first, second, third]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson04.reason_translate.003
    lesson_content_key: fa.a1.unit23.lesson04.giving_a_reason
    type: translation
    frame: {text: "{reason_word}", language_code: en, direction: ltr, slot_rendering: {reason_word: english_gloss}}
    slots: {reason_word: *reason_word}
    answer_derivation: {kind: slot_text, slot: reason_word}
    feedback_frame: {text: "The Farsi word is {reason_word}.", language_code: en, direction: ltr}

  # Lesson 5: reading about feelings.
  - content_key: practice.en-fa.fa.a1.unit23.lesson05.reading_choice.001
    lesson_content_key: fa.a1.unit23.lesson05.reading_about_feelings
    type: multiple_choice
    frame: {text: "{reading_word}", language_code: fa, direction: rtl}
    slots: {reading_word: *reading_word}
    answer_derivation: {kind: slot_gloss, slot: reading_word}
    feedback_frame: {text: "{reading_word} appears in this lesson's reading passage.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson05.reading_match.002
    lesson_content_key: fa.a1.unit23.lesson05.reading_about_feelings
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *reading_word, second: *reading_word, third: *reading_word, fourth: *reading_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "These four cover the reading-passage vocabulary for this lesson.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson05.reading_translate.003
    lesson_content_key: fa.a1.unit23.lesson05.reading_about_feelings
    type: translation
    frame: {text: "{reading_word}", language_code: en, direction: ltr, slot_rendering: {reading_word: english_gloss}}
    slots: {reading_word: *reading_word}
    answer_derivation: {kind: slot_text, slot: reading_word}
    feedback_frame: {text: "The Farsi word is {reading_word}.", language_code: en, direction: ltr}

  # Lesson 6: the feelings dialogue -- unit-wide review.
  - content_key: practice.en-fa.fa.a1.unit23.lesson06.reaction_match.001
    lesson_content_key: fa.a1.unit23.lesson06.feelings_dialogue
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *reaction_word, second: *reaction_word}
    slot_relations: [{kind: distinct, slots: [first, second]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit23.lesson06.unit_review_match.002
    lesson_content_key: fa.a1.unit23.lesson06.feelings_dialogue
    type: matching_pairs
    frame: {text: "Match each word with its meaning -- a review of this whole unit's emotion vocabulary.", language_code: en, direction: ltr}
    slots:
      fw1: *feeling_word
      fw2: *feeling_word
      fw3: *feeling_word
      fw4: *feeling_word
      fw5: *feeling_word
      fw6: *feeling_word
      rw1: *reading_word
      rw2: *reading_word
      rw3: *reading_word
      rw4: *reading_word
      ra1: *reaction_word
      ra2: *reaction_word
    slot_relations:
      - {kind: distinct, slots: [fw1, fw2, fw3, fw4, fw5, fw6]}
      - {kind: distinct, slots: [rw1, rw2, rw3, rw4]}
      - {kind: distinct, slots: [ra1, ra2]}
    answer_derivation: {kind: matching_pairs, slots: [fw1, fw2, fw3, fw4, fw5, fw6, rw1, rw2, rw3, rw4, ra1, ra2]}
    feedback_frame: {text: "This reviews the feeling, reading-passage, and reaction vocabulary taught in this unit.", language_code: en, direction: ltr}
