review:
  status: reviewed
  fresh_context: true
  notes: 'Authored 2026-07-09 (en-fa overnight units-20+ practice-depth pass, same batch as a1_unit20-22.yaml -- see those
    files'' own notes for the shared UNIT_FILES-extension pattern). Extends scripts/backfill_lexemes.py with 17 new FA_GLOSSES
    entries, 2 new FA_ADVERBS entries (زیاد/فقط), 6 new FA_ADJECTIVES entries (the core feeling words), 9 new FA_VERBS entries
    (colloquial copula contractions + کرده), and 8 new semantic tags. خسته‌ام/خوب/نیستم/ چطوری/خوبم/من/یکم/چرا/هستی/کار/کردم/چون/امروز/سارا/چه/نیما/تو/نیست
    already existed (established across many earlier units) -- reused verbatim.

    Eight semantic groups, all verified via scripts/_practice_slot_check.py: "basic_feeling_word" pools the 3 core lesson01
    adjectives (خوشحال/ ناراحت/خسته, anchored lesson01, all 3 genuinely available there). "feeling_word" is the FULL growing
    6-member superset (adds گشنه at lesson02, عصبانی/نگران at lesson03) -- anchored lesson03, the completing lesson, same
    growing-pool precedent already established by a1_unit17''s own symptom_word (anchored at ITS completing lesson, not lesson01,
    despite 2 of 5 members being taught there). "hunger_ word" pools گشنه with یکم (2 members, mixed adjective/adverb, translation/matching-only,
    anchored lesson02). "feeling_1st_person_ word" pools the 5 colloquial "I am X" contractions (anchored lesson03, where
    عصبانی‌ام completes the set) -- deliberately NOT built as a generative "{feeling_word}م" word_order frame, since the correct
    contraction suffix genuinely varies by word ending (خوشحالم has no inserted vowel, گشنه‌ام/عصبانی‌ام do) and can''t be
    derived generically per candidate, the same caution already applied to a1_unit19''s is_location_verb. "asking_state_word"
    pools چرا/ نگرانی (2 members, anchored lesson03, translation/matching-only). "reason_word" pools تعطیله/امروز/زیاد (3
    members, anchored lesson04). "reading_word" pools فقط/خسته‌ست/کرده/نیست (4 members, anchored lesson05). "reaction_word"
    pools چه/خوشحاله (2 members, anchored lesson06, translation/matching-only). One generative template reuses feeling_word:
    "{feeling_a} و {feeling_b}" (a distinct pair joined by و) is always grammatical regardless of which two feelings are picked,
    the same "join any two words with و" pattern already used by units 20-22 -- deliberately NOT attempting any "I am X and
    Y" or "X because Y" generative combo across the full feeling pool, since e.g. "sad because today is a holiday" is grammatical
    but pragmatically bizarre (a real risk this guide''s own caution against generating semantically odd combinations flags).

    No pre-existing content gaps found this pass (unlike a1_unit22''s overlay, which was missing 2 teaching entries) -- a1_unit23''s
    realization/overlay pair already has full content_key parity, confirmed via a direct cross-check script before authoring
    began.

    Lesson-anchor check: lesson01 (basic feelings), lesson02 (asking how someone is / hunger), lesson03 (more feelings, the
    completing lesson for the growing feeling_word/feeling_1st_person_word groups), lesson04 (giving a reason), and lesson05
    (reading about feelings) each genuinely introduce new vocabulary (confirmed by reading the realization file directly)
    -- safe anchors. lesson06 hosts a combined review matching_pairs template pooling feeling_word (6) + reading_word (4)
    + reaction_word (2) into one 12-pair exercise, the same "final unit review" pattern established by a1_unit17/19/20/21/
    22''s own packs.

    Zero fill_in_blank templates, same standing en-fa precedent as every prior unit in this direction. scripts/_fill_in_blank_ambiguity_
    check.py reports zero flags. Verified with scripts/ _practice_slot_check.py against backfill_lexemes.py''s actual iter_specs()
    output -- clean, no zero-candidate slots, no under-3 multiple_choice/matching_pairs slots (hunger_word/asking_state_word/
    reaction_word correctly have only 2 candidates each and are never used for multiple_choice here, only matching_pairs/translation).
    compile_content.py practice-validate clean (0 errors/0 warnings). Needs the standard fresh-context review before import.


    REAUTH PASS 2026-07-24 (unit-scope DEAD-template fix, PACK-ONLY): scripts/_practice_unit_scope_check.py found 6 DEAD +
    3 below-floor. Same root cause as the rest of this batch, but this pack has the highest density of it -- every one of
    hunger_word/feeling_1st_person_word/asking_state_word/reason_word/reading_word/reaction_word is exactly one native member
    short of its declared floor, because each pools 1-4 unit23-native tokens plus exactly ONE token that turns out to be anchored
    to an EARLIER unit (یکم->unit09, خسته‌ام->unit17, چرا->unit09, امروز->unit06, نیست->unit09, چه->unit12). feeling_word itself
    (the growing 6-member superset) has NO such contamination -- all 6 of its members are genuinely unit23-native, which is
    why feeling_match.002 and feeling_pair_order.004 needed no fix.

    Fix for every DEAD/below-floor matching_pairs and the one below-floor multiple_choice: added a shared slot preset "unit23_wide_word"
    unioning this unit''s own already-declared feeling_word + feeling_1st_person_word + asking_state_word + reason_word +
    reading_word + reaction_word tags (all reused verbatim, no new backfill tags) -- unit-scoped pool is 17 distinct words.
    Re-anchored basic_feeling_match.002 (+ its volume_match.008 duplicate), hunger_match.001, asking_state_match.007, reason_match.002,
    reading_match.002, and reaction_match.001 to it at 6 slots each; re-anchored reason_choice.001 to it too. feeling_1st_person_match.005
    (needed 5, unit-scoped feeling_1st_person_word pool is 4) was DROPPED rather than widened: the tag is a semantically narrow
    "colloquial I-am-X contraction" set, its own feedback_frame says exactly that, and every other unit23-native token is either
    a plain adjective (feeling_word) or a 2nd/3rd-person contraction (نگرانی, خوشحاله) -- widening it would have shown false
    "I am ..." pairs. feeling_1st_person_translate.006 (bare-word translation, no floor) stays, so this micro-category still
    gets production-tier coverage; genuine thinness, logged rather than papered over.

    unit_review_match.002 converted its rw (reading_word, needed4/native3) and ra (reaction_word, needed2/native1) groups to
    two new disjoint-from-each-other-and-from-fw slot presets -- "reading_reason_word" ([reading_word, reason_word], 5 native)
    and "reaction_asking_state_word" ([reaction_word, asking_state_word], 2 native) -- both were ACTUALLY dead even though
    the checker did not flag this template at all (its first-slot-only heuristic checked fw''s pool of 6 against a need of
    6 and stopped there). fw (feeling_word, 6 native, exact) is untouched. No mis-glossed lexemes found in this unit''s pool.
    Verified: 0 DEAD, 0 below-floor for this pack per the unit-scope checker; practice-validate 0 errors (see coordinator
    report for the exact invocation covering all 5 units in this batch).'
