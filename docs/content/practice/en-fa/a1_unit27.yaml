# --- unit-wide matching_pairs over the noun union ---
- content_key: practice.en-fa.fa.a1.unit27.lesson02.match.004
  lesson_content_key: fa.a1.unit27.lesson02.volleyball_swimming
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fa
    direction: rtl
  slots:
    first: &sportnoun
      language_code: fa
      part_of_speech: noun
      agreement_tags: {semantic: [sport_name_word, sport_place_word, sport_question_word]}
    second: *sportnoun
    third: *sportnoun
    fourth: *sportnoun
    fifth: *sportnoun
    sixth: *sportnoun
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: 'These are the unit''s sports words.'
    language_code: en
    direction: ltr
