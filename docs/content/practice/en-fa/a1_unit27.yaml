schema_version: '1.0'
pack_key: practice.en-fa.a1.unit27
source_language: en
target_language: fa
unit_content_key: fa.a1.unit27.sports

review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Thin vocabulary unit (23 fa lexemes; lesson01 has only 1 fa lexeme
    بسکتبال). Recognition/production templates union sport_name_word
    (lessons01-02: بسکتبال/والیبال/شنا) and separately union
    sport_question_word (lessons02/04/05/06: ورزشی/بار/می‌ره/می‌ری) to
    clear the 3-distinct-gloss MC floor on every lesson including the
    1-lexeme lesson01. Deliberately did NOT author a word_order template
    for lesson04-06's sport_question_word verbs (می‌ره "he/she goes" vs
    می‌ری "you go"): a single fixed-subject frame is not grammatical for
    both persons at once (course scope, §1.1/§6.4), and no finer tag
    exists to isolate one from the other, so those two verbs are only
    exercised via multiple_choice/translation, never inside a literal
    sentence frame -- noted here rather than risking an ungrammatical
    word_order. The two word_order frames used ('من {item} دوست دارم.',
    'می‌رم {item}.') were re-read against their slots' course-wide pools
    (sport_name_word / sport_place_word, both unit-unique tags) and every
    candidate is grammatical, matching the realization's own example
    sentences ("من بسکتبال دوست دارم.", "می‌رم باشگاه."). matching_pairs
    unions sport_name_word + sport_place_word + the noun members of
    sport_question_word (7 distinct nouns) to clear the 6-pair floor. No
    mis-glossed lexemes found. No listen_select (fa has no TTS
    configured).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - sport_name_word
    - sport_place_word
    - sport_question_word

templates:
# --- lesson01 (football/basketball) ---
- content_key: practice.en-fa.fa.a1.unit27.lesson01.choose.001
  lesson_content_key: fa.a1.unit27.lesson01.football_basketball
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags: {semantic: sport_name_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is a sport name from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit27.lesson01.translate.002
  lesson_content_key: fa.a1.unit27.lesson01.football_basketball
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags: {semantic: sport_name_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: 'Type the Farsi word for {item}.'
    language_code: en
    direction: ltr

