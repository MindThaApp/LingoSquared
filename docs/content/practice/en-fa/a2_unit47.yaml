schema_version: '1.0'
pack_key: practice.en-fa.a2.unit47
source_language: en
target_language: fa
unit_content_key: fa.a2.unit47.right_now
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 47-51 pass): 2 fixes - (1) lesson02 fill.004 showed الان کتاب ___ with only نمی‌خونم accepted, while the affirmative می‌خونم fits the same frame equally well; the frame now adds the contrast clause (الان کتاب ___، دارم کار می‌کنم.) so the negative is the only sensible fill; (2) lesson02 sentence.005 prompt said Right now, which this unit teaches as همین الان, while the only answer is الان کتاب نمی‌خونم.; the prompt is now I am not reading a book now. Dumped every slot pool at unit and course scope and read every gloss (no wrong glosses; lesson tags are unit-only, so course scope equals unit scope); every sentence frame is single-candidate; no dead templates, MC pools 3 to 15 distinct glosses, matching pools 11 and 15 for 6 slots, all three tiers cover all 5 lessons with lexemes. Coverage 15/27 (56%): the 12 unhosted lexemes are comma-joined card-target phrase lexemes, which no template should drill. lesson04 fill.004 (الو، ___؟) is an open-recall frame; کجایی is the lesson word. Authored 2026-11-15 for en-fa A2 unit 47 (right now). Mirrors PR #250 (units 27-39): the backfill emits only unit and lesson tags (en_fa_a2_unit47_words, en_fa_a2_unit47_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two or more all fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). Phrase lexemes (word lists and dialogue lines) are not drilled, and tokens first introduced in earlier units belong to those units'' pools. Spoken Tehrani register; no native review yet. NATIVE QUESTIONS: (1) Is الان کتاب نمی‌خونم natural for right now I am not reading? Recommended: yes, though داره نمی‌خونم is not used. (2) Is نیما ظرف‌ها رو می‌شوره natural? Recommended: yes.'
