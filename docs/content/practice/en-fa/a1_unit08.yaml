schema_version: "1.0"
pack_key: practice.en-fa.a1.unit08
source_language: en
target_language: fa
unit_content_key: fa.a1.unit08.shopping
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 5 fixes). (1) shop_noun
    preset (5 templates): the bare dialogue_word tag pooled 75 A1 nouns in Endless
    Practice (clitic forms such as اسمم/خونه‌ت), and at unit scope the fragment قابلی
    and سیب‌ها: re-pooled to the lesson01-05 unit tags, nouns+adverbs (9, unit ==
    course). (2) Two MC feedbacks claimed "from this unit": now neutral. (3)
    payment_match.002 had 3 slots over its 3-word pool: now 6 pairs over lesson01-05
    nouns/adverbs/verbs (11). (4) quantity_unit_word_order.009 rendered "کیلو و نصف" /
    "نصف و بشقاب" (meaningless): now the taught sentence کیلویی سی تومنه via a
    single-member lesson02 anchor. (5) payment_word_order.010 rendered "حساب و نقدی"
    etc. and its feedback cited قیمت, which is not in the pool: now نقدی حساب می‌کنم via
    a lesson05 anchor. Note: quantity_match/shop_match/service_role_match and
    quantity_choice/service_role_choice are duplicate templates (same pool); left as is.
    NATIVE FLAGS: نقدی حساب می‌کنم vs نقدی می‌دم (same flag as the realization).

    Authored 2026-07-06 by the practice-pool-sync lane (fa/prs bundle),
    part of the same pass as a1_unit06.yaml/a1_unit07.yaml/a2_unit09.yaml/
    a2_unit10.yaml -- see a1_unit06.yaml's notes for the shared
    backfill_lexemes.py extension this pass made.

    "quantity_unit_word" (لیوان/بشقاب, introduced in a1_unit06.lesson04,
    plus کیلو/نصف introduced HERE in lesson03 -- 4 members total)
    deliberately anchored in THIS unit's pack, not a1_unit06's, even
    though half its members were taught earlier: kept the tag's single
    practice occurrence at the later of its two source units so every
    member is guaranteed already-taught by the time this template can
    surface, and to avoid authoring the identical content_key/tag pair
    in two packs.

    "payment_word" (نقدی/کارت/حساب, 3 members, part_of_speech is mixed
    [noun, adverb] since نقدی is genuinely adverbial -- "in cash" -- while
    کارت/حساب are nouns; the slot_preset's part_of_speech list reflects
    this exactly like a1_unit05's direction_connector preset did for its
    own mixed [adverb, preposition] tag). "shop_word" (مغازه/فروشنده, only
    2 members) kept matching_pairs+translation only, no multiple_choice,
    per the same <3-candidate rule a1_unit05's is_on_side tag already
    established.

    Lesson-anchor check per tonight's found-and-fixed fa-en unit08 bug:
    lesson01, lesson03, and lesson05 all genuinely introduce new
    vocabulary (confirmed by reading the realization file directly) --
    safe anchors.

    Verified with scripts/_practice_slot_check.py's lexeme_matches()/
    check_pack() logic against backfill_lexemes.py's actual iter_specs()
    output (ad hoc harness, not committed) -- clean, no zero-candidate
    slots, no under-3 multiple_choice/matching_pairs slots (shop_word
    correctly has only 2 candidates and is never used for
    multiple_choice here). compile_content.py practice-validate also
    clean (0 errors/0 warnings) for the full en-fa pack (units 01-08
    together). Needs the standard fresh-context review before import.
    Same standing blocker as every pack in this bundle: no
    backfill_lexemes.py run has actually happened against a real
    database yet in this pass.

    DEPTH PASS, added 2026-07-06 (practice-pool-sync lane, closing the
    units 06-10 template-density audit gap -- this unit went 8->16).
    Added two new tags to scripts/backfill_lexemes.py's
    fa_agreement_tags(): "service_role_word" (گارسون/مشتری/فروشنده, 3
    members -- گارسون/مشتری first taught unit06, فروشنده taught here;
    anchored HERE at lesson06's market dialogue since that's where the
    pool of 3 genuinely completes, the same anchor-at-the-completing-unit
    precedent this pack's own quantity_unit_word entry already
    established) and "price_number" (سی/بیست/هشت, the 3 number words this
    unit's own dialogue actually reuses for prices/discounts -- scoped
    narrowly to just these 3, not the whole course-wide "number" pool, so
    the generated item stays tied to this unit's shopping scenario;
    anchored lesson04 where بیست/هشت appear alongside a review of سی from
    lesson02). Also added two "X و X" word_order templates
    (quantity_unit_word, payment_word) mirroring this unit's own
    realization exercises (lesson01.exercise05's "قیمت و تخفیف" word_bank
    uses همین و connector). Re-verified with scripts/_practice_slot_check.py
    (service_role_word=3, price_number=3, both real, both >=3 for
    multiple_choice) and compile_content.py practice-validate (0 errors/0
    warnings, full en-fa pack). review.status left unreviewed -- this
    pass does not self-certify review.

    REAUTH PASS 2026-07-24 (fix DEAD templates at checkpoint/unit scope --
    scripts/_practice_unit_scope_check.py). generate_checkpoint() scopes
    candidates to THIS unit's own lexemes only. Found (each verified
    against a fresh iter_specs() dump filtered to '.a1.unit08.'):
    - price_number is a pure DO-NOT #2 defect: its ALL THREE members
      (سی/بیست/هشت) turn out to be a1_unit03's own numbers (unit03.lesson01/
      02, zero_to_ten / eleven_to_ninety_nine), not this unit's, contrary
      to the DEPTH PASS notes above ("this unit's own dialogue actually
      reuses" was true only at whole-direction scope, not at the unit scope
      generate_checkpoint() actually uses). price_number_choice.006/
      price_number_match.007/price_number_translate.008 were all DEAD (0
      unit-scoped candidates) and there is no salvageable native
      substitute for "a price number specific to this unit" without either
      duplicating another tag's pool wholesale or a backfill change.
      DROPPED all three; the pack still has 13 live templates across all
      three tiers after this (recognition=3, structured=6, production=4),
      comfortably clearing the >=12/>=3-per-tier bars. LOGGED for the
      coordinator: price_number as currently defined in
      scripts/backfill_lexemes.py has zero a1_unit08-native members: it
      needs either its own unit08-scoped number tag or to be dropped/
      renamed direction-wide as misleading.
    - quantity_unit_word is genuinely only 2 at unit scope (کیلو, نصف --
      لیوان/بشقاب are a1_unit06's own). quantity_choice.001/
      quantity_match.002 were DEAD/below-floor. RE-ANCHORED both to a new
      shop_noun preset (union [quantity_unit_word, dialogue_word,
      shop_word, service_role_word] restricted to part_of_speech: noun,
      all native to this unit) -- 8 distinct nouns (کیلو/نصف/تخفیف/حساب/
      کارت/فروشنده/سیب‌ها/مغازه).
    - service_role_word is genuinely only 1 at unit scope (فروشنده --
      گارسون/مشتری are a1_unit06's own, contrary to the DEPTH PASS notes'
      "3 members" count, again taken at whole-direction not unit scope).
      service_role_choice.003/service_role_match.004 were DEAD/below-floor.
      RE-ANCHORED both to the same shop_noun preset (فروشنده is itself a
      member of it).
    - shop_word's own shop_match.001 (2 native: مغازه/فروشنده) was below
      the matching_pairs floor. Widened to the same shop_noun preset for
      consistency (مغازه/فروشنده are both members of it too).
    shop_noun's 8-member pool is intentionally reused across quantity_
    choice/quantity_match/shop_match/service_role_choice/service_role_match
    (5 templates, 3 different lesson anchors: 01/03/06) rather than
    invented separately per template -- this is the recipe's own SS8.1
    "union the unit's lesson tags... reuse across templates" technique;
    each anchor still gives its own lesson a live recognition/structured
    template even though the underlying pool overlaps. payment_word (3:
    نقدی/کارت/حساب, نقدی is an adverb so it's deliberately excluded from
    shop_noun's noun-only filter) is left untouched -- payment_choice is
    fine at 3, payment_match's 3<6 floor gap is honest thinness (widening
    it into shop_noun would silently drop نقدی, the one payment concept
    shop_noun can't represent, which is a regression, not a fix).
    quantity_translate/service_role_translate/shop_translate untouched
    (translation has no floor).
    dialogue_word added to tag_schema for the above. Re-verified 0 DEAD for
    this file via scripts/_practice_unit_scope_check.py and 0 errors via
    compile_content.py practice-validate. No backfill/realization/overlay
    edits made.
tag_schema:
  part_of_speech: [noun, adverb, adjective, verb]
  agreement_tags:
    semantic: [quantity_unit_word, payment_word, shop_word, service_role_word, dialogue_word,
      en_fa_a1_unit08_lesson01_words, en_fa_a1_unit08_lesson02_words, en_fa_a1_unit08_lesson03_words,
      en_fa_a1_unit08_lesson04_words, en_fa_a1_unit08_lesson05_words]
slot_presets:
  quantity_unit_word: &quantity_unit_word {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: quantity_unit_word}}
  payment_word: &payment_word {language_code: fa, part_of_speech: [noun, adverb], agreement_tags: {semantic: payment_word}}
  service_role_word: &service_role_word {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: service_role_word}}
  shop_word: &shop_word {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: shop_word}}
  shop_noun: &shop_noun {language_code: fa, part_of_speech: [noun, adverb], agreement_tags: {semantic: [en_fa_a1_unit08_lesson01_words, en_fa_a1_unit08_lesson02_words, en_fa_a1_unit08_lesson03_words, en_fa_a1_unit08_lesson04_words, en_fa_a1_unit08_lesson05_words]}}
  shop_word_any: &shop_word_any {language_code: fa, part_of_speech: [noun, adverb, verb], agreement_tags: {semantic: [en_fa_a1_unit08_lesson01_words, en_fa_a1_unit08_lesson02_words, en_fa_a1_unit08_lesson03_words, en_fa_a1_unit08_lesson04_words, en_fa_a1_unit08_lesson05_words]}}
  per_kilo_single: &per_kilo_single {language_code: fa, part_of_speech: adverb, agreement_tags: {semantic: en_fa_a1_unit08_lesson02_words}}
  cash_single: &cash_single {language_code: fa, part_of_speech: adverb, agreement_tags: {semantic: en_fa_a1_unit08_lesson05_words}}
templates:
  - content_key: practice.en-fa.fa.a1.unit08.lesson03.quantity_choice.001
    lesson_content_key: fa.a1.unit08.lesson03.quantities_in_shopping
    type: multiple_choice
    frame: {text: "{quantity_unit_word}", language_code: fa, direction: rtl}
    slots: {quantity_unit_word: *shop_noun}
    answer_derivation: {kind: slot_gloss, slot: quantity_unit_word}
    feedback_frame: {text: "{quantity_unit_word} is a word for shopping and paying.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit08.lesson03.quantity_match.002
    lesson_content_key: fa.a1.unit08.lesson03.quantities_in_shopping
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *shop_noun, second: *shop_noun, third: *shop_noun, fourth: *shop_noun, fifth: *shop_noun, sixth: *shop_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit08.lesson03.quantity_translate.003
    lesson_content_key: fa.a1.unit08.lesson03.quantities_in_shopping
    type: translation
    frame: {text: "{quantity_unit_word}", language_code: en, direction: ltr, slot_rendering: {quantity_unit_word: english_gloss}}
    slots: {quantity_unit_word: *quantity_unit_word}
    answer_derivation: {kind: slot_text, slot: quantity_unit_word}
    feedback_frame: {text: "The Farsi word is {quantity_unit_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit08.lesson05.payment_choice.001
    lesson_content_key: fa.a1.unit08.lesson05.paying
    type: multiple_choice
    frame: {text: "{payment_word}", language_code: fa, direction: rtl}
    slots: {payment_word: *payment_word}
    answer_derivation: {kind: slot_gloss, slot: payment_word}
    feedback_frame: {text: "{payment_word} relates to paying for a purchase.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit08.lesson05.payment_match.002
    lesson_content_key: fa.a1.unit08.lesson05.paying
    type: matching_pairs
    frame: {text: "Match each shopping word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *shop_word_any, second: *shop_word_any, third: *shop_word_any, fourth: *shop_word_any, fifth: *shop_word_any, sixth: *shop_word_any}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each shopping word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit08.lesson05.payment_translate.003
    lesson_content_key: fa.a1.unit08.lesson05.paying
    type: translation
    frame: {text: "{payment_word}", language_code: en, direction: ltr, slot_rendering: {payment_word: english_gloss}}
    slots: {payment_word: *payment_word}
    answer_derivation: {kind: slot_text, slot: payment_word}
    feedback_frame: {text: "The Farsi word is {payment_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit08.lesson01.shop_match.001
    lesson_content_key: fa.a1.unit08.lesson01.shop_vocabulary
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *shop_noun, second: *shop_noun, third: *shop_noun, fourth: *shop_noun, fifth: *shop_noun, sixth: *shop_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit08.lesson01.shop_translate.002
    lesson_content_key: fa.a1.unit08.lesson01.shop_vocabulary
    type: translation
    frame: {text: "{shop_word}", language_code: en, direction: ltr, slot_rendering: {shop_word: english_gloss}}
    slots: {shop_word: *shop_word}
    answer_derivation: {kind: slot_text, slot: shop_word}
    feedback_frame: {text: "The Farsi word is {shop_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit08.lesson06.service_role_choice.003
    lesson_content_key: fa.a1.unit08.lesson06.market_dialogue
    type: multiple_choice
    frame: {text: "{service_role_word}", language_code: fa, direction: rtl}
    slots: {service_role_word: *shop_noun}
    answer_derivation: {kind: slot_gloss, slot: service_role_word}
    feedback_frame: {text: "{service_role_word} is a word for shopping and paying.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit08.lesson06.service_role_match.004
    lesson_content_key: fa.a1.unit08.lesson06.market_dialogue
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *shop_noun, second: *shop_noun, third: *shop_noun, fourth: *shop_noun, fifth: *shop_noun, sixth: *shop_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit08.lesson06.service_role_translate.005
    lesson_content_key: fa.a1.unit08.lesson06.market_dialogue
    type: translation
    frame: {text: "{service_role_word}", language_code: en, direction: ltr, slot_rendering: {service_role_word: english_gloss}}
    slots: {service_role_word: *service_role_word}
    answer_derivation: {kind: slot_text, slot: service_role_word}
    feedback_frame: {text: "The Farsi word is {service_role_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit08.lesson03.quantity_unit_word_order.009
    lesson_content_key: fa.a1.unit08.lesson03.quantities_in_shopping
    type: word_order
    frame: {text: "{per_kilo} سی تومنه", language_code: fa, direction: rtl}
    slots: {per_kilo: *per_kilo_single}
    answer_derivation: {kind: render_frame, frame: {text: "{per_kilo} سی تومنه", language_code: fa, direction: rtl}}
    feedback_frame: {text: "کیلویی سی تومنه means \"It's 30 toman per kilo.\" The price comes after کیلویی.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit08.lesson05.payment_word_order.010
    lesson_content_key: fa.a1.unit08.lesson05.paying
    type: word_order
    frame: {text: "{cash} حساب می‌کنم", language_code: fa, direction: rtl}
    slots: {cash: *cash_single}
    answer_derivation: {kind: render_frame, frame: {text: "{cash} حساب می‌کنم", language_code: fa, direction: rtl}}
    feedback_frame: {text: "نقدی حساب می‌کنم means \"I'll pay in cash.\" The verb حساب می‌کنم comes last.", language_code: en, direction: ltr}
