review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa C1 units 01-08 pass): 3 fixes - (1) ten choose/translate feedback frames said the item came ''from the lesson on <one lesson>'' while the slot pools the whole unit: now ''{item} is one of this unit''''s words.''; (2) two pool glosses did not match the unit and were fixed in the C1 gloss overrides of the backfill: همچنان ''still; nevertheless'' -> ''still; as before'' (nevertheless is با این حال), حال ''state; condition; mood (bare form)'' -> ''state; condition (in با این حال ''''nevertheless'''')''; (3) three taught content words with ZWNJ were missing from the unit pool and were added to every union: سبک‌سنگین weighing up, هزینه‌بر costly, مرحله‌به‌مرحله step by step. Read every pool gloss (درست true / درستی correctness stay distinct), course-scope pools of the three word_order frames (w_اعتراض, w_هزینه, w_حال: 1 candidate each, grammatical, none a literal word of its frame). Capacity (fa lexemes only, .c1.unit04. filter): 18 templates, recognition 5 / structured 8 / production 5, all 5 lessons with lexemes covered in every tier, no ''!!'' lines. Earlier: Built by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fa backfill lexemes (tags fa_c1_u4 / w_<token>). 28 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'
