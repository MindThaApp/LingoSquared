schema_version: "1.0"
pack_key: practice.en-fa.a1.unit18
source_language: en
target_language: fa
unit_content_key: fa.a1.unit18.work
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Authored 2026-07-07 for the new A1 unit18 (work) realization -- en-fa's
    A1 pack grew 17->19 units this session with zero prior Endless Practice
    coverage. Extended scripts/backfill_lexemes.py's UNIT_FILES tuple and
    added the necessary new FA_GLOSSES/FA_VERBS/FA_PREPOSITIONS entries
    (see that script's own unit18 comment block for the exact additions).

    Six semantic groups, all verified via scripts/_practice_slot_check.py:
    "job_asking_word" (شغل/شغلت/چیه, 3 members, mirrors the realization's
    own match_asking_vocab base, anchored lesson02 where the pool
    completes), "occupation_self_phrase" (مهندسم/معلمم/دکترم, 3 members,
    all classified verb per this course's established copula-contraction
    precedent, anchored lesson01), "workplace_word" (شرکت/مدرسه/بیمارستان,
    3 members, anchored lesson03), "workplace_grammar_word" (در/کجا, 2
    members, mixed preposition/adverb, translation/matching-only -- below
    the multiple_choice floor, anchored lesson03), "occupation_third_
    person" (مهندسه/معلمه, 2 members, translation/matching-only, anchored
    lesson06 where معلمه completes the pair), and "work_verb_form"
    (می‌کنم/می‌کنی/می‌کنه, 3 members -- a genuine compositional reuse: each
    token always literally means "do/does," and combining any of them
    with the fixed noun کار is grammatically valid regardless of which
    lesson first introduced them, so no lesson_key scoping was needed
    for this tag, unlike a true homograph split). Also reuses the
    existing course-wide "person_name" tag (نیما/سارا/etc., established
    across many earlier units).

    Real pre-existing homograph handled while extending the classifier:
    the realization's own review notes explain fa deliberately uses در
    (not تو) for "at a workplace" throughout this unit specifically to
    avoid a collision with تو meaning "you" -- so this unit never
    actually needs تو's location sense (that only appears in the sibling
    a1_unit19 housing pack; see that file's own notes for the classifier
    fix). This unit's own "در" is therefore the ordinary preposition
    sense with no ambiguity.

    Seven generative word_order templates combine workplace_word/
    work_verb_form/person_name into full natural sentences mirroring the
    realization's own content: "در یک {workplace_word} کار می‌کنم"
    (lesson03, matches translate_work_at_hospital's pattern generalized
    across all 3 workplaces), "هر روز در یک {workplace_word} کار می‌کنم"
    (lesson04, matches translate_work_school_every_day), "کار
    {work_verb_form}" (lesson05, drills all three persons: I/you/he-she
    work), "{person_name} {occupation_third_person}" (lesson06, matches
    the dialogue's own نیما مهندسه/سارا معلمه pattern generalized across
    the full course-wide person_name pool), and "{person_name} در یک
    {workplace_word} کار می‌کنه" (lesson06, matches نیما در یک شرکت کار
    می‌کنه). All combinations are grammatically valid regardless of
    real-world plausibility, the same generalization precedent already
    used throughout this course's Endless Practice content (e.g.
    a1_unit17's own person_name x symptom_noun_word combinations).

    Zero fill_in_blank templates: this unit's real vocabulary doesn't
    support one safely -- every group either has too few candidates or
    no natural single-slot frame that could disambiguate members, so per
    the standing en-fa precedent (units 03-17) this unit follows the
    same zero-fill_in_blank approach the compiler's own ambiguity
    hard-fail would reject anyway.
    scripts/_fill_in_blank_ambiguity_check.py reports zero flags (no
    fill_in_blank templates in this pack at all). Verified with
    scripts/_practice_slot_check.py against backfill_lexemes.py's actual
    iter_specs() output -- clean, no zero-candidate slots, no under-3
    multiple_choice/matching_pairs slots. compile_content.py
    practice-validate clean (0 errors/0 warnings). Needs the standard
    fresh-context review before import.
tag_schema:
  part_of_speech: [noun, verb, phrase, preposition, adverb, proper_noun]
  agreement_tags:
    semantic:
      [job_asking_word, occupation_self_phrase, workplace_word,
       workplace_grammar_word, occupation_third_person, work_verb_form,
       person_name]
slot_presets:
  job_asking_word: &job_asking_word {language_code: fa, part_of_speech: [noun, verb], agreement_tags: {semantic: job_asking_word}}
  occupation_self_phrase: &occupation_self_phrase {language_code: fa, part_of_speech: verb, agreement_tags: {semantic: occupation_self_phrase}}
  workplace_word: &workplace_word {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: workplace_word}}
  workplace_grammar_word: &workplace_grammar_word {language_code: fa, part_of_speech: [preposition, adverb], agreement_tags: {semantic: workplace_grammar_word}}
  occupation_third_person: &occupation_third_person {language_code: fa, part_of_speech: verb, agreement_tags: {semantic: occupation_third_person}}
  work_verb_form: &work_verb_form {language_code: fa, part_of_speech: verb, agreement_tags: {semantic: work_verb_form}}
  person_name: &person_name {language_code: fa, part_of_speech: proper_noun, agreement_tags: {semantic: person_name}}
templates:
  # Lesson 1: basic occupation vocabulary.
  - content_key: practice.en-fa.fa.a1.unit18.lesson01.occupation_choice.001
    lesson_content_key: fa.a1.unit18.lesson01.basic_job_vocab
    type: multiple_choice
    frame: {text: "{occupation_self_phrase}", language_code: fa, direction: rtl}
    slots: {occupation_self_phrase: *occupation_self_phrase}
    answer_derivation: {kind: slot_gloss, slot: occupation_self_phrase}
    feedback_frame: {text: "{occupation_self_phrase} states an occupation.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit18.lesson01.occupation_match.002
    lesson_content_key: fa.a1.unit18.lesson01.basic_job_vocab
    type: matching_pairs
    frame: {text: "Match each phrase with its meaning.", language_code: en, direction: ltr}
    slots: {first: *occupation_self_phrase, second: *occupation_self_phrase, third: *occupation_self_phrase}
    slot_relations: [{kind: distinct, slots: [first, second, third]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third]}
    feedback_frame: {text: "Match each phrase to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit18.lesson01.occupation_translate.003
    lesson_content_key: fa.a1.unit18.lesson01.basic_job_vocab
    type: translation
    frame: {text: "{occupation_self_phrase}", language_code: en, direction: ltr, slot_rendering: {occupation_self_phrase: english_gloss}}
    slots: {occupation_self_phrase: *occupation_self_phrase}
    answer_derivation: {kind: slot_text, slot: occupation_self_phrase}
    feedback_frame: {text: "The Farsi phrase is {occupation_self_phrase}.", language_code: en, direction: ltr}

  # Lesson 2: asking about someone's job.
  - content_key: practice.en-fa.fa.a1.unit18.lesson02.job_asking_choice.001
    lesson_content_key: fa.a1.unit18.lesson02.asking_about_job
    type: multiple_choice
    frame: {text: "{job_asking_word}", language_code: fa, direction: rtl}
    slots: {job_asking_word: *job_asking_word}
    answer_derivation: {kind: slot_gloss, slot: job_asking_word}
    feedback_frame: {text: "{job_asking_word} is used when talking about someone's job.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit18.lesson02.job_asking_review_match.002
    lesson_content_key: fa.a1.unit18.lesson02.asking_about_job
    type: matching_pairs
    frame: {text: "Match each word or phrase with its meaning -- this lesson's words plus a review of lesson01's.", language_code: en, direction: ltr}
    slots:
      jw1: *job_asking_word
      jw2: *job_asking_word
      jw3: *job_asking_word
      op1: *occupation_self_phrase
      op2: *occupation_self_phrase
      op3: *occupation_self_phrase
    slot_relations:
      - {kind: distinct, slots: [jw1, jw2, jw3]}
      - {kind: distinct, slots: [op1, op2, op3]}
    answer_derivation: {kind: matching_pairs, slots: [jw1, jw2, jw3, op1, op2, op3]}
    feedback_frame: {text: "This combines lesson02's new words with lesson01's review vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit18.lesson02.job_asking_translate.003
    lesson_content_key: fa.a1.unit18.lesson02.asking_about_job
    type: translation
    frame: {text: "{job_asking_word}", language_code: en, direction: ltr, slot_rendering: {job_asking_word: english_gloss}}
    slots: {job_asking_word: *job_asking_word}
    answer_derivation: {kind: slot_text, slot: job_asking_word}
    feedback_frame: {text: "The Farsi word or phrase is {job_asking_word}.", language_code: en, direction: ltr}

  # Lesson 3: workplace vocabulary.
  - content_key: practice.en-fa.fa.a1.unit18.lesson03.workplace_choice.001
    lesson_content_key: fa.a1.unit18.lesson03.workplace_vocab
    type: multiple_choice
    frame: {text: "{workplace_word}", language_code: fa, direction: rtl}
    slots: {workplace_word: *workplace_word}
    answer_derivation: {kind: slot_gloss, slot: workplace_word}
    feedback_frame: {text: "{workplace_word} names a place someone might work.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit18.lesson03.workplace_match.002
    lesson_content_key: fa.a1.unit18.lesson03.workplace_vocab
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots:
      ww1: *workplace_word
      ww2: *workplace_word
      ww3: *workplace_word
      wg1: *workplace_grammar_word
      wg2: *workplace_grammar_word
    slot_relations:
      - {kind: distinct, slots: [ww1, ww2, ww3]}
      - {kind: distinct, slots: [wg1, wg2]}
    answer_derivation: {kind: matching_pairs, slots: [ww1, ww2, ww3, wg1, wg2]}
    feedback_frame: {text: "These combine lesson03's new words together.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit18.lesson03.workplace_have_order.003
    lesson_content_key: fa.a1.unit18.lesson03.workplace_vocab
    type: word_order
    frame: {text: "در یک {workplace_word} کار می‌کنم", language_code: fa, direction: rtl}
    slots: {workplace_word: *workplace_word}
    answer_derivation: {kind: render_frame, frame: {text: "در یک {workplace_word} کار می‌کنم", language_code: fa, direction: rtl}}
    feedback_frame: {text: "در یک {workplace_word} کار می‌کنم means I work at a {workplace_word}.", language_code: en, direction: ltr}

  # Lesson 4: describing a work routine.
  - content_key: practice.en-fa.fa.a1.unit18.lesson04.workplace_every_day_order.001
    lesson_content_key: fa.a1.unit18.lesson04.describing_work_routine
    type: word_order
    frame: {text: "هر روز در یک {workplace_word} کار می‌کنم", language_code: fa, direction: rtl}
    slots: {workplace_word: *workplace_word}
    answer_derivation: {kind: render_frame, frame: {text: "هر روز در یک {workplace_word} کار می‌کنم", language_code: fa, direction: rtl}}
    feedback_frame: {text: "هر روز در یک {workplace_word} کار می‌کنم means I work at a {workplace_word} every day.", language_code: en, direction: ltr}

  # Lesson 5: reading a work profile.
  - content_key: practice.en-fa.fa.a1.unit18.lesson05.work_verb_choice.001
    lesson_content_key: fa.a1.unit18.lesson05.reading_a_work_profile
    type: multiple_choice
    frame: {text: "{work_verb_form}", language_code: fa, direction: rtl}
    slots: {work_verb_form: *work_verb_form}
    answer_derivation: {kind: slot_gloss, slot: work_verb_form}
    feedback_frame: {text: "{work_verb_form} combines with کار (کار {work_verb_form}) to mean 'work.'", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit18.lesson05.work_verb_order.002
    lesson_content_key: fa.a1.unit18.lesson05.reading_a_work_profile
    type: word_order
    frame: {text: "کار {work_verb_form}", language_code: fa, direction: rtl}
    slots: {work_verb_form: *work_verb_form}
    answer_derivation: {kind: render_frame, frame: {text: "کار {work_verb_form}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "کار {work_verb_form} means I/you/he/she work[s], depending on the verb form.", language_code: en, direction: ltr}

  # Lesson 6: a dialogue about jobs.
  - content_key: practice.en-fa.fa.a1.unit18.lesson06.occupation_third_person_translate.001
    lesson_content_key: fa.a1.unit18.lesson06.jobs_dialogue
    type: translation
    frame: {text: "{occupation_third_person}", language_code: en, direction: ltr, slot_rendering: {occupation_third_person: english_gloss}}
    slots: {occupation_third_person: *occupation_third_person}
    answer_derivation: {kind: slot_text, slot: occupation_third_person}
    feedback_frame: {text: "The Farsi word is {occupation_third_person}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit18.lesson06.person_occupation_order.002
    lesson_content_key: fa.a1.unit18.lesson06.jobs_dialogue
    type: word_order
    frame: {text: "{person_name} {occupation_third_person}", language_code: fa, direction: rtl}
    slots: {person_name: *person_name, occupation_third_person: *occupation_third_person}
    answer_derivation: {kind: render_frame, frame: {text: "{person_name} {occupation_third_person}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "{occupation_third_person} means he's/she's a ..., as in نیما مهندسه (Nima is an engineer).", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit18.lesson06.person_workplace_order.003
    lesson_content_key: fa.a1.unit18.lesson06.jobs_dialogue
    type: word_order
    frame: {text: "{person_name} در یک {workplace_word} کار می‌کنه", language_code: fa, direction: rtl}
    slots: {person_name: *person_name, workplace_word: *workplace_word}
    answer_derivation: {kind: render_frame, frame: {text: "{person_name} در یک {workplace_word} کار می‌کنه", language_code: fa, direction: rtl}}
    feedback_frame: {text: "کار می‌کنه means he/she works, as in نیما در یک شرکت کار می‌کنه (Nima works at a company).", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit18.lesson06.unit_review_match.004
    lesson_content_key: fa.a1.unit18.lesson06.jobs_dialogue
    type: matching_pairs
    frame: {text: "Match each word or phrase with its meaning -- a review of this whole unit's job vocabulary.", language_code: en, direction: ltr}
    slots:
      op1: *occupation_self_phrase
      op2: *occupation_self_phrase
      op3: *occupation_self_phrase
      ww1: *workplace_word
      ww2: *workplace_word
      ww3: *workplace_word
      ot1: *occupation_third_person
      ot2: *occupation_third_person
    slot_relations:
      - {kind: distinct, slots: [op1, op2, op3]}
      - {kind: distinct, slots: [ww1, ww2, ww3]}
      - {kind: distinct, slots: [ot1, ot2]}
    answer_derivation: {kind: matching_pairs, slots: [op1, op2, op3, ww1, ww2, ww3, ot1, ot2]}
    feedback_frame: {text: "This reviews the occupation, workplace, and third-person job vocabulary taught in this unit.", language_code: en, direction: ltr}
