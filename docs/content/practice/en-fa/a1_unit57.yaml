- content_key: practice.en-fa.fa.a1.unit57.lesson02.match.003
  lesson_content_key: fa.a1.unit57.lesson02.new_zoo_two
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fa
    direction: rtl
  slots:
    first: &id001
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - phrase
      agreement_tags:
        semantic:
        - zoo_word
        - reviewed_phrase
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
