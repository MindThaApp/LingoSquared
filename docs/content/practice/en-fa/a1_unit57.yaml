schema_version: '1.0'
pack_key: practice.en-fa.a1.unit57
source_language: en
target_language: fa
unit_content_key: fa.a1.unit57.zoo
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    8 distinct fa lexemes across 6 lessons with lexemes (new_zoo_one, new_zoo_two, suggest_animal, zoo_dialogue,
    reading_zoo_sign, wrap_up). CAPACITY-THIN unit: far below the recipe's 40-distinct-item pack floor
    and 12-template floor by construction -- the realization itself introduces very few fa lexemes in
    this unit (a themed vocabulary unit with 1-4 content words per lesson plus proper names / a reading
    sign / a wrap-up sentence). Authored what the pool supports; not padded with untaught vocabulary.
    matching_pairs anchored to new_zoo_two (6 pairs), pooled over the unit-wide non-proper-noun distinct
    tokens (7 available). Proper nouns (ارم) excluded from multiple_choice and matching_pairs (self-gloss
    transliteration, near-trivial); reached only via the dedicated proper_noun translation drill(s). Template
    mix: recognition(multiple_choice)=6, structured(matching_pairs)=1, production(translation)=7, total=14.
    No listen_select authored (fa has no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes
    such templates). No mis-glossed lexemes found in this pool (every gloss checked against what the unit
    realization teaches).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
