  lesson_content_key: fa.a1.unit57.lesson01.new_zoo_one
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
