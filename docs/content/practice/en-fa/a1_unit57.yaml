schema_version: '1.0'
pack_key: practice.en-fa.a1.unit57
source_language: en
target_language: fa
unit_content_key: fa.a1.unit57.zoo
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    8 distinct fa lexemes across 6 lessons with lexemes (new_zoo_one, new_zoo_two, suggest_animal, zoo_dialogue,
    reading_zoo_sign, wrap_up). CAPACITY-THIN unit: far below the recipe's 40-distinct-item pack floor
    and 12-template floor by construction -- the realization itself introduces very few fa lexemes in
    this unit (a themed vocabulary unit with 1-4 content words per lesson plus proper names / a reading
    sign / a wrap-up sentence). Authored what the pool supports; not padded with untaught vocabulary.
    matching_pairs anchored to new_zoo_two (6 pairs), pooled over the unit-wide non-proper-noun distinct
    tokens (7 available). Proper nouns (ارم) excluded from multiple_choice and matching_pairs (self-gloss
    transliteration, near-trivial); reached only via the dedicated proper_noun translation drill(s). Template
    mix: recognition(multiple_choice)=6, structured(matching_pairs)=1, production(translation)=7, total=14.
    No listen_select authored (fa has no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes
    such templates). No mis-glossed lexemes found in this pool (every gloss checked against what the unit
    realization teaches).
    POLISH 2026-07-24 (wave 2): match.003's bare-POS slots replaced with the semantic union
    [zoo_word, reviewed_phrase] -- same 7 unit-scoped fills at checkpoint (4 zoo words + 3 unit
    phrases), but Endless Practice no longer pulls the whole level's vocab. Structured tier brought
    to 3 live: added lesson03.order.003 ("بریم {item} ببینیم؟" -- this unit's suggestion pattern;
    slot = zoo_word nouns باغ‌وحش/شیر/فیل, all grammatical, tag course-unique; ببینیم in the frame
    is NOT a slot candidate, the slot's POS is noun) and lesson04.order.003 (bare '{item}' phrase
    word_order over the unit's own reviewed phrases; a bare frame is grammatical for every
    course-scope phrase). Template mix now: recognition=6, structured=3 (1 matching + 2 word_order),
    production=7, total=16.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - zoo_word
    - reviewed_phrase
templates:
- content_key: practice.en-fa.fa.a1.unit57.lesson01.choose.001
  lesson_content_key: fa.a1.unit57.lesson01.new_zoo_one
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
    language_code: en
    direction: ltr
- content_key: practice.en-fa.fa.a1.unit57.lesson01.translate.002
  lesson_content_key: fa.a1.unit57.lesson01.new_zoo_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
