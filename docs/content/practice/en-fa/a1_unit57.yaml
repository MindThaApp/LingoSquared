      language_code: fa
      part_of_speech: noun
      agreement_tags:
        semantic: zoo_word
  answer_derivation:
    kind: render_frame
    frame:
      text: بریم {item} ببینیم؟
      language_code: fa
      direction: rtl
  feedback_frame:
    text: بریم ... ببینیم؟ means 'shall we go see ...?' -- this unit's suggestion pattern.
    language_code: en
    direction: ltr
