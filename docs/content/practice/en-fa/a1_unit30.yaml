# --- unit-wide matching_pairs over the noun union ---
- content_key: practice.en-fa.fa.a1.unit30.lesson01.match.004
  lesson_content_key: fa.a1.unit30.lesson01.study_vocabulary
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fa
    direction: rtl
  slots:
    first: &edu
      language_code: fa
      part_of_speech: noun
      agreement_tags: {semantic: [study_word, subject_word, learning_verb_word]}
    second: *edu
    third: *edu
    fourth: *edu
    fifth: *edu
    sixth: *edu
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: 'These are the unit''s education/study words.'
    language_code: en
    direction: ltr
