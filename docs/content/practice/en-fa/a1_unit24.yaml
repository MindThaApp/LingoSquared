    agreement_tags:
      semantic: frequency_word
  reading_hobby_word: &id005
    language_code: fa
    part_of_speech:
    - verb
    - particle
    agreement_tags:
      semantic: reading_hobby_word
  closing_word: &id006
    language_code: fa
    part_of_speech:
    - verb
    - phrase
    agreement_tags:
      semantic: closing_word
  unit24_wide_word: &id008
    language_code: fa
