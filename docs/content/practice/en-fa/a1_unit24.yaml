review:
  status: unreviewed
  required_next_reviewer: codex
  notes: 'Authored 2026-07-09 (en-fa overnight units-20+ practice-depth pass, same batch as a1_unit20-23.yaml -- see those
    files'' own notes for the shared UNIT_FILES-extension pattern). Extends scripts/backfill_lexemes.py with 14 new FA_GLOSSES
    entries, 1 new FA_ADVERBS entry (گاهی), 1 new FA_ADJECTIVES entry (آزاد), 6 new FA_VERBS entries, and 6 new semantic tags.
    وقت/کتاب/من/دوست/دارم/ موسیقی/فیلم/می‌کنم/هر/تو/چیکار/می‌کنی/نیما/داره/چند/تا/هم/می‌کنه/ سارا/سینما/چی/و/چه/خوب already
    existed (established across many earlier units) -- reused verbatim.

    Real pre-existing dead-anchor risk caught and fixed (not introduced by this pass, but discovered while classifying this
    unit): unit24''s own lesson05 teach.chand_ta_phrase card introduces the exact phrase text "چند تا", byte-identical to
    unit04''s own already-established "چند تا" (there, strictly interrogative "how many," anchored/glossed narrower) -- unit24
    uses the same phrase in a broader, genuinely different sense ("a few," in a declarative sentence, "هر هفته چند تا کتاب
    می‌خونه"). Without a fix, _classify_fa()''s fa_specs.setdefault() would silently keep unit04''s narrower anchor/ gloss
    for unit24''s occurrence too. Fixed with a new discriminator key ("hobby_reading_frequency") mirroring the a1_unit20 بله،
    بفرمایید / a1_unit06 restaurant-dialogue fix from earlier in this same overnight pass. Per that same fix''s own documented
    caution (both senses still collapse to one physical Lexeme row at real DB-persistence time, since main()''s existing-row
    lookup matches on token+part_of_speech only), this pack does NOT use "چند تا" as an actual slot member despite the fix
    -- "reading_hobby_word" uses می‌خونه/می‌کنه/هم instead, sidestepping the collision entirely.

    Separately confirmed clean, NOT a bug: unit24''s own lesson06 "چه خوب!" phrase is also byte-identical to unit23''s own
    "چه خوب!" (already given its own dead-anchor scare during initial classification) -- but here the underlying MEANING is
    genuinely identical in both units ("how nice!", the same idiomatic positive reaction), and unit24''s own overlay note
    explicitly says "already taught in unit23" -- confirmed via direct comparison of both overlays'' gloss/note text (byte-identical
    gloss: "how nice!"). This is intentional, correct reuse, not a collision requiring a fix -- setdefault() correctly keeping
    unit23''s anchor is the RIGHT behavior here. This pack does not use "چه خوب!" as a slot member either way (not needed
    for its own template design).

    Six semantic groups, all verified via scripts/_practice_slot_check.py: "hobby_word" pools سرگرمی with the 2 auto-derived
    lesson01 phrase lexemes "وقت آزاد"/"کتاب خوندن" (3 members, mixed noun/phrase, anchored lesson01, mirrors match_basic_hobbies_vocab).
    "music_movie_word" pools موسیقی/فیلم/می‌بینم with the auto-derived "گوش می‌دم" phrase (4 members, mixed noun/verb/phrase,
    anchored lesson02, mirrors match_music_movies_vocab). "sport_word" pools ورزش/فوتبال/بازی (3 members, anchored lesson03,
    mirrors match_sport_vocab''s new-word subset). "frequency_word" pools هفته/ گاهی (2 members, translation/matching-only,
    anchored lesson04). "reading_hobby_word" pools می‌خونه/می‌کنه/هم (3 members, anchored lesson05 -- هم additive on top of
    its existing particle entry). Real POS-restriction bug caught and fixed live via scripts/_practice_slot_check.py: the
    slot preset originally restricted part_of_speech to verb only (matching می‌خونه/می‌کنه), which silently excluded هم (part_of_speech
    particle) from every generated item''s candidate pool -- multiple_choice.001 initially resolved to only 2 distinct answer
    values instead of the real 3, caught by the checker''s own >=3-distinct-candidates requirement before this pack was considered
    clean. Fixed by widening the preset to part_of_speech: [verb, particle], the exact same class of bug (and fix) as this
    project''s own a1_unit17 politeness-preset fix documented in docs/BUILD_LOG.md''s earlier depth-pass entry. "closing_word"
    pools دیدن with the auto-derived "می‌رم سینما" phrase (2 members, translation/matching-only, anchored lesson06). Deliberately
    no generative slot-combining templates this unit (unlike units 20/21/23''s "{a} و {b}" or "{item} {color} می‌خوام" patterns):
    this unit''s real taught sentences all combine a specific hobby noun/phrase with a specific fixed verb form whose correct
    colloquial ending can''t be derived generically per candidate (e.g. "کتاب خوندن دوست دارم" vs "فوتبال دوست دارم" have
    different real grammar depending on whether the activity is itself a nominalized verb phrase or a bare noun) -- same caution
    already documented for a1_unit19''s is_location_verb and a1_unit23''s feeling_1st_person_word.

    Lesson-anchor check: lesson01 (basic hobbies), lesson02 (music and movies), lesson03 (sport), lesson04 (frequency), and
    lesson05 (reading about a hobby) each genuinely introduce new vocabulary (confirmed by reading the realization file directly)
    -- safe anchors. lesson06 hosts a combined review matching_pairs template pooling hobby_word (3) + music_movie_word (4)
    + sport_word (3) into one 10-pair exercise, the same "final unit review" pattern established by a1_unit17/19/20/21/22/23''s
    own packs.

    Zero fill_in_blank templates, same standing en-fa precedent as every prior unit in this direction. scripts/_fill_in_blank_ambiguity_
    check.py reports zero flags. Verified with scripts/ _practice_slot_check.py against backfill_lexemes.py''s actual iter_specs()
    output -- clean, no zero-candidate slots, no under-3 multiple_choice/matching_pairs slots (frequency_word/closing_word
    correctly have only 2 candidates each and are never used for multiple_choice here, only matching_pairs/translation). compile_content.py
    practice-validate clean (0 errors/0 warnings). Needs the standard fresh-context review before import.


    REAUTH PASS 2026-07-24 (unit-scope DEAD-template fix, PACK-ONLY): scripts/_practice_unit_scope_check.py found 3 DEAD +
    7 below-floor. Same root cause as the rest of this batch -- موسیقی (music_movie_word) is anchored to unit14, فیلم to unit13,
    هم (reading_hobby_word) to unit01, and می‌کنه (reading_hobby_word) to unit10, none of which this unit''s own lessons actually
    introduce. Fix: added a shared slot preset "unit24_wide_word" unioning this unit''s own already-declared hobby_word + music_movie_word
    + sport_word + frequency_word + reading_hobby_word + closing_word tags (all reused verbatim, no new backfill tags) --
    unit-scoped pool is 13 distinct words/phrases. Re-anchored hobby_match.002 (+ its volume_match.007 duplicate), music_movie_match.002,
    sport_match.002, frequency_match.001, reading_hobby_match.002, and closing_match.001 to it at 6 slots each; re-anchored
    music_movie_choice.001 and reading_hobby_choice.001 to it too (both now well clear of the 3-distinct floor).

    unit_review_match.002''s mw (music_movie_word) group needed 4 but its unit-scoped native pool is only 2 (موسیقی/فیلم borrowed
    from unit13/14) -- this template was flagged DEAD by the checker, though (as elsewhere in this batch) only because its
    first-slot check happened to land on the also-broken hw/need computation, not because it understood the mw group specifically.
    Converted the whole template from its 3-group (hw/mw/sw) design to a single flat 8-of-13 pool over the same "unit24_wide_word"
    preset used everywhere else in this pack, the same fix applied to the other 4 packs in this batch -- simpler than trying
    to keep 3 disjoint sub-pools each individually over the 6-pair floor, and it also clears the checker''s per-relation-group
    6-pair floor check outright instead of leaving a residual (harmless but noisy) FLOOR line. No mis-glossed lexemes found
    in this unit''s pool. Verified: 0 DEAD, 0 below-floor for this pack per the unit-scope checker; practice-validate 0 errors
    (see coordinator report for the exact invocation covering all 5 units in this batch).'
