  part_of_speech:
  - noun
  - phrase
  - verb
  - adverb
  - particle
  agreement_tags:
    semantic:
    - hobby_word
    - music_movie_word
    - sport_word
    - frequency_word
    - reading_hobby_word
    - closing_word
slot_presets:
  hobby_word: &id001
    language_code: fa
    part_of_speech:
    - noun
    - phrase
    agreement_tags:
      semantic: hobby_word
  music_movie_word: &id002
    language_code: fa
    part_of_speech:
    - noun
    - verb
    - phrase
    agreement_tags:
      semantic: music_movie_word
  sport_word: &id003
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic: sport_word
  frequency_word: &id004
    language_code: fa
    part_of_speech:
    - noun
    - adverb
    agreement_tags:
      semantic: frequency_word
  reading_hobby_word: &id005
    language_code: fa
    part_of_speech:
    - verb
    - particle
    agreement_tags:
      semantic: reading_hobby_word
  closing_word: &id006
    language_code: fa
    part_of_speech:
    - verb
    - phrase
    agreement_tags:
      semantic: closing_word
