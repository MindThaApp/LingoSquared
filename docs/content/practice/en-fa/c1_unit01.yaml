schema_version: '1.0'
pack_key: practice.en-fa.c1.unit01
source_language: en
target_language: fa
unit_content_key: fa.c1.unit01.sakhtar_goftar
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa C1 units 01-08 pass): 2 fixes - (1) ten choose/translate feedback frames said the item came ''from the lesson on <one lesson>'' while the slot pools the whole unit (false for most items): now ''{item} is one of this unit''''s words.''; (2) the unit pool left out three taught content words because their tokens contain ZWNJ (نتیجه‌گیری conclusion, تجربه‌ای an experience, راه‌حل solution): added to every unit-wide union. Read every gloss in the pool against the realization (all match the taught sense; no duplicate or interchangeable glosses), checked the course-scope pool of the single word_order frame (w_ابتدا: 1 candidate, ابتدا, grammatical, not a literal word of the frame), no listen_select, rtl/ltr directions. Capacity (fa lexemes only, .c1.unit01. filter): 16 templates, recognition 5 / structured 6 / production 5, all 5 lessons with lexemes covered in every tier, no ''!!'' lines. The backfill also emits English source_gloss lexemes for C1 lessons; they cannot be hosted and dilute the coverage figure. Earlier: Built by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fa backfill lexemes (tags fa_c1_u1 / w_<token>). 30 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ابتدا, w_ارائه, w_استطراد, w_اشاره, w_بازگشت, w_بعدی, w_تصمیم, w_توضیح, w_جامع, w_دفتر, w_دیگر, w_ربط, w_روشن, w_طرح, w_طرف, w_عملی, w_قبلی, w_مثال, w_مرتبط, w_مشکل, w_مقدمه, w_موضوع, w_نکته, w_پایان, w_پیشنهاد, w_پیشنهادی, w_کامل, w_کوتاه, w_گزارش, w_گفتار, w_نتیجه‌گیری, w_تجربه‌ای, w_راه‌حل]
