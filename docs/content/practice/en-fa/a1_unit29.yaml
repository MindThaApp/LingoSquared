# --- unit-wide matching_pairs over both semantic tags ---
- content_key: practice.en-fa.fa.a1.unit29.lesson01.match.005
  lesson_content_key: fa.a1.unit29.lesson01.device_vocabulary
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fa
    direction: rtl
  slots:
    first: &tech
      language_code: fa
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: [device_word, phone_use_word]}
    second: *tech
    third: *tech
    fourth: *tech
    fifth: *tech
    sixth: *tech
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: 'These are the unit''s technology words.'
    language_code: en
    direction: ltr
