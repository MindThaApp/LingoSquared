schema_version: '1.0'
pack_key: practice.en-fa.a1.unit29
source_language: en
target_language: fa
unit_content_key: fa.a1.unit29.technology

review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Vocabulary unit (24 fa lexemes; lesson04 tech_dialogue has ZERO fa
    lexemes per backfill_lexemes and is therefore not represented by any
    template -- expected per recipe §0, not an omission). device_word
    (lesson01: تکنولوژی/گوشی/کامپیوتر/اینترنت/اپلیکیشن, 5 distinct) and
    phone_use_word (lessons02/03/05: می‌فرستم/می‌گیرم/دانلود/گوشیت/
    می‌گیره/می‌فرسته, 6 distinct) are each unioned across their lessons
    for the recognition/production workhorse; both tags checked
    course-wide and are unique to this unit. word_order 'این {item}
    خوبه.' is lifted from the lesson01 teaching card's own example
    pattern ("تکنولوژی خوبه.", "این کامپیوتر خوبه.", "این اپلیکیشن خوبه.")
    and re-read against the full 5-member device_word pool -- all
    grammatical. Deliberately did NOT author a fill_in_blank for دانلود
    ("download", the noun member of phone_use_word): the compiler's §17
    ambiguity check correctly found a second course-wide noun candidate
    (گوشیت, "your phone") in the same tag with no disambiguating tag
    available, so a single-slot fill_in_blank would hard-fail without a
    false 'interchangeable: true' (they are not synonyms) -- replaced
    with an extra multiple_choice over device_word ∪ phone_use_word
    instead. The second word_order, 'با {item} کار می‌کنم.' ("I work with
    {item}."), is
    an ORIGINAL frame (not lifted from the realization) authored to reach
    the ≥12-template floor; checked by hand against all 5 device_word
    members and all are grammatical -- flagging for reviewer attention
    since it is not source-verified the way the other frames are.
    matching_pairs unions device_word + phone_use_word (11 distinct) for
    the 6-pair floor. No mis-glossed lexemes found. No listen_select (fa
    has no TTS configured).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - device_word
    - phone_use_word

templates:
# --- lesson01 (device vocabulary) ---
- content_key: practice.en-fa.fa.a1.unit29.lesson01.choose.001
  lesson_content_key: fa.a1.unit29.lesson01.device_vocabulary
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags: {semantic: device_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is a technology word from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit29.lesson01.translate.002
  lesson_content_key: fa.a1.unit29.lesson01.device_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags: {semantic: device_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: 'Type the Farsi word for {item}.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit29.lesson01.order.003
  lesson_content_key: fa.a1.unit29.lesson01.device_vocabulary
  type: word_order
  frame: {text: 'این {item} خوبه.', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags: {semantic: device_word}
  answer_derivation:
    kind: render_frame
    frame: {text: 'این {item} خوبه.', language_code: fa, direction: rtl}
  feedback_frame:
    text: '"این {item} خوبه." means "This {item} is good."'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit29.lesson01.order.004
  lesson_content_key: fa.a1.unit29.lesson01.device_vocabulary
  type: word_order
  frame: {text: 'با {item} کار می‌کنم.', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags: {semantic: device_word}
