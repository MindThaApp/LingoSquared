# --- unit-wide matching_pairs over both semantic tags ---
- content_key: practice.en-fa.fa.a1.unit28.lesson02.match.004
  lesson_content_key: fa.a1.unit28.lesson02.car_bicycle
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fa
    direction: rtl
  slots:
    first: &transport
      language_code: fa
      part_of_speech: [noun, adverb, verb]
      agreement_tags: {semantic: [transport_mode_word, transport_comment_word]}
    second: *transport
    third: *transport
    fourth: *transport
    fifth: *transport
    sixth: *transport
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: 'These are the unit''s transportation words.'
    language_code: en
    direction: ltr
