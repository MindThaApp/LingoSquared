schema_version: '1.0'
pack_key: practice.en-fa.a1.unit28
source_language: en
target_language: fa
unit_content_key: fa.a1.unit28.transportation

review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Very thin vocabulary unit (18 fa lexemes total; lesson05
    reading_about_the_commute has ZERO fa lexemes per backfill_lexemes and
    is therefore not represented by any template -- expected per recipe
    §0, not an omission). transport_mode_word (lessons01-03: مترو/ماشین/
    دوچرخه/پیاده/تاکسی, 5 distinct) is the recognition/production
    workhorse; transport_comment_word (lessons04/06: چقدره/ورزشه, only 2
    distinct) is widened with transport_mode_word to clear the 3-gloss MC
    floor on lessons04/06 -- semantically loose (transport modes mixed
    with "how much is it?"/"it's exercise") but a legal OR-match per §3.1a
    and the only way those two thin lessons clear the floor; noted here
    for the reviewer. word_order frames ('با {item} می‌رم.' restricted to
    noun members only, and '{item} می‌رم.' anchoring the single adverb
    پیاده) were re-read against their course-wide pools (transport_mode_word
    is unique to this unit) and every candidate is grammatical, matching
    the realization's own example sentences verbatim ("با مترو می‌رم.",
    "با ماشین می‌رم.", "با دوچرخه می‌رم.", "با تاکسی می‌رم.", "پیاده
    می‌رم."). Deliberately excluded پیاده from the "با {item}" frame (a
    course-wide check confirmed "با پیاده" is not how the realization uses
    it). matching_pairs unions both semantic tags (7 distinct tokens) to
    clear the 6-pair floor. No mis-glossed lexemes found. No listen_select
    (fa has no TTS configured).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - transport_mode_word
    - transport_comment_word

templates:
# --- lesson01 (bus/metro) ---
- content_key: practice.en-fa.fa.a1.unit28.lesson01.choose.001
  lesson_content_key: fa.a1.unit28.lesson01.bus_metro
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, adverb]
      agreement_tags: {semantic: transport_mode_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is a way of getting around, from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit28.lesson01.translate.002
  lesson_content_key: fa.a1.unit28.lesson01.bus_metro
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, adverb]
      agreement_tags: {semantic: transport_mode_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: 'Type the Farsi word for {item}.'
    language_code: en
    direction: ltr

