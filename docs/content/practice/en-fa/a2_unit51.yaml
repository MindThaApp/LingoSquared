schema_version: '1.0'
pack_key: practice.en-fa.a2.unit51
source_language: en
target_language: fa
unit_content_key: fa.a2.unit51.short_story
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 47-51 pass): 2 fixes - (1) lesson03 fill.004 showed ___ رو خریدیم. with nothing to point to بلیت‌ها (any noun fits); the frame is now the unit''s own sentence وقتی رسیدیم، نیما ___ رو خریده بود.; (2) match.004 feedback read this unit''s a short story lessons; now short-story lessons. Dumped every pool at unit and course scope (unit-only tags) and read every gloss. Capacity: 22 templates, R5/S10/P7, 27/41 lexemes hosted (66%), 4/5 lessons with lexemes (lesson04 has only phrase lexemes). ROUTE (backfill glosses, kept in pools because not wrong, only loose): گرفتیم carries we took / decided (past, as in we decided) while the unit teaches we took (photos); می‌گرفتم carries I used to buy; take while the unit teaches I was taking (photos); رسیدن carries arriving (infinitive) while the unit teaches they arrived (the pack uses the infinitive in بعد از {item} بستنی خریدیم.). lesson02 fill.005 (بعد از ___ بستنی خریدیم.) is open recall; رسیدن is the only candidate. Authored 2026-11-15 for en-fa A2 unit 51 (a short story). Mirrors PR #250 (units 27-39): the backfill emits only unit and lesson tags (en_fa_a2_unit51_words, en_fa_a2_unit51_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two or more all fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). Phrase lexemes (word lists and dialogue lines) are not drilled, and tokens first introduced in earlier units belong to those units'' pools. Spoken Tehrani register; no native review yet. NATIVE QUESTIONS: (1) Is اونجا یه شیر بود natural for there was a lion? Recommended: yes. (2) Is خیلی خوش گذشت natural for we had a great time? Recommended: yes.'
