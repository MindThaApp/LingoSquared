schema_version: '1.0'
pack_key: practice.en-fa.a2.unit19
source_language: en
target_language: fa
unit_content_key: fa.a2.unit19.last_weekend
review:
  status: reviewed
  fresh_context: false
  required_next_reviewer: native_speaker_review
  notes: >-
    Authored 2026-10-25 (session 12) for A2 unit 19 "Last weekend", which had overlay and
    realization content but no lexemes and no practice pack, so its unit checkpoint
    returned checkpoint_unavailable. scripts/backfill_lexemes.py now covers the unit:
    gloss entries for 36 new past-tense forms (English-only), the unit's two homograph
    senses (نه as "no" and تا as "until" via NO_NEGATION_LESSONS / TA_UNTIL_LESSONS, اون as
    "he / she / that" and دیدن as "to see; to visit" via unit-scoped gloss overrides) and
    curated pool tags (en_fa_a2_unit19_*) that keep each slot to one grammatical kind
    (all I-forms, all negatives, all bare stems, and so on).


    35 templates over lessons 1, 2, 3, 4 and 6 (lesson 5 is reading and listening and
    introduces no vocabulary): multiple_choice x9, matching_pairs x6, word_order x4,
    fill_in_blank x1, translation x15 (8 bare-word, 7 fixed-sentence). Coverage of the
    unit's 81 Farsi lexemes: all 69%, recognition 63%, structured 49%, production 67%;
    every tier hosts lessons 1-4, and lesson 6 (one lexeme, the preposition تا) is hosted
    by the structured and production tiers only. No listen_select (no TTS for fa in the
    practice runtime), no phrase lexeme in any slot. The one fill_in_blank (تا) is a
    single-member anchor: any other preposition would make a different sentence, but a
    reviewer may prefer to drop it. Unhosted: اون, ما (only two pronouns, below the
    three-option minimum) and رفتند (written style only).


    Fixed-sentence translations use one-member anchor tags and carry
    answer_derivation.accepted_variants for the word orders the unit itself teaches
    (pronoun dropped or added, به before the place dropped, verb before the place,
    تو before خونه, یه / یک before کتاب). English contraction expansions are folded by the
    shared grader and are not listed.


    NATIVE SPEAKER CHECK (items for the reviewer):
    (1) Glosses of the new forms: رفتید "you (plural, polite) went" vs رفتین "you (plural,
    spoken) went"; رفتند "they went (written style)"; اومدم "I came (spoken past)".
    (2) نیومدم, نیومدی, نیومدیم: spoken forms only; the written نیامدم / نیامدیم are not
    accepted in typed answers (open question 8 in the realization notes).
    (3) Accepted variants: ما پارک رفتیم, پارک رفتیم, رفتیم پارک, رفتیم به پارک (the unit's
    verb-position and به-drop variants). Please confirm each is natural spoken Persian,
    especially "ما رفتیم پارک" and "رفتیم به پارک".
    (4) Frames: دیروز رفتم و موندم / دیروز خوردم و خوابیدم (word_order, I-forms of the
    five intransitive-or-self-contained verbs) and نرفتم و نخوردم style joins of two
    negatives; اول ... بعد ... آخرش with three I-forms.
    (5) The bare-word English prompts "my friend" and "my grandmother" accept only دوستم
    and مادربزرگم (the possessive-suffixed forms the unit teaches).
    (6) خوندم is glossed "I read"; the unit also uses it for books only, never "I
    studied".


    Pool tags: slots use the unit's own first-introduced tokens only. Tokens that
    earlier A2 units already introduced (به, بانک, خرید, دوست ...) are not in these pools.
    Iranian Persian only; the prs (Dari) lane was not opened. Persian-script codepoint
    purity: no Arabic Yeh or Kaf. Needs the standard fresh-context review before import.
