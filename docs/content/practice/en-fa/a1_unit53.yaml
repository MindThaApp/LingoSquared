schema_version: '1.0'
pack_key: practice.en-fa.a1.unit53
source_language: en
target_language: fa
unit_content_key: fa.a1.unit53.concert
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    6 distinct fa lexemes across 4 lessons with lexemes (new_concert_one, new_concert_two, concert_dialogue,
    wrap_up). CAPACITY-THIN unit: far below the recipe's 40-distinct-item pack floor and 12-template floor
    by construction -- the realization itself introduces very few fa lexemes in this unit (a themed vocabulary
    unit with 1-4 content words per lesson plus proper names / a reading sign / a wrap-up sentence). Authored
    what the pool supports; not padded with untaught vocabulary. matching_pairs anchored to concert_dialogue
    (6 pairs), pooled over the unit-wide all (fallback, includes proper nouns -- see note below) distinct
    tokens (6 available). Proper nouns (حسینی, شاهین) INCLUDED in the matching_pairs pool despite the
    self-gloss-transliteration caveat -- the non-proper pool alone (4) is below the 6-pair floor, so this
    unit's matching_pairs would not exist at all without them. Flagging for reviewer attention rather
    than silently padding elsewhere. Also reached via the dedicated proper_noun translation drill(s).
    Template mix: recognition(multiple_choice)=4, structured(matching_pairs)=1, production(translation)=5,
    total=10. No listen_select authored (fa has no TTS configured -- AZURE_SPEECH_KEY unset -- _material()
    deletes such templates). No mis-glossed lexemes found in this pool (every gloss checked against what
    the unit realization teaches).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
templates:
- content_key: practice.en-fa.fa.a1.unit53.lesson01.choose.001
  lesson_content_key: fa.a1.unit53.lesson01.new_concert_one
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
    language_code: en
    direction: ltr
