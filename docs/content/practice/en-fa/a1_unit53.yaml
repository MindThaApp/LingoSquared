schema_version: '1.0'
pack_key: practice.en-fa.a1.unit53
source_language: en
target_language: fa
unit_content_key: fa.a1.unit53.concert
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (en-fa/en-prs practice pass, fresh context; 2 fixes). (1) The four
    multiple_choice and four translation templates had no semantic constraint
    (part_of_speech only), so in Endless Practice they pooled every A1 content word of the
    course while the feedback said "{item} is a word introduced in this unit" (false, and
    off-theme distractors): all eight slots now carry en_fa_a1_unit53_words (same four items
    at checkpoint scope: کنسرت, خواننده, خانم حسینی, کنسرت چطور بود؟ باحال بود!). (2)
    Feedback reworded to "a word from this unit's concert lessons". Frames checked: "این
    {کنسرت/خواننده} خوبه." is the realization's own example; "{item} چطور بود؟ باحال بود!"
    is fine for both members. NATIVE FLAGS: "خواننده چطور بود؟ باحال بود!" (how was the
    singer? he was cool) is understood but reads less natural than with کنسرت; confirm.

    6 distinct fa lexemes across 4 lessons with lexemes (new_concert_one, new_concert_two, concert_dialogue,
    wrap_up). CAPACITY-THIN unit: far below the recipe's 40-distinct-item pack floor and 12-template floor
    by construction -- the realization itself introduces very few fa lexemes in this unit (a themed vocabulary
    unit with 1-4 content words per lesson plus proper names / a reading sign / a wrap-up sentence). Authored
    what the pool supports; not padded with untaught vocabulary. UPDATED (proper_noun self-gloss sweep):
    the lesson04 matching_pairs pool's part_of_speech no longer includes proper_noun (removed حسینی/شاهین
    from that slot's candidate set -- self-gloss risk, an MC/translation/matching option that is its own
    answer) and the lesson04 translate.003 template (a proper_noun-only bare-word translation drill,
    pool={حسینی, شاهین}) was DELETED outright rather than narrowed, since removing proper_noun from its
    sole part_of_speech constraint would leave it with zero candidates -- lesson04 is still covered by
    choose.001/translate.002/match.004. matching_pairs' remaining pool (no proper_noun, no semantic tag)
    is course-wide over the listed parts of speech, well above the 6-pair floor.
    Template mix (POST-FIX): recognition(multiple_choice)=4, structured(matching_pairs)=1,
    production(translation)=4, total=9. No listen_select authored (fa has no TTS configured --
    AZURE_SPEECH_KEY unset -- _material() deletes such templates). No mis-glossed lexemes found in this
    pool (every gloss checked against what the unit realization teaches).
    REAUTH FIX 2026-07-24: the "well above the 6-pair floor" claim above was wrong at UNIT scope --
    excluding proper_noun left only 4 unit-scoped distinct fills (کنسرت, خواننده, خانم حسینی,
    کنسرت چطور بود؟ باحال بود!) for the 6-slot lesson04.match.004 -- DEAD at checkpoint scope per
    _practice_unit_scope_check.py (it was only course-wide-safe in Endless Practice, per recipe §1.1).
    Re-added proper_noun to the matching_pairs slots' part_of_speech (&id001), bringing in حسینی
    ("Hosseini (surname)") and شاهین ("Shahin (singer's name)") for exactly 6. Their glosses are
    transliterations in a different script from the fa token, not same-script self-glosses like the
    "Nina -> Nina" case the recipe warns about for multiple_choice, so they are safe here even though
    proper_noun stays excluded from this pack's MC/translation slots (which do retain that self-gloss
    guard).
    POLISH 2026-07-24 (wave 2): match.004's bare-POS slots replaced with the semantic union
    [concert_word, person_name, reviewed_phrase] -- same 6 unit-scoped fills at checkpoint, but
    Endless Practice no longer pulls the whole level's vocab (course scope now = names + reviewed
    phrases + this unit's concert words). Structured tier brought to 3 live: added lesson01.order.003
    ("این {item} خوبه." -- mirrors the lesson02 example "این خواننده خوبه.") and lesson06.order.003
    ("{item} چطور بود؟ باحال بود!" -- mirrors the wrap-up), both over concert_word (course-unique
    tag, both members grammatical in both frames; no frame word is a slot candidate). Template mix
    now: recognition=4, structured=3 (1 matching + 2 word_order), production=4, total=11.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - concert_word
    - person_name
    - reviewed_phrase
    - en_fa_a1_unit53_words
templates:
- content_key: practice.en-fa.fa.a1.unit53.lesson01.choose.001
  lesson_content_key: fa.a1.unit53.lesson01.new_concert_one
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
      agreement_tags:
        semantic: en_fa_a1_unit53_words
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word from this unit''s concert lessons.'
    language_code: en
    direction: ltr
- content_key: practice.en-fa.fa.a1.unit53.lesson01.translate.002
  lesson_content_key: fa.a1.unit53.lesson01.new_concert_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
      agreement_tags:
        semantic: en_fa_a1_unit53_words
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: The Persian word is {item}.
    language_code: en
    direction: ltr
