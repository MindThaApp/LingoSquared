schema_version: '1.0'
pack_key: practice.en-fa.a1.unit53
source_language: en
target_language: fa
unit_content_key: fa.a1.unit53.concert
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    6 distinct fa lexemes across 4 lessons with lexemes (new_concert_one, new_concert_two, concert_dialogue,
    wrap_up). CAPACITY-THIN unit: far below the recipe's 40-distinct-item pack floor and 12-template floor
    by construction -- the realization itself introduces very few fa lexemes in this unit (a themed vocabulary
    unit with 1-4 content words per lesson plus proper names / a reading sign / a wrap-up sentence). Authored
    what the pool supports; not padded with untaught vocabulary. UPDATED (proper_noun self-gloss sweep):
    the lesson04 matching_pairs pool's part_of_speech no longer includes proper_noun (removed حسینی/شاهین
    from that slot's candidate set -- self-gloss risk, an MC/translation/matching option that is its own
    answer) and the lesson04 translate.003 template (a proper_noun-only bare-word translation drill,
    pool={حسینی, شاهین}) was DELETED outright rather than narrowed, since removing proper_noun from its
    sole part_of_speech constraint would leave it with zero candidates -- lesson04 is still covered by
    choose.001/translate.002/match.004. matching_pairs' remaining pool (no proper_noun, no semantic tag)
    is course-wide over the listed parts of speech, well above the 6-pair floor.
    Template mix (POST-FIX): recognition(multiple_choice)=4, structured(matching_pairs)=1,
    production(translation)=4, total=9. No listen_select authored (fa has no TTS configured --
    AZURE_SPEECH_KEY unset -- _material() deletes such templates). No mis-glossed lexemes found in this
    pool (every gloss checked against what the unit realization teaches).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
templates:
- content_key: practice.en-fa.fa.a1.unit53.lesson01.choose.001
  lesson_content_key: fa.a1.unit53.lesson01.new_concert_one
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
    language_code: en
    direction: ltr
- content_key: practice.en-fa.fa.a1.unit53.lesson01.translate.002
  lesson_content_key: fa.a1.unit53.lesson01.new_concert_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
