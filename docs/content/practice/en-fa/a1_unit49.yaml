    language_code: fa
    direction: rtl
  slots:
    first: *pool_pool
    second: *pool_pool
    third: *pool_pool
    fourth: *pool_pool
    fifth: *pool_pool
    sixth: *pool_pool
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
