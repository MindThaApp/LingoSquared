schema_version: '1.0'
pack_key: practice.en-fa.a1.unit51
source_language: en
target_language: fa
unit_content_key: fa.a1.unit51.cinema

review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 2 fixes). (1) The four
    multiple_choice slots used [cinema_word, person_name, reviewed_phrase]; reviewed_phrase is
    level-wide, so Endless Practice drew ~400 A1 phrases from other units while the feedback
    claimed unit vocabulary: re-pooled onto en_fa_a1_unit51_words (same 4 items at checkpoint)
    and feedback reworded ("cinema vocabulary" was wrong for Ms. Mousavi and the wrap-up
    sentence). (2) The three word_order templates drew both cinema_word nouns but showed one
    fixed feedback sentence, so half the time the feedback quoted a different sentence than the
    one built, and شروع امشب ساعت هشته / ببخشید، شروع ساعت چنده؟ are unnatural:
    lesson01/lesson04 orders now pool only سانس (lesson01 tag), lesson02 order only شروع
    (lesson02 tag), each matching its feedback. NATIVE FLAGS: ببخشید، سانس ساعت چنده؟ (a native
    might prefer سانس بعدی ساعت چنده؟) -- kept.

    THIN UNIT -- flagging per recipe §0/§3. Per backfill_lexemes_en_fa,
    lesson03 (ticket_price) and lesson05 (reading_cinema_sign) have ZERO fa
    lexemes (only English "eighty" / "film" source_gloss tokens, no target
    Farsi lexeme) -- a structural gap, not an authoring omission; those two
    lessons cannot be represented in the checkpoint no matter what is
    authored. Only lessons01, 02, 04 and 06 have fa lexemes, totaling 5
    distinct tokens/phrases: cinema_word 2 (سانس "showtime/screening" noun,
    شروع "start/beginning" noun), 1 person_name (موسوی), 2 additional
    reviewed_phrase (خانم موسوی "Ms. Mousavi", فیلم چطور بود؟ باحال بود!
    "How was the movie? It was cool!"). Union of all 3 tags gives only 5
    distinct tokens -- below the 6-pair matching_pairs floor, so no
    matching_pairs is authored. 9 templates total (well below the 12 floor
    -- real capacity limit): 4 lessons (01/02/04/06) x (multiple_choice +
    bare-word translation) over the full 5-token union, plus 1 word_order
    anchored lesson01 over cinema_word (frame "{item} امشب ساعت هشته." /
    "The {item} tonight is at eight.") -- re-read at course scope:
    cinema_word is a unit-specific coined tag with zero course-wide members
    outside this unit (verified via full iter_specs() scan), so course scope
    == unit scope here, and both members (showtime, start) read
    grammatically in that frame. fill_in_blank is not usable (no tag in this
    unit has exactly 1 course-wide candidate, even after POS narrowing --
    both cinema_word members are nouns). No mis-glossed lexemes found. No
    listen_select (Azure TTS key unset for fa).
    POLISH 2026-07-24: structured tier brought to 3 (was 1) with two more
    word_order templates over cinema_word (course scope == unit scope, tag
    is unit-exclusive; re-read: both members are grammatical in both new
    frames): lesson02.order.003 "{item} فیلم ساعت نهه." = "The
    showtime/start of the film is at nine" (unwritten ezafe), and
    lesson04.order.003 "ببخشید، {item} ساعت چنده؟" = "Excuse me, what time
    is the showtime/start?". matching_pairs remains unauthorable (5
    distinct tokens < 6-pair floor, unchanged).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - cinema_word
    - person_name
    - reviewed_phrase
    - en_fa_a1_unit51_words
    - en_fa_a1_unit51_lesson01_words
    - en_fa_a1_unit51_lesson02_words

templates:
# --- lesson01 (new_cinema_one) ---
- content_key: practice.en-fa.fa.a1.unit51.lesson01.choose.001
  lesson_content_key: fa.a1.unit51.lesson01.new_cinema_one
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, phrase]
      agreement_tags:
        semantic: en_fa_a1_unit51_words
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} comes from the cinema lessons in this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit51.lesson01.translate.002
  lesson_content_key: fa.a1.unit51.lesson01.new_cinema_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, phrase]
      agreement_tags:
        semantic: [cinema_word, person_name]
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Farsi word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit51.lesson01.order.003
  lesson_content_key: fa.a1.unit51.lesson01.new_cinema_one
  type: word_order
  frame:
    text: '{item} امشب ساعت هشته.'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags:
        semantic: en_fa_a1_unit51_lesson01_words
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} امشب ساعت هشته.'
      language_code: fa
      direction: rtl
  feedback_frame:
    text: سانس امشب ساعت هشته. -- The showtime tonight is at eight.
    language_code: en
    direction: ltr

