schema_version: '1.0'
pack_key: practice.en-fa.a1.unit38
source_language: en
target_language: fa
unit_content_key: fa.a1.unit38.seasons
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored against docs/content/PRACTICE_PACK_RECIPE.md for the en-fa a1
    seasons unit. §0 capacity: only 22 lexemes, and lesson06 (wrap_up) has
    ZERO new lexemes -- it re-teaches only already-known tokens, so it is
    unhostable no matter what (§0/§10 rule 1) and no template is anchored to
    it. lesson05 (reading_seasons) has exactly one new fa lexeme, the whole
    reading passage, tagged only reviewed_phrase (course-wide, 519
    members) -- deliberately NOT used in any template (would need a huge
    cross-corpus pool for a frame-literal type, or would add no real
    precision for MC/translate), so lesson05 is also uncovered; noted here
    for the coordinator rather than padded. Semantic tags used
    (season_word 6, season_state_verb 3, season_activity_word 2,
    season_choice_word) are unit38-exclusive EXCEPT season_choice_word,
    which is shared with unit27's دوست داری (a different phrase, "do you
    like") -- confirmed via corpus grep before authoring. season_choice_word
    is used ONLY in the lesson04 MC/translate templates (frame-literal-safe
    types); no word_order/fixed-translation template uses it, so the
    cross-unit member never has to be grammatical in a literal frame. Every
    word_order frame below uses season_word narrowed to part_of_speech: noun
    (5 members, excludes the phrase چهار فصل) or season_state_verb, both
    unit38-exclusive, and was re-read against every member for
    grammaticality. §0.1: no mis-glosses found. 13 templates across 4/6
    lessons (lesson05/06 unhostable); tiers: 4 recognition / 5 structured /
    4 production, comfortably over the ≥3 floor each, but total template
    count (13) and lesson coverage (4/6) reflect genuine thinness -- flagged
    as a lightly-thin unit.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - season_word
    - season_state_verb
    - season_activity_word
    - season_choice_word

templates:
- content_key: practice.en-fa.fa.a1.unit38.lesson01.choose.001
  lesson_content_key: fa.a1.unit38.lesson01.new_seasons_one
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, phrase]
      agreement_tags: {semantic: season_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} names a season or a season-related phrase from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit38.lesson01.translate.002
  lesson_content_key: fa.a1.unit38.lesson01.new_seasons_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, phrase]
      agreement_tags: {semantic: season_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: '{item} names a season or a season-related phrase from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit38.lesson01.match.003
  lesson_content_key: fa.a1.unit38.lesson01.new_seasons_one
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fa
    direction: rtl
  slots:
    first: &unit38_l1_match
      language_code: fa
      part_of_speech: [noun, phrase]
      agreement_tags: {semantic: season_word}
    second: *unit38_l1_match
    third: *unit38_l1_match
    fourth: *unit38_l1_match
    fifth: *unit38_l1_match
    sixth: *unit38_l1_match
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: 'The four seasons plus the season-count phrase taught in this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit38.lesson01.order.004
