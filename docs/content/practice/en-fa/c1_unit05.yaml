  slots:
    item: &id001
      language_code: fa
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_شرط, w_گذشته, w_نتیجه, w_ابراز, w_تأسف, w_جایگزین, w_ممکن, w_زنجیره, w_منطقی, w_استدلال, w_زودتر, w_درخواست, w_کرده, w_بودیم, w_خطر, w_اتفاق, w_افتاده, w_بود, w_امروز, w_تیم, w_بررسی, w_نکرد, w_برنامه, w_زمانی, w_دیگری, w_انتخاب, w_کنیم, w_پیوند, w_داده‌ها, w_دقیق‌تر]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words.', language_code: en, direction: ltr}
