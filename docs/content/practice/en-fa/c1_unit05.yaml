schema_version: '1.0'
pack_key: practice.en-fa.c1.unit05
source_language: en
target_language: fa
unit_content_key: fa.c1.unit05.agar_chenin_bud
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa C1 units 01-08 pass): 4 fixes - (1) five choose/translate feedback frames said the item came ''from the lesson on <one lesson>'' while the slot pools the whole unit: now ''{item} is one of this unit''''s words.''; (2) the production tier had only 2 templates (recipe bar 3): added lesson02.translate.004, a bare-word translation over the same unit-wide union, anchored to lesson02; (3) three pool glosses did not match the counterfactual lines and were fixed in the C1 gloss overrides of the backfill: افتاده ''has fallen / has been (as in has been delayed)'' -> ''fallen (past participle; in اتفاق افتادن to happen)'', خطر ''danger'' -> ''risk; danger'', کنیم ''let''''s do (subjunctive, we)'' -> ''(that) we do (subjunctive)''; (4) two taught content words with ZWNJ were missing from the unit pool and were added to every union: داده‌ها data, دقیق‌تر more precise. Read every pool gloss, the two fill_in_blank frames (w_تأسف, w_امروز: 1 course-wide candidate each, the hint slot shows the same lexeme''s gloss) and the five word_order frames (w_شرط, w_اتفاق, w_تیم, w_برنامه, w_پیوند: 1 candidate each, grammatical, none a literal word of its frame). Capacity (fa lexemes only, .c1.unit05. filter): 14 templates, recognition 3 / structured 8 / production 3, lessons 01-05 covered in every tier, no ''!!'' lines. Lesson06''s only lexeme is the whole five-sentence passage as one phrase row, which no template can host; it is a backfill phrase-derivation artifact, reported for the backfill lane. Earlier: Built by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fa backfill lexemes (tags fa_c1_u5 / w_<token>). 28 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ابراز, w_اتفاق, w_استدلال, w_افتاده, w_امروز, w_انتخاب, w_بررسی, w_برنامه, w_بود, w_بودیم, w_تأسف, w_تیم, w_جایگزین, w_خطر, w_درخواست, w_دیگری, w_زمانی, w_زنجیره, w_زودتر, w_شرط, w_ممکن, w_منطقی, w_نتیجه, w_نکرد, w_پیوند, w_کرده, w_کنیم, w_گذشته, w_داده‌ها, w_دقیق‌تر]
templates:
