schema_version: "1.0"
pack_key: practice.en-fa.a2.unit09
source_language: en
target_language: fa
unit_content_key: fa.a2.unit09.bureaucracy
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Authored 2026-07-06 by the practice-pool-sync lane (fa/prs bundle),
    part of the same pass as a1_unit06.yaml/a1_unit07.yaml/a1_unit08.yaml/
    a2_unit10.yaml -- see a1_unit06.yaml's notes for the shared
    backfill_lexemes.py extension this pass made. This is the first A2
    unit for en-fa's practice pool.

    One semantic group, "bureaucracy_word" (وقت/مدرک/آدرس/قبض, 4
    members, anchored lesson01), verified >=3-distinct-candidate via a
    standalone slot-matching check before authoring.

    Deliberately smaller than the A1 packs in this pass (3 templates vs.
    9), matching this unit's own smaller size (4 lessons/50 content_keys
    vs. a1's 6 lessons/~85-104): every lesson02-04 phrase (می‌خواستم
    برای تغییر آدرس وقت بگیرم, چون خونه‌مو عوض کردم..., می‌شه بگید...,
    the reading notice, the full registry-office dialogue) is a
    multi-clause A2-level register/subjunctive construction, not a bare-
    word recognition set -- forcing these into a shared tag would risk
    an unnatural generated sentence, the same judgment call a1_unit05's
    and a1_unit07's notes already made for their own register phrases.
    کارت ملی's own adjective ملی (national) has no other >=2-member
    peer in this unit and was left untagged for the same reason.

    Lesson-anchor check per tonight's found-and-fixed fa-en unit08 bug:
    lesson01 genuinely introduces new vocabulary (confirmed by reading
    the realization file directly) -- safe anchor.

    Verified with scripts/_practice_slot_check.py's lexeme_matches()/
    check_pack() logic against backfill_lexemes.py's actual iter_specs()
    output (ad hoc harness, not committed) -- clean, no zero-candidate
    slots, no under-3 multiple_choice/matching_pairs slots.
    compile_content.py practice-validate also clean (0 errors/0
    warnings) for the full en-fa pack (units 01-08 plus this a2 unit
    together). Needs the standard fresh-context review before import.
    Same standing blocker as every pack in this bundle: no
    backfill_lexemes.py run has actually happened against a real
    database yet in this pass.

    DEPTH PASS, added 2026-07-06 (practice-pool-sync lane, closing the
    units 06-10 template-density audit gap -- this was the single
    thinnest unit in the entire corpus, 3->9). Added three new tags to
    scripts/backfill_lexemes.py's fa_agreement_tags(): "paperwork_word"
    (اجاره‌نامه/مهلت, 2 members, matching/translation only, anchored
    lesson03 where both are taught); and "bureaucracy_phrase", which
    pools every genuine whole-sentence/whole-phrase lexeme this unit's
    own four lessons introduce (iter_specs() already auto-derives one
    phrase-level lexeme per multi-token teaching card and tags it
    "reviewed_phrase" course-wide -- bureaucracy_phrase scopes that same
    real data to just this unit's own lesson_key prefix, 11 real members
    by lesson04, anchored there since that's where the pool completes).
    Deliberately did NOT force any new multi-clause generative sentence
    frame combining bureaucracy_word with a verb (چون/می‌خواستم/می‌شه
    constructions remain the multi-clause A2 register/subjunctive
    territory this pack's own earlier notes already ruled out for a
    shared tag) -- instead added a single safe "X و X" word_order
    template directly mirroring this unit's own realization exercise
    (lesson01.exercise04's "مدرک و آدرس" word_bank), since و is
    grammatical for any two of these four office nouns. Re-verified with
    scripts/_practice_slot_check.py (paperwork_word=2, bureaucracy_
    phrase=11, both real, all distinct) and compile_content.py
    practice-validate (0 errors/0 warnings, full en-fa pack).
    review.status left unreviewed -- this pass does not self-certify
    review.
tag_schema:
  part_of_speech: [noun, phrase]
  agreement_tags:
    semantic: [bureaucracy_word, paperwork_word, bureaucracy_phrase]
slot_presets:
  bureaucracy_word: &bureaucracy_word {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: bureaucracy_word}}
  paperwork_word: &paperwork_word {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: paperwork_word}}
  bureaucracy_phrase: &bureaucracy_phrase {language_code: fa, part_of_speech: phrase, agreement_tags: {semantic: bureaucracy_phrase}}
templates:
  - content_key: practice.en-fa.fa.a2.unit09.lesson01.bureaucracy_choice.001
    lesson_content_key: fa.a2.unit09.lesson01.bureaucracy_vocabulary
    type: multiple_choice
    frame: {text: "{bureaucracy_word}", language_code: fa, direction: rtl}
    slots: {bureaucracy_word: *bureaucracy_word}
    answer_derivation: {kind: slot_gloss, slot: bureaucracy_word}
    feedback_frame: {text: "{bureaucracy_word} is an office/bureaucracy word from this lesson.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a2.unit09.lesson01.bureaucracy_match.002
    lesson_content_key: fa.a2.unit09.lesson01.bureaucracy_vocabulary
    type: matching_pairs
    frame: {text: "Match each office/bureaucracy word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *bureaucracy_word, second: *bureaucracy_word, third: *bureaucracy_word, fourth: *bureaucracy_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "Match each office/bureaucracy word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a2.unit09.lesson01.bureaucracy_translate.003
    lesson_content_key: fa.a2.unit09.lesson01.bureaucracy_vocabulary
    type: translation
    frame: {text: "{bureaucracy_word}", language_code: en, direction: ltr, slot_rendering: {bureaucracy_word: english_gloss}}
    slots: {bureaucracy_word: *bureaucracy_word}
    answer_derivation: {kind: slot_text, slot: bureaucracy_word}
    feedback_frame: {text: "The Farsi word is {bureaucracy_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a2.unit09.lesson01.bureaucracy_word_order.004
    lesson_content_key: fa.a2.unit09.lesson01.bureaucracy_vocabulary
    type: word_order
    frame: {text: "{bureaucracy_word_one} و {bureaucracy_word_two}", language_code: fa, direction: rtl}
    slots: {bureaucracy_word_one: *bureaucracy_word, bureaucracy_word_two: *bureaucracy_word}
    slot_relations: [{kind: distinct, slots: [bureaucracy_word_one, bureaucracy_word_two]}]
    answer_derivation: {kind: render_frame, frame: {text: "{bureaucracy_word_one} و {bureaucracy_word_two}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "و joins two office words, like مدرک و آدرس.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a2.unit09.lesson03.paperwork_match.005
    lesson_content_key: fa.a2.unit09.lesson03.reading_the_notice
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *paperwork_word, second: *paperwork_word}
    slot_relations: [{kind: distinct, slots: [first, second]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a2.unit09.lesson03.paperwork_translate.006
    lesson_content_key: fa.a2.unit09.lesson03.reading_the_notice
    type: translation
    frame: {text: "{paperwork_word}", language_code: en, direction: ltr, slot_rendering: {paperwork_word: english_gloss}}
    slots: {paperwork_word: *paperwork_word}
    answer_derivation: {kind: slot_text, slot: paperwork_word}
    feedback_frame: {text: "The Farsi word is {paperwork_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a2.unit09.lesson04.bureaucracy_phrase_choice.007
    lesson_content_key: fa.a2.unit09.lesson04.at_the_registry_office
    type: multiple_choice
    frame: {text: "{bureaucracy_phrase}", language_code: fa, direction: rtl}
    slots: {bureaucracy_phrase: *bureaucracy_phrase}
    answer_derivation: {kind: slot_gloss, slot: bureaucracy_phrase}
    feedback_frame: {text: "This is a phrase or sentence from this unit's registry-office scenario.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a2.unit09.lesson04.bureaucracy_phrase_match.008
    lesson_content_key: fa.a2.unit09.lesson04.at_the_registry_office
    type: matching_pairs
    frame: {text: "Match each phrase with its meaning.", language_code: en, direction: ltr}
    slots:
      first: *bureaucracy_phrase
      second: *bureaucracy_phrase
      third: *bureaucracy_phrase
      fourth: *bureaucracy_phrase
      fifth: *bureaucracy_phrase
      sixth: *bureaucracy_phrase
      seventh: *bureaucracy_phrase
      eighth: *bureaucracy_phrase
      ninth: *bureaucracy_phrase
      tenth: *bureaucracy_phrase
      eleventh: *bureaucracy_phrase
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth, ninth, tenth, eleventh]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth, ninth, tenth, eleventh]}
    feedback_frame: {text: "Match each phrase to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a2.unit09.lesson04.bureaucracy_phrase_translate.009
    lesson_content_key: fa.a2.unit09.lesson04.at_the_registry_office
    type: translation
    frame: {text: "{bureaucracy_phrase}", language_code: en, direction: ltr, slot_rendering: {bureaucracy_phrase: english_gloss}}
    slots: {bureaucracy_phrase: *bureaucracy_phrase}
    answer_derivation: {kind: slot_text, slot: bureaucracy_phrase}
    feedback_frame: {text: "This phrase or sentence appears in this unit's registry-office scenario.", language_code: en, direction: ltr}
