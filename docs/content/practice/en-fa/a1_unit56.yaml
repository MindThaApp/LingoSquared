schema_version: '1.0'
pack_key: practice.en-fa.a1.unit56
source_language: en
target_language: fa
unit_content_key: fa.a1.unit56.beach
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 4 fixes). (1) multiple_choice x5
    had no semantic tag (whole A1 level in Endless Practice; feedback claimed unit words): now
    en_fa_a1_unit56_words (same 6 items at checkpoint), feedback reworded. (2) translation x5
    had the same level-wide pool and asked learners to type the Noor Beach sign (numerals سی
    هزار / ۳۰ هزار, three sentences) and two dialogue sentences from English, graded against one
    string (underdetermined): now the 3 beach_word nouns ساحل/دریا/ماسه. (3) match.003
    [beach_word, reviewed_phrase] pulled level-wide phrases: now en_fa_a1_unit56_words (6 items
    = 6 slots, a capacity limit). (4) lesson04.order.003 (bare phrase) had no semantic tag
    (every A1 phrase): now the lesson04/lesson06 phrases; the sign is excluded because its
    sentences after the heading can be built in more than one valid order but only one is
    graded. NATIVE FLAGS: none. Gloss lane: ساحل چطور بود؟ باحال بود! glossed "It was fun!"
    while units 51-54 gloss the same باحال بود! as "It was cool!" -- harmonise (proposed "How
    was the beach? It was cool!").

    7 distinct fa lexemes across 5 lessons with lexemes (new_beach_one, new_beach_two, beach_dialogue,
    reading_beach_sign, wrap_up). CAPACITY-THIN unit: far below the recipe's 40-distinct-item pack floor
    and 12-template floor by construction -- the realization itself introduces very few fa lexemes in
    this unit (a themed vocabulary unit with 1-4 content words per lesson plus proper names / a reading
    sign / a wrap-up sentence). Authored what the pool supports; not padded with untaught vocabulary.
    matching_pairs anchored to new_beach_two (6 pairs), pooled over the unit-wide non-proper-noun distinct
    tokens (6 available). Proper nouns (نور) excluded from multiple_choice and matching_pairs (self-gloss
    transliteration, near-trivial); reached only via the dedicated proper_noun translation drill(s). Template
    mix: recognition(multiple_choice)=5, structured(matching_pairs)=1, production(translation)=6, total=12.
    No listen_select authored (fa has no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes
    such templates). No mis-glossed lexemes found in this pool (every gloss checked against what the unit
    realization teaches).
    POLISH 2026-07-24 (wave 2): match.003's bare-POS slots replaced with the semantic union
    [beach_word, reviewed_phrase] -- same 6 unit-scoped fills at checkpoint (3 beach words + 3 unit
    phrases), but Endless Practice no longer pulls the whole level's vocab. Structured tier brought
    to 3 live: added lesson02.order.004 ("اینجا {item} داره." -- variant of the lesson02 examples
    "ساحل دریا/ماسه داره." with اینجا as subject so ساحل itself stays a valid fill without
    self-reference; all 3 beach_word nouns grammatical, tag course-unique) and lesson04.order.003
    (bare '{item}' phrase word_order over the unit's own reviewed phrases; a bare frame is
    grammatical for every course-scope phrase). Template mix now: recognition=5, structured=3
    (1 matching + 2 word_order), production=6, total=14.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - beach_word
    - en_fa_a1_unit56_words
    - en_fa_a1_unit56_lesson04_words
    - en_fa_a1_unit56_lesson06_words
    - reviewed_phrase
templates:
- content_key: practice.en-fa.fa.a1.unit56.lesson01.choose.001
  lesson_content_key: fa.a1.unit56.lesson01.new_beach_one
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, verb, adjective, adverb, preposition, particle, phrase]
      agreement_tags:
        semantic: en_fa_a1_unit56_words
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} comes from this unit.'
    language_code: en
    direction: ltr
- content_key: practice.en-fa.fa.a1.unit56.lesson01.translate.002
  lesson_content_key: fa.a1.unit56.lesson01.new_beach_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags:
        semantic: beach_word
  answer_derivation:
