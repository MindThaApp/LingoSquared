schema_version: '1.0'
pack_key: practice.en-fa.b1.unit15
source_language: en
target_language: fa
unit_content_key: fa.b1.unit15.purpose_clauses
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: |-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 4 fixes).
    (1) All six choose + six translate templates had no semantic tag (course 449: whole B1 level in Endless) -> unit words (en_fa_b1_unit15_words, 19). (2) lesson02.match.003 pooled exactly 6 saving_action_word members for 6 pairs (same six cards every time; feedback called tamrin 'practice' a saving-and-spending word) -> saving words + lesson01/03 words (9), neutral feedback. (3) lesson05.match.003 (personal_progress_word + purpose_goal_word) pulled unit16's yaaddaasht-haa / raahat-tar in Endless (course 11 vs unit 9) and allowed prepositions -> unit words (19). (4) choose feedback 'introduced in this unit' -> 'from this unit'.
    Checked: order.003 'هدف من اینه که فارسی‌ام بهتر بشه.' matches the realization.
    NATIVE FLAGS: typed answers farsi-am / farsi-ash use the ZWNJ forms فارسی‌ام / فارسی‌اش; spoken spelling فارسیم / فارسیش is not accepted.

    24 distinct fa lexemes across 6 lessons with lexemes (study_goal, saving_goal, work_goal, dialogue_goals, reading_goals, wrapup_production). matching_pairs anchored to reading_goals (8 pairs), pooled over the unit-wide non-proper-noun distinct tokens (24 available). Template mix: recognition(multiple_choice)=6, structured(matching_pairs x2, word_order x1)=3, production(translation)=6, total=15. No listen_select authored (fa has no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes such templates). No mis-glossed lexemes found in this pool (every gloss checked against what the unit realization teaches). Polish 2026-07-25: match.003 slots switched from bare-POS to personal_progress_word + purpose_goal_word (11 unit tokens; sole course-scope extra yaaddaasht-haa from b1.unit16 is a clean matching card) so Endless Practice stays on-theme; added a saving-theme matching (saving_action_word, 6 tokens) and a word_order mirroring the realization pattern (hadaf ... ine ke faarsi-am behtar beshe) anchored by purpose_goal_word narrowed to part_of_speech noun (single course candidate hadaf).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - personal_progress_word
    - purpose_goal_word
    - saving_action_word
    - en_fa_b1_unit15_words
    - en_fa_b1_unit15_lesson01_words
    - en_fa_b1_unit15_lesson03_words
