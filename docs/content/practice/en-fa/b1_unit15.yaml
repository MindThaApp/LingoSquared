schema_version: '1.0'
pack_key: practice.en-fa.b1.unit15
source_language: en
target_language: fa
unit_content_key: fa.b1.unit15.purpose_clauses
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    24 distinct fa lexemes across 6 lessons with lexemes (study_goal, saving_goal, work_goal, dialogue_goals,
    reading_goals, wrapup_production). matching_pairs anchored to reading_goals (8 pairs), pooled over
    the unit-wide non-proper-noun distinct tokens (24 available). Template mix: recognition(multiple_choice)=6,
    structured(matching_pairs x2, word_order x1)=3, production(translation)=6, total=15. No listen_select authored (fa has
    no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes such templates). No mis-glossed
    lexemes found in this pool (every gloss checked against what the unit realization teaches).
    Polish 2026-07-25: match.003 slots switched from bare-POS to personal_progress_word + purpose_goal_word
    (11 unit tokens; sole course-scope extra yaaddaasht-haa from b1.unit16 is a clean matching card) so
    Endless Practice stays on-theme; added a saving-theme matching (saving_action_word, 6 tokens) and a
    word_order mirroring the realization pattern (hadaf ... ine ke faarsi-am behtar beshe) anchored by
    purpose_goal_word narrowed to part_of_speech noun (single course candidate hadaf).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - personal_progress_word
    - purpose_goal_word
    - saving_action_word
templates:
- content_key: practice.en-fa.fa.b1.unit15.lesson01.choose.001
  lesson_content_key: fa.b1.unit15.lesson01.study_goal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
    language_code: en
    direction: ltr
