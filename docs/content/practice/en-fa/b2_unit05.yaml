schema_version: '1.0'
pack_key: practice.en-fa.b2.unit05
source_language: en
target_language: fa
unit_content_key: fa.b2.unit05.register
review:
  status: unreviewed
  fresh_context: 'false'
  required_next_reviewer: native_speaker_review
  notes: 'Authored 2026-10-19 against docs/content/PRACTICE_PACK_RECIPE.md so the en-fa B2 unit05 checkpoint
    can generate (before this, en-fa B2 had no lexemes and no packs). Lexemes come from the B2 extension
    of scripts/backfill_lexemes.py (same branch). Grammar/discourse unit, so the 8.1 pattern is used:
    unit-wide curated pools, every template anchored to one lesson. 14 templates over all 3 lessons: multiple_choice
    x3 (nouns / adjectives / verbs+adverbs over b2u05_core), matching_pairs x2 (nouns; adjectives+adverbs+verbs),
    word_order x6 (two per lesson, each the unit''s own example sentence with one single-member anchor
    b2u05_<word>_single, exactly 1 course-wide candidate, not a literal of its own frame), translation
    x3 (bare-word, one per lesson over b2u05_vert_l<N>: nouns/adjectives/adverbs, no verbs, minus tokens
    with a second common Persian answer). No listen_select (no fa TTS), no fill_in_blank (the runtime
    shows no English cue for the blank), no fixed-sentence translation. All tags are unit-specific, so
    course scope == unit scope for every slot. Glosses are English-only, so no MC option or translation
    prompt contains Persian script. MEASURED (recipe 9 step 4, filter .b2.unit05.): 56/70 fa lexemes hostable;
    recognition and structured host 56, production 31; 3/3 lessons in every tier; no dead template, every
    MC pool >=3 distinct glosses, every matching pool >=6. Offline port of generate_checkpoint(): 15/15
    items on 5 seeds. practice-validate: 0 errors. Native review: lesson01 frame ''mitooni yek daghigheh
    sabr koni?'' mixes colloquial mitooni with written yek, as in the realization; the formal/informal
    pair biyandazi / biyandazid is deliberately matchable (the register contrast this unit teaches). Glosses
    are draft (backfill), pending native-Persian review together with this pack.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - b2u05_core
    - b2u05_vert_l1
    - b2u05_vert_l2
    - b2u05_vert_l3
    - b2u05_daghigheh_single
    - b2u05_khodemani_single
    - b2u05_monaseb_single
    - b2u05_hamkari_single
    - b2u05_madarek_single
    - b2u05_parvandeh_single
