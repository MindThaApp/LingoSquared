schema_version: '1.0'
pack_key: practice.en-fa.a1.unit21
source_language: en
target_language: fa
unit_content_key: fa.a1.unit21.money
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: 'Authored 2026-07-09 (en-fa overnight units-20+ practice-depth pass, same batch as a1_unit20.yaml -- see that file''s
    own notes for the shared UNIT_FILES-extension pattern and this pass''s headline dead-anchor bug catch). Extends scripts/backfill_lexemes.py
    with 11 new FA_GLOSSES entries, 1 new FA_PRONOUNS entry (چقدر), 1 new FA_ADJECTIVES entry (خرد), 1 new FA_NUMBERS entry
    (صد), 2 new FA_VERBS entries (بردارم/کنید), and 5 new semantic tags. تومن/هزار were already established (unit03/unit08,
    "price" semantic) -- reused verbatim, not reclassified.

    Five semantic groups, all verified via scripts/_practice_slot_check.py: "money_word" pools the 4 core nouns (پول/بانک/دلار/تبدیل,
    anchored lesson01, mirrors the realization''s own 4-pair match_money_words exercise). "exchange_word" pools the 4 review/new
    words lesson02 teaches alongside its two dialogue-request phrases (به/تومن/چقدر/ دارید, mixed preposition/noun/pronoun/verb,
    anchored lesson02, mirrors match_exchange_phrases'' own word-level pairs -- scoped by lesson_key so this tag doesn''t
    also pick up دارید''s later lesson06 reuse). "atm_word" pools خودپرداز with از/بردارم (mixed noun/ preposition/verb, 3
    members, anchored lesson03, mirrors match_atm_phrases). "change_word" pools خرد with بفرمایید (mixed adjective/verb, 2
    members, translation/matching-only, below the multiple_choice floor, same class as other units'' narrow pairs -- بفرمایید
    additive on top of its long-established unit01 entry). "rate_word" pools نرخ with هر (mixed noun/adjective, 2 members,
    translation/matching-only, anchored lesson05). Two generative templates reuse the existing course-wide "number" tag (established
    since unit03, 35 members as of this unit) rather than inventing new price vocabulary: "{number} دلار" mirrors lesson06''s
    own real "صد دلار" (a hundred dollars); "هر دلار {number} تومنه" mirrors lesson05''s/lesson06''s own real "هر دلار سی
    تومنه" (each dollar is 30 toman) -- both grammatical for any number, not just the one taught value.

    Real dead-anchor risk checked and confirmed clear: unit21''s own lesson06 dialogue reuses "بله، بفرمایید." (turn08) --
    the exact phrase already given a discriminator key in _classify_fa for unit20''s own occurrence (see that pack''s notes).
    Confirmed via a direct iter_specs() dump that unit21''s occurrence collapses into unit06''s ORIGINAL restaurant-dialogue
    anchor (fa_specs.setdefault() keeps the first-seen entry, and unit21 introduces no NEW tokens in that exact phrase, so
    no third discriminator was needed) -- this pack does not reference that phrase as a slot member at all, so the collision
    has zero effect on anything generated from this file.

    Lesson-anchor check: lesson01 (money vocabulary), lesson02 (exchange request), lesson03 (ATM withdrawal), lesson04 (asking
    for change), and lesson05 (asking the rate) each genuinely introduce new vocabulary (confirmed by reading the realization
    file directly) -- safe anchors. lesson06 hosts a combined review matching_pairs template pooling money_word (4) + exchange_word
    (4) + atm_word (3) into one 11-pair exercise, the same "final unit review" pattern established by a1_unit17/19/20''s own
    packs.

    Zero fill_in_blank templates, same standing en-fa precedent as every prior unit in this direction. scripts/_fill_in_blank_ambiguity_
    check.py reports zero flags. Verified with scripts/ _practice_slot_check.py against backfill_lexemes.py''s actual iter_specs()
    output -- clean, no zero-candidate slots, no under-3 multiple_choice/matching_pairs slots (change_word/rate_word correctly
    have only 2 candidates each and are never used for multiple_choice here, only matching_pairs/translation). compile_content.py
    practice-validate clean (0 errors/0 warnings). Needs the standard fresh-context review before import.


    REAUTH PASS 2026-07-24 (unit-scope DEAD-template fix, PACK-ONLY): scripts/_practice_unit_scope_check.py found this to
    be the worst pack in the batch -- 6 DEAD + 5 below-floor. Root cause, confirmed via iter_specs(): every one of این unit''s
    narrow "additive" pairs is really only 1 native member plus 1 member borrowed from an EARLIER unit -- به/دارید/تومن (exchange_word)
    are unit01/unit01/unit03; بفرمایید (change_word) is unit01; هر (rate_word) is unit11. Same defect, worse: the two fill_in_blank
    "volume_fill" templates constrain number_word to volume_en_fa_a1_unit21_number_word_{07,09}_single, but VOLUME_PRACTICE_SINGLETON_TAGS
    in backfill_lexemes.py pins both tags to ده ("ten"), which is anchored to unit03/unit09 lexemes, NOT unit21 -- 0 unit-scoped
    candidates, genuinely un-fixable from the pack side (would need a NEW singleton tag pinned to unit21''s own صد ("hundred",
    lesson06) added to backfill_lexemes.py, which this pass is not permitted to touch). DROPPED both (rate_amount_order.003.volume_fill.007,
    dollar_amount_order.004.volume_fill.009) and LOG this backfill gap for the coordinator -- unit21''s own word_order templates
    (dollar_amount_order.004, rate_amount_order.003) already cover the same {number} دلار / هر دلار {number} تومنه frames using
    the course-wide "number" tag (no floor for word_order), so structured-tier coverage for this material is not lost.


    Fix for every matching_pairs/multiple_choice DEAD or below-floor: added one new shared slot preset "unit21_wide_word"
    unioning this unit''s own already-declared money_word + exchange_word + atm_word + change_word + rate_word + number tags
    (all reused verbatim, no new backfill tags) -- unit-scoped pool is 10 distinct words (پول/بانک/دلار/تبدیل/چقدر/خودپرداز/بردارم/خرد/نرخ/صد).
    Re-anchored money_match.002, exchange_match.002, atm_match.002, change_match.001, rate_match.001, and money_match.002.volume_match.010
    to it at 6 slots each; re-anchored exchange_choice.001 and atm_choice.001 to it too (both now have a real 10-value pool,
    well clear of the 3-distinct floor). unit_review_match.001 converted from its old 3-group (mw/ew/aw) design -- which was
    ACTUALLY dead in two of its three groups even though the checker''s first-slot-only heuristic only flagged one -- to a
    single flat 8-of-10 pool over the same wide preset, since 4+4+3=11 needed distinct values against a real unit-scoped universe
    of only 10 was mathematically unsatisfiable regardless of how the groups were split. No mis-glossed lexemes found in this
    unit''s pool. Verified: 0 DEAD, 0 below-floor for this pack per the unit-scope checker; practice-validate 0 errors (see
    coordinator report for the exact invocation covering all 5 units in this batch).'
tag_schema:
  part_of_speech:
  - noun
  - verb
  - preposition
  - pronoun
  - adjective
  agreement_tags:
    semantic:
    - money_word
    - exchange_word
    - atm_word
    - change_word
    - rate_word
    - number
    - volume_en_fa_a1_unit21_number_word_07_single
    - volume_en_fa_a1_unit21_number_word_09_single
slot_presets:
  money_word: &id001
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic: money_word
  exchange_word: &id003
    language_code: fa
    part_of_speech:
    - preposition
    - noun
    - pronoun
    - verb
    agreement_tags:
      semantic: exchange_word
  atm_word: &id004
    language_code: fa
    part_of_speech:
    - noun
    - preposition
    - verb
    agreement_tags:
      semantic: atm_word
  change_word: &id005
    language_code: fa
    part_of_speech:
    - adjective
    - verb
    agreement_tags:
      semantic: change_word
  rate_word: &id006
    language_code: fa
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: rate_word
  number_word: &id002
    language_code: fa
    part_of_speech: adjective
    agreement_tags:
      semantic: number
  unit21_wide_word: &id008
    language_code: fa
    part_of_speech:
    - noun
    - pronoun
    - verb
    - adjective
    agreement_tags:
      semantic: [money_word, exchange_word, atm_word, change_word, rate_word, number]
templates:
- content_key: practice.en-fa.fa.a1.unit21.lesson01.money_choice.001
  lesson_content_key: fa.a1.unit21.lesson01.money_vocabulary
  type: multiple_choice
  frame:
    text: '{money_word}'
    language_code: fa
    direction: rtl
  slots:
    money_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: money_word
  feedback_frame:
    text: '{money_word} is money/banking vocabulary from this lesson.'
    language_code: en
    direction: ltr
- content_key: practice.en-fa.fa.a1.unit21.lesson01.money_match.002
  lesson_content_key: fa.a1.unit21.lesson01.money_vocabulary
