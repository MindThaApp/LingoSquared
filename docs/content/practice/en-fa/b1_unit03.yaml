      language_code: fa
      part_of_speech:
      - particle
      - verb
      - noun
      - adjective
      - adverb
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
    language_code: en
    direction: ltr
