schema_version: '1.0'
pack_key: practice.en-fa.a2.unit31
source_language: en
target_language: fa
unit_content_key: fa.a2.unit31.polite_requests
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 27-31 pass): 1 fix - lesson06 sentence.005 and sentence.008 (Let me carry your bag.) accepted only بذارید من کیفتون رو ببرم; the lesson overlay teaches dropping من after بذارید as natural, and the grader only folds a clause-initial pronoun, so both now also accept بذارید کیفتون رو ببرم. Dumped every slot pool at unit and course scope and read every gloss. ROUTING: the backfill glosses کمکتون as "your help (polite/plural, spoken)", but the unit teaches it only as the object in بذارید من کمکتون کنم (help you); the unit28 sibling کمکت is glossed "help you (spoken)"; it is shown as the answer in the lesson02 MC and translation pools and the noun matching pairs. Sentence anchors (دست, کیفتون, ببرم) have one course-wide candidate; no self-reference. Capacity: 23 live templates, no dead or under-floor template, every tier hosts 28/40 lexemes (70%) and 5/6 lessons (lesson05 has only its reading phrase lexeme). NATIVE FLAGS: none new. Authored 2026-11-15 for en-fa A2 unit 31 (polite requests and offers). Mirrors PR #242 (units 22-26): the backfill emits only unit and lesson tags (en_fa_a2_unit31_words, en_fa_a2_unit31_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two both fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). English source_gloss lexemes and phrase lexemes (word lists and dialogue lines) are not drilled. Spoken Tehrani register; no native review yet (the owner approved unreviewed). NATIVE QUESTIONS: (1) Is بذارید من کیفتون رو ببرم the natural polite offer (vs بذارید کیفتون رو ببرم)? Recommended: both fine, keep as taught. (2) Is به کیفم دست نزنید natural? Recommended: yes.'
