schema_version: '1.0'
pack_key: practice.en-fa.a2.unit37
source_language: en
target_language: fa
unit_content_key: fa.a2.unit37.if_conditions
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 37-41 pass; 1 fix): every slot pool dumped at unit and course scope with the .a2.unit37. filter and every gloss read; sentence frames all use single-candidate anchors (1 course-scope candidate each, grammatical, no self-reference). (1) lesson03.sentence.005 accepted only اگه تو نیای، من تنها می‌رم; the unit teaches اگه نیای، من تنها می‌رم (grammar note) and the grader does not fold a pronoun after اگه, so that form is now an accepted_variant. Capacity: 30 templates (R6/S13/P11), 22/33 lexemes hosted (67%) in every tier, 5/6 lessons (lesson06 has only a phrase-list lexeme), no dead templates, MC pools 3-22 distinct glosses, matching pools 14 and 22. Backfill gloss to route: عوضش carries replacing it, while the unit uses it only in عوضش می‌کنیم (we will exchange it). NATIVE FLAGS: lesson03 order.006/sentence.008 and order.009/sentence.011 render the same sentence twice (different target lexeme); harmless but repetitive. Authored 2026-11-15 for en-fa A2 unit 37 (if conditions). Mirrors PR #242 (units 22-26): the backfill emits only unit and lesson tags (en_fa_a2_unit37_words, en_fa_a2_unit37_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two both fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). English source_gloss lexemes and phrase lexemes (word lists and dialogue lines) are not drilled. Spoken Tehrani register; no native review yet (the owner approved unreviewed). NATIVE QUESTIONS: (1) Is اگه هوا خوب باشه، می‌ریم بیرون natural? Recommended: yes. (2) Is وقتی کارم تموم بشه، بهت زنگ می‌زنم natural? Recommended: yes.'
