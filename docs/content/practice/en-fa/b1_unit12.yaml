schema_version: '1.0'
pack_key: practice.en-fa.b1.unit12
source_language: en
target_language: fa
unit_content_key: fa.b1.unit12.real_conditions
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    23 distinct fa lexemes across 6 lessons with lexemes (if_it_rains, if_you_have_time, if_not, dialogue_plan_b,
    reading_plan, wrapup_production). matching_pairs anchored to dialogue_plan_b (8 pairs), pooled over
    the unit-wide non-proper-noun distinct tokens (23 available). Template mix: recognition(multiple_choice)=6,
    structured(matching_pairs x2, word_order x1)=3, production(translation)=6, total=15. No listen_select authored (fa has
    no TTS configured -- AZURE_SPEECH_KEY unset -- _material() deletes such templates). No mis-glossed
    lexemes found in this pool (every gloss checked against what the unit realization teaches).
    Polish 2026-07-25: match.003 slots switched from bare-POS to the unit's plan_b_word tag (13 unit
    tokens, no course-scope extras) so Endless Practice stays on-theme; added a conditional-verb-form
    matching (conditional_verb_word + conditional_imperative_word, 7 tokens) and a word_order on the
    realization's hero sentence (age baroon biad, barnaame ro avaz mikonim) anchored by plan_core_word
    (unit candidate barnaame; course extras barnaame/sinamaa both grammatical in the frame).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - plan_b_word
    - plan_core_word
    - conditional_verb_word
    - conditional_imperative_word
templates:
- content_key: practice.en-fa.fa.b1.unit12.lesson01.choose.001
  lesson_content_key: fa.b1.unit12.lesson01.if_it_rains
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word introduced in this unit.'
    language_code: en
    direction: ltr
