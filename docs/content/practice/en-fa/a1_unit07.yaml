schema_version: "1.0"
pack_key: practice.en-fa.a1.unit07
source_language: en
target_language: fa
unit_content_key: fa.a1.unit07.weather
review:
  status: reviewed
  fresh_context: true
  notes: >-
    Authored 2026-07-06 by the practice-pool-sync lane (fa/prs bundle),
    part of the same pass as a1_unit06.yaml/a1_unit08.yaml/a2_unit09.yaml/
    a2_unit10.yaml -- see a1_unit06.yaml's notes for the shared
    backfill_lexemes.py extension this pass made.

    Three semantic groups, all verified >=3-distinct-candidate via a
    standalone slot-matching check before authoring: "weather_condition"
    (آفتابی/بارونی/ابری/برفی, 4 members, anchored lesson01),
    "temperature_word" (گرم/سرد/خنک, 3 members, anchored lesson02), and
    "weather_state_verb" (the colloquial -e contraction forms آفتابیه/
    سرده/بارونیه/گرمه, 4 members, anchored lesson04 -- part_of_speech verb,
    not adjective, matching how the realization/overlay's own review
    notes classify these as spoken copula contractions).

    Left out, matching established precedent: lesson05's چون-plus-
    suggestion pattern (بهتره چتر ببریم / چون سرده بهتره کت بپوشیم) and
    lesson06's full dialogue -- these are multi-clause register/reasoning
    phrases, not a natural bare-word recognition set, and would need a
    genuine generative sentence frame rather than a shared tag (the same
    judgment call a1_unit05's own notes made for its colloquial "است"-
    contraction phrases).

    Lesson-anchor check per tonight's found-and-fixed fa-en unit08 bug:
    lesson01, lesson02, and lesson04 all genuinely introduce new
    vocabulary (confirmed by reading the realization file directly) --
    safe anchors, none are review-only.

    Verified with scripts/_practice_slot_check.py's lexeme_matches()/
    check_pack() logic against backfill_lexemes.py's actual iter_specs()
    output (ad hoc harness, not committed) -- clean, no zero-candidate
    slots, no under-3 multiple_choice/matching_pairs slots.
    compile_content.py practice-validate also clean (0 errors/0
    warnings) for the full en-fa pack (units 01-07 together). Needs the
    standard fresh-context review before import. Same standing blocker as
    every pack in this bundle: no backfill_lexemes.py run has actually
    happened against a real database yet in this pass.

    DEPTH PASS, added 2026-07-06 (practice-pool-sync lane, closing the
    units 06-10 template-density audit gap -- this unit went 9->15).
    Added "weather_time_word" (امروز/فردا, 2 members, matching/
    translation only, same below-multiple_choice-threshold class as this
    pack's own weather_state_verb-adjacent narrow pairs) to
    scripts/backfill_lexemes.py's fa_agreement_tags(), anchored at
    lesson03 where both are taught as vocabulary. New generative
    fill_in_blank/word_order pair: "{weather_time_word} {weather_state_verb}."
    mirrors this unit's own real taught sentences exactly (lesson04's
    "امروز سرده"/"امروز بارونیه" pattern), verified grammatical for
    every one of the 2x4 combinations by reading the lesson04 teaching
    cards directly. Also added two "X یا X" word_order templates
    (weather_condition, temperature_word) directly mirroring this unit's
    own realization exercises (lesson01.exercise05's "آفتابی یا بارونی"
    and lesson02.exercise05's "گرم یا سرد" -- یا is the correct connector
    here, not و, since only one weather/temperature state is true at a
    time). Re-verified with scripts/_practice_slot_check.py (weather_
    time_word=2 real candidates, others unchanged) and compile_content.py
    practice-validate (0 errors/0 warnings, full en-fa pack). review.status
    left unreviewed -- this pass does not self-certify review.

    REAUTH PASS 2026-07-24 (fix DEAD templates at checkpoint/unit scope --
    scripts/_practice_unit_scope_check.py). This is the textbook DO-NOT #2
    defect: weather_time_word's real course-wide members are امروز
    (a1_unit06.lesson03) and فردا (a1_unit03.lesson06) -- BOTH from EARLIER
    units, not this one. Confirmed by direct iter_specs() query: 0 (zero)
    lexemes in this unit carry weather_time_word. The DEPTH PASS notes above
    were wrong to call it "2 members ... anchored at lesson03" -- that
    count was taken at whole-direction scope, not unit scope, and
    generate_checkpoint() only sees this unit's own lessons.
    weather_time_match.004/weather_time_translate.005/weather_forecast_
    order.007 were all DEAD as a result. Fix, per lesson:
    - lesson03 (asking_about_weather) has exactly ONE native lexeme, هوا
      (weather, noun, tagged dialogue_word). RE-ANCHORED
      weather_time_match.004 and weather_time_translate.005 away from
      weather_time_word onto a new dialogue_noun preset
      (part_of_speech: noun, semantic: dialogue_word, native to this unit)
      -- 5 distinct unit-scoped nouns (هوا/چتر/کت/فکر/پارک, from
      lessons03/05/06). Renamed both content_keys to dialogue_word_match/
      dialogue_word_translate.005 since they're no longer weather-time-
      specific; below the 6-pair matching floor (5, honestly the ceiling --
      no 6th native noun exists in this unit) but no longer DEAD.
    - weather_forecast_order.007 (word_order) dropped the missing
      weather_time_word slot entirely and now pairs unit07's own lesson03
      noun هوا (hardcoded literal frame text, not a slot) with the fully
      native weather_state_verb slot (lesson04, 4 members, unchanged) --
      "هوا {weather_state_verb}" renders as "هوا آفتابیه" / "هوا سرده" /
      "هوا بارونیه" / "هوا گرمه", all four grammatical at both unit and
      full a1-course scope (weather_state_verb has no members outside this
      unit, so unit scope == course scope for this tag).
    Re-verified 0 DEAD for this file via scripts/_practice_unit_scope_check.py
    and 0 errors via compile_content.py practice-validate. No backfill/
    realization/overlay edits made. weather_match.002 (4<6), temperature_
    match.002 (3<6), weather_state_match.002 (4<6) are left as honestly-thin
    -- each tag's real course-wide ceiling in this unit IS its unit-scoped
    count (weather_condition/temperature_word/weather_state_verb none have
    members outside a1_unit07), so reaching 6 would require merging two of
    these three otherwise-distinct categories into one matching exercise,
    which would just produce a redundant near-duplicate at the same lesson
    anchor rather than new coverage.
tag_schema:
  part_of_speech: [adjective, verb, adverb, noun]
  agreement_tags:
    semantic: [weather_condition, temperature_word, weather_state_verb, dialogue_word]
slot_presets:
  weather_condition: &weather_condition {language_code: fa, part_of_speech: adjective, agreement_tags: {semantic: weather_condition}}
  temperature_word: &temperature_word {language_code: fa, part_of_speech: adjective, agreement_tags: {semantic: temperature_word}}
  weather_state_verb: &weather_state_verb {language_code: fa, part_of_speech: verb, agreement_tags: {semantic: weather_state_verb}}
  dialogue_noun: &dialogue_noun {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: dialogue_word}}
templates:
  - content_key: practice.en-fa.fa.a1.unit07.lesson01.weather_choice.001
    lesson_content_key: fa.a1.unit07.lesson01.weather_conditions
    type: multiple_choice
    frame: {text: "{weather_condition}", language_code: fa, direction: rtl}
    slots: {weather_condition: *weather_condition}
    answer_derivation: {kind: slot_gloss, slot: weather_condition}
    feedback_frame: {text: "{weather_condition} is a weather word from this lesson.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson01.weather_match.002
    lesson_content_key: fa.a1.unit07.lesson01.weather_conditions
    type: matching_pairs
    frame: {text: "Match each weather word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *weather_condition, second: *weather_condition, third: *weather_condition, fourth: *weather_condition}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "Match each weather word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson01.weather_translate.003
    lesson_content_key: fa.a1.unit07.lesson01.weather_conditions
    type: translation
    frame: {text: "{weather_condition}", language_code: en, direction: ltr, slot_rendering: {weather_condition: english_gloss}}
    slots: {weather_condition: *weather_condition}
    answer_derivation: {kind: slot_text, slot: weather_condition}
    feedback_frame: {text: "The Farsi word is {weather_condition}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson02.temperature_choice.001
    lesson_content_key: fa.a1.unit07.lesson02.temperature_words
    type: multiple_choice
    frame: {text: "{temperature_word}", language_code: fa, direction: rtl}
    slots: {temperature_word: *temperature_word}
    answer_derivation: {kind: slot_gloss, slot: temperature_word}
    feedback_frame: {text: "{temperature_word} describes temperature.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson02.temperature_match.002
    lesson_content_key: fa.a1.unit07.lesson02.temperature_words
    type: matching_pairs
    frame: {text: "Match each temperature word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *temperature_word, second: *temperature_word, third: *temperature_word}
    slot_relations: [{kind: distinct, slots: [first, second, third]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third]}
    feedback_frame: {text: "Match each temperature word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson02.temperature_translate.003
    lesson_content_key: fa.a1.unit07.lesson02.temperature_words
    type: translation
    frame: {text: "{temperature_word}", language_code: en, direction: ltr, slot_rendering: {temperature_word: english_gloss}}
    slots: {temperature_word: *temperature_word}
    answer_derivation: {kind: slot_text, slot: temperature_word}
    feedback_frame: {text: "The Farsi word is {temperature_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson04.weather_state_choice.001
    lesson_content_key: fa.a1.unit07.lesson04.describing_todays_weather
    type: multiple_choice
    frame: {text: "{weather_state_verb}", language_code: fa, direction: rtl}
    slots: {weather_state_verb: *weather_state_verb}
    answer_derivation: {kind: slot_gloss, slot: weather_state_verb}
    feedback_frame: {text: "{weather_state_verb} is the colloquial -e contraction for describing today's weather.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson04.weather_state_match.002
    lesson_content_key: fa.a1.unit07.lesson04.describing_todays_weather
    type: matching_pairs
    frame: {text: "Match each weather-state phrase with its meaning.", language_code: en, direction: ltr}
    slots: {first: *weather_state_verb, second: *weather_state_verb, third: *weather_state_verb, fourth: *weather_state_verb}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "Match each weather-state phrase to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson04.weather_state_translate.003
    lesson_content_key: fa.a1.unit07.lesson04.describing_todays_weather
    type: translation
    frame: {text: "{weather_state_verb}", language_code: en, direction: ltr, slot_rendering: {weather_state_verb: english_gloss}}
    slots: {weather_state_verb: *weather_state_verb}
    answer_derivation: {kind: slot_text, slot: weather_state_verb}
    feedback_frame: {text: "The Farsi phrase is {weather_state_verb}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson03.dialogue_word_match.004
    lesson_content_key: fa.a1.unit07.lesson03.asking_about_weather
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *dialogue_noun, second: *dialogue_noun, third: *dialogue_noun, fourth: *dialogue_noun, fifth: *dialogue_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson03.dialogue_word_translate.005
    lesson_content_key: fa.a1.unit07.lesson03.asking_about_weather
    type: translation
    frame: {text: "{dialogue_noun}", language_code: en, direction: ltr, slot_rendering: {dialogue_noun: english_gloss}}
    slots: {dialogue_noun: *dialogue_noun}
    answer_derivation: {kind: slot_text, slot: dialogue_noun}
    feedback_frame: {text: "The Farsi word is {dialogue_noun}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson04.weather_forecast_order.007
    lesson_content_key: fa.a1.unit07.lesson04.describing_todays_weather
    type: word_order
    frame: {text: "هوا {weather_state_verb}", language_code: fa, direction: rtl}
    slots: {weather_state_verb: *weather_state_verb}
    answer_derivation: {kind: render_frame, frame: {text: "هوا {weather_state_verb}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "هوا (the weather) is the subject; the weather-state verb comes after it.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson01.weather_condition_order.008
    lesson_content_key: fa.a1.unit07.lesson01.weather_conditions
    type: word_order
    frame: {text: "{weather_condition_one} یا {weather_condition_two}", language_code: fa, direction: rtl}
    slots: {weather_condition_one: *weather_condition, weather_condition_two: *weather_condition}
    slot_relations: [{kind: distinct, slots: [weather_condition_one, weather_condition_two]}]
    answer_derivation: {kind: render_frame, frame: {text: "{weather_condition_one} یا {weather_condition_two}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "یا offers an either/or choice, like آفتابی یا بارونی.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit07.lesson02.temperature_word_order.009
    lesson_content_key: fa.a1.unit07.lesson02.temperature_words
    type: word_order
    frame: {text: "{temperature_word_one} یا {temperature_word_two}", language_code: fa, direction: rtl}
    slots: {temperature_word_one: *temperature_word, temperature_word_two: *temperature_word}
    slot_relations: [{kind: distinct, slots: [temperature_word_one, temperature_word_two]}]
    answer_derivation: {kind: render_frame, frame: {text: "{temperature_word_one} یا {temperature_word_two}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "یا offers an either/or choice, like گرم یا سرد.", language_code: en, direction: ltr}
