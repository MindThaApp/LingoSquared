schema_version: '1.0'
pack_key: practice.en-fa.a1.unit48
source_language: en
target_language: fa
unit_content_key: fa.a1.unit48.laundry

review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 2 fixes). (1) All four choose.001
    unioned reviewed_phrase + person_name (course-wide, ~398 A1 phrases/names in Endless Practice
    under 'laundry vocabulary from this unit'): replaced with en_fa_a1_unit48_words (unit pool
    unchanged at 5). (2) The shared matching_pairs anchor dropped reviewed_phrase (course-wide
    phrases) for en_fa_a1_unit48_words; person_name + proper_noun stay because کاظمی is needed for
    the 6-pair floor (unit has 5 other tokens), so Endless still mixes in other A1 surnames. NATIVE
    FLAGS: none. Gloss lane: none.

    THIN UNIT -- flagging per recipe §3 "capacity, don't pad". Laundry has
    only 6 distinct fa lexemes/phrases total per backfill_lexemes_en_fa
    across all 4 lessons: laundry_word 2 (خشکشویی "dry cleaner's/laundry
    shop" noun, فوری "express/urgent" adjective), laundry_question_phrase 2
    (فردا ظهر خوبه؟ "Is tomorrow noon good?", کِی می‌گیرم؟ "When do I pick it
    up?"), 1 person_name (کاظمی), 1 additional reviewed_phrase (خانم کاظمی
    "Ms. Kazemi"). Union of all 4 tags gives EXACTLY 6 distinct tokens --
    clears the matching_pairs 6-pair floor with zero slack (every pool member
    is used in every matching_pairs instance). 12 templates: 4 lessons x
    (multiple_choice + bare-word translation, both over the full 6-token
    union), 3 matching_pairs over the same 6-token union anchored to
    lessons01/02/04, plus 1 extra bare-word translation over the narrower
    laundry_word pair anchored lesson01 to clear the 12-template floor.
    word_order skipped: laundry_word's 2 members (a place noun, an adjective)
    have no shared grammatical carrier frame, and laundry_question_phrase is
    two full fixed questions, unsuitable for a slot inside another frame. No
    mis-glossed lexemes found. No listen_select (Azure TTS key unset for fa).
    REAUTH FIX 2026-07-24: the "EXACTLY 6 distinct tokens" claim above was
    wrong -- the matching_pairs pool's part_of_speech: [noun, adjective,
    phrase] silently excluded کاظمی (person_name, proper_noun), leaving only
    5 unit-scoped distinct fills for a 6-slot template -- DEAD at checkpoint
    scope in all 3 matching_pairs instances (lesson01/02/04, shared via the
    &laundry_pool anchor) per _practice_unit_scope_check.py. Added
    proper_noun to the shared anchor's part_of_speech (کاظمی's gloss "Kazemi
    (surname)" is a transliteration, not a same-script self-gloss, so it is
    safe in a matching_pairs pool even though proper_noun stays excluded
    from this pack's MC/translation slots). Pool is now exactly 6, still at
    zero slack.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - laundry_word
    - laundry_question_phrase
    - person_name
    - en_fa_a1_unit48_words

templates:
# --- lesson01 (new_laundry_one) ---
- content_key: practice.en-fa.fa.a1.unit48.lesson01.choose.001
  lesson_content_key: fa.a1.unit48.lesson01.new_laundry_one
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, adjective, phrase]
      agreement_tags:
        semantic: [laundry_word, laundry_question_phrase, en_fa_a1_unit48_words]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is laundry vocabulary from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit48.lesson01.translate.002
  lesson_content_key: fa.a1.unit48.lesson01.new_laundry_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, adjective, phrase]
      agreement_tags:
        semantic: [laundry_word, laundry_question_phrase, person_name]
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Farsi word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit48.lesson01.match.003
  lesson_content_key: fa.a1.unit48.lesson01.new_laundry_one
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fa
    direction: rtl
  slots:
    first: &laundry_pool
      language_code: fa
      part_of_speech: [noun, adjective, phrase, proper_noun]
      agreement_tags:
        semantic: [laundry_word, laundry_question_phrase, person_name, en_fa_a1_unit48_words]
    second: *laundry_pool
    third: *laundry_pool
    fourth: *laundry_pool
    fifth: *laundry_pool
    sixth: *laundry_pool
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each Farsi word with its English meaning.
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit48.lesson01.translate.004
  lesson_content_key: fa.a1.unit48.lesson01.new_laundry_one
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: [noun, adjective]
      agreement_tags:
        semantic: laundry_word
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Farsi word is {item}.
    language_code: en
    direction: ltr

