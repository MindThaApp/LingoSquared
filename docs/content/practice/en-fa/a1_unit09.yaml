  - content_key: practice.en-fa.fa.a1.unit09.lesson06.unit_review_match.013
    lesson_content_key: fa.a1.unit09.lesson06.meeting_time_dialogue
    type: matching_pairs
    frame: {text: "Match each word with its meaning -- a review of this whole unit's time vocabulary.", language_code: en, direction: ltr}
    slots:
      tu1: *time_unit_word
      tu2: *time_unit_word
      tu3: *time_unit_word
      tu4: *time_unit_word
      dp1: *day_part_word
      dp2: *day_part_word
      dp3: *day_part_word
      dp4: *day_part_word
    slot_relations:
      - {kind: distinct, slots: [tu1, tu2, tu3, tu4]}
      - {kind: distinct, slots: [dp1, dp2, dp3, dp4]}
    answer_derivation: {kind: matching_pairs, slots: [tu1, tu2, tu3, tu4, dp1, dp2, dp3, dp4]}
    feedback_frame: {text: "This reviews both the basic time words and the parts of the day taught in this unit.", language_code: en, direction: ltr}
