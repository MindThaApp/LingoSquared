schema_version: "1.0"
pack_key: practice.en-fa.a1.unit09
source_language: en
target_language: fa
unit_content_key: fa.a1.unit09.time
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 7 fixes). (1)
    time_unit_match.002 had 6 slots over a 6-word unit pool: now unit lesson-tag nouns +
    day_part_word (9 unit). (2) time_unit_word_order.004 rendered "نیم و ربع" / "دقیقه و
    ساعت" (meaningless): now ساعت سه و نیمه via the single lesson03 verb anchor;
    lesson_content_key moved to lesson03. (3) day_part_choice.005 feedback claimed "from
    this unit" but the course pool adds صبح/عصر/شب from other units: reworded. (4)
    day_part_match.006 6 = 6: now nouns+adverbs (12). (5) day_part_word_order.008
    rendered "قرار و ربع" etc.: now من ظهر میام via the lesson04 noun anchor. (6)
    time_phrase_match.011: bare dialogue_word pooled 171 A1 phrases/words: now
    time_phrase + lesson06 unit tag (18). (7) unit_review_match.013: same leak (175):
    now time_phrase + unit lesson tags (21); frame text cleaned. NATIVE FLAGS: من ظهر
    میام is composed from taught words (not a taught sentence) - confirm natural.

    Authored 2026-07-07, closing the practice-content gap for A1 units
    09-11 (Time/Dates/Routines, authored the same night, previously with
    zero Endless Practice coverage). Extended scripts/backfill_lexemes.py's
    UNIT_FILES to include units 09-11 (previously only 01-08 plus the
    separately-numbered A2 units 09-10) and added the matching FA_GLOSSES/
    classification-set/agreement-tag entries for every token these three
    units' realizations introduce.

    Four semantic groups for this unit, all verified against the real
    iter_specs() output before authoring: "time_unit_word" (ساعت/دقیقه/
    نیم/ربع, 4 members, anchored lesson01), "day_part_word" (صبح/ظهر/عصر/
    شب, 4 members, anchored lesson04 -- deliberately a NEW tag rather than
    widening the existing "time_period" tag a1_unit01.yaml's own pack
    already uses for a greeting-phrase pool that includes روز; pooling
    روز here or adding ظهر there would risk an odd combination), and
    "appointment_word" (قرار, 1 member, translation-only, same below-
    multiple_choice-threshold class as other units' narrow single-word
    tags). "time_phrase" pools this unit's own genuine taught full-
    question/full-statement phrases (auto-derived by iter_specs() from
    this unit's own multi-token teaching cards: ساعت چنده؟ / ساعت سه و
    نیمه / قرار ساعت چنده؟ / ساعت چهار عصر, 4 members) -- kept as an
    explicit allow-list in fa_agreement_tags() rather than a lesson_key-
    prefix+shape scope (unlike the A2 bureaucracy_phrase/opinion_phrase
    precedent), because this unit's two grammar_note cards (the -e
    contraction explanations) would otherwise also auto-derive as
    "phrases" with an awkward parenthetical/mixed-script gloss not fit
    for a clean practice item.

    Verified with scripts/_practice_slot_check.py's lexeme_matches()/
    check_pack() logic against the real (updated) iter_specs() output --
    clean, no zero-candidate slots, no under-3 multiple_choice/
    matching_pairs slots (appointment_word correctly has only 1 candidate
    and is translation-only, never multiple_choice/matching_pairs, since
    _practice_slot_check.py's matching_pairs check requires >=2 distinct
    candidates per slot even when pooled alongside a different tag's
    slots in the same combined template -- an earlier draft of this pack
    tried pooling appointment_word into a combined matching_pairs
    template with time_phrase and the slot check correctly caught it;
    removed). scripts/_fill_in_blank_ambiguity_check.py: zero
    fill_in_blank templates authored in this pack at all -- every
    multi-member group here (time_unit_word, day_part_word, time_phrase)
    has >1 genuinely distinct, non-synonymous candidate with no natural
    single-slot frame that could disambiguate them (a bare "{slot}" frame
    is disallowed by AUTHORING_GUIDE.md #13 regardless), so per this
    task's own instruction, using zero fill_in_blank for this unit is the
    right call rather than authoring one that the compiler's own
    ambiguity hard-fail (#17) would reject anyway. compile_content.py
    practice-validate clean (0 errors/0 warnings) for the full en-fa pack
    including this new file. Needs the standard fresh-context review
    before import.

    REAUTH 2026-07-24 (unit-scope DEAD fix, pack-only): scripts/
    _practice_unit_scope_check.py found this pack's "day_part_word" tag
    carries only 1 real unit-scoped lexeme (ظهر), not the 4 (صبح/ظهر/عصر/
    شب) this file's own authoring notes above claimed -- صبح/عصر never
    got their own day_part_word-tagged lexeme entries in
    backfill_lexemes.py (they only appear inside lesson06's
    dialogue_word-tagged sentence phrases), and شب does not appear in
    this unit's real iter_specs() output at all. That made
    lesson04.day_part_match.006 DEAD (needed 4 distinct fills, pool had
    1) and lesson04.day_part_choice.005 below the 3-option floor (1
    distinct), and silently made lesson04.day_part_word_order.008
    unfillable too (its two slots require distinct=true over the same
    1-member pool -- fill_slots()'s backtracking can never satisfy that,
    though the scope-check tool does not itself flag word_order this
    way). PACK-ONLY fix per the recipe SS3.1a/SS8.1 pattern: added a
    `unit_noun_review` union preset (time_unit_word + day_part_word +
    appointment_word = 6 real distinct unit-scoped nouns: ساعت/دقیقه/
    نیم/ربع/ظهر/قرار) and re-anchored the three lesson04 templates to it
    (lesson_content_key unchanged, only the slot widened), bumping
    day_part_match.006 from 4 to 6 declared pairs to match the floor.
    Also widened the two other below-floor matching_pairs: lesson01.
    time_unit_match.002 (was time_unit_word alone, 4 pairs) now uses the
    same unit_noun_review preset at 6 pairs; lesson06.time_phrase_match.
    011 (was time_phrase alone, 4 pairs) now unions time_phrase with this
    unit's own dialogue_word-tagged nouns (سر/کار/مشکلی, all from
    lesson06's own dialogue) via a new `lesson06_review_word` preset (10
    distinct), at 6 pairs. lesson06.unit_review_match.013 was rebuilt
    from its old two broken 4-slot distinct sub-groups (tu1-4 fine, but
    dp1-4 was 0-candidate-safe yet still infeasible for the same
    distinct-vs-1-member reason as 008) into one clean 6-slot distinct
    group over a new full-unit `unit_review_word` preset (13 distinct:
    all 5 of this unit's semantic tags unioned). Checked every new pool
    by hand for confusable/duplicate english_gloss values -- none found
    (13 distinct tokens, 13 distinct glosses). word_order frames ("{a} و
    {b}") stay syntactically safe under the widened pool: و is a plain
    noun-conjunction, and all 5 semantic tags used here are unit09-
    exclusive (grepped scripts/backfill_lexemes.py -- none reused by any
    other unit), so course scope == unit scope for this pack and no
    Endless-Practice-only grammaticality risk was introduced.
    BACKFILL GAP TO LOG (not fixed here, pack-only): day_part_word should
    really carry صبح ("morning") and عصر ("afternoon/evening") as their
    own standalone lexemes (they are taught and used in lesson06's
    dialogue) -- coordinator should route a backfill_lexemes.py extension
    for those two tokens; شب ("night") is not taught anywhere in this
    unit's realization at all, so it should not be added as day_part_word
    without a teaching card to back it.
    After fix: scripts/_practice_unit_scope_check.py reports 0 DEAD, 0
    below-floor for this pack. All three tiers still clear >=3 templates
    (recognition 3, structured 6, production 4), 13 templates total,
    unchanged from before the fix.
tag_schema:
  part_of_speech: [noun, phrase, adverb, verb]
  agreement_tags:
    semantic: [time_unit_word, day_part_word, appointment_word, time_phrase, dialogue_word,
      en_fa_a1_unit09_lesson01_words, en_fa_a1_unit09_lesson03_words, en_fa_a1_unit09_lesson04_words,
      en_fa_a1_unit09_lesson05_words, en_fa_a1_unit09_lesson06_words]
slot_presets:
  time_unit_word: &time_unit_word {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: time_unit_word}}
  day_part_word: &day_part_word {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: day_part_word}}
  appointment_word: &appointment_word {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: appointment_word}}
  time_phrase: &time_phrase {language_code: fa, part_of_speech: phrase, agreement_tags: {semantic: time_phrase}}
  # REAUTH 2026-07-24: day_part_word only has 1 real unit-scoped lexeme (ظهر) --
  # صبح/عصر/شب never got their own day_part_word-tagged lexeme entries (backfill
  # gap, logged below). Union with the unit's other two narrow noun tags gives a
  # real 6-member unit-scoped pool per SS3.1a/SS8.1 -- used to re-anchor the
  # previously-DEAD/below-floor day-part templates while keeping their
  # lesson_content_key anchors unchanged.
  unit_noun_review: &unit_noun_review {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: [time_unit_word, day_part_word, appointment_word]}}
  # time_phrase alone is only 4 -- union with this unit's own dialogue_word nouns
  # (all from lesson06's dialogue) reaches 10, clearing the 6-pair floor.
  lesson06_review_word: &lesson06_review_word {language_code: fa, part_of_speech: [noun, phrase], agreement_tags: {semantic: [time_phrase, dialogue_word]}}
  # Full-unit union (13 distinct) for the unit-wide review card.
  unit_review_word: &unit_review_word {language_code: fa, part_of_speech: [noun, phrase], agreement_tags: {semantic: [time_unit_word, day_part_word, appointment_word, dialogue_word, time_phrase]}}
  # Review 2026-10-22: unit-lesson-tag unions (the bare dialogue_word tag pooled
  # 150+ phrases/clitic forms from other units in Endless Practice).
  unit_noun_wide: &unit_noun_wide {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: [day_part_word, en_fa_a1_unit09_lesson01_words, en_fa_a1_unit09_lesson04_words, en_fa_a1_unit09_lesson05_words, en_fa_a1_unit09_lesson06_words]}}
  unit_noun_adverb: &unit_noun_adverb {language_code: fa, part_of_speech: [noun, adverb], agreement_tags: {semantic: [day_part_word, en_fa_a1_unit09_lesson01_words, en_fa_a1_unit09_lesson04_words, en_fa_a1_unit09_lesson05_words, en_fa_a1_unit09_lesson06_words]}}
  lesson06_phrase_word: &lesson06_phrase_word {language_code: fa, part_of_speech: [noun, adverb, phrase], agreement_tags: {semantic: [time_phrase, en_fa_a1_unit09_lesson06_words]}}
  unit_phrase_word: &unit_phrase_word {language_code: fa, part_of_speech: [noun, phrase], agreement_tags: {semantic: [time_phrase, en_fa_a1_unit09_lesson01_words, en_fa_a1_unit09_lesson04_words, en_fa_a1_unit09_lesson05_words, en_fa_a1_unit09_lesson06_words]}}
  is_half_single: &is_half_single {language_code: fa, part_of_speech: verb, agreement_tags: {semantic: en_fa_a1_unit09_lesson03_words}}
  noon_single: &noon_single {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: en_fa_a1_unit09_lesson04_words}}
templates:
  - content_key: practice.en-fa.fa.a1.unit09.lesson01.time_unit_choice.001
    lesson_content_key: fa.a1.unit09.lesson01.basic_time_vocabulary
    type: multiple_choice
    frame: {text: "{time_unit_word}", language_code: fa, direction: rtl}
    slots: {time_unit_word: *time_unit_word}
    answer_derivation: {kind: slot_gloss, slot: time_unit_word}
    feedback_frame: {text: "{time_unit_word} is one of the basic time-telling words from this lesson.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit09.lesson01.time_unit_match.002
    lesson_content_key: fa.a1.unit09.lesson01.basic_time_vocabulary
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *unit_noun_wide, second: *unit_noun_wide, third: *unit_noun_wide, fourth: *unit_noun_wide, fifth: *unit_noun_wide, sixth: *unit_noun_wide}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit09.lesson01.time_unit_translate.003
    lesson_content_key: fa.a1.unit09.lesson01.basic_time_vocabulary
    type: translation
    frame: {text: "{time_unit_word}", language_code: en, direction: ltr, slot_rendering: {time_unit_word: english_gloss}}
    slots: {time_unit_word: *time_unit_word}
    answer_derivation: {kind: slot_text, slot: time_unit_word}
    feedback_frame: {text: "The Farsi word is {time_unit_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit09.lesson01.time_unit_word_order.004
    lesson_content_key: fa.a1.unit09.lesson03.telling_the_time
    type: word_order
    frame: {text: "ساعت سه و {is_half}", language_code: fa, direction: rtl}
    slots: {is_half: *is_half_single}
    answer_derivation: {kind: render_frame, frame: {text: "ساعت سه و {is_half}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "ساعت سه و نیمه means \"It's three-thirty.\" نیمه is the spoken form of نیم است (is half).", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit09.lesson04.day_part_choice.005
    lesson_content_key: fa.a1.unit09.lesson04.parts_of_the_day
    type: multiple_choice
    frame: {text: "{day_part_word}", language_code: fa, direction: rtl}
    slots: {day_part_word: *unit_noun_review}
    answer_derivation: {kind: slot_gloss, slot: day_part_word}
    feedback_frame: {text: "{day_part_word} is a word for times and appointments.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit09.lesson04.day_part_match.006
    lesson_content_key: fa.a1.unit09.lesson04.parts_of_the_day
    type: matching_pairs
    frame: {text: "Match each word with its meaning.", language_code: en, direction: ltr}
    slots: {first: *unit_noun_adverb, second: *unit_noun_adverb, third: *unit_noun_adverb, fourth: *unit_noun_adverb, fifth: *unit_noun_adverb, sixth: *unit_noun_adverb}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit09.lesson04.day_part_translate.007
    lesson_content_key: fa.a1.unit09.lesson04.parts_of_the_day
    type: translation
    frame: {text: "{day_part_word}", language_code: en, direction: ltr, slot_rendering: {day_part_word: english_gloss}}
    slots: {day_part_word: *day_part_word}
    answer_derivation: {kind: slot_text, slot: day_part_word}
    feedback_frame: {text: "The Farsi word is {day_part_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit09.lesson04.day_part_word_order.008
    lesson_content_key: fa.a1.unit09.lesson04.parts_of_the_day
    type: word_order
    frame: {text: "من {noon} میام", language_code: fa, direction: rtl}
    slots: {noon: *noon_single}
    answer_derivation: {kind: render_frame, frame: {text: "من {noon} میام", language_code: fa, direction: rtl}}
    feedback_frame: {text: "من ظهر میام means \"I'll come at noon.\" The time word comes before the verb.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit09.lesson05.appointment_translate.009
    lesson_content_key: fa.a1.unit09.lesson05.asking_about_an_appointment
    type: translation
    frame: {text: "{appointment_word}", language_code: en, direction: ltr, slot_rendering: {appointment_word: english_gloss}}
    slots: {appointment_word: *appointment_word}
    answer_derivation: {kind: slot_text, slot: appointment_word}
    feedback_frame: {text: "The Farsi word is {appointment_word}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit09.lesson06.time_phrase_choice.010
    lesson_content_key: fa.a1.unit09.lesson06.meeting_time_dialogue
    type: multiple_choice
    frame: {text: "{time_phrase}", language_code: fa, direction: rtl}
    slots: {time_phrase: *time_phrase}
    answer_derivation: {kind: slot_gloss, slot: time_phrase}
    feedback_frame: {text: "{time_phrase} is one of this unit's key time phrases.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit09.lesson06.time_phrase_match.011
    lesson_content_key: fa.a1.unit09.lesson06.meeting_time_dialogue
    type: matching_pairs
    frame: {text: "Match each word or phrase with its meaning.", language_code: en, direction: ltr}
    slots: {first: *lesson06_phrase_word, second: *lesson06_phrase_word, third: *lesson06_phrase_word, fourth: *lesson06_phrase_word, fifth: *lesson06_phrase_word, sixth: *lesson06_phrase_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each word or phrase to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit09.lesson06.time_phrase_translate.012
    lesson_content_key: fa.a1.unit09.lesson06.meeting_time_dialogue
    type: translation
    frame: {text: "{time_phrase}", language_code: en, direction: ltr, slot_rendering: {time_phrase: english_gloss}}
    slots: {time_phrase: *time_phrase}
    answer_derivation: {kind: slot_text, slot: time_phrase}
    feedback_frame: {text: "The Farsi phrase is {time_phrase}.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit09.lesson06.unit_review_match.013
    lesson_content_key: fa.a1.unit09.lesson06.meeting_time_dialogue
    type: matching_pairs
    frame: {text: "Match each word or phrase with its meaning.", language_code: en, direction: ltr}
    slots:
      first: *unit_phrase_word
      second: *unit_phrase_word
      third: *unit_phrase_word
      fourth: *unit_phrase_word
      fifth: *unit_phrase_word
      sixth: *unit_phrase_word
    slot_relations:
      - {kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "This reviews the time words and phrases taught across this unit.", language_code: en, direction: ltr}
