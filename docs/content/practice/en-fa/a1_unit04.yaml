schema_version: "1.0"
pack_key: practice.en-fa.a1.unit04
source_language: en
target_language: fa
unit_content_key: fa.a1.unit04.family
review:
  status: unreviewed
  required_next_reviewer: codex
  notes: >-
    Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-05,
    same gap/methodology as this pair's a1_unit03.yaml (see that file's
    review notes for the general finding: scripts/backfill_lexemes.py
    already covers fa units 1-4, but no practice templates existed past
    unit02). Slot presets matched directly against
    backfill_lexemes.py's fa_agreement_tags()/fa_part_of_speech() source.

    Kept "kinship_term" (17 candidates, plenty for multiple_choice) as a
    single broad noun slot rather than splitting by side-of-family, since
    عمو/عمه (paternal_side) and دایی/خاله (maternal_side) each only have
    2 candidates alone -- too few for the >=3-distinct-value
    multiple_choice/matching_pairs rule on their own. Used them together
    via slot_relations: same_tag on a shared "paternal_or_maternal"
    concept ONLY where the frame's own wording doesn't imply a specific
    side (see lesson03.side_pair below) -- verified this doesn't produce
    a wrong pairing by running the same standalone slot-matching harness
    used for unit03 (scripts/_practice_slot_check.py).

    "marital_status" as pure adjective (متأهل/مجرد only, 2 candidates) is
    restricted to fill_in_blank/word_order; the broader
    "marital_status_word" preset (adjective+verb, 5 candidates including
    the spoken contractions متأهله/متأهلین/مجردم) is used for the one
    multiple_choice template. "family_description" (بزرگه/کوچیکه/شلوغه,
    exactly 3 candidates) is at the bare minimum for multiple_choice --
    flagging this as fragile if a future review ever removes one of
    these three adjectives; whoever touches this lesson's realization
    content next should re-run the harness before assuming it still
    passes. Compiler validation and a real `compile` run still needed
    before shipping, left for scripts/verify.sh at the end of this
    session's pass.
tag_schema:
  part_of_speech: [noun, adjective, verb, particle, proper_noun, pronoun, adverb, preposition]
  agreement_tags:
    semantic: [kinship_term, paternal_side, maternal_side, marital_status, family_description, possession_verb, dialogue_word]
slot_presets:
  kinship_term: &kinship_term {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: kinship_term}}
  possession_verb: &possession_verb {language_code: fa, part_of_speech: verb, agreement_tags: {semantic: possession_verb}}
  marital_status: &marital_status {language_code: fa, part_of_speech: adjective, agreement_tags: {semantic: marital_status}}
  marital_status_word: &marital_status_word {language_code: fa, part_of_speech: [adjective, verb], agreement_tags: {semantic: marital_status}}
  family_description: &family_description {language_code: fa, part_of_speech: adjective, agreement_tags: {semantic: family_description}}
  dialogue_word: &dialogue_word {language_code: fa, part_of_speech: [noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle], agreement_tags: {semantic: dialogue_word}}
templates:
  # Lesson 1: immediate family.
  - content_key: practice.en-fa.fa.a1.unit04.lesson01.kin_gloss.001
    lesson_content_key: fa.a1.unit04.lesson01.immediate_family
    type: multiple_choice
    frame: {text: "{kinship_term}", language_code: fa, direction: rtl}
    slots: {kinship_term: *kinship_term}
    answer_derivation: {kind: slot_gloss, slot: kinship_term}
    feedback_frame: {text: "{kinship_term} names a family member.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit04.lesson01.kin_translation.003
    lesson_content_key: fa.a1.unit04.lesson01.immediate_family
    type: translation
    frame: {text: "{kinship_term}", language_code: en, direction: ltr, slot_rendering: {kinship_term: english_gloss}}
    slots: {kinship_term: *kinship_term}
    answer_derivation: {kind: slot_text, slot: kinship_term}
    feedback_frame: {text: "{kinship_term} is the Persian word for this family member.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit04.lesson01.kin_pair.004
    lesson_content_key: fa.a1.unit04.lesson01.immediate_family
    type: matching_pairs
    frame: {text: "Match each family word with its meaning.", language_code: en, direction: ltr}
    slots:
      kinship_term_one: *kinship_term
      kinship_term_two: *kinship_term
      kinship_term_three: *kinship_term
      kinship_term_four: *kinship_term
      kinship_term_five: *kinship_term
      kinship_term_six: *kinship_term
      kinship_term_seven: *kinship_term
      kinship_term_eight: *kinship_term
      kinship_term_nine: *kinship_term
      kinship_term_ten: *kinship_term
      kinship_term_eleven: *kinship_term
      kinship_term_twelve: *kinship_term
    answer_derivation: {kind: matching_pairs, slots: [kinship_term_one, kinship_term_two, kinship_term_three, kinship_term_four, kinship_term_five, kinship_term_six, kinship_term_seven, kinship_term_eight, kinship_term_nine, kinship_term_ten, kinship_term_eleven, kinship_term_twelve]}
    slot_relations: [{kind: distinct, slots: [kinship_term_one, kinship_term_two, kinship_term_three, kinship_term_four, kinship_term_five, kinship_term_six, kinship_term_seven, kinship_term_eight, kinship_term_nine, kinship_term_ten, kinship_term_eleven, kinship_term_twelve]}]
    feedback_frame: {text: "Match each family word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 2: describing your own family (دارم/ندارم).
  - content_key: practice.en-fa.fa.a1.unit04.lesson02.possession_gloss.001
    lesson_content_key: fa.a1.unit04.lesson02.describing_own_family
    type: multiple_choice
    frame: {text: "{possession_verb}", language_code: fa, direction: rtl}
    slots: {possession_verb: *possession_verb}
    answer_derivation: {kind: slot_gloss, slot: possession_verb}
    feedback_frame: {text: "{possession_verb} is a form of 'to have.'", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit04.lesson02.have_order.003
    lesson_content_key: fa.a1.unit04.lesson02.describing_own_family
    type: word_order
    frame: {text: "من یک {kinship_term} {possession_verb}", language_code: fa, direction: rtl}
    slots: {kinship_term: *kinship_term, possession_verb: *possession_verb}
    answer_derivation: {kind: render_frame, frame: {text: "من یک {kinship_term} {possession_verb}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "Word order: subject, quantity + noun, verb.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit04.lesson03.kin_gloss.001
    lesson_content_key: fa.a1.unit04.lesson03.extended_family
    type: multiple_choice
    frame: {text: "{kinship_term}", language_code: fa, direction: rtl}
    slots: {kinship_term: *kinship_term}
    answer_derivation: {kind: slot_gloss, slot: kinship_term}
    feedback_frame: {text: "{kinship_term} names an extended family member.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit04.lesson03.side_pair.002
    lesson_content_key: fa.a1.unit04.lesson03.extended_family
    type: matching_pairs
    frame: {text: "Match each relative with its meaning.", language_code: en, direction: ltr}
    slots:
      paternal_kin_one: {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: paternal_side}}
      paternal_kin_two: {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: paternal_side}}
      maternal_kin_one: {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: maternal_side}}
      maternal_kin_two: {language_code: fa, part_of_speech: noun, agreement_tags: {semantic: maternal_side}}
    answer_derivation: {kind: matching_pairs, slots: [paternal_kin_one, paternal_kin_two, maternal_kin_one, maternal_kin_two]}
    slot_relations:
      - {kind: distinct, slots: [paternal_kin_one, paternal_kin_two]}
      - {kind: distinct, slots: [maternal_kin_one, maternal_kin_two]}
    feedback_frame: {text: "Two relatives are from the father's side (عمو/عمه) and two from the mother's side (دایی/خاله).", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit04.lesson04.possession_gloss.002
    lesson_content_key: fa.a1.unit04.lesson04.asking_about_family
    type: multiple_choice
    frame: {text: "{possession_verb}", language_code: fa, direction: rtl}
    slots: {possession_verb: *possession_verb}
    answer_derivation: {kind: slot_gloss, slot: possession_verb}
    feedback_frame: {text: "{possession_verb} is a form of 'to have.'", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit04.lesson04.kin_order.003
    lesson_content_key: fa.a1.unit04.lesson04.asking_about_family
    type: word_order
    frame: {text: "چند تا {kinship_term} {possession_verb}", language_code: fa, direction: rtl}
    slots: {kinship_term: *kinship_term, possession_verb: *possession_verb}
    answer_derivation: {kind: render_frame, frame: {text: "چند تا {kinship_term} {possession_verb}", language_code: fa, direction: rtl}}
    feedback_frame: {text: "چند تا ... دارید؟/داری؟ asks how many of a relative someone has.", language_code: en, direction: ltr}

  # Lesson 5: marriage and grandchildren.
  - content_key: practice.en-fa.fa.a1.unit04.lesson05.marital_gloss.001
    lesson_content_key: fa.a1.unit04.lesson05.marriage_and_inlaws
    type: multiple_choice
    frame: {text: "{marital_status_word}", language_code: fa, direction: rtl}
    slots: {marital_status_word: *marital_status_word}
    answer_derivation: {kind: slot_gloss, slot: marital_status_word}
    feedback_frame: {text: "{marital_status_word} describes marital status.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit04.lesson05.kin_gloss.003
    lesson_content_key: fa.a1.unit04.lesson05.marriage_and_inlaws
    type: translation
    frame: {text: "{kinship_term}", language_code: en, direction: ltr, slot_rendering: {kinship_term: english_gloss}}
    slots: {kinship_term: *kinship_term}
    answer_derivation: {kind: slot_text, slot: kinship_term}
    feedback_frame: {text: "{kinship_term} is the Persian word for this family member.", language_code: en, direction: ltr}

  # Lesson 6: a family photo (dialogue).
  - content_key: practice.en-fa.fa.a1.unit04.lesson06.dialogue_gloss.001
    lesson_content_key: fa.a1.unit04.lesson06.family_photo_dialogue
    type: translation
    frame: {text: "{dialogue_word}", language_code: en, direction: ltr, slot_rendering: {dialogue_word: english_gloss}}
    slots: {dialogue_word: *dialogue_word}
    answer_derivation: {kind: slot_text, slot: dialogue_word}
    feedback_frame: {text: "{dialogue_word} appears in Sara and Mina's family-photo dialogue.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit04.lesson06.dialogue_pair.002
    lesson_content_key: fa.a1.unit04.lesson06.family_photo_dialogue
    type: matching_pairs
    frame: {text: "Match each dialogue word with its meaning.", language_code: en, direction: ltr}
    slots:
      dialogue_word_one: *dialogue_word
      dialogue_word_two: *dialogue_word
      dialogue_word_three: *dialogue_word
      dialogue_word_four: *dialogue_word
      dialogue_word_five: *dialogue_word
      dialogue_word_six: *dialogue_word
      dialogue_word_seven: *dialogue_word
      dialogue_word_eight: *dialogue_word
      dialogue_word_nine: *dialogue_word
      dialogue_word_ten: *dialogue_word
      dialogue_word_eleven: *dialogue_word
      dialogue_word_twelve: *dialogue_word
    answer_derivation: {kind: matching_pairs, slots: [dialogue_word_one, dialogue_word_two, dialogue_word_three, dialogue_word_four, dialogue_word_five, dialogue_word_six, dialogue_word_seven, dialogue_word_eight, dialogue_word_nine, dialogue_word_ten, dialogue_word_eleven, dialogue_word_twelve]}
    slot_relations: [{kind: distinct, slots: [dialogue_word_one, dialogue_word_two, dialogue_word_three, dialogue_word_four, dialogue_word_five, dialogue_word_six, dialogue_word_seven, dialogue_word_eight, dialogue_word_nine, dialogue_word_ten, dialogue_word_eleven, dialogue_word_twelve]}]
    feedback_frame: {text: "Match each dialogue word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-fa.fa.a1.unit04.lesson06.closing_order.003
    lesson_content_key: fa.a1.unit04.lesson06.family_photo_dialogue
    type: word_order
    frame: {text: "پس خانواده‌ی شما هم شلوغه", language_code: fa, direction: rtl}
    slots: {family_description: *family_description}
    answer_derivation: {kind: render_frame, frame: {text: "پس خانواده‌ی شما هم شلوغه", language_code: fa, direction: rtl}}
    feedback_frame: {text: "This closes the dialogue by warmly noting the other family is lively too.", language_code: en, direction: ltr}
