unit_content_key: fa.c1.unit02.manaye_zemni
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa C1 units 01-08 pass): 3 fixes - (1) ten choose/translate feedback frames said the item came ''from the lesson on <one lesson>'' while the slot pools the whole unit: now ''{item} is one of this unit''''s words.''; (2) two pool glosses did not match the taught sense and were fixed in the C1 gloss overrides of the backfill: زمینه ''background'' -> ''context; background'', ساده ''simple; lightly'' -> ''simple''; (3) three taught content words with ZWNJ were missing from the unit pool and were added to every union: کم‌گویی understatement, عبارت‌بندی wording, زبان‌آموز language learner. Read every pool gloss (برداشت ''interpretation; reading'' vs خواندن ''reading (infinitive)'' stay distinguishable), course-scope pool of the word_order frame (w_بار: 1 candidate, grammatical, not a literal frame word). Capacity (fa lexemes only, .c1.unit02. filter): 16 templates, recognition 5 / structured 6 / production 5, all 5 lessons with lexemes covered in every tier, no ''!!'' lines. Earlier: Built by scripts/derive_target.py packs from the unit''s realization/overlay and the en-fa backfill lexemes (tags fa_c1_u2 / w_<token>). 24 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'
