review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Fresh-context review 2026-11-27 (en-fa A2 units 47-51 pass): 5 fixes - the pack had 6 templates and none anchored to lesson03, which now has 7 content lexemes, and only 2 recognition templates. Added (1) lesson03 choose.001 and (2) translate.002 over the lesson03 tag (noun/adjective, 7 candidates), (3) lesson03 match.003 and (4) choose.004 over the unit-wide tag (16); (5) match.009 feedback named a because-and-so lesson this unit does not have; now names invitations and hosting. Dumped every slot pool at unit and course scope (unit-only tags, so both match) and read every gloss: no wrong glosses; دعوت (invitation) and دعوتنامه (invitation card) share a pool but stay distinguishable. The frame با هم {item} سینما؟ has one candidate (بریم). Capacity: 10 templates, R3/S4/P3, 16/22 lexemes hosted (73%), both lessons with lexemes in every tier; the 6 unhosted lexemes are card-target phrase lists. Authored 2026-11-15 for en-fa A2 unit 49 (invitations). Mirrors PR #250 (units 27-39): the backfill emits only unit and lesson tags (en_fa_a2_unit49_words, en_fa_a2_unit49_lessonNN_words), so pools are those tags narrowed by part_of_speech; sentence templates (word_order, fill_in_blank, sentence translation) hang on POS-narrowed single-candidate anchors, and word_order-only templates are used where a pool of two or more all fit the frame. Matching_pairs split nouns and verbs. No listen_select (no fa TTS). Phrase lexemes (word lists and dialogue lines) are not drilled, and tokens first introduced in earlier units belong to those units'' pools. Spoken Tehrani register; no native review yet. NOTE: very thin unit (4 content lexemes): the 12-item checkpoint bar cannot be met from this unit alone; it needs new vocabulary introduced in the unit. NATIVE QUESTIONS: (1) Is با هم بریم سینما؟ natural for shall we go to the cinema together? Recommended: yes. (2) Is the subjunctive بریم shown as a vocabulary item clear? Recommended: keep.'
