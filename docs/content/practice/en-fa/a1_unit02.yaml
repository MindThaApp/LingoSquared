schema_version: '1.0'
pack_key: practice.en-fa.a1.unit02
source_language: en
target_language: fa
unit_content_key: fa.a1.unit02.introductions
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-22 (en-fa practice rest pass, fresh context; 12 fixes). (1) name_fill.001 and (8) origin_fill.001 had
    bare ''{slot}'' frames (rejected at runtime): name now blanks into ''X شما چیه؟''; origin became a bare-gloss
    translation (a ''من ___ ایران هستم'' blank would also fit از). (2) volume_order.001 and (9) volume_order.003
    were 1-tile word banks: now ''اسم شما چیه؟'' / ''شما اهل کجا هستین؟''. (3) name_translation.004 prompt now says
    ''(formal)'' since the unit also teaches اسمم ساراست for ''My name is Sara''. (4) name_pair.005 had 2
    self-glossed name pairs: now 6 lesson02/03 words + 2 names. (5) copula_choice feedback claimed a course-wide
    pool was introduced in this lesson; (6) pronoun_pair feedback had a meaningless clause; (7) three_letter_match
    feedback claimed all letters were from this lesson. (10) name_reply.002 used formal-written اسم من … است in the
    spoken dialogue lesson: now من … هستم as Mina says it. (11) dialogue_word pool re-pooled from the level-wide tag
    (stage-direction sentence glosses, proper nouns) to this unit''s single words. (12) dialogue_pair.005
    instruction was formal Persian for an English-speaking learner: now English. NATIVE FLAGS: translation prompts
    that hinge on the labels ''polite standard'' (هستید) vs ''polite spoken'' (هستین). GLOSS LANE: letter و glossed
    ''and (links tens + units)'' in the letter pools.

    Fresh review found and resolved name morphology, country coupling, letter gloss, dialogue-slot, and answer-derivation
    defects. A targeted post-review fix removed leaked review-process language from learner-facing feedback; this was not
    a new full fresh-context review. Second targeted post-review fix, 2026-07-06: scripts/_practice_slot_check.py surfaced
    that 2 multiple_choice templates (name_word, origin_marker) each had only 1 real distinct lexeme candidate against the
    >=3 multiple_choice/matching_pairs threshold. Converted both to fill_in_blank (same slot, needs only >=1 candidate). Re-verified
    via compile_content.py practice-validate (0/0) and _practice_slot_check.py (both now pass). The iran_pair.003/england_pair.004/france_pair.005
    single-country templates mentioned as open at the time of that note no longer exist in this file (removed by a later pass,
    superseded by lesson04''s country_pair.006, which pairs each country with its own nationality via a same_tag relation
    across 3 country/nationality pairs). Third targeted post-review fix, 2026-07-07: the 2 matching_pairs problems _practice_slot_check.py
    still flagged (name_pair.005''s ''name_word'' slot, origin_pair.006''s ''origin_marker'' slot) are now fixed, without
    inventing vocabulary -- verified by hand against backfill_lexemes.py''s iter_specs() (A1-only) that ''name_word'' (اسم,
    the word ''name'' itself) and ''origin_marker'' (اهل, the ''from''-marking preposition) are each genuinely single-candidate
    at this course''s real vocabulary depth, and both are already tested elsewhere (name_word via its own fill_in_blank per
    the fix above; origin_marker via origin_fill.001). Since matching_pairs needs every participating slot to itself have
    real headroom (>=2 distinct candidates) and neither of these two singletons can ever supply that, both were simply dropped
    from their respective templates rather than paired against an unrelated tag: name_pair.005 keeps its existing 7-way person_name
    pool unchanged (already fine on its own), origin_pair.006 keeps its existing 3-way country pool unchanged. Re-verified
    via _practice_slot_check.py (0 problems in this file) and compile_content.py practice-validate (0/0).

    REAUTH PASS 2026-07-24 (fix DEAD templates at checkpoint/UNIT scope --
    scripts/_practice_unit_scope_check.py, a different check from
    _practice_slot_check.py''s whole-direction scope the notes above used).
    generate_checkpoint() scopes candidates to this unit''s own lexemes
    only, and the 2026-07-07 note''s "7-way person_name pool" and other
    counts above were measured at whole-direction scope, not unit scope --
    that mismatch is exactly what caused the defects below. Verified
    against a fresh iter_specs() dump filtered to ''.a1.unit02.'':

    1. name_pair.005 declared 7 person_name slots but this unit''s own
    lessons introduce only 2 (سارا lesson02, مینا lesson06) -- REAL DEAD.
    Shrunk to 2 slots. Honestly thin (below the 6-pair floor), documented.

    2. pronoun_pair.006''s pronoun_one..six (6 slots, the `pronoun`
    semantic tag) drew on a real unit-scoped pool of only 1 (او) -- REAL
    DEAD. Its OTHER independent distinct group, copula_one..six, is fine
    (8 distinct unit-scoped copula forms). Shrunk the pronoun group to a
    single pronoun_one slot (a "distinct" relation needs >=2 members, so
    it was dropped along with the other 5 pronoun slots) -- total pairs
    now 1 (pronoun) + 6 (copula) = 7, still clearing the 6-pair floor.

    3. pronoun_gloss.001 (multiple_choice, pronoun+singular) had only 1
    distinct unit-scoped candidate (او) -- below the 3-option MC floor,
    and this lesson genuinely has no 2nd/3rd singular pronoun of its own
    (تو/شما/من are a1_unit01''s). REPURPOSED to the copula tag instead (8
    distinct candidates, and copula forms are just as central to this
    "pronouns and boodan" lesson) -- renamed to copula_choice.001 with
    feedback text updated to match.

    4. dialogue_pair.005''s person_name_1..4 (4 slots) drew on the same
    2-member pool as name_pair.005 above -- REAL DEAD. Shrunk to
    person_name_1/2. Its dialogue_word_1..8 group is untouched (24
    distinct unit-scoped candidates, verified, nowhere near exhausted).
    Also reordered `slots:` to list dialogue_word_1..8 before
    person_name_1/2 -- with two very differently-sized `distinct` groups
    (2 vs 8), _practice_unit_scope_check.py estimates the whole template
    from only the FIRST declared slot, so leaving person_name first would
    still misreport this now-correct template as DEAD (2 < 8). Slot
    mapping order has no effect on fill_slots()/lexeme_matches() at
    runtime, so this is a free fix for the checker''s blind spot.

    5. polite_close.006 (word_order) constrained its slot to `politeness`,
    a tag with ZERO members anywhere in this unit (all 13 course-wide
    members are a1_unit01''s taarof vocabulary) -- REAL DEAD, another pure
    DO-NOT #2 instance. Worse: the frame''s literal text, "از آشنایی با شما
    خوشوقتم", turns out to be a1_unit01''s own dialogue line verbatim (Ali''s
    "pleased to meet you" from lesson06 first_meeting_dialogue) -- this
    unit''s OWN lesson06 dialogue (language_class_dialogue) never actually
    says that line; its real closing line is "من هم همین‌طور. بفرمایید
    داخل." There is no unit02-native single-candidate tag available to
    rebuild this as a proper word_order (backfill_lexemes.py tags a bare
    token once per direction at first introduction, and every content word
    in that real closing line was already introduced in a1_unit01).
    DROPPED. lesson06 keeps two other word_order templates (name_reply.002,
    origin_reply.003) plus the fixed dialogue_pair.005/dialogue_gloss.004,
    so structured-tier coverage for this lesson is unaffected. LOGGED for
    the coordinator: this looks like a copy-paste of a1_unit01''s closing
    line into a1_unit02''s pack rather than a scope-only bug -- worth a
    second look at whether other units'' "closing"/"polite_close"-style
    templates were copied the same way.

    6. country_pair.006 is flagged FLOOR ("declares only 3 slots") by
    scripts/_practice_unit_scope_check.py, but this is a VERIFIED FALSE
    POSITIVE, not a real defect -- left UNCHANGED. The script''s
    `_distinct_slot_count()` only sums `kind: distinct` relation groups; it
    ignores `same_tag` relations entirely, so it never sees that this
    template''s 3 `same_tag` pairs (country_key-matched country+nationality)
    contribute 3 MORE real slots on top of the 3-way country `distinct`
    group. The real total is 6 slots / 6 distinct pairs (3 countries:
    ایران، انگلیس، فرانسه, each same_tag-paired with its own nationality:
    ایرانی، انگلیسی، فرانسوی) -- meets the 6-pair floor exactly, and this
    is precisely how the template was designed (see this file''s own
    2026-07-06 note above). No pack change made.

    7. origin_pair.006 (3 country-only slots, genuinely below the 6-pair
    floor at unit scope -- country has only 3 members total, no
    combinable second category left unused in this lesson) was widened
    using country_pair.006''s own already-proven same_tag technique: added
    nationality_one..three, same_tag-paired with country_one..three on
    country_key, for 6 total slots -- reaching the floor without inventing
    any vocabulary (nationality is unit02''s own tag, already used
    elsewhere in this file).

    dialogue_word (24 distinct unit-scoped candidates, used above) was
    already in this file''s tag_schema. Re-verified 0 DEAD for this file
    (item 6 above is the only residual FLOOR line the script prints, a
    documented false positive) via scripts/_practice_unit_scope_check.py,
    and 0 errors via compile_content.py practice-validate. No backfill/
    realization/overlay edits made.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - letter
    - person_name
    - name_word
    - pronoun
    - copula
    - country
    - nationality
    - origin_marker
    - place_question
    - politeness
    - class_word
    - dialogue_word
    - reviewed_phrase
    - en_fa_a1_unit02_words
    - en_fa_a1_unit02_lesson02_words
    - en_fa_a1_unit02_lesson03_words
    register:
    - neutral
    - polite
    - informal
    - formal
    - spoken
    - written
    person:
    - first
    - second
    - third
    country_key:
    - iran
    - england
    - france
    number:
    - singular
    - polite_or_plural
