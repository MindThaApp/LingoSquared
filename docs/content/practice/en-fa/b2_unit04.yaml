schema_version: '1.0'
pack_key: practice.en-fa.b2.unit04
source_language: en
target_language: fa
unit_content_key: fa.b2.unit04.narrative
review:
  status: unreviewed
  fresh_context: 'false'
  required_next_reviewer: native_speaker_review
  notes: 'Authored 2026-10-19 against docs/content/PRACTICE_PACK_RECIPE.md so the en-fa B2 unit04 checkpoint
    can generate (before this, en-fa B2 had no lexemes and no packs). Lexemes come from the B2 extension
    of scripts/backfill_lexemes.py (same branch). Grammar/discourse unit, so the 8.1 pattern is used:
    unit-wide curated pools, every template anchored to one lesson. 14 templates over all 3 lessons: multiple_choice
    x3 (nouns / adjectives / verbs+adverbs over b2u04_core), matching_pairs x2 (nouns; adjectives+adverbs+verbs),
    word_order x6 (two per lesson, each the unit''s own example sentence with one single-member anchor
    b2u04_<word>_single, exactly 1 course-wide candidate, not a literal of its own frame), translation
    x3 (bare-word, one per lesson over b2u04_vert_l<N>: nouns/adjectives/adverbs, no verbs, minus tokens
    with a second common Persian answer). No listen_select (no fa TTS), no fill_in_blank (the runtime
    shows no English cue for the blank), no fixed-sentence translation. All tags are unit-specific, so
    course scope == unit scope for every slot. Glosses are English-only, so no MC option or translation
    prompt contains Persian script. MEASURED (recipe 9 step 4, filter .b2.unit04.): 57/68 fa lexemes hostable;
    recognition and structured host 57, production 34; 3/3 lessons in every tier; no dead template, every
    MC pool >=3 distinct glosses, every matching pool >=6. Offline port of generate_checkpoint(): 15/15
    items on 5 seeds. practice-validate: 0 errors. Native review: dashtim (progressive helper) is excluded
    from the pools so ''we were'' (budim) and ''we were (in the middle of)'' never appear as two matching
    answers. Glosses are draft (backfill), pending native-Persian review together with this pack.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - b2u04_core
    - b2u04_vert_l1
    - b2u04_vert_l2
    - b2u04_vert_l3
    - b2u04_tazeh_single
    - b2u04_lahzeh_single
    - b2u04_salon_single
    - b2u04_khis_single
    - b2u04_nasb_single
    - b2u04_panjereh_single
