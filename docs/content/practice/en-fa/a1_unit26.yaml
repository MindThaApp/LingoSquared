schema_version: '1.0'
pack_key: practice.en-fa.a1.unit26
source_language: en
target_language: fa
unit_content_key: fa.a1.unit26.animals

review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 4 fixes). (1) feedback: lesson04.choose.001 said every item 'describes a pet's color or size' (false for خوشگل/گربه‌ی) -> 'is used when describing a pet'. (2) feedback: lesson05.choose.001 'talking about a pet's name' (false for سگم) -> 'talking about a pet'. (3) underdetermined: lesson04.translate.003 dropped the ezafe form گربه‌ی (spelling-ambiguous typed answer), now adjective+verb (خوشگل, سفیده, خوشگله). (4) matching-pool: match.004 pool equalled the 6 slots; widened with pet_name/pet_food/pet_description nouns+adjectives (11). NATIVE FLAGS: سگم رو غذا می‌دم (fill.003, mirrors the unit; standard به سگم غذا می‌دم) and من حیوان دارم (written حیوان vs spoken حیوون).

    Vocabulary unit (pets/animals, 36 fa lexemes across all 6 lessons).
    'animal_word' (lessons01-02) is unioned for the recognition/production
    workhorse (حیوان/سگ/گربه/پرنده/ماهی, 5 distinct) and widened with
    'pet_word' (adds خونگی) to reach the 6-pair matching_pairs floor;
    checked course-wide -- both tags are unique to this unit, so course
    scope equals unit scope for every slot here. word_order frames ('من
    {item} دارم.', 'گربه‌ی من {item}.', 'این {item}.') were re-read
    against each slot's course-wide pool and every candidate is
    grammatical (matches the realization's own example sentences, e.g.
    "من سگ دارم.", "گربه‌ی من سفیده."). fill_in_blank anchors غذا
    (pet_food_word + noun, the only noun member of that tag) in "سگم رو
    {item} می‌دم." -- lifted verbatim from the lesson03 teaching card's
    own example sentence. Excluded پشمک (proper_noun, self-gloss "Pashmak
    (cat's name)") from every multiple_choice/matching_pairs pool per
    recipe §6.1. No mis-glossed lexemes found. No listen_select (fa has
    no TTS configured).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - animal_word
    - pet_word
    - pet_name_word
    - pet_food_word
    - pet_description_word
    - ownership_word

templates:
# --- lesson01 (pets) ---
- content_key: practice.en-fa.fa.a1.unit26.lesson01.choose.001
  lesson_content_key: fa.a1.unit26.lesson01.pets
  type: multiple_choice
  frame: {text: '{item}', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags: {semantic: animal_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is animal vocabulary from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit26.lesson01.translate.002
  lesson_content_key: fa.a1.unit26.lesson01.pets
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags: {semantic: animal_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: 'Type the Farsi word for {item}.'
    language_code: en
    direction: ltr

- content_key: practice.en-fa.fa.a1.unit26.lesson01.order.003
  lesson_content_key: fa.a1.unit26.lesson01.pets
  type: word_order
  frame: {text: 'من {item} دارم.', language_code: fa, direction: rtl}
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags: {semantic: animal_word}
  answer_derivation:
    kind: render_frame
    frame: {text: 'من {item} دارم.', language_code: fa, direction: rtl}
  feedback_frame:
    text: "I have a/an {item}."
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss

