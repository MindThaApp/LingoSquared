# --- unit-wide matching_pairs over animal_word + pet_word ---
- content_key: practice.en-fa.fa.a1.unit26.lesson01.match.004
  lesson_content_key: fa.a1.unit26.lesson01.pets
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fa
    direction: rtl
  slots:
    first: &animal
      language_code: fa
      part_of_speech: [noun, adjective]
      agreement_tags: {semantic: [animal_word, pet_word]}
    second: *animal
    third: *animal
    fourth: *animal
    fifth: *animal
    sixth: *animal
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: 'These are the unit''s animal/pet words.'
    language_code: en
    direction: ltr
