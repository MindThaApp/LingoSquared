schema_version: '1.0'
pack_key: practice.en-fa.b1.unit01
source_language: en
target_language: fa
unit_content_key: fa.b1.unit01.necessity
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (en-fa practice rest pass, fresh context; 9 fixes). No backfill gloss in this unit embeds Persian any more, but 8 MC/translation slots had no semantic tag, so Endless Practice drew from all ~470 B1 fa lexemes (later-unit words, untagged particles such as kaash/harchand, Tehran). (1-5) lesson01 choose/translate, lesson02 choose, lesson03 choose, lesson05 translate re-pooled onto cumulative lesson-tag unions (10/8/11/11 tokens). (6) lesson06.translate.001 -> verbs of lessons 01-03+05+06: drops kani gloss you do, which a learner types as mikoni (same gloss). (7) lesson04.choose.001 was a function-word pool (pronoun/particle/preposition, all untagged or course-wide pronoun tag) -> lesson04 dialogue words, feedback updated. (8) lesson04.match.002 and lesson05.match.001 were the same fixed 6-token pool for 6 slots (identical cards every time) incl. reviewed_phrase, which pulls B1 phrases from units 07-11 -> lesson04 / lesson05 words (12/13), feedback updated. (9) lesson02.match.002 feedback said each verb refers to a person (pool has must, was, I do not have) -> English meaning; lesson02.translate.004 proper nouns untagged (pulled Tehran, Hossein) -> person_name. NATIVE FLAGS: none new. Gloss lane: kani you do -> (that) you do (subjunctive); miraftam and natunest have POS noun (should be verb); the conjunctions chon/vali and the pronouns carry no unit lesson tag, so they are not drilled in MC.

    Six lessons, 61 fa lexemes (the richest B1 unit). Drills baayad + subjunctive across every person,
    past obligation with the imperfect, and negation.


    Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md to unblock this unit's

    checkpoint: the unit had lexemes but no practice pack, so generate_checkpoint() returned

    checkpoint_unavailable. ZERO listen_select is authored - AZURE_SPEECH_KEY is unset, so

    tts_actually_configured('fa') is false and _material() would delete those templates.

    Every slot is satisfiable from THIS unit's own lexemes, because generate_checkpoint()

    calls _material() with only this unit's lesson ids.


    The en-fa B1 lexeme classification carries almost no usable semantic tags (290 of 382 fa

    B1 lexemes are untagged), so the broad recognition / production / matching slots are

    constrained by language_code + part_of_speech only; the few semantic tags that do exist

    are used for the narrow, grammatically safe word_order / fill_in_blank / fixed-sentence

    slots. Every such tag was checked against the real backfill_lexemes.py data: each

    fill_in_blank anchor has exactly ONE distinct COURSE-WIDE candidate (AUTHORING_GUIDE #17

    hard-fail), and for every word_order frame each candidate in the whole B1 course pool is

    grammatical in that frame.


    proper_noun is deliberately excluded from multiple_choice and matching_pairs (the gloss is

    a transliteration, so those items are near-trivial) and is reachable only through a

    dedicated bare-word translation, which is a genuine script-production drill.


    Reviewer must double-check: (a) the Persian in every word_order / fill_in_blank frame reads

    as natural colloquial Iranian Persian and uses only vocabulary already taught in this course;

    (b) glosses that embed the Persian token in a parenthetical example (a backfill gloss-style

    artifact) partly give away the answer in multiple_choice - flagged, not fixable in a pack.


    Template mix: fill_in_blank x1, matching_pairs x3, multiple_choice x4, translation x5, word_order
    x3 (16 total) anchored across the 6 lessons that introduce tokens.


    POLISH 2026-07-25 (POS-only matching_pairs wave): lesson04.match.002 and
    lesson05.match.001 now carry a semantic union of this unit's own tags
    (advice_word+asking_word+bureaucracy_word+help_word+room_word+reviewed_phrase,
    6 unit tokens, pos noun/adverb) so Endless Practice pairs stay on the
    daily-obligations theme; identical pools are forced -- those six are the
    unit's only semantically tagged noun/adverb tokens. A pronoun+time-word union
    was rejected: at B1 course scope it pools چه 'what; which' next to چی
    'what' (confusable rights). lesson02.match.002 stays deliberately POS-only
    [verb]: the unit has only 3 verb-tagged tokens, and verb-form-to-person
    matching remains coherent when Endless Practice widens the pool.

    POLISH WAVE 4 (2026-07-26, commit 05af7ace-successor generated tags): the POS-only honest-leave above is RESOLVED. scripts/backfill_lexemes.py now emits en_fa_b1_unit01_words (and per-lesson en_fa_b1_unit01_lessonNN_words) for every first-introduced content token in this unit, so the matching_pairs slot(s) are re-anchored off bare part_of_speech onto en_fa_b1_unit01_words (48 distinct unit-scoped tokens, POS [noun,verb,adjective,adverb]); course-scope Endless-Practice pool == unit pool by construction, so the off-theme pulls are eliminated. No duplicate-gloss collisions in the resulting pool. Verified with pool_check.py + unit-scope check (0 DEAD, floor holds).

    FRESH-CONTEXT NATIVE REVIEW 2026-07-27 (batch 1): reviewed against AUTHORING_PREFLIGHT.md with the realization/overlay + live backfill lexeme pools cross-checked. All CRITICAL/MAJOR findings fixed and committed (see docs/RAMIN_REVIEW_BACKLOG.md 'Native review batch 1' for the per-pack findings + residual MINOR/known-limitation notes; some backfill gloss fixes take effect on the next re-backfill). Status -> reviewed.
