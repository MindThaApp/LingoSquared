- content_key: practice.ko-fr.fr.a1.unit47.lesson01.order.003
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: word_order
  frame:
    text: Le temps est {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_ensoleillé
  answer_derivation:
    kind: render_frame
    frame:
      text: Le temps est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 날씨가 맑아요. Le temps est + 형용사는 기본 패턴이고, 형용사는 남성 명사 temps에 일치해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit47.lesson01.fill.004
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: fill_in_blank
  frame:
    text: S'il {item}, on reste à l'intérieur. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pleut
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pleut
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '비가 오면 실내에 있어요. S''il pleut(비가 오면): si + il은 s''il이 되고, on reste à l''intérieur는 무엇을 하는지 말해 줘요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit47.lesson01.translate.005
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: translation
  frame:
    text: 날씨가 흐려요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nuageux
  answer_derivation:
    kind: render_frame
    frame:
      text: Le temps est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 날씨가 흐려요. ensoleillé와 같은 le temps est + 형용사 패턴이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit47.lesson02.order.002
  lesson_content_key: fr.a1.unit47.lesson02.froid_ou_chaud
  type: word_order
  frame:
    text: Il fait {item} aujourd'hui.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_froid
  answer_derivation:
    kind: render_frame
    frame:
      text: Il fait {item} aujourd'hui.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 오늘은 추워요. Aujourd'hui(오늘)는 날씨의 시점을 나타내고, il fait froid는 être가 아니라 faire를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit47.lesson02.fill.003
  lesson_content_key: fr.a1.unit47.lesson02.froid_ou_chaud
  type: fill_in_blank
  frame:
    text: Il fait {item} aujourd'hui. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_chaud
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_chaud
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 오늘은 따뜻해요. Il fait chaud는 일상적인 날씨 이야기에서 '따뜻하다'와 '덥다'를 모두 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit47.lesson03.order.002
  lesson_content_key: fr.a1.unit47.lesson03.la_meteo
  type: word_order
  frame:
