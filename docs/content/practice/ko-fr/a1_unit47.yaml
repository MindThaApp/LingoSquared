    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 프랑스어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit47.lesson06.choose.001
  lesson_content_key: fr.a1.unit47.lesson06.faire_des_projets_pour
