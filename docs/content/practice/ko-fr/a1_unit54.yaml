schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit54
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit54.animaux
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_adore
    - w_aimons
    - w_ajoute
    - w_animal
    - w_animaux
    - w_aucun
    - w_brun
    - w_chat
    - w_chats
    - w_chien
    - w_chiens
    - w_compagnie
    - w_deviennent
    - w_donne
    - w_donner
    - w_manger
    - w_oiseau
    - w_oiseaux
    - w_poil
    - w_poissons
    - w_promènes
    - w_seulement
    - w_tous
    - w_voyelle
templates:
- content_key: practice.ko-fr.fr.a1.unit54.lesson01.choose.001
  lesson_content_key: fr.a1.unit54.lesson01.chien_chat_poisson_et
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_animal
        - w_compagnie
        - w_chien
        - w_chat
        - w_oiseau
        - w_deviennent
        - w_voyelle
        - w_tous
        - w_promènes
        - w_donner
        - w_manger
        - w_donne
        - w_ajoute
        - w_chiens
        - w_chats
        - w_animaux
        - w_adore
        - w_poissons
        - w_oiseaux
        - w_poil
        - w_brun
        - w_seulement
        - w_aucun
        - w_aimons
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 개, 고양이, 물고기, 새 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson02.listen.001
  lesson_content_key: fr.a1.unit54.lesson02.s_occuper_d_un
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 반려동물 돌보기 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson03.translate.001
  lesson_content_key: fr.a1.unit54.lesson03.adorer_les_animaux
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 동물을 좋아하는 마음을 다루는 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson04.match.001
  lesson_content_key: fr.a1.unit54.lesson04.mathieu_pose_des_questions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 프랑스어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson05.choose.001
  lesson_content_key: fr.a1.unit54.lesson05.mathieu_lea_et_thomas
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 동물에 대한 마티외, 레아, 토마의 이야기 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson06.translate.001
  lesson_content_key: fr.a1.unit54.lesson06.l_oiseau_de_nina
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 니나의 새 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson01.order.002
  lesson_content_key: fr.a1.unit54.lesson01.chien_chat_poisson_et
  type: word_order
  frame:
    text: Un chien est un {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_animal
  answer_derivation:
    kind: render_frame
    frame:
      text: Un chien est un {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 개는 동물이에요. animal은 '동물'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson01.fill.003
  lesson_content_key: fr.a1.unit54.lesson01.chien_chat_poisson_et
  type: fill_in_blank
  frame:
    text: Un chien est aussi un animal de {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_compagnie
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_compagnie
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 개는 반려동물이기도 해요. compagnie는 '동반, 함께함'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson01.translate.004
  lesson_content_key: fr.a1.unit54.lesson01.chien_chat_poisson_et
  type: translation
  frame:
    text: Camille은 개를 키워요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_chien
  answer_derivation:
    kind: render_frame
    frame:
      text: Camille a un {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 카미유에게는 개가 있어요. chien은 '개'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson02.order.002
  lesson_content_key: fr.a1.unit54.lesson02.s_occuper_d_un
  type: word_order
  frame:
    text: Je promène le chien {item} les jours.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_tous
  answer_derivation:
    kind: render_frame
    frame:
      text: Je promène le chien {item} les jours.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 저는 매일 개를 산책시켜요. tous는 '모든, 매'라는 뜻이에요(남성 복수).
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson02.fill.003
  lesson_content_key: fr.a1.unit54.lesson02.s_occuper_d_un
  type: fill_in_blank
  frame:
    text: Tu le {item} tous les jours ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_promènes
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_promènes
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 그 개를 매일 산책시켜요? promènes는 '산책시키다'라는 뜻이에요(tu에 쓰는 형태).
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson02.translate.004
  lesson_content_key: fr.a1.unit54.lesson02.s_occuper_d_un
  type: translation
  frame:
    text: 저는 매일 고양이에게 먹이를 줘요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_manger
  answer_derivation:
    kind: render_frame
    frame:
      text: Je donne à {item} au chat tous les jours.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 저는 매일 고양이에게 밥을 줘요. manger는 '먹다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson03.order.002
  lesson_content_key: fr.a1.unit54.lesson03.adorer_les_animaux
  type: word_order
  frame:
    text: Mathieu adore les {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_chiens
  answer_derivation:
    kind: render_frame
    frame:
      text: Mathieu adore les {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 마티외는 개를 아주 좋아해요. chiens는 '개들'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson03.fill.003
  lesson_content_key: fr.a1.unit54.lesson03.adorer_les_animaux
  type: fill_in_blank
  frame:
    text: Léa adore les {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_chats
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_chats
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 레아는 고양이를 아주 좋아해요. chats는 '고양이들'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson03.translate.004
  lesson_content_key: fr.a1.unit54.lesson03.adorer_les_animaux
  type: translation
  frame:
    text: 저는 동물을 정말 좋아해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_animaux
  answer_derivation:
    kind: render_frame
    frame:
      text: J'adore les {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: '저는 동물을 아주 좋아해요. Adorer(매우 좋아하다) 뒤에는 명사가 바로 오고, 일반적인 취향을 말할 때는 les를 써요: J''adore les animaux.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson04.order.002
  lesson_content_key: fr.a1.unit54.lesson04.mathieu_pose_des_questions
  type: word_order
  frame:
    text: Il a le {item} brun et il est petit.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_poil
  answer_derivation:
    kind: render_frame
    frame:
      text: Il a le {item} brun et il est petit.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 그는 갈색 털에 몸집이 작아요. 외모 단원에서 배운 머리 색과 크기 어휘를 다시 쓰되, 이번에는 사람의 머리카락 대신 동물의 털을 묘사해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit54.lesson06.order.002
  lesson_content_key: fr.a1.unit54.lesson06.l_oiseau_de_nina
  type: word_order
  frame:
    text: C'est super, nous {item} tous les trois les animaux !
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_aimons
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est super, nous {item} tous les trois les animaux !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 우리 셋 모두 동물을 좋아하다니 정말 좋네요! 이번 단원에 나온 세 사람의 동물 이야기를 마무리해요.
    language_code: ko
    direction: ltr
