schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit70
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit70.hebergement
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_avait
    - w_cet
    - w_clé
    - w_compris
    - w_mot
    - w_nuit
    - w_nuits
    - w_réceptionniste
    - w_réservation
    - w_réserver
    - w_réservé
    - w_wifi
templates:
- content_key: practice.ko-fr.fr.a1.unit70.lesson01.choose.001
  lesson_content_key: fr.a1.unit70.lesson01.reserver_une_chambre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_réserver
        - w_cet
        - w_réservé
        - w_compris
        - w_clé
        - w_mot
        - w_wifi
        - w_réceptionniste
        - w_réservation
        - w_nuits
        - w_nuit
        - w_avait
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} : 객실 예약 수업에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit70.lesson02.listen.001
  lesson_content_key: fr.a1.unit70.lesson02.est_ce_que_le
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} : 아침 식사가 포함되어 있나요? 수업에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
