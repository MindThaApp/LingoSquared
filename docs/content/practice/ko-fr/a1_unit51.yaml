schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit51
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit51.argent
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_addition
    - w_aidé
    - w_cafés
    - w_carte
    - w_demande
    - w_espèces
    - w_gentil
    - w_monnaie
    - w_paie
    - w_partage
    - w_payer
    - w_payé
    - w_principaux
    - w_séparément
    - w_tellement
    - w_total
    - w_votre
    - w_voulez
templates:
- content_key: practice.ko-fr.fr.a1.unit51.lesson02.choose.001
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_payer
        - w_carte
        - w_espèces
        - w_paie
        - w_voulez
        - w_partage
        - w_séparément
        - w_monnaie
        - w_votre
        - w_addition
        - w_principaux
        - w_cafés
        - w_total
        - w_payé
        - w_demande
        - w_tellement
        - w_aidé
        - w_gentil
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 카드나 현금으로 결제하는 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit51.lesson03.listen.001
  lesson_content_key: fr.a1.unit51.lesson03.partager_l_addition
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 계산서를 나누는 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit51.lesson04.translate.001
  lesson_content_key: fr.a1.unit51.lesson04.la_monnaie
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 거스름돈 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit51.lesson05.match.001
  lesson_content_key: fr.a1.unit51.lesson05.lire_une_addition_de
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 프랑스어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit51.lesson06.choose.001
  lesson_content_key: fr.a1.unit51.lesson06.camille_et_mathieu_paient
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 카미유와 마티외가 계산하는 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit51.lesson02.translate.002
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 카드나 현금으로 결제하는 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit51.lesson02.order.003
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: word_order
  frame:
    text: Je peux {item} par carte ici ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_payer
  answer_derivation:
    kind: render_frame
    frame:
      text: Je peux {item} par carte ici ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 여기서 카드로 결제할 수 있나요? payer는 '지불하다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit51.lesson02.fill.004
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: fill_in_blank
  frame:
    text: Vous voulez payer en espèces ou par {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_carte
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_carte
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 현금으로 내시겠어요, 카드로 내시겠어요? Vous voulez ... ?는 모르는 계산원이 쓰는 격식 있는 질문 방식이고, 친구끼리는 tu veux ... ?라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit51.lesson02.translate.005
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: translation
  frame:
    text: 저는 현금으로 낼게요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_espèces
  answer_derivation:
    kind: render_frame
    frame:
      text: Je paie en {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 저는 현금으로 낼게요. espèces는 '현금'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit51.lesson03.order.002
  lesson_content_key: fr.a1.unit51.lesson03.partager_l_addition
  type: word_order
  frame:
    text: On {item} l'addition ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_partage
  answer_derivation:
    kind: render_frame
    frame:
      text: On {item} l'addition ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 계산서를 나눌까요? partage는 '나누다'라는 뜻이에요 (je, il/elle, 또는 일반적인 주어 on과 함께 써요).
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit51.lesson03.fill.003
  lesson_content_key: fr.a1.unit51.lesson03.partager_l_addition
  type: fill_in_blank
  frame:
    text: Je peux payer {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_séparément
    hint:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_séparément
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 따로 계산해도 될까요? Séparément(따로)은 payer 바로 뒤에 와요. 내 몫만 계산하고 싶을 때 쓰는 정중한 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit51.lesson04.order.002
  lesson_content_key: fr.a1.unit51.lesson04.la_monnaie
  type: word_order
  frame:
    text: Voici votre {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_monnaie
  answer_derivation:
    kind: render_frame
    frame:
      text: Voici votre {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 거스름돈 여기 있어요. monnaie는 '잔돈'(동전)이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit51.lesson06.order.002
  lesson_content_key: fr.a1.unit51.lesson06.camille_et_mathieu_paient
  type: word_order
  frame:
    text: On {item} l'addition ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_demande
  answer_derivation:
    kind: render_frame
    frame:
      text: On {item} l'addition ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 계산서를 달라고 할까요? Demander(요청하다)는 l'addition을 다른 단어 없이 바로 목적어로 받아요.
    language_code: ko
    direction: ltr
