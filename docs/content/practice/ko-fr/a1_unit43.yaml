schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit43
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit43.voyage
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_allez
    - w_arrive
    - w_attention
    - w_billet
    - w_doit
    - w_déjà
    - w_départ
    - w_encore
    - w_guichet
    - w_général
    - w_monte
    - w_panneau
    - w_part
    - w_pile
    - w_problème
    - w_quai
    - w_quarante
    - w_salle
    - w_simple
    - w_sortie
    - w_train
    - w_utilise
    - w_vouvoiement
templates:
- content_key: practice.ko-fr.fr.a1.unit43.lesson01.choose.001
  lesson_content_key: fr.a1.unit43.lesson01.acheter_un_billet
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_billet
        - w_simple
        - w_guichet
        - w_utilise
        - w_général
        - w_vouvoiement
        - w_quai
        - w_part
        - w_train
        - w_arrive
        - w_attention
        - w_sortie
        - w_salle
        - w_départ
        - w_quarante
        - w_doit
        - w_panneau
        - w_problème
        - w_encore
        - w_déjà
        - w_pile
        - w_allez
        - w_monte
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어예요. 표를 사는 수업에 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit43.lesson02.listen.001
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 「기차는 몇 시에 출발해요?」 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit43.lesson03.translate.001
  lesson_content_key: fr.a1.unit43.lesson03.le_retard
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '지연 수업에 나오는 이 단원의 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit43.lesson04.match.001
  lesson_content_key: fr.a1.unit43.lesson04.se_reperer_a_la
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 프랑스어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit43.lesson05.choose.001
  lesson_content_key: fr.a1.unit43.lesson05.lire_un_billet_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '기차표 읽기 수업에 나오는 이 단원의 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit43.lesson06.translate.001
  lesson_content_key: fr.a1.unit43.lesson06.camille_et_mathieu_en
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '카미유와 마티외의 여행 수업에 나오는 이 단원의 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit43.lesson01.order.002
  lesson_content_key: fr.a1.unit43.lesson01.acheter_un_billet
  type: word_order
  frame:
    text: Je voudrais un {item} pour Lyon.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_billet
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item} pour Lyon.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 리옹행 표를 한 장 사고 싶어요. billet은 '표'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit43.lesson01.fill.003
  lesson_content_key: fr.a1.unit43.lesson01.acheter_un_billet
  type: fill_in_blank
  frame:
    text: Voulez-vous un aller {item} ou un aller-retour ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_simple
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_simple
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 편도로 하시겠어요, 왕복으로 하시겠어요? Voulez-vous는 vouloir의 격식체 vous 형태로, 낯선 역 직원에게 말하기 때문에 여기서 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit43.lesson02.order.002
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: word_order
  frame:
    text: De quel {item} part le train pour Lyon ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_quai
  answer_derivation:
    kind: render_frame
    frame:
      text: De quel {item} part le train pour Lyon ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 리옹행 기차는 어느 승강장에서 출발해요? quai는 '승강장'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit43.lesson02.fill.003
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: fill_in_blank
  frame:
    text: Le train ne {item} pas à l'heure. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_part
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_part
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 기차가 제시간에 출발하지 않아요. part는 '쪽', '몫'이라는 뜻이에요('당신 쪽에서'처럼).
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit43.lesson02.translate.004
  lesson_content_key: fr.a1.unit43.lesson02.a_quelle_heure_part
  type: translation
  frame:
    text: 기차는 몇 시에 도착해요?
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_train
  answer_derivation:
    kind: render_frame
    frame:
      text: À quelle heure arrive le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: '기차가 몇 시에 도착해요? À quelle heure arrive ... ?는 시각을 묻는 표현이고, arriver는 규칙 -er 동사예요: le train arrive.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit43.lesson04.order.002
  lesson_content_key: fr.a1.unit43.lesson04.se_reperer_a_la
  type: word_order
  frame:
    text: Où est la {item} ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_sortie
  answer_derivation:
    kind: render_frame
    frame:
      text: Où est la {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 출구는 어디에 있어요? sortie는 '출구'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit43.lesson04.fill.003
  lesson_content_key: fr.a1.unit43.lesson04.se_reperer_a_la
  type: fill_in_blank
  frame:
    text: Où est la {item} d'attente ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_salle
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_salle
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 대합실은 어디에 있어요? salle는 '방, 실'이라는 뜻이에요.
    language_code: ko
    direction: ltr
