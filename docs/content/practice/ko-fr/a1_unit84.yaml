schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit84
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit84.parc_attractions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_amusante
    - w_file
    - w_haute
    - w_longue
    - w_minimale
    - w_montagnes
    - w_mètre
    - w_palpitantes
    - w_plan
    - w_roue
    - w_russes
    - w_théâtre
templates:
- content_key: practice.ko-fr.fr.a1.unit84.lesson01.choose.001
  lesson_content_key: fr.a1.unit84.lesson01.on_va_au_parc
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_amusante
        - w_montagnes
        - w_russes
        - w_palpitantes
        - w_file
        - w_longue
        - w_roue
        - w_haute
        - w_plan
        - w_minimale
        - w_mètre
        - w_théâtre
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어예요. ''오늘 놀이공원에 갈까요?'' 수업에 나왔어요.'
    language_code: ko
    direction: ltr
