templates:
- content_key: practice.ko-fr.fr.a1.unit09.lesson01.choose.001
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: À gauche와 à droite는 왼쪽에, 오른쪽에라는 뜻이에요. 명사 gauche와 droite는 여성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit09.lesson01.listen.002
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Au carrefour에서는 à와 le가 합쳐져 au가 돼요. 사거리에서라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit09.lesson01.match.003
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: matching_pairs
