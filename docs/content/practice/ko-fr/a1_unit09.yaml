      direction: ltr
  feedback_frame:
    text: Jusqu'au는 jusqu'à와 le가 합쳐진 형태로, 남성 장소 앞에서 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit09.lesson02.fill.004
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: fill_in_blank
  frame:
