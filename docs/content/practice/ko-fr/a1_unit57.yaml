schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit57
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit57.technologie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_appelle
    - w_appli
    - w_cherches
    - w_envoie
    - w_envoies
    - w_internet
    - w_lit
    - w_message
    - w_nommer
    - w_ordinateur
    - w_soleil
    - w_utiliser
templates:
- content_key: practice.ko-fr.fr.a1.unit57.lesson01.choose.001
  lesson_content_key: fr.a1.unit57.lesson01.telephone_ordinateur_et_internet
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_utiliser
        - w_ordinateur
        - w_internet
        - w_appli
        - w_message
        - w_envoies
        - w_envoie
        - w_lit
        - w_cherches
        - w_soleil
        - w_nommer
        - w_appelle
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''전화, 컴퓨터, 인터넷'' 수업에서 배워요.'
    language_code: ko
    direction: ltr
