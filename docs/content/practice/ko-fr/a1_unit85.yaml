schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit85
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit85.theatre
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_acteurs
    - w_bonnes
    - w_entracte
    - w_géniaux
    - w_pièce
    - w_places
    - w_rideau
    - w_satisfait
    - w_spectacle
templates:
- content_key: practice.ko-fr.fr.a1.unit85.lesson01.choose.001
  lesson_content_key: fr.a1.unit85.lesson01.on_va_au_theatre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_spectacle
        - w_rideau
        - w_acteurs
        - w_pièce
        - w_entracte
        - w_bonnes
        - w_places
        - w_satisfait
        - w_géniaux
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이번 단원의 단어예요. ''오늘 극장에 갈까요?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit85.lesson02.listen.001
  lesson_content_key: fr.a1.unit85.lesson02.la_scene_et_le
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이번 단원의 단어예요. ''무대와 커튼'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit85.lesson03.translate.001
  lesson_content_key: fr.a1.unit85.lesson03.les_acteurs_et_le
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이번 단원의 단어예요. ''배우와 매표소'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit85.lesson04.match.001
  lesson_content_key: fr.a1.unit85.lesson04.le_programme_du_spectacle
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 프랑스어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit85.lesson05.choose.001
  lesson_content_key: fr.a1.unit85.lesson05.au_guichet_du_theatre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이번 단원의 단어예요. ''극장 매표소에서'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit85.lesson06.translate.001
  lesson_content_key: fr.a1.unit85.lesson06.nina_entend_parler_du
  type: translation
  frame:
