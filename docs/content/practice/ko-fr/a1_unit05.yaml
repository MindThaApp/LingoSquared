    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Délicieux와 rouge는 명사를 꾸미는 말이고, avez, choisi, donné는 동사 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson03.order.004
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: word_order
  frame:
    text: Je voudrais une {item}, s'il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais une {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Une는 salade, boisson처럼 여성 명사 앞에 와요.
    language_code: ko
    direction: ltr
