  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rouge, délicieux, 그리고 동사 형태 avez, choisi, donné는 모두 카페 장면에 나와요.
    language_code: ko
    direction: ltr
