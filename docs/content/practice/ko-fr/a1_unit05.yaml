templates:
- content_key: practice.ko-fr.fr.a1.unit05.lesson01.choose.001
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le poulet, le poisson, le riz, le vin은 남성이고 la salade은 여성이에요. l'eau는 eau 앞에서 관사의 모음이 생략된 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson01.listen.002
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Café는 음료와 장소를 둘 다 뜻해요. 어느 쪽인지는 문맥으로 알 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson01.match.003
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '용기를 나타내는 말 뒤에서는 관사 없이 de만 써요: un verre de vin, un verre d''eau.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson01.translate.004
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '메뉴에 나오는 음식과 음료예요. 명사마다 관사를 함께 외워 두세요: le vin, la salade.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson02.choose.001
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vous avez choisi?는 웨이터가 결정하셨냐고 물을 때 쓰는 말이에요. avez choisi는 과거 형태로, 직역하면 '골랐다'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson02.order.002
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: word_order
  frame:
    text: Je voudrais un {item}, s'il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Un은 café, dessert, verre처럼 남성 명사 앞에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson02.order.003
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: word_order
  frame:
    text: Qu'est-ce que vous avez comme {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce que vous avez comme {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: '여기서 Comme는 ''~으로''라는 뜻이에요: 디저트로는 뭐가 있어요?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson02.fill.004
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: Vous {item} choisi ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vous avez choisi?는 vous를 쓴 웨이터의 공손한 질문이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson02.fill.005
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: C'est {item} ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: c'est가 특정하지 않은 것을 가리키기 때문에 délicieux는 남성 단수형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson02.fill.006
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: '{item}, s''il vous plaît. ({hint})'
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: L'addition은 계산서를 달라고 할 때 쓰는 말이에요. l'는 모음 앞에서 줄어든 관사 le/la예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson02.translate.007
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: translation
  frame:
    text: 커피 한 잔 주세요. (격식체)
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je voudrais un café, s'il vous plaît는 가장 기본적인 공손한 주문 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson02.translate.008
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: translation
  frame:
    text: 맛있어요!
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est délicieux!는 요리사나 음식에 건네는 칭찬이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson03.choose.001
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Rouge는 남성 명사와 여성 명사에 같은 형태를 써요: un verre de vin rouge, 레드 와인 한 잔.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit05.lesson03.listen.002
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cette는 여성 명사 앞에 써요(cette salade). 남성 명사 앞에서는 ce를 써요.
    language_code: ko
    direction: ltr
