  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: translation
  frame:
    text: 워크숍 때문에 우리는 배가 고파졌어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id018
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier nous a {item} faim.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Donner faim은 관용 표현이에요. 직역하면 '워크숍이 우리에게 배고픔을 주었다'예요.
    language_code: ko
    direction: ltr
