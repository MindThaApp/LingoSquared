templates:
- content_key: practice.ko-fr.fr.a1.unit04.lesson01.choose.001
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marché와 prix는 남성 명사(le marché, le prix)이고 boulangerie는 여성 명사(la boulangerie)예요. 명사는 관사와 함께 외워요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson01.listen.002
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '시장 어휘 중에는 양 뒤에 de와 함께 쓰는 음식 명사가 많아요: un kilo de tomates, un litre de lait.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson01.match.003
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '무게와 단위 뒤에는 음식 앞에 de를 써요: un kilo de tomates, un litre de lait.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson01.order.004
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: word_order
  frame:
    text: Les {item} sont chers aujourd'hui.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Les {item} sont chers aujourd'hui.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Chers는 légumes와 fruits가 남성 복수 명사라서 남성 복수형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson01.fill.005
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: fill_in_blank
  frame:
    text: La {item} est fermée aujourd'hui. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fermée는 boulangerie가 여성 명사라서 -ée로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson01.translate.006
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '프랑스어에서는 명사를 관사와 함께 외워요: le marché, le prix, la boulangerie.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson02.choose.001
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Euro는 복수에서 -s가 붙지만(euros) s는 발음되지 않아서, 어미보다 숫자가 들려요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson02.choose.002
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chers는 cher의 복수형이에요. 형용사는 les légumes 같은 복수 명사에 맞춰 -s를 붙여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson02.order.003
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: Je voudrais un kilo de {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je voudrais는 무언가를 부탁할 때 쓰는 공손한 표현이에요. un kilo de + 명사로 양을 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson02.order.004
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: C'est combien le {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien?은 물건 하나의 가격을 물어요. le는 그 명사가 남성임을 보여 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson02.fill.005
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Combien ça {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Combien ça coûte?는 얼마인지 묻는 말로, 어떤 물건 하나에든 쓸 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson02.fill.006
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Je {item} un kilo de tomates, s'il vous plaît. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Je voudrais는 je veux보다 공손해요. 주문할 때 je veux는 퉁명스럽게 들릴 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson02.translate.007
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cher는 명사에 맞춰 형태가 바뀌어요: cher(남성 단수), chers(남성 복수).'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson02.translate.008
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: '{item} 1킬로그램 주세요. (격식)'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: S'il vous plaît는 공손하게 '부탁드려요'라고 하는 말이에요. 친구에게는 s'il te plaît라고 할 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson02.translate.009
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: 빵은 얼마예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien le pain?은 물건 하나의 가격을 물어요. 대답은 유로 금액으로 시작해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson03.choose.001
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Voilà는 무언가를 건네거나 가리킬 때 하는 말이에요: 여기 있어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson03.match.002
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id016
    second: *id016
    third: *id016
    fourth: *id016
    fifth: *id016
    sixth: *id016
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Fermée는 la boulangerie를 꾸며서 여성형이에요. 남성 명사라면 fermé가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit04.lesson03.fill.003
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: fill_in_blank
  frame:
    text: On peut {item} du pain ici aussi. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'peut(할 수 있다) 뒤에서 다음 동사는 기본형 그대로 써요: on peut acheter.'
    language_code: ko
    direction: ltr
