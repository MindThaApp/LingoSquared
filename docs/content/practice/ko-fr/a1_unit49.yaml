- content_key: practice.ko-fr.fr.a1.unit49.lesson01.translate.004
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: translation
  frame:
    text: 저는 화가 나요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_colère
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis en {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: '저는 화가 나요. colère: 분노.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson03.order.002
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: word_order
  frame:
    text: Je suis {item} avant mon premier service.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nerveux
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item} avant mon premier service.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: '저는 첫 근무 때문에 긴장돼요. nerveux: 긴장한 (남성형).'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson03.fill.003
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: fill_in_blank
  frame:
    text: Salut Mathieu, tu te sens comment avant ton premier {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 안녕 마티외, 첫 근무를 앞두고 기분이 어때? Avant ton premier service(첫 근무 전)는 3과의 avant + 명사 패턴을 다시 쓴 거예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson04.order.002
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: word_order
  frame:
    text: Comment se {item} Mathieu ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sent
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment se {item} Mathieu ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 마티외는 기분이 어때요? Se sentir(느끼다, 대명동사)는 감정 상태를 묻거나 말할 때 쓰는 기본 표현이고, 건강 단원에도 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson05.order.002
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: word_order
  frame:
    text: Oui, je {item} aussi.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pense
  answer_derivation:
    kind: render_frame
    frame:
      text: Oui, je {item} aussi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 네, 저도 그렇게 생각해요. Je pense aussi는 상대의 의견에 동의할 때 쓰는 자연스러운 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson06.order.002
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: word_order
  frame:
    text: Je suis un peu nerveux, {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_honnêtement
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis un peu nerveux, {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 저는 솔직히 조금 긴장돼요. Honnêtement(솔직히)는 속마음을 말할 때 표현을 부드럽게 해 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson06.fill.003
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: fill_in_blank
  frame:
    text: Ne t'inquiète pas, tu {item} y arriver ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '걱정하지 마, 잘 해낼 수 있어! Tu vas y arriver(직역: ''너는 거기에 도달할 거야'')는 격려하는 고정 표현이고, aller + 동사원형은 근접미래를 만들어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson06.translate.004
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: 고마워요, 정말 도움이 돼요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_vraiment
  answer_derivation:
    kind: render_frame
    frame:
      text: Merci, ça m'aide {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 고마워요, 정말 도움이 돼요. Aide는 aider(돕다)의 il/elle 형태이고, m'는 me를 뜻해요.
    language_code: ko
    direction: ltr
