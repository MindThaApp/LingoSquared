schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit49
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit49.emotions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_arriver
    - w_colère
    - w_content
    - w_fier
    - w_honnêtement
    - w_nerveux
    - w_nouveau
    - w_pense
    - w_pourquoi
    - w_remplace
    - w_sent
    - w_seras
    - w_service
    - w_seul
    - w_sûrement
    - w_triste
    - w_vas
    - w_vraiment
templates:
- content_key: practice.ko-fr.fr.a1.unit49.lesson01.choose.001
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_content
        - w_triste
        - w_colère
        - w_pourquoi
        - w_nerveux
        - w_service
        - w_sent
        - w_seul
        - w_nouveau
        - w_pense
        - w_honnêtement
        - w_vas
        - w_arriver
        - w_vraiment
        - w_seras
        - w_sûrement
        - w_fier
        - w_remplace
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, '기쁨, 슬픔, 화남' 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson02.listen.001
  lesson_content_key: fr.a1.unit49.lesson02.pourquoi_es_tu_content
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, '왜 기뻐요?' 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson03.translate.001
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, '무언가 때문에 긴장돼요' 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson04.match.001
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 프랑스어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson05.choose.001
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
