    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, '감정에 관한 메시지 읽기' 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson06.translate.001
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, '카미유가 마티외를 안심시켜요' 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit49.lesson01.order.002
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: word_order
  frame:
    text: Je suis {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_content
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: '저는 기뻐요. content: 기쁜, 반가운 (남성형).'
    language_code: ko
    direction: ltr
