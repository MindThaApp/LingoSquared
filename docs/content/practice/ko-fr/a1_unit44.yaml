- content_key: practice.ko-fr.fr.a1.unit44.lesson01.order.002
  lesson_content_key: fr.a1.unit44.lesson01.je_ne_me_sens
  type: word_order
  frame:
    text: Je ne me {item} pas bien.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sens
  answer_derivation:
    kind: render_frame
    frame:
      text: Je ne me {item} pas bien.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 몸이 안 좋아요. Se sentir는 재귀동사(je me sens)이고, ne ... pas bien은 어딘가 좋지 않다고 가볍게 말하는 일반적인 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit44.lesson01.fill.003
  lesson_content_key: fr.a1.unit44.lesson01.je_ne_me_sens
