  type: word_order
  frame:
    text: Je peux vous {item} ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_aider
  answer_derivation:
    kind: render_frame
    frame:
      text: Je peux vous {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 무엇을 도와드릴까요? Je peux vous aider ?는 격식 있게 손님을 맞는 흔한 인사이고, vous는 존대하는 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit44.lesson04.fill.003
  lesson_content_key: fr.a1.unit44.lesson04.a_la_pharmacie
  type: fill_in_blank
  frame:
    text: Avez-vous {item} chose contre le mal de tête ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_quelque
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_quelque
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 두통에 좋은 약 있어요? Quelque chose contre + 증상은 약을 찾을 때 쓰는 자연스러운 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit44.lesson04.translate.004
