    frame:
      text: Je prends un {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 저는 알약을 먹어요. comprimé는 '알약'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit44.lesson06.order.002
  lesson_content_key: fr.a1.unit44.lesson06.camille_prend_des_nouvelles
  type: word_order
  frame:
    text: Tu as {item} un comprimé ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pris
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu as {item} un comprimé ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 알약을 먹었어요? Pris는 prendre의 과거분사로, avoir의 as와 함께 써서 tu as pris가 돼요.
    language_code: ko
    direction: ltr
