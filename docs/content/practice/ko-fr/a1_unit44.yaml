  frame:
    text: Je suis {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_malade
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_malade
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 저는 아파요. malade는 '아픈'이라는 뜻이에요.
    language_code: ko
    direction: ltr
