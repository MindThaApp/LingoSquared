schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit61
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit61.quartier
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_agréable
    - w_connaissent
    - w_connaît
    - w_connaître
    - w_longtemps
    - w_salue
    - w_saluer
    - w_supermarché
    - w_voisin
templates:
- content_key: practice.ko-fr.fr.a1.unit61.lesson01.choose.001
  lesson_content_key: fr.a1.unit61.lesson01.le_quartier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_agréable
        - w_supermarché
        - w_voisin
        - w_connaître
        - w_saluer
        - w_salue
        - w_longtemps
        - w_connaît
        - w_connaissent
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 동네에 관한 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
