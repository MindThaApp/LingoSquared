schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit60
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit60.menage
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aide
    - w_désordre
    - w_fini
    - w_lessive
    - w_ménage
    - w_passer
    - w_range
    - w_rangeons
    - w_ranger
    - w_ranges
    - w_vaisselle
    - w_volontiers
templates:
- content_key: practice.ko-fr.fr.a1.unit60.lesson01.choose.001
  lesson_content_key: fr.a1.unit60.lesson01.ranger
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_ranger
        - w_range
        - w_ranges
        - w_rangeons
        - w_désordre
        - w_passer
        - w_vaisselle
        - w_ménage
        - w_aide
        - w_lessive
        - w_fini
        - w_volontiers
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 정리하기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit60.lesson02.listen.001
  lesson_content_key: fr.a1.unit60.lesson02.le_desordre_et_l
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 어지러운 집과 청소기 돌리기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit60.lesson03.translate.001
  lesson_content_key: fr.a1.unit60.lesson03.tu_peux_aider
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 도와줄 수 있어요? 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit60.lesson04.match.001
  lesson_content_key: fr.a1.unit60.lesson04.camille_aide_mathieu_dimanche
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 프랑스어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit60.lesson05.choose.001
  lesson_content_key: fr.a1.unit60.lesson05.qui_fait_quoi_a
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 집에서 누가 무엇을 할까요? 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit60.lesson06.translate.001
  lesson_content_key: fr.a1.unit60.lesson06.l_appartement_est_fini
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 아파트 정리가 끝났어요 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit60.lesson01.order.002
  lesson_content_key: fr.a1.unit60.lesson01.ranger
  type: word_order
  frame:
    text: Je {item} l'appartement.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_range
  answer_derivation:
    kind: render_frame
    frame:
      text: Je {item} l'appartement.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 나는 아파트를 정리해요. range의 뜻은 '정리해요'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit60.lesson01.fill.003
  lesson_content_key: fr.a1.unit60.lesson01.ranger
  type: fill_in_blank
  frame:
    text: Nous {item} le désordre et Camille passe l'aspirateur dans le salon. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_rangeons
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_rangeons
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 우리는 어질러진 것을 정리하고 있고 Camille는 거실에서 청소기를 돌리고 있어요. rangeons의 뜻은 '우리가 정리해요'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit60.lesson02.order.002
  lesson_content_key: fr.a1.unit60.lesson02.le_desordre_et_l
  type: word_order
  frame:
    text: Il y a beaucoup de {item} après la fête.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_désordre
  answer_derivation:
    kind: render_frame
    frame:
      text: Il y a beaucoup de {item} après la fête.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 파티 뒤라서 집이 많이 어질러져 있어요. désordre의 뜻은 '엉망, 어질러진 상태'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit60.lesson03.order.002
  lesson_content_key: fr.a1.unit60.lesson03.tu_peux_aider
  type: word_order
  frame:
    text: Tu peux m'aider à faire la {item} ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_vaisselle
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu peux m'aider à faire la {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 설거지하는 것 좀 도와줄 수 있어요? vaisselle의 뜻은 '설거지감, 그릇'이에요.
    language_code: ko
    direction: ltr
