    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vendredi는 금요일이에요. 요일 이름은 남성이고 소문자로 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson01.match.003
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Libre와 occupé는 '한가한'과 '바쁜'을 뜻하는, 서로 반대되는 형용사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson01.order.004
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: word_order
  frame:
    text: Tu viens me {item} vers dix-huit heures ?
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu viens me {item} vers dix-huit heures ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Venir chercher quelqu'un은 '누군가를 데리러 오다'라는 뜻이고, chercher는 동사원형 그대로 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson01.order.005
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: word_order
  frame:
    text: Ça te dit de {item} les courses ensemble ?
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Ça te dit de {item} les courses ensemble ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ça te dit de 뒤에 동사원형을 쓰면 함께 무언가를 하자는 제안이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson01.fill.006
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: fill_in_blank
  frame:
    text: Je suis {item} vendredi soir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Occupé는 남성형이에요. 여성이 말할 때는 occupée라고 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson01.fill.007
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: fill_in_blank
  frame:
    text: Devant le marché, {item} soir ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vendredi soir는 금요일 저녁이라는 뜻이에요. 요일 앞에는 관사나 전치사가 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson01.translate.008
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: translation
  frame:
    text: 토요일에 시간 있어요? (친구에게, tu)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu es {item} samedi ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu es libre?는 친구에게 시간이 되는지 묻는 말이에요. samedi 앞에는 전치사가 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson01.translate.009
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Libre는 남성형과 여성형이 같고, occupé는 남성형, occupée는 여성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson02.choose.001
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ne는 부정문의 앞부분이고, 뒷부분인 pas는 동사 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson02.listen.002
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Avec plaisir는 초대를 따뜻하게 받아들이는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson02.match.003
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Devant은 '~ 앞에'라는 뜻으로, 만날 장소를 말할 때 자주 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson02.order.004
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: word_order
  frame:
    text: Avec {item} !
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Avec {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avec plaisir는 '기꺼이'라는 뜻으로, 공손하게 승낙하는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson02.fill.005
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: fill_in_blank
  frame:
    text: Je {item} peux pas, je suis occupé. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Je ne peux pas는 부정문이에요. ne는 동사 앞에, pas는 동사 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson02.translate.006
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: translation
  frame:
    text: 시장 앞에서 만나요. (on 사용)
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: On se retrouve {item} le marché.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Devant은 '~ 앞에', on se retrouve는 '우리 만나요'라는 뜻이에요.
    language_code: ko
    direction: ltr
