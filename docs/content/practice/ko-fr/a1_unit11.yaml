templates:
- content_key: practice.ko-fr.fr.a1.unit11.lesson01.choose.001
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Faire les courses는 '장을 보러 가다'라는 뜻이고, courses는 복수형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit11.lesson01.listen.002
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
