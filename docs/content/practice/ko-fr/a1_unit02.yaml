templates:
- content_key: practice.ko-fr.fr.a1.unit02.lesson01.choose.001
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 0부터 16까지는 각각 하나의 단어이고, 17부터 19까지는 dix-sept(10-7)처럼 조각을 합쳐서 만들어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson01.translate.002
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 철자에 주의하세요. zéro에는 악센트가 있고, trente-quatre 같은 복합 수는 하이픈으로 연결해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson02.choose.001
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 70부터는 체계가 바뀌어요. soixante-dix는 '60+10', quatre-vingts는 '4×20'이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson02.listen.002
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 0부터 16까지는 각각 별개의 단어이고, 십의 자리는 vingt, trente, soixante로 나타내요. 나머지는 이들을 조합해서 만들어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson02.match.003
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Quatre-vingts는 끝에 s가 붙지만, 뒤에 다른 수가 오면 s가 빠져요: quatre-vingt-dix.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson03.choose.001
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Quel âge as-tu?는 나이를 묻는 말이에요. 프랑스어는 '몇 살이다'가 아니라 '몇 해를 가지고 있다'라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson03.order.002
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: J'ai {n} ans.
    language_code: fr
    direction: ltr
  slots:
    n: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {n} ans.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 프랑스어는 나이를 '몇 살이다'가 아니라 '몇 해를 가지고 있다'(j'ai ... ans)라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson03.fill.003
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: fill_in_blank
  frame:
    text: Quel âge {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quel âge as-tu?는 친근한 말투예요. 낯선 사람에게는 quel âge avez-vous?라고 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson03.translate.004
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: 저는 {n}살이에요.
    language_code: ko
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {n} ans.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 프랑스어는 나이를 말할 때 avoir(가지다)를 써요. j'ai vingt-huit ans은 문자 그대로 '나는 스물여덟 해를 가지고 있다'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson03.translate.005
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: 몇 살이야? (친한 사이)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quel âge as-tu?는 tu를 써요. 친구, 가족, 또래에게만 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson03.translate.006
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: 연세가 어떻게 되세요?
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quel âge avez-vous?는 vous를 써요. 낯선 사람에게나 예의를 갖춰야 하는 상황에서 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson04.choose.001
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: S'il te plaît는 친근한 말투의 '부탁해요', s'il vous plaît는 격식 있는 말투예요. tu와 vous의 구분과 같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson04.fill.002
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
  type: fill_in_blank
  frame:
    text: Quel est ton {item} de téléphone ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ton은 친근한 말투의 '너의'예요. 낯선 사람에게는 quel est votre numéro de téléphone?라고 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson05.listen.001
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Œufs는 복수예요. 복수에서는 œuf의 f가 발음되지 않아서 단수와 소리가 달라요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson05.match.002
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '프랑스어에서 양은 de로 나타내요: deux tasses de farine, une demi-tasse de sucre.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson05.order.003
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: word_order
  frame:
    text: J'ai besoin de {n} œufs.
    language_code: fr
    direction: ltr
  slots:
    n: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai besoin de {n} œufs.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avoir besoin de + 명사는 '필요하다'라는 뜻이에요. 수는 de와 명사 사이에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson05.translate.004
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 단어들 중 많은 수가 tasses de farine처럼 양 뒤에서 de와 함께 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit02.lesson06.fill.001
  lesson_content_key: fr.a1.unit02.lesson06.recipe_count_dialogue
  type: fill_in_blank
  frame:
    text: Tu {item} aussi besoin de sucre ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tu as는 친근한 말투의 '너는 가지고 있다'예요. 격식 있는 형태는 vous avez예요.
    language_code: ko
    direction: ltr
