templates:
- content_key: practice.ko-fr.fr.a1.unit14.lesson01.choose.001
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Meilleur는 bon의 불규칙 비교급이에요. meilleur라고 말하고, plus bon이라고는 절대 하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson01.listen.002
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Difficile와 facile은 남성형과 여성형이 같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson01.order.004
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: word_order
  frame:
    text: Moi, je trouve {item} aussi bon.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Moi, je trouve {item} aussi bon.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: L'autre는 '다른 하나'를, aussi bon은 '똑같이 좋은'을 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson01.fill.006
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: fill_in_blank
  frame:
    text: Cette recette est moins {item} que l'autre. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Difficile는 여성형에서 형태가 변하지 않아서 recette와 어울려요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson01.fill.007
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: fill_in_blank
  frame:
    text: Ce gâteau est {item} que le premier. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Meilleur que는 '~보다 더 좋은'이라는 뜻이고, plus bon을 대신해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson01.translate.008
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: translation
  frame:
    text: 이 치즈는 다른 치즈보다 더 비싸요.
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce fromage est plus cher que {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Que는 비교의 두 번째 대상을 이끌고, l'autre는 다른 치즈를 가리켜요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson02.choose.001
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Irrégulier는 meilleur처럼 일반적인 규칙을 따르지 않는 형태라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson02.listen.002
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Adjectif는 '형용사', irrégulier는 '불규칙한'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson02.order.003
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: word_order
  frame:
    text: Comparons les prix avant {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Comparons les prix avant {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avant de 뒤에 동사원형이 오면 '~하기 전에'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson02.fill.004
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: fill_in_blank
  frame:
    text: La quiche est moins {item} que la tarte. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Chère는 quiche에 맞춰 여성형 -e가 붙은 형태예요. 남성 명사에는 cher를 써요: le fromage est moins cher.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson02.translate.005
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: translation
  frame:
    text: 가장 덜 비싼 요리법이에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est la recette la moins {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: La moins chère는 la moins 뒤에 여성형 형용사를 붙인 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson03.choose.001
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Celui-ci는 '이것', celui-là는 '저것'이라는 뜻이고, 둘 다 남성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson03.listen.002
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Celui-ci와 celui-là는 -ci와 -là만 달라요. 각각 '여기'와 '저기'를 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson03.order.004
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: word_order
  frame:
    text: Lequel on {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Lequel on {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Lequel on prend ?는 구어체예요. lequel은 '어느 것'을 묻고, on은 '우리'를 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson03.fill.006
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: fill_in_blank
  frame:
    text: Il y a deux {item} de fromage. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sortes는 deux 뒤라서 복수이고, 그 뒤에 de가 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson03.fill.007
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: fill_in_blank
  frame:
    text: Il nous {item} plus d'argent pour le dessert. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il nous reste는 '우리에게 남아 있다'라는 뜻이에요. 여기서 reste는 비인칭으로 쓰였어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson03.translate.008
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: translation
  frame:
    text: 그럼 저걸로 해요. 워크숍에 가장 좋은 선택이에요. (on을 사용하세요)
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Alors on prend {item}, c'est la meilleure option pour l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Celui-là는 '저것'이라는 뜻이고, option이 여성 명사라서 meilleure도 여성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit14.lesson03.translate.009
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: translation
  frame:
    text: 맞아요.
    language_code: ko
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est vrai는 동의할 때 흔히 쓰는 표현이에요.
    language_code: ko
    direction: ltr
