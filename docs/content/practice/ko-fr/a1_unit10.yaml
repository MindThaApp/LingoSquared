templates:
- content_key: practice.ko-fr.fr.a1.unit10.lesson01.choose.001
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Avant는 '~전에'라는 뜻이고, d'abord는 순서의 처음에 쓰는 '먼저'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson01.listen.002
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'S''habiller는 재귀동사예요: je m''habille, tu t''habilles. je와 함께 쓰면 s''가 m''로 바뀌어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson01.match.003
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 여러 일과 동사는 재귀동사예요(se réveiller, s'habiller). prendre, quitter 같은 나머지 동사는 그렇지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson01.order.004
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: word_order
  frame:
    text: Je {item} la maison à neuf heures.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Je {item} la maison à neuf heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quitter la maison은 '집을 나서다'라는 뜻이에요. je와 함께 쓰면 동사는 quitte가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson01.fill.005
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: fill_in_blank
  frame:
    text: Je prends une {item} le matin. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Prendre une douche는 '샤워하다'를 뜻하는 일반적인 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson01.translate.007
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: translation
  frame:
    text: 저는 아침 식사 전에 옷을 입어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je m'habille avant le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m'habille에서는 모음 소리 앞이라 재귀대명사 m'를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson02.choose.001
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tard는 '늦게', puis는 '그다음에'라는 뜻으로, 일과의 단계를 이을 때 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson02.listen.002
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vingt-trois는 23이에요. 프랑스어 시각은 24시간제를 쓸 수 있어서 vingt-trois heures는 밤 11시예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson02.match.003
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Rentrer, dîner, coucher는 동사원형이에요. je와 nous 형태에서는 어미가 바뀌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson02.fill.005
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: fill_in_blank
  frame:
    text: Je {item} à la maison après le travail. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rentre는 je 형태이고, rentrer는 '집에 돌아가다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson02.translate.007
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: 우리는 토요일 저녁마다 함께 저녁을 먹어요. (nous 사용)
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Nous {item} ensemble le samedi soir.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Nous dînons는 nous 형태이고, ensemble는 '함께'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson02.translate.008
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: 저는 밤 11시(23:00)쯤 자요.
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Je me {item} vers vingt-trois heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Vers는 대략적인 시각을 나타내고, vingt-trois heures는 24시간제를 쓴 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson03.choose.001
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu fais quoi ?는 무엇을 하는지 묻는 편한 표현이에요. quoi가 동사 뒤에서 que를 대신해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson03.listen.002
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je me repose는 '저는 쉬어요'라는 뜻이고, repose는 se reposer의 je 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson03.order.004
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: word_order
  frame:
    text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je vais는 aller의 je 형태이고, au는 à + le예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson03.fill.005
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: fill_in_blank
  frame:
    text: Je me {item} avant l'atelier du soir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se reposer는 재귀동사라서 je와 함께 쓰면 me가 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson03.translate.006
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: '토요일마다 워크숍 전에 뭐 해요? (친근하게: Tu fais로 시작)'
    language_code: ko
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu fais {item} le samedi avant l'atelier ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu fais quoi ?는 상대가 무엇을 하는지 묻는 친근한 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit10.lesson03.translate.007
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: '몇 시에 집에 와요? (친근하게: Tu로 시작)'
    language_code: ko
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu {item} à quelle heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Rentres는 tu 형태이고, à quelle heure는 시각을 물을 때 써요.
    language_code: ko
    direction: ltr
