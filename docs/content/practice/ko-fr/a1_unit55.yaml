  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) Camille와 Léa의 운동 이야기 수업에서 나온 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit55.lesson06.translate.001
