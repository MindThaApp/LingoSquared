schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit55
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit55.sport
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_adorer
    - w_bouger
    - w_corrects
    - w_courir
    - w_course
    - w_court
    - w_doucement
    - w_façon
    - w_football
    - w_français
    - w_fréquence
    - w_grâce
    - w_leçon
    - w_nage
    - w_nager
    - w_natation
    - w_nomme
    - w_parc
    - w_pratiques
    - w_presque
    - w_proposer
    - w_précise
    - w_précédente
    - w_yoga
templates:
- content_key: practice.ko-fr.fr.a1.unit55.lesson01.choose.001
  lesson_content_key: fr.a1.unit55.lesson01.football_yoga_course_a
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_football
        - w_yoga
        - w_course
        - w_natation
        - w_pratiques
        - w_façon
        - w_précise
        - w_fréquence
        - w_grâce
        - w_leçon
        - w_nomme
        - w_corrects
        - w_français
        - w_adorer
        - w_nager
        - w_parc
        - w_courir
        - w_court
        - w_bouger
        - w_doucement
        - w_nage
        - w_presque
        - w_précédente
        - w_proposer
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 축구, 요가, 달리기, 수영을 다룬 수업에서 나온 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit55.lesson02.listen.001
  lesson_content_key: fr.a1.unit55.lesson02.a_quelle_frequence_tu
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) ''얼마나 자주 운동해요?'' 수업에서 나온 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit55.lesson03.translate.001
  lesson_content_key: fr.a1.unit55.lesson03.faire_du_sport_et
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 운동하기와 좋아하는 운동을 다룬 수업에서 나온 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit55.lesson04.match.001
  lesson_content_key: fr.a1.unit55.lesson04.mathieu_pose_des_questions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 프랑스어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit55.lesson05.choose.001
  lesson_content_key: fr.a1.unit55.lesson05.camille_et_lea_parlent
  type: multiple_choice
