templates:
- content_key: practice.ko-fr.fr.a1.unit13.lesson01.choose.001
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Préférer, aimer, détester는 좋아하는 것과 싫어하는 것을 표현하는 주요 동사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson01.listen.002
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Épices는 복수형이에요. 마지막 -s는 발음하지 않으니 épice와 소리가 똑같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson01.order.004
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: word_order
  frame:
    text: J'aime {item} les plats salés que les plats sucrés.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: J'aime {item} les plats salés que les plats sucrés.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Aimer mieux는 '더 좋아하다'라는 뜻이고, que는 덜 좋아하는 대상을 이끌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson01.fill.006
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: fill_in_blank
  frame:
    text: Mathieu {item} les épices trop fortes. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Déteste는 détester의 il 형태로, Mathieu에 맞춘 거예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson01.translate.008
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: translation
  frame:
    text: 저는 초콜릿 타르트를 더 좋아해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je préfère la {item} au chocolat.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Au는 à와 le가 합쳐진 형태예요. Au chocolat는 타르트의 맛을 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson01.translate.009
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tarte, chocolat, épices, plats는 취향 수업에 나온 음식 이름이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson02.choose.001
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ou는 '또는'이고, où(악센트 있음)는 '어디'라는 뜻이에요. 악센트가 의미를 구별해 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson02.listen.002
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pourrait는 pouvoir의 조건법으로, 정중하게 제안할 때 써요: on pourrait.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson02.order.004
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: word_order
  frame:
    text: Tu aimes plutôt le sucré {item} le salé ?
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu aimes plutôt le sucré {item} le salé ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ou는 두 선택지를 이어 줘요. Sucré ou salé는 '단 것 또는 짭짤한 것'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson02.fill.006
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: fill_in_blank
  frame:
    text: Ça ne me {item} pas. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ça ne me dérange pas는 '저는 상관없어요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson02.translate.007
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: translation
  frame:
    text: 뭐가 더 좋아요? (친근한 말투, qu'est-ce que 사용)
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce que tu {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu préfères는 préférer의 tu 형태예요. 공손한 형태는 vous préférez예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson03.choose.001
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sucrée와 salée 끝에 -e가 붙는 건 tarte와 quiche가 여성 명사이기 때문이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson03.listen.002
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sucrée와 salée는 여성형이며, 끝의 -e는 발음하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson03.match.003
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Sucrée와 salée는 여성 명사인 tarte와 quiche를 꾸며 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson03.order.004
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: word_order
  frame:
    text: Parfait, une tarte sucrée et une quiche {item} pour samedi.
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, une tarte sucrée et une quiche {item} pour samedi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Salée는 quiche에 맞춰 여성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson03.fill.005
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: fill_in_blank
  frame:
    text: Je préfère la tarte, plutôt {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sucrée는 tarte에 맞춰 여성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson03.translate.006
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: translation
  frame:
    text: 우리 토요일에 뭘 만들어요? (on 사용)
    language_code: ko
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce qu'on {item} samedi ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: On prépare는 '우리가 만들고 있다'를 말할 때 구어에서 흔히 쓰는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit13.lesson03.translate.007
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: translation
  frame:
    text: 저는 타르트보다 키슈가 더 좋아요.
    language_code: ko
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Je préfère la {item} à la tarte.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Préférer A à B는 'B보다 A를 더 좋아하다'라는 뜻이에요. à la가 둘을 이어 줘요.
    language_code: ko
    direction: ltr
