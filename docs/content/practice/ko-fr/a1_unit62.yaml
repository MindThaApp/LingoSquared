schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit62
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit62.poste
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_achète
    - w_arrivent
    - w_colis
    - w_désirez
    - w_employé
    - w_lettre
    - w_met
    - w_mettre
    - w_timbre
    - w_écrire
templates:
- content_key: practice.ko-fr.fr.a1.unit62.lesson01.choose.001
  lesson_content_key: fr.a1.unit62.lesson01.la_lettre_et_le
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_lettre
        - w_colis
        - w_timbre
        - w_écrire
        - w_arrivent
        - w_mettre
        - w_met
        - w_employé
        - w_désirez
        - w_achète
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 편지와 소포 수업에 나온 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit62.lesson02.listen.001
  lesson_content_key: fr.a1.unit62.lesson02.le_timbre_l_adresse
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 우표, 주소, 쓰기 수업에 나온 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit62.lesson03.translate.001
  lesson_content_key: fr.a1.unit62.lesson03.arriver_et_mettre_du
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 도착하다와 시간이 걸리다 수업에 나온 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit62.lesson04.match.001
  lesson_content_key: fr.a1.unit62.lesson04.a_la_poste
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 프랑스어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit62.lesson05.choose.001
  lesson_content_key: fr.a1.unit62.lesson05.camille_envoie_un_colis
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 카미유가 소포를 보내는 수업에 나온 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit62.lesson01.translate.002
  lesson_content_key: fr.a1.unit62.lesson01.la_lettre_et_le
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 편지와 소포 수업에 나온 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit62.lesson01.order.003
  lesson_content_key: fr.a1.unit62.lesson01.la_lettre_et_le
  type: word_order
  frame:
    text: J'ai une {item} pour mon grand-père.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_lettre
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai une {item} pour mon grand-père.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 할아버지께 드릴 편지가 있어요. lettre는 '편지'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit62.lesson01.fill.004
  lesson_content_key: fr.a1.unit62.lesson01.la_lettre_et_le
  type: fill_in_blank
  frame:
    text: J'envoie un {item} à Marseille. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_colis
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_colis
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 마르세유에 소포를 보내요. colis는 '소포'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit62.lesson02.order.002
  lesson_content_key: fr.a1.unit62.lesson02.le_timbre_l_adresse
  type: word_order
  frame:
    text: J'achète un {item} pour la lettre.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_timbre
  answer_derivation:
    kind: render_frame
    frame:
      text: J'achète un {item} pour la lettre.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 편지에 붙일 우표를 사요. timbre는 '우표'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit62.lesson03.order.002
  lesson_content_key: fr.a1.unit62.lesson03.arriver_et_mettre_du
  type: word_order
  frame:
    text: La lettre {item} trois jours.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_met
  answer_derivation:
    kind: render_frame
    frame:
      text: La lettre {item} trois jours.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 편지는 사흘 걸려요. met는 '(시간이) 걸려요'라는 뜻이에요.
    language_code: ko
    direction: ltr
