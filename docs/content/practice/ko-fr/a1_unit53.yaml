schema_version: '1.0'
pack_key: practice.ko-fr.a1.unit53
source_language: ko
target_language: fr
unit_content_key: fr.a1.unit53.apparence
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_bleus
    - w_blonds
    - w_bruns
    - w_cheveux
    - w_courts
    - w_différents
    - w_gris
    - w_générale
    - w_impression
    - w_jeune
    - w_langues
    - w_longs
    - w_modèle
    - w_noirs
    - w_nouvelle
    - w_personne
    - w_pluriel
    - w_possédé
    - w_précis
    - w_ravi
    - w_reconnaître
    - w_rencontrer
    - w_ressemblent
    - w_verts
    - w_vient
    - w_vieux
    - w_yeux
templates:
- content_key: practice.ko-fr.fr.a1.unit53.lesson01.choose.001
  lesson_content_key: fr.a1.unit53.lesson01.grand_petit_vieux_et
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_vieux
        - w_jeune
        - w_précis
        - w_impression
        - w_générale
        - w_cheveux
        - w_courts
        - w_noirs
        - w_blonds
        - w_bruns
        - w_gris
        - w_longs
        - w_pluriel
        - w_yeux
        - w_possédé
        - w_personne
        - w_bleus
        - w_verts
        - w_nouvelle
        - w_vient
        - w_langues
        - w_reconnaître
        - w_ressemblent
        - w_différents
        - w_modèle
        - w_ravi
        - w_rencontrer
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 키가 크다, 작다, 나이가 많다, 어리다를 배우는 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit53.lesson02.listen.001
  lesson_content_key: fr.a1.unit53.lesson02.decrire_les_cheveux
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 머리카락 묘사를 배우는 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit53.lesson03.translate.001
  lesson_content_key: fr.a1.unit53.lesson03.les_yeux_et_comment
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 눈과 어떻게 생겼는지 묻기를 배우는 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit53.lesson04.match.001
  lesson_content_key: fr.a1.unit53.lesson04.camille_decrit_nina
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 프랑스어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit53.lesson05.choose.001
  lesson_content_key: fr.a1.unit53.lesson05.comparer_thomas_et_lea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 토마와 레아 비교하기를 배우는 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit53.lesson06.translate.001
  lesson_content_key: fr.a1.unit53.lesson06.mathieu_reconnait_nina
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
