  feedback_frame:
    text: '{item}은(는) 마티외가 니나를 알아보는 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fr.fr.a1.unit53.lesson01.order.002
  lesson_content_key: fr.a1.unit53.lesson01.grand_petit_vieux_et
  type: word_order
  frame:
    text: Mon grand-père est {item}.
    language_code: fr
    direction: ltr
  slots:
