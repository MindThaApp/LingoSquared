      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_vieux
  answer_derivation:
    kind: render_frame
    frame:
      text: Mon grand-père est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 할아버지는 나이가 많으세요. vieux는 '나이 많은'(남성형)이라는 뜻이에요.
    language_code: ko
    direction: ltr
