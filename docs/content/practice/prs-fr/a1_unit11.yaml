templates:
- content_key: practice.prs-fr.fr.a1.unit11.lesson01.choose.001
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Faire les courses یعنی برای مواد خوراکی خریداری رفتن؛ courses جمع است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson01.listen.002
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vendredi یعنی جمعه؛ روزهای هفته مذکر استند و با حرف کوچک نوشته می‌شوند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson01.match.003
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Libre و occupé دو صفت متضاد برای فارغ بودن و مصروف بودن استند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson01.order.004
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: word_order
  frame:
    text: Tu viens me {item} vers dix-huit heures ?
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu viens me {item} vers dix-huit heures ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Venir chercher quelqu'un یعنی آمدن برای بردن کسی؛ chercher به شکل مصدر می‌ماند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson01.order.005
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: word_order
  frame:
    text: Ça te dit de {item} les courses ensemble ?
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Ça te dit de {item} les courses ensemble ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ça te dit de با یک مصدر، پیشنهاد انجام کاری باهم است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson01.fill.006
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: fill_in_blank
  frame:
    text: Je suis {item} vendredi soir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Occupé مذکر است؛ یک زن occupée می‌نویسد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson01.fill.007
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: fill_in_blank
  frame:
    text: Devant le marché, {item} soir ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vendredi soir یعنی جمعه شب؛ روز به حرف تعریف یا حرف اضافه ضرورت ندارد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson01.translate.008
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: translation
  frame:
    text: روز شنبه فارغ استی؟ (غیررسمی، tu)
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu es {item} samedi ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu es libre? را دوستی می‌پرسد که آیا وقت داری؛ samedi حرف اضافه نمی‌خواهد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson01.translate.009
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Libre برای هر دو جنس یک شکل دارد؛ occupé مذکر و occupée مؤنث است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson02.choose.001
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ne نیمهٔ اول منفی است؛ نیمهٔ دوم، یعنی pas، بعد از فعل می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson02.listen.002
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Avec plaisir راه گرم و مهربانانه برای قبول کردن دعوت است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson02.match.003
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
