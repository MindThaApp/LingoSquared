    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Devant یعنی «پیش روی» و اکثراً برای گفتن جای دیدار استفاده می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson02.order.004
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: word_order
  frame:
    text: Avec {item} !
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Avec {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avec plaisir یعنی «با خوشی» و یک «بلی» مؤدبانه است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson02.fill.005
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: fill_in_blank
  frame:
    text: Je {item} peux pas, je suis occupé. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Je ne peux pas منفی است: ne پیش از فعل و pas بعد از آن می‌آید.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit11.lesson02.translate.006
  lesson_content_key: fr.a1.unit11.lesson02.accepter_refuser
  type: translation
  frame:
    text: ما پیش روی بازار همدیگر را می‌بینیم. (از on استفاده کن)
    language_code: prs
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: On se retrouve {item} le marché.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Devant یعنی «پیش روی»؛ on se retrouve یعنی «همدیگر را می‌بینیم».
    language_code: prs
    direction: rtl
