schema_version: '1.0'
pack_key: practice.prs-fr.a1.unit85
source_language: prs
target_language: fr
unit_content_key: fr.a1.unit85.theatre
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dari (Afghanistan)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_acteurs
    - w_bonnes
    - w_entracte
    - w_géniaux
    - w_pièce
    - w_places
    - w_rideau
    - w_satisfait
    - w_spectacle
templates:
- content_key: practice.prs-fr.fr.a1.unit85.lesson01.choose.001
  lesson_content_key: fr.a1.unit85.lesson01.on_va_au_theatre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_spectacle
        - w_rideau
        - w_acteurs
        - w_pièce
        - w_entracte
        - w_bonnes
        - w_places
        - w_satisfait
        - w_géniaux
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس «امروز به تیاتر برویم؟».'
    language_code: prs
    direction: rtl
