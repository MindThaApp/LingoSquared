    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit05.lesson02.choose.001
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
