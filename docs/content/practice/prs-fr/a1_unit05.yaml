  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: le poulet، le poisson، le riz و le vin مذکر اند و la salade مؤنث است؛ در l'eau حرف صدادار حرف تعریف پیش از eau می‌افتد.
    language_code: prs
    direction: rtl
