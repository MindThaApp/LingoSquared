  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Café هم به معنی نوشیدنی است و هم جای آن؛ از متن معلوم می‌شود کدام مقصود است.
    language_code: prs
    direction: rtl
