  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vous avez choisi? راهی است که گارسون می‌پرسد تصمیم گرفته‌اید یا نه؛ avez choisi شکل گذشته است، لفظاً «انتخاب کرده‌اید».
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit05.lesson02.order.002
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: word_order
  frame:
    text: Je voudrais un {item}, s'il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Un پیش از اسم‌های مذکر مثل café، dessert و verre می‌آید.
    language_code: prs
    direction: rtl
