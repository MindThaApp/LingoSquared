    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit02.lesson03.choose.001
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
