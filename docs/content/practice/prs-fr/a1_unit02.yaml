      direction: ltr
  feedback_frame:
    text: 'Quel âge avez-vous? از vous کار می‌گیرد: برای آدم‌های نآشنا و در موقعیت‌های مؤدبانه.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit02.lesson04.choose.001
