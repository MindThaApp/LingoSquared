  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'از هفتاد به بعد نظام تغییر می‌کند: soixante-dix یعنی شصت-ده و quatre-vingts یعنی چهار بیست.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit02.lesson02.listen.002
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
