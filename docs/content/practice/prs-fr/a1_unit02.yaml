    slot: item
  feedback_frame:
    text: Quel âge as-tu? شکل غیررسمی است؛ با یک آدم نآشنا می‌پرسید quel âge avez-vous?
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit02.lesson03.translate.004
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
