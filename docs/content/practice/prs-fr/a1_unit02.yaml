      direction: ltr
  feedback_frame:
    text: 'فرانسوی برای سن از avoir (داشتن) کار می‌گیرد: j''ai vingt-huit ans، لفظاً «بیست‌وهشت سال دارم».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit02.lesson03.translate.005
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
