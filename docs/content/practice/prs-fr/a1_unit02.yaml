templates:
- content_key: practice.prs-fr.fr.a1.unit02.lesson01.choose.001
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: صفر تا شانزده کلمه‌های واحد استند؛ هفده تا نزده از چند تکه ساخته می‌شوند، مثل dix-sept، یعنی ده-هفت.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit02.lesson01.translate.002
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'به املا دقت کنید: zéro accent دارد و عددهای ترکیبی مثل trente-quatre با خط پیوند نوشته می‌شوند.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit02.lesson02.choose.001
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
