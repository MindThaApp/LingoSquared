    slot: item
  feedback_frame:
    text: صفر تا شانزده کلمه‌های جداگانه استند، بعد vingt، trente و soixante دهگان‌ها را می‌دهند؛ بقیه با ترکیب آن‌ها ساخته می‌شود.
    language_code: prs
    direction: rtl
