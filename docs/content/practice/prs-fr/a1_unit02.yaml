    slot: item
  feedback_frame:
    text: 'Quel âge as-tu? از سن کسی می‌پرسد: فرانسوی می‌گوید فلانی چند سال «دارد»، نه این‌که چند ساله «است».'
    language_code: prs
    direction: rtl
