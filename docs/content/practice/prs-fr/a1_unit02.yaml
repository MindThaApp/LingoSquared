      direction: ltr
  feedback_frame:
    text: 'Quel âge as-tu? از tu کار می‌گیرد: فقط برای دوستان، اعضای خانواده و هم‌سن‌وسال‌ها.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit02.lesson03.translate.006
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
