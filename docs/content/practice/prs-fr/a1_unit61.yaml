schema_version: '1.0'
pack_key: practice.prs-fr.a1.unit61
source_language: prs
target_language: fr
unit_content_key: fr.a1.unit61.quartier
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dari (Afghanistan)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_agréable
    - w_connaissent
    - w_connaît
    - w_connaître
    - w_longtemps
    - w_salue
    - w_saluer
    - w_supermarché
    - w_voisin
templates:
- content_key: practice.prs-fr.fr.a1.unit61.lesson01.choose.001
  lesson_content_key: fr.a1.unit61.lesson01.le_quartier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_agréable
        - w_supermarché
        - w_voisin
        - w_connaître
        - w_saluer
        - w_salue
        - w_longtemps
        - w_connaît
        - w_connaissent
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های این واحد است، از درس محله.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit61.lesson02.listen.001
  lesson_content_key: fr.a1.unit61.lesson02.mon_voisin_et_ma
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های این واحد است، از درس همسایه‌ی مرد و همسایه‌ی زن من.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit61.lesson03.translate.001
  lesson_content_key: fr.a1.unit61.lesson03.sympa_et_saluer
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های این واحد است، از درس مهربان و سلام دادن.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit61.lesson04.match.001
  lesson_content_key: fr.a1.unit61.lesson04.camille_rencontre_pierre
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر کلمهٔ فرانسوی را با معنی دری‌اش جور کنید؛ کلمه‌ها از درس‌های همین بخش اند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit61.lesson05.choose.001
  lesson_content_key: fr.a1.unit61.lesson05.qui_est_qui_dans
  type: multiple_choice
