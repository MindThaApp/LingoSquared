  type: word_order
  frame:
    text: Je suis un peu nerveux, {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_honnêtement
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis un peu nerveux, {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: راستش کمی دلشوره دارم. Honnêtement (راستش) اعتراف را نرم‌تر می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit49.lesson06.fill.003
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: fill_in_blank
  frame:
    text: Ne t'inquiète pas, tu {item} y arriver ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: غم نخور، خوب از عهده می‌آیی! Tu vas y arriver (به معنی لفظی «تو به آنجا می‌رسی») عبارت ثابت دلگرم‌کننده است؛ aller + مصدر آیندهٔ نزدیک را می‌سازد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit49.lesson06.translate.004
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: تشکر، واقعاً کمک می‌کند.
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_vraiment
  answer_derivation:
    kind: render_frame
    frame:
      text: Merci, ça m'aide {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: تشکر، واقعاً کمک می‌کند. Aide شکل il/elle فعل aider (کمک کردن) است؛ m' به جای me آمده است.
    language_code: prs
    direction: rtl
