  frame:
    text: Comment se {item} Mathieu ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sent
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment se {item} Mathieu ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: ماتیو چطور احساس می‌کند؟ Se sentir (احساس کردن، فعل انعکاسی) شیوهٔ معمول پرسیدن یا گفتن دربارهٔ حالت روحی است؛ در بخش صحت هم می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit49.lesson05.order.002
