  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: fill_in_blank
  frame:
    text: Salut Mathieu, tu te sens comment avant ton premier {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: سلام ماتیو، دربارهٔ اولین شفت کاری‌ات چه احساسی داری؟ Avant ton premier service (پیش از اولین شفت کاری‌ات) همان الگوی «avant + اسم» درس ۳ را به کار می‌برد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit49.lesson04.order.002
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
