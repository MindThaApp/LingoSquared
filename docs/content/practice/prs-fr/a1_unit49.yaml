    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pense
  answer_derivation:
    kind: render_frame
    frame:
      text: Oui, je {item} aussi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: بلی، من هم همین‌طور فکر می‌کنم. Je pense aussi شیوهٔ طبیعی موافقت با نظر کسی است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit49.lesson06.order.002
