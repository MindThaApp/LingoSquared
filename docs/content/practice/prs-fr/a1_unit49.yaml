schema_version: '1.0'
pack_key: practice.prs-fr.a1.unit49
source_language: prs
target_language: fr
unit_content_key: fr.a1.unit49.emotions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dari (Afghanistan)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_arriver
    - w_colère
    - w_content
    - w_fier
    - w_honnêtement
    - w_nerveux
    - w_nouveau
    - w_pense
    - w_pourquoi
    - w_remplace
    - w_sent
    - w_seras
    - w_service
    - w_seul
    - w_sûrement
    - w_triste
    - w_vas
    - w_vraiment
templates:
- content_key: practice.prs-fr.fr.a1.unit49.lesson01.choose.001
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_content
        - w_triste
        - w_colère
        - w_pourquoi
        - w_nerveux
        - w_service
        - w_sent
        - w_seul
        - w_nouveau
        - w_pense
        - w_honnêtement
        - w_vas
        - w_arriver
        - w_vraiment
        - w_seras
        - w_sûrement
        - w_fier
        - w_remplace
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس «خوش، غمگین یا خشمگین».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit49.lesson02.listen.001
