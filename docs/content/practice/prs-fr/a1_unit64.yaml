  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_gentille
        - w_drôle
        - w_calme
        - w_patient
        - w_curieux
        - w_parler
        - w_timide
        - w_connaissez
        - w_raconte
        - w_différent
        - w_notre
