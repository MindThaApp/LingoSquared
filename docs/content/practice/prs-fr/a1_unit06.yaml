templates:
- content_key: practice.prs-fr.fr.a1.unit06.lesson01.choose.001
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le matin، l'après-midi و le soir بخش‌های روز را می‌گویند؛ midi و minuit ظهر و نیمه‌شب‌اند و حرف تعریف نمی‌گیرند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson01.listen.002
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'L''heure شکل کوتاه‌شدهٔ la heure است: heure با h بی‌صدا شروع می‌شود، پس la پیش از آن به l'' تبدیل می‌شود.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson01.match.003
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Matin، après-midi و soir معمولاً با le یا l' می‌آیند، وقتی می‌گویید صبح، بعد از ظهر، شب.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson01.order.004
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: word_order
  frame:
    text: Le marché est ouvert le {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Le marché est ouvert le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Le matin و le soir یعنی «در صبح» و «در شب»، بدون واژه‌ای جداگانه برای «در».
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson01.fill.005
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: fill_in_blank
  frame:
    text: Nous mangeons à {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: À midi یعنی در ظهر؛ midi واژهٔ روزمره برای وقت چاشت هم هست.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson01.translate.006
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: translation
  frame:
    text: کارگاه شب شروع می‌شود، نه صبح.
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier commence le {item}, pas le matin.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Le soir یعنی شب؛ pas تضاد را با le matin منفی می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson02.choose.001
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Demie اینجا شکل مؤنث است چون heure مؤنث است: dix heures et demie.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson02.listen.002
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Et quart و moins le quart دو عبارت ربع ساعت‌اند: بعد از ساعت و پیش از ساعت.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson02.order.003
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: word_order
  frame:
    text: L'atelier commence à {item} heure ?
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier commence à {item} heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quelle heure ? وقت را می‌پرسد؛ quelle مؤنث است تا با heure مطابقت کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson02.fill.004
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: fill_in_blank
  frame:
    text: Il est onze heures {item} le quart. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Moins le quart یک ربع را از ساعت بعدی کم می‌کند، پس onze heures moins le quart یعنی ۱۰:۴۵.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson02.translate.005
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: translation
  frame:
    text: ساعت ده و ربع است.
    language_code: prs
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Il est dix heures et {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Et quart یک ربع ساعت اضافه می‌کند؛ در فرانسوی می‌گویید «ده ساعت و ربع».
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson03.choose.001
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Alors، vers و après واژه‌های کوچک رابط‌اند که در گفتگو زمان یا ترتیب را می‌رسانند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson03.listen.002
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vers یعنی حدود، مثل vers vingt heures quinze، و وقت تقریبی می‌دهد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson03.match.003
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Après le travail یعنی بعد از کار؛ vers و d'habitude وقت تقریبی و همیشگی را می‌رسانند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson03.order.004
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: word_order
  frame:
    text: C'est plus {item} après le travail.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est plus {item} après le travail.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Plus pratique یعنی راحت‌تر؛ pratique برای مذکر و مؤنث یک شکل دارد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson03.fill.005
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: fill_in_blank
  frame:
    text: Et il {item} à quelle heure ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Finit شکل il فعل finir است، به همین خاطر با il در سؤال جور می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson03.fill.006
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: fill_in_blank
  frame:
    text: Vers vingt heures quinze, comme {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Comme d'habitude یعنی مثل همیشه.
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit06.lesson03.translate.007
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: translation
  frame:
    text: فکر کنم (کارگاه) ساعت 18:30 شروع می‌شود. (وقت را با حروف بنویسین)
    language_code: prs
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Il commence à dix-huit heures trente, je {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Je crois شکل je فعل croire است و حرف را نرم می‌کند: فکر کنم همین‌طور است.'
    language_code: prs
    direction: rtl
