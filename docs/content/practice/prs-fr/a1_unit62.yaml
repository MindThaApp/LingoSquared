    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این واحد است، از درس رسیدن و وقت گرفتن.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit62.lesson04.match.001
  lesson_content_key: fr.a1.unit62.lesson04.a_la_poste
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر کلمهٔ فرانسوی را با معنی دری‌اش جور کنید؛ کلمه‌ها از درس‌های همین بخش اند.
    language_code: prs
    direction: rtl
