schema_version: '1.0'
pack_key: practice.prs-fr.a1.unit62
source_language: prs
target_language: fr
unit_content_key: fr.a1.unit62.poste
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dari (Afghanistan)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_achète
    - w_arrivent
    - w_colis
    - w_désirez
    - w_employé
    - w_lettre
    - w_met
    - w_mettre
    - w_timbre
    - w_écrire
templates:
- content_key: practice.prs-fr.fr.a1.unit62.lesson01.choose.001
  lesson_content_key: fr.a1.unit62.lesson01.la_lettre_et_le
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_lettre
        - w_colis
        - w_timbre
        - w_écrire
        - w_arrivent
        - w_mettre
        - w_met
        - w_employé
        - w_désirez
        - w_achète
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این واحد است، از درس نامه و بسته.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-fr.fr.a1.unit62.lesson02.listen.001
  lesson_content_key: fr.a1.unit62.lesson02.le_timbre_l_adresse
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این واحد است، از درس تکت پوستی، آدرس و نوشتن.'
    language_code: prs
    direction: rtl
