templates:
- content_key: practice.ro-es.es.a1.unit13.lesson01.choose.001
  lesson_content_key: es.a1.unit13.lesson01.el_trabajo_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Trabajo este atât substantivul „slujbă / muncă”, cât și forma verbală „lucrez”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit13.lesson01.listen.002
  lesson_content_key: es.a1.unit13.lesson01.el_trabajo_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Escritorio este un birou (mobilă); biroul, ca încăpere de lucru, este una oficina.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit13.lesson02.translate.001
  lesson_content_key: es.a1.unit13.lesson02.las_profesiones
  type: translation
  frame:
    text: Sunt contabil. (spune un bărbat)
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Spaniola omite articolul înaintea unei meserii după ser: soy contador, nu soy un contador; o femeie spune soy contadora.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit13.lesson02.order.002
  lesson_content_key: es.a1.unit13.lesson02.las_profesiones
  type: word_order
  frame:
    text: Yo soy {item}. Enseño en una escuela.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Yo soy {item}. Enseño en una escuela.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Sunt profesoară. Predau la o școală. Un profesor (bărbat) se spune un profesor.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit13.lesson03.fill.001
  lesson_content_key: es.a1.unit13.lesson03.en_que_trabajas
  type: fill_in_blank
  frame:
    text: ¿En qué {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¿En qué trabajas? înseamnă literal „în ce lucrezi?”, adică „ce meserie ai?”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit13.lesson04.translate.001
  lesson_content_key: es.a1.unit13.lesson04.prefiero_cocinar
  type: translation
  frame:
    text: Amândoi preferăm asta.
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Los dos preferimos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Los dos înseamnă aici „amândoi”; esto se referă la o idee sau un lucru fără a-l numi.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit13.lesson05.order.001
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: word_order
  frame:
    text: Mateo {item} en una oficina en Londres.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo {item} en una oficina en Londres.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Mateo lucrează într-un birou din Londra. Trabajar en + loc arată unde lucrează cineva.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit13.lesson05.order.002
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: word_order
  frame:
    text: Elena {item} en una escuela.
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Elena {item} en una escuela.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Elena predă la o școală. Enseñar înseamnă „a preda / a învăța pe cineva”; aprender înseamnă „a învăța”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit13.lesson05.match.003
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'A los dos les gusta su trabajo: les arată cui îi aparține plăcerea, adică lor.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit13.lesson06.translate.001
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Multe cuvinte din domeniul muncii seamănă cu cele românești: oficina, estudiantes, interesante.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit13.lesson06.fill.002
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: fill_in_blank
  frame:
    text: Prefiero cocinar {item} los martes. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Con + ti devine un singur cuvânt, contigo; „cu mine” este conmigo.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit13.lesson06.choose.003
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Preferir schimbă e în ie la majoritatea formelor (prefiero, prefieren), dar nu la preferimos.
    language_code: ro
    direction: ltr
