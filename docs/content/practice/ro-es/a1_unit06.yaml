    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Un se folosește cu substantive masculine (un café); substantivele feminine primesc una (una ensalada).
    language_code: ro
    direction: ltr
