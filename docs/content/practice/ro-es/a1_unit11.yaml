templates:
- content_key: practice.ro-es.es.a1.unit11.lesson01.choose.001
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: În spaniolă se folosește adesea singularul el pantalón (și los pantalones), pe când în română se spune de obicei „pantalonii”, la plural.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit11.lesson01.listen.002
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Camisa și chaqueta sunt de genul feminin; pantalón, delantal și zapatos sunt de genul masculin.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit11.lesson01.translate.003
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Substantivele care se termină în -l primesc -es la plural: delantal, delantales.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit11.lesson02.order.001
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: word_order
  frame:
    text: Uso la talla {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Uso la talla {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Port mărimea M. În spaniolă, pentru mărimea pe care o porți se folosește verbul usar, „a folosi”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit11.lesson02.fill.002
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: fill_in_blank
  frame:
    text: ¿Qué {item} usas? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Talla este mărimea hainelor; pentru încălțăminte se folosește el número: ¿Qué número tienes?'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit11.lesson02.translate.003
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: translation
  frame:
    text: Mi se potrivește prost.
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Quedar bien sau mal arată cum ți se potrivesc hainele: me queda bien, „mi se potrivește bine”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit11.lesson04.order.001
  lesson_content_key: es.a1.unit11.lesson04.decidir_comprar
  type: word_order
  frame:
    text: Me queda bien. Voy a {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda bien. Voy a {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Ir a + infinitiv exprimă un plan: voy a comprarlo, „am de gând să-l cumpăr”. Pronumele lo, „îl”, se atașează la finalul infinitivului.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit11.lesson05.match.001
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Uso, usas și usan vin toate de la usar: port, porți, poartă (ei).'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit11.lesson05.fill.002
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: fill_in_blank
  frame:
    text: 'El delantal es más {item}: solo cuesta doce. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Más + adjectiv formează comparativul: más barato, „mai ieftin”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit11.lesson06.order.001
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: word_order
  frame:
    text: Sí, buscamos {item} para el taller.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, buscamos {item} para el taller.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Da, căutăm șorțuri pentru atelier. Buscar înseamnă deja „a căuta”, așa că buscamos delantales nu cere niciun cuvânt în plus.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit11.lesson06.choose.002
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vânzătorul oferă ajutor cu ¿Los ayudo?, „vă pot ajuta (pe toți)?”
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit11.lesson06.translate.003
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Voy vine de la ir, „a merge”; este neregulat: voy, vas, va.'
    language_code: ro
    direction: ltr
