templates:
- content_key: practice.ro-es.es.a1.unit08.lesson01.choose.001
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Biblioteca înseamnă bibliotecă; o librărie se spune librería, un fals prieten des întâlnit.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit08.lesson01.listen.002
