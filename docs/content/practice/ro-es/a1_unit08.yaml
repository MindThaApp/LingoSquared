    text: 'En este barrio hay muchos lugares útiles: hay arată ce există într-un loc.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit08.lesson05.translate.002
  lesson_content_key: es.a1.unit08.lesson05.leer_sobre_el_barrio
