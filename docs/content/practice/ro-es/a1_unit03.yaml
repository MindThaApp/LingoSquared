    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pluralul masculin cuprinde și grupurile mixte: padres înseamnă părinți, hermanos poate însemna frați și surori.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit03.lesson01.translate.003
