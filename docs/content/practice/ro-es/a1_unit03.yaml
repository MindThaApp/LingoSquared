  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: word_order
  frame:
    text: Mi familia es {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi familia es {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Familia este de genul feminin, așadar „mic” se spune pequeña; grande rămâne la fel la ambele genuri.
    language_code: ro
    direction: ltr
