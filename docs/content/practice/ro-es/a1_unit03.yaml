templates:
- content_key: practice.ro-es.es.a1.unit03.lesson01.choose.001
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cuvintele pentru rude se împerechează adesea după gen: hermano și hermana, hijo și hija.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit03.lesson01.listen.002
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
