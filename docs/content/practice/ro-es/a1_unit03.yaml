    kind: render_frame
    frame:
      text: Tengo dos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Pentru a întreba: ¿Tienes hermanos? folosește pluralul masculin, care cuprinde frați și surori.'
    language_code: ro
    direction: ltr
