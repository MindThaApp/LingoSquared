- content_key: practice.ro-es.es.a1.unit47.lesson03.order.002
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: word_order
  frame:
    text: No {item} tan rápido, por favor.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hables
  answer_derivation:
    kind: render_frame
    frame:
      text: No {item} tan rápido, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Nu vorbi atât de repede, te rog. No hables este imperativul negativ informal al verbului hablar; tan rápido (atât de repede) arată gradul.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit47.lesson03.fill.003
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: fill_in_blank
  frame:
    text: No te {item} bien. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nu te aud bine. Oír (a auzi) cu no ... bien (nu ... bine) exprimă o problemă de auz, diferită de entender (a înțelege); te oigo înseamnă „te aud”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit47.lesson04.order.002
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: word_order
  frame:
    text: El {item} es de Elena.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_mensaje
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} es de Elena.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Mesajul text este de la Elena. mensaje înseamnă mesaj; mesaj text.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit47.lesson04.fill.003
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: fill_in_blank
  frame:
    text: Te {item} un mensaje. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Îți trimit un mesaj. Enviar (a trimite) se folosește cu pronumele te (îți): te envío un mensaje.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit47.lesson06.order.002
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: word_order
  frame:
    text: ¿Cómo ha ido tu primer {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_turno
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo ha ido tu primer {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Cum a fost prima ta tură? Ha ido este perfectul compus al verbului ir (aici „a decurge”): ha + participiul ido.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit47.lesson06.fill.003
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: fill_in_blank
  frame:
    text: Ha ido muy bien, mejor de lo {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A mers foarte bine, mai bine decât credeam. Ha ido muy bien reia perfectul compus din întrebare; mejor de lo esperado (mai bine decât mă așteptam) face comparația cu de lo.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit47.lesson06.translate.004
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame:
    text: Mulțumesc, înseamnă mult pentru mine.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_significa
  answer_derivation:
    kind: render_frame
    frame:
      text: Muchas gracias, eso {item} mucho para mí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Mulțumesc, înseamnă mult pentru mine. Significa este forma de persoana a treia a verbului significar (a însemna); para mí (pentru mine) arată cui îi pasă.
    language_code: ro
    direction: ltr
