templates:
- content_key: practice.ro-es.es.a1.unit10.lesson01.choose.001
  lesson_content_key: es.a1.unit10.lesson01.el_tiempo_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tiempo înseamnă atât vreme, cât și timp: ¿Qué tiempo hace? întreabă despre vreme.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit10.lesson01.listen.002
  lesson_content_key: es.a1.unit10.lesson01.el_tiempo_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lluvia este substantivul „ploaie”; llueve este verbul „plouă”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit10.lesson02.order.001
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: word_order
  frame:
    text: En julio hace {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: En julio hace {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Pentru vreme, spaniola folosește verbul hacer cu un substantiv: hace calor, literal „face căldură”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit10.lesson02.translate.002
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: translation
  frame:
    text: Este frig în decembrie.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: En diciembre hace {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Frío este aici substantiv după hace; „foarte frig” se spune hace mucho frío, nu muy frío.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit10.lesson02.fill.003
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: fill_in_blank
  frame:
    text: Hoy {item} y hace frío. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Llover nu are nevoie de subiect: llueve înseamnă pur și simplu „plouă”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit10.lesson02.order.004
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: word_order
  frame:
    text: Hoy está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Astăzi e înnorat. Nublado este adjectiv, deci merge cu está, nu cu hace.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit10.lesson04.fill.001
  lesson_content_key: es.a1.unit10.lesson04.el_invierno_en_madrid
  type: fill_in_blank
  frame:
    text: Necesitamos agua {item} hace calor. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Porque, scris într-un cuvânt și fără accent, înseamnă „pentru că”; ¿por qué?, în două cuvinte și cu accent, înseamnă „de ce?”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit10.lesson04.translate.002
  lesson_content_key: es.a1.unit10.lesson04.el_invierno_en_madrid
  type: translation
  frame:
    text: În iulie este prea cald.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: En julio hace {item} calor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Demasiado înseamnă „prea mult” și se pune înaintea substantivului: demasiado calor.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit10.lesson05.match.001
  lesson_content_key: es.a1.unit10.lesson05.leer_el_pronostico
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Es importante + infinitiv exprimă un sfat: es importante llevar agua.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit10.lesson05.translate.002
  lesson_content_key: es.a1.unit10.lesson05.leer_el_pronostico
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cuvinte spaniole despre vreme: sol, lluvia, viento și nube sunt substantive; nublado este adjectiv.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit10.lesson06.choose.001
  lesson_content_key: es.a1.unit10.lesson06.camino_al_taller_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Prefiero vine de la preferir; e devine ie: prefiero, prefieres.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit10.lesson06.translate.002
  lesson_content_key: es.a1.unit10.lesson06.camino_al_taller_dialogue
  type: translation
  frame:
    text: Ai dreptate. (informal)
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Tienes {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Pentru „a avea dreptate”, spaniola folosește verbul tener: tener razón.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-es.es.a1.unit10.lesson06.order.003
  lesson_content_key: es.a1.unit10.lesson06.camino_al_taller_dialogue
  type: word_order
  frame:
    text: Hay una {item} cerca de aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Hay una {item} cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Este un magazin aproape de aici. Tienda este feminin, deci primește una.
    language_code: ro
    direction: ltr
