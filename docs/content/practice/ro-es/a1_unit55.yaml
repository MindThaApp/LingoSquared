  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_andando
    - w_bici
    - w_camina
    - w_caminar
    - w_centro
    - w_coche
    - w_compro
    - w_conduce
    - w_conducir
    - w_estación
    - w_normalmente
    - w_prefiere
    - w_transporte
    - w_vas
    - w_viaja
    - w_viajar
    - w_viajas
    - w_viajo
