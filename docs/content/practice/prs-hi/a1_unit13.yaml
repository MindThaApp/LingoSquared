templates:
- content_key: practice.prs-hi.hi.a1.unit13.lesson01.choose.001
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '«पसंद है» یعنی «خوشایند است»: «मुझे चाय पसंद है» یعنی «من چای را دوست دارم»، و با «मुझे» ساخته می‌شود، نه با «मैं».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson01.listen.002
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '«है» با یک چیز می‌آید و «हैं» با بیشتر از یک چیز: किताब पसंद है، किताबें पसंद हैं.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson01.order.003
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: در هندی برای «یک» یا معرفه کلمهٔ جداگانه نمی‌آید، و چیزی که دوستش داریم بین मुझे و पसंद قرار می‌گیرد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson01.order.004
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'فعل در اینجا हैं است، چون किताबें جمع است: पसंद है می‌شود पसंद हैं.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson01.fill.005
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: پसंद در هندی فعل نیست؛ کلمه‌ای است که با है می‌آید، پس جمله مثل «چای برای من خوشایند است» ساخته می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson01.fill.006
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे {item} पसंद हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: وقتی چیزِ دوست‌داشتنی جمع باشد، بعد از पसंद، हैं می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson01.translate.007
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: من موسیقی را دوست دارم.
    language_code: prs
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: کسی که دوست دارد در جای मुझे می‌آید، و موسیقی همان چیزی است که خوشایند است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson01.translate.008
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: من کتاب‌ها را دوست دارم.
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: किताबें جمع است، پس فعل हैं است، نه है.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson01.translate.009
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مفرد किताब و جمع किताबें فقط در پایانهٔ -ें فرق دارند که برای این اسم مؤنث، جمع را نشان می‌دهد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson02.choose.001
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'खेल هم به معنی ورزش است و هم بازی، و ज़्यादा یعنی بیشتر: मुझे चाय ज़्यादा पसंद है یعنی «من چای را بیشتر دوست دارم».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson02.order.002
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: word_order
  frame:
    text: मुझे यह {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: यह (این) درست پیش از اسمی می‌آید که به آن اشاره می‌کند، مثل यह खेल.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson02.fill.003
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} पसंद है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ज़्यादा پیش از पसंद می‌آید تا بگوید کدام یک از دو چیز بیشتر دوست داشته می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson02.translate.004
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: من این ورزش را دوست دارم.
    language_code: prs
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: है با چیزِ دوست‌داشتنی (یک ورزش) مطابقت می‌کند، نه با کسی که دوست دارد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson02.translate.005
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: من چای را بیشتر دوست دارم.
    language_code: prs
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे चाय {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: هندی لفظ‌به‌لفظ می‌گوید «چای برای من بیشتر خوشایند است»، و ज़्यादा درست پیش از पसंद می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit13.lesson02.translate.006
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खेल (ورزش یا بازی) اسم مذکر است، ولی ज़्यादा (بیشتر) هیچ‌وقت شکلش تغییر نمی‌کند.
    language_code: prs
    direction: rtl
