  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कल هم فردا معنی می‌دهد و هم دیروز، و زمان فعل نشان می‌دهد کدام مراد است.
    language_code: prs
    direction: rtl
