  feedback_frame:
    text: कितने बजे है? راه روزمره برای پرسیدن است که چیزی ساعت چند است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit04.lesson01.fill.005
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: fill_in_blank
  frame:
    text: अभी पाँच {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: برای گفتن «ساعت … است» از دو تا دوازده، बजे हैं به کار می‌رود؛ बजे معنی «در ساعت …» هم می‌دهد، مثل सुबह सात बजे.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit04.lesson03.fill.002
  lesson_content_key: hi.a1.unit04.lesson03.agli_class_ka_samay
  type: fill_in_blank
  frame:
    text: ठीक है, {item} मिलते हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ठीक है, कल मिलते हैं معنی تحت‌اللفظی‌اش «خوب است، فردا همدیگر را می‌بینیم» است؛ زمان حال اغلب به آینده نزدیک اشاره می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit04.lesson01.translate.006
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: translation
  frame:
    text: ساعت چند است؟
    language_code: prs
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} बजे हैं?'
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'برای گفتن وقت، عدد را پیش از बजे بگذارین: अभी पाँच बजे हैं.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit04.lesson02.translate.004
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: translation
  frame:
    text: صنف بعدی ساعت پنج شام است.
    language_code: prs
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: अगली क्लास {item} पाँच बजे है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अगली با اسم مؤنث क्लास مطابقت می‌کند، پس به -ी ختم می‌شود، نه -ा.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit04.lesson01.translate.007
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: translation
  frame:
    text: حالا ساعت یک است.
    language_code: prs
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'ساعت یک تنها ساعتی است که فعل مفرد دارد: एक बजा है اما दो बजे हैं.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit04.lesson02.translate.005
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'هندی برای ظهر کلمه جداگانه ندارد: दोपहर هم نیمروز و هم بعد از چاشت را می‌پوشاند.'
    language_code: prs
    direction: rtl
