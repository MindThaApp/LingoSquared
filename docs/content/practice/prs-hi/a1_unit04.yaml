    - fifth
    - sixth
  feedback_frame:
    text: وقت‌های روز اسم‌های مؤنث یا مذکر اند و حرف تعریف ندارند؛ सुबह، शाम و रात همه مؤنث اند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit04.lesson01.order.002
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: word_order
  frame:
    text: अभी पाँच {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी पाँच {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'در گفتن وقت، هر ساعت جز یک، बजे را با فعل جمع می‌گیرد: पाँच बजे हैं، اما एक बजा है.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit04.lesson01.order.003
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: word_order
  frame:
    text: अभी एक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'فقط ساعت یک، बजा مفرد و है مفرد می‌گیرد: एक बजा है.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit04.lesson02.order.003
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
