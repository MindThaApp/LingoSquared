templates:
- content_key: practice.prs-hi.hi.a1.unit04.lesson01.choose.001
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बजे (ساعت) بعد از عدد می‌آید؛ فقط وقتی می‌گویید ساعت یک است، एक बजा है می‌گویید، اما «در ساعت یک» باز هم एक बजे است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit04.lesson02.listen.001
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: هندی روز را به सुबह، दोपहर، शाम و रात تقسیم می‌کند؛ برای صبح و بعد از ظهر (a.m. و p.m.) یک کلمه واحد وجود ندارد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit04.lesson03.choose.001
  lesson_content_key: hi.a1.unit04.lesson03.agli_class_ka_samay
