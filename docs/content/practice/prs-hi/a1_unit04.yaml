    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: क्लास {item} सात बजे है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'بخش روز مستقیم پیش از ساعت می‌آید و بین آن‌ها کلمه‌ای نیست: सुबह सात बजे.'
    language_code: prs
    direction: rtl
