templates:
- content_key: practice.prs-hi.hi.a1.unit06.lesson01.choose.001
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: खाना اسم مذکر است و معنی غذا یا وعدهٔ غذا را می‌دهد؛ चाय و कॉफ़ी مؤنث‌اند، اما पानी و जूस مذکرند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson01.listen.002
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'در هندی حتا اسم نوشیدنی‌ها جنسیت دارند: पानी و जूस مذکر، चाय و कॉफ़ी مؤنث.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson01.fill.003
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: fill_in_blank
  frame:
    text: आपको क्या {item}? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: चाहिए با جنسیت گویندگان تغییر نمی‌کند (برخلاف चाहता و चाहती) و بعدش है نمی‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson01.translate.004
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: چی می‌خواهی؟ (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें क्या {item}?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: با आप همین سوال आपको क्या चाहिए? می‌شود؛ فقط کلمهٔ «شما» تغییر می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson01.translate.005
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: چای می‌خواهم، تشکر.
    language_code: prs
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} चाहिए, शुक्रिया।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए در اصل یعنی «برای من ... لازم است»، پس چیزی که می‌خواهین میان این دو کلمه می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson01.translate.006
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: در هندی کلمه‌ای برای «یک» نکره یا معرفه وجود ندارد، پس खाना بسته به موقعیت می‌تواند غذا، یک وعده غذا یا همان غذا معنی بدهد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson02.choose.001
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: रोटी، दाल و सब्ज़ी اسم‌های مؤنث‌اند، اما चावल (برنج) مذکر است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson02.match.002
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'در هندی اول ظرف می‌آید و کلمهٔ «از/ی اضافه» نمی‌آید: एक गिलास पानी در اصل یعنی «یک گیلاس آب».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson02.order.003
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: word_order
  frame:
    text: मुझे एक प्लेट {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे एक प्लेट {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'در هندی برای «یک پلیت برنج» کلمهٔ اضافه نیست: ظرف پیش از غذا می‌آید.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson02.order.004
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: word_order
  frame:
    text: यह {item} बहुत स्वादिष्ट है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बहुत स्वादिष्ट है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: स्वादिष्ट برای اسم مذکر و مؤنث تغییر نمی‌کند، برخلاف अच्छा و अच्छी.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson02.fill.005
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: fill_in_blank
  frame:
    text: नहीं, {item}, शुक्रिया। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'नहीं, बस غذا یا نوشیدنی بیشتر را مؤدبانه رد می‌کند: نه، بس است.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson02.fill.006
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: fill_in_blank
  frame:
    text: मुझे कॉफ़ी चाहिए, {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कृपया کلمهٔ مؤدبانهٔ «لطفاً» است و می‌تواند در آخر درخواست هم بیاید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson02.translate.007
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: translation
  frame:
    text: یک گیلاس آب می‌خواهم.
    language_code: prs
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे एक {item} पानी चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: کلمهٔ پیمانه مثل गिलास مستقیم پیش از چیزی که اندازه می‌شود می‌آید و کلمهٔ «از» ندارد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson02.translate.008
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: translation
  frame:
    text: این دال بسیار خوش‌مزه است.
    language_code: prs
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बहुत स्वादिष्ट है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: दाल مؤنث است، اما स्वादिष्ट برای اسم مؤنث و مذکر یکسان می‌ماند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson03.choose.001
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: या دو انتخاب را وصل می‌کند، مثل तुम्हें चाय चाहिए या कॉफ़ी؟، و खाते हैं بعد از चलो یک پیشنهاد می‌سازد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson03.fill.002
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: fill_in_blank
  frame:
    text: तुम्हें चाय चाहिए {item} कॉफ़ी? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: در سوال، या انتخاب میان دو چیز را می‌رساند، مثل «یا» در دری.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit06.lesson03.translate.003
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: translation
  frame:
    text: بیایین چیزی بخوریم!
    language_code: prs
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: «چلو» همراه با فعل جمع به شکل «-ते» و «हैं» روش معمول برای پیشنهاد دادن است.
    language_code: prs
    direction: rtl
