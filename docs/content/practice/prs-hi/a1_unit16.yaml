templates:
- content_key: practice.prs-hi.hi.a1.unit16.lesson01.choose.001
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दर्द اسم مذکر به معنی «درد» است و मुझे सिर दर्द है راه معمول گفتن «سردرد دارم» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson01.listen.002
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'هندی می‌گوید «برای من تب است»: मुझे बुखार है، با है و نه با فعلی مثل «داشتن».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson01.order.003
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: word_order
  frame:
    text: मुझे {item} दर्द है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} दर्द है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: هندی برای سردرد می‌گوید «درد سر»، با सिर پیش از दर्द.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson01.order.004
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: word_order
  frame:
    text: मुझे सिर {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे सिर {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: दर्द بعد از सिर و پیش از है می‌آید، مثل सिर दर्द है.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson01.fill.005
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: fill_in_blank
  frame:
    text: मुझे {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مریضی‌ها با मुझे ... है گفته می‌شوند، یعنی لفظاً «برای من تب است».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson01.fill.006
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: fill_in_blank
  frame:
    text: मुझे सिर {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: सिर दर्द ترکیبی از «سر» و «درد» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson01.translate.007
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: translation
  frame:
    text: تب دارم.
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: هندی اینجا فعل «داشتن» ندارد؛ मुझे و है کافی‌اند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson01.translate.008
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: translation
  frame:
    text: 'من سردرد دارم. (لفظاً: برای من درد سر است)'
    language_code: prs
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे सिर {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'هندی «یک سردرد» نمی‌گوید: सिर दर्द ترکیبی است که بدون «یک» به کار می‌رود.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson02.choose.001
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: आराम करो فرمان غیررسمی «استراحت کن!» است که از اسم आराम و करो ساخته شده.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson02.order.002
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
    text: मुझे {item} के पास जाना है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} के पास जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के पास بعد از یک شخص یعنی «نزد آن شخص»، پس डॉक्टर के पास जाना یعنی «نزد داکتر رفتن».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson02.order.003
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
    text: तुम्हें {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चाहिए بعد از چیزِ مورد نیاز می‌آید و معمولاً بعد از آن है نمی‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson02.order.004
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
    text: आराम {item} और डॉक्टर के पास जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आराम {item} और डॉक्टर के पास जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: هر دو فرمان به -ो ختم می‌شوند، چون با کسی گفته می‌شوند که او را तुम خطاب می‌کنیم.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson02.fill.005
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: fill_in_blank
  frame:
    text: मुझे {item} चाहिए। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: چیزِ مورد نیاز بین मुझे و चाहिए می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson02.fill.006
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: fill_in_blank
  frame:
    text: आराम {item}! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: करो شکل فرمان غیررسمی करना است و आराम करो یعنی «استراحت کن».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson02.translate.007
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: من دوا لازم دارم.
    language_code: prs
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए هم برای «لازم داشتن» و هم برای «خواستن» به کار می‌رود، هر کسی که صحبت کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson02.translate.008
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: من باید نزد داکتر بروم.
    language_code: prs
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} के पास जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के पास بعد از داکتر می‌آید و یعنی «نزد داکتر».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson02.translate.009
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: استراحت کن! (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आराम {item}!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: فرمان غیررسمی به -ो ختم می‌شود، که آوایی است برای خطاب با तुम.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit16.lesson02.translate.010
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: تو استراحت لازم داری. (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: तुम्हें برای کسی که او را तुम خطاب می‌کنی، نقش मुझे را دارد.
    language_code: prs
    direction: rtl
