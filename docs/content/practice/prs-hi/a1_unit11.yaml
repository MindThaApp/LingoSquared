    slot: item
  feedback_frame:
    text: 'संदेश یعنی «پیام»، مثل متنی که برنامه‌ای را تعیین می‌کند: प्रिया, चलो शनिवार को फ़िल्म देखते हैं?'
    language_code: prs
    direction: rtl
