templates:
- content_key: practice.prs-hi.hi.a1.unit11.lesson01.choose.001
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'چلو همراه با فعل شکل -ते و हैं، پیشنهاد کار کردن باهم است: चलो, फ़िल्म देखते हैं!'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit11.lesson01.listen.002
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'साथ یعنی «باهم» یا «همراه»، و در پیشنهاد اکثراً می‌آید: चलो, साथ चाय पीते हैं!'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit11.lesson01.order.003
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
