      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بعد از माफ़ करना وضعیت خود را می‌گویی، مثلاً مصروف بودن.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit11.lesson02.translate.004
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: ببخش، من مصروف استم. (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: माफ़ करना, मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: माफ़ करना شکل غیررسمی عذرخواهی است؛ व्यस्त برای مرد و زن یکسان می‌ماند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit11.lesson02.translate.005
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: خوب، پس ما کی همدیگر را می‌بینیم؟
    language_code: prs
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तो {item} कब मिलते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'हम شکل جمع -ते हैं را می‌گیرد: हम मिलते हैं، «ما همدیگر را می‌بینیم».'
    language_code: prs
    direction: rtl
