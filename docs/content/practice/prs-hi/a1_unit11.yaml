    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अच्छा {item} है!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: विचार مذکر است، به همین خاطر صفت अच्छा می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit11.lesson02.choose.001
