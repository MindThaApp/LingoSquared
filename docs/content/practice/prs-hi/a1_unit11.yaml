  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया, चलो शनिवार को {item} देखते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: شروع کردن با نام، شخص را مستقیم خطاب می‌کند و को بعد از شनिवार یعنی «روز شنبه».
    language_code: prs
    direction: rtl
