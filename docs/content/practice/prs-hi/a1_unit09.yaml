templates:
- content_key: practice.prs-hi.hi.a1.unit09.lesson01.choose.001
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'जाओ، मुड़ो و गिनो فرمان‌های غیررسمی استند: به -ो ختم می‌شوند و با तुम به کار می‌روند.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson01.listen.002
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बाएँ و दाएँ قید جهت استند، بنابراین از نظر جنسیت یا تعداد تغییر نمی‌کنند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson01.match.003
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'در هندی راهنمایی مسیر با یک قید و یک فعل گفته می‌شود: सीधे जाओ یعنی «مستقیم برو» و बाएँ मुड़ो یعنی «به چپ بپیچ».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson01.order.004
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: word_order
  frame:
    text: यहाँ से {item} जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'से بعد از यहाँ یعنی «از»: यहाँ से یعنی «از اینجا».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson01.order.005
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: word_order
  frame:
    text: फिर {item} मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर {item} मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'در هندی جهت پیش از فعل می‌آید: बाएँ मुड़ो در اصل یعنی «چپ بپیچ».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson01.fill.006
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: fill_in_blank
  frame:
    text: यहाँ से सीधे {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जाओ شکل فرمان غیررسمی जाना است؛ در گفتار محترمانه پایان دیگری به کار می‌رود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson01.translate.007
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: translation
  frame:
    text: از اینجا مستقیم برو. (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: जाओ فرمان در سطح तुम است؛ فعل در آخر و بعد از جهت می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson01.translate.008
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: translation
  frame:
    text: بعد به راست بپیچ. (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर {item} मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुड़ो شکل فرمان غیررسمی मुड़ना، یعنی «پیچیدن» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson02.choose.001
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: तक یعنی «تا»، مثل बैंक तक सीधे जाओ، یعنی «تا بانک مستقیم برو».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson02.order.002
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: word_order
  frame:
    text: बैंक {item} सीधे जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} सीधे जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: तक نقطهٔ پایان حرکت را نشان می‌دهد و درست بعد از جا می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson02.order.003
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: word_order
  frame:
    text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: पहले و फिर یعنی «اول» و «بعد»، پس ترتیب مرحله‌ها با ترتیب کلمات یکی است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson02.fill.004
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: fill_in_blank
  frame:
    text: स्कूल कैसे {item}? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जाऊँ شکل «بروم؟» از जाना است، پس स्कूल कैसे जाऊँ? یعنی «چطور به مکتب بروم؟»
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson02.translate.005
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: translation
  frame:
    text: به بانک چطور برسم؟
    language_code: prs
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक कैसे {item}?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'जाऊँ شکلی است که برای پرسیدن مشورت دربارهٔ کار خودت به کار می‌رود: چطور بروم؟'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson02.translate.006
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: translation
  frame:
    text: از اینجا اول مستقیم برو، بعد به چپ بپیچ. (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: पहले یعنی «اول» و फिर یعنی «بعد»؛ هر دو فرمان به -ो ختم می‌شوند چون با तुम به کار می‌روند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson03.choose.001
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पर بعد از یک جا یعنی «در» یا «سر»: नुक्कड़ पर یعنی «سر چهارراه».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson03.order.002
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: word_order
  frame:
    text: फिर बैंक के {item} पर बाएँ मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर बैंक के {item} पर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के बैंक را به چهارراه وصل می‌کند و پर پیچیدن را در همان چهارراه قرار می‌دهد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit09.lesson03.translate.003
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: translation
  frame:
    text: بعد سر چهارراه بانک به چپ بپیچ. (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर बैंक के {item} पर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: در هندی اول جای مرجع می‌آید (बैंक के नुक्कड़ पर)، بعد جهت، بعد فعل.
    language_code: prs
    direction: rtl
