  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'मिले با हम، तुम و वे استفاده می‌شود: हम मिले، یعنی «ما ملاقات کردیم».'
    language_code: prs
    direction: rtl
