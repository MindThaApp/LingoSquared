  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: با हम شکل گذشته به -ए ختم می‌شود، مثل جمع مذکر.
    language_code: prs
    direction: rtl
