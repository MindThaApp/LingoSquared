templates:
- content_key: practice.prs-hi.hi.a1.unit12.lesson01.choose.001
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'था و थी در زمان گذشته به جای है می‌آیند و با فاعل مطابقت می‌کنند: दिन अच्छा था، फ़िल्म अच्छी थी.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson01.order.002
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: कल का दिन {item} था?
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: कल का दिन {item} था?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा با اسم مذکر दिन مطابقت می‌کند؛ با اسم مؤنث कैसी می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson01.order.003
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: चाय की दुकान बहुत {item} थी।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अच्छी مؤنث است چون दुकान مؤنث است، و थी هم با آن مطابقت می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson01.fill.004
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: fill_in_blank
  frame:
    text: फ़िल्म अच्छी {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थी گذشتهٔ مؤنثِ «بودن» است و با اسم مؤنث फ़िल्म مطابقت می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson01.translate.005
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: فلم خوب بود.
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फ़िल्म अच्छी {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म مؤنث است، پس هم صفت و هم گذشتهٔ «بودن» شکل مؤنث می‌گیرند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson01.translate.006
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: دکان چای خیلی خوب بود.
    language_code: prs
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की، चाय را به اسم مؤنث दुकान وصل می‌کند، و अच्छी و थी با آن مطابقت می‌کنند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson02.choose.001
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'شکل‌های گذشتهٔ जाना و मिलना برای مرد به -आ و برای زن به -ई ختم می‌شوند: गया یا गई، मिला یا मिली.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson02.order.002
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: word_order
  frame:
    text: मैं वहाँ प्रिया से {item}।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं वहाँ प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'से در اینجا یعنی «با»: प्रिया से मिला یعنی «با پریا ملاقات کرد»، و ختم فعل از گوینده پیروی می‌کند.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson02.fill.003
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं कल बाज़ार {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ختم -ई نشان می‌دهد که گوینده یک زن است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson02.fill.004
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं वहाँ अर्जुन से {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: گذشتهٔ मिलना با گوینده مطابقت می‌کند، پس زن मिली می‌گوید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson02.translate.005
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: من به خانه رفتم. (زن می‌گوید)
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं घर {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: زن गई استفاده می‌کند؛ مرد गया می‌گوید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson02.translate.006
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: من با پریا ملاقات کردم. (زن می‌گوید)
    language_code: prs
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से بعد از شخصی که با او ملاقات شده یعنی «با»؛ ختم فعل از گوینده پیروی می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson02.translate.007
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'گذشتهٔ فعل با انجام‌دهندهٔ کار مطابقت می‌کند: مرد मिला و زن मिली می‌گوید.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit12.lesson03.choose.001
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
