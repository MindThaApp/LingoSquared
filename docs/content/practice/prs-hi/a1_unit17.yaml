    slot: item
  feedback_frame:
    text: بعضی واژه‌های شغلی هندی شکل زنانهٔ جداگانه دارند، مثل शिक्षक و शिक्षिका، اما واژه‌های قرضی مثل इंजीनियर ندارند.
    language_code: prs
    direction: rtl
