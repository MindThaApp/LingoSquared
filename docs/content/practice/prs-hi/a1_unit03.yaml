templates:
- content_key: practice.prs-hi.hi.a1.unit03.lesson01.choose.001
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: نام روزهای هفته در هندی به -वार (روز هفته) ختم می‌شود، پس सोमवार، मंगलवार و रविवार همه پایان یکسان دارند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson02.listen.001
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: نام ماه‌ها در هندی به نام‌های جهانی ماه‌ها شباهت دارد، به همین خاطر जनवरी، मार्च و दिसंबर را آسان می‌شود شناخت.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson03.choose.001
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'अगली یعنی «بعدی» و با اسم مؤنث می‌آید: अगली क्लास یعنی صنف بعدی، ولی با اسم مذکر अगला می‌آید.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson03.match.002
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: با آج (امروز) کلمهٔ اضافی نمی‌آید، اما بعد از روز هفته को می‌آید (सोमवार को، روز دوشنبه) و بعد از نام ماه में (जनवरी में، در جنوری).
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson01.order.002
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: روز هفته نهاد جمله است، پس आज सोमवार है در ترجمهٔ لفظی یعنی «امروز دوشنبه است».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson01.order.003
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: योग क्लास {item} को है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {item} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'को بعد از روز هفته یعنی «در روز»: सोमवार को یعنی روز دوشنبه.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson02.fill.002
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: fill_in_blank
  frame:
    text: आज कितनी {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कितनी با اسم مؤنث तारीख़ هماهنگ می‌شود، به همین خاطر به -ी ختم می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson02.order.003
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: word_order
  frame:
    text: मेरा जन्मदिन {item} में है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {item} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'में بعد از نام ماه یعنی «در»: जनवरी में یعنی در جنوری.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson03.fill.003
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: अगली क्लास {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'कब یعنی «کی» و در جایی می‌آید که جواب می‌آمد: अगली क्लास मंगलवार को है.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson03.fill.004
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: कोई {item} नहीं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कोई बात नहीं جواب روزمره برای تشکر یا معذرت است، مثل «مشکلی نیست».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson01.translate.004
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: امروز کدام روز است؟
    language_code: prs
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} सा दिन है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कौन सा یعنی «کدام»؛ در آج कौन सा दिन है؟ می‌پرسد که امروز کدام روز هفته است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson02.translate.004
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: تولد من در {month} است.
    language_code: prs
    direction: rtl
    slot_rendering:
      month: english_gloss
  slots:
    month: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {month} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: نام ماه‌ها با में (در) می‌آید، ولی روزهای هفته با को.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson01.translate.005
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: صنف یوگا در روز {day} است.
    language_code: prs
    direction: rtl
    slot_rendering:
      day: english_gloss
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {day} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: روزهای هفته اسم مذکر استند و को روزی را نشان می‌دهد که کاری در آن اتفاق می‌افتد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson03.translate.005
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: translation
  frame:
    text: تولد تو کی است؟ (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा जन्मदिन {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'با آپ رسمی می‌گویی: आपका जन्मदिन कब है?'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit03.lesson02.translate.005
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: نام روزهای هفته و ماه‌ها در دیوناگری با حرف بزرگ نوشته نمی‌شود، چون این خط حرف بزرگ ندارد.
    language_code: prs
    direction: rtl
