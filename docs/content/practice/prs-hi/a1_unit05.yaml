templates:
- content_key: practice.prs-hi.hi.a1.unit05.lesson01.choose.001
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: «माता-पिता» (پدر و مادر) از «माता»، کلمه‌ی رسمی برای مادر، و «पिता» (پدر) ساخته شده، درست مثل «दादा-दादी» که هر دو، پدرکلان و مادرکلان را با هم می‌گوید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson02.listen.001
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: در هندی، پدرکلان و مادرکلانِ طرف پدر («दादा»، «दादी») از پدرکلان و مادرکلانِ طرف مادر («नाना»، «नानी») جدا است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson03.choose.001
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '«बड़ा» و «छोटा» با اسم‌های مذکر و «बड़ी» و «छोटी» با اسم‌های مؤنث می‌آیند، و هر کدام سن را هم نشان می‌دهند: کلان‌تر یا خورد‌تر.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson02.match.002
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'کلمه‌های فامیلی در هندی جفت‌جفت مذکر و مؤنث اند: «भाई» و «बहन»، «दादा» و «दादी»، «नाना» و «नानी».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson01.order.002
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरा {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: «भाई» مذکر است، پس «मेरा» می‌گیرد؛ کلمه‌ی مؤنث مثل «बहन» «मेरी» می‌گیرد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson01.order.003
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: «बहन» مؤنث است، پس ضمیر ملکی «मेरी» می‌شود، نه «मेरा».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson01.order.004
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरे {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: از احترام به بزرگ‌تر، «मेरा» به «मेरे» و «है» به «हैं» تبدیل می‌شود، حتی برای یک نفر.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson02.order.003
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: word_order
  frame:
    text: मेरे माता-पिता {city} में रहते हैं।
    language_code: hi
    direction: ltr
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: «में» بعد از نام شهر یعنی «در»، و فعل با فاعل جمع احترام «रहते हैं» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson03.order.002
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: word_order
  frame:
    text: मेरा एक {item} भाई भी है।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा एक {item} भाई भी है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: «बड़ा» و «छोटा» با اسم مذکر «भाई» هماهنگ می‌شوند، و «एक» در این‌جا یعنی «یک» به معنی نامعین، نه عدد «یک».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson01.fill.005
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: fill_in_blank
  frame:
    text: तुम्हारा {item} कहाँ रहता है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «परिवार» مفرد و مذکر حساب می‌شود، پس فعل «रहता है» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson02.fill.004
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: fill_in_blank
  frame:
    text: मेरे दादा-दादी दिल्ली में {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: با پدرکلان و مادرکلان که محترم و جمع حساب می‌شوند، فعل «रहते हैं» است، نه «रहता है».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson03.fill.003
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: fill_in_blank
  frame:
    text: मेरी भी एक {item} बहन है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «छोटी» شکل مؤنث است چون «बहन» مؤنث است؛ برای برادر «छोटा» می‌شد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson02.translate.005
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: translation
  frame:
    text: پدر و مادر من در {city} زندگی می‌کنند.
    language_code: prs
    direction: rtl
    slot_rendering:
      city: english_gloss
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: پدر و مادر بزرگ‌ترهای محترم اند، به همین خاطر «मेरे» و فعل جمع «रहते हैं» به کار می‌رود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson01.translate.006
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: فامیل تو کجا زندگی می‌کند؟ (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा {item} कहाँ रहता है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'با «आप»ی رسمی می‌گویی: «आपका परिवार कहाँ रहता है?»'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson01.translate.007
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: این پدر من است. (با احترام گفته می‌شود)
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'احترام دو بار نشان داده می‌شود: «मेरे» به جای «मेरा» و «हैं» به جای «है».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit05.lesson01.translate.008
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: در هندی برای پدرکلان دو کلمه و برای مادرکلان هم دو کلمه وجود دارد، به این بستگی دارد که از طرف پدر باشند یا از طرف مادر.
    language_code: prs
    direction: rtl
