templates:
- content_key: practice.prs-hi.hi.a1.unit08.lesson01.choose.001
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: همهٔ این کلمه‌های مکان مذکر اند، پس هر فعل یا صفتی که با آن‌ها هماهنگ شود، شکل -ा می‌گیرد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson01.listen.002
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: یہاں و وہاں قید اند، پس برای جنسیت یا جمع تغییر نمی‌کنند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson01.order.003
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: word_order
  frame:
    text: मैं {item} में हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: میں بعد از یک مکان یعنی «در»، و ہوں با مَیں می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson01.order.004
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: word_order
  frame:
    text: बैंक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'فعل ہے معمولاً در آخر و بعد از کلمهٔ مکان می‌آید: بینک وہاں ہے لفظ‌به‌لفظ یعنی «بانک آنجا است».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson01.fill.005
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: fill_in_blank
  frame:
    text: स्कूल {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: यहाँ یعنی اینجا، نزدیک گوینده، و वहाँ یعنی آنجا، دور از گوینده.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson01.translate.006
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: translation
  frame:
    text: بانک آنجاست.
    language_code: prs
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: در هندی حرف تعریف یا نکره وجود ندارد، پس बैंक می‌تواند یعنی «یک بانک» یا «بانک».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson01.translate.007
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: هندی برای جای‌ها بسیار کلمه‌های قرضی انگلیسی دارد، مثل स्कूल، बैंक، पार्क و स्टेशन.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson02.choose.001
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पास، सामने و पीछे بعد از جای مرجع के می‌گیرند: बैंक के पास، یعنی «نزدیک بانک».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson02.match.002
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
