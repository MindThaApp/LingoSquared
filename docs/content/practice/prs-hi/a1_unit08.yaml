  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'کلمه‌های مکان در هندی جفت‌های متضاد دارند: यहाँ و वहाँ، पास و दूर، सामने و पीछे.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson02.order.003
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: word_order
  frame:
    text: स्कूल बैंक के {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: स्कूल बैंक के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के جای مرجع را به पास، सामने یا पीछे وصل می‌کند، مثل «اضافه» در «روبه‌روی بانک».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson02.fill.004
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: fill_in_blank
  frame:
    text: पार्क स्कूल के {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पीछे و सामने ضد همدیگرند، پس همان دو جا را از هر دو طرف می‌شود توصیف کرد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson02.fill.005
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: fill_in_blank
  frame:
    text: स्टेशन {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'दूर می‌تواند تنها بیاید (स्टेशन दूर है)، و با جای مرجع से می‌گیرد، نه के: बैंक से दूर.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson02.translate.006
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: translation
  frame:
    text: مکتب روبه‌روی پارک است.
    language_code: prs
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: स्कूल पार्क के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के بعد از جای مرجع، آن را به सामने یعنی «روبه‌روی» وصل می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson02.translate.007
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: translation
  frame:
    text: بانک نزدیک مکتب است.
    language_code: prs
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक स्कूल के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: این पास یعنی «نزدیک»؛ در मेरे पास یعنی «من دارم»، یک کلمه با دو کاربرد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit08.lesson03.listen.001
