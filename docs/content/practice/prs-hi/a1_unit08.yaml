  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: तो در हाँ, तो ... نتیجه‌گیری را نشان می‌دهد، و थोड़ा یعنی «کمی».
    language_code: prs
    direction: rtl
