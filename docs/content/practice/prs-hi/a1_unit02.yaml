templates:
- content_key: practice.prs-hi.hi.a1.unit02.lesson01.choose.001
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عددهای هندی بی‌قاعده‌اند و باید یکی‌یکی یاد گرفته شوند؛ مثلاً छह شش و सात هفت است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit02.lesson01.listen.002
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عددهای هندی از یازده تا نود و نه بی‌قاعده‌اند، پس هر کدام، مثل पंद्रह (پانزده) یا पचास (پنجاه)، باید جداگانه یاد گرفته شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit02.lesson02.match.001
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: اسم‌های هندی مثل नंबर، फ़ोन و कीमत بدون «یک» یا حرف تعریف استفاده می‌شوند؛ از روی جمله معلوم می‌شود که منظور «یک قیمت» است یا «قیمتِ مشخص».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit02.lesson02.fill.002
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: इसकी {item} पचास रुपये है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इसकी یعنی «مال این» و با اسم مؤنث कीमत هماهنگ است؛ برای همین به -ी ختم می‌شود، نه -ा.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit02.lesson02.order.003
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: इसकी कीमत {item} रुपये है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी कीमत {item} रुपये है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'در هندی عدد پیش از چیزِ شمرده‌شده می‌آید و فعل है آخر جمله می‌ماند: इसकी कीमत पचास रुपये है.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit02.lesson02.translate.004
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: قیمتش چند است؟
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी {item} क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'در هندی ترتیب کلمات در سوال مثل جملهٔ خبری است: इसकी कीमत पचास रुपये है جواب इसकी कीमत क्या है? می‌باشد.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit02.lesson03.choose.001
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'صفت‌های ملکی با چیزِ مالکیت‌شده هماهنگ می‌شوند: आपका फ़ोन नंबर از आपका مذکر استفاده می‌کند، ولی आपकी उम्र از آپکی مؤنث.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit02.lesson03.order.002
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: मेरी उम्र {item} साल है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {item} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'سن با تعداد साल (سال) و है گفته می‌شود: در ترجمهٔ لفظی «عمرِ من سی سال است».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit02.lesson03.order.003
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: आपका {item} नंबर क्या है?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: आपका «شما»ی محترمانه است و اینجا مذکر آمده چون नंबर مذکر است؛ با تُم باید तुम्हारा بگویین.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit02.lesson03.fill.004
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: मेरी उम्र तीस {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'साल (سال) بعد از عدد جمع نمی‌شود و شکلش تغییر نمی‌کند: तीस साल یعنی «سی سال».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit02.lesson03.translate.005
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: عمر من {n} سال است.
    language_code: prs
    direction: rtl
    slot_rendering:
      n: english_gloss
  slots:
    n: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {n} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: उम्र اسم مؤنث است، پس صفت ملکی मेरी می‌آید، نه मेरा.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit02.lesson03.translate.006
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: شمارهٔ تلیفون تان چند است؟ (رسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: شمارهٔ تلیفون در هندی رقم به رقم خوانده می‌شود، مثلاً छह दो आठ तीन पाँच.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit02.lesson03.translate.007
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بعد از عددی بیشتر از یک، پول با شکل جمع रुपये شمرده می‌شود؛ شکل مفرد रुपया است.
    language_code: prs
    direction: rtl
