templates:
- content_key: practice.prs-hi.hi.a1.unit01.lesson01.choose.001
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'هندی برای «شما» دو کلمه دارد: आप رسمی و محترمانه است، و तुम غیررسمی است و با دوستان و کسانی که هم‌سن یا خُردتر از شما استند استفاده می‌شود.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson01.fill.002
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'فعل «بودن» با فاعل تغییر می‌کند: हूँ با मैं، हो با तुम و हैं با आप می‌آید.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson01.order.003
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: word_order
  frame:
    text: आप {item} हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'کلمهٔ سوالی با شخصی که از او پرسیده می‌شود هماهنگ است: कैसे برای مرد و कैसी برای خانم، ولی आप همیشه हैं می‌گیرد.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson01.translate.004
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: حال تو چطور است؟ (غیررسمی، از یک مرد)
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'با तुम فعل हो است؛ برای پرسیدن از یک خانم कैसे به कैसी تغییر می‌کند: तुम कैसी हो?'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson01.translate.005
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: حال شما چطور است؟ (محترمانه، از یک خانم)
    language_code: prs
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: आप در حالت محترمانه حتی برای یک نفر هم हैं (شکل جمع‌مانند) می‌گیرد، و कैसी شکل مؤنث «چطور» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson02.listen.001
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अलविदा خداحافظی است؛ در گفتار روزمره नमस्ते هم برای سلام و هم برای خداحافظی استفاده می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson02.order.002
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: word_order
  frame:
    text: आपका {item} अच्छा रहे।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} अच्छा रहे।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रहे این جمله را دعا می‌سازد (خوب بماند)، و आपका نشان می‌دهد که با आप محترمانه گفته می‌شود؛ با तुम می‌شود तुम्हारा.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson02.match.003
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'در هندی برای «یک» و «این/آن» (حرف تعریف) کلمهٔ جداگانه نیست: नाम بسته به جمله می‌تواند «نام»، «یک نام» یا «این نام» باشد.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson03.choose.001
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'در جمله‌های پرسشی هندی ترتیب کلمات مثل جملهٔ خبری می‌ماند: کلمهٔ پرسشی कहाँ جای جواب را می‌گیرد (आप कहाँ से हैं? و मैं भारत से हूँ).'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson03.order.002
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मेरा नाम {name} है।
    language_code: hi
    direction: ltr
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: در هندی فعل در آخر جمله می‌آید، پس मेरा नाम ... है یعنی «نام من ... است».
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson03.order.003
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मैं {place} से हूँ।
    language_code: hi
    direction: ltr
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से بعد از جای می‌آید و معنایش «از» است؛ این کلمه حرف اضافهٔ پس‌آیند است، نه پیش‌آیند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson03.fill.004
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: fill_in_blank
  frame:
    text: आपसे मिलकर {item} हुई। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: این شکل محترمانهٔ «از ملاقات با شما خوش شدم» است، لفظاً «با دیدن شما خوشی شد»؛ شکل غیررسمی آن तुमसे मिलकर अच्छा लगा است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson03.translate.005
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: نام من {name} است.
    language_code: prs
    direction: rtl
    slot_rendering:
      name: english_gloss
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नाम اسم مذکر است، پس همه، چه مرد و چه زن، می‌گویند मेरा नाम.
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson03.translate.006
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: من اهل {place} استم.
    language_code: prs
    direction: rtl
    slot_rendering:
      place: english_gloss
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'یک خانم هم می‌گوید मैं भारत से हूँ: فعل हूँ با جنسیت گوینده تغییر نمی‌کند.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson03.translate.007
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: تو از کجا می‌آیی؟ (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} से हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'برای پرسیدن همین سوال به شکل محترمانه، आप را با हैं بگیرین: आप कहाँ से हैं?'
    language_code: prs
    direction: rtl
- content_key: practice.prs-hi.hi.a1.unit01.lesson03.translate.008
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اسم‌های هندی مذکر یا مؤنث‌اند: दिन، नाम و योग مذکرند، खुशी مؤنث است.'
    language_code: prs
    direction: rtl
