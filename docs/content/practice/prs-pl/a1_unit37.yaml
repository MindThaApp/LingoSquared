schema_version: '1.0'
pack_key: practice.prs-pl.a1.unit37
source_language: prs
target_language: pl
unit_content_key: pl.a1.unit37.kolory
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dari (Afghanistan)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_biały
    - w_chciałaby
    - w_czerwony
    - w_fioletowy
    - w_idą
    - w_językową
    - w_kawiarnię
    - w_koloru
    - w_kończy
    - w_kupują
    - w_kwiatowy
    - w_pomarańczowy
    - w_różowy
    - w_targ
    - w_tulipany
    - w_tulipanów
    - w_tutaj
    - w_upiększają
    - w_wybierasz
    - w_ładne
    - w_żółty
templates:
- content_key: practice.prs-pl.pl.a1.unit37.lesson01.choose.001
  lesson_content_key: pl.a1.unit37.lesson01.czerwony_i_zolty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_tulipany
        - w_tutaj
        - w_czerwony
        - w_żółty
        - w_koloru
        - w_biały
        - w_pomarańczowy
        - w_różowy
        - w_wybierasz
        - w_kończy
        - w_fioletowy
        - w_tulipanów
        - w_idą
        - w_targ
        - w_kwiatowy
        - w_chciałaby
        - w_kupują
        - w_ładne
        - w_upiększają
        - w_kawiarnię
        - w_językową
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس سرخ و زرد.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit37.lesson02.listen.001
  lesson_content_key: pl.a1.unit37.lesson02.bialy_i_pomaranczowy
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس سفید و نارنجی.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit37.lesson03.translate.001
  lesson_content_key: pl.a1.unit37.lesson03.rozowy_i_fioletowy
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس گلابی و بنفش.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit37.lesson04.match.001
  lesson_content_key: pl.a1.unit37.lesson04.nina_i_ewa_na
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر کلمهٔ پولندی را با معنی‌اش جور کنید؛ کلمه‌ها از درس‌های همین بخش اند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit37.lesson05.choose.001
  lesson_content_key: pl.a1.unit37.lesson05.nina_i_ewa_kupuja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درسی که نینا و اوا لاله می‌خرند.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit37.lesson06.translate.001
  lesson_content_key: pl.a1.unit37.lesson06.tulipany_dla_kawiarni_jezykowej
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های این واحد است، از درس لاله‌ها برای کافه‌ی زبان‌ها.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit37.lesson01.order.002
  lesson_content_key: pl.a1.unit37.lesson01.czerwony_i_zolty
  type: word_order
  frame:
    text: Tulipany są {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_tutaj
  answer_derivation:
    kind: render_frame
    frame:
      text: Tulipany są {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: لاله‌ها اینجا استند. tutaj یعنی اینجا.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit37.lesson03.order.002
  lesson_content_key: pl.a1.unit37.lesson03.rozowy_i_fioletowy
  type: word_order
  frame:
    text: To jest {item}, a to jest fioletowy.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_różowy
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest {item}, a to jest fioletowy.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: این گلابی است و آن بنفش است. różowy یعنی گلابی (مذکر).
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit37.lesson04.order.002
  lesson_content_key: pl.a1.unit37.lesson04.nina_i_ewa_na
  type: word_order
  frame:
    text: To kosztuje dwadzieścia pięć złotych za pięć {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_tulipanów
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje dwadzieścia pięć złotych za pięć {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: پنج لاله بیست و پنج زلوتی تمام می‌شود. tulipanów یعنی «از لاله‌ها».
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit37.lesson05.order.002
  lesson_content_key: pl.a1.unit37.lesson05.nina_i_ewa_kupuja
  type: word_order
  frame:
    text: Nina i Ewa lubią {item} kwiatowy.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_targ
  answer_derivation:
    kind: render_frame
    frame:
      text: Nina i Ewa lubią {item} kwiatowy.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: نینا و اوا بازار گل را جالب می‌یابند. targ یعنی بازار.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit37.lesson06.order.002
  lesson_content_key: pl.a1.unit37.lesson06.tulipany_dla_kawiarni_jezykowej
  type: word_order
  frame:
    text: Tulipany {item} kawiarnię językową!
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_upiększają
  answer_derivation:
    kind: render_frame
    frame:
      text: Tulipany {item} kawiarnię językową!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: لاله‌ها کافه‌ی زبان را قشنگ می‌سازند! upiększają یعنی «قشنگ می‌کنند».
    language_code: prs
    direction: rtl
