    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعد از możemy فعل دوم به شکل اصلی‌اش می‌ماند: spotkać.'
    language_code: prs
    direction: rtl
