  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این واحد است، از درس تیلیفون بعد از نوبت کاری.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: با کی صحبت می‌کنم؟ Z kim rozmawiam? (در اصل «با چه کسی صحبت می‌کنم؟») عبارت معمول برای کسی است که ناشناس زنگ زده؛ kim بعد از z در حالت وسیله‌ای می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: شده می‌توانی این را دوباره بگویی؟ Możesz (می‌توانی، از móc) + مصدر powtórzyć (تکرار کردن) + to (این).
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: لطفاً این‌قدر تیز صحبت نکن. Nie mów شکل نهی منفی است (صحبت نکن)؛ tak szybko یعنی «این‌قدر تیز».
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: صدایت را خوب نمی‌شنوم.
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: تو را خوب نمی‌شنوم. Nie słyszę cię dobrze مشکل شنیدن را می‌رساند؛ cię حالت مفعولی ty است و dobrze یعنی «خوب».
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: اولین شفت کاری‌ات چطور گذشت؟ Jak ci poszła ...؟ (در اصل «برایت چطور رفت ...؟») درباره چیزی می‌پرسد که گذشته است. Ci حالت رسایی ty است و poszła با اسم مؤنث zmiana هماهنگ می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اولین شفت کاری او واقعاً خوب گذشت. Jego (او، مال او) هرگز تغییر نمی‌کند و پیش از اسم می‌آید: jego pierwsza zmiana؛ مؤنث بودن اسم بر آن اثر ندارد.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: واقعاً خوب پیش رفت، بهتر از آنچه فکر می‌کردم.
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: واقعاً خوب پیش رفت، بهتر از آنچه فکر می‌کردم. Poszło گذشته iść با پایان -o است («آن»؛ اینجا یعنی «از آب درآمدن»)؛ myślałem گذشته myśleć (فکر کردن) است، با پایان گوینده مرد.
    language_code: prs
    direction: rtl
