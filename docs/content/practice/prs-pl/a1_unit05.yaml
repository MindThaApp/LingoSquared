templates:
- content_key: practice.prs-pl.pl.a1.unit05.lesson01.choose.001
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: کلمه‌های خانواده در لهستانی جفت مذکر و مؤنث دارند، مثل ojciec و matka یا brat و siostra.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson01.listen.002
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rodzice (والدین) همیشه جمع است، پس moi می‌گیرد، نه mój یا moja.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson01.match.003
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'کلمه‌های خانواده بر اساس جنسیت جفت می‌شوند: dziadek و babcia، wujek و ciotka، syn و córka.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson01.order.004
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest mój {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest mój {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mój با اسم‌های مذکر مثل ojciec، brat و dziadek می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson01.order.005
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest moja {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest moja {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja با اسم‌های مؤنث می‌آید که بیشترشان به -a ختم می‌شوند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson01.fill.006
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: fill_in_blank
  frame:
    text: To jest {item} ojciec. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ضمیر ملکی با اسم هماهنگ می‌شود: mój ojciec، ولی moja matka.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson01.translate.007
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: این مادرم است.
    language_code: prs
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest {item} matka.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja شکل مؤنثِ «من/م» است؛ شکل مذکرش mój است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson01.translate.008
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: این‌ها والدین من اند.
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To są {item} rodzice.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rodzice جمع است و به انسان‌ها اشاره می‌کند، پس ضمیر ملکی moi است و فعل به‌جای jest، są می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson02.choose.001
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mieć یعنی داشتن، و کسی که دارد شکل فعل را تعیین می‌کند: mam، masz، ma.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson02.translate.002
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieć (داشتن) شکل فرهنگ لغت است؛ در جمله‌ها به شکل mam، masz یا ma می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson02.order.003
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: word_order
  frame:
    text: Mam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'بعد از mam، چیزی که دارید شکل مفعولی می‌گیرد: brat می‌شود brata و siostra می‌شود siostrę.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson02.fill.004
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: fill_in_blank
  frame:
    text: Tak, mam brata {item} siostrę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: کلمهٔ i دو چیز را به هم وصل می‌کند، مثل brata i siostrę، و شکلش هرگز تغییر نمی‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson02.translate.005
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: من یک پسر و یک دختر دارم.
    language_code: prs
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam syna i {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'اسم‌های مؤنثِ ختم‌شده به -a در حالت مفعولی به -ę تغییر می‌کنند: córka می‌شود córkę.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson03.choose.001
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: در لهستانی on برای «او» (مذکر) و ona برای «او» (مؤنث) است، و فعل mieszka با هر دو می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson03.translate.002
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tylko یعنی «فقط»، و lub «یا» است که برای انتخاب استفاده می‌شود، مثل brata lub siostrę.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson03.order.003
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: word_order
  frame:
    text: Mój brat mieszka w {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mój brat mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: بعد از w، نام شهرها یک پایانهٔ خاص می‌گیرند، مثل w Gdańsku و w Krakowie.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson03.fill.004
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: fill_in_blank
  frame:
    text: Ona {item} w Krakowie. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieszka شکل «او» این فعل است و mieszkam از بخش اول، شکل «من» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit05.lesson03.translate.005
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: او در گدانسک زندگی می‌کند. (ضمیر را هم بنویسین)
    language_code: prs
    direction: rtl
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: On mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'پایانهٔ -u بعد از w نشان می‌دهد که کسی کجا زندگی می‌کند: w Gdańsku.'
    language_code: prs
    direction: rtl
