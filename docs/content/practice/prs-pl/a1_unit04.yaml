templates:
- content_key: practice.prs-pl.pl.a1.unit04.lesson01.choose.001
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ساعت‌ها در زبان پولندی از عددهای ترتیبی مؤنث (pierwsza, druga, trzecia) استفاده می‌کنند، چون با کلمهٔ نگفتهٔ godzina هماهنگ می‌شوند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson01.listen.002
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: برای گفتن وقت، زبان پولندی pierwsza, druga, trzecia می‌گوید، نه pierwszy, drugi, trzeci.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson01.translate.003
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ساعت‌ها عددهای ترتیبی اند: pierwsza به معنی لفظی «اول» است، پس ساعت یک یعنی «ساعت اول».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson01.order.004
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: word_order
  frame:
    text: Która jest godzina? Jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Która jest godzina? Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: جواب Która jest godzina? به سادگی Jest + ساعت است، با عدد ترتیبی مؤنث.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson01.fill.005
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: fill_in_blank
  frame:
    text: Która jest {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Która jest godzina? راه معمول پرسیدن ساعت است؛ która مؤنث است چون godzina مؤنث است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson01.translate.006
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: ساعت سه است. (دو کلمه)
    language_code: prs
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ساعت یک عدد ترتیبی مؤنث است، پس ساعت سه trzecia است، نه trzy.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson02.choose.001
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rano یعنی در صبح، wieczorem یعنی در شام، و w nocy یعنی در شب.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson02.listen.002
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: در Ewa wstaje o siódmej rano اول ساعت می‌آید و بعد وقت روز.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson02.translate.003
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
