    text: Rano (در صبح) و wieczorem (در شام) حرف اضافه نمی‌خواهند، اما ظهر و شب w południe و w nocy اند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson02.order.005
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: word_order
  frame:
