  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje و odjeżdża شکل‌های شخص سوم مفرد اند که به -e یا -a ختم می‌شوند، نه به -m.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson02.match.004
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: matching_pairs
