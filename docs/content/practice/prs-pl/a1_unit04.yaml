    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa wstaje o siódmej {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa wstaje o siódmej rano اول ساعت را می‌گوید و بعد وقت روز را.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson02.order.006
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: word_order
  frame:
    text: Pociąg odjeżdża o czwartej po {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg odjeżdża o czwartej po {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Po południu یعنی بعد از ظهر، در حالی که «در ظهر» w południe است، با ختم دیگر.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson02.fill.007
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: fill_in_blank
  frame:
    text: Ewa {item} o siódmej rano. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje شکل شخص سوم مفرد فعل است، به همین دلیل با Ewa جور می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson02.translate.008
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: در کدام ساعت؟ (سه کلمه)
    language_code: prs
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: O której {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: O której godzinie یعنی در کدام ساعت، و هر دو کلمه ختمی را می‌گیرند که بعد از o می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson02.translate.009
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: قطار ساعت چهار بعد از ظهر حرکت می‌کند.
    language_code: prs
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg {item} o czwartej po południu.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'بعد از o ختم ساعت تغییر می‌کند: czwarta به o czwartej تبدیل می‌شود.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson03.order.001
  lesson_content_key: pl.a1.unit04.lesson03.ustalamy_godzine_spotkania
  type: word_order
  frame:
    text: Dobrze, {item} o czwartej po południu?
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może یعنی شاید و یک پیشنهاد را نرم می‌سازد، مثل «شاید ساعت چهار؟»
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit04.lesson03.translate.002
  lesson_content_key: pl.a1.unit04.lesson03.ustalamy_godzine_spotkania
  type: translation
  frame:
    text: خوب، شاید ساعت چهار بعد از ظهر؟
    language_code: prs
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może یک پیشنهاد را به پیشنهاد مؤدبانه تبدیل می‌کند، مثل Może o czwartej?
    language_code: prs
    direction: rtl
