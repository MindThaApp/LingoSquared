  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس «خواندن یک پیام دربارهٔ احساسات».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson06.translate.001
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این واحد است، از درس «Ewa به Marek دلداری می‌دهد».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson01.order.002
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: word_order
  frame:
    text: Dlaczego jesteś {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_szczęśliwy
  answer_derivation:
    kind: render_frame
    frame:
      text: Dlaczego jesteś {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: چرا خوشحال استی؟ Dlaczego (چرا) کلمهٔ پرسشی معمول برای پرسیدن دلیل است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson01.fill.003
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: fill_in_blank
  frame:
    text: Nie jestem zły, jestem {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smutny
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smutny
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'من عصبانی نیستم، غمگین استم. Nie درست پیش از فعل می‌آید: Nie jestem zły. جملهٔ دوم بعد از آن احساس واقعی را می‌گوید.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson02.order.002
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: word_order
  frame:
    text: Jestem szczęśliwy, bo mam {item} mieszkanie.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nowe
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem szczęśliwy, bo mam {item} mieszkanie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'من خوشحال استم چون آپارتمان نو دارم. Bo (چون) دلیل را معرفی می‌کند؛ بعد از mam (دارم) اسم در حالت مفعولی می‌آید: nowe mieszkanie.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson02.fill.003
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: fill_in_blank
  frame:
    text: Jestem smutny, bo pada {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_deszcz
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_deszcz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: من غمگین استم چون باران می‌بارد. Pada deszcz (باران می‌بارد، تحت‌اللفظی «باران می‌افتد») عبارت معمول هوا است که اینجا به‌عنوان دلیل آمده.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson03.order.002
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: word_order
  frame:
    text: Jestem {item} przed pierwszą zmianą.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_zdenerwowany
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem {item} przed pierwszą zmianą.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: من از اولین نوبت کاری‌ام عصبی استم. zdenerwowany یعنی عصبی (مذکر).
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson03.fill.003
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: fill_in_blank
  frame:
    text: Cześć, Marku, jak się czujesz przed {item} zmianą? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: سلام Marek، پیش از اولین نوبت کاری‌ات چطور احساس می‌کنی؟ Przed pierwszą zmianą (دربارهٔ اولین نوبت کاری‌ات) الگوی przed + حالت ابزاری درس سوم را دوباره به کار می‌برد. Czujesz się شکل ty است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson03.translate.004
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
    text: غم نخور.
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_martw
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} się.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: غصه نخور. Nie martw się (تحت‌اللفظی «خودت را غصه نده») عبارت معمول دلداری است؛ się ضمیر انعکاسی است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson04.order.002
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: word_order
  frame:
    text: Jak {item} się Marek?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_czuje
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak {item} się Marek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Marek چطور احساس می‌کند؟ Czuć się (احساس کردن، انعکاسی) روش معمول پرسیدن یا بیان حالت احساسی است: Jak czuje się Marek?'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson05.order.002
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: word_order
  frame:
    text: Tak, ja też tak {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_myślę
  answer_derivation:
    kind: render_frame
    frame:
      text: Tak, ja też tak {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: بلی، من هم همین‌طور فکر می‌کنم. Ja też tak myślę (تحت‌اللفظی «من هم همین‌طور فکر می‌کنم») روش طبیعی موافقت است؛ ja اینجا برای تأکید آمده.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson06.order.002
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: word_order
  frame:
    text: Szczerze {item}, jestem trochę zdenerwowany.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mówiąc
  answer_derivation:
    kind: render_frame
    frame:
      text: Szczerze {item}, jestem trochę zdenerwowany.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: راستش کمی عصبی استم. Szczerze mówiąc (راستش، تحت‌اللفظی «صادقانه گفته») اعتراف را نرم می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson06.fill.003
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: fill_in_blank
  frame:
    text: Nie martw się, dobrze sobie {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: غصه نخور، خوب از عهده برمی‌آیی! Dobrze sobie poradzisz (تحت‌اللفظی «خوب از عهده برمی‌آیی») عبارت ثابت و دلگرم‌کننده است؛ poradzisz آیندهٔ ty از poradzić sobie است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson06.translate.004
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame:
    text: تشکر، واقعاً کمک می‌کند.
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_naprawdę
  answer_derivation:
    kind: render_frame
    frame:
      text: Dzięki, to {item} pomaga.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: تشکر، واقعاً کمک می‌کنه. Pomaga شکل «او» (on/ona/ono) فعل pomagać (کمک کردن) است؛ dzięki شکل غیررسمی «تشکر» است.
    language_code: prs
    direction: rtl
