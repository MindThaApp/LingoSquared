schema_version: '1.0'
pack_key: practice.prs-pl.a1.unit21
source_language: prs
target_language: pl
unit_content_key: pl.a1.unit21.emocje
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dari (Afghanistan)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_będziesz
    - w_czuje
    - w_deszcz
    - w_dumny
    - w_martw
    - w_myślę
    - w_mówiąc
    - w_naprawdę
    - w_nowe
    - w_pewno
    - w_pierwszą
    - w_pomaga
    - w_poradzisz
    - w_pracę
    - w_samodzielną
    - w_smutny
    - w_szczerze
    - w_szczęśliwy
    - w_zdenerwowany
    - w_zmianą
templates:
- content_key: practice.prs-pl.pl.a1.unit21.lesson01.choose.001
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_szczęśliwy
        - w_smutny
        - w_nowe
        - w_deszcz
        - w_zdenerwowany
        - w_pierwszą
        - w_zmianą
        - w_martw
        - w_czuje
        - w_samodzielną
        - w_pracę
        - w_myślę
        - w_szczerze
        - w_mówiąc
        - w_poradzisz
        - w_naprawdę
        - w_pomaga
        - w_pewno
        - w_będziesz
        - w_dumny
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس «خوش، غمگین یا خشمگین».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson02.listen.001
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس «چرا خوش استی؟».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit21.lesson03.translate.001
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
