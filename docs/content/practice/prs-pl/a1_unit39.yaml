  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dari (Afghanistan)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_alarmowy
    - w_bibliotece
    - w_chodź
    - w_dzieje
    - w_dzwonię
    - w_ewakuacyjne
    - w_idźcie
    - w_karetka
    - w_policja
    - w_pomoc
    - w_pomocy
    - w_potrzebny
    - w_potrzebuje
    - w_pożar
    - w_spokojnie
    - w_straż
    - w_uwaga
    - w_wyjścia
    - w_wyjście
    - w_zadzwoń
    - w_zewnątrz
templates:
- content_key: practice.prs-pl.pl.a1.unit39.lesson01.choose.001
  lesson_content_key: pl.a1.unit39.lesson01.pomoc_i_pozar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_pomoc
        - w_pomocy
        - w_pożar
        - w_potrzebny
        - w_alarmowy
        - w_zadzwoń
        - w_wyjście
        - w_ewakuacyjne
        - w_dzwonię
        - w_policja
        - w_karetka
        - w_straż
        - w_uwaga
        - w_idźcie
        - w_wyjścia
        - w_spokojnie
        - w_chodź
        - w_bibliotece
        - w_potrzebuje
        - w_zewnątrz
        - w_dzieje
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس کمک و آتش‌سوزی.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit39.lesson02.listen.001
  lesson_content_key: pl.a1.unit39.lesson02.numer_alarmowy_i_wyjscie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس شماره عاجل و دروازهٔ خروج عاجل.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit39.lesson03.translate.001
  lesson_content_key: pl.a1.unit39.lesson03.policja_karetka_lub_straz
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس پولیس، امبولانس یا آتش‌نشانی.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit39.lesson04.match.001
  lesson_content_key: pl.a1.unit39.lesson04.pozar_w_kawiarni_jezykowej
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر کلمهٔ پولندی را با معنی‌اش جور کنید؛ کلمه‌ها از درس‌های همین بخش اند.
    language_code: prs
    direction: rtl
