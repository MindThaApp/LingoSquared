- content_key: practice.prs-pl.pl.a1.unit39.lesson03.order.002
  lesson_content_key: pl.a1.unit39.lesson03.policja_karetka_lub_straz
  type: word_order
  frame:
    text: Policja, {item} czy straż pożarna?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_karetka
  answer_derivation:
    kind: render_frame
    frame:
      text: Policja, {item} czy straż pożarna?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: پولیس، آمبولانس یا آتش‌نشانی؟ Policja, karetka czy straż pożarna? سوالی است که وقتی به ۱۱۲ زنگ می‌زنید می‌شنوید؛ ۱۱۲ نمبر اضطراری در پولند و سراسر اروپا است. Karetka یعنی آمبولانس.
    language_code: prs
    direction: rtl
