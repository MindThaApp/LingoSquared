    language_code: prs
    direction: rtl
- content_key: practice.prs-pl.pl.a1.unit39.lesson06.translate.001
  lesson_content_key: pl.a1.unit39.lesson06.tomek_przychodzi
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
