schema_version: "1.0"
pack_key: practice.en-ro.a1.unit15
source_language: en
target_language: ro
unit_content_key: ro.a1.unit15.travel
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ro job C) from scripts/backfill_lexemes_en_ro.py
    lexemes (ro_a1_u15* tags). Recognition, matching and bare-word production use curated
    w_ pools of this unit's own tokens (no two members share a gloss); sentence frames use
    single w_ anchors. English prompts name tu versus dumneavoastră register and speaker gender where it matters.
    Feedback lines carry a usage or grammar point. Reviewer: confirm La ce oră pleacă trenul?, De la peronul trei, Aș dori un bilet la București with vă rog, and Drum bun!.
    Opus quality pass 2026-10-24: bilet and drum feedback fixed to neuter; bun gloss now masc. and neut.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_tren, w_pleacă, w_peron, w_trenul, w_peronul, w_bilet, w_București, w_drum, w_bun]
slot_presets:
  a_pool: &a_pool {language_code: ro, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_tren, w_pleacă, w_peron, w_trenul, w_peronul]}}
  all6: &all6 {language_code: ro, part_of_speech: [noun, proper_noun, verb], agreement_tags: {semantic: [w_tren, w_pleacă, w_peron, w_bilet, w_București, w_drum]}}
  b_pool: &b_pool {language_code: ro, part_of_speech: [noun, proper_noun], agreement_tags: {semantic: [w_bilet, w_București, w_drum, w_tren, w_peron]}}
  c_pool: &c_pool {language_code: ro, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_drum, w_bun, w_tren, w_bilet]}}
  t_trenul: &t_trenul {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_trenul}}
  t_peronul: &t_peronul {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_peronul}}
  t_pleaca: &t_pleaca {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_pleacă}}
  t_bilet: &t_bilet {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_bilet}}
  t_bun: &t_bun {language_code: ro, part_of_speech: adjective, agreement_tags: {semantic: w_bun}}
templates:
  - content_key: practice.en-ro.ro.a1.unit15.lesson01.choose.001
    lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *a_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Trenul and peronul are tren and peron with the article -ul added at the end.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson01.listen.002
    lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
    type: listen_select
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *a_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pleacă is the verb for leaves, used with trenul in La ce oră pleacă trenul?", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson01.order.003
    lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
    type: word_order
    frame: {text: "La ce oră {item} trenul?", language_code: ro, direction: ltr}
    slots: {item: *t_pleaca}
    answer_derivation: {kind: render_frame, frame: {text: "La ce oră {item} trenul?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Pleacă fits he, she or it, so it works with trenul.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson01.order.004
    lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
    type: word_order
    frame: {text: "Trenul este la {item} trei.", language_code: ro, direction: ltr}
    slots: {item: *t_peronul}
    answer_derivation: {kind: render_frame, frame: {text: "Trenul este la {item} trei.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Peronul is peron plus the article, so it means the platform.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson01.fill.005
    lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
    type: fill_in_blank
    frame: {text: "Trenul {item} la ora nouă. ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_pleaca, hint: *t_pleaca}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pleacă is the third-person form: it leaves.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson01.translate.006
    lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
    type: translation
    frame: {text: "What time does the train leave?", language_code: en, direction: ltr}
    slots: {item: *t_trenul}
    answer_derivation: {kind: render_frame, frame: {text: "La ce oră pleacă {item}?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Trenul is tren plus -ul, the train; ora nouă tells the hour.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson01.translate.007
    lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
    type: translation
    frame: {text: "The train leaves at nine.", language_code: en, direction: ltr}
    slots: {item: *t_pleaca}
    answer_derivation: {kind: render_frame, frame: {text: "Trenul {item} la ora nouă.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "La ora nouă gives the hour; the verb stays the same for he, she or it.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson01.translate.008
    lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
    type: translation
    frame: {text: "The train is at platform three.", language_code: en, direction: ltr}
    slots: {item: *t_peronul}
    answer_derivation: {kind: render_frame, frame: {text: "Trenul este la {item} trei.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Peronul trei means platform three, with the article on the noun.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson02.choose.001
    lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *b_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Bilet means ticket and București is the capital city.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson02.listen.002
    lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
    type: listen_select
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *b_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Bilet is neuter: un bilet in the singular, două bilete in the plural.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson02.match.003
    lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ro, direction: ltr}
    slots: {first: *all6, second: *all6, third: *all6, fourth: *all6, fifth: *all6, sixth: *all6}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Tren, peron, bilet and drum are nouns; pleacă is a verb; București is a proper name.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson02.order.004
    lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
    type: word_order
    frame: {text: "Am un {item}.", language_code: ro, direction: ltr}
    slots: {item: *t_bilet}
    answer_derivation: {kind: render_frame, frame: {text: "Am un {item}.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Bilet is neuter, and neuter nouns take un in the singular.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson02.fill.005
    lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
    type: fill_in_blank
    frame: {text: "Aș dori un {item} la București, vă rog. ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_bilet, hint: *t_bilet}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Aș dori un bilet is a polite request; vă rog suits dumneavoastră.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson02.translate.006
    lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
    type: translation
    frame: {text: "I would like a ticket to Bucharest, please. (formal, to someone you address with dumneavoastră)", language_code: en, direction: ltr}
    slots: {item: *t_bilet}
    answer_derivation: {kind: render_frame, frame: {text: "Aș dori un {item} la București, vă rog.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Aș dori plus un and a noun makes a polite request.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson02.translate.007
    lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
    type: translation
    frame: {text: "How much does a ticket to Bucharest cost?", language_code: en, direction: ltr}
    slots: {item: *t_bilet}
    answer_derivation: {kind: render_frame, frame: {text: "Cât costă un {item} la București?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Cât costă asks the price of one thing, so the verb stays singular.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson02.translate.008
    lesson_content_key: ro.a1.unit15.lesson02.un_bilet_va_rog
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *all6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Each of these words names a thing, an action or a place from a trip.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson03.choose.001
    lesson_content_key: ro.a1.unit15.lesson03.la_gara
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *c_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Drum bun wishes someone a good trip.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson03.order.002
    lesson_content_key: ro.a1.unit15.lesson03.la_gara
    type: word_order
    frame: {text: "Drum {item}, Mihai!", language_code: ro, direction: ltr}
    slots: {item: *t_bun}
    answer_derivation: {kind: render_frame, frame: {text: "Drum {item}, Mihai!", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Drum is neuter, so in the singular the adjective takes the masculine form bun.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson03.fill.003
    lesson_content_key: ro.a1.unit15.lesson03.la_gara
    type: fill_in_blank
    frame: {text: "Drum {item}, Mihai! ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_bun, hint: *t_bun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Bun follows the noun in this farewell wish.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit15.lesson03.translate.004
    lesson_content_key: ro.a1.unit15.lesson03.la_gara
    type: translation
    frame: {text: "Have a good trip, Mihai!", language_code: en, direction: ltr}
    slots: {item: *t_bun}
    answer_derivation: {kind: render_frame, frame: {text: "Drum {item}, Mihai!", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Drum bun is a fixed wish said to someone who is leaving.", language_code: en, direction: ltr}
