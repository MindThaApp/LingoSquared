schema_version: '1.0'
pack_key: practice.en-ro.a1.unit40
source_language: en
target_language: ro
unit_content_key: ro.a1.unit40.posta
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u40 / w_<token>). 17 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_adresa, w_ajunge, w_angajatul, w_bunica, w_bunici, w_colet, w_coletul, w_cumpără, w_dura, w_durează, w_grozav, w_scrie, w_scrisoare, w_scrisoarea, w_timbru, w_timbrul, w_zile]
templates:
- content_key: practice.en-ro.ro.a1.unit40.lesson01.choose.001
  lesson_content_key: ro.a1.unit40.lesson01.scrisoarea_si_coletul
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_scrisoarea, w_scrisoare, w_coletul, w_colet, w_bunica, w_timbrul, w_timbru, w_adresa, w_scrie, w_ajunge, w_bunici, w_dura, w_durează, w_zile, w_angajatul, w_grozav, w_cumpără]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the letter and the package.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit40.lesson02.listen.001
  lesson_content_key: ro.a1.unit40.lesson02.timbrul_adresa_si_a
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the stamp, the address, and writing.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit40.lesson03.translate.001
  lesson_content_key: ro.a1.unit40.lesson03.a_ajunge_si_a
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on arriving and taking time.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit40.lesson04.match.001
  lesson_content_key: ro.a1.unit40.lesson04.la_posta
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
