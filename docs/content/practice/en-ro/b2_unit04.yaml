- content_key: practice.en-ro.ro.b2.unit04.lesson01.choose.001
  lesson_content_key: ro.b2.unit04.lesson01.fundalul
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_era, w_devreme, w_ploua, w_ușor, w_grăbea, w_importantă, w_întâi, w_plecat, w_apoi, w_stricat, w_urmă, w_chemat, w_taxi, w_când, w_mergea, w_aștepta, w_taxiul, w_clientul, w_client, w_fusese, w_service, w_așa, w_ajuns, w_întâmplat, w_mergeam, w_poveste]
