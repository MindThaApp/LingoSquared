    semantic: [w_ajuns, w_apoi, w_așa, w_aștepta, w_chemat, w_client, w_clientul, w_când, w_devreme, w_era, w_fusese, w_grăbea, w_importantă, w_mergea, w_mergeam, w_plecat, w_ploua, w_poveste, w_service, w_stricat, w_taxi, w_taxiul, w_urmă, w_ușor, w_întâi, w_întâmplat]
