- content_key: practice.en-ro.ro.a2.unit76.lesson01.translate.004
  lesson_content_key: ro.a2.unit76.lesson01.nu_pot_veni
  type: translation
  frame: {text: 'Sorry, I am too late.', language_code: en, direction: ltr}
