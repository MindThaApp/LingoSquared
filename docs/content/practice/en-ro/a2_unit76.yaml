    frame: {text: 'Scuze pentru {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: Sorry for the inconvenience. deranj means inconvenience., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit76.lesson04.order.002
  lesson_content_key: ro.a2.unit76.lesson04.o_ora_noua
  type: word_order
  frame: {text: 'Atunci ne {item} luni.', language_code: ro, direction: ltr}
  slots:
