schema_version: '1.0'
pack_key: practice.en-ro.a2.unit76
source_language: en
target_language: ro
unit_content_key: ro.a2.unit76.afspraak_verzetten
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a2_u76 / w_<token>). 22 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_această, w_altă, w_anula, w_anulez, w_cer, w_convine, w_deranj, w_deranjul, w_desigur, w_facem, w_mutată, w_păcate, w_salon, w_salonul, w_scuze, w_stabili, w_stabilim, w_stimate, w_sunați, w_vedem, w_întârziat, w_șase]
templates:
- content_key: practice.en-ro.ro.a2.unit76.lesson01.choose.001
  lesson_content_key: ro.a2.unit76.lesson01.nu_pot_veni
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_anula, w_anulez, w_păcate, w_scuze, w_întârziat, w_salonul, w_șase, w_altă, w_convine, w_deranjul, w_deranj, w_stabili, w_stabilim, w_sunați, w_vedem, w_stimate, w_mutată, w_această, w_facem, w_salon, w_desigur, w_cer]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i cannot come.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit76.lesson02.listen.001
  lesson_content_key: ro.a2.unit76.lesson02.o_alta_zi
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on another day.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit76.lesson03.translate.001
  lesson_content_key: ro.a2.unit76.lesson03.un_motiv
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on giving a reason.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit76.lesson04.match.001
  lesson_content_key: ro.a2.unit76.lesson04.o_ora_noua
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
