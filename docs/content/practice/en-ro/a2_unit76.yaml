- content_key: practice.en-ro.ro.a2.unit76.lesson03.order.002
  lesson_content_key: ro.a2.unit76.lesson03.un_motiv
  type: word_order
  frame: {text: 'Scuze pentru {item}.', language_code: ro, direction: ltr}
  slots:
    item:
