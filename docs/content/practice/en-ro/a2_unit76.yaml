    kind: render_frame
    frame: {text: 'Se poate și într-o {item} zi?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Can it also be on another day? altă means another (fem.).', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit76.lesson02.fill.003
  lesson_content_key: ro.a2.unit76.lesson02.o_alta_zi
  type: fill_in_blank
  frame:
    text: Vă {item} vineri? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_convine}
