schema_version: '1.0'
pack_key: practice.en-ro.a1.unit57
source_language: en
target_language: ro
unit_content_key: ro.a1.unit57.parc
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u57 / w_<token>). 13 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_apa, w_așezăm, w_copac, w_copacul, w_iarba, w_iarbă, w_lesă, w_panoul, w_picnic, w_plimbarea, w_rața, w_rațele, w_rece]
templates:
- content_key: practice.en-ro.ro.a1.unit57.lesson01.choose.001
  lesson_content_key: ro.a1.unit57.lesson01.mergem_la_parc
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_plimbarea, w_copacul, w_iarba, w_copac, w_iarbă, w_rața, w_apa, w_rece, w_rațele, w_panoul, w_lesă, w_picnic, w_așezăm]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on shall we go to the park?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit57.lesson02.listen.001
  lesson_content_key: ro.a1.unit57.lesson02.copacii_si_iarba
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the trees and the grass.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit57.lesson03.translate.001
  lesson_content_key: ro.a1.unit57.lesson03.ratele_de_langa_apa
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the ducks by the water.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit57.lesson04.match.001
  lesson_content_key: ro.a1.unit57.lesson04.panoul_de_la_intrare
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit57.lesson05.choose.001
  lesson_content_key: ro.a1.unit57.lesson05.un_picnic_in_parc
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a picnic in the park.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit57.lesson01.translate.002
  lesson_content_key: ro.a1.unit57.lesson01.mergem_la_parc
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on shall we go to the park?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit57.lesson02.order.002
  lesson_content_key: ro.a1.unit57.lesson02.copacii_si_iarba
  type: word_order
  frame: {text: 'Văd un {item} mare și iarbă verde.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_copac}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Văd un {item} mare și iarbă verde.', language_code: ro, direction: ltr}
  feedback_frame: {text: I see a big tree and green grass. copac means tree., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit57.lesson03.order.002
  lesson_content_key: ro.a1.unit57.lesson03.ratele_de_langa_apa
  type: word_order
  frame: {text: 'Apa este {item}.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_rece}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Apa este {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: The water is cold. rece means cold., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit57.lesson03.fill.003
  lesson_content_key: ro.a1.unit57.lesson03.ratele_de_langa_apa
  type: fill_in_blank
  frame:
    text: Uite, {item} înoată în apă! ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_rațele}
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_rațele}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Look, the ducks are swimming in the water! rațele means the ducks.', language_code: en, direction: ltr}
