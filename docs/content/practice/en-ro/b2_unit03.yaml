      agreement_tags:
        semantic: [w_raportul, w_raport, w_introducerea, w_introducere, w_cam, w_oarecum, w_lungă, w_scurtă, w_concluzia, w_concluzie, w_neclară, w_personal, w_pare, w_spune, w_relativ, w_stilul, w_stil, w_formal, w_reușit, w_chiar, w_foarte, w_extrem, w_absolut, w_analiza, w_analiză, w_clară, w_clar, w_plăcut, w_fost, w_tocmai, w_partea, w_impresionantă, w_feedback]
