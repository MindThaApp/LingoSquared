  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: fill_in_blank
  frame:
    text: Merg la {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_frizer}
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_frizer}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I'm going to the hairdresser. frizer means hairdresser., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit50.lesson02.order.002
  lesson_content_key: ro.a1.unit50.lesson02.puteti_sa_mi_tundeti
  type: word_order
  frame: {text: 'Puteți să-mi {item} părul?', language_code: ro, direction: ltr}
