schema_version: '1.0'
pack_key: practice.en-ro.a1.unit50
source_language: en
target_language: ro
unit_content_key: ro.a1.unit50.frizerie
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u50 / w_<token>). 24 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_aceeași, w_coafura, w_coafură, w_frizer, w_frizerul, w_lista, w_listă, w_loc, w_nicio, w_prea, w_prețuri, w_problemă, w_puteți, w_scurtă, w_spălat, w_sta, w_stă, w_tocmai, w_tunde, w_tundeți, w_tuns, w_tunsoare, w_tunsoarea, w_veniți]
templates:
- content_key: practice.en-ro.ro.a1.unit50.lesson01.choose.001
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_prea, w_frizerul, w_frizer, w_tunde, w_puteți, w_tundeți, w_veniți, w_aceeași, w_coafură, w_scurtă, w_nicio, w_problemă, w_loc, w_lista, w_prețuri, w_tunsoarea, w_tunsoare, w_listă, w_spălat, w_tuns, w_coafura, w_sta, w_stă, w_tocmai]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on my hair is too long.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit50.lesson02.listen.001
  lesson_content_key: ro.a1.unit50.lesson02.puteti_sa_mi_tundeti
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on can you cut my hair?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit50.lesson03.translate.001
  lesson_content_key: ro.a1.unit50.lesson03.facem_o_programare
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on making an appointment.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit50.lesson04.match.001
  lesson_content_key: ro.a1.unit50.lesson04.la_frizer
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit50.lesson05.choose.001
  lesson_content_key: ro.a1.unit50.lesson05.citim_lista_de_preturi
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading the price list.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit50.lesson06.translate.001
  lesson_content_key: ro.a1.unit50.lesson06.ana_vede_coafura_noua
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on ana sees the new haircut.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit50.lesson01.order.002
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: word_order
  frame: {text: 'Părul meu este {item} lung.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags: {semantic: w_prea}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Părul meu este {item} lung.', language_code: ro, direction: ltr}
  feedback_frame: {text: My hair is too long. prea means too., language_code: en, direction: ltr}
