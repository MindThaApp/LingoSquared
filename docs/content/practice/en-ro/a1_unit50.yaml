      agreement_tags: {semantic: w_tundeți}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Puteți să-mi {item} părul?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Can you cut my hair? tundeți means you cut (formal).', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit50.lesson04.order.002
  lesson_content_key: ro.a1.unit50.lesson04.la_frizer
  type: word_order
  frame: {text: 'Perfect, și doriți {item} coafură?', language_code: ro, direction: ltr}
