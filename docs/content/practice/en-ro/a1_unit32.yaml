    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_companie}
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_companie}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'A dog is also a pet. companie means company (in: pet).', language_code: en, direction: ltr}
