schema_version: '1.0'
pack_key: practice.en-ro.a1.unit32
source_language: en
target_language: ro
unit_content_key: ro.a1.unit32.animale
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u32 / w_<token>). 40 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_animal, w_animale, w_animalele, w_animalul, w_blană, w_companie, w_câine, w_câinele, w_câini, w_câinii, w_dau, w_folosești, w_frumos, w_gen, w_iubesc, w_iubește, w_iubim, w_joacă, w_negație, w_niciun, w_pasăre, w_pasărea, w_persoană, w_pește, w_peștele, w_pisica, w_pisici, w_pisicii, w_pisicile, w_pisică, w_plimbare, w_pune, w_păsări, w_păsările, w_schimb, w_scoate, w_scot, w_scoți, w_timp, w_verbul]
templates:
- content_key: practice.en-ro.ro.a1.unit32.lesson01.choose.001
  lesson_content_key: ro.a1.unit32.lesson01.caine_pisica_peste_si
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_animalul, w_animal, w_companie, w_câine, w_câinele, w_pisica, w_pisică, w_peștele, w_pasărea, w_pește, w_pasăre, w_niciun, w_negație, w_pune, w_timp, w_scoate, w_plimbare, w_scot, w_verbul, w_persoană, w_scoți, w_dau, w_pisicii, w_joacă, w_câini, w_animale, w_pisici, w_iubește, w_câinii, w_pisicile, w_păsări, w_iubesc, w_păsările, w_animalele, w_blană, w_folosești, w_gen, w_schimb, w_frumos, w_iubim]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on dog, cat, fish, and bird.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit32.lesson02.listen.001
  lesson_content_key: ro.a1.unit32.lesson02.ingrijirea_unui_animal_de
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on caring for a pet.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit32.lesson03.translate.001
  lesson_content_key: ro.a1.unit32.lesson03.a_iubi_animalele
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on loving animals.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit32.lesson04.match.001
  lesson_content_key: ro.a1.unit32.lesson04.mihai_o_intreaba_pe
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit32.lesson05.choose.001
  lesson_content_key: ro.a1.unit32.lesson05.mihai_elena_si_andrei
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on mihai, elena, and andrei on animals.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit32.lesson06.translate.001
  lesson_content_key: ro.a1.unit32.lesson06.nina_si_pasarea_ei
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on nina''s bird.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit32.lesson01.order.002
  lesson_content_key: ro.a1.unit32.lesson01.caine_pisica_peste_si
  type: word_order
  frame: {text: 'Un câine este un {item}.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_animal}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Un câine este un {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: A dog is an animal. animal means animal., language_code: en, direction: ltr}
