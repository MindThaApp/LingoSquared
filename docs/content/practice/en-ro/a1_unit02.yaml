schema_version: "1.0"
pack_key: practice.en-ro.a1.unit02
source_language: en
target_language: ro
unit_content_key: ro.a1.unit02.numbers
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Reviewer: check that tău/dumneavoastră phone-number frames and the de rule (20 and up)
    match the realization.
    Opus quality pass 2026-10-24: fixed three feedback claims (numărul is neuter, not masculine; un/o vs unu; have-for-age wording).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_zero, w_unu, w_doi, w_două, w_trei, w_patru, w_cinci, w_șase, w_șapte, w_opt, w_nouă, w_zece, w_unsprezece, w_doisprezece, w_șaisprezece, w_douăzeci, w_treizeci, w_patruzeci, w_cincizeci, w_sută, w_șaizeci, w_șaptezeci, w_optzeci, w_nouăzeci, w_nouăsprezece, w_ani, w_ai, w_am, w_aveți, w_care, w_numărul, w_tău, w_telefon, w_de]
slot_presets:
  nums_a: &nums_a {language_code: ro, part_of_speech: adjective, agreement_tags: {semantic: [w_zero, w_unu, w_doi, w_două, w_trei, w_patru, w_cinci, w_șase, w_șapte, w_opt, w_nouă, w_zece]}}
  nums_match: &nums_match {language_code: ro, part_of_speech: adjective, agreement_tags: {semantic: [w_doi, w_două, w_trei, w_patru, w_cinci, w_șase]}}
  l2_pool: &l2_pool {language_code: ro, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_unsprezece, w_doisprezece, w_șaisprezece, w_douăzeci, w_treizeci, w_patruzeci, w_cincizeci, w_sută]}}
  tens_match: &tens_match {language_code: ro, part_of_speech: adjective, agreement_tags: {semantic: [w_douăzeci, w_treizeci, w_patruzeci, w_cincizeci, w_șaizeci, w_șaptezeci]}}
  tens_words: &tens_words {language_code: ro, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_douăzeci, w_treizeci, w_patruzeci, w_cincizeci, w_șaizeci, w_șaptezeci, w_optzeci, w_nouăzeci, w_sută]}}
  t_nouasprezece: &t_nouasprezece {language_code: ro, part_of_speech: adjective, agreement_tags: {semantic: w_nouăsprezece}}
  t_treizeci: &t_treizeci {language_code: ro, part_of_speech: adjective, agreement_tags: {semantic: w_treizeci}}
  l3_pool: &l3_pool {language_code: ro, part_of_speech: [adjective, noun, pronoun, verb], agreement_tags: {semantic: [w_ani, w_ai, w_am, w_aveți, w_care, w_numărul, w_tău, w_telefon]}}
  l3_match: &l3_match {language_code: ro, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_ani, w_ai, w_am, w_aveți, w_numărul, w_telefon]}}
  l3_words: &l3_words {language_code: ro, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_ani, w_numărul, w_telefon, w_aveți, w_ai, w_am]}}
  t_de: &t_de {language_code: ro, part_of_speech: preposition, agreement_tags: {semantic: w_de}}
  t_ai: &t_ai {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_ai}}
  t_aveti: &t_aveti {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_aveți}}
  t_tau: &t_tau {language_code: ro, part_of_speech: adjective, agreement_tags: {semantic: w_tău}}
templates:
  - content_key: practice.en-ro.ro.a1.unit02.lesson01.choose.001
    lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *nums_a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Two has two forms: doi with masculine nouns and două with feminine and neuter nouns.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson01.listen.002
    lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
    type: listen_select
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *nums_a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Zero to ten are the building blocks: the teens add -sprezece (unsprezece, doisprezece) and the tens add -zeci.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson01.match.003
    lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ro, direction: ltr}
    slots: {first: *nums_match, second: *nums_match, third: *nums_match, fourth: *nums_match, fifth: *nums_match, sixth: *nums_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Doi is the masculine form of two and două the feminine and neuter form; the other numbers do not change.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson01.translate.004
    lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *nums_a}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Before a noun, one and two change with gender (un or o, doi or două); when you just count you say unu, doi.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson02.choose.001
    lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l2_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The teens are built from the unit plus -sprezece: doisprezece is two plus ten.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson02.listen.002
    lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
    type: listen_select
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l2_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The tens end in -zeci: douăzeci, treizeci, patruzeci and so on up to nouăzeci.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson02.match.003
    lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ro, direction: ltr}
    slots: {first: *tens_match, second: *tens_match, third: *tens_match, fourth: *tens_match, fifth: *tens_match, sixth: *tens_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The tens are built from the unit plus -zeci: trei becomes treizeci, patru becomes patruzeci.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson02.translate.004
    lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *tens_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Sută means hundred; one hundred is o sută with the feminine o.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson03.order.001
    lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
    type: word_order
    frame: {text: "Am {item} ani.", language_code: ro, direction: ltr}
    slots: {item: *t_nouasprezece}
    answer_derivation: {kind: render_frame, frame: {text: "Am {item} ani.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "From two to nineteen there is no de: am nouăsprezece ani. From twenty up it appears: am treizeci de ani.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson02.translate.005
    lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
    type: translation
    frame: {text: "I am thirty years old.", language_code: en, direction: ltr}
    slots: {item: *t_treizeci}
    answer_derivation: {kind: render_frame, frame: {text: "Am {item} de ani.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "From twenty upward the number is followed by de before the noun: treizeci de ani.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson03.choose.002
    lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l3_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ai is the tu form of have and aveți is the dumneavoastră form: Câți ani ai? or Câți ani aveți?", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson03.fill.003
    lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
    type: fill_in_blank
    frame: {text: "Am treizeci {item} ani. ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_de, hint: *t_de}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De appears after numbers from twenty up: treizeci de ani, but nouăsprezece ani.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson03.translate.004
    lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
    type: translation
    frame: {text: "How old are you? (informal, to a friend)", language_code: en, direction: ltr}
    slots: {item: *t_ai}
    answer_derivation: {kind: render_frame, frame: {text: "Câți ani {item}?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Câți ani ai? literally asks how many years you have: Romanian uses have, not be, for age.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson03.translate.005
    lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
    type: translation
    frame: {text: "How old are you? (formal, to someone you address with dumneavoastră)", language_code: en, direction: ltr}
    slots: {item: *t_aveti}
    answer_derivation: {kind: render_frame, frame: {text: "Câți ani {item}?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Aveți is the polite form of have, used with dumneavoastră.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson03.order.006
    lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
    type: word_order
    frame: {text: "Care e numărul {item} de telefon?", language_code: ro, direction: ltr}
    slots: {item: *t_tau}
    answer_derivation: {kind: render_frame, frame: {text: "Care e numărul {item} de telefon?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Numărul is neuter, and a neuter singular noun takes the masculine form tău; the polite version is Care este numărul dumneavoastră de telefon?", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson03.translate.007
    lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l3_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Romanian says I have thirty years: am treizeci de ani, not I am.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit02.lesson03.match.008
    lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ro, direction: ltr}
    slots: {first: *l3_match, second: *l3_match, third: *l3_match, fourth: *l3_match, fifth: *l3_match, sixth: *l3_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Ani is the plural of an; the question Câți ani ai? asks for the number of years.", language_code: en, direction: ltr}
