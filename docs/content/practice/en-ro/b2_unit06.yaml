schema_version: '1.0'
pack_key: practice.en-ro.b2.unit06
source_language: en
target_language: ro
unit_content_key: ro.b2.unit06.abstractizare
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_b2_u6 / w_<token>). 32 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_aceleași, w_acest, w_anumită, w_avantaj, w_cazuri, w_clare, w_convinsă, w_depinde, w_dezavantaj, w_elev, w_elevi, w_elevii, w_general, w_idee, w_liceu, w_lucru, w_multe, w_măsură, w_neapărat, w_obligatoriu, w_posibilități, w_punctul, w_responsabilitate, w_situația, w_societate, w_societatea, w_sănătos, w_trebui, w_voluntariat, w_voluntariatul, w_învață, w_înțeleg]
templates:
- content_key: practice.en-ro.ro.b2.unit06.lesson01.choose.001
  lesson_content_key: ro.b2.unit06.lesson01.ce_parere_aveti
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_voluntariatul, w_voluntariat, w_obligatoriu, w_liceu, w_trebui, w_convinsă, w_idee, w_anumită, w_măsură, w_general, w_multe, w_cazuri, w_neapărat, w_depinde, w_responsabilitate, w_învață, w_elevii, w_elev, w_înțeleg, w_punctul, w_avantaj, w_dezavantaj, w_societate, w_sănătos, w_elevi, w_aceleași, w_posibilități, w_acest, w_lucru, w_societatea, w_situația, w_clare]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what is your opinion?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson02.listen.001
  lesson_content_key: ro.b2.unit06.lesson02.opinie_nuantata
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a nuanced opinion.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson03.translate.001
  lesson_content_key: ro.b2.unit06.lesson03.reactia_la_contraargument
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on responding to a counterargument.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson04.match.001
  lesson_content_key: ro.b2.unit06.lesson04.pro_si_contra
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson05.choose.001
  lesson_content_key: ro.b2.unit06.lesson05.o_opinie_scrisa
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading an opinion.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson01.translate.002
  lesson_content_key: ro.b2.unit06.lesson01.ce_parere_aveti
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what is your opinion?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson01.order.003
  lesson_content_key: ro.b2.unit06.lesson01.ce_parere_aveti
  type: word_order
  frame: {text: 'Sunt convinsă că {item} ajută.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_voluntariatul}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Sunt convinsă că {item} ajută.', language_code: ro, direction: ltr}
  feedback_frame: {text: I'm convinced that volunteering helps. voluntariatul means the volunteering., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson01.fill.004
  lesson_content_key: ro.b2.unit06.lesson01.ce_parere_aveti
  type: fill_in_blank
  frame:
    text: Cursul este {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_obligatoriu}
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_obligatoriu}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: The course is mandatory. obligatoriu means compulsory; mandatory., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson01.translate.005
  lesson_content_key: ro.b2.unit06.lesson01.ce_parere_aveti
  type: translation
  frame: {text: Ana teaches at a high school., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_liceu}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ana predă la {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: Ana teaches at a high school. liceu means high school., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson02.order.002
  lesson_content_key: ro.b2.unit06.lesson02.opinie_nuantata
  type: word_order
  frame: {text: 'În {item}, elevii sunt de acord.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_general}
  answer_derivation:
    kind: render_frame
    frame: {text: 'În {item}, elevii sunt de acord.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'In general, students agree. general means general.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson02.fill.003
  lesson_content_key: ro.b2.unit06.lesson02.opinie_nuantata
  type: fill_in_blank
  frame:
    text: Nu {item} pentru toți elevii. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags: {semantic: w_neapărat}
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags: {semantic: w_neapărat}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Not necessarily for all students. neapărat means necessarily., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson02.translate.004
  lesson_content_key: ro.b2.unit06.lesson02.opinie_nuantata
  type: translation
  frame: {text: Volunteering teaches responsibility., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_responsabilitate}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Voluntariatul învață {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: Volunteering teaches responsibility. responsabilitate means responsibility., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson03.order.002
  lesson_content_key: ro.b2.unit06.lesson03.reactia_la_contraargument
  type: word_order
  frame: {text: 'Înțeleg {item} dumneavoastră.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_punctul}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Înțeleg {item} dumneavoastră.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'I understand your point. Înțeleg punctul dumneavoastră names the OTHER person''s point explicitly before disagreeing -- more deliberate than a bare ''I understand'', and keeps the formal dumneavoastră.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit06.lesson04.order.002
  lesson_content_key: ro.b2.unit06.lesson04.pro_si_contra
