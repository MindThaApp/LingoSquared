  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a polite refusal.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit07.lesson03.translate.001
