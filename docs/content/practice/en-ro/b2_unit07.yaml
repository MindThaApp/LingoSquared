- content_key: practice.en-ro.ro.b2.unit07.lesson01.order.002
  lesson_content_key: ro.b2.unit07.lesson01.o_propunere
  type: word_order
  frame: {text: 'Ana organizează o {item}.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_petrecere}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ana organizează o {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: Ana is organizing a party. petrecere means party., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit07.lesson01.fill.003
  lesson_content_key: ro.b2.unit07.lesson01.o_propunere
  type: fill_in_blank
  frame:
    text: Propun să organizăm o petrecere pentru {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_echipă}
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_echipă}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Mihai: I propose that we organize a party for the team. echipă means team.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit07.lesson01.translate.004
  lesson_content_key: ro.b2.unit07.lesson01.o_propunere
  type: translation
  frame: {text: 'Ana: What would you say about a date this month?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_luna}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ce ați spune despre o dată în {item} asta?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Ana: What would you say about a date this month? luna means the month.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit07.lesson02.order.002
  lesson_content_key: ro.b2.unit07.lesson02.refuz_politicos
  type: word_order
  frame: {text: 'Din {item}, nu merge.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_păcate}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Din {item}, nu merge.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Unfortunately, that doesn''t work. Din păcate, nu merge softens the short, direct refusal nu merge with din păcate (''unfortunately'') to fit the formal register -- always follow it with a reason so it reads as a negotiation move.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit07.lesson02.fill.003
  lesson_content_key: ro.b2.unit07.lesson02.refuz_politicos
  type: fill_in_blank
  frame:
    text: Din păcate, nu {item} mâine. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_merge}
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_merge}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Unfortunately, that doesn''t work tomorrow. merge means to go.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit07.lesson02.translate.004
  lesson_content_key: ro.b2.unit07.lesson02.refuz_politicos
  type: translation
  frame: {text: I would prefer something else., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_prefera}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Aș {item} altceva.', language_code: ro, direction: ltr}
  feedback_frame: {text: I would prefer something else. prefera means to prefer., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit07.lesson06.order.002
  lesson_content_key: ro.b2.unit07.lesson06.negociind_in_dialog
  type: word_order
  frame: {text: 'Ce ați spune despre o {item} în luna asta?', language_code: ro, direction: ltr}
