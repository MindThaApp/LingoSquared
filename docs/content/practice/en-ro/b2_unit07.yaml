review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_b2_u7 / w_<token>). 40 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_acceptat, w_atunci, w_buget, w_bugetul, w_condiția, w_data, w_dată, w_decorațiuni, w_decorațiunile, w_deschisă, w_echipa, w_echipă, w_facem, w_luna, w_merge, w_moment, w_mâncare, w_mâncarea, w_numai, w_ocup, w_ocupa, w_ocupați, w_ocupe, w_organizăm, w_perfect, w_petrecere, w_petrecerea, w_prefera, w_preferat, w_propun, w_propunerea, w_propus, w_păcate, w_rămâne, w_toată, w_vin, w_împart, w_împărțim, w_înțelegere, w_înțeles]
templates:
- content_key: practice.en-ro.ro.b2.unit07.lesson01.choose.001
  lesson_content_key: ro.b2.unit07.lesson01.o_propunere
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_petrecerea, w_petrecere, w_propun, w_echipa, w_echipă, w_propunerea, w_organizăm, w_facem, w_luna, w_păcate, w_merge, w_prefera, w_mâncarea, w_mâncare, w_ocup, w_toată, w_decorațiunile, w_decorațiuni, w_atunci, w_numai, w_condiția, w_vin, w_ocupați, w_înțeles, w_perfect, w_bugetul, w_buget, w_împărțim, w_înțelegere, w_propus, w_ocupa, w_împart, w_rămâne, w_deschisă, w_moment, w_acceptat, w_ocupe, w_data, w_preferat, w_dată]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a proposal.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit07.lesson02.listen.001
