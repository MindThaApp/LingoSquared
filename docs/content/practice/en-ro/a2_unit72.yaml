    frame: {text: 'Săptămâna {item} am mai mult timp.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Next week I''ll have more time. Săptămâna viitoare (next week) contrasts with săptămâna aceasta (this week), already used earlier in this lesson.', language_code: en, direction: ltr}
