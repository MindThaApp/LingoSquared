  type: fill_in_blank
  frame:
    text: Nu am {item} seară liberă săptămâna aceasta. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_nicio}
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_nicio}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I have no free evening this week. Nicio seară liberă (no free evening): nicio is the feminine form of niciun, and the adjective liberă agrees with seară. With nicio the verb needs nu in front: Nu am nicio seară liberă.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit72.lesson04.translate.004
  lesson_content_key: ro.a2.unit72.lesson04.o_agenda_aglomerata
  type: translation
  frame: {text: Next week I'll have more time., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_viitoare}
