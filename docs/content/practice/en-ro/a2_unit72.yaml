  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_mele}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ordinea zilei {item} este mereu aceeași.', language_code: ro, direction: ltr}
  feedback_frame: {text: The order of my day is always the same. mele means my (feminine plural)., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit72.lesson02.fill.003
  lesson_content_key: ro.a2.unit72.lesson02.mai_intai_munca_apoi
  type: fill_in_blank
  frame:
    text: Mai {item} lucrez, apoi fac sport. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_întâi}
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_întâi}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'First I work, then I go exercise. Mai întâi (first) and apoi (then, after that) are the two most common sequencing connectors in Romanian. The verb stays in its normal place: Mai întâi lucrez, apoi fac sport.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit72.lesson02.translate.004
  lesson_content_key: ro.a2.unit72.lesson02.mai_intai_munca_apoi
  type: translation
  frame: {text: 'Mihai: On Fridays I usually exercise, and in the evening I cook something tasty.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_sport}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Vineri fac de obicei {item}, iar seara gătesc ceva gustos.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Mihai: On Fridays I usually exercise, and in the evening I cook something tasty. sport means sport.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit72.lesson03.order.002
  lesson_content_key: ro.a2.unit72.lesson03.peste_saptamana_si_in
  type: word_order
  frame: {text: 'Într-o zi lucrătoare mă {item} devreme.', language_code: ro, direction: ltr}
