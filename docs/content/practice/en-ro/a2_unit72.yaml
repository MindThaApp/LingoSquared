    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_faci}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ce {item} de obicei peste săptămână?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'What do you usually do during the week? Peste săptămână (during the week) refers to the weekdays as a group, in contrast with în weekend.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit72.lesson02.order.002
