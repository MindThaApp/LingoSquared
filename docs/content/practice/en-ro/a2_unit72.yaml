  lesson_content_key: ro.a2.unit72.lesson01.luni_si_miercuri
  type: word_order
  frame: {text: 'Mă uit în fiecare {item} la orar.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_săptămână}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Mă uit în fiecare {item} la orar.', language_code: ro, direction: ltr}
  feedback_frame: {text: I check my schedule every week. săptămână means week., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit72.lesson01.fill.003
  lesson_content_key: ro.a2.unit72.lesson01.luni_si_miercuri
  type: fill_in_blank
  frame:
    text: Luni {item}, iar miercuri am un curs. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_lucrez}
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_lucrez}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'On Monday I work, and on Wednesday I have a course. Romanian needs no word for ''on'' before a weekday: luni alone means ''on Monday''. Days of the week are written with a small letter, unless they start a sentence.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit72.lesson01.translate.004
  lesson_content_key: ro.a2.unit72.lesson01.luni_si_miercuri
  type: translation
  frame: {text: 'What do you usually do during the week?', language_code: en, direction: ltr}
