    frame: {text: 'Săptămâna aceasta {item} mea este complet plină.', language_code: ro, direction: ltr}
  feedback_frame: {text: My schedule is completely full this week. agenda means the planner., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit72.lesson04.fill.003
