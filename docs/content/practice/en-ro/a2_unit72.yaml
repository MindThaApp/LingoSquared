    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_trezesc}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Într-o zi lucrătoare mă {item} devreme.', language_code: ro, direction: ltr}
  feedback_frame: {text: On a weekday I get up early. trezesc means I wake up (reflexive)., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit72.lesson03.fill.003
  lesson_content_key: ro.a2.unit72.lesson03.peste_saptamana_si_in
  type: fill_in_blank
  frame:
    text: Peste săptămână mă trezesc devreme, dar în {item} dorm până târziu. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_weekend}
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_weekend}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'During the week I get up early, but on the weekend I sleep in. A dormi până târziu (to sleep in, literally ''to sleep until late'') is a fixed expression; a se trezi devreme means to get up early. Mă trezesc is a reflexive verb.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit72.lesson03.translate.004
  lesson_content_key: ro.a2.unit72.lesson03.peste_saptamana_si_in
  type: translation
  frame: {text: 'What''s the difference between your weekdays and the weekend?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_diferența}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Care este {item} dintre zilele tale lucrătoare și weekend?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'What''s the difference between your weekdays and the weekend? Diferența dintre ... și ... (the difference between ... and ...) is the standard comparison frame.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit72.lesson04.order.002
