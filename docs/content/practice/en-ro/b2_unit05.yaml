schema_version: '1.0'
pack_key: practice.en-ro.b2.unit05
source_language: en
target_language: ro
unit_content_key: ro.b2.unit05.registru
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_b2_u5 / w_<token>). 31 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ajuți, w_altfel, w_ați, w_conveni, w_convine, w_deosebit, w_doamnă, w_domn, w_face, w_lunea, w_mesaj, w_nicio, w_pot, w_poți, w_primăria, w_primărie, w_problemă, w_putem, w_reprograma, w_reprogramăm, w_respect, w_rog, w_scrie, w_scrii, w_scriu, w_stimate, w_stimă, w_săptămâna, w_tău, w_viitoare, w_întâlnirea]
templates:
- content_key: practice.en-ro.ro.b2.unit05.lesson01.choose.001
  lesson_content_key: ro.b2.unit05.lesson01.tu_sau_dumneavoastra
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_scrie, w_mesaj, w_tău, w_poți, w_ajuți, w_stimate, w_domn, w_doamnă, w_stimă, w_deosebit, w_respect, w_face, w_rog, w_ați, w_întâlnirea, w_reprograma, w_reprogramăm, w_lunea, w_pot, w_săptămâna, w_viitoare, w_putem, w_convine, w_conveni, w_nicio, w_problemă, w_primăria, w_primărie, w_scriu, w_scrii, w_altfel]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on tu or dumneavoastră?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson02.listen.001
  lesson_content_key: ro.b2.unit05.lesson02.formule_de_adresare
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on greetings and closings.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson03.translate.001
  lesson_content_key: ro.b2.unit05.lesson03.direct_sau_politicos
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on direct or polite?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson04.match.001
  lesson_content_key: ro.b2.unit05.lesson04.reprogramarea_intalnirii
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson05.choose.001
  lesson_content_key: ro.b2.unit05.lesson05.doua_mesaje
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on two messages, two recipients.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson06.translate.001
  lesson_content_key: ro.b2.unit05.lesson06.alegerea_registrului
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on choosing the right register.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson01.order.002
  lesson_content_key: ro.b2.unit05.lesson01.tu_sau_dumneavoastra
  type: word_order
  frame: {text: 'Mihai {item} un mesaj.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_scrie}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Mihai {item} un mesaj.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Mihai is writing a message. The situation this whole unit works with: Mihai has to send the same request to two very different readers. Un mesaj = ''a message''.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson01.fill.003
  lesson_content_key: ro.b2.unit05.lesson01.tu_sau_dumneavoastra
  type: fill_in_blank
  frame:
    text: Poți să mă {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_ajuți}
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_ajuți}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Can you help me? Informal. Poți is the tu form of a putea (''can/to be able to''). Direct and perfectly polite between friends.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson03.order.002
  lesson_content_key: ro.b2.unit05.lesson03.direct_sau_politicos
  type: word_order
  frame: {text: 'Poți {item} asta?', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_face}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Poți {item} asta?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Can you do this? Informal and direct: Poți face asta? Between friends a direct request is the normal, friendly choice. Asta = ''this'', face = ''to do''.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson03.fill.003
  lesson_content_key: ro.b2.unit05.lesson03.direct_sau_politicos
  type: fill_in_blank
  frame:
    text: Poți face asta, te {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_rog}
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_rog}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Can you do this, please? rog means I ask (in a polite request).', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson04.order.002
  lesson_content_key: ro.b2.unit05.lesson04.reprogramarea_intalnirii
  type: word_order
  frame: {text: 'Vreau să reprogramăm {item}.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_întâlnirea}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Vreau să reprogramăm {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: I want us to reschedule the meeting. întâlnirea means the meeting., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson04.fill.003
  lesson_content_key: ro.b2.unit05.lesson04.reprogramarea_intalnirii
  type: fill_in_blank
  frame:
    text: Putem {item} întâlnirea? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_reprograma}
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_reprograma}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Can we reschedule the meeting? The request in its informal form, to a friend: Putem reprograma întâlnirea? Direct, no softening frame.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson04.translate.004
  lesson_content_key: ro.b2.unit05.lesson04.reprogramarea_intalnirii
  type: translation
  frame: {text: 'Would it be possible to reschedule the meeting?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_reprogramăm}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ar fi posibil să {item} întâlnirea?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Would it be possible to reschedule the meeting? The SAME request in formal form, to an institution: Ar fi posibil să reprogramăm întâlnirea? Indirect and polite.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson05.order.002
  lesson_content_key: ro.b2.unit05.lesson05.doua_mesaje
  type: word_order
  frame: {text: 'Îmi {item} mâine.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_convine}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Îmi {item} mâine.', language_code: ro, direction: ltr}
  feedback_frame: {text: Tomorrow suits me. convine means it suits; it works for (someone)., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson06.order.002
  lesson_content_key: ro.b2.unit05.lesson06.alegerea_registrului
  type: word_order
  frame: {text: 'Scriu la {item}.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_primărie}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Scriu la {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: I'm writing to the city hall. primărie means city hall., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson06.fill.003
  lesson_content_key: ro.b2.unit05.lesson06.alegerea_registrului
  type: fill_in_blank
  frame:
    text: Îi {item} Dianei. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_scriu}
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_scriu}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I''m writing to Diana. scriu means they write (with the reflexive: are written).', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit05.lesson06.translate.004
  lesson_content_key: ro.b2.unit05.lesson06.alegerea_registrului
  type: translation
  frame: {text: To the city hall you write differently., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_scrii}
  answer_derivation:
    kind: render_frame
    frame: {text: 'La primărie {item} altfel.', language_code: ro, direction: ltr}
  feedback_frame: {text: To the city hall you write differently. scrii means you write (informal)., language_code: en, direction: ltr}
