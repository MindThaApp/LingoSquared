  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_gelateria, w_vitrina, w_înghețata, w_aroma, w_bila, w_cornetul, w_bilă, w_cornet, w_arome, w_bile, w_cupa, w_cupă, w_înghețată, w_bilele, w_florărie]
