schema_version: '1.0'
pack_key: practice.en-ro.a1.unit62
source_language: en
target_language: ro
unit_content_key: ro.a1.unit62.parc_de_distractii
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u62 / w_<token>). 14 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_atracția, w_coada, w_coadă, w_harta, w_lungă, w_metru, w_minimă, w_montagnele, w_palpitante, w_panoramică, w_roata, w_rusești, w_teatru, w_înălțime]
templates:
- content_key: practice.en-ro.ro.a1.unit62.lesson01.choose.001
  lesson_content_key: ro.a1.unit62.lesson01.hai_sa_mergem_azi
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_atracția, w_montagnele, w_rusești, w_palpitante, w_coada, w_lungă, w_roata, w_panoramică, w_harta, w_înălțime, w_minimă, w_metru, w_coadă, w_teatru]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on shall we go to the amusement park today?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit62.lesson02.listen.001
  lesson_content_key: ro.a1.unit62.lesson02.montagnele_rusesti_si_coada
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the roller coaster and the line.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit62.lesson03.translate.001
  lesson_content_key: ro.a1.unit62.lesson03.roata_panoramica_si_casa
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the ferris wheel and the ticket counter.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit62.lesson04.match.001
  lesson_content_key: ro.a1.unit62.lesson04.panoul_de_la_intrare
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit62.lesson05.choose.001
  lesson_content_key: ro.a1.unit62.lesson05.la_casa_de_bilete
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on at the amusement park ticket counter.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit62.lesson06.translate.001
  lesson_content_key: ro.a1.unit62.lesson06.ana_aude_despre_parcul
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
