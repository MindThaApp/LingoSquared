schema_version: '1.0'
pack_key: practice.en-ro.a1.unit51
source_language: en
target_language: ro
unit_content_key: ro.a1.unit51.spalatorie
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u51 / w_<token>). 17 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_aleg, w_coșul, w_duc, w_grade, w_greu, w_hainele, w_monede, w_ridic, w_ridica, w_rufe, w_spăla, w_spălare, w_spălarea, w_spălătoria, w_spălătorie, w_uscător, w_uscătorul]
templates:
- content_key: practice.en-ro.ro.a1.unit51.lesson01.choose.001
  lesson_content_key: ro.a1.unit51.lesson01.vreau_sa_mi_spal
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_spălătoria, w_spălătorie, w_spăla, w_hainele, w_spălare, w_aleg, w_spălarea, w_ridica, w_ridic, w_grade, w_uscătorul, w_uscător, w_monede, w_coșul, w_rufe, w_duc, w_greu]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i want to wash my clothes.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit51.lesson02.listen.001
  lesson_content_key: ro.a1.unit51.lesson02.cat_costa_o_spalare
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on how much does a wash cost?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit51.lesson03.translate.001
  lesson_content_key: ro.a1.unit51.lesson03.cand_sunt_gata_rufele
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on when is the laundry ready?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit51.lesson04.match.001
  lesson_content_key: ro.a1.unit51.lesson04.la_spalatorie
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit51.lesson05.choose.001
