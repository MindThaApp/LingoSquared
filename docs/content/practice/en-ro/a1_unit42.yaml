schema_version: '1.0'
pack_key: practice.en-ro.a1.unit42
source_language: en
target_language: ro
unit_content_key: ro.a1.unit42.personalitate
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u42 / w_<token>). 13 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_amabil, w_amuzant, w_asistentă, w_calm, w_cunoașteți, w_curios, w_diferiți, w_noastră, w_povestește, w_răbdător, w_timid, w_venit, w_întreabă]
templates:
- content_key: practice.en-ro.ro.a1.unit42.lesson01.choose.001
  lesson_content_key: ro.a1.unit42.lesson01.amabil_si_amuzant
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_amabil, w_amuzant, w_calm, w_răbdător, w_curios, w_timid, w_cunoașteți, w_asistentă, w_întreabă, w_povestește, w_diferiți, w_venit, w_noastră]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on kind and funny.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit42.lesson02.listen.001
  lesson_content_key: ro.a1.unit42.lesson02.calm_si_rabdator
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on calm and patient.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit42.lesson03.translate.001
  lesson_content_key: ro.a1.unit42.lesson03.curios_si_timid
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on curious and shy.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit42.lesson04.match.001
  lesson_content_key: ro.a1.unit42.lesson04.nina_intreaba_la_cafeneaua
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit42.lesson05.choose.001
  lesson_content_key: ro.a1.unit42.lesson05.nina_afla_despre_toti
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on nina hears about everyone.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit42.lesson06.translate.001
  lesson_content_key: ro.a1.unit42.lesson06.nina_se_descrie
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on nina describes herself.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit42.lesson01.order.002
  lesson_content_key: ro.a1.unit42.lesson01.amabil_si_amuzant
  type: word_order
  frame: {text: 'Andrei este {item}.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_amuzant}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Andrei este {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: Andrei is funny. amuzant means funny (masc.)., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit42.lesson02.order.002
  lesson_content_key: ro.a1.unit42.lesson02.calm_si_rabdator
  type: word_order
  frame: {text: 'Mihai este {item}.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_calm}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Mihai este {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: Mihai is calm. calm means calm; calm down., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit42.lesson05.order.002
  lesson_content_key: ro.a1.unit42.lesson05.nina_afla_despre_toti
  type: word_order
  frame: {text: 'Toți cei de la cafeneaua lingvistică sunt {item} și e frumos.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_diferiți}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Toți cei de la cafeneaua lingvistică sunt {item} și e frumos.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Everyone at the language café is different, and that''s nice. diferiți means different (masc. pl.).', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit42.lesson06.order.002
  lesson_content_key: ro.a1.unit42.lesson06.nina_se_descrie
  type: word_order
  frame: {text: 'Bun {item} la cafeneaua noastră lingvistică!', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_venit}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Bun {item} la cafeneaua noastră lingvistică!', language_code: ro, direction: ltr}
  feedback_frame: {text: Welcome to our language café! venit means come (past participle)., language_code: en, direction: ltr}
