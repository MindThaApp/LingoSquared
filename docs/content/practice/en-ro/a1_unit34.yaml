  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_bicicleta, w_călătorește, w_mașina, w_jos, w_conduce, w_călători, w_serviciul, w_călătoresc, w_călătorești, w_învățat, w_transport, w_ghișeu, w_necunoscut, w_forma, w_politețe, w_mijloc, w_iau, w_centru, w_ajungi, w_obicei, w_mergi, w_preferă, w_locuiește, w_conduc]
