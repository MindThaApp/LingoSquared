  notes: >-
    Authored 2026-10-25 (session 12, en-ro B1 set) from scripts/backfill_lexemes_en_ro.py (en-ro-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Topic: what mihai said. Sentence translations accept a dropped subject pronoun, a few word-order alternatives and the cedilla spellings (ş, ţ) next to the comma-below ones (ș, ț). Reviewer: confirm the glosses of subjunctive forms ("(that) he or she ...") and the accepted word-order variants against the conjunctiv, perfect compus and imperfect notes of the unit.
