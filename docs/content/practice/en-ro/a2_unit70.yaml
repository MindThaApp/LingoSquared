  frame: {text: 'Din cauza unei defecțiuni de {item}, trenul meu este anulat.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_semnalizare}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Din cauza unei defecțiuni de {item}, trenul meu este anulat.', language_code: ro, direction: ltr}
  feedback_frame: {text: My train is cancelled because of a signal failure. semnalizare means signalling., language_code: en, direction: ltr}
