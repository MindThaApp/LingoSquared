  frame:
    text: Trenul meu este anulat din {item} unei defecțiuni de semnalizare. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_cauza}
