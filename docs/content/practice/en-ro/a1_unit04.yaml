tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ora, w_jumătate, w_cât, w_sfert, w_fără, w_târziu, w_dimineața, w_seara, w_noaptea, w_cursul, w_începe, w_oră]
slot_presets:
  l1_pool: &l1_pool {language_code: ro, part_of_speech: [adverb, noun, preposition], agreement_tags: {semantic: [w_ora, w_jumătate, w_cât, w_sfert, w_fără, w_târziu]}}
  u4_words: &u4_words {language_code: ro, part_of_speech: [adverb, noun, preposition, verb], agreement_tags: {semantic: [w_jumătate, w_cât, w_sfert, w_fără, w_târziu, w_dimineața, w_seara, w_noaptea, w_cursul, w_începe]}}
  l3_pool: &l3_pool {language_code: ro, part_of_speech: [adverb, noun, verb], agreement_tags: {semantic: [w_dimineața, w_seara, w_noaptea, w_cursul, w_începe, w_târziu]}}
  t_ora: &t_ora {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_ora}}
  t_jumatate: &t_jumatate {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_jumătate}}
  t_sfert: &t_sfert {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_sfert}}
  t_fara: &t_fara {language_code: ro, part_of_speech: preposition, agreement_tags: {semantic: w_fără}}
  t_oraw: &t_oraw {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_oră}}
  t_incepe: &t_incepe {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_începe}}
  t_dimineata: &t_dimineata {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_dimineața}}
  t_cursul: &t_cursul {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_cursul}}
templates:
  - content_key: practice.en-ro.ro.a1.unit04.lesson01.choose.001
    lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l1_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Jumătate means half and un sfert means a quarter; both attach to the hour with și.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson01.listen.002
    lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
    type: listen_select
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l1_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Cât este ora? asks the time; the answer is Este ora + number.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson01.match.003
    lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ro, direction: ltr}
    slots: {first: *l1_pool, second: *l1_pool, third: *l1_pool, fourth: *l1_pool, fifth: *l1_pool, sixth: *l1_pool}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Ora is the hour or the time on the clock; fără and și move the time forward or back.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson01.order.004
    lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
    type: word_order
    frame: {text: "Este {item} unu.", language_code: ro, direction: ltr}
    slots: {item: *t_ora}
    answer_derivation: {kind: render_frame, frame: {text: "Este {item} unu.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "After ora use unu for one and două for two: ora unu, ora două.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson01.fill.005
    lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
    type: fill_in_blank
    frame: {text: "Este ora unu și {item}. ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_jumatate, hint: *t_jumatate}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Și jumătate adds thirty minutes: ora unu și jumătate is half past one.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson01.translate.006
    lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
    type: translation
    frame: {text: "What time is it?", language_code: en, direction: ltr}
    slots: {item: *t_ora}
    answer_derivation: {kind: render_frame, frame: {text: "Cât este {item}?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Cât este ora? literally asks how much is the hour; answer with Este ora + number.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson01.translate.007
    lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *u4_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Fără normally means without; before un sfert it means a quarter to.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson02.translate.001
    lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
    type: translation
    frame: {text: "It is a quarter past two.", language_code: en, direction: ltr}
    slots: {item: *t_sfert}
    answer_derivation: {kind: render_frame, frame: {text: "Este ora două și un {item}.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Și un sfert adds fifteen minutes; fără un sfert takes fifteen away.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson02.fill.002
    lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
    type: fill_in_blank
    frame: {text: "Este ora trei {item} un sfert. ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_fara, hint: *t_fara}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Fără un sfert subtracts fifteen minutes: ora trei fără un sfert is 2:45.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson02.translate.003
    lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
    type: translation
    frame: {text: "At what time?", language_code: en, direction: ltr}
    slots: {item: *t_oraw}
    answer_derivation: {kind: render_frame, frame: {text: "La ce {item}?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "La ce oră? asks when something happens; answer with la ora + number: la ora nouă.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson02.order.004
    lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
    type: word_order
    frame: {text: "Este ora trei fără un {item}.", language_code: ro, direction: ltr}
    slots: {item: *t_sfert}
    answer_derivation: {kind: render_frame, frame: {text: "Este ora trei fără un {item}.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Un sfert is masculine, so it takes un; the clock phrase counts back from the next hour.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson03.choose.001
    lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l3_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Dimineața, seara and noaptea are the parts of the day and end in -a because they carry the definite article.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson03.listen.002
    lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
    type: listen_select
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l3_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Cursul is the class; begins is începe, used for both classes and events.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson03.order.003
    lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
    type: word_order
    frame: {text: "Cursul {item} la ora nouă.", language_code: ro, direction: ltr}
    slots: {item: *t_incepe}
    answer_derivation: {kind: render_frame, frame: {text: "Cursul {item} la ora nouă.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Începe is the he, she or it form of begin, matching the singular subject cursul.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson03.translate.004
    lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
    type: translation
    frame: {text: "The class starts at nine o'clock in the morning.", language_code: en, direction: ltr}
    slots: {item: *t_dimineata}
    answer_derivation: {kind: render_frame, frame: {text: "Cursul începe la ora nouă, {item}.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Add the part of the day after the time: la ora nouă, dimineața or la ora nouă, seara.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit04.lesson03.fill.005
    lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
    type: fill_in_blank
    frame: {text: "Când începe {item}? ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_cursul, hint: *t_cursul}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Când începe cursul? asks when the class starts; the answer is Cursul începe la ora nouă.", language_code: en, direction: ltr}
