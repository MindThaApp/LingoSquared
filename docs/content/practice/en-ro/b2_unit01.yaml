schema_version: '1.0'
pack_key: practice.en-ro.b2.unit01
source_language: en
target_language: ro
unit_content_key: ro.b2.unit01.argumentare
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_b2_u1 / w_<token>). 56 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_acord, w_adevărat, w_alegere, w_altă, w_arată, w_are, w_avantaje, w_avantajele, w_aveți, w_bani, w_banii, w_bun, w_comun, w_confortabilă, w_contează, w_cred, w_credeți, w_desigur, w_dezavantaje, w_dezavantajele, w_doilea, w_dreptate, w_ecologic, w_economisesc, w_economisiți, w_este, w_exemplu, w_incomod, w_mai, w_mașina, w_mea, w_mult, w_mulți, w_oameni, w_opinia, w_parte, w_personală, w_plus, w_poate, w_prefer, w_preferă, w_primul, w_punct, w_puțin, w_rând, w_schimb, w_scurt, w_studiile, w_sunt, w_timp, w_tot, w_totuși, w_transportul, w_uneori, w_vedere, w_înseamnă]
templates:
- content_key: practice.en-ro.ro.b2.unit01.lesson01.choose.001
  lesson_content_key: ro.b2.unit01.lesson01.opinia
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_transportul, w_comun, w_mașina, w_personală, w_punct, w_vedere, w_cred, w_opinia, w_mea, w_mai, w_bun, w_este, w_sunt, w_acord, w_primul, w_rând, w_doilea, w_plus, w_exemplu, w_studiile, w_arată, w_bani, w_banii, w_economisesc, w_economisiți, w_ecologic, w_mulți, w_preferă, w_prefer, w_timp, w_parte, w_altă, w_desigur, w_adevărat, w_confortabilă, w_incomod, w_uneori, w_totuși, w_schimb, w_înseamnă, w_scurt, w_avantaje, w_avantajele, w_dezavantaje, w_dezavantajele, w_contează, w_mult, w_puțin, w_are, w_tot, w_oameni, w_alegere, w_credeți, w_poate, w_aveți, w_dreptate]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on expressing an opinion.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson02.listen.001
  lesson_content_key: ro.b2.unit01.lesson02.argumente
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reasons and evidence.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson03.translate.001
  lesson_content_key: ro.b2.unit01.lesson03.cealalta_parte
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on acknowledging the other side.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson04.match.001
  lesson_content_key: ro.b2.unit01.lesson04.combaterea
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson05.choose.001
  lesson_content_key: ro.b2.unit01.lesson05.text_argumentativ
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading an argumentative text.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson06.translate.001
  lesson_content_key: ro.b2.unit01.lesson06.sustinerea_pozitiei
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on defending a position in a discussion.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson01.order.002
  lesson_content_key: ro.b2.unit01.lesson01.opinia
  type: word_order
  frame: {text: 'Cred că {item} în comun este mai bun decât mașina personală.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_transportul}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Cred că {item} în comun este mai bun decât mașina personală.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'I think that public transport is better than the private car. A model claim. Este (''is'') is the third-person form of a fi, agreeing with the neuter subject transportul.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson01.fill.003
  lesson_content_key: ro.b2.unit01.lesson01.opinia
  type: fill_in_blank
  frame:
    text: Transportul în {item} este ieftin. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_comun}
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_comun}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Public transport is cheap. comun means public; shared (masc.)., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson01.translate.004
  lesson_content_key: ro.b2.unit01.lesson01.opinia
  type: translation
  frame: {text: Many people prefer the private car., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_mașina}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Mulți oameni preferă {item} personală.', language_code: ro, direction: ltr}
  feedback_frame: {text: Many people prefer the private car. mașina means the car., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson02.order.002
  lesson_content_key: ro.b2.unit01.lesson02.argumente
  type: word_order
  frame: {text: 'În {item}, este rapid.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags: {semantic: w_plus}
  answer_derivation:
    kind: render_frame
    frame: {text: 'În {item}, este rapid.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'In addition, it is fast. plus means in addition; plus.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson02.fill.003
  lesson_content_key: ro.b2.unit01.lesson02.argumente
  type: fill_in_blank
  frame:
    text: De {item}, autobuzul este ieftin. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_exemplu}
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_exemplu}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'For example, the bus is cheap. exemplu means example.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson02.translate.004
  lesson_content_key: ro.b2.unit01.lesson02.argumente
  type: translation
  frame: {text: Money is saved., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_bani}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Se economisesc {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: Money is saved. bani means money., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson03.order.002
  lesson_content_key: ro.b2.unit01.lesson03.cealalta_parte
  type: word_order
  frame: {text: 'Pe de altă {item}, mașina personală este mai confortabilă.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_parte}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Pe de altă {item}, mașina personală este mai confortabilă.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Mihai: On the other hand, the private car is more comfortable. parte means part.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson03.fill.003
  lesson_content_key: ro.b2.unit01.lesson03.cealalta_parte
  type: fill_in_blank
  frame:
    text: Mașina personală este {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_confortabilă}
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_confortabilă}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: The private car is comfortable. confortabilă means comfortable (fem.)., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson03.translate.004
  lesson_content_key: ro.b2.unit01.lesson03.cealalta_parte
  type: translation
  frame: {text: Sometimes public transport is uncomfortable., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_incomod}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Uneori transportul în comun este {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: Sometimes public transport is uncomfortable. incomod means uncomfortable., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson04.order.002
  lesson_content_key: ro.b2.unit01.lesson04.combaterea
  type: word_order
  frame: {text: 'Este scump, {item} îl cumpăr.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags: {semantic: w_totuși}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Este scump, {item} îl cumpăr.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'It is expensive, yet I buy it. totuși means however; still.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson04.fill.003
  lesson_content_key: ro.b2.unit01.lesson04.combaterea
  type: fill_in_blank
  frame:
    text: Mașina este comodă; transportul în comun, în {item}, este mai ieftin. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_schimb}
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_schimb}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'The car is convenient; public transport, by contrast, is cheaper. schimb means exchange (as in "on the other hand").', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson04.translate.004
  lesson_content_key: ro.b2.unit01.lesson04.combaterea
  type: translation
  frame: {text: 'In short, public transport is better.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_scurt}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Pe {item}, transportul în comun este mai bun.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'In short, public transport is better. scurt means short (masc.).', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson05.order.002
  lesson_content_key: ro.b2.unit01.lesson05.text_argumentativ
  type: word_order
  frame: {text: 'Mulți {item} preferă mașina personală.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_oameni}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Mulți {item} preferă mașina personală.', language_code: ro, direction: ltr}
  feedback_frame: {text: Many people prefer the private car. oameni means people., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson06.order.002
  lesson_content_key: ro.b2.unit01.lesson06.sustinerea_pozitiei
  type: word_order
  frame: {text: 'De ce {item} asta?', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_credeți}
  answer_derivation:
    kind: render_frame
    frame: {text: 'De ce {item} asta?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Why do you think that? De ce credeți asta? asks a debating partner (formally, with dumneavoastră) to support their claim -- the cue to give your reasons and evidence.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson06.fill.003
  lesson_content_key: ro.b2.unit01.lesson06.sustinerea_pozitiei
  type: fill_in_blank
  frame:
    text: Poate {item} dreptate. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_aveți}
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_aveți}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Maybe you''re right. / You may have a point. Poate aveți dreptate concedes that the other person''s argument is reasonable, without fully giving up your own -- a natural formal way to acknowledge a good point in discussion.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit01.lesson06.translate.004
  lesson_content_key: ro.b2.unit01.lesson06.sustinerea_pozitiei
  type: translation
  frame: {text: 'Of course, he/she is right.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_dreptate}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Desigur, are {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Of course, he/she is right. dreptate means being right.', language_code: en, direction: ltr}
