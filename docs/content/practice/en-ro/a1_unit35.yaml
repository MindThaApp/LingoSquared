        semantic: [w_folosi, w_folosesc, w_telefonul, w_computerul, w_folosește, w_computer, w_internetul, w_internet, w_aplicația, w_aplicație, w_prognoza, w_meteo, w_neutru, w_mesaje, w_articolul, w_sfârșit, w_trimite, w_citește, w_căuta, w_caut, w_cauți, w_fel, w_caută, w_alergat, w_văd, w_numi, w_sună, w_dimineață, w_vin, w_super]
