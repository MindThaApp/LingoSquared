  lesson_content_key: ro.a1.unit64.lesson01.hai_sa_mergem_la
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_aglomerată, w_taraba, w_tarabă, w_legumele, w_proaspete, w_fructele, w_gustoase, w_merele, w_vânzătorul, w_kilogramul, w_mere, w_kilograme, w_geantă, w_brutărie]
