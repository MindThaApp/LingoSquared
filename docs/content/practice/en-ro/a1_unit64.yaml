review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u64 / w_<token>). 14 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_aglomerată, w_brutărie, w_fructele, w_geantă, w_gustoase, w_kilograme, w_kilogramul, w_legumele, w_mere, w_merele, w_proaspete, w_taraba, w_tarabă, w_vânzătorul]
templates:
