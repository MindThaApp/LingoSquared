schema_version: '1.0'
pack_key: practice.en-ro.c1.unit05
source_language: en
target_language: ro
unit_content_key: ro.c1.unit05.contrafactual
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_c1_u5 / w_<token>). 23 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_acum, w_ajutor, w_ales, w_avut, w_cerut, w_complete, w_datele, w_devreme, w_era, w_evitat, w_inițială, w_ipoteza, w_lucra, w_metodă, w_presiune, w_raportul, w_regret, w_simplă, w_urgent, w_urmă, w_verificat, w_întârzierea, w_știut]
templates:
- content_key: practice.en-ro.ro.c1.unit05.lesson01.choose.001
  lesson_content_key: ro.c1.unit05.contrafactual.lesson01.conditie_trecut
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_avut, w_datele, w_complete, w_evitat, w_întârzierea, w_știut, w_urgent, w_era, w_raportul, w_cerut, w_ajutor, w_devreme, w_ales, w_metodă, w_simplă, w_lucra, w_acum, w_presiune, w_urmă, w_regret, w_verificat, w_ipoteza, w_inițială]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on past condition.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.c1.unit05.lesson02.listen.001
  lesson_content_key: ro.c1.unit05.contrafactual.lesson02.rezultat_trecut
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on past result.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.c1.unit05.lesson03.translate.001
  lesson_content_key: ro.c1.unit05.contrafactual.lesson03.conditie_mixta
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on mixed conditional.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.c1.unit05.lesson04.match.001
  lesson_content_key: ro.c1.unit05.contrafactual.lesson04.regret
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.c1.unit05.lesson01.choose.002
  lesson_content_key: ro.c1.unit05.contrafactual.lesson01.conditie_trecut
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on past condition.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.c1.unit05.lesson02.translate.002
  lesson_content_key: ro.c1.unit05.contrafactual.lesson02.rezultat_trecut
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on past result.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.c1.unit05.lesson04.order.002
  lesson_content_key: ro.c1.unit05.contrafactual.lesson04.regret
  type: word_order
  frame: {text: 'Privind în {item}, regret că nu am verificat ipoteza inițială.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_urmă}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Privind în {item}, regret că nu am verificat ipoteza inițială.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Looking back, I regret that I did not check the initial hypothesis. Regret că names the speaker''s evaluation.', language_code: en, direction: ltr}
