schema_version: '1.0'
pack_key: practice.en-ro.a1.unit43
source_language: en
target_language: ro
unit_content_key: ro.a1.unit43.culori
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u43 / w_<token>). 13 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_alb, w_alegi, w_distractivă, w_flori, w_frumoase, w_galben, w_lalele, w_lalelele, w_mov, w_piața, w_portocaliu, w_roz, w_toate]
templates:
- content_key: practice.en-ro.ro.a1.unit43.lesson01.choose.001
  lesson_content_key: ro.a1.unit43.lesson01.rosu_si_galben
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_lalelele, w_galben, w_alb, w_portocaliu, w_roz, w_alegi, w_mov, w_lalele, w_piața, w_flori, w_toate, w_frumoase, w_distractivă]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on red and yellow.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit43.lesson02.listen.001
  lesson_content_key: ro.a1.unit43.lesson02.alb_si_portocaliu
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on white and orange.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit43.lesson03.translate.001
  lesson_content_key: ro.a1.unit43.lesson03.roz_si_mov
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on pink and purple.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit43.lesson04.match.001
  lesson_content_key: ro.a1.unit43.lesson04.nina_si_ana_la
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
