schema_version: '1.0'
pack_key: practice.en-ro.a1.unit45
source_language: en
target_language: ro
unit_content_key: ro.a1.unit45.urgente
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u45 / w_<token>). 14 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ajutor, w_ajutorul, w_ambulanță, w_angajat, w_atenție, w_ieșirea, w_incendiu, w_poliția, w_poliție, w_pompieri, w_pompierii, w_urgență, w_vino, w_întâmplă]
templates:
- content_key: practice.en-ro.ro.a1.unit45.lesson01.choose.001
  lesson_content_key: ro.a1.unit45.lesson01.ajutor_si_incendiu
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_ajutorul, w_ajutor, w_incendiu, w_urgență, w_ieșirea, w_poliție, w_poliția, w_ambulanță, w_pompierii, w_pompieri, w_angajat, w_atenție, w_vino, w_întâmplă]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on help and fire.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit45.lesson02.listen.001
  lesson_content_key: ro.a1.unit45.lesson02.numarul_de_urgenta_si
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the emergency number and the emergency exit.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit45.lesson03.translate.001
  lesson_content_key: ro.a1.unit45.lesson03.politie_ambulanta_sau_pompieri
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on police, ambulance, or fire brigade.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit45.lesson04.match.001
  lesson_content_key: ro.a1.unit45.lesson04.incendiu_la_cafeneaua_de
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit45.lesson06.choose.001
  lesson_content_key: ro.a1.unit45.lesson06.andrei_ajunge
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on andrei arrives.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit45.lesson01.translate.002
  lesson_content_key: ro.a1.unit45.lesson01.ajutor_si_incendiu
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on help and fire.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit45.lesson01.order.003
  lesson_content_key: ro.a1.unit45.lesson01.ajutor_si_incendiu
  type: word_order
  frame: {text: 'Am nevoie de {item}.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_ajutor}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Am nevoie de {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: I need help. ajutor means help., language_code: en, direction: ltr}
