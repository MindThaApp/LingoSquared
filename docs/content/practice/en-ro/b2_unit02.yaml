schema_version: '1.0'
pack_key: practice.en-ro.b2.unit02
source_language: en
target_language: ro
unit_content_key: ro.b2.unit02.speculatie
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_b2_u2 / w_<token>). 28 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_acasă, w_acolo, w_azi, w_birou, w_deci, w_deducție, w_dimineață, w_doar, w_fie, w_important, w_ocupată, w_posibil, w_presupun, w_presupunere, w_probabil, w_putea, w_răspunde, w_sigur, w_siguranță, w_sună, w_telefon, w_telefonul, w_trebuie, w_târziu, w_uitat, w_îndoială, w_întâlnire, w_știu]
templates:
- content_key: practice.en-ro.ro.b2.unit02.lesson01.choose.001
  lesson_content_key: ro.b2.unit02.lesson01.certitudine
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_răspunde, w_telefon, w_telefonul, w_ocupată, w_probabil, w_sigur, w_siguranță, w_îndoială, w_întâlnire, w_târziu, w_important, w_trebuie, w_fie, w_acasă, w_deci, w_birou, w_sună, w_putea, w_posibil, w_știu, w_presupun, w_acolo, w_deducție, w_doar, w_presupunere, w_uitat, w_dimineață, w_azi]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the degree of certainty.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson02.listen.001
  lesson_content_key: ro.b2.unit02.lesson02.deductie
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on deduction: evidence and conclusions.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson03.translate.001
  lesson_content_key: ro.b2.unit02.lesson03.presupunere
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a guess or a deduction?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson04.match.001
  lesson_content_key: ro.b2.unit02.lesson04.trecutul
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson05.choose.001
  lesson_content_key: ro.b2.unit02.lesson05.fapt_sau_speculatie
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on fact or speculation?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson06.translate.001
  lesson_content_key: ro.b2.unit02.lesson06.speculand_impreuna
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on speculating together.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson01.order.002
  lesson_content_key: ro.b2.unit02.lesson01.certitudine
  type: word_order
  frame: {text: 'Diana nu {item} la telefon.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_răspunde}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Diana nu {item} la telefon.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Diana isn''t answering the phone. Nu răspunde (isn''t answering) is from a răspunde, to answer. Diana, a colleague of Mihai''s, isn''t picking up.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson01.fill.003
  lesson_content_key: ro.b2.unit02.lesson01.certitudine
  type: fill_in_blank
  frame:
    text: Diana nu răspunde la {item} azi-dimineață. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_telefon}
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_telefon}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Mihai: Diana isn''t answering the phone this morning. telefon means telephone; phone.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson01.translate.004
  lesson_content_key: ro.b2.unit02.lesson01.certitudine
  type: translation
  frame: {text: Diana forgot the phone., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_telefonul}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Diana a uitat {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: Diana forgot the phone. telefonul means the phone., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson02.order.002
  lesson_content_key: ro.b2.unit02.lesson02.deductie
  type: word_order
  frame: {text: 'Mașina ei este la birou, deci {item} să fie acolo.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_trebuie}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Mașina ei este la birou, deci {item} să fie acolo.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Mihai: Her car is at the office, so she must be there. Evidence (the car), then deci + trebuie să fie -- a firm deduction.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson02.fill.003
  lesson_content_key: ro.b2.unit02.lesson02.deductie
  type: fill_in_blank
  frame:
    text: Este posibil să {item} ocupată. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_fie}
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_fie}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: It is possible that she is busy. fie means be (as in 'must be')., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson02.translate.004
  lesson_content_key: ro.b2.unit02.lesson02.deductie
  type: translation
  frame: {text: Diana is not home., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags: {semantic: w_acasă}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Diana nu este {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: Diana is not home. acasă means home; at home., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson03.order.002
  lesson_content_key: ro.b2.unit02.lesson03.presupunere
  type: word_order
  frame: {text: 'S-ar {item} să fi uitat telefonul.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_putea}
  answer_derivation:
    kind: render_frame
    frame: {text: 'S-ar {item} să fi uitat telefonul.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Mihai: She might have forgotten the phone. S-ar putea să fi uitat -- a possibility about the past, weaker than trebuie să fi uitat.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson03.fill.003
  lesson_content_key: ro.b2.unit02.lesson03.presupunere
  type: fill_in_blank
  frame:
    text: Este {item} să fie ocupată. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_posibil}
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_posibil}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: It is possible that she is busy. posibil means possible., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson03.translate.004
  lesson_content_key: ro.b2.unit02.lesson03.presupunere
  type: translation
  frame: {text: I don't know for sure., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_știu}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Nu {item} sigur.', language_code: ro, direction: ltr}
  feedback_frame: {text: I don't know for sure. știu means I know., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson04.order.002
  lesson_content_key: ro.b2.unit02.lesson04.trecutul
  type: word_order
  frame: {text: 'Diana a {item} telefonul.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_uitat}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Diana a {item} telefonul.', language_code: ro, direction: ltr}
  feedback_frame: {text: Diana forgot the phone. uitat means forgot; forgotten., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit02.lesson06.order.002
  lesson_content_key: ro.b2.unit02.lesson06.speculand_impreuna
  type: word_order
  frame: {text: 'Diana este ocupată {item}.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags: {semantic: w_azi}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Diana este ocupată {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: Diana is busy today. azi means today., language_code: en, direction: ltr}
