schema_version: "1.0"
pack_key: practice.en-ro.a1.unit10
source_language: en
target_language: ro
unit_content_key: ro.a1.unit10.routines
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ro job B) from scripts/backfill_lexemes_en_ro.py
    lexemes (ro_a1_u10* tags). Recognition, matching and bare-word production use curated
    w_ pools of this unit's own tokens (no two members share a gloss); sentence frames use
    single w_ anchors. English prompts name tu versus dumneavoastră register where it matters.
    Feedback lines carry a usage or grammar point. Reviewer: confirm the reflexive mă trezesc / mă culc, and the Nu + verb negative frame (not taught as a pattern in this unit).
    Opus quality pass 2026-10-24: bare-word translation uses a new r_words pool without the reflexive-only trezesc/culc; pronoun-drop feedback corrected.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_trezesc, w_mănânc, w_beau, w_lucrez, w_merg, w_acasă, w_culc]
slot_presets:
  r_words: &r_words {language_code: ro, part_of_speech: [adverb, verb], agreement_tags: {semantic: [w_mănânc, w_beau, w_lucrez, w_merg, w_acasă]}}
  r_pool: &r_pool {language_code: ro, part_of_speech: [adverb, verb], agreement_tags: {semantic: [w_trezesc, w_mănânc, w_beau, w_lucrez, w_merg, w_acasă, w_culc]}}
  r_first: &r_first {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: [w_trezesc, w_mănânc, w_beau]}}
  r_sub: &r_sub {language_code: ro, part_of_speech: [adverb, verb], agreement_tags: {semantic: [w_mănânc, w_lucrez, w_merg, w_acasă, w_culc]}}
  t_trezesc: &t_trezesc {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_trezesc}}
  t_beau: &t_beau {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_beau}}
  t_mananc: &t_mananc {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_mănânc}}
  t_merg: &t_merg {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_merg}}
  t_culc: &t_culc {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_culc}}
  t_acasa: &t_acasa {language_code: ro, part_of_speech: adverb, agreement_tags: {semantic: w_acasă}}
  t_lucrez: &t_lucrez {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_lucrez}}
templates:
  - content_key: practice.en-ro.ro.a1.unit10.lesson01.choose.001
    lesson_content_key: ro.a1.unit10.lesson01.dimineata
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *r_first}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Trezesc, mănânc and beau are I forms; Romanian verbs show the person in the ending, so each form is learned as it comes.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson02.listen.001
    lesson_content_key: ro.a1.unit10.lesson02.lucrez_merg_acasa
    type: listen_select
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *r_sub}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Merg is I go and acasă is home; they combine in Merg acasă.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson03.choose.001
    lesson_content_key: ro.a1.unit10.lesson03.rutina_mihai
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *r_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mă culc is I go to bed and mă trezesc is I wake up; both use mă because the action is done to yourself.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson02.match.002
    lesson_content_key: ro.a1.unit10.lesson02.lucrez_merg_acasa
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ro, direction: ltr}
    slots: {first: *r_pool, second: *r_pool, third: *r_pool, fourth: *r_pool, fifth: *r_pool, sixth: *r_pool}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Trezesc and culc are used with mă; mănânc, beau, lucrez and merg stand on their own.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson01.order.002
    lesson_content_key: ro.a1.unit10.lesson01.dimineata
    type: word_order
    frame: {text: "Mă {item} dimineața.", language_code: ro, direction: ltr}
    slots: {item: *t_trezesc}
    answer_derivation: {kind: render_frame, frame: {text: "Mă {item} dimineața.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Mă trezesc dimineața: the reflexive mă comes before the verb.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson01.order.003
    lesson_content_key: ro.a1.unit10.lesson01.dimineata
    type: word_order
    frame: {text: "Mănânc pâine și {item} cafea dimineața.", language_code: ro, direction: ltr}
    slots: {item: *t_beau}
    answer_derivation: {kind: render_frame, frame: {text: "Mănânc pâine și {item} cafea dimineața.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Beau is I drink and is irregular; mănânc is I eat.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson02.order.003
    lesson_content_key: ro.a1.unit10.lesson02.lucrez_merg_acasa
    type: word_order
    frame: {text: "Lucrez seara și {item} acasă noaptea.", language_code: ro, direction: ltr}
    slots: {item: *t_merg}
    answer_derivation: {kind: render_frame, frame: {text: "Lucrez seara și {item} acasă noaptea.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Merg is I go; acasă means home with no preposition: merg acasă.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson03.order.002
    lesson_content_key: ro.a1.unit10.lesson03.rutina_mihai
    type: word_order
    frame: {text: "Lucrez seara, apoi mă {item} noaptea.", language_code: ro, direction: ltr}
    slots: {item: *t_culc}
    answer_derivation: {kind: render_frame, frame: {text: "Lucrez seara, apoi mă {item} noaptea.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Mă culc means I go to bed; apoi marks what comes next.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson01.fill.004
    lesson_content_key: ro.a1.unit10.lesson01.dimineata
    type: fill_in_blank
    frame: {text: "Mă {item} dimineața. ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_trezesc, hint: *t_trezesc}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mă trezesc dimineața is the standard way to say when you get up.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson02.fill.004
    lesson_content_key: ro.a1.unit10.lesson02.lucrez_merg_acasa
    type: fill_in_blank
    frame: {text: "Nu {item} noaptea. ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_lucrez, hint: *t_lucrez}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Nu goes straight before the verb to make it negative: nu lucrez.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson02.fill.005
    lesson_content_key: ro.a1.unit10.lesson02.lucrez_merg_acasa
    type: fill_in_blank
    frame: {text: "Merg {item} noaptea. ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_acasa, hint: *t_acasa}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Acasă means at home or home; Merg acasă is I go home.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson03.fill.003
    lesson_content_key: ro.a1.unit10.lesson03.rutina_mihai
    type: fill_in_blank
    frame: {text: "Mă {item} noaptea. ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_culc, hint: *t_culc}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mă culc is a reflexive: literally I put myself to bed, so it means I go to bed.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson01.translate.005
    lesson_content_key: ro.a1.unit10.lesson01.dimineata
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *r_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mănânc, beau and merg need no word for I, because the verb ending already shows the person.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson01.translate.006
    lesson_content_key: ro.a1.unit10.lesson01.dimineata
    type: translation
    frame: {text: "I wake up in the morning and I eat bread.", language_code: en, direction: ltr}
    slots: {item: *t_mananc}
    answer_derivation: {kind: render_frame, frame: {text: "Mă trezesc dimineața și {item} pâine.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Mănânc is the I form of the verb for eating.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson01.translate.007
    lesson_content_key: ro.a1.unit10.lesson01.dimineata
    type: translation
    frame: {text: "I eat bread and I drink coffee in the morning.", language_code: en, direction: ltr}
    slots: {item: *t_beau}
    answer_derivation: {kind: render_frame, frame: {text: "Mănânc pâine și {item} cafea dimineața.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Beau is I drink; Romanian leaves out eu because the endings of mănânc and beau already show I.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson02.translate.006
    lesson_content_key: ro.a1.unit10.lesson02.lucrez_merg_acasa
    type: translation
    frame: {text: "I work in the evening and I go home at night.", language_code: en, direction: ltr}
    slots: {item: *t_merg}
    answer_derivation: {kind: render_frame, frame: {text: "Lucrez seara și {item} acasă noaptea.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Merg acasă noaptea: seara and noaptea tell when, and acasă needs no preposition.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit10.lesson03.translate.004
    lesson_content_key: ro.a1.unit10.lesson03.rutina_mihai
    type: translation
    frame: {text: "I work in the evening, then I go to bed at night.", language_code: en, direction: ltr}
    slots: {item: *t_culc}
    answer_derivation: {kind: render_frame, frame: {text: "Lucrez seara, apoi mă {item} noaptea.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Mă culc takes the reflexive mă; apoi means then.", language_code: en, direction: ltr}
