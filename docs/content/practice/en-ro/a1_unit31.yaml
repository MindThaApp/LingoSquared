schema_version: '1.0'
pack_key: practice.en-ro.a1.unit31
source_language: en
target_language: ro
unit_content_key: ro.a1.unit31.aspect
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u31 / w_<token>). 41 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_acordă, w_adjectiv, w_adjectivul, w_albaștri, w_arată, w_arăți, w_blond, w_bunicul, w_bătrân, w_cafeneaua, w_comparativul, w_cunosc, w_cărunt, w_diferit, w_exactă, w_fată, w_formează, w_generală, w_impresie, w_limbi, w_lung, w_maro, w_negru, w_ochi, w_ochii, w_plural, w_posesivul, w_păr, w_părul, w_recunosc, w_scund, w_scurt, w_spui, w_străine, w_substantiv, w_tânăr, w_uite, w_verde, w_vine, w_vârsta, w_înalt]
templates:
- content_key: practice.en-ro.ro.a1.unit31.lesson01.choose.001
  lesson_content_key: ro.a1.unit31.lesson01.inalt_scund_batran_si
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_înalt, w_scund, w_bătrân, w_tânăr, w_bunicul, w_vârsta, w_exactă, w_spui, w_arată, w_impresie, w_generală, w_părul, w_scurt, w_negru, w_blond, w_maro, w_cărunt, w_lung, w_adjectivul, w_vine, w_substantiv, w_păr, w_posesivul, w_ochii, w_ochi, w_verde, w_albaștri, w_plural, w_acordă, w_fată, w_cafeneaua, w_limbi, w_străine, w_recunosc, w_diferit, w_arăți, w_comparativul, w_formează, w_adjectiv, w_uite, w_cunosc]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on tall, short, old, and young.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit31.lesson02.listen.001
  lesson_content_key: ro.a1.unit31.lesson02.descrierea_parului
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on describing hair.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit31.lesson03.translate.001
  lesson_content_key: ro.a1.unit31.lesson03.ochii_si_cum_arata
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on eyes and what does someone look like?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit31.lesson04.match.001
  lesson_content_key: ro.a1.unit31.lesson04.ana_o_descrie_pe
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
