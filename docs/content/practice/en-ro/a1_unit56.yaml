  answer_derivation:
    kind: render_frame
    frame: {text: 'Concertul durează două {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: The concert lasts two hours. ore means hours., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit56.lesson04.order.002
  lesson_content_key: ro.a1.unit56.lesson04.la_casa_de_bilete
  type: word_order
  frame: {text: 'Da, aș vrea un bilet pentru {item}, vă rog.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_trupă}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Da, aș vrea un bilet pentru {item}, vă rog.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Yes, I''d like a ticket for the band, please. trupă means band.', language_code: en, direction: ltr}
