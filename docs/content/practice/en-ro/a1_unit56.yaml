schema_version: '1.0'
pack_key: practice.en-ro.a1.unit56
source_language: en
target_language: ro
unit_content_key: ro.a1.unit56.concert
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u56 / w_<token>). 8 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_locul, w_ore, w_parcul, w_publicul, w_scena, w_trupa, w_trupei, w_trupă]
templates:
- content_key: practice.en-ro.ro.a1.unit56.lesson01.choose.001
  lesson_content_key: ro.a1.unit56.lesson01.vreau_sa_merg_la
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_trupa, w_trupei, w_locul, w_ore, w_trupă, w_scena, w_publicul, w_parcul]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i want to go to the concert.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit56.lesson02.listen.001
  lesson_content_key: ro.a1.unit56.lesson02.vreau_sa_cumpar_un
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i want to buy a ticket.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit56.lesson03.translate.001
  lesson_content_key: ro.a1.unit56.lesson03.la_ce_ora_incepe
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what time does the concert start?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit56.lesson04.match.001
  lesson_content_key: ro.a1.unit56.lesson04.la_casa_de_bilete
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit56.lesson05.choose.001
  lesson_content_key: ro.a1.unit56.lesson05.citirea_programului
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading the program.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit56.lesson06.translate.001
  lesson_content_key: ro.a1.unit56.lesson06.mihai_nina_si_ana
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on mihai, nina, and ana at the concert.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit56.lesson01.order.002
  lesson_content_key: ro.a1.unit56.lesson01.vreau_sa_merg_la
  type: word_order
  frame: {text: 'Aș vrea să merg la concertul {item}, vă rog.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_trupei}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Aș vrea să merg la concertul {item}, vă rog.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'I''d like to go to the band''s concert, please. trupei means of the band (as in "the band''s concert").', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit56.lesson03.order.002
  lesson_content_key: ro.a1.unit56.lesson03.la_ce_ora_incepe
  type: word_order
  frame: {text: 'Concertul durează două {item}.', language_code: ro, direction: ltr}
  slots:
    item:
