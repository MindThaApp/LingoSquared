schema_version: '1.0'
pack_key: practice.en-ro.a1.unit28
source_language: en
target_language: ro
unit_content_key: ro.a1.unit28.comunicare
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u28 / w_<token>). 26 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_atât, w_aud, w_bucur, w_crede, w_credeam, w_merge, w_mers, w_mesaj, w_mesajul, w_minute, w_mult, w_mândră, w_poți, w_repede, w_repeți, w_spun, w_sun, w_suna, w_suni, w_trebuie, w_trimit, w_vorbesc, w_vorbi, w_vorbiți, w_înapoi, w_înseamnă]
templates:
- content_key: practice.en-ro.ro.a1.unit28.lesson01.choose.001
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_suna, w_trebuie, w_sun, w_vorbesc, w_vorbiți, w_poți, w_repeți, w_vorbi, w_atât, w_repede, w_aud, w_mesajul, w_trimit, w_mesaj, w_înapoi, w_spun, w_minute, w_suni, w_mers, w_credeam, w_merge, w_crede, w_bucur, w_mândră, w_înseamnă, w_mult]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i''ll call you.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson02.listen.001
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on who am i speaking with?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson03.translate.001
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on can you repeat that?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson04.match.001
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson05.choose.001
  lesson_content_key: ro.a1.unit28.lesson05.citim_o_conversatie_prin
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a text exchange.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson06.translate.001
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a phone call after the shift.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson01.order.002
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: word_order
  frame: {text: 'Trebuie să te {item}.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_sun}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Trebuie să te {item}.', language_code: ro, direction: ltr}
  feedback_frame: {text: I have to call you. sun means I call., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson02.order.002
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: word_order
  frame: {text: 'Cu cine {item}?', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_vorbesc}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Cu cine {item}?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Who am I speaking with? Cu cine vorbesc? (literally "with whom am I speaking?") is the standard way to ask who an unfamiliar caller is.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson03.order.002
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: word_order
  frame: {text: 'Poți să {item} asta?', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_repeți}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Poți să {item} asta?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Can you repeat that? Poți să ... (Can you ...?) plus repeți (you repeat) plus asta (that).', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson03.fill.003
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: fill_in_blank
  frame:
    text: Nu {item} atât de repede, te rog. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_vorbi}
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_vorbi}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Don''t speak so fast, please. Nu vorbi ("don''t speak") is nu + the tu form; atât de repede means "so fast".', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson03.translate.004
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame: {text: I can't hear you well., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_aud}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Nu te {item} bine.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'I can''t hear you well. Nu te aud bine: aud is "I hear", te ("you") goes before the verb, and bine means "well".', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson04.order.002
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: word_order
  frame: {text: 'Îți {item} un mesaj.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_trimit}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Îți {item} un mesaj.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'I''ll send you a text. Îți ("to you") is a dative pronoun placed before the verb: Îți trimit un mesaj.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson04.fill.003
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: fill_in_blank
  frame:
    text: Te sun {item} mai târziu. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags: {semantic: w_înapoi}
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags: {semantic: w_înapoi}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I''ll call you back later. Înapoi ("back") follows the verb: te sun înapoi is "I''ll call you back", and mai târziu means "later".', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson06.order.002
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: word_order
  frame: {text: 'A {item} foarte bine, mai bine decât credeam.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_mers}
  answer_derivation:
    kind: render_frame
    frame: {text: 'A {item} foarte bine, mai bine decât credeam.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'It went really well, better than I thought. A mers is the past of a merge (to go, here "to turn out"); credeam means "I thought" (a past form of a crede).', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit28.lesson06.fill.003
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: fill_in_blank
  frame:
    text: Îți mulțumesc, {item} mult pentru mine. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_înseamnă}
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_înseamnă}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Thank you, that means a lot to me. Înseamnă is the he/she/it form of a însemna (to mean); pentru mine ("for me") says who it matters to.', language_code: en, direction: ltr}
