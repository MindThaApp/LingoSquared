  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_restaurantul, w_restaurant, w_mânca, w_meniul, w_comanda, w_comand, w_mâncați, w_gustos, w_primesc, w_ați, w_ales, w_supa, w_imediat, w_băuturile, w_meniu, w_supă, w_sandviș, w_cașcaval]
