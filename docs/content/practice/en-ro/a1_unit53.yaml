    semantic: [w_ales, w_ați, w_băuturile, w_cașcaval, w_comand, w_comanda, w_gustos, w_imediat, w_meniu, w_meniul, w_mânca, w_mâncați, w_primesc, w_restaurant, w_restaurantul, w_sandviș, w_supa, w_supă]
