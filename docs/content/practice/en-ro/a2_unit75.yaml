schema_version: '1.0'
pack_key: practice.en-ro.a2.unit75
source_language: en
target_language: ro
unit_content_key: ro.a2.unit75.vakantieplannen
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a2_u75 / w_<token>). 44 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_acesta, w_anul, w_aproape, w_atunci, w_august, w_cameră, w_camping, w_campingul, w_casă, w_cinema, w_cursul, w_călătoresc, w_deja, w_distractiv, w_dormim, w_economisesc, w_economisi, w_gând, w_hotel, w_hotelul, w_iulie, w_lună, w_mergi, w_mut, w_muta, w_mute, w_plajă, w_planuri, w_plouă, w_rezerv, w_rezerva, w_rămâi, w_rămân, w_rămânem, w_sigur, w_sora, w_săptămâni, w_urma, w_urmez, w_vacanța, w_vacanță, w_vară, w_viitor, w_încotro]
templates:
- content_key: practice.en-ro.ro.a2.unit75.lesson01.choose.001
  lesson_content_key: ro.a2.unit75.lesson01.ce_o_sa_faci
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_vacanța, w_vară, w_august, w_vacanță, w_iulie, w_anul, w_viitor, w_rezerva, w_călătoresc, w_rezerv, w_cameră, w_rămân, w_hotelul, w_campingul, w_aproape, w_plajă, w_dormim, w_camping, w_hotel, w_urma, w_muta, w_economisi, w_urmez, w_mute, w_economisesc, w_lună, w_casă, w_cursul, w_gând, w_mut, w_sigur, w_plouă, w_distractiv, w_acesta, w_cinema, w_mergi, w_rămâi, w_încotro, w_sora, w_săptămâni, w_rămânem, w_atunci, w_deja, w_planuri]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what are you going to do?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit75.lesson02.listen.001
  lesson_content_key: ro.a2.unit75.lesson02.am_de_gand
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i plan to.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit75.lesson03.translate.001
  lesson_content_key: ro.a2.unit75.lesson03.sigur_sau_poate
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on certain or maybe.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit75.lesson04.match.001
  lesson_content_key: ro.a2.unit75.lesson04.intrebari_despre_planuri
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a2.unit75.lesson05.choose.001
  lesson_content_key: ro.a2.unit75.lesson05.maria_in_vacanta
