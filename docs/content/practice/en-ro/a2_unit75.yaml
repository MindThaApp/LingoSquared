  type: word_order
  frame: {text: 'Ce o să faci în {item} de vară?', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_vacanța}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ce o să faci în {item} de vară?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'What are you going to do in the summer holiday? O să + a conjugated verb talks about the near future: Ce o să faci? Here faci is the tu form of a face.', language_code: en, direction: ltr}
