schema_version: "1.0"
pack_key: practice.en-ro.a1.unit07
source_language: en
target_language: ro
unit_content_key: ro.a1.unit07.shopping
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ro job B) from scripts/backfill_lexemes_en_ro.py
    lexemes (ro_a1_u07* tags). Recognition, matching and bare-word production use curated
    w_ pools of this unit's own tokens (no two members share a gloss); sentence frames use
    single w_ anchors. English prompts name tu versus dumneavoastră register where it matters.
    Feedback lines carry a usage or grammar point. Reviewer: confirm the leu / lei plural, the de rule after twenty (treizeci de lei), and the pot + să + verb frame.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_costă, w_leu, w_lei, w_scump, w_ieftin, w_piață, w_roșii, w_cartofi, w_kilogram, w_vreau, w_unde, w_pot, w_cumpăr]
slot_presets:
  l1_pool: &l1_pool {language_code: ro, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_costă, w_leu, w_lei, w_scump, w_ieftin]}}
  l1_words: &l1_words {language_code: ro, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_costă, w_lei, w_scump, w_ieftin]}}
  s_match: &s_match {language_code: ro, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_costă, w_scump, w_ieftin, w_piață, w_roșii, w_cartofi, w_kilogram]}}
  t_costa: &t_costa {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_costă}}
  t_lei: &t_lei {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_lei}}
  l2_pool: &l2_pool {language_code: ro, part_of_speech: [adverb, noun, verb], agreement_tags: {semantic: [w_piață, w_roșii, w_cartofi, w_kilogram, w_vreau, w_unde, w_pot, w_cumpăr]}}
  l2_words: &l2_words {language_code: ro, part_of_speech: [adverb, noun, verb], agreement_tags: {semantic: [w_piață, w_roșii, w_cartofi, w_kilogram, w_vreau, w_unde, w_cumpăr]}}
  t_kilogram: &t_kilogram {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_kilogram}}
  t_cumpar: &t_cumpar {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_cumpăr}}
  t_cartofi: &t_cartofi {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_cartofi}}
  t_rosii: &t_rosii {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_roșii}}
templates:
  - content_key: practice.en-ro.ro.a1.unit07.lesson01.choose.001
    lesson_content_key: ro.a1.unit07.lesson01.cat_costa
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l1_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Leu is one currency unit and lei is the plural; costă asks or states the price.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson01.listen.002
    lesson_content_key: ro.a1.unit07.lesson01.cat_costa
    type: listen_select
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l1_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Scump means expensive and ieftin means cheap; both describe the price.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson02.match.001
    lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ro, direction: ltr}
    slots: {first: *s_match, second: *s_match, third: *s_match, fourth: *s_match, fifth: *s_match, sixth: *s_match}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Costă is the price verb, and kilogram, piață and the foods are what you shop for.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson01.translate.003
    lesson_content_key: ro.a1.unit07.lesson01.cat_costa
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l1_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Costă is the form for it costs: Cât costă? asks the price and Costă opt lei answers it.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson01.order.004
    lesson_content_key: ro.a1.unit07.lesson01.cat_costa
    type: word_order
    frame: {text: "Costă cinci {item}.", language_code: ro, direction: ltr}
    slots: {item: *t_lei}
    answer_derivation: {kind: render_frame, frame: {text: "Costă cinci {item}.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "After two to nineteen the plural lei has no de: opt lei. From twenty up it appears: treizeci de lei.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson01.fill.005
    lesson_content_key: ro.a1.unit07.lesson01.cat_costa
    type: fill_in_blank
    frame: {text: "Cât {item}? ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_costa, hint: *t_costa}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Cât costă? is the basic price question; costă is the it form of the verb.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson01.translate.006
    lesson_content_key: ro.a1.unit07.lesson01.cat_costa
    type: translation
    frame: {text: "It costs eight lei.", language_code: en, direction: ltr}
    slots: {item: *t_lei}
    answer_derivation: {kind: render_frame, frame: {text: "Costă cinci {item}.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Lei is the plural of leu and goes with numbers: opt lei.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson02.choose.002
    lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l2_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Vreau means I want; unde means where, and pot means I can in Unde pot...?", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson02.listen.003
    lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
    type: listen_select
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l2_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Cumpăr is I buy; with pot you add să: pot să cumpăr, I can buy.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson02.translate.004
    lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l2_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Vreau is blunt, like I want; aș dori is the softer way to ask for something.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson02.order.005
    lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
    type: word_order
    frame: {text: "Cât costă un {item} de roșii?", language_code: ro, direction: ltr}
    slots: {item: *t_kilogram}
    answer_derivation: {kind: render_frame, frame: {text: "Cât costă un {item} de roșii?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Between a measure and what it measures Romanian puts de: un kilogram de roșii.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson02.order.006
    lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
    type: word_order
    frame: {text: "Unde pot să {item} roșii?", language_code: ro, direction: ltr}
    slots: {item: *t_cumpar}
    answer_derivation: {kind: render_frame, frame: {text: "Unde pot să {item} roșii?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "After pot Romanian adds să and a second verb: pot să cumpăr, I can buy.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson02.fill.007
    lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
    type: fill_in_blank
    frame: {text: "Vreau un kilogram de {item}. ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_cartofi, hint: *t_cartofi}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Cartofi is plural; after un kilogram de the thing measured stays plural.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson02.translate.008
    lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
    type: translation
    frame: {text: "Where can I buy tomatoes?", language_code: en, direction: ltr}
    slots: {item: *t_rosii}
    answer_derivation: {kind: render_frame, frame: {text: "Unde pot să cumpăr {item}?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Roșii is plural, so no un or o goes before it; pot să cumpăr means I can buy.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson02.translate.009
    lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
    type: translation
    frame: {text: "I want a kilogram of potatoes.", language_code: en, direction: ltr}
    slots: {item: *t_cartofi}
    answer_derivation: {kind: render_frame, frame: {text: "Vreau un kilogram de {item}.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Un kilogram de plus the plural cartofi names the amount and the thing.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit07.lesson02.translate.010
    lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
    type: translation
    frame: {text: "How much does a kilogram of tomatoes cost?", language_code: en, direction: ltr}
    slots: {item: *t_rosii}
    answer_derivation: {kind: render_frame, frame: {text: "Cât costă un kilogram de {item}?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Cât costă asks the price; the singular costă fits one kilogram.", language_code: en, direction: ltr}
