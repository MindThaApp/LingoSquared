schema_version: '1.0'
pack_key: practice.en-ro.b2.unit08
source_language: en
target_language: ro
unit_content_key: ro.b2.unit08.sinteza
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_b2_u8 / w_<token>). 40 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_accesibil, w_afirmă, w_ambele, w_bine, w_citit, w_consideră, w_contrazic, w_contraziceți, w_deosebire, w_diferența, w_diferă, w_dimpotrivă, w_dovedit, w_excelentă, w_fel, w_ieftin, w_lent, w_mare, w_negativ, w_pozitiv, w_preț, w_prețul, w_prețului, w_privința, w_părere, w_părerea, w_părerile, w_recenzia, w_recenzie, w_recenzii, w_recomand, w_reiese, w_restaurant, w_restaurantul, w_scump, w_serviciu, w_serviciul, w_suntem, w_sursa, w_sursă]
templates:
- content_key: practice.en-ro.ro.b2.unit08.lesson01.choose.001
  lesson_content_key: ro.b2.unit08.lesson01.cine_spune_ce
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_recenzia, w_recenzie, w_sursa, w_sursă, w_afirmă, w_consideră, w_reiese, w_prețul, w_preț, w_excelentă, w_mare, w_recenzii, w_restaurantul, w_ambele, w_pozitiv, w_negativ, w_serviciul, w_serviciu, w_dimpotrivă, w_deosebire, w_părerea, w_părere, w_fel, w_diferă, w_părerile, w_diferența, w_contrazic, w_privința, w_ieftin, w_scump, w_prețului, w_accesibil, w_recomand, w_restaurant, w_lent, w_dovedit, w_bine, w_citit, w_suntem, w_contraziceți]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on who says what?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit08.lesson02.listen.001
  lesson_content_key: ro.b2.unit08.lesson02.doua_surse
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on two sources, side by side.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit08.lesson03.translate.001
  lesson_content_key: ro.b2.unit08.lesson03.unde_sunt_de_acord
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on where do they agree?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit08.lesson04.match.001
  lesson_content_key: ro.b2.unit08.lesson04.unde_se_contrazic
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.b2.unit08.lesson05.choose.001
  lesson_content_key: ro.b2.unit08.lesson05.doua_recenzii
  type: multiple_choice
