  lesson_content_key: ro.a1.unit59.lesson01.hai_sa_mergem_la
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_plăcută, w_marea, w_nisipul, w_valul, w_umbrela, w_stau, w_umbrele, w_nisip, w_caldă, w_grădina, w_zoologică]
