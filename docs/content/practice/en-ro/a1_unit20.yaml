schema_version: "1.0"
pack_key: practice.en-ro.a1.unit20
source_language: en
target_language: ro
unit_content_key: ro.a1.unit20.clothing
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ro job C) from scripts/backfill_lexemes_en_ro.py
    lexemes (ro_a1_u20* tags). Recognition, matching and bare-word production use curated
    w_ pools of this unit's own tokens (no two members share a gloss); sentence frames use
    single w_ anchors. English prompts name tu versus dumneavoastră register and speaker gender where it matters.
    Feedback lines carry a usage or grammar point. Reviewer: confirm Vreau un tricou roșu / albastru (tricou is neuter), Ce culoare?, Ce mărime?, Vreau pantaloni and Cât costă pantalonii?.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_tricou, w_culoare, w_roșu, w_albastru, w_pantaloni, w_mărime, w_pantalonii]
slot_presets:
  l1_pool: &l1_pool {language_code: ro, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_tricou, w_culoare, w_roșu, w_albastru]}}
  l2_pool: &l2_pool {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: [w_pantaloni, w_mărime, w_pantalonii, w_tricou]}}
  m6: &m6 {language_code: ro, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_tricou, w_culoare, w_roșu, w_albastru, w_pantaloni, w_mărime]}}
  t_tricou: &t_tricou {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_tricou}}
  t_culoare: &t_culoare {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_culoare}}
  t_rosu: &t_rosu {language_code: ro, part_of_speech: adjective, agreement_tags: {semantic: w_roșu}}
  t_albastru: &t_albastru {language_code: ro, part_of_speech: adjective, agreement_tags: {semantic: w_albastru}}
  t_pantaloni: &t_pantaloni {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_pantaloni}}
  t_marime: &t_marime {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_mărime}}
  t_pantalonii: &t_pantalonii {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_pantalonii}}
templates:
  - content_key: practice.en-ro.ro.a1.unit20.lesson01.choose.001
    lesson_content_key: ro.a1.unit20.lesson01.un_tricou_rosu
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l1_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Roșu and albastru are colors; culoare is the word color.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson01.listen.002
    lesson_content_key: ro.a1.unit20.lesson01.un_tricou_rosu
    type: listen_select
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l1_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Tricou takes un: un tricou.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson01.order.003
    lesson_content_key: ro.a1.unit20.lesson01.un_tricou_rosu
    type: word_order
    frame: {text: "Vreau un {item} roșu.", language_code: ro, direction: ltr}
    slots: {item: *t_tricou}
    answer_derivation: {kind: render_frame, frame: {text: "Vreau un {item} roșu.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Un tricou roșu: the color word follows the noun.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson01.order.004
    lesson_content_key: ro.a1.unit20.lesson01.un_tricou_rosu
    type: word_order
    frame: {text: "Vreau un tricou {item}.", language_code: ro, direction: ltr}
    slots: {item: *t_albastru}
    answer_derivation: {kind: render_frame, frame: {text: "Vreau un tricou {item}.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Albastru follows the noun it describes.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson01.fill.005
    lesson_content_key: ro.a1.unit20.lesson01.un_tricou_rosu
    type: fill_in_blank
    frame: {text: "Vreau un tricou {item}. ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_rosu, hint: *t_rosu}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Roșu is the masculine and neuter form, which suits tricou.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson01.fill.006
    lesson_content_key: ro.a1.unit20.lesson01.un_tricou_rosu
    type: fill_in_blank
    frame: {text: "Ce {item}? ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_culoare, hint: *t_culoare}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ce culoare? asks which color.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson01.translate.007
    lesson_content_key: ro.a1.unit20.lesson01.un_tricou_rosu
    type: translation
    frame: {text: "I want a t-shirt.", language_code: en, direction: ltr}
    slots: {item: *t_tricou}
    answer_derivation: {kind: render_frame, frame: {text: "Vreau un {item}.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Vreau means I want and needs no separate word for I.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson01.translate.008
    lesson_content_key: ro.a1.unit20.lesson01.un_tricou_rosu
    type: translation
    frame: {text: "I want a red t-shirt.", language_code: en, direction: ltr}
    slots: {item: *t_rosu}
    answer_derivation: {kind: render_frame, frame: {text: "Vreau un tricou {item}.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "The color follows the noun in Romanian.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson01.translate.009
    lesson_content_key: ro.a1.unit20.lesson01.un_tricou_rosu
    type: translation
    frame: {text: "What color?", language_code: en, direction: ltr}
    slots: {item: *t_culoare}
    answer_derivation: {kind: render_frame, frame: {text: "Ce {item}?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Culoare is feminine; ce is the word for which here.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson02.choose.001
    lesson_content_key: ro.a1.unit20.lesson02.ce_marime
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l2_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pantalonii is pantaloni plus the article; pantaloni is always plural.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson02.listen.002
    lesson_content_key: ro.a1.unit20.lesson02.ce_marime
    type: listen_select
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *l2_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mărime means size, as in Ce mărime?", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson02.match.003
    lesson_content_key: ro.a1.unit20.lesson02.ce_marime
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ro, direction: ltr}
    slots: {first: *m6, second: *m6, third: *m6, fourth: *m6, fifth: *m6, sixth: *m6}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Tricou, culoare, pantaloni and mărime are nouns; roșu and albastru are colors.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson02.order.004
    lesson_content_key: ro.a1.unit20.lesson02.ce_marime
    type: word_order
    frame: {text: "Vreau {item}.", language_code: ro, direction: ltr}
    slots: {item: *t_pantaloni}
    answer_derivation: {kind: render_frame, frame: {text: "Vreau {item}.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Pantaloni is plural, so there is no un before it.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson02.order.005
    lesson_content_key: ro.a1.unit20.lesson02.ce_marime
    type: word_order
    frame: {text: "Ce {item}?", language_code: ro, direction: ltr}
    slots: {item: *t_marime}
    answer_derivation: {kind: render_frame, frame: {text: "Ce {item}?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Ce mărime? asks which size.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson02.order.006
    lesson_content_key: ro.a1.unit20.lesson02.ce_marime
    type: word_order
    frame: {text: "Cât costă {item}?", language_code: ro, direction: ltr}
    slots: {item: *t_pantalonii}
    answer_derivation: {kind: render_frame, frame: {text: "Cât costă {item}?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Pantalonii is the definite plural, the pants.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson02.fill.007
    lesson_content_key: ro.a1.unit20.lesson02.ce_marime
    type: fill_in_blank
    frame: {text: "Cât costă {item}? ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_pantalonii, hint: *t_pantalonii}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pantalonii is pantaloni plus the article -i.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson02.translate.008
    lesson_content_key: ro.a1.unit20.lesson02.ce_marime
    type: translation
    frame: {text: "I want pants.", language_code: en, direction: ltr}
    slots: {item: *t_pantaloni}
    answer_derivation: {kind: render_frame, frame: {text: "Vreau {item}.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Pantaloni is plural, so it takes no un.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson02.translate.009
    lesson_content_key: ro.a1.unit20.lesson02.ce_marime
    type: translation
    frame: {text: "What size?", language_code: en, direction: ltr}
    slots: {item: *t_marime}
    answer_derivation: {kind: render_frame, frame: {text: "Ce {item}?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Mărime is the word for size.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a1.unit20.lesson02.translate.010
    lesson_content_key: ro.a1.unit20.lesson02.ce_marime
    type: translation
    frame: {text: "How much do the pants cost?", language_code: en, direction: ltr}
    slots: {item: *t_pantalonii}
    answer_derivation: {kind: render_frame, frame: {text: "Cât costă {item}?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Cât costă asks for the price; Romanian keeps costă here.", language_code: en, direction: ltr}
