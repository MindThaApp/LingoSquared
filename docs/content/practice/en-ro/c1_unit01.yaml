schema_version: '1.0'
pack_key: practice.en-ro.c1.unit01
source_language: en
target_language: ro
unit_content_key: ro.c1.unit01.structura_discursului
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_c1_u1 / w_<token>). 42 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ajuta, w_altă, w_anul, w_arătat, w_clare, w_concluzie, w_constant, w_cât, w_date, w_detaliile, w_elevii, w_elevilor, w_experiența, w_ideea, w_introdusă, w_lucreze, w_mai, w_oferi, w_paranteză, w_parte, w_pierd, w_prezenta, w_principală, w_profesorilor, w_programul, w_propunerea, w_propunerii, w_real, w_repede, w_revenind, w_rigoarea, w_ritmul, w_scurtă, w_soluția, w_structura, w_trebuie, w_trecut, w_treptat, w_unește, w_voi, w_început, w_școlii]
templates:
- content_key: practice.en-ro.ro.c1.unit01.lesson01.choose.001
  lesson_content_key: ro.c1.unit01.structura_discursului.lesson01.ordonare
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_început, w_voi, w_prezenta, w_structura, w_propunerii, w_parte, w_altă, w_programul, w_ajuta, w_elevii, w_lucreze, w_constant, w_oferi, w_profesorilor, w_date, w_mai, w_clare, w_scurtă, w_paranteză, w_experiența, w_anul, w_trecut, w_arătat, w_cât, w_repede, w_pierd, w_detaliile, w_revenind, w_ideea, w_principală, w_soluția, w_trebuie, w_introdusă, w_treptat, w_concluzie, w_propunerea, w_unește, w_rigoarea, w_școlii, w_ritmul, w_real, w_elevilor]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on marking the plan.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.c1.unit01.lesson02.listen.001
  lesson_content_key: ro.c1.unit01.structura_discursului.lesson02.dezvoltare
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on developing ideas.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.c1.unit01.lesson03.translate.001
  lesson_content_key: ro.c1.unit01.structura_discursului.lesson03.paranteza
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on aside and return.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.c1.unit01.lesson04.match.001
  lesson_content_key: ro.c1.unit01.structura_discursului.lesson04.sinteza
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.c1.unit01.lesson01.choose.002
  lesson_content_key: ro.c1.unit01.structura_discursului.lesson01.ordonare
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on marking the plan.', language_code: en, direction: ltr}
