  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on developing ideas.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.c1.unit01.lesson01.order.003
  lesson_content_key: ro.c1.unit01.structura_discursului.lesson01.ordonare
  type: word_order
  frame: {text: 'Pentru {item}, voi prezenta structura propunerii.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags: {semantic: w_început}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Pentru {item}, voi prezenta structura propunerii.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'To begin with, I will present the structure of the proposal. Pentru început announces the first move.', language_code: en, direction: ltr}
