  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_multe, w_leul, w_elefantul, w_maimuța, w_girafa, w_zoo, w_hrănirea, w_leilor, w_bilete, w_țarcul, w_barca]
