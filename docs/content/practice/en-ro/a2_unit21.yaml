  s_confirmarea: &s_confirmarea {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_confirmarea}}
templates:
  - content_key: practice.en-ro.ro.a2.unit21.lesson01.choose.001
    lesson_content_key: ro.a2.unit21.lesson01.o_programare
    type: multiple_choice
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Primărie is the city hall; the ending -ia of primăria adds the article the.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a2.unit21.lesson01.listen.002
    lesson_content_key: ro.a2.unit21.lesson01.o_programare
    type: listen_select
    frame: {text: "{item}", language_code: ro, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Primărie is the city hall; the ending -ia of primăria adds the article the.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a2.unit21.lesson01.match.003
    lesson_content_key: ro.a2.unit21.lesson01.o_programare
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ro, direction: ltr}
    slots: {first: *pool2, second: *pool2, third: *pool2, fourth: *pool2, fifth: *pool2, sixth: *pool2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The article is attached to the end of the noun: primărie becomes primăria and programare becomes programarea.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a2.unit21.lesson01.order.004
    lesson_content_key: ro.a2.unit21.lesson01.o_programare
    type: word_order
    frame: {text: "Aș dori să mă {item} la noua adresă.", language_code: ro, direction: ltr}
    slots: {item: *s_inscriu}
    answer_derivation: {kind: render_frame, frame: {text: "Aș dori să mă {item} la noua adresă.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Aș dori să is followed by a verb in the I form: să mă înscriu.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a2.unit21.lesson01.order.005
    lesson_content_key: ro.a2.unit21.lesson01.o_programare
    type: word_order
    frame: {text: "Când aveți o {item} liberă?", language_code: ro, direction: ltr}
    slots: {item: *s_programare}
    answer_derivation: {kind: render_frame, frame: {text: "Când aveți o {item} liberă?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Programare is feminine, so liberă has the feminine ending.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a2.unit21.lesson01.fill.006
    lesson_content_key: ro.a2.unit21.lesson01.o_programare
    type: fill_in_blank
    frame: {text: "Merg la {item}. ({hint})", language_code: ro, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *s_primarie, hint: *s_primarie}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "La is followed by the noun without an article when talking about going to an institution.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a2.unit21.lesson01.translate.007
    lesson_content_key: ro.a2.unit21.lesson01.o_programare
    type: translation
    frame: {text: "I would like to register at the new address.", language_code: en, direction: ltr}
    slots: {item: *s_noua}
    answer_derivation: {kind: render_frame, frame: {text: "Aș dori să mă înscriu la {item} adresă.", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Noua is the feminine form of the new and comes before the noun.", language_code: en, direction: ltr}
  - content_key: practice.en-ro.ro.a2.unit21.lesson01.translate.008
    lesson_content_key: ro.a2.unit21.lesson01.o_programare
    type: translation
    frame: {text: "Do you have a free appointment? (formal)", language_code: en, direction: ltr}
    slots: {item: *s_programare}
    answer_derivation: {kind: render_frame, frame: {text: "Aveți o {item} liberă?", language_code: ro, direction: ltr}}
    feedback_frame: {text: "Aveți is the polite you-form of a avea.", language_code: en, direction: ltr}
