  pool2: &pool2 {language_code: ro, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [w_primărie, w_primăria, w_programare, w_programarea, w_adresă, w_înscriu, w_liberă, w_noua]}}
  s_inscriu: &s_inscriu {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_înscriu}}
  s_programare: &s_programare {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_programare}}
  s_primarie: &s_primarie {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_primărie}}
  s_noua: &s_noua {language_code: ro, part_of_speech: adjective, agreement_tags: {semantic: w_noua}}
  pool3: &pool3 {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: [w_act, w_acte, w_buletin, w_buletinul, w_proprietate, w_formularul, w_formular]}}
  pool4: &pool4 {language_code: ro, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_act, w_acte, w_buletin, w_proprietate, w_formular, w_formularul, w_completați, w_trebuie]}}
  s_buletinul: &s_buletinul {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_buletinul}}
  s_formular: &s_formular {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_formular}}
  s_acte: &s_acte {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_acte}}
  s_proprietate: &s_proprietate {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_proprietate}}
  s_completati: &s_completati {language_code: ro, part_of_speech: verb, agreement_tags: {semantic: w_completați}}
  pool5: &pool5 {language_code: ro, part_of_speech: [noun, adjective], agreement_tags: {semantic: [w_înscrierea, w_contract, w_contractul, w_închiriere, w_orele, w_programările, w_completat]}}
  pool6: &pool6 {language_code: ro, part_of_speech: [noun, adjective, preposition], agreement_tags: {semantic: [w_înscrierea, w_contract, w_contractul, w_închiriere, w_orele, w_programările, w_completat, w_până]}}
  s_inchiriere: &s_inchiriere {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_închiriere}}
  s_orele: &s_orele {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_orele}}
  s_inscrierea: &s_inscrierea {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_înscrierea}}
  s_contract: &s_contract {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_contract}}
  s_programarile: &s_programarile {language_code: ro, part_of_speech: noun, agreement_tags: {semantic: w_programările}}
  pool7: &pool7 {language_code: ro, part_of_speech: [noun, pronoun, verb, adjective, adverb, phrase], agreement_tags: {semantic: [w_perfect, w_poftim, w_totul, w_ordine, w_puteți, w_veți, w_primi, w_confirmarea, w_mult]}}
