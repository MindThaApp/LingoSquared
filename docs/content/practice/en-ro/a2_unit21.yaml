schema_version: "1.0"
pack_key: practice.en-ro.a2.unit21
source_language: en
target_language: ro
unit_content_key: ro.a2.unit21.birocratie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-ro A2 wave) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_ro.py (a2 course, tags ro_a2_u*, w_<token> anchors). Recognition and
    bare-word production pools are curated w_ lists of this unit's own tokens with pairwise distinct glosses;
    sentence frames use single anchors so each frame is grammatical (case, gender, number). Fixed English
    prompts name the speaker's gender and the formal you where it matters. Feedback lines carry a usage or
    grammar point, never the task or the answer.
    Reviewer: confirm the article and gender notes in feedback, the polite conditional (aș dori, aș avea)
    and the formal address (dumneavoastră) used throughout, as in the realization.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_primărie, w_programare, w_adresă, w_înscriu, w_liberă, w_noua, w_primăria, w_programarea, w_act, w_acte, w_buletin, w_buletinul, w_proprietate, w_formularul, w_formular, w_completați, w_trebuie, w_înscrierea, w_contract, w_contractul, w_închiriere, w_orele, w_programările, w_completat, w_până, w_perfect, w_poftim, w_totul, w_ordine, w_puteți, w_veți, w_primi, w_confirmarea, w_mult]
slot_presets:
