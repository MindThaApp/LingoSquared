schema_version: '1.0'
pack_key: practice.en-ro.a1.unit27
source_language: en
target_language: ro
unit_content_key: ro.a1.unit27.emotii
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ro backfill lexemes (tags ro_a1_u27 / w_<token>). 24 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ajută, w_chiar, w_cred, w_descurci, w_emoționat, w_ești, w_face, w_fericit, w_fii, w_foarte, w_griji, w_mândru, w_nou, w_prima, w_puțin, w_rezolvă, w_serviciu, w_simte, w_simți, w_sincer, w_singur, w_supărat, w_trist, w_tură]
templates:
- content_key: practice.en-ro.ro.a1.unit27.lesson01.choose.001
  lesson_content_key: ro.a1.unit27.lesson01.fericit_trist_sau_suparat
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: &id001
      language_code: ro
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_fericit, w_trist, w_supărat, w_ești, w_nou, w_emoționat, w_prima, w_tură, w_face, w_griji, w_simte, w_puțin, w_singur, w_serviciu, w_cred, w_rezolvă, w_simți, w_sincer, w_descurci, w_chiar, w_ajută, w_fii, w_foarte, w_mândru]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on happy, sad, or angry?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson02.listen.001
  lesson_content_key: ro.a1.unit27.lesson02.de_ce_esti_fericit
  type: listen_select
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on why are you happy?.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson03.translate.001
  lesson_content_key: ro.a1.unit27.lesson03.emotionat_pentru_ceva
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on nervous about something.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson04.match.001
  lesson_content_key: ro.a1.unit27.lesson04.intrebari_despre_sentimente
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ro, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Romanian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson05.choose.001
  lesson_content_key: ro.a1.unit27.lesson05.citim_un_mesaj_despre
  type: multiple_choice
  frame: {text: '{item}', language_code: ro, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a message about feelings.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson06.translate.001
  lesson_content_key: ro.a1.unit27.lesson06.ana_il_linisteste_pe
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on ana reassures mihai.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson01.order.002
  lesson_content_key: ro.a1.unit27.lesson01.fericit_trist_sau_suparat
  type: word_order
  frame: {text: 'De ce ești {item}?', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_fericit}
  answer_derivation:
    kind: render_frame
    frame: {text: 'De ce ești {item}?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Why are you happy? De ce (why) is the standard question for a reason.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson01.fill.003
  lesson_content_key: ro.a1.unit27.lesson01.fericit_trist_sau_suparat
  type: fill_in_blank
  frame:
    text: Nu sunt supărat, sunt {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_trist}
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_trist}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I am not angry, I am sad. Nu before the verb makes it negative: Nu sunt supărat. The second clause then states the actual feeling.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson02.order.002
  lesson_content_key: ro.a1.unit27.lesson02.de_ce_esti_fericit
  type: word_order
  frame: {text: 'De ce {item} fericit?', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_ești}
  answer_derivation:
    kind: render_frame
    frame: {text: 'De ce {item} fericit?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Why are you happy? De ce (why) is the standard question for a reason.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson02.fill.003
  lesson_content_key: ro.a1.unit27.lesson02.de_ce_esti_fericit
  type: fill_in_blank
  frame:
    text: Sunt fericit pentru că am un apartament {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_nou}
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_nou}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I am happy because I have a new apartment. Pentru că (because) introduces the reason clause; the word order stays normal: am un apartament nou.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson03.order.002
  lesson_content_key: ro.a1.unit27.lesson03.emotionat_pentru_ceva
  type: word_order
  frame: {text: 'Sunt {item} pentru prima mea tură.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_emoționat}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Sunt {item} pentru prima mea tură.', language_code: ro, direction: ltr}
  feedback_frame: {text: I am nervous about my first shift. emoționat means nervous; excited (masc.)., language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson03.fill.003
  lesson_content_key: ro.a1.unit27.lesson03.emotionat_pentru_ceva
  type: fill_in_blank
  frame:
    text: Salut, Mihai, cum te simți înainte de {item} ta tură? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_prima}
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_prima}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Hi Mihai, how are you feeling about your first shift? Cum te simți uses the reflexive te ("yourself"); in prima ta tură the possessive ta agrees with feminine tură.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson03.translate.004
  lesson_content_key: ro.a1.unit27.lesson03.emotionat_pentru_ceva
  type: translation
  frame: {text: Don't worry., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_face}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Nu-ți {item} griji.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Don''t worry. Nu-ți face griji (literally "don''t make worries for yourself") is the standard fixed phrase of reassurance. To a stranger: Nu vă faceți griji.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson04.order.002
  lesson_content_key: ro.a1.unit27.lesson04.intrebari_despre_sentimente
  type: word_order
  frame: {text: 'Cum se {item} Mihai?', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_simte}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Cum se {item} Mihai?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'How does Mihai feel? A se simți (to feel) is reflexive: mă simt (I), te simți (you), se simte (he/she). It is the standard way to ask about or describe feelings.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson05.order.002
  lesson_content_key: ro.a1.unit27.lesson05.citim_un_mesaj_despre
  type: word_order
  frame: {text: 'Sunt {item} emoționat, sincer să fiu.', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags: {semantic: w_puțin}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Sunt {item} emoționat, sincer să fiu.', language_code: ro, direction: ltr}
  feedback_frame: {text: 'I''m a bit nervous, honestly. Sincer să fiu (to be honest) softens the admission.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson05.fill.003
  lesson_content_key: ro.a1.unit27.lesson05.citim_un_mesaj_despre
  type: fill_in_blank
  frame:
    text: Da, și eu {item} asta. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_cred}
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_cred}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Yes, I think so too. Și eu cred asta (literally "I think this too") is the natural way to agree with someone''s opinion.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson06.order.002
  lesson_content_key: ro.a1.unit27.lesson06.ana_il_linisteste_pe
  type: word_order
  frame: {text: 'Salut, Mihai, cum te {item} înainte de prima ta tură?', language_code: ro, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_simți}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Salut, Mihai, cum te {item} înainte de prima ta tură?', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Hi Mihai, how are you feeling about your first shift? Cum te simți uses the reflexive te ("yourself"); in prima ta tură the possessive ta agrees with feminine tură.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson06.fill.003
  lesson_content_key: ro.a1.unit27.lesson06.ana_il_linisteste_pe
  type: fill_in_blank
  frame:
    text: Sunt puțin emoționat, {item} să fiu. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_sincer}
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags: {semantic: w_sincer}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I''m a bit nervous, honestly. Sincer să fiu (to be honest) softens the admission.', language_code: en, direction: ltr}
- content_key: practice.en-ro.ro.a1.unit27.lesson06.translate.004
  lesson_content_key: ro.a1.unit27.lesson06.ana_il_linisteste_pe
  type: translation
  frame: {text: 'Don''t worry, you can do it well!', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags: {semantic: w_descurci}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Nu-ți face griji, o să te {item} bine!', language_code: ro, direction: ltr}
  feedback_frame: {text: 'Don''t worry, you can do it well! O să te descurci bine (literally "you will manage well") is an encouraging fixed expression; o să + verb makes the future.', language_code: en, direction: ltr}
