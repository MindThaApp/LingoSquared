  feedback_frame:
    text: क्या आप नकद देंगे या कार्ड से? Vous voulez ... ? पूछने का औपचारिक तरीका है, जिसे किसी अनजान कैशियर के लिए इस्तेमाल करते हैं; दोस्त tu veux ... ? कहेंगे।
