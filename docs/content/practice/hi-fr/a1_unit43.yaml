      language_code: fr
      direction: ltr
  feedback_frame:
    text: Lyon की ट्रेन किस प्लेटफ़ॉर्म से जाती है? quai का अर्थ प्लेटफ़ॉर्म है।
    language_code: hi
    direction: ltr
