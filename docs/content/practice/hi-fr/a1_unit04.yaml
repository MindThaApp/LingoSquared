    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Les {item} sont chers aujourd'hui.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Chers पुल्लिंग बहुवचन है क्योंकि légumes और fruits पुल्लिंग बहुवचन संज्ञाएँ हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit04.lesson01.fill.005
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
