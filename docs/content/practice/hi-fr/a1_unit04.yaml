templates:
- content_key: practice.hi-fr.fr.a1.unit04.lesson01.choose.001
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marché और prix पुल्लिंग हैं (le marché, le prix) जबकि boulangerie स्त्रीलिंग है (la boulangerie); हर संज्ञा को उसके आर्टिकल के साथ सीखिए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit04.lesson01.listen.002
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'बाज़ार के कई शब्द खाने की संज्ञाएँ हैं जो मात्रा के बाद de के साथ आती हैं: un kilo de tomates, un litre de lait।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit04.lesson01.match.003
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: matching_pairs
