    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit04.lesson02.choose.001
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बहुवचन में euro के साथ -s जुड़ता है (euros), पर s का उच्चारण नहीं होता, इसलिए आपको अंत की जगह संख्या सुनाई देती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit04.lesson02.choose.002
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chers, cher का बहुवचन है; les légumes जैसी बहुवचन संज्ञाओं के अनुसार विशेषण में -s जुड़ता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit04.lesson02.order.003
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: Je voudrais un kilo de {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je voudrais कुछ माँगने का विनम्र तरीका है; un kilo de + संज्ञा मात्रा बताता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit04.lesson02.order.004
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: C'est combien le {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien? किसी एक चीज़ का दाम पूछता है; le दिखाता है कि संज्ञा पुल्लिंग है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit04.lesson02.fill.005
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
