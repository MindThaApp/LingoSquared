    text: 'वज़न और माप के बाद खाने की चीज़ से पहले de आता है: un kilo de tomates, un litre de lait।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit04.lesson01.order.004
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: word_order
