templates:
- content_key: practice.hi-fr.fr.a1.unit03.lesson01.choose.001
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Frères et sœurs साथ मिलकर "भाई-बहन" का अर्थ देते हैं: फ़्रेंच में भाइयों और बहनों के लिए रोज़मर्रा का कोई एक शब्द नहीं है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson01.listen.002
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Frère और frères का उच्चारण एक जैसा है, वैसे ही sœur और sœurs का भी; इसलिए एकवचन या बहुवचन केवल आर्टिकल या संदर्भ से पता चलता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson01.match.003
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'लिंग पता हो तो फ़्रेंच के परिवार-शब्दों की जोड़ियाँ बनाना आसान है: mère और père, tante और oncle, cousine और cousin।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson01.translate.004
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Frère और sœur में बहुवचन का -s लगता है (frères, sœurs), इसलिए जहाँ हिंदी में बहुवचन हो, वहाँ फ़्रेंच में भी बहुवचन रखिए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson02.choose.001
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ma स्त्रीलिंग संज्ञाओं के साथ आता है (ma mère), mon पुल्लिंग संज्ञाओं के साथ (mon père), और mes सभी बहुवचन संज्ञाओं के साथ (mes parents)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson02.order.002
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: word_order
  frame:
    text: Ma {item} est petite.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma {item} est petite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ma स्त्रीलिंग एकवचन संज्ञा के साथ आता है; विशेषण petite में भी स्त्रीलिंग का -e लगता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson02.fill.003
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: fill_in_blank
  frame:
    text: '{item} famille est grande. ({hint})'
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Famille स्त्रीलिंग है, इसलिए इसके साथ ma आता है; पुल्लिंग संज्ञा के साथ mon आता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson02.translate.004
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: translation
  frame:
    text: मेरा परिवार छोटा है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma famille est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Petite स्त्रीलिंग है क्योंकि famille स्त्रीलिंग है; पुल्लिंग संज्ञा के साथ petit आता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson03.choose.001
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cousin पुल्लिंग है और cousine स्त्रीलिंग: -e लड़की रिश्तेदार को दर्शाता है और अंतिम n को सुनाई देने वाला बना देता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson03.order.002
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: word_order
  frame:
    text: Mon {item} habite à Paris.
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mon {item} habite à Paris.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Mon पुल्लिंग एकवचन संज्ञाओं से पहले आता है: mon père, mon oncle।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson04.choose.001
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: फ़्रेंच वर्तमान काल में habite/habites/habitent का उच्चारण एक जैसा सुनाई देता है, इसलिए सर्वनाम से पता चलता है कि बात किसकी हो रही है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson04.order.002
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: word_order
  frame:
    text: J’habite avec mes {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite avec mes {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mes बहुवचन "मेरे/मेरी" है, जो पुल्लिंग और स्त्रीलिंग, दोनों संज्ञाओं के साथ आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson04.fill.003
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: fill_in_blank
  frame:
    text: Tu habites {item} de tes parents ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Près de का अर्थ है "के पास": près de tes parents, près d’ici।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson04.translate.004
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'क्रिया का अंत कर्ता के अनुसार बदलता है: il/elle के लिए habite, ils/elles के लिए habitent, tu के लिए habites।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson04.translate.005
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: मैं अपने दादा-दादी के साथ रहता/रहती हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite avec mes {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mes बहुवचन "मेरे" है, इसलिए mes grands-parents का अर्थ है "मेरे दादा-दादी"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson05.fill.001
  lesson_content_key: fr.a1.unit03.lesson05.reading_a_family_profile
  type: fill_in_blank
  frame:
    text: Ma petite sœur {item} Camille. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'S’appelle, s’appeler का il/elle वाला रूप है: ma sœur s’appelle..., je m’appelle...'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson06.listen.001
  lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Chaque semaine का अर्थ है "हर हफ़्ते": chaque कभी नहीं बदलता और उसके बाद एकवचन संज्ञा आती है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit03.lesson06.match.002
  lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id018
    second: *id018
    third: *id018
    fourth: *id018
    fifth: *id018
    sixth: *id018
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mais विरोध दिखाने वाला शब्द है (लेकिन) और plus तुलना करता है, जैसे Ma famille est plus petite में।
    language_code: hi
    direction: ltr
