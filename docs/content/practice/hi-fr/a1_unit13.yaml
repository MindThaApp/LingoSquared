templates:
- content_key: practice.hi-fr.fr.a1.unit13.lesson01.choose.001
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Préférer, aimer और détester पसंद-नापसंद बताने की मुख्य क्रियाएँ हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson01.listen.002
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Épices बहुवचन है; अंत का -s बोला नहीं जाता, इसलिए épice भी वैसा ही सुनाई देगा।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson01.order.004
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: word_order
  frame:
    text: J'aime {item} les plats salés que les plats sucrés.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: J'aime {item} les plats salés que les plats sucrés.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Aimer mieux का मतलब है 'ज़्यादा पसंद करना'; que उसे जोड़ता है जो कम पसंद है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson01.fill.006
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: fill_in_blank
  frame:
    text: Mathieu {item} les épices trop fortes. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Déteste, détester का il वाला रूप है, जो Mathieu के साथ मेल खाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson01.translate.008
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: translation
  frame:
    text: मुझे चॉकलेट टार्ट ज़्यादा पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je préfère la {item} au chocolat.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Au यानी à + le; au chocolat टार्ट का स्वाद बताता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson01.translate.009
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tarte, chocolat, épices और plats पसंद वाले पाठ में आए खाने की चीज़ों और व्यंजनों के नाम हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson02.choose.001
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ou का मतलब 'या' है, जबकि où (उच्चारण-चिह्न के साथ) का मतलब 'कहाँ' है; फ़र्क़ इसी चिह्न से पड़ता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson02.listen.002
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pourrait, pouvoir का सशर्त रूप है, जिसका प्रयोग विनम्र सुझाव देने के लिए होता है: on pourrait।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson02.order.004
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: word_order
  frame:
    text: Tu aimes plutôt le sucré {item} le salé ?
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu aimes plutôt le sucré {item} le salé ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Ou दो विकल्पों को जोड़ता है: sucré ou salé यानी मीठा या नमकीन।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson02.fill.006
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: fill_in_blank
  frame:
    text: Ça ne me {item} pas. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ça ne me dérange pas का मतलब है 'मुझे इससे कोई परेशानी नहीं'।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson02.translate.007
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: translation
  frame:
    text: तुम्हें क्या ज़्यादा पसंद है? (अनौपचारिक, qu'est-ce que के साथ)
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce que tu {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu préfères, préférer का tu वाला रूप है; vous préférez विनम्र रूप होगा।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson03.choose.001
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sucrée और salée के अंत में -e इसलिए है क्योंकि tarte और quiche स्त्रीलिंग हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson03.listen.002
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sucrée और salée स्त्रीलिंग रूप हैं; इनके अंत का -e बोला नहीं जाता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson03.match.003
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Sucrée और salée स्त्रीलिंग संज्ञाओं tarte और quiche का वर्णन करते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson03.order.004
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: word_order
  frame:
    text: Parfait, une tarte sucrée et une quiche {item} pour samedi.
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, une tarte sucrée et une quiche {item} pour samedi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Salée स्त्रीलिंग है, क्योंकि वह quiche के साथ मेल खाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson03.fill.005
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: fill_in_blank
  frame:
    text: Je préfère la tarte, plutôt {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sucrée स्त्रीलिंग है, क्योंकि वह tarte के साथ मेल खाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson03.translate.006
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: translation
  frame:
    text: हम शनिवार को क्या बना रहे हैं? (on का प्रयोग करें)
    language_code: hi
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce qu'on {item} samedi ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: On prépare बोलचाल में 'हम बना रहे हैं' कहने का आम तरीक़ा है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit13.lesson03.translate.007
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: translation
  frame:
    text: मुझे टार्ट से ज़्यादा quiche पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Je préfère la {item} à la tarte.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Préférer A à B का मतलब है 'A को B से ज़्यादा पसंद करना'; à la दोनों को जोड़ता है।
    language_code: hi
    direction: ltr
