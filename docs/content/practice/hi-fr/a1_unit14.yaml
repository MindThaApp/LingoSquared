templates:
- content_key: practice.hi-fr.fr.a1.unit14.lesson01.choose.001
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Meilleur, bon का अनियमित तुलनात्मक रूप है: आप meilleur कहते हैं, plus bon कभी नहीं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson01.listen.002
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Difficile और facile का रूप पुल्लिंग और स्त्रीलिंग दोनों में एक ही रहता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson01.order.004
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: word_order
  frame:
    text: Moi, je trouve {item} aussi bon.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Moi, je trouve {item} aussi bon.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: L'autre का अर्थ है दूसरा वाला; aussi bon का अर्थ है उतना ही अच्छा।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson01.fill.006
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: fill_in_blank
  frame:
    text: Cette recette est moins {item} que l'autre. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Difficile स्त्रीलिंग में नहीं बदलता, इसलिए recette के साथ ठीक बैठता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson01.fill.007
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: fill_in_blank
  frame:
    text: Ce gâteau est {item} que le premier. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Meilleur que का अर्थ है “से बेहतर”; यह plus bon की जगह आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson01.translate.008
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: translation
  frame:
    text: यह पनीर दूसरे वाले पनीर से ज़्यादा महँगा है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce fromage est plus cher que {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Que तुलना का दूसरा पक्ष जोड़ता है; l'autre दूसरे पनीर के लिए आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson02.choose.001
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Irrégulier का अर्थ है कि रूप सामान्य नियम पर नहीं चलता, जैसे meilleur।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson02.listen.002
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Adjectif का अर्थ विशेषण है और irrégulier का अर्थ अनियमित।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson02.order.003
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: word_order
  frame:
    text: Comparons les prix avant {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Comparons les prix avant {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avant de के बाद क्रिया का मूल रूप आए, तो अर्थ होता है कुछ करने से पहले।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson02.fill.004
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: fill_in_blank
  frame:
    text: La quiche est moins {item} que la tarte. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Chère में स्त्रीलिंग का -e लगता है, क्योंकि वह quiche से मेल खाता है; पुल्लिंग संज्ञा के साथ यह cher होता है: le fromage est moins cher।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson02.translate.005
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: translation
  frame:
    text: यह सबसे सस्ती रेसिपी है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est la recette la moins {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: La moins chère में la moins के बाद स्त्रीलिंग विशेषण आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson03.choose.001
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Celui-ci का अर्थ है यह वाला और celui-là का अर्थ है वह वाला; दोनों पुल्लिंग हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson03.listen.002
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Celui-ci और celui-là में केवल -ci और -là का अंतर है, यानी यहाँ और वहाँ।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson03.order.004
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: word_order
  frame:
    text: Lequel on {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Lequel on {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Lequel on prend? बोलचाल का वाक्य है: lequel का अर्थ है “कौन-सा” और on का अर्थ है “हम”।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson03.fill.006
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: fill_in_blank
  frame:
    text: Il y a deux {item} de fromage. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sortes, deux के बाद बहुवचन में है और उसके बाद de आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson03.fill.007
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: fill_in_blank
  frame:
    text: Il nous {item} plus d'argent pour le dessert. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il nous reste का अर्थ है “हमारे पास बचा है”; यहाँ reste निर्वैयक्तिक रूप में है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson03.translate.008
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: translation
  frame:
    text: तो हम वही वाला लेते हैं; यह कार्यशाला के लिए सबसे अच्छा विकल्प है। (on का प्रयोग कीजिए)
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Alors on prend {item}, c'est la meilleure option pour l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Celui-là का अर्थ है वह वाला; meilleure स्त्रीलिंग है क्योंकि option स्त्रीलिंग है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit14.lesson03.translate.009
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: translation
  frame:
    text: यह सच है।
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est vrai सहमति जताने का एक आम तरीका है।
    language_code: hi
    direction: ltr
