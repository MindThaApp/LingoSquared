templates:
- content_key: practice.hi-fr.fr.a1.unit10.lesson01.choose.001
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Avant का अर्थ है "पहले/से पहले"; d'abord का अर्थ है "सबसे पहले", यानी क्रम की शुरुआत में।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson01.listen.002
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'S''habiller आत्मवाचक क्रिया है: je m''habille, tu t''habilles; je के साथ s'' बदलकर m'' हो जाता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson01.match.003
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: दिनचर्या की कई क्रियाएँ आत्मवाचक होती हैं (se réveiller, s'habiller); बाकी, जैसे prendre और quitter, आत्मवाचक नहीं होतीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson01.order.004
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: word_order
  frame:
    text: Je {item} la maison à neuf heures.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Je {item} la maison à neuf heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quitter la maison का अर्थ है घर से निकलना; je के साथ क्रिया quitte बनती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson01.fill.005
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: fill_in_blank
  frame:
    text: Je prends une {item} le matin. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Prendre une douche नहाने के लिए प्रचलित अभिव्यक्ति है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson01.translate.007
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: translation
  frame:
    text: मैं नाश्ते से पहले कपड़े पहनता/पहनती हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je m'habille avant le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m'habille में स्वर की ध्वनि से पहले आत्मवाचक m' आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson02.choose.001
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tard का अर्थ है "देर से"; puis का अर्थ है "फिर", जो दिनचर्या के चरणों को जोड़ने के काम आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson02.listen.002
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vingt-trois यानी 23; फ़्रेंच में समय 24 घंटे की घड़ी से भी बताया जा सकता है, इसलिए vingt-trois heures का मतलब रात के 11 बजे है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson02.match.003
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Rentrer, dîner और coucher क्रिया के मूल रूप हैं; je और nous के साथ उनके अंत बदल जाते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson02.fill.005
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: fill_in_blank
  frame:
    text: Je {item} à la maison après le travail. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rentre, je वाला रूप है; rentrer का अर्थ है घर लौटना।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson02.translate.007
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: हम शनिवार की शाम साथ में रात का खाना खाते हैं। (nous का प्रयोग करें)
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Nous {item} ensemble le samedi soir.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Nous dînons, dîner का nous रूप है; ensemble का अर्थ है साथ-साथ।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson02.translate.008
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: मैं रात को लगभग 11 बजे (23:00) सोने जाता हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Je me {item} vers vingt-trois heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Vers लगभग का समय बताता है; vingt-trois heures में 24 घंटे की घड़ी का प्रयोग है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson03.choose.001
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu fais quoi ? यह पूछने का अनौपचारिक तरीक़ा है कि कोई क्या कर रहा है; quoi क्रिया के बाद que की जगह लेता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson03.listen.002
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je me repose का अर्थ है "मैं आराम करता/करती हूँ"; repose, se reposer का je रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson03.order.004
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: word_order
  frame:
    text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je vais, aller का je रूप है; au का अर्थ है à + le।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson03.fill.005
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: fill_in_blank
  frame:
    text: Je me {item} avant l'atelier du soir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se reposer आत्मवाचक क्रिया है, इसलिए je के साथ me आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson03.translate.006
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: 'तुम शनिवार को वर्कशॉप से पहले क्या करते हो? (अनौपचारिक: Tu fais से शुरू करें)'
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu fais {item} le samedi avant l'atelier ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu fais quoi ? यह पूछने का अनौपचारिक तरीक़ा है कि कोई क्या कर रहा है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit10.lesson03.translate.007
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: 'तुम घर कितने बजे पहुँचते हो? (अनौपचारिक: Tu से शुरू करें)'
    language_code: hi
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu {item} à quelle heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Rentres, tu रूप है; à quelle heure समय पूछने के लिए है।
    language_code: hi
    direction: ltr
