templates:
- content_key: practice.hi-fr.fr.a1.unit12.lesson01.choose.001
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Préparé, acheté, oublié और goûté -er वाली क्रियाओं के भूतकालिक कृदंत हैं: इनका अंत -é पर होता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson01.listen.002
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: इन सभी कृदंतों का अंत -é पर होता है, जिसका उच्चारण café की अंतिम ध्वनि जैसा होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson01.order.004
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: word_order
  frame:
    text: Tu as {item} le gâteau ?
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu as {item} le gâteau ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Tu as aimé? भूतकाल का प्रश्न है: as के साथ कृदंत aimé।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson01.fill.006
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: fill_in_blank
  frame:
    text: J'ai {item} des légumes au marché. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Acheté, acheter का कृदंत है, जो j'ai के बाद आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson01.translate.007
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: translation
  frame:
    text: मैंने कार्यशाला के लिए एक केक बनाया।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {item} un gâteau pour l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: J'ai préparé में avoir के साथ कृदंत आता है; avoir के बाद कृदंत के अंत में कोई बदलाव नहीं होता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson01.translate.008
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: translation
  frame:
    text: मैं मक्खन घर पर भूल गया।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {item} le beurre à la maison.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: J'ai oublié, oublier का संयुक्त भूतकाल है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson02.choose.001
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'arriver, aller और rester जैसी क्रियाओं की सहायक क्रिया être है: je suis arrivé, il est resté।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson02.listen.002
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*Finalement* विशेषण *final* में प्रत्यय *-ment* जोड़कर बना है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson02.order.004
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: word_order
  frame:
    text: Le bus est {item} en retard.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Le bus est {item} en retard.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Arrivé, le bus के अनुसार है, इसलिए यह पुल्लिंग एकवचन है और इसमें अतिरिक्त -e नहीं लगता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson02.fill.006
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: fill_in_blank
  frame:
    text: Mathieu est {item} pour nettoyer la cuisine. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Rester के साथ être आता है, इसलिए resté, Mathieu के अनुसार रूप लेता है: पुल्लिंग एकवचन।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson02.translate.007
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: translation
  frame:
    text: मैं कार्यशाला से पहले बाज़ार गई थी। (स्त्री बोल रही है)
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item} au marché avant l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: être के साथ कृदंत कर्ता के अनुसार बदलता है, इसलिए स्त्री allée लिखती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson02.translate.008
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: translation
  frame:
    text: आख़िरकार, केक बहुत स्वादिष्ट था।
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Finalement, le gâteau {item} délicieux.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Était, être का अपूर्ण भूतकाल है; finalement वाक्य के आरंभ में आकर "आख़िरकार" का अर्थ देता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson03.choose.001
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je n'ai pas pu venir का अर्थ है कि मैं आ नहीं सका; pu, pouvoir का कृदंत है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson03.listen.002
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Samedi dernier का अर्थ है पिछला शनिवार; यहाँ dernier संज्ञा के बाद आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson03.match.003
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Là-bas का अर्थ है वहाँ, और rapidement का अर्थ है जल्दी से।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson03.order.004
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: word_order
  frame:
    text: Je suis allé {item} à l'épicerie du coin.
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis allé {item} à l'épicerie du coin.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Rapidement क्रियाविशेषण है और इसका रूप नहीं बदलता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson03.fill.005
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: fill_in_blank
  frame:
    text: Je n'ai pas {item} venir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pu, pouvoir का कृदंत है; n'ai pas सहायक क्रिया को बीच में घेरते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit12.lesson03.translate.006
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: translation
  frame:
    text: क्या तुम्हें वहाँ मक्खन मिला?
    language_code: hi
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu as trouvé du beurre {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu as trouvé? अनौपचारिक है, और du beurre का अर्थ है थोड़ा मक्खन।
    language_code: hi
    direction: ltr
