      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pleut
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'अगर बारिश होती है, तो हम अंदर रहते हैं। S''il pleut (अगर बारिश होती है): si + il मिलकर s''il बनता है; फिर on reste à l''intérieur बताता है कि आप क्या करते हैं।'
    language_code: hi
    direction: ltr
