      text: Le temps est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: धूप खिली है। Le temps est + विशेषण एक मानक रचना है; विशेषण पुल्लिंग संज्ञा temps के अनुसार रूप लेता है।
    language_code: hi
    direction: ltr
