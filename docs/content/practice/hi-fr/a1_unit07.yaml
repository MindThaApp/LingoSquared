  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La poste का अर्थ डाकघर है; gare, pharmacie और banque की तरह यह भी स्त्रीलिंग संज्ञा है।
    language_code: hi
    direction: ltr
