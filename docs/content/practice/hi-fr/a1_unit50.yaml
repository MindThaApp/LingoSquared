  lesson_content_key: fr.a1.unit50.lesson06.un_appel_apres_le
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} इस यूनिट के शब्दों में से एक है, पाठ "शिफ़्ट के बाद फ़ोन कॉल" से।'
    language_code: hi
