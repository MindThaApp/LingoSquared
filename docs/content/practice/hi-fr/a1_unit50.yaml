- content_key: practice.hi-fr.fr.a1.unit50.lesson01.order.002
  lesson_content_key: fr.a1.unit50.lesson01.je_t_appelle
  type: word_order
  frame:
    text: Je {item} t'appeler.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_dois
  answer_derivation:
    kind: render_frame
    frame:
      text: Je {item} t'appeler.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'मुझे तुम्हें फ़ोन करना है। dois का अर्थ है: मुझे करना है; तुम्हें करना है (अनौपचारिक)।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit50.lesson02.order.002
  lesson_content_key: fr.a1.unit50.lesson02.qui_est_a_l
  type: word_order
  frame:
    text: Vous {item} avec Camille.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_parlez
  answer_derivation:
    kind: render_frame
    frame:
      text: Vous {item} avec Camille.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: आप Camille से बात कर रहे हैं। Vous parlez avec + नाम, c'est + नाम का औपचारिक रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit50.lesson03.order.002
  lesson_content_key: fr.a1.unit50.lesson03.tu_peux_repeter
  type: word_order
  frame:
    text: Ne parle pas si {item}, s'il te plaît.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_vite
  answer_derivation:
    kind: render_frame
    frame:
      text: Ne parle pas si {item}, s'il te plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'कृपया इतना तेज़ मत बोलो। Ne parle pas si vite में क्रिया का निषेध है: ne ... pas, parle को घेरते हैं, और si का अर्थ ''इतना'' है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit50.lesson04.order.002
  lesson_content_key: fr.a1.unit50.lesson04.envoyer_un_sms
  type: word_order
  frame:
    text: Je te {item} plus tard.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_rappelle
  answer_derivation:
    kind: render_frame
    frame:
      text: Je te {item} plus tard.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: मैं तुम्हें बाद में वापस फ़ोन करता हूँ। *Rappeler* (वापस फ़ोन करना) में *re-* पहले से 'वापस' का भाव लिए हुए है; *plus tard* का अर्थ है 'बाद में'।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit50.lesson06.order.002
  lesson_content_key: fr.a1.unit50.lesson06.un_appel_apres_le
  type: word_order
  frame:
    text: Ça s'est très bien passé, mieux que je {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pensais
  answer_derivation:
    kind: render_frame
    frame:
      text: Ça s'est très bien passé, mieux que je {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: सब बहुत अच्छा रहा, मेरी सोच से भी बेहतर। Ça s'est très bien passé और je pensais यहाँ बँधे हुए वाक्यांश हैं; je pensais क्रिया penser (सोचना) का अपूर्ण भूतकाल है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit50.lesson06.fill.003
  lesson_content_key: fr.a1.unit50.lesson06.un_appel_apres_le
  type: fill_in_blank
  frame:
    text: Merci beaucoup, ça {item} beaucoup pour moi. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_compte
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_compte
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'बहुत धन्यवाद, यह मेरे लिए बहुत मायने रखता है। यहाँ compter का अर्थ ''मायने रखना'' है: ça compte pour moi (यह मेरे लिए मायने रखता है); pour moi बताता है कि किसके लिए।'
    language_code: hi
    direction: ltr
