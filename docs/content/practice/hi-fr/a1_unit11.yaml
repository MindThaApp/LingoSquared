templates:
- content_key: practice.hi-fr.fr.a1.unit11.lesson01.choose.001
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
