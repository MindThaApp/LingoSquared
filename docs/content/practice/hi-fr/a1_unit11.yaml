      direction: ltr
  feedback_frame:
    text: Tu es libre ? से कोई दोस्त पूछता है कि आप खाली हैं या नहीं; samedi से पहले किसी पूर्वसर्ग की ज़रूरत नहीं होती।
    language_code: hi
    direction: ltr
