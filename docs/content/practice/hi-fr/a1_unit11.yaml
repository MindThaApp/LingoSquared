  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Faire les courses का अर्थ है राशन-सब्ज़ी जैसी रोज़मर्रा की ख़रीदारी करना; courses बहुवचन है।
    language_code: hi
    direction: ltr
