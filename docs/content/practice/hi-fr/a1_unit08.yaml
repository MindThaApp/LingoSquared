  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: translation
  frame:
    text: अच्छा विचार!
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Bonne {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Idée स्त्रीलिंग है, इसलिए विशेषण bonne आता है, bon नहीं।
    language_code: hi
    direction: ltr
