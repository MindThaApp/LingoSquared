- content_key: practice.hi-fr.fr.a1.unit49.lesson03.order.002
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: word_order
  frame:
    text: Je suis {item} avant mon premier service.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nerveux
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item} avant mon premier service.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: मैं अपनी पहली शिफ्ट को लेकर घबराया हुआ हूँ। nerveux का अर्थ है घबराया हुआ (पुल्लिंग)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit49.lesson03.fill.003
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: fill_in_blank
  frame:
    text: Salut Mathieu, tu te sens comment avant ton premier {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: नमस्ते Mathieu, अपनी पहली शिफ्ट को लेकर तुम कैसा महसूस कर रहे हो? Avant ton premier service (तुम्हारी पहली शिफ्ट से पहले) में वही avant + संज्ञा वाला ढाँचा है जो पाठ 3 में था।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit49.lesson04.order.002
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: word_order
  frame:
    text: Comment se {item} Mathieu ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sent
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment se {item} Mathieu ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mathieu कैसा महसूस करता है? Se sentir (महसूस करना, आत्मवाचक क्रिया) भावनात्मक स्थिति पूछने या बताने का सामान्य तरीका है; यह स्वास्थ्य वाली इकाई में भी आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit49.lesson05.order.002
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: word_order
  frame:
    text: Oui, je {item} aussi.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pense
  answer_derivation:
    kind: render_frame
    frame:
      text: Oui, je {item} aussi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: हाँ, मुझे भी ऐसा ही लगता है। Je pense aussi किसी की राय से सहमति जताने का स्वाभाविक तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit49.lesson06.order.002
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: word_order
  frame:
    text: Je suis un peu nerveux, {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_honnêtement
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis un peu nerveux, {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: सच कहूँ तो मैं थोड़ा घबराया हुआ हूँ। Honnêtement (सच कहूँ तो) अपनी घबराहट मानने की बात को नरम बना देता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit49.lesson06.fill.003
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: fill_in_blank
  frame:
    text: Ne t'inquiète pas, tu {item} y arriver ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'चिंता मत करो, तुम यह अच्छे से कर लोगे! Tu vas y arriver (शाब्दिक अर्थ: "तुम वहाँ पहुँच जाओगे") हौसला बढ़ाने वाली स्थिर अभिव्यक्ति है; aller + क्रिया का मूल रूप निकट भविष्य बनाता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit49.lesson06.translate.004
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: धन्यवाद, इससे सच में बहुत मदद मिलती है।
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_vraiment
  answer_derivation:
    kind: render_frame
    frame:
      text: Merci, ça m'aide {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: धन्यवाद, इससे सच में बहुत मदद मिलती है। Aide, aider (मदद करना) का il/elle रूप है; m', me की जगह आता है।
    language_code: hi
    direction: ltr
