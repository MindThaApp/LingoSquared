    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: L'addition बिल माँगने का तरीका है; l' आर्टिकल le/la का स्वर से पहले छोटा रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit05.lesson02.translate.007
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: translation
  frame:
    text: मुझे एक कॉफ़ी चाहिए, कृपया। (औपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je voudrais un café, s'il vous plaît शिष्टता से ऑर्डर देने का सामान्य तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit05.lesson02.translate.008
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: translation
  frame:
    text: यह बहुत स्वादिष्ट है!
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est délicieux! खाना बनाने वाले या खाने की तारीफ़ है।
    language_code: hi
    direction: ltr
