templates:
- content_key: practice.hi-fr.fr.a1.unit05.lesson01.choose.001
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le poulet, le poisson, le riz और le vin पुल्लिंग हैं, जबकि la salade स्त्रीलिंग है; l'eau में eau की स्वर-ध्वनि के कारण आर्टिकल का स्वर हट जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit05.lesson01.listen.002
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Café का अर्थ पेय भी है और जगह भी; कौन-सा अर्थ है, यह संदर्भ से पता चलता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit05.lesson01.match.003
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: matching_pairs
