    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'गिलास जैसे किसी पात्र के बाद फ़्रेंच में बिना आर्टिकल के de आता है: un verre de vin, un verre d''eau.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit05.lesson01.translate.004
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ये मेन्यू के खाने-पीने की चीज़ें हैं; हर संज्ञा के साथ उसका आर्टिकल भी सीखिए: le vin, la salade.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit05.lesson02.choose.001
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vous avez choisi? वेटर के पूछने का तरीका है कि आपने चुन लिया या नहीं; avez choisi भूतकाल का रूप है, शाब्दिक अर्थ "चुन लिया है"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit05.lesson02.order.002
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: word_order
  frame:
    text: Je voudrais un {item}, s'il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Un पुल्लिंग संज्ञाओं से पहले आता है, जैसे café, dessert और verre.
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit05.lesson02.order.003
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: word_order
  frame:
    text: Qu'est-ce que vous avez comme {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce que vous avez comme {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Comme का यहाँ अर्थ "के रूप में" या "में" है: मिठाई में आपके पास क्या है?'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit05.lesson02.fill.004
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: Vous {item} choisi ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vous avez choisi? वेटर का शिष्ट सवाल है, जिसमें vous का प्रयोग होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit05.lesson02.fill.005
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: C'est {item} ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Délicieux पुल्लिंग एकवचन है, क्योंकि c'est किसी अनिर्दिष्ट चीज़ की ओर इशारा करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit05.lesson02.fill.006
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
