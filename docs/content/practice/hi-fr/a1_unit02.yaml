templates:
- content_key: practice.hi-fr.fr.a1.unit02.lesson01.choose.001
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: शून्य से सोलह तक की संख्याएँ एक-एक शब्द हैं; सत्रह से उन्नीस तक की संख्याएँ टुकड़ों से बनती हैं, जैसे dix-sept, यानी दस-सात।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson01.translate.002
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'वर्तनी का ध्यान रखिए: zéro में accent होता है, और trente-quatre जैसी जुड़ी हुई संख्याएँ हाइफ़न से जोड़ी जाती हैं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson02.choose.001
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'सत्तर से व्यवस्था बदल जाती है: soixante-dix यानी साठ-दस और quatre-vingts यानी चार बीसियाँ।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson02.listen.002
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: शून्य से सोलह तक अलग-अलग शब्द हैं, फिर vingt, trente और soixante दहाइयाँ देते हैं; बाक़ी संख्याएँ इन्हें जोड़कर बनती हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson02.match.003
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Quatre-vingts के अंत में s लगता है, पर उसके बाद कोई और संख्या आए तो s हट जाता है: quatre-vingt-dix।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson03.choose.001
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Quel âge as-tu? किसी की उम्र पूछता है: फ़्रेंच में कहा जाता है कि आपके पास इतने साल हैं, यह नहीं कि आप इतने साल के हैं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson03.order.002
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: J'ai {n} ans.
    language_code: fr
    direction: ltr
  slots:
    n: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {n} ans.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: फ़्रेंच में कहा जाता है कि मेरे पास इतने साल हैं (j'ai ... ans), यह नहीं कि मैं इतने साल का हूँ।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson03.fill.003
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: fill_in_blank
  frame:
    text: Quel âge {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quel âge as-tu? अनौपचारिक है; किसी अजनबी से आप quel âge avez-vous? पूछेंगे।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson03.translate.004
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: मेरी उम्र {n} साल है।
    language_code: hi
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {n} ans.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'उम्र के लिए फ़्रेंच में avoir (रखना) आता है: j''ai vingt-huit ans, शाब्दिक अर्थ "मेरे पास अट्ठाईस साल हैं"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson03.translate.005
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: तुम्हारी उम्र कितनी है? (अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Quel âge as-tu? में tu है: यह सिर्फ़ दोस्तों, परिवार और हमउम्र लोगों के लिए है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson03.translate.006
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: आपकी उम्र कितनी है? (औपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Quel âge avez-vous? में vous है: यह अजनबियों के लिए और शिष्ट स्थितियों में प्रयोग होता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson04.choose.001
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: S'il te plaît अनौपचारिक "कृपया" है और s'il vous plaît औपचारिक; यही ढंग tu और vous में भी है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson04.fill.002
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
  type: fill_in_blank
  frame:
    text: Quel est ton {item} de téléphone ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ton अनौपचारिक "तुम्हारा" है; किसी अजनबी से आप quel est votre numéro de téléphone? पूछेंगे।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson05.listen.001
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Œufs बहुवचन है: बहुवचन में œuf का f मौन हो जाता है, इसलिए œufs का उच्चारण एकवचन से अलग सुनाई देता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson05.match.002
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'फ़्रेंच में मात्रा के साथ de आता है: deux tasses de farine, une demi-tasse de sucre।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson05.order.003
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: word_order
  frame:
    text: J'ai besoin de {n} œufs.
    language_code: fr
    direction: ltr
  slots:
    n: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai besoin de {n} œufs.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avoir besoin de + संज्ञा का अर्थ है "चाहिए होना"; संख्या de और संज्ञा के बीच आती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson05.translate.004
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इनमें से कई शब्द मात्रा के बाद de के साथ प्रयोग होते हैं, जैसे tasses de farine।
    language_code: hi
    direction: ltr
- content_key: practice.hi-fr.fr.a1.unit02.lesson06.fill.001
  lesson_content_key: fr.a1.unit02.lesson06.recipe_count_dialogue
  type: fill_in_blank
  frame:
    text: Tu {item} aussi besoin de sucre ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tu as अनौपचारिक "तुम्हारे पास है" है; औपचारिक रूप vous avez होगा।
    language_code: hi
    direction: ltr
