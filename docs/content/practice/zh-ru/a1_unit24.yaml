    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson02.translate.006
  lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
  type: translation
  frame:
    text: 需要小票吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Чек {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Нужен 是阳性形式，与 чек 相配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson02.translate.007
  lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
  type: translation
  frame:
    text: 一共三百卢布。
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: С вас {item} рублей.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: С вас 字面意思是“从您这里”，是收银员报价时的礼貌说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson02.translate.008
  lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
  type: translation
  frame:
    text: 今天只收现金。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} наличными.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Только 放在它所限定的内容之前。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson02.translate.009
  lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这些都是收银台常用的词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson02.match.010
  lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Нужны 用于复数事物，нужен 用于阳性单数事物。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson01.listen.008
  lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Наличными 意思是“用现金”；карта、рубли 和 чек 只是与付款相关的普通名词。
    language_code: zh
    direction: ltr
