    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Чек {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Нужен 与阳性名词 чек 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson02.fill.003
  lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
  type: fill_in_blank
