    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Триста（三百）后面接复数 рублей。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson02.fill.004
  lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
  type: fill_in_blank
  frame:
    text: Сегодня {item} наличными. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Только 用来限定后面的内容，相当于“只”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson02.fill.005
  lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
  type: fill_in_blank
  frame:
    text: Чек {item}? ({hint})
    language_code: ru
