templates:
- content_key: practice.zh-ru.ru.a1.unit24.lesson01.choose.001
  lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Наличными 表示用现金，картой 表示刷卡；两者都用工具格。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson01.order.002
  lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
  type: word_order
  frame:
    text: Можно {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Можно {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Можно 加工具格形式，用来询问能不能用那种方式付款。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson01.fill.003
  lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
  type: fill_in_blank
  frame:
    text: Можно {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 можно 之后，Карта 变成 картой，意思是“用卡”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson01.fill.004
  lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
  type: fill_in_blank
  frame:
    text: Мне {item} рубли. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Нужны 与复数名词 рубли 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson01.translate.005
  lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
  type: translation
  frame:
    text: 可以刷卡吗？
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Можно {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Можно 加 картой 是在问能不能刷卡付款。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson01.translate.006
  lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
  type: translation
  frame:
    text: 可以付现金。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Можно {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Можно 的意思是“可以、允许”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson01.translate.007
  lesson_content_key: ru.a1.unit24.lesson01.mozhno_kartoy
  type: translation
  frame:
    text: 我需要卢布。
    language_code: zh
    direction: ltr
  slots:
    a: *id003
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Нужны 与复数 рубли 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson02.choose.001
  lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Чек 是阳性名词，所以用 нужен；如果是复数事物，则用 нужны。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit24.lesson02.order.002
  lesson_content_key: ru.a1.unit24.lesson02.chek_nuzhen
  type: word_order
  frame:
