templates:
- content_key: practice.zh-ru.ru.a1.unit11.lesson01.choose.001
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 以 -ю 结尾的动词搭配 я（我起床：я встаю），而 -ете 搭配 вы（вы встаёте）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson01.order.002
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: word_order
  frame:
    text: Я {item} в семь часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 因为主语是 я，所以每个动词都以 -ю 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson01.fill.003
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Я {item} в восемь часов. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Завтракаю 是表示“吃早饭”的动词的 я 形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson01.fill.004
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Когда вы {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Встаёте 以 -ёте 结尾，是 вы 的形式；я 的形式是 встаю。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson01.translate.005
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: 我七点起床。
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 表示钟点时，俄语用 в 加数词：в семь часов，意为“七点”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson01.translate.006
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这些动词都是 я 的形式，所以每个都表示“我做某事”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson02.choose.001
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ложусь спать 字面意思是“我躺下睡觉”，是表达“我去睡觉”的常用说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson02.match.002
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Спать 是不定式，意为“睡觉”，而 ложусь 是另一个动词的 я 形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson02.order.003
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: word_order
  frame:
    text: Я ложусь {item} в одиннадцать часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь {item} в одиннадцать часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ложусь спать 是固定搭配：动词 ложусь 加不定式 спать。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson02.fill.004
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: fill_in_blank
  frame:
    text: Я работаю с девяти до {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: С 和 до 后面要用第二格，所以 девять 和 пять 变成 девяти 和 пяти。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson02.translate.005
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: 我从九点工作到五点。
    language_code: zh
    direction: ltr
  slots:
    a: *id011
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я работаю с {a} до {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: С ... до ... 意为“从……到……”，两个数词都要用第二格。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson02.translate.006
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: 我十一点睡觉。
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь спать в {item} часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 数词 одиннадцать 后面的名词用复数第二格：часов。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson03.choose.001
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Делаете 和 работаете 以 -ете 结尾，是 вы 的形式，所以与 вы 搭配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson03.order.002
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: Что вы {item} утром?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что вы делаете? 问“你做什么”；утром 意为“在早晨”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson03.order.003
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: А когда вы {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: А когда вы {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А 把这个问题与前一个问题连接起来，работаете 是 вы 的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson03.fill.004
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: fill_in_blank
  frame:
    text: Что вы {item} вечером? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Делаете 是 делать（做）的 вы 形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson03.translate.005
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: 您早晨做什么？（正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что вы делаете утром? 由疑问词、вы 的动词形式和表示时间的词组成。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit11.lesson03.translate.006
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Понятно 字面意思是“清楚了”，是表达“我明白了”的常用说法。
    language_code: zh
    direction: ltr
