    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit43.lesson01.order.002
  lesson_content_key: ru.a1.unit43.lesson01.zabronirovat_nomer
  type: word_order
  frame:
    text: Я хочу {item} номер.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_забронировать
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item} номер.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我想订一个房间。забронировать 的意思是预订。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit43.lesson01.fill.003
  lesson_content_key: ru.a1.unit43.lesson01.zabronirovat_nomer
