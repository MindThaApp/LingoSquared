    text: '{item}是本单元的词语，出自“阅读确认信息”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit43.lesson06.translate.001
  lesson_content_key: ru.a1.unit43.lesson06.nastya_zvonit_pro_vykhodnye
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
