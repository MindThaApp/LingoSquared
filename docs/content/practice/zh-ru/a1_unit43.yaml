  frame:
    text: Мы {item} сегодня днём. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_заселяемся
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_заселяемся
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我们今天下午办理入住。заселяемся 的意思是我们办理入住。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit43.lesson01.translate.004
  lesson_content_key: ru.a1.unit43.lesson01.zabronirovat_nomer
  type: translation
  frame:
    text: 我预订了一个房间。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_забронирован
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} номер.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我已经订了一个房间。забронирован 的意思是已预订的（阳性）。
    language_code: zh
    direction: ltr
