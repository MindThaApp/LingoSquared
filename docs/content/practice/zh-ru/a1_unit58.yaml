schema_version: '1.0'
pack_key: practice.zh-ru.a1.unit58
source_language: zh
target_language: ru
unit_content_key: ru.a1.unit58.theatre
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_актёров
    - w_актёры
    - w_антрактом
    - w_занавес
    - w_звезда
    - w_места
    - w_открыта
    - w_популярный
    - w_потрясающими
    - w_путешествие
    - w_пьеса
    - w_спектакль
    - w_сцену
templates:
- content_key: practice.zh-ru.ru.a1.unit58.lesson01.choose.001
  lesson_content_key: ru.a1.unit58.lesson01.davay_segodnya_poydyom_v
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_спектакль
        - w_популярный
        - w_занавес
        - w_сцену
        - w_актёры
        - w_открыта
        - w_актёров
        - w_звезда
        - w_пьеса
        - w_путешествие
        - w_антрактом
        - w_места
        - w_потрясающими
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“我们今天去剧院好吗?”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit58.lesson02.listen.001
  lesson_content_key: ru.a1.unit58.lesson02.stsena_i_zanaves
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“舞台和幕布”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit58.lesson03.translate.001
  lesson_content_key: ru.a1.unit58.lesson03.aktyory_i_kassa
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“演员和售票处”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit58.lesson04.match.001
  lesson_content_key: ru.a1.unit58.lesson04.programma_spektaklya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit58.lesson05.choose.001
  lesson_content_key: ru.a1.unit58.lesson05.u_kassy_teatra
