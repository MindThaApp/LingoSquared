- content_key: practice.zh-ru.ru.a1.unit58.lesson01.order.002
  lesson_content_key: ru.a1.unit58.lesson01.davay_segodnya_poydyom_v
  type: word_order
  frame:
    text: Во сколько начинается {item}?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_спектакль
  answer_derivation:
    kind: render_frame
    frame:
      text: Во сколько начинается {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 演出几点开始？спектакль 的意思是“演出”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit58.lesson02.order.002
  lesson_content_key: ru.a1.unit58.lesson02.stsena_i_zanaves
  type: word_order
  frame:
    text: Я вижу сцену и {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_занавес
  answer_derivation:
    kind: render_frame
    frame:
      text: Я вижу сцену и {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我看到舞台和幕布。занавес 的意思是“幕布”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit58.lesson03.order.002
  lesson_content_key: ru.a1.unit58.lesson03.aktyory_i_kassa
  type: word_order
  frame:
    text: Я вижу {item} и кассу.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_актёров
  answer_derivation:
    kind: render_frame
    frame:
      text: Я вижу {item} и кассу.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我看到演员们和售票处。актёров 的意思是“演员们”，作宾语。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit58.lesson05.order.002
  lesson_content_key: ru.a1.unit58.lesson05.u_kassy_teatra
  type: word_order
  frame:
    text: У нас хорошие {item}?
    language_code: ru
