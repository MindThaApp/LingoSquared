templates:
- content_key: practice.zh-ru.ru.a1.unit13.lesson01.choose.001
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 俄语过去时会随性别变化：男性或阳性主语用 был，女性或阴性主语用 была。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson01.order.002
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: word_order
  frame:
    text: Вчера она {item} дома.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера она {item} дома.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Она 是阴性，所以过去时动词用 была；男性说 я 时用 был。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson01.fill.003
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: fill_in_blank
  frame:
    text: Вчера я {item} дома. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 男性说 я был，女性说 я была；动词与说话人的性别一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson01.fill.004
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: fill_in_blank
  frame:
    text: Вчера она была {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Дома 的意思是“在家”，形式不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson01.translate.005
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: translation
  frame:
    text: 昨天我在家。（男性说）
    language_code: zh
    direction: ltr
  slots:
    a: *id003
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 俄语过去时没有专门的“我”的形式；动词会体现说话人的性别。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson01.translate.006
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: translation
  frame:
    text: 昨天她在家。
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера она {item} дома.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Была 是 быть（是、在）的阴性过去式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson02.choose.001
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 过去时动词：阳性主语以 -л 结尾，阴性主语以 -ла 结尾：ходил，ходила。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson02.match.002
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ходил、смотрел 和 был 都以 -л 结尾；阴性形式以 -ла 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson02.order.003
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: word_order
  frame:
    text: Вчера я {item} в кино.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {item} в кино.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ходил 是阳性过去式，所以这句话是男性说的。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson02.fill.004
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: fill_in_blank
  frame:
    text: Она {item} фильм. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Она 是阴性，所以过去时动词以 -ла 结尾：смотрела。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson02.translate.005
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: translation
  frame:
    text: 昨天我去看电影了。（男性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {item} в кино.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ходил 是 ходить 的阳性过去式；女性说 ходила。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson02.translate.006
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: translation
  frame:
    text: 我看了一部电影。（女性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} фильм.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Смотрела 是阴性过去式；фильм 形式不变，因为它是阳性的非生命名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson03.choose.001
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: делать 的过去式：男性用 делал，女性用 делала。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson03.order.002
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: word_order
  frame:
    text: Что ты {item} вчера?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что ты {item} вчера?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что ты делал? 是对男性用 ты 提问；对女性则要问 делала。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson03.fill.003
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: fill_in_blank
  frame:
    text: Я смотрел {item} фильм. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хороший 是阳性，与 фильм 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson03.fill.004
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: fill_in_blank
  frame:
    text: Я {item} дома. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Отдыхала 是 отдыхать（休息）的阴性过去式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson03.translate.005
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: translation
  frame:
    text: 你昨天做什么了？（非正式，对男性）
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что ты {item} вчера?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что ты делал вчера? 用了 ты，所以是对朋友说的；对男性，动词用阳性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit13.lesson03.translate.006
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: translation
  frame:
    text: 我休息了。（女性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отдыхала 以 -ла 结尾，因为说话人是女性。
    language_code: zh
    direction: ltr
