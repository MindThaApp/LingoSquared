    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit45.lesson01.order.002
  lesson_content_key: ru.a1.unit45.lesson01.moi_volosy_slishkom_dlinnye
  type: word_order
  frame:
    text: Мои волосы {item} длинные.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags:
        semantic: w_слишком
  answer_derivation:
    kind: render_frame
    frame:
      text: Мои волосы {item} длинные.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我的头发太长了。слишком 的意思是“太”，“过于”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit45.lesson01.fill.003
  lesson_content_key: ru.a1.unit45.lesson01.moi_volosy_slishkom_dlinnye
