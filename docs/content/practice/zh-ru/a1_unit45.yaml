review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_вовремя
    - w_семьсот
    - w_классная
    - w_коротко
    - w_короче
    - w_можете
    - w_мытьё
    - w_насколько
    - w_недели
    - w_парикмахер
    - w_парикмахера
    - w_парикмахеру
    - w_плачу
    - w_подстричь
    - w_покороче
    - w_прейскурант
    - w_присаживайтесь
    - w_приходите
    - w_причёска
    - w_проблем
    - w_следующей
    - w_слишком
    - w_стрижка
    - w_хотите
