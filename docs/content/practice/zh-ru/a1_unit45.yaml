  frame:
    text: Я иду к {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_парикмахеру
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_парикмахеру
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我去理发店。парикмахеру 的意思是“理发师”，用在表示“去（某人那里）”的前置词之后。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit45.lesson02.order.002
