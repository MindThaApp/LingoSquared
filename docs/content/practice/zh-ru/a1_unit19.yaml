  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_Тулы
    - w_билет
    - w_платформа
slot_presets:
  p1: &id001
    language_code: ru
    part_of_speech:
    - noun
    - proper_noun
    agreement_tags:
      semantic:
      - w_билет
      - w_платформа
      - w_Тулы
  p2: &id002
    language_code: ru
    part_of_speech: proper_noun
    agreement_tags:
      semantic: w_Тулы
  p3: &id003
    language_code: ru
    part_of_speech: noun
    agreement_tags:
      semantic: w_платформа
  p4: &id004
    language_code: ru
    part_of_speech: noun
    agreement_tags:
      semantic:
      - w_билет
      - w_платформа
  p5: &id005
    language_code: ru
    part_of_speech:
    - noun
    - proper_noun
    agreement_tags:
      semantic:
      - w_платформа
      - w_билет
      - w_Тулы
templates:
- content_key: practice.zh-ru.ru.a1.unit19.lesson01.choose.001
  lesson_content_key: ru.a1.unit19.lesson01.bilet_do_tuly
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Билет до Тулы, пожалуйста 是礼貌地请求买一张去图拉的票。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson01.listen.002
  lesson_content_key: ru.a1.unit19.lesson01.bilet_do_tuly
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: До 表示“到……为止”，后面的城市名要变成 Тулы 这种形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson01.order.003
  lesson_content_key: ru.a1.unit19.lesson01.bilet_do_tuly
  type: word_order
  frame:
    text: Билет до {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Билет до {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До 后面接地点的第二格（属格）形式：Тула 变成 Тулы。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson01.fill.004
  lesson_content_key: ru.a1.unit19.lesson01.bilet_do_tuly
  type: fill_in_blank
  frame:
    text: Билет до {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 до 后面，城市名要变形：Тула 变成 Тулы。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson01.translate.005
  lesson_content_key: ru.a1.unit19.lesson01.bilet_do_tuly
  type: translation
  frame:
    text: 请给我一张去图拉的票。
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Билет до {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 俄语在 билет 前不需要表示“一张”的词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson02.order.001
  lesson_content_key: ru.a1.unit19.lesson02.poezd_v_desyat
  type: word_order
  frame:
    text: Поезд в десять часов, {item} два.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Поезд в десять часов, {item} два.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: платформа 后面放一个数字，就表示几号站台，比如“二号站台”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson02.fill.002
  lesson_content_key: ru.a1.unit19.lesson02.poezd_v_desyat
  type: fill_in_blank
  frame:
    text: Поезд в десять часов, {item} два. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Платформа 是阴性名词；站台号码放在名词后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson02.translate.003
  lesson_content_key: ru.a1.unit19.lesson02.poezd_v_desyat
  type: translation
  frame:
    text: 火车十点发车，二号站台。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Поезд в десять часов, {item} два.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Платформа два 字面上就是“站台二”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson02.translate.004
  lesson_content_key: ru.a1.unit19.lesson02.poezd_v_desyat
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Билет 和 платформа 是乘火车出行的两个关键名词：买什么，以及在哪里上车。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson02.choose.005
  lesson_content_key: ru.a1.unit19.lesson02.poezd_v_desyat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Платформа 是阴性名词；后面的数字表示几号站台。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson01.order.006
  lesson_content_key: ru.a1.unit19.lesson01.bilet_do_tuly
  type: word_order
  frame:
    text: Здравствуйте! Билет до {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Здравствуйте! Билет до {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Здравствуйте 是在售票窗口开口时用的礼貌问候语。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson01.translate.007
  lesson_content_key: ru.a1.unit19.lesson01.bilet_do_tuly
  type: translation
  frame:
    text: 您好！请给我一张去图拉的票。
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Здравствуйте! Билет до {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Здравствуйте 是正式的“你好”，适用于售票员这样的陌生人。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson01.fill.008
  lesson_content_key: ru.a1.unit19.lesson01.bilet_do_tuly
  type: fill_in_blank
  frame:
    text: Здравствуйте! Билет до {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 до 后面，地名要一直用第二格（属格）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson02.listen.006
  lesson_content_key: ru.a1.unit19.lesson02.poezd_v_desyat
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 注意听词尾：Тулы、билет 和 платформа 的发音各不相同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson02.order.007
  lesson_content_key: ru.a1.unit19.lesson02.poezd_v_desyat
  type: word_order
  frame:
    text: Поезд сегодня в десять часов, {item} два.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Поезд сегодня в десять часов, {item} два.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сегодня 可以直接放在 поезд 后面，表示火车今天发车。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson02.translate.008
  lesson_content_key: ru.a1.unit19.lesson02.poezd_v_desyat
  type: translation
  frame:
    text: 火车今天十点发车，二号站台。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Поезд сегодня в десять часов, {item} два.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 俄语中没有表示“这/那”的定冠词；顺序是：火车、今天、十点、二号站台。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson02.fill.009
  lesson_content_key: ru.a1.unit19.lesson02.poezd_v_desyat
  type: fill_in_blank
  frame:
    text: Поезд сегодня в десять часов, {item} два. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 站台号码放在名词后面，如 платформа два。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit19.lesson02.translate.010
  lesson_content_key: ru.a1.unit19.lesson02.poezd_v_desyat
  type: translation
  frame:
    text: 二号站台。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} два.'
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 两个词就够了：先说名词，再说数字。
    language_code: zh
    direction: ltr
