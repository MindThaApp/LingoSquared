templates:
- content_key: practice.zh-ru.ru.a1.unit14.lesson01.choose.001
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Нравится 是表示“喜欢”的动词：Мне нравится кофе 字面意思是“咖啡令我喜欢”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson01.order.002
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: word_order
  frame:
    text: Мне {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 在 Мне нравится кофе 中，被喜欢的东西是语法上的主语，мне 表示喜欢它的人。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson01.fill.003
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: fill_in_blank
  frame:
    text: Мне {item} чай. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Нравится 与 мне（“对我”）连用，表示你喜欢某物。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson01.translate.004
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: 我喜欢咖啡。
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 俄语说的是“咖啡令我喜欢”，而不是“我喜欢咖啡”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson01.translate.005
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: 我不喜欢茶。
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне не {item} чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 把 не 放在 нравится 前面，表示不喜欢某物。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson02.listen.001
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Не хочу 的意思是“我不想要”；не 紧挨着放在动词前面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson02.order.002
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
    text: Я {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не хочу 是 я хочу（“我想要”）的否定形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson02.order.003
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
    text: Я хочу {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сок 是阳性名词，在 хочу 之后形式不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson02.fill.004
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: fill_in_blank
  frame:
    text: Я хочу {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хочу 后面直接接想要的东西。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson02.translate.005
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: translation
  frame:
    text: 我想要果汁。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу 加名词是一种简单直接的请求。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson02.translate.006
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: translation
  frame:
    text: 我不想要咖啡。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не 放在 хочу 前面，表示否定。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson03.choose.001
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Тебе 是非正式的 ты 的形式，意思是“对你”；礼貌的 вы 形式是 вам。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson03.order.002
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: word_order
  frame:
    text: Да, мне нравится кофе. А {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А тебе? 用非正式的 ты 把问题抛回给对方。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson03.fill.003
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: fill_in_blank
  frame:
    text: А {item} нравится кофе? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Тебе 是非正式的“对你”，用于朋友之间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson03.translate.004
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: 是的，我喜欢咖啡。你呢？（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Тебе 是非正式的“对你”；对陌生人要说 вам。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit14.lesson03.translate.005
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这些是表达喜好和想要的基本要素：нравится、не хочу、сок 和 тебе。
    language_code: zh
    direction: ltr
