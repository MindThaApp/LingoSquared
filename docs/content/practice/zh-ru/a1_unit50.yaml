schema_version: '1.0'
pack_key: practice.zh-ru.a1.unit50
source_language: zh
target_language: ru
unit_content_key: ru.a1.unit50.museum
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_большой
    - w_выставка
    - w_гид
    - w_закрываться
    - w_зал
    - w_картина
    - w_картины
    - w_концерт
    - w_осматриваю
    - w_открыто
    - w_посетить
templates:
- content_key: practice.zh-ru.ru.a1.unit50.lesson01.choose.001
  lesson_content_key: ru.a1.unit50.lesson01.ya_khochu_poyti_v
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_посетить
        - w_выставка
        - w_осматриваю
        - w_закрываться
        - w_гид
        - w_зал
        - w_большой
        - w_картина
        - w_открыто
        - w_картины
        - w_концерт
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自“我想去博物馆”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit50.lesson02.listen.001
  lesson_content_key: ru.a1.unit50.lesson02.ya_khochu_kupit_bilet
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自“我想买一张票”那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit50.lesson03.translate.001
  lesson_content_key: ru.a1.unit50.lesson03.vo_skolko_zakryvaetsya_muzey
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自“博物馆几点关门？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit50.lesson04.match.001
  lesson_content_key: ru.a1.unit50.lesson04.v_muzee
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit50.lesson05.choose.001
  lesson_content_key: ru.a1.unit50.lesson05.chitaem_tablichku
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自“阅读信息告示”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit50.lesson06.translate.001
  lesson_content_key: ru.a1.unit50.lesson06.dima_nina_i_nastya
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自“季马、尼娜和娜斯佳在博物馆”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit50.lesson01.order.002
  lesson_content_key: ru.a1.unit50.lesson01.ya_khochu_poyti_v
  type: word_order
  frame:
    text: Я хочу {item} музей.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_посетить
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item} музей.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我想参观博物馆。посетить 的意思是“参观、拜访”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit50.lesson02.order.002
  lesson_content_key: ru.a1.unit50.lesson02.ya_khochu_kupit_bilet
  type: word_order
  frame:
    text: Я {item} выставку.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_осматриваю
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} выставку.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我正在参观展览。осматриваю 的意思是“我参观、我观览（景点）”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit50.lesson04.order.002
  lesson_content_key: ru.a1.unit50.lesson04.v_muzee
  type: word_order
  frame:
    text: Хорошо, а {item} вам тоже нужен?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_гид
  answer_derivation:
    kind: render_frame
    frame:
      text: Хорошо, а {item} вам тоже нужен?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 好的，您还需要导游吗？гид 的意思是“导游（人）”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit50.lesson06.order.002
  lesson_content_key: ru.a1.unit50.lesson06.dima_nina_i_nastya
  type: word_order
  frame:
    text: Я иду на {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_концерт
  answer_derivation:
