  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_высокий
        - w_невысокий
        - w_старый
        - w_молодой
        - w_прилагательное
        - w_меняется
        - w_роду
        - w_волосы
        - w_короткие
        - w_чёрные
        - w_светлые
        - w_каштановые
        - w_седые
        - w_дедушки
        - w_длинные
        - w_имя
        - w_родительном
        - w_падеже
        - w_глаза
        - w_карие
        - w_голубые
        - w_зелёные
        - w_выглядит
        - w_языковое
        - w_придёт
        - w_новая
        - w_девушка
        - w_узнаю
        - w_выглядят
        - w_выше
        - w_выглядишь
        - w_родительный
        - w_длиннее
        - w_смотри
        - w_познакомиться
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“高、矮、年长、年轻”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson02.listen.001
  lesson_content_key: ru.a1.unit26.lesson02.opisyvaem_volosy
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“描述头发”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson03.translate.001
  lesson_content_key: ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“眼睛与某人长什么样？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson04.match.001
  lesson_content_key: ru.a1.unit26.lesson04.nastya_opisyvaet_ninu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson05.choose.001
  lesson_content_key: ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“比较伊戈尔和列娜”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson06.translate.001
  lesson_content_key: ru.a1.unit26.lesson06.dima_uznayot_ninu
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“季马认出了尼娜”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson01.order.002
  lesson_content_key: ru.a1.unit26.lesson01.vysokiy_nevysokiy_staryy_i
  type: word_order
  frame:
    text: Лена высокая, а Игорь {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_невысокий
  answer_derivation:
    kind: render_frame
    frame:
      text: Лена высокая, а Игорь {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 列娜个子高，伊戈尔个子不高。用 а（而、可是）把两个陈述并列起来：Лена высокая, а Игорь невысокий.
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson02.order.002
  lesson_content_key: ru.a1.unit26.lesson02.opisyvaem_volosy
  type: word_order
  frame:
    text: У Димы короткие чёрные {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_волосы
  answer_derivation:
    kind: render_frame
    frame:
      text: У Димы короткие чёрные {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 季马有黑色的短发。волосы 的意思是头发。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson02.fill.003
  lesson_content_key: ru.a1.unit26.lesson02.opisyvaem_volosy
  type: fill_in_blank
  frame:
    text: У Игоря {item} волосы. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_короткие
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_короткие
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 伊戈尔的头发很短。короткие 的意思是短的（复数）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson02.translate.004
  lesson_content_key: ru.a1.unit26.lesson02.opisyvaem_volosy
  type: translation
  frame:
    text: 娜斯佳是金发。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_светлые
  answer_derivation:
    kind: render_frame
    frame:
      text: У Насти {item} волосы.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 娜斯佳有一头金发。светлые 的意思是浅色的、金色的（复数）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson03.order.002
  lesson_content_key: ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit
  type: word_order
  frame:
    text: У Димы карие {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_глаза
  answer_derivation:
    kind: render_frame
    frame:
      text: У Димы карие {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 季马有棕色的眼睛。глаза 的意思是眼睛。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson03.fill.003
  lesson_content_key: ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit
  type: fill_in_blank
  frame:
    text: У Игоря {item} глаза. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_карие
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_карие
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 伊戈尔有棕色的眼睛。карие 的意思是棕色的（复数，用于眼睛）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson03.translate.004
  lesson_content_key: ru.a1.unit26.lesson03.glaza_i_kak_vyglyadit
  type: translation
  frame:
    text: 娜斯佳有蓝眼睛。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_голубые
  answer_derivation:
    kind: render_frame
    frame:
      text: У Насти {item} глаза.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 娜斯佳有蓝色的眼睛。голубые 的意思是浅蓝色的（复数）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson05.order.002
  lesson_content_key: ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu
  type: word_order
  frame:
    text: У Лены волосы {item}, чем у Игоря.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_длиннее
  answer_derivation:
    kind: render_frame
    frame:
      text: У Лены волосы {item}, чем у Игоря.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 列娜的头发比伊戈尔的长。У Лены волосы длиннее, чем у Игоря：длиннее 不变化，чем（比）引出后半部分。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit26.lesson06.order.002
  lesson_content_key: ru.a1.unit26.lesson06.dima_uznayot_ninu
  type: word_order
  frame:
    text: Мне тоже приятно {item}!
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_познакомиться
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне тоже приятно {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我也很高兴认识你！对话到此结束——季马根据娜斯佳之前的描述，成功认出了尼娜。
    language_code: zh
    direction: ltr
