schema_version: '1.0'
pack_key: practice.zh-ru.a1.unit26
source_language: zh
target_language: ru
unit_content_key: ru.a1.unit26.appearance
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_волосы
    - w_выглядит
    - w_выглядишь
    - w_выглядят
    - w_высокий
    - w_выше
    - w_глаза
    - w_голубые
    - w_девушка
    - w_дедушки
    - w_длиннее
    - w_длинные
    - w_зелёные
    - w_имя
    - w_карие
    - w_каштановые
    - w_короткие
    - w_меняется
    - w_молодой
    - w_невысокий
    - w_новая
    - w_падеже
    - w_познакомиться
    - w_придёт
    - w_прилагательное
    - w_родительном
    - w_родительный
    - w_роду
    - w_светлые
    - w_седые
    - w_смотри
    - w_старый
    - w_узнаю
    - w_чёрные
    - w_языковое
templates:
- content_key: practice.zh-ru.ru.a1.unit26.lesson01.choose.001
