  lesson_content_key: ru.a1.unit62.lesson01.davay_skhodim_v_tsvetochnyy
  type: word_order
  frame:
    text: Кафе-мороженое было {item}, и теперь я иду в цветочный магазин.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_классное
  answer_derivation:
    kind: render_frame
    frame:
      text: Кафе-мороженое было {item}, и теперь я иду в цветочный магазин.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 冰淇淋店很有意思，现在我要去花店。классное 的意思是“很棒、很酷”（中性）。
    language_code: zh
    direction: ltr
