schema_version: '1.0'
pack_key: practice.zh-ru.a1.unit62
source_language: zh
target_language: ru
unit_content_key: ru.a1.unit62.florist
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_букет
    - w_классное
    - w_книжный
    - w_красивыми
    - w_красная
    - w_лента
    - w_лентой
    - w_роз
    - w_роза
    - w_розу
    - w_розы
    - w_тюльпан
    - w_цветок
    - w_цветы
templates:
- content_key: practice.zh-ru.ru.a1.unit62.lesson01.choose.001
  lesson_content_key: ru.a1.unit62.lesson01.davay_skhodim_v_tsvetochnyy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_классное
        - w_цветок
        - w_букет
        - w_роза
        - w_красная
        - w_розу
        - w_тюльпан
        - w_цветы
        - w_роз
        - w_лента
        - w_лентой
        - w_розы
        - w_красивыми
        - w_книжный
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“我们去花店好吗？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit62.lesson02.listen.001
  lesson_content_key: ru.a1.unit62.lesson02.buket_i_tsvet
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“花束和颜色”这一课。'
    language_code: zh
    direction: ltr
