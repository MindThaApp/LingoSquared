  lesson_content_key: ru.a1.unit36.lesson01.luk_pomidor_i_rezat
  type: fill_in_blank
  frame:
    text: У меня есть лук и {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_помидор
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_помидор
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我有一个洋葱和一个西红柿。помидор 的意思是西红柿。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit36.lesson01.translate.004
  lesson_content_key: ru.a1.unit36.lesson01.luk_pomidor_i_rezat
  type: translation
  frame:
    text: 我切洋葱和番茄。
