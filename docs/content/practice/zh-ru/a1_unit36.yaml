    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_пробуешь
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_пробуешь
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 你已经在尝了吗？пробуешь 的意思是“你尝”（非正式）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit36.lesson05.order.002
  lesson_content_key: ru.a1.unit36.lesson05.nastya_i_dima_vmeste
  type: word_order
  frame:
    text: Еда готова, и она {item}!
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_вкусная
