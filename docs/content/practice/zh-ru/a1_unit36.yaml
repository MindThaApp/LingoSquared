    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit36.lesson02.order.002
  lesson_content_key: ru.a1.unit36.lesson02.skovoroda_i_zharit
  type: word_order
  frame:
    text: У меня есть {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_сковорода
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня есть {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我有一口平底锅。сковорода 的意思是平底锅。
    language_code: zh
