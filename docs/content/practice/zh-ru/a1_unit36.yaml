schema_version: '1.0'
pack_key: practice.zh-ru.a1.unit36
source_language: zh
target_language: ru
unit_content_key: ru.a1.unit36.cooking
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_аппетита
    - w_вкусная
    - w_вкусно
    - w_готова
    - w_готовим
    - w_готовит
    - w_готовят
    - w_еда
    - w_еды
    - w_жарит
    - w_жарить
    - w_жаришь
    - w_жарю
    - w_заходи
    - w_лук
    - w_помидор
    - w_попробуй
    - w_порежем
    - w_приятного
    - w_пробовать
    - w_пробует
    - w_пробуешь
    - w_режет
    - w_режу
    - w_резать
    - w_сковорода
templates:
- content_key: practice.zh-ru.ru.a1.unit36.lesson01.choose.001
  lesson_content_key: ru.a1.unit36.lesson01.luk_pomidor_i_rezat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_лук
        - w_помидор
        - w_резать
        - w_режу
        - w_еды
        - w_сковорода
        - w_жарить
        - w_жарю
        - w_готовит
        - w_пробовать
        - w_пробует
        - w_заходи
        - w_порежем
        - w_жаришь
        - w_пробуешь
        - w_готовят
        - w_режет
        - w_жарит
        - w_еда
        - w_вкусная
        - w_готова
        - w_готовим
        - w_попробуй
        - w_вкусно
        - w_приятного
        - w_аппетита
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自关于洋葱、番茄和切菜的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit36.lesson02.listen.001
  lesson_content_key: ru.a1.unit36.lesson02.skovoroda_i_zharit
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自关于平底锅和炒菜的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit36.lesson03.translate.001
  lesson_content_key: ru.a1.unit36.lesson03.gotovit_i_probovat
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自关于准备和品尝的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit36.lesson04.match.001
  lesson_content_key: ru.a1.unit36.lesson04.na_kukhne_u_dimy
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit36.lesson05.choose.001
  lesson_content_key: ru.a1.unit36.lesson05.nastya_i_dima_vmeste
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自“娜斯佳和季马一起做饭”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit36.lesson06.translate.001
  lesson_content_key: ru.a1.unit36.lesson06.igor_prikhodit_poest
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自“伊戈尔来吃饭”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit36.lesson01.order.002
  lesson_content_key: ru.a1.unit36.lesson01.luk_pomidor_i_rezat
  type: word_order
  frame:
    text: У меня есть {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_лук
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня есть {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我有一个洋葱。лук 的意思是洋葱。
    language_code: zh
    direction: ltr
