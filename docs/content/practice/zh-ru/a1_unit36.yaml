- content_key: practice.zh-ru.ru.a1.unit36.lesson03.order.002
  lesson_content_key: ru.a1.unit36.lesson03.gotovit_i_probovat
  type: word_order
  frame:
    text: Дима {item} еду.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_пробует
  answer_derivation:
    kind: render_frame
    frame:
      text: Дима {item} еду.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 季马在尝这道菜。пробует 的意思是“他或她尝”。
    language_code: zh
