    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit36.lesson06.order.002
  lesson_content_key: ru.a1.unit36.lesson06.igor_prikhodit_poest
  type: word_order
  frame:
    text: Мы {item} еду и для тебя.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
