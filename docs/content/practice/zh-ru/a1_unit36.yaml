    kind: render_frame
    frame:
      text: Да, я режу лук, а ты {item} помидор.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 好，我来切洋葱，你来炒西红柿。жаришь 的意思是“你炒”（非正式）。
