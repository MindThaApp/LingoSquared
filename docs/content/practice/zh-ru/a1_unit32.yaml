schema_version: '1.0'
pack_key: practice.zh-ru.a1.unit32
source_language: zh
target_language: ru
unit_content_key: ru.a1.unit32.birthday
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_вечеринка
    - w_восемнадцатого
    - w_мило
    - w_начнём
    - w_отметим
    - w_отмечаем
    - w_отмечать
    - w_подарок
    - w_поздравляю
    - w_пригласишь
    - w_приглашает
    - w_приглашать
    - w_приглашаю
    - w_приглашают
    - w_приглашу
    - w_придёшь
    - w_рады
    - w_рождения
    - w_удовольствием
    - w_устраиваем
templates:
- content_key: practice.zh-ru.ru.a1.unit32.lesson01.choose.001
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_рождения
        - w_восемнадцатого
        - w_отмечать
        - w_отмечаем
        - w_вечеринка
        - w_приглашать
        - w_приглашаю
        - w_приглашают
        - w_придёшь
        - w_удовольствием
        - w_отметим
        - w_устраиваем
        - w_пригласишь
        - w_приглашу
        - w_приглашает
        - w_рады
        - w_поздравляю
        - w_подарок
        - w_мило
        - w_начнём
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“生日”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson02.listen.001
  lesson_content_key: ru.a1.unit32.lesson02.otmechat_i_vecherinka
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“庆祝与派对”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson03.translate.001
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“邀请参加派对”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson04.match.001
  lesson_content_key: ru.a1.unit32.lesson04.igor_i_dima_planiruyut
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson05.choose.001
  lesson_content_key: ru.a1.unit32.lesson05.kto_chto_delaet_dlya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“派对上谁做什么?”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson06.translate.001
  lesson_content_key: ru.a1.unit32.lesson06.vecherinka_v_yazykovom_kafe
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一,出自“语言咖啡馆的派对”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson01.order.002
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: word_order
  frame:
    text: Мой день {item} восемнадцатого апреля.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_рождения
  answer_derivation:
    kind: render_frame
    frame:
      text: Мой день {item} восемнадцатого апреля.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我的生日是四月十八日。рождения 的意思是“出生”（生日一词中的二格形式）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson01.fill.003
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: fill_in_blank
  frame:
    text: День рождения Лены в субботу, {item} апреля. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_восемнадцатого
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_восемнадцатого
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 列娜的生日是四月十八日，星期六。Лены 是 Лена 的二格（生格），表示所属：день рождения Лены，不需要表示“的”的词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson02.order.002
  lesson_content_key: ru.a1.unit32.lesson02.otmechat_i_vecherinka
  type: word_order
  frame:
    text: Мы {item} день рождения Лены.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_отмечаем
  answer_derivation:
    kind: render_frame
    frame:
      text: Мы {item} день рождения Лены.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我们在庆祝列娜的生日。отмечаем 的意思是“我们庆祝”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson03.order.002
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: word_order
  frame:
    text: Я {item} тебя.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_приглашаю
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} тебя.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我邀请你。приглашаю 的意思是“我邀请”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson03.fill.003
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: fill_in_blank
  frame:
    text: Ты {item} на вечеринку? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_придёшь
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_придёшь
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 你来参加聚会吗？придёшь 的意思是“你将来到”（非正式）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson03.translate.004
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: translation
  frame:
    text: 好的，我很乐意来！
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_удовольствием
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, я с {item} приду!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 好的，我很乐意来！удовольствием 的意思是“愉快、乐意”，用在“с”（带着）之后，表示“乐意地”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson04.order.002
  lesson_content_key: ru.a1.unit32.lesson04.igor_i_dima_planiruyut
  type: word_order
  frame:
    text: Да, давайте {item}!
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_отметим
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, давайте {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 好，我们来庆祝吧！отметим 的意思是“我们来庆祝”；“我们将庆祝”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson04.fill.003
  lesson_content_key: ru.a1.unit32.lesson04.igor_i_dima_planiruyut
  type: fill_in_blank
  frame:
    text: Да, я {item} Настю. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_приглашу
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_приглашу
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 好的，我会邀请娜斯佳。приглашу 的意思是“我将邀请”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson05.order.002
  lesson_content_key: ru.a1.unit32.lesson05.kto_chto_delaet_dlya
  type: word_order
  frame:
    text: Дима {item} Игоря и Настю на вечеринку.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_приглашает
  answer_derivation:
    kind: render_frame
    frame:
      text: Дима {item} Игоря и Настю на вечеринку.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 季马邀请伊戈尔和娜斯佳参加聚会。приглашает 的意思是“（他或她）邀请”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit32.lesson05.fill.003
  lesson_content_key: ru.a1.unit32.lesson05.kto_chto_delaet_dlya
  type: fill_in_blank
  frame:
    text: Все {item} за Лену. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_рады
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_рады
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 大家都为列娜高兴。рады 的意思是“高兴”（复数）。
    language_code: zh
    direction: ltr
