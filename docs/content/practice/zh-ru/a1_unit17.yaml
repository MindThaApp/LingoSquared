templates:
- content_key: practice.zh-ru.ru.a1.unit17.lesson01.choose.001
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 俄语的职业名称如 врач 或 инженер 前面不需要加表示“一个”的词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson01.match.002
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 说职业时直接用名词：Я врач 的意思是“我是医生”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson01.order.003
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: word_order
  frame:
    text: Он {item} в офисе.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Он {item} в офисе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Работает 是 работать（工作）的“他／她”形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson01.fill.004
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: fill_in_blank
  frame:
    text: Я работаю в {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在表示“在……里／在……”的 в 之后，名词要用前置格词尾 -е：больница 变成 больнице。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson01.fill.005
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: fill_in_blank
  frame:
    text: Он инженер. Он работает в {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Офис 在 в 之后用前置格词尾 -е：в офисе。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson01.translate.006
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: translation
  frame:
    text: 我是医生。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 职业名称前不需要加表示“一个”的词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson01.translate.007
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: translation
  frame:
    text: 他在办公室工作。
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Он работает в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: в 加前置格词尾 -е 用来回答“在哪里”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson01.translate.008
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: translation
  frame:
    text: 她是老师。她在学校工作。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Она учитель. Она работает в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Школа 在 в 之后变成 школе，意为“在学校”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson01.translate.009
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: врач 和 инженер 这类职业名称，男女用同一个形式：Она врач。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson02.choose.001
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Кем ты работаешь? 字面意思是“你以谁的身份工作”，这是俄罗斯人询问职业的方式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson02.order.002
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: word_order
  frame:
    text: Кем ты {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Кем ты {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Работаешь 是 работать 对应非正式 ты 的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson02.fill.003
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: fill_in_blank
  frame:
    text: Кем ты {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ты 对应的词尾 -ешь 表示“你”在工作，是非正式说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson02.fill.004
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: fill_in_blank
  frame:
    text: Он повар. Он работает в {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ресторан 在 в 之后用前置格词尾 -е：в ресторане。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson02.translate.005
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: translation
  frame:
    text: 你做什么工作？（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Кем ты {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кем 用来询问某人的职业，ты 表示这是非正式的问法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson02.translate.006
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: translation
  frame:
    text: 我在商店工作。
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Я работаю в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: магазин 在 в 后变成 магазине，表示“在商店里”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson02.translate.007
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: translation
  frame:
    text: 她是厨师。她在餐厅工作。
    language_code: zh
    direction: ltr
  slots:
    a: *id012
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Она {a}. Она работает в {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 即使指女性，повар 的形式仍是阳性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit17.lesson01.listen.010
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 这些表示职业和工作场所的名词前不需要加任何冠词一类的词。
    language_code: zh
    direction: ltr
