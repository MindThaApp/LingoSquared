  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: word_order
  frame:
    text: Мой {item} рядом с супермаркетом.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_район
  answer_derivation:
    kind: render_frame
    frame:
      text: Мой {item} рядом с супермаркетом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我住的街区离超市很近。район 的意思是街区。
    language_code: zh
    direction: ltr
