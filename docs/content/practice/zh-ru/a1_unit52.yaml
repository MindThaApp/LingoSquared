schema_version: '1.0'
pack_key: practice.zh-ru.a1.unit52
source_language: zh
target_language: ru
unit_content_key: ru.a1.unit52.park
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_воде
    - w_дерево
    - w_зелёная
    - w_пикник
    - w_плавают
    - w_поводке
    - w_прогулка
    - w_рынке
    - w_скамейка
    - w_собаки
    - w_солнечный
    - w_сядем
    - w_табличка
    - w_трава
    - w_устроим
    - w_утка
    - w_утки
    - w_фрукты
    - w_холодная
templates:
- content_key: practice.zh-ru.ru.a1.unit52.lesson01.choose.001
  lesson_content_key: ru.a1.unit52.lesson01.poydyom_v_park
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_прогулка
        - w_дерево
        - w_трава
        - w_зелёная
        - w_утка
        - w_воде
        - w_холодная
        - w_утки
        - w_плавают
        - w_табличка
        - w_солнечный
        - w_собаки
        - w_поводке
        - w_устроим
        - w_пикник
        - w_фрукты
        - w_сядем
        - w_скамейка
        - w_рынке
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“我们去公园好吗？”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit52.lesson02.listen.001
  lesson_content_key: ru.a1.unit52.lesson02.derevya_i_trava
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“树和草地”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit52.lesson03.translate.001
  lesson_content_key: ru.a1.unit52.lesson03.utki_u_vody
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“水边的鸭子”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit52.lesson04.match.001
  lesson_content_key: ru.a1.unit52.lesson04.tablichka_u_vkhoda
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit52.lesson05.choose.001
  lesson_content_key: ru.a1.unit52.lesson05.piknik_v_parke
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“公园里的野餐”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit52.lesson06.translate.001
  lesson_content_key: ru.a1.unit52.lesson06.dima_nina_i_nastya
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语，来自“公园之后的 Дима、Нина 和 Настя”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit52.lesson02.order.002
  lesson_content_key: ru.a1.unit52.lesson02.derevya_i_trava
  type: word_order
  frame:
    text: Я вижу большое {item} и зелёную траву.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_дерево
  answer_derivation:
    kind: render_frame
    frame:
      text: Я вижу большое {item} и зелёную траву.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我看见一棵大树和绿色的草。дерево 的意思是“树”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit52.lesson03.order.002
  lesson_content_key: ru.a1.unit52.lesson03.utki_u_vody
  type: word_order
  frame:
    text: Утка плавает в {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_воде
  answer_derivation:
    kind: render_frame
    frame:
      text: Утка плавает в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 鸭子在水里游。воде 的意思是“水”（用在表示“在……里”的 в 之后）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit52.lesson03.fill.003
  lesson_content_key: ru.a1.unit52.lesson03.utki_u_vody
  type: fill_in_blank
  frame:
    text: Смотри, {item} плавают в воде! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_утки
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_утки
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 看，鸭子在水里游！утки 的意思是“鸭子”（复数）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit52.lesson05.order.002
  lesson_content_key: ru.a1.unit52.lesson05.piknik_v_parke
  type: word_order
  frame:
    text: Я покупаю {item} на рынке.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_фрукты
  answer_derivation:
    kind: render_frame
    frame:
      text: Я покупаю {item} на рынке.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我在市场买水果。фрукты 的意思是“水果”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit52.lesson05.fill.003
  lesson_content_key: ru.a1.unit52.lesson05.piknik_v_parke
  type: fill_in_blank
