templates:
- content_key: practice.zh-ru.ru.a1.unit09.lesson01.choose.001
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Где 表示“哪里”，находится 表示“位于”；合在一起就是询问某个地方的位置。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson01.order.002
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: word_order
  frame:
    text: Где {item} магазин?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Где {item} магазин?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Находится 是“他/她/它”形式的动词，所以与 магазин 这样的单数名词搭配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson01.fill.003
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: fill_in_blank
  frame:
    text: Магазин на Тверской {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在表示“在……上”的 на 之后，улица 变成 улице，表示事物所在的位置。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson01.translate.004
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: translation
  frame:
    text: 药店在哪里？
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Где находится ...? 是询问某地在哪里的标准说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson01.translate.005
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Где 表示“哪里”，улица 是“街道”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson02.choose.001
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Банк、вокзал 和 ресторан 是阳性；аптека、гостиница 和 библиотека 是阴性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson02.listen.002
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 这些地点名称都是名词，Где находится банк? 中名词前不需要再加任何别的词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson02.match.003
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Банк 和 ресторан 是国际通用的外来词，аптека 则源自希腊语，都不难记。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson02.order.004
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: word_order
  frame:
    text: Где находится {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Где находится ...? 适用于任何单数的地点名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson02.fill.005
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: fill_in_blank
  frame:
    text: Банк на улице {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 以人名命名的街道，人名要用生格：улица Пушкина 就是普希金街。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson02.translate.006
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: translation
  frame:
    text: 旅馆在哪里？
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Гостиница 是阴性名词，意思是“旅馆”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson03.choose.001
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Вашей 和 моей 是 ваш 和 мой 在 на 之后使用的阴性形式：на вашей улице，на моей улице。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson03.order.002
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: word_order
  frame:
    text: Что есть на {item} улице?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вашей 与阴性的 улице 一致；这是用 вы 的敬称问句。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson03.fill.003
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: fill_in_blank
  frame:
    text: На {item} улице есть банк. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Моей 是 моя 在 на 之后的形式，因为 улица 是阴性且用前置格。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson03.fill.004
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: fill_in_blank
  frame:
    text: Спасибо {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Спасибо большое 是表达“非常感谢”的亲切说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson03.translate.005
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: 您的街上有什么？（敬称）
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что есть на вашей улице? 询问街上有什么；вы 的形式 вашей 使问句显得有礼貌。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson03.translate.006
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: 非常感谢。
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Спасибо {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Большое 与中性的 спасибо 一致，所以以 -ое 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit09.lesson03.translate.007
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: 我的街上有一家银行。
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} улице есть банк.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня есть 表示“拥有”；表示某物位于街上时，俄语用 На моей улице есть。
    language_code: zh
    direction: ltr
