templates:
- content_key: practice.zh-ru.ru.a1.unit04.lesson01.choose.001
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 俄语的星期名称用小写字母书写，现在时不需要动词：Сегодня суббота 的意思是“今天是星期六”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson01.listen.002
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Среда、пятница 和 суббота 是阴性名词，其他星期名称是阳性或中性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson01.match.003
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 俄语的星期名称不大写：понедельник、вторник、среда。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson01.order.004
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: word_order
  frame:
    text: Сегодня {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 俄语在现在时中省略动词“是”，所以 Сегодня суббота 就是“今天”加星期几。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson01.fill.005
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: fill_in_blank
  frame:
    text: Какой {item} день? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Какой 与阳性名词 день 保持一致，所以后面询问日期时，要用 какое 搭配中性名词 число。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson01.translate.006
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 俄语的星期名称不用大写字母。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson01.translate.007
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: 今天星期几？
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Какой {item} день?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Какой сегодня день? 问的是星期几；问日期则要说 Какое сегодня число?
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson02.choose.001
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 日期用中性序数词加属格的月份：десятое апреля 表示4月10日。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson02.order.002
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 序数词用中性形式（первое、третье），因为它与隐含的词 число（日期）一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson02.order.003
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня десятое {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня десятое {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 日期之后，月份要用属格：десятое января、десятое апреля、десятое октября。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson02.fill.004
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: fill_in_blank
  frame:
    text: Какое сегодня {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Число 是中性名词，所以问句用 какое；而 день 是阳性名词，用 какой。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson02.translate.005
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 日期中的序数词以 -ое 或 -ье 结尾，因为它们与中性名词 число 一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson02.translate.006
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: 今天几号？
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Какое сегодня {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Какое сегодня число? 字面意思是问今天是哪个数字。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson02.translate.007
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: 今天是1月3日。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 1月3日要说“третье января”，月份用属格。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson03.fill.001
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: fill_in_blank
  frame:
    text: Встреча {item} вторник. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 вторник 前，介词变为 во（во вторник）；在其他大多数星期名称前，只用 в。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson03.choose.002
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Встреча во вторник, девятого января 先说星期，再说日期，月份用属格。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson03.order.003
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: word_order
  frame:
    text: Встреча во вторник, {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча во вторник, {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 在日期中，序数词 девятого 也要用属格：девятого января 表示“在1月9日”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit04.lesson03.translate.004
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: translation
  frame:
    text: 会议在星期二。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча {item} вторник.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Во вторник 表示“在星期二”；во 是 в 的扩展形式，在这里使用。
    language_code: zh
    direction: ltr
