schema_version: '1.0'
pack_key: practice.zh-ru.a1.unit55
source_language: zh
target_language: ru
unit_content_key: ru.a1.unit55.zoo
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_билета
    - w_вольера
    - w_животные
    - w_жираф
    - w_зоопарке
    - w_катере
    - w_кормление
    - w_лев
    - w_львов
    - w_маленькая
    - w_обезьяна
    - w_покатаемся
    - w_прогулки
    - w_слон
    - w_тяжёлый
templates:
- content_key: practice.zh-ru.ru.a1.unit55.lesson01.choose.001
  lesson_content_key: ru.a1.unit55.lesson01.poydyom_v_zoopark
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_животные
        - w_лев
        - w_слон
        - w_тяжёлый
        - w_обезьяна
        - w_маленькая
        - w_жираф
        - w_кормление
        - w_львов
        - w_билета
        - w_вольера
        - w_катере
        - w_прогулки
        - w_зоопарке
        - w_покатаемся
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“我们去动物园吧？”那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit55.lesson02.listen.001
  lesson_content_key: ru.a1.unit55.lesson02.lev_i_slon
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于狮子和大象的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit55.lesson03.translate.001
  lesson_content_key: ru.a1.unit55.lesson03.obezyana_i_zhiraf
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于猴子和长颈鹿的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit55.lesson04.match.001
  lesson_content_key: ru.a1.unit55.lesson04.tablichka_v_zooparke
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit55.lesson05.choose.001
  lesson_content_key: ru.a1.unit55.lesson05.v_kasse_zooparka
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“在动物园售票处”那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit55.lesson06.translate.001
  lesson_content_key: ru.a1.unit55.lesson06.nina_i_dima_posle
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语之一，出自“Nina 和 Dima 逛完动物园之后”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit55.lesson04.order.002
  lesson_content_key: ru.a1.unit55.lesson04.tablichka_v_zooparke
  type: word_order
  frame:
    text: Во сколько {item}?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_кормление
  answer_derivation:
    kind: render_frame
    frame:
      text: Во сколько {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 几点喂食？кормление 的意思是“喂食”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit55.lesson04.fill.003
  lesson_content_key: ru.a1.unit55.lesson04.tablichka_v_zooparke
  type: fill_in_blank
  frame:
    text: Во сколько кормление {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_львов
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_львов
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 喂狮子是几点？львов 的意思是“狮子们的”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit55.lesson06.order.002
  lesson_content_key: ru.a1.unit55.lesson06.nina_i_dima_posle
  type: word_order
  frame:
    text: Я люблю прогулки на {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_катере
  answer_derivation:
    kind: render_frame
    frame:
      text: Я люблю прогулки на {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我喜欢坐游船。катере 的意思是“船”(用在表示“乘”的 на 之后)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit55.lesson06.fill.003
  lesson_content_key: ru.a1.unit55.lesson06.nina_i_dima_posle
  type: fill_in_blank
  frame:
    text: Как было в {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_зоопарке
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_зоопарке
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 动物园怎么样？зоопарке 的意思是“动物园”(用在表示“在”的 в 之后)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit55.lesson06.translate.004
  lesson_content_key: ru.a1.unit55.lesson06.nina_i_dima_posle
  type: translation
  frame:
    text: Dima：下周我们一起去坐游船吧？
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_покатаемся
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай на следующей неделе вместе {item} на катере?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Dima：下周我们一起去坐游船吧？покатаемся 的意思是“我们去玩一趟(乘坐)吧”。
    language_code: zh
    direction: ltr
