  type: translation
  frame:
    text: 您有治头痛的药吗？
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_головной
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть что-нибудь от {item} боли?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 你们有治头疼的药吗？головной 的意思是“头的”（阴性），用在表示“治……的”的前置词之后。
    language_code: zh
    direction: ltr
