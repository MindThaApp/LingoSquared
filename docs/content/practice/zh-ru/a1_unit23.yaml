templates:
- content_key: practice.zh-ru.ru.a1.unit23.lesson01.choose.001
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Алло 是俄罗斯人接电话或打电话时开头说的“喂”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson01.order.002
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: word_order
  frame:
    text: Пожалуйста, {item} медленно.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Пожалуйста, {item} медленно.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Говори 是非正式的命令式；礼貌（尊称）的形式是 говорите。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson01.fill.003
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: fill_in_blank
  frame:
    text: Говори {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Медленно 是副词，形式不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson01.translate.005
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: translation
  frame:
    text: 请说慢一点。（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Говори {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Медленно 的意思是“慢慢地”，只有一种形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson01.translate.006
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Говори 是非正式的命令式，用于朋友。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson02.choose.001
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Повтори 和 напиши 是非正式的命令式；礼貌（尊称）的形式以 -те 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson02.order.002
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: word_order
  frame:
    text: Пожалуйста, {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Пожалуйста, {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Повтори 是表示“重复”的非正式命令式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson02.fill.003
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: fill_in_blank
  frame:
    text: Напиши мне {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Сообщение 是中性名词，在这里形式不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson02.fill.004
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: fill_in_blank
  frame:
    text: Пожалуйста, {item} мне. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Напиши 是非正式的命令式，用于朋友。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson02.translate.005
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: translation
  frame:
    text: 请再说一遍。（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item}, пожалуйста.'
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Повтори 是对 ты 的命令式；对 вы 要说 повторите。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson02.translate.006
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: translation
  frame:
    text: 给我发条消息。（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Напиши мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне 的意思是“给我”，所以这句话是“写给我”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson02.translate.007
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Повтори 和 напиши 是非正式的命令式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson02.match.008
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 以 -и 结尾的命令式，如 говори、повтори 和 напиши，是非正式的单数形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit23.lesson02.listen.009
  lesson_content_key: ru.a1.unit23.lesson02.povtori_pozhaluysta
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Повтори、напиши 和 говори 是非正式的命令式，用于对朋友说话。
    language_code: zh
    direction: ltr
