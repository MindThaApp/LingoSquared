templates:
- content_key: practice.zh-ru.ru.a1.unit02.lesson01.choose.001
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 俄语有两个表示“你”的词：ты 用于朋友、家人、孩子和同辈，вы 用于陌生人、需要尊敬的人，或者多个人。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson01.order.002
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Как {item} зовут?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как вас зовут? 是正式的“您叫什么名字？”；字面意思是“人们怎么称呼您”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson01.order.003
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Меня зовут {name}.
    language_code: ru
    direction: ltr
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меня зовут 字面意思是“人们称呼我”，所以后面的名字保持原形。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson01.fill.004
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: fill_in_blank
  frame:
    text: Меня {item} Виктор. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Зовут 在问句和答句中都出现：Как вас зовут? 和 Меня зовут Виктор。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson01.translate.005
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: 我叫{name}。
    language_code: zh
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 俄罗斯人自我介绍时用 Меня зовут 加名字；再加上父称（如 Ирина Петровна）则更正式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson01.translate.006
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: 您叫什么名字？（正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вас 是这个问句中 вы 的正式形式；和朋友说话时问 Как тебя зовут?
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson02.choose.001
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Откуда вы? 问的是你来自哪里，回答时用 из 加地名：Я из Канады，Я из Москвы。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson02.listen.002
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Можно на ты? 是礼貌地请求从 вы 改用 ты；按惯例，通常由年长或职位较高的人提出。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson02.match.003
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ты 用于熟悉的人，вы 用于正式场合，所以在每次交谈中都要选择用哪一个。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson02.order.004
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: word_order
  frame:
    text: Я из {place}.
    language_code: ru
    direction: ltr
  slots:
    place: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Я из {place}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Из 后面要用二格，所以 Канада 变成 Канады，Москва 变成 Москвы。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson02.fill.005
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: fill_in_blank
  frame:
    text: Давайте перейдём на {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Давайте перейдём на ты 是提议不再拘礼；不过这个提议本身仍用 давайте 来礼貌地表达。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson02.translate.006
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Меня 是 я 的宾格形式，所以回答名字时说 Меня зовут，字面意思是“人们称呼我”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson02.translate.007
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: 您来自哪里？（正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Откуда {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Откуда 的意思是“从哪里”；正式的问句用 вы，回答则用 из 加地名。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson03.fill.001
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: fill_in_blank
  frame:
    text: Очень {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Очень приятно 字面意思是“非常愉快”，是听到对方名字后的标准回应。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson03.order.002
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: word_order
  frame:
    text: Давайте {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Давайте {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Давайте 加动词的“我们”形式，构成礼貌的提议：Давайте познакомимся 的意思是“我们来认识一下吧”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson03.listen.003
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Давайте познакомимся 是对用 вы 称呼的人礼貌地开始自我介绍的方式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit02.lesson03.translate.004
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: translation
  frame:
    text: 很高兴认识你。
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Очень приятно 对 ты 和 вы 都适用，因为它不直接称呼对方。
    language_code: zh
    direction: ltr
