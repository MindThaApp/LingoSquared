templates:
- content_key: practice.zh-ru.ru.a1.unit10.lesson01.choose.001
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Идите 是对“您”(вы)使用的礼貌命令式,意思是“走”;对“你”(ты)则用 иди。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson01.listen.002
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 指路时常用 потом（然后）把几个步骤连起来：Идите прямо, потом направо.
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson01.order.003
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: word_order
  frame:
    text: Как дойти до {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До 表示“到……为止”，后面接第二格（属格），所以 музей 变成 музея。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson01.fill.004
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: fill_in_blank
  frame:
    text: Идите {item}, потом направо. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прямо 表示“一直往前”，词尾不变化。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson01.translate.005
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: 我怎么走才能到博物馆？
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дойти до ...? 用来问步行怎么到某地；до 后面的地点要用第二格（属格）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson01.translate.006
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: 直走，然后向右拐。（敬称）
    language_code: zh
    direction: ltr
  slots:
    a: *id003
    b: *id004
    c: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Идите {a}, {b} {c}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Идите прямо, потом направо 是简短指路的典型句式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson02.choose.001
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Поверните 是对 вы 使用的礼貌命令式，意思是“请转弯”；налево 和 направо 说明往哪个方向。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson02.order.002
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: word_order
  frame:
    text: Поверните {item} за углом.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Поверните {item} за углом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Налево 和 направо 都可以放在 поверните 后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson02.fill.003
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Поверните налево за {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这里 за 后面接第五格（工具格），所以 угол 变成 углом：за углом 意思是“在拐角处”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson02.fill.004
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Идите два {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 2、3、4 后面的名词要用特殊形式：два квартала，而 пять кварталов。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson02.translate.005
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: 离这里远吗？
    language_code: zh
    direction: ltr
  slots:
    a: *id010
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Далеко 是“远”，отсюда 是“从这里”；Это далеко отсюда? 是常见的问句。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson02.translate.006
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Квартал 是城市里的“街区”，далеко 是“远”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson03.choose.001
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Простите 是对 вы 使用的礼貌说法，用来引起陌生人的注意，相当于“打扰一下”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson03.order.002
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: word_order
  frame:
    text: Это очень {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Это очень просто 意思是“这很简单”；不需要“是”这个动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson03.fill.003
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: fill_in_blank
  frame:
    text: Нет, пять {item} пешком. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: пять 后面的名词用复数第二格（属格）：пять минут。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson03.translate.004
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: 这很简单。
    language_code: zh
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 在 это 后面，просто 作谓语，表示“这很简单”，不需要“是”这个动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson03.translate.005
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: 步行五分钟。
    language_code: zh
    direction: ltr
  slots:
    a: *id015
    b: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Пять {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Пешком 是“步行”，минут 是 пять 后面的复数第二格（属格）形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit10.lesson03.translate.006
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прохожий 是由形容词变来的阳性名词，意思是“行人”。
    language_code: zh
    direction: ltr
