    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Рада 以 -а 结尾，因为说话人是女性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson01.fill.003
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: fill_in_blank
  frame:
    text: Мне {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Мне грустно 用 мне（对我来说），没有主语，类似汉语的“我觉得难过”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson01.translate.004
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: translation
  frame:
    text: 我很高兴。（男性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 男性说 рад，没有词尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson01.translate.005
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: translation
  frame:
    text: 我很高兴。（女性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 女性加 -а：рада。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson01.translate.006
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: translation
  frame:
    text: 我觉得难过。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне грустно 是表达“觉得难过”的常用说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson02.choose.001
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: устал 是男性说的，устала 是女性说的；потому что 的意思是“因为”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson02.order.002
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: word_order
  frame:
    text: Я {item}, потому что много работы.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}, потому что много работы.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 女性说的 устала 以 -а 结尾；потому что 引出原因。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson02.fill.003
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: fill_in_blank
  frame:
    text: Я {item}, потому что много работы. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 男性说 устал，没有词尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson02.translate.004
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: translation
  frame:
    text: 我累了。（男性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Устал 是动词 устать 的阳性过去式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson02.translate.005
  lesson_content_key: ru.a1.unit22.lesson02.ya_ustal
  type: translation
  frame:
    text: 我累了，因为有很多工作。（女性说）
    language_code: zh
    direction: ltr
  slots:
    a: *id006
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {a}, потому что много {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Много 后面接 работы，意思是“很多工作”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson03.choose.001
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Как ты себя чувствуешь? 问“你感觉怎么样”；себя 是反身代词，意思是“自己”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson03.order.002
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: word_order
  frame:
    text: Как ты {item} чувствуешь?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Как ты {item} чувствуешь?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Себя 是反身代词，对所有人称都保持不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson03.fill.003
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: fill_in_blank
  frame:
    text: Как ты себя {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Чувствуешь 是动词 чувствовать 的非正式 ты（你）形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson03.fill.004
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: fill_in_blank
  frame:
    text: Я рад, потому что завтра {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Выходной 是“休息日”；завтра（明天）放在它前面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson03.translate.005
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: translation
  frame:
    text: 你感觉怎么样?(非正式)
    language_code: zh
    direction: ltr
  slots:
    a: *id010
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Как ты {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как ты себя чувствуешь? 是询问别人感觉如何的非正式说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson03.translate.006
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: translation
  frame:
    text: 明天休息。
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Завтра {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 不需要表示“是”的词：Завтра выходной。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson03.match.007
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Рад 和 устал 是阳性形式，而 рада 和 устала 是阴性形式。
    language_code: zh
    direction: ltr
