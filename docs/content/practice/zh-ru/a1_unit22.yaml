templates:
- content_key: practice.zh-ru.ru.a1.unit22.lesson01.choose.001
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: рад 是男性说的，рада 是女性说的；грустно 是无人称用法，要和 мне 连用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit22.lesson01.order.002
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: word_order
  frame:
