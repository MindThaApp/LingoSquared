    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson03.translate.001
  lesson_content_key: ru.a1.unit28.lesson03.zanimatsya_sportom_i_lyubit
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于运动和热爱某项运动的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson04.match.001
  lesson_content_key: ru.a1.unit28.lesson04.dima_sprashivaet_o_bege
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson05.choose.001
  lesson_content_key: ru.a1.unit28.lesson05.nastya_i_lena_o
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语，出自娜斯佳和莉娜谈运动的那一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson06.translate.001
  lesson_content_key: ru.a1.unit28.lesson06.davay_vmeste_zaymyomsya_sportom
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“一起运动好吗？”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson01.order.002
  lesson_content_key: ru.a1.unit28.lesson01.futbol_yoga_beg_i
  type: word_order
  frame:
    text: Футбол это {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_спорт
  answer_derivation:
    kind: render_frame
    frame:
      text: Футбол это {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 足球是一项运动。спорт 的意思是“运动”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson01.fill.003
  lesson_content_key: ru.a1.unit28.lesson01.futbol_yoga_beg_i
  type: fill_in_blank
  frame:
    text: Дима играет в {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_футбол
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_футбол
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 迪马踢足球。футбол 的意思是“足球”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson01.translate.004
  lesson_content_key: ru.a1.unit28.lesson01.futbol_yoga_beg_i
  type: translation
  frame:
    text: 娜斯佳练瑜伽。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_йогой
  answer_derivation:
    kind: render_frame
    frame:
      text: Настя занимается {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 娜斯佳练瑜伽。йогой 的意思是“瑜伽”（用在表示“做、练”的动词之后）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson02.order.002
  lesson_content_key: ru.a1.unit28.lesson02.kak_chasto_ty_zanimaeshsya
  type: word_order
  frame:
    text: Я занимаюсь йогой два {item} в неделю.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_раза
  answer_derivation:
    kind: render_frame
    frame:
      text: Я занимаюсь йогой два {item} в неделю.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我每周练两次瑜伽。раза 的意思是“次”，用在二到四之后。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson03.order.002
  lesson_content_key: ru.a1.unit28.lesson03.zanimatsya_sportom_i_lyubit
  type: word_order
  frame:
    text: Лена любит {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_плавать
  answer_derivation:
    kind: render_frame
    frame:
      text: Лена любит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 莉娜喜欢游泳。плавать 的意思是“游泳”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson04.order.002
  lesson_content_key: ru.a1.unit28.lesson04.dima_sprashivaet_o_bege
  type: word_order
  frame:
    text: Ты часто {item}, Игорь?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_бегаешь
  answer_derivation:
    kind: render_frame
    frame:
      text: Ты часто {item}, Игорь?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 伊戈尔，你经常跑步吗？бегаешь 的意思是“你跑步”（非正式）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson04.fill.003
  lesson_content_key: ru.a1.unit28.lesson04.dima_sprashivaet_o_bege
  type: fill_in_blank
  frame:
    text: Да, я {item} два раза в неделю. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_бегаю
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_бегаю
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 是的，我每周跑两次步。бегаю 的意思是“我跑步、我慢跑”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson04.translate.004
  lesson_content_key: ru.a1.unit28.lesson04.dima_sprashivaet_o_bege
  type: translation
  frame:
    text: 在公园里，离我家很近。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_парке
  answer_derivation:
    kind: render_frame
    frame:
      text: В {item}, рядом с моим домом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 在公园里，离我家很近。парке 的意思是“公园”（用在表示“在”的词之后）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson05.order.002
  lesson_content_key: ru.a1.unit28.lesson05.nastya_i_lena_o
  type: word_order
  frame:
    text: Лена часто {item}, почти каждую неделю.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_плавает
  answer_derivation:
    kind: render_frame
    frame:
      text: Лена часто {item}, почти каждую неделю.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 莉娜经常游泳，几乎每周都游。плавает 的意思是“游泳”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson06.order.002
  lesson_content_key: ru.a1.unit28.lesson06.davay_vmeste_zaymyomsya_sportom
  type: word_order
  frame:
    text: Давай вместе {item} спортом?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_займёмся
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай вместе {item} спортом?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我们一起锻炼好吗？займёмся 的意思是“让我们开始做；我们将开始做（某项活动）”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson06.fill.003
  lesson_content_key: ru.a1.unit28.lesson06.davay_vmeste_zaymyomsya_sportom
  type: fill_in_blank
  frame:
    text: Давай говорят {item}, а давайте говорят нескольким людям или на Вы. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_другу
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_другу
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Давай 用于一位朋友（非正式的 ты）；давайте 用于几个人或礼貌的 Вы。沿用了“计划”单元中提出建议的同一结构。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit28.lesson06.translate.004
  lesson_content_key: ru.a1.unit28.lesson06.davay_vmeste_zaymyomsya_sportom
  type: translation
  frame:
    text: 我更想踢足球。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_поиграл
  answer_derivation:
    kind: render_frame
    frame:
      text: Я бы лучше {item} в футбол.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我更想踢足球。поиграл 的意思是“玩了一会儿”（阳性）。
    language_code: zh
    direction: ltr
