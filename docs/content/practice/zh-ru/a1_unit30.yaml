schema_version: '1.0'
pack_key: practice.zh-ru.a1.unit30
source_language: zh
target_language: ru
unit_content_key: ru.a1.unit30.technology
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_вижу
    - w_звонит
    - w_знаешь
    - w_интернет
    - w_искать
    - w_ищет
    - w_ищу
    - w_каждое
    - w_компьютер
    - w_компьютером
    - w_назвать
    - w_отправлю
    - w_отправляет
    - w_отправлять
    - w_парк
    - w_побегаю
    - w_погоды
    - w_поиграю
    - w_поищу
    - w_пользоваться
    - w_пользуется
    - w_пользуешься
    - w_пользуюсь
    - w_поплаваю
    - w_приду
    - w_приложение
    - w_прогноза
    - w_солнечно
    - w_телефоном
    - w_уже
    - w_читает
templates:
- content_key: practice.zh-ru.ru.a1.unit30.lesson01.choose.001
  lesson_content_key: ru.a1.unit30.lesson01.telefon_kompyuter_i_internet
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_пользоваться
        - w_пользуюсь
        - w_телефоном
        - w_компьютер
        - w_пользуется
        - w_компьютером
        - w_интернет
        - w_приложение
        - w_прогноза
        - w_погоды
        - w_отправлю
        - w_отправлять
        - w_отправляет
        - w_читает
        - w_искать
        - w_ищу
        - w_ищет
        - w_поищу
        - w_солнечно
        - w_вижу
        - w_уже
        - w_знаешь
        - w_назвать
        - w_звонит
        - w_каждое
        - w_пользуешься
        - w_побегаю
        - w_поиграю
        - w_поплаваю
        - w_приду
        - w_парк
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于手机、电脑和互联网的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson02.listen.001
  lesson_content_key: ru.a1.unit30.lesson02.prilozhenie_i_otpravka_soobshcheniya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于应用程序和发送消息的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson03.translate.001
  lesson_content_key: ru.a1.unit30.lesson03.ishchem_chto_to
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于查找信息的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson04.match.001
  lesson_content_key: ru.a1.unit30.lesson04.nastya_otpravlyaet_soobshchenie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson05.choose.001
  lesson_content_key: ru.a1.unit30.lesson05.kto_chem_polzuetsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自“谁使用什么”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson06.translate.001
  lesson_content_key: ru.a1.unit30.lesson06.do_subboty_v_parke
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自“周六公园见！”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson01.order.002
  lesson_content_key: ru.a1.unit30.lesson01.telefon_kompyuter_i_internet
  type: word_order
  frame:
    text: Я {item} телефоном.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_пользуюсь
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} телефоном.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我用手机。пользуюсь 的意思是“我使用”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson01.fill.003
  lesson_content_key: ru.a1.unit30.lesson01.telefon_kompyuter_i_internet
  type: fill_in_blank
  frame:
    text: Я каждый день пользуюсь {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_телефоном
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_телефоном
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我每天都用手机。Каждый день（每天）再次出现：Я каждый день пользуюсь телефоном。跟在 пользоваться 后面的东西要用五格（工具格）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson01.translate.004
  lesson_content_key: ru.a1.unit30.lesson01.telefon_kompyuter_i_internet
  type: translation
  frame:
    text: 娜斯佳用电脑。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_пользуется
  answer_derivation:
    kind: render_frame
    frame:
      text: Настя {item} компьютером.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 娜斯佳用电脑。пользуется 的意思是“（他或她）使用”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson02.order.002
  lesson_content_key: ru.a1.unit30.lesson02.prilozhenie_i_otpravka_soobshcheniya
  type: word_order
  frame:
    text: У меня есть {item} для прогноза погоды.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_приложение
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня есть {item} для прогноза погоды.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我有一个查天气预报的应用。приложение 的意思是“应用程序”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson02.fill.003
  lesson_content_key: ru.a1.unit30.lesson02.prilozhenie_i_otpravka_soobshcheniya
  type: fill_in_blank
  frame:
    text: Я ищу прогноз {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_погоды
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_погоды
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我查天气预报。погоды 的意思是“天气”（二格，用在“天气预报”中）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson02.translate.004
  lesson_content_key: ru.a1.unit30.lesson02.prilozhenie_i_otpravka_soobshcheniya
  type: translation
  frame:
    text: 我通过应用程序发一条消息。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_отправлю
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} сообщение через приложение.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我会通过应用发消息。отправлю 的意思是“我将发送”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson03.order.002
  lesson_content_key: ru.a1.unit30.lesson03.ishchem_chto_to
  type: word_order
  frame:
    text: Я {item} прогноз погоды.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_ищу
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} прогноз погоды.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我查天气预报。ищу 的意思是“我正在找”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson03.fill.003
  lesson_content_key: ru.a1.unit30.lesson03.ishchem_chto_to
  type: fill_in_blank
  frame:
    text: Игорь {item} прогноз погоды. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_ищет
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_ищет
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 伊戈尔查天气预报。ищет 的意思是“（他）找、查”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson04.order.002
  lesson_content_key: ru.a1.unit30.lesson04.nastya_otpravlyaet_soobshchenie
  type: word_order
  frame:
    text: В субботу {item}!
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags:
        semantic: w_солнечно
  answer_derivation:
    kind: render_frame
    frame:
      text: В субботу {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 星期六是晴天！Солнечно 是表示天气的词。这里不需要动词“是”：В субботу солнечно。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson05.order.002
  lesson_content_key: ru.a1.unit30.lesson05.kto_chem_polzuetsya
  type: word_order
  frame:
    text: Игорь {item} утро ищет прогноз погоды.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_каждое
  answer_derivation:
    kind: render_frame
    frame:
      text: Игорь {item} утро ищет прогноз погоды.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 伊戈尔每天早上查天气预报。каждое 的意思是“每”（中性）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit30.lesson06.order.002
  lesson_content_key: ru.a1.unit30.lesson06.do_subboty_v_parke
  type: word_order
  frame:
    text: Я лучше {item}, но тоже приду в парк.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_поплаваю
  answer_derivation:
    kind: render_frame
    frame:
      text: Я лучше {item}, но тоже приду в парк.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我更想去游泳，但我也会来公园。Я лучше поплаваю 的意思是“我还是去游泳比较好”。动词前的 Лучше 表示更想做某事。
    language_code: zh
    direction: ltr
