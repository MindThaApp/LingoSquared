templates:
- content_key: practice.zh-ru.ru.a1.unit16.lesson01.choose.001
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: У меня болит 加上身体部位，表示该部位疼；疼的部位是 болит 的主语。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson01.order.002
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: word_order
  frame:
    text: У меня болит {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 无论身体部位是阴性、阳性还是中性，Болит 的形式都不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson01.fill.003
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: fill_in_blank
  frame:
    text: У меня болит {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 俄语说“在我这儿 疼 头”，而不是“我头疼”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson01.translate.004
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: translation
  frame:
    text: 我肚子痛。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Живот 是阳性名词，但 болит 不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson01.translate.005
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: translation
  frame:
    text: 我喉咙痛。
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня 加 болит 是描述症状的日常说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson02.choose.001
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мне плохо 泛指“我不舒服”，мне 的意思是“对我而言”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson02.order.002
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: word_order
  frame:
    text: Мне {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне плохо 表达身体感受，用的是“对我而言”，而不是“我”作主语。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson02.fill.003
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: fill_in_blank
  frame:
    text: У меня {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У меня 加 температура 的意思是“我发烧了”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson02.translate.004
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: 我感冒了。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня 加名词也可用于说明疾病，例如 У меня простуда。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson02.translate.005
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: 我不舒服。（两个词）
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне плохо 描述的是整体感觉，而不是某个具体的疼痛。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson02.translate.006
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Температура 可以表示“温度”或“发烧”，取决于上下文。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson02.match.007
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Болит 是动词，意思是“疼”；голова、живот 和 горло 这些身体部位是疼的对象。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson03.choose.001
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: много воды 中用的是 воды，即 вода 在 много 之后的形式，意思是“很多水”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson03.order.002
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: word_order
  frame:
    text: Вам нужно {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам нужно {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вам нужно 加动词不定式表示“您需要做某事”；вам 是敬称的“您”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson03.fill.003
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: fill_in_blank
  frame:
    text: Да, и {item} температура. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ещё 用来在前面所说的内容之外再补充一点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson03.fill.004
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: fill_in_blank
  frame:
    text: Вам {item} отдыхать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Вам нужно 加动词不定式，即“您需要……”，是医生给出的礼貌建议。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson03.translate.005
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: translation
  frame:
    text: 您需要休息。（敬称）
    language_code: zh
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам {item} отдыхать.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вам 是敬称的“您”，医生对病人使用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit16.lesson03.translate.006
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: translation
  frame:
    text: 您需要多喝水。（敬称）
    language_code: zh
    direction: ltr
  slots:
    a: *id016
    b: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам нужно пить {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 在 много 之后，名词要用 воды 这种形式，表示“很多水”。
    language_code: zh
    direction: ltr
