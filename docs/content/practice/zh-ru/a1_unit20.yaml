- content_key: practice.zh-ru.ru.a1.unit20.lesson01.choose.001
  lesson_content_key: ru.a1.unit20.lesson01.segodnya_holodno
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Холодно 和 тепло 用来描述天气，不需要表示“是”的词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit20.lesson01.order.002
