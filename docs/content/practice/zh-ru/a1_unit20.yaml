      language_code: ru
      direction: ltr
  feedback_frame:
    text: 俄语的天气表达用不带主语的副词：Сегодня холодно。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit20.lesson01.fill.003
