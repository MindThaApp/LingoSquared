    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit20.lesson01.translate.004
  lesson_content_key: ru.a1.unit20.lesson01.segodnya_holodno
  type: translation
  frame:
    text: 今天很冷。
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 这里没有表示“是”的词：Сегодня холодно。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit20.lesson01.translate.005
  lesson_content_key: ru.a1.unit20.lesson01.segodnya_holodno
  type: translation
  frame:
    text: 家里很暖和。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Дома {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дома 意为“在家”，是固定的副词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit20.lesson02.choose.001
  lesson_content_key: ru.a1.unit20.lesson02.idet_dozhd
