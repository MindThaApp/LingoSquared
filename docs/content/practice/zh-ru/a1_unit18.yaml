templates:
- content_key: practice.zh-ru.ru.a1.unit18.lesson01.choose.001
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Квартира、кухня 和 спальня 是以 -а 或 -я 结尾的阴性名词；кровать 也是阴性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson01.match.002
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 房间和家具直接用名词表示，前面不需要加任何冠词一类的词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson01.order.003
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: word_order
  frame:
    text: На {item} стол.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} стол.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: на 加上前置格词尾 -е 表示事物所在的位置：на кухне，在厨房里。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson01.fill.004
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: fill_in_blank
  frame:
    text: Это моя {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Квартира 是阴性名词，所以用 моя。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson01.fill.005
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: fill_in_blank
  frame:
    text: В {item} кровать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 в 后面，名词要用前置格词尾 -е。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson01.translate.006
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: translation
  frame:
    text: 这是我的公寓。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Это моя {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Моя 与阴性名词 квартира 搭配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson01.translate.007
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: translation
  frame:
    text: 厨房里有一张桌子。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} есть стол.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: “有……”用 есть，俄语先说地点，最后说新出现的事物；кухня 搭配 на，而不是 в：на кухне。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson02.choose.001
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Гостиная 和 ванная 是作名词用的阴性形容词，所以词尾是 -ая。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson02.order.002
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: word_order
  frame:
    text: Диван в {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Диван в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Гостиная 在 в 后面变成 гостиной，意思是“在客厅里”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson02.fill.003
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: fill_in_blank
  frame:
    text: Это {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ванная 是作名词用的阴性形容词，所以原形以 -ая 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson02.translate.004
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: translation
  frame:
    text: 沙发在客厅里。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Диван в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: В 加 гостиной 表示“在客厅里”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson02.translate.005
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: translation
  frame:
    text: 这是浴室。
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Это 用来介绍事物：Это ванная。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson03.choose.001
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Живу 是 я 的形式，живёшь 是 ты 的形式，动词原形是 жить，意思是“居住”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson03.order.002
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: word_order
  frame:
    text: Я {item} в квартире.
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в квартире.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Живу 是 жить 的“我”形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson03.fill.003
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: fill_in_blank
  frame:
    text: Сколько комнат в {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 в 后面，квартира 变成 квартире。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson03.translate.004
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: 你住在哪里？（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Где ты {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ты 表示非正式的提问。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson03.translate.005
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: 我住在公寓里。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в квартире.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я живу 是 жить 的“我”形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit18.lesson03.translate.006
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: 我有两个房间。
    language_code: zh
    direction: ltr
  slots:
    a: *id013
    b: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 在 две（二）后面，名词用 комнаты 这个形式。
    language_code: zh
    direction: ltr
