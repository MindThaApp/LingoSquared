schema_version: '1.0'
pack_key: practice.zh-ru.a1.unit53
source_language: zh
target_language: ru
unit_content_key: ru.a1.unit53.gym
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_абонемент
    - w_беговая
    - w_гантели
    - w_гантелями
    - w_десяти
    - w_дорожка
    - w_дорожке
    - w_занятие
    - w_инструктор
    - w_конечно
    - w_пляж
    - w_поднимаю
    - w_разовый
    - w_расписание
    - w_спортзал
    - w_хожу
    - w_хотим
    - w_человека
templates:
- content_key: practice.zh-ru.ru.a1.unit53.lesson01.choose.001
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_спортзал
        - w_хожу
        - w_абонемент
        - w_беговая
        - w_дорожка
        - w_дорожке
        - w_гантели
        - w_поднимаю
        - w_гантелями
        - w_занятие
        - w_инструктор
        - w_расписание
        - w_десяти
        - w_разовый
        - w_хотим
        - w_конечно
        - w_человека
        - w_пляж
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“我们去健身房好吗?”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson02.listen.001
  lesson_content_key: ru.a1.unit53.lesson02.oborudovanie_v_sportzale
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“健身房的器材”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson03.translate.001
  lesson_content_key: ru.a1.unit53.lesson03.zanyatie_yogoy
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“瑜伽课”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson04.match.001
  lesson_content_key: ru.a1.unit53.lesson04.raspisanie_na_stoyke_registratsii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson05.choose.001
  lesson_content_key: ru.a1.unit53.lesson05.na_stoyke_registratsii_sportzala
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自“健身房前台”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson06.translate.001
  lesson_content_key: ru.a1.unit53.lesson06.dima_i_nina_posle
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自“健身房之后的季玛和尼娜”这一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson01.order.002
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: word_order
  frame:
    text: Рынок был хороший, а теперь я хочу пойти в {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_спортзал
  answer_derivation:
    kind: render_frame
    frame:
      text: Рынок был хороший, а теперь я хочу пойти в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 市场很不错,现在我想去健身房。спортзал 的意思是“健身房”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson01.fill.003
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: fill_in_blank
  frame:
    text: Я {item} в спортзал. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_хожу
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_хожу
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我去健身房。хожу 的意思是“我去(经常、步行)”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson01.translate.004
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: translation
  frame:
    text: 我在健身房办了会员卡。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_абонемент
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} в спортзал.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我在健身房办了会员卡。абонемент 的意思是“会员卡、月卡”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson02.order.002
  lesson_content_key: ru.a1.unit53.lesson02.oborudovanie_v_sportzale
  type: word_order
  frame:
    text: Я бегаю на беговой {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_дорожке
  answer_derivation:
    kind: render_frame
    frame:
      text: Я бегаю на беговой {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我在跑步机上跑步。дорожке 的意思是“跑道、跑步机”(用在表示“在……上”的词之后)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson02.fill.003
  lesson_content_key: ru.a1.unit53.lesson02.oborudovanie_v_sportzale
  type: fill_in_blank
  frame:
    text: Я поднимаю {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_гантели
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_гантели
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我举哑铃。гантели 的意思是“哑铃”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson02.translate.004
  lesson_content_key: ru.a1.unit53.lesson02.oborudovanie_v_sportzale
  type: translation
  frame:
    text: 我用跑步机和哑铃锻炼。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_гантелями
  answer_derivation:
    kind: render_frame
    frame:
      text: Я занимаюсь на беговой дорожке и с {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我用跑步机和哑铃锻炼。гантелями 的意思是“哑铃”(用在表示“用……”的词之后)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson03.order.002
  lesson_content_key: ru.a1.unit53.lesson03.zanyatie_yogoy
  type: word_order
  frame:
    text: Во сколько начинается {item} йогой?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_занятие
  answer_derivation:
    kind: render_frame
    frame:
      text: Во сколько начинается {item} йогой?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 瑜伽课几点开始?занятие 的意思是“课、课程”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson04.order.002
  lesson_content_key: ru.a1.unit53.lesson04.raspisanie_na_stoyke_registratsii
  type: word_order
  frame:
    text: Я читаю {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_расписание
  answer_derivation:
    kind: render_frame
    frame:
      text: Я читаю {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我看课程表。расписание 的意思是“时间表、课程表”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit53.lesson06.order.002
  lesson_content_key: ru.a1.unit53.lesson06.dima_i_nina_posle
  type: word_order
  frame:
    text: Я люблю ходить на {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_пляж
  answer_derivation:
    kind: render_frame
    frame:
      text: Я люблю ходить на {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我喜欢去海滩。пляж 的意思是“海滩”。
    language_code: zh
    direction: ltr
