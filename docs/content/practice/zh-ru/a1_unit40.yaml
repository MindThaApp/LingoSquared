schema_version: '1.0'
pack_key: practice.zh-ru.a1.unit40
source_language: zh
target_language: ru
unit_content_key: ru.a1.unit40.emergencies
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_библиотеке
    - w_внимание
    - w_выход
    - w_выходу
    - w_запасной
    - w_запасному
    - w_звоню
    - w_иди
    - w_номер
    - w_номеру
    - w_пожар
    - w_пожарные
    - w_пожарным
    - w_позвони
    - w_полиция
    - w_помощь
    - w_скорая
    - w_скорую
    - w_случилось
    - w_экстренному
    - w_экстренный
templates:
- content_key: practice.zh-ru.ru.a1.unit40.lesson01.choose.001
  lesson_content_key: ru.a1.unit40.lesson01.pomoshch_i_pozhar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_помощь
        - w_пожар
        - w_экстренный
        - w_номер
        - w_позвони
        - w_экстренному
        - w_номеру
        - w_запасной
        - w_выход
        - w_полиция
        - w_звоню
        - w_скорая
        - w_скорую
        - w_пожарные
        - w_пожарным
        - w_внимание
        - w_запасному
        - w_выходу
        - w_иди
        - w_библиотеке
        - w_случилось
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自关于求助和火灾的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit40.lesson02.listen.001
  lesson_content_key: ru.a1.unit40.lesson02.ekstrennyy_nomer_i_zapasnoy
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自关于紧急电话号码和紧急出口的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit40.lesson03.translate.001
  lesson_content_key: ru.a1.unit40.lesson03.politsiya_skoraya_pomoshch_ili
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇,出自关于警察、救护车或消防队的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit40.lesson04.match.001
  lesson_content_key: ru.a1.unit40.lesson04.pozhar_v_yazykovom_kafe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit40.lesson05.choose.001
  lesson_content_key: ru.a1.unit40.lesson05.chitaem_tekst_o_pozhare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇之一，出自“阅读关于火灾的文章”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit40.lesson06.translate.001
  lesson_content_key: ru.a1.unit40.lesson06.igor_prikhodit
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇，出自“伊戈尔到达”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit40.lesson01.order.002
  lesson_content_key: ru.a1.unit40.lesson01.pomoshch_i_pozhar
  type: word_order
  frame:
    text: Мне нужна {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_помощь
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне нужна {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我需要帮助。помощь的意思是“帮助”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit40.lesson02.order.002
  lesson_content_key: ru.a1.unit40.lesson02.ekstrennyy_nomer_i_zapasnoy
  type: word_order
  frame:
    text: Позвони по {item} номеру!
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_экстренному
  answer_derivation:
    kind: render_frame
    frame:
      text: Позвони по {item} номеру!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 拨打紧急电话号码！экстренному的意思是“紧急的”（阳性，与格），如“拨打紧急号码”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit40.lesson02.fill.003
  lesson_content_key: ru.a1.unit40.lesson02.ekstrennyy_nomer_i_zapasnoy
  type: fill_in_blank
  frame:
    text: Где {item} выход? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_запасной
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_запасной
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 紧急出口在哪里？запасной的意思是“应急的”（阳性），如“应急出口”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit40.lesson03.order.002
  lesson_content_key: ru.a1.unit40.lesson03.politsiya_skoraya_pomoshch_ili
  type: word_order
  frame:
    text: Я {item} в полицию.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_звоню
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в полицию.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我给警察打电话。звоню的意思是“我打电话”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit40.lesson03.fill.003
  lesson_content_key: ru.a1.unit40.lesson03.politsiya_skoraya_pomoshch_ili
  type: fill_in_blank
  frame:
    text: Полиция, {item} помощь или пожарные? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_скорая
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_скорая
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 警察、救护车还是消防队？统一紧急号码112可以接通警察、救护车或消防部门。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit40.lesson03.translate.004
  lesson_content_key: ru.a1.unit40.lesson03.politsiya_skoraya_pomoshch_ili
  type: translation
  frame:
    text: 我叫救护车。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_скорую
  answer_derivation:
    kind: render_frame
    frame:
      text: Я звоню в {item} помощь.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我叫救护车。скорую的意思是“快的”（阴性，宾格），如“叫救护车”。
    language_code: zh
    direction: ltr
