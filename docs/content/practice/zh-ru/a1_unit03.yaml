templates:
- content_key: practice.zh-ru.ru.a1.unit03.lesson01.choose.001
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 俄语名词在数词后会变化：один рубль，два рубля，пять рублей。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson01.listen.002
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 在2、3、4之后名词用一种特殊形式（два брата，три рубля），从5起则用复数二格（пять рублей）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson01.match.003
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 数字2至4使名词这样变化（брат 变成 брата），5及以上则另一种变化（книга 变成 книг）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson01.order.004
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: word_order
  frame:
    text: У меня {item} брата.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Два、три 和 четыре 后面都用同一种名词形式 брата，所以这里任何一个都可以。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson01.fill.005
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: fill_in_blank
  frame:
    text: Пять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 пять 以及更大的数之后，名词用复数二格：рублей，而不是 рубль。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson01.translate.006
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: 我有两个兄弟。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня два брата 字面意思是“在我这儿有两个兄弟”；брата 是2、3、4之后使用的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson01.translate.007
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 先学会计数形式（один，два，три，четыре，пять）；后面的名词随之变化，如 один рубль，два рубля，пять рублей。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson02.listen.001
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 5到10的数词后面都用复数二格名词：пять книг，девять книг，десять книг。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson02.order.002
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: У меня {item} книг.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} книг.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 在5至10的数词之后，名词用复数二格，所以 книга 变成 книг。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson02.order.003
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: Мне {item} лет.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 俄罗斯人用 мне（字面意思是“对我而言”）来说年龄，5及以上的数词后面用 лет。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson02.fill.004
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: fill_in_blank
  frame:
    text: Мне десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 五以上的数词之后，年龄用复数二格的 лет。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson02.translate.005
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: 我十岁。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 年龄用 мне（对我而言）加数词再加 лет 来表达，不用动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson02.translate.006
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: 您多大年纪？
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько {item} лет?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько вам лет? 用了敬称 вам，字面意思是“对您而言”；问的是“您有几岁”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson03.choose.001
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 俄语问一件东西用 Сколько стоит?，问几件东西用 Сколько стоят?，动词要和所买的东西一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson03.order.002
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: word_order
  frame:
    text: Сколько это {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько это {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько это стоит? 是通用的询价问句；стоит 是用于单个事物的形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson03.fill.003
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько {item} яблоки? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Яблоки 是复数，所以动词用 стоят；如果是单个物品（хлеб），则用 стоит。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson03.translate.004
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: 面包多少钱？
    language_code: zh
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хлеб 是单个物品，所以动词用 стоит；如果是复数的 яблоки，则用 стоят。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit03.lesson03.translate.005
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: 三卢布。
    language_code: zh
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 在 три 之后，名词用2至4的形式 рубля，不同于5及以上之后的 рублей。
    language_code: zh
    direction: ltr
