schema_version: '1.0'
pack_key: practice.zh-ru.a1.unit41
source_language: zh
target_language: ru
unit_content_key: ru.a1.unit41.lost_property
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_волнений
    - w_кошелёк
    - w_куртке
    - w_нашёлся
    - w_подойди
    - w_посмотри
    - w_потерян
    - w_пропал
    - w_рюкзак
    - w_стойка
    - w_стойке
    - w_стойки
    - w_хватает
templates:
- content_key: practice.zh-ru.ru.a1.unit41.lesson01.choose.001
  lesson_content_key: ru.a1.unit41.lesson01.propalo_i_nashlos
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_пропал
        - w_нашёлся
        - w_рюкзак
        - w_стойки
        - w_кошелёк
        - w_стойка
        - w_стойке
        - w_подойди
        - w_потерян
        - w_посмотри
        - w_куртке
        - w_хватает
        - w_волнений
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语，来自关于丢失与找到的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit41.lesson02.listen.001
  lesson_content_key: ru.a1.unit41.lesson02.telefon_ryukzak_i_koshelyok
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词语，来自关于手机、背包和钱包的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit41.lesson03.translate.001
  lesson_content_key: ru.a1.unit41.lesson03.u_stoyki
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}是本单元的词汇，出自“在服务台”一课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit41.lesson04.match.001
  lesson_content_key: ru.a1.unit41.lesson04.nina_sprashivaet_u_stoyki
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
