  lesson_content_key: ru.a1.unit41.lesson01.propalo_i_nashlos
  type: word_order
  frame:
    text: Мой телефон {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_пропал
  answer_derivation:
    kind: render_frame
    frame:
      text: Мой телефон {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 我的手机丢了。пропал的意思是“丢失的、不见了”（阳性）。
    language_code: zh
    direction: ltr
