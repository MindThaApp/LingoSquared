    - w_времени
    - w_гуляешь
    - w_гуляю
    - w_даёт
    - w_домашнего
    - w_домашнее
    - w_животное
    - w_животных
    - w_здорово
    - w_играет
    - w_каждый
    - w_коричневая
    - w_корм
    - w_кормить
    - w_кормлю
    - w_кошек
    - w_кошка
    - w_любим
    - w_любить
    - w_любят
    - w_маленький
    - w_одушевлённых
    - w_птиц
    - w_птица
    - w_рыба
    - w_своей
    - w_сказать
    - w_слово
    - w_собак
    - w_собака
    - w_творительном
    - w_человеке
    - w_шерсть
