      part_of_speech: verb
      agreement_tags:
        semantic: w_гуляю
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 是的，我每天遛它，也喂它。гуляю 的意思是“我散步、我遛”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit27.lesson02.translate.004
