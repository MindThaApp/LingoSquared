- content_key: practice.zh-ru.ru.a1.unit27.lesson04.order.002
  lesson_content_key: ru.a1.unit27.lesson04.dima_sprashivaet_o_sobake
  type: word_order
  frame:
    text: У него {item} шерсть, и он маленький.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_коричневая
  answer_derivation:
    kind: render_frame
    frame:
      text: У него {item} шерсть, и он маленький.
      language_code: ru
      direction: ltr
  feedback_frame:
