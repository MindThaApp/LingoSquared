  frame:
    text: Ты {item} с ним каждый день? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_гуляешь
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_гуляешь
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 你每天遛它吗？гуляешь 的意思是“你散步、你遛”（非正式）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit27.lesson06.order.002
  lesson_content_key: ru.a1.unit27.lesson06.ptitsa_niny
  type: word_order
  frame:
    text: Как хорошо, что мы все трое {item} животных!
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_любим
  answer_derivation:
    kind: render_frame
    frame:
      text: Как хорошо, что мы все трое {item} животных!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 太好了，我们三个人都喜欢动物！这句话呼应了本单元三位人物各自与动物有关的内容。
    language_code: zh
    direction: ltr
