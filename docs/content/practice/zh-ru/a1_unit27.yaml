  lesson_content_key: ru.a1.unit27.lesson01.sobaka_koshka_ryba_i
  type: word_order
  frame:
    text: Собака это {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_животное
  answer_derivation:
    kind: render_frame
    frame:
      text: Собака это {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 狗是一种动物。животное 的意思是“动物”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit27.lesson01.fill.003
  lesson_content_key: ru.a1.unit27.lesson01.sobaka_koshka_ryba_i
  type: fill_in_blank
  frame:
    text: Собака тоже {item} животное. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_домашнее
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_домашнее
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 狗也是一种宠物。домашнее 的意思是“家养的、家里的”（中性）。
    language_code: zh
    direction: ltr
