  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自关于喜爱动物的课程。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit27.lesson04.match.001
  lesson_content_key: ru.a1.unit27.lesson04.dima_sprashivaet_o_sobake
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请把每个俄语单词与它的中文意思配对；这些单词都来自本单元的课程。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit27.lesson05.choose.001
  lesson_content_key: ru.a1.unit27.lesson05.dima_lena_i_igor
  type: multiple_choice
  frame:
