      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_собака
  answer_derivation:
    kind: render_frame
    frame:
      text: У Насти есть {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 娜斯佳有一条狗。собака 的意思是“狗”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ru.ru.a1.unit27.lesson02.order.002
  lesson_content_key: ru.a1.unit27.lesson02.zabotimsya_o_domashnem_zhivotnom
  type: word_order
  frame:
    text: Я {item} день гуляю с собакой.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_каждый
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} день гуляю с собакой.
      language_code: ru
