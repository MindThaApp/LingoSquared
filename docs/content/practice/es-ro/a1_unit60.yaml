  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_barca
    - w_bilete
    - w_elefantul
    - w_girafa
    - w_hrănirea
    - w_leilor
    - w_leul
    - w_maimuța
    - w_multe
    - w_zoo
    - w_țarcul
templates:
