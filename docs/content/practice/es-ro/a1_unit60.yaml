  lesson_content_key: ro.a1.unit60.lesson01.hai_sa_mergem_la
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_multe
        - w_leul
        - w_elefantul
        - w_maimuța
        - w_girafa
        - w_zoo
        - w_hrănirea
        - w_leilor
        - w_bilete
        - w_țarcul
        - w_barca
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Vamos al zoo?».'
    language_code: es
    direction: ltr
