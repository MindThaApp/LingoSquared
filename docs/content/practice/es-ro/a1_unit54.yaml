  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cumpăra
    - w_film
    - w_filmul
    - w_matineu
    - w_muzeu
    - w_muzeul
    - w_popcorn
    - w_popcornul
    - w_spectacol
    - w_spectacolul
    - w_uit
    - w_uita
    - w_vedeți
templates:
- content_key: practice.es-ro.ro.a1.unit54.lesson01.choose.001
  lesson_content_key: ro.a1.unit54.lesson01.vreau_sa_ma_uit
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_filmul
        - w_uita
        - w_uit
        - w_film
        - w_cumpăra
        - w_vedeți
        - w_spectacolul
        - w_spectacol
        - w_popcornul
        - w_popcorn
        - w_matineu
        - w_muzeul
        - w_muzeu
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Quiero ver una película».'
    language_code: es
    direction: ltr
