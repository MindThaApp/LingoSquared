        - w_principale
        - w_cafele
        - w_plătit
        - w_cerem
        - w_idee
        - w_azi
        - w_ajutat
        - w_drăguț
        - w_partea
        - w_plătește
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Cuánto cuesta en total?».'
    language_code: es
    direction: ltr
