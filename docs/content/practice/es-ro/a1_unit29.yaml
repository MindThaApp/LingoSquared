  lesson_content_key: ro.a1.unit29.lesson01.cat_costa_in_total
  type: word_order
  frame:
    text: Cât costă în {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_total
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă în {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: ¿Cuánto cuesta en total? În total (en total) aclara que quieres el precio completo, no el de un solo artículo; Cât costă? pregunta «¿cuánto cuesta?».
    language_code: es
    direction: ltr
