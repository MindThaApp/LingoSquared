    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_cortina
  answer_derivation:
    kind: render_frame
    frame:
      text: Văd scena și {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
