  lesson_content_key: ro.a1.unit63.lesson03.actorii_si_casa_de
  type: fill_in_blank
  frame:
    text: Actorii sunt {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_buni
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_buni
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Los actores son buenos. buni significa «buenos» (masc. pl.).
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit63.lesson05.order.002
