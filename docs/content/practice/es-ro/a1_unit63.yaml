schema_version: '1.0'
pack_key: practice.es-ro.a1.unit63
source_language: es
target_language: ro
unit_content_key: ro.a1.unit63.teatru
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_actorii
    - w_buni
    - w_cortina
    - w_călătoria
    - w_grozavi
    - w_locuri
    - w_mulțumit
    - w_pauză
    - w_piesa
    - w_popular
    - w_teatrul
templates:
- content_key: practice.es-ro.ro.a1.unit63.lesson01.choose.001
  lesson_content_key: ro.a1.unit63.lesson01.hai_sa_mergem_azi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_teatrul
        - w_popular
        - w_cortina
        - w_actorii
        - w_buni
        - w_piesa
        - w_călătoria
        - w_pauză
        - w_locuri
        - w_mulțumit
        - w_grozavi
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre ¿vamos al teatro hoy?'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit63.lesson02.listen.001
  lesson_content_key: ro.a1.unit63.lesson02.scena_si_cortina
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre el escenario y el telón.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit63.lesson03.translate.001
  lesson_content_key: ro.a1.unit63.lesson03.actorii_si_casa_de
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre los actores y la taquilla.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit63.lesson04.match.001
  lesson_content_key: ro.a1.unit63.lesson04.programul_spectacolului
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra en rumano con su significado en español; las palabras provienen de las lecciones de esta unidad.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit63.lesson05.choose.001
  lesson_content_key: ro.a1.unit63.lesson05.la_casa_de_bilete
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre en la taquilla del teatro.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit63.lesson06.translate.001
  lesson_content_key: ro.a1.unit63.lesson06.nina_aude_despre_teatru
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre nina se entera de lo del teatro.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit63.lesson01.order.002
  lesson_content_key: ro.a1.unit63.lesson01.hai_sa_mergem_azi
  type: word_order
  frame:
    text: Spectacolul este {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_popular
  answer_derivation:
    kind: render_frame
    frame:
      text: Spectacolul este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: El espectáculo es popular. popular significa «popular» (masc.).
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit63.lesson02.order.002
  lesson_content_key: ro.a1.unit63.lesson02.scena_si_cortina
  type: word_order
  frame:
