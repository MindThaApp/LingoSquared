      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tatăl es masculino, por eso lleva meu; mama es femenino y lleva mea.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit05.lesson01.translate.007
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: Mi madre.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'En rumano el posesivo va después del sustantivo: mama mea, no mea mama.'
    language_code: es
    direction: ltr
