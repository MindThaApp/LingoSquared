    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Părinți significa "padres" y es plural; los dos padres son mamă y tată.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit05.lesson01.match.003
