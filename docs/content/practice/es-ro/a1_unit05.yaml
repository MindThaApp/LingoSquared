templates:
- content_key: practice.es-ro.ro.a1.unit05.lesson01.choose.001
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Meu y mea significan ambos "mi": meu va con sustantivos masculinos y neutros (tatăl meu) y mea con los femeninos (mama mea).'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit05.lesson01.listen.002
