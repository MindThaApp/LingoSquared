    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mamă y tată son los sustantivos sin artículo; mama y tatăl añaden el artículo determinado al final.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit05.lesson01.translate.004
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'El rumano pone el artículo determinado al final del sustantivo: mamă pasa a ser mama y tată pasa a ser tatăl.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit05.lesson01.order.005
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: word_order
  frame:
    text: Mama {item} și tatăl meu.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item} și tatăl meu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Los posesivos concuerdan con el sustantivo: mama mea (femenino) pero tatăl meu (masculino).'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit05.lesson01.fill.006
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
