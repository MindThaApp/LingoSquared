  type: translation
  frame:
    text: Trabajo por la tarde y voy a casa por la noche.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrez seara și {item} acasă noaptea.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Merg acasă noaptea: seara y noaptea indican cuándo, y acasă no necesita preposición.'
    language_code: es
    direction: ltr
