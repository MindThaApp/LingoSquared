  lesson_content_key: ro.a1.unit10.lesson01.dimineata
  type: translation
  frame:
    text: Como pan y bebo café por la mañana.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Mănânc pâine și {item} cafea dimineața.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Beau significa «bebo»; el rumano omite eu porque las terminaciones de mănânc y beau ya indican «yo».
    language_code: es
    direction: ltr
