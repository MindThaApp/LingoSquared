templates:
- content_key: practice.es-ro.ro.a1.unit06.lesson01.choose.001
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Aș dori significa «quisiera» y es la forma cortés de pedir algo; no cambia con ninguna bebida.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson01.listen.002
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Apă, cafea, ceai, suc y lapte son las bebidas básicas; sete (sed) se usa con mi-e en Mi-e sete.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson01.match.003
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cafea y apă son femeninas y llevan o (o cafea); ceai y suc son neutras y llevan un (un ceai).
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson01.translate.004
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aș dori significa «quisiera»; la bebida va detrás, con o o un delante cuando pides una taza o un vaso.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson01.order.005
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: word_order
  frame:
    text: Aș dori o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Cafea es femenina, por eso lleva o: o cafea. Un té es un ceai.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson01.fill.006
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: fill_in_blank
  frame:
    text: Aș dori un {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ceai lleva un, no o: un ceai. Compara con o cafea.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson01.translate.007
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: Quisiera un café.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aș dori es cortés y sirve tanto para tu como para dumneavoastră; cafea lleva o.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson01.translate.008
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: Tengo sed.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi-e {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mi-e sete dice literalmente «la sed me es»; Mi-e foame funciona igual.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson02.choose.001
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Foame significa «hambre»; para decir «tengo hambre» se dice Mi-e foame, igual que Mi-e sete.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson02.listen.002
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mâncare es la comida en general; pâine, carne, pui y fructe son cosas concretas para comer.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson02.match.003
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Fructe es plural y significa «fruta» en general; pâine, carne y mâncare son singulares y femeninas.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson02.translate.004
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mâncare es la palabra general para «comida» y carne significa «carne»; pui es «pollo» y fructe es «fruta».
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson02.order.005
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: word_order
  frame:
    text: Aș dori {item} și pui.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item} și pui.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Aquí el pan no lleva o ni un: Aș dori pâine și pui, como Aș dori apă.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson02.fill.006
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Mi-e foame («tengo hambre») es una expresión fija: la sensación va después de mi-e.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson02.fill.007
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e foame. Aș dori {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pui significa «pollo» y es la palabra que se usa en un menú o en una tienda.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson02.translate.008
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: Quisiera un té, por favor. (formal, a alguien a quien tratas de dumneavoastră)
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori un ceai, vă {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă rog es el «por favor» cortés para dumneavoastră; con un amigo se dice te rog.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit06.lesson02.translate.009
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: Quisiera fruta.
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fructe es plural, así que no lleva o ni un delante.
    language_code: es
    direction: ltr
