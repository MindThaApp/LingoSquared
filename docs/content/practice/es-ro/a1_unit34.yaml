  lesson_content_key: ro.a1.unit34.lesson06.hai_sa_mergem_impreuna
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Vamos juntos en bici?».'
    language_code: es
    direction: ltr
