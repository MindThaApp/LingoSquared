templates:
- content_key: practice.es-ro.ro.a1.unit08.lesson01.choose.001
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Gară es una estación de tren, magazin una tienda y bancă un banco; aproape y departe indican la distancia.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit08.lesson01.listen.002
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: listen_select
  frame:
