  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gară, magazin y bancă son los sustantivos sin artículo; con el artículo añadido pasan a ser gara, magazinul y banca.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit08.lesson01.order.005
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
