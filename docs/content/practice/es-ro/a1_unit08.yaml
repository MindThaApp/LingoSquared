    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Aproape significa cerca y departe significa lejos; ambas describen dónde está algo.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit08.lesson02.match.009
