    kind: render_frame
    frame:
      text: Da, magazinul este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aproape significa cerca; Este aproape? pregunta si algo está cerca.
    language_code: es
    direction: ltr
