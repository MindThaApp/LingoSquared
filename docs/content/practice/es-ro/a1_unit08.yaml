    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Bancă, poștă y bibliotecă terminan en -ă y son femeninas; magazin, spital y autobuz no tienen esa terminación.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit08.lesson01.translate.004
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
