templates:
- content_key: practice.es-ro.ro.a1.unit04.lesson01.choose.001
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jumătate significa mitad y un sfert significa un cuarto; ambos se unen a la hora con și.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson01.listen.002
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cât este ora? pregunta la hora; la respuesta es Este ora + número.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson01.match.003
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ora es la hora o la hora del reloj; fără y și adelantan o atrasan la hora.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson01.order.004
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: word_order
  frame:
    text: Este {item} unu.
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Este {item} unu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Después de ora usa unu para uno y două para dos: ora unu, ora două.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson01.fill.005
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: fill_in_blank
  frame:
    text: Este ora unu și {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Și jumătate añade treinta minutos: ora unu și jumătate es la una y media.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson01.translate.006
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: translation
  frame:
    text: ¿Qué hora es?
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât este ora? significa literalmente cuánto es la hora; se responde con Este ora + número.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson01.translate.007
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fără normalmente significa sin; al decir la hora, fără un sfert significa menos cuarto.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson02.translate.001
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: translation
  frame:
    text: Son las dos y cuarto.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Este ora două și un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Și un sfert añade quince minutos; fără un sfert los quita.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson02.fill.002
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: fill_in_blank
  frame:
    text: Este ora trei {item} un sfert. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Fără un sfert resta quince minutos: ora trei fără un sfert son las 2:45.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson02.translate.003
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: translation
  frame:
    text: ¿A qué hora?
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: La ce {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'La ce oră? pregunta cuándo ocurre algo; se responde con la ora + número: la ora nouă.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson02.order.004
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: word_order
  frame:
    text: Este ora trei fără un {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Este ora trei fără un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sfert es neutro y lleva un en singular; la expresión de la hora cuenta hacia atrás desde la hora siguiente.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson03.choose.001
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dimineața, seara y noaptea son las partes del día y terminan en -a porque llevan el artículo definido.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson03.listen.002
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cursul es la clase; «empieza» es începe, que se usa tanto para clases como para eventos.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson03.order.003
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: word_order
  frame:
    text: Cursul {item} la ora nouă.
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul {item} la ora nouă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Începe es la forma de «él, ella» del verbo «empezar» y concuerda con el sujeto singular cursul.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson03.translate.004
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: translation
  frame:
    text: La clase empieza a las nueve de la mañana.
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul începe la ora nouă, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Añade la parte del día después de la hora: la ora nouă, dimineața o la ora nouă, seara.'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit04.lesson03.fill.005
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: fill_in_blank
  frame:
    text: Când începe {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Când începe cursul? pregunta cuándo empieza la clase; la respuesta es Cursul începe la ora nouă.
    language_code: es
    direction: ltr
