      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'No te preocupes. Nu-ți face griji (literalmente "no te hagas preocupaciones") es la fórmula fija habitual para tranquilizar. A un desconocido: Nu vă faceți griji.'
    language_code: es
    direction: ltr
