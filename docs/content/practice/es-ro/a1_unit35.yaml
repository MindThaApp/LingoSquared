schema_version: '1.0'
pack_key: practice.es-ro.a1.unit35
source_language: es
target_language: ro
unit_content_key: ro.a1.unit35.tehnologie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_alergat
    - w_aplicația
    - w_aplicație
    - w_articolul
    - w_caut
    - w_caută
    - w_cauți
    - w_citește
    - w_computer
    - w_computerul
    - w_căuta
    - w_dimineață
    - w_fel
    - w_folosesc
    - w_folosește
    - w_folosi
    - w_internet
    - w_internetul
    - w_mesaje
    - w_meteo
    - w_neutru
    - w_numi
    - w_prognoza
    - w_sfârșit
    - w_sună
    - w_super
    - w_telefonul
    - w_trimite
    - w_vin
    - w_văd
