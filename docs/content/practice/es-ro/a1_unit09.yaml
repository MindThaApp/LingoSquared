  answer_derivation:
    kind: render_frame
    frame:
      text: Gara este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Acolo significa «allí» y aici significa «aquí»; el verbo este no cambia.
    language_code: es
    direction: ltr
