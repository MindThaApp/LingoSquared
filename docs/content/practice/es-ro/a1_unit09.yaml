    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mergeți {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mergeți es la orden para dumneavoastră; înainte significa «adelante».
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit09.lesson01.translate.005
  lesson_content_key: ro.a1.unit09.lesson01.cum_ajung
  type: translation
  frame:
    text: ¿Cómo puedo llegar a la estación de tren?
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum pot să {item} la gară?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cum pot să ajung... es la forma habitual de pedir indicaciones.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit09.lesson02.translate.007
  lesson_content_key: ro.a1.unit09.lesson02.dreapta_stanga
  type: translation
  frame:
    text: Vaya a la izquierda. (formal, a alguien a quien tratas de dumneavoastră)
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mergeți la {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: La stânga significa «a la izquierda»; la dreapta significa «a la derecha».
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit09.lesson03.translate.003
  lesson_content_key: ro.a1.unit09.lesson03.pe_strada
  type: translation
  frame:
    text: Siga todo recto y luego a la derecha. (formal)
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Mergeți înainte, {item} la dreapta.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Apoi significa «luego» y une dos pasos del recorrido.
    language_code: es
    direction: ltr
