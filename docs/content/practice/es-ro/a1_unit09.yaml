      direction: ltr
  feedback_frame:
    text: Mergeți înainte es una indicación cortés dirigida a alguien a quien tratas de dumneavoastră.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit09.lesson01.order.003
  lesson_content_key: ro.a1.unit09.lesson01.cum_ajung
  type: word_order
  frame:
    text: Cum pot să {item} la gară?
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum pot să {item} la gară?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Después de pot, el rumano añade să y el verbo: Cum pot să ajung la gară?'
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit09.lesson02.order.003
  lesson_content_key: ro.a1.unit09.lesson02.dreapta_stanga
