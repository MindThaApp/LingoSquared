    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La stânga significa «a la izquierda»; stânga y dreapta ya llevan el artículo -a al final.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit09.lesson02.fill.005
  lesson_content_key: ro.a1.unit09.lesson02.dreapta_stanga
  type: fill_in_blank
  frame:
    text: Magazinul este {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aici señala el lugar donde estás; acolo señala un lugar alejado de ti.
    language_code: es
    direction: ltr
- content_key: practice.es-ro.ro.a1.unit09.lesson03.order.002
  lesson_content_key: ro.a1.unit09.lesson03.pe_strada
  type: word_order
  frame:
