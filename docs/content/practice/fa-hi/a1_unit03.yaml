templates:
- content_key: practice.fa-hi.hi.a1.unit03.lesson01.choose.001
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: روزهای هفته در هندی به -वार (روز هفته) ختم می‌شوند؛ برای همین सोमवार، मंगलवार و रविवार پایان یکسانی دارند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson02.listen.001
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: نام ماه‌ها شبیه نام‌های رایج بین‌المللی است؛ برای همین جنوری، مارچ و دسامبر، یعنی जनवरी، मार्च و दिसंबर، راحت شناخته می‌شوند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson03.choose.001
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'अगली یعنی «بعدی» و با اسم مؤنث می‌آید: अगली क्लास یعنی «کلاس بعدی»، ولی با اسم مذکر अगला به کار می‌رود.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson03.match.002
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: आज (امروز) به کلمهٔ اضافه نیاز ندارد، ولی روز هفته با को می‌آید (सोमवार को یعنی دوشنبه) و ماه با में (जनवरी में یعنی در ژانویه).
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson01.order.002
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: روز هفته نهاد جمله است؛ پس आज सोमवार है تحت‌اللفظی یعنی «امروز دوشنبه است».
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson01.order.003
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: योग क्लास {item} को है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {item} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'को بعد از روز هفته یعنی «در روز…»: सोमवार को یعنی دوشنبه.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson02.fill.002
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: fill_in_blank
  frame:
    text: आज कितनी {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कितनी با اسم مؤنث तारीख़ هماهنگ می‌شود، برای همین به -ी ختم می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson02.order.003
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: word_order
  frame:
    text: मेरा जन्मदिन {item} में है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {item} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'में بعد از ماه یعنی «در»: जनवरी में یعنی در ژانویه.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson03.fill.003
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: अगली क्लास {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'कब یعنی «کی» و همان جایی می‌آید که پاسخ می‌آید: अगली क्लास मंगलवार को है.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson03.fill.004
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: कोई {item} नहीं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कोई बात नहीं جواب رایج برای تشکر یا عذرخواهی است، مثل «قابلی ندارد» یا «اشکالی ندارد».
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson01.translate.004
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: امروز چه روزی است؟
    language_code: fa
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} सा दिन है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कौन सा یعنی «کدام»؛ در आज कौन सा दिन है? می‌پرسد امروز چه روزی از هفته است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson02.translate.004
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: تولد من در {month} است.
    language_code: fa
    direction: rtl
    slot_rendering:
      month: english_gloss
  slots:
    month: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {month} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ماه‌ها में (در) می‌گیرند، ولی روزهای هفته को (در روز…).
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson01.translate.005
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: کلاس یوگا {day} است.
    language_code: fa
    direction: rtl
    slot_rendering:
      day: english_gloss
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {day} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: روزهای هفته اسم مذکر هستند و को روزی را نشان می‌دهد که چیزی در آن اتفاق می‌افتد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson03.translate.005
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: translation
  frame:
    text: تولدت کی است؟ (غیررسمی)
    language_code: fa
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा जन्मदिन {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'با «आप» رسمی می‌گویید: आपका जन्मदिन कब है?'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit03.lesson02.translate.005
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: نام روزهای هفته و ماه‌ها در دیوناگری با حروف بزرگ نوشته نمی‌شوند، چون این خط حروف بزرگ ندارد.
    language_code: fa
    direction: rtl
