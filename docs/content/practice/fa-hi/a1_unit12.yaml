templates:
- content_key: practice.fa-hi.hi.a1.unit12.lesson01.choose.001
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'در گذشته، था و थी به‌جای है می‌آیند و با نهاد هماهنگ می‌شوند: दिन अच्छा था، फ़िल्म अच्छी थी.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson01.order.002
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: कल का दिन {item} था?
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: कल का दिन {item} था?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा با اسم مذکر दिन هماهنگ است؛ با اسم مؤنث کैसी می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson01.order.003
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: चाय की दुकान बहुत {item} थी।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अच्छी مؤنث است چون दुकान مؤنث است، و थी هم با آن هماهنگ می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson01.fill.004
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: fill_in_blank
  frame:
    text: फ़िल्म अच्छी {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थी گذشتهٔ مؤنثِ فعل «بودن» است و با اسم مؤنث फ़िल्म هماهنگ می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson01.translate.005
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: فیلم خوب بود.
    language_code: fa
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फ़िल्म अच्छी {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म مؤنث است، برای همین هم صفت و هم گذشتهٔ فعل «بودن» شکل مؤنث می‌گیرند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson01.translate.006
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: مغازهٔ چای‌فروشی خیلی خوب بود.
    language_code: fa
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की چाय را به اسم مؤنث दुकान وصل می‌کند، و अच्छी و थी با آن هماهنگ می‌شوند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson02.choose.001
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'گذشتهٔ जाना و मिलना برای مرد به -आ و برای زن به -ई ختم می‌شود: गया یا गई، मिला یا मिली.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson02.order.002
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: word_order
  frame:
    text: मैं वहाँ प्रिया से {item}।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं वहाँ प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'से اینجا یعنی «با»: प्रिया से मिला یعنی «با پریا دیدار کردم»، و ختم فعل از گوینده تبعیت می‌کند.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson02.fill.003
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं कल बाज़ार {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: پایانهٔ -ई نشان می‌دهد گوینده زن است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson02.fill.004
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं वहाँ अर्जुन से {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: گذشتهٔ मिलना با گوینده هماهنگ می‌شود، پس زن می‌گوید मिली.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson02.translate.005
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: من رفتم خانه. (گوینده زن است)
    language_code: fa
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं घर {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: زن गई می‌گوید؛ مرد गया می‌گوید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson02.translate.006
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: من با پریا دیدار کردم. (گوینده زن است)
    language_code: fa
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से بعد از شخصی که با او دیدار شده یعنی «با»؛ پایانهٔ فعل از گوینده تبعیت می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson02.translate.007
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'گذشتهٔ فعل با انجام‌دهنده هماهنگ می‌شود: مرد मिला می‌گوید و زن मिली.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson03.choose.001
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'मिले با हम، तुम و वे به کار می‌رود: हम मिले، یعنی «ما همدیگر را دیدیم».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson03.fill.002
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: fill_in_blank
  frame:
    text: वहाँ हम {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: با हम، شکل گذشته به -ए ختم می‌شود، مثل جمع مذکر.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit12.lesson03.translate.003
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: translation
  frame:
    text: ما همدیگر را دیدیم.
    language_code: fa
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: हम {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: हम شکل جمع मिले را می‌گیرد، هر که در گروه باشد.
    language_code: fa
    direction: rtl
