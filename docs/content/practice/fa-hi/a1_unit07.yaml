templates:
- content_key: practice.fa-hi.hi.a1.unit07.lesson01.choose.001
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दुकानदार از दुकान (مغازه) به‌علاوه‌ی -दार ساخته شده است؛ پسوندی رایج برای کسی که چیزی را دارد یا نگه می‌دارد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson01.listen.002
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कमीज़ و टोपी اسم مؤنث‌اند، ولی बैग مذکر است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson01.order.003
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: word_order
  frame:
    text: मुझे यह {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'यह (این) درست قبل از اسمی می‌آید که به آن اشاره می‌کند: मुझे यह कमीज़ चाहिए.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson01.fill.004
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: fill_in_blank
  frame:
    text: जी नहीं, {item} यह। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जी नहीं یک «نه»ی مؤدبانه است؛ सिर्फ़ درخواست را به «فقط همین» محدود می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson01.match.005
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: در هندی لازم نیست پیش از واژه‌های مربوط به خرید «یک» بیاورید، پس बाज़ार هم «بازار» معنی می‌دهد و هم «یک بازار».
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson01.translate.006
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: این پیراهن را می‌خواهم.
    language_code: fa
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए برای همه‌ی گوینده‌ها یکسان می‌ماند و यह به اسمی اشاره می‌کند که بلافاصله بعد از آن می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson01.translate.007
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: در مغازه‌ی هندی، فروشنده दुकानदार و محل فروش दुकान است؛ خود بازار هم बाज़ार است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson02.choose.001
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'सस्ता و महंगा مثل मेरा و मेरी تغییر می‌کنند: اسم‌های مؤنث सस्ती و महंगी می‌گیرند.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson02.order.002
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: word_order
  frame:
    text: यह टोपी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह टोपी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'टोपी مؤنث است، پس صفت به -ी ختم می‌شود: सस्ती یا महंगी.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson02.fill.003
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह कमीज़ बहुत {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कमीज़ مؤنث است، پس صفت महंगी است، نه महंगा.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson02.fill.004
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह बैग {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बैग مذکر است، پس صفت सस्ता است، نه सस्ती.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson02.translate.005
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 'قیمت این پیراهن چقدر است؟ (تحت‌اللفظی: این پیراهن از چند است؟)'
    language_code: fa
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: यह कमीज़ कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'का یا की در پرسش قیمت با چیزی که قیمتش پرسیده می‌شود مطابقت دارد، نه با कितने: कमीज़ مؤنث است، پس की.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson02.translate.006
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 'قیمت این کیف چقدر است؟ (تحت‌اللفظی: این کیف از چند است؟)'
    language_code: fa
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह बैग कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'का یا की در پرسش قیمت با چیزی که قیمتش پرسیده می‌شود مطابقت دارد: बैग مذکر است، پس का.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson03.listen.001
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: खरीदते हैं بعد از चलो پیشنهاد می‌دهد، ولی खरीदना شکل فرهنگ‌لغتی «خریدن» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson03.order.002
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: word_order
  frame:
    text: ठीक है! {item} या टोपी?
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: ठीक है! {item} या टोपी?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: या دو گزینه را به هم وصل می‌کند و پرسش فقط با لحن بالارونده و علامت سؤال مشخص می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson03.fill.003
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: चलो, कुछ {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खरीदते همراه با हैं بعد از चलो یعنی «بیایید بخریم»؛ شکل -ते به جنسیت گروه بستگی ندارد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson03.fill.004
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: यह टोपी पाँच सौ रुपये {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: در यह टोपी पाँच सौ रुपये की है، की با اسم مؤنث टोपी مطابقت دارد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit07.lesson03.translate.005
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: translation
  frame:
    text: بیایید چیزی بخریم!
    language_code: fa
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: «चलो» به‌همراه فعل جمع با «ते» و «हैं» روش معمول برای پیشنهاد دادن است.
    language_code: fa
    direction: rtl
