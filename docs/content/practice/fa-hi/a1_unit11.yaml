templates:
- content_key: practice.fa-hi.hi.a1.unit11.lesson01.choose.001
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '«चलो» به‌اضافهٔ یک فعل با -ते و «हैं» یعنی پیشنهاد انجام کاری با هم: चलो, फ़िल्म देखते हैं!'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson01.listen.002
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '«साथ» یعنی «با هم» یا «همراه»، و در پیشنهاد زیاد میاد: चलो, साथ चाय पीते हैं!'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson01.order.003
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, {item} देखते हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, {item} देखते हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: «फ़िल्म» مؤنث است، ولی شکل پیشنهادی -ते हैं برای آن تغییر نمی‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson01.order.004
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, साथ चाय {item} हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, साथ चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: شکل پیشنهادی همان فعل با -ते به‌اضافهٔ «हैं» است، یعنی «بیا ... کنیم».
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson01.fill.005
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: अच्छा {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «अच्छा विचार है» راه رایجی برای قبول کردن یک پیشنهاد است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson01.fill.006
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: चलो, फ़िल्म {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «देखते» شکل -ते است که با «हैं» یعنی «می‌بینیم» و بعد از «चलो» یعنی «بیا ببینیم».
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson01.translate.007
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: بیا چای بخوریم!
    language_code: fa
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: «بیا ... کنیم» در هندی می‌شود «चलो» به‌اضافهٔ شکل -ते हैं فعل.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson01.translate.008
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: 'فکر خوبیه! (جملهٔ کامل: «فکر خوب است»)'
    language_code: fa
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अच्छा {item} है!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: «विचार» مذکر است، برای همین صفت «अच्छा» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson02.choose.001
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: «माफ़ करना» راه غیررسمی گفتن «ببخشید» است، برای کسانی که بهشان «तुम» می‌گویید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson02.match.002
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: کلمه‌های هندی برای ردّ مؤدبانه شامل «माफ़ करना» به معنی «ببخشید» و «व्यस्त» به معنی «مشغول» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson02.fill.003
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: fill_in_blank
  frame:
    text: माफ़ करना, मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بعد از «माफ़ करना» وضعیت‌تان را می‌گویید، مثلاً مشغول بودن.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson02.translate.004
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: ببخشید، سرم شلوغه. (غیررسمی)
    language_code: fa
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: माफ़ करना, मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: «माफ़ करना» راه غیررسمی عذرخواهی است؛ «व्यस्त» برای مرد و زن یکسان می‌ماند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson02.translate.005
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: خب پس کی همدیگه را می‌بینیم؟
    language_code: fa
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तो {item} कब मिलते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '«हम» شکل جمع -ते हैं را می‌گیرد: हम मिलते हैं، یعنی «همدیگه را می‌بینیم».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson03.choose.001
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '«संदेश» یعنی پیام، مثل متنی که برنامه‌ای می‌چیند: प्रिया, चलो शनिवार को फ़िल्म देखते हैं?'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson03.order.002
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: word_order
  frame:
    text: प्रिया, चलो शनिवार को {item} देखते हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया, चलो शनिवार को {item} देखते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: شروع با اسم یعنی مستقیم خطاب کردن آن شخص، و «को» بعد از «शनिवार» یعنی «شنبه».
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit11.lesson03.translate.003
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '«सुझाव» پیشنهادی است که به کسی می‌دهید، ولی «विचार» یعنی فکر یا ایده: अच्छा विचार है! یعنی «فکر خوبیه!»'
    language_code: fa
    direction: rtl
