    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر کلمهٔ هندی را به معنی فارسی‌اش وصل کنید؛ کلمات از درس‌های همین بخش هستند.
    language_code: fa
    direction: rtl
