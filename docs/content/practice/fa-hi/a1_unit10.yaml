templates:
- content_key: practice.fa-hi.hi.a1.unit10.lesson01.choose.001
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'فعل‌های عادتی برای مرد با -ता و برای زن با -ती تمام می‌شوند: मैं उठता हूँ، मैं उठती हूँ.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson01.listen.002
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: वह هم «او» برای مرد است و هم برای زن، و پایان فعل مشخص می‌کند کدام؛ वे یعنی «آن‌ها».
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson01.order.003
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ सात बजे {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ सात बजे {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'پایان فعل از جنسیت گوینده پیروی می‌کند: उठता برای مرد و उठती برای زن، و हूँ با मैं می‌آید.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson01.order.004
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ काम पर {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: काम पर जाना، یعنی «سر کار رفتن»، به پر نیاز دارد، ولی پایان فعل باز هم از جنسیت گوینده پیروی می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson01.fill.005
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: fill_in_blank
  frame:
    text: मैं रोज़ नाश्ता {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بسیاری از کارها در هندی «اسم + करना» هستند: नाश्ता करना یعنی «صبحانه خوردن».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson01.translate.006
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: هر روز می‌رم سر کار. (گوینده زن است)
    language_code: fa
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'زن از پایان -ती استفاده می‌کند: जाती हूँ؛ مرد می‌گوید जाता हूँ.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson01.translate.007
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: هر روز صبحانه می‌خورم. (گوینده مرد است)
    language_code: fa
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ नाश्ता {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: هندی می‌گوید नाश्ता करना، یعنی تحت‌اللفظی «صبحانه کردن»، ولی در فارسی «صبحانه خوردن» می‌گوییم.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson02.choose.001
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'با तुम فعل برای مرد به -ते و برای زن به -ती ختم می‌شود و हो می‌گیرد: तुम उठते हो، तुम उठती हो.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson02.match.002
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: هر فعل عادتی یک شکل مذکر با -ता و یک شکل مؤنث با -ती دارد، و شکل فعل از گوینده پیروی می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson02.order.003
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: word_order
  frame:
    text: तुम कब {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: با तुम وقتی از یک مرد می‌پرسید فعل -ते हो می‌شود، و پایان فعل از شخصِ مخاطب پیروی می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson02.fill.004
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: fill_in_blank
  frame:
    text: मैं रात को ग्यारह बजे {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: گوینده اینجا زن است، پس فعل -ती می‌گیرد؛ پایان فعل از کسی که می‌خوابد پیروی می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson02.translate.005
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: کی می‌خوابی؟ (خودمانی، از یک مرد می‌پرسید)
    language_code: fa
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'با तुم پایان فعل از کسی که از او می‌پرسند پیروی می‌کند، نه از پرسنده: सोते برای مرد، सोती برای زن.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson02.translate.006
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: کی بیدار می‌شی؟ (خودمانی، از یک زن می‌پرسید)
    language_code: fa
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'وقتی از یک زن می‌پرسید، فعل با -ती تمام می‌شود: तुम उठती हो.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson03.choose.001
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: आते در تुम कब वापस आते हो؟ شکل -ते است که با तुम برای پرسیدن از یک مرد به کار می‌رود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson03.fill.002
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: fill_in_blank
  frame:
    text: मैं शाम को छह बजे वापस {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: आता شکل مذکر است، پس گوینده مرد است؛ یک زن می‌گوید आती.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson03.translate.003
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: عصر برمی‌گردم. (گوینده مرد است)
    language_code: fa
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं शाम को वापस {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: को بعد از शाम یعنی «عصر» و वापस आना یعنی «برگشتن».
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson03.translate.004
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: شام می‌خورم. (گوینده زن است)
    language_code: fa
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रात का खाना {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रात का खाना، تحت‌اللفظی «غذای شب»، یعنی شام؛ پایان -ती نشان می‌دهد گوینده زن است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit10.lesson03.translate.005
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'वापस یعنی «برگشت» و با فعل‌هایی مثل आना ترکیب می‌شود: वापस आता हूँ، یعنی «برمی‌گردم».'
    language_code: fa
    direction: rtl
