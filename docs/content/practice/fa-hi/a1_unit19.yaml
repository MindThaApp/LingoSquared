templates:
- content_key: practice.fa-hi.hi.a1.unit19.lesson01.choose.001
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: मौसम اسم مذکر است، برای همین سؤال می‌شود आज मौसम कैसा है؟ با कैसा و نه कैसी.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit19.lesson01.listen.002
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'واژه‌های آب‌وهوایی مثل धूप، बारिश و हवा مستقیم با है می‌آیند: आज धूप है یعنی «امروز آفتابی است».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit19.lesson01.order.003
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'در هندی اسم آب‌وهوا را می‌گویند و है را اضافه می‌کنند، بدون هیچ کلمهٔ دیگری: आज धूप है.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit19.lesson01.order.004
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
