  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} कैसा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा با اسم مذکر मौसम مطابقت دارد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-hi.hi.a1.unit19.lesson01.fill.005
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
