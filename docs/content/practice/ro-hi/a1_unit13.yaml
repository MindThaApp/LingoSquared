templates:
- content_key: practice.ro-hi.hi.a1.unit13.lesson01.choose.001
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पसंद है înseamnă „este plăcut”: मुझे चाय पसंद है se traduce „Îmi place ceaiul” și se construiește cu मुझे, nu cu मैं.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson01.listen.002
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'है se folosește pentru un singur lucru, iar हैं pentru mai multe: किताब पसंद है, किताबें पसंद हैं.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson01.order.003
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: În hindi nu există articol hotărât sau nehotărât, iar lucrul care place se așază între मुझे și पसंद.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson01.order.004
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Verbul este हैं aici, pentru că किताबें este la plural: पसंद है devine पसंद हैं.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson01.fill.005
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पसंद nu este verb în hindi; este un cuvânt folosit cu है, deci propoziția este construită ca „mie ceaiul îmi este plăcut”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson01.fill.006
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे {item} पसंद हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Un lucru la plural care place cere हैं după पसंद.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson01.translate.007
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: Îmi place muzica.
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Persoana căreia îi place stă la locul lui मुझे, iar muzica este lucrul care place.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson01.translate.008
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: Îmi plac cărțile.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: किताबें este la plural, deci verbul este हैं, nu है.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson01.translate.009
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Singularul किताब și pluralul किताबें diferă doar prin terminația -ें, care marchează pluralul la acest substantiv feminin.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson02.choose.001
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'खेल înseamnă și „sport”, și „joc”, iar ज़्यादा înseamnă „mai mult”: मुझे चाय ज़्यादा पसंद है se traduce „Îmi place mai mult ceaiul”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson02.order.002
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: word_order
  frame:
    text: मुझे यह {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: यह („acest”) stă chiar înaintea substantivului pe care îl indică, ca în यह खेल.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson02.fill.003
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} पसंद है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ज़्यादा stă înaintea lui पसंद pentru a arăta care dintre două lucruri place mai mult.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson02.translate.004
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: Îmi place acest sport.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: है se acordă cu lucrul care place (un singur sport), nu cu persoana căreia îi place.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson02.translate.005
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: Îmi place mai mult ceaiul.
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे चाय {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Hindi spune literal „ceaiul îmi este mai plăcut”, cu ज़्यादा chiar înaintea lui पसंद.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit13.lesson02.translate.006
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खेल („sport” sau „joc”) este un substantiv masculin, iar ज़्यादा („mai mult”) nu își schimbă niciodată forma.
    language_code: ro
    direction: ltr
