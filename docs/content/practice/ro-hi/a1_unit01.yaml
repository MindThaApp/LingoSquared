templates:
- content_key: practice.ro-hi.hi.a1.unit01.lesson01.choose.001
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Hindi are două cuvinte pentru „tu”: आप este formal și respectuos, iar तुम este informal și se folosește cu prieteni și cu persoane de vârsta ta sau mai tinere.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson01.fill.002
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Verbul „a fi” se schimbă după subiect: हूँ merge cu मैं, हो cu तुम și हैं cu आप.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson01.order.003
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: word_order
  frame:
    text: आप {item} हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Cuvântul interogativ se acordă cu persoana întrebată: कैसे pentru un bărbat și कैसी pentru o femeie, în timp ce आप primește mereu हैं.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson01.translate.004
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: Ce mai faci? (informal, unui bărbat)
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Cu तुम verbul este हो; când te adresezi unei femei, कैसे devine कैसी: तुम कैसी हो?'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson01.translate.005
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: Ce mai faceți? (formal, întrebând o femeie)
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: आप, forma de politețe, cere हैं, o formă care pare de plural, chiar și pentru o singură persoană; कैसी este forma feminină a lui „cum”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson02.listen.001
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अलविदा este o formulă de rămas-bun; în vorbirea de zi cu zi, नमस्ते se folosește atât pentru „bună”, cât și pentru „la revedere”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson02.order.002
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: word_order
  frame:
    text: आपका {item} अच्छा रहे।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} अच्छा रहे।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रहे transformă fraza într-o urare (să rămână bine), iar आपका arată că se folosește cu आप, forma de politețe; cu तुम ar fi तुम्हारा.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson02.match.003
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Hindi nu are articole (nici hotărât, nici nehotărât): नाम poate însemna „nume”, „un nume” sau „numele”, în funcție de propoziție.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson03.choose.001
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Întrebările în hindi păstrează ordinea cuvintelor din afirmație: cuvântul interogativ कहाँ ia locul răspunsului (आप कहाँ से हैं? și मैं भारत से हूँ).'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson03.order.002
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मेरा नाम {name} है।
    language_code: hi
    direction: ltr
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: În hindi verbul stă la sfârșit, deci मेरा नाम ... है este literal „Numele meu ... este”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson03.order.003
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मैं {place} से हूँ।
    language_code: hi
    direction: ltr
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से vine după locul respectiv și înseamnă „din”; este o postpoziție, nu o prepoziție.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson03.fill.004
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: fill_in_blank
  frame:
    text: आपसे मिलकर {item} हुई। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aceasta este formula de politețe pentru „Încântat de cunoștință”, literal „bucuria s-a întâmplat la întâlnirea cu dumneavoastră”; varianta informală este तुमसे मिलकर अच्छा लगा.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson03.translate.005
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Numele meu este {name}.
    language_code: ro
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नाम este un substantiv masculin, așa că toată lumea, bărbați și femei, spune मेरा नाम.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson03.translate.006
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Eu sunt din {place}.
    language_code: ro
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Și o femeie spune मैं भारत से हूँ: verbul हूँ nu se schimbă după genul vorbitorului.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson03.translate.007
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: De unde ești? (informal)
    language_code: ro
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} से हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Pentru a pune aceeași întrebare formal, folosește आप cu हैं: आप कहाँ से हैं?'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit01.lesson03.translate.008
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Substantivele hindi sunt masculine sau feminine: दिन, नाम și योग sunt masculine, खुशी este feminin.'
    language_code: ro
    direction: ltr
