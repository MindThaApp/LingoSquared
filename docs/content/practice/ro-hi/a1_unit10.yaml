templates:
- content_key: practice.ro-hi.hi.a1.unit10.lesson01.choose.001
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Verbele care exprimă o acțiune obișnuită se termină în -ता pentru un bărbat și în -ती pentru o femeie: मैं उठता हूँ, मैं उठती हूँ.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson01.listen.002
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: वह înseamnă „el” sau „ea”, iar terminația verbului arată care dintre ele; वे înseamnă „ei/ele”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson01.order.003
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ सात बजे {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ सात बजे {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Terminația verbului urmează genul vorbitorului: उठता pentru un bărbat și उठती pentru o femeie, iar हूँ merge cu मैं.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson01.order.004
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ काम पर {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: काम पर जाना, „a merge la muncă”, cere पर, dar terminația verbului urmează în continuare genul vorbitorului.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson01.fill.005
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: fill_in_blank
  frame:
    text: मैं रोज़ नाश्ता {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Multe acțiuni în hindi se formează din substantiv + करना: नाश्ता करना înseamnă „a lua micul dejun”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson01.translate.006
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: În fiecare zi merg la muncă. (spune o femeie)
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'O femeie folosește terminația -ती: जाती हूँ; un bărbat ar spune जाता हूँ.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson01.translate.007
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: În fiecare zi iau micul dejun. (spune un bărbat)
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ नाश्ता {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Hindi spune नाश्ता करना, literal „a face micul dejun”, în timp ce româna spune „a lua micul dejun”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson02.choose.001
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cu तुम verbul se termină în -ते pentru un bărbat și în -ती pentru o femeie și primește हो: तुम उठते हो, तुम उठती हो.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson02.match.002
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Fiecare verb de acțiune obișnuită are o formă masculină în -ता și una feminină în -ती, iar forma urmează vorbitorul.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson02.order.003
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: word_order
  frame:
    text: तुम कब {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Cu तुम verbul este -ते हो când întrebi un bărbat, iar terminația urmează persoana căreia i te adresezi.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson02.fill.004
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: fill_in_blank
  frame:
    text: मैं रात को ग्यारह बजे {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aici vorbitoarea este o femeie, deci verbul primește -ती; terminația urmează persoana care doarme.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson02.translate.005
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: Când dormi? (informal, i te adresezi unui bărbat)
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Cu तुम terminația urmează persoana întrebată, nu pe cea care întreabă: सोते pentru un bărbat, सोती pentru o femeie.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson02.translate.006
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: Când te trezești? (informal, i te adresezi unei femei)
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Când te adresezi unei femei, verbul se termină în -ती: तुम उठती हो.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson03.choose.001
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: आते din तुम कब वापस आते हो? este forma în -ते folosită cu तुम când întrebi un bărbat.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson03.fill.002
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: fill_in_blank
  frame:
    text: मैं शाम को छह बजे वापस {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: आता este forma masculină, deci vorbește un bărbat; o femeie ar spune आती.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson03.translate.003
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: Mă întorc seara. (spune un bărbat)
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं शाम को वापस {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: को după शाम înseamnă „seara”, iar वापस आना înseamnă „a se întoarce”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson03.translate.004
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: Mănânc cina. (spune o femeie)
    language_code: ro
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रात का खाना {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रात का खाना, literal „masa nopții”, înseamnă „cină”; terminația -ती arată că vorbește o femeie.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit10.lesson03.translate.005
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'वापस înseamnă „înapoi” și se îmbină cu verbe precum आना: वापस आता हूँ, „mă întorc”.'
    language_code: ro
    direction: ltr
