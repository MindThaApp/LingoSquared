templates:
- content_key: practice.ro-hi.hi.a1.unit02.lesson01.choose.001
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Numerele hindi sunt neregulate și trebuie învățate pe rând; de exemplu, छह înseamnă șase, iar सात înseamnă șapte.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit02.lesson01.listen.002
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Numerele hindi de la unsprezece la nouăzeci și nouă sunt neregulate, așa că fiecare, precum पंद्रह (cincisprezece) sau पचास (cincizeci), trebuie învățat separat.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit02.lesson02.match.001
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Substantivele hindi precum नंबर, फ़ोन și कीमत se folosesc fără articol; contextul arată dacă înseamnă „un preț” sau „prețul”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit02.lesson02.fill.002
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: इसकी {item} पचास रुपये है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इसकी înseamnă „al lui/al ei” și se acordă cu substantivul feminin कीमत, de aceea se termină în -ी, nu în -ा.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit02.lesson02.order.003
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: इसकी कीमत {item} रुपये है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी कीमत {item} रुपये है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'În hindi numărul stă înaintea lucrului numărat, iar verbul है rămâne la sfârșit: इसकी कीमत पचास रुपये है.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit02.lesson02.translate.004
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: Care este prețul acestuia?
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी {item} क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Hindi păstrează în întrebare ordinea cuvintelor din propoziția afirmativă: इसकी कीमत पचास रुपये है este răspunsul la इसकी कीमत क्या है?'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit02.lesson03.choose.001
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Posesivele se acordă cu lucrul posedat: आपका फ़ोन नंबर folosește masculinul आपका, dar आपकी उम्र folosește femininul आपकी.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit02.lesson03.order.002
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: मेरी उम्र {item} साल है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {item} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Vârsta se exprimă prin numărul de साल (ani) împreună cu है: literal, „Vârsta mea este treizeci de ani”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit02.lesson03.order.003
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: आपका {item} नंबर क्या है?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: आपका este forma de politețe pentru „al dumneavoastră”, aici la masculin pentru că नंबर este masculin; cu तुम ai spune तुम्हारा.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit02.lesson03.fill.004
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: मेरी उम्र तीस {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'साल (an) nu se schimbă la plural după un număr: तीस साल înseamnă treizeci de ani.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit02.lesson03.translate.005
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Am {n} ani.
    language_code: ro
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {n} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: उम्र este un substantiv feminin, deci posesivul este मेरी, nu मेरा.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit02.lesson03.translate.006
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Care este numărul dumneavoastră de telefon?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Numărul de telefon se citește cifră cu cifră în hindi, de exemplu छह दो आठ तीन पाँच.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit02.lesson03.translate.007
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: După un număr mai mare decât unu, banii se numără cu pluralul रुपये; singularul este रुपया.
    language_code: ro
    direction: ltr
