    text: मैं {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Cuvântul pentru „profesor” depinde de genul vorbitorului: शिक्षक pentru un bărbat, शिक्षिका pentru o femeie.'
    language_code: ro
    direction: ltr
