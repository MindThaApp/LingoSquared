  feedback_frame:
    text: शिक्षक este profesorul (bărbat), iar शिक्षिका profesoara; इंजीनियर se folosește pentru amândoi.
    language_code: ro
    direction: ltr
- content_key: practice.ro-hi.hi.a1.unit17.lesson01.listen.002
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Unele nume de meserii în hindi au o formă separată de feminin, ca în शिक्षक și शिक्षिका, dar cuvintele împrumutate, precum इंजीनियर, nu o au.
    language_code: ro
    direction: ltr
