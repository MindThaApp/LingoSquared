    frame:
      text: अर्जुन {item} में काम करता है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Cu un nume propriu verbul se termină în है, nu în हूँ, iar -ता arată că Arjun este bărbat.
    language_code: ro
    direction: ltr
