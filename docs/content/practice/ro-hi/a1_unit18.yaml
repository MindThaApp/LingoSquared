    text: कमरा este o cameră, iar कमरे sunt mai multe camere; बाथरूम și बेडरूम sunt cuvinte împrumutate din engleză, iar रसोई este cuvântul hindi pentru bucătărie.
    language_code: ro
    direction: ltr
