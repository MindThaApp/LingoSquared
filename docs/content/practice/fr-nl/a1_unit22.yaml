  type: word_order
  frame:
    text: Ik {item} je.
    language_code: nl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Ik {item} je.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: '{item} : c’est ce que tu fais pour les joindre.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-nl.nl.a1.unit22.lesson01.translate.002
  lesson_content_key: nl.a1.unit22.lesson01.ik_bel_je
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
