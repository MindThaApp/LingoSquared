templates:
- content_key: practice.fr-nl.nl.a1.unit03.lesson01.match.001
  lesson_content_key: nl.a1.unit03.lesson01.weekdagen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth} · {seventh}'
    language_code: nl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
    seventh: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
    - seventh
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
    - seventh
  feedback_frame:
    text: Associe chaque jour de la semaine néerlandais à son nom en français.
    language_code: fr
    direction: ltr
- content_key: practice.fr-nl.nl.a1.unit03.lesson01.translate.003
  lesson_content_key: nl.a1.unit03.lesson01.weekdagen
  type: translation
  frame:
    text: 'Aujourd’hui, nous sommes : {item}. (Commence par Vandaag.)'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
    text_blocks:
    - text: Translate into Dutch.
      language_code: en
      direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Vandaag is het {item}.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: Aujourd’hui, c’est {item}.
    language_code: fr
    direction: ltr
