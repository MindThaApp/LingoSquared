      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La terminaison ـي sur بيت signifie « mon/ma ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson01.translate.007
  lesson_content_key: ar.a1.unit19.lesson01.rooms
