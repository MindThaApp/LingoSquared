    frame:
      text: في بيتي {item} واحدة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Le nombre un se place après le nom et s’accorde avec lui : غرفة واحدة est au féminin.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson01.order.005
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: word_order
  frame:
    text: في بيتي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: في بيتي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في بيتي commence la phrase et signifie « dans ma maison » ; ce qui s’y trouve vient ensuite.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson01.fill.006
