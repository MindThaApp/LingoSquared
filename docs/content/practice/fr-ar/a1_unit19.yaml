    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: بيتك est بيت (maison) plus ـك (ton/ta) ; عندك signifie « tu as ».
    language_code: fr
    direction: ltr
