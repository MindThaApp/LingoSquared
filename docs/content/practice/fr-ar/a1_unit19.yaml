templates:
- content_key: practice.fr-ar.ar.a1.unit19.lesson01.choose.001
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
