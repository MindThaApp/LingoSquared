  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: بيت signifie « maison », غرفة « pièce » et مطبخ « cuisine » ; ici, ces noms n’ont pas ال.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson01.listen.002
