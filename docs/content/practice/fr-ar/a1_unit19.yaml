    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Voici quatre noms de la maison : maison, pièce, cuisine et table.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson01.translate.008
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: translation
  frame:
    text: Dans ma maison, il y a une seule pièce.
    language_code: fr
    direction: ltr
  slots:
    a: *id005
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: في {a} {b} واحدة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L’arabe n’a pas de verbe pour dire « il y a » : في بيتي غرفة signifie littéralement « dans ma maison une pièce ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson02.choose.001
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: طاولة signifie « table » ; ال dans الغرفة donne « la pièce ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson02.listen.002
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عندك signifie « tu as » ; il est formé de عند et de la terminaison ـك.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson02.order.003
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: عندي طاولة في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي طاولة في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في الغرفة signifie « dans la pièce », avec ال pour une pièce précise.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson02.order.004
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: أين {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La terminaison ـك signifie « ton/ta », donc أين بيتك؟ signifie « où est ta maison ? ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson02.order.005
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: هل {item} طاولة؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {item} طاولة؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'هل introduit une question à réponse oui ou non : هل عندك طاولة؟ signifie « as-tu une table ? ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson02.fill.006
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: fill_in_blank
  frame:
    text: في بيتي غرفة واحدة {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le و est attaché au mot suivant : ومطبخ signifie « et une cuisine ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson02.translate.007
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Les terminaisons ـي (mon/ma) et ـك (ton/ta) s’ajoutent à بيت.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson02.translate.008
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: J’ai une table dans la pièce.
    language_code: fr
    direction: ltr
  slots:
    a: *id012
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Dans l’expression في الغرفة, ال reste après في.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson02.translate.009
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: As-tu une table ?
    language_code: fr
    direction: ltr
  slots:
    a: *id009
    b: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هل ouvre la question et l’ordre des mots reste le même.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit19.lesson02.translate.010
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: Où est ta maison, Youssef ?
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item} يا يوسف
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Layla interroge Youssef avec la terminaison ـك qui signifie « ton/ta ».
    language_code: fr
    direction: ltr
