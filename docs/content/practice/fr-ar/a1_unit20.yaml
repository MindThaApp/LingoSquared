templates:
- content_key: practice.fr-ar.ar.a1.unit20.lesson01.choose.001
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
