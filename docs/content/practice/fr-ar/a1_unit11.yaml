    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: أنام في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: العاشرة est « la dixième » et se termine par ة, comme les autres heures au féminin.
    language_code: fr
    direction: ltr
