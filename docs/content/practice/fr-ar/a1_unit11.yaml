templates:
- content_key: practice.fr-ar.ar.a1.unit11.lesson01.choose.001
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'أستيقظ, أدرس et أنام sont tous des verbes au présent à la première personne : je me réveille, j’étudie, je dors.'
    language_code: fr
    direction: ltr
