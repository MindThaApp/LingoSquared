      language_code: ar
      direction: rtl
  feedback_frame:
    text: Le colis arrive demain. يصل signifie « il arrive » (masculin).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit35.lesson03.fill.003
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: fill_in_blank
  frame:
    text: الطرد {item} فنقول يصل، والرسالة مؤنثة فنقول تصل. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
    hint:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le colis est masculin, donc on dit يصل (yaṣil). La lettre est féminine, donc on dit تصل (taṣil). Un verbe au présent commence par ي pour un sujet masculin et par ت pour un sujet féminin, comme dans الطرد يصل (aṭ-ṭard yaṣil) et الرسالة تصل.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit35.lesson03.translate.004
