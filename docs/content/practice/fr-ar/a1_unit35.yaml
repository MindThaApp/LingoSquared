  type: translation
  frame:
    text: Le colis arrive demain et la lettre met trois jours.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_والرسالة
  answer_derivation:
    kind: render_frame
    frame:
      text: الطرد يصل غدا {item} تستغرق ثلاثة أيام.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Le colis arrive demain et la lettre met trois jours. والرسالة signifie « et la lettre ».
    language_code: fr
    direction: ltr
