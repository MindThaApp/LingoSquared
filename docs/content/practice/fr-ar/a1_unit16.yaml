  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: Je veux un billet. Le train est à cinq heures. (pas de mot séparé pour « je »)
    language_code: fr
    direction: ltr
  slots:
    a: *id003
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a}. {b} في الساعة الخامسة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L’heure s’exprime avec في الساعة suivi d’un ordinal féminin : الساعة الخامسة.'
    language_code: fr
    direction: ltr
