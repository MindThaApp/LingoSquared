  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: Je voudrais un billet pour Le Caire, s’il vous plaît. (pas de mot séparé pour « je »)
    language_code: fr
    direction: ltr
  slots:
    a: *id003
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} إلى {b} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Une demande de billet se compose de أريد, puis du billet, puis de إلى et de la destination.
    language_code: fr
    direction: ltr
