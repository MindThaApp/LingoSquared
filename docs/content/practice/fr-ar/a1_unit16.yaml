    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أي (« quel ») se place avant un nom au singulier ; الثاني (« le deuxième ») se place après le nom qu’il qualifie.
    language_code: fr
    direction: ltr
