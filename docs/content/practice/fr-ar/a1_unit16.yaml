    kind: render_frame
    frame:
      text: أريد {item} إلى القاهرة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Ce que l’on veut suit أريد, et إلى (« vers ») introduit la destination.
    language_code: fr
    direction: ltr
