templates:
- content_key: practice.fr-ar.ar.a1.unit02.lesson01.listen.001
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En arabe, la possession s’exprime par une terminaison : اسم signifie « nom », اسمي « mon nom » et اسمك « ton nom ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson01.match.002
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: La terminaison ـي signifie « mon/ma » (اسمي) et ـك « ton/ta » (اسمك) ; à l’écrit, « ton/ta » s’écrit de la même façon pour un homme et pour une femme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson01.fill.003
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: fill_in_blank
  frame:
    text: ما {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما signifie « quel/que », donc ما اسمك est littéralement « quel ton nom ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson01.translate.004
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنا (« je ») s’emploie dans des phrases simples comme أنا سارة, sans verbe « être » en arabe.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson01.translate.005
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: translation
  frame:
    text: Je m’appelle {item}.
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Les noms s’écrivent comme ils se prononcent : l’arabe n’a pas de majuscules.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson02.choose.001
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Des noms de pays comme لبنان et مصر se passent d’article, mais الأردن, المغرب et العراق incluent ال dans le nom.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson02.match.002
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: L’article ال fait partie des noms الأردن, المغرب et العراق.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson02.order.003
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: word_order
  frame:
    text: أنا من {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من signifie « de » ; أنا من suivi d’un lieu dit d’où l’on vient.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson02.fill.004
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: fill_in_blank
  frame:
    text: من {item} أنت؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أين est le mot interrogatif « où » ; من أين أنت demande « d’où viens-tu ? », à un homme comme à une femme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson02.translate.005
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le mot أنت signifie « tu » ; sans voyelles, il s’écrit de la même façon pour un homme et pour une femme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson02.translate.006
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: translation
  frame:
    text: Je viens de {item}.
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L’arabe n’a pas de verbe « être » ici : أنا من suivi d’un lieu signifie déjà « je viens de ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson03.listen.001
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Une question fermée commence par هل, et la réponse « oui » se dit نعم.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson03.order.002
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: word_order
  frame:
    text: سعدت {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: سعدت {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: سعدت بلقائك est la formule de politesse de fin de rencontre, littéralement « j’ai été heureux de ta rencontre ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson03.fill.003
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: fill_in_blank
  frame:
    text: هل أنت من مصر؟ {item}، أنا من مصر. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: نعم signifie « oui » ; la réponse n’a pas besoin du mot interrogatif.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson03.translate.004
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: translation
  frame:
    text: Je suis heureux de t’avoir rencontré.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: سعدت {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La terminaison ـك de بلقائك s’écrit de la même façon pour un homme et pour une femme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson04.choose.001
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: دائما signifie « toujours » et peut suivre مرحبا بك pour dire « sois le bienvenu à tout moment ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson04.fill.002
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: fill_in_blank
  frame:
    text: مرحبا بك {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: L’expression مرحبا بك دائما signifie que tu es toujours le bienvenu.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit02.lesson04.translate.003
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: سعدت est un verbe au passé avec la terminaison ـت pour « je » ; c’est pourquoi il signifie « j’ai été heureux ».
    language_code: fr
    direction: ltr
