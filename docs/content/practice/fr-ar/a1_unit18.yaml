  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: translation
  frame:
    text: Je travaille dans un bureau. (sans mot séparé pour « je »)
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أعمل في {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أعمل signifie déjà « je travaille », donc أنا n’est pas nécessaire.
    language_code: fr
    direction: ltr
