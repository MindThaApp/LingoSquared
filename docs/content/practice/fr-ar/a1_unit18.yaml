      text: أنا {item} في العمل.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أنا (« je ») est facultatif avec ces verbes, qui signifient déjà « j’écris » et « je lis ».
    language_code: fr
    direction: ltr
