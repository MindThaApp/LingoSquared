    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: مرحبا commence par م à droite, car l’arabe se lit de droite à gauche.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson01.translate.003
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Les voyelles brèves sont généralement omises dans l’orthographe arabe ; le lecteur les devine d’après le mot.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson02.listen.001
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En arabe, on salue selon le moment de la journée : صباح الخير le matin, مساء الخير à partir de l’après-midi.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson02.match.002
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عفوا est la réponse habituelle à شكرا, et مع السلامة est l’au revoir de tous les jours.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson02.order.003
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: word_order
  frame:
    text: شكرا، مع {item}!
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: شكرا، مع {item}!
      language_code: ar
      direction: rtl
  feedback_frame:
    text: مع السلامة signifie littéralement « avec la sécurité » ; ال est l’article défini, soudé au nom.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson02.translate.004
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: translation
  frame:
    text: Merci, au revoir.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: شكرا، مع {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L’article défini ال se place devant le nom : سلامة (sécurité) devient السلامة (la sécurité).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson03.choose.001
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'De nombreuses salutations vont par paires : une formule et sa réponse habituelle, comme صباح الخير et صباح النور.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson03.order.002
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: word_order
  frame:
    text: أهلا وسهلا! أهلا {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أهلا وسهلا! أهلا {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: بك signifie « à toi » ; l’écriture est la même pour un homme ou une femme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson03.fill.003
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: fill_in_blank
  frame:
    text: تصبح على {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تصبح على خير souhaite littéralement que tu te réveilles dans le bien ; on le dit en se quittant pour la nuit.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson03.translate.004
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ال dans النور et اللقاء est l’article défini arabe, écrit soudé au nom.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson03.translate.005
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: translation
  frame:
    text: Bonne nuit ! (à un homme)
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: تصبح على {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'À une femme, le verbe prend la terminaison ـين : تصبحين على خير.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson04.choose.001
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ممتاز est la forme masculine ; une femme dit ممتازة.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson04.match.002
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: الحمد لله signifie littéralement « louange à Dieu », et c’est une réponse très courante à « comment vas-tu ? ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson04.order.003
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: word_order
  frame:
    text: بخير، {item} لله.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: بخير، {item} لله.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Après الحمد vient لله, forme soudée de ل (pour) et الله (Dieu).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson04.fill.004
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: fill_in_blank
  frame:
    text: كيف {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: حال signifie « état » ou « situation » et la terminaison ـك signifie « ton/ta », donc la question est littéralement « comment est ton état ? ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson04.translate.005
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'وأنت est و (et) écrit attaché à أنت (toi) : « et toi ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson04.translate.006
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: translation
  frame:
    text: Comment vas-tu ? (à un homme)
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: كيف {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Le mot écrit حالك est le même pour un homme ou une femme ; seule la voyelle brève finale diffère à l’oral.
    language_code: fr
    direction: ltr
