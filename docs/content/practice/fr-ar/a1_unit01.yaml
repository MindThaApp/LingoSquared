templates:
- content_key: practice.fr-ar.ar.a1.unit01.lesson01.choose.001
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: L’arabe s’écrit de droite à gauche, et les lettres ر et ا ne se lient jamais à la lettre suivante.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit01.lesson01.match.002
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
