    - w_ودود
    - w_ويحب
    - w_ويسلم
    - w_يسكن
    - w_يسلم
    - w_يعجبني
    - w_يعرف
    - w_يعرفان
templates:
- content_key: practice.fr-ar.ar.a1.unit34.lesson01.choose.001
  lesson_content_key: ar.a1.unit34.lesson01.alhy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: &id001
      language_code: ar
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_الحي
        - w_أسكن
        - w_السوبرماركت
        - w_حيي
        - w_الجار
        - w_جاري
        - w_يعرف
        - w_وجارتي
        - w_ودود
        - w_يسلم
        - w_أسلم
        - w_ويحب
        - w_يسكن
        - w_جار
        - w_ويسلم
        - w_يعرفان
        - w_يعجبني
        - w_حيك
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, tirés de la leçon sur le quartier.'
    language_code: fr
    direction: ltr
