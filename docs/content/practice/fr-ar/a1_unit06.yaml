templates:
- content_key: practice.fr-ar.ar.a1.unit06.lesson01.choose.001
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أب signifie père et أم signifie mère ; عندي est un seul mot qui signifie « j’ai ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson01.listen.002
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عائلة signifie famille ; le même mot avec une terminaison possessive, عائلتك, viendra dans la prochaine leçon.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson01.match.003
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عندي exprime « j’ai » en un seul mot ; les mots de parenté sont أب, أم, أخ et أخت.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson01.order.004
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: word_order
  frame:
    text: عندي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'عندي suivi d’un nom exprime « j’ai » : عندي أخت signifie « j’ai une sœur ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson01.fill.005
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: fill_in_blank
  frame:
    text: عندي {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أخت signifie sœur ; son équivalent masculin est أخ.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson01.translate.006
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ces mots de famille sont des noms ; أب signifie père et أم signifie mère.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson01.translate.007
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: J’ai une sœur.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L’arabe n’a pas d’article indéfini (« un », « une ») : عندي أخت se dit littéralement « j’ai sœur ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson01.translate.008
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: J’ai un frère.
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أخ (frère) et أخت (sœur) ne diffèrent que par le ت final.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson01.order.009
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: word_order
  frame:
    text: عندي {item} وأم.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item} وأم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La conjonction و (« et ») se soude au mot suivant : وأم signifie « et mère ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson02.listen.001
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La terminaison ـك dans عائلتك signifie « ton/ta » ; عائلتك signifie donc « ta famille ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson02.choose.002
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يا se place devant un nom quand on appelle ou interpelle quelqu’un, comme dans يا يوسف.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson02.match.003
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'La terminaison ـك signifie « ton/ta » : عائلتك signifie « ta famille » et أختك « ta sœur ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson02.order.004
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: word_order
  frame:
    text: من في {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: من في {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من في عائلتك؟ signifie « Qui y a-t-il dans ta famille ? » ; يا يوسف interpelle Yusuf.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson02.fill.005
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: ما {item} أختك؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اسم signifie nom ; ما اسم أختك؟ signifie « Comment s’appelle ta sœur ? ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson02.fill.006
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: عندي أب {item} وأخت. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'و (« et ») s’écrit attaché au mot suivant : « et mère » s’écrit donc وأم.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson02.translate.007
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اسمها est اسم plus ـها, ce qui donne « son nom » (celui d’une femme).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson02.translate.008
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: 'Layla demande à Yusuf : Comment s’appelle ta sœur ?'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: ما اسم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أختك s’écrit de la même façon que l’on s’adresse à un homme ou à une femme ; ici, on s’adresse à Yusuf.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit06.lesson02.translate.009
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: Elle s’appelle Nour.
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمها {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: اسمها est « nom » plus ـها (« son »), donc aucun mot séparé pour « est » n’est nécessaire.
    language_code: fr
    direction: ltr
