    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ألم est un nom qui signifie « douleur », et les deux parties du corps sont des noms avec ال.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit17.lesson01.translate.006
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: J’ai mal à la tête.
    language_code: fr
    direction: ltr
  slots:
    a: *id004
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'عندي (« j’ai ») n’a pas besoin de verbe : عندي ألم signifie « j’ai une douleur ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit17.lesson01.translate.007
