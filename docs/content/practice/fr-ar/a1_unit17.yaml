  frame:
    text: J’ai mal. J’ai besoin d’aide. (pas de mot séparé pour « je »)
    language_code: fr
    direction: ltr
  slots:
    a: *id004
    b: *id012
    c: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a}. {b} {c}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: عندي et أحتاج contiennent déjà « je » dans leur forme, donc أنا n’est pas nécessaire.
    language_code: fr
    direction: ltr
