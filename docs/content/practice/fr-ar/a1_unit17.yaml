    - fifth
    - sixth
  feedback_frame:
    text: اشربي et استريحي sont des ordres adressés à une femme ; أحتاج signifie « j’ai besoin » ; المشكلة a ال, donc elle signifie « le problème ».
    language_code: fr
    direction: ltr
