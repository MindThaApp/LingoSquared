  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ألم signifie « douleur » ; الرأس est la tête et البطن le ventre, tous deux avec ال.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit17.lesson01.listen.002
