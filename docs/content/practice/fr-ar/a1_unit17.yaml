    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي ألم في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في (dans) est suivi de la partie du corps avec ال : في الرأس, في البطن.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit17.lesson01.fill.004
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
