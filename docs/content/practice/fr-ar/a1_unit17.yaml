      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La tête se dit الرأس ; la phrase dit « j’ai mal à la tête ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit17.lesson01.translate.005
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
