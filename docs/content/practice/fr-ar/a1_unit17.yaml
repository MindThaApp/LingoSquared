    slot: item
  feedback_frame:
    text: عندي ألم في الرأس signifie « j’ai mal à la tête » ; la partie du corps prend ال.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit17.lesson01.order.003
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
