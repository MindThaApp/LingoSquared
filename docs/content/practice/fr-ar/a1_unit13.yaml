    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: La terminaison du passé -ت marque « je » (ذهبت, اشتريت, شربت) ; فعلت signifie « tu as fait » dans la question de l’unité.
    language_code: fr
    direction: ltr
