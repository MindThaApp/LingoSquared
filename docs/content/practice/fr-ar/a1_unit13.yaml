templates:
- content_key: practice.fr-ar.ar.a1.unit13.lesson01.choose.001
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ذهبت signifie « je suis allé(e) » et اشتريت « j’ai acheté » ; ce sont deux verbes au passé à la première personne.
