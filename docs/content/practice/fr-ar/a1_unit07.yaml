templates:
- content_key: practice.fr-ar.ar.a1.unit07.lesson01.choose.001
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أريد signifie « je veux » ; la même forme s’emploie pour un homme ou une femme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson01.listen.002
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ماء signifie eau et قهوة signifie café ; خبز (pain) est une troisième chose que tu peux demander.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson01.match.003
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'و (« et ») se soude au mot suivant : وقهوة signifie « et café ». من فضلك est le « s’il vous plaît » poli.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson01.order.004
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: word_order
  frame:
    text: أريد {item} من فضلك.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أريد suivi d’un nom signifie « je veux » ; من فضلك (s’il vous plaît) termine la demande.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson01.fill.005
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: fill_in_blank
  frame:
    text: أريد ماء {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ici, و fait partie du mot suivant : وقهوة signifie « et café ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson01.fill.006
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: fill_in_blank
  frame:
    text: أريد ماء وقهوة من {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: من فضلك signifie littéralement « de ta faveur » ; c’est la façon courante de dire « s’il vous plaît ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson01.translate.007
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أريد est un verbe qui signifie « je veux » ; les autres mots ici sont des choses que tu peux demander.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson01.translate.008
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: translation
  frame:
    text: Je veux de l’eau, s’il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L’arabe n’emploie pas d’article partitif ni indéfini devant les noms : أريد ماء signifie « je veux de l’eau ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson01.translate.009
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: translation
  frame:
    text: Je veux du café, s’il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: قهوة se termine par ة, la terminaison courante du féminin.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson02.listen.001
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تريدين est la forme féminine de « tu veux » ; pour un homme, on utiliserait une autre terminaison.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson02.choose.002
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: قطعة signifie « morceau » ; قطعة خبز est un morceau de pain, et le mot suivant واحدة (un, une) s’accorde avec lui.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson02.order.003
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: word_order
  frame:
    text: هل تريدين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل تريدين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هل transforme une phrase affirmative en question fermée (oui ou non) ; خبزا est « du pain » comme chose voulue.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson02.order.004
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: word_order
  frame:
    text: نعم، أريد قطعة خبز {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: نعم، أريد قطعة خبز {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: واحدة est « une » au féminin, accordé avec le mot féminin قطعة.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson02.fill.005
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: fill_in_blank
  frame:
    text: هل {item} خبزا؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تريدين signifie « tu veux » (au féminin), donc هل تريدين خبزا؟ demande à une femme : « Veux-tu du pain ? »'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson02.translate.006
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تفضلي se dit à une femme et signifie « tiens, voici » ; un homme entendrait une autre terminaison.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson02.translate.007
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: translation
  frame:
    text: Veux-tu du pain ? (à une femme)
    language_code: fr
    direction: ltr
  slots:
    a: *id011
    b: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La terminaison -ين marque la forme féminine de « tu », et « du pain » comme chose voulue s’écrit خبزا.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit07.lesson02.translate.008
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: translation
  frame:
    text: un morceau de pain
    language_code: fr
    direction: ltr
  slots:
    a: *id012
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} خبز {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: واحدة suit قطعة et s’accorde avec son genre féminin.
    language_code: fr
    direction: ltr
