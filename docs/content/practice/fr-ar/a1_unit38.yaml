      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Le mot « couleur » est masculin, donc la couleur qui suit l’est aussi : je voudrais du rose. أريد (urīd) signifie « je veux » ou « je voudrais ». Compare avec الورود وردية (les roses sont roses) : un pluriel de choses prend un adjectif au féminin singulier.'
    language_code: fr
    direction: ltr
