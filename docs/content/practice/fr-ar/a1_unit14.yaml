templates:
- content_key: practice.fr-ar.ar.a1.unit14.lesson01.choose.001
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحب signifie « j’aime » ; il est directement suivi de ce que l’on aime.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson01.listen.002
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'ولا est و (et) plus لا (ne… pas) : « et… pas ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson01.match.003
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أحب signifie « j’aime » et أفضل « je préfère » ; ولا (« et… pas ») relie une phrase négative à la précédente.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson01.order.004
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Ce que l’on aime suit أحب, avec ال pour le sens général : أحب القهوة signifie « j’aime le café ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson01.order.005
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: لا أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: لا أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'لا placé devant le verbe le met à la forme négative : لا أحب signifie « je n’aime pas ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson01.fill.006
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أحب القهوة {item} أحب الشاي. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ولا relie une proposition négative : « j’aime le café et je n’aime pas le thé ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson01.fill.007
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أنا {item} الماء. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: On peut ajouter أنا (« je ») pour insister, mais أحب seul signifie déjà « j’aime ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson01.translate.008
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: شاي signifie « du thé » sans article, alors que الماء est « l’eau » avec ال ; أحب signifie « j’aime ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson01.translate.009
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: J’aime l’eau. (pas de mot séparé pour « je »)
    language_code: fr
    direction: ltr
  slots:
    a: *id005
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Après أحب, l’arabe utilise ال pour une chose en général : « j’aime l’eau » se dit أحب الماء.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson01.translate.010
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: C’est du thé.
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Sans ال, شاي signifie simplement « du thé », et l’arabe n’a pas besoin de mot pour « est » / « c’est » : هذا شاي.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson02.choose.001
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أفضل signifie « je préfère » ; تفضل, avec le préfixe ت, est la forme masculine pour « tu ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson02.listen.002
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تفضل signifie « tu préfères », en s’adressant à un homme : ماذا تفضل يا يوسف؟'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson02.order.003
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
    text: ماذا {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Le préfixe ت marque « tu » ; ماذا تفضل؟ demande à un homme ce qu’il préfère.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson02.order.004
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
    text: أفضل {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أفضل {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أفضل est suivi de ce que l’on préfère, avec ال : أفضل القهوة.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson02.fill.005
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: fill_in_blank
  frame:
    text: أنا {item} القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أفضل signifie « je préfère » ; le préfixe أ marque « je », comme dans أحب et أريد.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson02.translate.006
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أفضل signifie « je préfère » et تفضل « tu préfères » (masculin) ; le préfixe أ ou ت indique qui fait l’action.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ar.ar.a1.unit14.lesson02.translate.007
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: translation
  frame:
    text: Que préfères-tu, Youssef ?
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} يا يوسف
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Youssef est un homme, donc la forme pour « tu » est تفضل.
    language_code: fr
    direction: ltr
