    text: 'Ensuite, il va courir. ثم (thumma) signifie « ensuite » et s’écrit comme un mot séparé, contrairement à و. يذهب للركض (yadhhab li-r-rakḍ) signifie « il va courir » : ل + الركض devient للركض.'
