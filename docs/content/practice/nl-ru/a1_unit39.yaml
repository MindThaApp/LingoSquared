  type: translation
  frame:
    text: In het voorjaar is het zonnig en in de zomer is het warm.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags:
        semantic: w_летом
  answer_derivation:
    kind: render_frame
    frame:
      text: Весной солнечно, а {item} тепло.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: In het voorjaar is het zonnig en in de zomer is het warm. летом betekent in de zomer.
    language_code: nl
    direction: ltr
