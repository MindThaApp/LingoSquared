  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_года
        - w_весна
        - w_весной
        - w_лето
        - w_летом
        - w_осень
        - w_осенью
        - w_зима
        - w_зимой
        - w_считаешь
        - w_плаваем
        - w_кататься
        - w_коньках
        - w_катаемся
        - w_говорит
        - w_разговор
        - w_временах
        - w_приятный
        - w_красивая
        - w_спокойная
        - w_любимых
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over lente en zomer.'
    language_code: nl
    direction: ltr
