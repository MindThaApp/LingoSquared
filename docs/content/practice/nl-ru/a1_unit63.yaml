        - w_название
        - w_короткое
        - w_названием
        - w_писатель
        - w_известный
        - w_писателя
        - w_детская
        - w_ищете
        - w_популярная
        - w_закладка
        - w_закладкой
        - w_интересной
        - w_зоомагазин
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een woord uit deze unit, uit de les over de roman en de titel.'
    language_code: nl
    direction: ltr
