templates:
- content_key: practice.nl-ru.ru.a1.unit10.lesson01.choose.001
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Идите is de beleefde вы-gebiedende wijs van "gaan"; bij ты gebruik je иди.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson01.listen.002
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Je rijgt aanwijzingen aan elkaar met потом, "dan": Идите прямо, потом направо.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson01.order.003
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: word_order
  frame:
    text: Как дойти до {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До betekent "tot aan" en vraagt de genitief, dus музей wordt музея.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson01.fill.004
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: fill_in_blank
  frame:
    text: Идите {item}, потом направо. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прямо betekent "rechtdoor" en verandert niet van uitgang.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson01.translate.005
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: Hoe kom ik bij het museum?
    language_code: nl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дойти до ...? vraagt hoe je ergens te voet komt; de plaats na до staat in de genitief.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson01.translate.006
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: Ga rechtdoor, dan naar rechts. (formeel)
    language_code: nl
    direction: ltr
  slots:
    a: *id003
    b: *id004
    c: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Идите {a}, {b} {c}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Идите прямо, потом направо is de typische vorm van een korte routebeschrijving.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson02.choose.001
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Поверните is de beleefde вы-gebiedende wijs van "afslaan"; налево en направо geven de richting aan.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson02.order.002
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: word_order
  frame:
    text: Поверните {item} за углом.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Поверните {item} за углом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Налево en направо passen allebei na поверните.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson02.fill.003
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Поверните налево за {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'За vraagt hier de instrumentalis, dus угол wordt углом: за углом betekent "om de hoek".'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson02.fill.004
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Идите два {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Na 2, 3 en 4 krijgt het zelfstandig naamwoord een aparte vorm: два квартала, maar пять кварталов.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson02.translate.005
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: Is het ver van hier?
    language_code: nl
    direction: ltr
  slots:
    a: *id010
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Далеко is "ver" en отсюда is "hier vandaan"; Это далеко отсюда? is een veelgestelde vraag.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson02.translate.006
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Квартал is een huizenblok in de stad en далеко betekent "ver".
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson03.choose.001
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Простите is de beleefde вы-manier om een vreemde aan te spreken, zoals "pardon".
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson03.order.002
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: word_order
  frame:
    text: Это очень {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Это очень просто betekent "het is heel eenvoudig"; een werkwoord voor "zijn" is niet nodig.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson03.fill.003
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: fill_in_blank
  frame:
    text: Нет, пять {item} пешком. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Na пять staat het zelfstandig naamwoord in de genitief meervoud: пять минут.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson03.translate.004
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: Het is heel eenvoudig.
    language_code: nl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Na это werkt просто als naamwoordelijk deel van het gezegde, "het is eenvoudig"; een werkwoord voor "zijn" is dus niet nodig.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson03.translate.005
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: Vijf minuten lopen.
    language_code: nl
    direction: ltr
  slots:
    a: *id015
    b: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Пять {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Пешком betekent "te voet", en минут volgt op пять in de genitief meervoud.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit10.lesson03.translate.006
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прохожий is een mannelijk zelfstandig naamwoord dat van een bijvoeglijk naamwoord afkomstig is en "voorbijganger" betekent.
    language_code: nl
    direction: ltr
