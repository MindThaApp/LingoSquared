  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_спортзал
        - w_хожу
        - w_абонемент
        - w_беговая
        - w_дорожка
        - w_дорожке
        - w_гантели
        - w_поднимаю
        - w_гантелями
        - w_занятие
        - w_инструктор
        - w_расписание
        - w_десяти
        - w_разовый
        - w_хотим
        - w_конечно
        - w_человека
        - w_пляж
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over "Gaan we naar de sportschool?".'
    language_code: nl
    direction: ltr
