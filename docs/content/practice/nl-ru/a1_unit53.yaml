schema_version: '1.0'
pack_key: practice.nl-ru.a1.unit53
source_language: nl
target_language: ru
unit_content_key: ru.a1.unit53.gym
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dutch). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_абонемент
    - w_беговая
    - w_гантели
    - w_гантелями
    - w_десяти
    - w_дорожка
    - w_дорожке
    - w_занятие
    - w_инструктор
    - w_конечно
    - w_пляж
    - w_поднимаю
    - w_разовый
    - w_расписание
    - w_спортзал
    - w_хожу
    - w_хотим
    - w_человека
