  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: Что вы {item} утром?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что вы делаете? vraagt wat u doet; утром betekent 's ochtends.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson03.order.003
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: А когда вы {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: А когда вы {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А verbindt de vraag met de vorige, en работаете is de вы-vorm.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson03.fill.004
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: fill_in_blank
  frame:
