templates:
- content_key: practice.nl-ru.ru.a1.unit11.lesson01.choose.001
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Werkwoorden op -ю horen bij я (ik sta op: я встаю), terwijl -ете bij вы hoort (вы встаёте).'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson01.order.002
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: word_order
  frame:
    text: Я {item} в семь часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Elk werkwoord eindigt op -ю, omdat het onderwerp я is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson01.fill.003
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Я {item} в восемь часов. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Завтракаю is de я-vorm van het werkwoord voor ontbijten.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson01.fill.004
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Когда вы {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Встаёте eindigt op -ёте, de вы-vorm; de я-vorm is встаю.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson01.translate.005
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: Ik sta om zeven uur op.
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Bij een kloktijd gebruikt het Russisch в plus het getal: в семь часов, om zeven uur.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson01.translate.006
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
