    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Na С en до staat de genitief, dus девять en пять worden девяти en пяти.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson02.translate.005
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: Ik werk van negen tot vijf.
    language_code: nl
    direction: ltr
  slots:
    a: *id011
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я работаю с {a} до {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: С ... до ... betekent van ... tot ... en zet beide getallen in de genitief.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson02.translate.006
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: Ik ga om elf uur naar bed.
    language_code: nl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь спать в {item} часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Na het getal одиннадцать staat het zelfstandig naamwoord in de genitief meervoud: часов.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson03.choose.001
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
