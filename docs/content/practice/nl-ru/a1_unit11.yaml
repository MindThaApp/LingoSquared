    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Делаете is de вы-vorm van делать, doen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson03.translate.005
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: Wat doet u 's ochtends? (formeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что вы делаете утром? combineert een vraagwoord, de вы-vorm van het werkwoord en een tijdswoord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson03.translate.006
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Понятно betekent letterlijk: het is duidelijk, en is de gebruikelijke manier om te zeggen: ik begrijp het of oké, snap ik.'
    language_code: nl
    direction: ltr
