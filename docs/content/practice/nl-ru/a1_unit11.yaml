    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Делаете en работаете eindigen op -ете, de вы-vormen, dus ze horen bij вы.
    language_code: nl
    direction: ltr
