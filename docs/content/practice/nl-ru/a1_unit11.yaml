    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Deze werkwoorden zijn я-vormen, dus elk betekent: ik doe iets.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson02.choose.001
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ложусь спать betekent letterlijk: ik ga liggen om te slapen, en is de gebruikelijke manier om te zeggen dat je naar bed gaat.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson02.match.002
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Спать is de infinitief slapen, en ложусь is de я-vorm van een ander werkwoord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson02.order.003
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: word_order
  frame:
    text: Я ложусь {item} в одиннадцать часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь {item} в одиннадцать часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Ложусь спать is een vaste combinatie: het werkwoord ложусь plus de infinitief спать.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit11.lesson02.fill.004
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
