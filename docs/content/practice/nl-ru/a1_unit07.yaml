    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Свободен is een mannelijk bijvoeglijk naamwoord dat overeenkomt met столик; Этот столик свободен? vraagt of een tafel vrij is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit07.lesson01.translate.005
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: translation
  frame:
    text: Hier is de menukaart.
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Вот {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меню verandert nooit van uitgang, en Вот betekent "hier is".
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit07.lesson01.translate.006
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: translation
  frame:
    text: Wat wilt u bestellen? (beleefd)
    language_code: nl
    direction: ltr
  slots:
    aux: *id005
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Что {aux} {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что будете заказывать? gebruikt de вы-vorm будете plus een infinitief om te vragen wat een gast gaat bestellen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit07.lesson02.choose.001
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Я хочу plus een zelfstandig naamwoord betekent "ik wil", en het Russisch gebruikt geen woord voor "een" of "de".
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit07.lesson02.order.002
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: word_order
  frame:
    text: Я хочу {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу betekent "ik wil", en чай, кофе, борщ en салат behouden daarna dezelfde vorm.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit07.lesson02.fill.003
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
