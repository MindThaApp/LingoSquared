  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Het woord и verbindt twee dingen in een bestelling: борщ и салат.'
    language_code: nl
    direction: ltr
