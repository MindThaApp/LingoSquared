    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit07.lesson02.translate.005
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: Ik wil thee.
    language_code: nl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу is een directe mededeling, dus voeg in een restaurant пожалуйста toe om het zachter te maken.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit07.lesson02.translate.006
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: Ik wil borsjt en salade.
    language_code: nl
    direction: ltr
  slots:
    a: *id012
    b: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {a} и {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу борщ и салат is de bestelling uit de dialoog; het Russisch gebruikt geen woord voor "een" of "de".
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit07.lesson03.listen.001
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: listen_select
