templates:
- content_key: practice.nl-ru.ru.a1.unit06.lesson01.choose.001
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мой hoort bij mannelijke zelfstandige naamwoorden (мой отец) en моя bij vrouwelijke (моя мать), dus het bezittelijk voornaamwoord verandert mee met het familiewoord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson01.match.002
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: У меня есть zegt letterlijk "bij mij is er", en zo zegt het Russisch "ik heb"; мой en моя betekenen allebei "mijn".
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson01.fill.003
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: Это {item} мать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Мать is vrouwelijk, dus krijgt het моя; het mannelijke отец krijgt мой.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson01.fill.004
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: У меня {item} сестра. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У меня есть plus een zelfstandig naamwoord is de standaardmanier om te zeggen dat je iets hebt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson01.translate.005
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: Dit is mijn vader.
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {item} отец.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отец is mannelijk, dus het bezittelijk voornaamwoord is мой; bij het vrouwelijke мать zou het моя zijn.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson01.translate.006
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Russische familiewoorden hebben een grammaticaal geslacht: мать en сестра zijn vrouwelijk, отец is mannelijk.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson02.choose.001
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Дедушка lijkt vrouwelijk door de uitgang -а, maar is mannelijk en krijgt мой: мой дедушка.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson02.order.002
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
    text: Это моя {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Это моя {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Бабушка, жена en дочь zijn allemaal vrouwelijk, dus ze krijgen allemaal моя.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson02.order.003
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
    text: Это мой {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Это мой {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дедушка, муж en сын zijn allemaal mannelijk, dus ze krijgen allemaal мой, ook al eindigt дедушка op -а.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson02.fill.004
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: fill_in_blank
  frame:
    text: У меня есть сын и {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Het voegwoord и verbindt twee zelfstandige naamwoorden, zoals in сын и дочь: zoon en dochter.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson02.translate.005
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: Hebt u kinderen? (formeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дети is altijd meervoud; У вас есть ...? is de formele manier om te vragen of iemand iets heeft.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson02.translate.006
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Het Russisch heeft voor elk familielid een eigen woord en kent geen lidwoorden.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson03.choose.001
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Эта is het vrouwelijke "deze", dus het hoort bij девочка; de mannelijke vorm is этот.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson03.order.002
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: word_order
  frame:
    text: А кто {item} девочка?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Эта congrueert met het vrouwelijke woord девочка, terwijl Кто это? het neutrale это gebruikt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson03.fill.003
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: fill_in_blank
  frame:
    text: Кто это на {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Фото verandert nooit van uitgang, dus het blijft фото in На фото.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson03.translate.004
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: Wie is dit op de foto?
    language_code: nl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Кто это на {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кто это? vraagt wie iemand is; На фото betekent "op de foto".
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson03.translate.005
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: En wie is dit meisje?
    language_code: nl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А aan het begin van een vraag verbindt de vraag met wat net gezegd is, zoals "en" in het Nederlands.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit06.lesson03.translate.006
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: Mijn naam is Olga.
    language_code: nl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меня зовут plus een voornaam is hoe Russen zich voorstellen.
    language_code: nl
    direction: ltr
