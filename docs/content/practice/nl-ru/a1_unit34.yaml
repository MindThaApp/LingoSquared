schema_version: '1.0'
pack_key: practice.nl-ru.a1.unit34
source_language: nl
target_language: ru
unit_content_key: ru.a1.unit34.neighbourhood
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dutch). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_давно
    - w_дружелюбный
    - w_здоровается
    - w_здороваться
    - w_здороваюсь
    - w_знает
    - w_знать
    - w_знают
    - w_район
    - w_сосед
    - w_соседа
    - w_супермаркет
    - w_хорошем
templates:
- content_key: practice.nl-ru.ru.a1.unit34.lesson01.choose.001
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_район
        - w_хорошем
        - w_супермаркет
        - w_сосед
        - w_соседа
        - w_знать
        - w_дружелюбный
        - w_здороваться
        - w_здороваюсь
        - w_давно
        - w_здоровается
        - w_знает
        - w_знают
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over de wijk.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit34.lesson02.listen.001
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over mijn buurman en buurvrouw.'
    language_code: nl
