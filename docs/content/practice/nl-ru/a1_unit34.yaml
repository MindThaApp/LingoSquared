  lesson_content_key: ru.a1.unit34.lesson04.nastya_znakomitsya_s_pavlom
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Koppel elk Russisch woord aan de Nederlandse betekenis; de woorden komen uit de lessen van deze unit.
    language_code: nl
    direction: ltr
