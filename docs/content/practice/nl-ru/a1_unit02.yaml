templates:
- content_key: practice.nl-ru.ru.a1.unit02.lesson01.choose.001
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Het Russisch heeft twee woorden voor "je/u": ты voor vrienden, familie, kinderen en leeftijdsgenoten, en вы voor onbekenden, mensen voor wie je respect hebt, of meerdere personen.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson01.order.002
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Как {item} зовут?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как вас зовут? is het formele "Hoe heet u?"; letterlijk vraagt het hoe ze u noemen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson01.order.003
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Меня зовут {name}.
    language_code: ru
    direction: ltr
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меня зовут betekent letterlijk "ze noemen mij", dus de naam die erop volgt blijft in zijn gewone vorm.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson01.fill.004
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: fill_in_blank
  frame:
    text: Меня {item} Виктор. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Зовут komt voor in zowel de vraag als het antwoord: Как вас зовут? en Меня зовут Виктор.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson01.translate.005
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: Mijn naam is {name}.
    language_code: nl
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Russen stellen zich voor met Меня зовут plus een voornaam; een patroniem erbij, zoals in Ирина Петровна, is formeler.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson01.translate.006
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: Hoe heet u? (formeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вас is de formele vorm van вы die in deze vraag wordt gebruikt; tegen een vriend vraag je Как тебя зовут?
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson02.choose.001
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Откуда вы? vraagt waar je vandaan komt, en het antwoord herhaalt dat met из plus de plaats: Я из Канады, Я из Москвы.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson02.listen.002
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Можно на ты? vraagt beleefd of jullie van вы naar ты kunnen overstappen; volgens de gewoonte doet de oudere of hoger geplaatste persoon dit voorstel.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson02.match.003
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ты is voor mensen die je goed kent en вы voor formeel contact, dus kiezen tussen die twee hoort bij elk gesprek.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson02.order.004
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: word_order
  frame:
    text: Я из {place}.
    language_code: ru
    direction: ltr
  slots:
    place: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Я из {place}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Na из volgt de genitief, dus Канада wordt Канады en Москва wordt Москвы.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson02.fill.005
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: fill_in_blank
  frame:
    text: Давайте перейдём на {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Давайте перейдём на ты stelt voor de formaliteit te laten vallen; het voorstel zelf is nog steeds beleefd geformuleerd met давайте.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson02.translate.006
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Меня is de vorm van я die als lijdend voorwerp dient, daarom zegt het antwoord op de naamvraag Меня зовут, letterlijk "ze noemen mij".
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson02.translate.007
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: Waar komt u vandaan? (formeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Откуда {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Откуда betekent "van waar"; de formele vraag gebruikt вы en het antwoord gebruikt из plus de plaats.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson03.fill.001
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: fill_in_blank
  frame:
    text: Очень {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Очень приятно betekent letterlijk "zeer aangenaam" en is het standaardantwoord nadat je iemands naam hebt gehoord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson03.order.002
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: word_order
  frame:
    text: Давайте {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Давайте {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Давайте plus een wij-vorm van een werkwoord maakt een beleefd voorstel: Давайте познакомимся betekent "Laten we kennismaken".'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson03.listen.003
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Давайте познакомимся is een beleefde manier om een kennismaking te beginnen met iemand die je met вы aanspreekt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit02.lesson03.translate.004
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: translation
  frame:
    text: Aangenaam.
    language_code: nl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Очень приятно kun je zowel met ты als met вы gebruiken, omdat je de persoon er niet direct mee aanspreekt.
    language_code: nl
    direction: ltr
