templates:
- content_key: practice.nl-ru.ru.a1.unit04.lesson01.choose.001
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Russische namen van weekdagen schrijf je met een kleine letter, en in de tegenwoordige tijd heb je geen werkwoord nodig: Сегодня суббота betekent Vandaag is het zaterdag.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson01.listen.002
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Среда, пятница en суббота zijn vrouwelijk, de andere weekdagen zijn mannelijk of onzijdig.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson01.match.003
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Dagen van de week schrijf je in het Russisch niet met een hoofdletter: понедельник, вторник, среда.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson01.order.004
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: word_order
  frame:
    text: Сегодня {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: In de tegenwoordige tijd laat het Russisch het werkwoord "zijn" weg, dus Сегодня суббота is gewoon vandaag plus de dag.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson01.fill.005
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: fill_in_blank
  frame:
    text: Какой {item} день? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Какой past bij het mannelijke день; daarom gebruikt de vraag naar de datum later какое met het onzijdige число.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson01.translate.006
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Russische namen van weekdagen krijgen geen hoofdletter.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson01.translate.007
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: Welke dag is het vandaag?
    language_code: nl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Какой {item} день?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Какой сегодня день? vraagt naar de dag van de week; voor de datum vraag je Какое сегодня число?
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson02.choose.001
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Datums bestaan uit een onzijdig rangtelwoord plus de maand in de genitief: десятое апреля betekent de tiende van april.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson02.order.002
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Het rangtelwoord is onzijdig (первое, третье), omdat het past bij het weggelaten woord число, de datum.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson02.order.003
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня десятое {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня десятое {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Na het rangtelwoord komt de maand in de genitief: десятое января, десятое апреля, десятое октября.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson02.fill.004
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: fill_in_blank
  frame:
    text: Какое сегодня {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Число is onzijdig, dus de vraag gebruikt какое, terwijl день mannelijk is en какой krijgt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson02.translate.005
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rangtelwoorden in datums eindigen op -ое of -ье, omdat ze bij het onzijdige число passen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson02.translate.006
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: Welke datum is het vandaag?
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Какое сегодня {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Какое сегодня число? vraagt letterlijk: welk getal is het vandaag?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson02.translate.007
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: Vandaag is het 3 januari.
    language_code: nl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '"3 januari" zeg je in het Russisch als "derde januari", met de maand in de genitief: третье января.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson03.fill.001
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: fill_in_blank
  frame:
    text: Встреча {item} вторник. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Voor вторник wordt het voorzetsel во (во вторник); voor de meeste andere weekdagen is het gewoon в.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson03.choose.002
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Встреча во вторник, девятого января zet eerst de weekdag en daarna de datum, met de maand in de genitief.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson03.order.003
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: word_order
  frame:
    text: Встреча во вторник, {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча во вторник, {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'In een datum staat ook het rangtelwoord девятого in de genitief: девятого января betekent op 9 januari.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit04.lesson03.translate.004
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: translation
  frame:
    text: De afspraak is op dinsdag.
    language_code: nl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча {item} вторник.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Во вторник betekent op dinsdag; во is de verlengde vorm van в die hier wordt gebruikt.
    language_code: nl
    direction: ltr
