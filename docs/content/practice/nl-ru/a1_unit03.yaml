templates:
- content_key: practice.nl-ru.ru.a1.unit03.lesson01.choose.001
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Een Russisch zelfstandig naamwoord verandert na getallen: один рубль, два рубля, пять рублей.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson01.listen.002
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Na 2, 3 en 4 krijgt het zelfstandig naamwoord een speciale vorm (два брата, три рубля), en vanaf 5 staat het in de genitief meervoud (пять рублей).
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson01.match.003
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Bij 2-4 verandert het zelfstandig naamwoord op de ene manier (брат wordt брата), bij 5 en hoger op een andere manier (книга wordt книг).
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson01.order.004
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: word_order
  frame:
    text: У меня {item} брата.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Два, три en четыре hebben alle drie dezelfde vorm van het zelfstandig naamwoord, брата, dus elk van hen past hier.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson01.fill.005
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: fill_in_blank
  frame:
    text: Пять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Na пять en elk hoger getal staat het zelfstandig naamwoord in de genitief meervoud: рублей, niet рубль.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson01.translate.006
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: Ik heb twee broers.
    language_code: nl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня два брата betekent letterlijk «bij mij zijn twee broers»; брата is de vorm die na 2, 3 en 4 gebruikt wordt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson01.translate.007
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Leer eerst de telvormen (один, два, три, четыре, пять); het zelfstandig naamwoord erachter verandert dan, zoals in один рубль, два рубля, пять рублей.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson02.listen.001
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Getallen van 5 tot en met 10 krijgen allemaal een zelfstandig naamwoord in de genitief meervoud: пять книг, девять книг, десять книг.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson02.order.002
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: У меня {item} книг.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} книг.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Na de getallen 5-10 staat het zelfstandig naamwoord in de genitief meervoud, dus книга wordt книг.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson02.order.003
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: Мне {item} лет.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Russen geven hun leeftijd aan met мне, letterlijk «aan mij», en na 5 en hoger is het zelfstandig naamwoord лет.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson02.fill.004
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: fill_in_blank
  frame:
    text: Мне десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Na getallen vanaf vijf gebruik je bij leeftijd лет, de genitief meervoud.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson02.translate.005
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: Ik ben tien jaar oud.
    language_code: nl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Leeftijd druk je uit met мне, «aan mij», plus het getal en лет; er is geen werkwoord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson02.translate.006
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: Hoe oud bent u? (formeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько {item} лет?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько вам лет? gebruikt het formele вам, letterlijk «aan u»; de vraag is eigenlijk «hoeveel jaren aan u?».
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson03.choose.001
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: In het Russisch zeg je Сколько стоит? voor één product en Сколько стоят? voor meerdere, dus het werkwoord past zich aan bij wat je koopt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson03.order.002
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: word_order
  frame:
    text: Сколько это {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько это {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько это стоит? is de algemene vraag «hoeveel kost het?»; стоит is de vorm voor één ding.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson03.fill.003
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько {item} яблоки? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Яблоки is meervoud, dus het werkwoord is стоят; bij één product (хлеб) zou het стоит zijn.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson03.translate.004
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: Hoeveel kost het brood?
    language_code: nl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хлеб is één product, dus het werkwoord is стоит; bij het meervoud яблоки zou het стоят zijn.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit03.lesson03.translate.005
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: Drie roebel.
    language_code: nl
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Na три staat het zelfstandig naamwoord in de vorm voor 2-4, рубля, anders dan рублей na 5 en hoger.
    language_code: nl
    direction: ltr
