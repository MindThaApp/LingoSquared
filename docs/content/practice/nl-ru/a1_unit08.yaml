    - fifth
    - sixth
  feedback_frame:
    text: Полкило is een halve kilo, in één woord geschreven.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson01.translate.005
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: translation
  frame:
    text: Hoeveel kost melk?
    language_code: nl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Стоит congrueert met het enkele product, молоко; bij meerdere producten gebruikt het Russisch стоят.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson01.translate.006
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: translation
  frame:
    text: Het brood kost honderd roebel.
    language_code: nl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Хлеб стоит {item} рублей.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Bij сто is geen woord voor "een" nodig; het zelfstandig naamwoord erna is рублей.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson02.choose.001
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Дайте is de beleefde gebiedende wijs met вы en betekent "geef me"; met ты zou het дай zijn.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson02.order.002
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: word_order
  frame:
    text: Дайте {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Килограмм en полкило noemen allebei een hoeveelheid waren en volgen direct op дайте.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson02.fill.003
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: fill_in_blank
  frame:
    text: Дайте одну {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Na дайте wordt het vrouwelijke штука tot штуку, de vorm voor datgene wat je vraagt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson02.fill.004
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: fill_in_blank
  frame:
    text: Дайте пять {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Na пять en hogere getallen staat het zelfstandig naamwoord in de genitief meervoud: пять штук.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson02.translate.005
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: Geef me alstublieft een halve kilo. (formeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дайте полкило, пожалуйста is een beleefde manier om een verkoper om een halve kilo te vragen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson02.translate.006
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: Geef me alstublieft vijf stuks. (formeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте пять {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Штука wordt штук na het getal vijf.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson02.translate.007
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Штука telt producten per stuk, terwijl килограмм en полкило op gewicht tellen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson03.listen.001
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Помидоры, огурцы en апельсины zijn meervoud; картофель en капуста zijn enkelvoudige woorden die "aardappelen" en "kool" betekenen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson03.order.002
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: word_order
  frame:
    text: У вас есть {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У вас есть ...? past bij elk zelfstandig naamwoord en is de gebruikelijke manier om een verkoper te vragen of hij iets heeft.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson03.fill.003
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько стоит кило {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Na een hoeveelheidswoord zoals кило staat het product in de genitief meervoud, dus яблоки wordt яблок.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson03.translate.004
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: Geef me alstublieft een kilo tomaten. (formeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте килограмм {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Na килограмм staat het product in de genitief meervoud: помидоры wordt помидоров.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson03.translate.005
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: Heeft u kool? (formeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Капуста is enkelvoud in het Russisch en heeft geen woord voor "de" of "een".
    language_code: nl
    direction: ltr
