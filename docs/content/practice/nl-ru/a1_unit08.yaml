- content_key: practice.nl-ru.ru.a1.unit08.lesson01.choose.001
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Сто en двести zijn de getallen 100 en 200; het zelfstandig naamwoord erna staat in de genitief meervoud: сто рублей, двести рублей.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson01.order.002
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: word_order
  frame:
    text: Сколько стоит {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько стоит? vraagt naar de prijs van één product; молоко is een enkelvoudig zelfstandig naamwoord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson01.fill.003
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: fill_in_blank
  frame:
    text: Хлеб стоит {item} рублей. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Na сто, zoals na elk getal vanaf vijf, staat het zelfstandig naamwoord in de genitief meervoud: рублей.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit08.lesson01.match.004
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: matching_pairs
