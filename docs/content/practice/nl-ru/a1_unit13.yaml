templates:
- content_key: practice.nl-ru.ru.a1.unit13.lesson01.choose.001
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'De verleden tijd verandert met het geslacht: был voor een man of mannelijk onderwerp, была voor een vrouw of vrouwelijk onderwerp.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson01.order.002
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: word_order
  frame:
    text: Вчера она {item} дома.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера она {item} дома.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Она is vrouwelijk, dus het werkwoord in de verleden tijd is была; bij я uit de mond van een man is het был.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson01.fill.003
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: fill_in_blank
  frame:
    text: Вчера я {item} дома. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Een man zegt я был, een vrouw zegt я была; het werkwoord komt overeen met de spreker.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson01.fill.004
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: fill_in_blank
  frame:
    text: Вчера она была {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Дома betekent thuis en verandert niet.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson01.translate.005
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: translation
  frame:
    text: Gisteren was ik thuis. (door een man gezegd)
    language_code: nl
    direction: ltr
  slots:
    a: *id003
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: In de verleden tijd heeft het Russisch geen aparte ik-vorm; het werkwoord laat het geslacht van de spreker zien.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson01.translate.006
  lesson_content_key: ru.a1.unit13.lesson01.vchera_byl_doma
  type: translation
  frame:
    text: Gisteren was ze thuis.
    language_code: nl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера она {item} дома.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Была is de vrouwelijke verleden tijd van быть, zijn.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson02.choose.001
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Werkwoorden in de verleden tijd eindigen op -л bij een mannelijk onderwerp en op -ла bij een vrouwelijk onderwerp: ходил, ходила.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson02.match.002
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ходил, смотрел en был eindigen allemaal op -л; de vrouwelijke vormen eindigen op -ла.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson02.order.003
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: word_order
  frame:
    text: Вчера я {item} в кино.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {item} в кино.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ходил is de mannelijke verleden tijd, dus deze zin wordt door een man gezegd.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson02.fill.004
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: fill_in_blank
  frame:
    text: Она {item} фильм. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Она is vrouwelijk, dus het werkwoord in de verleden tijd eindigt op -ла: смотрела.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson02.translate.005
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: translation
  frame:
    text: Gisteren ben ik naar de bioscoop gegaan. (door een man gezegd)
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Вчера я {item} в кино.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ходил is de mannelijke verleden tijd van ходить; een vrouw zegt ходила.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson02.translate.006
  lesson_content_key: ru.a1.unit13.lesson02.hodil_v_kino
  type: translation
  frame:
    text: Ik heb een film gekeken. (door een vrouw gezegd)
    language_code: nl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} фильм.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Смотрела is de vrouwelijke verleden tijd; фильм blijft hetzelfde, omdat het een mannelijk zelfstandig naamwoord is dat een zaak aanduidt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson03.choose.001
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: De verleden tijd van делать is делал voor een man en делала voor een vrouw.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson03.order.002
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: word_order
  frame:
    text: Что ты {item} вчера?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что ты {item} вчера?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что ты делал? richt zich met ты tot een man; bij een vrouw zou je делала gebruiken.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson03.fill.003
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: fill_in_blank
  frame:
    text: Я смотрел {item} фильм. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хороший is mannelijk, passend bij фильм.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson03.fill.004
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: fill_in_blank
  frame:
    text: Я {item} дома. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Отдыхала is de vrouwelijke verleden tijd van отдыхать, 'rusten'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson03.translate.005
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: translation
  frame:
    text: Wat heb je gisteren gedaan? (informeel, tegen een man)
    language_code: nl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что ты {item} вчера?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что ты делал вчера? gebruikt ты, dus dit zeg je tegen een vriend(in); het werkwoord is mannelijk, omdat je het tegen een man zegt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit13.lesson03.translate.006
  lesson_content_key: ru.a1.unit13.lesson03.chto_ty_delal
  type: translation
  frame:
    text: Ik heb gerust. (gezegd door een vrouw)
    language_code: nl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отдыхала eindigt op -ла, omdat de spreker een vrouw is.
    language_code: nl
    direction: ltr
