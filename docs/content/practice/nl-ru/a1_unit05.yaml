templates:
- content_key: practice.nl-ru.ru.a1.unit05.lesson01.choose.001
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Который час? vraagt letterlijk "welk uur" en Сейчас betekent "nu"; samen vormen ze het standaardpaar van vraag en antwoord over de tijd.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson01.listen.002
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Welke vorm van het zelfstandig naamwoord op een getal volgt, hangt van dat getal af: час na 1, часа na 2-4, часов na 5 en hoger.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson01.order.003
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: word_order
  frame:
    text: Сейчас три {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Сейчас три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Na 2, 3 en 4 krijgt het zelfstandig naamwoord de vorm часа, zoals in два часа en три часа.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson01.fill.004
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: fill_in_blank
  frame:
    text: Сейчас десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Vanaf vijf staat het zelfstandig naamwoord in de genitief meervoud часов: пять часов, десять часов.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson01.translate.005
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: translation
  frame:
    text: Hoe laat is het?
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Который {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Который час? betekent letterlijk "welk uur"; het is de standaardmanier om naar de tijd te vragen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson03.translate.001
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'In het Russisch begint een vraag vaak met het vraagwoord, gevolgd door het werkwoord: Когда отходит поезд?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson02.choose.001
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Утром, днём, вечером en ночью zijn bijwoorden op -ом, -ём of -ью, die zonder voorzetsel worden gebruikt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson02.match.002
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Delen van de dag zijn in het Russisch bijwoorden: утром, днём, вечером, ночью.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson02.order.003
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: word_order
  frame:
    text: В два часа {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Na een kloktijd betekent дня 's middags, net zoals утра 's ochtends betekent en вечера 's avonds.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson02.fill.004
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: fill_in_blank
  frame:
    text: В котором {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В котором часу? is de vraag naar het tijdstip waarop iets gebeurt, niet naar hoe laat het nu is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson02.translate.005
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Russische tijdwoorden zoals утром en вечером staan zonder voorzetsel.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson02.translate.006
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: Om zeven uur 's avonds.
    language_code: nl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: В семь часов {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Na een kloktijd staat het deel van de dag in de genitief: семь часов вечера.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson03.listen.002
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Скажите, пожалуйста is een beleefde manier om een vraag aan een vreemde te beginnen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson03.order.003
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Скажите, {item}, который час?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Скажите, {item}, который час?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Скажите is de beleefde vorm (vous-vorm, «u») van de gebiedende wijs en betekent «zeg me», en пожалуйста maakt het verzoek vriendelijker.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson03.order.004
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Когда {item} поезд?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда {item} поезд?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отходит is de vorm voor hij/zij/het van het werkwoord, dus het past bij het enkelvoud поезд.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson03.fill.005
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: fill_in_blank
  frame:
    text: Поезд отходит в восемь часов {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Na een kloktijd betekent утра 's ochtends, dus восемь часов утра is acht uur 's ochtends.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson03.translate.006
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: Hoe laat vertrekt de trein?
    language_code: nl
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда отходит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Когда betekent «wanneer», en het werkwoord отходит past bij het enkelvoud поезд.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit05.lesson03.translate.007
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: Om twee uur 's middags.
    language_code: nl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дня gebruik je bij kloktijden in de middag, en утра en вечера bij kloktijden in de ochtend en de avond.
    language_code: nl
    direction: ltr
