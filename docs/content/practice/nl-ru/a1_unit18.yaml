    language_code: nl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Это introduceert iets: Это ванная.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit18.lesson03.choose.001
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
