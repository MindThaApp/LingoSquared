    slot: item
  feedback_frame:
    text: Гостиная en ванная zijn vrouwelijke bijvoeglijke naamwoorden die als zelfstandig naamwoord dienen, dus ze eindigen op -ая.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit18.lesson02.order.002
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: word_order
  frame:
