    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в квартире.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Живу is de «ik»-vorm van жить.
    language_code: nl
    direction: ltr
