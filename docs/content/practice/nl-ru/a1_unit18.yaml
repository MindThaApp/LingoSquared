      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Na в wordt квартира квартире.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit18.lesson03.translate.004
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
