    language_code: nl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Где ты {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ты geeft een informele vraag aan.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit18.lesson03.translate.005
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: Ik woon in een appartement.
    language_code: nl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в квартире.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я живу is de «ik»-vorm van жить.
    language_code: nl
    direction: ltr
