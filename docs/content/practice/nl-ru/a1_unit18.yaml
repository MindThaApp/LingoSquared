    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Квартира is vrouwelijk, dus het krijgt моя.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit18.lesson01.fill.005
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
