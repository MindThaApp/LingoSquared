  frame:
    text: Dit is mijn appartement.
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Это моя {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Моя past bij het vrouwelijke woord квартира.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit18.lesson01.translate.007
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: translation
  frame:
    text: In de keuken staat een tafel.
    language_code: nl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} есть стол.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '«Er is» is есть, en het Russisch zet de plaats voorop en het nieuwe element achteraan; кухня gebruikt на, niet в: на кухне.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit18.lesson02.choose.001
