    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Диван в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Гостиная wordt гостиной na в, in de woonkamer.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit18.lesson02.fill.003
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
