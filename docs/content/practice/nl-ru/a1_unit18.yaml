    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ванная is een vrouwelijk bijvoeglijk naamwoord dat als zelfstandig naamwoord dient, dus in de basisvorm eindigt het op -ая.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit18.lesson02.translate.004
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: translation
  frame:
