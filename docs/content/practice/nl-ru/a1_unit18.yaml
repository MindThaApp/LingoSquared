    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Na в krijgt het zelfstandig naamwoord de uitgang -е (prepositief).
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit18.lesson01.translate.006
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
