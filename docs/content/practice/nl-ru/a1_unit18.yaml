      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'На plus de uitgang -е (prepositief) geeft aan waar iets is: на кухне, in de keuken.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit18.lesson01.fill.004
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
