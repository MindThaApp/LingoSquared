templates:
- content_key: practice.nl-ru.ru.a1.unit15.lesson01.choose.001
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Лучше betekent „beter” en хуже „slechter”; чем betekent „dan” en staat na de vergrotende trap, achter een komma.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson01.order.002
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: word_order
  frame:
    text: Кофе {item}, чем чай.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Кофе {item}, чем чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: In het Russisch staat in een vergelijking een komma voor чем, „dan”.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson01.fill.003
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: fill_in_blank
  frame:
    text: Чай {item}, чем кофе. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хуже is het tegenovergestelde van лучше; чем leidt daarna datgene in waarmee je vergelijkt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson01.translate.004
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: Koffie is beter dan thee.
    language_code: nl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Кофе {item}, чем чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Het Russisch laat „is” weg: Кофе лучше zet de twee dingen gewoon naast elkaar.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson01.translate.005
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: Thee is slechter dan koffie.
    language_code: nl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Чай {item}, чем кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Чем staat altijd na de vergrotende trap en een komma.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson01.translate.006
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Met deze drie woorden maak je elke eenvoudige vergelijking: лучше, хуже en чем.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson02.choose.001
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: То is het onzijdige „dat” en past bij кафе; тот is het mannelijke „dat” en past bij дом.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson02.match.002
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Больше betekent „groter” of „meer” en меньше „kleiner” of „minder”; то en тот betekenen allebei „dat”, maar horen bij een ander geslacht.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson02.order.003
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: word_order
  frame:
    text: Это кафе {item}, чем то.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Это кафе {item}, чем то.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кафе is onzijdig en verandert nooit, dus het krijgt это en то.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson02.order.004
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: word_order
  frame:
    text: Тот дом {item}, чем этот.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Тот дом {item}, чем этот.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дом is mannelijk, dus het hoort bij тот en этот.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson02.fill.005
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: fill_in_blank
  frame:
    text: То кафе {item}, чем это. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Меньше is het tegenovergestelde van больше.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson02.fill.006
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: fill_in_blank
  frame:
    text: Этот дом больше, чем {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Тот is het mannelijke „dat” en past bij дом; het onzijdige то past bij кафе.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson02.translate.007
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: translation
  frame:
    text: Dit café is groter dan dat.
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Это кафе {item}, чем то.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Больше kan „groter” of „meer” betekenen, afhankelijk van de context.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit15.lesson02.translate.008
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
