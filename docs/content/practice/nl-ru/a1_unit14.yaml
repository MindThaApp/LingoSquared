templates:
- content_key: practice.nl-ru.ru.a1.unit14.lesson01.choose.001
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Нравится is het werkwoord voor ''leuk vinden'': Мне нравится кофе zegt letterlijk dat koffie mij bevalt.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson01.order.002
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: word_order
  frame:
    text: Мне {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: In Мне нравится кофе is datgene wat je leuk vindt het grammaticale onderwerp, en мне is de persoon die het leuk vindt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson01.fill.003
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: fill_in_blank
  frame:
    text: Мне {item} чай. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Нравится gebruik je met мне, 'mij', om te zeggen dat je iets leuk vindt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson01.translate.004
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: Ik hou van koffie.
    language_code: nl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: In het Russisch zeg je 'mij bevalt koffie' in plaats van 'ik hou van koffie'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson01.translate.005
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: Ik hou niet van thee.
    language_code: nl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне не {item} чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Zet не vóór нравится om te zeggen dat je iets niet leuk vindt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson02.listen.001
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Не хочу betekent "ik wil niet"; не staat direct voor het werkwoord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson02.order.002
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
    text: Я {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не хочу is de ontkenning van я хочу, "ik wil".
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson02.order.003
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
    text: Я хочу {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сок is een mannelijk woord en verandert niet na хочу.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson02.fill.004
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: fill_in_blank
  frame:
    text: Я хочу {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Na хочу volgt direct datgene wat je wilt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson02.translate.005
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: translation
  frame:
    text: Ik wil sap.
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу plus een zelfstandig naamwoord is een eenvoudige, directe vraag of wens.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson02.translate.006
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: translation
  frame:
    text: Ik wil geen koffie.
    language_code: nl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не staat vóór хочу om het te ontkennen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson03.choose.001
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Тебе is de informele ты-vorm, 'aan jou'; de beleefdheidsvorm met вы is вам.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson03.order.002
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: word_order
  frame:
    text: Да, мне нравится кофе. А {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А тебе? geeft de vraag terug met de informele ты.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson03.fill.003
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: fill_in_blank
  frame:
    text: А {item} нравится кофе? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Тебе is het informele 'jou/aan jou', dat je tegen vrienden gebruikt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson03.translate.004
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: Ja, ik hou van koffie. En jij? (informeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Тебе is 'aan jou', informeel; tegen een vreemde zeg je вам.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ru.ru.a1.unit14.lesson03.translate.005
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Dit zijn de bouwstenen voor voorkeuren en wensen: нравится, не хочу, сок en тебе.'
    language_code: nl
    direction: ltr
