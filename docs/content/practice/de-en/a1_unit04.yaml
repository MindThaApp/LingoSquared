schema_version: "1.0"
pack_key: practice.de-en.a1.unit04
source_language: de
target_language: en
unit_content_key: en.a1.unit04.dates
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, de-en lane) against PRACTICE_PACK_RECIPE.md and the lexemes of
    scripts/backfill_lexemes_de_en.py (per-unit tags en_a1_uNN*, single-member w_<token> anchors).
    Recognition, matching and bare-word production pools are unit-scoped or curated w_ lists of this
    unit's tokens; sentence frames use a single w_ anchor or a curated w_ union, so the course-scope pool
    equals the unit-scope pool. Hint slots are rendered as the German gloss; production prompts show the
    German gloss or a German sentence. Feedback is German, formal Sie. Reviewer: check the German gloss
    of near-synonyms (fine=prima, good=gut, okay=in Ordnung, hello vs hi) and the fixed-sentence prompts,
    which pin the form (e.g. ohne Kurzform) because grading compares one exact English string.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_7th", "w_9th", "w_again", "w_also", "w_as", "w_birthday", "w_can", "w_date", "w_december", "w_friday", "w_great", "w_january", "w_july", "w_march", "w_monday", "w_month", "w_on", "w_open", "w_saturday", "w_september", "w_sunday", "w_then", "w_thursday", "w_today", "w_tuesday", "w_wednesday", "w_when's", "w_which", "w_write"]
slot_presets:
  wd: &wd {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_monday", "w_tuesday", "w_wednesday", "w_thursday", "w_friday", "w_saturday", "w_sunday"]}}
  mo: &mo {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_january", "w_march", "w_july", "w_september", "w_december"]}}
  l3: &l3 {"language_code": "en", "part_of_speech": ["adverb", "noun", "preposition", "pronoun", "verb"], "agreement_tags": {"semantic": ["w_date", "w_can", "w_also", "w_write", "w_as", "w_when's", "w_birthday", "w_7th"]}}
  l4: &l4 {"language_code": "en", "part_of_speech": ["adjective", "adverb", "noun", "preposition", "verb"], "agreement_tags": {"semantic": ["w_again", "w_open", "w_on", "w_9th", "w_great", "w_then"]}}
  l2: &l2 {"language_code": "en", "part_of_speech": ["noun", "pronoun"], "agreement_tags": {"semantic": ["w_january", "w_march", "w_july", "w_september", "w_december", "w_which", "w_month"]}}
  mt: &mt {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_monday", "w_friday", "w_sunday", "w_january", "w_march", "w_december", "w_july", "w_september"]}}
  tr4: &tr4 {"language_code": "en", "part_of_speech": ["adjective", "adverb"], "agreement_tags": {"semantic": ["w_again", "w_then", "w_great"]}}
  w_today: &w_today {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_today"}}
  w_month: &w_month {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_month"}}
  w_birthday: &w_birthday {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_birthday"}}
  w_then: &w_then {"language_code": "en", "part_of_speech": "adverb", "agreement_tags": {"semantic": "w_then"}}
  tr3: &tr3 {"language_code": "en", "part_of_speech": ["noun", "verb"], "agreement_tags": {"semantic": ["w_date", "w_write", "w_birthday"]}}
templates:
  - content_key: practice.de-en.en.a1.unit04.lesson01.choose.001
    lesson_content_key: en.a1.unit04.lesson01.weekdays
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *wd}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Wochentage schreiben Sie im Englischen immer groß: Monday, Tuesday, Wednesday.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson01.listen.002
    lesson_content_key: en.a1.unit04.lesson01.weekdays
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *wd}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Alle Wochentage enden auf -day: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday und Sunday.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson02.choose.003
    lesson_content_key: en.a1.unit04.lesson02.months
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l2}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Auch Monatsnamen werden im Englischen großgeschrieben: January, March, July.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson02.listen.004
    lesson_content_key: en.a1.unit04.lesson02.months
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *mo}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Viele englische Monatsnamen ähneln den deutschen, aber die Betonung liegt oft anders; hören Sie genau auf die betonte Silbe.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson03.choose.005
    lesson_content_key: en.a1.unit04.lesson03.calendar_dates
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l3}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Beim Datum benutzen Sie im Englischen Ordnungszahlen: July 7th. Mit when's fragen Sie, wann etwas stattfindet, zum Beispiel When's your birthday?", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson04.choose.006
    lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l4}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Open kann „öffnen“ oder „geöffnet sein“ bedeuten, wie in When's the library open again?", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson02.order.007
    lesson_content_key: en.a1.unit04.lesson02.months
    type: word_order
    frame: {"text": "Which {item} is it?", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_month}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Which {item} is it?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Which fragt nach einer Auswahl aus einer begrenzten Menge, hier den zwölf Monaten.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson03.order.008
    lesson_content_key: en.a1.unit04.lesson03.calendar_dates
    type: word_order
    frame: {"text": "My birthday is {item} 3rd.", "language_code": "en", "direction": "ltr"}
    slots: {item: *mo}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "My birthday is {item} 3rd.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Beim Datum steht im Englischen zuerst der Monat und dann der Tag: March 3rd, im Deutschen dagegen „3. März“.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson01.fill.009
    lesson_content_key: en.a1.unit04.lesson01.weekdays
    type: fill_in_blank
    frame: {"text": "What day is it {item}? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_today, hint: *w_today}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Mit what day fragen Sie nach dem Wochentag, mit what's today's date nach dem Datum.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson03.fill.010
    lesson_content_key: en.a1.unit04.lesson03.calendar_dates
    type: fill_in_blank
    frame: {"text": "When's your {item}? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_birthday, hint: *w_birthday}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "When's ist die Kurzform von When is; Sie fragen damit nach einem Zeitpunkt.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson04.order.011
    lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
    type: word_order
    frame: {"text": "It opens on {item}, July 9th.", "language_code": "en", "direction": "ltr"}
    slots: {item: *wd}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "It opens on {item}, July 9th.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Vor einem Wochentag oder Datum steht on: on Thursday, on July 9th.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson01.match.012
    lesson_content_key: en.a1.unit04.lesson01.weekdays
    type: matching_pairs
    frame: {"text": "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", "language_code": "en", "direction": "ltr"}
    slots: {first: *mt, second: *mt, third: *mt, fourth: *mt, fifth: *mt, sixth: *mt}
    slot_relations: [{"kind": "distinct", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {"kind": "matching_pairs", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {"text": "Wochentage und Monate werden im Englischen großgeschrieben, ebenso wie im Deutschen die Nomen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson04.fill.013
    lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
    type: fill_in_blank
    frame: {"text": "Great, see you {item}. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_then, hint: *w_then}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Then bedeutet dann; See you then bezieht sich auf einen Zeitpunkt, den die Sprecher schon genannt haben.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson01.translate.014
    lesson_content_key: en.a1.unit04.lesson01.weekdays
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *wd}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Wochentage schreiben Sie im Englischen immer mit großem Anfangsbuchstaben.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson02.translate.015
    lesson_content_key: en.a1.unit04.lesson02.months
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *mo}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Monatsnamen schreiben Sie im Englischen immer groß.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson02.translate.016
    lesson_content_key: en.a1.unit04.lesson02.months
    type: translation
    frame: {"text": "Welcher Monat ist es?", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_month}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Which {item} is it?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Which fragt nach einer Auswahl aus einer begrenzten Menge, hier den zwölf Monaten.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson03.translate.017
    lesson_content_key: en.a1.unit04.lesson03.calendar_dates
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr3}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Birthday ist ein zusammengesetztes Nomen aus birth (Geburt) und day (Tag); date bedeutet hier das Datum im Sinne von Kalenderdatum.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit04.lesson04.translate.018
    lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr4}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Again heißt wieder oder noch einmal; then bedeutet dann und bezieht sich auf einen genannten Zeitpunkt.", "language_code": "de", "direction": "ltr"}
