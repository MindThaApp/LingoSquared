schema_version: "1.0"
pack_key: practice.de-en.a1.unit02
source_language: de
target_language: en
unit_content_key: en.a1.unit02.introductions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, de-en lane) against PRACTICE_PACK_RECIPE.md and the lexemes of
    scripts/backfill_lexemes_de_en.py (per-unit tags en_a1_uNN*, single-member w_<token> anchors).
    Recognition, matching and bare-word production pools are unit-scoped or curated w_ lists of this
    unit's tokens; sentence frames use a single w_ anchor or a curated w_ union, so the course-scope pool
    equals the unit-scope pool. Hint slots are rendered as the German gloss; production prompts show the
    German gloss or a German sentence. Feedback is German, formal Sie. Reviewer: check the German gloss
    of near-synonyms (fine=prima, good=gut, okay=in Ordnung, hello vs hi) and the fixed-sentence prompts,
    which pin the form (e.g. ohne Kurzform) because grading compares one exact English string.
    Opus pass 2026-10-24: student dropped from the bare-word translation pool (gloss Student would leak the answer); one over-general feedback claim softened.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["en_a1_u02_l02", "w_an", "w_assistant", "w_engineer", "w_he", "w_is", "w_library", "w_member", "w_my", "w_name", "w_new", "w_no", "w_student", "w_teacher", "w_thank", "w_the", "w_welcome", "w_what's", "w_yes", "w_your"]
slot_presets:
  l1: &l1 {"language_code": "en", "part_of_speech": ["noun", "pronoun", "verb"], "agreement_tags": {"semantic": ["w_what's", "w_your", "w_name", "w_my", "w_is"]}}
  l2: &l2 {"language_code": "en", "part_of_speech": ["adjective", "noun", "particle", "pronoun", "verb"], "agreement_tags": {"semantic": "en_a1_u02_l02"}}
  l3: &l3 {"language_code": "en", "part_of_speech": ["noun", "particle", "verb"], "agreement_tags": {"semantic": ["w_library", "w_assistant", "w_welcome", "w_the", "w_thank"]}}
  jobs: &jobs {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_student", "w_teacher", "w_member"]}}
  mt: &mt {"language_code": "en", "part_of_speech": ["noun", "particle"], "agreement_tags": {"semantic": ["w_name", "w_student", "w_teacher", "w_member", "w_engineer", "w_library", "w_yes", "w_no"]}}
  tr2: &tr2 {"language_code": "en", "part_of_speech": ["adjective", "noun", "particle"], "agreement_tags": {"semantic": ["w_teacher", "w_member", "w_engineer", "w_yes", "w_no", "w_new"]}}
  tr3: &tr3 {"language_code": "en", "part_of_speech": ["noun", "verb"], "agreement_tags": {"semantic": ["w_library", "w_assistant", "w_welcome", "w_thank"]}}
  w_name: &w_name {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_name"}}
  w_your: &w_your {"language_code": "en", "part_of_speech": "pronoun", "agreement_tags": {"semantic": "w_your"}}
  w_an: &w_an {"language_code": "en", "part_of_speech": "particle", "agreement_tags": {"semantic": "w_an"}}
  w_he: &w_he {"language_code": "en", "part_of_speech": "pronoun", "agreement_tags": {"semantic": "w_he"}}
  w_the: &w_the {"language_code": "en", "part_of_speech": "particle", "agreement_tags": {"semantic": "w_the"}}
  w_thank: &w_thank {"language_code": "en", "part_of_speech": "verb", "agreement_tags": {"semantic": "w_thank"}}
  w_my: &w_my {"language_code": "en", "part_of_speech": "pronoun", "agreement_tags": {"semantic": "w_my"}}
  w_engineer: &w_engineer {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_engineer"}}
  w_teacher: &w_teacher {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_teacher"}}
templates:
  - content_key: practice.de-en.en.a1.unit02.lesson01.choose.001
    lesson_content_key: en.a1.unit02.lesson01.exchange_names
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Your und my sind besitzanzeigende Wörter: my name ist mein Name, your name ist Ihr oder dein Name, denn das Englische unterscheidet nicht zwischen Sie und du.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson01.listen.002
    lesson_content_key: en.a1.unit02.lesson01.exchange_names
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "What's ist die Kurzform von what is und leitet die Frage nach dem Namen ein: What's your name?", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson02.choose.003
    lesson_content_key: en.a1.unit02.lesson02.exchange_roles
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l2}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Im Englischen steht vor einem Beruf meist ein Artikel: a student, a teacher, aber an engineer, weil das folgende Wort mit einem Vokal beginnt.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson02.listen.004
    lesson_content_key: en.a1.unit02.lesson02.exchange_roles
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l2}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "He steht für einen Mann und she für eine Frau; beide verwenden Sie mit is: he is, she is.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson03.choose.005
    lesson_content_key: en.a1.unit02.lesson03.library_dialogue
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l3}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "In der Bibliothek hören Sie Welcome to the library; the ist der bestimmte Artikel und passt zu der, die und das.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson03.listen.006
    lesson_content_key: en.a1.unit02.lesson03.library_dialogue
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l3}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Thank you ist die höfliche Standardform für „Danke“.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson01.order.007
    lesson_content_key: en.a1.unit02.lesson01.exchange_names
    type: word_order
    frame: {"text": "My {item} is Leila.", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_name}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "My {item} is Leila.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Im Englischen sagen Sie wörtlich „Mein Name ist …“; das Verb is steht zwischen name und dem Namen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson02.order.008
    lesson_content_key: en.a1.unit02.lesson02.exchange_roles
    type: word_order
    frame: {"text": "I am a {item}.", "language_code": "en", "direction": "ltr"}
    slots: {item: *jobs}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "I am a {item}.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Vor einem Beruf oder einer Rolle steht im Englischen der Artikel a: I am a student, anders als im Deutschen, wo er oft entfällt.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson01.fill.009
    lesson_content_key: en.a1.unit02.lesson01.exchange_names
    type: fill_in_blank
    frame: {"text": "What's {item} name? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_your, hint: *w_your}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Your passt zu you, also zu Ihnen und zu dir; für „mein“ verwenden Sie my.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson02.fill.010
    lesson_content_key: en.a1.unit02.lesson02.exchange_roles
    type: fill_in_blank
    frame: {"text": "She is {item} engineer. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_an, hint: *w_an}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Vor einem Vokallaut verwenden Sie an statt a: an engineer, aber a teacher.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson02.fill.011
    lesson_content_key: en.a1.unit02.lesson02.exchange_roles
    type: fill_in_blank
    frame: {"text": "{item} is a teacher. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_he, hint: *w_he}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "He ist die männliche Form; für eine Frau verwenden Sie she, für mehrere Personen dagegen they.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson02.match.012
    lesson_content_key: en.a1.unit02.lesson02.exchange_roles
    type: matching_pairs
    frame: {"text": "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", "language_code": "en", "direction": "ltr"}
    slots: {first: *mt, second: *mt, third: *mt, fourth: *mt, fifth: *mt, sixth: *mt}
    slot_relations: [{"kind": "distinct", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {"kind": "matching_pairs", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {"text": "Yes und no beantworten eine Frage, wie im Deutschen ja und nein; student und teacher sind Rollen, die einen Artikel brauchen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson03.fill.013
    lesson_content_key: en.a1.unit02.lesson03.library_dialogue
    type: fill_in_blank
    frame: {"text": "Welcome to {item} library. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_the, hint: *w_the}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Der bestimmte Artikel the bleibt unverändert, ob das Nomen männlich, weiblich oder sächlich wäre.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson01.translate.014
    lesson_content_key: en.a1.unit02.lesson01.exchange_names
    type: translation
    frame: {"text": "Wie heißt du? (informell)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_your}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "What's {item} name?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Im Englischen fragen Sie wörtlich „Was ist dein Name?“; die Frage klingt gegenüber Freunden und Fremden gleich.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson01.translate.015
    lesson_content_key: en.a1.unit02.lesson01.exchange_names
    type: translation
    frame: {"text": "Mein Name ist Leila.", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_my}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "{item} name is Leila.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "My ist das besitzanzeigende Wort für „mein“; im Satz steht es vor dem Nomen name.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson02.translate.016
    lesson_content_key: en.a1.unit02.lesson02.exchange_roles
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr2}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Rollen wie student oder teacher stehen im Englischen für Frauen und Männer in derselben Form; es gibt keine eigene weibliche Endung.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson02.translate.017
    lesson_content_key: en.a1.unit02.lesson02.exchange_roles
    type: translation
    frame: {"text": "Sie ist Ingenieurin. (ausgeschrieben, ohne Kurzform)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_an}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "She is {item} engineer.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Viele englische Berufsbezeichnungen haben keine eigene weibliche Form: Ingenieur und Ingenieurin heißen beide engineer.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit02.lesson03.translate.018
    lesson_content_key: en.a1.unit02.lesson03.library_dialogue
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr3}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Welcome wird als Gruß beim Eintreten verwendet; thank gehört zu thank you.", "language_code": "de", "direction": "ltr"}
