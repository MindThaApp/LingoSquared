schema_version: "1.0"
pack_key: practice.de-en.a1.unit07
source_language: de
target_language: en
unit_content_key: en.a1.unit07.food
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, de-en lane) against PRACTICE_PACK_RECIPE.md and the lexemes of
    scripts/backfill_lexemes_de_en.py (per-unit tags en_a1_uNN*, single-member w_<token> anchors).
    Recognition, matching and bare-word production pools are unit-scoped or curated w_ lists of this
    unit's tokens; sentence frames use a single w_ anchor or a curated w_ union, so the course-scope pool
    equals the unit-scope pool. Hint slots are rendered as the German gloss; production prompts show the
    German gloss or a German sentence. Feedback is German, formal Sie. Reviewer: check the German gloss
    of near-synonyms (fine=prima, good=gut, okay=in Ordnung, hello vs hi) and the fixed-sentence prompts,
    which pin the form (e.g. ohne Kurzform) because grading compares one exact English string.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_all", "w_anything", "w_bread", "w_cafe", "w_coffee", "w_else", "w_here", "w_menu", "w_or", "w_please", "w_price", "w_salad", "w_sandwich", "w_soup", "w_sure", "w_tea", "w_water"]
slot_presets:
  food: &food {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_coffee", "w_tea", "w_water", "w_bread", "w_soup", "w_salad", "w_sandwich"]}}
  l2m: &l2m {"language_code": "en", "part_of_speech": ["adverb", "particle", "pronoun"], "agreement_tags": {"semantic": ["w_please", "w_anything", "w_else", "w_here", "w_or", "w_all"]}}
  l3m: &l3m {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_menu", "w_price", "w_cafe", "w_soup"]}}
  l4m: &l4m {"language_code": "en", "part_of_speech": ["adjective", "adverb", "pronoun"], "agreement_tags": {"semantic": ["w_sure", "w_please", "w_anything", "w_else"]}}
  dr: &dr {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_coffee", "w_tea", "w_salad", "w_sandwich"]}}
  tr2: &tr2 {"language_code": "en", "part_of_speech": ["adverb", "pronoun"], "agreement_tags": {"semantic": ["w_please", "w_anything", "w_else", "w_here", "w_all"]}}
  tr3: &tr3 {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_menu", "w_price", "w_cafe"]}}
  w_else: &w_else {"language_code": "en", "part_of_speech": "adverb", "agreement_tags": {"semantic": "w_else"}}
  w_here: &w_here {"language_code": "en", "part_of_speech": "adverb", "agreement_tags": {"semantic": "w_here"}}
  w_sandwich: &w_sandwich {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_sandwich"}}
  w_all: &w_all {"language_code": "en", "part_of_speech": "pronoun", "agreement_tags": {"semantic": "w_all"}}
  w_menu: &w_menu {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_menu"}}
  w_please: &w_please {"language_code": "en", "part_of_speech": "adverb", "agreement_tags": {"semantic": "w_please"}}
  w_coffee: &w_coffee {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_coffee"}}
  w_cafe: &w_cafe {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_cafe"}}
  w_price: &w_price {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_price"}}
templates:
  - content_key: practice.de-en.en.a1.unit07.lesson01.choose.001
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *food}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Water, bread und soup sind Stoffnamen: Im Englischen sagen Sie dafür some water, aber a coffee oder a sandwich für eine Portion.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson01.listen.002
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *food}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Coffee und tea werden im Englischen beim Bestellen oft mit a verwendet: I'd like a coffee, please.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson02.choose.003
    lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l2m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Anything else? ist die übliche Frage im Café, wenn Sie bestellt haben; Antworten können Sie mit No, that's all.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson02.listen.004
    lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l2m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Please macht eine Bitte höflich und steht oft am Satzende: I'd like a coffee, please.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson04.choose.005
    lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l4m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Sure bedeutet hier klar oder gern; Sie bestätigen damit freundlich eine Bestellung, bevor Sie nachfragen: Sure. Anything else?", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson03.choose.006
    lesson_content_key: en.a1.unit07.lesson03.reading_a_menu
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l3m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Menu ist im Englischen die Speisekarte, nicht das Menü als Gericht; den Preis auf der Karte nennt man price.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson02.order.007
    lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
    type: word_order
    frame: {"text": "Anything {item}?", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_else}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Anything {item}?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Else bedeutet sonst noch; Anything else? fragt, ob Sie noch einen Wunsch haben.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson04.order.008
    lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
    type: word_order
    frame: {"text": "For {item} or to go?", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_here}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "For {item} or to go?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "For here or to go? fragt, ob Sie im Café essen oder die Speisen mitnehmen; here heißt hier.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson01.fill.009
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: fill_in_blank
    frame: {"text": "I'd like a {item}, please. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_sandwich, hint: *w_sandwich}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Sandwich ist ein belegtes Brot; mit a davor bestellen Sie ein einzelnes Sandwich.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson03.fill.010
    lesson_content_key: en.a1.unit07.lesson03.reading_a_menu
    type: fill_in_blank
    frame: {"text": "The {item} says the coffee is three dollars. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_menu, hint: *w_menu}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Menu ist im Englischen die Speisekarte; das Verb says bezieht sich auf den Text auf der Karte.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson02.fill.011
    lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
    type: fill_in_blank
    frame: {"text": "No, that's {item}, thanks. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_all, hint: *w_all}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "That's all bedeutet, dass Sie nichts weiter bestellen möchten; That's ist die Kurzform von That is.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson04.fill.012
    lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
    type: fill_in_blank
    frame: {"text": "For here, {item}. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_please, hint: *w_please}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Please am Satzende macht die Antwort höflich: For here, please.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson01.match.013
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: matching_pairs
    frame: {"text": "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", "language_code": "en", "direction": "ltr"}
    slots: {first: *food, second: *food, third: *food, fourth: *food, fifth: *food, sixth: *food}
    slot_relations: [{"kind": "distinct", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {"kind": "matching_pairs", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {"text": "Coffee, tea, soup und salad sind Speisen oder Getränke aus dem Café; bread und sandwich gehören zum Essen, water zum Trinken.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson01.translate.014
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *food}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Beim Bestellen sagen Sie für eine Portion a coffee oder a sandwich.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson02.translate.015
    lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr2}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Anything else? fragt nach weiteren Wünschen; that's all schließt die Bestellung ab.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson03.translate.016
    lesson_content_key: en.a1.unit07.lesson03.reading_a_menu
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr3}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Cafe ist hier die englische Schreibweise ohne Akzent; menu meint die Speisekarte.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson02.translate.017
    lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
    type: translation
    frame: {"text": "Ich hätte gern einen Kaffee, bitte. (mit I'd like)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_coffee}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "I'd like a {item}, please.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "I'd like ist höflicher als I want; please am Satzende rundet die Bitte ab.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit07.lesson04.translate.018
    lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
    type: translation
    frame: {"text": "Für hier, bitte.", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_here}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "For {item}, please.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "For here heißt, dass Sie im Café essen; das Gegenstück ist to go, also zum Mitnehmen.", "language_code": "de", "direction": "ltr"}
