schema_version: "1.0"
pack_key: practice.de-en.a1.unit03
source_language: de
target_language: en
unit_content_key: en.a1.unit03.numbers
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, de-en lane) against PRACTICE_PACK_RECIPE.md and the lexemes of
    scripts/backfill_lexemes_de_en.py (per-unit tags en_a1_uNN*, single-member w_<token> anchors).
    Recognition, matching and bare-word production pools are unit-scoped or curated w_ lists of this
    unit's tokens; sentence frames use a single w_ anchor or a curated w_ union, so the course-scope pool
    equals the unit-scope pool. Hint slots are rendered as the German gloss; production prompts show the
    German gloss or a German sentence. Feedback is German, formal Sie. Reviewer: check the German gloss
    of near-synonyms (fine=prima, good=gut, okay=in Ordnung, hello vs hi) and the fixed-sentence prompts,
    which pin the form (e.g. ohne Kurzform) because grading compares one exact English string.
    Opus pass 2026-10-24: hundred dropped from the bare-word translation pool (hundert -> a/one hundred is not one exact answer, and the matching feedback says hundred is not said alone).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["en_a1_u03_l01", "en_a1_u03_l02", "w_apples", "w_dollars", "w_eight", "w_eleven", "w_fifteen", "w_fifty", "w_five", "w_forty", "w_four", "w_hundred", "w_it's", "w_market", "w_much", "w_nine", "w_number", "w_ok", "w_old", "w_phone", "w_seven", "w_shop", "w_six", "w_ten", "w_they're", "w_thirteen", "w_thirty", "w_this", "w_three", "w_twelve", "w_twenty", "w_twenty-five", "w_two", "w_years", "w_zero"]
slot_presets:
  n1: &n1 {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "en_a1_u03_l01"}}
  n2: &n2 {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "en_a1_u03_l02"}}
  l3: &l3 {"language_code": "en", "part_of_speech": ["adjective", "adverb", "noun", "pronoun"], "agreement_tags": {"semantic": ["w_old", "w_years", "w_much", "w_this", "w_it's", "w_dollars", "w_phone", "w_number"]}}
  l4: &l4 {"language_code": "en", "part_of_speech": ["adjective", "noun", "pronoun"], "agreement_tags": {"semantic": ["w_market", "w_apples", "w_they're", "w_ok", "w_shop"]}}
  price: &price {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_two", "w_three", "w_four", "w_five", "w_six", "w_seven", "w_eight", "w_nine", "w_ten"]}}
  ages: &ages {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_twenty", "w_twenty-five", "w_thirty", "w_forty", "w_fifty"]}}
  mt: &mt {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_zero", "w_three", "w_seven", "w_twelve", "w_twenty", "w_fifty", "w_hundred", "w_thirty"]}}
  tr2: &tr2 {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_eleven", "w_twelve", "w_thirteen", "w_fifteen", "w_twenty", "w_thirty", "w_forty", "w_fifty"]}}
  tr4: &tr4 {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_market", "w_apples", "w_shop"]}}
  w_much: &w_much {"language_code": "en", "part_of_speech": "adverb", "agreement_tags": {"semantic": "w_much"}}
  w_number: &w_number {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_number"}}
  w_apples: &w_apples {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_apples"}}
  w_shop: &w_shop {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_shop"}}
  w_old: &w_old {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "w_old"}}
  w_hundred: &w_hundred {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_hundred"}}
templates:
  - content_key: practice.de-en.en.a1.unit03.lesson01.choose.001
    lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *n1}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Mit den Zahlen von null bis zehn nennen Sie Alter, Preise und Telefonnummern; Telefonnummern sagen Sie Ziffer für Ziffer an.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson01.listen.002
    lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *n1}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Achten Sie beim Hören auf die Silbenzahl: seven und zero haben zwei Silben, die übrigen Zahlen bis zehn nur eine.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson02.choose.003
    lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *n2}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Bei den Zahlen von dreizehn bis neunzehn endet das englische Wort auf -teen, bei den Zehnern auf -ty: thirteen gegenüber thirty.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson02.listen.004
    lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *n2}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Fifteen und fifty klingen ähnlich, unterscheiden sich aber in der Betonung: fifteen betont die zweite Silbe, fifty die erste.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson03.choose.005
    lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l3}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Mit How old are you? fragen Sie nach dem Alter, mit How much is this? nach dem Preis.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson04.choose.006
    lesson_content_key: en.a1.unit03.lesson04.market_dialogue
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l4}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Im Marktgespräch fragen Sie nach Preis und Alter mit denselben Frageformen wie zuvor: How much …? und How old …?", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson03.order.007
    lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
    type: word_order
    frame: {"text": "It's {item} dollars.", "language_code": "en", "direction": "ltr"}
    slots: {item: *price}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "It's {item} dollars.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Bei Preisen steht die Zahl vor dem Nomen dollars, und das Nomen steht im Plural: five dollars.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson03.order.008
    lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
    type: word_order
    frame: {"text": "I'm {item} years old.", "language_code": "en", "direction": "ltr"}
    slots: {item: *ages}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "I'm {item} years old.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Das Alter nennen Sie mit I'm + Zahl + years old; im Deutschen heißt es dagegen „Ich bin … Jahre alt“.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson03.fill.009
    lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
    type: fill_in_blank
    frame: {"text": "How {item} is this? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_much, hint: *w_much}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Mit how much fragen Sie nach dem Preis: How much is this? heißt „Wie viel kostet das?“.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson03.fill.010
    lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
    type: fill_in_blank
    frame: {"text": "What's your phone {item}? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_number, hint: *w_number}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Eine Telefonnummer sagen Sie Ziffer für Ziffer auf: five-five-five, one-two-three-four.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson04.fill.011
    lesson_content_key: en.a1.unit03.lesson04.market_dialogue
    type: fill_in_blank
    frame: {"text": "How much are the {item}? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_apples, hint: *w_apples}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Bei mehreren Dingen steht im Plural are statt is: How much are the apples?", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson01.match.012
    lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
    type: matching_pairs
    frame: {"text": "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", "language_code": "en", "direction": "ltr"}
    slots: {first: *mt, second: *mt, third: *mt, fourth: *mt, fifth: *mt, sixth: *mt}
    slot_relations: [{"kind": "distinct", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {"kind": "matching_pairs", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {"text": "Hundert wird im Englischen mit a oder one davor gesagt: one hundred, nicht hundred allein.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson04.order.013
    lesson_content_key: en.a1.unit03.lesson04.market_dialogue
    type: word_order
    frame: {"text": "OK, how old is this {item}?", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_shop}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "OK, how old is this {item}?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Die Frage How old …? passt nicht nur zu Personen, sondern auch zu Dingen und Geschäften.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson01.translate.014
    lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *n1}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Die englischen Zahlen bis zehn sind einsilbig, nur zero und seven haben zwei Silben.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson02.translate.015
    lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr2}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Die Zehner enden auf -ty (twenty, thirty, forty, fifty), die Zahlen von dreizehn bis neunzehn auf -teen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson03.translate.016
    lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
    type: translation
    frame: {"text": "Wie alt bist du? (informell)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_old}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "How {item} are you?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Mit How old are you? fragen Sie nach dem Alter; die Antwort lautet I'm … years old.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit03.lesson04.translate.017
    lesson_content_key: en.a1.unit03.lesson04.market_dialogue
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr4}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Apples steht im Plural; ein einzelner Apfel heißt apple.", "language_code": "de", "direction": "ltr"}
