schema_version: '1.0'
pack_key: practice.de-en.a1.unit62
source_language: de
target_language: en
unit_content_key: en.a1.unit62.phone_calls
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Authored session 14 (depth-a1) against PRACTICE_PACK_RECIPE.md and the lexemes of scripts/backfill_lexemes_de_en.py. Slots use single-member or curated w_<token> anchors so course scope equals unit scope; fixed-sentence prompts pin the English
    form (no contractions). Feedback is German, formal Sie. The nl-en sibling pack had no tag-compatible templates for this unit, so this pack is hand-built. Needs native review of the German prompts and feedback.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_asked
    - w_back
    - w_call
    - w_called
    - w_leave
    - w_message
    - w_phone
    - w_repeat
    - w_said
    - w_slowly
    - w_voicemail
    - w_wrote
templates:
- content_key: practice.de-en.en.a1.unit62.lesson01.choose.001
  lesson_content_key: en.a1.unit62.lesson01.phone_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_call
        - w_voicemail
        - w_message
        - w_phone
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Phone, call, message und voicemail sind die Kernwörter am Telefon; call ist Nomen und Verb.
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit62.lesson04.choose.002
  lesson_content_key: en.a1.unit62.lesson04.phone_message
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic:
        - w_called
        - w_asked
        - w_said
        - w_wrote
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Called, asked, said und wrote sind Vergangenheitsformen; said und wrote sind unregelmäßig.
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit62.lesson02.order.003
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: word_order
  frame:
    text: Please {item} that.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_repeat
  answer_derivation:
    kind: render_frame
    frame:
      text: Please {item} that.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Please repeat that ist eine höfliche Bitte um Wiederholung; nach please folgt das Verb ohne Endung.
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit62.lesson02.order.004
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: word_order
  frame:
    text: Please speak {item}.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_slowly
  answer_derivation:
    kind: render_frame
    frame:
      text: Please speak {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Slowly steht nach dem Verb speak.
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit62.lesson01.fill.005
  lesson_content_key: en.a1.unit62.lesson01.phone_words
  type: fill_in_blank
  frame:
    text: Please leave a {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id001
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_message
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Leave a message ist die feste Wendung für „eine Nachricht hinterlassen“.
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit62.lesson02.fill.006
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: fill_in_blank
  frame:
    text: I will call {item} later. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id002
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_back
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Call back bedeutet „zurückrufen“; back steht hinter dem Verb.
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit62.lesson02.translate.007
  lesson_content_key: en.a1.unit62.lesson02.phone_phrases
  type: translation
  frame:
    text: Bitte sprechen Sie langsam.
    language_code: de
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_slowly
  answer_derivation:
    kind: render_frame
    frame:
      text: Please speak {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Im Englischen gibt es kein „Sie“ in dieser Bitte; please speak slowly genügt.
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit62.lesson04.translate.008
  lesson_content_key: en.a1.unit62.lesson04.phone_message
  type: translation
  frame:
    text: Mia rief um 3:00 Uhr an.
    language_code: de
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_called
  answer_derivation:
    kind: render_frame
    frame:
      text: Mia {item} at 3:00.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Called ist die Vergangenheit von call; at steht vor der Uhrzeit.
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit62.lesson01.match.009
  lesson_content_key: en.a1.unit62.lesson01.phone_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slot_relations:
  - kind: distinct
    slots: &id004
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  slots:
    first: &id003
      language_code: en
      part_of_speech:
      - adverb
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_call
        - w_leave
        - w_voicemail
        - w_message
        - w_repeat
        - w_slowly
        - w_back
        - w_asked
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  answer_derivation:
    kind: matching_pairs
    slots: *id004
  feedback_frame:
    text: 'Diese Wörter gehören zum Telefonieren: anrufen, hinterlassen, Nachricht, wiederholen, langsam, zurück.'
    language_code: de
    direction: ltr
