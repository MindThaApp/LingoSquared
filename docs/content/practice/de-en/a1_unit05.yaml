schema_version: "1.0"
pack_key: practice.de-en.a1.unit05
source_language: de
target_language: en
unit_content_key: en.a1.unit05.time
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, de-en lane) against PRACTICE_PACK_RECIPE.md and the lexemes of
    scripts/backfill_lexemes_de_en.py (per-unit tags en_a1_uNN*, single-member w_<token> anchors).
    Recognition, matching and bare-word production pools are unit-scoped or curated w_ lists of this
    unit's tokens; sentence frames use a single w_ anchor or a curated w_ union, so the course-scope pool
    equals the unit-scope pool. Hint slots are rendered as the German gloss; production prompts show the
    German gloss or a German sentence. Feedback is German, formal Sie. Reviewer: check the German gloss
    of near-synonyms (fine=prima, good=gut, okay=in Ordnung, hello vs hi) and the fixed-sentence prompts,
    which pin the form (e.g. ohne Kurzform) because grading compares one exact English string.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["en_a1_u05", "en_a1_u05_l01", "en_a1_u05_l03", "w_at", "w_close", "w_closes", "w_does", "w_half", "w_in", "w_night", "w_o'clock", "w_past", "w_quarter", "w_store", "w_time"]
slot_presets:
  l1: &l1 {"language_code": "en", "part_of_speech": ["noun", "preposition"], "agreement_tags": {"semantic": "en_a1_u05_l01"}}
  l3: &l3 {"language_code": "en", "part_of_speech": ["noun", "preposition", "verb"], "agreement_tags": {"semantic": "en_a1_u05_l03"}}
  allu: &allu {"language_code": "en", "part_of_speech": ["noun", "preposition", "verb"], "agreement_tags": {"semantic": "en_a1_u05"}}
  mt: &mt {"language_code": "en", "part_of_speech": ["noun", "preposition"], "agreement_tags": {"semantic": ["w_time", "w_o'clock", "w_half", "w_quarter", "w_night", "w_store", "w_past"]}}
  tr3: &tr3 {"language_code": "en", "part_of_speech": ["noun", "verb"], "agreement_tags": {"semantic": ["w_night", "w_store", "w_closes"]}}
  w_half: &w_half {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_half"}}
  w_quarter: &w_quarter {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_quarter"}}
  w_oclock: &w_oclock {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_o'clock"}}
  w_at: &w_at {"language_code": "en", "part_of_speech": "preposition", "agreement_tags": {"semantic": "w_at"}}
  w_in: &w_in {"language_code": "en", "part_of_speech": "preposition", "agreement_tags": {"semantic": "w_in"}}
  w_does: &w_does {"language_code": "en", "part_of_speech": "verb", "agreement_tags": {"semantic": "w_does"}}
  w_close: &w_close {"language_code": "en", "part_of_speech": "verb", "agreement_tags": {"semantic": "w_close"}}
  w_time: &w_time {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_time"}}
  w_store: &w_store {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_store"}}
templates:
  - content_key: practice.de-en.en.a1.unit05.lesson01.choose.001
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Zur vollen Stunde sagen Sie im Englischen It's three o'clock; bei halb steht half past, wörtlich „halb nach“.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson01.listen.002
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Half past three bedeutet 3:30 Uhr und damit „halb vier“ im Deutschen; das Englische zählt von der letzten vollen Stunde aus.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson03.choose.003
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l3}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Vor einer Uhrzeit steht at, vor einer Tageszeit steht in: at nine, in the morning.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson03.listen.004
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l3}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Bei der Tageszeit night sagt man at night statt in the night; bei morning, afternoon und evening dagegen in the.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson04.choose.005
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *allu}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Fragen zu Öffnungszeiten bilden Sie mit does: What time does the library open?", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson01.order.006
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: word_order
    frame: {"text": "It's {item} past three.", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_half}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "It's {item} past three.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Half past three ist 3:30 Uhr; im Deutschen sagen Sie dafür „halb vier“.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson02.order.007
    lesson_content_key: en.a1.unit05.lesson02.quarter_times
    type: word_order
    frame: {"text": "It's a {item} past three.", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_quarter}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "It's a {item} past three.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "A quarter past three ist 3:15 Uhr und entspricht dem deutschen „Viertel nach drei“; vor quarter steht der Artikel a.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson01.fill.008
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: fill_in_blank
    frame: {"text": "It's three {item}. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_oclock, hint: *w_oclock}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "O'clock verwenden Sie nur bei vollen Stunden: It's three o'clock, aber nicht bei 3:30 Uhr.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson03.fill.009
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: fill_in_blank
    frame: {"text": "The store opens {item} nine in the morning. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_at, hint: *w_at}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Vor einer genauen Uhrzeit steht im Englischen at: at nine, at six.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson03.fill.010
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: fill_in_blank
    frame: {"text": "The store opens at nine {item} the morning. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_in, hint: *w_in}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Vor einer Tageszeit steht in the: in the morning, in the afternoon, in the evening.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson04.order.011
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: word_order
    frame: {"text": "What time {item} the library open?", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_does}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "What time {item} the library open?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "In Fragen übernimmt does die Verbform; das Hauptverb open bleibt dann ohne -s.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson03.match.012
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: matching_pairs
    frame: {"text": "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", "language_code": "en", "direction": "ltr"}
    slots: {first: *mt, second: *mt, third: *mt, fourth: *mt, fifth: *mt, sixth: *mt}
    slot_relations: [{"kind": "distinct", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {"kind": "matching_pairs", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {"text": "Time und quarter gehören zur Uhrzeit; store ist ein Geschäft, night die Nacht.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson04.fill.013
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: fill_in_blank
    frame: {"text": "And what time does it {item}? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_close, hint: *w_close}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Nach does steht das Verb ohne -s: does it close?, aber it closes.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson01.translate.014
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "O'clock verwenden Sie nur bei vollen Stunden, past bei den Minuten danach.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson01.translate.015
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: translation
    frame: {"text": "Wie spät ist es?", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_time}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "What {item} is it?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Mit what time fragen Sie nach der Uhrzeit; time bedeutet auch Zeit allgemein.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson02.translate.016
    lesson_content_key: en.a1.unit05.lesson02.quarter_times
    type: translation
    frame: {"text": "Es ist Viertel nach drei. (mit Kurzform)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_quarter}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "It's a {item} past three.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Past bedeutet „nach“: a quarter past three ist 3:15 Uhr.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson03.translate.017
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr3}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Das Nomen store ist im amerikanischen Englisch das gebräuchliche Wort für ein Geschäft; closes ist die Form für er, sie oder es.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit05.lesson04.translate.018
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: translation
    frame: {"text": "Um wie viel Uhr öffnet die Bibliothek?", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_does}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "What time {item} the library open?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "In der Frage übernimmt does die Endung: does the library open, aber it opens.", "language_code": "de", "direction": "ltr"}
