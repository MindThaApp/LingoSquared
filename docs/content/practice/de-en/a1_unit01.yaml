schema_version: "1.0"
pack_key: practice.de-en.a1.unit01
source_language: de
target_language: en
unit_content_key: en.a1.unit01.greetings
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, de-en lane) against PRACTICE_PACK_RECIPE.md and the lexemes of
    scripts/backfill_lexemes_de_en.py (per-unit tags en_a1_uNN*, single-member w_<token> anchors).
    Recognition, matching and bare-word production pools are unit-scoped or curated w_ lists of this
    unit's tokens; sentence frames use a single w_ anchor or a curated w_ union, so the course-scope pool
    equals the unit-scope pool. Hint slots are rendered as the German gloss; production prompts show the
    German gloss or a German sentence. Feedback is German, formal Sie. Reviewer: check the German gloss
    of near-synonyms (fine=prima, good=gut, okay=in Ordnung, hello vs hi) and the fixed-sentence prompts,
    which pin the form (e.g. ohne Kurzform) because grading compares one exact English string.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["en_a1_u01_l02", "en_a1_u01_l03", "w_afternoon", "w_and", "w_bad", "w_day", "w_evening", "w_fine", "w_good", "w_goodbye", "w_have", "w_hello", "w_how", "w_later", "w_meet", "w_morning", "w_not", "w_okay", "w_see", "w_thanks", "w_too", "w_you"]
slot_presets:
  greet: &greet {"language_code": "en", "part_of_speech": ["adjective", "noun"], "agreement_tags": {"semantic": ["w_hello", "w_goodbye", "w_morning", "w_afternoon", "w_evening", "w_good"]}}
  l02: &l02 {"language_code": "en", "part_of_speech": ["adjective", "adverb", "noun", "particle", "pronoun", "verb"], "agreement_tags": {"semantic": "en_a1_u01_l02"}}
  l03: &l03 {"language_code": "en", "part_of_speech": ["adjective", "adverb", "noun", "particle", "preposition", "verb"], "agreement_tags": {"semantic": "en_a1_u01_l03"}}
  greet_tr: &greet_tr {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_hello", "w_goodbye", "w_morning", "w_afternoon", "w_evening"]}}
  mt: &mt {"language_code": "en", "part_of_speech": ["adjective", "noun"], "agreement_tags": {"semantic": ["w_hello", "w_goodbye", "w_morning", "w_afternoon", "w_evening", "w_thanks", "w_bad", "w_fine"]}}
  daytime: &daytime {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_morning", "w_afternoon", "w_evening"]}}
  fine_good: &fine_good {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": ["w_fine", "w_good"]}}
  l02_tr: &l02_tr {"language_code": "en", "part_of_speech": ["adjective", "adverb", "noun", "particle"], "agreement_tags": {"semantic": ["w_how", "w_not", "w_bad", "w_thanks", "w_okay", "w_and"]}}
  l03_tr: &l03_tr {"language_code": "en", "part_of_speech": ["adverb", "noun", "verb"], "agreement_tags": {"semantic": ["w_meet", "w_see", "w_later", "w_have", "w_day", "w_too"]}}
  w_you: &w_you {"language_code": "en", "part_of_speech": "pronoun", "agreement_tags": {"semantic": "w_you"}}
  w_bad: &w_bad {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "w_bad"}}
  w_later: &w_later {"language_code": "en", "part_of_speech": "adverb", "agreement_tags": {"semantic": "w_later"}}
  w_too: &w_too {"language_code": "en", "part_of_speech": "adverb", "agreement_tags": {"semantic": "w_too"}}
  w_day: &w_day {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_day"}}
templates:
  - content_key: practice.de-en.en.a1.unit01.lesson01.choose.001
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *greet}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Für „Guten Tag“ gibt es im Englischen keine Form, die den ganzen Tag über passt: Sie wählen je nach Tageszeit good morning, good afternoon oder good evening.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson01.listen.002
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *greet}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Hello ist die neutrale Begrüßung; good morning, good afternoon und good evening richten sich nach der Tageszeit.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson03.choose.003
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l02}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "How are you? ist die übliche Frage nach dem Befinden; sie klingt gegenüber Freunden und gegenüber Fremden gleich, es gibt kein Sie und du.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson03.listen.004
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l02}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Auf I'm fine, thanks. folgt oft And you? als Gegenfrage; not bad ist eine lockere, zurückhaltende Antwort.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson05.choose.005
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l03}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Nice to meet you sagen Sie beim ersten Treffen, und die Antwort darauf ist Nice to meet you too.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson05.listen.006
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l03}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "See you later sagen Sie, wenn Sie die Person noch am selben Tag wiedersehen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson01.order.007
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: word_order
    frame: {"text": "Good {item}.", "language_code": "en", "direction": "ltr"}
    slots: {item: *daytime}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Good {item}.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Der Gruß richtet sich nach der Tageszeit: morning bis etwa zum Mittag, afternoon danach, evening am Abend.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson01.match.008
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: matching_pairs
    frame: {"text": "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", "language_code": "en", "direction": "ltr"}
    slots: {first: *mt, second: *mt, third: *mt, fourth: *mt, fifth: *mt, sixth: *mt}
    slot_relations: [{"kind": "distinct", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {"kind": "matching_pairs", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {"text": "Thanks ist die lockere Kurzform für „Danke“; fine und bad beschreiben, wie es einem geht.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson03.fill.009
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: fill_in_blank
    frame: {"text": "How are {item}? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_you, hint: *w_you}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Im Englischen heißt you sowohl du als auch Sie, deshalb bleibt die Frage How are you? in jeder Situation gleich.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson03.fill.010
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: fill_in_blank
    frame: {"text": "Not {item}, thanks. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_bad, hint: *w_bad}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Not bad ist wörtlich nicht schlecht und eine beliebte, bescheidene Antwort auf die Frage nach dem Befinden.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson03.order.011
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: word_order
    frame: {"text": "I'm {item}, thanks.", "language_code": "en", "direction": "ltr"}
    slots: {item: *fine_good}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "I'm {item}, thanks.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "I'm ist die Kurzform von I am; mit fine oder good antworten Sie auf How are you?", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson05.order.012
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: word_order
    frame: {"text": "See you {item}.", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_later}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "See you {item}.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "See you later ist wörtlich „Wir sehen uns später“ und bedeutet Bis später.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson05.fill.013
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: fill_in_blank
    frame: {"text": "Nice to meet you {item}. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_too, hint: *w_too}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Too steht am Satzende und bedeutet ebenfalls; so erwidern Sie den Gruß Nice to meet you.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson01.translate.014
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *greet_tr}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Gruß und Abschied richten sich im Englischen nach der Tageszeit; Goodbye ist die neutrale Verabschiedung.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson03.translate.015
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *l02_tr}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Das Wort not verneint, was danach folgt: not bad heißt „nicht schlecht“, und thanks ist die lockere Form von „danke“.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson03.translate.016
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: translation
    frame: {"text": "Wie geht es dir? (informell)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_you}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "How are {item}?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Auf Englisch gibt es nur ein you für du und Sie, deshalb kann der Satz in beiden Registern verwendet werden.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson05.translate.017
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: translation
    frame: {"text": "Bis später.", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_later}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "See you {item}.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Mit See you wird aus dem Wort für „später“ die Verabschiedung „Bis später“.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit01.lesson05.translate.018
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *l03_tr}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Das Verb meet bedeutet kennenlernen oder treffen; have a good day ist ein freundlicher Abschiedswunsch.", "language_code": "de", "direction": "ltr"}
