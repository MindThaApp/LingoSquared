schema_version: "1.0"
pack_key: practice.de-en.a1.unit10
source_language: de
target_language: en
unit_content_key: en.a1.unit10.directions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, de-en lane) against PRACTICE_PACK_RECIPE.md and the lexemes of
    scripts/backfill_lexemes_de_en.py (per-unit tags en_a1_uNN*, single-member w_<token> anchors).
    Recognition, matching and bare-word production pools are unit-scoped or curated w_ lists of this
    unit's tokens; sentence frames use a single w_ anchor or a curated w_ union, so the course-scope pool
    equals the unit-scope pool. Hint slots are rendered as the German gloss; production prompts show the
    German gloss or a German sentence. Feedback is German, formal Sie. Reviewer: check the German gloss
    of near-synonyms (fine=prima, good=gut, okay=in Ordnung, hello vs hi) and the fixed-sentence prompts,
    which pin the form (e.g. ohne Kurzform) because grading compares one exact English string.
    Opus pass 2026-10-24: one feedback line punctuated (quoted German imperative).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["en_a1_u10_l01", "en_a1_u10_l03", "w_can't", "w_corner", "w_first", "w_get", "w_left", "w_minutes", "w_miss", "w_right", "w_second", "w_stop", "w_straight", "w_street", "w_turn"]
slot_presets:
  l1: &l1 {"language_code": "en", "part_of_speech": ["adverb", "noun", "verb"], "agreement_tags": {"semantic": "en_a1_u10_l01"}}
  lr: &lr {"language_code": "en", "part_of_speech": ["adverb", "noun"], "agreement_tags": {"semantic": ["w_left", "w_right", "w_straight", "w_corner"]}}
  l2m: &l2m {"language_code": "en", "part_of_speech": ["noun", "verb"], "agreement_tags": {"semantic": ["w_get", "w_minutes", "w_miss", "w_can't"]}}
  l3: &l3 {"language_code": "en", "part_of_speech": ["adjective", "noun", "verb"], "agreement_tags": {"semantic": "en_a1_u10_l03"}}
  mix: &mix {"language_code": "en", "part_of_speech": ["adverb", "noun", "verb"], "agreement_tags": {"semantic": ["w_turn", "w_left", "w_right", "w_straight", "w_stop", "w_corner", "w_street", "w_minutes"]}}
  lrr: &lrr {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_left", "w_right"]}}
  sf: &sf {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": ["w_first", "w_second"]}}
  tr2: &tr2 {"language_code": "en", "part_of_speech": ["noun", "verb"], "agreement_tags": {"semantic": ["w_get", "w_minutes", "w_miss"]}}
  w_straight: &w_straight {"language_code": "en", "part_of_speech": "adverb", "agreement_tags": {"semantic": "w_straight"}}
  w_minutes: &w_minutes {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_minutes"}}
  w_corner: &w_corner {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_corner"}}
  w_miss: &w_miss {"language_code": "en", "part_of_speech": "verb", "agreement_tags": {"semantic": "w_miss"}}
  w_street: &w_street {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_street"}}
  w_get: &w_get {"language_code": "en", "part_of_speech": "verb", "agreement_tags": {"semantic": "w_get"}}
  w_left: &w_left {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_left"}}
  w_turn: &w_turn {"language_code": "en", "part_of_speech": "verb", "agreement_tags": {"semantic": "w_turn"}}
templates:
  - content_key: practice.de-en.en.a1.unit10.lesson01.choose.001
    lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Turn left und turn right sind Befehlsformen ohne you; im Deutschen entspricht das „Biegen Sie links ab“.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson02.choose.002
    lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l2m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Can't ist die Kurzform von cannot; You can't miss it bedeutet, dass man das Ziel gar nicht übersehen kann.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson03.choose.003
    lesson_content_key: en.a1.unit10.lesson03.reading_a_route
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l3}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "First und second sind Ordnungszahlen; sie stehen mit the vor dem Nomen: the first street.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson01.order.004
    lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
    type: word_order
    frame: {"text": "Turn {item} at the corner.", "language_code": "en", "direction": "ltr"}
    slots: {item: *lrr}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Turn {item} at the corner.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Left und right stehen ohne Artikel nach Turn; mit on the davor beschreiben Sie dagegen eine Seite: on the left.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson02.order.005
    lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
    type: word_order
    frame: {"text": "It's just two {item} from here.", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_minutes}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "It's just two {item} from here.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Minutes ist der Plural von minute; nach der Zahl two steht die Mehrzahl.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson03.order.006
    lesson_content_key: en.a1.unit10.lesson03.reading_a_route
    type: word_order
    frame: {"text": "Take the {item} street on the left.", "language_code": "en", "direction": "ltr"}
    slots: {item: *sf}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Take the {item} street on the left.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Ordnungszahlen wie first und second stehen mit the vor dem Nomen: the first street, the second street.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson01.fill.007
    lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
    type: fill_in_blank
    frame: {"text": "Turn left at the {item}. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_corner, hint: *w_corner}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "At the corner bedeutet an der Ecke; mit at nennen Sie den Punkt, an dem Sie abbiegen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson02.fill.008
    lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
    type: fill_in_blank
    frame: {"text": "You can't {item} it. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_miss, hint: *w_miss}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Miss heißt hier verfehlen oder übersehen; You can't miss it ist eine häufige Wendung, wenn das Ziel gut sichtbar ist.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson02.fill.009
    lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
    type: fill_in_blank
    frame: {"text": "How do I {item} to the bank? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_get, hint: *w_get}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Get to bedeutet gelangen zu; How do I get to ...? ist die übliche Frage nach dem Weg.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson03.fill.010
    lesson_content_key: en.a1.unit10.lesson03.reading_a_route
    type: fill_in_blank
    frame: {"text": "Take the first {item} on the left. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_street, hint: *w_street}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Street ist die Straße; im Satz steht on the left, weil die Seite angegeben wird.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson01.match.011
    lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
    type: matching_pairs
    frame: {"text": "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", "language_code": "en", "direction": "ltr"}
    slots: {first: *mix, second: *mix, third: *mix, fourth: *mix, fifth: *mix, sixth: *mix}
    slot_relations: [{"kind": "distinct", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {"kind": "matching_pairs", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {"text": "Die Wörter dieses Spiels beschreiben Wege: turn, left, right, straight und stop sind Anweisungen, corner und street Orte.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson01.translate.012
    lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Left und right stehen als Adverb nach turn: Turn left, Turn right.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson02.translate.013
    lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr2}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Get bedeutet hier gelangen; minutes ist die Mehrzahl von minute; miss heißt verfehlen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson03.translate.014
    lesson_content_key: en.a1.unit10.lesson03.reading_a_route
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *l3}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Take the first street bedeutet „Nehmen Sie die erste Straße“; directions steht im Englischen im Plural.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson01.translate.015
    lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
    type: translation
    frame: {"text": "Biegen Sie links ab.", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_left}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Turn {item}.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Turn left ist ein kurzer Befehl; Sie brauchen kein you und keinen Artikel.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson02.translate.016
    lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
    type: translation
    frame: {"text": "Sie können es nicht verfehlen. (mit Kurzform)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_miss}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "You can't {item} it.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Can't ist die Kurzform von cannot; miss bedeutet hier verfehlen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit10.lesson03.translate.017
    lesson_content_key: en.a1.unit10.lesson03.reading_a_route
    type: translation
    frame: {"text": "Nehmen Sie die erste Straße links.", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_street}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Take the first {item} on the left.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "On the left steht im Englischen hinter dem Nomen: the first street on the left; im Deutschen heißt es „die erste Straße links“.", "language_code": "de", "direction": "ltr"}
