schema_version: "1.0"
pack_key: practice.de-en.a1.unit13
source_language: de
target_language: en
unit_content_key: en.a1.unit13.emotions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, de-en lane) against PRACTICE_PACK_RECIPE.md and the lexemes of
    scripts/backfill_lexemes_de_en.py (per-unit tags en_a1_uNN*, single-member w_<token> anchors).
    Recognition, matching and bare-word production pools are unit-scoped or curated w_ lists of this
    unit's tokens; sentence frames use a single w_ anchor or a curated w_ union, so the course-scope pool
    equals the unit-scope pool. Hint slots are rendered as the German gloss; production prompts show the
    German gloss or a German sentence. Feedback is German, formal Sie. Reviewer: check the German gloss
    of near-synonyms (fine=prima, good=gut, okay=in Ordnung, hello vs hi) and the fixed-sentence prompts,
    which pin the form (e.g. ohne Kurzform) because grading compares one exact English string.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["en_a1_u13_l01", "w_almost", "w_because", "w_class", "w_excited", "w_happy", "w_last", "w_little", "w_oh", "w_sad", "w_test", "w_tired", "w_understand", "w_worried", "w_writer", "w_year"]
slot_presets:
  l1: &l1 {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "en_a1_u13_l01"}}
  l2m: &l2m {"language_code": "en", "part_of_speech": ["adverb", "noun", "particle"], "agreement_tags": {"semantic": ["w_test", "w_class", "w_because", "w_almost"]}}
  l3m: &l3m {"language_code": "en", "part_of_speech": ["adjective", "noun"], "agreement_tags": {"semantic": ["w_last", "w_year", "w_writer", "w_test"]}}
  l4m: &l4m {"language_code": "en", "part_of_speech": ["adverb", "particle", "verb"], "agreement_tags": {"semantic": ["w_oh", "w_understand", "w_because", "w_almost"]}}
  mix: &mix {"language_code": "en", "part_of_speech": ["adjective", "noun"], "agreement_tags": {"semantic": ["w_happy", "w_sad", "w_tired", "w_excited", "w_worried", "w_test", "w_class", "w_year"]}}
  tr2: &tr2 {"language_code": "en", "part_of_speech": ["adverb", "noun", "particle"], "agreement_tags": {"semantic": ["w_test", "w_class", "w_almost", "w_because"]}}
  tr3: &tr3 {"language_code": "en", "part_of_speech": ["adjective", "noun"], "agreement_tags": {"semantic": ["w_last", "w_year", "w_writer"]}}
  w_little: &w_little {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "w_little"}}
  w_test: &w_test {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_test"}}
  w_writer: &w_writer {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_writer"}}
  w_understand: &w_understand {"language_code": "en", "part_of_speech": "verb", "agreement_tags": {"semantic": "w_understand"}}
  w_worried: &w_worried {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "w_worried"}}
  w_because: &w_because {"language_code": "en", "part_of_speech": "particle", "agreement_tags": {"semantic": "w_because"}}
  w_almost: &w_almost {"language_code": "en", "part_of_speech": "adverb", "agreement_tags": {"semantic": "w_almost"}}
  w_last: &w_last {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "w_last"}}
  w_year: &w_year {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_year"}}
  w_tired: &w_tired {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "w_tired"}}
templates:
  - content_key: practice.de-en.en.a1.unit13.lesson01.choose.001
    lesson_content_key: en.a1.unit13.lesson01.feeling_words
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Nach I'm steht das Gefühl als Adjektiv: I'm happy, I'm tired; ein eigenes Verb wie im Deutschen „sich freuen“ brauchen Sie nicht.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson02.choose.002
    lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l2m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Because leitet einen Grund ein und steht im Englischen in der normalen Satzstellung: I'm happy because the class is almost over.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson03.choose.003
    lesson_content_key: en.a1.unit13.lesson03.reading_a_message
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l3m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Last bedeutet hier letzte; im Satz it's the last one this year ist es die letzte Prüfung des Jahres.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson04.choose.004
    lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l4m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Oh, I understand zeigt, dass Sie verstanden haben und Anteil nehmen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson01.order.005
    lesson_content_key: en.a1.unit13.lesson01.feeling_words
    type: word_order
    frame: {"text": "I'm {item} today.", "language_code": "en", "direction": "ltr"}
    slots: {item: *l1}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "I'm {item} today.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Nach I'm steht das Adjektiv ohne Artikel: I'm happy, I'm sad.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson03.order.006
    lesson_content_key: en.a1.unit13.lesson03.reading_a_message
    type: word_order
    frame: {"text": "The {item} is worried and excited.", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_writer}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "The {item} is worried and excited.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "The writer ist die Person, die die Nachricht geschrieben hat; die Zusammenfassung steht in der dritten Person mit is.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson04.order.007
    lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
    type: word_order
    frame: {"text": "Oh, I {item}.", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_understand}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Oh, I {item}.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "I understand bedeutet ich verstehe; understand hat keine Verlaufsform.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson01.fill.008
    lesson_content_key: en.a1.unit13.lesson01.feeling_words
    type: fill_in_blank
    frame: {"text": "I'm {item}. I have a big test tomorrow. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_worried, hint: *w_worried}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Worried bedeutet besorgt; die Ursache folgt im nächsten Satz oder nach because.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson02.fill.009
    lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
    type: fill_in_blank
    frame: {"text": "I'm happy {item} the class is almost over. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_because, hint: *w_because}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Because leitet den Grund ein; im Englischen bleibt die Satzstellung wie im Hauptsatz.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson02.fill.010
    lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
    type: fill_in_blank
    frame: {"text": "The class is {item} over. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_almost, hint: *w_almost}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Almost bedeutet fast; almost over heißt, dass etwas bald vorbei ist.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson03.fill.011
    lesson_content_key: en.a1.unit13.lesson03.reading_a_message
    type: fill_in_blank
    frame: {"text": "It's the {item} one this year! ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_last, hint: *w_last}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Last bedeutet hier letzte; the last one this year ist die letzte Prüfung in diesem Jahr.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson01.match.012
    lesson_content_key: en.a1.unit13.lesson01.feeling_words
    type: matching_pairs
    frame: {"text": "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", "language_code": "en", "direction": "ltr"}
    slots: {first: *mix, second: *mix, third: *mix, fourth: *mix, fifth: *mix, sixth: *mix}
    slot_relations: [{"kind": "distinct", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {"kind": "matching_pairs", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {"text": "Happy, sad, tired, excited und worried sind Gefühle; test, class und year gehören zu den Gründen in den Beispielen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson01.translate.013
    lesson_content_key: en.a1.unit13.lesson01.feeling_words
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Nach I'm stehen die Gefühle als Adjektiv, zum Beispiel I'm tired.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson02.translate.014
    lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr2}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Test und class stehen für Prüfung und Unterricht; almost bedeutet fast.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson03.translate.015
    lesson_content_key: en.a1.unit13.lesson03.reading_a_message
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr3}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Writer ist die Person, die schreibt; im Beispiel ist es die Absenderin oder der Absender der Nachricht.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson01.translate.016
    lesson_content_key: en.a1.unit13.lesson01.feeling_words
    type: translation
    frame: {"text": "Ich bin müde. (mit Kurzform)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_tired}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "I'm {item}.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "I'm ist die Kurzform von I am; tired beschreibt den Zustand.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson02.translate.017
    lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
    type: translation
    frame: {"text": "Ich bin ein bisschen besorgt. (mit Kurzform)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_little}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "I'm a {item} worried.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "A little vor einem Adjektiv schwächt das Gefühl ab: a little worried.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit13.lesson04.translate.018
    lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
    type: translation
    frame: {"text": "Ach, ich verstehe.", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_understand}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Oh, I {item}.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Oh am Satzanfang drückt Verstehen oder Überraschung aus; understand hat kein -s nach I.", "language_code": "de", "direction": "ltr"}
