schema_version: "1.0"
pack_key: practice.de-en.a1.unit08
source_language: de
target_language: en
unit_content_key: en.a1.unit08.shopping
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, de-en lane) against PRACTICE_PACK_RECIPE.md and the lexemes of
    scripts/backfill_lexemes_de_en.py (per-unit tags en_a1_uNN*, single-member w_<token> anchors).
    Recognition, matching and bare-word production pools are unit-scoped or curated w_ lists of this
    unit's tokens; sentence frames use a single w_ anchor or a curated w_ union, so the course-scope pool
    equals the unit-scope pool. Hint slots are rendered as the German gloss; production prompts show the
    German gloss or a German sentence. Feedback is German, formal Sie. Reviewer: check the German gloss
    of near-synonyms (fine=prima, good=gut, okay=in Ordnung, hello vs hi) and the fixed-sentence prompts,
    which pin the form (e.g. ohne Kurzform) because grading compares one exact English string.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_bag", "w_bottle", "w_dozen", "w_eggs", "w_fresh", "w_kilo", "w_of", "w_per", "w_pound", "w_pounds", "w_rice", "w_tomatoes"]
slot_presets:
  cont: &cont {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_pound", "w_dozen", "w_bottle", "w_bag", "w_kilo"]}}
  qall: &qall {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_pound", "w_dozen", "w_eggs", "w_bottle", "w_bag", "w_rice", "w_kilo", "w_tomatoes"]}}
  goods: &goods {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_eggs", "w_rice", "w_tomatoes"]}}
  l2m: &l2m {"language_code": "en", "part_of_speech": ["adjective", "noun"], "agreement_tags": {"semantic": ["w_fresh", "w_pounds", "w_tomatoes", "w_bag"]}}
  l3m: &l3m {"language_code": "en", "part_of_speech": ["noun", "preposition"], "agreement_tags": {"semantic": ["w_per", "w_of", "w_bag", "w_dozen"]}}
  tr2: &tr2 {"language_code": "en", "part_of_speech": ["adjective", "noun"], "agreement_tags": {"semantic": ["w_fresh", "w_pounds", "w_bottle", "w_bag"]}}
  tr3: &tr3 {"language_code": "en", "part_of_speech": ["noun", "preposition"], "agreement_tags": {"semantic": ["w_per", "w_of", "w_dozen", "w_bag"]}}
  pkb: &pkb {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_pound", "w_kilo", "w_bag"]}}
  w_pounds: &w_pounds {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_pounds"}}
  w_fresh: &w_fresh {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "w_fresh"}}
  w_per: &w_per {"language_code": "en", "part_of_speech": "preposition", "agreement_tags": {"semantic": "w_per"}}
  w_of: &w_of {"language_code": "en", "part_of_speech": "preposition", "agreement_tags": {"semantic": "w_of"}}
  w_eggs: &w_eggs {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_eggs"}}
  w_tomatoes: &w_tomatoes {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_tomatoes"}}
  w_bottle: &w_bottle {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_bottle"}}
  w_dozen: &w_dozen {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_dozen"}}
templates:
  - content_key: practice.de-en.en.a1.unit08.lesson01.choose.001
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *cont}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Pound, kilo, dozen, bottle und bag sind Mengenangaben; sie stehen im Englischen mit of vor dem Nomen: a bag of rice.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson01.listen.002
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: listen_select
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *qall}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Eggs und tomatoes stehen im Plural; rice bleibt dagegen in der Einzahl, weil es ein Stoffname ist.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson02.choose.003
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l2m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Fresh bedeutet frisch; Is it fresh? fragen Sie beim Einkauf von Obst, Gemüse oder Eiern.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson03.choose.004
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l3m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Per bedeutet pro: two dollars per pound ist dasselbe wie two dollars a pound.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson01.order.005
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: word_order
    frame: {"text": "I'd like a {item} of apples, please.", "language_code": "en", "direction": "ltr"}
    slots: {item: *pkb}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "I'd like a {item} of apples, please.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Nach einer Mengenangabe folgt of: a pound of apples, a bag of apples.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson02.order.006
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: word_order
    frame: {"text": "Can I have two {item}, please?", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_pounds}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Can I have two {item}, please?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Nach two steht der Plural pounds; bei one pound steht die Einzahl.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson03.order.007
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: word_order
    frame: {"text": "Apples: two dollars {item} pound.", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_per}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Apples: two dollars {item} pound.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Per pound bedeutet pro Pfund und steht auf Preisschildern; a pound sagt man gesprochen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson01.fill.008
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: fill_in_blank
    frame: {"text": "A kilo of {item}, please. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_tomatoes, hint: *w_tomatoes}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Tomatoes ist der Plural von tomato; nach a kilo of steht das Nomen im Plural oder ein Stoffname.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson02.fill.009
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: fill_in_blank
    frame: {"text": "Is it {item}? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_fresh, hint: *w_fresh}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Fresh bedeutet frisch; im Deutschen steht dasselbe Adjektiv ohne Endung hinter dem Verb.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson03.fill.010
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: fill_in_blank
    frame: {"text": "A bag {item} rice, please. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_of, hint: *w_of}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Nach einer Mengenangabe wie a bag steht of: a bag of rice.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson01.match.011
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: matching_pairs
    frame: {"text": "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", "language_code": "en", "direction": "ltr"}
    slots: {first: *qall, second: *qall, third: *qall, fourth: *qall, fifth: *qall, sixth: *qall}
    slot_relations: [{"kind": "distinct", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {"kind": "matching_pairs", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {"text": "Pound, kilo und dozen sind Maße; bottle und bag sind Behälter; eggs, rice und tomatoes sind die Waren.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson01.translate.012
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *goods}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Eggs und tomatoes sind Pluralwörter; rice ist ein Stoffname und hat keinen Plural.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson02.translate.013
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr2}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Pounds ist die Mehrzahl von pound; bottle ist eine Flasche und bag eine Tüte.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson03.translate.014
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr3}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Per bedeutet pro; of verbindet eine Mengenangabe mit der Ware.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson01.translate.015
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: translation
    frame: {"text": "Eine Flasche Wasser.", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_bottle}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "A {item} of water.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Nach einer Mengenangabe wie bottle steht of; water bleibt in der Einzahl.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson02.translate.016
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: translation
    frame: {"text": "Ist es frisch?", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_fresh}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Is it {item}?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Mit Is it ...? fragen Sie nach einer Eigenschaft eines einzelnen Dinges.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson02.translate.017
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: translation
    frame: {"text": "Kann ich zwei Pfund haben, bitte? (mit Can I have)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_pounds}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Can I have two {item}, please?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Nach two steht der Plural pounds; Can I have ...? ist die höfliche Bitte.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit08.lesson01.translate.018
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: translation
    frame: {"text": "Ein Dutzend Eier.", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_eggs}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "A dozen {item}.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Dozen bleibt nach a in der Einzahl; die Eier stehen ohne of direkt danach im Plural.", "language_code": "de", "direction": "ltr"}
