    direction: ltr
- content_key: practice.de-en.en.a1.unit63.lesson01.fill.005
  lesson_content_key: en.a1.unit63.lesson01.help_words
  type: fill_in_blank
  frame:
    text: Put it on the {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id001
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_shelf
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Put it on the shelf: put bedeutet hier „legen“ und „stellen“.'
    language_code: de
    direction: ltr
