schema_version: '1.0'
pack_key: practice.de-en.a1.unit63
source_language: de
target_language: en
unit_content_key: en.a1.unit63.asking_for_help
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Authored session 14 (depth-a1) against PRACTICE_PACK_RECIPE.md and the lexemes of scripts/backfill_lexemes_de_en.py. Slots use single-member or curated w_<token> anchors so course scope equals unit scope; fixed-sentence prompts pin the English
    form (no contractions). Feedback is German, formal Sie. The nl-en sibling pack had no tag-compatible templates for this unit, so this pack is hand-built. Needs native review of the German prompts and feedback.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_carry
    - w_course
    - w_door
    - w_heavy
    - w_help
    - w_helpful
    - w_neighbor
    - w_note
    - w_open
    - w_put
    - w_shelf
    - w_thanked
templates:
- content_key: practice.de-en.en.a1.unit63.lesson01.choose.001
  lesson_content_key: en.a1.unit63.lesson01.help_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adjective
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_carry
        - w_heavy
        - w_shelf
        - w_put
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Carry, heavy, shelf und put beschreiben, wie man mit einer schweren Tasche hilft.
    language_code: de
    direction: ltr
