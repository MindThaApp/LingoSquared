- content_key: practice.de-en.en.a1.unit63.lesson01.order.003
  lesson_content_key: en.a1.unit63.lesson01.help_words
  type: word_order
  frame:
    text: This bag is {item}.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_heavy
