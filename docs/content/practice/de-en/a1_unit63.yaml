- content_key: practice.de-en.en.a1.unit63.lesson02.order.004
  lesson_content_key: en.a1.unit63.lesson02.help_phrases
  type: word_order
  frame:
    text: Could you {item} the door?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_open
  answer_derivation:
    kind: render_frame
    frame:
      text: Could you {item} the door?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Nach Could you steht das Verb ohne Endung und ohne to: Could you open ...?'
