- content_key: practice.de-en.en.a1.unit63.lesson01.match.009
  lesson_content_key: en.a1.unit63.lesson01.help_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slot_relations:
  - kind: distinct
    slots: &id004
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  slots:
    first: &id003
      language_code: en
      part_of_speech:
      - adjective
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_carry
        - w_heavy
        - w_shelf
        - w_put
        - w_help
        - w_door
        - w_note
        - w_neighbor
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  answer_derivation:
    kind: matching_pairs
    slots: *id004
  feedback_frame:
    text: 'Diese Wörter gehören zum Thema Hilfe im Alltag: tragen, schwer, Regal, legen, helfen, Tür, Zettel, Nachbar.'
    language_code: de
    direction: ltr
