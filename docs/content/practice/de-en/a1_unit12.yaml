schema_version: "1.0"
pack_key: practice.de-en.a1.unit12
source_language: de
target_language: en
unit_content_key: en.a1.unit12.clothing
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, de-en lane) against PRACTICE_PACK_RECIPE.md and the lexemes of
    scripts/backfill_lexemes_de_en.py (per-unit tags en_a1_uNN*, single-member w_<token> anchors).
    Recognition, matching and bare-word production pools are unit-scoped or curated w_ lists of this
    unit's tokens; sentence frames use a single w_ anchor or a curated w_ union, so the course-scope pool
    equals the unit-scope pool. Hint slots are rendered as the German gloss; production prompts show the
    German gloss or a German sentence. Feedback is German, formal Sie. Reviewer: check the German gloss
    of near-synonyms (fine=prima, good=gut, okay=in Ordnung, hello vs hi) and the fixed-sentence prompts,
    which pin the form (e.g. ohne Kurzform) because grading compares one exact English string.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["en_a1_u12_l01", "en_a1_u12_l02", "w_black", "w_blue", "w_color", "w_dress", "w_i'll", "w_jacket", "w_large", "w_medium", "w_pants", "w_shirt", "w_shoes", "w_size", "w_small", "w_we"]
slot_presets:
  l1: &l1 {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "en_a1_u12_l01"}}
  l2: &l2 {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "en_a1_u12_l02"}}
  bb: &bb {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": ["w_blue", "w_black", "w_small", "w_large"]}}
  l3m: &l3m {"language_code": "en", "part_of_speech": ["adjective", "noun"], "agreement_tags": {"semantic": ["w_size", "w_color", "w_shirt", "w_medium"]}}
  l4m: &l4m {"language_code": "en", "part_of_speech": ["noun", "pronoun"], "agreement_tags": {"semantic": ["w_i'll", "w_we", "w_jacket", "w_shoes"]}}
  mix: &mix {"language_code": "en", "part_of_speech": ["adjective", "noun"], "agreement_tags": {"semantic": ["w_shirt", "w_pants", "w_shoes", "w_jacket", "w_dress", "w_blue", "w_black", "w_size"]}}
  sizes: &sizes {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": ["w_small", "w_medium", "w_large"]}}
  cols: &cols {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": ["w_blue", "w_black"]}}
  tr3: &tr3 {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": ["w_size", "w_color", "w_dress"]}}
  w_shirt: &w_shirt {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_shirt"}}
  w_blue: &w_blue {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "w_blue"}}
  w_we: &w_we {"language_code": "en", "part_of_speech": "pronoun", "agreement_tags": {"semantic": "w_we"}}
  w_size: &w_size {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_size"}}
  w_color: &w_color {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_color"}}
  w_ill: &w_ill {"language_code": "en", "part_of_speech": "pronoun", "agreement_tags": {"semantic": "w_i'll"}}
  w_jacket: &w_jacket {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_jacket"}}
templates:
  - content_key: practice.de-en.en.a1.unit12.lesson01.choose.001
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Pants und shoes stehen immer im Plural; ein Paar heißt a pair of pants oder a pair of shoes.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson02.choose.002
    lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l2}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Größen und Farben sind Adjektive; sie stehen nach in oder vor dem Nomen: a blue shirt, in blue.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson04.choose.003
    lesson_content_key: en.a1.unit12.lesson04.clothing_store_dialogue
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l4m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "I'll ist die Kurzform von I will; we steht für wir. Beides verwenden Sie, wenn Sie im Geschäft eine Entscheidung nennen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson03.choose.004
    lesson_content_key: en.a1.unit12.lesson03.reading_a_label
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l3m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Size und color stehen oft auf dem Etikett; hinter dem Doppelpunkt folgt der Wert, zum Beispiel Size: Medium.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson01.order.005
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: word_order
    frame: {"text": "I'll take the {item}.", "language_code": "en", "direction": "ltr"}
    slots: {item: *l1}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "I'll take the {item}.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Mit the nennen Sie genau das Kleidungsstück, das Sie gerade ansehen; I'll take ... bedeutet ich nehme es.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson02.order.006
    lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
    type: word_order
    frame: {"text": "Do you have it in {item}?", "language_code": "en", "direction": "ltr"}
    slots: {item: *cols}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Do you have it in {item}?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Mit in nennen Sie die gewünschte Farbe: Do you have it in blue?", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson04.order.007
    lesson_content_key: en.a1.unit12.lesson04.clothing_store_dialogue
    type: word_order
    frame: {"text": "Yes, {item} do.", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_we}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Yes, {item} do.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "We do ist die Kurzantwort auf Do you have ...? und wiederholt do statt des ganzen Satzes.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson01.fill.008
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: fill_in_blank
    frame: {"text": "Do you have this {item} in a medium? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_shirt, hint: *w_shirt}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Shirt ist das Hemd; this zeigt auf das Stück, das Sie in der Hand haben.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson02.fill.009
    lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
    type: fill_in_blank
    frame: {"text": "Do you have it in {item}? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_blue, hint: *w_blue}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Bei Farben steht in ohne Artikel: in blue, in black.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson03.fill.010
    lesson_content_key: en.a1.unit12.lesson03.reading_a_label
    type: fill_in_blank
    frame: {"text": "The shirt's {item} is medium. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_size, hint: *w_size}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Size bedeutet Größe; The shirt's ist die Besitzform von the shirt.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson04.fill.011
    lesson_content_key: en.a1.unit12.lesson04.clothing_store_dialogue
    type: fill_in_blank
    frame: {"text": "OK, {item} take it, thanks. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_ill, hint: *w_ill}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "I'll ist die Kurzform von I will; I'll take it bedeutet ich nehme es.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson01.match.012
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: matching_pairs
    frame: {"text": "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", "language_code": "en", "direction": "ltr"}
    slots: {first: *mix, second: *mix, third: *mix, fourth: *mix, fifth: *mix, sixth: *mix}
    slot_relations: [{"kind": "distinct", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {"kind": "matching_pairs", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {"text": "Shirt, pants, shoes, jacket und dress sind Kleidungsstücke; blue und black sind Farben, size die Größe.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson01.translate.013
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Pants und shoes stehen im Englischen nur im Plural.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson02.translate.014
    lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *l2}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Small, medium und large sind Größen; blue und black sind Farben.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson03.translate.015
    lesson_content_key: en.a1.unit12.lesson03.reading_a_label
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr3}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Size ist die Größe und color die Farbe; dress ist ein Kleid, kein Anzug.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson01.translate.016
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: translation
    frame: {"text": "Das Hemd ist blau.", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_shirt}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "The {item} is blue.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Nach is steht das Adjektiv blue ohne Artikel; shirt ist das Hemd.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson02.translate.017
    lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
    type: translation
    frame: {"text": "Haben Sie es in Blau?", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_blue}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "Do you have it in {item}?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Mit Do you have it in ...? fragen Sie nach einer anderen Farbe oder Größe.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit12.lesson04.translate.018
    lesson_content_key: en.a1.unit12.lesson04.clothing_store_dialogue
    type: translation
    frame: {"text": "OK, ich nehme es, danke. (mit Kurzform)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_ill}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "OK, {item} take it, thanks.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "I'll steht für I will und drückt eine Entscheidung im Moment des Sprechens aus.", "language_code": "de", "direction": "ltr"}
