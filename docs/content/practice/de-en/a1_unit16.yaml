schema_version: '1.0'
pack_key: practice.de-en.a1.unit16
source_language: de
target_language: en
unit_content_key: en.a1.unit16.routines
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Authored session 14 (depth-a1) against PRACTICE_PACK_RECIPE.md and the lexemes of scripts/backfill_lexemes_de_en.py. Slots use single-member or curated w_<token> anchors so course scope equals unit scope; fixed-sentence prompts pin the English
    form (no contractions). Feedback is German, formal Sie. The nl-en sibling pack had no tag-compatible templates for this unit, so this pack is hand-built. Needs native review of the German prompts and feedback.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_after
    - w_bed
    - w_breakfast
    - w_day
    - w_dinner
    - w_every
    - w_morning
    - w_time
    - w_usually
templates:
- content_key: practice.de-en.en.a1.unit16.lesson01.choose.001
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic:
        - w_dinner
        - w_bed
        - w_breakfast
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mahlzeiten stehen im Englischen ohne Artikel: have breakfast, have dinner. Bei go to bed fehlt der Artikel ebenfalls.'
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit16.lesson02.choose.002
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adjective
      - adverb
      - preposition
      agreement_tags:
        semantic:
        - w_usually
        - w_every
        - w_after
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Usually, every und after stehen vor dem Verb oder am Anfang einer Zeitangabe: I usually go, every day, after that.'
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit16.lesson01.order.003
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: word_order
  frame:
    text: I have {item} at seven.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic:
        - w_breakfast
        - w_dinner
  answer_derivation:
    kind: render_frame
    frame:
      text: I have {item} at seven.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Vor breakfast und dinner steht kein Artikel: I have breakfast, nicht I have a breakfast.'
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit16.lesson02.order.004
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: word_order
  frame:
    text: I {item} go to bed at eleven.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_usually
  answer_derivation:
    kind: render_frame
    frame:
      text: I {item} go to bed at eleven.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Usually steht vor dem Vollverb go; das deutsche „Ich gehe normalerweise ...“ lässt sich nicht wortwörtlich übertragen.
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit16.lesson02.fill.005
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: fill_in_blank
  frame:
    text: I {item} go to bed at eleven. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id001
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_usually
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Usually (normalerweise) steht zwischen Subjekt und Vollverb: I usually go.'
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit16.lesson01.fill.006
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: fill_in_blank
  frame:
    text: I have {item} at seven. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id002
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_breakfast
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Have breakfast und have dinner sind feste Wendungen ohne Artikel.
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit16.lesson02.translate.007
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: translation
  frame:
    text: Ich gehe normalerweise um elf Uhr ins Bett.
    language_code: de
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_usually
  answer_derivation:
    kind: render_frame
    frame:
      text: I {item} go to bed at eleven.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Im Englischen steht usually vor go; at steht vor der Uhrzeit.
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit16.lesson04.translate.008
  lesson_content_key: en.a1.unit16.lesson04.routine_dialogue
  type: translation
  frame:
    text: Was machst du danach?
    language_code: de
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_after
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you do {item} that?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Mit after that fragen Sie nach dem, was auf etwas folgt; die Frage braucht do.
    language_code: de
    direction: ltr
- content_key: practice.de-en.en.a1.unit16.lesson01.match.009
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slot_relations:
  - kind: distinct
    slots: &id004
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  slots:
    first: &id003
      language_code: en
      part_of_speech:
      - adverb
      - noun
      - preposition
      agreement_tags:
        semantic:
        - w_dinner
        - w_bed
        - w_breakfast
        - w_usually
        - w_after
        - w_morning
        - w_day
        - w_time
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  answer_derivation:
    kind: matching_pairs
    slots: *id004
  feedback_frame:
    text: 'Die Wörter dieses Spiels gehören zum Tagesablauf: Mahlzeiten (breakfast, dinner), Zeitangaben (morning, day, time, after) und usually.'
    language_code: de
    direction: ltr
