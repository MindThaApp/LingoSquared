schema_version: "1.0"
pack_key: practice.de-en.a1.unit11
source_language: de
target_language: en
unit_content_key: en.a1.unit11.weather
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, de-en lane) against PRACTICE_PACK_RECIPE.md and the lexemes of
    scripts/backfill_lexemes_de_en.py (per-unit tags en_a1_uNN*, single-member w_<token> anchors).
    Recognition, matching and bare-word production pools are unit-scoped or curated w_ lists of this
    unit's tokens; sentence frames use a single w_ anchor or a curated w_ union, so the course-scope pool
    equals the unit-scope pool. Hint slots are rendered as the German gloss; production prompts show the
    German gloss or a German sentence. Feedback is German, formal Sie. Reviewer: check the German gloss
    of near-synonyms (fine=prima, good=gut, okay=in Ordnung, hello vs hi) and the fixed-sentence prompts,
    which pin the form (e.g. ohne Kurzform) because grading compares one exact English string.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["en_a1_u11_l01", "w_be", "w_but", "w_cloudy", "w_cold", "w_going", "w_hot", "w_idea", "w_rain", "w_raining", "w_rainy", "w_so", "w_sunny", "w_tomorrow", "w_umbrella", "w_warm", "w_weather", "w_will", "w_windy"]
slot_presets:
  l1: &l1 {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "en_a1_u11_l01"}}
  sw: &sw {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": ["w_sunny", "w_rainy", "w_cloudy", "w_windy"]}}
  l2m: &l2m {"language_code": "en", "part_of_speech": ["adjective", "noun", "verb"], "agreement_tags": {"semantic": ["w_weather", "w_warm", "w_umbrella", "w_raining"]}}
  l3m: &l3m {"language_code": "en", "part_of_speech": ["noun", "verb"], "agreement_tags": {"semantic": ["w_tomorrow", "w_rain", "w_be", "w_will"]}}
  l4m: &l4m {"language_code": "en", "part_of_speech": ["adverb", "noun", "particle", "verb"], "agreement_tags": {"semantic": ["w_idea", "w_but", "w_so", "w_going"]}}
  mix: &mix {"language_code": "en", "part_of_speech": ["adjective", "noun"], "agreement_tags": {"semantic": ["w_sunny", "w_rainy", "w_cloudy", "w_cold", "w_hot", "w_windy", "w_warm", "w_umbrella"]}}
  tr2: &tr2 {"language_code": "en", "part_of_speech": ["adjective", "noun"], "agreement_tags": {"semantic": ["w_weather", "w_warm", "w_umbrella"]}}
  tr3: &tr3 {"language_code": "en", "part_of_speech": ["noun", "verb"], "agreement_tags": {"semantic": ["w_tomorrow", "w_rain", "w_be"]}}
  tr4: &tr4 {"language_code": "en", "part_of_speech": ["adverb", "noun", "particle"], "agreement_tags": {"semantic": ["w_idea", "w_but", "w_so"]}}
  w_umbrella: &w_umbrella {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_umbrella"}}
  w_rain: &w_rain {"language_code": "en", "part_of_speech": "verb", "agreement_tags": {"semantic": "w_rain"}}
  w_be: &w_be {"language_code": "en", "part_of_speech": "verb", "agreement_tags": {"semantic": "w_be"}}
  w_idea: &w_idea {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_idea"}}
  w_warm: &w_warm {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "w_warm"}}
  w_cloudy: &w_cloudy {"language_code": "en", "part_of_speech": "adjective", "agreement_tags": {"semantic": "w_cloudy"}}
  w_weather: &w_weather {"language_code": "en", "part_of_speech": "noun", "agreement_tags": {"semantic": "w_weather"}}
  w_will: &w_will {"language_code": "en", "part_of_speech": "verb", "agreement_tags": {"semantic": "w_will"}}
  w_so: &w_so {"language_code": "en", "part_of_speech": "adverb", "agreement_tags": {"semantic": "w_so"}}
  w_raining: &w_raining {"language_code": "en", "part_of_speech": "verb", "agreement_tags": {"semantic": "w_raining"}}
templates:
  - content_key: practice.de-en.en.a1.unit11.lesson01.choose.001
    lesson_content_key: en.a1.unit11.lesson01.weather_words
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Das Wetter beschreiben Sie im Englischen mit it: It's sunny, It's cold.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson02.choose.002
    lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l2m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Raining ist die Verlaufsform und beschreibt, was gerade passiert: It's raining.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson03.choose.003
    lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l3m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "Mit will bilden Sie die Zukunft; auf will folgt die Grundform des Verbs: It will rain.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson04.choose.004
    lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
    type: multiple_choice
    frame: {"text": "{item}", "language_code": "en", "direction": "ltr"}
    slots: {item: *l4m}
    answer_derivation: {"kind": "slot_gloss", "slot": "item"}
    feedback_frame: {"text": "But verbindet zwei gegensätzliche Aussagen; so nennt die Folge: It's going to rain, so let's go today.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson01.order.005
    lesson_content_key: en.a1.unit11.lesson01.weather_words
    type: word_order
    frame: {"text": "It's {item} today.", "language_code": "en", "direction": "ltr"}
    slots: {item: *l1}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "It's {item} today.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Das Wetter beschreiben Sie mit It's und einem Adjektiv; today steht am Satzende.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson02.order.006
    lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
    type: word_order
    frame: {"text": "You should take an {item}.", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_umbrella}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "You should take an {item}.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Should gibt einen Rat; take ist die Grundform. Vor einem Vokal steht an statt a.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson03.order.007
    lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
    type: word_order
    frame: {"text": "It will {item} on Saturday.", "language_code": "en", "direction": "ltr"}
    slots: {item: *w_rain}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "It will {item} on Saturday.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Nach will steht die Grundform des Verbs ohne -s: It will rain.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson02.fill.008
    lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
    type: fill_in_blank
    frame: {"text": "It's sunny and {item}. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_warm, hint: *w_warm}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Warm beschreibt angenehme Temperaturen; sunny and warm ist eine häufige Kombination.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson02.fill.009
    lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
    type: fill_in_blank
    frame: {"text": "What's the {item} like today? ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_weather, hint: *w_weather}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "What's the weather like? fragt nach dem Wetter; what's ist die Kurzform von what is.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson03.fill.010
    lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
    type: fill_in_blank
    frame: {"text": "It {item} rain on Saturday. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_will, hint: *w_will}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Will bildet die Zukunft; Sie sagen It will rain, nicht It will rains.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson04.fill.011
    lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
    type: fill_in_blank
    frame: {"text": "It's going to rain on Saturday, {item} let's go today. ({hint})", "language_code": "en", "direction": "ltr", "slot_rendering": {"hint": "english_gloss"}}
    slots: {item: *w_so, hint: *w_so}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "So leitet die Folge ein: Es regnet am Samstag, also gehen wir heute.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson01.match.012
    lesson_content_key: en.a1.unit11.lesson01.weather_words
    type: matching_pairs
    frame: {"text": "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", "language_code": "en", "direction": "ltr"}
    slots: {first: *mix, second: *mix, third: *mix, fourth: *mix, fifth: *mix, sixth: *mix}
    slot_relations: [{"kind": "distinct", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}]
    answer_derivation: {"kind": "matching_pairs", "slots": ["first", "second", "third", "fourth", "fifth", "sixth"]}
    feedback_frame: {"text": "Die Adjektive sunny, rainy, cloudy, windy, cold, hot und warm beschreiben das Wetter; umbrella ist der Regenschirm.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson01.translate.013
    lesson_content_key: en.a1.unit11.lesson01.weather_words
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *l1}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Die Wetteradjektive stehen nach It's: It's hot, It's cold.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson02.translate.014
    lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr2}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "Weather ist das Wetter; mit warm beschreiben Sie angenehme Temperaturen.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson04.translate.015
    lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
    type: translation
    frame: {"text": "{item}", "language_code": "de", "direction": "ltr", "slot_rendering": {"item": "english_gloss"}}
    slots: {item: *tr4}
    answer_derivation: {"kind": "slot_text", "slot": "item"}
    feedback_frame: {"text": "But heißt aber, so heißt deshalb und idea heißt Idee.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson02.translate.016
    lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
    type: translation
    frame: {"text": "Es regnet gerade. (mit Kurzform)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_raining}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "It's {item}.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "It's raining beschreibt, was jetzt passiert; für eine Vorhersage nehmen Sie will.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson02.translate.017
    lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
    type: translation
    frame: {"text": "Wie ist das Wetter heute? (mit Kurzform)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_weather}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "What's the {item} like today?", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "What's the weather like? fragt nach dem Wetter; like bedeutet hier wie.", "language_code": "de", "direction": "ltr"}
  - content_key: practice.de-en.en.a1.unit11.lesson03.translate.018
    lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
    type: translation
    frame: {"text": "Morgen wird es regnen. (mit will)", "language_code": "de", "direction": "ltr"}
    slots: {item: *w_rain}
    answer_derivation: {"kind": "render_frame", "frame": {"text": "It will {item} tomorrow.", "language_code": "en", "direction": "ltr"}}
    feedback_frame: {"text": "Mit will + Grundform bilden Sie die Zukunft: It will rain tomorrow.", "language_code": "de", "direction": "ltr"}
