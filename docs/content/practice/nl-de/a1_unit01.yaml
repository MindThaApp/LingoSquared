    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Duits heeft twee woorden voor ''je/u'': Sie is formeel (vreemden, instanties), du is informeel (vrienden, familie, kinderen).'
    language_code: nl
    direction: ltr
- content_key: practice.nl-de.de.a1.unit01.lesson04.listen.001
