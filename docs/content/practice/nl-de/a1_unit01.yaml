  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Guten Morgen gebruik je 's ochtends, Guten Tag overdag en Guten Abend vanaf de avond.
    language_code: nl
    direction: ltr
- content_key: practice.nl-de.de.a1.unit01.lesson02.listen.001
