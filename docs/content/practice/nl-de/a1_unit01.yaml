    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tschüss is het losse afscheid; Auf Wiedersehen is het beleefde afscheid voor vreemden en in formele situaties.
    language_code: nl
    direction: ltr
- content_key: practice.nl-de.de.a1.unit01.lesson03.choose.001
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
