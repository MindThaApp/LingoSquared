    slot: item
  feedback_frame:
    text: Bitte dekt zowel 'alsjeblieft' als 'graag gedaan', en met Entschuldigung trek je iemands aandacht of zeg je sorry.
    language_code: nl
    direction: ltr
- content_key: practice.nl-de.de.a1.unit01.lesson03.order.002
