- content_key: practice.hi-es.es.a1.unit47.lesson01.order.002
  lesson_content_key: es.a1.unit47.lesson01.te_llamo
  type: word_order
  frame:
    text: Tengo que {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_llamarte
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo que {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: मुझे आपको फ़ोन करना है। llamarte का अर्थ है आपको फ़ोन करना।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit47.lesson02.order.002
  lesson_content_key: es.a1.unit47.lesson02.con_quien_hablo
  type: word_order
  frame:
    text: ¿Con quién {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hablo
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Con quién {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: मैं किससे बात कर रहा हूँ? ¿Con quién hablo? तब बोला जाने वाला सामान्य वाक्य है जब आपको पता न हो कि फ़ोन कौन कर रहा है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit47.lesson03.order.002
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: word_order
  frame:
    text: No {item} tan rápido, por favor.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hables
  answer_derivation:
    kind: render_frame
    frame:
      text: No {item} tan rápido, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: कृपया इतनी तेज़ मत बोलिए। No hables, hablar का अनौपचारिक निषेधात्मक आज्ञा-रूप है; tan rápido (इतनी तेज़) मात्रा बताता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit47.lesson03.fill.003
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: fill_in_blank
  frame:
    text: No te {item} bien. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: मुझे आपकी आवाज़ ठीक से सुनाई नहीं दे रही। Oír (सुनना) के साथ no ... bien (ठीक से नहीं) सुनने की समस्या बताता है, जो entender (समझना) से अलग है; te oigo का अर्थ है "मुझे आपकी आवाज़ सुनाई दे रही है"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit47.lesson04.order.002
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: word_order
  frame:
    text: El {item} es de Elena.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_mensaje
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} es de Elena.
      language_code: es
      direction: ltr
  feedback_frame:
    text: यह टेक्स्ट संदेश Elena का है। mensaje का अर्थ है संदेश; टेक्स्ट संदेश।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit47.lesson04.fill.003
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: fill_in_blank
  frame:
    text: Te {item} un mensaje. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'मैं आपको एक टेक्स्ट भेजूँगा। Enviar (भेजना) सर्वनाम te (आपको) के बाद आता है: te envío un mensaje।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit47.lesson06.order.002
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: word_order
  frame:
    text: ¿Cómo ha ido tu primer {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_turno
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo ha ido tu primer {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'आपकी पहली शिफ़्ट कैसी रही? Ha ido, ir का पूर्ण वर्तमान काल है (यहाँ "रहना, बीतना" के अर्थ में): ha + कृदंत ido।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit47.lesson06.fill.003
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: fill_in_blank
  frame:
    text: Ha ido muy bien, mejor de lo {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बहुत अच्छी रही, मेरी सोच से भी बेहतर। Ha ido muy bien प्रश्न वाला पूर्ण वर्तमान काल फिर से इस्तेमाल करता है; mejor de lo esperado (उम्मीद से बेहतर) de lo से तुलना करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit47.lesson06.translate.004
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame:
    text: धन्यवाद, यह मेरे लिए बहुत मायने रखता है।
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_significa
  answer_derivation:
    kind: render_frame
    frame:
      text: Muchas gracias, eso {item} mucho para mí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: धन्यवाद, यह मेरे लिए बहुत मायने रखता है। Significa, significar (मतलब होना) का अन्य पुरुष रूप है; para mí (मेरे लिए) बताता है कि यह किसके लिए मायने रखता है।
    language_code: hi
    direction: ltr
