templates:
- content_key: practice.hi-es.es.a1.unit03.lesson01.choose.001
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'परिवार के शब्द अक्सर लिंग के अनुसार जोड़ी में आते हैं: hermano और hermana, hijo और hija।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson01.listen.002
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पुल्लिंग बहुवचन मिले-जुले समूह के लिए भी चलता है: padres यानी माता-पिता, hermanos का अर्थ भाई-बहन हो सकता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson01.translate.003
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: घर में रोज़ के शब्द mamá और papá हैं; madre और padre तटस्थ शब्द हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson02.order.001
  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: word_order
  frame:
    text: Mi familia es {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi familia es {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Familia स्त्रीलिंग है, इसलिए "छोटी" के लिए pequeña आता है; grande दोनों लिंगों में एक ही रहता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson02.translate.002
  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: translation
  frame:
    text: मेरी दो बहनें हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo dos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'पूछने के लिए: ¿Tienes hermanos? में पुल्लिंग बहुवचन आता है, जिसमें भाई और बहन दोनों शामिल हैं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson03.choose.001
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Primo चचेरा/ममेरा भाई है और prima चचेरी/ममेरी बहन; primos मिले-जुले समूह के लिए भी आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson03.match.002
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Abuelo और abuela का बहुवचन abuelos बनता है, यानी दादा-दादी या नाना-नानी।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson03.order.003
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: word_order
  frame:
    text: Vivo con mis {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vivo con mis {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Mis, mi का बहुवचन है: mi abuelo, mis abuelos।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson04.translate.001
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: मैं {item} के साथ रहता/रहती हूँ।
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vivo con mis {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Vivo का अर्थ ही "मैं रहता/रहती हूँ" है, इसलिए yo की ज़रूरत नहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson04.fill.002
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: fill_in_blank
  frame:
    text: Somos cinco en {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Somos cinco का शाब्दिक अर्थ है "हम पाँच हैं": यानी हम पाँच लोग हैं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson04.order.003
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: word_order
  frame:
    text: ¿Vives cerca de tus {item}?
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Vives cerca de tus {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Cerca de का अर्थ है "के पास"; tus, tu का बहुवचन रूप है, यानी "तुम्हारे"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson05.fill.001
  lesson_content_key: es.a1.unit03.lesson05.reading_a_family_profile
  type: fill_in_blank
  frame:
    text: Mi hermana {item} se llama Sofía. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Menor संज्ञा के बाद आता है और लिंग के अनुसार नहीं बदलता: mi hermano menor, mi hermana menor।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson05.choose.002
  lesson_content_key: es.a1.unit03.lesson05.reading_a_family_profile
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vive का अर्थ है "वह रहता/रहती है"; viven का अर्थ है "वे रहते हैं"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson06.listen.001
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '¡Qué bonito! फ़ोटो देखकर दी जाने वाली स्नेह भरी प्रतिक्रिया है: कितना सुंदर!'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson06.translate.002
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: translation
  frame:
    text: हम हर हफ़्ते फ़ोन पर बात करते हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Hablamos por teléfono cada {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'स्पेनिश में "फ़ोन पर" के लिए por teléfono कहते हैं, और cada कभी नहीं बदलता: cada día, cada semana।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson06.match.003
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Somos और son दोनों ser से बने हैं: हम हैं, वे हैं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit03.lesson06.translate.004
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'स्पेनिश में क्रिया का अंत व्यक्ति बताता है: vivo, vives, vive, viven।'
    language_code: hi
    direction: ltr
