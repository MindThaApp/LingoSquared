templates:
- content_key: practice.hi-es.es.a1.unit01.lesson01.choose.001
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'स्पेनिश में “आप/तुम” के लिए दो शब्द हैं: दोस्तों और परिवार के साथ tú, अजनबियों के साथ और सम्मान दिखाने के लिए usted।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson01.fill.002
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: fill_in_blank
  frame:
    text: ¿Cómo está {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Está, usted के साथ आता है; tú के साथ क्रिया estás हो जाती है: ¿Cómo estás?'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson01.translate.003
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: स्पेनिश के अभिवादन और बातचीत के शब्दों में अक्सर बल-चिह्न होते हैं (cómo, adiós, también); यह चिह्न बताता है कि किस शब्दांश पर ज़ोर है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson02.listen.001
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buenos días दोपहर के भोजन तक (स्पेन में लगभग दोपहर 2 बजे तक) कहा जाता है, buenas tardes दोपहर के बाद, और buenas noches शाम और रात में।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson02.match.002
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Día पुल्लिंग है (buenos días), जबकि tarde और noche स्त्रीलिंग हैं (buenas tardes, buenas noches)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson02.order.003
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Adiós, hasta {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Adiós, hasta {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Hasta luego का शाब्दिक अर्थ है “बाद तक”; यह रोज़मर्रा का “फिर मिलते हैं” है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson03.order.001
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Hola, me llamo {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Hola, me llamo {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Me llamo का शाब्दिक अर्थ है “मैं अपने आप को कहता/कहती हूँ”; नाम बताने का यही रोज़मर्रा का तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson03.translate.002
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: translation
  frame:
    text: यह {name} है। (किसी पुरुष का परिचय देते हुए)
    language_code: hi
    direction: ltr
    slot_rendering:
      name: token
  slots:
    name: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Este es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'पुरुष का परिचय देने के लिए este और स्त्री का परिचय देने के लिए esta का प्रयोग करें: Esta es Ana.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson03.order.003
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Esta es {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Esta es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Esta स्त्री का परिचय देता है; पुरुष के लिए este कहते हैं: Este es Carlos.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson03.fill.004
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: fill_in_blank
  frame:
    text: Mucho {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mucho gusto का अर्थ है “आपसे मिलकर खुशी हुई”; आम जवाब igualmente (“मुझे भी”) है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson04.order.001
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: word_order
  frame:
    text: Soy de {place}, pero vivo en Londres.
    language_code: es
    direction: ltr
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}, pero vivo en Londres.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ser de + जगह बताता है कि आप कहाँ के हैं; vivir en + जगह बताता है कि आप अब कहाँ रहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson04.translate.002
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: translation
  frame:
    text: मैं {place} से हूँ।
    language_code: hi
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'यही सवाल पूछने के लिए: ¿De dónde eres? (अनौपचारिक) या ¿De dónde es usted? (औपचारिक)।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson04.fill.003
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: fill_in_blank
  frame:
    text: Todavía estoy {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Estoy + -ando/-iendo अभी चल रही किसी क्रिया को बताता है, जैसे “मैं अभी भी सीख रहा/रही हूँ”।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson05.order.001
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: word_order
  frame:
    text: Sí, es mi primera {item} aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, es mi primera {item} aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Vez यहाँ “बार” के अर्थ में है: primera vez, पहली बार; otra vez, फिर से।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson05.translate.002
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: translation
  frame:
    text: क्या तुम्हें खाना बनाना पसंद है? (अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Te gusta {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'स्पेनिश में पसंद बताने के लिए gustar आता है: गतिविधि आपको अच्छी लगती है, इसलिए te gusta + क्रिया का मूल रूप।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson06.listen.001
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: एलेना और माटेओ आपस में tú का प्रयोग करते हैं, क्योंकि वे एक ही वर्कशॉप के साथी हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit01.lesson06.translate.002
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'जब क्रिया का अंत ही व्यक्ति बता देता है, तब स्पेनिश कर्ता सर्वनाम छोड़ देती है: vivo का अर्थ है “मैं रहता/रहती हूँ”।'
    language_code: hi
    direction: ltr
