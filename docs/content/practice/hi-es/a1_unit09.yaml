templates:
- content_key: practice.hi-es.es.a1.unit09.lesson01.order.001
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: word_order
  frame:
    text: Cruza la {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Cruza la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: '"सड़क पार करो।" Cruza, cruzar का tú आदेश-रूप है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit09.lesson01.fill.002
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: fill_in_blank
  frame:
    text: Dobla a la izquierda en la {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: En la esquina का अर्थ है "मोड़ पर"; यहाँ स्पैनिश में en का प्रयोग होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit09.lesson02.choose.001
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Doblar और girar दोनों का अर्थ "मुड़ना" है; dobla और gira इनके tú आदेश-रूप हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit09.lesson02.order.002
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: word_order
  frame:
    text: Gira a la {item} en la esquina.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gira a la {item} en la esquina.
      language_code: es
      direction: ltr
  feedback_frame:
    text: A la izquierda का अर्थ "बाईं ओर" और a la derecha का "दाईं ओर" है; अकेला derecho "सीधे आगे" का अर्थ देता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit09.lesson02.translate.003
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: translation
  frame:
    text: सीधे आगे जाओ। (अनौपचारिक आदेश)
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Sigue {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Sigue, seguir (चलते रहना) से बना है; derecho (सीधे आगे) और derecha (दाईं) अलग शब्द हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit09.lesson03.order.001
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: word_order
  frame:
    text: ¿Cómo {item} a la biblioteca?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo {item} a la biblioteca?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'मैं पुस्तकालय कैसे पहुँचूँ? पुल्लिंग स्थान के साथ a + el मिलकर al बन जाता है: ¿Cómo llego al parque?'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit09.lesson03.fill.002
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: fill_in_blank
  frame:
    text: 'Es muy {item}: sigue derecho. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fácil का रूप पुल्लिंग और स्त्रीलिंग दोनों संज्ञाओं के साथ एक ही रहता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit09.lesson04.translate.001
  lesson_content_key: es.a1.unit09.lesson04.confirmar_direcciones
  type: translation
  frame:
    text: खो मत जाना! (अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡No te {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'निषेधात्मक आदेशों में क्रिया का रूप अलग होता है: pierdas, pierdes नहीं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit09.lesson05.match.001
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'स्पैनिश में रास्ता प्रायः tú आदेश-रूपों से बताया जाता है: sigue, dobla, cruza।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit09.lesson05.translate.002
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Desde el mercado का अर्थ "बाज़ार से" है, यानी रास्ते का शुरुआती बिंदु।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit09.lesson06.listen.001
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'माटेओ यह जाँचने के लिए कि उसने सही समझा है, रास्ते को yo रूप में दोहराता है: sigo और doblo।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit09.lesson06.translate.002
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: translation
  frame:
    text: आपका स्वागत है।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: De {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De nada का शाब्दिक अर्थ "कुछ नहीं का" है; यह gracias का सामान्य उत्तर है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit09.lesson01.listen.003
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Derecha (दाईं) और derecho (सीधे आगे) में केवल अंतिम स्वर का अंतर है; उसी पर ध्यान दीजिए।
    language_code: hi
    direction: ltr
