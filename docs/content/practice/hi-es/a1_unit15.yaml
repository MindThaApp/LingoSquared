templates:
- content_key: practice.hi-es.es.a1.unit15.lesson02.order.001
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: word_order
  frame:
    text: El apartamento nuevo es más grande que el {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: El apartamento nuevo es más grande que el {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: नया अपार्टमेंट पुराने से बड़ा है। Más + विशेषण + que दो चीज़ों की तुलना करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit15.lesson02.choose.002
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'स्पेनिश में तुलना इन ढाँचों से होती है: más ... que (से ज़्यादा), menos ... que (से कम) और tan ... como (जितना ... उतना)।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit15.lesson04.translate.001
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: translation
  frame:
    text: हम एक अच्छी टीम हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Somos un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Bueno पुल्लिंग एकवचन संज्ञा से पहले छोटा होकर buen बन जाता है: un buen equipo।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit15.lesson04.listen.002
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tan bien como का अर्थ है जितना अच्छा: cocinas tan bien como yo (तुम मेरे जितना अच्छा खाना पकाते हो)।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit15.lesson05.fill.001
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: fill_in_blank
  frame:
    text: El apartamento nuevo tiene más {item} para cocinar. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'संज्ञा से पहले más का अर्थ है उसकी ज़्यादा मात्रा: más espacio, यानी ज़्यादा जगह।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit15.lesson05.match.002
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mudarse का अर्थ है घर बदलना; माटेओ quiero mudarme कहता है क्योंकि घर वही बदल रहा है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit15.lesson06.order.001
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: word_order
  frame:
    text: El viejo es más pequeño. Por eso quiero {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: El viejo es más pequeño. Por eso quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: पुराना वाला छोटा है। इसीलिए मैं घर बदलना चाहता हूँ। Por eso का अर्थ है इसीलिए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit15.lesson06.translate.002
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Viejo का अर्थ चीज़ों और लोगों के लिए पुराना है; nuevo उसका विपरीत है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit15.lesson06.fill.003
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: fill_in_blank
  frame:
    text: Tú {item} tan bien como yo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tan + क्रिया-विशेषण + como दो लोगों की किसी काम को बराबर अच्छे से करने की तुलना करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit15.lesson06.translate.004
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: यह बहुत तर्कसंगत है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Tiene mucho {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'स्पेनिश में कहते हैं कि इसमें बहुत तर्क है: tiene mucho sentido।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit15.lesson06.choose.005
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '¡Exacto! सहमति जताने का एक छोटा तरीका है: बिल्कुल सही।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit15.lesson05.translate.003
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Espacio का अर्थ है जगह; más espacio para cocinar, यानी खाना पकाने के लिए ज़्यादा जगह।
    language_code: hi
    direction: ltr
