templates:
- content_key: practice.hi-es.es.a1.unit10.lesson01.choose.001
  lesson_content_key: es.a1.unit10.lesson01.el_tiempo_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tiempo का मतलब मौसम भी है और समय भी: ¿Qué tiempo hace? मौसम के बारे में पूछता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit10.lesson01.listen.002
  lesson_content_key: es.a1.unit10.lesson01.el_tiempo_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lluvia संज्ञा है (बारिश); llueve क्रिया है (बारिश होती है)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit10.lesson02.order.001
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: word_order
  frame:
    text: En julio hace {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: En julio hace {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'स्पेनिश में मौसम बताने के लिए hacer के साथ संज्ञा आती है: hace calor, शाब्दिक अर्थ "गर्मी करता है"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit10.lesson02.translate.002
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: translation
  frame:
    text: दिसंबर में ठंड होती है।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: En diciembre hace {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: यहाँ hace के बाद frío संज्ञा है; "बहुत ठंड" कहने के लिए hace mucho frío कहते हैं, muy frío नहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit10.lesson02.fill.003
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: fill_in_blank
  frame:
    text: Hoy {item} y hace frío. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Llover के साथ कर्ता की ज़रूरत नहीं होती: llueve का सीधा मतलब है "बारिश होती है" या "बारिश हो रही है"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit10.lesson02.order.004
  lesson_content_key: es.a1.unit10.lesson02.expresiones_del_tiempo
  type: word_order
  frame:
    text: Hoy está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: आज बादल छाए हैं। Nublado विशेषण है, इसलिए यह está के साथ आता है, hace के साथ नहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit10.lesson04.fill.001
  lesson_content_key: es.a1.unit10.lesson04.el_invierno_en_madrid
  type: fill_in_blank
  frame:
    text: Necesitamos agua {item} hace calor. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Porque, एक शब्द और बिना एक्सेंट के, का मतलब है "क्योंकि"; ¿por qué?, दो शब्द और एक्सेंट के साथ, का मतलब है "क्यों"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit10.lesson04.translate.002
  lesson_content_key: es.a1.unit10.lesson04.el_invierno_en_madrid
  type: translation
  frame:
    text: जुलाई में बहुत ज़्यादा गर्मी होती है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: En julio hace {item} calor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Demasiado का मतलब है "बहुत ज़्यादा", और यह संज्ञा से पहले आता है: demasiado calor।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit10.lesson05.match.001
  lesson_content_key: es.a1.unit10.lesson05.leer_el_pronostico
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Es importante + क्रिया का मूल रूप सलाह देने के लिए आता है: es importante llevar agua।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit10.lesson05.translate.002
  lesson_content_key: es.a1.unit10.lesson05.leer_el_pronostico
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'मौसम के स्पेनिश शब्द: sol, lluvia, viento और nube संज्ञाएँ हैं; nublado विशेषण है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit10.lesson06.choose.001
  lesson_content_key: es.a1.unit10.lesson06.camino_al_taller_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Prefiero क्रिया preferir से बना है; e बदलकर ie हो जाता है: prefiero, prefieres।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit10.lesson06.translate.002
  lesson_content_key: es.a1.unit10.lesson06.camino_al_taller_dialogue
  type: translation
  frame:
    text: तुम सही हो। (अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Tienes {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'स्पेनिश में "सही होना" कहने के लिए "कारण होना" कहा जाता है: tener razón।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit10.lesson06.order.003
  lesson_content_key: es.a1.unit10.lesson06.camino_al_taller_dialogue
  type: word_order
  frame:
    text: Hay una {item} cerca de aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Hay una {item} cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: यहाँ के पास एक दुकान है। Tienda स्त्रीलिंग है, इसलिए इसके साथ una आता है।
    language_code: hi
    direction: ltr
