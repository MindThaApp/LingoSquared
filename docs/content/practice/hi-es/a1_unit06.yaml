- content_key: practice.hi-es.es.a1.unit06.lesson01.choose.001
  lesson_content_key: es.a1.unit06.lesson01.comida_y_bebida
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Agua स्त्रीलिंग है, लेकिन बलाघात वाले a से शुरू होने के कारण एकवचन में उसके साथ el आता है: el agua fría।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit06.lesson01.listen.002
  lesson_content_key: es.a1.unit06.lesson01.comida_y_bebida
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Café, menú और sándwich पर लिखित एक्सेंट चिह्न होते हैं; यह चिह्न बलाघात वाले अक्षर को दर्शाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit06.lesson02.order.001
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: word_order
  frame:
    text: Quiero un {item}, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Un पुल्लिंग संज्ञाओं के साथ आता है (un café); स्त्रीलिंग संज्ञाओं के साथ una आता है (una ensalada)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit06.lesson02.translate.002
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: translation
  frame:
    text: कृपया मुझे एक {item} चाहिए।
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'ऑर्डर करने का एक और आम तरीका है para mí + व्यंजन: para mí, un café।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit06.lesson02.fill.003
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: fill_in_blank
  frame:
    text: ¿Qué {item} comer? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Querer का धातु-स्वर बदलता है: quiero, quieres, quiere, लेकिन queremos।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit06.lesson03.order.001
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: word_order
  frame:
    text: ¿Podemos ver el {item}?
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Podemos ver el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: क्या हम मेन्यू देख सकते हैं? ¿Podemos + क्रिया का मूल रूप? किसी चीज़ को विनम्रता से माँगने का तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit06.lesson03.translate.002
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: translation
  frame:
    text: भोजन का आनंद लीजिए!
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buen {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: Buen provecho उन लोगों से कहा जाता है जो खाना शुरू करने वाले हों, पास की मेज़ के अजनबियों से भी।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit06.lesson04.fill.001
  lesson_content_key: es.a1.unit06.lesson04.postre_y_la_cuenta
  type: fill_in_blank
  frame:
    text: La {item}, por favor. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: स्पेन में वेटर आमतौर पर इंतज़ार करता है कि आप खुद बिल माँगें।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit06.lesson04.translate.002
  lesson_content_key: es.a1.unit06.lesson04.postre_y_la_cuenta
  type: translation
  frame:
    text: मिठाई में मुझे केक चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: De postre quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De postre का मतलब है "मिठाई के लिए"; यहाँ pastel से पहले किसी आर्टिकल की ज़रूरत नहीं होती।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit06.lesson05.match.001
  lesson_content_key: es.a1.unit06.lesson05.leer_el_menu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
