  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Comida का मतलब "खाना" भी है और दोपहर का भोजन भी, जो स्पेन में दिन का मुख्य भोजन होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit06.lesson06.choose.002
