    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'स्पेन का menú del día एक तय दोपहर का खाना है: स्टार्टर, मुख्य व्यंजन, postre और आमतौर पर रोटी और एक पेय, सब एक ही कीमत में।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit06.lesson06.translate.001
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
