templates:
- content_key: practice.hi-es.es.a1.unit02.lesson01.choose.001
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Uno पुल्लिंग संज्ञा से पहले un बन जाता है (un huevo) और स्त्रीलिंग संज्ञा से पहले una (una taza)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson01.listen.002
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Seis में एक अक्षर (syllable) है, siete में दो (sie-te); t की ध्वनि ध्यान से सुनिए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson02.match.001
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'ग्यारह से पंद्रह तक के अपने अलग शब्द हैं (once, doce, trece, catorce, quince); सोलह से ये diez के आधार पर बनते हैं: dieciséis।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson02.translate.002
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cien ठीक सौ है; इससे ऊपर स्पैनिश में ciento कहते हैं: ciento uno।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson03.order.001
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: Tengo {age} años.
    language_code: es
    direction: ltr
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'स्पैनिश में उम्र tener (होना नहीं, "रखना") से बताई जाती है: आप "इतने साल रखते हैं", "इतने साल के होते हैं" नहीं कहते।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson03.translate.002
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: मैं {age} साल का/की हूँ।
    language_code: hi
    direction: ltr
    slot_rendering:
      age: english_gloss
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'उम्र के लिए कभी soy का प्रयोग न करें: Tengo veinte años, Soy veinte नहीं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson03.fill.003
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: fill_in_blank
  frame:
    text: ¿Cuántos años {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'usted के साथ प्रश्न बन जाता है: ¿Cuántos años tiene usted?'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson04.choose.001
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'स्पैनिश में फ़ोन नंबर अक्सर जोड़ियों में पढ़े जाते हैं: 62 41 ... को sesenta y dos, cuarenta y uno कहते हैं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson04.order.002
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: word_order
  frame:
    text: ¿Puedes {item}, por favor?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedes {item}, por favor?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Puedes + क्रिया का मूल रूप किसी दोस्त से कुछ माँगने के लिए है; usted के साथ: ¿Puede repetir, por favor?'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson04.translate.003
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Por favor (कृपया) और claro (बिल्कुल) किसी भी बातचीत के सबसे उपयोगी शब्दों में से हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson05.choose.001
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'मात्रा को सामग्री से de जोड़ता है: dos tazas de harina।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson05.translate.002
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: स्पैनिश में स्वर के बाद बहुवचन के लिए -s जुड़ता है (taza, tazas) और व्यंजन के बाद -es।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson05.translate.003
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: मुझे तीन {item} चाहिए।
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Necesito tres {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Necesito (मुझे चाहिए) necesitar से बना है; किसी और से पूछने के लिए कहिए: ¿Cuántos necesitas?'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson05.fill.004
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: fill_in_blank
  frame:
    text: Media taza de {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Taza स्त्रीलिंग है, इसलिए आधा कप media taza है; पुल्लिंग संज्ञा के साथ medio आता है: medio kilo।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson06.listen.001
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Oye किसी का ध्यान खींचने का दोस्ताना तरीका है, जैसे हिंदी में "अरे सुनो"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson06.translate.002
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: translation
  frame:
    text: एक और सवाल।
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Una {item} más.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Más आमतौर पर संज्ञा के बाद आता है: una pregunta más, यानी एक और सवाल।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit02.lesson06.match.003
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Tengo, tienes और tiene सब tener के रूप हैं: मेरे पास है, तुम्हारे पास है, उसके पास है।'
    language_code: hi
    direction: ltr
