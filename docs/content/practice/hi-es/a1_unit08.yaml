- content_key: practice.hi-es.es.a1.unit08.lesson01.choose.001
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Biblioteca का अर्थ पुस्तकालय है; किताबों की दुकान को librería कहते हैं, जो अक्सर भ्रम पैदा करने वाला शब्द है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit08.lesson01.listen.002
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Banco का अर्थ बेंच भी होता है; इस यूनिट में यह सड़क वाला बैंक है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit08.lesson01.order.003
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: word_order
  frame:
    text: La {item} está cerca de aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: La {item} está cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'कोई चीज़ कहाँ है, यह बताने के लिए estar का प्रयोग होता है: la farmacia está cerca।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit08.lesson01.translate.004
  lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
  type: translation
  frame:
    text: '{item} बाज़ार के बगल में है।'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} está al lado del mercado.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'de + el मिलकर del बन जाता है: al lado del mercado, यानी बाज़ार के बगल में।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit08.lesson02.fill.001
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: fill_in_blank
  frame:
    text: La farmacia está {item} del mercado. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Enfrente de, al lado de, lejos de और cerca de सभी में जगह से पहले de ज़रूरी है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit08.lesson02.order.002
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: word_order
  frame:
    text: El parque está {item} del mercado.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: El parque está {item} del mercado.
      language_code: es
      direction: ltr
  feedback_frame:
    text: पार्क बाज़ार से दूर है। इसका उलटा cerca de है, यानी पास।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit08.lesson02.translate.003
  lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
  type: translation
  frame:
    text: पुस्तकालय बैंक और पार्क के बीच में है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La biblioteca está {item} el banco y el parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Entre के बाद y से जुड़ी दो जगहें आती हैं, और उसके बाद de नहीं लगता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit08.lesson04.fill.001
  lesson_content_key: es.a1.unit08.lesson04.preguntar_si_esta_lejos
  type: fill_in_blank
  frame:
    text: Sí, está {item} lejos. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bastante का अर्थ काफ़ी है: bastante lejos, यानी काफ़ी दूर; bastante cerca, यानी काफ़ी पास।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit08.lesson05.match.001
  lesson_content_key: es.a1.unit08.lesson05.leer_sobre_el_barrio
