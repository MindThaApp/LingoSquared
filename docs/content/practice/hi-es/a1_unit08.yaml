    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'En este barrio hay muchos lugares útiles: hay यह बताता है कि किसी जगह में क्या-क्या है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit08.lesson05.translate.002
  lesson_content_key: es.a1.unit08.lesson05.leer_sobre_el_barrio
  type: translation
