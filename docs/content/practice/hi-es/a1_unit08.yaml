    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Útil व्यंजन पर समाप्त होता है, इसलिए बहुवचन में útiles बन जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit08.lesson06.choose.001
  lesson_content_key: es.a1.unit08.lesson06.lugares_del_barrio_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बिना accent वाला donde दो बातों को जोड़ता है; accent वाला ¿dónde? प्रश्न पूछता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit08.lesson06.translate.002
  lesson_content_key: es.a1.unit08.lesson06.lugares_del_barrio_dialogue
  type: translation
  frame:
    text: यह उस बाज़ार के बगल में है जहाँ हमने अंडे ख़रीदे थे।
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Está al lado del mercado donde {item} los huevos.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Compramos का अर्थ "हम ख़रीदते हैं" भी है और "हमने ख़रीदा" भी; समय संदर्भ से पता चलता है।
    language_code: hi
    direction: ltr
