templates:
- content_key: practice.hi-es.es.a1.unit13.lesson01.choose.001
  lesson_content_key: es.a1.unit13.lesson01.el_trabajo_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Trabajo का अर्थ संज्ञा "काम / नौकरी" भी है और क्रिया रूप "मैं काम करता हूँ" भी।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit13.lesson01.listen.002
  lesson_content_key: es.a1.unit13.lesson01.el_trabajo_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Escritorio का अर्थ मेज़ (डेस्क) है; दफ़्तर के लिए una oficina कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit13.lesson02.translate.001
  lesson_content_key: es.a1.unit13.lesson02.las_profesiones
  type: translation
  frame:
    text: मैं लेखाकार हूँ। (एक पुरुष कह रहा है)
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'ser के बाद पेशे से पहले स्पेनिश में उपपद नहीं आता: soy contador, soy un contador नहीं; महिला soy contadora कहती है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit13.lesson02.order.002
  lesson_content_key: es.a1.unit13.lesson02.las_profesiones
  type: word_order
  frame:
    text: Yo soy {item}. Enseño en una escuela.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Yo soy {item}. Enseño en una escuela.
      language_code: es
      direction: ltr
  feedback_frame:
    text: मैं शिक्षिका हूँ। मैं एक स्कूल में पढ़ाती हूँ। पुरुष शिक्षक को un profesor कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit13.lesson03.fill.001
  lesson_content_key: es.a1.unit13.lesson03.en_que_trabajas
  type: fill_in_blank
  frame:
    text: ¿En qué {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¿En qué trabajas? का शाब्दिक अर्थ है "आप किसमें काम करते हैं", यानी "आपका काम क्या है"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit13.lesson04.translate.001
  lesson_content_key: es.a1.unit13.lesson04.prefiero_cocinar
  type: translation
  frame:
    text: हम दोनों इसे ज़्यादा पसंद करते हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Los dos preferimos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Los dos यहाँ "हम दोनों" के अर्थ में है; esto किसी बात या चीज़ का नाम लिए बिना उसकी ओर इशारा करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit13.lesson05.order.001
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: word_order
  frame:
    text: Mateo {item} en una oficina en Londres.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo {item} en una oficina en Londres.
      language_code: es
      direction: ltr
  feedback_frame:
    text: मातेओ लंदन में एक दफ़्तर में काम करता है। Trabajar en + जगह बताता है कि कोई कहाँ काम करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit13.lesson05.order.002
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: word_order
  frame:
    text: Elena {item} en una escuela.
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Elena {item} en una escuela.
      language_code: es
      direction: ltr
  feedback_frame:
    text: एलेना एक स्कूल में पढ़ाती है। Enseñar का अर्थ पढ़ाना है; aprender का अर्थ सीखना है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit13.lesson05.match.003
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'A los dos les gusta su trabajo: les बताता है कि पसंद किसकी है, यानी उन दोनों की।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit13.lesson06.translate.001
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'काम से जुड़े कई स्पेनिश शब्द आसानी से पहचाने जाते हैं: oficina, estudiantes, interesante।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit13.lesson06.fill.002
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: fill_in_blank
  frame:
    text: Prefiero cocinar {item} los martes. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Con + ti मिलकर एक शब्द contigo बन जाता है; "मेरे साथ" के लिए conmigo कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit13.lesson06.choose.003
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Preferir में अधिकतर रूपों में e बदलकर ie हो जाता है (prefiero, prefieren), पर preferimos में नहीं।
    language_code: hi
    direction: ltr
