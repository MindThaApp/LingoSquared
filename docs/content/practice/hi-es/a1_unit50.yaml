  feedback_frame:
    text: '{item} इस यूनिट के शब्दों में से एक है, जो एलेना और मातेओ के योजना बनाने वाले पाठ से लिया गया है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit50.lesson01.translate.002
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} इस यूनिट के शब्दों में से एक है, जो किसी गतिविधि का प्रस्ताव रखने वाले पाठ से लिया गया है।'
