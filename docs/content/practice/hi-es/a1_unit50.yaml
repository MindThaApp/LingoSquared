- content_key: practice.hi-es.es.a1.unit50.lesson01.order.003
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: word_order
  frame:
    text: ¿Tienes ganas de ir al {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_cine
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Tienes ganas de ir al {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: क्या आपका फ़िल्म देखने का मन है? ¿Tienes ganas de ...? अनौपचारिक रूप से पूछता है कि किसी का कुछ करने का मन है या नहीं; de के बाद क्रिया का मूल रूप आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit50.lesson02.order.002
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: word_order
  frame:
    text: Es un buen {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_plan
  answer_derivation:
    kind: render_frame
    frame:
      text: Es un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: यह एक अच्छी योजना है। यह थोड़ा विस्तृत सकारात्मक उत्तर है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit50.lesson02.fill.003
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: fill_in_blank
  frame:
    text: Lo siento + no puedo + una razón {item} hace amable un rechazo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_breve
    hint:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_breve
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lo siento + no puedo + एक छोटा कारण मना करने को मित्रतापूर्ण बना देता है। बातचीत में कारण देना ज़रूरी नहीं है, पर इससे वाक्य उपयोगी और विनम्र बनता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit50.lesson03.order.002
  lesson_content_key: es.a1.unit50.lesson03.quedar_un_dia_y
  type: word_order
  frame:
    text: Sí, el viernes a las dos y media me {item} bien.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_viene
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, el viernes a las dos y media me {item} bien.
      language_code: es
      direction: ltr
  feedback_frame:
    text: हाँ, शुक्रवार को 2:30 बजे ठीक है। Me viene bien ("मुझे सूट करता है") पुष्टि करता है कि प्रस्तावित समय चलेगा।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit50.lesson04.order.002
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: word_order
  frame:
    text: Esta es una {item} al café de idiomas.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_invitación
  answer_derivation:
    kind: render_frame
    frame:
      text: Esta es una {item} al café de idiomas.
      language_code: es
      direction: ltr
  feedback_frame:
    text: यह भाषा कैफ़े का निमंत्रण है। invitación का अर्थ है निमंत्रण।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit50.lesson04.fill.003
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
