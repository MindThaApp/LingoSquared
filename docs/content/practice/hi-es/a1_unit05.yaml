templates:
- content_key: practice.hi-es.es.a1.unit05.lesson01.order.001
  lesson_content_key: es.a1.unit05.lesson01.decir_la_hora_en_punto
  type: word_order
  frame:
    text: ¿Qué {item} es?
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Qué {item} es?
      language_code: es
      direction: ltr
  feedback_frame:
    text: समय क्या हुआ है? son las + घंटा से उत्तर दीजिए (son las dos), लेकिन एक बजे के लिए es la una।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson01.choose.002
  lesson_content_key: es.a1.unit05.lesson01.decir_la_hora_en_punto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'घंटे स्त्रीलिंग होते हैं क्योंकि वे horas के लिए आते हैं: las dos, las cuatro।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson02.order.001
  lesson_content_key: es.a1.unit05.lesson02.cuarto_y_media
  type: word_order
  frame:
    text: Son las cuatro y {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las cuatro y {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'सवा चार बजे हैं। साढ़े का मतलब y media है: son las cuatro y media।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson02.translate.002
  lesson_content_key: es.a1.unit05.lesson02.cuarto_y_media
  type: translation
  frame:
    text: पौने पाँच बजे हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las cinco {item} cuarto.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'स्पेनिश अगले घंटे से पीछे गिनती है: पाँच में से पौन घंटा कम।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson03.order.001
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: word_order
  frame:
    text: Son las ocho de la {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las ocho de la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De la mañana, de la tarde और de la noche वैसे ही काम करते हैं जैसे सुबह, दोपहर/शाम और रात बताने वाले शब्द।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson03.translate.002
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: translation
  frame:
    text: वर्कशॉप दोपहर बाद चार बजे शुरू होती है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: El taller empieza a las cuatro de la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'किसी समय "पर" कहने के लिए a las + घंटा आता है: a las cuatro; एक बजे के लिए a la una।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson03.match.003
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mañana का मतलब सुबह (la mañana) भी है और कल भी; आमतौर पर उपपद से फ़र्क पता चलता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson04.fill.001
  lesson_content_key: es.a1.unit05.lesson04.proponer_una_hora_para_verse
  type: fill_in_blank
  frame:
    text: De {item}, a las tres y media. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De acuerdo किसी योजना से सहमत होने का सामान्य तरीका है: ठीक है, तय रहा।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson04.translate.002
  lesson_content_key: es.a1.unit05.lesson04.proponer_una_hora_para_verse
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Antes de का मतलब "से पहले" है: antes del taller, वर्कशॉप से पहले।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson05.listen.001
  lesson_content_key: es.a1.unit05.lesson05.leer_el_horario_del_dia
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Almorzar का मतलब दोपहर का खाना खाना है; स्पेन में लोग आमतौर पर दो से तीन बजे के बीच खाना खाते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson05.fill.002
  lesson_content_key: es.a1.unit05.lesson05.leer_el_horario_del_dia
  type: fill_in_blank
  frame:
    text: Al día {item}, Elena y Mateo almuerzan juntos. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al día siguiente का मतलब अगला दिन है; siguiente संज्ञा के बाद आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson06.order.001
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: word_order
  frame:
    text: ¡Buena {item}! Comemos mañana.
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buena {item}! Comemos mañana.
      language_code: es
      direction: ltr
  feedback_frame:
    text: अच्छा विचार! हम कल खाएँगे। Idea स्त्रीलिंग है, इसलिए "अच्छा" के लिए buena आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson06.translate.002
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: translation
  frame:
    text: यहाँ के पास एक रेस्तरां है।
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Hay un {item} cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Hay किसी नई चीज़ का परिचय देता है: hay un restaurante। जाने-पहचाने स्थान के लिए está आता है: el restaurante está cerca।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit05.lesson06.choose.003
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¿Tienes hambre? स्पेनिश में "भूखा होना" नहीं, बल्कि "भूख रखना" कहा जाता है।
    language_code: hi
    direction: ltr
