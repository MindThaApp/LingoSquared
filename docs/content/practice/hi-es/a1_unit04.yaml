templates:
- content_key: practice.hi-es.es.a1.unit04.lesson01.choose.001
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'स्पैनिश में सप्ताह के दिनों के नाम छोटे अक्षर से लिखे जाते हैं और वे पुल्लिंग होते हैं: el lunes, los martes.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson01.listen.002
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'lunes से viernes तक के नाम -s पर खत्म होते हैं और बहुवचन में उनका रूप वही रहता है; sábado और domingo में -s जुड़ता है: los sábados.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson01.order.003
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: word_order
  frame:
    text: Hoy es {day}.
    language_code: es
    direction: ltr
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy es {day}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'hoy es के बाद दिन के नाम से पहले कुछ नहीं लगता; "हर मंगलवार" कहने के लिए los लगता है: los martes.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson01.translate.004
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: translation
  frame:
    text: आज {day} है।
    language_code: hi
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy es {day}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'छोटा अक्षर याद रखिए: hoy es lunes, कभी Lunes नहीं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson02.match.001
  lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'स्पैनिश में महीनों के नाम भी छोटे अक्षर से लिखे जाते हैं: enero, julio, diciembre.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson02.translate.002
  lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'कई महीनों के नाम हिंदी में प्रचलित नामों से मिलते-जुलते हैं: marzo, abril, septiembre, octubre.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson02.order.003
  lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
  type: word_order
  frame:
    text: Mi cumpleaños es en {month}.
    language_code: es
    direction: ltr
  slots:
    month: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi cumpleaños es en {month}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: महीने के साथ en लगता है (en marzo), पर पूरी तारीख के साथ el (el diez de marzo).
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson03.fill.001
  lesson_content_key: es.a1.unit04.lesson03.preguntar_y_decir_la_fecha
  type: fill_in_blank
  frame:
    text: ¿Qué {item} es hoy? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'स्पैनिश में तारीख का क्रम दिन, de, महीना होता है: el veintidós de julio.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson03.translate.002
  lesson_content_key: es.a1.unit04.lesson03.preguntar_y_decir_la_fecha
  type: translation
  frame:
    text: आज बाईस जुलाई है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy es el {item} de julio.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'स्पैनिश तारीख़ों के लिए सामान्य संख्याएँ इस्तेमाल करती है, क्रमसूचक नहीं: el veintidós यानी बाईस।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson05.choose.001
  lesson_content_key: es.a1.unit04.lesson05.leer_el_horario_del_taller
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Hay का मतलब "है" और "हैं" दोनों है: hay una clase, hay dos clases.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson05.fill.002
  lesson_content_key: es.a1.unit04.lesson05.leer_el_horario_del_taller
  type: fill_in_blank
  frame:
    text: Después hay una clase el {item} de julio. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'इक्कीस से उनतीस तक की संख्याएँ एक ही शब्द में लिखी जाती हैं: veintiuno, veintidós, veintinueve.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson06.listen.001
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Por cierto यानी "वैसे", बात बदलने का एक काम का तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson06.translate.002
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cumpleaños एक ही शब्द है और एकवचन व बहुवचन में एक जैसा रहता है: el cumpleaños, los cumpleaños.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson06.translate.003
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: translation
  frame:
    text: और तुम्हारा? (अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Y el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: El tuyo का मतलब tu cumpleaños है, जो पुल्लिंग संज्ञा है; स्त्रीलिंग संज्ञा के लिए la tuya आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit04.lesson06.match.004
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ¿Cuándo es...? पूछता है कि कुछ कब है; जवाब es el + तारीख या es en + महीना से शुरू होता है।
    language_code: hi
    direction: ltr
