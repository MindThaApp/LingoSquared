    direction: ltr
- content_key: practice.hi-es.es.a1.unit14.lesson02.order.001
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: word_order
  frame:
    text: Quiero {item} un apartamento cerca del parque.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero {item} un apartamento cerca del parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: मैं पार्क के पास एक अपार्टमेंट किराये पर लेना चाहता हूँ। Querer + क्रिया का मूल रूप बताता है कि आप क्या करना चाहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit14.lesson02.fill.002
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: fill_in_blank
  frame:
    text: Hay un apartamento {item} en este edificio. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Desocupado उस मकान के लिए आता है जिसमें अभी कोई नहीं रहता; यह संज्ञा के बाद आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit14.lesson03.translate.001
  lesson_content_key: es.a1.unit14.lesson03.cuantos_dormitorios_tiene
  type: translation
  frame:
    text: इसमें कितने शयनकक्ष हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuántos {item} tiene?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Cuántos पुल्लिंग बहुवचन संज्ञा के साथ आता है; स्त्रीलिंग संज्ञा के साथ cuántas आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit14.lesson05.fill.001
  lesson_content_key: es.a1.unit14.lesson05.leer_el_anuncio
  type: fill_in_blank
  frame:
    text: ¿Hay {item} en casa? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alguien का अर्थ है कोई; इसका उलटा nadie है, यानी कोई नहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit14.lesson06.order.001
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: word_order
  frame:
    text: Voy a llamar a la {item} hoy mismo.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Voy a llamar a la {item} hoy mismo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: मैं आज ही एजेंसी को फ़ोन करने वाला हूँ। Hoy mismo का अर्थ है ठीक आज ही।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit14.lesson06.translate.002
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'स्त्रीलिंग संज्ञा के साथ pequeño बदलकर pequeña हो जाता है: una cocina pequeña।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit14.lesson06.choose.003
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Alquilar का अर्थ है किराये पर लेना; मासिक किराये को el alquiler कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit14.lesson02.translate.003
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Edificio कोई भी इमारत है, फ़्लैटों वाली इमारत भी; casa घर या मकान है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit14.lesson02.order.004
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: word_order
  frame:
    text: El {item} está cerca del parque.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} está cerca del parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: इमारत पार्क के पास है। Cerca de + el मिलकर cerca del बन जाता है।
