templates:
- content_key: practice.hi-es.es.a1.unit11.lesson01.choose.001
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: स्पेनिश में अक्सर एकवचन el pantalón का प्रयोग होता है (los pantalones भी चलता है), जबकि हिंदी में "पैंट" एक ही शब्द है, जिसे हम एक वस्तु मानकर बोलते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit11.lesson01.listen.002
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Camisa और chaqueta स्त्रीलिंग हैं; pantalón, delantal और zapatos पुल्लिंग हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit11.lesson01.translate.003
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '-l पर समाप्त होने वाली संज्ञाओं में बहुवचन के लिए -es जुड़ता है: delantal, delantales।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit11.lesson02.order.001
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: word_order
  frame:
    text: Uso la talla {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Uso la talla {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: मैं मीडियम साइज़ पहनता/पहनती हूँ। पहने जाने वाले साइज़ के लिए स्पेनिश में usar (प्रयोग करना) क्रिया इस्तेमाल होती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit11.lesson02.fill.002
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: fill_in_blank
  frame:
    text: ¿Qué {item} usas? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Talla कपड़ों का साइज़ है; जूतों का साइज़ इसके बजाय el número कहलाता है: ¿Qué número tienes?'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit11.lesson02.translate.003
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: translation
  frame:
    text: यह मुझे ठीक से फिट नहीं होता।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Quedar bien या mal बताता है कि कपड़े आपको कैसे फिट होते हैं: me queda bien, यह मुझे अच्छी तरह फिट होता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit11.lesson04.order.001
  lesson_content_key: es.a1.unit11.lesson04.decidir_comprar
  type: word_order
  frame:
    text: Me queda bien. Voy a {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda bien. Voy a {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Ir a + क्रिया का मूल रूप किसी योजना को बताता है: voy a comprarlo, मैं इसे खरीदने जा रहा हूँ। lo, यानी "इसे", मूल क्रिया के अंत में जुड़ जाता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit11.lesson05.match.001
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Uso, usas और usan तीनों usar से बने हैं: मैं पहनता हूँ, तुम पहनते हो, वे पहनते हैं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit11.lesson05.fill.002
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: fill_in_blank
  frame:
    text: 'El delantal es más {item}: solo cuesta doce. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Más + विशेषण तुलना बनाता है: más barato, और सस्ता।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit11.lesson06.order.001
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: word_order
  frame:
    text: Sí, buscamos {item} para el taller.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, buscamos {item} para el taller.
      language_code: es
      direction: ltr
  feedback_frame:
    text: हाँ, हम वर्कशॉप के लिए एप्रन ढूँढ रहे हैं। Buscar का अर्थ ही "ढूँढना" है, इसलिए buscamos delantales में किसी अतिरिक्त शब्द की ज़रूरत नहीं है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit11.lesson06.choose.002
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दुकान का कर्मचारी ¿Los ayudo? से मदद की पेशकश करता है, यानी क्या मैं आप सबकी मदद करूँ?
    language_code: hi
    direction: ltr
- content_key: practice.hi-es.es.a1.unit11.lesson06.translate.003
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Voy क्रिया ir (जाना) से बना है; यह अनियमित है: voy, vas, va।'
    language_code: hi
    direction: ltr
