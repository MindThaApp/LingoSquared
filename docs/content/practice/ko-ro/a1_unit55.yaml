schema_version: '1.0'
pack_key: practice.ko-ro.a1.unit55
source_language: ko
target_language: ro
unit_content_key: ro.a1.unit55.muzeu
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_concert
    - w_concertul
    - w_expoziția
    - w_expoziție
    - w_ghid
    - w_sala
    - w_tabloul
    - w_tablouri
    - w_vizita
    - w_vizitez
templates:
- content_key: practice.ko-ro.ro.a1.unit55.lesson01.choose.001
  lesson_content_key: ro.a1.unit55.lesson01.vreau_sa_merg_la
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_vizita
        - w_vizitez
        - w_expoziția
        - w_expoziție
        - w_ghid
        - w_sala
        - w_tabloul
        - w_tablouri
        - w_concertul
        - w_concert
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. ''박물관에 가고 싶어요'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit55.lesson02.listen.001
  lesson_content_key: ro.a1.unit55.lesson02.vreau_sa_cumpar_un
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 표를 사고 싶어요 수업에 나온 이 단원의 단어 중 하나예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit55.lesson04.translate.001
  lesson_content_key: ro.a1.unit55.lesson04.la_muzeu
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어예요. 박물관에서 배우는 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit55.lesson05.match.001
  lesson_content_key: ro.a1.unit55.lesson05.citirea_panoului_de_informatii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 루마니아어 단어를 알맞은 한국어 뜻과 연결하세요. 단어는 이 단원의 수업에서 나온 것이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit55.lesson06.choose.001
  lesson_content_key: ro.a1.unit55.lesson06.mihai_nina_si_ana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
