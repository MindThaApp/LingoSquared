templates:
- content_key: practice.ko-ro.ro.a1.unit05.lesson01.choose.001
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: meu와 mea는 둘 다 '나의'라는 뜻이에요. meu는 남성·중성 명사(tatăl meu)와, mea는 여성 명사(mama mea)와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson01.listen.002
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Părinți는 '부모님'이라는 뜻의 복수형이에요. 부모님 두 분은 mamă(어머니)와 tată(아버지)예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson01.match.003
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mamă와 tată는 기본형 명사이고, mama와 tatăl은 끝에 정관사가 붙은 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson01.translate.004
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 루마니아어는 정관사를 명사 뒤에 붙여요. mamă는 mama가 되고, tată는 tatăl이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson01.order.005
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: word_order
  frame:
    text: Mama {item} și tatăl meu.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item} și tatăl meu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 소유어는 명사의 성에 맞춰 써요. mama mea(여성)이지만 tatăl meu(남성)예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson01.fill.006
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: fill_in_blank
  frame:
    text: Mama mea și tatăl {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tatăl은 남성이라서 meu가 붙고, mama는 여성이라서 mea가 붙어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson01.translate.007
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: 나의 어머니.
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 루마니아어에서 소유어는 명사 뒤에 와요. mama mea라고 하고, mea mama라고는 하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson02.choose.001
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 루마니아어 복수형은 어미가 바뀌어요. frate는 frați, soră는 surori, copil은 copii가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson02.listen.002
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fiu는 아들, fiică는 딸이에요. 결혼한 남자는 căsătorit라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson02.match.003
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Frate, fiu, copil은 남성이라서 un과 함께 쓰고, soră와 fiică는 여성이라서 o와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson02.translate.004
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Frați는 frate의 복수형이고, surori는 soră의 복수형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson02.order.005
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: word_order
  frame:
    text: Ai {item}?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ai frați?는 친구에게 하는 질문이에요. dumneavoastră를 쓰는 사이에서는 Aveți frați?가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson02.fill.006
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: fill_in_blank
  frame:
    text: Am un {item} și o soră. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Un은 남성 명사(un frate)와, o는 여성 명사(o soră)와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson02.translate.007
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: 저는 딸이 하나 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Am o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fiică는 여성이라서 o가 붙어요. 아들은 un fiu예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson02.translate.008
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: 아이가 몇 명 있어요? (친근한 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți {item} ai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Câți는 '몇'의 남성 복수형이고, copil의 복수형인 copii와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson03.translate.001
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: translation
  frame:
    text: 미하이 씨, 형제가 있으세요? (격식)
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aveți {item}, Mihai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți는 '있다'의 높임 형태예요. 친구에게는 Ai frați?라고 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit05.lesson03.order.002
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: word_order
  frame:
    text: Da, am un frate și o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, am un frate și o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un frate는 남성이고 o soră는 여성이에요. 이 문장은 Aveți frați?에 대한 대답이에요.
    language_code: ko
    direction: ltr
