templates:
- content_key: practice.ko-ro.ro.a1.unit02.lesson01.choose.001
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 2에는 두 가지 형태가 있어요. 남성 명사에는 doi, 여성 명사와 중성 명사에는 două를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson01.listen.002
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 0부터 10까지가 기본이에요. 십대 수는 -sprezece를 붙이고(unsprezece, doisprezece), 십 단위는 -zeci를 붙여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson01.match.003
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Doi는 2의 남성형이고 două는 여성형과 중성형이에요. 다른 수는 변하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson01.translate.004
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 명사 앞에서 1과 2는 성에 따라 달라져요(un 또는 o, doi 또는 două). 그냥 셀 때는 unu, doi라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson02.choose.001
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 십대 수는 한 자리 수에 -sprezece를 붙여 만들어요. doisprezece는 2에 10을 더한 수예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson02.listen.002
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 십 단위는 -zeci로 끝나요. douăzeci, treizeci, patruzeci처럼 nouăzeci까지 이어져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson02.match.003
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 십 단위는 한 자리 수에 -zeci를 붙여 만들어요. trei는 treizeci, patru는 patruzeci가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson02.translate.004
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sută는 백이라는 뜻이에요. 100은 여성형 o를 써서 o sută예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson03.order.001
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Am {item} ani.
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: '2부터 19까지는 de가 없어요: am nouăsprezece ani. 20부터는 de가 나와요: am treizeci de ani.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson02.translate.005
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: translation
  frame:
    text: 저는 서른 살이에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} de ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: '20 이상의 수는 명사 앞에 de가 와요: treizeci de ani.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson03.choose.002
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ai는 tu에 쓰는 ''가지다''의 형태이고 aveți는 dumneavoastră에 쓰는 형태예요: Câți ani ai? 또는 Câți ani aveți?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson03.fill.003
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: fill_in_blank
  frame:
    text: Am treizeci {item} ani. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De는 20 이상의 수 뒤에 와요: treizeci de ani, 하지만 nouăsprezece ani.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson03.translate.004
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: 몇 살이에요? (친구에게 하는 편한 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Câți ani ai?는 직역하면 몇 해를 가지고 있는지 묻는 말이에요. 루마니아어는 나이를 말할 때 '이다'가 아니라 '가지다'를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson03.translate.005
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: 연세가 어떻게 되세요? (dumneavoastră로 부르는 사람에게 하는 공손한 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți는 '가지다'의 공손한 형태로, dumneavoastră와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson03.order.006
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Care e numărul {item} de telefon?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Care e numărul {item} de telefon?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Numărul은 중성이고, 중성 단수 명사에는 남성형 tău를 써요. 공손한 표현은 Care este numărul dumneavoastră de telefon?이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson03.translate.007
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '루마니아어는 ''나는 서른 살이다''가 아니라 ''나는 서른 해를 가지고 있다''라고 말해요: am treizeci de ani.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit02.lesson03.match.008
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ani는 an의 복수형이에요. Câți ani ai? 라는 질문은 몇 해인지 묻는 말이에요.
    language_code: ko
    direction: ltr
