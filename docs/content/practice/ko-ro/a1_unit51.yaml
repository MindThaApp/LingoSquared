schema_version: '1.0'
pack_key: practice.ko-ro.a1.unit51
source_language: ko
target_language: ro
unit_content_key: ro.a1.unit51.spalatorie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aleg
    - w_coșul
    - w_duc
    - w_grade
    - w_greu
    - w_hainele
    - w_monede
    - w_ridic
    - w_ridica
    - w_rufe
    - w_spăla
    - w_spălare
    - w_spălarea
    - w_spălătoria
    - w_spălătorie
    - w_uscător
    - w_uscătorul
templates:
- content_key: practice.ko-ro.ro.a1.unit51.lesson01.choose.001
  lesson_content_key: ro.a1.unit51.lesson01.vreau_sa_mi_spal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_spălătoria
        - w_spălătorie
        - w_spăla
        - w_hainele
        - w_spălare
        - w_aleg
        - w_spălarea
        - w_ridica
        - w_ridic
        - w_grade
        - w_uscătorul
        - w_uscător
        - w_monede
        - w_coșul
        - w_rufe
        - w_duc
        - w_greu
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어예요. ''옷을 빨고 싶어요'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit51.lesson02.listen.001
  lesson_content_key: ro.a1.unit51.lesson02.cat_costa_o_spalare
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어예요. ''세탁 한 번에 얼마예요?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit51.lesson03.translate.001
  lesson_content_key: ro.a1.unit51.lesson03.cand_sunt_gata_rufele
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어예요. ''빨래는 언제 다 돼요?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit51.lesson04.match.001
  lesson_content_key: ro.a1.unit51.lesson04.la_spalatorie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 루마니아어 단어를 알맞은 한국어 뜻과 연결하세요. 단어는 이 단원의 수업에서 나온 것이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit51.lesson05.choose.001
