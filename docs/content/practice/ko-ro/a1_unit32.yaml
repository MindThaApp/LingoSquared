  frame:
    text: Are {item} maro și este mic.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_blană
  answer_derivation:
    kind: render_frame
    frame:
      text: Are {item} maro și este mic.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 그는 갈색 털에 몸집이 작아요. 외모 단원에서 배운 머리 색과 크기 어휘를 다시 쓰되, 이번에는 사람의 머리카락 대신 동물의 털을 묘사해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit32.lesson06.order.002
