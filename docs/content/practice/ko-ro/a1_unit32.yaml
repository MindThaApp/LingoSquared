    frame:
      text: Ce {item} că toți trei iubim animalele!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 우리 셋 모두 동물을 좋아하다니 정말 좋네요! 이번 단원에 나온 세 사람의 동물 이야기를 마무리해요.
    language_code: ko
    direction: ltr
