templates:
- content_key: practice.ko-ro.ro.a1.unit13.lesson01.choose.001
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '루마니아어는 관사를 단어 끝에 붙여요: cafea는 cafeaua가 되고 ceai는 ceaiul이 돼요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson01.listen.002
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cafeaua, ceaiul, pâinea는 관사가 붙은 형태예요. 끝의 -a나 -ul이 관사 역할을 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson01.order.003
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: word_order
  frame:
    text: Îmi place {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Îmi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Îmi place 뒤에 관사가 붙은 명사를 쓰면 그것을 좋아한다는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson01.order.004
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: word_order
  frame:
    text: Nu-mi place {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu-mi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Nu-mi place는 부정형이에요. 명사에는 계속 관사가 붙어요: pâinea.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson01.fill.005
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: fill_in_blank
  frame:
    text: Îmi place {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ceaiul은 ceai에 관사 -ul이 붙은 형태라서 '그 차'를 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson01.translate.006
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: translation
  frame:
    text: 저는 그 차를 좋아해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Îmi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Îmi place는 '나에게 즐거움을 준다'처럼 작동해서, 좋아하는 대상이 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson01.translate.007
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: translation
  frame:
    text: 저는 그 커피를 좋아하지 않아요.
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu-mi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Nu-mi는 nu에 줄어든 îmi가 하이픈으로 이어진 형태로, '나에게 즐겁지 않다'는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson01.translate.008
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: translation
  frame:
    text: 저는 {item}을(를) 좋아해요.
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Îmi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: '좋아하는 대상이 place의 주어예요: Îmi place cafeaua, Îmi place ceaiul, Îmi place pâinea.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson02.choose.001
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Prefer는 '저는 더 좋아해요'라는 뜻이고, sau는 두 선택지를 이어 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson02.listen.002
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sau는 '또는'이라는 뜻이에요. cafea sau ceai처럼 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson02.order.003
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: word_order
  frame:
    text: Prefer {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Prefer {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Prefer는 '저는 더 좋아해요'라는 뜻이에요. 더 좋아하는 대상이 관사와 함께 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson02.order.004
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: word_order
  frame:
    text: Cafea {item} ceai?
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Cafea {item} ceai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sau는 두 가지 중에서 고르도록 제안할 때 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson02.fill.005
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: fill_in_blank
  frame:
    text: Cafea {item} ceai? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sau는 '또는'이라는 뜻이고 형태가 변하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson02.translate.006
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: translation
  frame:
    text: 그 커피를 좋아하세요? (dumneavoastră로 부르는 사람에게 쓰는 격식 표현)
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Vă place {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă place는 dumneavoastră에게 하는 질문이에요. 친구에게는 Îți place라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson02.translate.007
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: translation
  frame:
    text: 저는 그 커피를 더 좋아해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Prefer {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Prefer에는 '저는'에 해당하는 별도의 단어가 필요 없어요. 어미가 사람을 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit13.lesson02.translate.008
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: translation
  frame:
    text: 커피 아니면 차?
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Cafea {item} ceai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sau는 두 선택지를 짧은 질문 하나로 이어 줘요.
    language_code: ko
    direction: ltr
