  feedback_frame:
    text: 저는 일기예보를 찾아봐요. prognoza는 '그 예보'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson02.translate.004
  lesson_content_key: ro.a1.unit35.lesson02.aplicatia_si_trimiterea_unui
  type: translation
  frame:
    text: Andrei는 일기예보를 찾아봐요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_meteo
  answer_derivation:
    kind: render_frame
    frame:
      text: Andrei caută prognoza {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 안드레이는 일기예보를 찾아봐요. meteo는 '날씨'(일기예보의 '일기')라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson03.order.002
  lesson_content_key: ro.a1.unit35.lesson03.a_cauta_ceva
  type: word_order
  frame:
    text: Andrei {item} prognoza meteo.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_caută
  answer_derivation:
    kind: render_frame
    frame:
      text: Andrei {item} prognoza meteo.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 안드레이는 일기예보를 찾아봐요. caută는 '그/그녀가 찾는다', 또는 '봐!'(반말)라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson03.fill.003
  lesson_content_key: ro.a1.unit35.lesson03.a_cauta_ceva
  type: fill_in_blank
  frame:
