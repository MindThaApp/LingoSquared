schema_version: '1.0'
pack_key: practice.ko-ro.a1.unit35
source_language: ko
target_language: ro
unit_content_key: ro.a1.unit35.tehnologie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_alergat
    - w_aplicația
    - w_aplicație
    - w_articolul
    - w_caut
    - w_caută
    - w_cauți
    - w_citește
    - w_computer
    - w_computerul
    - w_căuta
    - w_dimineață
    - w_fel
    - w_folosesc
    - w_folosește
    - w_folosi
    - w_internet
    - w_internetul
    - w_mesaje
    - w_meteo
    - w_neutru
    - w_numi
    - w_prognoza
    - w_sfârșit
    - w_sună
    - w_super
    - w_telefonul
    - w_trimite
    - w_vin
    - w_văd
templates:
- content_key: practice.ko-ro.ro.a1.unit35.lesson01.choose.001
  lesson_content_key: ro.a1.unit35.lesson01.telefonul_computerul_si_internetul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_folosi
        - w_folosesc
        - w_telefonul
        - w_computerul
        - w_folosește
        - w_computer
        - w_internetul
        - w_internet
        - w_aplicația
        - w_aplicație
        - w_prognoza
        - w_meteo
        - w_neutru
        - w_mesaje
        - w_articolul
        - w_sfârșit
        - w_trimite
        - w_citește
        - w_căuta
        - w_caut
        - w_cauți
        - w_fel
        - w_caută
        - w_alergat
        - w_văd
        - w_numi
        - w_sună
        - w_dimineață
        - w_vin
        - w_super
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. 휴대폰, 컴퓨터, 인터넷 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson02.listen.001
  lesson_content_key: ro.a1.unit35.lesson02.aplicatia_si_trimiterea_unui
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. 앱과 메시지 보내기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson03.translate.001
  lesson_content_key: ro.a1.unit35.lesson03.a_cauta_ceva
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. 무언가를 찾아보는 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson04.match.001
  lesson_content_key: ro.a1.unit35.lesson04.ana_trimite_un_mesaj
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 루마니아어 단어를 알맞은 한국어 뜻과 연결하세요. 단어는 이 단원의 수업에서 나온 것이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson05.choose.001
  lesson_content_key: ro.a1.unit35.lesson05.cine_foloseste_ce
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''누가 무엇을 쓸까요?'' 수업에서 배워요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson06.translate.001
  lesson_content_key: ro.a1.unit35.lesson06.ne_vedem_sambata_in
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. ''토요일에 공원에서 만나요!'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson01.order.002
  lesson_content_key: ro.a1.unit35.lesson01.telefonul_computerul_si_internetul
  type: word_order
  frame:
    text: Folosesc {item} meu.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_telefonul
  answer_derivation:
    kind: render_frame
    frame:
      text: Folosesc {item} meu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 저는 제 휴대폰을 써요. telefonul은 '그 휴대폰'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson01.fill.003
  lesson_content_key: ro.a1.unit35.lesson01.telefonul_computerul_si_internetul
  type: fill_in_blank
  frame:
    text: Ana {item} un computer. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_folosește
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_folosește
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 아나는 컴퓨터를 써요. folosește는 '그/그녀가 쓴다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson01.translate.004
  lesson_content_key: ro.a1.unit35.lesson01.telefonul_computerul_si_internetul
  type: translation
  frame:
    text: 집에 인터넷 있어요?
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_internet
  answer_derivation:
    kind: render_frame
    frame:
      text: Ai {item} acasă?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 집에 인터넷이 있어요? internet은 인터넷이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson02.order.002
  lesson_content_key: ro.a1.unit35.lesson02.aplicatia_si_trimiterea_unui
  type: word_order
  frame:
    text: Am o {item} pentru prognoza meteo.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_aplicație
  answer_derivation:
    kind: render_frame
    frame:
      text: Am o {item} pentru prognoza meteo.
      language_code: ro
