    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_alergat
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_alergat
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 그러고 나서 달리기하러 가요. Apoi는 '그러고 나서', merge la alergat는 '달리기하러 가다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson05.order.002
  lesson_content_key: ro.a1.unit35.lesson05.cine_foloseste_ce
  type: word_order
  frame:
    text: Andrei caută în fiecare {item} prognoza meteo.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_dimineață
  answer_derivation:
    kind: render_frame
    frame:
      text: Andrei caută în fiecare {item} prognoza meteo.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 안드레이는 매일 아침 일기예보를 찾아봐요. dimineață는 '아침'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit35.lesson06.order.002
  lesson_content_key: ro.a1.unit35.lesson06.ne_vedem_sambata_in
  type: word_order
  frame:
    text: Eu prefer să înot, dar {item} și eu în parc.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vin
  answer_derivation:
    kind: render_frame
    frame:
      text: Eu prefer să înot, dar {item} și eu în parc.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 저는 수영하는 게 더 좋지만, 공원에도 갈게요. Prefer să înot는 '수영하는 쪽을 더 좋아해요'라는 뜻이에요. a prefera + să + 동사 구조예요.
    language_code: ko
    direction: ltr
