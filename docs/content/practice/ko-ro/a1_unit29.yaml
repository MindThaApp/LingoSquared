schema_version: '1.0'
pack_key: practice.ko-ro.a1.unit29
source_language: ko
target_language: ro
unit_content_key: ro.a1.unit29.bani
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_ajutat
    - w_azi
    - w_cafele
    - w_cardul
    - w_cerem
    - w_doriți
    - w_drăguț
    - w_feluri
    - w_idee
    - w_nota
    - w_numerar
    - w_partea
    - w_plătesc
    - w_plătește
    - w_plăti
    - w_plătit
    - w_plătiți
    - w_poftiți
    - w_principale
    - w_rest
    - w_restul
    - w_separat
    - w_total
    - w_împărțim
templates:
- content_key: practice.ko-ro.ro.a1.unit29.lesson01.choose.001
  lesson_content_key: ro.a1.unit29.lesson01.cat_costa_in_total
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_total
        - w_plăti
        - w_cardul
        - w_numerar
        - w_plătesc
        - w_doriți
        - w_plătiți
        - w_nota
        - w_împărțim
        - w_separat
        - w_restul
        - w_poftiți
        - w_rest
        - w_feluri
        - w_principale
        - w_cafele
        - w_plătit
        - w_cerem
        - w_idee
        - w_azi
        - w_ajutat
        - w_drăguț
        - w_partea
        - w_plătește
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어로, ''총 얼마예요?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson02.listen.001
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어로, ''카드 또는 현금?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson03.translate.001
  lesson_content_key: ro.a1.unit29.lesson03.impartirea_notei
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어로, ''계산 나누기'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson04.match.001
  lesson_content_key: ro.a1.unit29.lesson04.restul
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 루마니아어 단어를 알맞은 한국어 뜻과 연결하세요. 단어는 이 단원의 수업에서 나온 것이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson05.choose.001
  lesson_content_key: ro.a1.unit29.lesson05.citim_nota_de_plata
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어로, ''식당 영수증 읽기'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson06.translate.001
  lesson_content_key: ro.a1.unit29.lesson06.ana_si_mihai_platesc
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''Ana와 Mihai가 계산해요'' 과에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson01.order.002
  lesson_content_key: ro.a1.unit29.lesson01.cat_costa_in_total
  type: word_order
  frame:
    text: Cât costă în {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_total
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă în {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 총 얼마예요? În total(총)은 한 품목이 아니라 전체 합계 가격을 묻는다는 걸 분명히 해 줘요. Cât costă?는 "얼마예요?"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson02.order.002
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: word_order
  frame:
    text: Pot {item} cu cardul aici?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_plăti
  answer_derivation:
    kind: render_frame
    frame:
      text: Pot {item} cu cardul aici?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 여기서 카드로 계산할 수 있나요? plăti는 "지불하다"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson02.fill.003
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: fill_in_blank
  frame:
    text: Doriți să plătiți în numerar sau cu {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_cardul
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_cardul
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 현금으로 하시겠어요, 카드로 하시겠어요? Doriți să plătiți ...?는 낯선 계산원이 쓰는 격식체(dumneavoastră) 표현이고, 친구에게는 Vrei să plătești ...?라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson02.translate.004
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: translation
  frame:
    text: 현금으로 낼게요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_numerar
  answer_derivation:
    kind: render_frame
    frame:
      text: Plătesc în {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 현금으로 낼게요. numerar는 "현금"이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson03.order.002
  lesson_content_key: ro.a1.unit29.lesson03.impartirea_notei
  type: word_order
  frame:
    text: Hai să împărțim {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_nota
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai să împărțim {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 계산서를 나눌까요? nota는 "계산서"라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson03.fill.003
  lesson_content_key: ro.a1.unit29.lesson03.impartirea_notei
  type: fill_in_blank
  frame:
    text: Pot plăti {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_separat
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_separat
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 따로 계산해도 될까요? Separat(따로)는 a plăti 뒤에 와요. Pot plăti separat?는 각자 자기 몫을 낼 때 흔히 쓰는 요청이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson04.order.002
  lesson_content_key: ro.a1.unit29.lesson04.restul
  type: word_order
  frame:
    text: Nu am nevoie de {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_rest
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu am nevoie de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: '거스름돈은 필요 없어요. A avea nevoie de(필요하다)는 de와 함께 써요: Nu am nevoie de rest.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson06.order.002
  lesson_content_key: ro.a1.unit29.lesson06.ana_si_mihai_platesc
  type: word_order
  frame:
    text: Hai să {item} nota?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_cerem
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai să {item} nota?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 계산서를 달라고 할까요? A cere(요청하다)는 nota를 직접 목적어로 취해요. Hai să cerem nota?는 함께 달라고 하자는 제안이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit29.lesson06.fill.003
  lesson_content_key: ro.a1.unit29.lesson06.ana_si_mihai_platesc
  type: fill_in_blank
  frame:
    text: Mihai {item} nota. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_plătește
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_plătește
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mihai가 계산서를 계산해요. Plătește는 a plăti(지불하다)의 3인칭 단수 형태예요.
    language_code: ko
    direction: ltr
