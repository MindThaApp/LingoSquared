      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mâncat은 '먹었어요'라고 말할 때 am 뒤에 오는 과거형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit12.lesson02.fill.005
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: fill_in_blank
  frame:
    text: Am {item} ceai. ({hint})
    language_code: ro
