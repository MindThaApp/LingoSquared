  lesson_content_key: ro.a1.unit12.lesson01.am_fost_la_parc
  type: fill_in_blank
  frame:
    text: Am {item} la cinema. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fost는 '있다/이다'의 과거형이에요. am fost la cinema(영화관에 갔었어요)는 '영화관에 갔어요'를 말하는 일반적인 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit12.lesson02.fill.004
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: fill_in_blank
  frame:
    text: Am {item} pâine. ({hint})
    language_code: ro
