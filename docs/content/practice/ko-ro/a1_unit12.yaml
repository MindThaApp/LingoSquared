  lesson_content_key: ro.a1.unit12.lesson03.cum_a_fost_duminica
  type: word_order
  frame:
    text: Cum {item} fost duminică?
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum {item} fost duminică?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: A fost는 '~였어요'라는 뜻이에요. 주어가 그, 그녀, 그것일 때는 am 대신 조동사 a를 써요.
    language_code: ko
    direction: ltr
