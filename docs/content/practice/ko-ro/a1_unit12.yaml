    frame:
      text: Am mâncat pâine și am {item} ceai.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Am băut은 beau의 과거형이에요. 문장마다 동사 앞에 am이 반복돼요.
    language_code: ko
    direction: ltr
