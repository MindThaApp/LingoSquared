templates:
- content_key: practice.ko-ro.ro.a1.unit12.lesson01.choose.001
  lesson_content_key: ro.a1.unit12.lesson01.am_fost_la_parc
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Am fost는 am과 fost(~이었다/가 있었다)가 합쳐진 형태예요. 그/그녀가 주어일 때는 같은 fost에 a를 써서 a fost라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit12.lesson02.listen.001
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Am mâncat과 am băut도 같은 방식으로 만들어요. am에 -t로 끝나는 과거형을 붙여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit12.lesson03.listen.001
  lesson_content_key: ro.a1.unit12.lesson03.cum_a_fost_duminica
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cum a fost duminică?에서는 조동사 a가 fost 앞에 와서 '~였다'를 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit12.lesson01.order.002
  lesson_content_key: ro.a1.unit12.lesson01.am_fost_la_parc
  type: word_order
  frame:
    text: Ieri am {item} la parc.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ieri am {item} la parc.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Am fost la parc는 '공원에 갔어요' 또는 '공원에 있었어요'라는 뜻이에요. ieri가 문장을 과거로 만들어 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit12.lesson02.order.002
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: word_order
  frame:
    text: Am {item} pâine și am băut ceai.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} pâine și am băut ceai.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: mănânc의 과거형은 am mâncat이에요. am에 과거형을 붙이는데, 이 과거형은 모양이 변하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit12.lesson02.order.003
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: word_order
  frame:
    text: Am mâncat pâine și am {item} ceai.
    language_code: ro
    direction: ltr
  slots:
