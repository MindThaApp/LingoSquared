- content_key: practice.ko-ro.ro.a1.unit12.lesson02.translate.006
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: fost, mâncat, băut 같은 루마니아어 과거형은 -t로 끝나고, '나'일 때는 am과 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit12.lesson01.translate.004
  lesson_content_key: ro.a1.unit12.lesson01.am_fost_la_parc
  type: translation
  frame:
    text: 어제 공원에 갔어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ieri am {item} la parc.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ieri는 과거를 나타내요. 직역하면 '공원에 있었어요'인 am fost la parc가 '공원에 갔어요'를 말하는 일반적인 표현이에요.
    language_code: ko
    direction: ltr
