    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} pâine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Am mâncat pâine에서는 '나'의 과거형에 am을 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit12.lesson02.translate.008
  lesson_content_key: ro.a1.unit12.lesson02.am_mancat_am_baut
  type: translation
  frame:
    text: 차를 마셨어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} ceai.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Am băut ceai: am에 beau의 과거형을 붙인 거예요.'
    language_code: ko
    direction: ltr
