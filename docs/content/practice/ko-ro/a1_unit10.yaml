    kind: slot_text
    slot: item
  feedback_frame:
    text: Mănânc, beau, merg에는 '저는'에 해당하는 단어가 필요 없어요. 동사 어미에서 인칭이 드러나기 때문이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit10.lesson01.translate.006
  lesson_content_key: ro.a1.unit10.lesson01.dimineata
  type: translation
  frame:
    text: 저는 아침에 일어나고 빵을 먹어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Mă trezesc dimineața și {item} pâine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mănânc는 '먹다'라는 동사의 '저는' 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit10.lesson01.translate.007
  lesson_content_key: ro.a1.unit10.lesson01.dimineata
  type: translation
  frame:
    text: 저는 아침에 빵을 먹고 커피를 마셔요.
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Mănânc pâine și {item} cafea dimineața.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Beau는 '저는 마셔요'예요. mănânc와 beau의 어미에서 이미 '저는'이 드러나기 때문에 루마니아어에서는 eu를 생략해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit10.lesson02.translate.006
  lesson_content_key: ro.a1.unit10.lesson02.lucrez_merg_acasa
  type: translation
  frame:
    text: 저는 저녁에 일하고 밤에 집에 가요.
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrez seara și {item} acasă noaptea.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Merg acasă noaptea: seara와 noaptea는 때를 나타내고, acasă에는 전치사가 필요 없어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit10.lesson03.translate.004
  lesson_content_key: ro.a1.unit10.lesson03.rutina_mihai
  type: translation
  frame:
    text: 저는 저녁에 일하고, 그다음 밤에 자요.
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrez seara, apoi mă {item} noaptea.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mă culc에는 재귀 대명사 mă가 와요. apoi는 '그다음에'라는 뜻이에요.
    language_code: ko
    direction: ltr
