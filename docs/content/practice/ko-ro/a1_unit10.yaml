    slot: item
  feedback_frame:
    text: Trezesc, mănânc, beau는 모두 '저는' 형태예요. 루마니아어 동사는 어미에서 인칭이 드러나므로 각 형태를 나올 때마다 익히면 돼요.
    language_code: ko
    direction: ltr
