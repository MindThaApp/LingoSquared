schema_version: '1.0'
pack_key: practice.ko-ro.a1.unit50
source_language: ko
target_language: ro
unit_content_key: ro.a1.unit50.frizerie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aceeași
    - w_coafura
    - w_coafură
    - w_frizer
    - w_frizerul
    - w_lista
    - w_listă
    - w_loc
    - w_nicio
    - w_prea
    - w_prețuri
    - w_problemă
    - w_puteți
    - w_scurtă
    - w_spălat
    - w_sta
    - w_stă
    - w_tocmai
    - w_tunde
    - w_tundeți
    - w_tuns
    - w_tunsoare
    - w_tunsoarea
    - w_veniți
templates:
- content_key: practice.ko-ro.ro.a1.unit50.lesson01.choose.001
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_prea
        - w_frizerul
        - w_frizer
        - w_tunde
        - w_puteți
        - w_tundeți
        - w_veniți
        - w_aceeași
        - w_coafură
        - w_scurtă
        - w_nicio
        - w_problemă
        - w_loc
        - w_lista
        - w_prețuri
        - w_tunsoarea
        - w_tunsoare
        - w_listă
        - w_spălat
        - w_tuns
        - w_coafura
        - w_sta
        - w_stă
        - w_tocmai
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 머리가 너무 길어요 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson02.listen.001
  lesson_content_key: ro.a1.unit50.lesson02.puteti_sa_mi_tundeti
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item} (''머리 좀 잘라 주실 수 있어요?'' 수업)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson03.translate.001
  lesson_content_key: ro.a1.unit50.lesson03.facem_o_programare
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 예약하기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson04.match.001
  lesson_content_key: ro.a1.unit50.lesson04.la_frizer
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 루마니아어 단어를 알맞은 한국어 뜻과 연결하세요. 단어는 이 단원의 수업에서 나온 것이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson05.choose.001
  lesson_content_key: ro.a1.unit50.lesson05.citim_lista_de_preturi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어예요. ''가격표 읽기'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson06.translate.001
  lesson_content_key: ro.a1.unit50.lesson06.ana_vede_coafura_noua
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이번 단원의 단어 {item}, 'Ana가 새 머리 모양을 봐요' 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson01.order.002
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: word_order
  frame:
    text: Părul meu este {item} lung.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_prea
  answer_derivation:
    kind: render_frame
    frame:
      text: Părul meu este {item} lung.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 머리가 너무 길어요. prea = 너무
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson01.fill.003
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: fill_in_blank
  frame:
    text: Merg la {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_frizer
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_frizer
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 미용실에 가요. frizer = 미용사, 미용실
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson02.order.002
  lesson_content_key: ro.a1.unit50.lesson02.puteti_sa_mi_tundeti
  type: word_order
  frame:
    text: Puteți să-mi {item} părul?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_tundeți
  answer_derivation:
    kind: render_frame
    frame:
      text: Puteți să-mi {item} părul?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 제 머리를 잘라 주실 수 있어요? tundeți = (존댓말) 자르시다
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson04.order.002
  lesson_content_key: ro.a1.unit50.lesson04.la_frizer
  type: word_order
  frame:
    text: Perfect, și doriți {item} coafură?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_aceeași
  answer_derivation:
    kind: render_frame
    frame:
      text: Perfect, și doriți {item} coafură?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 좋아요, 같은 스타일로 원하세요? aceeași = 같은 (여성형)
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson04.fill.003
  lesson_content_key: ro.a1.unit50.lesson04.la_frizer
  type: fill_in_blank
  frame:
    text: Da, aceeași {item}, dar mai scurtă. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_coafură
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_coafură
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 네, 같은 스타일인데 더 짧게요. coafură = 머리 모양, 헤어스타일
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson05.order.002
  lesson_content_key: ro.a1.unit50.lesson05.citim_lista_de_preturi
  type: word_order
  frame:
    text: Citesc {item} de prețuri.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_lista
  answer_derivation:
    kind: render_frame
    frame:
      text: Citesc {item} de prețuri.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 가격표를 읽고 있어요. lista = 그 목록
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson05.fill.003
  lesson_content_key: ro.a1.unit50.lesson05.citim_lista_de_preturi
  type: fill_in_blank
  frame:
    text: O {item} costă șaizeci de lei. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_tunsoare
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_tunsoare
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 커트는 60레이예요. tunsoare = 커트, 이발
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit50.lesson06.order.002
  lesson_content_key: ro.a1.unit50.lesson06.ana_vede_coafura_noua
  type: word_order
  frame:
    text: Îți {item} bine!
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_stă
  answer_derivation:
    kind: render_frame
    frame:
      text: Îți {item} bine!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 잘 어울려요! stă = 있다, 서 있다
    language_code: ko
    direction: ltr
