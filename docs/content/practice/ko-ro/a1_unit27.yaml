      text: Cum se {item} Mihai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: '미하이는 기분이 어때요? A se simți(느끼다)는 재귀 동사예요: mă simt(나), te simți(너), se simte(그/그녀). 기분을 묻거나 말할 때 쓰는 기본 방식이에요.'
    language_code: ko
    direction: ltr
