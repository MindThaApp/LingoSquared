  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_ajută
    - w_chiar
    - w_cred
    - w_descurci
    - w_emoționat
    - w_ești
    - w_face
    - w_fericit
    - w_fii
    - w_foarte
    - w_griji
    - w_mândru
    - w_nou
    - w_prima
    - w_puțin
    - w_rezolvă
    - w_serviciu
    - w_simte
    - w_simți
    - w_sincer
    - w_singur
    - w_supărat
    - w_trist
    - w_tură
