        - w_singur
        - w_serviciu
        - w_cred
        - w_rezolvă
        - w_simți
        - w_sincer
        - w_descurci
        - w_chiar
        - w_ajută
        - w_fii
        - w_foarte
        - w_mândru
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, '기쁨, 슬픔, 화남' 수업에 나와요.
    language_code: ko
    direction: ltr
