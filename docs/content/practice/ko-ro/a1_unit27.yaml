    slot: item
  feedback_frame:
    text: 안녕, 미하이. 첫 근무는 기분이 어때요? Cum te simți는 재귀 대명사 te("너 자신")를 써요. prima ta tură에서 소유어 ta는 여성 명사 tură에 맞춰요.
    language_code: ko
    direction: ltr
