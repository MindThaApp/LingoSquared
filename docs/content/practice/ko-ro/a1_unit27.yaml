      text: Nu-ți {item} griji.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: '걱정하지 마세요. Nu-ți face griji(직역: "너를 위해 걱정을 만들지 마")는 안심시킬 때 쓰는 기본 고정 표현이에요. 낯선 사람에게는 Nu vă faceți griji라고 해요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit27.lesson04.order.002
