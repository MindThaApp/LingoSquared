    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_prima
    hint:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_prima
  answer_derivation:
