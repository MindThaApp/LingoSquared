  lesson_content_key: ro.a1.unit63.lesson01.hai_sa_mergem_azi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_teatrul
        - w_popular
        - w_cortina
        - w_actorii
        - w_buni
        - w_piesa
        - w_călătoria
        - w_pauză
        - w_locuri
        - w_mulțumit
        - w_grozavi
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 단어는 이 단원의 단어예요. ''오늘 극장에 갈까요?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
