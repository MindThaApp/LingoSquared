  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_actorii
    - w_buni
    - w_cortina
    - w_călătoria
    - w_grozavi
    - w_locuri
    - w_mulțumit
    - w_pauză
    - w_piesa
    - w_popular
    - w_teatrul
templates:
