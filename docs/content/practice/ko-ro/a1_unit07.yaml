templates:
- content_key: practice.ko-ro.ro.a1.unit07.lesson01.choose.001
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Leu는 화폐 단위 하나이고 lei는 그 복수형이에요. costă는 가격을 묻거나 말할 때 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson01.listen.002
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scump는 '비싸다', ieftin은 '싸다'라는 뜻이에요. 둘 다 가격을 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson02.match.001
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Costă는 가격을 나타내는 동사이고, kilogram, piață, 음식 이름은 장볼 때 쓰는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson01.translate.003
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Costă는 '(그것이) 값이 나가다'를 뜻하는 형태예요. Cât costă?는 가격을 묻고 Costă opt lei는 가격을 답해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson01.order.004
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: word_order
  frame:
    text: Costă cinci {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: '2부터 19까지 뒤에서는 복수형 lei에 de가 붙지 않아요: opt lei. 20부터는 de가 나와요: treizeci de lei.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson01.fill.005
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: fill_in_blank
  frame:
    text: Cât {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cât costă?는 가격을 묻는 기본 질문이고, costă는 '그것'에 쓰는 동사 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson01.translate.006
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: translation
  frame:
    text: 8 lei예요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Lei는 leu의 복수형이고 숫자와 함께 써요: opt lei.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson02.choose.002
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vreau는 '원해요', unde는 '어디', pot는 Unde pot...?에서 '할 수 있어요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson02.listen.003
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cumpăr는 ''나는 사요''예요. pot와 함께 쓸 때는 să를 붙여요: pot să cumpăr, ''살 수 있어요''.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson02.translate.004
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vreau는 '원해요'처럼 직설적이고, aș dori는 무언가를 부탁할 때 쓰는 더 부드러운 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson02.order.005
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: word_order
  frame:
    text: Cât costă un {item} de roșii?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un {item} de roșii?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: '단위와 그 대상 사이에 루마니아어는 de를 넣어요: un kilogram de roșii.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson02.order.006
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: word_order
  frame:
    text: Unde pot să {item} roșii?
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să {item} roșii?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'pot 뒤에는 să와 두 번째 동사가 와요: pot să cumpăr, ''살 수 있어요''.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson02.fill.007
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: fill_in_blank
  frame:
    text: Vreau un kilogram de {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cartofi는 복수형이에요. un kilogram de 뒤에서도 재는 대상은 복수형으로 둬요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson02.translate.008
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: 토마토는 어디에서 살 수 있어요?
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să cumpăr {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Roșii는 복수형이라서 앞에 un이나 o가 오지 않아요. pot să cumpăr는 '살 수 있어요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson02.translate.009
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: 감자 1킬로그램을 원해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Vreau un kilogram de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un kilogram de 뒤에 복수형 cartofi를 붙이면 양과 대상을 함께 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit07.lesson02.translate.010
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: 토마토 1킬로그램은 얼마예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un kilogram de {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât costă는 가격을 묻고, 1킬로그램이므로 단수 costă가 맞아요.
    language_code: ko
    direction: ltr
