  lesson_content_key: ro.a1.unit45.lesson04.incendiu_la_cafeneaua_de
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 루마니아어 단어를 알맞은 한국어 뜻과 연결하세요. 단어는 이 단원의 수업에서 나온 것이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit45.lesson06.choose.001
