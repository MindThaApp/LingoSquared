    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 도움과 화재 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit45.lesson02.listen.001
