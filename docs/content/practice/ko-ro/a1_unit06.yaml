templates:
- content_key: practice.ko-ro.ro.a1.unit06.lesson01.choose.001
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Aș dori는 '~하고 싶어요'라는 뜻으로, 무언가를 정중하게 부탁할 때 써요. 어떤 음료가 와도 형태가 변하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson01.listen.002
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Apă, cafea, ceai, suc, lapte는 기본 음료예요. sete(갈증)는 Mi-e sete에서처럼 mi-e와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson01.match.003
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cafea와 apă는 여성 명사라서 o를 써요(o cafea). ceai와 suc는 중성 명사라서 un을 써요(un ceai).
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson01.translate.004
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aș dori는 '~하고 싶어요'라는 뜻이에요. 그 뒤에 음료를 말하고, 한 잔을 부탁할 때는 앞에 o나 un을 붙여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson01.order.005
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: word_order
  frame:
    text: Aș dori o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Cafea는 여성 명사라서 o를 써요: o cafea. 차 한 잔은 un ceai예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson01.fill.006
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: fill_in_blank
  frame:
    text: Aș dori un {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ceai에는 o가 아니라 un을 써요: un ceai. o cafea와 비교해 보세요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson01.translate.007
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: 커피 한 잔 주세요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aș dori는 공손한 표현이라 tu에게도 dumneavoastră에게도 똑같이 쓸 수 있어요. cafea에는 o를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson01.translate.008
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: 목말라요.
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi-e {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mi-e sete는 직역하면 '갈증이 나에게 있다'는 뜻이에요. Mi-e foame도 같은 방식이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson02.choose.001
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Foame는 '배고픔'이라는 뜻이에요. 배고프다고 할 때는 Mi-e sete처럼 Mi-e foame라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson02.listen.002
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mâncare는 음식 전반을 뜻하고, pâine, carne, pui, fructe는 구체적인 먹을거리예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson02.match.003
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Fructe는 복수형으로 '과일' 전반을 뜻해요. pâine, carne, mâncare는 단수이고 여성 명사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson02.translate.004
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mâncare는 음식을 두루 가리키는 말이고 carne는 고기, pui는 닭고기, fructe는 과일이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson02.order.005
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: word_order
  frame:
    text: Aș dori {item} și pui.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item} și pui.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: '여기서 빵에는 o나 un이 필요 없어요: Aș dori pâine și pui, Aș dori apă처럼요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson02.fill.006
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mi-e foame(배고파요)는 굳어진 표현이에요. 느낌을 나타내는 말이 mi-e 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson02.fill.007
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e foame. Aș dori {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pui는 닭고기를 뜻하고, 메뉴판이나 가게에서 쓰는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson02.translate.008
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: 차 한 잔 주세요. (격식체, dumneavoastră로 부르는 사람에게)
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori un ceai, vă {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă rog는 dumneavoastră에게 쓰는 공손한 '부탁드려요'예요. 친구에게는 te rog라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit06.lesson02.translate.009
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: 과일을 주세요.
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fructe는 복수형이라 앞에 o나 un을 쓰지 않아요.
    language_code: ko
    direction: ltr
