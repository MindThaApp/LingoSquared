    - w_ajunge
    - w_angajatul
    - w_bunica
    - w_bunici
    - w_colet
    - w_coletul
    - w_cumpără
    - w_dura
    - w_durează
    - w_grozav
    - w_scrie
    - w_scrisoare
    - w_scrisoarea
    - w_timbru
    - w_timbrul
    - w_zile
