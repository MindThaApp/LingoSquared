    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson02.order.004
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: word_order
  frame:
    text: Sunt {item}. Lucrez la școală.
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sunt {item}. Lucrez la școală.
