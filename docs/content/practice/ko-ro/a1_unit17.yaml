  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 직업 앞에는 '하나의'에 해당하는 단어가 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson01.translate.007
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: translation
  frame:
    text: 미하이는 사무실에서 일해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai {item} la birou.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Lucrează는 '그' 또는 '그녀'에 쓰기 때문에 Mihai에 어울려요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson01.translate.008
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: translation
  frame:
    text: 그는 사무실에서 일해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrează la {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 루마니아어는 동사형만으로 누구인지 알 수 있으면 '그'나 '그녀'를 자주 생략해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson02.choose.001
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
