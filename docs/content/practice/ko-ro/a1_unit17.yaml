      direction: ltr
  feedback_frame:
    text: 말하는 사람이 여성이라서 Profesoară는 -ă로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson02.order.005
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: word_order
  frame:
    text: Lucrez la {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrez la {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Școală는 여성 명사예요. lucrez la școală는 '저는 학교에서 일해요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson02.fill.006
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: fill_in_blank
  frame:
    text: Unde {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Lucrați는 격식을 갖춘 질문이에요: 어디에서 일하세요?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson02.translate.007
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: translation
  frame:
    text: 어디에서 일하세요? (dumneavoastră로 부르는 상대에게 하는 공손한 표현)
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Lucrați는 dumneavoastră와 함께 쓰고, 친구에게는 lucrezi라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson02.translate.008
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: translation
  frame:
    text: 저는 교사예요. (여성이 하는 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sunt {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Profesoară는 여성형 직업 명칭이에요. 앞에 따로 관사를 붙이지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson02.translate.009
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: translation
  frame:
    text: 저는 학교에서 일해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrez la {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Lucrez는 '나'에 해당하는 형태이고, la는 '~에서'라는 뜻이에요.
    language_code: ko
    direction: ltr
