    slot: item
  feedback_frame:
    text: Profesoară는 여성형이고, lucrați는 격식을 갖춘 '일하세요'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson02.listen.002
  lesson_content_key: ro.a1.unit17.lesson02.ana_este_profesoara
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lucrați는 dumneavoastră에 쓰는 형태로, 격식을 차려 대하는 사람에게 써요.
    language_code: ko
    direction: ltr
