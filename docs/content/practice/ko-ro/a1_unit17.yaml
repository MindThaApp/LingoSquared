templates:
- content_key: practice.ko-ro.ro.a1.unit17.lesson01.choose.001
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lucrează는 '그' 또는 '그녀'에 쓰는 형태예요. Mihai lucrează la birou.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson01.listen.002
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Inginer는 남성 명사이고 birou는 중성 명사예요. 둘 다 단수에서는 un을 붙여요: un inginer, un birou.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson01.order.003
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: word_order
  frame:
    text: Mihai este {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: '직업을 말할 때 루마니아어는 관사를 쓰지 않아요: Mihai este inginer.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson01.order.004
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: word_order
  frame:
    text: Lucrează la {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrează la {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: La는 '~에서'라는 뜻이고, 여기서 birou는 관사 없이 그 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson01.fill.005
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: fill_in_blank
  frame:
    text: Mihai {item} la birou. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lucrează는 '일하다'의 '그/그녀' 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-ro.ro.a1.unit17.lesson01.translate.006
  lesson_content_key: ro.a1.unit17.lesson01.mihai_este_inginer
  type: translation
  frame:
