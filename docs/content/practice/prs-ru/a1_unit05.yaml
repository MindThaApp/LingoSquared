templates:
- content_key: practice.prs-ru.ru.a1.unit05.lesson01.choose.001
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Который час? معنی تحت‌اللفظی «کدام ساعت» را دارد و Сейчас یعنی «حالا»؛ این دو با هم جوره معمول سوال و جواب برای ساعت اند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson01.listen.002
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'شکل اسم بعد از عدد به آن بستگی دارد: час بعد از ۱، часа بعد از ۲ تا ۴، و часов بعد از ۵ به بعد.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson01.order.003
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: word_order
  frame:
    text: Сейчас три {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Сейчас три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بعد از ۲، ۳ و ۴ اسم شکل часа را می‌گیرد، مثل два часа و три часа.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson01.fill.004
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: fill_in_blank
  frame:
    text: Сейчас десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'از پنج به بعد اسم شکل جمع اضافی часов را می‌گیرد: пять часов، десять часов.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson01.translate.005
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: translation
  frame:
    text: ساعت چند است؟
    language_code: prs
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Который {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Который час? معنی تحت‌اللفظی «کدام ساعت» را دارد؛ طرز معمول پرسیدن ساعت است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson03.translate.001
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'در روسی اغلب سوال با کلمهٔ پرسشی شروع می‌شود و بعد فعل می‌آید: Когда отходит поезд?'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson02.choose.001
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Утром، днём، вечером و ночью قید استند که به -ом، -ём یا -ью ختم می‌شوند و بدون حرف اضافه استفاده می‌شوند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson02.match.002
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'وقت‌های روز در روسی قید اند: утром، днём، вечером، ночью.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson02.order.003
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: word_order
  frame:
    text: В два часа {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بعد از ساعت، дня یعنی بعد از ظهر، همان‌طور که утра یعنی صبح و вечера یعنی شام.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson02.fill.004
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: fill_in_blank
  frame:
    text: В котором {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В котором часу? سوال برای وقت اتفاق افتادن یک کار است، نه ساعت حالا.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson02.translate.005
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: کلمه‌های وقت مثل утром و вечером در روسی بدون حرف اضافه به تنهایی می‌آیند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson02.translate.006
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: ساعت هفت شام.
    language_code: prs
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: В семь часов {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'بعد از ساعت، وقت روز به حالت اضافی می‌رود: семь часов вечера.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson03.listen.002
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Скажите, пожалуйста طرز مؤدبانهٔ شروع سوال از یک آدم ناآشنا است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson03.order.003
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Скажите, {item}, который час?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Скажите, {item}, который час?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Скажите امر مؤدبانهٔ «вы» به معنی «بگویین» است و пожалуйста درخواست را نرم می‌سازد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson03.order.004
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Когда {item} поезд?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда {item} поезд?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отходит شکل سوم شخص مفرد فعل است، پس با поезд مفرد جور می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson03.fill.005
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: fill_in_blank
  frame:
    text: Поезд отходит в восемь часов {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بعد از ساعت، утра یعنی صبح، پس восемь часов утра یعنی ساعت هشت صبح.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson03.translate.006
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: قطار کی حرکت می‌کند؟
    language_code: prs
    direction: rtl
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда отходит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Когда می‌پرسد «کی»، و فعل отходит با поезд که مفرد است مطابقت دارد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit05.lesson03.translate.007
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: ساعت دو بعد از چاشت.
    language_code: prs
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дня برای ساعت‌های بعد از چاشت استفاده می‌شود، و утра و вечера برای صبح و شام.
    language_code: prs
    direction: rtl
