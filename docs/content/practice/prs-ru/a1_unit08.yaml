  answer_derivation:
    kind: render_frame
    frame:
      text: Хлеб стоит {item} рублей.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сто به کلمهٔ دیگری نیاز ندارد؛ اسم بعد از آن рублей است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit08.lesson02.choose.001
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: multiple_choice
  frame:
