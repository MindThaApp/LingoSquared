      direction: ltr
  feedback_frame:
    text: Дайте полкило, пожалуйста روش مؤدبانه برای خواستن نیم کیلو از فروشنده است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit08.lesson02.translate.006
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: لطفاً پنج دانه بتین. (محترمانه)
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте пять {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
