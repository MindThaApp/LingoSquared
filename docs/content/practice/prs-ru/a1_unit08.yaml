  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Сто و двести عددهای ۱۰۰ و ۲۰۰ اند؛ اسمی که بعد از آن‌ها می‌آید به حالت اضافی جمع است: сто рублей، двести рублей.'
