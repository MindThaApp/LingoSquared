    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit08.lesson02.translate.005
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: لطفاً نیم کیلو بتین. (محترمانه)
    language_code: prs
    direction: rtl
