  feedback_frame:
    text: Сколько стоит? قیمت یک جنس را می‌پرسد؛ молоко اسم مفرد است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit08.lesson01.fill.003
