    frame:
      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Килограмм و полкило هر دو مقدار جنس را نشان می‌دهند و مستقیم بعد از дайте می‌آیند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit08.lesson02.fill.003
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
