  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Дайте فرمان مؤدبانهٔ «вы» است و یعنی «به من بتین»؛ با «ты» دай می‌شود.
    language_code: prs
    direction: rtl
