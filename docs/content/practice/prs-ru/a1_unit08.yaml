    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit08.lesson02.translate.007
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Штука جنس‌ها را دانه‌دانه می‌شمارد، اما килограмм و полкило با وزن می‌شمارند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit08.lesson03.listen.001
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Помидоры، огурцы و апельсины جمع اند؛ картофель و капуста کلمه‌های مفرد اند و یعنی کچالو و کلم.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit08.lesson03.order.002
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: word_order
  frame:
    text: У вас есть {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У вас есть ...? با هر اسمی کار می‌کند و روش معمولی پرسیدن از فروشنده است که فلان چیز را دارد یا نه.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit08.lesson03.fill.003
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько стоит кило {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بعد از کلمهٔ مقدار مثل кило، جنس به حالت اضافی جمع می‌آید، پس яблоки به яблок تبدیل می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit08.lesson03.translate.004
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: لطفاً یک کیلوگرام بادرنگ‌رومی بتین. (محترمانه)
    language_code: prs
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте килограмм {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'بعد از килограмм جنس به حالت اضافی جمع می‌آید: помидоры به помидоров تبدیل می‌شود.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit08.lesson03.translate.005
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: کلم دارید؟ (محترمانه)
    language_code: prs
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
