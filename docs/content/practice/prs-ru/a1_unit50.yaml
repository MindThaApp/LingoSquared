schema_version: '1.0'
pack_key: practice.prs-ru.a1.unit50
source_language: prs
target_language: ru
unit_content_key: ru.a1.unit50.museum
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dari (Afghanistan)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_большой
    - w_выставка
    - w_гид
    - w_закрываться
    - w_зал
    - w_картина
    - w_картины
    - w_концерт
    - w_осматриваю
    - w_открыто
    - w_посетить
templates:
- content_key: practice.prs-ru.ru.a1.unit50.lesson01.choose.001
  lesson_content_key: ru.a1.unit50.lesson01.ya_khochu_poyti_v
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_посетить
        - w_выставка
        - w_осматриваю
        - w_закрываться
        - w_гид
        - w_зал
        - w_большой
        - w_картина
        - w_открыто
        - w_картины
        - w_концерт
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این درس است، از بخش «می‌خواهم به موزیم بروم».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit50.lesson02.listen.001
  lesson_content_key: ru.a1.unit50.lesson02.ya_khochu_kupit_bilet
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس «می‌خواهم تکت بخرم».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit50.lesson03.translate.001
  lesson_content_key: ru.a1.unit50.lesson03.vo_skolko_zakryvaetsya_muzey
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این درس است، از بخش «موزیم کی بسته می‌شود؟».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit50.lesson04.match.001
  lesson_content_key: ru.a1.unit50.lesson04.v_muzee
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر کلمهٔ روسی را با معنای دری‌اش وصل کنید؛ کلمه‌ها از درس‌های همین بخش‌اند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit50.lesson05.choose.001
  lesson_content_key: ru.a1.unit50.lesson05.chitaem_tablichku
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این درس است، از بخش «خواندن تختهٔ معلومات».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit50.lesson06.translate.001
  lesson_content_key: ru.a1.unit50.lesson06.dima_nina_i_nastya
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
