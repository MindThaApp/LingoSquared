  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این واحد است، از درس دیما، نینا و ناستیا در موزیم.'
    language_code: prs
    direction: rtl
