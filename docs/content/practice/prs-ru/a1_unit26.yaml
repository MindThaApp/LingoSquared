- content_key: practice.prs-ru.ru.a1.unit26.lesson01.order.002
  lesson_content_key: ru.a1.unit26.lesson01.vysokiy_nevysokiy_staryy_i
  type: word_order
  frame:
    text: Лена высокая, а Игорь {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_невысокий
  answer_derivation:
    kind: render_frame
    frame:
      text: Лена высокая, а Игорь {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'لینا قدبلند است و ایگور قدکوتاه. دو جمله با «а» (در حالی که؛ و) پهلوی هم گذاشته می‌شوند: Лена высокая, а Игорь невысокий.'
    language_code: prs
    direction: rtl
