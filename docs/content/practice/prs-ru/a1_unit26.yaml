    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر کلمهٔ روسی را با معنای دری‌اش وصل کنید؛ کلمه‌ها از درس‌های همین بخش‌اند.
    language_code: prs
    direction: rtl
