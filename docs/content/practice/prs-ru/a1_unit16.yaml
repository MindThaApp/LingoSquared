    slot: item
  feedback_frame:
    text: Мне плохо یعنی حالم عمومی خراب است؛ мне یعنی «برای من».
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit16.lesson02.order.002
