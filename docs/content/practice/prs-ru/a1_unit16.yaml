      language_code: ru
      direction: ltr
  feedback_frame:
    text: Живот مذکر است، اما болит تغییر نمی‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit16.lesson01.translate.005
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
