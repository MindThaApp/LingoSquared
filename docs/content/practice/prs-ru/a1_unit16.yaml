  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: болит تغییر نمی‌کند، چه عضو بدن مؤنث باشد، چه مذکر و چه خنثی.
    language_code: prs
    direction: rtl
