  feedback_frame:
    text: در روسی می‌گویند «نزد من سر درد می‌کند»، نه «من سردرد دارم».
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit16.lesson01.translate.004
