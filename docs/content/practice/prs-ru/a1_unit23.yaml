templates:
- content_key: practice.prs-ru.ru.a1.unit23.lesson01.choose.001
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Алло همان چیزی است که روس‌ها با آن تلفون را جواب می‌دهند یا صحبت را شروع می‌کنند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit23.lesson01.order.002
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: word_order
  frame:
    text: Пожалуйста, {item} медленно.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Пожалуйста, {item} медленно.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Говори شکل دوستانه (ты) است؛ شکل مؤدبانه говорите می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit23.lesson01.fill.003
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: fill_in_blank
  frame:
    text: Говори {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Медленно قید است و تغییر نمی‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit23.lesson01.translate.005
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: translation
  frame:
    text: لطفاً آهسته صحبت کن. (دوستانه)
    language_code: prs
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Говори {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Медленно یعنی «آهسته» و فقط یک شکل دارد.
    language_code: prs
    direction: rtl
