  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_администратор
    - w_бронь
    - w_были
    - w_включён
    - w_вкусный
    - w_выезд
    - w_двенадцать
    - w_забронирован
    - w_забронировать
    - w_завтрак
    - w_заселиться
    - w_заселяемся
    - w_карточке
    - w_ключ
    - w_красивый
    - w_начинается
    - w_ночей
    - w_ночь
    - w_одна
    - w_одну
    - w_пароль
    - w_прекрасные
    - w_прошли
    - w_следующий
    - w_цену
