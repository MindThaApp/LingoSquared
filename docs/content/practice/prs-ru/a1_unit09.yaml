    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Банк و ресторан به کلمه‌های «بانک» و «رستورنت» شباهت دارند، و аптека هم به کلمهٔ «اپوتیک» ربط دارد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson02.order.004
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: word_order
  frame:
    text: Где находится {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Где находится ...? با هر اسم مفردِ جا کار می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson02.fill.005
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: fill_in_blank
  frame:
