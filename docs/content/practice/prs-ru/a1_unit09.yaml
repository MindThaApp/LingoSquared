  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Банк، вокзал و ресторан مذکر استند؛ аптека، гостиница و библиотека مؤنث استند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson02.listen.002
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: نام این جاها اسم استند، و در Где находится банк? به هیچ کلمهٔ اضافی ضرورت نیست.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson02.match.003
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
