templates:
- content_key: practice.prs-ru.ru.a1.unit09.lesson01.choose.001
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: «Где» یعنی «کجا» و «находится» یعنی «موقعیت دارد»؛ با هم دربارهٔ جای یک مکان می‌پرسند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson01.order.002
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: word_order
  frame:
    text: Где {item} магазин?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Где {item} магазин?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Находится» شکل فعل برای او (سوم شخص مفرد) است، پس با اسم مفرد مثل «магазин» می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson01.fill.003
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: fill_in_blank
  frame:
    text: Магазин на Тверской {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بعد از «на» به معنی «در/بالای»، «улица» برای نشان دادن جای چیزی به «улице» تغییر می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson01.translate.004
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: translation
  frame:
    text: دواخانه کجا موقعیت دارد؟
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Где находится ...?» راه معیاری پرسیدن جای یک مکان است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson01.translate.005
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Где یعنی کجا، و улица یعنی کوچه.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson02.choose.001
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
