    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'وقتی کوچه به نام یک شخص باشد، نام او در حالت اضافی (genitive) می‌آید: улица Пушкина یعنی کوچهٔ پوشکین.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson02.translate.006
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: translation
  frame:
    text: هوتل کجاست؟
    language_code: prs
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Гостиница اسم مؤنث است و معنایش هوتل است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson03.choose.001
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Вашей و моей شکل‌های مؤنثِ ваш و мой استند که بعد از на می‌آیند: на вашей улице، на моей улице.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson03.order.002
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: word_order
  frame:
    text: Что есть на {item} улице?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вашей با улице که مؤنث است مطابقت دارد؛ این سوالِ رسمی با вы است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson03.fill.003
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: fill_in_blank
  frame:
    text: На {item} улице есть банк. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Моей شکلِ моя بعد از на است، چون улица مؤنث است و در حالت prepositional قرار دارد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson03.fill.004
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: fill_in_blank
  frame:
    text: Спасибо {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Спасибо большое راه گرم و صمیمی برای گفتن «بسیار تشکر» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson03.translate.005
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: در کوچهٔ شما چی هست؟ (رسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что есть на вашей улице? می‌پرسد در کوچه چی وجود دارد؛ شکل вашей از вы آن را مؤدبانه نگه می‌دارد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson03.translate.006
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: بسیار تشکر.
    language_code: prs
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Спасибо {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Большое با спасибо که خنثی است مطابقت دارد، به همین خاطر به -ое ختم می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit09.lesson03.translate.007
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: در کوچهٔ من یک بانک است.
    language_code: prs
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} улице есть банк.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня есть برای داشتن است؛ برای چیزی که در یک کوچه موقعیت دارد، روسی На моей улице есть می‌گوید.
    language_code: prs
    direction: rtl
