- content_key: practice.prs-ru.ru.a1.unit15.lesson01.choose.001
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Лучше یعنی بهتر و хуже یعنی بدتر؛ чем یعنی «از» در مقایسه و بعد از کامه، پس از صفت تفضیلی می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit15.lesson01.order.002
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: word_order
  frame:
    text: Кофе {item}, чем чай.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Кофе {item}, чем чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: در روسی، در مقایسه پیش از чем کامه گذاشته می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit15.lesson01.fill.003
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: fill_in_blank
  frame:
    text: Чай {item}, чем кофе. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хуже ضد лучше است؛ بعد از آن чем چیزی را که با آن مقایسه می‌شود معرفی می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit15.lesson01.translate.004
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: قهوه از چای بهتر است.
    language_code: prs
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Кофе {item}, чем чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'در روسی «است» گفته نمی‌شود: Кофе лучше فقط دو چیز را پهلوی هم می‌گذارد.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit15.lesson01.translate.005
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
