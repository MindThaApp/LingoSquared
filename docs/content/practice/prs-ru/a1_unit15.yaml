    frame:
      text: Это кафе {item}, чем то.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кафе خنثی است و هیچ‌وقت تغییر نمی‌کند، پس با это و то می‌آید.
    language_code: prs
    direction: rtl
