templates:
- content_key: practice.prs-ru.ru.a1.unit12.lesson01.choose.001
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Давай راه غیررسمی (با ты) برای پیشنهاد دادن یک کار است؛ با вы می‌شود давайте.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson01.order.002
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: word_order
  frame:
    text: Давай пойдём в {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай пойдём в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кино هیچ‌وقت آخرش تغییر نمی‌کند، پس بعد از в هم кино می‌ماند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson01.fill.003
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: fill_in_blank
  frame:
    text: Давай {item} в кино. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Давай همراه با пойдём یک برنامه را پیشنهاد می‌کند: بیا برویم.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson01.translate.004
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: بیا فردا به سینما برویم. (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай {item} в кино завтра.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Давай пойдём دعوت دوستانه با ты است، یعنی «بیا برویم».
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson01.translate.005
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: بیا روز شنبه به سینما برویم. (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай пойдём в кино в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'برای «روز ...» با نام روزهای هفته، روسی в و حالت مفعولی (accusative) را به کار می‌برد: суббота می‌شود субботу.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson01.translate.006
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Кино تغییر نمی‌کند، و давай یعنی «بیا» در حالت غیررسمی.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson02.choose.001
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Согласен آخرش صامت است چون گوینده مرد است؛ زن می‌گوید согласна.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson02.fill.002
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: fill_in_blank
  frame:
    text: К {item}, я не могу. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: К сожалению شکل معمول «متأسفانه» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson02.fill.003
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: fill_in_blank
  frame:
    text: Во сколько мы {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Встретимся شکل «ما» است، پس با мы می‌آید: мы встретимся.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson02.order.004
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: word_order
  frame:
    text: К сожалению, я не {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: К сожалению, я не {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не فعل را منفی می‌کند، و могу شکل «من» به معنی «می‌توانم» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson02.translate.005
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: translation
  frame:
    text: خوب است، موافقم. (مرد می‌گوید)
    language_code: prs
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Хорошо, я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Согласен شکل مذکر است؛ زن می‌گوید согласна.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson02.translate.006
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: translation
  frame:
    text: ساعت چند همدیگر را ببینیم؟
    language_code: prs
    direction: rtl
  slots:
    a: *id011
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Во сколько {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Во сколько در اصل یعنی «به چند»، و معنی‌اش «ساعت چند» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson03.listen.001
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: نام‌های کوچک روسی شکل‌های کوتاه و دوستانه دارند، مثل Настя و Дима، که بین دوستان به کار می‌روند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson03.order.002
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: word_order
  frame:
    text: Давай в семь часов, у {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай в семь часов, у {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'У یعنی «پیش» یا «نزدیک» و حالت اضافی (genitive) می‌خواهد: кинотеатр می‌شود кинотеатра.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson03.fill.003
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: fill_in_blank
  frame:
    text: Отлично, до {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: До یعنی «تا» و حالت اضافی (genitive) می‌خواهد، پس суббота می‌شود субботы.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson03.translate.004
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: عالی، تا روز شنبه.
    language_code: prs
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Отлично, до {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До субботы در اصل یعنی «تا شنبه» و راه دوستانه برای گفتن «آن وقت می‌بینمت» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson03.translate.005
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: بیا ساعت هفت، پیش سینما. (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай в семь часов, у {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Давай в семь часов وقت را پیشنهاد می‌کند؛ у кинотеатра جا را اضافه می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ru.ru.a1.unit12.lesson03.translate.006
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Отлично قید است و یعنی «عالی»؛ برای جنسیت یا جمع تغییر نمی‌کند.
    language_code: prs
    direction: rtl
