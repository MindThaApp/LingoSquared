templates:
- content_key: practice.nl-it.it.a1.unit09.lesson01.choose.001
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La farmacia, la banca en la stazione zijn vrouwelijk; l'ufficio postale is mannelijk met een weggelaten klinker in het lidwoord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit09.lesson01.listen.002
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Via kan 'straat' of 'weg' betekenen en komt voor in namen zoals Via Roma.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit09.lesson01.order.003
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: word_order
  frame:
    text: Scusi, dov'è la {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dov'è la plus een vrouwelijk zelfstandig naamwoord vraagt waar een plek is; scusi is het beleefde 'pardon'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit09.lesson01.fill.004
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: fill_in_blank
  frame:
    text: È qui {item}, in Via Roma. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Qui vicino betekent 'vlakbij', hier in de buurt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit09.lesson01.match.005
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Vicino betekent 'dichtbij'; qui vicino betekent 'hier vlakbij'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit09.lesson01.translate.006
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: Pardon, waar is de apotheek? (beleefd)
    language_code: nl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi is de beleefde gebiedende wijs, geschikt voor een onbekende.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit09.lesson01.translate.007
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Il of la hangt af van het geslacht, maar voor een klinker gebruik je l'': l''ufficio.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit09.lesson02.choose.001
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: C'è vraagt of zegt dat iets bestaat; ce n'è antwoordt met een van die dingen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit09.lesson02.listen.002
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ce n''è una betekent ''er is er een'': ne staat voor ''ervan''.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit09.lesson02.fill.003
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: C'è una {item} qui vicino? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: C'è una banca? vraagt of er hier in de buurt een bank is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit09.lesson02.order.004
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: word_order
  frame:
    text: Sì, {item} una qui vicino.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, {item} una qui vicino.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ce n'è una beantwoordt een vraag met c'è una ... door te zeggen dat er een is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit09.lesson02.fill.005
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: È {item} alla stazione. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Accanto alla betekent 'naast de/het'; alla is a plus la.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit09.lesson02.fill.006
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: Sì, ce n'è una qui vicino, accanto {item} stazione. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alla is a en la samen, voor een vrouwelijk zelfstandig naamwoord.
    language_code: nl
    direction: ltr
