    kind: render_frame
    frame:
      text: Sono {item} al cinema ieri.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Bij sono komt de voltooide vorm overeen met de spreker: andato voor een man, andata voor een vrouw.'
    language_code: nl
    direction: ltr
