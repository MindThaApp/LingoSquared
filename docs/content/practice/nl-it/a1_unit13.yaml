  feedback_frame:
    text: Andata gebruikt een vrouw, andato een man.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit13.lesson01.order.003
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: word_order
  frame:
    text: Sono {item} al cinema ieri.
    language_code: it
    direction: ltr
  slots:
    item: *id003
