  frame:
    text: Ik wil graag een koffie en een croissant, alstublieft.
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un cornetto, per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un hoort bij mannelijke woorden zoals caffè en cornetto; per favore sluit het verzoek af.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit07.lesson01.translate.006
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: Wat wilt u? (formeel, Lei)
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Desidera is de formele Lei-vorm die een ober gebruikt, niet de informele tu-vorm.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit07.lesson03.choose.001
  lesson_content_key: it.a1.unit07.lesson03.il_conto
