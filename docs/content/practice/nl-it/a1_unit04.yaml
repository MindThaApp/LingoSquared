      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Oggi betekent vandaag; domani betekent morgen, en dezelfde vraag werkt voor beide.
    language_code: nl
    direction: ltr
