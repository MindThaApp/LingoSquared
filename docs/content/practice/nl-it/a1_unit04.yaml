    language_code: nl
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi è {day}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Italiaans laat bij een dag van de week op deze manier het lidwoord weg: Oggi è lunedì, niet Oggi è il lunedì.'
