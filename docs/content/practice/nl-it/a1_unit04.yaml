    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Maandag tot en met vrijdag eindigen op -dì, van dies, dag; sabato en domenica niet.
    language_code: nl
    direction: ltr
