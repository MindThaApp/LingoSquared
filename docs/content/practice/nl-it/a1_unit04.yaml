    language_code: nl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Arrivo giovedì {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Italiaans heeft geen voorzetsel nodig voor een dag van de week: arrivo giovedì, ik kom donderdag aan.'
    language_code: nl
    direction: ltr
