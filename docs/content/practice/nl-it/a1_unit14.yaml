templates:
- content_key: practice.nl-it.it.a1.unit14.lesson01.choose.001
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Preferisco is de ik-vorm en preferisci is de informele jij-vorm van preferire.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson01.listen.002
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Preferisco en preferisci verschillen alleen in de laatste klinker.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson01.order.003
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: word_order
  frame:
    text: Preferisci il caffè o il {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Preferisci il caffè o il {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Tè heeft een accent om het te onderscheiden van te, 'jou'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson01.fill.004
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: fill_in_blank
  frame:
    text: Io {item} il caffè. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Preferisco eindigt op -o omdat het onderwerp 'ik' is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson01.translate.005
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: translation
  frame:
    text: Heb je liever koffie of thee? (informeel, tu)
    language_code: nl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Preferisci il caffè o il {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Preferisci is de informele tu-vorm van het werkwoord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson03.translate.001
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: translation
  frame:
    text: Ik heb ook liever koffie!
    language_code: nl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Anch'io {item} il caffè!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Anch'io betekent 'ik ook' en preferisco is de ik-vorm.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson03.match.002
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Tè is thee; te is een voornaamwoord dat na een voorzetsel wordt gebruikt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson03.choose.003
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Piace wordt gebruikt in mi piace, wat 'ik vind het lekker' of 'ik vind het leuk' betekent.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson02.listen.001
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mi piace molto betekent 'ik vind het heel lekker' of 'ik vind het heel leuk'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson02.order.002
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: word_order
  frame:
    text: Mi {item} molto il cornetto.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi {item} molto il cornetto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Piace past zich aan het ding aan dat bevalt, en dat is hier enkelvoud.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson02.fill.003
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: fill_in_blank
  frame:
    text: E a {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A te betekent 'aan jou' en is de informele manier om hetzelfde terug te vragen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson02.translate.004
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: translation
  frame:
    text: Ik vind de croissant erg lekker.
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi {item} molto il cornetto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Mi piace molto betekent ''ik vind het heel lekker''; letterlijk: ''het bevalt me erg''.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson02.translate.005
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: translation
  frame:
    text: En jij? (informeel, als tegenvraag nadat je hebt gezegd dat je iets lekker vindt)
    language_code: nl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: E a {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Na een voorzetsel zoals a wordt tu te: a te, ''aan jou''.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson03.fill.004
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: fill_in_blank
  frame:
    text: A {item} no, preferisco il tè. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A me betekent 'aan mij'; na een voorzetsel wordt io me.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson03.translate.005
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: translation
  frame:
    text: Ik niet, ik heb liever thee.
    language_code: nl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: A {item} no, preferisco il tè.
      language_code: it
      direction: ltr
  feedback_frame:
    text: A me no betekent 'ik niet'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit14.lesson01.translate.006
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Preferire betekent 'de voorkeur geven aan'; preferisco betekent 'ik geef de voorkeur aan'.
    language_code: nl
    direction: ltr
