schema_version: '1.0'
pack_key: practice.nl-it.a1.unit65
source_language: nl
target_language: it
unit_content_key: it.a1.unit65.cinema
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dutch). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_avvincente
    - w_bambini
    - w_guardare
    - w_iniziare
    - w_nuovo
    - w_popcorn
    - w_spettacolo
    - w_vedere
templates:
- content_key: practice.nl-it.it.a1.unit65.lesson01.choose.001
  lesson_content_key: it.a1.unit65.lesson01.voglio_guardare_un_film
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_guardare
        - w_vedere
        - w_spettacolo
        - w_iniziare
        - w_nuovo
        - w_popcorn
        - w_bambini
        - w_avvincente
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over ik wil een film kijken.'
    language_code: nl
    direction: ltr
