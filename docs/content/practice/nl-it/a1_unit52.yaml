        - w_preparo
        - w_assaggiare
        - w_assaggia
        - w_entra
        - w_tagliamo
        - w_assaggi
        - w_cucinano
        - w_frigge
        - w_prepara
        - w_pronta
        - w_prepari
        - w_prepariamo
        - w_buonissima
        - w_appetito
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} hoort bij de woorden van deze unit, uit de les over de ui, de tomaat en snijden.'
    language_code: nl
    direction: ltr
