  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: word_order
  frame:
    text: Va bene, lo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Prendo is de ik-vorm van prendere, 'nemen', hier gebruikt om een prijs te accepteren.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson03.translate.006
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: translation
  frame:
    text: Goed, ik neem het.
    language_code: nl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Va bene, lo prendo is de standaardmanier om een aankoop af te ronden.
    language_code: nl
    direction: ltr
