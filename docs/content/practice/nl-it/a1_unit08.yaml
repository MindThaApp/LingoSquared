templates:
- content_key: practice.nl-it.it.a1.unit08.lesson01.choose.001
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mele is het meervoud van mela: vrouwelijke woorden op -a krijgen in het meervoud -e.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson01.listen.002
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mele, banane en patate zijn vrouwelijk meervoud en krijgen le; pomodori is mannelijk meervoud en krijgt i.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson01.order.003
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: word_order
  frame:
    text: Quanto costano le {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costano le {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Le hoort bij vrouwelijke meervoudswoorden, en costano is de meervoudsvorm van het werkwoord, omdat er meerdere dingen een prijs hebben.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson01.order.004
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: word_order
  frame:
    text: Quanto costano i {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costano i {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Pomodori is mannelijk meervoud, dus het krijgt i, niet le.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson01.fill.005
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: fill_in_blank
  frame:
    text: Costano tre euro al {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al chilo betekent 'per kilo', de gebruikelijke manier om de prijs van groente en fruit aan te geven.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson01.fill.006
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: fill_in_blank
  frame:
    text: Quanto {item} le mele? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mele is meervoud, dus het werkwoord is costano, niet costa.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson03.match.001
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
