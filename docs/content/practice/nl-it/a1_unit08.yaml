    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: In Italiaanse winkels wordt fruit en groente per kilo geprijsd.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson01.translate.007
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: Hoeveel kosten de appels?
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto {item} le mele?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Bij een meervoud hoort costano: quanto costano le mele.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson01.translate.008
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: Ze kosten drie euro per kilo.
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costano tre euro al {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Na een getal blijft euro in het Italiaans onveranderd: tre euro.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson01.translate.009
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: Ik wil graag een kilo appels, alsjeblieft.
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un {item} di mele, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Di verbindt een hoeveelheid met het product: un chilo di mele.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson01.translate.010
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mele, banane, pomodori en patate staan hier in het meervoud, omdat klanten ze per kilo kopen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson03.choose.002
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lo prendo betekent 'ik neem het'; lo verwijst naar een mannelijk woord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson03.listen.003
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Va bene is een heel gebruikelijke manier om 'oké' te zeggen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit08.lesson03.fill.004
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: fill_in_blank
  frame:
    text: Va bene, {item} prendo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Lo betekent ''het'' en staat voor het werkwoord: lo prendo.'
    language_code: nl
    direction: ltr
