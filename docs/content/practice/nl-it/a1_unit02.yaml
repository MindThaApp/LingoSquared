templates:
- content_key: practice.nl-it.it.a1.unit02.lesson01.choose.001
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Nationaliteiten veranderen met de spreker: americano voor een man, americana voor een vrouw; italiano en italiana werken hetzelfde.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson01.order.002
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: word_order
  frame:
    text: Di {item} sei?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? vraagt een vriend waar hij vandaan komt; tegen een vreemde zeg je Di dov'è, Lei?
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson01.fill.003
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: fill_in_blank
  frame:
    text: Sono italiana, di {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Italiaanse plaatsnamen verschillen vaak van de Nederlandse: Milano is Milaan.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson01.match.004
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'De uitgang toont het geslacht: -o voor een man (americano), -a voor een vrouw (americana).'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson01.translate.005
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'In het Italiaans schrijf je nationaliteiten en talen niet met een hoofdletter: italiano, inglese.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson01.translate.006
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: Waar kom je vandaan? (informeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? is de tu-vraag; de beleefde Lei-versie is Di dov'è, Lei?
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson02.choose.001
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'De werkwoordsuitgang laat zien wie de handeling doet: parlo is ik spreek, parli is jij spreekt, parla is u spreekt of hij/zij spreekt.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson02.listen.002
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Parli en parla klinken bijna hetzelfde: de laatste klinker vertelt of het tu (-i) of Lei (-a) is.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson02.order.003
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: word_order
  frame:
    text: Parlo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parlo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Na parlare heeft de taal meestal geen lidwoord nodig: parlo inglese, parlo italiano.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson02.fill.004
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: fill_in_blank
  frame:
    text: Da {item} studi? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Da quanto studi? vraagt hoelang je al leert; het Italiaans gebruikt hiervoor de tegenwoordige tijd met da (al, sinds).
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson02.translate.005
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: translation
  frame:
    text: Spreek je Engels?
    language_code: nl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Parli {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Parli is de tu-vorm; tegen een vreemde gebruik je de Lei-vorm, Parla inglese?
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson03.choose.001
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Fai en fa zijn allebei vormen van fare: fai hoort bij tu, fa bij Lei of hij/zij.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson03.listen.002
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ingegnere heeft de klemtoon op de voorlaatste lettergreep: in-ge-GNE-re.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson03.order.003
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: word_order
  frame:
    text: Che {item} fai?
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} fai?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che lavoro fai? vraagt letterlijk welk werk je doet; de beleefde versie is Che lavoro fa, Lei?
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson03.fill.004
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: fill_in_blank
  frame:
    text: Che lavoro {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fai is de tu-vorm van fare; bij Lei wordt het fa.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson03.match.005
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Che is een flexibel woord: hier betekent het ''wat voor'' in Che lavoro fai? en ook ''wat'' in Che bello!'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson03.translate.006
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Per betekent ''voor'': per lavoro is voor werk, per due anni is voor twee jaar.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit02.lesson03.translate.007
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: translation
  frame:
    text: Ik ben hier voor mijn werk.
    language_code: nl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono qui per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Het Italiaans gebruikt hier per zonder lidwoord: per lavoro, voor werk.'
    language_code: nl
    direction: ltr
