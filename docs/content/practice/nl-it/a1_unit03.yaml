templates:
- content_key: practice.nl-it.it.a1.unit03.lesson01.choose.001
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Uno is het telwoord; voor een mannelijk zelfstandig naamwoord wordt het un, voor een vrouwelijk zelfstandig naamwoord una.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson01.listen.002
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sette en otto hebben allebei een dubbele t; houd die iets langer aan.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson01.order.003
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: word_order
  frame:
    text: Ho {age} anni.
    language_code: it
    direction: ltr
  slots:
    age: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho {age} anni.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'In het Italiaans geef je je leeftijd aan met avere, ''hebben'': ho cinque anni betekent letterlijk ''ik heb vijf jaren''.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson01.fill.004
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: fill_in_blank
  frame:
    text: Quanti anni {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hai is de tu-vorm van avere; met Lei is de vraag Quanti anni ha?
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson01.match.005
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Nul tot en met tien zijn de basis; de getallen vanaf elf en de tientallen worden later daaruit opgebouwd.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson01.translate.006
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: translation
  frame:
    text: Ik ben {age} jaar oud.
    language_code: nl
    direction: ltr
    slot_rendering:
      age: english_gloss
  slots:
    age: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho {age} anni.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Gebruik sono nooit voor leeftijd: Ho dieci anni, niet Sono dieci anni.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson02.choose.001
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ne verwijst naar ''ervan'' of ''ervan, van die dingen'': Ne vorrei tre betekent ''ik wil er graag drie''.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson02.listen.002
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Caffè heeft de klemtoon op de laatste lettergreep, aangegeven door het accent.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson02.order.003
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: word_order
  frame:
    text: Quanto costa un {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costa un {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Costa is enkelvoud, dus het hoort bij één product: Quanto costa un cornetto? Bij meer producten zeg je costano.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson02.fill.004
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: fill_in_blank
  frame:
    text: Ne {item} tre, grazie. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vorrei is de beleefde manier om iets te bestellen of te vragen, zachter dan 'ik wil'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson02.translate.005
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cinquanta is vijftig; de Italiaanse tientallen eindigen vanaf veertig op -anta.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson02.translate.006
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: translation
  frame:
    text: Hoeveel kost een {item}?
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costa un {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Quanto costa? bestaat uit quanto, 'hoeveel', en costa, 'het kost'; een apart woord voor 'het' is niet nodig.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson03.choose.001
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tuo en mio veranderen mee met het geslacht; hier zijn ze allebei mannelijk, omdat numero mannelijk is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson03.order.002
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: word_order
  frame:
    text: Qual è il tuo numero di {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Qual è il tuo numero di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Qual is de verkorte vorm van quale; de laatste e valt weg voor een vorm van essere.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson03.fill.003
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: fill_in_blank
  frame:
    text: Qual è il {item} numero di telefono? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il tuo numero vraagt naar het nummer van de ander; il mio numero antwoordt met je eigen nummer.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson03.match.004
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Il is het mannelijke enkelvoudige lidwoord 'de/het'; numero en telefono zijn allebei mannelijk.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson03.translate.005
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Perfetto past zich aan aan het woord waar het bij hoort: bij een vrouwelijk zelfstandig naamwoord wordt het perfetta.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit03.lesson03.translate.006
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: translation
  frame:
    text: Wat is je telefoonnummer? (informeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Qual è il tuo numero di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Tuo is het informele 'jouw'; met Lei zeg je il Suo numero.
    language_code: nl
    direction: ltr
