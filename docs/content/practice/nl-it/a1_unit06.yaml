      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Questo en mio zijn mannelijk, dus ze horen bij een mannelijk zelfstandig naamwoord: questo è mio padre.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit06.lesson01.fill.004
