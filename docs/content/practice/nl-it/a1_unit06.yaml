templates:
- content_key: practice.nl-it.it.a1.unit06.lesson01.choose.001
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Met een bezittelijk voornaamwoord laten enkelvoudige familiewoorden het lidwoord weg: mio padre, mia madre.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit06.lesson01.listen.002
