    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Padre en madre eindigen allebei op -e maar verschillen in geslacht, dus leer elk woord met zijn geslacht; nonno en nonna eindigen op -o en -a.
    language_code: nl
    direction: ltr
- content_key: practice.nl-it.it.a1.unit06.lesson01.order.003
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
