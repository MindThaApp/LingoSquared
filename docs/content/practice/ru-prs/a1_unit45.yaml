    language_code: prs
    direction: rtl
  slots:
    verb: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: دو شب {verb}
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'Порядок слов: دو شب می‌مانم (я остаюсь на две ночи).'
    language_code: ru
    direction: ltr
- content_key: practice.ru-prs.prs.a1.unit45.lesson04.match.001
  lesson_content_key: prs.a1.unit45.lesson04.hotel_checkin_dialogue
  type: matching_pairs
