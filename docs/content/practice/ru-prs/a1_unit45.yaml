    text: '{a} — {b} — {c} — {d} — {e} — {f}'
    language_code: prs
    direction: rtl
  slots:
    a: *id003
    b: *id003
    c: *id003
    d: *id003
    e: *id003
    f: *id003
  slot_relations:
