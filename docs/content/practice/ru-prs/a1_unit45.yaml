schema_version: '1.0'
pack_key: practice.ru-prs.a1.unit45
source_language: ru
target_language: prs
unit_content_key: prs.a1.unit45.accommodation
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-prs by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - hotel_word
    - stay_verb
    - dialogue_word
    - inclusion_word
slot_presets:
  hotel_word: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: hotel_word
  stay_verb: &id004
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: stay_verb
  hotel_or_stay: &id003
    language_code: prs
    part_of_speech:
    - noun
    - verb
    agreement_tags:
      semantic:
      - hotel_word
      - stay_verb
  dialogue_word: &id002
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: dialogue_word
templates:
- content_key: practice.ru-prs.prs.a1.unit45.lesson01.choose.001
  lesson_content_key: prs.a1.unit45.lesson01.hotel_room_key_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} относится к лексике этого урока о проживании.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-prs.prs.a1.unit45.lesson04.choose.001
