templates:
- content_key: practice.ru-fr.fr.a1.unit12.lesson01.choose.001
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Préparé, acheté, oublié и goûté — причастия прошедшего времени глаголов на -er: они оканчиваются на -é.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson01.listen.002
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Все эти причастия оканчиваются на -é, которое произносится как последний звук в слове café.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson01.order.004
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: word_order
  frame:
    text: Tu as {item} le gâteau ?
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu as {item} le gâteau ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Tu as aimé? — вопрос в прошедшем времени: as плюс причастие aimé.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson01.fill.006
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: fill_in_blank
  frame:
    text: J'ai {item} des légumes au marché. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Acheté — причастие глагола acheter, употребляется после j'ai.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson01.translate.007
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: translation
  frame:
    text: Я приготовил торт для мастер-класса.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {item} un gâteau pour l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: J'ai préparé образуется из avoir и причастия; после avoir окончание причастия не меняется.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson01.translate.008
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: translation
  frame:
    text: Я забыл масло дома.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {item} le beurre à la maison.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: J'ai oublié — это passé composé глагола oublier.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson02.choose.001
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Être — вспомогательный глагол для таких глаголов, как arriver, aller и rester: je suis arrivé, il est resté.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson02.listen.002
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Finalement образовано от прилагательного final и окончания -ment.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson02.order.004
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: word_order
  frame:
    text: Le bus est {item} en retard.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Le bus est {item} en retard.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Arrivé согласуется с le bus, поэтому стоит в мужском роде и единственном числе, без лишнего -e.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson02.fill.006
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: fill_in_blank
  frame:
    text: Mathieu est {item} pour nettoyer la cuisine. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Rester требует être, поэтому resté согласуется с Mathieu: мужской род, единственное число.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson02.translate.007
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: translation
  frame:
    text: Я сходила на рынок перед мастер-классом. (говорит женщина)
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item} au marché avant l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: С être причастие согласуется с подлежащим, поэтому женщина пишет allée.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson02.translate.008
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: translation
  frame:
    text: В итоге торт получился восхитительным.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Finalement, le gâteau {item} délicieux.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Était — imparfait глагола être; finalement в начале предложения означает «в конце концов».
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson03.choose.001
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je n'ai pas pu venir значит «я не смог прийти»; pu — причастие глагола pouvoir.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson03.listen.002
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Samedi dernier значит «в прошлую субботу»; dernier здесь стоит после существительного.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson03.match.003
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Là-bas значит «там», а rapidement — «быстро».
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson03.order.004
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: word_order
  frame:
    text: Je suis allé {item} à l'épicerie du coin.
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis allé {item} à l'épicerie du coin.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Rapidement — наречие, оно не изменяется.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson03.fill.005
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: fill_in_blank
  frame:
    text: Je n'ai pas {item} venir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pu — причастие глагола pouvoir; n'ai pas окружает вспомогательный глагол.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit12.lesson03.translate.006
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: translation
  frame:
    text: Ты нашёл там масло?
    language_code: ru
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu as trouvé du beurre {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu as trouvé? — неформальный вопрос, а du beurre значит «масло» (немного масла).
    language_code: ru
    direction: ltr
