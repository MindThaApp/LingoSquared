schema_version: '1.0'
pack_key: practice.ru-fr.a1.unit70
source_language: ru
target_language: fr
unit_content_key: fr.a1.unit70.hebergement
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_avait
    - w_cet
    - w_clé
    - w_compris
    - w_mot
    - w_nuit
    - w_nuits
    - w_réceptionniste
    - w_réservation
    - w_réserver
    - w_réservé
    - w_wifi
templates:
- content_key: practice.ru-fr.fr.a1.unit70.lesson01.choose.001
  lesson_content_key: fr.a1.unit70.lesson01.reserver_une_chambre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_réserver
        - w_cet
        - w_réservé
        - w_compris
        - w_clé
        - w_mot
        - w_wifi
        - w_réceptionniste
        - w_réservation
        - w_nuits
        - w_nuit
        - w_avait
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о бронировании номера.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit70.lesson02.listen.001
  lesson_content_key: fr.a1.unit70.lesson02.est_ce_que_le
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Завтрак включён?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit70.lesson03.translate.001
  lesson_content_key: fr.a1.unit70.lesson03.la_cle_et_le
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о ключе и пароле от wifi.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit70.lesson04.match.001
  lesson_content_key: fr.a1.unit70.lesson04.s_enregistrer_a_la
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое французское слово с его значением по-русски; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
