templates:
- content_key: practice.ru-fr.fr.a1.unit04.lesson01.choose.001
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marché и prix — мужского рода (le marché, le prix), а boulangerie — женского (la boulangerie); учи каждое существительное сразу с артиклем.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson01.listen.002
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Многие слова с рынка — названия продуктов, которые после количества стоят с de: un kilo de tomates, un litre de lait.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson01.match.003
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'После мер веса и объёма перед названием продукта ставится de: un kilo de tomates, un litre de lait.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson01.order.004
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: word_order
  frame:
    text: Les {item} sont chers aujourd'hui.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Les {item} sont chers aujourd'hui.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Chers стоит во множественном числе мужского рода, потому что légumes и fruits — существительные мужского рода во множественном числе.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson01.fill.005
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: fill_in_blank
  frame:
    text: La {item} est fermée aujourd'hui. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fermée оканчивается на -ée, потому что boulangerie — женского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson01.translate.006
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Во французском каждое существительное учат вместе с артиклем: le marché, le prix, la boulangerie.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson02.choose.001
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Euro во множественном числе принимает -s (euros), но это s не произносится, поэтому на слух различается число, а не окончание.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson02.choose.002
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chers — множественное число от cher; прилагательные получают -s, чтобы согласоваться с существительными во множественном числе, например с les légumes.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson02.order.003
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: Je voudrais un kilo de {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je voudrais — вежливый способ о чём-то попросить; un kilo de + существительное называет количество.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson02.order.004
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: C'est combien le {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien? спрашивает цену одной вещи; le показывает, что существительное мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson02.fill.005
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Combien ça {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Combien ça coûte? — «сколько это стоит?»; подходит для любого отдельного товара.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson02.fill.006
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Je {item} un kilo de tomates, s'il vous plaît. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Je voudrais вежливее, чем je veux: при заказе je veux прозвучало бы резко.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson02.translate.007
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cher согласуется с существительным: cher (мужской род, единственное число), chers (мужской род, множественное число).'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson02.translate.008
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: Я бы хотел(а) килограмм ({item}), пожалуйста. (на «вы»)
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: S'il vous plaît — вежливое «пожалуйста» на «вы»; с другом можно сказать s'il te plaît.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson02.translate.009
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: Сколько стоит хлеб?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien le pain? спрашивает цену одного товара; ответ начинается с суммы в евро.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson03.choose.001
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Voilà говорят, когда что-то передают или на что-то указывают: «вот, пожалуйста», «вот оно».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson03.match.002
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id016
    second: *id016
    third: *id016
    fourth: *id016
    fifth: *id016
    sixth: *id016
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Fermée стоит в женском роде, потому что относится к la boulangerie; при существительном мужского рода было бы fermé.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit04.lesson03.fill.003
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: fill_in_blank
  frame:
    text: On peut {item} du pain ici aussi. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'После peut («может») следующий глагол стоит в начальной форме: on peut acheter.'
    language_code: ru
    direction: ltr
