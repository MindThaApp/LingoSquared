  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aime
    - w_amis
    - w_autant
    - w_avons
    - w_cuisiner
    - w_cuisines
    - w_dessine
    - w_dessiner
    - w_féminin
    - w_jamais
    - w_jeux
