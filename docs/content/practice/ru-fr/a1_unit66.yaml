schema_version: '1.0'
pack_key: practice.ru-fr.a1.unit66
source_language: ru
target_language: fr
unit_content_key: fr.a1.unit66.saisons
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_automne
    - w_beau
    - w_belle
    - w_conversation
    - w_favorites
    - w_hiver
    - w_nageons
    - w_patiner
    - w_patinons
    - w_printemps
    - w_saison
    - w_saisons
    - w_été
templates:
- content_key: practice.ru-fr.fr.a1.unit66.lesson01.choose.001
  lesson_content_key: fr.a1.unit66.lesson01.printemps_et_ete
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_saison
        - w_printemps
        - w_été
        - w_automne
        - w_hiver
        - w_belle
        - w_nageons
        - w_patiner
        - w_patinons
        - w_conversation
        - w_saisons
        - w_beau
        - w_favorites
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о весне и лете.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit66.lesson02.listen.001
  lesson_content_key: fr.a1.unit66.lesson02.automne_et_hiver
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока об осени и зиме.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit66.lesson03.translate.001
  lesson_content_key: fr.a1.unit66.lesson03.activites_selon_la_saison
  type: translation
  frame:
