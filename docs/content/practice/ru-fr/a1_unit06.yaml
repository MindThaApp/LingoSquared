templates:
- content_key: practice.ru-fr.fr.a1.unit06.lesson01.choose.001
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le matin, l'après-midi и le soir обозначают части суток; midi и minuit — полдень и полночь, они употребляются без артикля.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson01.listen.002
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'L''heure — это la heure в сокращённом виде: heure начинается с немого h, поэтому la перед ним превращается в l''.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson01.match.003
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Matin, après-midi и soir обычно употребляются с le или l', когда мы говорим «утром», «днём», «вечером».
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson01.order.004
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: word_order
  frame:
    text: Le marché est ouvert le {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Le marché est ouvert le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Le matin и le soir значат «утром» и «вечером»; отдельного слова для предлога не нужно.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson01.fill.005
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: fill_in_blank
  frame:
    text: Nous mangeons à {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: À midi значит «в полдень»; midi — также обычное слово для обозначения обеденного времени.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson01.translate.006
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: translation
  frame:
    text: Мастер-класс начинается вечером, а не утром.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier commence le {item}, pas le matin.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Le soir значит «вечером»; pas выражает отрицание и противопоставляет это le matin.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson02.choose.001
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Demie здесь стоит в женском роде, потому что heure — женского рода: dix heures et demie.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson02.listen.002
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Et quart и moins le quart — два выражения для четверти часа: после часа и до часа.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson02.order.003
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: word_order
  frame:
    text: L'atelier commence à {item} heure ?
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier commence à {item} heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quelle heure? спрашивает, который час; quelle — женского рода, согласуется с heure.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson02.fill.004
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: fill_in_blank
  frame:
    text: Il est onze heures {item} le quart. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Moins le quart вычитает четверть из следующего часа, поэтому onze heures moins le quart — это 10:45.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson02.translate.005
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: translation
  frame:
    text: Сейчас десять часов пятнадцать минут.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Il est dix heures et {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Et quart добавляет четверть часа: по-французски говорят «десять часов и четверть».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson03.choose.001
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Alors, vers и après — небольшие связующие слова, которые в диалоге указывают на время или последовательность.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson03.listen.002
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Vers значит «около», как в vers vingt heures quinze: так называют приблизительное время.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson03.match.003
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Après le travail значит «после работы»; vers и d'habitude указывают на приблизительное и привычное время.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson03.order.004
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: word_order
  frame:
    text: C'est plus {item} après le travail.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est plus {item} après le travail.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Plus pratique значит «удобнее»; pratique имеет одну и ту же форму в мужском и женском роде.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson03.fill.005
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: fill_in_blank
  frame:
    text: Et il {item} à quelle heure ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Finit — форма il глагола finir, поэтому она согласуется с il в вопросе.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson03.fill.006
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: fill_in_blank
  frame:
    text: Vers vingt heures quinze, comme {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Comme d'habitude значит «как обычно».
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit06.lesson03.translate.007
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: translation
  frame:
    text: Мастерская начинается в 18:30, кажется. (напиши время словами)
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Il commence à dix-huit heures trente, je {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Je crois — форма je глагола croire; она смягчает утверждение: «я так думаю».'
    language_code: ru
    direction: ltr
