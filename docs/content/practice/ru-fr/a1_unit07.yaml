    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fermée оканчивается на -e, потому что banque — женского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit07.lesson01.translate.005
  lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
