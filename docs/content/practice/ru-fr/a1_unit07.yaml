    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: La poste est {item} d'ici.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Loin d'ici означает «далеко отсюда».
    language_code: ru
    direction: ltr
