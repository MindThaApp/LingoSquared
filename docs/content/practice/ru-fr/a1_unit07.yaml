    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La pharmacie est à {item} de la banque.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: À côté de значит «рядом с»; de связывает выражение со следующим существительным.
    language_code: ru
    direction: ltr
