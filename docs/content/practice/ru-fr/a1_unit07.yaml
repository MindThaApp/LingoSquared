  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Où спрашивает «где»; en face de и à côté de — выражения места, после которых перед существительным нужен de.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit07.lesson02.listen.002
  lesson_content_key: fr.a1.unit07.lesson02.demander_son_chemin
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Loin d'ici значит «далеко отсюда»; près d'ici — наоборот, «близко отсюда».
    language_code: ru
    direction: ltr
