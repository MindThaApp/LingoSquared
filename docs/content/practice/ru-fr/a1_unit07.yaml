- content_key: practice.ru-fr.fr.a1.unit07.lesson01.choose.001
  lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La gare, la pharmacie, la banque и la poste — все женского рода, поэтому берут la; l'école принимает l' перед гласным.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit07.lesson01.listen.002
  lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
