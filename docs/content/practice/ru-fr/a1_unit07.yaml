  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La poste — это почта; как gare, pharmacie и banque, это существительное женского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit07.lesson01.order.003
  lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
  type: word_order
  frame:
    text: La {item} est grande.
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: La {item} est grande.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Эти существительные женского рода, поэтому артикль — la, а прилагательное grande принимает женское окончание -e.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit07.lesson01.fill.004
  lesson_content_key: fr.a1.unit07.lesson01.lieux_du_quartier
