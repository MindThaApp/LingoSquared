templates:
- content_key: practice.ru-fr.fr.a1.unit05.lesson01.choose.001
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le poulet, le poisson, le riz и le vin — мужского рода, а la salade — женского; в l'eau артикль теряет гласную перед словом eau.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson01.listen.002
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Café означает и напиток, и заведение; какое значение имеется в виду, понятно из контекста.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson01.match.003
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'После слова, обозначающего ёмкость, во французском ставится de без артикля: un verre de vin, un verre d''eau.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson01.translate.004
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Это еда и напитки из меню; запоминай каждое существительное с артиклем: le vin, la salade.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson02.choose.001
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vous avez choisi? — так официант спрашивает, выбрали ли вы; avez choisi — прошедшая форма, буквально «вы выбрали».
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson02.order.002
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: word_order
  frame:
    text: Je voudrais un {item}, s'il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Un ставится перед существительными мужского рода, такими как café, dessert и verre.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson02.order.003
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: word_order
  frame:
    text: Qu'est-ce que vous avez comme {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce que vous avez comme {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Comme здесь означает «в качестве» или «на»: что у вас есть на десерт?'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson02.fill.004
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: Vous {item} choisi ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vous avez choisi? — вежливый вопрос официанта, с обращением на vous.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson02.fill.005
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: C'est {item} ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Délicieux стоит в мужском роде и единственном числе, потому что c'est относится к чему-то неопределённому.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson02.fill.006
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: fill_in_blank
  frame:
    text: '{item}, s''il vous plaît. ({hint})'
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: L'addition — так просят счёт; l' — это артикль le/la, сокращённый перед гласным.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson02.translate.007
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: translation
  frame:
    text: Я хотел бы кофе, пожалуйста. (вежливо)
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je voudrais un café, s'il vous plaît — стандартный вежливый заказ.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson02.translate.008
  lesson_content_key: fr.a1.unit05.lesson02.au_cafe
  type: translation
  frame:
    text: Очень вкусно!
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est délicieux! — комплимент повару или еде.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson03.choose.001
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Слово rouge имеет одну и ту же форму в мужском и женском роде: un verre de vin rouge — бокал красного вина.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson03.listen.002
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cette ставится перед существительными женского рода (cette salade); соответствующая форма мужского рода — ce.
    language_code: ru
    direction: ltr
