  feedback_frame:
    text: Délicieux и rouge описывают существительные; avez, choisi и donné — глагольные формы прошедшего или настоящего времени.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit05.lesson03.order.004
  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
