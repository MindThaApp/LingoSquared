  lesson_content_key: fr.a1.unit05.lesson03.dialogue_cafe
  type: translation
  frame:
    text: От мастер-класса у нас разыгрался аппетит.
    language_code: ru
    direction: ltr
  slots:
    item: *id018
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier nous a {item} faim.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Donner faim — идиома: буквально «мастер-класс дал нам голод».'
    language_code: ru
    direction: ltr
