templates:
- content_key: practice.ru-fr.fr.a1.unit03.lesson01.choose.001
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Frères et sœurs вместе означает «братья и сёстры»: в обычной речи во французском нет одного слова для этого.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson01.listen.002
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Frère и frères звучат одинаково, как и sœur и sœurs, поэтому единственное или множественное число видно только по артиклю или по контексту.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson01.match.003
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Французские слова о семье легко сопоставить, если знаешь род: mère и père, tante и oncle, cousine и cousin.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson01.translate.004
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У frère и sœur во множественном числе появляется -s (frères, sœurs), поэтому если по-русски множественное число, во французском оно тоже нужно.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson02.choose.001
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ma употребляется с существительными женского рода (ma mère), mon — с существительными мужского рода (mon père), а mes — со всеми существительными во множественном числе (mes parents).
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson02.order.002
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: word_order
  frame:
    text: Ma {item} est petite.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma {item} est petite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ma ставится с существительным женского рода в единственном числе; прилагательное petite тоже получает женское окончание -e.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson02.fill.003
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: fill_in_blank
  frame:
    text: '{item} famille est grande. ({hint})'
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Famille — женского рода, поэтому с ним используется ma; с существительным мужского рода было бы mon.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson02.translate.004
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: translation
  frame:
    text: Моя семья маленькая.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma famille est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Petite стоит в женском роде, потому что famille — женского рода; с существительным мужского рода было бы petit.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson03.choose.001
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cousin — мужского рода, cousine — женского: окончание -e указывает на двоюродную сестру и делает конечное n слышимым.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson03.order.002
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: word_order
  frame:
    text: Mon {item} habite à Paris.
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mon {item} habite à Paris.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Mon ставится перед существительными мужского рода в единственном числе: mon père, mon oncle.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson04.choose.001
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Окончания habite/habites/habitent в настоящем времени звучат одинаково, поэтому понять, о ком речь, помогает местоимение.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson04.order.002
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: word_order
  frame:
    text: J’habite avec mes {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite avec mes {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mes — это «мои» во множественном числе, для существительных и мужского, и женского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson04.fill.003
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: fill_in_blank
  frame:
    text: Tu habites {item} de tes parents ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Près de значит «рядом с»: près de tes parents, près d’ici.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson04.translate.004
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Окончание глагола зависит от подлежащего: habite для il/elle, habitent для ils/elles, habites для tu.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson04.translate.005
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: Я живу со своими бабушкой и дедушкой.
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite avec mes {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mes — это «мои» во множественном числе, поэтому mes grands-parents значит «мои бабушка и дедушка».
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson05.fill.001
  lesson_content_key: fr.a1.unit03.lesson05.reading_a_family_profile
  type: fill_in_blank
  frame:
    text: Ma petite sœur {item} Camille. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'S’appelle — форма il/elle глагола s’appeler: ma sœur s’appelle..., je m’appelle...'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson06.listen.001
  lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Chaque semaine значит «каждую неделю»: chaque не изменяется, после него стоит существительное в единственном числе.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit03.lesson06.match.002
  lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id018
    second: *id018
    third: *id018
    fourth: *id018
    fifth: *id018
    sixth: *id018
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mais — слово контраста («но»), а plus выражает сравнение, как в Ma famille est plus petite.
    language_code: ru
    direction: ltr
