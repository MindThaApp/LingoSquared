schema_version: '1.0'
pack_key: practice.ru-fr.a1.unit47
source_language: ru
target_language: fr
unit_content_key: fr.a1.unit47.meteo
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_chaud
    - w_ensoleillé
    - w_faisons
    - w_film
    - w_froid
    - w_journée
    - w_météo
    - w_nuageux
    - w_pleut
    - w_promenade
    - w_toute
    - w_tranquillement
templates:
- content_key: practice.ru-fr.fr.a1.unit47.lesson01.choose.001
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_ensoleillé
        - w_pleut
        - w_nuageux
        - w_froid
        - w_chaud
        - w_météo
        - w_toute
        - w_journée
        - w_promenade
        - w_faisons
        - w_tranquillement
        - w_film
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Какая погода?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson02.listen.001
  lesson_content_key: fr.a1.unit47.lesson02.froid_ou_chaud
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Холодно или тепло?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson03.translate.001
  lesson_content_key: fr.a1.unit47.lesson03.la_meteo
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Прогноз погоды».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson04.match.001
  lesson_content_key: fr.a1.unit47.lesson04.faire_des_projets_selon
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое французское слово с его значением по-русски; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson06.choose.001
  lesson_content_key: fr.a1.unit47.lesson06.faire_des_projets_pour
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Планы на выходные».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson01.translate.002
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Какая погода?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson01.order.003
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: word_order
  frame:
    text: Le temps est {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_ensoleillé
  answer_derivation:
    kind: render_frame
    frame:
      text: Le temps est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Солнечно. Le temps est + прилагательное — стандартная конструкция; прилагательное согласуется с существительным мужского рода temps.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson01.fill.004
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: fill_in_blank
  frame:
    text: S'il {item}, on reste à l'intérieur. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pleut
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pleut
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Если идёт дождь, мы остаёмся дома. S''il pleut («если идёт дождь»): si + il превращается в s''il; затем on reste à l''intérieur говорит о том, что вы делаете.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson01.translate.005
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: translation
  frame:
    text: Облачно.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nuageux
  answer_derivation:
    kind: render_frame
    frame:
      text: Le temps est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Облачно. Конструкция та же, что и с ensoleillé: le temps est + прилагательное.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson02.order.002
  lesson_content_key: fr.a1.unit47.lesson02.froid_ou_chaud
  type: word_order
  frame:
    text: Il fait {item} aujourd'hui.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_froid
  answer_derivation:
    kind: render_frame
    frame:
      text: Il fait {item} aujourd'hui.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Сегодня холодно. Aujourd'hui («сегодня») привязывает погоду ко времени; il fait froid строится с глаголом faire, а не être.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson02.fill.003
  lesson_content_key: fr.a1.unit47.lesson02.froid_ou_chaud
  type: fill_in_blank
  frame:
    text: Il fait {item} aujourd'hui. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_chaud
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_chaud
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Сегодня тепло. Il fait chaud в повседневной речи о погоде передаёт и «тепло», и «жарко».
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson03.order.002
  lesson_content_key: fr.a1.unit47.lesson03.la_meteo
  type: word_order
  frame:
    text: Quelle est la {item} ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_météo
  answer_derivation:
    kind: render_frame
    frame:
      text: Quelle est la {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Какой прогноз погоды? météo значит «прогноз погоды».
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson04.order.002
  lesson_content_key: fr.a1.unit47.lesson04.faire_des_projets_selon
  type: word_order
  frame:
    text: On fait une {item} ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_promenade
  answer_derivation:
    kind: render_frame
    frame:
      text: On fait une {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Пойдём погуляем? promenade значит «прогулка».
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit47.lesson06.order.002
  lesson_content_key: fr.a1.unit47.lesson06.faire_des_projets_pour
  type: word_order
  frame:
    text: Parfait, alors on regarde un {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_film
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, alors on regarde un {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Отлично, тогда посмотрим фильм. Regarder («смотреть») естественно сочетается с un film («фильм»).
    language_code: ru
    direction: ltr
