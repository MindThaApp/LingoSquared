schema_version: '1.0'
pack_key: practice.ru-fr.a1.unit45
source_language: ru
target_language: fr
unit_content_key: fr.a1.unit45.travail
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_bureau
    - w_certaines
    - w_cuisinier
    - w_curieuse
    - w_finis
    - w_forme
    - w_gardent
    - w_horaires
    - w_infirmière
    - w_métier
    - w_pause
    - w_personnes
    - w_propre
    - w_restaurant
    - w_rythme
    - w_son
    - w_travaille
    - w_travaillent
    - w_tôt
    - w_verbes
    - w_vie
templates:
- content_key: practice.ru-fr.fr.a1.unit45.lesson01.choose.001
  lesson_content_key: fr.a1.unit45.lesson01.tu_fais_quoi_dans
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_vie
        - w_métier
        - w_cuisinier
        - w_travaille
        - w_infirmière
        - w_restaurant
        - w_certaines
        - w_personnes
        - w_travaillent
        - w_bureau
        - w_pause
        - w_finis
        - w_verbes
        - w_gardent
        - w_forme
        - w_curieuse
        - w_horaires
        - w_tôt
        - w_son
        - w_propre
        - w_rythme
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Кем ты работаешь?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit45.lesson02.listen.001
  lesson_content_key: fr.a1.unit45.lesson02.ou_travailles_tu
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Где ты работаешь?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit45.lesson03.translate.001
  lesson_content_key: fr.a1.unit45.lesson03.ma_journee_de_travail
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Мой рабочий день».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit45.lesson04.match.001
  lesson_content_key: fr.a1.unit45.lesson04.decrire_des_collegues
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое французское слово с его значением по-русски; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-fr.fr.a1.unit45.lesson06.choose.001
  lesson_content_key: fr.a1.unit45.lesson06.une_conversation_sur_le
