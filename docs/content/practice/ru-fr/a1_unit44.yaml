        - w_quelque
        - w_comprimé
        - w_prenez
        - w_fois
        - w_vouvoie
        - w_conseil
        - w_bois
        - w_toujours
        - w_jours
        - w_médecin
        - w_pris
        - w_reposer
        - w_maintenant
        - w_rétablissement
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Мне нехорошо».'
    language_code: ru
    direction: ltr
