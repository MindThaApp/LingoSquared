- content_key: practice.ru-fr.fr.a1.unit44.lesson01.order.002
  lesson_content_key: fr.a1.unit44.lesson01.je_ne_me_sens
  type: word_order
  frame:
    text: Je ne me {item} pas bien.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sens
  answer_derivation:
    kind: render_frame
    frame:
      text: Je ne me {item} pas bien.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Я плохо себя чувствую. Se sentir — возвратный глагол (je me sens); ne ... pas bien — общий, мягкий способ сказать, что что-то не так.
    language_code: ru
    direction: ltr
