      text: I'd like to make an appointment to see a {item}, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Fissare un appuntamento si dice make an appointment; I'd like to è la forma cortese per esprimere un desiderio.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a2.unit28.lesson02.translate.013
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: Ho mal di testa e mal di gola da tre giorni, e sta peggiorando. (usa le forme abbreviate)
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_three
  answer_derivation:
    kind: render_frame
    frame:
      text: I've had a headache and a sore throat for {item} days, and it's getting worse.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'For indica la durata («da tre giorni»); con esso si usa il present perfect: I''ve had.'
    language_code: it
    direction: ltr
