templates:
- content_key: practice.it-en.en.a1.unit02.lesson01.choose.001
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Your e my sono aggettivi possessivi: my name è «il mio nome», your name è «il tuo nome» o «il Suo nome», perché l''inglese non distingue tra tu e Lei.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson01.listen.002
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'What''s è la forma abbreviata di what is e introduce la domanda sul nome: What''s your name?'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson02.choose.003
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'In inglese davanti a una professione di solito c''è un articolo: a student, a teacher, ma an engineer, perché la parola seguente inizia con una vocale.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson02.listen.004
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'He indica un uomo e she una donna; per entrambi si usa is: he is, she is.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson03.choose.005
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: In biblioteca senti Welcome to the library; the è l'articolo determinativo e corrisponde a il, lo, la, i, gli, le.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson03.listen.006
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Thank you è la formula cortese standard per dire «grazie».
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson01.order.007
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: word_order
  frame:
    text: My {item} is Leila.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: My {item} is Leila.
      language_code: en
      direction: ltr
  feedback_frame:
    text: In inglese si dice letteralmente «Il mio nome è …»; il verbo is sta tra name e il nome.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson02.order.008
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: word_order
  frame:
    text: I am a {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: I am a {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Davanti a una professione o a un ruolo l''inglese mette l''articolo a: I am a student, diversamente dall''italiano, dove spesso manca.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson01.fill.009
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: fill_in_blank
  frame:
    text: What's {item} name? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Your corrisponde a you, cioè a tu e a Lei; per «mio» si usa my.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson02.fill.010
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: fill_in_blank
  frame:
    text: She is {item} engineer. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Davanti a un suono vocalico si usa an invece di a: an engineer, ma a teacher.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson02.fill.011
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: fill_in_blank
  frame:
    text: '{item} is a teacher. ({hint})'
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: He è la forma maschile; per una donna si usa she, per più persone invece they.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson02.match.012
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Yes e no rispondono a una domanda, come sì e no in italiano; student e teacher sono ruoli che richiedono un articolo.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson03.fill.013
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: fill_in_blank
  frame:
    text: Welcome to {item} library. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: L'articolo determinativo the non cambia, che il nome sia maschile, femminile o plurale.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson01.translate.014
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: Come ti chiami? (informale)
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: What's {item} name?
      language_code: en
      direction: ltr
  feedback_frame:
    text: In inglese si chiede letteralmente «Qual è il tuo nome?»; la domanda suona uguale con gli amici e con gli sconosciuti.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson01.translate.015
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: Mi chiamo Leila.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} name is Leila.'
      language_code: en
      direction: ltr
  feedback_frame:
    text: My è l'aggettivo possessivo per «mio»; nella frase sta davanti al nome name.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson02.translate.016
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ruoli come student o teacher hanno in inglese la stessa forma per donne e uomini: non c''è una desinenza femminile.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson02.translate.017
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: translation
  frame:
    text: Lei è un'ingegnera. (per esteso, senza forma abbreviata)
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: She is {item} engineer.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Molte professioni inglesi non hanno una forma femminile propria: ingegnere e ingegnera si dicono entrambi engineer.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit02.lesson03.translate.018
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Welcome si usa come saluto quando qualcuno entra; thank fa parte di thank you.
    language_code: it
    direction: ltr
