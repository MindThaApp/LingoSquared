    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Gli aggettivi sunny, rainy, cloudy, windy, cold, hot e warm descrivono il tempo; umbrella è l'ombrello.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson01.translate.013
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Gli aggettivi del tempo stanno dopo It''s: It''s hot, It''s cold.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson02.translate.014
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Weather è il tempo atmosferico e umbrella l''ombrello; con should si dà un consiglio: You should take an umbrella.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson04.translate.015
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: But significa «ma», so significa «quindi» e idea significa «idea».
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson02.translate.016
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: Sta piovendo ora. (con forma abbreviata)
    language_code: it
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: It's raining descrive ciò che accade adesso; per una previsione si usa will.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson02.translate.017
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: Che tempo fa oggi? (con forma abbreviata e like)
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: What's the {item} like today?
      language_code: en
      direction: ltr
  feedback_frame:
    text: What's the weather like? chiede com'è il tempo; like qui significa «come».
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson03.translate.018
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: translation
  frame:
    text: Domani pioverà. (con will)
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: It will {item} tomorrow.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Con will + forma base si forma il futuro: It will rain tomorrow.'
    language_code: it
    direction: ltr
