templates:
- content_key: practice.it-en.en.a1.unit11.lesson01.choose.001
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Il tempo in inglese si descrive con it: It''s sunny, It''s cold.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson02.choose.002
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Raining è la forma progressiva e descrive ciò che sta accadendo ora: It''s raining.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson03.choose.003
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Con will si forma il futuro; dopo will viene la forma base del verbo: It will rain.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson04.choose.004
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'But collega due affermazioni opposte; so introduce la conseguenza: It''s going to rain, so let''s go today.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson01.order.005
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: word_order
  frame:
    text: It's {item} today.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item} today.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Il tempo si descrive con It's e un aggettivo; today sta in fondo alla frase.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson02.order.006
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: word_order
  frame:
    text: You should take an {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: You should take an {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Should dà un consiglio; take è la forma base. Davanti a una vocale c'è an al posto di a.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson03.order.007
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: word_order
  frame:
    text: It will {item} on Saturday.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: It will {item} on Saturday.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Dopo will c''è la forma base del verbo, senza -s: It will rain.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson02.fill.008
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: fill_in_blank
  frame:
    text: It's {item} and warm. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sunny significa soleggiato e viene da sun, il sole; sunny and warm è una combinazione frequente.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson02.fill.009
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: fill_in_blank
  frame:
    text: What's the {item} like today? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: What's the weather like? chiede com'è il tempo; what's è la forma abbreviata di what is.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson03.fill.010
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: fill_in_blank
  frame:
    text: It {item} rain on Saturday. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Will forma il futuro; si dice It will rain, non It will rains.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson04.fill.011
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: fill_in_blank
  frame:
    text: It's going to rain on Saturday, {item} let's go today. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'So introduce la conseguenza: sabato piove, quindi andiamo oggi.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit11.lesson01.match.012
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
