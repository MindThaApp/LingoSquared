    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Con what day si chiede il giorno della settimana, con what's today's date la data.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit04.lesson03.fill.010
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
