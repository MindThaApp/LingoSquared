    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: When's è la forma abbreviata di When is; con essa si chiede un momento nel tempo.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit04.lesson04.order.011
  lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
  type: word_order
  frame:
    text: It opens on {item}, July 9th.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: It opens on {item}, July 9th.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Davanti a un giorno della settimana o a una data c''è on: on Thursday, on July 9th.'
    language_code: it
    direction: ltr
