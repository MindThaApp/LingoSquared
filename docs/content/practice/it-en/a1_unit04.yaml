templates:
- content_key: practice.it-en.en.a1.unit04.lesson01.choose.001
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'In inglese i giorni della settimana si scrivono sempre con la maiuscola: Monday, Tuesday, Wednesday.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit04.lesson01.listen.002
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tutti i giorni della settimana finiscono in -day: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday e Sunday.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit04.lesson02.choose.003
  lesson_content_key: en.a1.unit04.lesson02.months
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Anche i nomi dei mesi si scrivono con la maiuscola in inglese: January, March, July.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit04.lesson02.listen.004
  lesson_content_key: en.a1.unit04.lesson02.months
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Molti nomi dei mesi inglesi somigliano a quelli italiani, ma l'accento spesso cade altrove; ascolta con attenzione la sillaba accentata.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit04.lesson03.choose.005
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Nella data l''inglese usa i numeri ordinali: July 7th. Con when''s si chiede quando avviene qualcosa, per esempio When''s your birthday?'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit04.lesson04.choose.006
  lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Open può significare «aprire» o «essere aperto», come in When's the library open again?
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit04.lesson02.order.007
  lesson_content_key: en.a1.unit04.lesson02.months
  type: word_order
  frame:
    text: Which {item} is it?
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Which {item} is it?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Which chiede una scelta tra un insieme limitato, qui i dodici mesi.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit04.lesson03.order.008
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: word_order
  frame:
    text: My birthday is {item} 3rd.
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: My birthday is {item} 3rd.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Nella data l''inglese mette prima il mese e poi il giorno: March 3rd; in italiano invece «3 marzo».'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit04.lesson01.fill.009
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: fill_in_blank
  frame:
