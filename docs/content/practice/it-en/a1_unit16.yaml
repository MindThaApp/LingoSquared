schema_version: '1.0'
pack_key: practice.it-en.a1.unit16
source_language: it
target_language: en
unit_content_key: en.a1.unit16.routines
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.de-en by scripts/derive_direction.py (templates, slots and tags unchanged; frame/feedback text translated to Italian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_after
    - w_bed
    - w_breakfast
    - w_day
    - w_dinner
    - w_every
    - w_morning
    - w_time
    - w_usually
templates:
- content_key: practice.it-en.en.a1.unit16.lesson01.choose.001
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic:
        - w_dinner
        - w_bed
        - w_breakfast
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'In inglese i pasti non vogliono l''articolo: have breakfast, have dinner. Anche in go to bed l''articolo manca.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit16.lesson02.choose.002
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adjective
      - adverb
      - preposition
      agreement_tags:
        semantic:
        - w_usually
        - w_every
        - w_after
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Usually, every e after stanno prima del verbo o all''inizio di un''espressione di tempo: I usually go, every day, after that.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit16.lesson01.order.003
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: word_order
  frame:
    text: I have {item} at seven.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic:
        - w_breakfast
        - w_dinner
  answer_derivation:
    kind: render_frame
    frame:
      text: I have {item} at seven.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Davanti a breakfast e dinner non c''è l''articolo: I have breakfast, non I have a breakfast.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit16.lesson02.order.004
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: word_order
  frame:
    text: I {item} go to bed at eleven.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_usually
  answer_derivation:
    kind: render_frame
    frame:
      text: I {item} go to bed at eleven.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Usually sta prima del verbo principale go; l'italiano «di solito vado...» non si può trasferire parola per parola.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit16.lesson02.fill.005
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: fill_in_blank
  frame:
    text: I {item} go to bed at eleven. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id001
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_usually
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Usually («di solito») sta tra il soggetto e il verbo principale: I usually go.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit16.lesson01.fill.006
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: fill_in_blank
  frame:
    text: I have {item} at seven. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id002
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_breakfast
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Have breakfast e have dinner sono espressioni fisse senza articolo.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit16.lesson02.translate.007
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: translation
  frame:
    text: Di solito vado a letto alle undici.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_usually
  answer_derivation:
    kind: render_frame
    frame:
      text: I {item} go to bed at eleven.
      language_code: en
      direction: ltr
  feedback_frame:
