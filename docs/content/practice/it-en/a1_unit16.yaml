    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit16.lesson04.translate.008
  lesson_content_key: en.a1.unit16.lesson04.routine_dialogue
  type: translation
  frame:
    text: Che cosa fai dopo?
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_after
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you do {item} that?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Con after that chiedi che cosa viene dopo qualcosa; la domanda richiede do.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit16.lesson01.match.009
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slot_relations:
  - kind: distinct
    slots: &id004
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  slots:
    first: &id003
      language_code: en
      part_of_speech:
      - adverb
      - noun
      - preposition
      agreement_tags:
        semantic:
        - w_dinner
        - w_bed
        - w_breakfast
        - w_usually
        - w_after
        - w_morning
        - w_day
        - w_time
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  answer_derivation:
    kind: matching_pairs
    slots: *id004
  feedback_frame:
    text: 'Le parole di questo gioco riguardano la giornata: i pasti (breakfast, dinner), le indicazioni di tempo (morning, day, time, after) e usually.'
    language_code: it
    direction: ltr
