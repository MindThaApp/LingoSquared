    slot: item
  feedback_frame:
    text: Last qui significa ultimo; nella frase it's the last one this year è l'ultimo esame dell'anno.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit13.lesson04.choose.004
