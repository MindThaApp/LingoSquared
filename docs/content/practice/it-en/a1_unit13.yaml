    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Because introduce un motivo e in inglese l''ordine delle parole resta quello normale: I''m happy because the class is almost over.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit13.lesson03.choose.003
