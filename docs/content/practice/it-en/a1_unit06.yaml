    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Parole di famiglia come mother e grandmother indicano la parentela; grand- indica la generazione precedente.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson01.translate.013
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Parents (genitori) e siblings (fratelli e sorelle) qui sono al plurale; il singolare è parent e sibling.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson02.translate.014
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aunt e uncle indicano i fratelli e le sorelle dei genitori; cousin vale per maschi e femmine.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson04.translate.015
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Who chiede di una persona; photo è la forma abbreviata di photograph e nella vita di tutti i giorni si usa quasi sempre.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson02.translate.016
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: translation
  frame:
    text: Questa è mia sorella. (con This)
    language_code: it
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: This is my {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Con This is presenti qualcuno che stai mostrando; my sta davanti al nome.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson03.translate.017
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: translation
  frame:
    text: Ho due fratelli.
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I have two {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Dopo il numero two il nome è al plurale: two brothers.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson03.translate.018
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: translation
  frame:
    text: Hai fratelli o sorelle? (con any)
    language_code: it
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Do you have any {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Nelle domande si usa any: Do you have any siblings? La risposta è I have two brothers oppure No, I don''t.'
    language_code: it
    direction: ltr
