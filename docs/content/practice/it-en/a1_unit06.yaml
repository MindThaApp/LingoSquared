templates:
- content_key: practice.it-en.en.a1.unit06.lesson01.choose.001
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Parents e siblings in inglese sono al plurale; al posto del singolare sibling, nella vita di tutti i giorni si dice di solito brother o sister.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson01.listen.002
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le parole mother, father e brother contengono il suono th, che si pronuncia con la punta della lingua tra i denti.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson02.choose.003
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Grandmother e grandfather sono formati da grand- e mother o father; in italiano a questo corrisponde «nonna» e «nonno», parole a sé.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson03.choose.004
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Child è il singolare, il plurale è children; brothers è il plurale di brother.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson04.choose.005
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Who chiede di una persona: Who is this? Per le cose si usa what.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson02.order.006
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: word_order
  frame:
    text: This is {item} sister.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: This is {item} sister.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'His si riferisce a un uomo e her a una donna: his sister è la sorella di un uomo, her sister quella di una donna.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson03.order.007
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: word_order
  frame:
    text: I have two {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I have two {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Dopo il numero two in inglese c''è il plurale: two brothers, non two brother.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson04.order.008
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: word_order
  frame:
    text: Is this your {item}?
    language_code: en
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Is this your {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Your sta davanti al nome; nella domanda sì/no Is this your family? is sta prima di this.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson02.fill.009
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: fill_in_blank
  frame:
    text: Daniel has one sister. This is {item} sister. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: His si riferisce a un uomo, qui Daniel; per una donna si direbbe her.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson03.fill.010
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: fill_in_blank
  frame:
    text: Do you have {item} siblings? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Nelle domande e nelle negative si usa any, nelle affermative some: Do you have any siblings?'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson04.fill.011
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: fill_in_blank
  frame:
    text: I {item} have one sister. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Just sta davanti al verbo principale: I just have one sister significa che c''è solo questa sorella.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit06.lesson02.match.012
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
