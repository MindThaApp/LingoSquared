    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a2.unit26.lesson02.translate.013
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: Penso che sia una buona idea, perché i cani hanno bisogno di spazio per correre.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_idea
  answer_derivation:
    kind: render_frame
