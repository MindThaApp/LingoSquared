- content_key: practice.it-en.en.a2.unit26.lesson01.translate.006
  lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
  type: translation
  frame:
    text: Secondo me il nuovo parco per cani è una buona idea, perché i cani hanno bisogno di spazio per correre.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_opinion
  answer_derivation:
    kind: render_frame
    frame:
      text: In my {item}, the new dog park is a good idea because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: In my opinion sta all'inizio della frase ed è separato dal resto con una virgola.
    language_code: it
    direction: ltr
