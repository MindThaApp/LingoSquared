  answer_derivation:
    kind: render_frame
    frame:
      text: It's just two {item} from here.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Minutes è il plurale di minute; dopo il numero two c'è il plurale.
    language_code: it
    direction: ltr
