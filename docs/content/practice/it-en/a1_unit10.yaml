    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Can't è la forma abbreviata di cannot; You can't miss it significa che è impossibile non vedere la destinazione.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit10.lesson03.choose.003
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
