  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: At the corner significa all'angolo; con at si indica il punto in cui si gira.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit10.lesson02.fill.008
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
