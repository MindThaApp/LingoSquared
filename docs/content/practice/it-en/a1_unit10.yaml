templates:
- content_key: practice.it-en.en.a1.unit10.lesson01.choose.001
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Turn left e turn right sono forme imperative senza you; in italiano corrispondono a «giri a sinistra» o «gira a sinistra».
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit10.lesson02.choose.002
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
