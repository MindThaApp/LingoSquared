  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'First e second sono numeri ordinali; stanno con the davanti al nome: the first street.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit10.lesson01.order.004
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: word_order
  frame:
    text: Turn {item} at the corner.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Turn {item} at the corner.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Left e right stanno senza articolo dopo Turn; con on the davanti descrivono invece un lato: on the left.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit10.lesson02.order.005
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
