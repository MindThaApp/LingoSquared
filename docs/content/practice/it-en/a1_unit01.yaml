templates:
- content_key: practice.it-en.en.a1.unit01.lesson01.choose.001
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'In inglese non esiste una forma che valga per tutto il giorno come «buongiorno»: si sceglie tra good morning, good afternoon o good evening a seconda dell''ora.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson01.listen.002
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hello è il saluto neutro; good morning, good afternoon e good evening dipendono dall'ora del giorno.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson03.choose.003
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: How are you? è la domanda abituale per sapere come sta qualcuno; suona uguale con gli amici e con gli sconosciuti, perché non c'è distinzione tra tu e Lei.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson03.listen.004
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dopo I'm fine, thanks. spesso segue And you? come domanda di rimando; not bad è una risposta informale e riservata.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson05.choose.005
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Nice to meet you si dice al primo incontro, e la risposta è Nice to meet you too.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson05.listen.006
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: See you later si dice quando si rivedrà la persona nello stesso giorno.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson01.order.007
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: word_order
  frame:
    text: Good {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Good {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Il saluto dipende dall''ora del giorno: morning fino a mezzogiorno circa, afternoon dopo, evening la sera.'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson01.match.008
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Thanks è la forma breve e informale di «grazie»; fine e bad descrivono come si sta.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson03.fill.009
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: fill_in_blank
  frame:
    text: How are {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: In inglese you vale sia per tu sia per Lei, perciò la domanda How are you? resta uguale in ogni situazione.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson03.fill.010
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: fill_in_blank
  frame:
    text: Not {item}, thanks. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Not bad è letteralmente «non male» ed è una risposta modesta e molto usata alla domanda su come si sta.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson03.order.011
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: word_order
  frame:
    text: I'm {item}, thanks.
    language_code: en
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item}, thanks.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I'm è la forma abbreviata di I am; si risponde a How are you? con fine o good.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson05.order.012
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: word_order
  frame:
    text: See you {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: See you {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: See you later è letteralmente «ci vediamo più tardi» e significa «a dopo».
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson05.fill.013
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: fill_in_blank
  frame:
    text: Nice to meet you {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Too va in fondo alla frase e significa «anche»; così si ricambia il saluto Nice to meet you.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson01.translate.014
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Saluto e congedo in inglese dipendono dall'ora del giorno; Goodbye è il congedo neutro.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson03.translate.015
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'La parola not nega ciò che segue: not bad significa «non male», e thanks è la forma informale di «grazie».'
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson03.translate.016
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: translation
  frame:
    text: Come stai? (informale)
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: How are {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: In inglese c'è un solo you per tu e Lei, perciò la frase vale in entrambi i registri.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson05.translate.017
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: translation
  frame:
    text: A dopo.
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: See you {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Con See you la parola per «dopo» diventa il saluto «a dopo».
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a1.unit01.lesson05.translate.018
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il verbo meet significa conoscere o incontrare; have a good day è un cordiale augurio di congedo.
    language_code: it
    direction: ltr
