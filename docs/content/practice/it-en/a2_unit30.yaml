- content_key: practice.it-en.en.a2.unit30.lesson01.choose.001
  lesson_content_key: en.a2.unit30.lesson01.interview_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic:
        - w_experience
        - w_position
        - w_availability
        - w_strength
        - w_requirement
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Experience significa «esperienza professionale», position l'incarico. Availability indica quando puoi iniziare.
    language_code: it
    direction: ltr
