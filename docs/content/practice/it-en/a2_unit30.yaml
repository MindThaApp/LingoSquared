- content_key: practice.it-en.en.a2.unit30.lesson03.translate.016
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: translation
  frame:
    text: Bright Path Marketing cerca un coordinatore di marketing. (forma progressiva)
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_looking
  answer_derivation:
    kind: render_frame
    frame:
      text: Bright Path Marketing is {item} for a marketing coordinator.
      language_code: en
      direction: ltr
  feedback_frame:
    text: La forma progressiva is looking for corrisponde all'italiano «cerca». Il for fa parte di look for.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a2.unit30.lesson03.translate.017
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: translation
  frame:
    text: Rispetto le scadenze e lavoro bene in squadra. (non usare forme abbreviate)
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_well
  answer_derivation:
    kind: render_frame
    frame:
      text: I meet deadlines, and I work {item} in a team.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Well è l''avverbio di good: I work well. Dopo work non si usa l''aggettivo.'
    language_code: it
    direction: ltr
