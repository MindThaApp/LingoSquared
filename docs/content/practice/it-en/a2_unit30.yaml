- content_key: practice.it-en.en.a2.unit30.lesson02.translate.010
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: translation
  frame:
    text: Ho due anni di esperienza nel marketing sui social media. (scrivi il numero in lettere)
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_two
  answer_derivation:
    kind: render_frame
    frame:
      text: I have {item} years of experience in social media marketing.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Dopo two years è al plurale. Con of experience in indichi l'ambito.
    language_code: it
    direction: ltr
- content_key: practice.it-en.en.a2.unit30.lesson02.translate.011
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: translation
  frame:
    text: Uno dei miei punti di forza è essere ben organizzato.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_being
  answer_derivation:
    kind: render_frame
    frame:
      text: One of my strengths is {item} organized.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Dopo is qui c''è being, perché «essere» indica un''attività: One of my strengths is being organized.'
    language_code: it
    direction: ltr
