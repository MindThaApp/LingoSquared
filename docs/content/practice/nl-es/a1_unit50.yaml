  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: fill_in_blank
  frame:
    text: Tomamos un café en el café de {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_idiomas
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_idiomas
  answer_derivation:
