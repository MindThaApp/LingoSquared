schema_version: '1.0'
pack_key: practice.nl-es.a1.unit50
source_language: nl
target_language: es
unit_content_key: es.a1.unit50.plans
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dutch). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_actividad
    - w_breve
    - w_cine
    - w_cita
    - w_ganas
    - w_idiomas
    - w_invitación
    - w_plan
    - w_proponer
    - w_puede
    - w_quedamos
    - w_quedar
    - w_rechazo
    - w_saludo
    - w_tomamos
    - w_tomar
    - w_viene
templates:
- content_key: practice.nl-es.es.a1.unit50.lesson01.choose.001
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_tomamos
        - w_tomar
        - w_cine
        - w_proponer
        - w_actividad
        - w_ganas
        - w_plan
        - w_breve
        - w_rechazo
        - w_quedar
        - w_quedamos
        - w_cita
        - w_viene
        - w_invitación
        - w_idiomas
        - w_saludo
        - w_puede
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over een activiteit voorstellen.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit50.lesson02.listen.001
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over een plan accepteren of afslaan.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit50.lesson03.translate.001
  lesson_content_key: es.a1.unit50.lesson03.quedar_un_dia_y
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over een dag en tijd afspreken.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit50.lesson04.match.001
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Koppel elk Spaans woord aan de Nederlandse betekenis; de woorden komen uit de lessen van deze unit.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit50.lesson06.choose.001
  lesson_content_key: es.a1.unit50.lesson06.elena_y_mateo_hacen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les waarin Elena en Mateo een plan maken.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit50.lesson01.translate.002
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over een activiteit voorstellen.'
    language_code: nl
