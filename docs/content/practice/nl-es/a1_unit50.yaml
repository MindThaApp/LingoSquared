- content_key: practice.nl-es.es.a1.unit50.lesson01.order.003
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: word_order
  frame:
    text: ¿Tienes ganas de ir al {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_cine
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Tienes ganas de ir al {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Heb je zin om naar de film te gaan? Met ¿Tienes ganas de ...? vraag je informeel of iemand zin heeft om iets te doen; na de volgt een infinitief.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit50.lesson02.order.002
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: word_order
  frame:
    text: Es un buen {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_plan
  answer_derivation:
    kind: render_frame
    frame:
      text: Es un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Dat is een goed plan. Dit is een iets uitgebreidere positieve reactie.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit50.lesson02.fill.003
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: fill_in_blank
  frame:
    text: Lo siento + no puedo + una razón {item} hace amable un rechazo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_breve
    hint:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_breve
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lo siento + no puedo + een korte reden maakt een weigering vriendelijk. In een gesprek is een reden niet verplicht, maar zo is het voorbeeld bruikbaar en beleefd.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit50.lesson03.order.002
  lesson_content_key: es.a1.unit50.lesson03.quedar_un_dia_y
  type: word_order
  frame:
    text: Sí, el viernes a las dos y media me {item} bien.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_viene
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, el viernes a las dos y media me {item} bien.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ja, vrijdag om 2:30 komt goed uit. Met me viene bien ("het komt me goed uit") bevestig je dat de voorgestelde tijd past.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit50.lesson04.order.002
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: word_order
  frame:
