      text: Lo logramos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: We hebben het samen gedaan. Lograr betekent iets voor elkaar krijgen of bereiken.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson06.listen.002
  lesson_content_key: es.a1.unit12.lesson06.el_pastel_se_quema_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¡Ay, no! is de natuurlijke reactie als er iets misgaat.
    language_code: nl
    direction: ltr
