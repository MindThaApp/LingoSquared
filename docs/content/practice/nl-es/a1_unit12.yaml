  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'De tekst loopt door de tijd: antes (voor), durante (tijdens), al final (uiteindelijk), ahora (nu).'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson05.translate.002
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
