templates:
- content_key: practice.nl-es.es.a1.unit12.lesson01.choose.001
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Bijvoeglijke naamwoorden voor gevoelens eindigen op -o voor een man en op -a voor een vrouw: nervioso, nerviosa.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson01.listen.002
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: listen_select
  frame:
