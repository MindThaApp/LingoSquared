  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Voor een groep met ten minste één man krijgt het bijvoeglijk naamwoord -os: nerviosos, contentos.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson06.order.001
  lesson_content_key: es.a1.unit12.lesson06.el_pastel_se_quema_dialogue
  type: word_order
  frame:
