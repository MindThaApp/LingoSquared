    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Aan de laatste klinker hoor je of de spreker een man (-o) of een vrouw (-a) bedoelt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson01.match.003
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Contento betekent blij of tevreden over iets; het wordt gebruikt met estar.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson01.order.004
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: word_order
  frame:
    text: Hoy Mateo está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy Mateo está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Gevoelens gebruiken estar, omdat ze kunnen veranderen: Mateo está nervioso hoy.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson01.order.005
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: word_order
  frame:
    text: Hoy Elena está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy Elena está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Elena is een vrouw, dus het bijvoeglijk naamwoord eindigt op -a: Elena está cansada.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson03.order.001
  lesson_content_key: es.a1.unit12.lesson03.como_te_sientes
  type: word_order
  frame:
    text: Me {item} un poco nervioso.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Me {item} un poco nervioso.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Ik voel me een beetje nerveus. Sentirse gebruikt me, te, se: me siento, te sientes.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson03.translate.002
  lesson_content_key: es.a1.unit12.lesson03.como_te_sientes
  type: translation
  frame:
    text: Hoe voel je je? (informeel)
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo te {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Met usted wordt de vraag ¿Cómo se siente?
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson04.fill.001
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: fill_in_blank
  frame:
    text: No te {item}, podemos empezar de nuevo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'No te preocupes is de vaste manier om tegen een vriend(in) te zeggen: maak je geen zorgen.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson04.translate.002
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: translation
  frame:
    text: Er brandt iets aan!
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Algo se {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Het Spaans gebruikt de gewone tegenwoordige tijd voor wat nu gebeurt: algo se quema.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson04.order.003
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: word_order
  frame:
    text: Podemos {item} de nuevo.
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Podemos {item} de nuevo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: We kunnen opnieuw beginnen. De nuevo betekent opnieuw, net als otra vez.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit12.lesson05.choose.001
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
