  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: word_order
  frame:
    text: ¿Cuánto cuesta en {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_total
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto cuesta en {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Hoeveel kost het in totaal? En total maakt duidelijk dat je de volledige prijs alles bij elkaar bedoelt, niet de prijs van één product.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit45.lesson01.fill.003
  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
