    text: Cuesta veinticinco {item} en total. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_euros
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_euros
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Het kost in totaal vijfentwintig euro. Cuesta is de derde persoon enkelvoud van costar (kosten); de stamklinker verandert van o in ue wanneer die beklemtoond is.
    language_code: nl
    direction: ltr
