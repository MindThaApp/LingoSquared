  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Comida betekent zowel „eten” als „de middagmaaltijd”, de hoofdmaaltijd van de dag in Spanje.
    language_code: nl
    direction: ltr
