    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Het Spaanse menú del día is een vaste lunch: voorgerecht, hoofdgerecht, postre en meestal brood en een drankje, voor één prijs.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit06.lesson06.translate.001
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
