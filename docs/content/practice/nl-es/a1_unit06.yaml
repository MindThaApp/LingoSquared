templates:
- content_key: practice.nl-es.es.a1.unit06.lesson01.choose.001
  lesson_content_key: es.a1.unit06.lesson01.comida_y_bebida
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Agua is vrouwelijk, maar krijgt in het enkelvoud el omdat het met een beklemtoonde a begint: el agua fría.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit06.lesson01.listen.002
  lesson_content_key: es.a1.unit06.lesson01.comida_y_bebida
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Café, menú en sándwich hebben een geschreven accent; het accent geeft de beklemtoonde lettergreep aan.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit06.lesson02.order.001
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: word_order
  frame:
    text: Quiero un {item}, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Un hoort bij mannelijke woorden (un café); vrouwelijke woorden krijgen una (una ensalada).
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit06.lesson02.translate.002
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: translation
  frame:
    text: Ik wil graag een {item}.
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Een andere gebruikelijke manier om te bestellen is para mí + het gerecht: para mí, un café.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit06.lesson02.fill.003
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: fill_in_blank
  frame:
    text: ¿Qué {item} comer? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Querer verandert in de stam: quiero, quieres, quiere, maar queremos.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit06.lesson03.order.001
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: word_order
  frame:
    text: ¿Podemos ver el {item}?
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Podemos ver el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Kunnen we het menu zien? ¿Podemos + infinitief? is een beleefde manier om iets te vragen.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit06.lesson03.translate.002
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: translation
  frame:
    text: Eet smakelijk!
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buen {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: Buen provecho zeg je tegen mensen die gaan eten, zelfs tegen onbekenden aan de tafel naast je.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit06.lesson04.fill.001
  lesson_content_key: es.a1.unit06.lesson04.postre_y_la_cuenta
  type: fill_in_blank
  frame:
    text: La {item}, por favor. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: In Spanje wacht de ober meestal tot jij om de rekening vraagt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit06.lesson04.translate.002
  lesson_content_key: es.a1.unit06.lesson04.postre_y_la_cuenta
  type: translation
  frame:
    text: Als nagerecht wil ik taart.
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: De postre quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De postre betekent „als dessert”; hier is geen lidwoord nodig voor pastel.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit06.lesson05.match.001
  lesson_content_key: es.a1.unit06.lesson05.leer_el_menu
  type: matching_pairs
