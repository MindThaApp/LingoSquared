templates:
- content_key: practice.nl-es.es.a1.unit03.lesson01.choose.001
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Familiewoorden komen vaak in paren naar geslacht: hermano en hermana, hijo en hija.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit03.lesson01.listen.002
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Het mannelijke meervoud geldt ook voor gemengde groepen: padres zijn ouders, hermanos kunnen broers en zussen zijn.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit03.lesson01.translate.003
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mamá en papá zijn de gewone woorden thuis; madre en padre zijn neutraal.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit03.lesson02.order.001
  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: word_order
  frame:
    text: Mi familia es {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi familia es {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Familia is vrouwelijk, dus klein is pequeña; grande blijft voor beide geslachten gelijk.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit03.lesson02.translate.002
  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: translation
  frame:
    text: Ik heb twee zussen.
    language_code: nl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo dos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Als je het vraagt: ¿Tienes hermanos? gebruikt het mannelijke meervoud, dat zowel broers als zussen omvat.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit03.lesson03.choose.001
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: multiple_choice
