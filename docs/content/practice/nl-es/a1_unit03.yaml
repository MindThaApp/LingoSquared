    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Somos en son komen allebei van ser: we zijn, zij zijn.'
    language_code: nl
    direction: ltr
