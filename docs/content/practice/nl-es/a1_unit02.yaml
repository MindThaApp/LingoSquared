templates:
- content_key: practice.nl-es.es.a1.unit02.lesson01.choose.001
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Uno wordt un voor een mannelijk zelfstandig naamwoord (un huevo) en una voor een vrouwelijk (una taza).
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson01.listen.002
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Seis heeft één lettergreep, siete heeft er twee (sie-te); luister goed naar de t.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson02.match.001
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Elf tot en met vijftien hebben eigen woorden (once, doce, trece, catorce, quince); vanaf zestien zijn ze gebouwd op diez: dieciséis.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson02.translate.002
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cien is precies honderd; daarboven zegt het Spaans ciento: ciento uno.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson03.order.001
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: Tengo {age} años.
    language_code: es
    direction: ltr
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'In het Spaans geef je je leeftijd aan met tener, ''hebben'': je hebt jaren, in plaats van ze te zijn.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson03.translate.002
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: Ik ben {age} jaar oud.
    language_code: nl
    direction: ltr
    slot_rendering:
      age: english_gloss
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Gebruik nooit soy voor leeftijd: Tengo veinte años, niet Soy veinte.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson03.fill.003
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: fill_in_blank
  frame:
    text: ¿Cuántos años {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Met usted wordt de vraag ¿Cuántos años tiene usted?
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson04.choose.001
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Telefoonnummers worden in het Spaans vaak in paren uitgesproken: 62 41 ... als sesenta y dos, cuarenta y uno.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson04.order.002
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: word_order
  frame:
    text: ¿Puedes {item}, por favor?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedes {item}, por favor?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Puedes + infinitief gebruik je om een vriend(in) iets te vragen; met usted is het ¿Puede repetir, por favor?
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson04.translate.003
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Por favor (alsjeblieft) en claro (natuurlijk) zijn twee van de nuttigste woorden in elk gesprek.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson05.choose.001
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Hoeveelheden koppel je met de a de ingrediënt met de: dos tazas de harina.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson05.translate.002
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Spaanse meervouden krijgen -s na een klinker (taza, tazas) en -es na een medeklinker.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson05.translate.003
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: Ik heb drie {item} nodig.
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Necesito tres {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Necesito, 'ik heb nodig', komt van necesitar; om het aan iemand anders te vragen gebruik je ¿Cuántos necesitas?
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson05.fill.004
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: fill_in_blank
  frame:
    text: Media taza de {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Taza is vrouwelijk, dus een halve kop is media taza; bij een mannelijk zelfstandig naamwoord is het medio: medio kilo.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson06.listen.001
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Oye is een vriendelijke manier om iemands aandacht te trekken, zoals 'hé' of 'hoor eens' in het Nederlands.
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson06.translate.002
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: translation
  frame:
    text: Nog één vraag.
    language_code: nl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Una {item} más.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Más staat meestal achter het zelfstandig naamwoord: una pregunta más, nog één vraag.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-es.es.a1.unit02.lesson06.match.003
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Tengo, tienes en tiene zijn allemaal vormen van tener: ik heb, jij hebt, hij of zij heeft.'
    language_code: nl
    direction: ltr
