schema_version: '1.0'
pack_key: practice.nl-es.a1.unit47
source_language: nl
target_language: es
unit_content_key: es.a1.unit47.communication
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dutch). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_contarte
    - w_devuelvo
    - w_envío
    - w_esperado
    - w_esperar
    - w_hables
    - w_hablo
    - w_llamada
    - w_llamarme
    - w_llamarte
    - w_mensaje
    - w_minutos
    - w_oigo
    - w_oír
    - w_rápido
    - w_significa
    - w_turno
templates:
- content_key: practice.nl-es.es.a1.unit47.lesson01.choose.001
  lesson_content_key: es.a1.unit47.lesson01.te_llamo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_llamarte
        - w_hablo
        - w_hables
        - w_rápido
        - w_oigo
        - w_mensaje
        - w_envío
        - w_llamarme
        - w_contarte
        - w_devuelvo
        - w_llamada
        - w_minutos
        - w_turno
        - w_esperado
        - w_esperar
        - w_oír
        - w_significa
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over ik bel je.'
    language_code: nl
    direction: ltr
