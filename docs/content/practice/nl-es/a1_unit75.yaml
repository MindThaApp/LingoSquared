  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_visitar
        - w_exposición
        - w_visito
        - w_cerrar
        - w_guía
        - w_falta
        - w_cuadro
        - w_cuadros
        - w_concierto
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over ik wil naar het museum gaan.'
    language_code: nl
    direction: ltr
