schema_version: '1.0'
pack_key: practice.nl-es.a1.unit55
source_language: nl
target_language: es
unit_content_key: es.a1.unit55.vervoer
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dutch). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_andando
    - w_bici
    - w_camina
    - w_caminar
    - w_centro
    - w_coche
    - w_compro
    - w_conduce
    - w_conducir
    - w_estación
    - w_normalmente
    - w_prefiere
    - w_transporte
    - w_vas
    - w_viaja
    - w_viajar
    - w_viajas
    - w_viajo
templates:
- content_key: practice.nl-es.es.a1.unit55.lesson01.choose.001
  lesson_content_key: es.a1.unit55.lesson01.el_tren_la_bici
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_bici
        - w_viaja
        - w_coche
        - w_caminar
        - w_conduce
        - w_camina
        - w_viajar
        - w_viajas
        - w_viajo
        - w_transporte
        - w_estación
        - w_compro
        - w_centro
        - w_vas
        - w_normalmente
        - w_prefiere
        - w_conducir
        - w_andando
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over de trein, de fiets, de auto en lopen.'
    language_code: nl
    direction: ltr
