schema_version: '1.0'
pack_key: practice.nl-es.a1.unit05
source_language: nl
target_language: es
unit_content_key: es.a1.unit05.time
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dutch). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - es_a1_u05
    - es_a1_u05_l06
    - w_hora
    - w_cuarto
    - w_menos
    - w_tarde
    - w_mañana
    - w_noche
    - w_acuerdo
    - w_siguiente
    - w_idea
    - w_restaurante
slot_presets:
  content: &id002
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u05
  words: &id008
    language_code: es
    part_of_speech:
    - noun
    - adjective
    - adverb
    - verb
    agreement_tags:
      semantic: es_a1_u05
  dialogue: &id012
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u05_l06
  hora: &id001
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_hora
  cuarto: &id003
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_cuarto
  menos: &id004
    language_code: es
    part_of_speech: adverb
    agreement_tags:
      semantic: w_menos
  tarde: &id006
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_tarde
  part_of_day: &id005
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic:
      - w_mañana
      - w_noche
  acuerdo: &id007
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_acuerdo
