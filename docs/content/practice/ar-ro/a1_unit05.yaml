      direction: ltr
  feedback_frame:
    text: 'تتوافق كلمة الملكية مع الاسم: mama mea (مؤنث) لكن tatăl meu (مذكر).'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit05.lesson01.fill.006
