    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Am o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fiică مؤنث فتأخذ o؛ والابن هو un fiu.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit05.lesson02.translate.008
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: كم طفلًا لديك؟ (غير رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți {item} ai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Câți هي صيغة الجمع المذكر لـ«كم عدد» وتُستعمل مع copii، جمع copil.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit05.lesson03.translate.001
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: translation
  frame:
    text: هل لديكم إخوة يا ميهاي؟ (رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aveți {item}, Mihai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Aveți هي صيغة المخاطبة المهذبة لفعل «لدى»؛ ومع صديق تسأل: Ai frați?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit05.lesson03.order.002
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: word_order
  frame:
    text: Da, am un frate și o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, am un frate și o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un frate مذكر وo soră مؤنث؛ والجملة جواب عن Aveți frați?
    language_code: ar
    direction: rtl
