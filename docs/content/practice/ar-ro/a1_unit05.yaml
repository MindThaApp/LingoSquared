    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mamă وtată اسمان بلا أداة تعريف؛ أما mama وtatăl فتُضاف إليهما أداة التعريف في آخرهما.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit05.lesson01.translate.004
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
