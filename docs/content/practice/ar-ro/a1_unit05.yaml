templates:
- content_key: practice.ar-ro.ro.a1.unit05.lesson01.choose.001
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تعني meu وmea كلتاهما «ي» الملكية: تُستعمل meu مع الأسماء المذكرة والمحايدة (tatăl meu) وmea مع المؤنثة (mama mea).'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit05.lesson01.listen.002
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Părinți تعني الوالدين وهي جمع؛ والوالدان هما mamă وtată.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit05.lesson01.match.003
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
