    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tatăl مذكر فيأخذ meu؛ وmama مؤنث فتأخذ mea.
    language_code: ar
    direction: rtl
