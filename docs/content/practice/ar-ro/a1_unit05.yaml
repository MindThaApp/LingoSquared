    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تضع الرومانية أداة التعريف في آخر الاسم: تصبح mamă ‏mama وتصبح tată ‏tatăl.'
    language_code: ar
    direction: rtl
