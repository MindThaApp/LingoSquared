    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'لا تبدأ أسماء الأشهر بحرف كبير في الرومانية أبدًا: ianuarie, februarie, martie.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson02.translate.003
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تبدو عدة أشهر (februarie, septembrie) قريبة من نظائرها الأوروبية لكنها تُكتب بحرف صغير.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson02.order.004
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: word_order
  frame:
    text: Astăzi este trei {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este trei {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'التاريخ هو عدد + شهر: trei aprilie. أما أول الشهر فيُستخدم له întâi وليس unu.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson02.translate.005
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: اليوم هو الأول من أغسطس.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este întâi {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'أول الشهر هو întâi وليس unu: întâi august؛ ومن اليوم الثاني فصاعدًا يُستخدم العدد العادي.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson02.fill.006
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: fill_in_blank
  frame:
    text: La {item} ani! ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La mulți ani! تعني حرفيًا «لسنوات عديدة»؛ وهي تهنئة بعيد ميلاد سعيد أو بسنة جديدة سعيدة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson02.translate.007
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: ما تاريخ اليوم؟
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} este astăzi?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce dată este astăzi? يسأل عن التاريخ؛ وCe zi este astăzi? يسأل عن يوم الأسبوع.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson03.order.001
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: word_order
  frame:
    text: Mihai, {item} este întâlnirea?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai, {item} este întâlnirea?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Când? يسأل عن الوقت؛ ويذكر الجواب يوم الأسبوع والتاريخ دون حرف جر: vineri, întâi august.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson03.translate.002
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: translation
  frame:
    text: متى الاجتماع؟
    language_code: ar
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Când este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'لا تحتاج الأيام والتواريخ إلى حرف جر: Întâlnirea este vineri, întâi august.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson03.choose.003
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lunile تعني الأشهر: luni جمع lună مع أداة التعريف -le؛ وكلمة luni وحدها تعني أيضًا يوم الاثنين.'
    language_code: ar
    direction: rtl
