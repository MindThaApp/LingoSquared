templates:
- content_key: practice.ar-ro.ro.a1.unit03.lesson01.choose.001
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تُكتب أيام الأسبوع والأشهر في الرومانية بحرف صغير: luni, vineri وليس Luni, Vineri.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson01.listen.002
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sâmbătă هو السبت وduminică هو الأحد؛ كل يوم كلمة واحدة ولا تبدأ أي منها بحرف كبير.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson01.match.003
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: من luni إلى sâmbătă ستة من الأيام السبعة، وduminică، أي الأحد، تُكمل الأسبوع.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson01.translate.004
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Astăzi تعني اليوم وmâine تعني غدًا، وieri تعني أمس.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson01.order.005
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: word_order
  frame:
    text: Ce {item} este astăzi?
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} este astăzi?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Ce zi este astăzi? يسأل عن يوم الأسبوع؛ وللإجابة استخدم Astăzi este + اليوم: Astăzi este vineri.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson01.translate.006
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: translation
  frame:
    text: اليوم هو الجمعة.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'تبدأ أيام الأسبوع بحرف صغير في الرومانية: vineri وليس Vineri.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson01.fill.007
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: fill_in_blank
  frame:
    text: Zilele nu se scriu cu {item} mare. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Literă mare تعني حرفًا كبيرًا؛ وتكتب الرومانية الأيام والأشهر بحرف صغير.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson02.choose.001
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تشبه أسماء الأشهر نظائرها في كثير من اللغات الأوروبية لكنها تُكتب بحرف صغير: aprilie, iulie.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit03.lesson02.match.002
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
