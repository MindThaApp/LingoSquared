templates:
- content_key: practice.ar-ro.ro.a1.unit04.lesson01.choose.001
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jumătate تعني النصف وun sfert تعني الربع، وكلتاهما ترتبط بالساعة بـ și.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson01.listen.002
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cât este ora? سؤال عن الوقت، والجواب: Este ora + العدد.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson01.match.003
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ora هي الساعة أو الوقت على الساعة؛ وfără وși تقدّمان الوقت أو تؤخّرانه.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson01.order.004
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: word_order
  frame:
    text: Este {item} unu.
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Este {item} unu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'بعد ora نستعمل unu للواحد وdouă للاثنين: ora unu، ora două.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson01.fill.005
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: fill_in_blank
  frame:
    text: Este ora unu și {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Și jumătate تضيف ثلاثين دقيقة: ora unu și jumătate هي الواحدة والنصف.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson01.translate.006
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: translation
  frame:
    text: كم الساعة الآن؟
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Cât este ora? تعني حرفيًا «كم هي الساعة؟»، والجواب: Este ora + العدد.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson01.translate.007
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fără تعني عادةً «بدون»، لكنها في قول الوقت تعني مع un sfert «إلا ربعًا».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson02.translate.001
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: translation
  frame:
    text: الساعة الثانية والربع.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Este ora două și un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Și un sfert تضيف خمس عشرة دقيقة، وfără un sfert تطرحها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson02.fill.002
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: fill_in_blank
  frame:
    text: Este ora trei {item} un sfert. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Fără un sfert تطرح خمس عشرة دقيقة: ora trei fără un sfert هي 2:45.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson02.translate.003
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: translation
  frame:
    text: في أي ساعة؟
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: La ce {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'La ce oră? سؤال عن موعد حدوث شيء، والجواب la ora + العدد: la ora nouă.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson02.order.004
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: word_order
  frame:
    text: Este ora trei fără un {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Este ora trei fără un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sfert اسم محايد ويأخذ un في المفرد؛ وعبارة الساعة تعدّ تنازليًا من الساعة التالية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson03.choose.001
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dimineața وseara وnoaptea هي أجزاء اليوم، وتنتهي بـ a- لأنها تحمل أداة التعريف.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson03.listen.002
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cursul هو الدرس؛ والفعل «يبدأ» هو începe، ويُستعمل للدروس والأحداث معًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson03.order.003
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: word_order
  frame:
    text: Cursul {item} la ora nouă.
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul {item} la ora nouă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Începe هي صيغة الغائب أو الغائبة من فعل «بدأ»، وتوافق الفاعل المفرد cursul.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson03.translate.004
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: translation
  frame:
    text: يبدأ الدرس في الساعة التاسعة صباحًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul începe la ora nouă, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'أضف جزء اليوم بعد الوقت: la ora nouă, dimineața أو la ora nouă, seara.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit04.lesson03.fill.005
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: fill_in_blank
  frame:
    text: Când începe {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Când începe cursul? سؤال عن موعد بدء الدرس، والجواب: Cursul începe la ora nouă.'
    language_code: ar
    direction: rtl
