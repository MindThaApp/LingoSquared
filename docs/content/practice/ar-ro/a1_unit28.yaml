    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit28.lesson04.match.001
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: طابق كل كلمة رومانية بمعناها العربي؛ الكلمات مأخوذة من دروس هذه الوحدة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit28.lesson05.choose.001
  lesson_content_key: ro.a1.unit28.lesson05.citim_o_conversatie_prin
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} من كلمات هذه الوحدة، من درس قراءة تبادل الرسائل النصية.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit28.lesson06.translate.001
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} من كلمات هذه الوحدة، من درس مكالمة هاتفية بعد المناوبة.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit28.lesson01.order.002
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: word_order
  frame:
    text: Trebuie să te {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_sun
  answer_derivation:
    kind: render_frame
    frame:
      text: Trebuie să te {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: يجب أن أتصل بك. sun تعني «أتصل».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit28.lesson02.order.002
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: word_order
  frame:
    text: Cu cine {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbesc
  answer_derivation:
    kind: render_frame
    frame:
      text: Cu cine {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: مع من أتحدث؟ Cu cine vorbesc? (حرفيًا «مع من أتحدث؟») هي الطريقة المعتادة لسؤال المتصل الغريب عن هويته.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit28.lesson03.order.002
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: word_order
  frame:
    text: Poți să {item} asta?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_repeți
  answer_derivation:
    kind: render_frame
    frame:
      text: Poți să {item} asta?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: هل يمكنك أن تعيد ذلك؟ Poți să ... (هل يمكنك أن ...؟) ثم repeți (تعيد) ثم asta (هذا).
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit28.lesson03.fill.003
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: fill_in_blank
  frame:
    text: Nu {item} atât de repede, te rog. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: من فضلك، لا تتكلم بهذه السرعة. Nu vorbi («لا تتكلم») تتكون من nu + صيغة tu؛ و atât de repede تعني «بهذه السرعة».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit28.lesson03.translate.004
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: لا أسمعك جيداً.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_aud
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu te {item} bine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'لا أسمعك جيدًا. Nu te aud bine: aud تعني «أسمع»، و te («ك») تأتي قبل الفعل، و bine تعني «جيدًا».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit28.lesson04.order.002
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: word_order
  frame:
    text: Îți {item} un mesaj.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_trimit
  answer_derivation:
    kind: render_frame
    frame:
      text: Îți {item} un mesaj.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'سأرسل لك رسالة نصية. Îți («لك») ضمير غير مباشر يوضع قبل الفعل: Îți trimit un mesaj.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit28.lesson04.fill.003
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: fill_in_blank
  frame:
    text: Te sun {item} mai târziu. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'سأعاود الاتصال بك لاحقًا. Înapoi («مرة أخرى») تأتي بعد الفعل: te sun înapoi تعني «سأعاود الاتصال بك»، و mai târziu تعني «لاحقًا».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit28.lesson06.order.002
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: word_order
  frame:
    text: A {item} foarte bine, mai bine decât credeam.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_mers
  answer_derivation:
    kind: render_frame
    frame:
      text: A {item} foarte bine, mai bine decât credeam.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: سارت الأمور جيدًا جدًا، أفضل مما كنت أظن. A mers هو الماضي من a merge (يذهب، وهنا «يسير/تنتهي الأمور»)، و credeam تعني «كنت أظن» (صيغة ماضية من a crede).
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit28.lesson06.fill.003
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: fill_in_blank
  frame:
    text: Îți mulțumesc, {item} mult pentru mine. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: شكرًا لك، هذا يعني لي الكثير. Înseamnă هي صيغة الغائب المفرد من a însemna (يعني)، و pentru mine («بالنسبة لي») تبيّن لمن يهم الأمر.
    language_code: ar
    direction: rtl
