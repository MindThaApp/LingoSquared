    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني Aș dori «أود»، ويأتي المشروب بعدها، مع o أو un قبله عند طلب فنجان أو كوب واحد.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson01.order.005
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: word_order
  frame:
    text: Aș dori o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'cafea مؤنثة، لذا تأخذ o: o cafea. أما كوب الشاي فهو un ceai.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson01.fill.006
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: fill_in_blank
