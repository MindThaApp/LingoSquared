    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ceai يأخذ un وليس o: un ceai. قارن مع o cafea.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson01.translate.007
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: أود فنجان قهوة.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aș dori مهذبة وتصلح مع tu ومع dumneavoastră على حد سواء، وcafea تأخذ o.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson01.translate.008
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: أنا عطشان.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi-e {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: تقول Mi-e sete حرفيًا إن العطش لي، وMi-e foame تعمل بالطريقة نفسها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson02.choose.001
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تعني Foame «الجوع»، وتقول Mi-e foame لتعني «أنا جائع»، كما في Mi-e sete.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson02.listen.002
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mâncare تعني الطعام عمومًا، أما pâine وcarne وpui وfructe فهي أشياء محددة للأكل.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson02.match.003
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Fructe جمع وتعني الفاكهة عمومًا، أما pâine وcarne وmâncare فهي مفردة ومؤنثة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson02.translate.004
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mâncare هي الكلمة العامة للطعام، وcarne تعني اللحم؛ وpui تعني الدجاج، وfructe تعني الفاكهة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson02.order.005
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: word_order
  frame:
    text: Aș dori {item} și pui.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item} și pui.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'لا يحتاج الخبز هنا إلى o ولا إلى un: Aș dori pâine și pui، مثل Aș dori apă.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson02.fill.006
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Mi-e foame (أنا جائع) تعبير ثابت: يأتي الشعور بعد mi-e.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson02.fill.007
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e foame. Aș dori {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني Pui الدجاج، وهي الكلمة التي تستخدمها في قائمة الطعام أو في المتجر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson02.translate.008
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: أود شايًا، من فضلك. (بصيغة رسمية، لمن تخاطبه بـ dumneavoastră)
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori un ceai, vă {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă rog هي «من فضلك» المهذبة لمن تخاطبه بـ dumneavoastră؛ أما مع الصديق فتقول te rog.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit06.lesson02.translate.009
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: أود بعض الفاكهة.
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fructe جمع، لذلك لا تأتي قبلها o ولا un.
    language_code: ar
    direction: rtl
