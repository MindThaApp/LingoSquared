    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'بعد الأعداد من اثنين إلى تسعة عشر لا تأتي de مع الجمع lei: opt lei. ومن العشرين فما فوق تظهر: treizeci de lei.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit07.lesson01.fill.005
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
