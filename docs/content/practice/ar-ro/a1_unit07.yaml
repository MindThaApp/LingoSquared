    text: 'بين وحدة القياس والشيء المقيس تضع الرومانية de: un kilogram de roșii.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit07.lesson02.order.006
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
