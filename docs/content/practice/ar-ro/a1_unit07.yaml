    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cât costă? هو السؤال الأساسي عن السعر؛ وcostă صيغة الفعل مع الغائب.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit07.lesson01.translate.006
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
