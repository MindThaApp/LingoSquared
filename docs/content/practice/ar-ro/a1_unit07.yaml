    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vreau تعني «أريد»، وunde تعني «أين»، وpot تعني «أستطيع» في Unde pot...?
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit07.lesson02.listen.003
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cumpăr تعني «أشتري»؛ ومع pot تضاف să: pot să cumpăr أي «أستطيع أن أشتري».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit07.lesson02.translate.004
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
