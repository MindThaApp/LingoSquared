    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cartofi جمع؛ وبعد un kilogram de يبقى الشيء المقيس بصيغة الجمع.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit07.lesson02.translate.008
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: أين أستطيع أن أشتري الطماطم؟
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să cumpăr {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Roșii جمع، لذلك لا يأتي قبلها un ولا o؛ وpot să cumpăr تعني «أستطيع أن أشتري».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit07.lesson02.translate.009
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: أريد كيلوغرامًا من البطاطا.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Vreau un kilogram de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un kilogram de مع جمع cartofi يحدد الكمية والشيء معًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit07.lesson02.translate.010
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: كم يكلّف كيلوغرام من الطماطم؟
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un kilogram de {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât costă يسأل عن السعر؛ والمفرد costă يناسب كيلوغرامًا واحدًا.
    language_code: ar
    direction: rtl
