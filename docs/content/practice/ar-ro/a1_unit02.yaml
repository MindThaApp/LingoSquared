    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson03.order.001
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Am {item} ani.
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'من اثنين إلى تسعة عشر لا تُستعمل de: am nouăsprezece ani. ومن عشرين فما فوق تظهر: am treizeci de ani.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson02.translate.005
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: translation
  frame:
    text: عمري ثلاثون عامًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} de ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'من عشرين فصاعدًا يتبع العدد de قبل الاسم: treizeci de ani.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson03.choose.002
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ai صيغة tu من فعل «يملك»، وaveți صيغة dumneavoastră: Câți ani ai? أو Câți ani aveți?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson03.fill.003
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: fill_in_blank
  frame:
    text: Am treizeci {item} ani. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تظهر De بعد الأعداد من عشرين فما فوق: treizeci de ani، لكن nouăsprezece ani.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson03.translate.004
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: كم عمرك؟ (بصيغة غير رسمية، لصديق)
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Câți ani ai? تسأل حرفيًا «كم سنةً تملك»: تستعمل الرومانية «يملك» لا «يكون» للتعبير عن العمر.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson03.translate.005
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: كم عمرك؟ (بصيغة رسمية، لشخص تخاطبه بـ dumneavoastră)
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți صيغة التأدب من فعل «يملك»، وتُستعمل مع dumneavoastră.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson03.order.006
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Care e numărul {item} de telefon?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Care e numărul {item} de telefon?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Numărul اسم محايد، والاسم المحايد المفرد يأخذ صيغة المذكر tău؛ والصيغة المؤدبة هي: Care este numărul dumneavoastră de telefon?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson03.translate.007
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تقول الرومانية «لديّ ثلاثون سنة»: am treizeci de ani، وليس «أنا ثلاثون سنة».'
    language_code: ar
    direction: rtl
