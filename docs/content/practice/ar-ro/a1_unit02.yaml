  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
