    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Doi صيغة المذكر للعدد اثنين، وdouă صيغة المؤنث والمحايد؛ أما بقية الأعداد فلا تتغير.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson01.translate.004
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قبل الاسم يتغير «واحد» و«اثنان» بحسب الجنس (un أو o، doi أو două)؛ أما عند العدّ فقط فتقول unu, doi.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson02.choose.001
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'الأعداد من 11 إلى 19 مكوّنة من الوحدة + -sprezece: doisprezece تعني اثنين زائد عشرة.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson02.listen.002
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تنتهي العقود بـ -zeci: douăzeci, treizeci, patruzeci وهكذا حتى nouăzeci.'
    language_code: ar
    direction: rtl
