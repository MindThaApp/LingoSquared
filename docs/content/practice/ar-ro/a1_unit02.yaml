templates:
- content_key: practice.ar-ro.ro.a1.unit02.lesson01.choose.001
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'للعدد اثنين صيغتان: doi مع الأسماء المذكرة وdouă مع الأسماء المؤنثة والمحايدة.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson01.listen.002
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'الأعداد من صفر إلى عشرة هي اللبنات الأساسية: الأعداد من 11 إلى 19 تضيف -sprezece (unsprezece, doisprezece) والعقود تضيف -zeci.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit02.lesson01.match.003
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
