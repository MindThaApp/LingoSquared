templates:
- content_key: practice.ar-ro.ro.a1.unit01.lesson01.choose.001
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'في الرومانية كلمتان لمخاطب الواحد: tu مع الأصدقاء والعائلة، و dumneavoastră مع الغرباء وللتعبير عن الاحترام.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson01.listen.002
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Faceți تأتي مع dumneavoastră و faci تأتي مع tu، فآخر الفعل يدلّ وحده على مستوى الرسمية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson01.match.003
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Bună ziua تقترن بـ dumneavoastră و salut تقترن بـ tu: التحية التي تختارها تحدد مستوى الرسمية في الحديث كله.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson01.translate.004
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mulțumesc هي كلمة الشكر اليومية، وتصلح مع tu ومع dumneavoastră.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson01.order.005
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: word_order
  frame:
    text: Bună {item}!
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Bună {item}!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Bună ziua هي تحية النهار المهذّبة للغرباء؛ ومع الأصدقاء تقول salut.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson01.fill.006
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: fill_in_blank
  frame:
    text: Bine, mulțumesc. Și {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Și dumneavoastră? تعيد السؤال المهذّب إلى محدّثك؛ ومع الصديق تقول Și tu?
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson01.translate.007
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: كيف حالك؟ (غير رسمي، لصديق)
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faci? للصديق (tu)؛ ومع الغريب تقول Ce mai faceți?
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson01.translate.008
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: كيف حالك؟ (رسمي، لشخص تخاطبه بـ dumneavoastră)
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faceți? هو السؤال المهذّب؛ والردّ المهذّب عليه هو Bine, mulțumesc. Și dumneavoastră?
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson02.order.001
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: word_order
  frame:
    text: Mă numesc {name}.
    language_code: ro
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Mă numesc {name}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mă numesc تعني حرفيًا «أسمّي نفسي»؛ أما Mă cheamă فتعني «يدعوني» أي «اسمي».
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson02.fill.002
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: fill_in_blank
  frame:
    text: Îmi {item} bine! ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Îmi pare bine تعني حرفيًا «يبدو لي حسنًا»؛ والردّ عليها هو Și mie îmi pare bine.
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson02.translate.003
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: ما اسمك؟ (غير رسمي، لصديق)
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum te {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cum te cheamă? تستخدم te مع الصديق؛ ومع الغريب تقول Cum vă numiți?
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson02.choose.004
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cum vă numiți? هو السؤال المهذّب عن الاسم ويستخدم vă؛ ومع الصديق يصبح Cum te cheamă?
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson02.listen.005
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Numesc هي صيغة المتكلم (mă numesc) و numiți هي صيغة dumneavoastră (cum vă numiți).
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson02.translate.006
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Și تعني «و»، وتبدأ أيضًا سؤال الإعادة: Și dumneavoastră? أو Și tu?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson02.match.007
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'تضع الرومانية الضمير قبل الفعل في عبارات الاسم هذه: mă numesc, vă numiți, te cheamă.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson03.translate.001
  lesson_content_key: ro.a1.unit01.lesson03.street_meeting
  type: translation
  frame:
    text: بخير، شكرًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Bine, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'بعد Bine, mulțumesc تعيد السؤال إلى محدّثك: Și dumneavoastră? (رسمي) أو Și tu? (غير رسمي).'
    language_code: ar
    direction: rtl
- content_key: practice.ar-ro.ro.a1.unit01.lesson03.order.002
  lesson_content_key: ro.a1.unit01.lesson03.street_meeting
  type: word_order
  frame:
    text: Și {item} îmi pare bine!
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Și {item} îmi pare bine!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Și mie îmi pare bine تعني «وأنا أيضًا سررت بلقائك»؛ و mie تؤكد معنى «لي» وتردّ على كلام الطرف الآخر.
    language_code: ar
    direction: rtl
