schema_version: "1.0"
pack_key: practice.en-de.a1.unit07
source_language: en
target_language: de
unit_content_key: de.a1.unit07.essen
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-de) from scripts/backfill_lexemes_en_de.py lexemes (curated
    w_<token> pools). Ordering frames pin the article to the noun gender: einen before the masculine pool
    (Kaffee, Tee, Salat), ein before the neuter pool (Wasser, Sandwich, Brot). The digits 3 2 1 4 5 6 are
    recognition-only (a bare-digit production prompt would be unnatural). Das macht neun Euro is prompted
    as "That comes to nine euros". Reviewer: confirm Brot and Wasser are neuter (das Brot, das Wasser).
    Opus quality pass 2026-10-24: corrected the Café accent feedback.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Kaffee, w_Tee, w_Wasser, w_Brot, w_Suppe, w_Salat, w_Sandwich, w_sonst, w_noch, w_etwas, w_alles, w_hier, w_oder, w_Essen, w_Mitnehmen, w_Speisekarte, w_Preis, w_Café, w_3, w_5, w_2, w_was, w_möchten, w_macht, w_Euro, w_einen, w_möchte]
slot_presets:
  words_1: &words_1 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Kaffee, w_Tee, w_Wasser, w_Brot, w_Suppe, w_Salat, w_Sandwich]}}
  words_2: &words_2 {language_code: de, part_of_speech: [adverb, noun, particle, pronoun], agreement_tags: {semantic: [w_sonst, w_noch, w_etwas, w_alles, w_hier, w_oder, w_Essen, w_Mitnehmen]}}
  words_3: &words_3 {language_code: de, part_of_speech: [noun, symbol], agreement_tags: {semantic: [w_Speisekarte, w_Preis, w_Café, w_3, w_5, w_2]}}
  words_4: &words_4 {language_code: de, part_of_speech: [noun, pronoun, verb], agreement_tags: {semantic: [w_was, w_möchten, w_macht, w_Euro, w_Preis]}}
  order_5: &order_5 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Kaffee, w_Tee, w_Salat]}}
  order_6: &order_6 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Wasser, w_Sandwich, w_Brot]}}
  order_7: &order_7 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_möchten}}
  match_8: &match_8 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Kaffee, w_Tee, w_Wasser, w_Brot, w_Suppe, w_Salat]}}
  match_9: &match_9 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Speisekarte, w_Preis, w_Café, w_Euro, w_Mitnehmen, w_Sandwich]}}
  fill_10: &fill_10 {language_code: de, part_of_speech: [particle], agreement_tags: {semantic: w_oder}}
  fill_11: &fill_11 {language_code: de, part_of_speech: [particle], agreement_tags: {semantic: w_einen}}
  fill_12: &fill_12 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_macht}}
  bare_13: &bare_13 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Speisekarte, w_Preis, w_Euro, w_Café]}}
  one_14: &one_14 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_möchte}}
templates:
  - content_key: practice.en-de.de.a1.unit07.lesson01.choose.001
    lesson_content_key: de.a1.unit07.lesson01.essen_und_getraenke_wortschatz
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Every German noun is capitalised: Kaffee, Tee, Wasser, Brot.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson02.listen.002
    lesson_content_key: de.a1.unit07.lesson02.hoeflich_bestellen
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Sonst noch etwas? is the standard question after an order.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson03.choose.003
    lesson_content_key: de.a1.unit07.lesson03.eine_einfache_speisekarte_lesen
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Café keeps the French accent in German spelling and is neuter: das Café.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson04.choose.004
    lesson_content_key: de.a1.unit07.lesson04.im_cafe_bestellen
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Möchten Sie is the polite way to ask what someone would like.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson01.listen.005
    lesson_content_key: de.a1.unit07.lesson01.essen_und_getraenke_wortschatz
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Nouns come with an article: der Kaffee, der Tee, das Wasser, das Brot, die Suppe.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson01.order.006
    lesson_content_key: de.a1.unit07.lesson01.essen_und_getraenke_wortschatz
    type: word_order
    frame: {text: "Ich möchte einen {item}, bitte.", language_code: de, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Ich möchte einen {item}, bitte.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Masculine nouns take einen when they are the thing you order (accusative).", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson02.order.007
    lesson_content_key: de.a1.unit07.lesson02.hoeflich_bestellen
    type: word_order
    frame: {text: "Ich möchte ein {item}, bitte.", language_code: de, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Ich möchte ein {item}, bitte.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Neuter nouns take ein: ein Wasser, ein Sandwich, ein Brot.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson04.order.008
    lesson_content_key: de.a1.unit07.lesson04.im_cafe_bestellen
    type: word_order
    frame: {text: "Was {item} Sie?", language_code: de, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "Was {item} Sie?", language_code: de, direction: ltr}}
    feedback_frame: {text: "A question word comes first and the verb stays second: Was möchten Sie?", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson01.match.009
    lesson_content_key: de.a1.unit07.lesson01.essen_und_getraenke_wortschatz
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *match_8, second: *match_8, third: *match_8, fourth: *match_8, fifth: *match_8, sixth: *match_8}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Suppe is feminine, so it is the one that takes eine.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson03.match.010
    lesson_content_key: de.a1.unit07.lesson03.eine_einfache_speisekarte_lesen
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *match_9, second: *match_9, third: *match_9, fourth: *match_9, fifth: *match_9, sixth: *match_9}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Mitnehmen and Essen are verbs used as nouns, so they are capitalised.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson02.fill.011
    lesson_content_key: de.a1.unit07.lesson02.hoeflich_bestellen
    type: fill_in_blank
    frame: {text: "Zum Hier-Essen {item} zum Mitnehmen? ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_10, hint: *fill_10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Oder joins two choices: for here or to go.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson02.fill.012
    lesson_content_key: de.a1.unit07.lesson02.hoeflich_bestellen
    type: fill_in_blank
    frame: {text: "Ich möchte {item} Kaffee, bitte. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_11, hint: *fill_11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Kaffee is masculine, so a coffee ordered is einen Kaffee.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson04.fill.013
    lesson_content_key: de.a1.unit07.lesson04.im_cafe_bestellen
    type: fill_in_blank
    frame: {text: "Das {item} neun Euro. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_12, hint: *fill_12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Machen is also used for totals: Das macht neun Euro.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson01.translate.014
    lesson_content_key: de.a1.unit07.lesson01.essen_und_getraenke_wortschatz
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Wasser and Brot are neuter; Kaffee and Tee are masculine; Suppe is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson03.translate.015
    lesson_content_key: de.a1.unit07.lesson03.eine_einfache_speisekarte_lesen
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bare_13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Speisekarte is a compound: Speise (dish) plus Karte (card).", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson02.translate.016
    lesson_content_key: de.a1.unit07.lesson02.hoeflich_bestellen
    type: translation
    frame: {text: "I would like a tea, please.", language_code: en, direction: ltr}
    slots: {item: *one_14}
    answer_derivation: {kind: render_frame, frame: {text: "Ich {item} einen Tee, bitte.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Ich möchte is a polite way to ask for something; the verb stays second.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson04.translate.017
    lesson_content_key: de.a1.unit07.lesson04.im_cafe_bestellen
    type: translation
    frame: {text: "What would you like? (formal)", language_code: en, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "Was {item} Sie?", language_code: de, direction: ltr}}
    feedback_frame: {text: "Möchten goes with the formal Sie.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit07.lesson04.translate.018
    lesson_content_key: de.a1.unit07.lesson04.im_cafe_bestellen
    type: translation
    frame: {text: "That comes to nine euros.", language_code: en, direction: ltr}
    slots: {item: *fill_12}
    answer_derivation: {kind: render_frame, frame: {text: "Das {item} neun Euro.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Das macht is the usual way to give a total.", language_code: en, direction: ltr}
