tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_regnet", "w_regnen", "w_bleibe", "w_bleiben", "w_Hause", "w_treffen", "w_neun", "w_gehen", "w_wandern", "w_allein", "w_gehe"]
slot_presets:
  p1: &p1 {language_code: de, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: ["w_regnet", "w_regnen", "w_bleibe", "w_bleiben", "w_Hause", "w_treffen", "w_neun", "w_gehen", "w_wandern", "w_allein", "w_gehe"]}}
  p2: &p2 {language_code: de, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: ["w_gehe", "w_allein", "w_wandern", "w_gehen", "w_neun", "w_treffen", "w_Hause", "w_bleiben", "w_bleibe", "w_regnen", "w_regnet"]}}
  p3: &p3 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: "w_regnet"}}
  p4: &p4 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: "w_bleibe"}}
  p5: &p5 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: "w_treffen"}}
  p6: &p6 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: "w_wandern"}}
  p7: &p7 {language_code: de, part_of_speech: adverb, agreement_tags: {semantic: "w_allein"}}
templates:
  - content_key: practice.en-de.de.b1.unit41.lesson01.choose.001
    lesson_content_key: de.b1.unit41.lesson01.wenn_real_positive
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit41.lesson02.choose.001
    lesson_content_key: de.b1.unit41.lesson02.wenn_real_negated
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
