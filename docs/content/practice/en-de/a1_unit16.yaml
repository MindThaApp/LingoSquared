schema_version: "1.0"
pack_key: practice.en-de.a1.unit16
source_language: en
target_language: de
unit_content_key: de.a1.unit16.reisen
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-de) from scripts/backfill_lexemes_en_de.py lexemes (curated w_<token> pools). Berlin is the only proper noun; tokens Bahnhof/Gleis/Zug/Fahrkarte/Abfahrt keep noun capitals. Article gender
    is carried by the literal frame text (der Zug, die Fahrkarte, das Gleis has no article in the dialogue). The verb fährt
    is always second. Reviewer: confirm the English prompt 'The train leaves ...' for fährt.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Bahnhof, w_Gleis, w_Zug, w_Fahrkarte, w_Abfahrt, w_Berlin, w_einfach, w_hin, w_zurück, w_fährt, w_Art]
slot_presets:
  words_1: &words_1 {language_code: de, part_of_speech: [noun, proper_noun], agreement_tags: {semantic: [w_Bahnhof, w_Gleis, w_Zug, w_Fahrkarte, w_Abfahrt, w_Berlin]}}
  words_2: &words_2 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Bahnhof, w_Gleis, w_Zug, w_Fahrkarte, w_Abfahrt]}}
  words_3: &words_3 {language_code: de, part_of_speech: [adjective, noun, preposition, verb], agreement_tags: {semantic: [w_einfach, w_hin, w_zurück, w_fährt, w_Art]}}
  words_4: &words_4 {language_code: de, part_of_speech: [adjective, noun, preposition, verb], agreement_tags: {semantic: [w_einfach, w_zurück, w_fährt, w_Art, w_hin]}}
  order_5: &order_5 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Zug}}
  order_6: &order_6 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Gleis}}
  order_7: &order_7 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_fährt}}
  order_8: &order_8 {language_code: de, part_of_speech: [preposition], agreement_tags: {semantic: w_zurück}}
  match_9: &match_9 {language_code: de, part_of_speech: [adjective, noun, preposition, verb], agreement_tags: {semantic: [w_einfach, w_hin, w_zurück, w_fährt, w_Art, w_Zug]}}
  fill_10: &fill_10 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Bahnhof}}
  fill_11: &fill_11 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Fahrkarte}}
  fill_12: &fill_12 {language_code: de, part_of_speech: [preposition], agreement_tags: {semantic: w_hin}}
  bare_13: &bare_13 {language_code: de, part_of_speech: [adjective, noun, preposition], agreement_tags: {semantic: [w_einfach, w_zurück, w_Art]}}
templates:
  - content_key: practice.en-de.de.a1.unit16.lesson01.choose.001
    lesson_content_key: de.a1.unit16.lesson01.am_bahnhof
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "German nouns are capitalised: der Bahnhof, das Gleis, der Zug.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson01.listen.002
    lesson_content_key: de.a1.unit16.lesson01.am_bahnhof
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Die Fahrkarte is feminine; der Zug and der Bahnhof are masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson02.choose.003
    lesson_content_key: de.a1.unit16.lesson02.eine_fahrkarte_kaufen
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Hin und zurück means there and back, i.e. a return ticket.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson02.listen.004
    lesson_content_key: de.a1.unit16.lesson02.eine_fahrkarte_kaufen
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Einfach is the ticket type one-way; fahren becomes fährt with er, sie, es.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson01.order.005
    lesson_content_key: de.a1.unit16.lesson01.am_bahnhof
    type: word_order
    frame: {text: "Der {item} fährt nach Berlin.", language_code: de, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Der {item} fährt nach Berlin.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Der Zug is masculine; the verb fährt stays second.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson01.order.006
    lesson_content_key: de.a1.unit16.lesson01.am_bahnhof
    type: word_order
    frame: {text: "Wo ist {item} drei?", language_code: de, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Wo ist {item} drei?", language_code: de, direction: ltr}}
    feedback_frame: {text: "Platforms are numbered without an article: Gleis drei.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson02.order.007
    lesson_content_key: de.a1.unit16.lesson02.eine_fahrkarte_kaufen
    type: word_order
    frame: {text: "Der Zug {item} um neun Uhr von Gleis drei.", language_code: de, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "Der Zug {item} um neun Uhr von Gleis drei.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Fahren changes its vowel with er, sie, es: er fährt.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson02.order.008
    lesson_content_key: de.a1.unit16.lesson02.eine_fahrkarte_kaufen
    type: word_order
    frame: {text: "Einfach oder hin und {item}?", language_code: de, direction: ltr}
    slots: {item: *order_8}
    answer_derivation: {kind: render_frame, frame: {text: "Einfach oder hin und {item}?", language_code: de, direction: ltr}}
    feedback_frame: {text: "Hin und zurück is a fixed phrase for a return ticket.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson01.match.009
    lesson_content_key: de.a1.unit16.lesson01.am_bahnhof
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *words_1, second: *words_1, third: *words_1, fourth: *words_1, fifth: *words_1, sixth: *words_1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Berlin is a proper noun and is also capitalised.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson02.match.010
    lesson_content_key: de.a1.unit16.lesson02.eine_fahrkarte_kaufen
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *match_9, second: *match_9, third: *match_9, fourth: *match_9, fifth: *match_9, sixth: *match_9}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Einfach and hin und zurück are the two ticket types.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson01.fill.011
    lesson_content_key: de.a1.unit16.lesson01.am_bahnhof
    type: fill_in_blank
    frame: {text: "Ich bin am {item}. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_10, hint: *fill_10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Am is an plus dem: am Bahnhof.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson01.fill.012
    lesson_content_key: de.a1.unit16.lesson01.am_bahnhof
    type: fill_in_blank
    frame: {text: "Eine {item} nach Berlin, bitte. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_11, hint: *fill_11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Fahrkarte is feminine, hence eine Fahrkarte.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson02.fill.013
    lesson_content_key: de.a1.unit16.lesson02.eine_fahrkarte_kaufen
    type: fill_in_blank
    frame: {text: "Einfach oder {item} und zurück? ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_12, hint: *fill_12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Hin und zurück: there and back.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson01.translate.014
    lesson_content_key: de.a1.unit16.lesson01.am_bahnhof
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words_2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "German nouns always start with a capital letter.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson02.translate.015
    lesson_content_key: de.a1.unit16.lesson02.eine_fahrkarte_kaufen
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bare_13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Art is a feminine noun: die Art.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson01.translate.016
    lesson_content_key: de.a1.unit16.lesson01.am_bahnhof
    type: translation
    frame: {text: "I am at the train station.", language_code: en, direction: ltr}
    slots: {item: *fill_10}
    answer_derivation: {kind: render_frame, frame: {text: "Ich bin am {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Am is an plus dem.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson01.translate.017
    lesson_content_key: de.a1.unit16.lesson01.am_bahnhof
    type: translation
    frame: {text: "A ticket to Berlin, please.", language_code: en, direction: ltr}
    slots: {item: *fill_11}
    answer_derivation: {kind: render_frame, frame: {text: "Eine {item} nach Berlin, bitte.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Nach is used with city names: nach Berlin.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit16.lesson02.translate.018
    lesson_content_key: de.a1.unit16.lesson02.eine_fahrkarte_kaufen
    type: translation
    frame: {text: "The train leaves at nine o’clock from platform three.", language_code: en, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "Der Zug {item} um neun Uhr von Gleis drei.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Von Gleis drei says which platform the train leaves from.", language_code: en, direction: ltr}
