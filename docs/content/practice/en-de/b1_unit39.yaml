    lesson_content_key: de.b1.unit39.lesson01.zustaendigkeit
    type: word_order
    frame: {text: "Ich bin für das {item} zuständig.", language_code: de, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Ich bin für das {item} zuständig.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Für takes the accusative: für das Projekt.", language_code: en, direction: ltr}
