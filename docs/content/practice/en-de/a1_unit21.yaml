    answer_derivation: {kind: render_frame, frame: {text: "Das Hemd {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Passen is a regular verb: das Hemd passt.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit21.lesson02.order.007
    lesson_content_key: de.a1.unit21.lesson02.groesse_und_farbe
