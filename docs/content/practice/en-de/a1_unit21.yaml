  notes: >-
    Authored 2026-10-24 (session 10, en-de) from scripts/backfill_lexemes_en_de.py lexemes (curated w_<token> pools). Genders in literal frame text: ein Hemd (n), eine Hose/Jacke (f), die Farbe/Größe (f). Colours blau/rot are
