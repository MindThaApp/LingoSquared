    type: translation
    frame: {text: "I am buying clothes.", language_code: en, direction: ltr}
    slots: {item: *fill_8}
    answer_derivation: {kind: render_frame, frame: {text: "Ich {item} Kleidung.", language_code: de, direction: ltr}}
