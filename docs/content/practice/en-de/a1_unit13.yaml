schema_version: "1.0"
pack_key: practice.en-de.a1.unit13
source_language: en
target_language: de
unit_content_key: de.a1.unit13.vergangenes
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-de) from scripts/backfill_lexemes_en_de.py lexemes (curated
    w_<token> pools). Perfect tense: haben/sein finite verb second plus participle at the END
    (Ich habe Brot gekauft; Ich bin zum Markt gegangen). The participle is the slot token and sits at
    the end of its frame; gegangen is only used with bin. Gloss "done; made" for gemacht is the sense
    taught in "Was haben Sie gestern gemacht?". Lesson 2 has a single token (war), so its recognition
    and structured templates draw on the whole unit pool. Reviewer: confirm "Was haben Sie gestern
    gemacht?" prompt reads as "What did you do yesterday? (formal)".
    Opus quality pass 2026-10-24: fixed two feedback lines (participle note, gestern capital).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_gestern, w_gemacht, w_gekauft, w_gegessen, w_gegangen, w_war]
slot_presets:
  words_1: &words_1 {language_code: de, part_of_speech: [adverb, verb], agreement_tags: {semantic: [w_gestern, w_gemacht, w_gekauft, w_gegessen, w_gegangen, w_war]}}
  words_2: &words_2 {language_code: de, part_of_speech: [adverb, verb], agreement_tags: {semantic: [w_gestern, w_gemacht, w_gekauft, w_gegessen, w_gegangen]}}
  words_3: &words_3 {language_code: de, part_of_speech: [adverb, verb], agreement_tags: {semantic: [w_war, w_gestern, w_gemacht, w_gekauft]}}
  words_4: &words_4 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: [w_war, w_gegangen, w_gegessen, w_gekauft]}}
  order_5: &order_5 {language_code: de, part_of_speech: [adverb], agreement_tags: {semantic: w_gestern}}
  order_6: &order_6 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_gegangen}}
  order_7: &order_7 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_war}}
  fill_8: &fill_8 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_gekauft}}
  fill_9: &fill_9 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_gegessen}}
  fill_10: &fill_10 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_gemacht}}
templates:
  - content_key: practice.en-de.de.a1.unit13.lesson01.choose.001
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Past participles such as gemacht and gekauft go to the end of the clause after haben or sein.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson01.listen.002
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Gegangen is the participle of gehen and goes with sein, not haben.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson02.choose.003
    lesson_content_key: de.a1.unit13.lesson02.ein_kurzer_bericht
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "War is a simple past form of sein: es war sehr gut.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson02.listen.004
    lesson_content_key: de.a1.unit13.lesson02.ein_kurzer_bericht
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "War is used in the past for it was, I was.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson01.order.005
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: word_order
    frame: {text: "Was haben Sie {item} gemacht?", language_code: de, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Was haben Sie {item} gemacht?", language_code: de, direction: ltr}}
    feedback_frame: {text: "Haben stays second and the participle gemacht goes to the end.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson01.order.006
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: word_order
    frame: {text: "Ich bin zum Markt {item}.", language_code: de, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Ich bin zum Markt {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "With sein the participle also sits at the end: Ich bin ... gegangen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson02.order.007
    lesson_content_key: de.a1.unit13.lesson02.ein_kurzer_bericht
    type: word_order
    frame: {text: "Es {item} sehr gut.", language_code: de, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "Es {item} sehr gut.", language_code: de, direction: ltr}}
    feedback_frame: {text: "War is the past of ist and sits in second position.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson01.match.008
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *words_1, second: *words_1, third: *words_1, fourth: *words_1, fifth: *words_1, sixth: *words_1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Participles are formed with ge- and stand at the end of the clause.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson01.fill.009
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: fill_in_blank
    frame: {text: "Ich habe Brot {item}. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_8, hint: *fill_8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The participle goes to the end after habe.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson01.fill.010
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: fill_in_blank
    frame: {text: "Ich habe Suppe {item}. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_9, hint: *fill_9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Haben is second and the participle gegessen is last.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson02.fill.011
    lesson_content_key: de.a1.unit13.lesson02.ein_kurzer_bericht
    type: fill_in_blank
    frame: {text: "Es {item} sehr gut. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *order_7, hint: *order_7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "War is the past form of ist: es war sehr gut.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson01.fill.012
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: fill_in_blank
    frame: {text: "Was haben Sie gestern {item}? ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_10, hint: *fill_10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The participle goes last in the question: Was haben Sie gestern gemacht?", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson01.translate.013
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words_2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The adverb gestern (yesterday) is lowercase mid-sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson01.translate.014
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: translation
    frame: {text: "I bought bread.", language_code: en, direction: ltr}
    slots: {item: *fill_8}
    answer_derivation: {kind: render_frame, frame: {text: "Ich habe Brot {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "The participle sits at the end of the clause.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson01.translate.015
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: translation
    frame: {text: "I ate soup.", language_code: en, direction: ltr}
    slots: {item: *fill_9}
    answer_derivation: {kind: render_frame, frame: {text: "Ich habe Suppe {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Haben is the second element and the participle is last.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson02.translate.016
    lesson_content_key: de.a1.unit13.lesson02.ein_kurzer_bericht
    type: translation
    frame: {text: "It was very good.", language_code: en, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "Es {item} sehr gut.", language_code: de, direction: ltr}}
    feedback_frame: {text: "War stays in second position.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson01.translate.017
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: translation
    frame: {text: "I went to the market.", language_code: en, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Ich bin zum Markt {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Movement verbs form the perfect with sein.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit13.lesson01.translate.018
    lesson_content_key: de.a1.unit13.lesson01.gestern_und_perfekt
    type: translation
    frame: {text: "What did you do yesterday? (formal)", language_code: en, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Was haben Sie {item} gemacht?", language_code: de, direction: ltr}}
    feedback_frame: {text: "The time word gestern sits between haben Sie and the participle.", language_code: en, direction: ltr}
