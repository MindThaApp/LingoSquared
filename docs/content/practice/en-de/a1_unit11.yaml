schema_version: "1.0"
pack_key: practice.en-de.a1.unit11
source_language: en
target_language: de
unit_content_key: de.a1.unit11.alltag
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-de) from scripts/backfill_lexemes_en_de.py lexemes (curated
    w_<token> pools). Separable verbs keep the prefix at the end (Ich stehe um sieben Uhr auf), and the
    finite verb is always second, so frames put the unit's verb mid-sentence (never sentence-initial,
    where the slot text would be lowercase). English prompts name the subject (I, Anna, formal you) so
    each conjugated form is determined. Reviewer: confirm the gloss pairing stehe (I get up) vs
    steht (gets up) is clear in the recognition pools; the two are kept out of the same pool.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_aufstehen, w_frühstücken, w_arbeiten, w_lernen, w_schlafen, w_Deutsch, w_stehe, w_arbeite, w_lerne, w_gehe, w_frühstücke, w_steht, w_frühstückt, w_arbeitet, w_lernt, w_im, w_stehen]
slot_presets:
  words_1: &words_1 {language_code: de, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_aufstehen, w_frühstücken, w_arbeiten, w_lernen, w_schlafen, w_Deutsch]}}
  words_2: &words_2 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: [w_stehe, w_arbeite, w_lerne, w_gehe, w_frühstücke]}}
  words_3: &words_3 {language_code: de, part_of_speech: [preposition, verb], agreement_tags: {semantic: [w_steht, w_frühstückt, w_arbeitet, w_lernt, w_im]}}
  words_4: &words_4 {language_code: de, part_of_speech: [preposition, verb], agreement_tags: {semantic: [w_frühstückt, w_arbeitet, w_lernt, w_steht, w_im]}}
  order_5: &order_5 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_stehe}}
  order_6: &order_6 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_frühstücke}}
  order_7: &order_7 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_frühstückt}}
  order_8: &order_8 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_arbeitet}}
  match_9: &match_9 {language_code: de, part_of_speech: [preposition, verb], agreement_tags: {semantic: [w_steht, w_frühstückt, w_arbeitet, w_lernt, w_im, w_gehe]}}
  fill_10: &fill_10 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_gehe}}
  fill_11: &fill_11 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_steht}}
  fill_12: &fill_12 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_lernt}}
  bare_13: &bare_13 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: [w_aufstehen, w_frühstücken, w_arbeiten, w_lernen, w_schlafen]}}
  one_14: &one_14 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_stehen}}
templates:
  - content_key: practice.en-de.de.a1.unit11.lesson01.choose.001
    lesson_content_key: de.a1.unit11.lesson01.aktivitaeten_und_zeiten
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The infinitive ends in -en; aufstehen is separable: ich stehe ... auf.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson01.listen.002
    lesson_content_key: de.a1.unit11.lesson01.aktivitaeten_und_zeiten
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "With ich the verb ends in -e: ich arbeite, ich lerne.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson02.choose.003
    lesson_content_key: de.a1.unit11.lesson02.mein_tagesablauf
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "With he, she or it the verb ends in -t: sie lernt, sie arbeitet.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson02.listen.004
    lesson_content_key: de.a1.unit11.lesson02.mein_tagesablauf
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Im is in plus dem: im Café.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson01.order.005
    lesson_content_key: de.a1.unit11.lesson01.aktivitaeten_und_zeiten
    type: word_order
    frame: {text: "Ich {item} um sieben Uhr auf.", language_code: de, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Ich {item} um sieben Uhr auf.", language_code: de, direction: ltr}}
    feedback_frame: {text: "The separable prefix auf goes to the end of the clause.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson01.order.006
    lesson_content_key: de.a1.unit11.lesson01.aktivitaeten_und_zeiten
    type: word_order
    frame: {text: "Dann {item} ich.", language_code: de, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Dann {item} ich.", language_code: de, direction: ltr}}
    feedback_frame: {text: "After dann the verb stays second and the subject follows it: Dann frühstücke ich.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson02.order.007
    lesson_content_key: de.a1.unit11.lesson02.mein_tagesablauf
    type: word_order
    frame: {text: "Dann {item} sie.", language_code: de, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "Dann {item} sie.", language_code: de, direction: ltr}}
    feedback_frame: {text: "After dann the verb is second and the subject comes after it.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson02.order.008
    lesson_content_key: de.a1.unit11.lesson02.mein_tagesablauf
    type: word_order
    frame: {text: "Am Nachmittag {item} sie im Café.", language_code: de, direction: ltr}
    slots: {item: *order_8}
    answer_derivation: {kind: render_frame, frame: {text: "Am Nachmittag {item} sie im Café.", language_code: de, direction: ltr}}
    feedback_frame: {text: "A time phrase first pushes the subject after the verb: Am Nachmittag arbeitet sie.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson01.match.009
    lesson_content_key: de.a1.unit11.lesson01.aktivitaeten_und_zeiten
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *words_1, second: *words_1, third: *words_1, fourth: *words_1, fifth: *words_1, sixth: *words_1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "In schlafen gehen the verb gehen is conjugated and schlafen stays an infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson02.match.010
    lesson_content_key: de.a1.unit11.lesson02.mein_tagesablauf
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *match_9, second: *match_9, third: *match_9, fourth: *match_9, fifth: *match_9, sixth: *match_9}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Conjugated verbs end in -t for he, she or it and in -e for ich.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson01.fill.011
    lesson_content_key: de.a1.unit11.lesson01.aktivitaeten_und_zeiten
    type: fill_in_blank
    frame: {text: "Ich {item} um zehn Uhr schlafen. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_10, hint: *fill_10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Gehen is conjugated and the infinitive schlafen stays at the end: Ich gehe schlafen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson02.fill.012
    lesson_content_key: de.a1.unit11.lesson02.mein_tagesablauf
    type: fill_in_blank
    frame: {text: "Anna {item} um sieben Uhr auf. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_11, hint: *fill_11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The prefix auf is separated and sent to the end: Anna steht ... auf.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson02.fill.013
    lesson_content_key: de.a1.unit11.lesson02.mein_tagesablauf
    type: fill_in_blank
    frame: {text: "Am Abend {item} sie Deutsch. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_12, hint: *fill_12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After a time phrase the verb stays second: Am Abend lernt sie Deutsch.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson01.translate.014
    lesson_content_key: de.a1.unit11.lesson01.aktivitaeten_und_zeiten
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bare_13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "German infinitives end in -en and are lowercase.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson01.translate.015
    lesson_content_key: de.a1.unit11.lesson01.aktivitaeten_und_zeiten
    type: translation
    frame: {text: "I get up at seven o’clock.", language_code: en, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Ich {item} um sieben Uhr auf.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Aufstehen is separable: ich stehe ... auf.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson02.translate.016
    lesson_content_key: de.a1.unit11.lesson02.mein_tagesablauf
    type: translation
    frame: {text: "When do you get up? (formal)", language_code: en, direction: ltr}
    slots: {item: *one_14}
    answer_derivation: {kind: render_frame, frame: {text: "Wann {item} Sie auf?", language_code: de, direction: ltr}}
    feedback_frame: {text: "With the formal Sie the verb keeps the infinitive form: stehen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson02.translate.017
    lesson_content_key: de.a1.unit11.lesson02.mein_tagesablauf
    type: translation
    frame: {text: "Anna works in the cafe.", language_code: en, direction: ltr}
    slots: {item: *order_8}
    answer_derivation: {kind: render_frame, frame: {text: "Anna {item} im Café.", language_code: de, direction: ltr}}
    feedback_frame: {text: "With a name the verb ends in -t: Anna arbeitet.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit11.lesson01.translate.018
    lesson_content_key: de.a1.unit11.lesson01.aktivitaeten_und_zeiten
    type: translation
    frame: {text: "Then I have breakfast.", language_code: en, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Dann {item} ich.", language_code: de, direction: ltr}}
    feedback_frame: {text: "After dann the verb stays second, so ich follows it.", language_code: en, direction: ltr}
