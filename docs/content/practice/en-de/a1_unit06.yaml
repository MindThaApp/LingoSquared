schema_version: "1.0"
pack_key: practice.en-de.a1.unit06
source_language: en
target_language: de
unit_content_key: de.a1.unit06.familie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-de) from scripts/backfill_lexemes_en_de.py lexemes (curated
    w_<token> pools). Possessives agree with the noun, so every possessive frame pins one gender: meine
    only before the feminine pool (Mutter, Schwester, Großmutter, Tante, Cousine), Ihre before Familie.
    Sentence-initial words are never slots (the slot text is the lowercase citation form), so Das and Er
    stay literal and the unit's own words sit mid-sentence. Formal Sie is named in English prompts.
    Reviewer: check that Ihr/Ihre prompts read as formal address against the unit audio.
    Opus quality pass 2026-10-24: clarified the Eltern/Geschwister feedback and made the no-siblings prompt natural English.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Vater, w_Mutter, w_Bruder, w_Schwester, w_Eltern, w_Geschwister, w_Großmutter, w_Großvater, w_Tante, w_Onkel, w_Cousin, w_Cousine, w_er, w_habe, w_nein, w_Einzelkind, w_Schwestern, w_Foto, w_Familie, w_Lehrerin, w_Brüder, w_nur, w_ja, w_Ihre, w_Ihr, w_meine, w_keine]
slot_presets:
  words_1: &words_1 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Vater, w_Mutter, w_Bruder, w_Schwester, w_Eltern, w_Geschwister]}}
  words_2: &words_2 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Großmutter, w_Großvater, w_Tante, w_Onkel, w_Cousin, w_Cousine]}}
  words_3: &words_3 {language_code: de, part_of_speech: [noun, particle, pronoun, verb], agreement_tags: {semantic: [w_er, w_habe, w_nein, w_Einzelkind, w_Schwestern]}}
  words_4: &words_4 {language_code: de, part_of_speech: [adverb, noun, particle], agreement_tags: {semantic: [w_Foto, w_Familie, w_Lehrerin, w_Brüder, w_nur, w_ja]}}
  order_5: &order_5 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Mutter, w_Schwester, w_Großmutter, w_Tante, w_Cousine]}}
  order_6: &order_6 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Geschwister}}
  order_7: &order_7 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Schwester, w_Tante, w_Cousine]}}
  fill_8: &fill_8 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_habe}}
  fill_9: &fill_9 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Einzelkind}}
  fill_10: &fill_10 {language_code: de, part_of_speech: [pronoun], agreement_tags: {semantic: w_Ihre}}
  one_11: &one_11 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Schwestern}}
  one_12: &one_12 {language_code: de, part_of_speech: [pronoun], agreement_tags: {semantic: w_Ihr}}
  one_13: &one_13 {language_code: de, part_of_speech: [pronoun], agreement_tags: {semantic: w_meine}}
  one_14: &one_14 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Brüder}}
  one_15: &one_15 {language_code: de, part_of_speech: [pronoun], agreement_tags: {semantic: w_keine}}
templates:
  - content_key: practice.en-de.de.a1.unit06.lesson01.choose.001
    lesson_content_key: de.a1.unit06.lesson01.engste_familie
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Eltern means parents and Geschwister means siblings; both are plural-style collective words.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson02.listen.002
    lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "German splits cousin by gender: Cousin is male and Cousine is female.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson03.choose.003
    lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Einzelkind literally means single child.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson04.choose.004
    lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Lehrerin is the feminine form of teacher; the plural of Bruder changes its vowel: Brüder.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson01.order.005
    lesson_content_key: de.a1.unit06.lesson01.engste_familie
    type: word_order
    frame: {text: "Das ist meine {item}.", language_code: de, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Das ist meine {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Possessives agree with the noun: all of these are feminine, so they take meine.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson03.order.006
    lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
    type: word_order
    frame: {text: "Haben Sie {item}?", language_code: de, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Haben Sie {item}?", language_code: de, direction: ltr}}
    feedback_frame: {text: "Haben Sie is the formal you; in a yes/no question the verb comes first.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson04.order.007
    lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
    type: word_order
    frame: {text: "Meine {item} ist Lehrerin.", language_code: de, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "Meine {item} ist Lehrerin.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Feminine nouns take meine: meine Schwester, meine Tante, meine Cousine.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson01.match.008
    lesson_content_key: de.a1.unit06.lesson01.engste_familie
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *words_1, second: *words_1, third: *words_1, fourth: *words_1, fifth: *words_1, sixth: *words_1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Eltern (parents) exists only in the plural, and Geschwister (siblings) covers brothers and sisters together.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson02.match.009
    lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *words_2, second: *words_2, third: *words_2, fourth: *words_2, fifth: *words_2, sixth: *words_2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The e at the end of Cousine marks the female cousin.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson03.fill.010
    lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
    type: fill_in_blank
    frame: {text: "Ich {item} zwei Schwestern. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_8, hint: *fill_8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ich habe means I have; the verb keeps second position after ich.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson03.fill.011
    lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
    type: fill_in_blank
    frame: {text: "Ich bin {item}. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_9, hint: *fill_9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Einzelkind is a noun, so it keeps its capital letter.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson04.fill.012
    lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
    type: fill_in_blank
    frame: {text: "Ist das {item} Familie? ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_10, hint: *fill_10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Familie is feminine, so the formal your is Ihre, with a capital letter.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson01.translate.013
    lesson_content_key: de.a1.unit06.lesson01.engste_familie
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "All German nouns are capitalised, including family words.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson03.translate.014
    lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
    type: translation
    frame: {text: "I have two sisters.", language_code: en, direction: ltr}
    slots: {item: *one_11}
    answer_derivation: {kind: render_frame, frame: {text: "Ich habe zwei {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "The plural of Schwester adds -n: zwei Schwestern.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson02.translate.015
    lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
    type: translation
    frame: {text: "Who is your father? (formal)", language_code: en, direction: ltr}
    slots: {item: *one_12}
    answer_derivation: {kind: render_frame, frame: {text: "Wer ist {item} Vater?", language_code: de, direction: ltr}}
    feedback_frame: {text: "Vater is masculine, so the formal your is Ihr, not Ihre.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson03.translate.016
    lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
    type: translation
    frame: {text: "This is my mother.", language_code: en, direction: ltr}
    slots: {item: *one_13}
    answer_derivation: {kind: render_frame, frame: {text: "Das ist {item} Mutter.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Mutter is feminine, so my becomes meine.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson04.translate.017
    lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
    type: translation
    frame: {text: "Do you have brothers? (formal)", language_code: en, direction: ltr}
    slots: {item: *one_14}
    answer_derivation: {kind: render_frame, frame: {text: "Haben Sie {item}?", language_code: de, direction: ltr}}
    feedback_frame: {text: "Brüder is the plural of Bruder, with an umlaut.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit06.lesson03.translate.018
    lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
    type: translation
    frame: {text: "No, I don't have any siblings.", language_code: en, direction: ltr}
    slots: {item: *one_15}
    answer_derivation: {kind: render_frame, frame: {text: "Nein, ich habe {item} Geschwister.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Keine is used before plural nouns and feminine nouns to say no or not any.", language_code: en, direction: ltr}
