schema_version: "1.0"
pack_key: practice.en-de.a1.unit17
source_language: en
target_language: de
unit_content_key: de.a1.unit17.gesundheit
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-de) from scripts/backfill_lexemes_en_de.py lexemes (curated w_<token> pools). Formal Sie is named in English prompts (Brauchen Sie Hilfe? = Do you need help? (formal)). Pain phrases use
    Mein + noun + tut weh. 'Anna, brauchen Sie Hilfe?' keeps the verb inside the sentence (vocative first). Reviewer: confirm
    'Nein, mir ist schlecht' reads naturally and that Kopf/Hals are fine in one word_order pool.
    Opus quality pass 2026-10-24: dropped 'Anna,' from the brauchen word_order (first name plus Sie is register-odd); fixed tut gloss in the backfill.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Kopfschmerzen, w_Bauchschmerzen, w_Hals, w_Kopf, w_weh, w_schlecht, w_brauchen, w_Hilfe, w_brauche, w_Pause, w_trinken, w_machen, w_braucht, w_hat, w_tut, w_mir]
slot_presets:
  words_1: &words_1 {language_code: de, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_Kopfschmerzen, w_Bauchschmerzen, w_Hals, w_Kopf, w_weh, w_schlecht]}}
  words_2: &words_2 {language_code: de, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_Kopfschmerzen, w_Bauchschmerzen, w_Hals, w_Kopf, w_schlecht]}}
  words_3: &words_3 {language_code: de, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_brauchen, w_Hilfe, w_brauche, w_Pause, w_trinken, w_machen, w_braucht]}}
  words_4: &words_4 {language_code: de, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_Hilfe, w_brauche, w_Pause, w_trinken, w_machen, w_hat]}}
  order_5: &order_5 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Kopfschmerzen, w_Bauchschmerzen]}}
  order_6: &order_6 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_tut}}
  order_7: &order_7 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_brauchen}}
  match_8: &match_8 {language_code: de, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_Hilfe, w_Pause, w_brauche, w_trinken, w_machen, w_braucht]}}
  fill_9: &fill_9 {language_code: de, part_of_speech: [pronoun], agreement_tags: {semantic: w_mir}}
  fill_10: &fill_10 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Pause}}
  fill_11: &fill_11 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_hat}}
  fill_12: &fill_12 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_trinken}}
  bare_13: &bare_13 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Kopfschmerzen, w_Bauchschmerzen, w_Hals, w_Kopf]}}
  one_14: &one_14 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Kopfschmerzen}}
  one_15: &one_15 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Hals}}
  one_16: &one_16 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Hilfe}}
  one_17: &one_17 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_braucht}}
templates:
  - content_key: practice.en-de.de.a1.unit17.lesson01.choose.001
    lesson_content_key: de.a1.unit17.lesson01.problem_beschreiben
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Schmerzen means pain: Kopfschmerzen is head pain.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson01.listen.002
    lesson_content_key: de.a1.unit17.lesson01.problem_beschreiben
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Kopf and Hals are masculine nouns: der Kopf, der Hals.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson02.choose.003
    lesson_content_key: de.a1.unit17.lesson02.hilfe_brauchen
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Brauchen: ich brauche, Sie brauchen, sie braucht.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson02.listen.004
    lesson_content_key: de.a1.unit17.lesson02.hilfe_brauchen
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ich brauche ends in -e; sie braucht ends in -t.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson01.order.005
    lesson_content_key: de.a1.unit17.lesson01.problem_beschreiben
    type: word_order
    frame: {text: "Ich habe {item}.", language_code: de, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Ich habe {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Schmerzen is plural, so there is no article: Ich habe Kopfschmerzen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson01.order.006
    lesson_content_key: de.a1.unit17.lesson01.problem_beschreiben
    type: word_order
    frame: {text: "Mein Kopf {item} weh.", language_code: de, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Mein Kopf {item} weh.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Weh tun is a fixed expression: Mein Kopf tut weh.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson02.order.007
    lesson_content_key: de.a1.unit17.lesson02.hilfe_brauchen
    type: word_order
    frame: {text: "{item} Sie Hilfe?", language_code: de, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "{item} Sie Hilfe?", language_code: de, direction: ltr}}
    feedback_frame: {text: "With formal Sie the verb keeps the infinitive form: brauchen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson01.match.008
    lesson_content_key: de.a1.unit17.lesson01.problem_beschreiben
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *words_1, second: *words_1, third: *words_1, fourth: *words_1, fifth: *words_1, sixth: *words_1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Weh tun and schlecht are used to describe pain or feeling sick.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson02.match.009
    lesson_content_key: de.a1.unit17.lesson02.hilfe_brauchen
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *match_8, second: *match_8, third: *match_8, fourth: *match_8, fifth: *match_8, sixth: *match_8}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Trinken Sie and Machen Sie are formal commands.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson01.fill.010
    lesson_content_key: de.a1.unit17.lesson01.problem_beschreiben
    type: fill_in_blank
    frame: {text: "Nein, {item} ist schlecht. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_9, hint: *fill_9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mir is the dative: Mir ist schlecht means I feel sick.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson02.fill.011
    lesson_content_key: de.a1.unit17.lesson02.hilfe_brauchen
    type: fill_in_blank
    frame: {text: "Ich brauche eine {item}. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_10, hint: *fill_10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pause is feminine: eine Pause.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson02.fill.012
    lesson_content_key: de.a1.unit17.lesson02.hilfe_brauchen
    type: fill_in_blank
    frame: {text: "Anna {item} Kopfschmerzen. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_11, hint: *fill_11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Haben becomes hat with er, sie, es and names.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson02.fill.013
    lesson_content_key: de.a1.unit17.lesson02.hilfe_brauchen
    type: fill_in_blank
    frame: {text: "Bitte {item} Sie Wasser. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_12, hint: *fill_12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "A formal command puts the verb first: Trinken Sie Wasser.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson01.translate.014
    lesson_content_key: de.a1.unit17.lesson01.problem_beschreiben
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bare_13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Nouns keep their capital letter.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson01.translate.015
    lesson_content_key: de.a1.unit17.lesson01.problem_beschreiben
    type: translation
    frame: {text: "I have a headache.", language_code: en, direction: ltr}
    slots: {item: *one_14}
    answer_derivation: {kind: render_frame, frame: {text: "Ich habe {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Kopfschmerzen is plural, so there is no article.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson01.translate.016
    lesson_content_key: de.a1.unit17.lesson01.problem_beschreiben
    type: translation
    frame: {text: "My throat hurts.", language_code: en, direction: ltr}
    slots: {item: *one_15}
    answer_derivation: {kind: render_frame, frame: {text: "Mein {item} tut weh.", language_code: de, direction: ltr}}
    feedback_frame: {text: "The body part is the subject of tut weh.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson02.translate.017
    lesson_content_key: de.a1.unit17.lesson02.hilfe_brauchen
    type: translation
    frame: {text: "Do you need help? (formal)", language_code: en, direction: ltr}
    slots: {item: *one_16}
    answer_derivation: {kind: render_frame, frame: {text: "Brauchen Sie {item}?", language_code: de, direction: ltr}}
    feedback_frame: {text: "A yes/no question starts with the verb.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit17.lesson02.translate.018
    lesson_content_key: de.a1.unit17.lesson02.hilfe_brauchen
    type: translation
    frame: {text: "Anna needs water.", language_code: en, direction: ltr}
    slots: {item: *one_17}
    answer_derivation: {kind: render_frame, frame: {text: "Anna {item} Wasser.", language_code: de, direction: ltr}}
    feedback_frame: {text: "With a name the verb ends in -t.", language_code: en, direction: ltr}
