schema_version: '1.0'
pack_key: practice.en-de.b2.unit02
source_language: en
target_language: de
unit_content_key: de.b2.unit02.spekulation
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-de backfill lexemes (tags de_b2_u2 / w_<token>). 51 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Auto, w_Eins, w_Frau, w_Hauptverkehrszeit, w_Meeting, w_Morgen, w_Stau, w_Telefon, w_Termin, w_Zug, w_beschäftigt, w_bestimmt, w_dann, w_fahren, w_fehlen, w_fehlt, w_fährt, w_genau, w_gesprochen, w_habe, w_haben, w_heute, w_kommen, w_kommt, w_krank, w_könnte, w_muss, w_möglicherweise, w_noch, w_passieren, w_passiert, w_sicher, w_spät, w_stehen, w_steht, w_unterwegs, w_vergessen, w_vergisst, w_vermute, w_vermuten, w_verpassen, w_verpasst, w_verschlafen, w_vielleicht, w_wahrscheinlich, w_weg, w_weiß, w_wird, w_wissen, w_wohl, w_zweifellos]
templates:
- content_key: practice.en-de.de.b2.unit02.lesson01.choose.001
  lesson_content_key: de.b2.unit02.lesson01.wie_sicher_sind_sie
  type: multiple_choice
  frame: {text: '{item}', language_code: de, direction: ltr}
  slots:
    item: &id001
      language_code: de
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_Frau, w_noch, w_spät, w_unterwegs, w_vielleicht, w_wahrscheinlich, w_bestimmt, w_kommt, w_kommen, w_wird, w_wohl, w_zweifellos, w_beschäftigt, w_sicher, w_Stau, w_stehen, w_muss, w_krank, w_fahren, w_fährt, w_Auto, w_weg, w_könnte, w_möglicherweise, w_wissen, w_weiß, w_genau, w_vermute, w_vermuten, w_haben, w_Zug, w_verpassen, w_verpasst, w_passieren, w_passiert, w_verschlafen, w_Termin, w_vergessen, w_vergisst, w_fehlt, w_fehlen, w_heute, w_Meeting, w_Telefon, w_Hauptverkehrszeit, w_Eins, w_habe, w_Morgen, w_gesprochen, w_dann, w_steht]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on how certain are you?.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson02.listen.001
  lesson_content_key: de.b2.unit02.lesson02.deduktion
  type: listen_select
  frame: {text: '{item}', language_code: de, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on deduction: it must be so.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson03.translate.001
  lesson_content_key: de.b2.unit02.lesson03.moeglichkeit
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on guessing or deducing?.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson04.match.001
  lesson_content_key: de.b2.unit02.lesson04.ueber_die_vergangenheit_spekulieren
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: de, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each German word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson05.choose.001
  lesson_content_key: de.b2.unit02.lesson05.fakt_oder_spekulation
  type: multiple_choice
  frame: {text: '{item}', language_code: de, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on fact or speculation?.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson06.translate.001
  lesson_content_key: de.b2.unit02.lesson06.spekulieren_im_gespraech
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on speculating in conversation.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson01.order.002
  lesson_content_key: de.b2.unit02.lesson01.wie_sicher_sind_sie
  type: word_order
  frame: {text: 'Frau Bauer ist {item} nicht da.', language_code: de, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: adverb
      agreement_tags: {semantic: w_noch}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Frau Bauer ist {item} nicht da.', language_code: de, direction: ltr}
  feedback_frame: {text: Mrs. Bauer isn't here yet. Frau Bauer is Felix's established engineer colleague. She is missing from a meeting -- the scene this whole unit speculates about., language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson01.fill.003
  lesson_content_key: de.b2.unit02.lesson01.wie_sicher_sind_sie
  type: fill_in_blank
  frame:
    text: Warum ist sie so {item}? ({hint})
    language_code: de
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: de
      part_of_speech: adjective
      agreement_tags: {semantic: w_spät}
    hint:
      language_code: de
      part_of_speech: adjective
      agreement_tags: {semantic: w_spät}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Why is she so late? spät means late.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson01.translate.004
  lesson_content_key: de.b2.unit02.lesson01.wie_sicher_sind_sie
  type: translation
  frame: {text: She is on the way., language_code: en, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: adverb
      agreement_tags: {semantic: w_unterwegs}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Sie ist {item}.', language_code: de, direction: ltr}
  feedback_frame: {text: She is on the way. unterwegs means on the way., language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson02.order.002
  lesson_content_key: de.b2.unit02.lesson02.deduktion
  type: word_order
  frame: {text: 'Sie muss im {item} stehen.', language_code: de, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: noun
      agreement_tags: {semantic: w_Stau}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Sie muss im {item} stehen.', language_code: de, direction: ltr}
  feedback_frame: {text: 'She must be stuck in traffic. Muss here is EPISTEMIC -- a deduction from evidence (''the facts force me to conclude this''), not an obligation (''she has to''). English ''must'' works the same way, so the logic transfers directly.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson02.fill.003
  lesson_content_key: de.b2.unit02.lesson02.deduktion
  type: fill_in_blank
  frame:
    text: Sie könnte im Stau {item}. ({hint})
    language_code: de
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_stehen}
    hint:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_stehen}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: She might be stuck in traffic. stehen means stand; you get up (formal)., language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson02.translate.004
  lesson_content_key: de.b2.unit02.lesson02.deduktion
  type: translation
  frame: {text: She must be in a hurry., language_code: en, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_muss}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Sie {item} es eilig haben.', language_code: de, direction: ltr}
  feedback_frame: {text: 'She must be in a hurry. muss means must; have to (I, he, she, it).', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson03.order.002
  lesson_content_key: de.b2.unit02.lesson03.moeglichkeit
  type: word_order
  frame: {text: 'Sie {item} im Stau stehen.', language_code: de, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_könnte}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Sie {item} im Stau stehen.', language_code: de, direction: ltr}
  feedback_frame: {text: 'She might be stuck in traffic. könnte means could (hypothetical; I, he, she).', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson03.fill.003
  lesson_content_key: de.b2.unit02.lesson03.moeglichkeit
  type: fill_in_blank
  frame:
    text: Ich {item} es nicht genau. ({hint})
    language_code: de
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_weiß}
    hint:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_weiß}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I don''t know for sure. weiß means I know; he, she, it knows.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson03.translate.004
  lesson_content_key: de.b2.unit02.lesson03.moeglichkeit
  type: translation
  frame: {text: I suppose that she is at home., language_code: en, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_vermute}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ich {item}, dass sie zu Hause ist.', language_code: de, direction: ltr}
  feedback_frame: {text: I suppose that she is at home. vermute means I suppose., language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson04.order.002
  lesson_content_key: de.b2.unit02.lesson04.ueber_die_vergangenheit_spekulieren
  type: word_order
  frame: {text: 'Sie muss es eilig {item}.', language_code: de, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_haben}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Sie muss es eilig {item}.', language_code: de, direction: ltr}
  feedback_frame: {text: She must be in a hurry. haben means have; you have (formal)., language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson04.fill.003
  lesson_content_key: de.b2.unit02.lesson04.ueber_die_vergangenheit_spekulieren
  type: fill_in_blank
  frame:
    text: Sie hat den {item} verpasst. ({hint})
    language_code: de
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: de
      part_of_speech: noun
      agreement_tags: {semantic: w_Zug}
    hint:
      language_code: de
      part_of_speech: noun
      agreement_tags: {semantic: w_Zug}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: She missed the train. Zug means train., language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson04.translate.004
  lesson_content_key: de.b2.unit02.lesson04.ueber_die_vergangenheit_spekulieren
  type: translation
  frame: {text: She must have missed the train., language_code: en, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_verpasst}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Sie muss den Zug {item} haben.', language_code: de, direction: ltr}
  feedback_frame: {text: 'She must have missed the train. Past speculation: muss + past participle + haben (sent to the very end). English ''must have missed'' puts the auxiliary in the middle; German puts both verpasst and haben after the object.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson05.order.002
  lesson_content_key: de.b2.unit02.lesson05.fakt_oder_spekulation
  type: word_order
  frame: {text: 'Sie ist {item} nicht krank.', language_code: de, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: adverb
      agreement_tags: {semantic: w_heute}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Sie ist {item} nicht krank.', language_code: de, direction: ltr}
  feedback_frame: {text: She isn't sick today. heute means today., language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit02.lesson06.order.002
  lesson_content_key: de.b2.unit02.lesson06.spekulieren_im_gespraech
  type: word_order
  frame: {text: 'Ich {item} sie heute Morgen noch gesprochen.', language_code: de, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_habe}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ich {item} sie heute Morgen noch gesprochen.', language_code: de, direction: ltr}
  feedback_frame: {text: I spoke with her this morning. Jemanden sprechen here means 'to see/talk to someone' -- ich habe sie heute Morgen noch gesprochen is Frau Vogel's evidence that rules out oversleeping., language_code: en, direction: ltr}
