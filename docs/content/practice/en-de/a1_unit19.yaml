schema_version: "1.0"
pack_key: practice.en-de.a1.unit19
source_language: en
target_language: de
unit_content_key: de.a1.unit19.wohnen
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-de) from scripts/backfill_lexemes_en_de.py lexemes (curated w_<token> pools). Genders are carried by the literal frame text: die Wohnung/Küche, das Zimmer/Bad, der Tisch/Stuhl/das
    Wohnzimmer. 'Es gibt einen Tisch/Stuhl' uses the accusative einen (both masculine). Adjective pool klein/hell is natural
    after ist. Reviewer: confirm the gibt gloss is understandable in the fill hint.
    Opus quality pass 2026-10-24: made the two room translations determinate (In the living room there is a table; The table stands in the living room).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Wohnung, w_klein, w_Zimmer, w_Küche, w_Bad, w_hell, w_Wohnzimmer, w_Tisch, w_Stuhl, w_gibt, w_in]
slot_presets:
  words_1: &words_1 {language_code: de, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_Wohnung, w_klein, w_Zimmer, w_Küche, w_Bad, w_hell]}}
  words_2: &words_2 {language_code: de, part_of_speech: [noun, preposition, verb], agreement_tags: {semantic: [w_Wohnzimmer, w_Tisch, w_Stuhl, w_gibt, w_in]}}
  words_3: &words_3 {language_code: de, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_Wohnzimmer, w_Tisch, w_Stuhl, w_gibt]}}
  order_4: &order_4 {language_code: de, part_of_speech: [adjective], agreement_tags: {semantic: [w_klein, w_hell]}}
  order_5: &order_5 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_gibt}}
  order_6: &order_6 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Tisch, w_Stuhl]}}
  match_7: &match_7 {language_code: de, part_of_speech: [noun, preposition, verb], agreement_tags: {semantic: [w_Wohnzimmer, w_Tisch, w_Stuhl, w_gibt, w_in, w_Zimmer]}}
  fill_8: &fill_8 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Zimmer}}
  fill_9: &fill_9 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Wohnzimmer}}
  fill_10: &fill_10 {language_code: de, part_of_speech: [preposition], agreement_tags: {semantic: w_in}}
  bare_11: &bare_11 {language_code: de, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_Wohnung, w_Zimmer, w_Küche, w_Bad, w_klein, w_hell]}}
  bare_12: &bare_12 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: [w_Wohnzimmer, w_Tisch, w_Stuhl]}}
  one_13: &one_13 {language_code: de, part_of_speech: [adjective], agreement_tags: {semantic: w_klein}}
  one_14: &one_14 {language_code: de, part_of_speech: [adjective], agreement_tags: {semantic: w_hell}}
  one_15: &one_15 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Tisch}}
templates:
  - content_key: practice.en-de.de.a1.unit19.lesson01.choose.001
    lesson_content_key: de.a1.unit19.lesson01.raeume
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Wohnung, Küche and Zimmer are nouns, so they start with a capital.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson01.listen.002
    lesson_content_key: de.a1.unit19.lesson01.raeume
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Die Küche is feminine; das Bad is neuter.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson02.choose.003
    lesson_content_key: de.a1.unit19.lesson02.moebel_und_ort
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Wohnzimmer is wohnen plus Zimmer: a living room.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson02.listen.004
    lesson_content_key: de.a1.unit19.lesson02.moebel_und_ort
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Es gibt means there is.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson01.order.005
    lesson_content_key: de.a1.unit19.lesson01.raeume
    type: word_order
    frame: {text: "Meine Wohnung ist {item}.", language_code: de, direction: ltr}
    slots: {item: *order_4}
    answer_derivation: {kind: render_frame, frame: {text: "Meine Wohnung ist {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Predicate adjectives are not inflected: Meine Wohnung ist klein.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson02.order.006
    lesson_content_key: de.a1.unit19.lesson02.moebel_und_ort
    type: word_order
    frame: {text: "Im Wohnzimmer {item} es einen Tisch.", language_code: de, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Im Wohnzimmer {item} es einen Tisch.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Es gibt means there is; the verb stays second after Im Wohnzimmer.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson02.order.007
    lesson_content_key: de.a1.unit19.lesson02.moebel_und_ort
    type: word_order
    frame: {text: "Es gibt einen {item}.", language_code: de, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Es gibt einen {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Es gibt takes the accusative: einen Tisch, einen Stuhl.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson01.match.008
    lesson_content_key: de.a1.unit19.lesson01.raeume
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *words_1, second: *words_1, third: *words_1, fourth: *words_1, fifth: *words_1, sixth: *words_1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Klein and hell describe the apartment: Meine Wohnung ist klein.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson02.match.009
    lesson_content_key: de.a1.unit19.lesson02.moebel_und_ort
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *match_7, second: *match_7, third: *match_7, fourth: *match_7, fifth: *match_7, sixth: *match_7}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Wohnzimmer is a compound: Wohn plus Zimmer.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson01.fill.010
    lesson_content_key: de.a1.unit19.lesson01.raeume
    type: fill_in_blank
    frame: {text: "Die Wohnung hat zwei {item}. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_8, hint: *fill_8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The plural of Zimmer is also Zimmer.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson02.fill.011
    lesson_content_key: de.a1.unit19.lesson02.moebel_und_ort
    type: fill_in_blank
    frame: {text: "Der Tisch steht im {item}. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_9, hint: *fill_9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Im is in plus dem; Wohnzimmer is neuter.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson02.fill.012
    lesson_content_key: de.a1.unit19.lesson02.moebel_und_ort
    type: fill_in_blank
    frame: {text: "Meine Wohnung ist {item} Berlin. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_10, hint: *fill_10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "In is used for a city: in Berlin.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson01.translate.013
    lesson_content_key: de.a1.unit19.lesson01.raeume
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bare_11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Nouns keep their capital letter; adjectives do not.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson02.translate.014
    lesson_content_key: de.a1.unit19.lesson02.moebel_und_ort
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bare_12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Der Tisch and der Stuhl are masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson01.translate.015
    lesson_content_key: de.a1.unit19.lesson01.raeume
    type: translation
    frame: {text: "My apartment is small.", language_code: en, direction: ltr}
    slots: {item: *one_13}
    answer_derivation: {kind: render_frame, frame: {text: "Meine Wohnung ist {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "The adjective after ist is not inflected.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson01.translate.016
    lesson_content_key: de.a1.unit19.lesson01.raeume
    type: translation
    frame: {text: "The kitchen is bright.", language_code: en, direction: ltr}
    slots: {item: *one_14}
    answer_derivation: {kind: render_frame, frame: {text: "Die Küche ist {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Hell means bright.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson02.translate.017
    lesson_content_key: de.a1.unit19.lesson02.moebel_und_ort
    type: translation
    frame: {text: "In the living room there is a table.", language_code: en, direction: ltr}
    slots: {item: *one_15}
    answer_derivation: {kind: render_frame, frame: {text: "Im Wohnzimmer gibt es einen {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Es gibt is followed by the accusative: einen Tisch.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit19.lesson02.translate.018
    lesson_content_key: de.a1.unit19.lesson02.moebel_und_ort
    type: translation
    frame: {text: "The table stands in the living room.", language_code: en, direction: ltr}
    slots: {item: *fill_9}
    answer_derivation: {kind: render_frame, frame: {text: "Der Tisch steht im {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Im is in plus dem.", language_code: en, direction: ltr}
