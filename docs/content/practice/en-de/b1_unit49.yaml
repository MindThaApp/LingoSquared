    type: translation
    frame: {text: "The main point is that the cafe has new opening hours from next week.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Der {item} ist, dass das Café ab nächster Woche neue Öffnungszeiten hat.", language_code: de, direction: ltr}, accepted_variants: ["Der {item} ist, dass das Café ab der nächsten Woche neue Öffnungszeiten hat."]}
    feedback_frame: {text: "Hauptpunkt is masculine, so it takes der.", language_code: en, direction: ltr}
