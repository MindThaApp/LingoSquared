    lesson_content_key: de.b1.unit49.lesson01.der_hauptpunkt_ist
    type: word_order
    frame: {text: "Der {item} ist, dass das Café ab nächster Woche neue Öffnungszeiten hat.", language_code: de, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Der {item} ist, dass das Café ab nächster Woche neue Öffnungszeiten hat.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Hauptpunkt is masculine, so it takes der.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit49.lesson01.fill.001
    lesson_content_key: de.b1.unit49.lesson01.der_hauptpunkt_ist
    type: fill_in_blank
    frame: {text: "Der {item} ist, dass das Café ab nächster Woche neue Öffnungszeiten hat. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Hauptpunkt is masculine, so it takes der.", language_code: en, direction: ltr}
