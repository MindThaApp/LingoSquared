schema_version: '1.0'
pack_key: practice.en-de.b2.unit03
source_language: en
target_language: de
unit_content_key: de.b2.unit03.nuance
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-de backfill lexemes (tags de_b2_u3 / w_<token>). 36 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Idee, w_Klarheit, w_Punkte, w_Struktur, w_Team, w_Vorschlag, w_Weise, w_absolut, w_bisschen, w_denken, w_durchaus, w_durchschnittlich, w_eher, w_eigentlich, w_einige, w_einigermaßen, w_funktioniert, w_gefällt, w_gerade, w_gewisser, w_kompliziert, w_mag, w_nützlich, w_okay, w_recht, w_scheint, w_sehr, w_sind, w_total, w_vermutlich, w_wichtig, w_wirklich, w_würde, w_ziemlich, w_äußerst, w_überzeugend]
templates:
- content_key: practice.en-de.de.b2.unit03.lesson01.choose.001
  lesson_content_key: de.b2.unit03.lesson01.abschwaechen
  type: multiple_choice
  frame: {text: '{item}', language_code: de, direction: ltr}
  slots:
    item: &id001
      language_code: de
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_Vorschlag, w_eigentlich, w_ziemlich, w_bisschen, w_kompliziert, w_eher, w_durchschnittlich, w_würde, w_okay, w_einigermaßen, w_überzeugend, w_gewisser, w_Weise, w_recht, w_scheint, w_funktioniert, w_vermutlich, w_nützlich, w_Team, w_wirklich, w_sehr, w_äußerst, w_absolut, w_total, w_Idee, w_gefällt, w_gerade, w_wichtig, w_durchaus, w_Klarheit, w_einige, w_Punkte, w_sind, w_mag, w_Struktur, w_denken]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on softening.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit03.lesson02.listen.001
  lesson_content_key: de.b2.unit03.lesson02.vorsichtig_sein
  type: listen_select
  frame: {text: '{item}', language_code: de, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on being cautious.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit03.lesson03.translate.001
  lesson_content_key: de.b2.unit03.lesson03.betonen
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on emphasizing.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit03.lesson04.match.001
  lesson_content_key: de.b2.unit03.lesson04.fokus_setzen
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: de, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each German word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
