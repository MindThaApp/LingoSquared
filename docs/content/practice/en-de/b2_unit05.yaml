schema_version: '1.0'
pack_key: practice.en-de.b2.unit05
source_language: en
target_language: de
unit_content_key: de.b2.unit05.register
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-de backfill lexemes (tags de_b2_u5 / w_<token>). 34 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Damen, w_Grüße, w_Grüßen, w_Herren, w_Hochachtungsvoll, w_Liebe, w_Montag, w_Nachricht, w_Praxis, w_Problem, w_Woche, w_Zeit, w_anders, w_freundlichen, w_geehrte, w_hast, w_helfen, w_kannst, w_können, w_leider, w_lieber, w_möchte, w_möglich, w_nächste, w_passen, w_passt, w_schreibe, w_schreiben, w_schreibst, w_schreibt, w_tun, w_verschieben, w_wann, w_wären]
templates:
- content_key: practice.en-de.de.b2.unit05.lesson01.choose.001
  lesson_content_key: de.b2.unit05.lesson01.du_oder_sie
  type: multiple_choice
  frame: {text: '{item}', language_code: de, direction: ltr}
  slots:
    item: &id001
      language_code: de
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_schreibt, w_schreiben, w_Nachricht, w_schreibe, w_hast, w_Zeit, w_kannst, w_helfen, w_können, w_Liebe, w_Grüße, w_geehrte, w_Damen, w_Herren, w_freundlichen, w_Grüßen, w_Hochachtungsvoll, w_lieber, w_wären, w_möglich, w_tun, w_verschieben, w_möchte, w_Montag, w_leider, w_nächste, w_Woche, w_passen, w_passt, w_Problem, w_wann, w_Praxis, w_schreibst, w_anders]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on du or sie?.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit05.lesson02.listen.001
  lesson_content_key: de.b2.unit05.lesson02.anrede_und_grussformel
  type: listen_select
  frame: {text: '{item}', language_code: de, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on salutation and closing.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit05.lesson03.translate.001
  lesson_content_key: de.b2.unit05.lesson03.direkt_oder_hoeflich
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on direct or polite?.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit05.lesson04.match.001
  lesson_content_key: de.b2.unit05.lesson04.den_termin_verschieben
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: de, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each German word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit05.lesson05.choose.001
  lesson_content_key: de.b2.unit05.lesson05.zwei_nachrichten
  type: multiple_choice
  frame: {text: '{item}', language_code: de, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on two messages, two readers.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit05.lesson06.translate.001
