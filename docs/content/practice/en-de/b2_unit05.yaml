      part_of_speech: verb
      agreement_tags: {semantic: w_schreibt}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Felix {item} eine Nachricht.', language_code: de, direction: ltr}
  feedback_frame: {text: Felix writes a message. Schreiben = 'to write'. This lesson contrasts the two ways Felix can address the person he's writing to., language_code: en, direction: ltr}
