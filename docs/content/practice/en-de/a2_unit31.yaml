    answer_derivation: {kind: render_frame, frame: {text: "Gibt es eine {item} Verbindung?", language_code: de, direction: ltr}}
    feedback_frame: {text: "Both adjectives end in -e before the feminine noun Verbindung.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit31.lesson02.order.009
