schema_version: '1.0'
pack_key: practice.en-de.c1.unit08
source_language: en
target_language: de
unit_content_key: de.c1.unit08.mit_rhetorik_ueberzeugen
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-de backfill lexemes (tags de_c1_u8 / w_<token>). 34 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Appell, w_Betonung, w_Kauf, w_Parallelismus, w_Produkt, w_Publikum, w_Qualität, w_Schluss, w_Verantwortung, w_Vertrauen, w_Wahl, w_appelliere, w_appellieren, w_braucht, w_erhalten, w_genau, w_gerade, w_gewinnen, w_gründlich, w_hält, w_jetzt, w_können, w_liefern, w_nehmen, w_rhetorische, w_riskieren, w_schnell, w_testen, w_ungeschützt, w_verbindet, w_verspricht, w_wirklich, w_wollen, w_überzeugen]
templates:
- content_key: practice.en-de.de.c1.unit08.lesson01.choose.001
  lesson_content_key: de.c1.unit08.lesson01.vier_mittel
  type: multiple_choice
  frame: {text: '{item}', language_code: de, direction: ltr}
  slots:
    item: &id001
      language_code: de
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_überzeugen, w_rhetorische, w_braucht, w_Parallelismus, w_Betonung, w_Appell, w_Publikum, w_wirklich, w_riskieren, w_wollen, w_ungeschützt, w_erhalten, w_Wahl, w_können, w_schnell, w_testen, w_gründlich, w_Vertrauen, w_gewinnen, w_Kauf, w_nehmen, w_gerade, w_jetzt, w_Qualität, w_appellieren, w_appelliere, w_Verantwortung, w_liefern, w_Produkt, w_hält, w_verspricht, w_verbindet, w_Schluss, w_genau]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the four devices of rhetoric.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.c1.unit08.lesson02.listen.001
  lesson_content_key: de.c1.unit08.lesson02.rhetorische_fragen
  type: listen_select
  frame: {text: '{item}', language_code: de, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on asking rhetorical questions.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.c1.unit08.lesson03.translate.001
  lesson_content_key: de.c1.unit08.lesson03.parallelismus
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on persuading with parallelism.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.c1.unit08.lesson04.match.001
  lesson_content_key: de.c1.unit08.lesson04.betonung_appell
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: de, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each German word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
