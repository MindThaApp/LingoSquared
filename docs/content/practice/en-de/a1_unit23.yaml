schema_version: "1.0"
pack_key: practice.en-de.a1.unit23
source_language: en
target_language: de
unit_content_key: de.a1.unit23.telefonieren
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-de) from scripts/backfill_lexemes_en_de.py lexemes (curated w_<token> pools). Formal Sie named in English prompts. Separable anrufen: Ich rufe Felix an. Wegen takes the genitive (wegen des
    Treffens); the frame keeps Treffens literal. Treffen (noun) and treffen (verb) differ only by capital, so they are never in
    one recognition, matching or bare-word pool. anrufen is only in recognition/matching/bare because a clean frame needs
    'möchte', not yet confirmed as taught. Reviewer: confirm Hallo/hier ist phrasing is not required here.
    Opus quality pass 2026-10-24: spelled Café consistently and removed bitte from two formal translations (bitte position is free, so the prompt was underdetermined).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Telefon, w_anrufen, w_rufe, w_wiederholen, w_sprechen, w_langsam, w_wegen, w_des, w_Treffen, w_schreibe, w_uns, w_treffen]
slot_presets:
  words_1: &words_1 {language_code: de, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_Telefon, w_anrufen, w_rufe, w_wiederholen, w_sprechen, w_langsam]}}
  words_2: &words_2 {language_code: de, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_Telefon, w_rufe, w_wiederholen, w_sprechen, w_langsam]}}
  words_3: &words_3 {language_code: de, part_of_speech: [adjective, noun, preposition, pronoun, verb], agreement_tags: {semantic: [w_wegen, w_des, w_Treffen, w_schreibe, w_uns, w_langsam]}}
  words_4: &words_4 {language_code: de, part_of_speech: [noun, preposition, pronoun, verb], agreement_tags: {semantic: [w_wegen, w_Treffen, w_schreibe, w_uns, w_rufe]}}
  order_5: &order_5 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_rufe}}
  order_6: &order_6 {language_code: de, part_of_speech: [preposition], agreement_tags: {semantic: w_des}}
  order_7: &order_7 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_treffen}}
  match_8: &match_8 {language_code: de, part_of_speech: [noun, preposition, pronoun, verb], agreement_tags: {semantic: [w_wegen, w_des, w_Treffen, w_schreibe, w_uns, w_Telefon]}}
  fill_9: &fill_9 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_sprechen}}
  fill_10: &fill_10 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_schreibe}}
  fill_11: &fill_11 {language_code: de, part_of_speech: [pronoun], agreement_tags: {semantic: w_uns}}
  fill_12: &fill_12 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Treffen}}
  bare_13: &bare_13 {language_code: de, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_Telefon, w_anrufen, w_wiederholen, w_langsam]}}
  one_14: &one_14 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_wiederholen}}
  one_15: &one_15 {language_code: de, part_of_speech: [adjective], agreement_tags: {semantic: w_langsam}}
  one_16: &one_16 {language_code: de, part_of_speech: [preposition], agreement_tags: {semantic: w_wegen}}
templates:
  - content_key: practice.en-de.de.a1.unit23.lesson01.choose.001
    lesson_content_key: de.a1.unit23.lesson01.am_telefon
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Anrufen is separable: Ich rufe Felix an.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson01.listen.002
    lesson_content_key: de.a1.unit23.lesson01.am_telefon
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Das Telefon is neuter.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson02.choose.003
    lesson_content_key: de.a1.unit23.lesson02.nachricht_schreiben
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Wegen takes the genitive: wegen des Treffens.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson02.listen.004
    lesson_content_key: de.a1.unit23.lesson02.nachricht_schreiben
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ich schreibe ends in -e.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson01.order.005
    lesson_content_key: de.a1.unit23.lesson01.am_telefon
    type: word_order
    frame: {text: "Ich {item} Felix an.", language_code: de, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Ich {item} Felix an.", language_code: de, direction: ltr}}
    feedback_frame: {text: "The separable prefix an goes to the end: Ich rufe Felix an.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson02.order.006
    lesson_content_key: de.a1.unit23.lesson02.nachricht_schreiben
    type: word_order
    frame: {text: "Ich rufe wegen {item} Treffens an.", language_code: de, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Ich rufe wegen {item} Treffens an.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Wegen takes the genitive: wegen des Treffens.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson02.order.007
    lesson_content_key: de.a1.unit23.lesson02.nachricht_schreiben
    type: word_order
    frame: {text: "Wir {item} uns um neun Uhr vor dem Caf\u00e9.", language_code: de, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "Wir {item} uns um neun Uhr vor dem Caf\u00e9.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Sich treffen is reflexive: wir treffen uns.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson01.match.008
    lesson_content_key: de.a1.unit23.lesson01.am_telefon
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *words_1, second: *words_1, third: *words_1, fourth: *words_1, fifth: *words_1, sixth: *words_1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Sprechen Sie is a formal command.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson02.match.009
    lesson_content_key: de.a1.unit23.lesson02.nachricht_schreiben
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *match_8, second: *match_8, third: *match_8, fourth: *match_8, fifth: *match_8, sixth: *match_8}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Des is the genitive article for masculine and neuter nouns.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson01.fill.010
    lesson_content_key: de.a1.unit23.lesson01.am_telefon
    type: fill_in_blank
    frame: {text: "Bitte {item} Sie langsam. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_9, hint: *fill_9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "A formal command puts the verb first, or second after bitte.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson02.fill.011
    lesson_content_key: de.a1.unit23.lesson02.nachricht_schreiben
    type: fill_in_blank
    frame: {text: "Ich {item} Ihnen eine Nachricht. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_10, hint: *fill_10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "With ich the verb ends in -e.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson02.fill.012
    lesson_content_key: de.a1.unit23.lesson02.nachricht_schreiben
    type: fill_in_blank
    frame: {text: "Wir treffen {item} um neun Uhr vor dem Caf\u00e9. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_11, hint: *fill_11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Uns is the reflexive pronoun for wir.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson02.fill.013
    lesson_content_key: de.a1.unit23.lesson02.nachricht_schreiben
    type: fill_in_blank
    frame: {text: "Das {item} ist um neun Uhr. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_12, hint: *fill_12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Treffen as a noun is neuter and capitalised.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson01.translate.014
    lesson_content_key: de.a1.unit23.lesson01.am_telefon
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bare_13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Anrufen is a separable verb.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson01.translate.015
    lesson_content_key: de.a1.unit23.lesson01.am_telefon
    type: translation
    frame: {text: "Can you repeat that? (formal)", language_code: en, direction: ltr}
    slots: {item: *one_14}
    answer_derivation: {kind: render_frame, frame: {text: "Können Sie das {item}?", language_code: de, direction: ltr}}
    feedback_frame: {text: "After können the infinitive goes to the end; add bitte to sound more polite.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson01.translate.016
    lesson_content_key: de.a1.unit23.lesson01.am_telefon
    type: translation
    frame: {text: "Speak slowly. (formal)", language_code: en, direction: ltr}
    slots: {item: *one_15}
    answer_derivation: {kind: render_frame, frame: {text: "Sprechen Sie {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "A formal command puts the verb first; bitte softens it: Sprechen Sie bitte langsam.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson02.translate.017
    lesson_content_key: de.a1.unit23.lesson02.nachricht_schreiben
    type: translation
    frame: {text: "I am calling about the meeting.", language_code: en, direction: ltr}
    slots: {item: *one_16}
    answer_derivation: {kind: render_frame, frame: {text: "Ich rufe {item} des Treffens an.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Wegen is followed by the genitive.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit23.lesson02.translate.018
    lesson_content_key: de.a1.unit23.lesson02.nachricht_schreiben
    type: translation
    frame: {text: "We meet at nine o’clock in front of the cafe.", language_code: en, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "Wir {item} uns um neun Uhr vor dem Cafe.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Treffen is reflexive here.", language_code: en, direction: ltr}
