    feedback_frame: {text: "Gefühl is a noun and is capitalised.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson02.translate.014
    lesson_content_key: de.a1.unit22.lesson02.grund_nennen
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bare_13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Weil is a conjunction: it joins a reason to the main clause.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson01.translate.015
    lesson_content_key: de.a1.unit22.lesson01.gefuehle_nennen
    type: translation
    frame: {text: "I am happy.", language_code: en, direction: ltr}
    slots: {item: *one_14}
    answer_derivation: {kind: render_frame, frame: {text: "Ich bin {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Froh follows bin and is not inflected.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson01.translate.016
    lesson_content_key: de.a1.unit22.lesson01.gefuehle_nennen
    type: translation
    frame: {text: "I am tired.", language_code: en, direction: ltr}
    slots: {item: *one_15}
    answer_derivation: {kind: render_frame, frame: {text: "Ich bin {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Feelings follow bin.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson01.translate.017
    lesson_content_key: de.a1.unit22.lesson01.gefuehle_nennen
    type: translation
    frame: {text: "How do you feel today? (formal)", language_code: en, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Wie {item} Sie sich heute?", language_code: de, direction: ltr}}
    feedback_frame: {text: "Wie fühlen Sie sich? uses the reflexive sich.", language_code: en, direction: ltr}
