templates:
  - content_key: practice.en-de.de.a1.unit22.lesson01.choose.001
    lesson_content_key: de.a1.unit22.lesson01.gefuehle_nennen
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Froh, müde and traurig are feelings; Gefühl is the noun.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson01.listen.002
    lesson_content_key: de.a1.unit22.lesson01.gefuehle_nennen
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Wie fühlen Sie sich? asks how you feel.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson02.choose.003
    lesson_content_key: de.a1.unit22.lesson02.grund_nennen
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Weil means because and sends the verb to the end.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson02.listen.004
    lesson_content_key: de.a1.unit22.lesson02.grund_nennen
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Frei habe: haben means to have; frei haben means to be off.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson01.order.005
    lesson_content_key: de.a1.unit22.lesson01.gefuehle_nennen
    type: word_order
    frame: {text: "Ich bin {item}.", language_code: de, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Ich bin {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Feelings follow bin and are not inflected: Ich bin froh.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson01.order.006
    lesson_content_key: de.a1.unit22.lesson01.gefuehle_nennen
    type: word_order
    frame: {text: "Wie {item} Sie sich heute?", language_code: de, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Wie {item} Sie sich heute?", language_code: de, direction: ltr}}
    feedback_frame: {text: "The question word wie comes first, then the verb.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson02.order.007
    lesson_content_key: de.a1.unit22.lesson02.grund_nennen
    type: word_order
    frame: {text: "Ich bin froh, {item} ich frei habe.", language_code: de, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "Ich bin froh, {item} ich frei habe.", language_code: de, direction: ltr}}
    feedback_frame: {text: "After weil the finite verb goes to the end: weil ich frei habe.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson01.match.008
    lesson_content_key: de.a1.unit22.lesson01.gefuehle_nennen
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *words_1, second: *words_1, third: *words_1, fourth: *words_1, fifth: *words_1, sixth: *words_1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Sich is the reflexive pronoun in Wie fühlen Sie sich?", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson02.match.009
    lesson_content_key: de.a1.unit22.lesson02.grund_nennen
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *match_8, second: *match_8, third: *match_8, fourth: *match_8, fifth: *match_8, sixth: *match_8}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Weil gives a reason; the verb moves to the end of its clause.", language_code: en, direction: ltr}
