    lesson_content_key: de.a1.unit22.lesson01.gefuehle_nennen
    type: fill_in_blank
    frame: {text: "Froh ist ein {item}. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_9, hint: *fill_9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Gefühl is neuter: ein Gefühl.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson01.fill.011
    lesson_content_key: de.a1.unit22.lesson01.gefuehle_nennen
    type: fill_in_blank
    frame: {text: "Wie fühlen Sie {item} heute? ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_10, hint: *fill_10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Fühlen is reflexive: Sie fühlen sich.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson02.fill.012
    lesson_content_key: de.a1.unit22.lesson02.grund_nennen
    type: fill_in_blank
    frame: {text: "Ich habe heute {item}. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_11, hint: *fill_11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Frei haben means to be off work.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit22.lesson01.translate.013
    lesson_content_key: de.a1.unit22.lesson01.gefuehle_nennen
    type: translation
