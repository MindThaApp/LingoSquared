schema_version: "1.0"
pack_key: practice.en-de.a1.unit22
source_language: en
target_language: de
unit_content_key: de.a1.unit22.gefuehle
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-de) from scripts/backfill_lexemes_en_de.py lexemes (curated w_<token> pools). Formal Sie named in English prompts. weil sends the finite verb to the end (weil ich frei habe). Feelings are
    predicate adjectives (Ich bin froh). The word_order pool froh/müde/traurig is natural in Ich bin ___. Reviewer: confirm
    'frei' gloss 'free; off' fits 'Ich habe heute frei' (I am off today).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Gefühl, w_froh, w_müde, w_traurig, w_fühlen, w_sich, w_weil, w_frei]
slot_presets:
  words_1: &words_1 {language_code: de, part_of_speech: [adjective, noun, pronoun, verb], agreement_tags: {semantic: [w_Gefühl, w_froh, w_müde, w_traurig, w_fühlen, w_sich]}}
  words_2: &words_2 {language_code: de, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_Gefühl, w_froh, w_müde, w_traurig, w_fühlen]}}
  words_3: &words_3 {language_code: de, part_of_speech: [adjective, particle], agreement_tags: {semantic: [w_weil, w_frei, w_froh, w_müde]}}
  words_4: &words_4 {language_code: de, part_of_speech: [adjective, particle], agreement_tags: {semantic: [w_weil, w_frei, w_froh, w_traurig]}}
  order_5: &order_5 {language_code: de, part_of_speech: [adjective], agreement_tags: {semantic: [w_froh, w_müde, w_traurig]}}
  order_6: &order_6 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_fühlen}}
  order_7: &order_7 {language_code: de, part_of_speech: [particle], agreement_tags: {semantic: w_weil}}
  match_8: &match_8 {language_code: de, part_of_speech: [adjective, noun, particle], agreement_tags: {semantic: [w_weil, w_frei, w_froh, w_müde, w_traurig, w_Gefühl]}}
  fill_9: &fill_9 {language_code: de, part_of_speech: [noun], agreement_tags: {semantic: w_Gefühl}}
  fill_10: &fill_10 {language_code: de, part_of_speech: [pronoun], agreement_tags: {semantic: w_sich}}
  fill_11: &fill_11 {language_code: de, part_of_speech: [adjective], agreement_tags: {semantic: w_frei}}
  bare_12: &bare_12 {language_code: de, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_Gefühl, w_froh, w_müde, w_traurig]}}
