schema_version: "1.0"
pack_key: practice.en-de.b1.unit53
source_language: en
target_language: de
unit_content_key: de.b1.unit53.beschreibungen
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-de B1 set) from scripts/backfill_lexemes_en_de.py (en-de-b1 course; w_<token> anchors, one token per sentence slot, recognition and production pools are this unit's own content words with distinct glosses). Unit teaches relative clauses (nominative and after a preposition). NATIVE FLAG: relative-clause word order variants ('Kaffee jeden Tag bestellt'); 'Cafe' spelling accepted next to 'Café'; 'an dem' / 'am', 'in dem' / 'im' expansions.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_Kunde", "w_bestellt", "w_bestellen", "w_heißt", "w_Herr", "w_arbeitet", "w_beliebt", "w_Tisch", "w_sitzen", "w_reserviert", "w_Mann", "w_Fenster", "w_sitzt", "w_Lieblingsplatz"]
slot_presets:
  p1: &p1 {language_code: de, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: ["w_Kunde", "w_bestellt", "w_bestellen", "w_heißt", "w_Herr", "w_arbeitet", "w_beliebt", "w_Tisch", "w_sitzen", "w_reserviert", "w_Mann", "w_Fenster", "w_sitzt", "w_Lieblingsplatz"]}}
  p2: &p2 {language_code: de, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: ["w_Lieblingsplatz", "w_sitzt", "w_Fenster", "w_Mann", "w_reserviert", "w_sitzen", "w_Tisch", "w_beliebt", "w_arbeitet", "w_Herr", "w_heißt", "w_bestellen", "w_bestellt", "w_Kunde"]}}
  p3: &p3 {language_code: de, part_of_speech: noun, agreement_tags: {semantic: "w_Kunde"}}
  p4: &p4 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: "w_bestellt"}}
  p5: &p5 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: "w_arbeitet"}}
  p6: &p6 {language_code: de, part_of_speech: adjective, agreement_tags: {semantic: "w_beliebt"}}
  p7: &p7 {language_code: de, part_of_speech: noun, agreement_tags: {semantic: "w_Tisch"}}
  p8: &p8 {language_code: de, part_of_speech: noun, agreement_tags: {semantic: "w_Fenster"}}
  p9: &p9 {language_code: de, part_of_speech: noun, agreement_tags: {semantic: "w_Lieblingsplatz"}}
templates:
  - content_key: practice.en-de.de.b1.unit53.lesson01.choose.001
    lesson_content_key: de.b1.unit53.lesson01.relativsaetze_nominativ
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
