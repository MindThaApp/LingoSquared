schema_version: '1.0'
pack_key: practice.en-de.c1.unit06
source_language: en
target_language: de
unit_content_key: de.c1.unit06.nicht_woertlich_gemeint
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-de backfill lexemes (tags de_c1_u6 / w_<token>). 50 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Auge, w_Ausdrücke, w_Ausschlag, w_Beispiel, w_Bericht, w_Bier, w_Frage, w_Hand, w_Kopf, w_Lösung, w_Maßnahmen, w_Nagel, w_Preis, w_Problem, w_Projekt, w_Punkt, w_Redewendung, w_Sinne, w_Spiel, w_Stellen, w_Vortrag, w_Weichen, w_Wendung, w_Zukunft, w_Zuständigkeitsbereich, w_bringen, w_darf, w_ergreifen, w_feste, w_fällt, w_geben, w_gebracht, w_getroffen, w_idiomatischer, w_liegt, w_nutzt, w_nächste, w_paar, w_recht, w_richtig, w_steht, w_stellen, w_tragen, w_treffen, w_vereinbaren, w_wichtigen, w_wird, w_wollte, w_übersetzt, w_übertragenen]
templates:
- content_key: practice.en-de.de.c1.unit06.lesson01.choose.001
  lesson_content_key: de.c1.unit06.lesson01.woertlich_oder_uebertragen
  type: multiple_choice
  frame: {text: '{item}', language_code: de, direction: ltr}
  slots:
    item: &id001
      language_code: de
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_Redewendung, w_übertragenen, w_Sinne, w_Nagel, w_Kopf, w_treffen, w_getroffen, w_Punkt, w_bringen, w_gebracht, w_Problem, w_liegt, w_Hand, w_Lösung, w_Frage, w_stellen, w_darf, w_vereinbaren, w_Vortrag, w_Maßnahmen, w_ergreifen, w_steht, w_Spiel, w_Projekt, w_Ausschlag, w_geben, w_Preis, w_wird, w_Weichen, w_Zukunft, w_Auge, w_Bier, w_fällt, w_Zuständigkeitsbereich, w_wichtigen, w_richtig, w_Bericht, w_nächste, w_Ausdrücke, w_tragen, w_übersetzt, w_paar, w_Stellen, w_recht, w_wollte, w_idiomatischer, w_Beispiel, w_nutzt, w_feste, w_Wendung]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on literal or figurative.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.c1.unit06.lesson02.listen.001
  lesson_content_key: de.c1.unit06.lesson02.feste_wendungen
  type: listen_select
  frame: {text: '{item}', language_code: de, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on fixed collocations.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.c1.unit06.lesson03.translate.001
  lesson_content_key: de.c1.unit06.lesson03.bildhafte_sprache
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on figurative language.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.c1.unit06.lesson04.match.001
  lesson_content_key: de.c1.unit06.lesson04.figurative_sprache_lesen
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: de, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each German word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
