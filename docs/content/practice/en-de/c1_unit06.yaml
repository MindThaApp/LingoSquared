  answer_derivation:
    kind: render_frame
    frame: {text: 'Darf ich Ihnen eine {item} stellen?', language_code: de, direction: ltr}
  feedback_frame: {text: 'May I ask you a question? Frage means question.', language_code: en, direction: ltr}
