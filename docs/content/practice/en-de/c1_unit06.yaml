  lesson_content_key: de.c1.unit06.lesson02.feste_wendungen
  type: fill_in_blank
  frame:
    text: Man sagt eine Frage {item}, nicht eine Frage machen. ({hint})
    language_code: de
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_stellen}
    hint:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_stellen}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'One says ''eine Frage stellen'', not ''eine Frage machen''. German has fixed verb-noun pairings (collocations). English ''make/do/give/take'' do not map one-to-one: eine Frage stellen, einen Termin vereinbaren, einen Vortrag halten.', language_code: en, direction: ltr}
