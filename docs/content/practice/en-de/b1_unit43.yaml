    type: fill_in_blank
    frame: {text: "Und haben Sie {item}? ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Geantwortet is the participle of antworten.", language_code: en, direction: ltr}
