    lesson_content_key: de.b1.unit43.lesson03.cafe_dialogue
    type: translation
    frame: {text: "And did you answer?", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Und haben Sie {item}?", language_code: de, direction: ltr}}
    feedback_frame: {text: "Geantwortet is the participle of antworten.", language_code: en, direction: ltr}
