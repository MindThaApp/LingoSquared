- content_key: practice.en-de.de.b2.unit04.lesson04.order.002
  lesson_content_key: de.b2.unit04.lesson04.plusquamperfekt
  type: word_order
  frame: {text: 'Ich hatte den {item} nicht gestellt.', language_code: de, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: noun
      agreement_tags: {semantic: w_Wecker}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ich hatte den {item} nicht gestellt.', language_code: de, direction: ltr}
  feedback_frame: {text: 'I had not set the alarm. PLUSQUAMPERFEKT: hatte + past participle (gestellt), sent to the very end. This marks an event that was already true BEFORE the rest of the story''s timeline -- English ''had not set'' works the same way.', language_code: en, direction: ltr}
