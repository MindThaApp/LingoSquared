    frame: {text: 'Ich {item} müde.', language_code: de, direction: ltr}
  feedback_frame: {text: 'I was tired. War (Präteritum of sein) is one of the small set of high-frequency verbs (sein, haben, the modals) that German narrates in Präteritum even in otherwise spoken/Perfekt-based storytelling. This lesson sets the.', language_code: en, direction: ltr}
