- content_key: practice.en-de.de.b2.unit04.lesson02.order.002
  lesson_content_key: de.b2.unit04.lesson02.ereignis
  type: word_order
  frame: {text: 'Ich habe den {item} verpasst.', language_code: de, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: noun
      agreement_tags: {semantic: w_Bus}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ich habe den {item} verpasst.', language_code: de, direction: ltr}
  feedback_frame: {text: I missed the bus. Habe ... verpasst is PERFEKT -- the usual past tense for most verbs when you tell a story aloud. In written storytelling the same event would normally be in Präteritum (verpasste)., language_code: en, direction: ltr}
