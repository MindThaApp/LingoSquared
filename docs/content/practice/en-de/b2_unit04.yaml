      part_of_speech: adverb
      agreement_tags: {semantic: w_schon}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'The train had already departed. Abfahren takes sein, so its Plusquamperfekt is war ... abgefahren, not hatte ... abgefahren.', language_code: en, direction: ltr}
