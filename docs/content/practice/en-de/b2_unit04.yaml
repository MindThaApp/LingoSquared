    frame: {text: 'Der Zug war schon {item}, bevor ich am Bahnhof ankam.', language_code: de, direction: ltr}
  feedback_frame: {text: The train had already departed before I arrived at the station. abgefahren means train had already departed.., language_code: en, direction: ltr}
