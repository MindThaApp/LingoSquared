schema_version: "1.0"
pack_key: practice.en-de.b1.unit40
source_language: en
target_language: de
unit_content_key: de.b1.unit40.erzaehlung
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-de B1 set) from scripts/backfill_lexemes_en_de.py (en-de-b1 course; w_<token> anchors, one token per sentence slot, recognition and production pools are this unit's own content words with distinct glosses). Unit teaches the simple past in a während-clause, and reported statements with sagte. NATIVE FLAG: the spelling 'Cafe' (as in the lessons) is accepted next to 'Café'; 'ich bin' vs 'ich sei' in reported speech is not taught; the variant without dass is plain spoken German.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_arbeitete", "w_klingelte", "w_Telefon", "w_Café", "w_dann", "w_kam", "w_beschäftigt", "w_sehr", "w_sagte", "w_gestern", "w_plötzlich", "w_Freundin", "w_bestimmt"]
slot_presets:
  p1: &p1 {language_code: de, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: ["w_arbeitete", "w_klingelte", "w_Telefon", "w_Café", "w_dann", "w_kam", "w_beschäftigt", "w_sehr", "w_sagte", "w_gestern", "w_plötzlich", "w_Freundin", "w_bestimmt"]}}
  p2: &p2 {language_code: de, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: ["w_bestimmt", "w_Freundin", "w_plötzlich", "w_gestern", "w_sagte", "w_sehr", "w_beschäftigt", "w_kam", "w_dann", "w_Café", "w_Telefon", "w_klingelte", "w_arbeitete"]}}
  p3: &p3 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: "w_arbeitete"}}
  p4: &p4 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: "w_klingelte"}}
  p5: &p5 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: "w_kam"}}
  p6: &p6 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: "w_sagte"}}
  p7: &p7 {language_code: de, part_of_speech: adverb, agreement_tags: {semantic: "w_plötzlich"}}
  p8: &p8 {language_code: de, part_of_speech: adverb, agreement_tags: {semantic: "w_bestimmt"}}
templates:
  - content_key: practice.en-de.de.b1.unit40.lesson01.choose.001
    lesson_content_key: de.b1.unit40.lesson01.waehrend_praeteritum
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson03.choose.001
    lesson_content_key: de.b1.unit40.lesson03.cafe_dialogue
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson02.listen.001
    lesson_content_key: de.b1.unit40.lesson02.reported_speech
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson01.translate.001
    lesson_content_key: de.b1.unit40.lesson01.waehrend_praeteritum
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Type the German word; nouns keep their capital letter.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson03.match.001
    lesson_content_key: de.b1.unit40.lesson03.cafe_dialogue
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: de, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words from this unit and their meanings.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson01.order.001
    lesson_content_key: de.b1.unit40.lesson01.waehrend_praeteritum
    type: word_order
    frame: {text: "Während ich im Café {item}, klingelte das Telefon.", language_code: de, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Während ich im Café {item}, klingelte das Telefon.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Während sends the verb to the end; arbeitete is the simple past.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson01.fill.001
    lesson_content_key: de.b1.unit40.lesson01.waehrend_praeteritum
    type: fill_in_blank
    frame: {text: "Während ich im Café {item}, klingelte das Telefon. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Während sends the verb to the end; arbeitete is the simple past.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson01.translate.002
    lesson_content_key: de.b1.unit40.lesson01.waehrend_praeteritum
    type: translation
    frame: {text: "While I was working in the cafe, the phone rang.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Während ich im Café {item}, klingelte das Telefon.", language_code: de, direction: ltr}, accepted_variants: ["Das Telefon klingelte, während ich im Café {item}.", "Während ich im Cafe {item}, klingelte das Telefon."]}
    feedback_frame: {text: "Während sends the verb to the end; arbeitete is the simple past.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson01.order.002
    lesson_content_key: de.b1.unit40.lesson01.waehrend_praeteritum
    type: word_order
    frame: {text: "Während ich im Café arbeitete, {item} das Telefon.", language_code: de, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Während ich im Café arbeitete, {item} das Telefon.", language_code: de, direction: ltr}}
    feedback_frame: {text: "In the main clause the verb comes straight after the während-clause.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson01.fill.002
    lesson_content_key: de.b1.unit40.lesson01.waehrend_praeteritum
    type: fill_in_blank
    frame: {text: "Während ich im Café arbeitete, {item} das Telefon. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "In the main clause the verb comes straight after the während-clause.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson01.order.003
    lesson_content_key: de.b1.unit40.lesson01.waehrend_praeteritum
    type: word_order
    frame: {text: "Dann {item} Felix ins Café.", language_code: de, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Dann {item} Felix ins Café.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Kam is the simple past of kommen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson01.fill.003
    lesson_content_key: de.b1.unit40.lesson01.waehrend_praeteritum
    type: fill_in_blank
    frame: {text: "Dann {item} Felix ins Café. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p5, hint: *p5}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Kam is the simple past of kommen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson01.translate.003
    lesson_content_key: de.b1.unit40.lesson01.waehrend_praeteritum
    type: translation
    frame: {text: "Then Felix came into the cafe.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Dann {item} Felix ins Café.", language_code: de, direction: ltr}, accepted_variants: ["Felix {item} dann ins Café.", "Dann {item} Felix in das Café."]}
    feedback_frame: {text: "Kam is the simple past of kommen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson02.order.001
    lesson_content_key: de.b1.unit40.lesson02.reported_speech
    type: word_order
    frame: {text: "Felix {item}, dass ich heute sehr beschäftigt bin.", language_code: de, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Felix {item}, dass ich heute sehr beschäftigt bin.", language_code: de, direction: ltr}}
    feedback_frame: {text: "After dass the verb goes to the end; without dass it stays second.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson02.fill.001
    lesson_content_key: de.b1.unit40.lesson02.reported_speech
    type: fill_in_blank
    frame: {text: "Felix {item}, dass ich heute sehr beschäftigt bin. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After dass the verb goes to the end; without dass it stays second.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson02.translate.001
    lesson_content_key: de.b1.unit40.lesson02.reported_speech
    type: translation
    frame: {text: "Felix said that I am very busy today.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Felix {item}, dass ich heute sehr beschäftigt bin.", language_code: de, direction: ltr}, accepted_variants: ["Felix {item}, ich bin heute sehr beschäftigt."]}
    feedback_frame: {text: "After dass the verb goes to the end; without dass it stays second.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson03.fill.001
    lesson_content_key: de.b1.unit40.lesson03.cafe_dialogue
    type: fill_in_blank
    frame: {text: "Während ich gestern im Café arbeitete, klingelte {item} das Telefon. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Plötzlich is an adverb and does not change.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson03.translate.001
    lesson_content_key: de.b1.unit40.lesson03.cafe_dialogue
    type: translation
    frame: {text: "While I was working in the cafe yesterday, the phone suddenly rang.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Während ich gestern im Café arbeitete, klingelte {item} das Telefon.", language_code: de, direction: ltr}, accepted_variants: ["Während ich gestern im Café arbeitete, klingelte das Telefon {item}."]}
    feedback_frame: {text: "Plötzlich is an adverb and does not change.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.b1.unit40.lesson03.fill.002
    lesson_content_key: de.b1.unit40.lesson03.cafe_dialogue
    type: fill_in_blank
    frame: {text: "Das stimmt {item}! ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Bestimmt means certainly here.", language_code: en, direction: ltr}
