schema_version: "1.0"
pack_key: practice.en-de.a1.unit14
source_language: en
target_language: de
unit_content_key: de.a1.unit14.vorlieben
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-de) from scripts/backfill_lexemes_en_de.py lexemes (curated
    w_<token> pools). Mag (I like; he/she likes) and the formal mögen are kept out of the same
    pool; sentence-initial Mögen is never a slot, so mögen appears only in recognition and
    matching. Nimmt/trinkt are third-person forms; frames name their subject (Er, Anna). Lieber in
    "Ich trinke lieber Tee" is the comparative of gern; frames avoid the alternative order
    "Ich trinke Tee lieber" by using mag, nehme and nimmt for word-order items. Reviewer: confirm the
    prompt "I would rather drink tea" matches the unit's audio.
    Opus quality pass 2026-10-24: fixed mag and lieber feedback and made the I/He take water prompts natural English (I'll have water).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_mag, w_lieber, w_trinke, w_nehme, w_aber, w_mögen, w_trinkt, w_nimmt]
slot_presets:
  words_1: &words_1 {language_code: de, part_of_speech: [adjective, particle, verb], agreement_tags: {semantic: [w_mag, w_lieber, w_trinke, w_nehme, w_aber]}}
  words_2: &words_2 {language_code: de, part_of_speech: [adjective, particle, verb], agreement_tags: {semantic: [w_mögen, w_lieber, w_trinke, w_nehme, w_aber]}}
  words_3: &words_3 {language_code: de, part_of_speech: [adjective, particle, verb], agreement_tags: {semantic: [w_trinkt, w_nimmt, w_aber, w_lieber]}}
  words_4: &words_4 {language_code: de, part_of_speech: [particle, verb], agreement_tags: {semantic: [w_trinkt, w_nimmt, w_aber, w_mag]}}
  order_5: &order_5 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_nehme}}
  order_6: &order_6 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_nimmt}}
  order_7: &order_7 {language_code: de, part_of_speech: [particle], agreement_tags: {semantic: w_aber}}
  match_8: &match_8 {language_code: de, part_of_speech: [adjective, particle, verb], agreement_tags: {semantic: [w_mögen, w_lieber, w_trinke, w_nehme, w_aber, w_trinkt]}}
  fill_9: &fill_9 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_mag}}
  fill_10: &fill_10 {language_code: de, part_of_speech: [adjective], agreement_tags: {semantic: w_lieber}}
  fill_11: &fill_11 {language_code: de, part_of_speech: [verb], agreement_tags: {semantic: w_trinkt}}
  bare_12: &bare_12 {language_code: de, part_of_speech: [adjective, particle, verb], agreement_tags: {semantic: [w_lieber, w_aber, w_trinke, w_nehme, w_mag, w_trinkt, w_nimmt]}}
templates:
  - content_key: practice.en-de.de.a1.unit14.lesson01.choose.001
    lesson_content_key: de.a1.unit14.lesson01.moegen_und_lieber
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mag is irregular: ich mag and er mag share one form, with no -t ending.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson01.listen.002
    lesson_content_key: de.a1.unit14.lesson01.moegen_und_lieber
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mögen Sie ...? is the formal question form of mag.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson02.choose.003
    lesson_content_key: de.a1.unit14.lesson02.auswaehlen_im_cafe
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Nimmt has an irregular stem: er nimmt, but ich nehme.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson02.listen.004
    lesson_content_key: de.a1.unit14.lesson02.auswaehlen_im_cafe
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *words_4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Aber joins two contrasting clauses, with a comma before it.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson01.order.005
    lesson_content_key: de.a1.unit14.lesson01.moegen_und_lieber
    type: word_order
    frame: {text: "Ich {item} Wasser.", language_code: de, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Ich {item} Wasser.", language_code: de, direction: ltr}}
    feedback_frame: {text: "With ich the verb ends in -e: Ich nehme Wasser.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson02.order.006
    lesson_content_key: de.a1.unit14.lesson02.auswaehlen_im_cafe
    type: word_order
    frame: {text: "Er {item} Wasser.", language_code: de, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Er {item} Wasser.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Nehmen changes its vowel with er: er nimmt.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson02.order.007
    lesson_content_key: de.a1.unit14.lesson02.auswaehlen_im_cafe
    type: word_order
    frame: {text: "Ich mag Kaffee, {item} ich nehme Wasser.", language_code: de, direction: ltr}
    slots: {item: *order_7}
    answer_derivation: {kind: render_frame, frame: {text: "Ich mag Kaffee, {item} ich nehme Wasser.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Aber starts a new clause after a comma, and the verb still comes second there.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson02.match.008
    lesson_content_key: de.a1.unit14.lesson02.auswaehlen_im_cafe
    type: matching_pairs
    frame: {text: "{first} \u00b7 {second} \u00b7 {third} \u00b7 {fourth} \u00b7 {fifth} \u00b7 {sixth}", language_code: de, direction: ltr}
    slots: {first: *match_8, second: *match_8, third: *match_8, fourth: *match_8, fifth: *match_8, sixth: *match_8}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Trinke belongs to ich and trinkt belongs to er, sie or es.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson01.fill.009
    lesson_content_key: de.a1.unit14.lesson01.moegen_und_lieber
    type: fill_in_blank
    frame: {text: "Ich {item} Tee. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_9, hint: *fill_9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mag is the ich-form of mögen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson01.fill.010
    lesson_content_key: de.a1.unit14.lesson01.moegen_und_lieber
    type: fill_in_blank
    frame: {text: "Ich trinke {item} Tee. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_10, hint: *fill_10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Lieber after the verb says what you prefer: Ich trinke lieber Tee, I prefer tea.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson01.fill.011
    lesson_content_key: de.a1.unit14.lesson01.moegen_und_lieber
    type: fill_in_blank
    frame: {text: "Ich {item} Kaffee. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *order_5, hint: *order_5}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Nehme is the ich-form of nehmen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson02.fill.012
    lesson_content_key: de.a1.unit14.lesson02.auswaehlen_im_cafe
    type: fill_in_blank
    frame: {text: "Er {item} Wasser. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *order_6, hint: *order_6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Nehmen changes its vowel with er: er nimmt.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson02.fill.013
    lesson_content_key: de.a1.unit14.lesson02.auswaehlen_im_cafe
    type: fill_in_blank
    frame: {text: "Anna {item} lieber Tee. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fill_11, hint: *fill_11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "With a name the verb ends in -t: Anna trinkt.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson01.translate.014
    lesson_content_key: de.a1.unit14.lesson01.moegen_und_lieber
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bare_12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The words lieber and aber are lowercase; the verbs change their ending with the subject.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson01.translate.015
    lesson_content_key: de.a1.unit14.lesson01.moegen_und_lieber
    type: translation
    frame: {text: "I like tea.", language_code: en, direction: ltr}
    slots: {item: *fill_9}
    answer_derivation: {kind: render_frame, frame: {text: "Ich {item} Tee.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Mag is the ich-form of mögen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson01.translate.016
    lesson_content_key: de.a1.unit14.lesson01.moegen_und_lieber
    type: translation
    frame: {text: "I'll have water.", language_code: en, direction: ltr}
    slots: {item: *order_5}
    answer_derivation: {kind: render_frame, frame: {text: "Ich {item} Wasser.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Nehme is the ich-form of nehmen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a1.unit14.lesson02.translate.017
    lesson_content_key: de.a1.unit14.lesson02.auswaehlen_im_cafe
    type: translation
    frame: {text: "He'll have water.", language_code: en, direction: ltr}
    slots: {item: *order_6}
    answer_derivation: {kind: render_frame, frame: {text: "Er {item} Wasser.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Nehmen changes its vowel with er: er nimmt.", language_code: en, direction: ltr}
