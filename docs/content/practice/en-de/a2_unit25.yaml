schema_version: "1.0"
pack_key: practice.en-de.a2.unit25
source_language: en
target_language: de
unit_content_key: de.a2.unit25.behoerdengang
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-de A2 practice pack) against PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_de.py (curated w_<token> pools of this unit's own tokens). Sentence frames use single anchors or small unions in which every member is grammatical; English prompts name the formal Sie where the German form depends on it. Reviewer: confirm Bitte bringen Sie Ihren Pass mit and the registration vocabulary (Anmeldung, Meldeformular) as used at a German registration office.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_Termin", "w_Anmeldung", "w_Pass", "w_Meldeformular", "w_mitbringen", "w_Adresse", "w_Name", "w_abgeben", "w_bestätigen", "w_wohnen", "w_Dank", "w_wohne", "w_muss", "w_möchte", "w_bringen", "w_für"]
slot_presets:
  p1: &p1 {language_code: de, part_of_speech: [noun, verb], agreement_tags: {semantic: ["w_Termin", "w_Anmeldung", "w_Pass", "w_Meldeformular", "w_mitbringen"]}}
  p2: &p2 {language_code: de, part_of_speech: [noun, verb], agreement_tags: {semantic: ["w_Adresse", "w_Name", "w_abgeben", "w_bestätigen", "w_wohnen", "w_Dank"]}}
  p3: &p3 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: ["w_wohne", "w_muss", "w_möchte", "w_abgeben", "w_bestätigen"]}}
  p4: &p4 {language_code: de, part_of_speech: [noun, verb], agreement_tags: {semantic: ["w_Termin", "w_Anmeldung", "w_Pass", "w_Meldeformular", "w_bringen"]}}
  p5: &p5 {language_code: de, part_of_speech: noun, agreement_tags: {semantic: "w_Pass"}}
  p6: &p6 {language_code: de, part_of_speech: noun, agreement_tags: {semantic: "w_Adresse"}}
  p7: &p7 {language_code: de, part_of_speech: noun, agreement_tags: {semantic: "w_Name"}}
  p8: &p8 {language_code: de, part_of_speech: noun, agreement_tags: {semantic: ["w_Termin", "w_Anmeldung", "w_Pass", "w_Meldeformular", "w_Adresse", "w_Name", "w_Dank"]}}
  p9: &p9 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: ["w_wohnen", "w_muss", "w_abgeben", "w_bestätigen", "w_mitbringen", "w_möchte"]}}
  p10: &p10 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: "w_wohne"}}
  p11: &p11 {language_code: de, part_of_speech: preposition, agreement_tags: {semantic: "w_für"}}
  p12: &p12 {language_code: de, part_of_speech: verb, agreement_tags: {semantic: "w_muss"}}
  p13: &p13 {language_code: de, part_of_speech: noun, agreement_tags: {semantic: ["w_Termin", "w_Anmeldung", "w_Pass", "w_Meldeformular"]}}
  p14: &p14 {language_code: de, part_of_speech: [noun, verb], agreement_tags: {semantic: ["w_Adresse", "w_Name", "w_wohnen", "w_abgeben", "w_bestätigen", "w_Dank"]}}
  p15: &p15 {language_code: de, part_of_speech: noun, agreement_tags: {semantic: "w_Dank"}}
templates:
  - content_key: practice.en-de.de.a2.unit25.lesson01.choose.001
    lesson_content_key: de.a2.unit25.lesson01.termin_und_unterlagen
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Anmeldung is registering your address with the authorities; the Meldeformular is the form you hand in for it.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson02.listen.002
    lesson_content_key: de.a2.unit25.lesson02.adresse_und_nachfrage
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Wohnen is the infinitive; wohne is the form that goes with ich.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson02.choose.003
    lesson_content_key: de.a2.unit25.lesson02.adresse_und_nachfrage
    type: multiple_choice
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Wohne, muss and möchte are the forms that go with ich; abgeben and bestätigen are infinitives.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson01.listen.004
    lesson_content_key: de.a2.unit25.lesson01.termin_und_unterlagen
    type: listen_select
    frame: {text: "{item}", language_code: de, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Bringen is the polite command form used with Sie.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson01.order.005
    lesson_content_key: de.a2.unit25.lesson01.termin_und_unterlagen
    type: word_order
    frame: {text: "Bitte bringen Sie Ihren {item} mit.", language_code: de, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Bitte bringen Sie Ihren {item} mit.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Mitbringen is separable: mit goes to the end of the sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson02.order.006
    lesson_content_key: de.a2.unit25.lesson02.adresse_und_nachfrage
    type: word_order
    frame: {text: "Meine {item} ist Lindenstraße 8.", language_code: de, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Meine {item} ist Lindenstraße 8.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Adresse is feminine, so it takes meine.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson02.order.007
    lesson_content_key: de.a2.unit25.lesson02.adresse_und_nachfrage
    type: word_order
    frame: {text: "Mein {item} ist Felix Weber.", language_code: de, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Mein {item} ist Felix Weber.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Name is masculine, so it takes mein.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson01.match.008
    lesson_content_key: de.a2.unit25.lesson01.termin_und_unterlagen
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: de, direction: ltr}
    slots: {first: *p8, second: *p8, third: *p8, fourth: *p8, fifth: *p8, sixth: *p8}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Meldeformular joins Melde (registration) and Formular (form).", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson02.match.009
    lesson_content_key: de.a2.unit25.lesson02.adresse_und_nachfrage
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: de, direction: ltr}
    slots: {first: *p9, second: *p9, third: *p9, fourth: *p9, fifth: *p9, sixth: *p9}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Abgeben and mitbringen are separable verbs: their prefix moves to the end of a main clause.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson02.fill.010
    lesson_content_key: de.a2.unit25.lesson02.adresse_und_nachfrage
    type: fill_in_blank
    frame: {text: "Ich {item} in Berlin. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p10, hint: *p10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Wohne is the ich form of wohnen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson01.fill.011
    lesson_content_key: de.a2.unit25.lesson01.termin_und_unterlagen
    type: fill_in_blank
    frame: {text: "Der Termin ist {item} die Anmeldung. ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Für is followed by the accusative: für die Anmeldung.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson02.fill.012
    lesson_content_key: de.a2.unit25.lesson02.adresse_und_nachfrage
    type: fill_in_blank
    frame: {text: "Bis wann {item} ich das Meldeformular abgeben? ({hint})", language_code: de, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p12, hint: *p12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Muss is the ich form, and in this question it comes before ich.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson01.translate.013
    lesson_content_key: de.a2.unit25.lesson01.termin_und_unterlagen
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "German nouns keep their capital letter: Termin, Pass.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson02.translate.014
    lesson_content_key: de.a2.unit25.lesson02.adresse_und_nachfrage
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p14}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Infinitives end in -en: wohnen, abgeben, bestätigen.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson02.translate.015
    lesson_content_key: de.a2.unit25.lesson02.adresse_und_nachfrage
    type: translation
    frame: {text: "I live in Berlin.", language_code: en, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Ich {item} in Berlin.", language_code: de, direction: ltr}}
    feedback_frame: {text: "German uses the present tense: Ich wohne in Berlin.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson01.translate.016
    lesson_content_key: de.a2.unit25.lesson01.termin_und_unterlagen
    type: translation
    frame: {text: "Please bring your passport. (formal)", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Bitte bringen Sie Ihren {item} mit.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Mit goes to the end because mitbringen is separable.", language_code: en, direction: ltr}
  - content_key: practice.en-de.de.a2.unit25.lesson02.translate.017
    lesson_content_key: de.a2.unit25.lesson02.adresse_und_nachfrage
    type: translation
    frame: {text: "Thank you very much.", language_code: en, direction: ltr}
    slots: {item: *p15}
    answer_derivation: {kind: render_frame, frame: {text: "Vielen {item}.", language_code: de, direction: ltr}}
    feedback_frame: {text: "Vielen Dank is a fixed phrase; Dank is a noun, so it is capitalised.", language_code: en, direction: ltr}
