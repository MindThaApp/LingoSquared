- content_key: practice.en-de.de.b2.unit06.lesson02.order.002
  lesson_content_key: de.b2.unit06.lesson02.eine_meinung_einschraenken
  type: word_order
  frame: {text: 'Status ist unter {item} wichtig.', language_code: de, direction: ltr}
  slots:
    item:
      language_code: de
