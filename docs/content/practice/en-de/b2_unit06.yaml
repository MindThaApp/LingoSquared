      agreement_tags: {semantic: w_Umständen}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Status ist unter {item} wichtig.', language_code: de, direction: ltr}
  feedback_frame: {text: Status is important under certain circumstances. Umständen means under certain circumstances., language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit06.lesson03.order.002
  lesson_content_key: de.b2.unit06.lesson03.auf_eine_andere_meinung_reagieren
  type: word_order
  frame: {text: 'Das {item} ich anders.', language_code: de, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: verb
      agreement_tags: {semantic: w_sehe}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Das {item} ich anders.', language_code: de, direction: ltr}
  feedback_frame: {text: I see it differently. Das sehe ich anders states disagreement plainly but not aggressively -- 'anders' (differently) was introduced in the register unit; here it marks a difference of opinion rather than of register., language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit06.lesson03.fill.003
  lesson_content_key: de.b2.unit06.lesson03.auf_eine_andere_meinung_reagieren
  type: fill_in_blank
  frame:
    text: Da bin ich {item} Meinung. ({hint})
    language_code: de
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: de
      part_of_speech: adjective
      agreement_tags: {semantic: w_anderer}
    hint:
      language_code: de
      part_of_speech: adjective
      agreement_tags: {semantic: w_anderer}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I disagree with that. / I have a different opinion on that. Da bin ich anderer Meinung is a direct but still formal-register way to disagree -- Meinung (opinion) was introduced in Unit 1., language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit06.lesson03.translate.004
  lesson_content_key: de.b2.unit06.lesson03.auf_eine_andere_meinung_reagieren
  type: translation
  frame: {text: I don't quite agree., language_code: en, direction: ltr}
  slots:
    item:
      language_code: de
      part_of_speech: adverb
      agreement_tags: {semantic: w_ganz}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ich stimme nicht {item} zu.', language_code: de, direction: ltr}
  feedback_frame: {text: I don't quite agree. Ich stimme nicht ganz zu softens disagreement into partial agreement -- the mildest of this lesson's four responses. Compare Unit 1's Ich stimme dem zu (I agree with it)., language_code: en, direction: ltr}
