    frame: {text: 'Was bedeutet {item} für Sie?', language_code: de, direction: ltr}
  feedback_frame: {text: 'What does success mean to you? Erfolg means success.', language_code: en, direction: ltr}
- content_key: practice.en-de.de.b2.unit06.lesson01.fill.004
  lesson_content_key: de.b2.unit06.lesson01.was_ist_erfolg
