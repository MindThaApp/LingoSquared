    frame:
      text: I have an {item} at the DMV on Friday.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 「予約がある」は I have an appointment と言います。appointment は母音で始まるので、冠詞は an になります。
    language_code: ja
    direction: ltr
