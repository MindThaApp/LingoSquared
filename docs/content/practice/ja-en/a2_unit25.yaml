- content_key: practice.ja-en.en.a2.unit25.lesson01.translate.006
  lesson_content_key: en.a2.unit25.lesson01.registration_vocabulary
  type: translation
  frame:
    text: 金曜日に自動車登録の窓口の予約があります。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_appointment
  answer_derivation:
