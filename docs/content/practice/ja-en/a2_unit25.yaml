- content_key: practice.ja-en.en.a2.unit25.lesson02.translate.013
  lesson_content_key: en.a2.unit25.lesson02.making_a_formal_appointment
  type: translation
  frame:
    text: 先月引っ越したので、住所を更新する必要があります。(短縮形は使わないでください)
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: particle
      agreement_tags:
        semantic: w_because
  answer_derivation:
    kind: render_frame
    frame:
      text: I need to update my address {item} I moved last month.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 「〜なので」は because です。because の後も通常の語順のままで、because I moved となります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit25.lesson02.translate.014
  lesson_content_key: en.a2.unit25.lesson02.making_a_formal_appointment
  type: translation
  frame:
    text: 予約を取らせていただけないかと思っていました。
    language_code: ja
    direction: ltr
  slots:
