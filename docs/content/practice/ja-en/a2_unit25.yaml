    frame:
      text: I was wondering {item} I could make an appointment.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 「〜かどうか」を表す節には whether を使います。make an appointment は「予約を取る」という意味です。
    language_code: ja
    direction: ltr
