- content_key: practice.ja-en.en.a1.unit16.lesson02.translate.007
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: translation
  frame:
    text: 私はたいてい11時に寝ます。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_usually
  answer_derivation:
    kind: render_frame
    frame:
      text: I {item} go to bed at eleven.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 英語では usually を go の前に置き、時刻の前には at を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit16.lesson04.translate.008
  lesson_content_key: en.a1.unit16.lesson04.routine_dialogue
  type: translation
  frame:
    text: そのあとは何をしますか。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_after
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you do {item} that?
      language_code: en
      direction: ltr
  feedback_frame:
    text: after that を使うと、あるものの次に来ることをたずねられます。この質問には do が必要です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit16.lesson01.match.009
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slot_relations:
  - kind: distinct
    slots: &id004
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  slots:
    first: &id003
      language_code: en
      part_of_speech:
      - adverb
      - noun
      - preposition
      agreement_tags:
        semantic:
        - w_dinner
        - w_bed
        - w_breakfast
        - w_usually
        - w_after
        - w_morning
        - w_day
        - w_time
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  answer_derivation:
    kind: matching_pairs
    slots: *id004
  feedback_frame:
    text: このゲームの単語は、一日の流れに関係するものです。食事(breakfast、dinner)、時を表す言葉(morning、day、time、after)、そして usually です。
    language_code: ja
    direction: ltr
