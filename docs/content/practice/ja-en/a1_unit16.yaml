templates:
- content_key: practice.ja-en.en.a1.unit16.lesson01.choose.001
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic:
        - w_dinner
        - w_bed
        - w_breakfast
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 英語では、食事の名前に冠詞をつけません。have breakfast、have dinner のようになります。go to bed でも冠詞はつきません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit16.lesson02.choose.002
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adjective
      - adverb
      - preposition
      agreement_tags:
        semantic:
        - w_usually
        - w_every
        - w_after
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: usually、every、after は、動詞の前か、時を表す表現の先頭に置きます。I usually go、every day、after that のようになります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit16.lesson01.order.003
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: word_order
  frame:
    text: I have {item} at seven.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic:
        - w_breakfast
        - w_dinner
  answer_derivation:
    kind: render_frame
    frame:
      text: I have {item} at seven.
      language_code: en
      direction: ltr
  feedback_frame:
    text: breakfast や dinner の前には冠詞をつけません。I have breakfast であって、I have a breakfast ではありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit16.lesson02.order.004
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: word_order
  frame:
    text: I {item} go to bed at eleven.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_usually
  answer_derivation:
    kind: render_frame
    frame:
      text: I {item} go to bed at eleven.
      language_code: en
      direction: ltr
  feedback_frame:
    text: usually は一般動詞 go の前に置きます。日本語の「たいてい」のように、文中で自由に動かすことはできません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit16.lesson02.fill.005
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: fill_in_blank
  frame:
    text: I {item} go to bed at eleven. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id001
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_usually
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: usually(たいてい)は、主語と一般動詞の間に置きます。I usually go のようになります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit16.lesson01.fill.006
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: fill_in_blank
  frame:
    text: I have {item} at seven. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id002
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_breakfast
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
