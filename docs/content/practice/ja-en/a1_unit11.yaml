templates:
- content_key: practice.ja-en.en.a1.unit11.lesson01.choose.001
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 英語では、天気を表すときに it を使います(It's sunny, It's cold)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson02.choose.002
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Raining は進行形で、今起きていることを表します(It's raining)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson03.choose.003
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: will で未来を表します。will の後には動詞の原形が続きます(It will rain)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson04.choose.004
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: But は、対立する2つの内容をつなぎます。so は結果を表します(It's going to rain, so let's go today)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson01.order.005
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: word_order
  frame:
    text: It's {item} today.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item} today.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 天気は It's と形容詞で表します。today は文の最後に置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson02.order.006
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: word_order
  frame:
    text: You should take an {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: You should take an {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Should は助言を表し、take は原形です。母音で始まる語の前では a ではなく an を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson03.order.007
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: word_order
  frame:
    text: It will {item} on Saturday.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: It will {item} on Saturday.
      language_code: en
      direction: ltr
  feedback_frame:
    text: will の後は、-s の付かない動詞の原形です(It will rain)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson02.fill.008
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: fill_in_blank
  frame:
    text: It's {item} and warm. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sunny は「晴れた」という意味で、sun(太陽)から作られた語です。sunny and warm はよく使われる組み合わせです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson02.fill.009
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: fill_in_blank
  frame:
    text: What's the {item} like today? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: What's the weather like? は天気をたずねる文です。what's は what is の短縮形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson03.fill.010
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: fill_in_blank
  frame:
    text: It {item} rain on Saturday. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Will で未来を表します。It will rain と言い、It will rains とは言いません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson04.fill.011
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: fill_in_blank
  frame:
    text: It's going to rain on Saturday, {item} let's go today. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: So は結果を導きます。土曜日は雨が降るので、今日行きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson01.match.012
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Sunny、rainy、cloudy、windy、cold、hot、warm は天気を表す形容詞で、umbrella は「傘」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson01.translate.013
  lesson_content_key: en.a1.unit11.lesson01.weather_words
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 天気を表す形容詞は It's の後に置きます(It's hot, It's cold)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson02.translate.014
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Weather は「天気」、umbrella は「傘」です。should を使うと助言になります(You should take an umbrella)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson04.translate.015
  lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: But は「でも」、so は「だから」、idea は「考え」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson02.translate.016
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: 今、雨が降っています。(短縮形を使って)
    language_code: ja
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: It's raining は今起きていることを表します。予報には will を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson02.translate.017
  lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
  type: translation
  frame:
    text: 今日の天気はどうですか。(短縮形と like を使って)
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: What's the {item} like today?
      language_code: en
      direction: ltr
  feedback_frame:
    text: What's the weather like? は天気をたずねる文で、ここでの like は「~のような」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit11.lesson03.translate.018
  lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
  type: translation
  frame:
    text: 明日は雨が降るでしょう。(will を使って)
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: It will {item} tomorrow.
      language_code: en
      direction: ltr
  feedback_frame:
    text: will + 動詞の原形で未来を表します(It will rain tomorrow)。
    language_code: ja
    direction: ltr
