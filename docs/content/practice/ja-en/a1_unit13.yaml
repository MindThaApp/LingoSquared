    frame:
      text: Oh, I {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I understand は「わかります」という意味です。understand は進行形にしません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit13.lesson01.fill.008
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: fill_in_blank
  frame:
