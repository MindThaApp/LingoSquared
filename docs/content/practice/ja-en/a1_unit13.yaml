  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
  type: translation
  frame:
    text: 少し心配です。(短縮形を使って)
    language_code: ja
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm a {item} worried.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 形容詞の前の a little は、気持ちの強さをやわらげます(a little worried)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit13.lesson04.translate.018
  lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
  type: translation
  frame:
    text: ああ、わかります。
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Oh, I {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 文頭の Oh は、理解や驚きを表します。I の後の understand には -s を付けません。
    language_code: ja
    direction: ltr
