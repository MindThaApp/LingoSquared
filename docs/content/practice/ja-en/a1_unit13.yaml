    language_code: ja
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I'm は I am の短縮形で、tired は状態を表します。
    language_code: ja
    direction: ltr
