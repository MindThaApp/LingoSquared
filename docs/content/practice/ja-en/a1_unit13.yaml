    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Happy、sad、tired、excited、worried は気持ちを表す言葉で、test、class、year は例文の中の理由に出てくる言葉です。
    language_code: ja
    direction: ltr
