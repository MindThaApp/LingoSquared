templates:
- content_key: practice.ja-en.en.a1.unit13.lesson01.choose.001
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I'm の後ろには、気持ちを表す形容詞が来ます(I'm happy, I'm tired)。日本語の「うれしいです」と同じように、特別な動詞は要りません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit13.lesson02.choose.002
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Because は理由を導きます。英語では、ふつうの文と同じ語順で続けます(I'm happy because the class is almost over)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit13.lesson03.choose.003
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Last は、ここでは「最後の」という意味です。it's the last one this year は「今年最後のテスト」ということです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit13.lesson04.choose.004
  lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Oh, I understand は、相手の話を理解し、気持ちに寄りそっていることを示します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit13.lesson01.order.005
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: word_order
  frame:
    text: I'm {item} today.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item} today.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I'm の後ろには、冠詞を付けずに形容詞が来ます(I'm happy, I'm sad)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit13.lesson03.order.006
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
  type: word_order
  frame:
    text: The {item} is worried and excited.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: The {item} is worried and excited.
      language_code: en
      direction: ltr
  feedback_frame:
    text: The writer は、メッセージを書いた人のことです。まとめの文では、三人称の is を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit13.lesson04.order.007
  lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
