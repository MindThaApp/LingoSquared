- content_key: practice.ja-en.en.a1.unit05.lesson01.choose.001
  lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
