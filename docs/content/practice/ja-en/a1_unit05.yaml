  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ちょうどの時刻は、英語で It's three o'clock と言います。「半」には half past を使い、直訳すると「過ぎた半分」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit05.lesson01.listen.002
