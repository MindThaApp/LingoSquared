  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Half past three は3:30、つまり「3時半」です。英語では、直前のちょうどの時刻から半分過ぎたと数えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit05.lesson03.choose.003
  lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
