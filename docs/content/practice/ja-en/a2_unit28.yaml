- content_key: practice.ja-en.en.a2.unit28.lesson01.translate.006
  lesson_content_key: en.a2.unit28.lesson01.health_followup_vocabulary
  type: translation
  frame:
    text: 医師がその薬の処方箋を書いてくれました。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_prescription
  answer_derivation:
