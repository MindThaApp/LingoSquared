- content_key: practice.ja-en.en.a2.unit28.lesson01.order.004
  lesson_content_key: en.a2.unit28.lesson01.health_followup_vocabulary
  type: word_order
  frame:
    text: The doctor gave me some {item} for my headache.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_medicine
  answer_derivation:
    kind: render_frame
    frame:
      text: The doctor gave me some {item} for my headache.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Medicine は数えられない名詞です。some medicine と言い、a medicine や medicines とは言いません。
    language_code: ja
    direction: ltr
