    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit28.lesson02.choose.007
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - verb
      - noun
      agreement_tags:
        semantic:
        - w_see
        - w_doctor
        - w_had
        - w_three
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: To see a doctor は「医師の診察を受ける」という意味です。see はここでは「診てもらう」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit28.lesson02.listen.008
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
