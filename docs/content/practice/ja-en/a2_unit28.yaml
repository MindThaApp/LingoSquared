    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit28.lesson03.translate.018
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
  type: translation
  frame:
    text: 本日15時のご予約が確認されました。(時刻は「3pm」の形で書いてください)
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_today
  answer_derivation:
    kind: render_frame
    frame:
      text: Your appointment is confirmed for 3pm {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 「今日」を表す today は最後に置きます。15時は、英語では 3pm と書きます。
    language_code: ja
    direction: ltr
