        - w_see
        - w_had
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: three をよく聞きましょう。th は舌を歯の間に出して発音し、s の音とは違います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit28.lesson02.order.009
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: word_order
  frame:
    text: I'd like to make an appointment to {item} a doctor, please.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_see
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like to make an appointment to {item} a doctor, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: to see a doctor で、医師に診てもらいたいことを伝えます。please を付けると、お願いが丁寧になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit28.lesson02.fill.010
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: fill_in_blank
  frame:
    text: I've {item} a headache and a sore throat for three days. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_had
    hint:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_had
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: I've had は、今も続いている症状を表します。for three days と一緒に、現在完了形で使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit28.lesson02.translate.011
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: '{item}'
    language_code: ja
