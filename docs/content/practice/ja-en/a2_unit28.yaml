    slot: item
  feedback_frame:
    text: Doctor は、称号として使うとき以外は、a doctor や the doctor のように冠詞を付けます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit28.lesson02.translate.012
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: 医師の診察を受けるための予約を取りたいのですが。(短縮形 I'd を使ってください)
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_doctor
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like to make an appointment to see a {item}, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 「予約を取る」は make an appointment と言います。I'd like to は、丁寧に希望を伝える言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit28.lesson02.translate.013
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: 3日前から頭痛とのどの痛みがあり、悪化しています。(短縮形を使ってください)
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_three
  answer_derivation:
    kind: render_frame
    frame:
      text: I've had a headache and a sore throat for {item} days, and it's getting worse.
      language_code: en
      direction: ltr
  feedback_frame:
    text: For は期間(「3日間」)を表します。一緒に現在完了形を使います。I've had のようにします。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit28.lesson03.choose.014
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - adverb
      - verb
      agreement_tags:
        semantic:
        - w_ten
        - w_minutes
        - w_early
        - w_confirmed
        - w_today
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 予約の確認文には、confirmed(確認された)、today(今日)、そして ten minutes early のような時間の表現が出てきます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit28.lesson03.order.015
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
  type: word_order
  frame:
    text: Please bring your insurance card and arrive {item} minutes early.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_ten
  answer_derivation:
    kind: render_frame
    frame:
      text: Please bring your insurance card and arrive {item} minutes early.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 数字のあとでは minutes は複数形です。ten minutes のようにし、early は後ろに置いて「早めに」という意味になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit28.lesson03.fill.016
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
  type: fill_in_blank
  frame:
    text: Your appointment is confirmed for 3pm {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_today
    hint:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_today
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Today は「今日」という意味です。英語では 3pm today のように、時刻の後ろに置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit28.lesson03.translate.017
  lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
