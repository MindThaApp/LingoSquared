templates:
- content_key: practice.ja-en.en.a1.unit02.lesson01.choose.001
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: your と my は「〜の」を表す語です。my name は「私の名前」、your name は「あなたの名前」です。英語では、相手を「あなた」と呼ぶか「きみ」と呼ぶかで形が変わることはありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson01.listen.002
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: What's は what is の短縮形で、名前をたずねる文の出だしです。What's your name?
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson02.choose.003
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 英語では、職業の前にふつう冠詞が付きます。a student、a teacher、ただし次の語が母音で始まる場合は an engineer です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson02.listen.004
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: he は男性、she は女性を表します。どちらも is と組み合わせます。he is、she is。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson03.choose.005
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 図書館では Welcome to the library と言われます。the は特定のものを指す冠詞で、どんな名詞の前でも同じ形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson03.listen.006
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Thank you は、「ありがとう」の丁寧な標準の言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson01.order.007
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: word_order
  frame:
    text: My {item} is Leila.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: My {item} is Leila.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 英語では「My name is ...」と言います。動詞 is は、name と名前の間に置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson02.order.008
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: word_order
  frame:
    text: I am a {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: I am a {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 職業や役割の前には、英語では冠詞 a を付けます。I am a student。日本語にはない決まりなので、注意しましょう。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson01.fill.009
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: fill_in_blank
  frame:
    text: What's {item} name? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: your は you に対応する語で、「あなたの」という意味です。「私の」は my を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson02.fill.010
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: fill_in_blank
  frame:
    text: She is {item} engineer. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 母音で始まる語の前では、a ではなく an を使います。an engineer、ただし a teacher。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson02.fill.011
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: fill_in_blank
  frame:
    text: '{item} is a teacher. ({hint})'
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: he は男性を表します。女性には she、複数の人には they を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson02.match.012
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: yes と no は、質問に「はい」「いいえ」で答える語です。student と teacher は役割を表す語で、冠詞が必要です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson03.fill.013
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: fill_in_blank
  frame:
    text: Welcome to {item} library. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 特定のものを指す冠詞 the は、名詞が何であっても形が変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson01.translate.014
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: お名前は？（くだけた言い方）
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: What's {item} name?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 英語では、直訳すると「あなたの名前は何ですか？」と聞きます。友だちにも初対面の人にも同じ言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson01.translate.015
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: 私の名前はレイラです。
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} name is Leila.'
      language_code: en
      direction: ltr
  feedback_frame:
    text: my は「私の」を表す語で、文の中では名詞 name の前に置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson02.translate.016
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: student や teacher のような役割を表す語は、英語では女性にも男性にも同じ形を使います。女性専用の語尾はありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson02.translate.017
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: translation
  frame:
    text: 彼女はエンジニアです。（短縮形を使わない形）
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: She is {item} engineer.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 英語の職業名には、女性専用の形がないものが多くあります。男性のエンジニアも女性のエンジニアも engineer です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit02.lesson03.translate.018
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: welcome は、入ってきた人を迎えるあいさつに使います。thank は thank you の形で使います。
    language_code: ja
    direction: ltr
