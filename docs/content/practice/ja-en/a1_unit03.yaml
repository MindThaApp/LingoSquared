  feedback_frame:
    text: 電話番号は一桁ずつ読みます。five-five-five, one-two-three-four。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit03.lesson04.fill.011
  lesson_content_key: en.a1.unit03.lesson04.market_dialogue
  type: fill_in_blank
