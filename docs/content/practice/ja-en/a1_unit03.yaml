  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: how much は値段をたずねる言い方です。How much is this? は「これはいくらですか？」という意味です。
    language_code: ja
    direction: ltr
