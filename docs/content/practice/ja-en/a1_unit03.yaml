templates:
- content_key: practice.ja-en.en.a1.unit03.lesson01.choose.001
  lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 0から10までの数字で、年齢、値段、電話番号を伝えます。電話番号は一桁ずつ言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit03.lesson01.listen.002
  lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 聞くときは音節の数に注意しましょう。seven と zero は二音節で、10までのほかの数は一音節です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit03.lesson02.choose.003
  lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 13から19までの英語は -teen で終わり、十の位の数は -ty で終わります。thirteen と thirty を比べてみましょう。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit03.lesson02.listen.004
  lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: fifteen と fifty は似て聞こえますが、強く読む位置が違います。fifteen は後ろの音節、fifty は前の音節を強く読みます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit03.lesson03.choose.005
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: How old are you? は年齢を、How much is this? は値段をたずねる表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit03.lesson04.choose.006
  lesson_content_key: en.a1.unit03.lesson04.market_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 市場での会話でも、値段と年数は前と同じ疑問文でたずねます。How much …? と How old …? です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit03.lesson03.order.007
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
  type: word_order
  frame:
    text: It's {item} dollars.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item} dollars.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 値段は、数のあとに名詞 dollars を置き、複数形にします。five dollars。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit03.lesson03.order.008
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
  type: word_order
  frame:
    text: I'm {item} years old.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item} years old.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 年齢は I'm + 数 + years old で言います。日本語の「〜歳です」にあたります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit03.lesson03.fill.009
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
  type: fill_in_blank
