templates:
- content_key: practice.ja-en.en.a1.unit10.lesson01.choose.001
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Turn left と turn right は、you を付けない命令の形で、「左に曲がってください」「右に曲がってください」のように指示するときに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson02.choose.002
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Can't は cannot の短縮形です。You can't miss it は「目的地を見逃しようがない」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson03.choose.003
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: First と second は序数で、the を付けて名詞の前に置きます(the first street)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson01.order.004
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: word_order
  frame:
    text: Turn {item} at the corner.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Turn {item} at the corner.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Turn の後の left と right には冠詞が付きません。一方、側を表すときは on the left のように on the を付けます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson02.order.005
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: word_order
  frame:
    text: It's just two {item} from here.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: It's just two {item} from here.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Minutes は minute の複数形です。two のような2以上の数字の後は複数形になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson03.order.006
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: word_order
  frame:
    text: Take the {item} street on the left.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Take the {item} street on the left.
      language_code: en
      direction: ltr
  feedback_frame:
    text: first や second のような序数は、the を付けて名詞の前に置きます(the first street, the second street)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson01.fill.007
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: fill_in_blank
  frame:
    text: Turn left at the {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: At the corner は「角で」という意味です。at は、曲がる地点を示します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson02.fill.008
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: fill_in_blank
  frame:
    text: You can't {item} it. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Miss は、ここでは「見逃す」という意味です。You can't miss it は、目的地がよく目立つときによく使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson02.fill.009
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: fill_in_blank
  frame:
    text: How do I {item} to the bank? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Get to は「~に着く」という意味です。How do I get to ...? は、道をたずねるときの一般的な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson03.fill.010
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: fill_in_blank
  frame:
    text: Take the first {item} on the left. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Street は「通り」です。文中では側を表すので、on the left のように言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson01.match.011
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: この課の単語は道順を表します。turn、left、right、straight、stop は指示、corner と street は場所です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson01.translate.012
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Left と right は副詞として turn の後に置きます(Turn left, Turn right)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson02.translate.013
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Get は、ここでは「着く」という意味です。minutes は minute の複数形で、miss は「見逃す」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson03.translate.014
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Take the first street は「最初の通りに入る」という意味です。directions(道順)は、英語では複数形で使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson01.translate.015
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: translation
  frame:
    text: 左に曲がってください。
    language_code: ja
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Turn {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Turn left は短い命令で、you も冠詞も要りません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson02.translate.016
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: translation
  frame:
    text: 見ればすぐわかりますよ。(短縮形を使って)
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: You can't {item} it.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Can't は cannot の短縮形です。miss は、ここでは「見逃す」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit10.lesson03.translate.017
  lesson_content_key: en.a1.unit10.lesson03.reading_a_route
  type: translation
  frame:
    text: 左側の最初の通りに入ってください。
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Take the first {item} on the left.
      language_code: en
      direction: ltr
  feedback_frame:
    text: On the left は、英語では名詞の後ろに置きます(the first street on the left)。日本語の「左の最初の通り」とは、語順が逆になります。
    language_code: ja
    direction: ltr
