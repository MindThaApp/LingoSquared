    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_times
  answer_derivation:
    kind: render_frame
    frame:
      text: I check my notifications many {item} a day.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Time は「時間」、複数形の times は「回」という意味です。many times a day は「1日に何度も」という意味です。
    language_code: ja
    direction: ltr
