templates:
- content_key: practice.ja-en.en.a1.unit04.lesson01.choose.001
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 英語では、曜日の名前は必ず大文字で始めます。Monday, Tuesday, Wednesday。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit04.lesson01.listen.002
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 曜日の名前はすべて -day で終わります。Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit04.lesson02.choose.003
  lesson_content_key: en.a1.unit04.lesson02.months
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 月の名前も、英語では大文字で始めます。January, March, July。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit04.lesson02.listen.004
  lesson_content_key: en.a1.unit04.lesson02.months
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 月の名前には、日本語のカタカナ語と似たものが多くありますが、強く読む位置が違うことがよくあります。強く読む音節をよく聞いてください。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit04.lesson03.choose.005
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 英語の日付には序数を使います。July 7th。when's は、いつ何かがあるかをたずねるときに使います。例：When's your birthday?
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit04.lesson04.choose.006
  lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Open は「開く」「開いている」のどちらの意味にもなります。When's the library open again? のようにです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit04.lesson02.order.007
  lesson_content_key: en.a1.unit04.lesson02.months
  type: word_order
  frame:
    text: Which {item} is it?
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Which {item} is it?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Which は、限られた中から選ぶときにたずねる語です。ここでは12か月の中から選びます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit04.lesson03.order.008
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: word_order
  frame:
    text: My birthday is {item} 3rd.
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: My birthday is {item} 3rd.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 英語の日付は、月が先で日があとです。March 3rd。日本語の「3月3日」と同じ順番です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit04.lesson01.fill.009
