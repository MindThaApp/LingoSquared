    direction: ltr
- content_key: practice.ja-en.en.a2.unit26.lesson01.translate.006
  lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
  type: translation
  frame:
    text: 私の意見では、新しいドッグパークはいい考えです。犬には走り回る場所が必要だからです。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_opinion
  answer_derivation:
    kind: render_frame
    frame:
      text: In my {item}, the new dog park is a good idea because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: In my opinion は文頭に置き、コンマで残りの部分と区切ります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit26.lesson02.choose.007
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      - adjective
      - preposition
      agreement_tags:
        semantic:
        - w_dog
        - w_park
        - w_idea
        - w_space
        - w_run
        - w_good
        - w_about
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ドッグパークの会話には、dog、park、space、そして動詞の run が出てきます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit26.lesson02.listen.008
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
