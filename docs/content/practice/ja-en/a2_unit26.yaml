    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit26.lesson02.translate.012
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: 新しいドッグパークについて、どう思いますか。(think を使ってください)
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_park
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you think about the new dog {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 「…についてどう思いますか」は、英語では What do you think about …? と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit26.lesson02.translate.013
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: 犬は走り回る場所が必要なので、いい考えだと思います。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_idea
  answer_derivation:
    kind: render_frame
    frame:
      text: I think it's a good {item} because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 意見は I think で始め、理由は because でつなぎます。
    language_code: ja
    direction: ltr
