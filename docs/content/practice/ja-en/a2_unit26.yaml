        - w_dog
        - w_park
        - w_space
        - w_run
        - w_idea
        - w_good
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 母音に注意して聞きましょう。dog は短い母音、park は長い母音で、park では r の音もはっきり聞こえます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit26.lesson02.order.009
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: word_order
  frame:
    text: What do you think {item} the new dog park?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_about
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you think {item} the new dog park?
      language_code: en
      direction: ltr
  feedback_frame:
    text: think の後に about を使って話題を示します。What do you think about …? は「…についてどう思いますか」という意味です。
    language_code: ja
    direction: ltr
