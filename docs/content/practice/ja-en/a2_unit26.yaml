    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a2.unit26.lesson03.translate.017
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
  type: translation
  frame:
    text: 一方で、遊び場のすぐ近くにあります。(短縮形 it's を使ってください)
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_playground
  answer_derivation:
    kind: render_frame
    frame:
      text: On the other hand, it's very close to the {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Close to the playground は「遊び場の近く」という意味です。close の後には to を置きます。
    language_code: ja
    direction: ltr
