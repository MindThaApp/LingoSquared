templates:
- content_key: practice.ja-en.en.a1.unit07.lesson01.choose.001
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Water と bread は数えられない名詞です。英語では some water と言いますが、一杯分や一つ分の coffee や sandwich には a を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson01.listen.002
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 注文するとき、coffee や tea には a を付けて言うことがよくあります。I'd like a coffee, please.
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson02.choose.003
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Anything else? は、注文のあとにカフェでよく聞かれる質問です。No, that's all. などと答えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson02.listen.004
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Please は、お願いを丁寧にする語で、文の最後に置くことがよくあります。I'd like a coffee, please.
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson04.choose.005
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ここでの Sure は「かしこまりました」「いいですよ」という意味です。Sure. Anything else? で、店員が注文を感じよく受け、ほかにあるかをたずねています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson03.choose.006
  lesson_content_key: en.a1.unit07.lesson03.reading_a_menu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 英語の menu は、日本語の「メニュー」と同じく、品書きを指します。メニューに載っている値段は price と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson02.order.007
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: word_order
  frame:
    text: Anything {item}?
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Anything {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Else は「ほかに」という意味です。Anything else? は、ほかに欲しいものがあるかをたずねます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson04.order.008
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: word_order
  frame:
    text: For {item} or to go?
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: For {item} or to go?
      language_code: en
      direction: ltr
  feedback_frame:
    text: For here or to go? は、カフェで食べるか、持ち帰るかをたずねる表現です。here は「ここ」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson01.fill.009
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: fill_in_blank
  frame:
    text: I'd like a {item}, please. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sandwich は、パンに具をはさんだ食べ物です。前に a を付けると、一つ分のサンドイッチを注文できます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson03.fill.010
  lesson_content_key: en.a1.unit07.lesson03.reading_a_menu
  type: fill_in_blank
  frame:
    text: The {item} says the coffee is three dollars. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 英語の menu は品書きのことで、動詞 says は、メニューに書かれた文字について使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson02.fill.011
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: fill_in_blank
  frame:
    text: No, that's {item}, thanks. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: That's all は、ほかに注文しないという意味です。That's は That is の短縮形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson04.fill.012
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
