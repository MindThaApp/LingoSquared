    text: Anything else? は、ほかに欲しいものをたずねます。that's all で、注文を締めくくります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson03.translate.016
  lesson_content_key: en.a1.unit07.lesson03.reading_a_menu
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
