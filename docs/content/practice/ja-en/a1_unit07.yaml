  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: translation
  frame:
    text: 店内でお願いします。
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: For {item}, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: For here は、カフェで食べるという意味です。反対は to go で、持ち帰りです。
    language_code: ja
    direction: ltr
