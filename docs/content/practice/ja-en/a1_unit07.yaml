    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Menu は品書きのことで、料理のコースではありません。price は値段です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit07.lesson02.translate.017
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: translation
  frame:
    text: コーヒーを一つお願いします。（短縮形を使う形）
    language_code: ja
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like a {item}, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I'd like は I want より丁寧です。文の最後の please で、お願いがより丁寧になります。
    language_code: ja
    direction: ltr
