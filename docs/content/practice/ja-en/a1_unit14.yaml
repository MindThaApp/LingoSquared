templates:
- content_key: practice.ja-en.en.a1.unit14.lesson01.choose.001
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Free は、ここでは「時間があいている」という意味です。Are you free tonight? は、今夜時間があるかをたずねる文です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit14.lesson02.choose.002
  lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sorry, can you repeat that? は、もう一度言ってほしいと丁寧にお願いする言い方で、sorry で切り出します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit14.lesson03.choose.003
  lesson_content_key: en.a1.unit14.lesson03.reading_a_text_message
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Meeting は「会うこと」や「会議」、place は、会う場所のことです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit14.lesson04.choose.004
  lesson_content_key: en.a1.unit14.lesson04.phone_call_dialogue
  type: multiple_choice
  frame:
