    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Well は、ここでは good の副詞の形です。I can't hear you well は、電話の接続が悪いときに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit14.lesson01.match.012
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
