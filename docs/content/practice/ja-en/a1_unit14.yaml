    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: How about ...? は提案の言い方で、時間や場所が続きます(How about 6pm?)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit14.lesson01.order.005
  lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
  type: word_order
  frame:
    text: Are you {item} tonight?
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Are you {item} tonight?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Are you free? は、時間があるかをたずねる基本の質問です。tonight は文の最後に置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit14.lesson02.order.006
  lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
  type: word_order
  frame:
