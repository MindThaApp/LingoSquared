    language_code: en
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: This message is to {item} a meeting time and place.
      language_code: en
      direction: ltr
  feedback_frame:
    text: To suggest は「提案する」という意味で、まとめの文は、メッセージの目的を示します。
