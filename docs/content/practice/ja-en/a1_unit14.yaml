    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Sorry、repeat、speak、slowly、hear は電話で役に立つ言葉で、message、suggest、meeting は会う約束に関係する言葉です。
    language_code: ja
    direction: ltr
