  answer_derivation:
    kind: render_frame
    frame:
      text: Can you speak more {item}, please?
      language_code: en
      direction: ltr
  feedback_frame:
    text: More slowly は「もっとゆっくり」という意味で、more の後に副詞が来ます。
    language_code: ja
    direction: ltr
