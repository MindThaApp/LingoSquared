templates:
- content_key: practice.ja-en.en.a1.unit01.lesson01.choose.001
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 英語には、一日中使える「こんにちは」にあたる形はありません。時間帯に合わせて good morning、good afternoon、good evening から選びます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson01.listen.002
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hello は中立的なあいさつです。good morning、good afternoon、good evening は時間帯によって使い分けます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson03.choose.003
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: How are you? は、調子をたずねるごく一般的な質問です。友だちにも初対面の人にも同じ言い方で、相手によって形を変えることはありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson03.listen.004
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I'm fine, thanks. のあとには、And you? と聞き返すことがよくあります。not bad は、くだけた控えめな答え方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson05.choose.005
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Nice to meet you は初めて会ったときに言い、その返事は Nice to meet you too です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson05.listen.006
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: See you later は、その日のうちにまた会う相手に言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson01.order.007
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: word_order
  frame:
    text: Good {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Good {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: あいさつは時間帯によって変わります。morning は正午ごろまで、afternoon はその後、evening は夕方から夜に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson01.match.008
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Thanks は「ありがとう」のくだけた短い形です。fine と bad は、調子を表す言葉です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson03.fill.009
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: fill_in_blank
  frame:
    text: How are {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 英語の you は、「あなた」にも「きみ」にもあたるので、How are you? はどんな場面でも同じ形で使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson03.fill.010
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: fill_in_blank
  frame:
    text: Not {item}, thanks. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Not bad は、直訳すると「悪くない」で、調子をたずねられたときによく使う控えめな答えです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson03.order.011
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: word_order
  frame:
    text: I'm {item}, thanks.
    language_code: en
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item}, thanks.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I'm は I am の短縮形です。How are you? には fine や good を使って答えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson05.order.012
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: word_order
  frame:
    text: See you {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: See you {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: See you later は、直訳すると「あとで会いましょう」で、「またあとで」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson05.fill.013
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: fill_in_blank
  frame:
    text: Nice to meet you {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Too は文の終わりに置いて「〜も」という意味を表します。Nice to meet you. にこう返します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson01.translate.014
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 英語のあいさつと別れの言葉は時間帯によって変わります。Goodbye は中立的な別れのあいさつです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson03.translate.015
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: not は後に続く語を打ち消します。not bad は「悪くない」、thanks は「ありがとう」のくだけた言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson03.translate.016
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: translation
  frame:
    text: お元気ですか？（くだけた言い方）
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: How are {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 英語には「あなた」も「きみ」も you ひとつしかないので、この文はどんな場面でも使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson05.translate.017
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: translation
  frame:
    text: またあとで。
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: See you {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: See you を付けると、「あとで」を表す語が「またあとで」という別れのあいさつになります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit01.lesson05.translate.018
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 動詞 meet は「知り合う」や「会う」という意味です。have a good day は、親しみのある別れの言葉です。
    language_code: ja
    direction: ltr
