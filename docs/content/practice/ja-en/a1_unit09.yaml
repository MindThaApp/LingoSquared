  answer_derivation:
    kind: render_frame
    frame:
      text: Is it {item} from here?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Far は「遠い」という意味で、far from here は「ここから遠い」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit09.lesson01.fill.009
