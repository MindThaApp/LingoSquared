templates:
- content_key: practice.ja-en.en.a1.unit09.lesson01.choose.001
  lesson_content_key: en.a1.unit09.lesson01.common_places
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hospital、pharmacy、restaurant は名詞で、前に the か a を付けます(the hospital, a restaurant)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit09.lesson02.choose.002
  lesson_content_key: en.a1.unit09.lesson02.location_prepositions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Across from は「~の向かいに」、next to は「~の隣に」という意味です。どちらも、基準になる場所の前に置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit09.lesson03.choose.003
  lesson_content_key: en.a1.unit09.lesson03.asking_where
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Where は場所をたずねる言葉です。Where is the bank? のように、where の後ろに is が来ます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit09.lesson04.choose.004
  lesson_content_key: en.a1.unit09.lesson04.asking_directions_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Excuse me は、道をたずねる前に、丁寧に声をかけるための言葉です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit09.lesson01.order.005
  lesson_content_key: en.a1.unit09.lesson01.common_places
  type: word_order
  frame:
    text: The {item} is next to the pharmacy.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: The {item} is next to the pharmacy.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Next to は「~の隣に」という意味です。この課の地図では、bank と park はどちらも pharmacy の隣にあります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit09.lesson02.order.006
  lesson_content_key: en.a1.unit09.lesson02.location_prepositions
  type: word_order
  frame:
    text: The pharmacy is {item} the bank and the park.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: The pharmacy is {item} the bank and the park.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Between は and と一緒に使い(between the bank and the park)、2つの場所の間を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit09.lesson03.order.007
  lesson_content_key: en.a1.unit09.lesson03.asking_where
  type: word_order
  frame:
    text: Where is the {item}?
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Where is the {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Where is the ...? は、1つの建物がどこにあるかをたずねるときに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit09.lesson04.order.008
  lesson_content_key: en.a1.unit09.lesson04.asking_directions_dialogue
  type: word_order
  frame:
    text: Is it {item} from here?
    language_code: en
    direction: ltr
  slots:
