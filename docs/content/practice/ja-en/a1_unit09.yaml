  type: translation
  frame:
    text: 銀行(お金を扱う所)はどこですか。
    language_code: ja
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Where is the {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Where is the bank? は場所をたずねる文です。公園のベンチは英語で bench と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit09.lesson02.translate.018
