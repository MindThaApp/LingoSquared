templates:
- content_key: practice.ja-en.en.a1.unit06.lesson01.choose.001
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Parents と siblings は、英語では複数形です。単数の sibling より、日常では brother や sister を使うことが多いです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson01.listen.002
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: mother, father, brother には th の音があります。舌先を上下の歯の間に軽くはさんで発音します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson02.choose.003
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Grandmother と grandfather は、grand- と mother（または father）でできています。日本語の「祖母」「祖父」の「祖」にあたります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson03.choose.004
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Child は単数形で、複数形は children です。brothers は brother の複数形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson04.choose.005
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Who は人についてたずねる語です。Who is this? ものについてたずねるときは what を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson02.order.006
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: word_order
  frame:
    text: This is {item} sister.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: This is {item} sister.
      language_code: en
      direction: ltr
  feedback_frame:
    text: His は男性に、her は女性に使います。his sister は男性の姉（妹）、her sister は女性の姉（妹）です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson03.order.007
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: word_order
  frame:
    text: I have two {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I have two {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 数の two のあとには、英語では複数形が来ます。two brothers で、two brother ではありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson04.order.008
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: word_order
  frame:
    text: Is this your {item}?
    language_code: en
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Is this your {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Your は名詞の前に置きます。Yes/No疑問文の Is this your family? では、is が this の前に来ます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson02.fill.009
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: fill_in_blank
  frame:
    text: Daniel has one sister. This is {item} sister. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: His は男性、ここではダニエルを指します。女性なら her を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson03.fill.010
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: fill_in_blank
  frame:
    text: Do you have {item} siblings? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: any は疑問文と否定文で使い、肯定文では some を使います。Do you have any siblings?
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson04.fill.011
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: fill_in_blank
  frame:
    text: I {item} have one sister. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Just は動詞の前に置きます。I just have one sister は、姉（妹）がその一人だけだという意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson02.match.012
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: mother や grandmother のような家族の語は、親族関係を表します。grand- は一つ上の世代を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson01.translate.013
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Parents（両親）と siblings（きょうだい）は、ここでは複数形です。単数形は parent と sibling です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson02.translate.014
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aunt と uncle は、親のきょうだいを表します。cousin は男の子にも女の子にも使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson04.translate.015
  lesson_content_key: en.a1.unit06.lesson04.family_photo_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Who は人についてたずねる語です。photo は photograph の短い形で、日常ではほとんどいつもこちらを使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson02.translate.016
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: translation
  frame:
    text: こちらは私の姉（妹）です。（This を使う形）
    language_code: ja
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: This is my {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: This is は、指さしたり、その人を相手に紹介したりするときに使います。my は名詞の前に置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson03.translate.017
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: translation
  frame:
    text: 私には兄（弟）が二人います。
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I have two {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 数の two のあとでは、名詞は複数形になります。two brothers。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit06.lesson03.translate.018
  lesson_content_key: en.a1.unit06.lesson03.describing_family
  type: translation
  frame:
    text: きょうだいはいますか？（any を使う形）
    language_code: ja
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Do you have any {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 疑問文では any を使います。Do you have any siblings? 答えは I have two brothers. または No, I don't. です。
    language_code: ja
    direction: ltr
