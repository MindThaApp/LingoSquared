schema_version: '1.0'
pack_key: practice.ja-en.a1.unit17
source_language: ja
target_language: en
unit_content_key: en.a1.unit17.plans
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.de-en by scripts/derive_direction.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_another
    - w_busy
    - w_love
    - w_lunch
    - w_maybe
    - w_movie
    - w_walk
    - w_weekend
    - w_works
templates:
- content_key: practice.ja-en.en.a1.unit17.lesson01.choose.001
  lesson_content_key: en.a1.unit17.lesson01.proposing_an_activity
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic:
        - w_movie
        - w_weekend
        - w_walk
        - w_lunch
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: movie、weekend、walk、lunch は、a や this のあとに来ます。see a movie、this weekend、go for a walk のようになります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit17.lesson02.choose.002
  lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adjective
      - adverb
      - verb
      agreement_tags:
        semantic:
        - w_busy
        - w_maybe
        - w_another
        - w_love
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: busy は「忙しくて時間がない」ことを表します。maybe や another time を使うと、断る言い方がやわらかくなります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit17.lesson01.order.003
  lesson_content_key: en.a1.unit17.lesson01.proposing_an_activity
  type: word_order
  frame:
    text: Do you want to see a {item} this weekend?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_movie
  answer_derivation:
    kind: render_frame
    frame:
      text: Do you want to see a {item} this weekend?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Do you want to のあとの動詞は、語尾が変化しない原形です。Do you want to see ...? のようになります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit17.lesson01.order.004
  lesson_content_key: en.a1.unit17.lesson01.proposing_an_activity
  type: word_order
  frame:
    text: Would you like to go for a {item}?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_walk
  answer_derivation:
    kind: render_frame
    frame:
      text: Would you like to go for a {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: go for a walk は「散歩に行く」という決まった言い方で、前に a がつきます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit17.lesson03.fill.005
  lesson_content_key: en.a1.unit17.lesson03.reading_an_invitation
  type: fill_in_blank
  frame:
    text: Do you want to have {item} on Friday? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id001
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_lunch
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: have lunch のように、食事の名前には冠詞をつけません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit17.lesson02.fill.006
  lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
  type: fill_in_blank
  frame:
    text: Sorry, I can't. I'm {item} on Saturday. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id002
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_busy
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: I'm busy on Saturday は、断るときによく使う理由の言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit17.lesson02.translate.007
  lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
  type: translation
  frame:
    text: また別の機会にどうですか。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_maybe
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} another time?'
      language_code: en
      direction: ltr
  feedback_frame:
    text: Maybe another time? は、断りを丁寧にし、また誘ってほしいという気持ちを伝えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit17.lesson04.translate.008
  lesson_content_key: en.a1.unit17.lesson04.negotiating_a_plan_dialogue
  type: translation
  frame:
    text: 日曜日なら大丈夫です。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_works
  answer_derivation:
    kind: render_frame
    frame:
      text: Sunday {item} for me.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Works for me は「都合がいい」という意味です。Sunday は三人称単数の主語なので、works に -s がつきます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-en.en.a1.unit17.lesson01.match.009
  lesson_content_key: en.a1.unit17.lesson01.proposing_an_activity
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slot_relations:
  - kind: distinct
    slots: &id004
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  slots:
    first: &id003
      language_code: en
      part_of_speech:
      - adjective
      - adverb
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_movie
        - w_weekend
        - w_walk
        - w_lunch
        - w_busy
        - w_maybe
        - w_another
        - w_love
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  answer_derivation:
    kind: matching_pairs
    slots: *id004
  feedback_frame:
    text: これらの単語は、誘いと断りに関係するものです。活動(movie、walk、lunch)と、反応を表す言葉(busy、maybe、love)があります。
    language_code: ja
    direction: ltr
