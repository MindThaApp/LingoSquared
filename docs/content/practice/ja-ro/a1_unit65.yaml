schema_version: '1.0'
pack_key: practice.ja-ro.a1.unit65
source_language: ja
target_language: ro
unit_content_key: ro.a1.unit65.brutarie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_brutăria
    - w_bucata
    - w_coaptă
    - w_croissant
    - w_croissante
    - w_croissantele
    - w_croissantul
    - w_dulce
    - w_gelaterie
    - w_proaspăt
    - w_proaspătă
    - w_prăjitura
    - w_prăjiturile
    - w_punga
    - w_pungă
    - w_tejgheaua
templates:
- content_key: practice.ja-ro.ro.a1.unit65.lesson01.choose.001
  lesson_content_key: ro.a1.unit65.lesson01.mergem_la_brutarie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_brutăria
        - w_tejgheaua
        - w_proaspătă
        - w_prăjitura
        - w_dulce
        - w_prăjiturile
        - w_croissantul
        - w_bucata
        - w_croissante
        - w_coaptă
        - w_proaspăt
        - w_croissant
        - w_punga
        - w_pungă
        - w_croissantele
        - w_gelaterie
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語で、「パン屋に行きましょうか。」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit65.lesson02.listen.001
