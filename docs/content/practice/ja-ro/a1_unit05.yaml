templates:
- content_key: practice.ja-ro.ro.a1.unit05.lesson01.choose.001
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: meu と mea はどちらも「私の」という意味です。meu は男性名詞と中性名詞(tatăl meu)に、mea は女性名詞(mama mea)に付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson01.listen.002
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Părinți は「両親」という意味の複数形です。二人の親は mamă と tată です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson01.match.003
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mamă と tată は冠詞のない形で、mama と tatăl は語末に定冠詞が付いた形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson01.translate.004
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ルーマニア語では定冠詞を名詞の末尾に付けます。mamă は mama に、tată は tatăl になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson01.order.005
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: word_order
  frame:
    text: Mama {item} și tatăl meu.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item} și tatăl meu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 所有詞は名詞の性に合わせて形が変わります。mama mea(女性)ですが、tatăl meu(男性)です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson01.fill.006
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: fill_in_blank
  frame:
    text: Mama mea și tatăl {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tatăl は男性名詞なので meu が付き、mama は女性名詞なので mea が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson01.translate.007
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: 私の母。
    language_code: ja
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: ルーマニア語では所有詞は名詞の後ろに置きます。mama mea であって、mea mama ではありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson02.choose.001
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ルーマニア語の複数形は語尾が変わります。frate は frați、soră は surori、copil は copii になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson02.listen.002
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fiu は「息子」、fiică は「娘」です。結婚している男性は căsătorit です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson02.match.003
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
