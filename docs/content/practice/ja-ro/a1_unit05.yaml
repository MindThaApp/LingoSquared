    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Frate、fiu、copil は男性名詞で un が付き、soră と fiică は女性名詞で o が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson02.translate.004
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Frați は frate の複数形で、surori は soră の複数形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson02.order.005
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: word_order
  frame:
    text: Ai {item}?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ai frați? は友達への質問で、dumneavoastră に対しては Aveți frați? になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson02.fill.006
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: fill_in_blank
  frame:
    text: Am un {item} și o soră. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Un は男性名詞(un frate)に、o は女性名詞(o soră)に付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson02.translate.007
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: 私には娘がいます。
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Am o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fiică は女性名詞なので o が付きます。息子は un fiu です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson02.translate.008
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: お子さんは何人いますか?(くだけた言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți {item} ai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Câți は「何人」の男性複数形で、copil の複数形 copii と一緒に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson03.translate.001
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: translation
  frame:
    text: ミハイさん、ご兄弟はいますか?(丁寧な言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aveți {item}, Mihai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți は「持っている」の丁寧な形です。友達になら Ai frați? と聞きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit05.lesson03.order.002
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: word_order
  frame:
    text: Da, am un frate și o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, am un frate și o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un frate は男性名詞、o soră は女性名詞です。この文は Aveți frați? への答えです。
    language_code: ja
    direction: ltr
