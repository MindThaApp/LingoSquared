templates:
- content_key: practice.ja-ro.ro.a1.unit08.lesson01.choose.001
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Gară は駅、magazin は店、bancă は銀行です。aproape と departe は距離を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson01.listen.002
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Aproape は「近い」、departe は「遠い」という意味で、どちらも物の場所を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson02.match.009
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Bancă、poștă、bibliotecă は -ă で終わる女性名詞です。magazin、spital、autobuz にはそのような語尾がありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson01.translate.004
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gară、magazin、bancă は冠詞のない形です。冠詞をつけると gara、magazinul、banca になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson01.order.005
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: word_order
  frame:
    text: Da, magazinul este {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, magazinul este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aproape は「近い」という意味です。Este aproape? は、何かが近いかどうかをたずねる文です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson01.fill.006
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: fill_in_blank
  frame:
    text: Unde este {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 冠詞は語末につきます。bancă は banca になるので、Unde este banca? は「銀行はどこですか？」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson01.translate.007
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
    text: 駅はどこですか？
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Gară は、語末に冠詞がつくと gara になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson01.translate.008
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
  type: translation
  frame:
    text: 店は近いです。
    language_code: ja
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Magazinul este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Magazinul は magazin に冠詞 -ul がついた形です。aproape は副詞で、形は変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson02.choose.001
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lângă、vizavi、între は、示す場所の前に置きます。lângă bibliotecă、vizavi de magazin のように使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson02.listen.002
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poștă は郵便局、bibliotecă は図書館です。stație は停留所、autobuz はバスです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson02.translate.003
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Spital と bibliotecă は名詞です。lângă、vizavi、între は位置を表す語で、語尾変化はありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson02.order.004
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: word_order
  frame:
    text: Spitalul este {item} de magazin.
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Spitalul este {item} de magazin.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vizavi の後ろには必ず de がきます。vizavi de magazin は「店の向かいに」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson02.order.005
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: word_order
  frame:
    text: Stația de autobuz este {item} bibliotecă.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Stația de autobuz este {item} bibliotecă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Lângă は「隣に」という意味で、名詞をすぐ後ろに続けます。lângă bibliotecă のようになります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson02.fill.006
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: fill_in_blank
  frame:
    text: Stația de {item} este lângă bibliotecă. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Stația de autobuz はバス停です。冠詞は autobuz ではなく stație につきます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson02.translate.007
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
    text: 病院は店の向かいにあります。
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Spitalul este {item} de magazin.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Spital に -ul がついて spitalul になります。vizavi は、後ろの場所の前に de が必要です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit08.lesson02.translate.008
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
    text: 郵便局はどこですか？
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Poștă は冠詞がつくと poșta になります。疑問詞 unde は変わりません。
    language_code: ja
    direction: ltr
