schema_version: '1.0'
pack_key: practice.ja-ro.a1.unit63
source_language: ja
target_language: ro
unit_content_key: ro.a1.unit63.teatru
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_actorii
    - w_buni
    - w_cortina
    - w_călătoria
    - w_grozavi
    - w_locuri
    - w_mulțumit
    - w_pauză
    - w_piesa
    - w_popular
    - w_teatrul
templates:
- content_key: practice.ja-ro.ro.a1.unit63.lesson01.choose.001
  lesson_content_key: ro.a1.unit63.lesson01.hai_sa_mergem_azi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_teatrul
        - w_popular
        - w_cortina
        - w_actorii
        - w_buni
        - w_piesa
        - w_călătoria
        - w_pauză
        - w_locuri
        - w_mulțumit
        - w_grozavi
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「今日は劇場に行きましょうか?」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit63.lesson02.listen.001
  lesson_content_key: ro.a1.unit63.lesson02.scena_si_cortina
