    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「舞台と幕」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit63.lesson03.translate.001
