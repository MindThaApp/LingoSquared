schema_version: '1.0'
pack_key: practice.ja-ro.a1.unit34
source_language: ja
target_language: ro
unit_content_key: ro.a1.unit34.transport
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_ajungi
    - w_bicicleta
    - w_centru
    - w_conduc
    - w_conduce
    - w_călătoresc
    - w_călătorește
    - w_călătorești
    - w_călători
    - w_forma
    - w_ghișeu
    - w_iau
    - w_jos
    - w_locuiește
    - w_mașina
    - w_mergi
    - w_mijloc
    - w_necunoscut
    - w_obicei
    - w_politețe
    - w_preferă
    - w_serviciul
    - w_transport
    - w_învățat
templates:
- content_key: practice.ja-ro.ro.a1.unit34.lesson01.choose.001
  lesson_content_key: ro.a1.unit34.lesson01.trenul_bicicleta_masina_si
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_bicicleta
        - w_călătorește
        - w_mașina
        - w_jos
        - w_conduce
        - w_călători
        - w_serviciul
        - w_călătoresc
        - w_călătorești
        - w_învățat
        - w_transport
        - w_ghișeu
        - w_necunoscut
        - w_forma
        - w_politețe
        - w_mijloc
        - w_iau
        - w_centru
        - w_ajungi
        - w_obicei
        - w_mergi
        - w_preferă
        - w_locuiește
        - w_conduc
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、電車・自転車・車・徒歩を扱ったレッスンで学ぶこの単元の単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson02.listen.001
  lesson_content_key: ro.a1.unit34.lesson02.fiecare_calatoreste_altfel
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、「みんな移動手段が違う」のレッスンで学ぶこの単元の単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson03.translate.001
  lesson_content_key: ro.a1.unit34.lesson03.cumpararea_unui_bilet
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語で、切符を買うレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson04.match.001
  lesson_content_key: ro.a1.unit34.lesson04.elena_il_intreaba_pe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのルーマニア語の単語を日本語の意味と結びつけてください。単語はこのユニットのレッスンに出てきたものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson05.choose.001
  lesson_content_key: ro.a1.unit34.lesson05.cine_cum_calatoreste
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、「だれがどうやって移動する？」のレッスンで学ぶこの単元の単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson06.translate.001
  lesson_content_key: ro.a1.unit34.lesson06.hai_sa_mergem_impreuna
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、「一緒に自転車に乗りませんか？」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson01.order.002
  lesson_content_key: ro.a1.unit34.lesson01.trenul_bicicleta_masina_si
  type: word_order
  frame:
    text: Mihai merge cu {item} la serviciu.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_bicicleta
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai merge cu {item} la serviciu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: ミハイは自転車で通勤します。bicicleta は「その自転車」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson01.fill.003
  lesson_content_key: ro.a1.unit34.lesson01.trenul_bicicleta_masina_si
  type: fill_in_blank
  frame:
    text: Ana {item} cu trenul. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_călătorește
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_călătorește
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: アナは電車で通勤します。călătorește は「彼・彼女は移動する」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson01.translate.004
  lesson_content_key: ro.a1.unit34.lesson01.trenul_bicicleta_masina_si
  type: translation
  frame:
    text: アンドレイは車を運転します。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_mașina
  answer_derivation:
    kind: render_frame
    frame:
      text: Andrei conduce {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: アンドレイは車を運転します。mașina は「その車」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson02.order.002
  lesson_content_key: ro.a1.unit34.lesson02.fiecare_calatoreste_altfel
  type: word_order
  frame:
    text: Ce mijloc de {item} să iau până în centru?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_transport
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mijloc de {item} să iau până în centru?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 町の中心部まではどの交通手段に乗ればいいですか。transport は「交通」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson03.order.002
  lesson_content_key: ro.a1.unit34.lesson03.cumpararea_unui_bilet
  type: word_order
  frame:
    text: Ce {item} de transport să iau până în centru?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_mijloc
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} de transport să iau până în centru?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 町の中心部まではどの交通手段に乗ればいいですか。mijloc は「手段」(「交通手段」の「手段」)、また「真ん中」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson04.order.002
  lesson_content_key: ro.a1.unit34.lesson04.elena_il_intreaba_pe
  type: word_order
  frame:
    text: Cum {item} la serviciu, Mihai?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_ajungi
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum {item} la serviciu, Mihai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: ミハイ、どうやって通勤しているの？ajungi は「あなたは着く、たどり着く」(親しい相手に使う形)という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson04.fill.003
  lesson_content_key: ro.a1.unit34.lesson04.elena_il_intreaba_pe
  type: fill_in_blank
  frame:
    text: De {item} merg cu bicicleta, nu e departe. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_obicei
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_obicei
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ふだんは自転車で行きます。遠くないので。obicei は「習慣」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson05.order.002
  lesson_content_key: ro.a1.unit34.lesson05.cine_cum_calatoreste
  type: word_order
  frame:
    text: Elena {item} aproape și merge pe jos la serviciu.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_locuiește
  answer_derivation:
    kind: render_frame
    frame:
      text: Elena {item} aproape și merge pe jos la serviciu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: エレナは近くに住んでいて、歩いて通勤します。locuiește は「彼・彼女は住んでいる」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit34.lesson06.order.002
  lesson_content_key: ro.a1.unit34.lesson06.hai_sa_mergem_impreuna
  type: word_order
  frame:
    text: Prefer să {item} mașina.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_conduc
  answer_derivation:
    kind: render_frame
    frame:
      text: Prefer să {item} mașina.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 私は車を運転するほうがいいです。conduc は「私は運転する」という意味です。
    language_code: ja
    direction: ltr
