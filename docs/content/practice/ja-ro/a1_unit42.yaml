  lesson_content_key: ro.a1.unit42.lesson01.amabil_si_amuzant
  type: word_order
  frame:
    text: Andrei este {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_amuzant
  answer_derivation:
