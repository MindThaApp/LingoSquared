schema_version: '1.0'
pack_key: practice.ja-ro.a1.unit42
source_language: ja
target_language: ro
unit_content_key: ro.a1.unit42.personalitate
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_amabil
    - w_amuzant
    - w_asistentă
    - w_calm
    - w_cunoașteți
    - w_curios
    - w_diferiți
    - w_noastră
    - w_povestește
    - w_răbdător
    - w_timid
    - w_venit
    - w_întreabă
templates:
- content_key: practice.ja-ro.ro.a1.unit42.lesson01.choose.001
  lesson_content_key: ro.a1.unit42.lesson01.amabil_si_amuzant
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_amabil
        - w_amuzant
        - w_calm
        - w_răbdător
        - w_curios
        - w_timid
        - w_cunoașteți
        - w_asistentă
        - w_întreabă
        - w_povestește
        - w_diferiți
        - w_venit
        - w_noastră
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、この単元の単語で、「親切」と「面白い」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit42.lesson02.listen.001
  lesson_content_key: ro.a1.unit42.lesson02.calm_si_rabdator
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、この単元の単語で、「穏やか」と「忍耐強い」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit42.lesson03.translate.001
  lesson_content_key: ro.a1.unit42.lesson03.curios_si_timid
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}は、この単元の単語で、「好奇心が強い」と「恥ずかしがり屋」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit42.lesson04.match.001
  lesson_content_key: ro.a1.unit42.lesson04.nina_intreaba_la_cafeneaua
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのルーマニア語の単語を日本語の意味と結びつけてください。単語はこのユニットのレッスンに出てきたものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit42.lesson05.choose.001
  lesson_content_key: ro.a1.unit42.lesson05.nina_afla_despre_toti
  type: multiple_choice
