templates:
- content_key: practice.ja-ro.ro.a1.unit03.lesson01.choose.001
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ルーマニア語の曜日と月は小文字で書きます：Luni、Vineri ではなく luni、vineri。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson01.listen.002
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sâmbătă は土曜日、duminică は日曜日です。曜日はどれも1語で、大文字では書き始めません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson01.match.003
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Luni から sâmbătă までで7日のうち6日です。duminică(日曜日)で1週間がそろいます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson01.translate.004
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Astăzi は今日、mâine は明日、ieri は昨日です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson01.order.005
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: word_order
  frame:
    text: Ce {item} este astăzi?
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} este astăzi?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce zi este astăzi? は曜日を尋ねる文です。Astăzi este に曜日を続けて答えます：Astăzi este vineri.
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson01.translate.006
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: translation
  frame:
    text: 今日は金曜日です。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: ルーマニア語の曜日は小文字で書き始めます：Vineri ではなく vineri。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson01.fill.007
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: fill_in_blank
  frame:
    text: Zilele nu se scriu cu {item} mare. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Literă mare は大文字という意味です。ルーマニア語では曜日と月を小文字で書きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson02.choose.001
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 月の名前はラテン語系の語に似た形ですが、小文字で書きます：aprilie、iulie。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson02.match.002
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ルーマニア語の月名は大文字では書き始めません：ianuarie、februarie、martie。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson02.translate.003
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: februarie、septembrie のように、月名には見覚えのある形の語がいくつかありますが、大文字では書きません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson02.order.004
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: word_order
  frame:
    text: Astăzi este trei {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este trei {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 日付は数+月です：trei aprilie。月の1日は unu ではなく întâi を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson02.translate.005
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: 今日は8月1日です。
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este întâi {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 月の1日は unu ではなく întâi です：întâi august。2日以降は普通の数を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson02.fill.006
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: fill_in_blank
  frame:
    text: La {item} ani! ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La mulți ani! は直訳すると「多くの年へ」で、誕生日や新年のお祝いに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson02.translate.007
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: 今日は何月何日ですか？
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} este astăzi?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce dată este astăzi? は日付を、Ce zi este astăzi? は曜日を尋ねます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson03.order.001
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: word_order
  frame:
    text: Mihai, {item} este întâlnirea?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai, {item} este întâlnirea?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Când? は「いつ」を尋ねます。答えでは、曜日と日付に特別な語を付けずに言います：vineri, întâi august。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson03.translate.002
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: translation
  frame:
    text: 会議はいつですか。
    language_code: ja
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Când este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 曜日や日付には特別な語を付けません：Întâlnirea este vineri, întâi august.
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit03.lesson03.choose.003
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lunile は「月(複数)」の意味です。lună の複数形 luni に、冠詞 -le が付いた形です。luni だけだと月曜日の意味にもなります。
    language_code: ja
    direction: ltr
