- content_key: practice.ja-ro.ro.a1.unit13.lesson01.translate.006
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: translation
  frame:
    text: お茶が好きです。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Îmi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Îmi place は「私にとって好ましい」という言い方なので、好きなものはあとに来ます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit13.lesson01.translate.007
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: translation
  frame:
    text: コーヒーは好きではありません。
    language_code: ja
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu-mi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Nu-mi は nu と短くなった îmi をハイフンでつないだ形で、「私には好ましくない」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit13.lesson01.translate.008
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: translation
  frame:
    text: '{item}が好きです。'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Îmi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 好きなものは place の主語になります：Îmi place cafeaua, Îmi place ceaiul, Îmi place pâinea.
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit13.lesson02.choose.001
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Prefer は「(私は)〜のほうが好きです」という意味で、sau は二つの選択肢をつなぎます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit13.lesson02.listen.002
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sau は「または」という意味で、cafea sau ceai のように使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit13.lesson02.order.003
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: word_order
  frame:
    text: Prefer {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Prefer {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Prefer は「(私は)〜のほうが好きです」という意味で、好むものは冠詞をつけてあとに続けます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit13.lesson02.order.004
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: word_order
  frame:
    text: Cafea {item} ceai?
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Cafea {item} ceai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sau は二つのものから選ぶときに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit13.lesson02.fill.005
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: fill_in_blank
  frame:
    text: Cafea {item} ceai? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sau は「または」という意味で、形は変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit13.lesson02.translate.006
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: translation
  frame:
    text: コーヒーはお好きですか。(dumneavoastră で呼びかける相手に使う丁寧な言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Vă place {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă place は dumneavoastră で話す相手への質問です。友達になら Îți place と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit13.lesson02.translate.007
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: translation
  frame:
    text: コーヒーのほうが好きです。
    language_code: ja
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Prefer {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Prefer には「私は」にあたる別の語は要りません。語尾で人称が分かります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit13.lesson02.translate.008
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: translation
  frame:
    text: コーヒーか紅茶か
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Cafea {item} ceai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sau は二つの選択肢を一つの短い質問につなぎます。
    language_code: ja
    direction: ltr
