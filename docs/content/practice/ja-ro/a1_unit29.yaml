schema_version: '1.0'
pack_key: practice.ja-ro.a1.unit29
source_language: ja
target_language: ro
unit_content_key: ro.a1.unit29.bani
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_ajutat
    - w_azi
    - w_cafele
    - w_cardul
    - w_cerem
    - w_doriți
    - w_drăguț
    - w_feluri
    - w_idee
    - w_nota
    - w_numerar
    - w_partea
    - w_plătesc
    - w_plătește
    - w_plăti
    - w_plătit
    - w_plătiți
    - w_poftiți
    - w_principale
    - w_rest
    - w_restul
    - w_separat
    - w_total
    - w_împărțim
templates:
- content_key: practice.ja-ro.ro.a1.unit29.lesson01.choose.001
  lesson_content_key: ro.a1.unit29.lesson01.cat_costa_in_total
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_total
        - w_plăti
        - w_cardul
        - w_numerar
        - w_plătesc
        - w_doriți
        - w_plătiți
        - w_nota
        - w_împărțim
        - w_separat
        - w_restul
        - w_poftiți
        - w_rest
        - w_feluri
        - w_principale
        - w_cafele
        - w_plătit
        - w_cerem
        - w_idee
        - w_azi
        - w_ajutat
        - w_drăguț
        - w_partea
        - w_plătește
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、このユニットの単語で、「合計でいくら?」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson02.listen.001
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、このユニットの単語で、「カードか現金か」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson03.translate.001
  lesson_content_key: ro.a1.unit29.lesson03.impartirea_notei
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は、このユニットの単語で、「割り勘にする」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson04.match.001
  lesson_content_key: ro.a1.unit29.lesson04.restul
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのルーマニア語の単語を日本語の意味と結びつけてください。単語はこのユニットのレッスンに出てきたものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson05.choose.001
  lesson_content_key: ro.a1.unit29.lesson05.citim_nota_de_plata
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、このユニットの単語で、「レストランのレシートを読む」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson06.translate.001
  lesson_content_key: ro.a1.unit29.lesson06.ana_si_mihai_platesc
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
