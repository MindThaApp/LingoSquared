    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson01.order.002
  lesson_content_key: ro.a1.unit29.lesson01.cat_costa_in_total
  type: word_order
  frame:
    text: Cât costă în {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_total
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă în {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 合計でいくらですか? În total(合計で)は、1品ではなく全部を合わせた金額を知りたいことをはっきり示します。Cât costă? は「いくらですか」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson02.order.002
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: word_order
  frame:
    text: Pot {item} cu cardul aici?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_plăti
  answer_derivation:
    kind: render_frame
    frame:
      text: Pot {item} cu cardul aici?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: ここでカードで払えますか? plăti は「支払う」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson02.fill.003
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: fill_in_blank
  frame:
    text: Doriți să plătiți în numerar sau cu {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_cardul
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_cardul
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 現金とカードのどちらでお支払いになりますか? Doriți să plătiți ...? は、初対面のレジ係が使う、丁寧な dumneavoastră の形です。友達には Vrei să plătești ...? と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson02.translate.004
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: translation
  frame:
    text: 現金で支払います。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_numerar
  answer_derivation:
    kind: render_frame
    frame:
      text: Plătesc în {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 現金で払います。numerar は現金という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson03.order.002
  lesson_content_key: ro.a1.unit29.lesson03.impartirea_notei
  type: word_order
  frame:
    text: Hai să împărțim {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_nota
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai să împărțim {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 会計を割り勘にしましょうか? nota は会計(勘定書)という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson03.fill.003
  lesson_content_key: ro.a1.unit29.lesson03.impartirea_notei
  type: fill_in_blank
  frame:
    text: Pot plăti {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_separat
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_separat
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 別々に払ってもいいですか? Separat(別々に)は a plăti のあとに置きます。Pot plăti separat? は、各自が自分の分を払いたいときによく使う頼み方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson04.order.002
  lesson_content_key: ro.a1.unit29.lesson04.restul
  type: word_order
  frame:
    text: Nu am nevoie de {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_rest
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu am nevoie de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: おつりはいりません。A avea nevoie de(必要とする)は de を取ります:Nu am nevoie de rest.
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson06.order.002
  lesson_content_key: ro.a1.unit29.lesson06.ana_si_mihai_platesc
  type: word_order
  frame:
    text: Hai să {item} nota?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_cerem
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai să {item} nota?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 会計をお願いしましょうか? A cere(頼む、求める)は nota を直接目的語に取ります。Hai să cerem nota? は、一緒に会計を頼もうと誘う言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit29.lesson06.fill.003
  lesson_content_key: ro.a1.unit29.lesson06.ana_si_mihai_platesc
  type: fill_in_blank
  frame:
    text: Mihai {item} nota. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_plătește
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_plătește
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ミハイは会計を払います。Plătește は a plăti(支払う)の3人称単数(彼/彼女)の形です。
    language_code: ja
    direction: ltr
