templates:
- content_key: practice.ja-ro.ro.a1.unit07.lesson01.choose.001
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Leu は通貨の単位1つ分、lei はその複数形です。costă は値段をたずねたり、述べたりするときに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson01.listen.002
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
