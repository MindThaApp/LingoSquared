    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Costă は値段を表す動詞で、kilogram、piață、食べ物は買い物の対象です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson01.translate.003
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Costă は「それは〜かかる」にあたる形です。Cât costă? で値段をたずね、Costă opt lei で答えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson01.order.004
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: word_order
  frame:
    text: Costă cinci {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 2から19の後では、複数形 lei に de は付きません:opt lei。20以上では付きます:treizeci de lei。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson01.fill.005
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: fill_in_blank
  frame:
    text: Cât {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cât costă? は値段をたずねる基本の質問で、costă は「それは」にあたる動詞の形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson01.translate.006
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: translation
  frame:
    text: 8レウです。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Lei は leu の複数形で、数字と一緒に使います:opt lei。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson02.choose.002
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vreau は「欲しい」、unde は「どこ」、Unde pot...? の pot は「できる」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson02.listen.003
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cumpăr は「私は買う」。pot の後には să を付けます:pot să cumpăr(買うことができる)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson02.translate.004
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vreau は「欲しい」という直接的な言い方で、aș dori は何かを頼むときのより柔らかい言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson02.order.005
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: word_order
  frame:
    text: Cât costă un {item} de roșii?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un {item} de roșii?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: ルーマニア語では、単位と量られる物の間に de を置きます:un kilogram de roșii。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson02.order.006
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: word_order
  frame:
    text: Unde pot să {item} roșii?
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să {item} roșii?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: pot の後には să と2つ目の動詞を続けます:pot să cumpăr(買うことができる)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson02.fill.007
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: fill_in_blank
  frame:
    text: Vreau un kilogram de {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cartofi は複数形です。un kilogram de の後では、量られる物は複数形のままです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson02.translate.008
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: トマトはどこで買えますか?
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să cumpăr {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Roșii は複数形なので、前に un や o は付きません。pot să cumpăr は「買うことができる」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson02.translate.009
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: ジャガイモを1キロください。
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Vreau un kilogram de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un kilogram de の後に複数形 cartofi を置くと、量と物を表せます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson02.translate.010
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: トマト1キロはいくらですか?
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un kilogram de {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât costă は値段をたずねる表現です。1キロなので単数形の costă を使います。
    language_code: ja
    direction: ltr
