  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scump は「高い」、ieftin は「安い」という意味で、どちらも値段を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit07.lesson02.match.001
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
