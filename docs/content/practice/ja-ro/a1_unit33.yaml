schema_version: '1.0'
pack_key: practice.ja-ro.a1.unit33
source_language: ja
target_language: ro
unit_content_key: ro.a1.unit33.sport
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aleargă
    - w_alerg
    - w_alerga
    - w_alergare
    - w_alergi
    - w_ambele
    - w_anume
    - w_conjugă
    - w_corecte
    - w_exact
    - w_facem
    - w_fotbal
    - w_fotbalul
    - w_iubi
    - w_liniștit
    - w_miște
    - w_ori
    - w_practici
    - w_propune
    - w_sportul
    - w_spune
    - w_yoga
    - w_înoată
    - w_înot
    - w_înotul
    - w_știi
templates:
- content_key: practice.ja-ro.ro.a1.unit33.lesson01.choose.001
  lesson_content_key: ro.a1.unit33.lesson01.fotbal_yoga_alergare_si
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_sportul
        - w_fotbalul
        - w_yoga
        - w_fotbal
        - w_alergare
        - w_înot
        - w_aleargă
        - w_înoată
        - w_practici
        - w_alerg
        - w_ori
        - w_știi
        - w_spune
        - w_exact
        - w_anume
        - w_ambele
        - w_corecte
        - w_iubi
        - w_înotul
        - w_alergi
        - w_alerga
        - w_conjugă
        - w_miște
        - w_liniștit
        - w_facem
        - w_propune
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語です。サッカー、ヨガ、ランニング、水泳のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit33.lesson02.listen.001
  lesson_content_key: ro.a1.unit33.lesson02.cat_de_des_faci
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、「どのくらい運動しますか?」のレッスンで学ぶ、この単元の単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit33.lesson03.translate.001
  lesson_content_key: ro.a1.unit33.lesson03.sportul_si_iubirea_de
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語です。運動することと、スポーツが大好きなことのレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit33.lesson04.match.001
  lesson_content_key: ro.a1.unit33.lesson04.mihai_il_intreaba_pe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのルーマニア語の単語を日本語の意味と結びつけてください。単語はこのユニットのレッスンに出てきたものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit33.lesson05.choose.001
  lesson_content_key: ro.a1.unit33.lesson05.ana_si_elena_despre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、アナとエレナのスポーツの話のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit33.lesson06.translate.001
  lesson_content_key: ro.a1.unit33.lesson06.hai_sa_facem_sport
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は、「一緒に運動しませんか?」のレッスンで学ぶ、この単元の単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit33.lesson01.order.002
  lesson_content_key: ro.a1.unit33.lesson01.fotbal_yoga_alergare_si
  type: word_order
  frame:
    text: Ana face {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_yoga
  answer_derivation:
    kind: render_frame
    frame:
      text: Ana face {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: アナはヨガをします。yoga は「ヨガ」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit33.lesson01.fill.003
  lesson_content_key: ro.a1.unit33.lesson01.fotbal_yoga_alergare_si
  type: fill_in_blank
  frame:
    text: Mihai joacă {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_fotbal
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_fotbal
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ミハイはサッカーをします。fotbal は「サッカー」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit33.lesson01.translate.004
  lesson_content_key: ro.a1.unit33.lesson01.fotbal_yoga_alergare_si
  type: translation
  frame:
    text: エレナはよく泳ぎます。ほぼ毎週です。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înoată
  answer_derivation:
    kind: render_frame
    frame:
      text: Elena {item} des, aproape în fiecare săptămână.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: エレナはよく、ほぼ毎週泳いでいます。înoată は「泳ぐ(彼/彼女/それ/彼ら)」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit33.lesson02.order.002
  lesson_content_key: ro.a1.unit33.lesson02.cat_de_des_faci
  type: word_order
  frame:
    text: Fac yoga de două {item} pe săptămână.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_ori
  answer_derivation:
    kind: render_frame
    frame:
      text: Fac yoga de două {item} pe săptămână.
      language_code: ro
      direction: ltr
  feedback_frame:
