templates:
- content_key: practice.ja-ro.ro.a1.unit04.lesson01.choose.001
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jumătate は「半分」、un sfert は「4分の1(15分)」の意味です。どちらも și で時刻につなげます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson01.listen.002
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cât este ora? は時刻を尋ねる表現で、答えは Este ora + 数字です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson01.match.003
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ora は「時」または時計の時刻です。fără と și は時刻を前後に動かします。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson01.order.004
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: word_order
  frame:
    text: Este {item} unu.
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Este {item} unu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: ora のあとでは、1には unu、2には două を使います。ora unu、ora două。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson01.fill.005
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: fill_in_blank
  frame:
    text: Este ora unu și {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Și jumătate は30分を足します。ora unu și jumătate は1時半です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson01.translate.006
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: translation
  frame:
    text: 今何時ですか?
    language_code: ja
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât este ora? は直訳すると「時はいくつですか」という意味です。答えは Este ora + 数字です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson01.translate.007
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fără は普通「~なしで」という意味ですが、時刻を言うときの fără un sfert は「15分前」の意味になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson02.translate.001
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: translation
  frame:
    text: 2時15分です。
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Este ora două și un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Și un sfert は15分を足し、fără un sfert は15分を引きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson02.fill.002
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: fill_in_blank
  frame:
    text: Este ora trei {item} un sfert. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fără un sfert は15分を引きます。ora trei fără un sfert は2時45分です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson02.translate.003
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: translation
  frame:
    text: 何時に？
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: La ce {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: La ce oră? は何かがいつ起こるかを尋ねます。答えは la ora + 数字で、la ora nouă のようになります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson02.order.004
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: word_order
  frame:
    text: Este ora trei fără un {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Este ora trei fără un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sfert は中性名詞で、単数では un を伴います。この時刻の言い方は、次の時刻からさかのぼって数えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson03.choose.001
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dimineața、seara、noaptea は一日の時間帯を表し、定冠詞が付いているため語末が -a になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson03.listen.002
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cursul は「クラス」です。「始まる」は începe で、クラスにも行事にも使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson03.order.003
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: word_order
  frame:
    text: Cursul {item} la ora nouă.
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul {item} la ora nouă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Începe は「始まる」の彼・彼女・それに対応する形で、単数の主語 cursul に合っています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson03.translate.004
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: translation
  frame:
    text: 授業は朝の9時に始まります。
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul începe la ora nouă, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 時刻のあとに一日の時間帯を添えます:la ora nouă, dimineața または la ora nouă, seara。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit04.lesson03.fill.005
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: fill_in_blank
  frame:
    text: Când începe {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Când începe cursul? は授業がいつ始まるかを尋ねる文で、答えは Cursul începe la ora nouă. です。
    language_code: ja
    direction: ltr
