schema_version: '1.0'
pack_key: practice.ja-ro.a1.unit35
source_language: ja
target_language: ro
unit_content_key: ro.a1.unit35.tehnologie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_alergat
    - w_aplicația
    - w_aplicație
    - w_articolul
    - w_caut
    - w_caută
    - w_cauți
    - w_citește
    - w_computer
    - w_computerul
    - w_căuta
    - w_dimineață
    - w_fel
    - w_folosesc
    - w_folosește
    - w_folosi
    - w_internet
    - w_internetul
    - w_mesaje
    - w_meteo
    - w_neutru
    - w_numi
    - w_prognoza
    - w_sfârșit
    - w_sună
    - w_super
    - w_telefonul
    - w_trimite
    - w_vin
    - w_văd
templates:
- content_key: practice.ja-ro.ro.a1.unit35.lesson01.choose.001
  lesson_content_key: ro.a1.unit35.lesson01.telefonul_computerul_si_internetul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_folosi
        - w_folosesc
        - w_telefonul
        - w_computerul
        - w_folosește
        - w_computer
        - w_internetul
        - w_internet
        - w_aplicația
        - w_aplicație
        - w_prognoza
        - w_meteo
        - w_neutru
        - w_mesaje
        - w_articolul
        - w_sfârșit
        - w_trimite
        - w_citește
        - w_căuta
        - w_caut
        - w_cauți
        - w_fel
        - w_caută
        - w_alergat
        - w_văd
        - w_numi
        - w_sună
        - w_dimineață
        - w_vin
        - w_super
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、携帯電話・パソコン・インターネットのレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit35.lesson02.listen.001
  lesson_content_key: ro.a1.unit35.lesson02.aplicatia_si_trimiterea_unui
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、アプリとメッセージの送信のレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit35.lesson03.translate.001
  lesson_content_key: ro.a1.unit35.lesson03.a_cauta_ceva
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は、調べ物のレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit35.lesson04.match.001
  lesson_content_key: ro.a1.unit35.lesson04.ana_trimite_un_mesaj
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのルーマニア語の単語を日本語の意味と結びつけてください。単語はこのユニットのレッスンに出てきたものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit35.lesson05.choose.001
  lesson_content_key: ro.a1.unit35.lesson05.cine_foloseste_ce
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、「だれが何を使う?」のレッスンに出てくる、このユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit35.lesson06.translate.001
  lesson_content_key: ro.a1.unit35.lesson06.ne_vedem_sambata_in
  type: translation
  frame:
