  frame:
    text: 電車は9時に出発します。
    language_code: ja
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Trenul {item} la ora nouă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: La ora nouă は時刻を表します。動詞は「彼・彼女・それ」で同じ形のままです。
    language_code: ja
    direction: ltr
