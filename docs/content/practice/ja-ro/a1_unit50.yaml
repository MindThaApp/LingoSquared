    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit50.lesson05.fill.003
  lesson_content_key: ro.a1.unit50.lesson05.citim_lista_de_preturi
  type: fill_in_blank
  frame:
