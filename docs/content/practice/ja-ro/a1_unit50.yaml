schema_version: '1.0'
pack_key: practice.ja-ro.a1.unit50
source_language: ja
target_language: ro
unit_content_key: ro.a1.unit50.frizerie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aceeași
    - w_coafura
    - w_coafură
    - w_frizer
    - w_frizerul
    - w_lista
    - w_listă
    - w_loc
    - w_nicio
    - w_prea
    - w_prețuri
    - w_problemă
    - w_puteți
    - w_scurtă
    - w_spălat
    - w_sta
    - w_stă
    - w_tocmai
    - w_tunde
    - w_tundeți
    - w_tuns
    - w_tunsoare
    - w_tunsoarea
    - w_veniți
templates:
- content_key: practice.ja-ro.ro.a1.unit50.lesson01.choose.001
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_prea
        - w_frizerul
        - w_frizer
        - w_tunde
        - w_puteți
        - w_tundeți
        - w_veniți
        - w_aceeași
        - w_coafură
        - w_scurtă
        - w_nicio
        - w_problemă
        - w_loc
        - w_lista
        - w_prețuri
        - w_tunsoarea
        - w_tunsoare
        - w_listă
        - w_spălat
        - w_tuns
        - w_coafura
        - w_sta
        - w_stă
        - w_tocmai
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、この単元の単語です。「髪が長すぎる」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit50.lesson02.listen.001
  lesson_content_key: ro.a1.unit50.lesson02.puteti_sa_mi_tundeti
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「髪を切ってもらえますか」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit50.lesson03.translate.001
  lesson_content_key: ro.a1.unit50.lesson03.facem_o_programare
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}は、この単元の単語です。予約を取るレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit50.lesson04.match.001
  lesson_content_key: ro.a1.unit50.lesson04.la_frizer
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのルーマニア語の単語を日本語の意味と結びつけてください。単語はこのユニットのレッスンに出てきたものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit50.lesson05.choose.001
  lesson_content_key: ro.a1.unit50.lesson05.citim_lista_de_preturi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、「料金表を読む」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit50.lesson06.translate.001
  lesson_content_key: ro.a1.unit50.lesson06.ana_vede_coafura_noua
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は、この単元の単語で、「アナが新しいヘアスタイルを見る」レッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit50.lesson01.order.002
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: word_order
  frame:
    text: Părul meu este {item} lung.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_prea
  answer_derivation:
    kind: render_frame
    frame:
      text: Părul meu este {item} lung.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 髪が長すぎます。prea は「~すぎる」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit50.lesson01.fill.003
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: fill_in_blank
  frame:
    text: Merg la {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_frizer
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_frizer
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 美容院に行きます。frizer は「美容師、理容師」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit50.lesson02.order.002
  lesson_content_key: ro.a1.unit50.lesson02.puteti_sa_mi_tundeti
  type: word_order
  frame:
    text: Puteți să-mi {item} părul?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_tundeți
  answer_derivation:
    kind: render_frame
    frame:
      text: Puteți să-mi {item} părul?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 髪を切っていただけますか。tundeți は「(あなたが)切る」(丁寧な形)という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit50.lesson04.order.002
  lesson_content_key: ro.a1.unit50.lesson04.la_frizer
  type: word_order
  frame:
    text: Perfect, și doriți {item} coafură?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_aceeași
  answer_derivation:
    kind: render_frame
    frame:
      text: Perfect, și doriți {item} coafură?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: いいですね。同じスタイルにしますか。aceeași は「同じ」(女性形)という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit50.lesson04.fill.003
  lesson_content_key: ro.a1.unit50.lesson04.la_frizer
  type: fill_in_blank
  frame:
    text: Da, aceeași {item}, dar mai scurtă. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_coafură
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_coafură
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: はい、同じスタイルで、でももっと短くお願いします。coafură は「ヘアスタイル、髪型」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit50.lesson05.order.002
  lesson_content_key: ro.a1.unit50.lesson05.citim_lista_de_preturi
  type: word_order
  frame:
