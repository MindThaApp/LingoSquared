    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_lista
  answer_derivation:
    kind: render_frame
    frame:
      text: Citesc {item} de prețuri.
      language_code: ro
      direction: ltr
  feedback_frame:
