      direction: ltr
  feedback_frame:
    text: 心配しないで。Nu-ți face griji(直訳:「自分のために心配を作らないで」)は、安心させる標準的な決まり文句です。知らない人には Nu vă faceți griji と言います。
    language_code: ja
    direction: ltr
