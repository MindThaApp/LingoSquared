schema_version: '1.0'
pack_key: practice.ja-ro.a1.unit28
source_language: ja
target_language: ro
unit_content_key: ro.a1.unit28.comunicare
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_atât
    - w_aud
    - w_bucur
    - w_crede
    - w_credeam
    - w_merge
    - w_mers
    - w_mesaj
    - w_mesajul
    - w_minute
    - w_mult
    - w_mândră
    - w_poți
    - w_repede
    - w_repeți
    - w_spun
    - w_sun
    - w_suna
    - w_suni
    - w_trebuie
    - w_trimit
    - w_vorbesc
    - w_vorbi
    - w_vorbiți
    - w_înapoi
    - w_înseamnă
templates:
- content_key: practice.ja-ro.ro.a1.unit28.lesson01.choose.001
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_suna
        - w_trebuie
        - w_sun
        - w_vorbesc
        - w_vorbiți
        - w_poți
        - w_repeți
        - w_vorbi
        - w_atât
        - w_repede
        - w_aud
        - w_mesajul
        - w_trimit
        - w_mesaj
        - w_înapoi
        - w_spun
        - w_minute
        - w_suni
        - w_mers
        - w_credeam
        - w_merge
        - w_crede
        - w_bucur
        - w_mândră
        - w_înseamnă
        - w_mult
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、「電話するね」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson02.listen.001
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、「どちら様ですか？」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson03.translate.001
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、「もう一度言ってもらえますか？」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson04.match.001
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのルーマニア語の単語を日本語の意味と結びつけてください。単語はこのユニットのレッスンに出てきたものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson05.choose.001
  lesson_content_key: ro.a1.unit28.lesson05.citim_o_conversatie_prin
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、メッセージのやり取りを読むレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson06.translate.001
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、シフトのあとの電話のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson01.order.002
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: word_order
  frame:
    text: Trebuie să te {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_sun
  answer_derivation:
    kind: render_frame
    frame:
      text: Trebuie să te {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: あなたに電話しなければなりません。sun は「(私が)電話する」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson02.order.002
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: word_order
  frame:
    text: Cu cine {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbesc
  answer_derivation:
    kind: render_frame
    frame:
      text: Cu cine {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: どちら様ですか？Cu cine vorbesc?(直訳は「誰と私は話していますか」)は、知らない相手からの電話で使う決まった尋ね方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson03.order.002
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: word_order
  frame:
    text: Poți să {item} asta?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_repeți
  answer_derivation:
    kind: render_frame
    frame:
      text: Poți să {item} asta?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: それをもう一度言ってもらえますか？Poți să ...(〜できますか？)+ repeți(あなたが繰り返す)+ asta(それ)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson03.fill.003
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: fill_in_blank
  frame:
    text: Nu {item} atât de repede, te rog. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: そんなに速く話さないでください。Nu vorbi(「話さないで」)は nu + tu の形で、atât de repede は「そんなに速く」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson03.translate.004
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: よく聞こえません。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_aud
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu te {item} bine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: よく聞こえません。Nu te aud bine:aud は「(私が)聞こえる」、te(「あなたを」)は動詞の前に置き、bine は「よく」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson04.order.002
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: word_order
  frame:
    text: Îți {item} un mesaj.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_trimit
  answer_derivation:
    kind: render_frame
    frame:
      text: Îți {item} un mesaj.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: メッセージを送ります。Îți(「あなたに」)は与格の代名詞で、動詞の前に置きます：Îți trimit un mesaj.
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson04.fill.003
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: fill_in_blank
  frame:
    text: Te sun {item} mai târziu. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 後でかけ直します。Înapoi(「折り返して」)は動詞の後に来ます：te sun înapoi は「かけ直します」、mai târziu は「後で」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson06.order.002
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: word_order
  frame:
    text: A {item} foarte bine, mai bine decât credeam.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_mers
  answer_derivation:
    kind: render_frame
    frame:
      text: A {item} foarte bine, mai bine decât credeam.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 思っていたよりずっとうまくいきました。A mers は a merge(行く、ここでは「〜という結果になる」)の過去形で、credeam は「思っていた」(a crede の過去の形)という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit28.lesson06.fill.003
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: fill_in_blank
  frame:
    text: Îți mulțumesc, {item} mult pentru mine. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ありがとう、とてもうれしいです。Înseamnă は a însemna(意味する)の3人称単数形で、pentru mine(「私にとって」)は誰にとって大切かを表します。
    language_code: ja
    direction: ltr
