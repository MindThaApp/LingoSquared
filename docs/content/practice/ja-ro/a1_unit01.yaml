templates:
- content_key: practice.ja-ro.ro.a1.unit01.lesson01.choose.001
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ルーマニア語には「あなた」を表す語が2つあります。友人や家族には tu、知らない人や敬意を示したい相手には dumneavoastră を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson01.listen.002
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Faceți は dumneavoastră と、faci は tu と一緒に使います。つまり、動詞の語尾を見れば丁寧さの度合いがわかります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson01.match.003
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Bună ziua は dumneavoastră と、salut は tu と組み合わせます。選んだあいさつが、会話全体の丁寧さを決めます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson01.translate.004
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mulțumesc は日常的な「ありがとう」で、tu の相手にも dumneavoastră の相手にも使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson01.order.005
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: word_order
  frame:
    text: Bună {item}!
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Bună {item}!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Bună ziua は知らない人への、昼間の丁寧なあいさつです。友人には salut を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson01.fill.006
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: fill_in_blank
  frame:
    text: Bine, mulțumesc. Și {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Și dumneavoastră? は丁寧に質問を返す言い方で、友人には Și tu? と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson01.translate.007
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: お元気ですか？(くだけた言い方、友人に)
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faci? は友人(tu)に使う言い方で、知らない人には Ce mai faceți? と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson01.translate.008
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: お元気ですか？(丁寧な言い方、dumneavoastră で呼ぶ相手に)
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faceți? は丁寧な質問で、丁寧な返事は Bine, mulțumesc. Și dumneavoastră? です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson02.order.001
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: word_order
  frame:
    text: Mă numesc {name}.
    language_code: ro
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Mă numesc {name}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mă numesc は直訳すると「私は自分を名づける」、Mă cheamă は「私は〜と呼ばれる」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson02.fill.002
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: fill_in_blank
  frame:
    text: Îmi {item} bine! ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Îmi pare bine は直訳すると「私には良く思われる」という意味で、その返事は Și mie îmi pare bine です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson02.translate.003
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: お名前は？(くだけた言い方、友人に)
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum te {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cum te cheamă? は友人に te を使う言い方で、知らない人には Cum vă numiți? と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson02.choose.004
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cum vă numiți? は vă を使う、名前をたずねる丁寧な質問です。友人には Cum te cheamă? になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson02.listen.005
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Numesc は「私」の形(mă numesc)で、numiți は dumneavoastră の形(cum vă numiți)です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson02.translate.006
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Și は「そして」という意味で、質問を返すときにも文頭に置きます：Și dumneavoastră? または Și tu?
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson02.match.007
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ルーマニア語では、これらの名前を言うフレーズで、代名詞が動詞の前に来ます：mă numesc, vă numiți, te cheamă。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson03.translate.001
  lesson_content_key: ro.a1.unit01.lesson03.street_meeting
  type: translation
  frame:
    text: 元気です、ありがとう。
    language_code: ja
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Bine, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Bine, mulțumesc のあとは、質問を相手に返します：Și dumneavoastră?(丁寧)または Și tu?(くだけた言い方)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-ro.ro.a1.unit01.lesson03.order.002
  lesson_content_key: ro.a1.unit01.lesson03.street_meeting
  type: word_order
  frame:
    text: Și {item} îmi pare bine!
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Și {item} îmi pare bine!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Și mie îmi pare bine は「こちらこそはじめまして」という意味です。mie は「私にとっては」を強調し、相手の言葉に応えます。
    language_code: ja
    direction: ltr
