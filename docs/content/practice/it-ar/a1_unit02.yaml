templates:
- content_key: practice.it-ar.ar.a1.unit02.lesson01.listen.001
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'L''arabo indica il possesso con una desinenza: اسم è «nome», اسمي è «il mio nome» e اسمك è «il tuo nome».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson01.match.002
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: La desinenza ـي significa «mio» (اسمي) e ـك significa «tuo» (اسمك); la forma scritta di «tuo» è uguale per un uomo e per una donna.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson01.fill.003
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: fill_in_blank
  frame:
    text: ما {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما significa «che cosa», quindi ما اسمك è letteralmente «che cosa il tuo nome».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson01.translate.004
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنا («io») si usa in frasi semplici come أنا سارة, dove in italiano serve il verbo «sono».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson01.translate.005
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: translation
  frame:
    text: Mi chiamo {item}.
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'I nomi si scrivono come si pronunciano: l''arabo non ha lettere maiuscole.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson02.choose.001
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Nomi di paesi come لبنان e مصر non prendono l'articolo, ma الأردن, المغرب e العراق includono ال come parte del nome.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson02.match.002
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: L'articolo ال fa parte dei nomi الأردن, المغرب e العراق.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson02.order.003
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: word_order
  frame:
    text: أنا من {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من significa «da», quindi أنا من seguito da un luogo dice da dove vieni.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson02.fill.004
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: fill_in_blank
  frame:
    text: من {item} أنت؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أين è la parola interrogativa «dove»; من أين أنت chiede «di dove sei», a un uomo o a una donna.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson02.translate.005
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La parola أنت significa «tu»; scritta senza vocali è uguale per un uomo e per una donna.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson02.translate.006
  lesson_content_key: ar.a1.unit02.lesson02.where_from
  type: translation
  frame:
    text: Vengo da {item}.
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L''arabo non ha una parola per «sono»: أنا من seguito da un luogo significa già «vengo da».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson03.listen.001
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Una domanda sì/no inizia con هل, e la risposta è نعم per «sì».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson03.order.002
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: word_order
  frame:
    text: سعدت {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: سعدت {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: سعدت بلقائك è la formula di chiusura cortese, letteralmente «sono stato felice dell'incontro con te».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson03.fill.003
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: fill_in_blank
  frame:
    text: هل أنت من مصر؟ {item}، أنا من مصر. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: نعم significa «sì»; nella risposta non serve alcuna parola interrogativa sì/no.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson03.translate.004
  lesson_content_key: ar.a1.unit02.lesson03.closing_the_exchange
  type: translation
  frame:
    text: Sono stato felice di conoscerti.
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: سعدت {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La desinenza scritta ـك in بلقائك è uguale per un uomo e per una donna.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson04.choose.001
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: دائما significa «sempre» e può seguire مرحبا بك per dire «benvenuto in qualsiasi momento».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson04.fill.002
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: fill_in_blank
  frame:
    text: مرحبا بك {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: L'espressione مرحبا بك دائما significa che sei sempre il benvenuto.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit02.lesson04.translate.003
  lesson_content_key: ar.a1.unit02.lesson04.first_meeting_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: سعدت è un verbo al passato con la desinenza ـت per «io», ed è per questo che significa «sono stato felice».
    language_code: it
    direction: ltr
