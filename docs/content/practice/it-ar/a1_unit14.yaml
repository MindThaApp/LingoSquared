templates:
- content_key: practice.it-ar.ar.a1.unit14.lesson01.choose.001
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحب è il verbo «mi piace»; è seguito direttamente da ciò che ti piace.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson01.listen.002
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'ولا è و (e) più لا (non): e non.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson01.match.003
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أحب significa mi piace e أفضل significa preferisco; ولا (e non) collega un'affermazione negativa a quella precedente.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson01.order.004
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Ciò che piace segue أحب, con ال per la categoria in generale: أحب القهوة significa mi piace il caffè.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson01.order.005
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: لا أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: لا أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'لا davanti al verbo lo nega: لا أحب significa non mi piace.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson01.fill.006
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أحب القهوة {item} أحب الشاي. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ولا collega una frase negativa: Mi piace il caffè e non mi piace il tè.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson01.fill.007
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أنا {item} الماء. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنا (io) si può aggiungere per enfasi, ma أحب da solo significa già mi piace.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson01.translate.008
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: شاي è «tè» senza articolo, mentre الماء è «l'acqua» con ال; أحب significa mi piace.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson01.translate.009
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: Mi piace l'acqua. (non c'è una parola separata per «io»)
    language_code: it
    direction: ltr
  slots:
    a: *id005
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Dopo أحب l'arabo usa ال per una cosa in generale, quindi «mi piace l'acqua» è أحب الماء.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson01.translate.010
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: Questo è tè.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Senza ال, شاي è semplicemente «tè», e l''arabo non ha bisogno di un verbo «è»: هذا شاي.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson02.choose.001
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أفضل significa «preferisco»; تفضل, con il prefisso ت, è la forma di «tu» al maschile.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson02.listen.002
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تفضل significa «preferisci», rivolto a un uomo: ماذا تفضل يا يوسف؟'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson02.order.003
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
    text: ماذا {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Il prefisso ت indica «tu»; ماذا تفضل؟ chiede a un uomo che cosa preferisce.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson02.order.004
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
    text: أفضل {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أفضل {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أفضل è seguito da ciò che si preferisce, con ال: أفضل القهوة.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson02.fill.005
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: fill_in_blank
  frame:
    text: أنا {item} القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أفضل significa «preferisco»; il prefisso أ indica «io», come in أحب e أريد.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson02.translate.006
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أفضل significa «preferisco» e تفضل «preferisci» (a un uomo); il prefisso أ o ت indica la persona.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit14.lesson02.translate.007
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: translation
  frame:
    text: Che cosa preferisci, Yusuf?
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} يا يوسف
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Yusuf è un uomo, quindi la forma per «tu» è تفضل.
    language_code: it
    direction: ltr
