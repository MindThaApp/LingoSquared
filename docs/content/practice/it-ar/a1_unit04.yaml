    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: I nomi dei mesi مايو e يونيو seguono i nomi internazionali del calendario, maggio e giugno.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson01.order.003
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: word_order
  frame:
    text: اليوم الخامس من {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم الخامس من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: In arabo le date si leggono con il giorno per primo, poi من (di) e il mese.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson01.fill.004
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: fill_in_blank
  frame:
    text: ما {item} اليوم؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما تاريخ اليوم؟ è il modo abituale per chiedere la data di oggi.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson01.translate.005
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'I nomi dei mesi si scrivono in una sola parola: مايو per maggio e يونيو per giugno.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson01.translate.006
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: translation
  frame:
    text: Che data è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} اليوم
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La domanda sulla data usa ما (che cosa) con تاريخ (data) e اليوم (oggi).
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson02.listen.001
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: I numeri ordinali come الخامس (il quinto) prendono ال e qui sono maschili perché si riferiscono a يوم (giorno), un nome maschile.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson02.match.002
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: في significa «in» o «a» e si scrive come parola separata, a differenza di ب che si attacca alla parola seguente.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson02.order.003
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: word_order
  frame:
    text: اليوم {item} من مايو.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {item} من مايو.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Gli ordinali prendono ال: الخامس è il quinto e السادس è il sesto.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson02.fill.004
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: fill_in_blank
  frame:
    text: اليوم الخامس من {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il mese segue من, quindi اليوم الخامس من يونيو significa «oggi è il cinque giugno».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson02.order.005
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: word_order
  frame:
    text: الدرس {item} الخامس من مايو.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس {item} الخامس من مايو.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في davanti a una data significa «in quel giorno»: في الخامس من مايو.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson02.translate.006
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le parole dopo في funzionano come qualsiasi nome: في الدرس significa «nella lezione», con ال che segna l''articolo determinativo.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson02.translate.007
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: Oggi è il cinque maggio.
    language_code: it
    direction: ltr
  slots:
    a: *id009
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {a} من {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Il quinto è الخامس e il sesto è السادس; entrambi sono maschili perché si riferiscono a يوم (giorno).
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson02.translate.008
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: Oggi è il sei giugno.
    language_code: it
    direction: ltr
  slots:
    a: *id011
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {a} من {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Il sesto è السادس; si forma come gli altri ordinali, con ال davanti.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson01.listen.007
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'I mesi hanno nomi propri, ma giorno e mese sono uniti da من (di): الخامس من مايو.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson02.choose.009
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: في davanti a una data significa «in quel giorno», e ال segna un ordinale come il quinto o il sesto.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson02.translate.010
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: La lezione è il cinque maggio.
    language_code: it
    direction: ltr
  slots:
    f: *id008
    d: *id009
    m: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس {f} {d} من {m}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La data della lezione usa في (il) davanti all''ordinale: الدرس في الخامس من مايو.'
    language_code: it
    direction: ltr
