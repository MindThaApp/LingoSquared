templates:
- content_key: practice.it-ar.ar.a1.unit04.lesson01.choose.001
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'اليوم significa letteralmente «il giorno», con l''articolo ال attaccato davanti: così l''arabo dice «oggi».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit04.lesson01.match.002
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
