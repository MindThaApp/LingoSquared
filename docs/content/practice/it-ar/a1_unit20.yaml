    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الجو مشمس اليوم significa «oggi c'è il sole»; مشمس descrive الجو.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit20.lesson01.match.003
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: الجو (il tempo, il meteo) è un sostantivo; مشمس, بارد e حار sono aggettivi che lo descrivono.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit20.lesson01.order.004
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: word_order
  frame:
    text: الجو {item} اليوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: الجو {item} اليوم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L''aggettivo segue direttamente الجو, senza una parola per «è»: الجو بارد significa «fa freddo».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit20.lesson01.fill.005
