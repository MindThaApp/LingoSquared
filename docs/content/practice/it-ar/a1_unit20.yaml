templates:
- content_key: practice.it-ar.ar.a1.unit20.lesson01.choose.001
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الجو significa «il tempo» atmosferico; مشمس significa soleggiato e بارد freddo.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit20.lesson01.listen.002
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: listen_select
  frame:
