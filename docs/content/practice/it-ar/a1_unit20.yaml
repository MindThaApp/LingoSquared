    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بارد significa «freddo» ed è maschile perché concorda con الجو.
    language_code: it
    direction: ltr
