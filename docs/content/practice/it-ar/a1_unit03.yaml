templates:
- content_key: practice.it-ar.ar.a1.unit03.lesson01.choose.001
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ogni numero si legge da destra a sinistra; ثلاثة inizia con ث, che si pronuncia come il th inglese di «think».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson01.match.002
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ثلاثة (tre) e ثمانية (otto) iniziano entrambe con ث, il suono «th»; il resto della parola le distingue.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson01.order.003
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: word_order
  frame:
    text: واحد، اثنان، {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: واحد، اثنان، {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La parola per «tre», ثلاثة, termina in ة, la stessa terminazione di molti altri nomi arabi.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson01.fill.004
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: fill_in_blank
  frame:
    text: واحد، {item}، ثلاثة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: L'arabo ha una speciale terminazione del duale ـان per indicare due cose; اثنان è la parola «due» stessa.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson01.translate.005
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: I numeri da tre a dieci terminano in ة quando si conta, come in ثلاثة e خمسة.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson02.listen.001
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'سبعة (sette) e تسعة (nove) terminano con le stesse lettere عة, quindi ascolta il primo suono: s contro t.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson02.order.002
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: word_order
  frame:
    text: رقمي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: رقمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'رقمي significa «il mio numero»: رقم è «numero» e la terminazione ـي significa «mio».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson02.fill.003
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: fill_in_blank
  frame:
    text: ثمانية، تسعة، {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: عشرة è «dieci»; come ogni numero da tre a dieci termina in ة.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson02.translate.004
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ستة (sei) e سبعة (sette) iniziano entrambe con س; leggi le lettere finali per distinguerle.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson03.choose.001
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: كم chiede «quanto» o «quanti», e هذا indica qualcosa di vicino a te.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson03.match.002
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: بخمسة e بعشرة iniziano con ب, che qui significa «a» un certo prezzo.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson03.fill.003
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: fill_in_blank
  frame:
    text: كم {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كم هذا chiede il prezzo di una sola cosa; هذا («questo») è la forma maschile.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson03.translate.004
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'وهذا è و («e») unito a هذا («questo»): «e questo».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson03.translate.005
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: Quanto costa questo?
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: كم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'In arabo in questa domanda non c''è un verbo «essere»: كم هذا è alla lettera «quanto questo».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit03.lesson03.translate.006
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: Questo costa cinque.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La preposizione ب si scrive attaccata al numero: ب + خمسة diventa بخمسة.'
    language_code: it
    direction: ltr
