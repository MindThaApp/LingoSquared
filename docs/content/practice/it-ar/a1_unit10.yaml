templates:
- content_key: practice.it-ar.ar.a1.unit10.lesson01.choose.001
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يمين è il sostantivo «destra» e اليسار è «la sinistra» con ال attaccato; l'articolo ال lo rende determinato.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit10.lesson01.listen.002
