    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: المقاس è la taglia, con ال; il venditore chiede ما المقاس؟
    language_code: it
    direction: ltr
