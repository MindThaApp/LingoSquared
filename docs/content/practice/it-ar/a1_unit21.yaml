      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Con ال la parola significa «la taglia»: ما المقاس؟'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson02.fill.007
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: fill_in_blank
  frame:
    text: مقاس {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: متوسط significa «medio» e segue il sostantivo مقاس.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson02.translate.008
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Sono parole di uso quotidiano negli acquisti: taglia, media, vestiti, blu e camicia.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson02.translate.009
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: translation
  frame:
    text: Qual è la taglia?
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'In arabo non serve una parola per «è»: ما المقاس؟ è alla lettera «che taglia».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson02.translate.010
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: translation
  frame:
    text: Voglio una camicia blu. Taglia media. (senza una parola separata per «io»)
    language_code: it
    direction: ltr
  slots:
    a: *id002
    b: *id003
    c: *id010
    d: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} {b}. {c} {d}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: مقاس متوسط da solo è la risposta breve alla domanda del venditore ما المقاس؟
    language_code: it
    direction: ltr
