templates:
- content_key: practice.it-ar.ar.a1.unit21.lesson01.choose.001
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ملابس significa «vestiti», قميص «camicia» e أزرق «blu» (maschile).
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson01.listen.002
  lesson_content_key: ar.a1.unit21.lesson01.item_color
