  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: مقاس متوسط è una taglia media; متوسط significa «medio».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson02.order.003
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: word_order
  frame:
    text: ما {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ما المقاس؟ significa «Qual è la taglia?», con ال perché si tratta di una taglia precisa.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson02.order.004
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: word_order
  frame:
    text: مقاس {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: مقاس {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L''aggettivo segue il sostantivo: مقاس متوسط è una taglia media.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson02.order.005
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: word_order
  frame:
    text: تفضلي. {item} بعشرة دراهم.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: تفضلي. {item} بعشرة دراهم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Il venditore dice تفضلي a una donna, poi nomina la camicia con ال.
    language_code: it
    direction: ltr
