  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أريد قميصا أزرق significa «Voglio una camicia blu»; «camicia» prende la desinenza ـا perché è la cosa voluta.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson01.order.003
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: word_order
  frame:
    text: أريد {item} أزرق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} أزرق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Dopo أريد la cosa voluta termina in tanwin: قميصا, e il colore segue il sostantivo.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson01.order.004
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: word_order
  frame:
    text: أريد قميصا {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد قميصا {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L''aggettivo viene dopo il sostantivo e concorda con esso: قميصا أزرق.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson01.fill.005
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: fill_in_blank
  frame:
    text: أريد {item} أزرق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قميصا è la forma usata per la cosa voluta dopo أريد.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson01.translate.006
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ملابس è un sostantivo plurale che significa «vestiti»; قميص è una camicia e أزرق è un colore.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson01.translate.007
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: translation
  frame:
    text: Voglio dei vestiti. (senza una parola separata per «io»)
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أريد significa già «voglio», quindi non serve أنا.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson01.translate.008
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: translation
  frame:
    text: Voglio una camicia blu. (senza una parola separata per «io»)
    language_code: it
    direction: ltr
  slots:
    a: *id002
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Il sostantivo prende la desinenza dell'oggetto ـا e il colore lo segue.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit21.lesson02.choose.001
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: multiple_choice
  frame:
