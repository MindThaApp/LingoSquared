- content_key: practice.it-ar.ar.a1.unit18.lesson01.translate.009
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: translation
  frame:
    text: Sono ingegnere. (detto da un uomo)
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Un uomo dice مهندس; non serve un verbo per «sono».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit18.lesson01.translate.010
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: translation
  frame:
    text: Lavoro in un ufficio. (senza una parola separata per «io»)
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أعمل في {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أعمل significa già «lavoro», quindi non serve أنا.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit18.lesson02.choose.001
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكتب significa «scrivo» e أقرأ «leggo»; sono entrambi verbi alla prima persona.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit18.lesson02.listen.002
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: العمل ha ال, quindi significa «il lavoro»; في العمل significa «al lavoro».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit18.lesson02.order.003
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: word_order
  frame:
    text: أنا {item} في العمل.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item} في العمل.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أنا («io») è facoltativo con questi verbi, che già significano «scrivo» e «leggo».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit18.lesson02.order.004
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: word_order
  frame:
    text: أكتب وأقرأ في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أكتب وأقرأ في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في العمل significa «al lavoro»; ال fa parte di العمل.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit18.lesson02.fill.005
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: fill_in_blank
  frame:
    text: أكتب {item} في العمل. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'La و è attaccata al verbo: وأقرأ significa «e leggo».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit18.lesson02.translate.006
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أكتب e أقرأ sono verbi alla prima persona; العمل è «il lavoro» con ال.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit18.lesson02.translate.007
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: Scrivo al lavoro. (senza una parola separata per «io»)
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أكتب في {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في più العمل significa «al lavoro».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit18.lesson02.translate.008
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: Leggo al lavoro. (senza una parola separata per «io»)
    language_code: it
    direction: ltr
  slots:
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أقرأ في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Prima viene il verbo, poi في e il luogo.
    language_code: it
    direction: ltr
