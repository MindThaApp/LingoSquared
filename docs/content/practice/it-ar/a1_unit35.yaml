  answer_derivation:
    kind: render_frame
    frame:
      text: الطرد {item} غدا.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Il pacco arriva domani. يصل significa arriva (maschile).
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit35.lesson03.fill.003
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: fill_in_blank
  frame:
    text: الطرد {item} فنقول يصل، والرسالة مؤنثة فنقول تصل. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
    hint:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il pacco è maschile, quindi si dice يصل (yaṣil). La lettera è femminile, quindi si dice تصل (taṣil). Un verbo al presente inizia con ي per un soggetto maschile e con ت per uno femminile, come in الطرد يصل (aṭ-ṭard yaṣil) e الرسالة تصل.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit35.lesson03.translate.004
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: translation
  frame:
    text: Il pacco arriva domani e la lettera richiede tre giorni.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_والرسالة
  answer_derivation:
    kind: render_frame
    frame:
      text: الطرد يصل غدا {item} تستغرق ثلاثة أيام.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Il pacco arriva domani e la lettera richiede tre giorni. والرسالة significa e la lettera.
    language_code: it
    direction: ltr
