schema_version: '1.0'
pack_key: practice.it-ar.a1.unit15
source_language: it
target_language: ar
unit_content_key: ar.a1.unit15.comparisons
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ar by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Italian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_أكبر
    - w_أصغر
    - w_أقرب
    - w_أرخص
    - w_والسوق
slot_presets:
  l1: &id001
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic:
      - w_أكبر
      - w_أصغر
      - w_أقرب
  comp4: &id002
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic:
      - w_أكبر
      - w_أصغر
      - w_أقرب
      - w_أرخص
  l2: &id005
    language_code: ar
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic:
      - w_أرخص
      - w_والسوق
      - w_أكبر
      - w_أقرب
  akbar:
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أكبر
  asghar: &id003
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أصغر
  aqrab: &id004
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أقرب
  arkhas: &id006
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أرخص
  walsuq: &id007
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_والسوق
templates:
- content_key: practice.it-ar.ar.a1.unit15.lesson01.choose.001
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكبر, أصغر e أقرب sono comparativi; ognuno è seguito da من («di», «che»).
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson01.listen.002
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'L''aggettivo comparativo ha una sola forma per il confronto, seguita da من: أقرب من significa «più vicino di».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson01.order.003
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: السوق {item} من المقهى.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: السوق {item} من المقهى.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Il comparativo sta tra i due termini del confronto, con من («di») davanti al secondo.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson01.order.004
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: المقهى {item} من السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L''arabo non ha bisogno di una parola per «è»: المقهى أصغر من السوق è letteralmente «il caffè più piccolo del mercato».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson01.fill.005
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: fill_in_blank
  frame:
    text: المقهى {item} من السوق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أصغر significa «più piccolo»; lo stesso schema dà أكبر, «più grande».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson01.translate.006
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: I comparativi sono aggettivi arabi brevi, senza una parola separata per «più»; sono seguiti da من.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson01.translate.007
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: Il caffè è più piccolo del mercato.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Il comparativo resta in un'unica forma ed è seguito da من («di»).
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson01.translate.008
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: Il caffè è più vicino del mercato.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أقرب significa «più vicino», dall'idea di «vicino», ed è seguito da من.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson02.choose.001
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أرخص significa «più economico»; segue lo stesso schema degli altri comparativi.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson02.listen.002
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: والسوق unisce و («e») a السوق («il mercato») in un'unica parola scritta.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson02.order.003
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: word_order
  frame:
    text: الماء {item} من القهوة.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أرخص significa «più economico»: الماء أرخص من القهوة vuol dire «l''acqua costa meno del caffè».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson02.fill.004
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: fill_in_blank
  frame:
    text: الماء {item} من القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «Più economico» usa lo stesso schema del comparativo, seguito da من.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson02.translate.005
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Questi sono quattro comparativi: più grande, più piccolo, più vicino e più economico.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson02.translate.006
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: L'acqua costa meno del caffè.
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Il comparativo vuole من davanti al secondo termine: più economico del caffè.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit15.lesson02.translate.007
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: Il caffè è più vicino del mercato e il mercato è più grande del caffè.
    language_code: it
    direction: ltr
  slots:
    a: *id004
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {a} من السوق، {b} أكبر من المقهى
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La و («e») si scrive unita alla parola successiva: والسوق.'
    language_code: it
    direction: ltr
