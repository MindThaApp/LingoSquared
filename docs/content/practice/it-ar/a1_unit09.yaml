  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: هنا significa «qui»; سوق è un mercato.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson01.match.003
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: قرب («vicino») è una preposizione, mentre هنا («qui») è un avverbio; le altre quattro sono nomi.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson01.order.004
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: word_order
  frame:
    text: أين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أين significa «dove»; il nome del luogo ha ال: la biblioteca, il mercato o il caffè.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson01.fill.005
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: fill_in_blank
  frame:
    text: المكتبة {item} السوق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قرب («vicino») precede il luogo a cui si è vicini, qui il mercato.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson01.translate.006
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مكتبة («biblioteca»), سوق («mercato») e مقهى («caffè») sono luoghi; مكان è la parola generica per «luogo».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson01.translate.007
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: Dov'è la biblioteca?
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ال corrisponde all'articolo determinativo italiano; si attacca all'inizio del nome.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson01.translate.008
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: Dov'è il mercato?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L''arabo non ha bisogno di un verbo «essere»: أين السوق؟ è alla lettera «dove il mercato?».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson01.order.009
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: word_order
  frame:
    text: المكتبة {item} قرب السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المكتبة {item} قرب السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'هنا («qui») può stare prima di قرب: la biblioteca è qui, vicino al mercato.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson02.choose.001
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: قرب significa «vicino»; è seguito direttamente dal nome del luogo.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson02.listen.002
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'وأين è و («e») unita a أين («dove»): «e dove».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson02.order.003
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: word_order
  frame:
    text: المقهى قرب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى قرب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'قرب non richiede altre parole: المقهى قرب المكتبة significa «il caffè è vicino alla biblioteca».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson02.order.004
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: word_order
  frame:
    text: وأين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: وأين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'وأين المقهى؟ continua la conversazione: «e dov''è il caffè?»'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson02.fill.005
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: fill_in_blank
  frame:
    text: أين المكتبة؟ {item} المقهى؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La و in وأين collega la nuova domanda a quella precedente.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson02.translate.006
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: وأين significa «e dove», una domanda di seguito; قرب significa «vicino».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson02.translate.007
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: La biblioteca è vicino al mercato.
    language_code: it
    direction: ltr
  slots:
    a: *id004
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: المكتبة {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'I nomi di luogo dopo قرب mantengono ال: قرب السوق significa «vicino al mercato».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson02.translate.008
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: Il caffè è vicino alla biblioteca.
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى قرب {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Il dialogo dell'unità risponde a وأين المقهى؟ proprio con questa frase.
    language_code: it
    direction: ltr
