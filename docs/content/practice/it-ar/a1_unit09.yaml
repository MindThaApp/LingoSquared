templates:
- content_key: practice.it-ar.ar.a1.unit09.lesson01.choose.001
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: مكان è la parola generica per «luogo»; مكتبة è una biblioteca e مقهى un caffè.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit09.lesson01.listen.002
