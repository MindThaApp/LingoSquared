templates:
- content_key: practice.it-ar.ar.a1.unit19.lesson01.choose.001
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: بيت significa casa, غرفة stanza e مطبخ cucina; qui questi nomi non hanno ال.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson01.listen.002
  lesson_content_key: ar.a1.unit19.lesson01.rooms
