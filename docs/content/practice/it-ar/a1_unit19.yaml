    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: بيتك è بيت (casa) più ـك (tuo/tua); عندك significa «tu hai».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson01.order.004
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: word_order
  frame:
    text: في بيتي {item} واحدة.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: في بيتي {item} واحدة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Il numero «uno» segue il nome e concorda con esso: غرفة واحدة è femminile.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson01.order.005
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: word_order
  frame:
    text: في بيتي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: في بيتي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في بيتي apre la frase e significa «nella mia casa»; segue ciò che c'è dentro.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson01.fill.006
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: fill_in_blank
  frame:
    text: في {item} غرفة واحدة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La desinenza ـي su بيت significa «mio/mia».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson01.translate.007
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Sono quattro nomi legati alla casa: casa, stanza, cucina e tavolo.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson01.translate.008
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: translation
  frame:
    text: Nella mia casa c'è una stanza.
    language_code: it
    direction: ltr
  slots:
    a: *id005
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: في {a} {b} واحدة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'In arabo non c''è un verbo per «c''è»: في بيتي غرفة è, letteralmente, «nella mia casa una stanza».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson02.choose.001
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: طاولة significa tavolo; ال in الغرفة la rende «la stanza».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson02.listen.002
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عندك significa «tu hai»; è formato da عند più la desinenza ـك.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson02.order.003
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: عندي طاولة في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي طاولة في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في الغرفة significa «nella stanza», con ال per una stanza determinata.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson02.order.004
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: أين {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La desinenza ـك significa «tuo/tua», quindi أين بيتك؟ vuol dire «dov'è la tua casa?».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson02.order.005
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: هل {item} طاولة؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {item} طاولة؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'هل introduce una domanda sì/no: هل عندك طاولة؟ significa «hai un tavolo?».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson02.fill.006
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: fill_in_blank
  frame:
    text: في بيتي غرفة واحدة {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'La و si attacca alla parola successiva: ومطبخ significa «e una cucina».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson02.translate.007
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le desinenze ـي (mio/mia) e ـك (tuo/tua) si aggiungono a بيت.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson02.translate.008
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: Ho un tavolo nella stanza.
    language_code: it
    direction: ltr
  slots:
    a: *id012
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: L'espressione في الغرفة mantiene ال dopo في.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson02.translate.009
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: Hai un tavolo?
    language_code: it
    direction: ltr
  slots:
    a: *id009
    b: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هل apre la domanda e l'ordine delle parole resta invariato.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson02.translate.010
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: Dov'è la tua casa, Yusuf?
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item} يا يوسف
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Layla chiede a Yusuf usando la desinenza ـك per «tuo/tua».
    language_code: it
    direction: ltr
