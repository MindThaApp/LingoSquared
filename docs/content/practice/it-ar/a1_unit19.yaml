  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: في بيتي غرفة واحدة significa «nella mia casa c'è una stanza»; غرفة è il nome della stanza.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit19.lesson01.match.003
  lesson_content_key: ar.a1.unit19.lesson01.rooms
