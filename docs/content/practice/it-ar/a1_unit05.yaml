templates:
- content_key: practice.it-ar.ar.a1.unit05.lesson01.choose.001
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'الساعة è ال («il/la») più ساعة («ora»): significa sia «l''ora» sia «l''orario».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson01.match.002
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'I numeri delle ore sono femminili per concordare con الساعة: الثالثة e الخامسة terminano in ة, a differenza degli ordinali maschili usati per le date.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson01.order.003
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: word_order
  frame:
    text: الساعة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L''ora segue direttamente الساعة e concorda con essa: entrambe sono al femminile, الساعة الثالثة.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson01.fill.004
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: fill_in_blank
  frame:
    text: كم {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كم الساعة؟ significa letteralmente «quanto l'ora?» ed è il modo abituale di chiedere che ore sono.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson01.translate.005
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: صباحا significa «di mattina» e va dopo l'ora; per la sera l'unità usa مساء.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson01.translate.006
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: translation
  frame:
    text: Sono le tre.
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: L'ordinale dell'ora الثالثة è femminile per concordare con الساعة.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson01.translate.007
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: translation
  frame:
    text: Sono le cinque del mattino.
    language_code: it
    direction: ltr
  slots:
    a: *id006
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La parte del giorno va alla fine: الساعة الخامسة صباحا.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson01.order.008
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: word_order
  frame:
    text: الساعة الخامسة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: الساعة الخامسة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Aggiungi صباحا («mattino») dopo l'ora, oppure مساء per il pomeriggio e la sera.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson02.listen.001
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'متى è la parola interrogativa «quando»: chiede del tempo.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson02.match.002
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'ومتى è و («e») unita a متى («quando»): «e quando». Così chi parla passa a una seconda domanda.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson02.order.003
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: word_order
  frame:
    text: الدرس في الساعة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس في الساعة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في الساعة davanti a un numero indica l''ora di un evento: alle tre.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson02.fill.004
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: fill_in_blank
  frame:
    text: كم الساعة؟ الساعة الثالثة. {item} الدرس؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La و di ومتى collega la domanda a ciò che è stato appena detto, come la «e» in italiano.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson02.translate.005
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: متى chiede «quando» e ومتى chiede «e quando»; solo la seconda continua una domanda precedente.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson02.translate.006
  lesson_content_key: ar.a1.unit05.lesson02.time_exchange
  type: translation
  frame:
    text: La lezione è alle cinque.
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في الساعة più l''ora significa «a quell''ora»: الدرس في الساعة الخامسة.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit05.lesson01.listen.009
  lesson_content_key: ar.a1.unit05.lesson01.ask_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La terminazione comune ة indica che الثالثة e الخامسة sono ordinali femminili.
    language_code: it
    direction: ltr
