templates:
- content_key: practice.it-ar.ar.a1.unit17.lesson01.choose.001
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ألم significa «dolore»; الرأس è la testa e البطن lo stomaco, entrambi con ال.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson01.listen.002
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عندي ألم في الرأس significa «ho mal di testa»; la parte del corpo ha ال.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson01.order.003
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: word_order
  frame:
    text: عندي ألم في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي ألم في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'في («in») è seguito dalla parte del corpo con ال: في الرأس, في البطن.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson01.fill.004
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: fill_in_blank
  frame:
    text: عندي ألم في {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La testa è الرأس; la frase dice «ho mal di testa».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson01.translate.005
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ألم è un nome e significa «dolore»; le due parti del corpo sono nomi con ال.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson01.translate.006
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: Ho mal di testa.
    language_code: it
    direction: ltr
  slots:
    a: *id004
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'عندي («ho») non richiede un verbo: عندي ألم significa «ho un dolore».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson01.translate.007
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: Ho mal di stomaco.
    language_code: it
    direction: ltr
  slots:
    a: *id004
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La parte del corpo mantiene ال dopo في: في البطن.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson02.choose.001
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحتاج significa «ho bisogno» e مساعدة «aiuto»; il verbo non ha un pronome separato.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson02.listen.002
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'اشربي è l''imperativo femminile: «bevi», detto a una donna.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson02.match.003
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: اشربي e استريحي sono imperativi rivolti a una donna; أحتاج significa «ho bisogno»; المشكلة ha ال, quindi significa «il problema».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson02.order.004
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: ما {item} يا ليلى؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} يا ليلى؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ما المشكلة؟ significa «qual è il problema?»; يا ليلى si rivolge a lei.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson02.order.005
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: عندي ألم. أحتاج {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي ألم. أحتاج {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أحتاج è seguito direttamente da ciò che serve: أحتاج مساعدة.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson02.order.006
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: يا ليلى {item} ماء.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: يا ليلى {item} ماء.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La desinenza ـي indica un imperativo rivolto a una donna: اشربي ماء.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson02.fill.007
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: fill_in_blank
  frame:
    text: اشربي ماء {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'La و si scrive attaccata alla parola seguente: واستريحي significa «e riposati».'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson02.fill.008
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: fill_in_blank
  frame:
    text: عندي ألم. {item} مساعدة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أحتاج significa «ho bisogno»; il prefisso أ indica «io».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson02.translate.009
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اشربي e استريحي sono imperativi rivolti a una donna e terminano in ـي.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson02.translate.010
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: Layla, bevi acqua. (a una donna)
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: يا ليلى {item} ماء
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Yusuf dice a Layla di bere: اشربي è l''imperativo femminile.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit17.lesson02.translate.011
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: Ho un dolore. Ho bisogno di aiuto. (non c'è una parola separata per «io»)
    language_code: it
    direction: ltr
  slots:
    a: *id004
    b: *id012
    c: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a}. {b} {c}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Sia عندي sia أحتاج contengono già «io» nella loro forma, quindi non serve أنا.
    language_code: it
    direction: ltr
