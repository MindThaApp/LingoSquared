templates:
- content_key: practice.it-ar.ar.a1.unit16.lesson01.choose.001
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تذكرة è un biglietto, القطار è il treno e القاهرة è il Cairo.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson01.listen.002
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: إلى significa per/verso, quindi إلى القاهرة è per il Cairo.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson01.match.003
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أي (quale) precede un nome singolare; الثاني (il secondo) segue il nome che descrive.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson01.order.004
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: word_order
  frame:
    text: أريد {item} إلى القاهرة.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} إلى القاهرة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Ciò che si vuole segue أريد, e إلى (per, verso) introduce la destinazione.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson01.order.005
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: word_order
  frame:
    text: أريد تذكرة إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد تذكرة إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La destinazione segue direttamente إلى; il ال di القاهرة fa parte del nome della città.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson01.fill.006
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: fill_in_blank
  frame:
    text: أريد {item} إلى القاهرة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تذكرة è un biglietto; أريد (voglio) non ha bisogno di una parola separata per «io».
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson01.translate.007
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sono due nomi comuni e il nome di una città; il ال di القاهرة fa parte del nome stesso.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson01.translate.008
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: Vorrei un biglietto per il Cairo, per favore. (nessuna parola separata per «io»)
    language_code: it
    direction: ltr
  slots:
    a: *id003
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} إلى {b} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Una richiesta di biglietto è أريد più il biglietto più إلى e la destinazione.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson01.translate.009
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: Voglio un biglietto. Il treno è alle cinque. (nessuna parola separata per «io»)
    language_code: it
    direction: ltr
  slots:
    a: *id003
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a}. {b} في الساعة الخامسة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L''ora si dice con في الساعة più un numerale ordinale femminile: الساعة الخامسة.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson02.choose.001
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الرصيف è il binario, con ال perché si tratta di un binario preciso.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson02.listen.002
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الثاني è il «secondo» al maschile; concorda con il nome maschile الرصيف.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson02.order.003
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: word_order
  frame:
    text: من أي {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: من أي {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أي (quale) è seguito da un nome senza ال: من أي رصيف؟ significa da quale binario?'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson02.order.004
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: word_order
  frame:
    text: من الرصيف {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: من الرصيف {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'L''ordinale segue il nome e prende anch''esso ال: الرصيف الثاني.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson02.fill.005
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: fill_in_blank
  frame:
    text: من أي {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Dopo أي il nome non ha ال: من أي رصيف؟'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson02.fill.006
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: fill_in_blank
  frame:
    text: من الرصيف {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'L''ordinale ripete il ال del nome: الرصيف الثاني.'
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson02.translate.007
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Queste parole servono a parlare del binario; أي significa quale.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson02.translate.008
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: Da quale binario?
    language_code: it
    direction: ltr
  slots:
    a: *id010
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: من {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La domanda è formata da من più أي più un nome senza ال.
    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit16.lesson02.translate.009
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: Dal secondo binario.
    language_code: it
    direction: ltr
  slots:
    a: *id011
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: من {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Sia il nome sia l''ordinale prendono ال: الرصيف الثاني.'
    language_code: it
    direction: ltr
