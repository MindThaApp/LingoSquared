    language_code: it
    direction: ltr
- content_key: practice.it-ar.ar.a1.unit13.lesson02.translate.008
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: translation
  frame:
    text: 'Yusuf chiede a Layla: Che cosa hai fatto ieri?'
    language_code: it
    direction: ltr
  slots:
    a: *id008
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: فعلت è la forma del passato per «tu»; si scrive allo stesso modo per un uomo o per una donna.
    language_code: it
    direction: ltr
