templates:
- content_key: practice.fr-hi.hi.a1.unit19.lesson01.choose.001
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: मौसम est un nom masculin ; la question est donc आज मौसम कैसा है ?, avec कैसा et non कैसी.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson01.listen.002
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Les mots de météo comme धूप, बारिश et हवा se construisent directement avec है : आज धूप है signifie « il y a du soleil aujourd’hui ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson01.order.003
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'En hindi, on nomme le temps et on ajoute है, sans mot équivalent à « il » : आज धूप है.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson01.order.004
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} कैसा है?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} कैसा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा s’accorde avec le nom masculin मौसम.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson01.fill.005
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: fill_in_blank
  frame:
    text: आज {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: धूप est féminin, mais है reste identique pour une seule chose.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson01.translate.006
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: Il y a du soleil aujourd’hui.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Pour dire « ensoleillé », l’hindi utilise le nom धूप avec है plutôt qu’un adjectif.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson01.translate.007
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'L’hindi nomme le temps par un nom : धूप est le soleil, बारिश la pluie et हवा le vent.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson02.choose.001
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'गर्म reste identique avec tous les noms, mais ठंडा change : ठंडा au masculin, ठंडी au féminin.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson02.match.002
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Adjectifs de météo : गर्म ne change pas selon le genre, mais ठंडा et ठंडी, si.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson02.order.003
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: word_order
  frame:
    text: आज मौसम बहुत {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम बहुत {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मौसम est masculin ; ठंडा et बुरा prennent donc la forme en -ा, et गर्म ne change jamais.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson02.order.004
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: word_order
  frame:
    text: आज हवा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आज हवा {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'हवा (le vent) est féminin ; l’adjectif se termine donc en -ी : ठंडी हवा.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson02.fill.005
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: fill_in_blank
  frame:
    text: आज मौसम {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: मौसम est masculin ; l’adjectif se termine donc en -ा.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson02.translate.006
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: Aujourd’hui, il fait chaud.
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: गर्म reste identique, quel que soit le nom qu’il décrit.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson02.translate.007
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: Il y a des nuages aujourd’hui.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बादल est ici au pluriel ; le verbe est donc हैं.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson02.translate.008
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: Aujourd’hui, il fait très froid.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम बहुत {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहुत se place avant l’adjectif, et ठंडा s’accorde avec मौसम.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson03.choose.001
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बाहर signifie « dehors », et चलो, बाहर जाते हैं ! est une proposition pour aller dehors.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson03.fill.002
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: fill_in_blank
  frame:
    text: चलो, {item} जाते हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बाहर est un adverbe ; il ne change donc jamais selon le genre ou le nombre.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit19.lesson03.translate.003
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: translation
  frame:
    text: Allons dehors !
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, {item} जाते हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो suivi d’un verbe en -ते avec हैं est la manière habituelle de proposer de faire quelque chose ensemble.
    language_code: fr
    direction: ltr
