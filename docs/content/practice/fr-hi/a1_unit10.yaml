templates:
- content_key: practice.fr-hi.hi.a1.unit10.lesson01.choose.001
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Les verbes d’habitude se terminent par -ता pour un homme et -ती pour une femme : मैं उठता हूँ, मैं उठती हूँ.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson01.listen.002
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: वह signifie « il » ou « elle », et la terminaison du verbe indique lequel ; वे signifie « ils » ou « elles ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson01.order.003
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ सात बजे {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ सात बजे {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'La terminaison du verbe suit le genre de la personne qui parle : उठता pour un homme et उठती pour une femme, et हूँ s’emploie avec मैं.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson01.order.004
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ काम पर {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: काम पर जाना, « aller au travail », demande पर, mais la terminaison du verbe suit toujours le genre de la personne qui parle.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson01.fill.005
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: fill_in_blank
  frame:
    text: मैं रोज़ नाश्ता {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Beaucoup d’actions en hindi sont formées d’un nom + करना : नाश्ता करना signifie « prendre le petit-déjeuner ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson01.translate.006
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: Tous les jours, je vais au travail. (dit par une femme)
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Une femme emploie la terminaison -ती : जाती हूँ ; un homme dirait जाता हूँ.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson01.translate.007
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: Tous les jours, je prends mon petit-déjeuner. (dit par un homme)
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ नाश्ता {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: L’hindi dit नाश्ता करना, littéralement « faire le petit-déjeuner », là où le français dit « prendre le petit-déjeuner ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson02.choose.001
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Avec तुम, le verbe se termine par -ते pour un homme et -ती pour une femme, et prend हो : तुम उठते हो, तुम उठती हो.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson02.match.002
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Chaque verbe d’habitude a une forme masculine en -ता et une forme féminine en -ती, et la forme suit la personne qui parle.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson02.order.003
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: word_order
  frame:
    text: तुम कब {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Avec तुम, le verbe est en -ते हो quand on s’adresse à un homme, et la terminaison suit la personne à qui l’on parle.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson02.fill.004
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: fill_in_blank
  frame:
    text: मैं रात को ग्यारह बजे {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ici, la personne qui parle est une femme, donc le verbe prend -ती ; la terminaison suit celle qui dort.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson02.translate.005
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: À quelle heure te couches-tu ? (informel, à un homme)
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Avec तुम, la terminaison suit la personne à qui l’on parle, et non celle qui parle : सोते pour un homme, सोती pour une femme.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson02.translate.006
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: À quelle heure te lèves-tu ? (informel, à une femme)
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Quand on s’adresse à une femme, le verbe se termine par -ती : तुम उठती हो.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson03.choose.001
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: आते dans तुम कब वापस आते हो? est la forme en -ते employée avec तुम quand on s’adresse à un homme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson03.fill.002
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: fill_in_blank
  frame:
    text: मैं शाम को छह बजे वापस {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: आता est la forme masculine, c’est donc un homme qui parle ; une femme dirait आती.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson03.translate.003
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: Je rentre le soir. (dit par un homme)
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं शाम को वापस {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: को après शाम signifie « le soir », et वापस आना signifie « revenir, rentrer ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson03.translate.004
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: Je mange le dîner. (dit par une femme)
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रात का खाना {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रात का खाना, littéralement « le repas de la nuit », signifie « dîner » ; la terminaison -ती montre que c’est une femme qui parle.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit10.lesson03.translate.005
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'वापस signifie « de retour » et se combine avec des verbes comme आना : वापस आता हूँ, « je rentre ».'
    language_code: fr
    direction: ltr
