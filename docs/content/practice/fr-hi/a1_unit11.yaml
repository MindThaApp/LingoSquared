templates:
- content_key: practice.fr-hi.hi.a1.unit11.lesson01.choose.001
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'चलो suivi d’un verbe en -ते et de हैं exprime une suggestion de faire quelque chose ensemble : चलो, फ़िल्म देखते हैं!'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson01.listen.002
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'साथ signifie « ensemble » ou « avec », et une suggestion l’inclut souvent : चलो, साथ चाय पीते हैं!'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson01.order.003
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, {item} देखते हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, {item} देखते हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म est féminin, mais la forme de suggestion -ते हैं ne change pas pour autant.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson01.order.004
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, साथ चाय {item} हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, साथ चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: La forme de suggestion est le verbe en -ते avec हैं, au sens de « faisons… ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson01.fill.005
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: अच्छा {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: अच्छा विचार है est une façon courante d’accepter une suggestion.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson01.fill.006
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: चलो, फ़िल्म {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: देखते est la forme en -ते qui, avec हैं, signifie « nous regardons » et, après चलो, « regardons ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson01.translate.007
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: Buvons du thé !
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Pour dire « faisons… » en hindi, on emploie चलो plus la forme en -ते हैं du verbe.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson01.translate.008
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: 'Bonne idée ! (phrase complète : « bonne idée est »)'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अच्छा {item} है!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: विचार est masculin, c’est pourquoi l’adjectif est अच्छा.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson02.choose.001
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: माफ़ करना est la façon informelle de dire « désolé » ou « excuse-moi », employée avec les personnes que l’on appelle तुम.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson02.match.002
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Parmi les mots hindi pour refuser poliment : माफ़ करना pour « désolé » et व्यस्त pour « occupé ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson02.fill.003
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: fill_in_blank
  frame:
    text: माफ़ करना, मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Après माफ़ करना, on explique sa situation, par exemple le fait d’être occupé.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson02.translate.004
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: Désolé, je suis occupé. (informel)
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: माफ़ करना, मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: माफ़ करना est la façon informelle de s’excuser ; व्यस्त reste identique pour un homme ou une femme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson02.translate.005
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: Alors, quand est-ce qu’on se retrouve ?
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तो {item} कब मिलते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'हम prend la forme plurielle en -ते हैं : हम मिलते हैं, « nous nous retrouvons ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson03.choose.001
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'संदेश est un message, par exemple un SMS pour proposer un projet : प्रिया, चलो शनिवार को फ़िल्म देखते हैं?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson03.order.002
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: word_order
  frame:
    text: प्रिया, चलो शनिवार को {item} देखते हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया, चलो शनिवार को {item} देखते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Commencer par le prénom, c’est s’adresser directement à la personne, et को après शनिवार signifie « samedi » (le jour où).
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit11.lesson03.translate.003
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'सुझाव est une suggestion que l’on fait à quelqu’un, tandis que विचार est une idée ou une pensée : अच्छा विचार है! signifie « bonne idée ! »'
    language_code: fr
    direction: ltr
