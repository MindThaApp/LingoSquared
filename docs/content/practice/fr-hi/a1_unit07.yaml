templates:
- content_key: practice.fr-hi.hi.a1.unit07.lesson01.choose.001
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दुकानदार est formé de दुकान (boutique) et de -दार, une terminaison courante pour désigner la personne qui tient ou possède quelque chose.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson01.listen.002
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कमीज़ et टोपी sont des noms féminins, alors que बैग est masculin.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson01.order.003
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: word_order
  frame:
    text: मुझे यह {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'यह (ce, cette) se place juste devant le nom qu’il désigne : मुझे यह कमीज़ चाहिए.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson01.fill.004
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: fill_in_blank
  frame:
    text: जी नहीं, {item} यह। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जी नहीं est un « non » poli ; सिर्फ़ limite la demande à cela seulement.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson01.match.005
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'En hindi, les noms de commerces s’emploient sans article : बाज़ार peut donc signifier « un marché » ou « le marché ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson01.translate.006
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: Je voudrais cette chemise.
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए reste identique quel que soit le locuteur, et यह désigne le nom qui le suit directement.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson01.translate.007
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dans une boutique hindi, la personne qui vend est le दुकानदार et le lieu est la दुकान ; le marché lui-même est le बाज़ार.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson02.choose.001
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'सस्ता et महंगा changent comme मेरा et मेरी : les noms féminins prennent सस्ती et महंगी.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson02.order.002
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: word_order
  frame:
    text: यह टोपी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह टोपी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'टोपी est féminin, donc l’adjectif se termine en -ी : सस्ती ou महंगी.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson02.fill.003
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह कमीज़ बहुत {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कमीज़ est féminin, donc l’adjectif est महंगी et non महंगा.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson02.fill.004
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह बैग {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बैग est masculin, donc l’adjectif est सस्ता et non सस्ती.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson02.translate.005
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 'Combien coûte cette chemise ? (littéralement : cette chemise est de combien ?)'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: यह कमीज़ कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Le का ou की dans une question de prix s’accorde avec la chose dont on demande le prix, et non avec कितने : कमीज़ est féminin, donc की.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson02.translate.006
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 'Combien coûte ce sac ? (littéralement : ce sac est de combien ?)'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह बैग कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Le का ou की dans une question de prix s’accorde avec la chose dont on demande le prix : बैग est masculin, donc का.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson03.listen.001
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'खरीदते हैं après चलो exprime une proposition, alors que खरीदना est la forme du dictionnaire : acheter.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson03.order.002
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: word_order
  frame:
    text: ठीक है! {item} या टोपी?
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: ठीक है! {item} या टोपी?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: या relie les deux choix, et la question n’est marquée que par l’intonation montante et le point d’interrogation.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson03.fill.003
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: चलो, कुछ {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खरीदते avec हैं après चलो signifie « achetons » ; la forme en -ते ne dépend pas du genre du groupe.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson03.fill.004
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: यह टोपी पाँच सौ रुपये {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dans यह टोपी पाँच सौ रुपये की है, की s’accorde avec le nom féminin टोपी.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit07.lesson03.translate.005
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: translation
  frame:
    text: Achetons quelque chose !
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो suivi d’un verbe au pluriel en -ते avec हैं est la façon habituelle de faire une suggestion.
    language_code: fr
    direction: ltr
