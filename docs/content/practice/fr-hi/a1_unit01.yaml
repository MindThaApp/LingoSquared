templates:
- content_key: practice.fr-hi.hi.a1.unit01.lesson01.choose.001
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'L’hindi a deux mots pour dire « tu/vous » : आप est formel et respectueux, tandis que तुम est informel et s’emploie avec des amis et des personnes du même âge ou plus jeunes.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson01.fill.002
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le verbe être change avec le sujet : हूँ va avec मैं, हो avec तुम et हैं avec आप.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson01.order.003
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: word_order
  frame:
    text: आप {item} हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Le mot interrogatif s’accorde avec la personne interrogée : कैसे pour un homme et कैसी pour une femme, tandis que आप prend toujours हैं.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson01.translate.004
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: Comment vas-tu ? (informel, à un homme)
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Avec तुम, le verbe est हो ; pour s’adresser à une femme, कैसे devient कैसी : तुम कैसी हो?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson01.translate.005
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: Comment allez-vous ? (formel, à une femme)
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Le आप de politesse prend le हैं, d’apparence plurielle, même pour une seule personne, et कैसी est la forme féminine de « comment ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson02.listen.001
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अलविदा est un adieu ; dans la langue courante, नमस्ते sert aussi bien à dire bonjour qu’au revoir.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson02.order.002
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: word_order
  frame:
    text: आपका {item} अच्छा रहे।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} अच्छा रहे।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रहे en fait un souhait (que cela reste bien), et आपका montre qu’on s’adresse à quelqu’un avec le आप de politesse ; avec तुम, ce serait तुम्हारा.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson02.match.003
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Le hindi n’a pas d’article : नाम peut signifier « le nom » ou « un nom » selon la phrase.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson03.choose.001
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En hindi, la question garde l’ordre de la phrase affirmative : le mot interrogatif कहाँ prend la place de la réponse (आप कहाँ से हैं? et मैं भारत से हूँ).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson03.order.002
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मेरा नाम {name} है।
    language_code: hi
    direction: ltr
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Le hindi place le verbe à la fin : मेरा नाम ... है correspond donc littéralement à « Mon nom ... est ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson03.order.003
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मैं {place} से हूँ।
    language_code: hi
    direction: ltr
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से se place après le lieu et signifie « de » ; c’est une postposition, et non une préposition.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson03.fill.004
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: fill_in_blank
  frame:
    text: आपसे मिलकर {item} हुई। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: C’est le « Enchanté » de politesse, littéralement « la joie est arrivée en vous rencontrant » ; la version informelle est तुमसे मिलकर अच्छा लगा.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson03.translate.005
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Je m’appelle {name}.
    language_code: fr
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'नाम est un nom masculin : tout le monde, hommes comme femmes, dit donc मेरा नाम.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson03.translate.006
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Mon lieu d’origine est {place}.
    language_code: fr
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Une femme dit aussi मैं भारत से हूँ : le verbe हूँ ne change pas selon le genre de la personne qui parle.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson03.translate.007
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: D’où viens-tu ? (informel)
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} से हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Pour poser la même question avec politesse, utilise आप avec हैं : आप कहाँ से हैं?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit01.lesson03.translate.008
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Les noms hindi sont masculins ou féminins : दिन, नाम et योग sont masculins, खुशी est féminin.'
    language_code: fr
    direction: ltr
