templates:
- content_key: practice.fr-hi.hi.a1.unit08.lesson01.choose.001
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tous ces noms de lieux sont masculins : tout verbe ou adjectif qui s’accorde avec eux prend la forme en -ा.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson01.listen.002
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'यहाँ et वहाँ sont des adverbes : ils ne varient jamais en genre ni en nombre.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson01.order.003
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: word_order
  frame:
    text: मैं {item} में हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में après un lieu signifie « dans » ou « à », et हूँ s’emploie avec मैं.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson01.order.004
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: word_order
  frame:
    text: बैंक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Le verbe है vient normalement en dernier, après le mot de lieu : बैंक वहाँ है se traduit littéralement par « banque là-bas est ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson01.fill.005
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: fill_in_blank
  frame:
    text: स्कूल {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: यहाँ signifie « ici », près de celui qui parle, et वहाँ « là-bas », loin de lui.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson01.translate.006
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: translation
  frame:
    text: La banque est là-bas.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Le hindi n’a pas d’article : बैंक peut donc signifier « une banque » ou « la banque ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson01.translate.007
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le hindi emploie beaucoup de mots empruntés à l’anglais pour les lieux, comme स्कूल, बैंक, पार्क et स्टेशन.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson02.choose.001
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पास, सामने et पीछे se construisent avec के après le lieu de référence : बैंक के पास, « près de la banque ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson02.match.002
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Les mots de lieu hindis vont par paires de contraires : यहाँ et वहाँ, पास et दूर, सामने et पीछे.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson02.order.003
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: word_order
  frame:
    text: स्कूल बैंक के {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: स्कूल बैंक के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के relie le lieu de référence à पास, सामने ou पीछे, un peu comme « de » dans « en face de ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson02.fill.004
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: fill_in_blank
  frame:
    text: पार्क स्कूल के {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'पीछे et सामने sont des contraires : on peut donc décrire les deux mêmes lieux depuis l’un ou l’autre côté.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson02.fill.005
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: fill_in_blank
  frame:
    text: स्टेशन {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'दूर peut s’employer seul (स्टेशन दूर है) ; avec un lieu de référence, il prend से et non के : बैंक से दूर.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson02.translate.006
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: translation
  frame:
    text: L’école est devant le parc.
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: स्कूल पार्क के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के placé après le lieu de référence le relie à सामने, « devant ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson02.translate.007
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: translation
  frame:
    text: La banque est près de l’école.
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक स्कूल के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Ici, पास signifie « près » ; dans मेरे पास, il signifie « j’ai » : un seul mot, deux emplois.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson03.listen.001
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: तो dans हाँ, तो ... marque une conclusion, et थोड़ा signifie « un peu ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson03.order.002
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: word_order
  frame:
    text: यह {item} बैंक के पास है।
    language_code: hi
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बैंक के पास है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: डाकघर est un composé de डाक (courrier) et घर (maison), littéralement « la maison du courrier ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson03.fill.003
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: fill_in_blank
  frame:
    text: हाँ, {item} दूर है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थोड़ा placé devant un adjectif ou un adverbe l’atténue, comme « un peu » en français.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit08.lesson03.translate.004
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: translation
  frame:
    text: Oui, la poste est près de la banque.
    language_code: fr
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: हाँ, {item} बैंक के पास है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Le lieu de référence बैंक vient d’abord, puis के पास, puis है.
    language_code: fr
    direction: ltr
