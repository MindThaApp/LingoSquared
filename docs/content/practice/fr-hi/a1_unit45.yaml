      text: आग {item} है!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Il y a un incendie ! लगी signifie « s’est déclaré(e) ; a commencé » (sujet féminin, comme pour un incendie).
    language_code: fr
    direction: ltr
