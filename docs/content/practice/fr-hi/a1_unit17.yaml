templates:
- content_key: practice.fr-hi.hi.a1.unit17.lesson01.choose.001
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: शिक्षक désigne un enseignant et शिक्षिका une enseignante ; इंजीनियर s’emploie pour les deux.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson01.listen.002
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Certains noms de métiers hindis ont une forme féminine distincte, comme शिक्षक et शिक्षिका, tandis que les mots empruntés comme इंजीनियर n’en ont pas.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson01.order.003
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: मैं {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Le mot pour « enseignant » suit le genre de la personne qui parle : शिक्षक pour un homme, शिक्षिका pour une femme.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson01.order.004
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: प्रिया {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: प्रिया est une femme, donc elle est शिक्षिका.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson01.fill.005
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: शिक्षिका forme son féminin en -इका, un modèle présent dans plusieurs mots empruntés au sanskrit.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson01.fill.006
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: fill_in_blank
  frame:
    text: अर्जुन {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इंजीनियर est le même mot pour un homme et pour une femme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson01.translate.007
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Je suis professeure. (dit par une femme)
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Une femme dit शिक्षिका ; un homme dirait शिक्षक.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson01.translate.008
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Je suis professeur. (dit par un homme)
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Un homme dit शिक्षक ; une femme dirait शिक्षिका.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson01.translate.009
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Je suis ingénieur(e).
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: इंजीनियर ne change pas selon le genre, et l’hindi n’a pas de mot pour « un » / « une ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson02.choose.001
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दफ़्तर est un nom masculin qui signifie « bureau », et में après lui signifie « dans le bureau ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson02.order.002
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: word_order
  frame:
    text: मैं {item} में काम करता हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में après le lieu signifie « dans / à », et le lieu se place avant le verbe.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson02.fill.003
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: fill_in_blank
  frame:
    text: अर्जुन {item} में काम करता है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: काम करना signifie « travailler », et le lieu de travail se construit avec में.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson02.translate.004
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: Je travaille dans un bureau. (dit par un homme)
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: L’hindi n’a pas de mot pour « un » / « une », et le lieu se place avant काम करता हूँ.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson02.translate.005
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: Arjun travaille dans un bureau.
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: अर्जुन {item} में काम करता है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Avec un prénom, le verbe se termine par है et non par हूँ, et -ता montre qu’Arjun est un homme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson03.choose.001
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाते dans तुम रोज़ दफ़्तर जाते हो est la forme en -ते employée avec तुम quand on s’adresse à un homme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson03.order.002
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: word_order
  frame:
    text: तुम रोज़ दफ़्तर {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Avec तुम, le verbe se termine par -ते et est suivi de हो, quand on s’adresse à un homme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson03.fill.003
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: fill_in_blank
  frame:
    text: तुम रोज़ दफ़्तर {item} हो? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Une question fermée peut commencer par un क्या facultatif, mais l’intonation montante suffit.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit17.lesson03.translate.004
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: translation
  frame:
    text: Tu vas au bureau tous les jours. (familier, en s’adressant à un homme)
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Avec तुम, le verbe se termine par -ते et est suivi de हो, pour un homme.
    language_code: fr
    direction: ltr
