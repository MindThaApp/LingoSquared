templates:
- content_key: practice.fr-hi.hi.a1.unit12.lesson01.choose.001
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'था et थी remplacent है au passé et s’accordent avec le sujet : दिन अच्छा था, फ़िल्म अच्छी थी.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson01.order.002
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: कल का दिन {item} था?
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: कल का दिन {item} था?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा s’accorde avec le nom masculin दिन ; avec un nom féminin, on aurait कैसी.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson01.order.003
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: चाय की दुकान बहुत {item} थी।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अच्छी est au féminin parce que दुकान est féminin, et थी s’accorde avec lui.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson01.fill.004
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: fill_in_blank
  frame:
    text: फ़िल्म अच्छी {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थी est le passé féminin du verbe être et s’accorde avec le nom féminin फ़िल्म.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson01.translate.005
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: Le film était bien.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फ़िल्म अच्छी {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'फ़िल्म est féminin : l’adjectif et le passé du verbe être prennent donc la forme féminine.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson01.translate.006
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: La boutique de thé était très bien.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की relie चाय au nom féminin दुकान, et अच्छी et थी s’accordent avec lui.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson02.choose.001
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Les formes du passé de जाना et de मिलना se terminent en -आ pour un homme et en -ई pour une femme : गया ou गई, मिला ou मिली.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson02.order.002
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: word_order
  frame:
    text: मैं वहाँ प्रिया से {item}।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं वहाँ प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'से signifie ici « avec » : प्रिया से मिला veut dire « j’ai rencontré Priya », et la terminaison suit la personne qui parle.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson02.fill.003
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं कल बाज़ार {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La terminaison -ई montre que la personne qui parle est une femme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson02.fill.004
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं वहाँ अर्जुन से {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le passé de मिलना s’accorde avec la personne qui parle : une femme dit donc मिली.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson02.translate.005
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: Je suis allée à la maison. (dit par une femme)
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं घर {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Une femme dit गई ; un homme dirait गया.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson02.translate.006
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: J’ai rencontré Priya. (dit par une femme)
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से après la personne rencontrée signifie « avec » ; la terminaison du verbe suit la personne qui parle.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson02.translate.007
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le passé d’un verbe s’accorde avec la personne qui fait l’action : un homme dit मिला et une femme dit मिली.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson03.choose.001
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'मिले s’emploie avec हम, तुम et वे : हम मिले, nous nous sommes rencontrés.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson03.fill.002
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: fill_in_blank
  frame:
    text: वहाँ हम {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Avec हम, la forme du passé se termine en -ए, comme le masculin pluriel.
    language_code: fr
    direction: ltr
- content_key: practice.fr-hi.hi.a1.unit12.lesson03.translate.003
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: translation
  frame:
    text: Nous nous sommes rencontrés.
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: हम {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: हम prend la forme plurielle मिले, quelles que soient les personnes du groupe.
    language_code: fr
    direction: ltr
