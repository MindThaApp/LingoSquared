    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Przepraszam は、知らない人に何かをたずねる前の「すみません」と、謝るときの「ごめんなさい」の両方に使います。
    language_code: ja
    direction: ltr
