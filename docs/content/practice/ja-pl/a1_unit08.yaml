templates:
- content_key: practice.ja-pl.pl.a1.unit08.lesson01.choose.001
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ポーランド語では、場所を表す名詞に冠詞は付かないので、bank は「銀行」とも「その銀行」とも取れます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson01.listen.002
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poczta、apteka、restauracja は -a で終わる女性名詞で、bank、hotel、park は男性名詞です。
    language_code: ja
    direction: ltr
