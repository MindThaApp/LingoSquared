    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Naprzeciwko のあとは生格になるので、hotel は hotelu になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson02.translate.006
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: translation
  frame:
    text: 薬局は銀行の隣にあります。
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Apteka jest obok {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Obok のあとでは場所を表す名詞が生格の語尾になるので、bank は banku になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson02.translate.007
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Niedaleko は nie + daleko、つまり「遠くない」で、かなり近いという意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson03.choose.001
  lesson_content_key: pl.a1.unit08.lesson03.gdzie_jest_apteka
  type: multiple_choice
  frame:
