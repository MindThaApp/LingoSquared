    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Przepraszam は、場所をたずねるときなど、知らない人への丁寧な質問の出だしに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson03.translate.003
  lesson_content_key: pl.a1.unit08.lesson03.gdzie_jest_apteka
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
