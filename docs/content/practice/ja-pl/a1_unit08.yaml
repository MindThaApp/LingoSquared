    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Hotel、bank、park はどれも男性名詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson01.order.004
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: word_order
  frame:
    text: Gdzie jest {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Gdzie jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gdzie jest は何かの場所をたずねる表現で、場所を表す名詞は基本の形のままです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson01.fill.005
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: fill_in_blank
  frame:
    text: To jest {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: To jest は物を紹介する表現で、後ろの名詞は基本の形のままです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson01.translate.006
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: translation
  frame:
    text: 薬局はどこですか。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gdzie jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gdzie jest + 場所は、物や場所を探すときに何にでも使える質問です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson01.translate.007
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Poczta は「郵便局」を表す、日常的な短い言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson02.choose.001
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Obok と naprzeciwko のあとは生格になるので、bank は banku になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson02.listen.002
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: bank、hotel、park のような男性名詞は、obok、naprzeciwko、blisko のあとで -u が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson02.order.003
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: word_order
  frame:
    text: Apteka jest obok {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Apteka jest obok {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: これらの男性名詞の生格の語尾は -u で、banku、hotelu、parku のようになります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson02.order.004
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: word_order
  frame:
    text: Park jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Park jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Blisko、daleko、niedaleko は副詞なので、どの名詞と使っても形は変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit08.lesson02.fill.005
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
