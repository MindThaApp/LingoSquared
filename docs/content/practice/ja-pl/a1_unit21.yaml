    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのポーランド語の単語に合う日本語の意味を結びましょう。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
