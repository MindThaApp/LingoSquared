schema_version: '1.0'
pack_key: practice.ja-pl.a1.unit62
source_language: ja
target_language: pl
unit_content_key: pl.a1.unit62.ksiegarnia
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_autor
    - w_interesująca
    - w_książeczka
    - w_książeczki
    - w_książka
    - w_książki
    - w_księgarnia
    - w_popularna
    - w_powieści
    - w_powieść
    - w_sklepu
    - w_szukam
    - w_tytuł
    - w_tytułem
    - w_zakładka
    - w_zakładką
    - w_znany
    - w_zoologicznego
templates:
- content_key: practice.ja-pl.pl.a1.unit62.lesson01.choose.001
  lesson_content_key: pl.a1.unit62.lesson01.pojdziemy_do_ksiegarni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_księgarnia
        - w_książka
        - w_powieść
        - w_szukam
        - w_powieści
        - w_tytuł
        - w_tytułem
        - w_autor
        - w_znany
        - w_książeczka
        - w_książki
        - w_popularna
        - w_książeczki
        - w_zakładka
        - w_zakładką
        - w_interesująca
        - w_sklepu
        - w_zoologicznego
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は今回の単元の単語で、「本屋に行きましょうか?」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit62.lesson02.listen.001
  lesson_content_key: pl.a1.unit62.lesson02.powiesc_i_tytul
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語で、小説とタイトルのレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit62.lesson03.translate.001
  lesson_content_key: pl.a1.unit62.lesson03.autor_i_pracownik
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語で、作家と店員のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit62.lesson04.match.001
  lesson_content_key: pl.a1.unit62.lesson04.ceny_w_ksiegarni
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのポーランド語の単語に合う日本語の意味を結びましょう。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit62.lesson05.choose.001
  lesson_content_key: pl.a1.unit62.lesson05.przy_ladzie_w_ksiegarni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は今回の単元の単語で、「本屋のカウンターで」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit62.lesson06.translate.001
  lesson_content_key: pl.a1.unit62.lesson06.ewa_slyszy_o_ksiegarni
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は今回の単元の単語で、「エヴァが本屋の話を聞く」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit62.lesson02.order.002
  lesson_content_key: pl.a1.unit62.lesson02.powiesc_i_tytul
  type: word_order
  frame:
    text: Ile kosztuje ta {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_powieść
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje ta {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: この小説はいくらですか?powieść は「小説」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit62.lesson02.fill.003
  lesson_content_key: pl.a1.unit62.lesson02.powiesc_i_tytul
  type: fill_in_blank
  frame:
    text: Szukam {item} z tytułem. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_powieści
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_powieści
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: タイトルのある小説を探しています。powieści は「小説の」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit62.lesson03.order.002
  lesson_content_key: pl.a1.unit62.lesson03.autor_i_pracownik
  type: word_order
  frame:
    text: Autor jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_znany
  answer_derivation:
    kind: render_frame
    frame:
      text: Autor jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: その作家は有名です。znany は「有名な」(男性形)という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit62.lesson04.order.002
  lesson_content_key: pl.a1.unit62.lesson04.ceny_w_ksiegarni
  type: word_order
  frame:
    text: Ile kosztuje {item} dla dzieci?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_książeczka
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje {item} dla dzieci?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: その子ども向けの本はいくらですか?książeczka は「子ども向けの本、小さな本」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit62.lesson05.order.002
  lesson_content_key: pl.a1.unit62.lesson05.przy_ladzie_w_ksiegarni
  type: word_order
  frame:
