    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit62.lesson06.order.002
  lesson_content_key: pl.a1.unit62.lesson06.ewa_slyszy_o_ksiegarni
  type: word_order
  frame:
