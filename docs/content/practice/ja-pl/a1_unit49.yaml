  feedback_frame:
    text: '{item}は、このユニットの単語で、「博物館は何時に閉まりますか?」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit49.lesson04.match.001
  lesson_content_key: pl.a1.unit49.lesson04.w_muzeum
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのポーランド語の単語に合う日本語の意味を結びましょう。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
