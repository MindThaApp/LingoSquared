schema_version: '1.0'
pack_key: practice.ja-pl.a1.unit49
source_language: ja
target_language: pl
unit_content_key: pl.a1.unit49.muzeum
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_duża
    - w_koncert
    - w_obraz
    - w_obrazy
    - w_otwarte
    - w_piątej
    - w_przewodnika
    - w_sala
    - w_trzeba
    - w_wstępu
    - w_wystawa
    - w_zamykać
    - w_zwiedzam
    - w_zwiedzić
templates:
- content_key: practice.ja-pl.pl.a1.unit49.lesson01.choose.001
  lesson_content_key: pl.a1.unit49.lesson01.chce_isc_do_muzeum
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_zwiedzić
        - w_wystawa
        - w_zwiedzam
        - w_zamykać
        - w_piątej
        - w_otwarte
        - w_przewodnika
        - w_trzeba
        - w_sala
        - w_duża
        - w_obraz
        - w_obrazy
        - w_wstępu
        - w_koncert
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語で、「博物館に行きたい」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
