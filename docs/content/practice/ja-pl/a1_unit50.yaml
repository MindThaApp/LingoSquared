schema_version: '1.0'
pack_key: practice.ja-pl.a1.unit50
source_language: ja
target_language: pl
unit_content_key: pl.a1.unit50.koncert
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_miejsce
    - w_początek
    - w_publiczność
    - w_scena
    - w_trwa
    - w_trwać
    - w_wspaniały
    - w_wędrowcy
    - w_zadowolona
    - w_zespołu
    - w_zespół
templates:
- content_key: practice.ja-pl.pl.a1.unit50.lesson01.choose.001
  lesson_content_key: pl.a1.unit50.lesson01.chce_isc_na_koncert
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_zespół
        - w_zespołu
        - w_miejsce
        - w_trwać
        - w_trwa
        - w_scena
        - w_publiczność
        - w_zadowolona
        - w_wędrowcy
        - w_początek
        - w_wspaniały
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、「コンサートに行きたい」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit50.lesson02.listen.001
  lesson_content_key: pl.a1.unit50.lesson02.chce_kupic_bilet
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語で、チケットを買いたいときのレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit50.lesson03.translate.001
  lesson_content_key: pl.a1.unit50.lesson03.o_ktorej_zaczyna_sie
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、「コンサートは何時に始まりますか？」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit50.lesson05.match.001
  lesson_content_key: pl.a1.unit50.lesson05.czytanie_repertuaru
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのポーランド語の単語に合う日本語の意味を結びましょう。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit50.lesson06.choose.001
  lesson_content_key: pl.a1.unit50.lesson06.marek_nina_i_ewa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、Marek、Nina、Ewaがコンサートに行くレッスンに出てくる、このユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit50.lesson01.translate.002
  lesson_content_key: pl.a1.unit50.lesson01.chce_isc_na_koncert
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、「コンサートに行きたい」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit50.lesson01.order.003
  lesson_content_key: pl.a1.unit50.lesson01.chce_isc_na_koncert
  type: word_order
  frame:
    text: Chciałabym iść na koncert {item}, poproszę.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zespołu
  answer_derivation:
    kind: render_frame
    frame:
      text: Chciałabym iść na koncert {item}, poproszę.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: バンドのコンサートに行きたいのですが。zespołu は「バンドの」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit50.lesson02.order.002
  lesson_content_key: pl.a1.unit50.lesson02.chce_kupic_bilet
