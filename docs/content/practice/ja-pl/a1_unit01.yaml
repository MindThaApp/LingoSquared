templates:
- content_key: practice.ja-pl.pl.a1.unit01.lesson01.choose.001
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ポーランド語の「あなた」には2種類あります。友達や家族には ty、初対面の人や敬意を示したい相手には pan(男性に)または pani(女性に)を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson01.fill.002
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: fill_in_blank
  frame:
    text: Jak się {item} ma? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: pan や pani のときは動詞が ma になります。「男性/女性の方はお元気ですか」と言うような形です。ty のときは masz になります:Jak się masz?
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson01.translate.003
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: pan と pani は入れ替えられません。pan は男性に、pani は女性に呼びかけるときに使い、ty はよく知っている相手に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson01.order.004
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: word_order
  frame:
    text: Jak się {item} ma?
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item} ma?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Jak się ma? は相手の調子をたずねる表現です。pan や pani は真ん中に入り、動詞は ma のままです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson01.translate.005
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: お元気ですか?(友達に、くだけた言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 友達に対しては、質問は masz で終わります。丁寧な言い方では ma に pan または pani を添えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson02.listen.001
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dzień dobry は夕方までの日中ずっと使えるあいさつで、夕方からは dobry wieczór、dobranoc は夜に別れるときだけ言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson02.match.002
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cześć は「こんにちは」にも「さようなら」にもなるくだけた言葉なので、pan や pani ではなく ty の相手に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson02.order.003
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Do {item}!
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Do {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Do widzenia は標準的な「さようなら」で、do zobaczenia はもっと親しみのある「また会いましょう」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson02.fill.004
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: fill_in_blank
  frame:
    text: Dobry {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dobry wieczór は夕方から夜に使い、昼間は dzień dobry と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson02.translate.005
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cześć は「こんにちは」にも「さようなら」にも使えますが、ty で呼ぶ相手にだけ使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson02.translate.006
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: 良い一日を!
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Miłego {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Miłego dnia は願いを表すので、「日」を表す語の語尾が dnia に変わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson03.choose.001
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ポーランド語では動詞の語尾で人称がわかるため、ふつう代名詞は省略します。jestem は「私は~です」、jesteś は「あなたは~です」の意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson03.listen.002
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jestem z + 国名 で出身を、mieszkam w + 都市名 で住んでいる場所を言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson03.translate.003
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 動詞の語尾が人称を表します。「私」は -m(jestem, mieszkam)、くだけた「あなた」は -sz または -ś(masz, jesteś)です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson03.order.004
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: word_order
  frame:
    text: Jestem z {item}, ale mieszkam w Warszawie.
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem z {item}, ale mieszkam w Warszawie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: z(~から)のあとでは、国名の語尾が変わります:Kanady。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson03.fill.005
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: fill_in_blank
  frame:
    text: Czy pan {item} po polsku? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 男性について丁寧にたずねるときは、三人称の動詞の形を使います:Czy pan mówi po polsku?
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson03.translate.006
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: ご出身はどちらですか?(友達に、くだけた言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Skąd {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Skąd は「どこから」という意味です。友達には動詞が jesteś になり、丁寧な言い方は Skąd pan jest? です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit01.lesson03.translate.007
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: お会いできてとてもうれしいです。
    language_code: ja
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo mi {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bardzo mi miło は直訳すると「私にはとても心地よい」で、人に会ったときの決まった返事です。
    language_code: ja
    direction: ltr
