templates:
- content_key: practice.ja-pl.pl.a1.unit03.lesson01.choose.001
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ポーランド語の曜日と月の名前は、小文字で書き始めます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson01.translate.002
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Środa、sobota、niedziela は -a で終わり、ほかの4つの曜日は子音で終わります。この語尾の違いは w + 曜日の表現で重要になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson01.match.003
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Dziś は「今日」という意味で、tygodnia は「週」を表す語の変化した形です。dzień tygodnia のように使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson01.order.004
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: W {item} idę do kina.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: W {item} idę do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: w(〜に)と一緒に使うとき、poniedziałek、czwartek、piątek は形が変わりませんが、wtorek は発音しやすいように we wtorek となります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson01.fill.005
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: fill_in_blank
  frame:
    text: W {item} idę do kina. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Idę do kina は「映画を見に行きます」という意味で、w + 曜日でその曜日に、という意味になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson01.order.006
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: Jaki dziś jest dzień {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki dziś jest dzień {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dzień tygodnia は「曜日」という意味で、2番目の語は語尾が変わって tygodnia になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson02.choose.001
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ポーランド語の月の名前は大文字で書く必要がなく、接頭辞も冠詞もありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson02.listen.002
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 日付を言うときは、日が先に来て -ego で終わり、そのあとに日付用の形の月が続きます。月は通常 -a で終わります(dziesiątego maja)が、2月は lutego です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson02.translate.003
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ポーランド語の月の名前は大文字で書きません。また、urodziny(誕生日)は常に複数形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson02.match.004
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: いくつかの月は -eń で終わり(styczeń、kwiecień、sierpień、wrzesień)、見分けるときの手がかりになります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson02.order.005
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: word_order
  frame:
    text: Spotkanie jest piętnastego {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Spotkanie jest piętnastego {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 日付では、日が -ego で終わり、月は -a の形になります。ただし2月は lutego です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson02.fill.006
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: fill_in_blank
  frame:
    text: Kiedy są twoje {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Urodziny はポーランド語では複数形なので、動詞は jest ではなく są(です)になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson02.translate.007
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
    text: ミーティングはいつですか?
    language_code: ja
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Kiedy jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Kiedy は「いつ」を尋ねる語で、spotkanie のような単数名詞には jest が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson03.choose.001
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Panu と ci はどちらも「あなたに」という意味です。panu は男性に対する丁寧な形で、ci はくだけた形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson03.translate.002
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Możemy は「できる」という動詞の「私たち」の形で、Kiedy możemy się znowu spotkać? のように使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson03.order.003
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: word_order
  frame:
    text: Czy piątek {item} odpowiada?
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy piątek {item} odpowiada?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Odpowiada は、尋ねられる人を与格で取ります。panu(男性に対する丁寧な形)か ci(くだけた形)です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit03.lesson03.fill.004
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: fill_in_blank
  frame:
    text: Kiedy możemy się znowu {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: możemy のあとの2つ目の動詞は、基本の形の spotkać のままです。
    language_code: ja
    direction: ltr
