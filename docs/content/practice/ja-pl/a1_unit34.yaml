schema_version: '1.0'
pack_key: practice.ja-pl.a1.unit34
source_language: ja
target_language: pl
unit_content_key: pl.a1.unit34.poczta
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_adres
    - w_babci
    - w_czasownikiem
    - w_dni
    - w_dokonanym
    - w_dostawy
    - w_dotrze
    - w_dotrzeć
    - w_dziadka
    - w_kupuje
    - w_list
    - w_listu
    - w_oznacza
    - w_paczce
    - w_paczka
    - w_pisać
    - w_pisze
    - w_piszę
    - w_poczcie
    - w_pracownik
    - w_przyszłość
    - w_znaczek
templates:
- content_key: practice.ja-pl.pl.a1.unit34.lesson01.choose.001
  lesson_content_key: pl.a1.unit34.lesson01.list_i_paczka
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_list
        - w_dziadka
        - w_paczka
        - w_babci
        - w_znaczek
        - w_listu
        - w_adres
        - w_pisać
        - w_piszę
        - w_paczce
        - w_dotrzeć
        - w_dotrze
        - w_czasownikiem
        - w_dokonanym
        - w_oznacza
        - w_przyszłość
        - w_dostawy
        - w_dni
        - w_pracownik
        - w_kupuje
        - w_poczcie
        - w_pisze
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、手紙と小包のレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit34.lesson02.listen.001
  lesson_content_key: pl.a1.unit34.lesson02.znaczek_adres_i_pisanie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、切手・住所・書くことのレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit34.lesson03.translate.001
  lesson_content_key: pl.a1.unit34.lesson03.dotarcie_i_czas_przesylki
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は、着くことと時間がかかることのレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit34.lesson04.match.001
  lesson_content_key: pl.a1.unit34.lesson04.na_poczcie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのポーランド語の単語に合う日本語の意味を結びましょう。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
