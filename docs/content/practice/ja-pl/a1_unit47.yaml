schema_version: '1.0'
pack_key: practice.ja-pl.a1.unit47
source_language: ja
target_language: pl
unit_content_key: pl.a1.unit47.restauracja
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_kanapka
    - w_menu
    - w_napoje
    - w_picia
    - w_restauracji
    - w_serem
    - w_smaczny
    - w_wybrała
    - w_zamówić
    - w_zjeść
templates:
- content_key: practice.ja-pl.pl.a1.unit47.lesson01.choose.001
  lesson_content_key: pl.a1.unit47.lesson01.chce_isc_do_restauracji
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_restauracji
        - w_zjeść
        - w_menu
        - w_zamówić
        - w_smaczny
        - w_wybrała
        - w_picia
        - w_napoje
        - w_kanapka
        - w_serem
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語で、「レストランに行きたいです」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit47.lesson02.listen.001
  lesson_content_key: pl.a1.unit47.lesson02.co_pani_chce_zjesc
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。レッスン「何を召し上がりますか?」で学びます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit47.lesson03.translate.001
  lesson_content_key: pl.a1.unit47.lesson03.czy_moge_prosic_o
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は、このユニットの単語です。「お会計をお願いできますか?」のレッスンで学びます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit47.lesson04.match.001
  lesson_content_key: pl.a1.unit47.lesson04.w_restauracji
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのポーランド語の単語に合う日本語の意味を結びましょう。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
