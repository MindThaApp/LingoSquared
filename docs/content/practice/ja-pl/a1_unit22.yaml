        - w_sms
        - w_wyślę
        - w_oddzwonię
        - w_później
        - w_powiedzieć
        - w_oczywiście
        - w_minut
        - w_fajnie
        - w_dzwonisz
        - w_poszła
        - w_zmiana
        - w_lepiej
        - w_myślałem
        - w_czas
        - w_przeszły
        - w_być
        - w_myśleć
        - w_słyszeć
        - w_dumna
        - w_dużo
        - w_znaczy
        - w_dzwoni
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、「電話するね」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit22.lesson02.listen.001
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、「どちら様ですか？」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit22.lesson03.translate.001
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、「もう一度言ってもらえますか？」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit22.lesson04.match.001
  lesson_content_key: pl.a1.unit22.lesson04.wysylanie_sms_a
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのポーランド語の単語に合う日本語の意味を結びましょう。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit22.lesson05.choose.001
  lesson_content_key: pl.a1.unit22.lesson05.czytanie_rozmowy_sms_owej
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、メッセージのやり取りを読むレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit22.lesson06.translate.001
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、シフトのあとの電話のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: どちら様ですか？Z kim rozmawiam!(直訳：「誰と話していますか？」)は、知らない相手からの電話で使う決まった言い方です。kim は z の後に来る造格です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: もう一度言ってもらえますか？Możesz(~できますか、móc の形)+ 不定詞 powtórzyć(繰り返す)+ to(それ)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: そんなに速く話さないでください。Nie mów は否定の命令形(話さないで)で、tak szybko は「そんなに速く」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: よく聞こえません。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: よく聞こえません。Nie słyszę cię dobrze は聞こえにくいことを伝える言い方です。cię は ty の対格で、dobrze は「よく」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 最初のシフトはどうでしたか？Jak ci poszła ...?(直訳：「~はあなたにとってどう進みましたか？」)は、すでに起きたことについて尋ねる言い方です。Ci は ty の与格で、poszła は女性名詞 zmiana に合わせた形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 彼の最初のシフトはとてもうまくいきました。Jego(彼の)は形が変わらず、名詞の前に置きます：jego pierwsza zmiana。女性名詞でも形は変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: 思っていたよりずっとうまくいきました。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 思っていたよりずっとうまくいきました。Poszło は iść の過去形に語尾 -o(「それは」、ここでは「~という結果になる」)が付いた形で、myślałem は男性が話すときの myśleć(思う)の過去形です。
    language_code: ja
    direction: ltr
