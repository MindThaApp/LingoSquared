      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_dzwonić
        - w_muszę
        - w_zadzwonię
        - w_rozmawiam
        - w_rozmawia
        - w_powtórzyć
        - w_mów
        - w_szybko
