      direction: ltr
  feedback_frame:
    text: 短い答えでは名詞を繰り返さなくてもかまいませんが、完全な文では目的語の形 muzykę が必要です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit13.lesson01.translate.008
  lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
  type: translation
  frame:
    text: 音楽は好きですか?(友達に、ty を使って。czy で始めます)
    language_code: ja
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy lubisz {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 文頭の czy は、平叙文をはい・いいえの質問に変えます。
    language_code: ja
