  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 目的語の形 muzykę と基本形 muzyka は、同じ名詞の二つの形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit13.lesson02.choose.001
