templates:
- content_key: practice.ja-pl.pl.a1.unit06.lesson01.choose.001
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ポーランド語の名詞にはすべて性があります。chleb と ser は男性、kawa、herbata、woda は女性、masło と mleko は中性です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson01.listen.002
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ポーランド語には冠詞がないので、chleb は「パン」の意味にも「そのパン」の意味にもなります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson01.order.003
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: word_order
  frame:
    text: Proszę o {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę o {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: proszę o の後では、-a で終わる女性名詞は -ę に変わります(kawa → kawę)。chleb や mleko のような男性名詞・中性名詞は変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson01.fill.004
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
