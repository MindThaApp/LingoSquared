    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 動詞の語尾が人称を表します。「私」は -ę(lubię)、「彼・彼女」は -i(lubi)です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson02.order.003
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: word_order
  frame:
    text: Lubię {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: lubię の後では、好きなものは目的語の形になります。zupa は zupę になり、sok、chleb、ser は変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson02.fill.004
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
