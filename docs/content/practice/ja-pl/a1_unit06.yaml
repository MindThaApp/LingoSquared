  frame:
    text: スープが好きです。
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: -a で終わる女性名詞は、目的語になると -ę になります。そのため zupa は zupę になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson02.translate.006
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: lubię と lubi の組み合わせが、人称ごとに語尾が変わるパターンを示しています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson03.listen.001
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Polecać は lubić と同じように活用します。polecam は「私はすすめます」、poleca は「彼・彼女はすすめます」、pan や pani と一緒なら「あなたはすすめます」の意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson03.match.002
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Co pan poleca? では「彼・彼女」の形 poleca を使います。pan と pani には三人称の動詞が付くからです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson03.order.003
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: word_order
  frame:
    text: Polecam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Polecam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Polecam も、lubię と同じように、名詞は目的語の形になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson03.fill.004
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: fill_in_blank
  frame:
    text: Już {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ウェイターは給仕する本人なので、「私」の形 podaję で話します。
    language_code: ja
    direction: ltr
