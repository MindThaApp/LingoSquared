  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
