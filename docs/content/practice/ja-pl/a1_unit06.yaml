    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Proszę o に目的語の形を続けると、何かを頼むときの丁寧な言い方になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson01.translate.005
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
