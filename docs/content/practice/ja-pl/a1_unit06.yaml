  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Masło と mleko は中性名詞に典型的な -o で終わります。一方、chleb と ser は子音で終わり、男性名詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson02.choose.001
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lubić は辞書の形です。lubię は自分のこと、lubi は他の人のことを言うときの形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson02.match.002
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
