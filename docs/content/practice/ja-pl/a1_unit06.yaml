  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę o {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: proszę o の後の名詞は目的語の形になります。woda は wodę になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson01.translate.006
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
