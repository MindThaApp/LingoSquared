    slot: item
  feedback_frame:
    text: Lubi は「彼・彼女」の形なので、代名詞 on と一緒に使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson02.translate.005
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
