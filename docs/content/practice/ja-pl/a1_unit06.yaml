  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: translation
  frame:
    text: おすすめは何ですか？(男性に対して、丁寧な言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Co pan {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: pan や pani と一緒のときは、動詞は poleca になります。「彼・彼女」と同じ形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit06.lesson03.translate.006
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
