schema_version: '1.0'
pack_key: practice.ja-pl.a1.unit23
source_language: ja
target_language: pl
unit_content_key: pl.a1.unit23.pieniadze
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_dania
    - w_dwie
    - w_dzisiaj
    - w_gotówką
    - w_główne
    - w_kartą
    - w_kawy
    - w_osobno
    - w_podzielimy
    - w_podzielić
    - w_pomogłaś
    - w_pomysł
    - w_poprosimy
    - w_potrzebuję
    - w_płaci
    - w_płacić
    - w_płacę
    - w_reszta
    - w_reszty
    - w_strony
    - w_sumie
    - w_zapłacono
templates:
- content_key: practice.ja-pl.pl.a1.unit23.lesson01.choose.001
  lesson_content_key: pl.a1.unit23.lesson01.ile_to_kosztuje_w
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_sumie
        - w_płacić
        - w_kartą
        - w_gotówką
        - w_płacę
        - w_podzielimy
        - w_osobno
        - w_podzielić
        - w_reszta
        - w_potrzebuję
        - w_reszty
        - w_dania
        - w_główne
        - w_dwie
        - w_kawy
        - w_zapłacono
        - w_poprosimy
        - w_pomysł
        - w_dzisiaj
        - w_pomogłaś
        - w_strony
        - w_płaci
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、このユニットの単語で、「合計でいくら？」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson02.listen.001
  lesson_content_key: pl.a1.unit23.lesson02.karta_czy_gotowka
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、このユニットの単語で、「カードか現金か」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson03.translate.001
  lesson_content_key: pl.a1.unit23.lesson03.dzielenie_rachunku
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は、このユニットの単語で、「割り勘にする」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson04.match.001
  lesson_content_key: pl.a1.unit23.lesson04.reszta
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのポーランド語の単語に合う日本語の意味を結びましょう。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson05.choose.001
  lesson_content_key: pl.a1.unit23.lesson05.czytanie_rachunku_z_restauracji
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、このユニットの単語で、「レストランのレシートを読む」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson06.translate.001
  lesson_content_key: pl.a1.unit23.lesson06.ewa_i_marek_placa
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}は、エヴァとマレクが会計をするレッスンに出てくる、このユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson01.order.002
  lesson_content_key: pl.a1.unit23.lesson01.ile_to_kosztuje_w
  type: word_order
  frame:
    text: Ile to kosztuje w {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_sumie
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to kosztuje w {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 合計でいくらですか？ W sumie(合計で)を付けると、1品の値段ではなく、全部を合わせた金額を知りたいことがはっきりします。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson02.order.002
  lesson_content_key: pl.a1.unit23.lesson02.karta_czy_gotowka
  type: word_order
  frame:
    text: Czy mogę tu zapłacić {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_kartą
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy mogę tu zapłacić {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ここでカードで払えますか？ kartą は「カードで」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson02.fill.003
  lesson_content_key: pl.a1.unit23.lesson02.karta_czy_gotowka
  type: fill_in_blank
  frame:
    text: Czy chce pan zapłacić {item}, czy kartą? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_gotówką
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_gotówką
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 現金でお支払いになりますか、カードにしますか？ Czy chce pan ...? は Czy chcesz ...? の丁寧な形で、ここでは初対面のレジ係が使っています(男性には pan、女性には pani)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson03.order.002
  lesson_content_key: pl.a1.unit23.lesson03.dzielenie_rachunku
  type: word_order
  frame:
    text: Może {item} rachunek?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_podzielimy
  answer_derivation:
    kind: render_frame
    frame:
      text: Może {item} rachunek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 会計を割り勘にしませんか？ podzielimy は「分けましょう」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson03.fill.003
  lesson_content_key: pl.a1.unit23.lesson03.dzielenie_rachunku
  type: fill_in_blank
  frame:
    text: Czy mogę zapłacić {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_osobno
    hint:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_osobno
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 別々に払ってもいいですか？ Osobno(別々に)は zapłacić(払う・完了体：一回の支払いを済ませること)と一緒に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson04.order.002
  lesson_content_key: pl.a1.unit23.lesson04.reszta
  type: word_order
  frame:
    text: Oto pana {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_reszta
  answer_derivation:
    kind: render_frame
    frame:
      text: Oto pana {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: お釣りです。 reszta は「お釣り」(戻ってくるお金)という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson04.fill.003
  lesson_content_key: pl.a1.unit23.lesson04.reszta
  type: fill_in_blank
  frame:
    text: Nie {item} reszty. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_potrzebuję
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_potrzebuję
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'お釣りはいりません。 Nie potrzebuję + 生格： 否定文では目的語が生格になるので、reszty となります。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson06.order.002
  lesson_content_key: pl.a1.unit23.lesson06.ewa_i_marek_placa
  type: word_order
  frame:
    text: Może {item} o rachunek?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poprosimy
  answer_derivation:
    kind: render_frame
    frame:
      text: Może {item} o rachunek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'お会計をお願いしましょうか？ Poprosić o(~を頼む)の後ろは対格です： o rachunek。Poprosimy は完了体の未来形です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit23.lesson06.fill.003
  lesson_content_key: pl.a1.unit23.lesson06.ewa_i_marek_placa
  type: fill_in_blank
  frame:
    text: Marek {item} rachunek. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_płaci
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_płaci
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: マレクが会計を払います。 Płaci は płacić(払う)の on/ona/ono の形です。
    language_code: ja
    direction: ltr
