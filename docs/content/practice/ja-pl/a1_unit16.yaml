  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chory は男性形、chora は女性形です。形によって誰が病気かがわかります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit16.lesson02.match.003
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
