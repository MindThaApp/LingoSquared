  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ポーランド語では「頭が私に痛い」と言います。体の部位が主語で、mnie は痛みを感じる人を表します。
    language_code: ja
    direction: ltr
