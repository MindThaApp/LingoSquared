    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mnie と cię は ja と ty の目的語の形です。「私に痛い」「あなたに痛い」となります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit16.lesson01.order.004
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: word_order
  frame:
    text: Gardło {item} boli.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Gardło {item} boli.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mnie は「私に」という意味です。Gardło mnie boli は、直訳すると「喉が私に痛い」となります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit16.lesson01.fill.005
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: fill_in_blank
  frame:
    text: Co cię {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Boli は三人称単数(彼・彼女・それ)の形です。疑問詞 Co は痛いもののことです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit16.lesson01.translate.006
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: translation
  frame:
    text: 喉が痛いです。(喉から始めてください)
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gardło mnie {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gardło は中性名詞の単数なので、動詞は boli になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit16.lesson01.translate.007
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: translation
  frame:
    text: どこが痛いの？(友達に、ty を使って)
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Co {item} boli?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Cię は ty の短い目的語の形です。
    language_code: ja
    direction: ltr
