  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Boli は痛いものが一つのとき、bolą は複数のときに使います。だから zęby には bolą を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit16.lesson01.listen.002
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
