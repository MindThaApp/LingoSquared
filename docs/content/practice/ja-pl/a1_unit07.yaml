templates:
- content_key: practice.ja-pl.pl.a1.unit07.lesson01.choose.001
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 動詞 kosztować では副詞を使います。kosztuje tanio(安い)、kosztuje drogo(高い)のように言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson01.listen.002
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cebula は -a で終わるので女性名詞です。banan、pomidor、ogórek、ziemniak は男性名詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson01.order.003
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: word_order
  frame:
    text: Ile kosztuje {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile kosztuje は1つのものの値段を尋ねるので、名詞は基本の単数形のままです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson01.fill.004
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: fill_in_blank
  frame:
    text: Banany {item} tanio. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 動詞は数に合わせて変わります。1つなら kosztuje、2つ以上なら kosztują です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson01.translate.005
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: バナナは安いです。(「値段がする」という意味の動詞を使う)
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Banan kosztuje {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: ポーランド語では、別の形容詞を使わず、「バナナは安く値段がする」という言い方をします。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson01.translate.006
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kosztować は辞書に載っている形で、文の中では kosztuje や kosztują になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson02.choose.001
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pół は「半分」の意味で、kilo の前に置きます。pół kilo は半キロです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson02.listen.002
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poproszę は、注文や買い物のときに使う丁寧な依頼の表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson02.match.003
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: kilo や pół kilo のあとでは、名詞は複数形の語尾 -ów になります。banan は bananów、pomidor は pomidorów になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson02.order.004
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: word_order
  frame:
    text: Poproszę kilo {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Poproszę kilo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: kilo のような量を表す語のあとでは、名詞は複数属格になります。これらの語では語尾が -ów になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson02.fill.005
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: fill_in_blank
  frame:
    text: Poproszę pół {item} bananów. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pół kilo は半キロの意味です。ここでは kilo 自体は変化しません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson02.translate.006
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: translation
  frame:
    text: トマトを1キロください。
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Poproszę kilo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Pomidor は kilo のあとで pomidorów に変わります。名詞が量を表す語のあとに来るためです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson02.translate.007
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mandarynka と pomarańcza は女性名詞で、grejpfrut は男性名詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson03.choose.001
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Świeże は「新鮮な」の複数形なので、pomidory や banany に合います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson03.match.002
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Pomidory は pomidor の複数形なので、形容詞は świeże になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson03.fill.003
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: fill_in_blank
  frame:
    text: Pomidory są {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: pomidory のような複数の名詞には複数形の形容詞が必要なので、「新鮮な」は świeże になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson03.fill.004
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: fill_in_blank
  frame:
    text: To {item} pani. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dla は「〜のために」の意味で、そのあとに、何かを受け取る人が来ます。ここでは pani です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit07.lesson03.translate.005
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Razem は、市場での合計金額のように、値段を足し合わせるときに使います。
    language_code: ja
    direction: ltr
