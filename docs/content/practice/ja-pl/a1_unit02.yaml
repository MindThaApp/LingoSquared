templates:
- content_key: practice.ja-pl.pl.a1.unit02.lesson01.choose.001
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ポーランド語の1から10までの数には、互いを結ぶ規則性がないので、一つずつ覚える必要があります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson01.listen.002
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ポーランド語の sz は「シュ」、cz は「チ」に近い音で、sześć と cztery はその音で始まります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson01.translate.003
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: pięć、sześć、dziewięć、dziesięć の語末の ć は「チ」に近いやわらかい音です。綴りでは記号を忘れないようにしましょう。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson01.match.004
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Pięć、sześć、dziewięć、dziesięć は文字 ć で終わりますが、siedem と osiem は違うので、綴りに注意が必要です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson01.order.005
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: word_order
  frame:
    text: Mam {item} lat.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} lat.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mam + 数 + lat で年齢を言います。例：Mam trzydzieści lat.
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson02.listen.001
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ile は「いくら」「いくつ」をたずねる言葉で、kosztuje は値段をたずねるときに組み合わせる動詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson02.choose.002
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: jedenaście、dwanaście、piętnaście のような11〜19の数は -naście で終わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson02.translate.003
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ile は、値段には「いくら」、数えられるものには「いくつ」「何個」の意味で使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson02.order.004
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: To kosztuje {item} złotych.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje {item} złotych.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: pięć、dwanaście、trzydzieści などの後ろには złotych が続き、dwa、trzy、cztery の後ろには złote が続きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson02.fill.005
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: To kosztuje dwadzieścia {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Złotych は pięć、dwadzieścia、pięćdziesiąt などの数の後に使う形で、dwa、trzy、cztery の後ろは złote になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson02.translate.006
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: これはいくらですか？
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile to kosztuje? は値段をたずねる標準的な質問で、to は「これ」「それ」を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson03.choose.001
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pana は男性に対する丁寧な「あなたの」(pana numer)、twój はくだけた「あなたの」(twój numer)です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson03.translate.002
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Numer telefonu は直訳すると「電話の番号」で、2語目は「電話」を表す語が変化した形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson03.order.003
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: Jaki jest {item} numer telefonu?
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest {item} numer telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój はくだけた「あなたの」、pana は男性に対する丁寧な「あなたの」で、numer telefonu の前にはどちらも使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson03.fill.004
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: Ile masz {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lat は pięć、dwadzieścia、trzydzieści などの後ろに、lata は dwa、trzy、cztery やそれで終わる数の後ろに付きます。例：trzydzieści dwa lata.
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson03.translate.005
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: 私は32歳です。
    language_code: ja
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam trzydzieści dwa {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 数が dwa で終わるので、「歳」は lat ではなく lata になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-pl.pl.a1.unit02.lesson03.translate.006
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: あなたの電話番号は何ですか。(くだけた言い方。jest を使う)
    language_code: ja
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest twój {item} telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój はくだけた「あなたの」で、男性に対する丁寧な言い方は Jaki jest pana numer telefonu? です。
    language_code: ja
    direction: ltr
