- content_key: practice.ar-fa.fa.a1.unit53.lesson04.match.004
  lesson_content_key: fa.a1.unit53.lesson04.concert_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fa
    direction: rtl
  slots:
    first: &id001
      language_code: fa
      part_of_speech:
      - noun
      - proper_noun
      - phrase
      agreement_tags:
        semantic:
        - concert_word
        - person_name
        - reviewed_phrase
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
