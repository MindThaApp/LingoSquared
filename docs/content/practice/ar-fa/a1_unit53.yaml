- content_key: practice.ar-fa.fa.a1.unit53.lesson01.order.003
  lesson_content_key: fa.a1.unit53.lesson01.new_concert_one
  type: word_order
  frame:
    text: این {item} خوبه.
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags:
        semantic: concert_word
  answer_derivation:
    kind: render_frame
    frame:
      text: این {item} خوبه.
      language_code: fa
      direction: rtl
  feedback_frame:
    text: التركيب این ... خوبه يعني «هذا ... جيد»، وهو النمط الذي يستخدمه حوار هذه الوحدة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fa.fa.a1.unit53.lesson06.order.003
  lesson_content_key: fa.a1.unit53.lesson06.wrap_up
  type: word_order
  frame:
    text: '{item} چطور بود؟ باحال بود!'
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: fa
      part_of_speech: noun
      agreement_tags:
        semantic: concert_word
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} چطور بود؟ باحال بود!'
      language_code: fa
      direction: rtl
  feedback_frame:
    text: السؤال چطور بود؟ يعني «كيف كان؟»، والجواب باحال بود يعني «كان رائعًا»، وهذا نمط ختام هذه الوحدة.
    language_code: ar
    direction: rtl
