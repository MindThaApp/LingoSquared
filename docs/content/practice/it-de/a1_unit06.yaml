  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Wer ist {item} Vater?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Vater è maschile, quindi il "Suo" formale è Ihr, non Ihre.
    language_code: it
    direction: ltr
- content_key: practice.it-de.de.a1.unit06.lesson03.translate.016
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
