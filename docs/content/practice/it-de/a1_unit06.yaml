  frame:
    text: Questa è mia madre.
    language_code: it
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Das ist {item} Mutter.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Mutter è femminile, quindi "mia" diventa meine.
    language_code: it
    direction: ltr
- content_key: practice.it-de.de.a1.unit06.lesson04.translate.017
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: translation
  frame:
    text: Ha dei fratelli? (formale)
    language_code: it
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Haben Sie {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Brüder è il plurale di Bruder, con la dieresi (Umlaut).
    language_code: it
    direction: ltr
- content_key: practice.it-de.de.a1.unit06.lesson03.translate.018
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: No, non ho fratelli né sorelle.
    language_code: it
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Nein, ich habe {item} Geschwister.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Keine si usa davanti ai nomi plurali e ai nomi femminili per dire "nessuno/a" o "non... alcun/a".
    language_code: it
    direction: ltr
