  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bitte significa sia «per favore» sia «prego», ed Entschuldigung serve per attirare l'attenzione di qualcuno o per scusarsi.
    language_code: it
    direction: ltr
- content_key: practice.it-de.de.a1.unit01.lesson03.order.002
