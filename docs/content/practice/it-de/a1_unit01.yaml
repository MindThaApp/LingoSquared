    slot: item
  feedback_frame:
    text: Tschüss è il saluto di congedo informale; Auf Wiedersehen è quello cortese per gli sconosciuti e le situazioni formali.
    language_code: it
    direction: ltr
- content_key: practice.it-de.de.a1.unit01.lesson03.choose.001
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
