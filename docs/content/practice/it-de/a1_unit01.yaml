    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Il tedesco ha due parole per «tu/Lei»: Sie è la forma di cortesia (sconosciuti, autorità), du è informale (amici, famiglia, bambini).'
    language_code: it
    direction: ltr
- content_key: practice.it-de.de.a1.unit01.lesson04.listen.001
