    - family_singular
    - sibling
    - extended_only
    - extended_family_member
    - possessive_pronoun
    - possessive_flexible
    - family_profile
    - family_dialogue
    - person_name
    - place_name
    - city_name
    - country
    register:
    - informal
    - polite
slot_presets:
  family_singular: &id001
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: family_singular
  sibling: &id002
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: sibling
  extended_only: &id003
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: extended_only
  possessive_flexible: &id004
    language_code: nl
    part_of_speech: pronoun
    agreement_tags:
      semantic: possessive_flexible
  person_name: &id005
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  place_name: &id006
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: place_name
  city_name: &id007
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: city_name
