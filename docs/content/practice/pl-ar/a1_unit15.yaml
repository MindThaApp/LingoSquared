templates:
- content_key: practice.pl-ar.ar.a1.unit15.lesson01.choose.001
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكبر, أصغر i أقرب to stopnie wyższe; po każdym następuje من („niż”).
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit15.lesson01.listen.002
