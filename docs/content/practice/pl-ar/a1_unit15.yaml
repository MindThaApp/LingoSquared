  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أقرب znaczy „bliższy, bliżej” i pochodzi od idei bliskości; po nim następuje من.
