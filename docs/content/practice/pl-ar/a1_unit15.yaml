  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Stopień wyższy przymiotnika ma jedną formę, po której następuje من: أقرب من to „bliżej niż”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit15.lesson01.order.003
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: السوق {item} من المقهى.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: السوق {item} من المقهى.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Stopień wyższy stoi między dwiema porównywanymi rzeczami, a من („niż”) stoi przed drugą z nich.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit15.lesson01.order.004
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: المقهى {item} من السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Arabski nie potrzebuje słowa „jest”: المقهى أصغر من السوق to dosłownie „kawiarnia mniejsza niż targ”.'
    language_code: pl
    direction: ltr
