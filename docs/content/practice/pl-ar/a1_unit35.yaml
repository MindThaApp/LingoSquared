      agreement_tags:
        semantic: w_مذكر
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Paczka jest rodzaju męskiego, więc mówimy يصل (yaṣil). List jest rodzaju żeńskiego, więc mówimy تصل (taṣil). Czasownik w czasie teraźniejszym zaczyna się od ي dla podmiotu rodzaju męskiego i od ت dla żeńskiego, jak w الطرد يصل (aṭ-ṭard yaṣil) i الرسالة تصل.
    language_code: pl
    direction: ltr
