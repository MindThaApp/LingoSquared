    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Końcówka ـك znaczy „twój/twoja”: عائلتك to „twoja rodzina”, a أختك to „twoja siostra”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit06.lesson02.order.004
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: word_order
  frame:
    text: من في {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: من في {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من في عائلتك؟ pyta, kto jest w twojej rodzinie; يا يوسف to zwrot do Yusufa.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit06.lesson02.fill.005
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: ما {item} أختك؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اسم znaczy „imię”; ما اسم أختك؟ pyta: jak ma na imię twoja siostra?'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit06.lesson02.fill.006
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: عندي أب {item} وأخت. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و („i”) pisze się łącznie z następnym słowem, więc „i matka” to وأم.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit06.lesson02.translate.007
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اسمها to اسم plus ـها, co daje „jej imię”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit06.lesson02.translate.008
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: 'Layla pyta Yusufa: Jak ma na imię twoja siostra?'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: ما اسم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أختك pisze się tak samo, niezależnie od tego, czy słucha mężczyzna, czy kobieta; tutaj zwracamy się do Yusufa.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit06.lesson02.translate.009
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: Ma na imię Nour.
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمها {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: اسمها to „imię” plus ـها („jej”), więc osobne słowo „jest” nie jest potrzebne.
    language_code: pl
    direction: ltr
