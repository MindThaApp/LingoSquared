    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عائلة znaczy „rodzina”; to samo słowo z końcówką dzierżawczą, عائلتك, pojawi się w następnej lekcji.
    language_code: pl
    direction: ltr
