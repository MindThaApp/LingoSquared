    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أخت to siostra; jej odpowiednik w rodzaju męskim to أخ.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit06.lesson01.translate.006
  lesson_content_key: ar.a1.unit06.lesson01.family_members
