    slot: item
  feedback_frame:
    text: أب to ojciec, a أم to matka; عندي to jedno słowo oznaczające „mam”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit06.lesson01.listen.002
