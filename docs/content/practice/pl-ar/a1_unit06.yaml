  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'عندي + rzeczownik znaczy „mam…”: عندي أخت to „mam siostrę”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit06.lesson01.fill.005
  lesson_content_key: ar.a1.unit06.lesson01.family_members
