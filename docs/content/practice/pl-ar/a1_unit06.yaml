    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عندي zawiera w jednym słowie znaczenie „mam”; nazwy krewnych to أب, أم, أخ i أخت.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit06.lesson01.order.004
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: word_order
