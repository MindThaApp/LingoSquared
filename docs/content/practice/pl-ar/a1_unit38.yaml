      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Słowo „kolor” jest rodzaju męskiego, więc następujący po nim kolor też jest rodzaju męskiego: „Chcę kolor różowy”. أريد (urīd) znaczy „chcę” lub „chciałbym”. Porównaj: الورود وردية („róże są różowe”): liczba mnoga rzeczy łączy się z przymiotnikiem w rodzaju żeńskim liczby pojedynczej.'
    language_code: pl
    direction: ltr
