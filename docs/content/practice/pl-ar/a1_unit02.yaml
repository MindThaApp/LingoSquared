      text: أنا من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من znaczy „z”, więc أنا من i nazwa miejsca mówią, skąd pochodzisz.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit02.lesson02.fill.004
  lesson_content_key: ar.a1.unit02.lesson02.where_from
