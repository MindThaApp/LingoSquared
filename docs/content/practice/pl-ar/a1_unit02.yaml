  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Nazwy krajów takie jak لبنان i مصر nie mają rodzajnika, ale الأردن, المغرب i العراق zawierają ال jako część nazwy.
    language_code: pl
    direction: ltr
