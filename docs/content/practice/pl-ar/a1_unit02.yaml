    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أين to pytanie „gdzie”; من أين أنت pyta „skąd jesteś”, zarówno mężczyznę, jak i kobietę.
    language_code: pl
    direction: ltr
