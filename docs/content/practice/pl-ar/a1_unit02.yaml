    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Słowo أنت znaczy „ty”; zapisane bez samogłosek jest takie samo dla mężczyzny i kobiety.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit02.lesson02.translate.006
  lesson_content_key: ar.a1.unit02.lesson02.where_from
