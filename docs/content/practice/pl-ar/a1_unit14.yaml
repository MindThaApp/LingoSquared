    frame:
      text: ماذا {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Przedrostek ت oznacza „ty”; ماذا تفضل؟ pyta mężczyznę, co woli.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit14.lesson02.order.004
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
