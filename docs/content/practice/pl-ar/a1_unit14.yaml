    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تفضل znaczy „wolisz” (do mężczyzny): ماذا تفضل يا يوسف؟'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit14.lesson02.order.003
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
