  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أفضل znaczy „wolę”; تفضل z przedrostkiem ت to forma „ty” w rodzaju męskim.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit14.lesson02.listen.002
