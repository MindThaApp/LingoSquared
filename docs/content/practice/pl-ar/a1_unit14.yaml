    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أحب znaczy „lubię”, a أفضل „wolę”; ولا („i nie”) łączy zdanie przeczące z poprzednim.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit14.lesson01.order.004
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'To, co lubimy, następuje po أحب, z ال dla ogólnego rodzaju: أحب القهوة to „lubię kawę”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit14.lesson01.order.005
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: لا أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: لا أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'لا przed czasownikiem go neguje: لا أحب to „nie lubię”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit14.lesson01.fill.006
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أحب القهوة {item} أحب الشاي. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ولا łączy zdanie przeczące: lubię kawę i nie lubię herbaty.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit14.lesson01.fill.007
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أنا {item} الماء. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dla podkreślenia można dodać أنا („ja”), ale samo أحب już znaczy „lubię”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit14.lesson01.translate.008
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: شاي to „herbata” bez rodzajnika, a الماء to „woda” z ال; أحب znaczy „lubię”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit14.lesson01.translate.009
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: Lubię wodę. (osobnego słowa na „ja” nie ma)
    language_code: pl
    direction: ltr
  slots:
    a: *id005
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Po أحب arabski używa ال dla rzeczy ogólnie, więc „lubię wodę” to أحب الماء.
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit14.lesson01.translate.010
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: To jest herbata.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Bez ال شاي znaczy po prostu „herbata”, a arabski nie potrzebuje słowa „jest”: هذا شاي.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-ar.ar.a1.unit14.lesson02.choose.001
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: multiple_choice
