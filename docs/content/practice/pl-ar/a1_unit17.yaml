      text: عندي {a}. {b} {c}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Zarówno عندي, jak i أحتاج zawierają w swojej formie „ja”, więc أنا nie jest potrzebne.
    language_code: pl
    direction: ltr
