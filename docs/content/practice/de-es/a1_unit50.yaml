  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_tomamos
        - w_tomar
        - w_cine
        - w_proponer
        - w_actividad
        - w_ganas
        - w_plan
        - w_breve
        - w_rechazo
        - w_quedar
        - w_quedamos
        - w_cita
        - w_viene
        - w_invitación
        - w_idiomas
        - w_saludo
        - w_puede
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} gehört zum Wortschatz dieser Einheit, und zwar aus der Lektion über Vorschläge für eine Aktivität.'
    language_code: de
    direction: ltr
