templates:
- content_key: practice.de-es.es.a1.unit01.lesson01.choose.001
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Im Spanischen gibt es zwei Anredeformen: tú verwendet man bei Freunden und in der Familie, usted bei Fremden und als Zeichen des Respekts.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson01.fill.002
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: fill_in_blank
  frame:
    text: ¿Cómo está {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Está gehört zu usted; bei tú lautet die Verbform estás: ¿Cómo estás?'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson01.translate.003
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Spanische Begrüßungen und Wörter für kurze Gespräche tragen häufig Akzente (cómo, adiós, también); der Akzent kennzeichnet die betonte Silbe.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson02.listen.001
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buenos días verwendet man bis zum Mittagessen (in Spanien etwa bis 14 Uhr), buenas tardes am Nachmittag und buenas noches am Abend und in der Nacht.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson02.match.002
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Día ist maskulin (buenos días), während tarde und noche feminin sind (buenas tardes, buenas noches).
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson02.order.003
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Adiós, hasta {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Adiós, hasta {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Hasta luego bedeutet wörtlich bis später und ist die alltägliche Form für „Bis später“.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson03.order.001
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Hola, me llamo {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Hola, me llamo {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Me llamo bedeutet wörtlich ich nenne mich und ist die übliche Art, seinen Namen zu nennen.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson03.translate.002
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: translation
  frame:
    text: Das ist {name}. (Vorstellung eines Mannes)
    language_code: de
    direction: ltr
    slot_rendering:
      name: token
  slots:
    name: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Este es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Verwenden Sie este, um einen Mann vorzustellen, und esta, um eine Frau vorzustellen: Esta es Ana.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson03.order.003
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Esta es {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Esta es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Mit Esta stellt man eine Frau vor; bei einem Mann sagt man este: Este es Carlos.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson03.fill.004
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: fill_in_blank
  frame:
    text: Mucho {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mucho gusto bedeutet „Freut mich“; die übliche Antwort lautet igualmente, gleichfalls.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson04.order.001
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: word_order
  frame:
    text: Soy de {place}, pero vivo en Londres.
    language_code: es
    direction: ltr
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}, pero vivo en Londres.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ser de + Ort gibt an, woher man kommt; vivir en + Ort gibt an, wo man jetzt lebt.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson04.translate.002
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: translation
  frame:
    text: Ich komme aus {place}.
    language_code: de
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'So stellen Sie dieselbe Frage: ¿De dónde eres? (informell) oder ¿De dónde es usted? (formell).'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson04.fill.003
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: fill_in_blank
  frame:
    text: Todavía estoy {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Estoy + -ando/-iendo beschreibt etwas, das gerade im Gange ist, etwa: Ich lerne noch.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson05.order.001
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: word_order
  frame:
    text: Sí, es mi primera {item} aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, es mi primera {item} aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Vez bezeichnet ein Mal im Sinne einer Gelegenheit: primera vez, erstes Mal; otra vez, noch einmal.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson05.translate.002
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: translation
  frame:
    text: Kochst du gern? (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Te gusta {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Im Spanischen drückt man mit gustar aus, was man mag: Die Tätigkeit gefällt einem, daher verwendet man te gusta + Infinitiv.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson06.listen.001
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Elena und Mateo verwenden miteinander tú, weil sie gleichgestellt sind und denselben Kochkurs besuchen.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit01.lesson06.translate.002
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Im Spanischen lässt man Subjektpronomen weg, wenn die Verbendung bereits die Person erkennen lässt: vivo bedeutet ich lebe.'
    language_code: de
    direction: ltr
