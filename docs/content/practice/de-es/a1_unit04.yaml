templates:
- content_key: practice.de-es.es.a1.unit04.lesson01.choose.001
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Spanische Wochentage werden kleingeschrieben und sind männlich: el lunes, los martes.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson01.listen.002
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lunes bis viernes enden auf -s und bleiben im Plural unverändert; sábado und domingo erhalten ein zusätzliches -s: los sábados.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson01.order.003
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: word_order
  frame:
    text: Hoy es {day}.
    language_code: es
    direction: ltr
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy es {day}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Nach hoy es steht der Wochentag ohne Artikel; für „dienstags“ verwenden Sie los: los martes.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson01.translate.004
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: translation
  frame:
    text: Heute ist {day}.
    language_code: de
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy es {day}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Denken Sie an die Kleinschreibung: hoy es lunes, niemals Lunes.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson02.match.001
  lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Auch Monate werden im Spanischen kleingeschrieben: enero, julio, diciembre.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson02.translate.002
  lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Viele Monatsnamen ähneln den deutschen: marzo, abril, septiembre, octubre.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson02.order.003
  lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
  type: word_order
  frame:
    text: Mi cumpleaños es en {month}.
    language_code: es
    direction: ltr
  slots:
    month: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi cumpleaños es en {month}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Verwenden Sie en bei einem Monat (en marzo), aber el bei einem vollständigen Datum (el diez de marzo).
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson03.fill.001
  lesson_content_key: es.a1.unit04.lesson03.preguntar_y_decir_la_fecha
  type: fill_in_blank
  frame:
    text: ¿Qué {item} es hoy? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Spanische Datumsangaben folgen dem Muster Tag, de, Monat: el veintidós de julio.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson03.translate.002
  lesson_content_key: es.a1.unit04.lesson03.preguntar_y_decir_la_fecha
  type: translation
  frame:
    text: Heute ist der zweiundzwanzigste Juli.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy es el {item} de julio.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Im Spanischen werden für Datumsangaben Grundzahlen statt Ordnungszahlen verwendet: el veintidós bedeutet „der Zweiundzwanzigste“.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson05.choose.001
  lesson_content_key: es.a1.unit04.lesson05.leer_el_horario_del_taller
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Hay bedeutet sowohl „es gibt“ im Singular als auch „es gibt“ im Plural: hay una clase, hay dos clases.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson05.fill.002
  lesson_content_key: es.a1.unit04.lesson05.leer_el_horario_del_taller
  type: fill_in_blank
  frame:
    text: Después hay una clase el {item} de julio. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Die Zahlen von einundzwanzig bis neunundzwanzig werden als ein Wort geschrieben: veintiuno, veintidós, veintinueve.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson06.listen.001
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Por cierto, „übrigens“, ist eine praktische Wendung, um das Thema zu wechseln.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson06.translate.002
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cumpleaños ist ein Wort und hat im Singular und Plural dieselbe Form: el cumpleaños, los cumpleaños.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson06.translate.003
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: translation
  frame:
    text: Und deiner? (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Y el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: El tuyo steht für tu cumpleaños, ein männliches Substantiv; bei einem weiblichen Substantiv heißt es la tuya.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit04.lesson06.match.004
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mit ¿Cuándo es...? fragt man, wann etwas stattfindet; die Antwort beginnt mit es el + Datum oder es en + Monat.
    language_code: de
    direction: ltr
