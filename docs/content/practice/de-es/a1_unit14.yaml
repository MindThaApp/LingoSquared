- content_key: practice.de-es.es.a1.unit14.lesson02.order.001
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: word_order
  frame:
    text: Quiero {item} un apartamento cerca del parque.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero {item} un apartamento cerca del parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ich möchte eine Wohnung in der Nähe des Parks mieten. Querer + Infinitiv drückt aus, was man tun möchte.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit14.lesson02.fill.002
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: fill_in_blank
  frame:
    text: Hay un apartamento {item} en este edificio. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Desocupado beschreibt eine Wohnung, in der gerade niemand wohnt; es steht nach dem Nomen.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit14.lesson03.translate.001
  lesson_content_key: es.a1.unit14.lesson03.cuantos_dormitorios_tiene
