  frame:
    text: Wie viele Schlafzimmer hat sie?
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuántos {item} tiene?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Cuántos richtet sich nach einem maskulinen Plural; bei einem femininen Nomen heißt es cuántas.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit14.lesson05.fill.001
  lesson_content_key: es.a1.unit14.lesson05.leer_el_anuncio
