    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alguien bedeutet „jemand“; das Gegenteil ist nadie, „niemand“.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit14.lesson06.order.001
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: word_order
  frame:
    text: Voy a llamar a la {item} hoy mismo.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Voy a llamar a la {item} hoy mismo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Ich werde heute die Agentur anrufen. Hoy mismo betont: noch am heutigen Tag.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit14.lesson06.translate.002
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
