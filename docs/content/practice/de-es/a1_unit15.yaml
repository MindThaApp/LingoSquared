templates:
- content_key: practice.de-es.es.a1.unit15.lesson02.order.001
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: word_order
  frame:
    text: El apartamento nuevo es más grande que el {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: El apartamento nuevo es más grande que el {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Die neue Wohnung ist größer als die alte. Más + Adjektiv + que vergleicht zwei Dinge.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit15.lesson02.choose.002
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Im Spanischen vergleicht man mit más ... que (mehr als), menos ... que (weniger als) und tan ... como (so ... wie).
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit15.lesson04.translate.001
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: translation
  frame:
    text: Wir sind ein gutes Team.
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Somos un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Bueno wird vor einem männlichen Substantiv im Singular zu buen verkürzt: un buen equipo.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit15.lesson04.listen.002
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tan bien como bedeutet genauso gut wie: cocinas tan bien como yo.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit15.lesson05.fill.001
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: fill_in_blank
  frame:
    text: El apartamento nuevo tiene más {item} para cocinar. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Más vor einem Substantiv bedeutet mehr davon: más espacio, mehr Platz.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit15.lesson05.match.002
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mudarse heißt umziehen; Mateo sagt quiero mudarme, weil er selbst umzieht.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit15.lesson06.order.001
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: word_order
  frame:
    text: El viejo es más pequeño. Por eso quiero {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: El viejo es más pequeño. Por eso quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Die alte ist kleiner. Deshalb möchte ich umziehen. Por eso bedeutet deshalb.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit15.lesson06.translate.002
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Viejo bedeutet alt bei Dingen und Personen; nuevo ist das Gegenteil.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit15.lesson06.fill.003
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: fill_in_blank
  frame:
    text: Tú {item} tan bien como yo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tan + Adverb + como vergleicht zwei Personen, die etwas gleich gut tun.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit15.lesson06.translate.004
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: Das ergibt sehr viel Sinn.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Tiene mucho {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Im Spanischen sagt man wörtlich, es habe viel Sinn: tiene mucho sentido.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit15.lesson06.choose.005
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '¡Exacto! ist eine schnelle Art zuzustimmen: genau.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit15.lesson05.translate.003
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Espacio ist Platz oder Raum; más espacio para cocinar, mehr Platz zum Kochen.
    language_code: de
    direction: ltr
