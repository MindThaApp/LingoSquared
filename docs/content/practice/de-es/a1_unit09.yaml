templates:
- content_key: practice.de-es.es.a1.unit09.lesson01.order.001
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: word_order
  frame:
    text: Cruza la {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Cruza la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Überquere die Straße. Cruza ist die tú-Befehlsform von cruzar.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit09.lesson01.fill.002
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: fill_in_blank
  frame:
    text: Dobla a la izquierda en la {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: En la esquina bedeutet an der Ecke; im Spanischen steht hier en.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit09.lesson02.choose.001
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Doblar und girar bedeuten beide abbiegen; dobla und gira sind die jeweiligen tú-Befehlsformen.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit09.lesson02.order.002
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: word_order
  frame:
    text: Gira a la {item} en la esquina.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gira a la {item} en la esquina.
      language_code: es
      direction: ltr
  feedback_frame:
    text: A la izquierda bedeutet nach links und a la derecha nach rechts; derecho allein bedeutet geradeaus.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit09.lesson02.translate.003
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: translation
  frame:
    text: Geh geradeaus. (informelle Befehlsform)
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Sigue {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Sigue kommt von seguir, weitergehen; derecho, geradeaus, ist nicht derecha, rechts.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit09.lesson03.order.001
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: word_order
  frame:
    text: ¿Cómo {item} a la biblioteca?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo {item} a la biblioteca?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Wie komme ich zur Bibliothek? Bei einem männlichen Ort verschmelzen a + el zu al: ¿Cómo llego al parque?'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit09.lesson03.fill.002
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: fill_in_blank
  frame:
    text: 'Es muy {item}: sigue derecho. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fácil hat bei männlichen und weiblichen Substantiven dieselbe Form.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit09.lesson04.translate.001
  lesson_content_key: es.a1.unit09.lesson04.confirmar_direcciones
  type: translation
  frame:
    text: Verirr dich nicht! (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡No te {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Bei verneinten Befehlen wird eine andere Verbform verwendet: pierdas, nicht pierdes.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit09.lesson05.match.001
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Wegbeschreibungen werden auf Spanisch üblicherweise mit tú-Befehlsformen gegeben: sigue, dobla, cruza.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit09.lesson05.translate.002
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Desde el mercado bedeutet vom Markt aus, dem Ausgangspunkt des Weges.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit09.lesson06.listen.001
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mateo wiederholt den Weg in der yo-Form, sigo und doblo, um sich zu vergewissern, dass er alles richtig verstanden hat.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit09.lesson06.translate.002
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: translation
  frame:
    text: Gern geschehen.
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: De {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De nada bedeutet wörtlich für nichts; es ist die übliche Antwort auf gracias.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit09.lesson01.listen.003
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Derecha (rechts) und derecho (geradeaus) unterscheiden sich nur im letzten Vokal; achten Sie beim Hören darauf.
    language_code: de
    direction: ltr
