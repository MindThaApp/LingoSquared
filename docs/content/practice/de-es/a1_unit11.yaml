templates:
- content_key: practice.de-es.es.a1.unit11.lesson01.choose.001
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Für „Hose“ verwendet man im Spanischen oft den Singular el pantalón (auch: los pantalones).'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit11.lesson01.listen.002
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Camisa und chaqueta sind feminin; pantalón, delantal und zapatos sind maskulin.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit11.lesson01.translate.003
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Nomen auf -l bekommen im Plural die Endung -es: delantal, delantales.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit11.lesson02.order.001
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: word_order
  frame:
    text: Uso la talla {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Uso la talla {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ich trage Größe M. Für die Größe, die man trägt, verwendet das Spanische usar („benutzen“).
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit11.lesson02.fill.002
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: fill_in_blank
  frame:
    text: ¿Qué {item} usas? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Talla ist die Kleidergröße; die Schuhgröße heißt stattdessen el número: ¿Qué número tienes?'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit11.lesson02.translate.003
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: translation
  frame:
    text: Es passt mir schlecht.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Mit quedar bien oder mal sagt man, wie Kleidung sitzt: me queda bien, es passt mir gut.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit11.lesson04.order.001
  lesson_content_key: es.a1.unit11.lesson04.decidir_comprar
  type: word_order
  frame:
    text: Me queda bien. Voy a {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda bien. Voy a {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Ir a + Infinitiv drückt einen Plan aus: voy a comprarlo, ich werde es kaufen. Das lo, „es“, wird an das Ende des Infinitivs angehängt.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit11.lesson05.match.001
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Uso, usas und usan kommen alle von usar: ich trage, du trägst, sie tragen.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit11.lesson05.fill.002
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: fill_in_blank
  frame:
    text: 'El delantal es más {item}: solo cuesta doce. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Más + Adjektiv bildet einen Komparativ: más barato, billiger.'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit11.lesson06.order.001
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: word_order
  frame:
    text: Sí, buscamos {item} para el taller.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, buscamos {item} para el taller.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ja, wir suchen Schürzen für den Workshop. Buscar bedeutet schon „suchen“, daher braucht buscamos delantales kein zusätzliches Wort.
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit11.lesson06.choose.002
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Der Verkäufer bietet mit ¿Los ayudo? Hilfe an: Kann ich Ihnen (mehreren Personen) helfen?'
    language_code: de
    direction: ltr
- content_key: practice.de-es.es.a1.unit11.lesson06.translate.003
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Voy kommt von ir, „gehen“; das Verb ist unregelmäßig: voy, vas, va.'
    language_code: de
    direction: ltr
