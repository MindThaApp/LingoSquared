    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: پسوند ـي یعنی «من» (اسمي) و ـك یعنی «تو» (اسمك)؛ شکل نوشتاری «تو» برای مرد و زن یکی است.
    language_code: prs
    direction: rtl
