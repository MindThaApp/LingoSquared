templates:
- content_key: practice.prs-ar.ar.a1.unit02.lesson01.listen.001
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'در عربی مالکیت با یک پسوند نشان داده می‌شود: اسم یعنی نام، اسمي یعنی نام من و اسمك یعنی نام تو.'
    language_code: prs
    direction: rtl
