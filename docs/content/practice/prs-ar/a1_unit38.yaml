- content_key: practice.prs-ar.ar.a1.unit38.lesson03.order.002
  lesson_content_key: ar.a1.unit38.lesson03.wrdy_wbnfsjy
  type: word_order
  frame:
    text: كلمة اللون {item}، فنقول أريد اللون الوردي.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكرة
  answer_derivation:
    kind: render_frame
    frame:
      text: كلمة اللون {item}، فنقول أريد اللون الوردي.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'کلمهٔ رنگ مذکر است، پس رنگی که بعد از آن می‌آید هم مذکر است: رنگ گلابی را می‌خواهم. أريد (urīd) یعنی می‌خواهم یا دوست دارم. مقایسه کنید: الورود وردية (گل‌ها گلابی اند): جمع چیزها صفت مفرد مؤنث می‌گیرد.'
    language_code: prs
    direction: rtl
