    text: الطرد مذکر است، پس می‌گوییم يصل (yaṣil). الرسالة مؤنث است، پس می‌گوییم تصل (taṣil). فعل زمان حال برای فاعل مذکر با ي و برای فاعل مؤنث با ت شروع می‌شود، مثل الطرد يصل (aṭ-ṭard yaṣil) و الرسالة تصل.
