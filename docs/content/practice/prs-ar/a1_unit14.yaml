  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: translation
  frame:
    text: یوسف، تو چه چیز را ترجیح می‌دهی؟
    language_code: prs
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} يا يوسف
      language_code: ar
      direction: rtl
  feedback_frame:
    text: یوسف مرد است، پس شکل «تو» تفضل است.
    language_code: prs
    direction: rtl
