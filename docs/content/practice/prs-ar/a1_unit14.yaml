templates:
- content_key: practice.prs-ar.ar.a1.unit14.lesson01.choose.001
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحب فعل «دوست دارم» است؛ چیزی که دوست داری مستقیماً بعد از آن می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson01.listen.002
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'ولا از و (و) به‌علاوهٔ لا (نه) ساخته شده است: «و نه».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson01.match.003
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أحب یعنی «دوست دارم» و أفضل یعنی «ترجیح می‌دهم»؛ ولا (و نه) جملهٔ منفی را به جملهٔ پیشین وصل می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson01.order.004
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'چیزی که دوست داری بعد از أحب می‌آید، با ال برای نوع عمومی: أحب القهوة یعنی «قهوه را دوست دارم».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson01.order.005
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: لا أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: لا أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'لا پیش از فعل آن را منفی می‌کند: لا أحب یعنی «دوست ندارم».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson01.fill.006
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أحب القهوة {item} أحب الشاي. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ولا جملهٔ منفی را وصل می‌کند: من قهوه را دوست دارم و چای را دوست ندارم.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson01.fill.007
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أنا {item} الماء. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنا (من) را می‌شود برای تأکید آورد، اما أحب به‌تنهایی هم «دوست دارم» معنا می‌دهد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson01.translate.008
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: شاي بدون ال فقط «چای» است، اما الماء با ال «آب» به‌صورت عمومی است؛ أحب یعنی «دوست دارم».
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson01.translate.009
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: من آب را دوست دارم. (برای «من» کلمهٔ جداگانه نیست)
    language_code: prs
    direction: rtl
  slots:
    a: *id005
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: عربی بعد از أحب برای چیزِ عمومی ال می‌آورد، پس «من آب را دوست دارم» می‌شود أحب الماء.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson01.translate.010
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: این چای است.
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'بدون ال، شاي فقط «چای» است و عربی برای «است» کلمه‌ای نمی‌خواهد: هذا شاي.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson02.choose.001
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أفضل یعنی «ترجیح می‌دهم»؛ تفضل با پیشوند ت شکل مذکر «تو» است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson02.listen.002
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تفضل یعنی «ترجیح می‌دهی»، خطاب به یک مرد: ماذا تفضل يا يوسف؟'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson02.order.003
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
    text: ماذا {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: پیشوند ت «تو» را نشان می‌دهد؛ ماذا تفضل؟ از یک مرد می‌پرسد که چه چیز را ترجیح می‌دهد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson02.order.004
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
    text: أفضل {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أفضل {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'بعد از أفضل چیزی که ترجیح داده می‌شود با ال می‌آید: أفضل القهوة.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson02.fill.005
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: fill_in_blank
  frame:
    text: أنا {item} القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أفضل یعنی «ترجیح می‌دهم»؛ پیشوند أ «من» را نشان می‌دهد، مثل أحب و أريد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ar.ar.a1.unit14.lesson02.translate.006
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أفضل یعنی «ترجیح می‌دهم» و تفضل یعنی «ترجیح می‌دهی» (مذکر)؛ پیشوند أ یا ت نشان می‌دهد چه کسی.
    language_code: prs
    direction: rtl
