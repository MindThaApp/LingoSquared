    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'نام روزهای هفته در روسی با حرف بزرگ نوشته نمی‌شود: понедельник، вторник، среда.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson01.order.004
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: word_order
  frame:
    text: Сегодня {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: در روسی فعل «بودن» در زمان حال حذف می‌شود؛ پس Сегодня суббота فقط «امروز» به‌اضافهٔ نام روز است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson01.fill.005
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: fill_in_blank
  frame:
    text: Какой {item} день? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Какой با день که مذکر است هماهنگ می‌شود؛ برای همین بعداً در سؤال تاریخ، какое با число که خنثی است می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson01.translate.006
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: نام روزهای هفته در روسی حرف بزرگ نمی‌گیرد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson01.translate.007
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: امروز چه روزی است؟
    language_code: fa
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Какой {item} день?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Какой сегодня день? روز هفته را می‌پرسد؛ برای تاریخ می‌پرسید Какое сегодня число?
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson02.choose.001
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تاریخ از یک عدد ترتیبیِ خنثی و ماه در حالت اضافی ساخته می‌شود: десятое апреля یعنی دهم آوریل.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson02.order.002
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: عدد ترتیبی خنثی است (первое، третье)، چون با کلمهٔ نهفتهٔ число، یعنی تاریخ، هماهنگ می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson02.order.003
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня десятое {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня десятое {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'بعد از روز، ماه به حالت اضافی می‌رود: десятое января، десятое апреля، десятое октября.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson02.fill.004
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: fill_in_blank
  frame:
    text: Какое сегодня {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Число خنثی است، برای همین در سؤال какое می‌آید؛ ولی день مذکر است و какой می‌گیرد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson02.translate.005
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: عددهای ترتیبی در تاریخ به -ое یا -ье ختم می‌شوند، چون با число که خنثی است هماهنگ‌اند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson02.translate.006
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: تاریخ امروز چنده؟
    language_code: fa
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Какое сегодня {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Какое сегодня число? در اصل می‌پرسد امروز چندم است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson02.translate.007
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: امروز سوم ژانویه است.
    language_code: fa
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'برای گفتن «سوم ژانویه» اول عدد ترتیبی می‌آید و بعد ماه در حالت اضافی: третье января.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson03.fill.001
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: fill_in_blank
  frame:
    text: Встреча {item} вторник. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قبل از вторник حرف اضافهٔ в به во تبدیل می‌شود (во вторник)؛ قبل از بیشتر روزهای دیگر فقط в می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson03.choose.002
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Встреча во вторник, девятого января اول روز هفته را می‌گوید و بعد تاریخ را، با ماه در حالت اضافی.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson03.order.003
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: word_order
  frame:
    text: Встреча во вторник, {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча во вторник, {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'در تاریخ، عدد ترتیبی девятого هم به حالت اضافی می‌رود: девятого января یعنی در نهم ژانویه.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit04.lesson03.translate.004
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: translation
  frame:
    text: جلسه روز سه‌شنبه است.
    language_code: fa
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча {item} вторник.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Во вторник یعنی «روز سه‌شنبه»؛ во شکل بلندتر в است که اینجا به کار می‌رود.
    language_code: fa
    direction: rtl
