    frame:
      text: Я хочу пойти на концерт {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: دلم می‌خواهد به کنسرت گروه بروم، لطفاً. группы یعنی «گروه» در حالت اضافه.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit51.lesson02.order.002
  lesson_content_key: ru.a1.unit51.lesson02.ya_khochu_kupit_bilet
  type: word_order
  frame:
    text: У меня хорошее {item}.
