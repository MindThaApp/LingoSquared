    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit51.lesson04.order.002
  lesson_content_key: ru.a1.unit51.lesson04.v_kasse
  type: word_order
  frame:
    text: Да, мне нужен билет на {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_группу
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нужен билет на {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بله، یک بلیت برای گروه می‌خواهم، لطفاً. группу یعنی «گروه» (شکل مفعولی، بعد از «на» به معنی «برای»).
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit51.lesson06.order.002
  lesson_content_key: ru.a1.unit51.lesson06.dima_nina_i_nastya
