  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های این درس است، از درس دیما، نینا و ناستیا در کنسرت.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit51.lesson01.order.002
  lesson_content_key: ru.a1.unit51.lesson01.ya_khochu_poyti_na
  type: word_order
  frame:
    text: Я хочу пойти на концерт {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_группы
  answer_derivation:
