    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این درس است، از بخش «کنسرت ساعت چند شروع می‌شه؟».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit51.lesson04.match.001
  lesson_content_key: ru.a1.unit51.lesson04.v_kasse
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر کلمهٔ روسی را به معنی فارسی‌اش وصل کنید؛ کلمه‌ها از درس‌های همین بخش هستند.
    language_code: fa
    direction: rtl
