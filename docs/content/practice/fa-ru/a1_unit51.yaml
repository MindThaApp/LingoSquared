  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_место
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня хорошее {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: جای خوبی دارم. место یعنی جا، صندلی.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit51.lesson03.order.002
  lesson_content_key: ru.a1.unit51.lesson03.vo_skolko_nachinaetsya_kontsert
  type: word_order
  frame:
    text: Концерт {item} два часа.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_длится
  answer_derivation:
    kind: render_frame
    frame:
      text: Концерт {item} два часа.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: کنسرت دو ساعت طول می‌کشد. длится یعنی طول می‌کشد.
