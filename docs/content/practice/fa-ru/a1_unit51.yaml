  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_большая
    - w_группа
    - w_группу
    - w_группы
    - w_длится
    - w_длиться
    - w_довольна
    - w_место
    - w_начало
    - w_потрясающий
    - w_публика
    - w_странники
    - w_сцена
    - w_хорошее
templates:
- content_key: practice.fa-ru.ru.a1.unit51.lesson01.choose.001
  lesson_content_key: ru.a1.unit51.lesson01.ya_khochu_poyti_na
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_группа
        - w_группы
        - w_место
        - w_хорошее
        - w_длиться
        - w_длится
        - w_группу
        - w_сцена
        - w_большая
        - w_публика
        - w_довольна
        - w_странники
        - w_начало
        - w_потрясающий
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این درس است، از بخش «می‌خوام برم کنسرت».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit51.lesson02.listen.001
