templates:
- content_key: practice.fa-ru.ru.a1.unit06.lesson01.choose.001
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: «Мой» با اسم‌های مذکر (мой отец) و «моя» با اسم‌های مؤنث (моя мать) می‌آد، پس صفت ملکی با کلمه‌ی خانوادگی عوض می‌شه.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson01.match.002
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: «У меня есть» تحت‌اللفظی یعنی «پیش من هست» و روش روسی گفتن «دارم» است؛ «мой» و «моя» هر دو یعنی «مال من».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson01.fill.003
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: Это {item} мать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «Мать» مؤنث است، برای همین با آن «моя» می‌آید؛ «отец» مذکر است و «мой» می‌گیرد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson01.fill.004
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: fill_in_blank
  frame:
    text: У меня {item} сестра. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «У меня есть» به‌اضافهٔ یک اسم، روش معمول برای گفتن «من فلان چیز را دارم» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson01.translate.005
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: این پدر من است.
    language_code: fa
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {item} отец.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Отец» مذکر است، برای همین صفت ملکی «мой» می‌شود؛ با «мать» که مؤنث است، «моя» می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson01.translate.006
  lesson_content_key: ru.a1.unit06.lesson01.blizkaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اسم‌های خانوادگی در روسی جنسیت دستوری دارند: «мать» و «сестра» مؤنث‌اند و «отец» مذکر است.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson02.choose.001
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '«Дедушка» به خاطر پایانهٔ «-а» مؤنث به نظر می‌رسد، ولی مذکر است و «мой» می‌گیرد: «мой дедушка».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson02.order.002
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
    text: Это моя {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Это моя {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Бабушка»، «жена» و «дочь» همه مؤنث‌اند، برای همین هرکدام «моя» می‌گیرند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson02.order.003
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: word_order
  frame:
    text: Это мой {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Это мой {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Дедушка»، «муж» و «сын» همه مذکرند، برای همین هرکدام «мой» می‌گیرند، حتی با اینکه «дедушка» به «-а» ختم می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson02.fill.004
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: fill_in_blank
  frame:
    text: У меня есть сын и {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: حرف ربط «и» دو اسم را به هم وصل می‌کند، مثل «сын и дочь» یعنی پسر و دختر.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson02.translate.005
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: بچه دارید؟ (رسمی)
    language_code: fa
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Дети» همیشه جمع است؛ «У вас есть ...?» شکل رسمی پرسیدن این است که کسی چیزی دارد یا نه.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson02.translate.006
  lesson_content_key: ru.a1.unit06.lesson02.rasshirennaya_semya
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: در روسی برای هر یک از اقوام یک واژهٔ جدا وجود دارد و معادلی برای «یک» یا «این» به‌عنوان حرف تعریف لازم نیست.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson03.choose.001
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: «Эта» شکل مؤنثِ «این» است، برای همین با «девочка» می‌آید؛ شکل مذکر آن «этот» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson03.order.002
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: word_order
  frame:
    text: А кто {item} девочка?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Эта» با اسم مؤنث «девочка» هماهنگ می‌شود، ولی «Кто это?» از «это» که خنثی است استفاده می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson03.fill.003
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: fill_in_blank
  frame:
    text: Кто это на {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «Фото» هیچ‌وقت پایانه‌اش عوض نمی‌شود، برای همین در «На фото» هم «фото» می‌ماند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson03.translate.004
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: این توی عکس کیست؟
    language_code: fa
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Кто это на {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Кто это?» یعنی «این کیست؟»؛ «На фото» یعنی «توی عکس».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson03.translate.005
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: و این دختر کیست؟
    language_code: fa
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: А кто {item} девочка?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «А» در ابتدای سؤال آن را به حرف قبلی وصل می‌کند، مثل «و» یا «خب» در فارسی.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit06.lesson03.translate.006
  lesson_content_key: ru.a1.unit06.lesson03.semeynoe_foto
  type: translation
  frame:
    text: اسم من اولگا است.
    language_code: fa
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Меня зовут» به‌اضافهٔ اسم کوچک، روشی است که روس‌ها خودشان را معرفی می‌کنند.
    language_code: fa
    direction: rtl
