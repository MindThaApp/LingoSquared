templates:
- content_key: practice.fa-ru.ru.a1.unit02.lesson01.choose.001
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'روسی برای «شما/تو» دو کلمه دارد: «ты» برای دوستان، خانواده، بچه‌ها و هم‌سن‌وسال‌ها، و «вы» برای غریبه‌ها، کسانی که باید احترامشان را نگه داشت، یا چند نفر.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson01.order.002
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Как {item} зовут?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Как вас зовут?» شکل رسمیِ «اسمتان چیست؟» است؛ تحت‌اللفظی می‌پرسد «شما را چه صدا می‌زنند؟»
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson01.order.003
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Меня зовут {name}.
    language_code: ru
    direction: ltr
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Меня зовут» تحت‌اللفظی یعنی «مرا صدا می‌زنند»، برای همین اسمی که بعدش می‌آید به همان شکل ساده می‌ماند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson01.fill.004
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: fill_in_blank
  frame:
    text: Меня {item} Виктор. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '«зовут» هم در سؤال و هم در جواب هست: «Как вас зовут?» و «Меня зовут Виктор.»'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson01.translate.005
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: اسم من {name} است.
    language_code: fa
    direction: rtl
    slot_rendering:
      name: english_gloss
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: روس‌ها خودشان را با «Меня зовут» و یک اسم کوچک معرفی می‌کنند؛ اضافه کردن اسم پدر، مثل «Ирина Петровна»، رسمی‌تر است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson01.translate.006
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: اسمتان چیست؟ (رسمی)
    language_code: fa
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «вас» شکل رسمیِ «вы» است که در این سؤال به کار رفته؛ با دوست می‌پرسید «Как тебя зовут?»
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson02.choose.001
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '«Откуда вы?» می‌پرسد اهل کجا هستید، و جواب با «из» و نام مکان می‌آید: «Я из Канады»، «Я из Москвы».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson02.listen.002
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: «Можно на ты?» مؤدبانه می‌خواهد از «вы» به «ты» برویم؛ طبق عرف، آدم بزرگ‌تر یا مسئول‌تر این پیشنهاد را می‌دهد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson02.match.003
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: «Ты» برای کسانی است که خوب می‌شناسیدشان و «вы» برای ارتباط رسمی؛ پس انتخاب بین این دو بخشی از هر گفت‌وگوست.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson02.order.004
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: word_order
  frame:
    text: Я из {place}.
    language_code: ru
    direction: ltr
  slots:
    place: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Я из {place}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بعد از «из» حالت اضافی (родительный) می‌آید؛ پس «Канада» می‌شود «Канады» و «Москва» می‌شود «Москвы».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson02.fill.005
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: fill_in_blank
  frame:
    text: Давайте перейдём на {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «Давайте перейдём на ты» پیشنهاد کنار گذاشتن تعارف است؛ خود پیشنهاد با «давайте» هنوز مؤدبانه گفته می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson02.translate.006
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «Меня» شکل مفعولیِ «я» است؛ برای همین در جواب اسم می‌گوییم «Меня зовут»، تحت‌اللفظی «مرا صدا می‌زنند».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson02.translate.007
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: اهل کجا هستید؟ (رسمی)
    language_code: fa
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Откуда {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Откуда» یعنی «از کجا»؛ سؤال رسمی با «вы» است و جواب با «из» و نام مکان می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson03.fill.001
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: fill_in_blank
  frame:
    text: Очень {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «Очень приятно» تحت‌اللفظی یعنی «خیلی دل‌پذیر» و جواب معمول بعد از شنیدن اسم کسی است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson03.order.002
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: word_order
  frame:
    text: Давайте {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Давайте {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '«Давайте» به‌همراه شکل «ما»ی یک فعل، پیشنهاد مؤدبانه می‌سازد: «Давайте познакомимся» یعنی «بیایید آشنا شویم.»'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson03.listen.003
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: «Давайте познакомимся» راه مؤدبانه‌ای برای شروع معرفی با کسی است که با «вы» خطابش می‌کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit02.lesson03.translate.004
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: translation
  frame:
    text: خوشبختم.
    language_code: fa
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Очень приятно» هم با «ты» و هم با «вы» کار می‌کند، چون مستقیم طرف مقابل را خطاب نمی‌کند.
    language_code: fa
    direction: rtl
