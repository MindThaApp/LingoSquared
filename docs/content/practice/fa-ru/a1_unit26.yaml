      text: Лена высокая, а Игорь {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'لنا قدبلنده و ایگور کوتاه‌قده. دو جمله با а (در حالی که، ولی) کنار هم قرار می‌گیرن: Лена высокая, а Игорь невысокий.'
    language_code: fa
    direction: rtl
