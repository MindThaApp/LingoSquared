    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: «Полкило» یعنی نیم کیلو و یک‌کلمه نوشته می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson01.translate.005
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: translation
  frame:
    text: شیر چنده؟
    language_code: fa
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Стоит» با یک چیز، یعنی «молоко»، می‌آید؛ برای چند چیز در روسی «стоят» به کار می‌رود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson01.translate.006
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: translation
  frame:
    text: نون صد روبل است.
    language_code: fa
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Хлеб стоит {item} рублей.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بعد از «сто» به کلمه‌ای برای «یک» نیازی نیست؛ اسمِ بعدی «рублей» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson02.choose.001
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: «Дайте» شکل مؤدبانهٔ امر با «вы» و به معنی «بدید» است؛ با «ты» می‌شود «дай».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson02.order.002
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: word_order
  frame:
    text: Дайте {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Килограмм» و «полкило» هر دو مقدار کالا را نشان می‌دهند و مستقیم بعد از «дайте» می‌آیند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson02.fill.003
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: fill_in_blank
  frame:
    text: Дайте одну {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بعد از «дайте» اسم مؤنث «штука» به «штуку» تبدیل می‌شود؛ شکل چیزی که خواسته می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson02.fill.004
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: fill_in_blank
  frame:
    text: Дайте пять {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعد از «пять» و عددهای بزرگ‌تر، اسم جمعِ حالت مضاف‌الیهی می‌گیرد: «пять штук».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson02.translate.005
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: لطفاً نیم کیلو بدید. (رسمی)
    language_code: fa
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Дайте полкило, пожалуйста» روشی مؤدبانه برای خواستن نیم کیلو از فروشنده است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson02.translate.006
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: لطفاً پنج عدد بدید. (رسمی)
    language_code: fa
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте пять {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بعد از عدد پنج، «штука» به «штук» تغییر می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson02.translate.007
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «Штука» چیزها را تک‌تک می‌شمارد، ولی «килограмм» و «полкило» با وزن می‌شمارند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson03.listen.001
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: «Помидоры»، «огурцы» و «апельсины» جمع‌اند؛ «картофель» و «капуста» کلمه‌های مفردی‌اند که معنی «سیب‌زمینی» و «کلم» می‌دهند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson03.order.002
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: word_order
  frame:
    text: У вас есть {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «У вас есть ...?» با هر اسمی کار می‌کند و روش معمول پرسیدن از فروشنده است که فلان چیز را دارد یا نه.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson03.fill.003
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько стоит кило {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بعد از کلمهٔ مقدار مثل «кило»، کالا جمعِ حالت مضاف‌الیهی می‌گیرد؛ پس «яблоки» می‌شود «яблок».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson03.translate.004
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: لطفاً یک کیلو گوجه‌فرنگی بدید. (رسمی)
    language_code: fa
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте килограмм {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'بعد از «килограмм» کالا جمعِ حالت مضاف‌الیهی می‌گیرد: «помидоры» می‌شود «помидоров».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson03.translate.005
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: کلم دارید؟ (رسمی)
    language_code: fa
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Капуста» در روسی مفرد است و کلمه‌ای شبیه «یک» یا «این» جلویش نمی‌آید.
    language_code: fa
    direction: rtl
