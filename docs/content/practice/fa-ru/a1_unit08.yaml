templates:
- content_key: practice.fa-ru.ru.a1.unit08.lesson01.choose.001
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '«Сто» و «двести» عددهای ۱۰۰ و ۲۰۰ هستند؛ اسمِ بعد از آن‌ها جمعِ حالت مضاف‌الیهی است: сто рублей، двести рублей.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson01.order.002
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: word_order
  frame:
    text: Сколько стоит {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: «Сколько стоит?» قیمت یک چیز را می‌پرسد؛ «молоко» اسم مفرد است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson01.fill.003
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: fill_in_blank
  frame:
    text: Хлеб стоит {item} рублей. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعد از «сто»، مثل همهٔ عددها از پنج به بالا، اسم جمعِ حالت مضاف‌الیهی می‌گیرد: «рублей».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit08.lesson01.match.004
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
