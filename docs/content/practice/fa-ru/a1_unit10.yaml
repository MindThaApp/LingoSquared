templates:
- content_key: practice.fa-ru.ru.a1.unit10.lesson01.choose.001
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Идите شکل امری مؤدبانهٔ «вы» به معنی «بروید» است؛ برای «ты» می‌شه иди.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson01.listen.002
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'آدرس‌ها با потом (بعد) پشت سر هم می‌آن: Идите прямо, потом направо.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson01.order.003
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: word_order
  frame:
    text: Как дойти до {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До یعنی «تا» و بعدش حالت مضاف‌الیهی (родительный) می‌آید، برای همین музей می‌شه музея.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson01.fill.004
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: fill_in_blank
  frame:
    text: Идите {item}, потом направо. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прямо یعنی «مستقیم» و آخرش تغییر نمی‌کنه.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson01.translate.005
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: چطور می‌تونم به موزه برسم؟
    language_code: fa
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дойти до ...? می‌پرسه چطور پیاده به جایی برسیم؛ اسم مکان بعد از до در حالت родительный می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson01.translate.006
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: مستقیم برید، بعد به راست. (رسمی)
    language_code: fa
    direction: rtl
  slots:
    a: *id003
    b: *id004
    c: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Идите {a}, {b} {c}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Идите прямо, потом направо الگوی معمول یک آدرس کوتاهه.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson02.choose.001
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Поверните شکل امری مؤدبانهٔ «вы» به معنی «بپیچید» است؛ налево و направо جهت را می‌گن.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson02.order.002
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: word_order
  frame:
    text: Поверните {item} за углом.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Поверните {item} за углом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: هم налево و هم направо بعد از поверните می‌شینن.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson02.fill.003
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Поверните налево за {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'За اینجا حالت «орудный» (instrumental) می‌گیره، برای همین угол می‌شه углом: за углом یعنی «سر پیچ».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson02.fill.004
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Идите два {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعد از ۲ و ۳ و ۴ اسم شکل خاصی می‌گیره: два квартала، ولی пять кварталов.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson02.translate.005
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: از اینجا دوره؟
    language_code: fa
    direction: rtl
  slots:
    a: *id010
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Далеко یعنی «دور» و отсюда یعنی «از اینجا»؛ Это далеко отсюда? سؤال رایجیه.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson02.translate.006
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Квартал یعنی «بلوک شهری» و далеко یعنی «دور».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson03.choose.001
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Простите روش مؤدبانهٔ «вы» برای جلب توجه یک غریبه است، مثل «ببخشید».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson03.order.002
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: word_order
  frame:
    text: Это очень {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Это очень просто یعنی «خیلی ساده‌ست»؛ فعل «بودن» لازم نیست.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson03.fill.003
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: fill_in_blank
  frame:
    text: Нет, пять {item} пешком. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعد از пять اسم به صورت جمع در حالت родительный می‌آید: пять минут.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson03.translate.004
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: خیلی ساده‌ست.
    language_code: fa
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بعد از это، کلمهٔ просто نقش خبر («ساده‌ست») را داره، برای همین فعل «بودن» لازم نیست.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson03.translate.005
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: پنج دقیقه پیاده.
    language_code: fa
    direction: rtl
  slots:
    a: *id015
    b: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Пять {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Пешком یعنی «پیاده» و минут بعد از пять به صورت جمع در حالت родительный می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit10.lesson03.translate.006
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прохожий اسم مذکریه که از یک صفت اومده و یعنی «رهگذر».
    language_code: fa
    direction: rtl
