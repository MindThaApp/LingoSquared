  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_детский
    - w_захватывающий
    - w_начинаться
    - w_новый
    - w_попкорн
    - w_посмотреть
    - w_сеанс
