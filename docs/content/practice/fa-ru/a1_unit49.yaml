  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_смотреть
        - w_посмотреть
        - w_сеанс
        - w_начинаться
        - w_скоро
        - w_новый
        - w_попкорн
        - w_детский
        - w_захватывающий
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های این درس است، از درس «می‌خواهم فیلم ببینم».'
    language_code: fa
    direction: rtl
