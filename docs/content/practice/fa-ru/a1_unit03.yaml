templates:
- content_key: practice.fa-ru.ru.a1.unit03.lesson01.choose.001
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'در روسی اسم بعد از عدد تغییر می‌کند: один рубль، два рубля، пять рублей.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson01.listen.002
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: بعد از ۲ و ۳ و ۴ اسم شکل ویژه‌ای می‌گیرد (два брата، три рубля) و از ۵ به بعد جمع حالت اضافه می‌آید (пять рублей).
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson01.match.003
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: اعداد ۲ تا ۴ اسم را یک جور تغییر می‌دهند (брат می‌شود брата) و اعداد ۵ به بالا یک جور دیگر (книга می‌شود книг).
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson01.order.004
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: word_order
  frame:
    text: У меня {item} брата.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Два، три و четыре همه یک شکل اسم می‌گیرند، یعنی брата، برای همین هر سه اینجا جا می‌افتند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson01.fill.005
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: fill_in_blank
  frame:
    text: Пять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعد از пять و همه‌ی اعداد بالاتر، اسم جمعِ حالت اضافه است: рублей، نه рубль.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson01.translate.006
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: من دو برادر دارم.
    language_code: fa
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня два брата در اصل یعنی «پیش من دو برادر هست»؛ брата شکلی است که بعد از ۲ و ۳ و ۴ می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson01.translate.007
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اول شکل‌های شمارشی را یاد بگیرید (один، два، три، четыре، пять)؛ بعد اسمِ پس از آن‌ها تغییر می‌کند، مثل один рубль، два рубля، пять рублей.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson02.listen.001
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'اعداد ۵ تا ۱۰ همه اسم را به شکل جمع حالت اضافه می‌گیرند: пять книг، девять книг، десять книг.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson02.order.002
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: У меня {item} книг.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} книг.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بعد از اعداد ۵ تا ۱۰ اسم جمعِ حالت اضافه است، برای همین книга می‌شود книг.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson02.order.003
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: Мне {item} лет.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: روس‌ها سن را با мне می‌گویند، در اصل یعنی «به من»، و بعد از ۵ به بالا کلمه‌ی «سال» лет است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson02.fill.004
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: fill_in_blank
  frame:
    text: Мне десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بعد از اعداد پنج به بالا، برای سن лет به شکل جمع حالت اضافه می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson02.translate.005
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: من ده سال دارم.
    language_code: fa
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: سن با мне، یعنی «به من»، به‌علاوه‌ی عدد و лет گفته می‌شود؛ فعل ندارد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson02.translate.006
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: شما چند سال دارید؟ (رسمی)
    language_code: fa
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько {item} лет?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько вам лет? از вам رسمی استفاده می‌کند که در اصل یعنی «به شما»؛ یعنی «چند سال به شما؟».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson03.choose.001
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: روسی برای یک چیز می‌گوید Сколько стоит? و برای چند چیز Сколько стоят?؛ یعنی فعل با چیزی که می‌خرید هماهنگ می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson03.order.002
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: word_order
  frame:
    text: Сколько это {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько это {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько это стоит? سؤال همه‌کاره‌ی «چند است؟» است؛ стоит شکل مخصوص یک چیز است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson03.fill.003
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько {item} яблоки? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Яблоки جمع است، پس فعل стоят می‌شود؛ برای یک چیز (хлеб) стоит می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson03.translate.004
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: نان چند است؟
    language_code: fa
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хлеб یک چیز است، پس فعل стоит می‌شود؛ با яблоки که جمع است، стоят می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit03.lesson03.translate.005
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: سه روبل.
    language_code: fa
    direction: rtl
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: بعد از три اسم شکل ۲ تا ۴ یعنی рубля را می‌گیرد، که با рублей بعد از ۵ به بالا فرق دارد.
    language_code: fa
    direction: rtl
