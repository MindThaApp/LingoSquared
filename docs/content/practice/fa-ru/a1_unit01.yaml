templates:
- content_key: practice.fa-ru.ru.a1.unit01.lesson01.choose.001
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'بعضی حرف‌های سیریلیک شبیه حرف‌های لاتین‌اند ولی صدای دیگری دارند: р صدای «ر» می‌دهد، в صدای «و/و» لبی‌دندانی (V)، у صدای «او» در «دود» و й یک «ی» کوتاه است.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson01.match.002
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'بعضی حرف‌های سیریلیک گول‌زننده‌اند: р شبیه P است ولی «ر» خوانده می‌شود، و е شبیه E است ولی اول کلمه «یه» تلفظ می‌شود؛ здравствуйте هر دو را دارد.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson01.translate.003
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: روسی با خط سیریلیک نوشته می‌شود؛ اولین کلمه‌ای که یاد می‌گیرید، یعنی здравствуйте، از з، д، р، а، в، с، т، у، й و е ساخته شده است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson01.translate.004
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: سلام! (رسمی، یک کلمه)
    language_code: fa
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item}!'
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Здравствуйте سلام رسمی است، برای غریبه‌ها و وقتی با چند نفر هم‌زمان حرف می‌زنید؛ اولین в تلفظ نمی‌شود و کلمه شبیه zdrAstvuyte خوانده می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson02.choose.001
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'احوال‌پرسی‌های روسی به ساعت روز بستگی دارند: доброе утро (صبح)، добрый день (روز)، добрый вечер (عصر). Утро خنثی است و день و вечер مذکرند؛ برای همین پایان صفت عوض می‌شود.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson02.listen.002
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Привет سلام خودمانی برای دوستان و خانواده است؛ با غریبه‌ها از здравствуйте یا سلام مخصوص ساعت روز استفاده کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson02.order.003
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: word_order
  frame:
    text: Добрый {item}!
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Добрый {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Добрый با اسم‌های مذکر مثل день و вечер می‌آید، ولی утро که خنثی است доброе می‌گیرد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson02.fill.004
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: fill_in_blank
  frame:
    text: Доброе {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Утро اسم خنثی است، برای همین در سلام доброе می‌آید، نه добрый.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson02.translate.005
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: در روسی حرف تعریف و نکره وجود ندارد، برای همین جواب یک‌کلمه‌ای فقط خود کلمه است، مثل утро یا завтра.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson02.match.006
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Привет خودمانی است، ولی здравствуйте سلام رسمی برای غریبه‌هاست.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson03.choose.001
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Как дела? سؤال روزمره و معمولاً بین دوستان (ты) است، ولی Как поживаете? به شکل вы است و رسمی‌تر به نظر می‌رسد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson03.listen.002
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Пока خداحافظی خودمانی است، ولی до свидания خداحافظی معمولی یا رسمی است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson03.order.003
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Привет! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Привет! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дела? در اصل می‌پرسد کارها چطور پیش می‌رود؛ بعد از Привет سؤال خودمانی بین دوستان است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson03.order.004
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Здравствуйте! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Здравствуйте! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Поживаете به -ете ختم می‌شود، یعنی شکل вы دارد، برای همین با здравствуйте رسمی جور است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson03.fill.005
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: fill_in_blank
  frame:
    text: Хорошо, {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хорошо, спасибо جواب معمول Как дела? است و یعنی اوضاع خوب است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson03.fill.006
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: fill_in_blank
  frame:
    text: До {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: До یعنی «تا»، پس До завтра! روش رایج گفتن «فردا می‌بینمت» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson03.translate.007
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: translation
  frame:
    text: خوبم، ممنون.
    language_code: fa
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Хорошо, {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хорошо, спасибо جواب مؤدبانه و جاافتادهٔ Как дела? است و هم با ты هم با вы کار می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ru.ru.a1.unit01.lesson03.translate.008
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: translation
  frame:
    text: فردا می‌بینمت.
    language_code: fa
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: До {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До завтра! از до به معنی «تا» و завтра به معنی «فردا» ساخته شده است.
    language_code: fa
    direction: rtl
