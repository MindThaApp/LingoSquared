  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Andiamo, andare का ''हम'' वाला रूप है, जो सुझाव देने के लिए आता है: चलो चलें।'
    language_code: hi
    direction: ltr
