templates:
- content_key: practice.hi-it.it.a1.unit07.lesson01.choose.001
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cosa desidera? बार का कर्मचारी औपचारिक ढंग से यह पूछने के लिए कहता है कि आप क्या लेंगे।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson01.listen.002
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Per favore वह शिष्ट वाक्यांश है जो हर ऑर्डर में जोड़ा जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson01.order.003
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: word_order
  frame:
    text: Vorrei un caffè e un {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Vorrei का अर्थ 'मुझे चाहिए' है और यह ऑर्डर देने का शिष्ट तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson01.fill.004
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: fill_in_blank
  frame:
    text: Vorrei un caffè, per {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Per favore का अर्थ 'कृपया' है और यह अनुरोध के अंत में आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson01.translate.005
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: मुझे एक कॉफ़ी और एक क्रोइसां चाहिए, कृपया।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un cornetto, per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un पुल्लिंग संज्ञाओं, जैसे caffè और cornetto, के साथ आता है; per favore अनुरोध को पूरा करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson01.translate.006
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: आप क्या लेंगे? (औपचारिक, Lei)
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Desidera वेटर द्वारा प्रयुक्त औपचारिक Lei रूप है, अनौपचारिक tu रूप नहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson03.choose.001
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Basta così एक निश्चित वाक्यांश है, जिसका अर्थ है 'बस इतना ही, और नहीं'।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson03.listen.002
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Così का अर्थ 'ऐसे' या 'इतना' है, और basta così में यह ऑर्डर को समाप्त करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson02.fill.001
  lesson_content_key: it.a1.unit07.lesson02.ordinare_al_bar
  type: fill_in_blank
  frame:
    text: Grazie, {item} così. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Basta का अर्थ 'काफ़ी है' है; basta così वेटर को रुकने के लिए कहता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson02.translate.002
  lesson_content_key: it.a1.unit07.lesson02.ordinare_al_bar
  type: translation
  frame:
    text: बस इतना ही, धन्यवाद।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} così, grazie.'
      language_code: it
      direction: ltr
  feedback_frame:
    text: Basta così, grazie ऑर्डर समाप्त करने का शिष्ट तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson03.choose.003
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Un'acqua में एपॉस्ट्रॉफ़ी रहती है, क्योंकि acqua स्त्रीलिंग है और स्वर से शुरू होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson03.listen.004
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Il menù और il conto पुल्लिंग हैं, इसलिए इनके साथ il आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson03.fill.005
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: fill_in_blank
  frame:
    text: Il {item}, per favore. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il conto, per favore बिल माँगने का तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson03.order.006
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: word_order
  frame:
    text: Un panino e {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Un panino e {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Un''acqua स्त्रीलिंग रूप है: स्वर से पहले una बदलकर un'' हो जाता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson03.match.007
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Il panino और il conto पुल्लिंग हैं; l'acqua स्त्रीलिंग है और उसमें स्वर-लोप होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson03.translate.008
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: translation
  frame:
    text: एक सैंडविच और एक पानी, कृपया।
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Un panino e {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Acqua स्त्रीलिंग है, इसलिए 'एक पानी' una acqua होता है, जो छोटा होकर un'acqua बन जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson03.translate.009
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: translation
  frame:
    text: बिल, कृपया।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Il {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Il conto वह बिल है जो आप अंत में माँगते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit07.lesson03.translate.010
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'इतालवी संज्ञाओं के साथ आर्टिकल आता है: il panino, l''acqua, il menù, il conto।'
    language_code: hi
    direction: ltr
