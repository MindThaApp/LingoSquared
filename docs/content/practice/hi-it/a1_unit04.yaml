  feedback_frame:
    text: Arrivo का अर्थ है "मैं पहुँचता हूँ" और arrivi का "तुम पहुँचते हो" (अनौपचारिक); अंत का -i तुम को दर्शाता है।
    language_code: hi
    direction: ltr
