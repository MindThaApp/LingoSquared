    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: सोमवार से शुक्रवार तक के नाम -dì पर समाप्त होते हैं, जो dies यानी दिन से आया है; sabato और domenica ऐसे नहीं हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit04.lesson01.translate.006
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
