      language_code: it
      direction: ltr
  feedback_frame:
    text: 'इस तरह प्रयोग होने वाले सप्ताह के दिनों के साथ इतालवी में आर्टिकल नहीं आता: Oggi è lunedì, Oggi è il lunedì नहीं।'
    language_code: hi
    direction: ltr
