    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Oggi का अर्थ आज है; domani का अर्थ कल है, और वही प्रश्न दोनों के लिए चलता है।
    language_code: hi
    direction: ltr
