- content_key: practice.hi-it.it.a1.unit04.lesson01.choose.001
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: इतालवी में सप्ताह के दिनों के नाम छोटे अक्षरों में लिखे जाते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit04.lesson01.listen.002
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Martedì और mercoledì में अंतिम अक्षर पर लिखित उच्चारण-चिह्न होता है, और उसी अक्षर पर बल पड़ता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit04.lesson01.order.003
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: word_order
  frame:
    text: Che {item} è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} è oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che giorno è oggi? सप्ताह का दिन पूछता है; तारीख पूछने के लिए Che data è oggi? कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit04.lesson01.fill.004
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
