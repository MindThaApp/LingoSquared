- content_key: practice.hi-it.it.a1.unit13.lesson01.choose.001
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
