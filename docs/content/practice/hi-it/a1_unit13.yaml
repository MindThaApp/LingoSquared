    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono {item} al cinema ieri.
      language_code: it
      direction: ltr
  feedback_frame:
    text: पुरुष sono andato कहता है, महिला sono andata।
    language_code: hi
    direction: ltr
