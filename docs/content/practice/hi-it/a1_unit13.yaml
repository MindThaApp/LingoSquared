      text: Sono {item} al cinema ieri.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'sono के साथ भूतकृदंत बोलने वाले के अनुसार बदलता है: पुरुष के लिए andato, स्त्री के लिए andata।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit13.lesson01.fill.004
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
