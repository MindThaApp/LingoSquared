    slot: item
  feedback_frame:
    text: Andata स्त्री बोलती है, andato पुरुष।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit13.lesson01.order.003
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: word_order
