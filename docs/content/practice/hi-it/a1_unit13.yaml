  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Andato और andata जाना क्रिया के भूतकाल के पुल्लिंग और स्त्रीलिंग रूप हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit13.lesson01.listen.002
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
