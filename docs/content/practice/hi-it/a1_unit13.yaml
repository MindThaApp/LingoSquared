- content_key: practice.hi-it.it.a1.unit13.lesson01.translate.007
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: translation
  frame:
    text: मैं कल सिनेमा गया था। (पुरुष वक्ता)
