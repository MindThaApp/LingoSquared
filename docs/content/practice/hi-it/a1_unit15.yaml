  feedback_frame:
    text: Buone के अंत में -e है क्योंकि यह स्त्रीलिंग बहुवचन संज्ञा का वर्णन करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit15.lesson03.order.004
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: word_order
  frame:
