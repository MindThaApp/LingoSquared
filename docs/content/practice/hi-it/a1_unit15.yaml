    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, le mele sono {item} come i pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Sono buone बहुवचन है, इसलिए स्त्रीलिंग बहुवचन mele के साथ buono बदलकर buone हो जाता है।
    language_code: hi
    direction: ltr
