    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit15.lesson02.translate.003
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: translation
  frame:
    text: अरे, तुम्हें कौन-सा ज़्यादा पसंद है, सेब या टमाटर? (अनौपचारिक, tu)
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, {item} preferisci, le mele o i pomodori?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Preferisci अनौपचारिक tu रूप है, इसलिए यह प्रश्न किसी दोस्त से पूछा जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit15.lesson03.choose.002
  lesson_content_key: it.a1.unit15.lesson03.buone_come
