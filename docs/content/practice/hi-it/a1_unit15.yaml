  answer_derivation:
    kind: render_frame
    frame:
      text: Le mele sono {item} come i pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Buone, mele के अनुसार है; इस तुलना में come का अर्थ 'जितना' है।
    language_code: hi
    direction: ltr
