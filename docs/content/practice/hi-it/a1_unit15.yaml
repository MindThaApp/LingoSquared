- content_key: practice.hi-it.it.a1.unit15.lesson01.translate.006
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: translation
  frame:
    text: सेब टमाटरों से महँगे हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Le mele costano più {item} pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dei, di + i है और pomodori के अनुसार है, जिससे तुलना की जा रही है; mele के अनुसार नहीं।
    language_code: hi
    direction: ltr
