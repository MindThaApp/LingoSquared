  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: translation
  frame:
    text: टमाटर सेबों से सस्ते हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: I pomodori costano meno {item} mele.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Meno delle का अर्थ है 'से कम', जो स्त्रीलिंग बहुवचन संज्ञा से पहले आता है।
    language_code: hi
    direction: ltr
