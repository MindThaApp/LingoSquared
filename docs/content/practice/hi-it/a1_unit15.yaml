    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit15.lesson02.order.001
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: word_order
  frame:
    text: Ciao, {item} preferisci, le mele o i pomodori?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, {item} preferisci, le mele o i pomodori?
