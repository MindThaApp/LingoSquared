templates:
- content_key: practice.hi-it.it.a1.unit05.lesson01.choose.001
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'समय बताने में स्त्रीलिंग बहुवचन le आता है, क्योंकि ore (घंटे) स्त्रीलिंग बहुवचन है: sono le tre।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson01.listen.002
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'एक बजे अपवाद है: l''una एकवचन है, इसलिए उसके साथ sono नहीं, è आता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson01.order.003
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: word_order
  frame:
    text: Che {item} sono?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} sono?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che ore sono? का शाब्दिक अर्थ है 'कितने घंटे हैं?', इसीलिए उत्तर sono le से शुरू होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson01.fill.004
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: fill_in_blank
  frame:
    text: Sono {item} tre. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le यहाँ ore के अनुसार आता है, जो वाक्य में छिपा हुआ है: sono le tre यानी तीन बजे हैं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson01.translate.005
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: translation
  frame:
    text: '{n} बजे हैं।'
    language_code: hi
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le {n}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: एक बजे को छोड़कर हर घंटे के लिए Sono le आता है; एक बजे के लिए l'una आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson02.choose.001
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'E जोड़ता है और meno घटाता है: le tre e mezzo यानी 3:30, le quattro meno un quarto यानी 3:45।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson02.listen.002
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mezzo में दोहरा z है; उस ध्वनि को थोड़ा लंबा बोलिए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson02.order.003
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: word_order
  frame:
    text: Sono le tre e un {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le tre e un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'E un quarto पंद्रह मिनट जोड़ता है: le tre e un quarto यानी 3:15।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson02.fill.004
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: fill_in_blank
  frame:
    text: Sono le tre e {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mezzo का अर्थ है आधा, इसलिए e mezzo तीस मिनट जोड़ता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson02.match.005
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mezzo यानी आधा और quarto यानी चौथाई; पहले घंटा आता है, फिर e या meno।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson02.translate.006
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: translation
  frame:
    text: पौने चार बजे हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le quattro meno un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Meno अगले घंटे में से मिनट घटाता है: le quattro meno un quarto यानी 3:45।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson02.translate.007
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: translation
  frame:
    text: साढ़े तीन बजे हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le tre e {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: E mezzo, यानी 'और आधा', घंटे के आधे बाद का समय बताने का रोज़मर्रा का तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson03.choose.001
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Alle का अर्थ ''पर'' (स्त्रीलिंग बहुवचन) है और घड़ी के समय के लिए आता है: alle tre यानी तीन बजे।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson03.listen.002
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ora का अर्थ है घंटा या समय; ore उसका बहुवचन है, इसीलिए प्रश्न Che ore sono? है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson03.order.003
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: word_order
  frame:
    text: A che {item} ci vediamo?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: A che {item} ci vediamo?
      language_code: it
      direction: ltr
  feedback_frame:
    text: A che ora का अर्थ है 'किस समय'; यहाँ ora एकवचन है, क्योंकि एक ही क्षण के बारे में पूछा जा रहा है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson03.fill.004
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: fill_in_blank
  frame:
    text: Ci vediamo {item} tre e mezzo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alle एक बजे को छोड़कर हर घंटे के साथ आता है; एक बजे के लिए all'una कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson03.translate.005
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: translation
  frame:
    text: हम साढ़े तीन बजे मिलेंगे।
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ci vediamo {item} tre e mezzo.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo alle के साथ समय जोड़ना मिलने का समय तय करने का सामान्य तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit05.lesson03.translate.006
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Mattina और sera का अर्थ सुबह और शाम है; इटैलियन में इनसे पहले di आता है: di mattina, di sera।'
    language_code: hi
    direction: ltr
