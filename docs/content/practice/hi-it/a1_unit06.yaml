    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Figli, figlio का बहुवचन है और दोनों लिंगों के बच्चों के लिए आता है।
    language_code: hi
    direction: ltr
