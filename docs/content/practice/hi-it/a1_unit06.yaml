  answer_derivation:
    kind: render_frame
    frame:
      text: Hai {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai figli? यह पूछने का अनौपचारिक तरीका है कि किसी के बच्चे हैं या नहीं।
    language_code: hi
    direction: ltr
