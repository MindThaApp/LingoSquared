templates:
- content_key: practice.hi-it.it.a1.unit06.lesson01.choose.001
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'अधिकारवाचक शब्द के साथ एकवचन पारिवारिक संज्ञाओं से पहले आर्टिकल नहीं लगता: mio padre, mia madre।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit06.lesson01.listen.002
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Padre और madre दोनों -e पर समाप्त होते हैं, पर इनका लिंग अलग है, इसलिए हर शब्द को उसके लिंग के साथ सीखिए; nonno और nonna क्रमशः -o और -a पर समाप्त होते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit06.lesson01.order.003
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: word_order
  frame:
    text: Questo è mio {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Questo è mio {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Questo और mio पुल्लिंग हैं, इसलिए ये पुल्लिंग संज्ञा के साथ आते हैं: questo è mio padre।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit06.lesson01.fill.004
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: fill_in_blank
  frame:
    text: Questa è mia {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Questa और mia स्त्रीलिंग हैं और madre के साथ मेल खाते हैं: यह मेरी माँ है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit06.lesson01.translate.005
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: यह मेरी माँ हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Questa è mia {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: स्त्रीलिंग संज्ञा के साथ questa और mia लगाइए, पुल्लिंग संज्ञा के साथ questo और mio।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit06.lesson01.translate.006
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Madre और padre, fratello और sorella, nonno और nonna पारिवारिक शब्दों के पुल्लिंग और स्त्रीलिंग जोड़े हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit06.lesson02.choose.001
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fratelli, fratello का बहुवचन है, और इसका अर्थ भाई-बहन भी हो सकता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit06.lesson02.listen.002
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marito और moglie का अर्थ पति और पत्नी है; moglie -e पर समाप्त होता है, फिर भी स्त्रीलिंग है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit06.lesson02.order.003
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: word_order
  frame:
    text: Ho un fratello e una {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Un पुल्लिंग संज्ञा के साथ आता है और una स्त्रीलिंग संज्ञा के साथ: un fratello, una sorella।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit06.lesson02.fill.004
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: fill_in_blank
  frame:
    text: Hai fratelli o {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Sorella का बहुवचन sorelle है: अंत का -a बदलकर -e हो जाता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit06.lesson02.translate.005
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: मेरा एक भाई और एक बहन है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ho का अर्थ है 'मेरे पास है'; पुल्लिंग संज्ञा से पहले un और स्त्रीलिंग संज्ञा से पहले una लगाइए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit06.lesson02.translate.006
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: क्या तुम्हारे भाई-बहन हैं? (अनौपचारिक, tu)
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai fratelli o {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai 'तुम्हारे पास है' का अनौपचारिक tu रूप है, इसलिए यह प्रश्न किसी मित्र या सहकर्मी से पूछा जाता है।
    language_code: hi
    direction: ltr
