  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Figli का अर्थ सामान्य रूप से बच्चे है; figlio और figlia बेटे और बेटी के लिए आते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit06.lesson03.listen.003
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: परिवार में लड़के और लड़की के लिए maschio और femmina का प्रयोग होता है।
