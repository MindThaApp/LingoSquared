templates:
- content_key: practice.hi-it.it.a1.unit09.lesson01.choose.001
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La farmacia, la banca और la stazione स्त्रीलिंग हैं; l'ufficio postale पुल्लिंग है और उसमें आर्टिकल का लोप हुआ है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson01.listen.002
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Via का अर्थ सड़क या मार्ग हो सकता है, और यह Via Roma जैसे नामों में आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson01.order.003
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: word_order
  frame:
    text: Scusi, dov'è la {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dov'è la के बाद स्त्रीलिंग संज्ञा लगाकर किसी जगह का पता पूछा जाता है; scusi 'माफ़ कीजिए' का औपचारिक रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson01.fill.004
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: fill_in_blank
  frame:
    text: È qui {item}, in Via Roma. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Qui vicino का अर्थ है पास में, यहीं कहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson01.match.005
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Vicino का अर्थ है पास; qui vicino का अर्थ है यहीं पास में।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson01.translate.006
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: माफ़ कीजिए, दवा की दुकान कहाँ है? (औपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi औपचारिक आज्ञार्थ रूप है, जो किसी अजनबी से बात करने के लिए उपयुक्त है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson01.translate.007
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Il या la लिंग के अनुसार बदलता है, पर स्वर से पहले l'' आता है: l''ufficio.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson02.choose.001
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: C'è किसी चीज़ के होने को पूछता या बताता है; ce n'è उन में से एक होने का उत्तर देता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson02.listen.002
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ce n''è una का अर्थ है ''एक है'': ne का मतलब ''उनमें से'' है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson02.fill.003
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: C'è una {item} qui vicino? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: C'è una banca? पूछता है कि यहाँ आस-पास कोई बैंक है या नहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson02.order.004
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: word_order
  frame:
    text: Sì, {item} una qui vicino.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, {item} una qui vicino.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ce n'è una, c'è una ... वाले प्रश्न का उत्तर देकर बताता है कि एक है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson02.fill.005
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: È {item} alla stazione. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Accanto alla का अर्थ है 'के बगल में'; alla यानी a और la का मेल।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson02.fill.006
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: Sì, ce n'è una qui vicino, accanto {item} stazione. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alla स्त्रीलिंग संज्ञा से पहले a और la को मिला देता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson02.translate.007
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: क्या यहाँ पास में कोई बैंक है?
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: C'è una {item} qui vicino?
      language_code: it
      direction: ltr
  feedback_frame:
    text: C'è una banca qui vicino? में una आया है क्योंकि banca स्त्रीलिंग है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson02.translate.008
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: हाँ, यहीं पास में एक है।
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, {item} una qui vicino.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ce n'è una का अर्थ है 'उनमें से एक है'।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit09.lesson02.translate.009
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: यह स्टेशन के बगल में है।
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: È {item} alla stazione.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Accanto alla stazione का अर्थ है 'स्टेशन के बगल में'।
    language_code: hi
    direction: ltr
