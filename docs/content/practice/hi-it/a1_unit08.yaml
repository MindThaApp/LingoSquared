  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: translation
  frame:
    text: ठीक है, मैं इसे ले लूँगा।
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Va bene, lo prendo खरीदारी पूरी करने का सामान्य तरीका है।
