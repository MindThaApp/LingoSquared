    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mele, banane और patate स्त्रीलिंग बहुवचन हैं और इनके साथ le आता है; pomodori पुल्लिंग बहुवचन है और इसके साथ i आता है।
    language_code: hi
    direction: ltr
