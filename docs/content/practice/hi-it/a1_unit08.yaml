- content_key: practice.hi-it.it.a1.unit08.lesson01.choose.001
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
