    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lo prendo का अर्थ है 'मैं इसे ले लूँगा'; lo किसी पुल्लिंग वस्तु की ओर इशारा करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit08.lesson03.listen.003
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
