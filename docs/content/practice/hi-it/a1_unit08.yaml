      language_code: it
      direction: ltr
  feedback_frame:
    text: Le स्त्रीलिंग बहुवचन संज्ञाओं के साथ आता है, और costano बहुवचन क्रिया है क्योंकि कई चीज़ों का दाम पूछा जा रहा है।
    language_code: hi
    direction: ltr
