  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Lo का अर्थ ''इसे'' है और यह क्रिया से पहले आता है: lo prendo।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit08.lesson03.order.005
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: word_order
  frame:
    text: Va bene, lo {item}.
    language_code: it
    direction: ltr
