  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mele, mela का बहुवचन है: -a पर खत्म होने वाली स्त्रीलिंग संज्ञाएँ बहुवचन में -e लेती हैं।'
    language_code: hi
    direction: ltr
