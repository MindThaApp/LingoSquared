    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vada sempre dritto, poi giri a destra {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: All'incrocio का अर्थ है चौराहे पर।
    language_code: hi
    direction: ltr
