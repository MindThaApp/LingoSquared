- content_key: practice.hi-it.it.a1.unit10.lesson01.translate.005
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: translation
  frame:
    text: माफ़ कीजिए, मैं संग्रहालय कैसे पहुँचूँ? (औपचारिक)
    language_code: hi
    direction: ltr
  slots:
