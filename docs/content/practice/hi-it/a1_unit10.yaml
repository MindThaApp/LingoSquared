  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vada और giri औपचारिक आज्ञा के रूप हैं, जो अजनबियों से बात करते समय इस्तेमाल होते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit10.lesson01.listen.002
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
