  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, come arrivo al {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi किसी अजनबी को औपचारिक रूप से संबोधित करने का तरीका है।
    language_code: hi
    direction: ltr
