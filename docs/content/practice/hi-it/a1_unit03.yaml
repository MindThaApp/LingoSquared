templates:
- content_key: practice.hi-it.it.a1.unit03.lesson01.choose.001
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Uno गिनती वाली संख्या है; पुल्लिंग संज्ञा से पहले यह un बन जाता है और स्त्रीलिंग संज्ञा से पहले una।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson01.listen.002
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sette और otto दोनों में दोहरा t है; उसे थोड़ा लंबा बोलिए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson01.order.003
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: word_order
  frame:
    text: Ho {age} anni.
    language_code: it
    direction: ltr
  slots:
    age: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho {age} anni.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'इतालवी में उम्र avere (पास होना) से बताई जाती है: ho cinque anni का शाब्दिक अर्थ है ''मेरे पास पाँच साल हैं''।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson01.fill.004
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: fill_in_blank
  frame:
    text: Quanti anni {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hai, avere का tu वाला रूप है; Lei के साथ सवाल होता है Quanti anni ha?
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson01.match.005
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: शून्य से दस तक की संख्याएँ बुनियादी इकाइयाँ हैं; ग्यारह से उन्नीस और दहाइयाँ बाद में इन्हीं से बनाई जाती हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson01.translate.006
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: translation
  frame:
    text: मैं {age} साल का/की हूँ।
    language_code: hi
    direction: ltr
    slot_rendering:
      age: english_gloss
  slots:
    age: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho {age} anni.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'उम्र बताने के लिए कभी sono का प्रयोग न करें: Ho dieci anni कहें, Sono dieci anni नहीं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson02.choose.001
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ne का अर्थ है ''उसमें से'' या ''उनमें से'': Ne vorrei tre यानी ''मुझे उनमें से तीन चाहिए''।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson02.listen.002
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Caffè में बल अंतिम अक्षर पर पड़ता है, जिसे उच्चारण-चिह्न दिखाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson02.order.003
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: word_order
  frame:
    text: Quanto costa un {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costa un {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Costa एकवचन है, इसलिए एक ही चीज़ के साथ आता है: Quanto costa un cornetto? कई चीज़ों के लिए costano कहा जाता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson02.fill.004
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: fill_in_blank
  frame:
    text: Ne {item} tre, grazie. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vorrei कुछ मँगवाने या माँगने का विनम्र तरीका है, जो 'मुझे चाहिए' से अधिक नरम लगता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson02.translate.005
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cinquanta यानी पचास; चालीस से आगे इतालवी में दहाइयाँ -anta पर खत्म होती हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson02.translate.006
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: translation
  frame:
    text: '{item} की कीमत कितनी है?'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costa un {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Quanto costa? में ''क्या'' जैसे किसी अलग शब्द की ज़रूरत नहीं: quanto यानी कितना, और costa यानी इसकी कीमत है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson03.choose.001
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tuo और mio लिंग के अनुसार बदलते हैं; यहाँ दोनों पुल्लिंग हैं क्योंकि numero पुल्लिंग है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson03.order.002
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: word_order
  frame:
    text: Qual è il tuo numero di {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Qual è il tuo numero di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Qual, quale का छोटा रूप है; essere के किसी रूप से पहले यह अंतिम e छोड़ देता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson03.fill.003
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: fill_in_blank
  frame:
    text: Qual è il {item} numero di telefono? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il tuo numero दूसरे व्यक्ति के नंबर के बारे में पूछता है; il mio numero अपने नंबर से जवाब देता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson03.match.004
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Il पुल्लिंग एकवचन का निश्चित उपपद है; numero और telefono दोनों पुल्लिंग हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson03.translate.005
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Perfetto उस संज्ञा के अनुसार बदलता है जिसका वह वर्णन करता है: स्त्रीलिंग संज्ञा के साथ वह perfetta हो जाता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit03.lesson03.translate.006
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: translation
  frame:
    text: तुम्हारा फ़ोन नंबर क्या है? (अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Qual è il tuo numero di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Tuo अनौपचारिक 'तुम्हारा' है; Lei के साथ आप il Suo numero कहेंगे।
    language_code: hi
    direction: ltr
