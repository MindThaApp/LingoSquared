templates:
- content_key: practice.hi-it.it.a1.unit01.lesson01.choose.001
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu दोस्तों, परिवार और बराबरी के लोगों के लिए है; बड़े L वाला Lei अजनबियों, बड़ों और पेशेवर माहौल के लिए आदरसूचक रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson01.listen.002
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ciao नमस्ते और अलविदा, दोनों के लिए चलता है, जबकि buongiorno दिन के समय का शिष्ट अभिवादन है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson01.order.003
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: word_order
  frame:
    text: Ciao, come {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Come stai? दोस्त से उसका हाल पूछता है; अजनबी से आप Come sta? कहेंगे।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson01.match.004
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'इतालवी के कई विशेषण -ale पर समाप्त होते हैं: informale यानी अनौपचारिक, formale यानी औपचारिक।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson01.translate.005
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Rispettoso औपचारिक Lei के साथ चलता है: यह उन लोगों के प्रति सम्मान दिखाता है जिन्हें आप अच्छी तरह नहीं जानते।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson01.translate.006
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: नमस्ते, तुम कैसे हो? (अनौपचारिक, दोस्त से)
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Stai tu वाला रूप है; इसी सवाल का आदरसूचक Lei रूप Buongiorno, come sta? है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson02.choose.001
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Arrivederla औपचारिक विदाई है; अंत का -la Lei की ओर संकेत करता है। दोस्तों से इतालवी लोग ciao कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson02.listen.002
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buonasera शाम का अभिवादन है; buonanotte केवल तब कहा जाता है जब कोई सोने जा रहा हो।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson02.order.003
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: word_order
  frame:
    text: Ciao, ci {item} domani!
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, ci {item} domani!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo का शाब्दिक अर्थ है "हम एक-दूसरे को देखते हैं"; यह "फिर मिलेंगे" कहने का रोज़मर्रा का तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson02.fill.004
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: fill_in_blank
  frame:
    text: Arrivederla, a {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A domani का अर्थ है "कल मिलते हैं"; a इस स्थायी वाक्यांश का हिस्सा है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson02.translate.005
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bene, Come stai? का उत्तर है और अकेला भी "ठीक" या "अच्छा" के अर्थ में आ सकता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson03.choose.001
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scusi किसी अजनबी का ध्यान खींचने का शिष्ट तरीका है; यह औपचारिक (Lei) रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson03.listen.002
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Benvenuto पुल्लिंग है; किसी महिला का स्वागत करते समय यह benvenuta हो जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson03.order.003
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: word_order
  frame:
    text: Mi chiamo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mi chiamo का शाब्दिक अर्थ है "मैं खुद को पुकारता/पुकारती हूँ"; नाम बस अंत में आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson03.fill.004
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: fill_in_blank
  frame:
    text: Come ti {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ti अनौपचारिक "तुम" है; Lei के साथ सवाल Come si chiama? बन जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson03.match.005
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Piacere संज्ञा "आनंद" भी है और किसी से मिलते समय कहा जाने वाला उत्तर भी: "आपसे मिलकर खुशी हुई"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson03.translate.006
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Mille का अर्थ है "हज़ार", इसलिए grazie mille आभार जताने का आत्मीय तरीका है: "बहुत-बहुत धन्यवाद"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-it.it.a1.unit01.lesson03.translate.007
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: मेरा नाम Elena है।
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: हिंदी में हम "मेरा नाम ... है" कहते हैं, जबकि इतालवी में mi chiamo कहा जाता है, जिसका शाब्दिक अर्थ है "मैं खुद को पुकारता/पुकारती हूँ"।
    language_code: hi
    direction: ltr
