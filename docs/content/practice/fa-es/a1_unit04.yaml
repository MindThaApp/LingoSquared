templates:
- content_key: practice.fa-es.es.a1.unit04.lesson01.choose.001
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'روزهای هفته در اسپانیایی با حرف کوچک نوشته می‌شوند و مذکرند: el lunes، los martes.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson01.listen.002
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'lunes تا viernes به -s ختم می‌شوند و در جمع همان شکل را دارند؛ sábado و domingo در جمع -s می‌گیرند: los sábados.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson01.order.003
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: word_order
  frame:
    text: Hoy es {day}.
    language_code: es
    direction: ltr
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy es {day}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'بعد از hoy es نیازی به حرف تعریف نیست؛ برای گفتنِ «سه‌شنبه‌ها» از los استفاده می‌کنید: los martes.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson01.translate.004
  lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
  type: translation
  frame:
    text: امروز {day} است.
    language_code: fa
    direction: rtl
    slot_rendering:
      day: english_gloss
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy es {day}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'حرف کوچک را یادتان باشد: hoy es lunes، نه Lunes.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson02.match.001
  lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'ماه‌ها هم در اسپانیایی با حرف کوچک نوشته می‌شوند: enero، julio، diciembre.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson02.translate.002
  lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اسم خیلی از ماه‌ها شبیه اسم ماه‌های فرنگی است: marzo، abril، septiembre، octubre.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson02.order.003
  lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
  type: word_order
  frame:
    text: Mi cumpleaños es en {month}.
    language_code: es
    direction: ltr
  slots:
    month: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi cumpleaños es en {month}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: با نام ماه از en استفاده کنید (en marzo)، ولی با تاریخ کامل از el (el diez de marzo).
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson03.fill.001
  lesson_content_key: es.a1.unit04.lesson03.preguntar_y_decir_la_fecha
  type: fill_in_blank
  frame:
    text: ¿Qué {item} es hoy? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تاریخ در اسپانیایی به ترتیب روز، de، ماه است: el veintidós de julio.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson03.translate.002
  lesson_content_key: es.a1.unit04.lesson03.preguntar_y_decir_la_fecha
  type: translation
  frame:
    text: امروز بیست‌ودوم جولای است.
    language_code: fa
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy es el {item} de julio.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'اسپانیایی برای تاریخ از عدد اصلی استفاده می‌کند، نه عدد ترتیبی: el veintidós، یعنی «بیست‌ودوم».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson05.choose.001
  lesson_content_key: es.a1.unit04.lesson05.leer_el_horario_del_taller
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'hay هم به معنی «هست» است و هم «هستند»: hay una clase، hay dos clases.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson05.fill.002
  lesson_content_key: es.a1.unit04.lesson05.leer_el_horario_del_taller
  type: fill_in_blank
  frame:
    text: Después hay una clase el {item} de julio. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اعداد بیست‌ویک تا بیست‌ونه یک‌کلمه نوشته می‌شوند: veintiuno، veintidós، veintinueve.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson06.listen.001
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Por cierto، یعنی «راستی»، راه خوبی برای عوض کردن بحث است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson06.translate.002
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cumpleaños یک کلمه است و مفرد و جمعش یکی است: el cumpleaños، los cumpleaños.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson06.translate.003
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: translation
  frame:
    text: مال تو چطور؟ (خودمانی)
    language_code: fa
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Y el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: El tuyo جای tu cumpleaños را می‌گیرد که اسم مذکر است؛ برای اسم مؤنث la tuya می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit04.lesson06.match.004
  lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ¿Cuándo es...? می‌پرسد چیزی کی است؛ جواب با es el + تاریخ یا es en + ماه شروع می‌شود.
    language_code: fa
    direction: rtl
