templates:
- content_key: practice.fa-es.es.a1.unit11.lesson01.choose.001
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: در اسپانیایی برای «شلوار» معمولاً مفرد el pantalón به کار می‌رود (los pantalones هم هست)؛ در فارسی هم «شلوار» را مفرد می‌گوییم.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit11.lesson01.listen.002
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: camisa و chaqueta مؤنث‌اند؛ pantalón، delantal و zapatos مذکرند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit11.lesson01.translate.003
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اسم‌هایی که به -l ختم می‌شوند در جمع -es می‌گیرند: delantal، delantales.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit11.lesson02.order.001
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: word_order
  frame:
    text: Uso la talla {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Uso la talla {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: من سایز مدیوم می‌پوشم. در اسپانیایی برای سایزی که می‌پوشید از usar (استفاده کردن) استفاده می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit11.lesson02.fill.002
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: fill_in_blank
  frame:
    text: ¿Qué {item} usas? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'talla سایز لباس است؛ سایز کفش به‌جایش el número است: ¿Qué número tienes?'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit11.lesson02.translate.003
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: translation
  frame:
    text: اندازه‌ام نیست.
    language_code: fa
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Quedar bien یا mal می‌گوید لباس به تن شما چطور می‌نشیند: me queda bien یعنی «اندازه‌ام است / بهم خوب می‌آید».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit11.lesson04.order.001
  lesson_content_key: es.a1.unit11.lesson04.decidir_comprar
  type: word_order
  frame:
    text: Me queda bien. Voy a {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda bien. Voy a {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Ir a + مصدر درباره‌ی یک برنامه است: voy a comprarlo یعنی «می‌خوام بخرمش». ضمیر lo (آن) به آخر مصدر چسبیده می‌شود.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit11.lesson05.match.001
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Uso، usas و usan همه از usar می‌آیند: می‌پوشم، می‌پوشی، می‌پوشند.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit11.lesson05.fill.002
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: fill_in_blank
  frame:
    text: 'El delantal es más {item}: solo cuesta doce. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Más + صفت، مقایسه می‌سازد: más barato یعنی «ارزان‌تر».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit11.lesson06.order.001
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: word_order
  frame:
    text: Sí, buscamos {item} para el taller.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, buscamos {item} para el taller.
      language_code: es
      direction: ltr
  feedback_frame:
    text: بله، ما دنبال پیش‌بند برای کارگاه می‌گردیم. Buscar خودش یعنی «دنبال چیزی گشتن»، برای همین در buscamos delantales به کلمه‌ی اضافه‌ای نیازی نیست.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit11.lesson06.choose.002
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: فروشنده با ¿Los ayudo? پیشنهاد کمک می‌دهد، یعنی «می‌تونم کمکتون کنم؟» (خطاب به چند نفر).
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit11.lesson06.translate.003
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Voy از ir (رفتن) می‌آید و بی‌قاعده است: voy، vas، va.'
    language_code: fa
    direction: rtl
