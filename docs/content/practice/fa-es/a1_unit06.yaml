    language_code: fa
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buen {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: Buen provecho را به کسانی می‌گویند که می‌خواهند غذا بخورند، حتی به غریبه‌های میز کناری.
    language_code: fa
    direction: rtl
