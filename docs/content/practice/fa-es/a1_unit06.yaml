  feedback_frame:
    text: Café، menú و sándwich آکسان نوشتاری دارند؛ این نشانه هجای تکیه‌دار را مشخص می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit06.lesson02.order.001
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: word_order
  frame:
    text: Quiero un {item}, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Un با اسم‌های مذکر می‌آید (un café)؛ اسم‌های مؤنث una می‌گیرند (una ensalada).
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit06.lesson02.translate.002
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: translation
  frame:
    text: یک {item} می‌خوام، لطفاً.
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'راه رایج دیگر برای سفارش، para mí + نام غذاست: para mí, un café.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit06.lesson02.fill.003
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: fill_in_blank
  frame:
    text: ¿Qué {item} comer? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'فعل querer ریشه‌اش تغییر می‌کند: quiero, quieres, quiere، ولی queremos.'
    language_code: fa
    direction: rtl
