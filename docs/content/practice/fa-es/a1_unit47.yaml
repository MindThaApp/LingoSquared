- content_key: practice.fa-es.es.a1.unit47.lesson01.order.002
  lesson_content_key: es.a1.unit47.lesson01.te_llamo
  type: word_order
  frame:
    text: Tengo que {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_llamarte
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo que {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: باید بهت زنگ بزنم. llamarte یعنی «به تو زنگ زدن».
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit47.lesson02.order.002
  lesson_content_key: es.a1.unit47.lesson02.con_quien_hablo
  type: word_order
  frame:
    text: ¿Con quién {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hablo
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Con quién {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: با کی صحبت می‌کنم؟ ¿Con quién hablo? عبارت رایج برای وقتیه که نمی‌دونید کی زنگ زده.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit47.lesson03.order.002
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: word_order
  frame:
    text: No {item} tan rápido, por favor.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hables
  answer_derivation:
    kind: render_frame
    frame:
      text: No {item} tan rápido, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: لطفاً این‌قدر تند حرف نزنید. No hables شکل امر منفی غیررسمیِ hablar است؛ tan rápido (این‌قدر تند) میزان را نشان می‌دهد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit47.lesson03.fill.003
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: fill_in_blank
  frame:
    text: No te {item} bien. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: صداتون رو خوب نمی‌شنوم. Oír (شنیدن) همراه با no ... bien (نه خوب) مشکل شنیدن رو نشون می‌ده، که با entender (فهمیدن) فرق داره؛ te oigo یعنی «صدات رو می‌شنوم».
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit47.lesson04.order.002
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: word_order
  frame:
    text: El {item} es de Elena.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_mensaje
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} es de Elena.
      language_code: es
      direction: ltr
  feedback_frame:
    text: پیامک از النا است. mensaje یعنی پیام؛ پیامک.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit47.lesson04.fill.003
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: fill_in_blank
  frame:
    text: Te {item} un mensaje. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'برات پیامک می‌فرستم. Enviar (فرستادن) بعد از ضمیر te (برای تو) می‌آید: te envío un mensaje.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit47.lesson06.order.002
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: word_order
  frame:
    text: ¿Cómo ha ido tu primer {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_turno
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo ha ido tu primer {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'اولین شیفتت چطور بود؟ Ha ido ماضی نقلی فعل ir است (اینجا یعنی «گذشتن، پیش رفتن»): ha + صفت مفعولی ido.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit47.lesson06.fill.003
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: fill_in_blank
  frame:
    text: Ha ido muy bien, mejor de lo {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: خیلی خوب گذشت، بهتر از چیزی که فکر می‌کردم. Ha ido muy bien همان ماضی نقلی سؤال را تکرار می‌کند؛ mejor de lo esperado (بهتر از انتظار) با de lo مقایسه می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit47.lesson06.translate.004
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame:
    text: ممنون، این برام خیلی ارزش داره.
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_significa
  answer_derivation:
    kind: render_frame
    frame:
      text: Muchas gracias, eso {item} mucho para mí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: ممنون، این برام خیلی ارزش داره. Significa سوم‌شخص مفرد فعل significar (معنی دادن) است؛ para mí (برای من) نشان می‌دهد برای چه کسی مهم است.
    language_code: fa
    direction: rtl
