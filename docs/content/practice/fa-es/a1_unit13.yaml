templates:
- content_key: practice.fa-es.es.a1.unit13.lesson01.choose.001
  lesson_content_key: es.a1.unit13.lesson01.el_trabajo_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Trabajo هم اسم است به معنی «شغل» و هم شکل فعل به معنی «کار می‌کنم».
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit13.lesson01.listen.002
  lesson_content_key: es.a1.unit13.lesson01.el_trabajo_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Escritorio یعنی میز تحریر؛ «دفتر کار» می‌شود una oficina.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit13.lesson02.translate.001
  lesson_content_key: es.a1.unit13.lesson02.las_profesiones
  type: translation
  frame:
    text: من حسابدار هستم. (یک مرد می‌گوید)
    language_code: fa
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'بعد از ser برای شغل، حرف تعریف نمی‌آید: soy contador درست است، نه soy un contador؛ زن می‌گوید soy contadora.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit13.lesson02.order.002
  lesson_content_key: es.a1.unit13.lesson02.las_profesiones
  type: word_order
  frame:
    text: Yo soy {item}. Enseño en una escuela.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Yo soy {item}. Enseño en una escuela.
      language_code: es
      direction: ltr
  feedback_frame:
    text: من معلم هستم. من در یک مدرسه درس می‌دهم. معلم مرد می‌شود un profesor.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit13.lesson03.fill.001
  lesson_content_key: es.a1.unit13.lesson03.en_que_trabajas
  type: fill_in_blank
  frame:
    text: ¿En qué {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¿En qué trabajas? در اصل یعنی «در چه چیزی کار می‌کنی؟» و معنایش «شغلت چیست؟» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit13.lesson04.translate.001
  lesson_content_key: es.a1.unit13.lesson04.prefiero_cocinar
  type: translation
  frame:
    text: هر دوی ما این را ترجیح می‌دهیم.
    language_code: fa
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Los dos preferimos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Los dos اینجا یعنی «هر دوی ما»؛ esto به یک ایده یا چیز اشاره می‌کند بدون آن‌که اسمش را بیاورد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit13.lesson05.order.001
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: word_order
  frame:
    text: Mateo {item} en una oficina en Londres.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo {item} en una oficina en Londres.
      language_code: es
      direction: ltr
  feedback_frame:
    text: ماتئو در یک دفتر در لندن کار می‌کند. Trabajar en + مکان می‌گوید کسی کجا کار می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit13.lesson05.order.002
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: word_order
  frame:
    text: Elena {item} en una escuela.
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Elena {item} en una escuela.
      language_code: es
      direction: ltr
  feedback_frame:
    text: النا در یک مدرسه درس می‌دهد. Enseñar یعنی درس دادن؛ aprender یعنی یاد گرفتن.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit13.lesson05.match.003
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'A los dos les gusta su trabajo: کلمهٔ les نشان می‌دهد این دوست داشتن مال چه کسانی است، یعنی «آن‌ها».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit13.lesson06.translate.001
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بسیاری از واژه‌های حوزهٔ کار شبیه واژه‌های فارسی و بین‌المللی هستند: oficina، estudiantes، interesante.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit13.lesson06.fill.002
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: fill_in_blank
  frame:
    text: Prefiero cocinar {item} los martes. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Con + ti یک کلمه می‌شود: contigo؛ «با من» می‌شود conmigo.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit13.lesson06.choose.003
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: فعل preferir در بیشتر شکل‌ها e را به ie تبدیل می‌کند (prefiero، prefieren) ولی در preferimos نه.
    language_code: fa
    direction: rtl
