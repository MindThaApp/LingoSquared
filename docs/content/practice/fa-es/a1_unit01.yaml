templates:
- content_key: practice.fa-es.es.a1.unit01.lesson01.choose.001
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'در اسپانیایی دو کلمه برای «شما» هست: tú با دوستان و خانواده، و usted با غریبه‌ها و برای ابراز احترام.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson01.fill.002
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: fill_in_blank
  frame:
    text: ¿Cómo está {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Está با usted می‌آید؛ با tú فعل می‌شود estás: ¿Cómo estás?'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson01.translate.003
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: کلمه‌های سلام و احوال‌پرسی در اسپانیایی اغلب accent دارند (cómo، adiós، también)؛ این علامت هجای تکیه‌دار را نشان می‌دهد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson02.listen.001
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buenos días تا موقع ناهار (در اسپانیا حدود ساعت ۲ بعدازظهر) گفته می‌شود، buenas tardes بعدازظهر، و buenas noches شب و هنگام خواب.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson02.match.002
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Día مذکر است (buenos días) ولی tarde و noche مؤنث‌اند (buenas tardes، buenas noches).
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson02.order.003
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Adiós, hasta {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Adiós, hasta {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Hasta luego یعنی «تا بعد»؛ همان «بعداً می‌بینمتان» همیشگی است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson03.order.001
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Hola, me llamo {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Hola, me llamo {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Me llamo یعنی «خودم را ... صدا می‌زنم»؛ راه معمول گفتن اسم خودتان است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson03.translate.002
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: translation
  frame:
    text: این {name} است. (معرفی یک مرد)
    language_code: fa
    direction: rtl
    slot_rendering:
      name: token
  slots:
    name: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Este es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'برای معرفی مرد از este و برای معرفی زن از esta استفاده کنید: Esta es Ana.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson03.order.003
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Esta es {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Esta es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Esta برای زن است؛ برای مرد می‌گویید este: Este es Carlos.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson03.fill.004
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: fill_in_blank
  frame:
    text: Mucho {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mucho gusto یعنی «از آشنایی‌تان خوشوقتم»؛ جواب معمول آن igualmente است، یعنی «همچنین».
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson04.order.001
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: word_order
  frame:
    text: Soy de {place}, pero vivo en Londres.
    language_code: es
    direction: ltr
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}, pero vivo en Londres.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ser de + مکان می‌گوید اهل کجا هستید؛ vivir en + مکان می‌گوید الان کجا زندگی می‌کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson04.translate.002
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: translation
  frame:
    text: من اهل {place} هستم.
    language_code: fa
    direction: rtl
    slot_rendering:
      place: english_gloss
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'برای پرسیدن همین سؤال: ¿De dónde eres? (دوستانه) یا ¿De dónde es usted? (رسمی).'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson04.fill.003
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: fill_in_blank
  frame:
    text: Todavía estoy {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Estoy + -ando/-iendo کاری را می‌گوید که همین الان در جریان است، مثل «هنوز دارم یاد می‌گیرم».
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson05.order.001
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: word_order
  frame:
    text: Sí, es mi primera {item} aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, es mi primera {item} aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Vez به معنای «بار» است، یعنی یک نوبت: primera vez یعنی بار اول؛ otra vez یعنی دوباره.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson05.translate.002
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: translation
  frame:
    text: آشپزی کردن را دوست داری؟ (دوستانه)
    language_code: fa
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Te gusta {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'اسپانیایی برای گفتن علاقه از gustar استفاده می‌کند: آن کار برای شما خوشایند است، پس te gusta + مصدر.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson06.listen.001
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: النا و ماتئو با هم از tú استفاده می‌کنند، چون هم‌سن و سال و هم‌کارگاهی هستند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit01.lesson06.translate.002
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اسپانیایی وقتی پایان فعل شخص را نشان می‌دهد ضمیر فاعلی را حذف می‌کند: vivo یعنی «زندگی می‌کنم».'
    language_code: fa
    direction: rtl
