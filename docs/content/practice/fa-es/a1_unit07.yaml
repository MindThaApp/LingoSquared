templates:
- content_key: practice.fa-es.es.a1.unit07.lesson01.choose.001
  lesson_content_key: es.a1.unit07.lesson01.el_mercado
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'صفت‌ها با اسم مطابقت می‌کنند: la fruta fresca، los tomates frescos.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit07.lesson01.listen.002
  lesson_content_key: es.a1.unit07.lesson01.el_mercado
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Verdura مفرد است، ولی در بازار معمولاً verduras (سبزی‌ها) می‌خواهند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit07.lesson02.order.001
  lesson_content_key: es.a1.unit07.lesson02.preguntar_el_precio
  type: word_order
  frame:
    text: ¿Cuánto {item} el kilo de tomates?
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto {item} el kilo de tomates?
      language_code: es
      direction: ltr
  feedback_frame:
    text: کیلوی گوجه‌فرنگی چند است؟ cuesta برای یک چیز می‌آید و cuestan برای چند چیز.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit07.lesson02.translate.002
  lesson_content_key: es.a1.unit07.lesson02.preguntar_el_precio
  type: translation
  frame:
    text: تخم‌مرغ‌ها چند است؟
    language_code: fa
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto {item} los huevos?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Huevos جمع است، پس فعل cuestan می‌شود؛ برای نان، cuesta می‌شد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit07.lesson03.order.001
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: word_order
  frame:
    text: Una {item} de huevos, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Una {item} de huevos, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'یک دوجین تخم‌مرغ، لطفاً. مقدارها پیش از اسم de می‌گیرند: un kilo de tomates.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit07.lesson03.match.002
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Medio kilo یعنی نیم کیلو؛ پیش از medio واژهٔ un نمی‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit07.lesson03.translate.003
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: واژه‌هایی که به -o ختم می‌شوند معمولاً مذکرند (el mercado) و آن‌هایی که به -a ختم می‌شوند مؤنث (la fruta).
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit07.lesson04.fill.001
  lesson_content_key: es.a1.unit07.lesson04.una_compra_sencilla
  type: fill_in_blank
  frame:
    text: ¿{item} algo más? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'فروشنده‌های بازار با مشتری‌ها از صورت usted استفاده می‌کنند: ¿Necesita algo más?'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit07.lesson04.translate.002
  lesson_content_key: es.a1.unit07.lesson04.una_compra_sencilla
  type: translation
  frame:
    text: ما همه‌چیز را از قبل داریم.
    language_code: fa
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ya tenemos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ya (از قبل) در اسپانیایی معمولاً پیش از فعل می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit07.lesson05.choose.001
  lesson_content_key: es.a1.unit07.lesson05.leer_las_etiquetas_de_precio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Todos los días یعنی هر روز؛ تحت‌اللفظی یعنی «همهٔ روزها».
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit07.lesson06.order.001
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: word_order
  frame:
    text: Necesitamos {item} para la próxima clase.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Necesitamos {item} para la próxima clase.
      language_code: es
      direction: ltr
  feedback_frame:
    text: ما برای کلاس بعد مواد اولیه لازم داریم. Necesitamos صورت «ما»ی necesitar است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit07.lesson06.translate.002
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¡Qué tomates tan frescos! همان چیزی است که اسپانیایی برای «چه گوجه‌فرنگی‌های تازه‌ای!» می‌گوید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit07.lesson06.listen.003
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vamos هم «برویم» معنا می‌دهد هم «می‌رویم»؛ موقعیت تفاوتشان را مشخص می‌کند.
    language_code: fa
    direction: rtl
