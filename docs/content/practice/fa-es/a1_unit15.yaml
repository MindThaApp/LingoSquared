    - w_viejo
    - w_equipo
    - w_espacio
    - w_mudarme
    - w_cocinas
    - w_sentido
slot_presets:
  content: &id002
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u15
  viejo: &id001
    language_code: es
    part_of_speech: adjective
    agreement_tags:
      semantic: w_viejo
  equipo: &id003
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_equipo
  espacio: &id004
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_espacio
  mudarme: &id005
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_mudarme
  cocinas: &id006
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_cocinas
  sentido: &id007
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_sentido
templates:
- content_key: practice.fa-es.es.a1.unit15.lesson02.order.001
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: word_order
  frame:
    text: El apartamento nuevo es más grande que el {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: El apartamento nuevo es más grande que el {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: آپارتمان جدید از قدیمی بزرگ‌تر است. الگوی Más + صفت + que دو چیز را با هم مقایسه می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit15.lesson02.choose.002
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: در اسپانیایی مقایسه با más ... que (بیشتر از)، menos ... que (کمتر از) و tan ... como (به اندازهٔ) انجام می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit15.lesson04.translate.001
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: translation
  frame:
    text: ما تیم خوبی هستیم.
    language_code: fa
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Somos un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Bueno پیش از اسم مذکر مفرد به buen کوتاه می‌شود: un buen equipo.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit15.lesson04.listen.002
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tan bien como یعنی به خوبیِ: cocinas tan bien como yo.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit15.lesson05.fill.001
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: fill_in_blank
  frame:
    text: El apartamento nuevo tiene más {item} para cocinar. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Más پیش از اسم یعنی مقدار بیشتری از آن: más espacio، یعنی جای بیشتر.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit15.lesson05.match.002
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mudarse یعنی اسباب‌کشی کردن؛ ماتئو می‌گوید quiero mudarme چون خودش است که اسباب‌کشی می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit15.lesson06.order.001
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: word_order
  frame:
    text: El viejo es más pequeño. Por eso quiero {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: El viejo es más pequeño. Por eso quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: آپارتمان قدیمی کوچک‌تر است. برای همین می‌خواهم اسباب‌کشی کنم. Por eso یعنی برای همین.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit15.lesson06.translate.002
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Viejo هم برای چیزها و هم برای آدم‌ها به معنی قدیمی/پیر است؛ nuevo متضاد آن است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit15.lesson06.fill.003
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: fill_in_blank
  frame:
    text: Tú {item} tan bien como yo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: الگوی Tan + قید + como دو نفر را که کاری را به یک اندازه خوب انجام می‌دهند مقایسه می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit15.lesson06.translate.004
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: خیلی منطقی است.
    language_code: fa
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Tiene mucho {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'در اسپانیایی می‌گویند «خیلی معنا دارد»: tiene mucho sentido.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit15.lesson06.choose.005
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '¡Exacto! راهی سریع برای موافقت است: دقیقاً.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-es.es.a1.unit15.lesson05.translate.003
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Espacio یعنی فضا یا جا؛ más espacio para cocinar یعنی جای بیشتر برای آشپزی.
    language_code: fa
    direction: rtl
