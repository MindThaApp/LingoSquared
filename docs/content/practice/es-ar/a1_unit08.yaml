    language_code: es
    direction: ltr
  slots:
    a: *id003
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: كم {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: El artículo ال en التفاح significa «las manzanas», así que la pregunta se refiere a unas manzanas concretas.
    language_code: es
    direction: ltr
