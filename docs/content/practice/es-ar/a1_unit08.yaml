  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: translation
  frame:
    text: Quiero dos manzanas, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La terminación del dual ـتين ya significa «dos», por eso no se usa un número aparte.
    language_code: es
    direction: ltr
