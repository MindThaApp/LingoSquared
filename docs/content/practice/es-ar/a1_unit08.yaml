    direction: ltr
- content_key: practice.es-ar.ar.a1.unit08.lesson02.translate.004
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
