    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit08.lesson02.listen.001
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تفاحتين es تفاحة («una manzana») con la terminación de dual ـين; la ة se convierte en ت ante ella, así que significa exactamente dos manzanas.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit08.lesson02.order.002
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: word_order
  frame:
    text: أريد {item} من فضلك.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El árabe tiene una forma especial de dual: تفاحتين es «dos manzanas», sin una palabra aparte para «dos».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit08.lesson02.fill.003
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: fill_in_blank
  frame:
