    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'La terminación de dual ـين indica dos de algo; ante ella, la ة de تفاحة se escribe ت: تفاحتين.'
