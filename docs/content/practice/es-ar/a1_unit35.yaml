      language_code: ar
      direction: rtl
  feedback_frame:
    text: El paquete llega mañana. يصل significa él llega; llega (masculino).
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit35.lesson03.fill.003
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: fill_in_blank
  frame:
    text: الطرد {item} فنقول يصل، والرسالة مؤنثة فنقول تصل. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
    hint:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: El paquete es masculino, así que decimos يصل (yaṣil). La carta es femenina, así que decimos تصل (taṣil). Un verbo en presente empieza con ي si el sujeto es masculino y con ت si es femenino, como en الطرد يصل (aṭ-ṭard yaṣil) y الرسالة تصل.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit35.lesson03.translate.004
