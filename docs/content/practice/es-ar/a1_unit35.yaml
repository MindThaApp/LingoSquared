  type: translation
  frame:
    text: El paquete llega mañana y la carta tarda tres días.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_والرسالة
  answer_derivation:
    kind: render_frame
    frame:
      text: الطرد يصل غدا {item} تستغرق ثلاثة أيام.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: El paquete llega mañana y la carta tarda tres días. والرسالة significa y la carta.
    language_code: es
    direction: ltr
