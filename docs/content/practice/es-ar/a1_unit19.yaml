    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: بيتك es بيت (casa) más ـك (tu); عندك significa «tienes».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson01.order.004
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: word_order
  frame:
    text: في بيتي {item} واحدة.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: في بيتي {item} واحدة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El número uno va después del sustantivo y concuerda con él: غرفة واحدة es femenino.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson01.order.005
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: word_order
  frame:
    text: في بيتي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: في بيتي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في بيتي abre la oración y significa «en mi casa»; lo que hay dentro va después.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson01.fill.006
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: fill_in_blank
  frame:
    text: في {item} غرفة واحدة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La terminación ـي en بيت significa «mi».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson01.translate.007
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Son cuatro sustantivos de la casa: casa, habitación, cocina y mesa.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson01.translate.008
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: translation
  frame:
    text: En mi casa hay una habitación.
    language_code: es
    direction: ltr
  slots:
    a: *id005
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: في {a} {b} واحدة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El árabe no tiene un verbo para «hay»: في بيتي غرفة es literalmente «en mi casa una habitación».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson02.choose.001
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: طاولة es una mesa; ال en الغرفة la convierte en «la habitación».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson02.listen.002
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عندك significa «tienes»; se forma con عند más la terminación ـك.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson02.order.003
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: عندي طاولة في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي طاولة في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في الغرفة es «en la habitación», con ال para una habitación concreta.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson02.order.004
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: أين {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La terminación ـك significa «tu», así que أين بيتك؟ es «¿dónde está tu casa?».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson02.order.005
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: هل {item} طاولة؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {item} طاولة؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'هل forma una pregunta de sí o no: هل عندك طاولة؟ es «¿tienes una mesa?».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson02.fill.006
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: fill_in_blank
  frame:
    text: في بيتي غرفة واحدة {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'La و se une a la palabra siguiente: ومطبخ significa «y una cocina».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson02.translate.007
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Las terminaciones ـي («mi») y ـك («tu») se añaden a بيت.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson02.translate.008
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: Tengo una mesa en la habitación.
    language_code: es
    direction: ltr
  slots:
    a: *id012
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La expresión في الغرفة mantiene ال después de في.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson02.translate.009
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: ¿Tienes una mesa?
    language_code: es
    direction: ltr
  slots:
    a: *id009
    b: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هل abre la pregunta y el orden de las palabras no cambia.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson02.translate.010
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: ¿Dónde está tu casa, Yusuf?
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item} يا يوسف
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Layla le pregunta a Yusuf usando la terminación ـك, que significa «tu».
    language_code: es
    direction: ltr
