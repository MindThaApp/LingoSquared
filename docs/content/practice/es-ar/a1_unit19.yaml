templates:
- content_key: practice.es-ar.ar.a1.unit19.lesson01.choose.001
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: بيت es casa, غرفة es habitación y مطبخ es cocina; aquí estos sustantivos no llevan ال.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson01.listen.002
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: في بيتي غرفة واحدة significa «en mi casa hay una habitación»; غرفة es el sustantivo «habitación».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit19.lesson01.match.003
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: matching_pairs
