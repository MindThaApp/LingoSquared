  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: translation
  frame:
    text: 'Yusuf le pregunta a Layla: «¿Qué hiciste ayer?»'
    language_code: es
    direction: ltr
  slots:
    a: *id008
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: فعلت es la forma de «tú» en pasado; se escribe igual para un hombre o una mujer.
    language_code: es
    direction: ltr
