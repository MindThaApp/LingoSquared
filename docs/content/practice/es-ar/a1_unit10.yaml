templates:
- content_key: practice.es-ar.ar.a1.unit10.lesson01.choose.001
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يمين es el sustantivo «derecha» y اليسار es «la izquierda» con ال añadido; el artículo ال lo convierte en «la izquierda».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson01.listen.002
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الأمام significa «el frente», y إلى الأمام es «todo recto».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson01.order.003
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: word_order
  frame:
    text: امش إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'إلى («a», «hacia») va antes de la dirección, que lleva ال: الأمام, اليمين o اليسار.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson01.fill.004
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: fill_in_blank
  frame:
    text: امش إلى {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: إلى الأمام es la forma habitual de decir «todo recto».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson01.translate.005
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: يمين es «derecha» (dirección), lo opuesto de يسار.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson01.translate.006
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: Camina todo recto. (a un hombre)
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: امش es una orden dirigida a un hombre; إلى الأمام significa «hacia delante».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson01.translate.007
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: Camina a la derecha. (a un hombre)
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La dirección que sigue a إلى lleva ال: اليمين es «la derecha».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson02.choose.001
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: امش es la orden «camina», dirigida a un hombre; ثم significa «luego».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson02.listen.002
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'ثم une dos pasos en orden: «luego».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson02.order.003
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: word_order
  frame:
    text: امش إلى الأمام ثم إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى الأمام ثم إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ثم («luego») enlaza el primer paso con el segundo, cada uno con su propio إلى.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson02.fill.004
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: fill_in_blank
  frame:
    text: امش إلى الأمام {item} إلى اليمين. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ثم significa «luego» y va entre las dos direcciones.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson02.fill.005
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: fill_in_blank
  frame:
    text: أين المكتبة؟ {item} إلى الأمام. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: امش es una orden dirigida a un solo hombre; la respuesta a أين المكتبة؟ da indicaciones.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson02.translate.006
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ثم significa «luego»; امش significa «camina», dicho a un hombre.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson02.translate.007
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: translation
  frame:
    text: Camina todo recto y luego a la derecha. (a un hombre)
    language_code: es
    direction: ltr
  slots:
    a: *id004
    b: *id007
    c: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {a} {b} إلى {c}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El recorrido tiene dos pasos: primero recto, luego a la derecha.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit10.lesson02.translate.008
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: translation
  frame:
    text: Camina a la izquierda. (a un hombre)
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: اليسار es «la izquierda»; lo opuesto es اليمين.
    language_code: es
    direction: ltr
