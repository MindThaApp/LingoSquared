templates:
- content_key: practice.es-ar.ar.a1.unit16.lesson01.choose.001
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تذكرة es «billete», القطار es «el tren» y القاهرة es «El Cairo».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson01.listen.002
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: إلى significa «a», así que إلى القاهرة es «a El Cairo».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson01.match.003
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أي («qué», «cuál») va delante de un sustantivo singular; الثاني («el segundo») va después del sustantivo al que describe.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson01.order.004
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: word_order
  frame:
    text: أريد {item} إلى القاهرة.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} إلى القاهرة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Lo que se quiere va después de أريد, y إلى («a») introduce el destino.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson01.order.005
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: word_order
  frame:
    text: أريد تذكرة إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد تذكرة إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: El destino va justo después de إلى; la ال de القاهرة forma parte del nombre de la ciudad.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson01.fill.006
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: fill_in_blank
  frame:
    text: أريد {item} إلى القاهرة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تذكرة es «billete»; أريد («quiero») no necesita una palabra aparte para «yo».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson01.translate.007
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Son dos sustantivos comunes y el nombre de una ciudad; la ال de القاهرة forma parte del propio nombre.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson01.translate.008
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: Quiero un billete a El Cairo, por favor. (no hay una palabra aparte para «yo»)
    language_code: es
    direction: ltr
  slots:
    a: *id003
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} إلى {b} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Una petición de billete es أريد más el billete más إلى y el destino.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson01.translate.009
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: Quiero un billete. El tren sale a las cinco. (no hay una palabra aparte para «yo»)
    language_code: es
    direction: ltr
  slots:
    a: *id003
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a}. {b} في الساعة الخامسة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La hora se expresa con في الساعة más un ordinal femenino: الساعة الخامسة.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson02.choose.001
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الرصيف es «el andén», con ال porque es un andén concreto.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson02.listen.002
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الثاني es «segundo» en masculino; concuerda con el sustantivo masculino الرصيف.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson02.order.003
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: word_order
  frame:
    text: من أي {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: من أي {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Después de أي («qué», «cuál») va un sustantivo sin ال: من أي رصيف؟ es «¿de qué andén?».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson02.order.004
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: word_order
  frame:
    text: من الرصيف {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: من الرصيف {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El ordinal va después del sustantivo y también lleva ال: الرصيف الثاني.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson02.fill.005
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: fill_in_blank
  frame:
    text: من أي {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Después de أي el sustantivo no lleva ال: من أي رصيف؟'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson02.fill.006
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: fill_in_blank
  frame:
    text: من الرصيف {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'El ordinal repite la ال del sustantivo: الرصيف الثاني.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson02.translate.007
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Estas palabras sirven para hablar del andén; أي significa «qué» o «cuál».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson02.translate.008
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: ¿De qué andén?
    language_code: es
    direction: ltr
  slots:
    a: *id010
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: من {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La pregunta es من más أي más un sustantivo sin ال.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit16.lesson02.translate.009
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: Del segundo andén.
    language_code: es
    direction: ltr
  slots:
    a: *id011
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: من {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Tanto el sustantivo como el ordinal llevan ال: الرصيف الثاني.'
    language_code: es
    direction: ltr
