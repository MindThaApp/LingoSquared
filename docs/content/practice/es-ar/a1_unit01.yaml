templates:
- content_key: practice.es-ar.ar.a1.unit01.lesson01.choose.001
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: El árabe se escribe de derecha a izquierda, y ر y ا nunca se unen a la letra que les sigue.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson01.match.002
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: مرحبا empieza por م a la derecha, porque el árabe se lee de derecha a izquierda.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson01.translate.003
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Las vocales breves suelen omitirse en la escritura árabe; el lector las deduce a partir de la palabra.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson02.listen.001
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En árabe se saluda según la hora del día: صباح الخير por la mañana y مساء الخير a partir de la tarde.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson02.match.002
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عفوا es la respuesta habitual a شكرا, y مع السلامة es la despedida de todos los días.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson02.order.003
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: word_order
  frame:
    text: شكرا، مع {item}!
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: شكرا، مع {item}!
      language_code: ar
      direction: rtl
  feedback_frame:
    text: مع السلامة significa literalmente «con seguridad»; ال es el artículo «el/la», que se une al sustantivo.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson02.translate.004
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: translation
  frame:
    text: Gracias, adiós.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: شكرا، مع {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El artículo definido ال se une al principio del sustantivo: سلامة («seguridad») pasa a ser السلامة («la seguridad»).'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson03.choose.001
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Muchos saludos van en pareja: un saludo y su respuesta habitual, como صباح الخير y صباح النور.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson03.order.002
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: word_order
  frame:
    text: أهلا وسهلا! أهلا {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أهلا وسهلا! أهلا {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: بك significa «a ti»; la forma escrita es la misma para un hombre o una mujer.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson03.fill.003
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: fill_in_blank
  frame:
    text: تصبح على {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تصبح على خير significa literalmente «que amanezcas en el bien»; se dice al despedirse por la noche.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson03.translate.004
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ال en النور y اللقاء es el artículo definido árabe, escrito unido al sustantivo.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson03.translate.005
  lesson_content_key: ar.a1.unit01.lesson03.time_and_farewells
  type: translation
  frame:
    text: ¡Buenas noches! (a un hombre)
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: تصبح على {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'A una mujer, el verbo lleva la terminación ـين: تصبحين على خير.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson04.choose.001
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ممتاز es la forma masculina; una mujer dice ممتازة.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson04.match.002
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: الحمد لله significa literalmente «alabado sea Dios», y es una respuesta muy común a «¿cómo estás?».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson04.order.003
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: word_order
  frame:
    text: بخير، {item} لله.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: بخير، {item} لله.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Después de الحمد viene لله, una forma unida de ل («para») y الله («Dios»).
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson04.fill.004
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: fill_in_blank
  frame:
    text: كيف {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: حال significa «estado» o «condición» y la terminación ـك significa «tu», así que la pregunta es literalmente «¿cómo está tu condición?».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson04.translate.005
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'وأنت es و («y») escrita unida a أنت («tú»): «y tú».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit01.lesson04.translate.006
  lesson_content_key: ar.a1.unit01.lesson04.wellbeing_exchange
  type: translation
  frame:
    text: ¿Cómo estás? (a un hombre)
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: كيف {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La palabra escrita حالك es la misma para un hombre y para una mujer; al hablar, solo cambia la vocal breve final.
    language_code: es
    direction: ltr
