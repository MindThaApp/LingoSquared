      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La palabra para «color» es masculina, así que el color que va después también es masculino: quiero el rosa. أريد (urīd) significa «quiero» o «quisiera». Compara con الورود وردية (las rosas son rosas): un plural de cosas lleva un adjetivo en femenino singular.'
    language_code: es
    direction: ltr
