schema_version: '1.0'
pack_key: practice.es-ar.a1.unit15
source_language: es
target_language: ar
unit_content_key: ar.a1.unit15.comparisons
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ar by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_أكبر
    - w_أصغر
    - w_أقرب
    - w_أرخص
    - w_والسوق
slot_presets:
  l1: &id001
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic:
      - w_أكبر
      - w_أصغر
      - w_أقرب
  comp4: &id002
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic:
      - w_أكبر
      - w_أصغر
      - w_أقرب
      - w_أرخص
  l2: &id005
    language_code: ar
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic:
      - w_أرخص
      - w_والسوق
      - w_أكبر
      - w_أقرب
  akbar:
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أكبر
  asghar: &id003
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أصغر
  aqrab: &id004
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أقرب
  arkhas: &id006
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أرخص
  walsuq: &id007
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_والسوق
templates:
- content_key: practice.es-ar.ar.a1.unit15.lesson01.choose.001
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكبر, أصغر y أقرب son comparativos; cada uno va seguido de من («que»).
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson01.listen.002
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'El adjetivo comparativo tiene una sola forma para comparar, seguida de من: أقرب من significa «más cerca que».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson01.order.003
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: السوق {item} من المقهى.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: السوق {item} من المقهى.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: El comparativo va entre las dos cosas comparadas, con من («que») delante de la segunda.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson01.order.004
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: المقهى {item} من السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El árabe no necesita una palabra para «es»: المقهى أصغر من السوق es, literalmente, «el café más pequeño que el mercado».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson01.fill.005
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: fill_in_blank
  frame:
    text: المقهى {item} من السوق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أصغر significa «más pequeño»; el mismo patrón da أكبر, «más grande».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson01.translate.006
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Los comparativos son adjetivos cortos del árabe, sin una palabra aparte para «más»; من va después.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson01.translate.007
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: El café es más pequeño que el mercado.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: El comparativo mantiene una sola forma y va seguido de من («que»).
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson01.translate.008
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: El café está más cerca que el mercado.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أقرب significa «más cerca», de la idea de «cercano», y va seguido de من.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson02.choose.001
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أرخص significa «más barato»; sigue el mismo patrón que los demás comparativos.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson02.listen.002
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: والسوق une و («y») a السوق («el mercado») en una sola palabra escrita.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson02.order.003
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: word_order
  frame:
    text: الماء {item} من القهوة.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أرخص significa «más barato»: الماء أرخص من القهوة quiere decir «el agua es más barata que el café».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson02.fill.004
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: fill_in_blank
  frame:
    text: الماء {item} من القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: «Más barato» usa el mismo patrón comparativo seguido de من.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson02.translate.005
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Estos son cuatro comparativos: más grande, más pequeño, más cerca y más barato.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson02.translate.006
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: El agua es más barata que el café.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El comparativo lleva من antes de la segunda cosa: «más barato que el café».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit15.lesson02.translate.007
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: El café está más cerca que el mercado, y el mercado es más grande que el café.
    language_code: es
    direction: ltr
  slots:
    a: *id004
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {a} من السوق، {b} أكبر من المقهى
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La و (y) se escribe unida a la palabra siguiente: والسوق.'
    language_code: es
    direction: ltr
