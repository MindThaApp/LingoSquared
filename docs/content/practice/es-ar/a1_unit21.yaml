templates:
- content_key: practice.es-ar.ar.a1.unit21.lesson01.choose.001
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ملابس es ropa, قميص es una camisa y أزرق es azul (masculino).
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson01.listen.002
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أريد قميصا أزرق significa «quiero una camisa azul»; la camisa lleva la terminación ـا por ser lo que se quiere.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson01.order.003
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: word_order
  frame:
    text: أريد {item} أزرق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} أزرق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Después de أريد, lo que se quiere termina en tanwin: قميصا, y el color va después del sustantivo.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson01.order.004
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: word_order
  frame:
    text: أريد قميصا {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد قميصا {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El adjetivo va después del sustantivo y concuerda con él: قميصا أزرق.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson01.fill.005
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: fill_in_blank
  frame:
    text: أريد {item} أزرق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قميصا es la forma que se usa para lo que se quiere después de أريد.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson01.translate.006
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ملابس es un sustantivo plural que significa ropa; قميص es una camisa y أزرق es un color.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson01.translate.007
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: translation
  frame:
    text: Quiero ropa. (sin palabra aparte para «yo»)
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أريد ya significa «quiero», así que no hace falta أنا.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson01.translate.008
  lesson_content_key: ar.a1.unit21.lesson01.item_color
  type: translation
  frame:
    text: Quiero una camisa azul. (sin palabra aparte para «yo»)
    language_code: es
    direction: ltr
  slots:
    a: *id002
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: El sustantivo lleva la terminación de objeto ـا y el color va después.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson02.choose.001
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: المقاس es la talla, con ال; el vendedor pregunta ما المقاس؟
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson02.listen.002
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: مقاس متوسط es una talla mediana; متوسط significa mediano.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson02.order.003
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: word_order
  frame:
    text: ما {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ما المقاس؟ pregunta «¿cuál es la talla?», con ال porque se trata de una talla concreta.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson02.order.004
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: word_order
  frame:
    text: مقاس {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: مقاس {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El adjetivo va después del sustantivo: مقاس متوسط es una talla mediana.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson02.order.005
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: word_order
  frame:
    text: تفضلي. {item} بعشرة دراهم.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: تفضلي. {item} بعشرة دراهم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: El vendedor dice تفضلي a una mujer y luego nombra la camisa con ال.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson02.fill.006
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: fill_in_blank
  frame:
    text: ما {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Con ال la palabra significa «la talla»: ما المقاس؟'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson02.fill.007
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: fill_in_blank
  frame:
    text: مقاس {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: متوسط significa mediano y va después del sustantivo مقاس.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson02.translate.008
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Son palabras cotidianas de compras: talla, mediano, ropa, azul y camisa.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson02.translate.009
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: translation
  frame:
    text: ¿Cuál es la talla?
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El árabe no necesita una palabra para «es»: ما المقاس؟ es literalmente «¿qué la talla?».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit21.lesson02.translate.010
  lesson_content_key: ar.a1.unit21.lesson02.size_purchase
  type: translation
  frame:
    text: Quiero una camisa azul. Talla mediana. (sin palabra aparte para «yo»)
    language_code: es
    direction: ltr
  slots:
    a: *id002
    b: *id003
    c: *id010
    d: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} {b}. {c} {d}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: مقاس متوسط por sí solo es la respuesta breve a la pregunta del vendedor ما المقاس؟
    language_code: es
    direction: ltr
