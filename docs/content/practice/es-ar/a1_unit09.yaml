templates:
- content_key: practice.es-ar.ar.a1.unit09.lesson01.choose.001
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: مكان es la palabra general para «lugar»; مكتبة es una biblioteca y مقهى, una cafetería.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson01.listen.002
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: هنا significa «aquí»; سوق es un mercado.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson01.match.003
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: قرب («cerca») es una preposición, mientras que هنا («aquí») es un adverbio; las otras cuatro son sustantivos.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson01.order.004
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: word_order
  frame:
    text: أين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أين pregunta «dónde»; el sustantivo de lugar lleva ال: la biblioteca, el mercado o la cafetería.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson01.fill.005
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: fill_in_blank
  frame:
    text: المكتبة {item} السوق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قرب («cerca») va antes del lugar junto al que se está, aquí el mercado.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson01.translate.006
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مكتبة (biblioteca), سوق (mercado) y مقهى (cafetería) son lugares; مكان es la palabra general «lugar».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson01.translate.007
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: ¿Dónde está la biblioteca?
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ال es el artículo determinado del árabe; se une al principio del sustantivo.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson01.translate.008
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: ¿Dónde está el mercado?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'En árabe no hace falta una palabra para «está»: أين السوق؟ es, literalmente, «¿dónde el mercado?».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson01.order.009
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: word_order
  frame:
    text: المكتبة {item} قرب السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المكتبة {item} قرب السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'هنا («aquí») puede ir antes de قرب: la biblioteca está aquí, cerca del mercado.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson02.choose.001
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: قرب significa «cerca»; va seguido directamente del sustantivo de lugar.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson02.listen.002
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'وأين es و («y») unida a أين («dónde»): «y dónde».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson02.order.003
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: word_order
  frame:
    text: المقهى قرب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى قرب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'قرب no necesita ninguna palabra extra: المقهى قرب المكتبة es «la cafetería está cerca de la biblioteca».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson02.order.004
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: word_order
  frame:
    text: وأين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: وأين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'وأين المقهى؟ continúa la conversación: «¿y dónde está la cafetería?».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson02.fill.005
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: fill_in_blank
  frame:
    text: أين المكتبة؟ {item} المقهى؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La و de وأين une la nueva pregunta con la anterior.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson02.translate.006
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: وأين es «y dónde», una pregunta de seguimiento; قرب es «cerca».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson02.translate.007
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: La biblioteca está cerca del mercado.
    language_code: es
    direction: ltr
  slots:
    a: *id004
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: المكتبة {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Los sustantivos de lugar después de قرب conservan el artículo: قرب السوق es «cerca del mercado».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit09.lesson02.translate.008
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: La cafetería está cerca de la biblioteca.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى قرب {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: El diálogo de la unidad responde a وأين المقهى؟ con esta misma oración.
    language_code: es
    direction: ltr
