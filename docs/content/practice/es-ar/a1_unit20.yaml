    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بارد significa frío y es masculino para concordar con الجو.
    language_code: es
    direction: ltr
