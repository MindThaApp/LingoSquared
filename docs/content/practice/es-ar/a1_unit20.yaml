templates:
- content_key: practice.es-ar.ar.a1.unit20.lesson01.choose.001
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الجو es el tiempo; مشمس es soleado y بارد es frío.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit20.lesson01.listen.002
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الجو مشمس اليوم significa «hoy hace sol»; مشمس describe a الجو.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit20.lesson01.match.003
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: الجو (el tiempo) es un sustantivo; مشمس, بارد y حار son adjetivos que lo describen.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit20.lesson01.order.004
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: word_order
  frame:
    text: الجو {item} اليوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: الجو {item} اليوم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El adjetivo va justo después de الجو, sin ninguna palabra para «es»: الجو بارد significa «hace frío».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit20.lesson01.fill.005
