templates:
- content_key: practice.es-ar.ar.a1.unit14.lesson01.choose.001
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحب es el verbo «me gusta»; va seguido directamente de lo que te gusta.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson01.listen.002
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'ولا es و («y») más لا («no»): «y no».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson01.match.003
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أحب es «me gusta» y أفضل es «prefiero»; ولا («y no») une una frase negativa a la anterior.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson01.order.004
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Lo que gusta va después de أحب, con ال para la clase en general: أحب القهوة es «me gusta el café».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson01.order.005
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: لا أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: لا أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'لا delante del verbo lo niega: لا أحب es «no me gusta».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson01.fill.006
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أحب القهوة {item} أحب الشاي. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ولا une una cláusula negativa: «Me gusta el café y no me gusta el té».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson01.fill.007
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أنا {item} الماء. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنا («yo») se puede añadir para dar énfasis, pero أحب por sí solo ya significa «me gusta».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson01.translate.008
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: شاي es «té» sin artículo, mientras que الماء es «el agua» con ال; أحب significa «me gusta».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson01.translate.009
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: Me gusta el agua. (no hay una palabra aparte para «yo»)
    language_code: es
    direction: ltr
  slots:
    a: *id005
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Después de أحب, el árabe usa ال para referirse a algo en general, así que «me gusta el agua» es أحب الماء.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson01.translate.010
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: Esto es té.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Sin ال, شاي es simplemente «té», y el árabe no necesita una palabra para «es»: هذا شاي.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson02.choose.001
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أفضل significa «prefiero»; تفضل, con el prefijo ت, es la forma masculina de «tú».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson02.listen.002
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تفضل significa «prefieres», dirigido a un hombre: ماذا تفضل يا يوسف؟'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson02.order.003
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
    text: ماذا {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: El prefijo ت marca «tú»; ماذا تفضل؟ le pregunta a un hombre qué prefiere.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson02.order.004
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
    text: أفضل {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أفضل {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'أفضل va seguido de lo que se prefiere, con ال: أفضل القهوة.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson02.fill.005
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: fill_in_blank
  frame:
    text: أنا {item} القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أفضل significa «prefiero»; el prefijo أ marca «yo», como en أحب y أريد.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson02.translate.006
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أفضل significa «prefiero» y تفضل significa «prefieres» (masc.); el prefijo أ o ت indica quién.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit14.lesson02.translate.007
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: translation
  frame:
    text: ¿Qué prefieres, Yusuf?
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} يا يوسف
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Yusuf es un hombre, así que la forma para «tú» es تفضل.
    language_code: es
    direction: ltr
