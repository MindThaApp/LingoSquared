templates:
- content_key: practice.es-ar.ar.a1.unit11.lesson01.choose.001
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'أستيقظ, أدرس y أنام son verbos en presente de primera persona: me despierto, estudio, duermo.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson01.listen.002
