    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Las horas son ordinales femeninos que concuerdan con الساعة: السابعة es «la séptima».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson01.order.005
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: word_order
  frame:
    text: أنا {item} كل يوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item} كل يوم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Los verbos de la unidad están en primera persona: أستيقظ, أدرس y أنام; أنا (yo) es opcional.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson01.order.006
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: word_order
  frame:
    text: أستيقظ في الساعة {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أستيقظ في الساعة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La hora va después de الساعة y es femenina: الساعة السابعة.'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson01.fill.007
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: fill_in_blank
  frame:
    text: أدرس في الساعة {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: التاسعة es «la novena», en femenino para concordar con الساعة.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson01.translate.008
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Son verbos y ordinales femeninos de la hora; los verbos están todos en primera persona.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson01.translate.009
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: Me despierto a las siete. (sin palabra aparte para «yo»)
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أستيقظ في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: La hora es un ordinal femenino porque الساعة es femenino.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson01.translate.010
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: Estudio a las nueve. (sin palabra aparte para «yo»)
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: أدرس في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Los verbos en primera persona no necesitan pronombre: أدرس solo significa «estudio».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson01.translate.011
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: translation
  frame:
    text: Me duermo a las diez. (sin palabra aparte para «yo»)
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: أنام في الساعة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: العاشرة es «la décima» y termina en ة como las demás horas femeninas.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson02.listen.001
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ماذا es la palabra interrogativa «qué»; ماذا تفعل؟ significa «¿qué haces?».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson02.choose.002
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تفعل es la forma masculina de «tú haces»; ماذا تفعل كل يوم؟ le pregunta a un hombre qué hace cada día.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson02.order.003
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: word_order
  frame:
    text: ماذا {item} كل يوم؟
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} كل يوم؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El verbo va justo después de ماذا: ماذا تفعل؟ es «¿qué haces?».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson02.fill.004
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: fill_in_blank
  frame:
    text: ماذا تفعل كل {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كل يوم es «cada día», con يوم (día) después de كل (cada).
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson02.translate.005
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تفعل es la forma masculina: «tú haces». ماذا es «qué».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson02.translate.006
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: translation
  frame:
    text: ¿Qué haces cada día? (a un hombre)
    language_code: es
    direction: ltr
  slots:
    a: *id013
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b} كل يوم'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Primero va la palabra interrogativa y después el verbo: ماذا تفعل.'
    language_code: es
    direction: ltr
