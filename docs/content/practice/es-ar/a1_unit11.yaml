  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'كل يوم significa «cada día»: كل (cada) más يوم (día).'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit11.lesson01.match.003
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: matching_pairs
