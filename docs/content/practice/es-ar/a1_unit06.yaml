templates:
- content_key: practice.es-ar.ar.a1.unit06.lesson01.choose.001
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أب es «padre» y أم es «madre»; عندي es una sola palabra que significa «tengo».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson01.listen.002
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عائلة significa «familia»; la misma palabra con una terminación posesiva, عائلتك, aparece en la próxima lección.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson01.match.003
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عندي expresa la idea de «tengo» en una sola palabra; las palabras de parentesco son أب، أم، أخ y أخت.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson01.order.004
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: word_order
  frame:
    text: عندي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'عندي más un sustantivo significa «tengo»: عندي أخت es «tengo una hermana».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson01.fill.005
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: fill_in_blank
  frame:
    text: عندي {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أخت es «hermana»; su equivalente masculino es أخ.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson01.translate.006
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Estas palabras de familia son sustantivos; أب es «padre» y أم es «madre».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson01.translate.007
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: Tengo una hermana.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'El árabe no tiene artículo indefinido («un», «una»): عندي أخت es literalmente «tengo hermana».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson01.translate.008
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: translation
  frame:
    text: Tengo un hermano.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أخ («hermano») y أخت («hermana») se diferencian solo por la ت final.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson01.order.009
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: word_order
  frame:
    text: عندي {item} وأم.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item} وأم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'La conjunción و («y») se une a la palabra siguiente: وأم es «y madre».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson02.listen.001
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La terminación ـك en عائلتك significa «tu», así que عائلتك es «tu familia».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson02.choose.002
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يا se coloca delante de un nombre para llamar o dirigirse a una persona, como en يا يوسف.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson02.match.003
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'La terminación ـك significa «tu»: عائلتك es «tu familia» y أختك es «tu hermana».'
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson02.order.004
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: word_order
  frame:
    text: من في {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: من في {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: من في عائلتك؟ pregunta «¿quién hay en tu familia?»; يا يوسف se dirige a Yusuf.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson02.fill.005
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: ما {item} أختك؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اسم significa «nombre»; ما اسم أختك؟ pregunta «¿cómo se llama tu hermana?».
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson02.fill.006
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: fill_in_blank
  frame:
    text: عندي أب {item} وأخت. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و («y») se escribe unida a la palabra siguiente, así que «y madre» es وأم.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson02.translate.007
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اسمها es اسم más ـها, lo que significa «su nombre» (de ella).
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson02.translate.008
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: 'Layla le pregunta a Yusuf: ¿Cómo se llama tu hermana?'
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: ما اسم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أختك se escribe igual si quien escucha es hombre o mujer; aquí se habla con Yusuf.
    language_code: es
    direction: ltr
- content_key: practice.es-ar.ar.a1.unit06.lesson02.translate.009
  lesson_content_key: ar.a1.unit06.lesson02.family_description
  type: translation
  frame:
    text: Su nombre es Nour.
    language_code: es
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: اسمها {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: اسمها es «nombre» más ـها («su», de ella), así que no hace falta una palabra aparte para «es».
    language_code: es
    direction: ltr
