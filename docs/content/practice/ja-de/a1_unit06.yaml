templates:
- content_key: practice.ja-de.de.a1.unit06.lesson01.choose.001
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Eltern は両親、Geschwister は兄弟姉妹を意味し、どちらも複数を表す集合的な単語です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson02.listen.002
  lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ドイツ語では、いとこを性別で区別し、男性には Cousin、女性には Cousine を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson03.choose.003
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Einzelkind は、文字どおりには「一人の子」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson04.choose.004
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lehrerin は教師を表す女性形です。また、Bruder の複数形では母音が変化し、Brüder になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson01.order.005
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: word_order
  frame:
    text: Das ist meine {item}.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Das ist meine {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 所有冠詞は名詞に合わせます。ここではすべて女性名詞なので、meine を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson03.order.006
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: word_order
  frame:
    text: Haben Sie {item}?
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Haben Sie {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Haben Sie は敬称の「あなた」に対する表現です。はい・いいえで答える疑問文では、動詞を文頭に置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson04.order.007
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: word_order
  frame:
    text: Meine {item} ist Lehrerin.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Meine {item} ist Lehrerin.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 女性名詞には meine を使います：meine Schwester、meine Tante、meine Cousine。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson01.match.008
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: de
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Eltern（両親）には複数形しかなく、Geschwister（兄弟姉妹）は兄弟と姉妹をまとめて表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson02.match.009
  lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: de
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cousine の語末の e は、女性のいとこであることを示します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson03.fill.010
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: fill_in_blank
  frame:
    text: Ich {item} zwei Schwestern. ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ich habe は「私は～を持っています」という意味です。ich の後では、動詞は文の2番目の位置に置かれます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson03.fill.011
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: fill_in_blank
  frame:
    text: Ich bin {item}. ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Einzelkind は名詞なので、先頭を大文字にします。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson04.fill.012
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: fill_in_blank
  frame:
    text: Ist das {item} Familie? ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Familie は女性名詞なので、敬称の「あなたの」には、大文字で始まる Ihre を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson01.translate.013
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 家族を表す単語を含め、ドイツ語の名詞はすべて先頭を大文字にします。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson03.translate.014
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: 私には姉妹が2人います。
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich habe zwei {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Schwester の複数形には -n が付きます：zwei Schwestern。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson02.translate.015
  lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
  type: translation
  frame:
    text: あなたのお父様はどなたですか？（敬称）
    language_code: ja
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Wer ist {item} Vater?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Vater は男性名詞なので、敬称の「あなたの」には Ihre ではなく Ihr を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson03.translate.016
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: こちらは私の母です。
    language_code: ja
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Das ist {item} Mutter.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Mutter は女性名詞なので、「私の」は meine になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson04.translate.017
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: translation
  frame:
    text: ご兄弟はいますか？（敬称）
    language_code: ja
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Haben Sie {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Brüder は Bruder の複数形で、ウムラウトが付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit06.lesson03.translate.018
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: いいえ、兄弟姉妹はいません。
    language_code: ja
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Nein, ich habe {item} Geschwister.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 複数名詞や女性名詞の前で「一人もない」「一つもない」と表すには、Keine を使います。
    language_code: ja
    direction: ltr
