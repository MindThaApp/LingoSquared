templates:
- content_key: practice.ja-de.de.a1.unit01.lesson01.choose.001
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Guten Morgen は朝、Guten Tag は日中、Guten Abend は夕方以降に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson02.listen.001
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tschüss はくだけた別れの挨拶で、Auf Wiedersehen は知らない人や改まった場面で使う丁寧な表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson03.choose.001
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ドイツ語には「あなた」を表す語が2つあります。Sie は知らない人や公的な立場の人に使う丁寧な形で、du は友達、家族、子どもに使うくだけた形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson04.listen.001
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bitte は「お願いします」と「どういたしまして」の両方を表し、Entschuldigung は人の注意を引くときや謝るときに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson03.order.002
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: word_order
  frame:
    text: Wie geht es {item}?
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Wie geht es Ihnen? は丁寧な「お元気ですか？」です。友達には Wie geht's? と尋ねます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson02.order.002
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: word_order
  frame:
    text: Bis {item}!
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Bis {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bis は「～まで」という意味なので、Bis bald は「また近いうちに」、Bis später は「またあとで」に当たります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson01.order.002
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: word_order
  frame:
    text: Guten {item}!
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Guten {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Morgen、Tag、Abend は男性名詞なので、Guten の語尾は -n になります。女性名詞の Nacht には Gute Nacht を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson02.match.003
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: de
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Tschüss はくだけた表現で、Auf Wiedersehen はあまり親しくない人に使う丁寧な別れの挨拶です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson03.match.003
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: de
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 丁寧な言い方では Sie、Ihnen、Ihr を大文字で始めますが、du と dir は小文字で始めます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson04.match.002
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: de
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Danke と bitte は日常的な2つの丁寧表現です。bitte は「どういたしまして」という意味にもなります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson03.fill.004
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: fill_in_blank
  frame:
    text: Und {item}? ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ここでのくだけた形は、小文字で始まる dir です。丁寧な尋ね方は Und Ihnen? です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson04.fill.003
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: fill_in_blank
  frame:
    text: '{item} geschehen. ({hint})'
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gern geschehen は danke に対する一般的な返答で、直訳すると「喜んでそうしました」のような意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson01.translate.003
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ドイツ語ではすべての名詞を大文字で始めるため、Morgen、Tag、Abend、Nacht も大文字で始まります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson03.translate.005
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sie と du は「あなた」を表す主格の形で、Ihnen と dir は「あなたに」を表す形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson04.translate.004
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kein Problem は、お礼や軽い謝罪に対する日常的な返答です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson01.translate.004
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: translation
  frame:
    text: よい{item}を！
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Guten {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Guten Tag は午前の遅い時間から使え、一般的な「こんにちは」としても使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson02.translate.004
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: translation
  frame:
    text: また{item}！
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Bis {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bis bald と Bis später はどちらもくだけた表現で、Auf Wiedersehen は丁寧な別れの挨拶です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit01.lesson03.translate.006
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: translation
  frame:
    text: お元気ですか？（丁寧）
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: 丁寧な言い方では Sie と Ihnen を大文字で始めるため、Ihnen の大文字の I も正しいつづりの一部です。
    language_code: ja
    direction: ltr
