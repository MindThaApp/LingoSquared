templates:
- content_key: practice.ja-de.de.a1.unit02.lesson01.choose.001
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ich は文頭でのみ大文字になり、文の途中では ich と小文字で書きます。日本語の「私」には、このような文中の位置による表記の変化はありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson02.listen.001
  lesson_content_key: de.a1.unit02.lesson02.ich_bin_du_bist
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 動詞の語尾は主語の人称によって変化します：ich komme、du kommst。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson04.choose.001
  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Woher は「どこから」と尋ねる語で、答えには aus を使います：Ich komme aus Deutschland。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson01.listen.002
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Freut mich と Ganz meinerseits は、初対面の挨拶で使う丁寧な一組の表現です。「お会いできてうれしいです」「こちらこそ」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson01.order.003
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: word_order
  frame:
    text: Ich heiße {item}.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich heiße {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Heiße は heißen の ich に対応する形で、du と一緒に使うと heißt になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson02.order.002
  lesson_content_key: de.a1.unit02.lesson02.ich_bin_du_bist
  type: word_order
  frame:
    text: Du bist {item}.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Du bist {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bist は sein の du に対応する形で、ich には bin を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson04.order.002
  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
  type: word_order
  frame:
    text: Ich komme aus {item}.
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich komme aus {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: ここでは国名に冠詞を付けません：aus Deutschland、aus Frankreich。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson01.match.004
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: de
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ich bin と du bist の組み合わせから、動詞 sein が主語の人称によって変化することが分かります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson03.match.001
  lesson_content_key: de.a1.unit02.lesson03.laender
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: de
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ドイツ語では、ほとんどの国名に冠詞を付けません：Deutschland、Frankreich、Italien。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson04.fill.003
  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
  type: fill_in_blank
  frame:
    text: Ich komme {item} Deutschland. ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aus は、ある場所の出身であることを表す「〜から」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson04.fill.004
  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
  type: fill_in_blank
  frame:
    text: Woher {item} du? ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: du に対応する形は -st で終わります：du kommst。du bist も同じ語尾です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson01.fill.005
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: fill_in_blank
  frame:
    text: Wie {item} du? ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: du の語尾 -st は語幹末の ß と重なるため、heißst ではなく du heißt となります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson01.translate.006
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 動詞は主語の人称に応じて形が変わります：ich bin、du bist。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson04.translate.005
  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Komme と kommst は、同じ動詞の ich に対応する形と du に対応する形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson01.translate.007
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: translation
  frame:
    text: 私は{item}といいます。
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich heiße {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Ich heiße は直訳すると「私は〜と呼ばれます」で、ドイツ語ではこの表現を使って名前を伝えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson04.translate.006
  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
  type: translation
  frame:
    text: 私は{item}出身です。
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich komme aus {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 動詞は文の2番目の位置に置かれます：Ich komme aus England。
    language_code: ja
    direction: ltr
- content_key: practice.ja-de.de.a1.unit02.lesson04.translate.007
  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
  type: translation
  frame:
    text: どこの出身？（くだけた表現）
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Woher {item} du?
      language_code: de
      direction: ltr
  feedback_frame:
    text: 疑問詞 Woher を最初に置き、その後に動詞、du の順で続けます。
    language_code: ja
    direction: ltr
