templates:
- content_key: practice.pl-it.it.a1.unit05.lesson01.choose.001
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Godziny wyraża się w rodzaju żeńskim liczby mnogiej (le), ponieważ ore („godziny”) to żeński rzeczownik w liczbie mnogiej: sono le tre.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit05.lesson01.listen.002
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pierwsza to wyjątek: l''una jest w liczbie pojedynczej, więc używa się è, a nie sono.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit05.lesson01.order.003
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: word_order
  frame:
    text: Che {item} sono?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} sono?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che ore sono? dosłownie pyta „które godziny są?”, dlatego odpowiedź zaczyna się od sono le.
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit05.lesson01.fill.004
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: fill_in_blank
  frame:
    text: Sono {item} tre. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le zgadza się z ore, które jest domyślne: sono le tre znaczy „jest trzecia”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit05.lesson01.translate.005
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: translation
  frame:
    text: Jest {n}.
    language_code: pl
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le {n}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Sono le używa się przy każdej godzinie oprócz pierwszej, która brzmi l'una.
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit05.lesson02.choose.001
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'E dodaje minuty, a meno je odejmuje: le tre e mezzo to 3:30, le quattro meno un quarto to 3:45.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit05.lesson02.listen.002
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mezzo ma podwójne z; wymawiaj ten dźwięk nieco dłużej.
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit05.lesson02.order.003
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: word_order
  frame:
    text: Sono le tre e un {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le tre e un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'E un quarto dodaje piętnaście minut: le tre e un quarto to 3:15.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit05.lesson02.fill.004
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: fill_in_blank
  frame:
    text: Sono le tre e {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mezzo znaczy „połowa”, więc e mezzo dodaje trzydzieści minut.
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit05.lesson02.match.005
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
