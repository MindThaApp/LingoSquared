  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_divertente
        - w_calmo
        - w_paziente
        - w_curioso
        - w_trovo
        - w_vedi
        - w_timido
