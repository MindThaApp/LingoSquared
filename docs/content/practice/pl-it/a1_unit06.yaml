    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Questa i mia są rodzaju żeńskiego i zgadzają się z madre: to jest moja mama.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit06.lesson01.translate.005
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
