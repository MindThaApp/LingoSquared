templates:
- content_key: practice.pl-it.it.a1.unit06.lesson01.choose.001
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Z dzierżawczym rzeczowniki rodzinne w liczbie pojedynczej nie mają rodzajnika: mio padre, mia madre.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit06.lesson01.listen.002
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Padre i madre kończą się na -e, ale mają różny rodzaj, więc ucz się każdego razem z rodzajem; nonno i nonna kończą się na -o i -a.
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit06.lesson01.order.003
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: word_order
  frame:
    text: Questo è mio {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Questo è mio {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Questo i mio są rodzaju męskiego, więc łączą się z rzeczownikiem męskim: questo è mio padre.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit06.lesson01.fill.004
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: fill_in_blank
