    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Questa è mia {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Questa i mia stosuj z rzeczownikiem żeńskim, a questo i mio z męskim.
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit06.lesson01.translate.006
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
