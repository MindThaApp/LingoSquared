    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Madre i padre, fratello i sorella, nonno i nonna to pary słów rodzinnych: żeńskie i męskie.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit06.lesson02.choose.001
