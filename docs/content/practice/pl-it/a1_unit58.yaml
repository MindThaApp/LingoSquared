schema_version: '1.0'
pack_key: practice.pl-it.a1.unit58
source_language: pl
target_language: it
unit_content_key: it.a1.unit58.appuntamento
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Polish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_appuntamento
    - w_conferma
    - w_confermato
    - w_disponibile
    - w_fissare
    - w_informatica
    - w_maggio
    - w_ricordare
    - w_tredici
templates:
- content_key: practice.pl-it.it.a1.unit58.lesson01.choose.001
  lesson_content_key: it.a1.unit58.lesson01.fissare_un_appuntamento
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_fissare
        - w_appuntamento
        - w_disponibile
        - w_informatica
        - w_confermato
        - w_conferma
        - w_tredici
        - w_maggio
        - w_ricordare
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} to jedno ze słów z tej lekcji, z lekcji o umawianiu się na wizytę.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-it.it.a1.unit58.lesson02.listen.001
  lesson_content_key: it.a1.unit58.lesson02.un_orario_e_disponibile
