- content_key: practice.fr-ro.ro.a1.unit10.lesson01.translate.006
  lesson_content_key: ro.a1.unit10.lesson01.dimineata
  type: translation
  frame:
    text: Je me réveille le matin et je mange du pain.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Mă trezesc dimineața și {item} pâine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mănânc est la forme « je » du verbe qui signifie manger.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit10.lesson01.translate.007
  lesson_content_key: ro.a1.unit10.lesson01.dimineata
  type: translation
  frame:
    text: Je mange du pain et je bois du café le matin.
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Mănânc pâine și {item} cafea dimineața.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Beau signifie « je bois » ; le roumain omet eu, car les terminaisons de mănânc et de beau indiquent déjà « je ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit10.lesson02.translate.006
  lesson_content_key: ro.a1.unit10.lesson02.lucrez_merg_acasa
  type: translation
  frame:
    text: Je travaille le soir et je rentre à la maison la nuit.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrez seara și {item} acasă noaptea.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Merg acasă noaptea : seara et noaptea indiquent le moment, et acasă n’a pas besoin de préposition.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit10.lesson03.translate.004
