  type: translation
  frame:
    text: Je travaille le soir, puis je me couche la nuit.
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrez seara, apoi mă {item} noaptea.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mă culc s’emploie avec le pronom réfléchi mă ; apoi signifie « puis ».
    language_code: fr
    direction: ltr
