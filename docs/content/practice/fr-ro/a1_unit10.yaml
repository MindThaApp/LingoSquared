templates:
- content_key: practice.fr-ro.ro.a1.unit10.lesson01.choose.001
  lesson_content_key: ro.a1.unit10.lesson01.dimineata
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Trezesc, mănânc et beau sont des formes de la première personne (« je ») ; en roumain, la terminaison du verbe indique la personne, donc chaque forme s’apprend telle qu’elle se présente.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit10.lesson02.listen.001
  lesson_content_key: ro.a1.unit10.lesson02.lucrez_merg_acasa
