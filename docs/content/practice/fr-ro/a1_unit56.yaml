    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit56.lesson04.match.001
  lesson_content_key: ro.a1.unit56.lesson04.la_casa_de_bilete
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
