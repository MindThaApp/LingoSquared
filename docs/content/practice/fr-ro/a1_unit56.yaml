    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_ore
  answer_derivation:
    kind: render_frame
    frame:
      text: Concertul durează două {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Le concert dure deux heures. ore signifie « heures ».
    language_code: fr
    direction: ltr
