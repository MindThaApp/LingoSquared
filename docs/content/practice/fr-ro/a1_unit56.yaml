        - w_trupa
        - w_trupei
        - w_locul
        - w_ore
        - w_trupă
        - w_scena
        - w_publicul
        - w_parcul
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} est l’un des mots de cette unité, tiré de la leçon « Je veux aller au concert ».'
    language_code: fr
    direction: ltr
