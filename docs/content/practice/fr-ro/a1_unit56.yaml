  lesson_content_key: ro.a1.unit56.lesson01.vreau_sa_merg_la
  type: word_order
  frame:
    text: Aș vrea să merg la concertul {item}, vă rog.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_trupei
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș vrea să merg la concertul {item}, vă rog.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Je voudrais aller au concert du groupe, s’il vous plaît. trupei signifie « du groupe » (comme dans « le concert du groupe »).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit56.lesson03.order.002
  lesson_content_key: ro.a1.unit56.lesson03.la_ce_ora_incepe
