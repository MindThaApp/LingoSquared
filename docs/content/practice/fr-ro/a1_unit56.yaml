  lesson_content_key: ro.a1.unit56.lesson04.la_casa_de_bilete
  type: word_order
  frame:
    text: Da, aș vrea un bilet pentru {item}, vă rog.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
