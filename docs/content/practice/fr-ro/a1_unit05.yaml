templates:
- content_key: practice.fr-ro.ro.a1.unit05.lesson01.choose.001
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Meu et mea signifient tous deux « mon/ma » : meu va avec les noms masculins et neutres (tatăl meu) et mea avec les noms féminins (mama mea).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit05.lesson01.listen.002
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Părinți signifie « parents » et est un pluriel ; les deux parents sont mamă et tată.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit05.lesson01.match.003
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mamă et tată sont les noms sans article ; mama et tatăl ajoutent l’article défini à la fin.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit05.lesson01.translate.004
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le roumain place l’article défini à la fin du nom : mamă devient mama et tată devient tatăl.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit05.lesson01.order.005
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: word_order
  frame:
    text: Mama {item} și tatăl meu.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item} și tatăl meu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Le possessif s’accorde avec le nom : mama mea (féminin) mais tatăl meu (masculin).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit05.lesson01.fill.006
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: fill_in_blank
  frame:
    text: Mama mea și tatăl {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tatăl est masculin, il prend donc meu ; mama est féminin et prend mea.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit05.lesson01.translate.007
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: Ma mère.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'En roumain, le possessif se place après le nom : mama mea, et non mea mama.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit05.lesson02.choose.001
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le pluriel roumain modifie la terminaison : frate devient frați, soră devient surori, copil devient copii.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit05.lesson02.listen.002
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: listen_select
