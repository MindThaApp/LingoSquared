    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fiu signifie « fils » et fiică « fille » ; un homme marié se dit căsătorit.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit05.lesson02.match.003
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
