      language_code: ro
      direction: ltr
  feedback_frame:
    text: Elena habite près et va au travail à pied. locuiește signifie « il/elle habite ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit34.lesson06.order.002
  lesson_content_key: ro.a1.unit34.lesson06.hai_sa_mergem_impreuna
  type: word_order
  frame:
    text: Prefer să {item} mașina.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_conduc
  answer_derivation:
