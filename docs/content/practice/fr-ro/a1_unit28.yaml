schema_version: '1.0'
pack_key: practice.fr-ro.a1.unit28
source_language: fr
target_language: ro
unit_content_key: ro.a1.unit28.comunicare
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to French). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_atât
    - w_aud
    - w_bucur
    - w_crede
    - w_credeam
    - w_merge
    - w_mers
    - w_mesaj
    - w_mesajul
    - w_minute
    - w_mult
    - w_mândră
    - w_poți
    - w_repede
    - w_repeți
    - w_spun
    - w_sun
    - w_suna
    - w_suni
    - w_trebuie
    - w_trimit
    - w_vorbesc
    - w_vorbi
    - w_vorbiți
    - w_înapoi
    - w_înseamnă
templates:
- content_key: practice.fr-ro.ro.a1.unit28.lesson01.choose.001
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_suna
        - w_trebuie
        - w_sun
        - w_vorbesc
        - w_vorbiți
        - w_poți
        - w_repeți
        - w_vorbi
        - w_atât
        - w_repede
        - w_aud
        - w_mesajul
        - w_trimit
        - w_mesaj
        - w_înapoi
        - w_spun
        - w_minute
        - w_suni
        - w_mers
        - w_credeam
        - w_merge
        - w_crede
        - w_bucur
        - w_mândră
        - w_înseamnă
        - w_mult
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur la façon de dire qu’on appellera quelqu’un.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson02.listen.001
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur la façon de demander avec qui l’on est en ligne.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson03.translate.001
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur la façon de demander à quelqu’un de répéter.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson04.match.001
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Associe chaque mot roumain à sa signification en français ; les mots viennent des leçons de cette unité.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson05.choose.001
  lesson_content_key: ro.a1.unit28.lesson05.citim_o_conversatie_prin
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon consacrée à la lecture d’un échange de messages.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson06.translate.001
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur un appel téléphonique après le service.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson01.order.002
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: word_order
  frame:
    text: Trebuie să te {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_sun
  answer_derivation:
    kind: render_frame
    frame:
      text: Trebuie să te {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Je dois t’appeler. sun signifie « j’appelle ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson02.order.002
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: word_order
  frame:
    text: Cu cine {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbesc
  answer_derivation:
    kind: render_frame
    frame:
      text: Cu cine {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Avec qui est-ce que je parle ? Cu cine vorbesc? (littéralement « avec qui je parle ? ») est la formule habituelle pour demander qui est un interlocuteur inconnu au téléphone.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson03.order.002
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: word_order
  frame:
    text: Poți să {item} asta?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_repeți
  answer_derivation:
    kind: render_frame
    frame:
      text: Poți să {item} asta?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Peux-tu répéter ça ? Poți să ... (Peux-tu... ?) plus repeți (tu répètes) plus asta (ça).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson03.fill.003
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: fill_in_blank
  frame:
    text: Nu {item} atât de repede, te rog. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ne parle pas si vite, s’il te plaît. Nu vorbi (« ne parle pas ») est nu + la forme tu ; atât de repede signifie « si vite ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson03.translate.004
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: Je ne t’entends pas bien.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_aud
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu te {item} bine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Je ne t’entends pas bien. Nu te aud bine : aud signifie « j’entends », te (« te ») se place devant le verbe, et bine signifie « bien ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson04.order.002
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: word_order
  frame:
    text: Îți {item} un mesaj.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_trimit
  answer_derivation:
    kind: render_frame
    frame:
      text: Îți {item} un mesaj.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Je t’envoie un SMS. Îți (« à toi ») est un pronom au datif placé devant le verbe : Îți trimit un mesaj.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson04.fill.003
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: fill_in_blank
  frame:
    text: Te sun {item} mai târziu. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Je te rappelle plus tard. Înapoi (« en retour ») suit le verbe : te sun înapoi signifie « je te rappelle », et mai târziu signifie « plus tard ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson06.order.002
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: word_order
  frame:
    text: A {item} foarte bine, mai bine decât credeam.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_mers
  answer_derivation:
    kind: render_frame
    frame:
      text: A {item} foarte bine, mai bine decât credeam.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ça s’est très bien passé, mieux que je ne le pensais. A mers est le passé de a merge (aller, ici « se passer ») ; credeam signifie « je pensais » (forme passée de a crede).
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit28.lesson06.fill.003
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: fill_in_blank
  frame:
    text: Îți mulțumesc, {item} mult pentru mine. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Merci, ça compte beaucoup pour moi. Înseamnă est la forme il/elle de a însemna (signifier) ; pentru mine (« pour moi ») indique pour qui c’est important.
    language_code: fr
    direction: ltr
