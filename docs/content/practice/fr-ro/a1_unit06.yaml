    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Apă, cafea, ceai, suc et lapte sont les boissons de base ; sete (soif) s’emploie avec mi-e dans Mi-e sete.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit06.lesson01.match.003
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: matching_pairs
