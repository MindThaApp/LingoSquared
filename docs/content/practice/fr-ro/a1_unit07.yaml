    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scump signifie cher et ieftin signifie bon marché ; les deux décrivent le prix.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson02.match.001
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Costă est le verbe du prix ; kilogram, piață et les aliments sont ce qu’on achète.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson01.translate.003
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Costă est la forme de « ça coûte » : Cât costă? demande le prix et Costă opt lei y répond.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson01.order.004
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: word_order
  frame:
    text: Costă cinci {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Après les nombres de deux à dix-neuf, le pluriel lei n’a pas de de : opt lei. À partir de vingt, il apparaît : treizeci de lei.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson01.fill.005
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: fill_in_blank
  frame:
    text: Cât {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cât costă? est la question de base sur le prix ; costă est la forme « il/elle coûte » du verbe.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson01.translate.006
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: translation
  frame:
    text: Ça coûte huit lei.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Lei est le pluriel de leu et s’emploie avec les nombres : opt lei.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson02.choose.002
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vreau signifie « je veux » ; unde signifie « où », et pot signifie « je peux » dans Unde pot...?
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson02.listen.003
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cumpăr signifie « j’achète » ; avec pot on ajoute să : pot să cumpăr, « je peux acheter ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson02.translate.004
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vreau est direct, comme « je veux » ; aș dori est la façon plus douce de demander quelque chose.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson02.order.005
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: word_order
  frame:
    text: Cât costă un {item} de roșii?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un {item} de roșii?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Entre une mesure et ce qu’elle mesure, le roumain met de : un kilogram de roșii.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson02.order.006
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: word_order
  frame:
    text: Unde pot să {item} roșii?
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să {item} roșii?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Après pot, le roumain ajoute să et un second verbe : pot să cumpăr, « je peux acheter ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson02.fill.007
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: fill_in_blank
  frame:
    text: Vreau un kilogram de {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cartofi est au pluriel ; après un kilogram de, ce qui est mesuré reste au pluriel.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson02.translate.008
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: Où puis-je acheter des tomates ?
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să cumpăr {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Roșii est au pluriel, donc aucun un ni o ne le précède ; pot să cumpăr signifie « je peux acheter ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson02.translate.009
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: Je veux un kilo de pommes de terre.
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Vreau un kilogram de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un kilogram de suivi du pluriel cartofi indique la quantité et le produit.
    language_code: fr
    direction: ltr
- content_key: practice.fr-ro.ro.a1.unit07.lesson02.translate.010
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: Combien coûte un kilo de tomates ?
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un kilogram de {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât costă demande le prix ; le singulier costă convient pour un seul kilo.
    language_code: fr
    direction: ltr
