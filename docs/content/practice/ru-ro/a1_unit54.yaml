schema_version: '1.0'
pack_key: practice.ru-ro.a1.unit54
source_language: ru
target_language: ro
unit_content_key: ro.a1.unit54.cinema
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cumpăra
    - w_film
    - w_filmul
    - w_matineu
    - w_muzeu
    - w_muzeul
    - w_popcorn
    - w_popcornul
    - w_spectacol
    - w_spectacolul
    - w_uit
    - w_uita
    - w_vedeți
templates:
- content_key: practice.ru-ro.ro.a1.unit54.lesson01.choose.001
  lesson_content_key: ro.a1.unit54.lesson01.vreau_sa_ma_uit
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_filmul
        - w_uita
        - w_uit
        - w_film
        - w_cumpăra
        - w_vedeți
        - w_spectacolul
        - w_spectacol
        - w_popcornul
        - w_popcorn
        - w_matineu
        - w_muzeul
        - w_muzeu
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Я хочу посмотреть фильм».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit54.lesson02.listen.001
  lesson_content_key: ro.a1.unit54.lesson02.ce_film_doriti_sa
  type: listen_select
  frame:
