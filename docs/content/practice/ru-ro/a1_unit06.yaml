templates:
- content_key: practice.ru-ro.ro.a1.unit06.lesson01.choose.001
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Aș dori значит «я бы хотел(а)» и служит вежливой формой просьбы; она одинакова для любого напитка.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson01.listen.002
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Apă, cafea, ceai, suc и lapte — основные напитки; sete («жажда») употребляется с mi-e: Mi-e sete.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson01.match.003
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cafea и apă — женского рода и употребляются с o (o cafea); ceai и suc — среднего рода и употребляются с un (un ceai).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson01.translate.004
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aș dori значит «я бы хотел(а)»; после него идёт напиток, а перед ним ставится o или un, если просишь одну чашку или один стакан.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson01.order.005
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: word_order
  frame:
    text: Aș dori o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Cafea — женского рода, поэтому с o: o cafea. «Чай» — un ceai.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson01.fill.006
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: fill_in_blank
  frame:
    text: Aș dori un {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ceai употребляется с un, а не с o: un ceai. Сравни: o cafea.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson01.translate.007
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: Я бы хотел кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aș dori — вежливая форма, подходящая и для tu, и для dumneavoastră; cafea употребляется с o.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson01.translate.008
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: Я хочу пить.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi-e {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mi-e sete буквально значит «мне жажда»; Mi-e foame строится так же.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson02.choose.001
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Foame значит «голод»; «я голоден» — Mi-e foame, как и Mi-e sete.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson02.listen.002
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mâncare — это еда вообще; pâine, carne, pui и fructe — конкретные продукты.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson02.match.003
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Fructe стоит во множественном числе и значит «фрукты» вообще; pâine, carne и mâncare — в единственном числе, женского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson02.translate.004
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mâncare — общее слово для еды, carne значит «мясо»; pui — «курица», fructe — «фрукты».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson02.order.005
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: word_order
  frame:
    text: Aș dori {item} și pui.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item} și pui.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Здесь перед словом «хлеб» не нужны ни o, ни un: Aș dori pâine și pui, как и Aș dori apă.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson02.fill.006
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Mi-e foame («я голоден») — устойчивое выражение: ощущение стоит после mi-e.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson02.fill.007
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e foame. Aș dori {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pui значит «курица» — это слово используют в меню и в магазине.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson02.translate.008
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: Я бы хотел чай, пожалуйста. (вежливо, к собеседнику на «вы» — dumneavoastră)
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori un ceai, vă {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă rog — вежливое «пожалуйста» для dumneavoastră; с другом говорят te rog.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit06.lesson02.translate.009
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: Я бы хотел фруктов.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fructe стоит во множественном числе, поэтому перед ним нет ни o, ни un.
    language_code: ru
    direction: ltr
