schema_version: '1.0'
pack_key: practice.ru-ro.a1.unit29
source_language: ru
target_language: ro
unit_content_key: ro.a1.unit29.bani
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_ajutat
    - w_azi
    - w_cafele
    - w_cardul
    - w_cerem
    - w_doriți
    - w_drăguț
    - w_feluri
    - w_idee
    - w_nota
    - w_numerar
    - w_partea
    - w_plătesc
    - w_plătește
    - w_plăti
    - w_plătit
    - w_plătiți
    - w_poftiți
    - w_principale
    - w_rest
    - w_restul
    - w_separat
    - w_total
    - w_împărțim
templates:
- content_key: practice.ru-ro.ro.a1.unit29.lesson01.choose.001
  lesson_content_key: ro.a1.unit29.lesson01.cat_costa_in_total
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_total
        - w_plăti
        - w_cardul
        - w_numerar
        - w_plătesc
        - w_doriți
        - w_plătiți
        - w_nota
        - w_împărțim
        - w_separat
        - w_restul
        - w_poftiți
        - w_rest
        - w_feluri
        - w_principale
        - w_cafele
        - w_plătit
        - w_cerem
        - w_idee
        - w_azi
        - w_ajutat
        - w_drăguț
        - w_partea
        - w_plătește
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Сколько это стоит всего?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson02.listen.001
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Картой или наличными?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson03.translate.001
  lesson_content_key: ro.a1.unit29.lesson03.impartirea_notei
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Делим счёт».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson04.match.001
  lesson_content_key: ro.a1.unit29.lesson04.restul
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое румынское слово с его значением; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson05.choose.001
  lesson_content_key: ro.a1.unit29.lesson05.citim_nota_de_plata
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Читаем ресторанный чек».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson06.translate.001
  lesson_content_key: ro.a1.unit29.lesson06.ana_si_mihai_platesc
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Ана и Михай оплачивают счёт».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson01.order.002
  lesson_content_key: ro.a1.unit29.lesson01.cat_costa_in_total
  type: word_order
  frame:
    text: Cât costă în {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_total
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă în {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Сколько всего это стоит? În total («всего») уточняет, что речь о полной общей сумме, а не о цене одной вещи; Cât costă? значит «сколько это стоит?».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson02.order.002
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: word_order
  frame:
    text: Pot {item} cu cardul aici?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_plăti
  answer_derivation:
    kind: render_frame
    frame:
      text: Pot {item} cu cardul aici?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Можно здесь заплатить картой? plăti значит «платить».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson02.fill.003
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: fill_in_blank
  frame:
    text: Doriți să plătiți în numerar sau cu {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_cardul
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_cardul
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Вы хотите заплатить наличными или картой? Doriți să plătiți ...? — вежливая форма на «вы» (dumneavoastră), которую употребляет незнакомый кассир; с другом ты скажешь Vrei să plătești ...?
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson02.translate.004
  lesson_content_key: ro.a1.unit29.lesson02.cu_cardul_sau_in
  type: translation
  frame:
    text: Я плачу наличными.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_numerar
  answer_derivation:
    kind: render_frame
    frame:
      text: Plătesc în {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Я плачу наличными. numerar значит «наличные».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson03.order.002
  lesson_content_key: ro.a1.unit29.lesson03.impartirea_notei
  type: word_order
  frame:
    text: Hai să împărțim {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_nota
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai să împărțim {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Давай разделим счёт? nota значит «счёт».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson03.fill.003
  lesson_content_key: ro.a1.unit29.lesson03.impartirea_notei
  type: fill_in_blank
  frame:
    text: Pot plăti {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_separat
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_separat
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Можно заплатить отдельно? Separat («отдельно») стоит после a plăti; Pot plăti separat? — обычная просьба, когда каждый платит свою часть.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson04.order.002
  lesson_content_key: ro.a1.unit29.lesson04.restul
  type: word_order
  frame:
    text: Nu am nevoie de {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_rest
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu am nevoie de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Мне не нужна сдача. A avea nevoie de («нуждаться») требует de: Nu am nevoie de rest.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson06.order.002
  lesson_content_key: ro.a1.unit29.lesson06.ana_si_mihai_platesc
  type: word_order
  frame:
    text: Hai să {item} nota?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_cerem
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai să {item} nota?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Давай попросим счёт? A cere («просить») принимает nota как прямое дополнение; Hai să cerem nota? — предложение попросить счёт вместе.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit29.lesson06.fill.003
  lesson_content_key: ro.a1.unit29.lesson06.ana_si_mihai_platesc
  type: fill_in_blank
  frame:
    text: Mihai {item} nota. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_plătește
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_plătește
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Михай оплачивает счёт. Plătește — форма «он/она» от a plăti («платить»).
    language_code: ru
    direction: ltr
