        - w_griji
        - w_simte
        - w_puțin
        - w_singur
        - w_serviciu
        - w_cred
        - w_rezolvă
        - w_simți
        - w_sincer
        - w_descurci
        - w_chiar
        - w_ajută
        - w_fii
        - w_foarte
        - w_mândru
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Рад, грустен или зол?».'
