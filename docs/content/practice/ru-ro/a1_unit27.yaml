  feedback_frame:
    text: 'Как себя чувствует Mihai? A se simți («чувствовать себя») — возвратный глагол: mă simt (я), te simți (ты), se simte (он/она). Так обычно спрашивают о чувствах и описывают их.'
    language_code: ru
    direction: ltr
