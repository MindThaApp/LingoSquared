      text: Nu-ți {item} griji.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Не волнуйся. Nu-ți face griji (букв. «не делай себе забот») — стандартное устойчивое выражение, которым успокаивают. С незнакомым человеком: Nu vă faceți griji.'
    language_code: ru
    direction: ltr
