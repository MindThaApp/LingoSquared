    - w_griji
    - w_mândru
    - w_nou
    - w_prima
    - w_puțin
    - w_rezolvă
    - w_serviciu
    - w_simte
    - w_simți
    - w_sincer
    - w_singur
    - w_supărat
    - w_trist
