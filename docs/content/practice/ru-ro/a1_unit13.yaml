    kind: render_frame
    frame:
      text: Îmi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Îmi place плюс существительное с артиклем означает, что тебе нравится этот предмет.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson01.order.004
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
