      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ceaiul — это ceai плюс артикль -ul, то есть «этот чай».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson01.translate.006
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: translation
  frame:
    text: Мне нравится чай.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Îmi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Îmi place устроено как «мне приятно, мне нравится», поэтому то, что нравится, стоит после.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson01.translate.007
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: translation
  frame:
    text: Мне не нравится кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu-mi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Nu-mi — это nu плюс сокращённое îmi, соединённые дефисом: «мне не нравится».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson01.translate.008
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
  type: translation
  frame:
    text: Мне нравится {item}.
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Îmi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'То, что тебе нравится, — подлежащее при place: Îmi place cafeaua, Îmi place ceaiul, Îmi place pâinea.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson02.choose.001
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Prefer значит «я предпочитаю», а sau соединяет два варианта.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson02.listen.002
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sau значит «или», как в cafea sau ceai.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson02.order.003
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: word_order
  frame:
    text: Prefer {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Prefer {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Prefer значит «я предпочитаю»; то, что ты предпочитаешь, идёт после него с артиклем.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson02.order.004
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: word_order
  frame:
    text: Cafea {item} ceai?
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Cafea {item} ceai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sau предлагает выбор между двумя вещами.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson02.fill.005
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: fill_in_blank
  frame:
    text: Cafea {item} ceai? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sau значит «или» и никогда не меняет форму.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson02.translate.006
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: translation
  frame:
    text: Вам нравится кофе? (вежливая форма, к собеседнику, которому говорят dumneavoastră)
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Vă place {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă place — вопрос к dumneavoastră; с другом ты бы сказал Îți place.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson02.translate.007
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: translation
  frame:
    text: Я предпочитаю кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Prefer {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Для «я» в prefer отдельное слово не нужно; лицо показывает окончание.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson02.translate.008
  lesson_content_key: ro.a1.unit13.lesson02.va_place_prefer
  type: translation
  frame:
    text: Кофе или чай?
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Cafea {item} ceai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sau связывает два варианта в одном коротком вопросе.
    language_code: ru
    direction: ltr
