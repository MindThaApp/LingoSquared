  feedback_frame:
    text: 'В румынском артикль стоит в конце слова: cafea превращается в cafeaua, а ceai — в ceaiul.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson01.listen.002
