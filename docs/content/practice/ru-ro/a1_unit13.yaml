  answer_derivation:
    kind: render_frame
    frame:
      text: Nu-mi place {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Nu-mi place — отрицание; существительное сохраняет артикль: pâinea.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson01.fill.005
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
