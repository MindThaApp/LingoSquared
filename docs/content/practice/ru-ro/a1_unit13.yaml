    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cafeaua, ceaiul и pâinea — определённые формы; окончание -a или -ul играет роль артикля.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit13.lesson01.order.003
  lesson_content_key: ro.a1.unit13.lesson01.imi_place
