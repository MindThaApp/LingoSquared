  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_atracția
    - w_coada
    - w_coadă
    - w_harta
    - w_lungă
    - w_metru
    - w_minimă
    - w_montagnele
    - w_palpitante
    - w_panoramică
    - w_roata
    - w_rusești
    - w_teatru
    - w_înălțime
templates:
- content_key: practice.ru-ro.ro.a1.unit62.lesson01.choose.001
  lesson_content_key: ro.a1.unit62.lesson01.hai_sa_mergem_azi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_atracția
        - w_montagnele
        - w_rusești
        - w_palpitante
        - w_coada
        - w_lungă
        - w_roata
        - w_panoramică
        - w_harta
        - w_înălțime
        - w_minimă
        - w_metru
        - w_coadă
        - w_teatru
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого модуля, из урока «Пойдём сегодня в парк аттракционов?».'
    language_code: ru
    direction: ltr
