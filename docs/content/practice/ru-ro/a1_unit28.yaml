schema_version: '1.0'
pack_key: practice.ru-ro.a1.unit28
source_language: ru
target_language: ro
unit_content_key: ro.a1.unit28.comunicare
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_atât
    - w_aud
    - w_bucur
    - w_crede
    - w_credeam
    - w_merge
    - w_mers
    - w_mesaj
    - w_mesajul
    - w_minute
    - w_mult
    - w_mândră
    - w_poți
    - w_repede
    - w_repeți
    - w_spun
    - w_sun
    - w_suna
    - w_suni
    - w_trebuie
    - w_trimit
    - w_vorbesc
    - w_vorbi
    - w_vorbiți
    - w_înapoi
    - w_înseamnă
templates:
- content_key: practice.ru-ro.ro.a1.unit28.lesson01.choose.001
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_suna
        - w_trebuie
        - w_sun
        - w_vorbesc
        - w_vorbiți
        - w_poți
        - w_repeți
        - w_vorbi
        - w_atât
        - w_repede
        - w_aud
        - w_mesajul
        - w_trimit
        - w_mesaj
        - w_înapoi
        - w_spun
        - w_minute
        - w_suni
        - w_mers
        - w_credeam
        - w_merge
        - w_crede
        - w_bucur
        - w_mândră
        - w_înseamnă
        - w_mult
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — слово из этого урока, из темы «Я перезвоню тебе».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson02.listen.001
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — слово из этого урока, из темы «С кем я говорю?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson03.translate.001
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — слово из этого урока, из темы «Можешь повторить?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson04.match.001
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое румынское слово с его значением; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson05.choose.001
  lesson_content_key: ro.a1.unit28.lesson05.citim_o_conversatie_prin
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — слово из этого урока, из темы «Читаем переписку в сообщениях».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson06.translate.001
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — слово из этого урока, из темы «Телефонный звонок после смены».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson01.order.002
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: word_order
  frame:
    text: Trebuie să te {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_sun
  answer_derivation:
    kind: render_frame
    frame:
      text: Trebuie să te {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Мне нужно тебе позвонить. sun значит «я звоню».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson02.order.002
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: word_order
  frame:
    text: Cu cine {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbesc
  answer_derivation:
    kind: render_frame
    frame:
      text: Cu cine {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: С кем я говорю? Cu cine vorbesc? (буквально «с кем я говорю?») — стандартный вопрос к незнакомому звонящему.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson03.order.002
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: word_order
  frame:
    text: Poți să {item} asta?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_repeți
  answer_derivation:
    kind: render_frame
    frame:
      text: Poți să {item} asta?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Можешь это повторить? Poți să ... («можешь ...?») плюс repeți («повторяешь») плюс asta («это»).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson03.fill.003
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: fill_in_blank
  frame:
    text: Nu {item} atât de repede, te rog. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Не говори так быстро, пожалуйста. Nu vorbi («не говори») — это nu + форма tu; atât de repede значит «так быстро».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson03.translate.004
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: Я тебя плохо слышу.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_aud
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu te {item} bine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Я тебя плохо слышу. Nu te aud bine: aud — «я слышу», te («тебя») стоит перед глаголом, а bine значит «хорошо».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson04.order.002
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: word_order
  frame:
    text: Îți {item} un mesaj.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_trimit
  answer_derivation:
    kind: render_frame
    frame:
      text: Îți {item} un mesaj.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Я пришлю тебе сообщение. Îți («тебе») — местоимение в дательном падеже, стоящее перед глаголом: Îți trimit un mesaj.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson04.fill.003
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: fill_in_blank
  frame:
    text: Te sun {item} mai târziu. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Я перезвоню тебе позже. Înapoi («обратно») стоит после глагола: te sun înapoi значит «я тебе перезвоню», а mai târziu — «позже».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson06.order.002
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: word_order
  frame:
    text: A {item} foarte bine, mai bine decât credeam.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_mers
  answer_derivation:
    kind: render_frame
    frame:
      text: A {item} foarte bine, mai bine decât credeam.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Всё прошло очень хорошо, лучше, чем я думал. A mers — прошедшее от a merge (идти; здесь «получиться, пройти»); credeam значит «я думал» (прошедшая форма от a crede).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit28.lesson06.fill.003
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: fill_in_blank
  frame:
    text: Îți mulțumesc, {item} mult pentru mine. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Спасибо, для меня это много значит. Înseamnă — форма 3-го лица единственного числа от a însemna (значить); pentru mine («для меня») указывает, для кого это важно.
    language_code: ru
    direction: ltr
