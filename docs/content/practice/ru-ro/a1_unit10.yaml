    frame:
      text: Mănânc pâine și {item} cafea dimineața.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Beau — «я пью»; eu опускается, потому что окончания в mănânc и beau уже показывают первое лицо.
    language_code: ru
    direction: ltr
