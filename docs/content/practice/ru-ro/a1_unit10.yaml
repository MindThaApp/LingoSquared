  type: translation
  frame:
    text: Вечером я работаю, а ночью иду домой.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrez seara și {item} acasă noaptea.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Merg acasă noaptea: seara и noaptea указывают время, а acasă не требует предлога.'
    language_code: ru
    direction: ltr
