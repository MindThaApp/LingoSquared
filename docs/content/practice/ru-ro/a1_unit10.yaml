  lesson_content_key: ro.a1.unit10.lesson03.rutina_mihai
  type: translation
  frame:
    text: Вечером я работаю, потом ночью ложусь спать.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrez seara, apoi mă {item} noaptea.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mă culc требует возвратного mă; apoi значит «потом».
    language_code: ru
    direction: ltr
