templates:
- content_key: practice.ru-ro.ro.a1.unit05.lesson01.choose.001
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Meu и mea обозначают «мой»: meu употребляется с существительными мужского и среднего рода (tatăl meu), а mea — с существительными женского рода (mama mea).'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson01.listen.002
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Părinți значит «родители» и стоит во множественном числе; два родителя — это mamă и tată.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson01.match.003
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mamă и tată — существительные без артикля; в формах mama и tatăl определённый артикль стоит в конце слова.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson01.translate.004
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'В румынском определённый артикль ставится в конце существительного: mamă превращается в mama, а tată — в tatăl.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson01.order.005
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: word_order
  frame:
    text: Mama {item} și tatăl meu.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item} și tatăl meu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Притяжательное местоимение согласуется с существительным: mama mea (женский род), но tatăl meu (мужской род).'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson01.fill.006
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: fill_in_blank
  frame:
    text: Mama mea și tatăl {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tatăl мужского рода, поэтому с ним употребляется meu; mama женского рода и требует mea.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson01.translate.007
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: Моя мама.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'В румынском притяжательное местоимение стоит после существительного: mama mea, а не mea mama.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson02.choose.001
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Во множественном числе в румынском меняется окончание: frate — frați, soră — surori, copil — copii.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson02.listen.002
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fiu — это «сын», fiică — «дочь»; женатый мужчина — căsătorit.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson02.match.003
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Frate, fiu и copil мужского рода и употребляются с un; soră и fiică женского рода и употребляются с o.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson02.translate.004
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Frați — множественное число от frate, а surori — множественное число от soră.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson02.order.005
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: word_order
  frame:
    text: Ai {item}?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ai frați? — вопрос к другу; с dumneavoastră он превращается в Aveți frați?
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson02.fill.006
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: fill_in_blank
  frame:
    text: Am un {item} și o soră. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Un употребляется с существительными мужского рода (un frate), а o — с существительными женского рода (o soră).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson02.translate.007
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: У меня есть дочь.
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Am o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fiică женского рода, поэтому с ним употребляется o; «сын» — un fiu.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson02.translate.008
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: Сколько у тебя детей? (на «ты»)
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți {item} ai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Câți — форма мужского рода множественного числа слова «сколько»; она сочетается с copii, множественным числом от copil.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson03.translate.001
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: translation
  frame:
    text: У вас есть братья, Михай? (на «вы»)
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aveți {item}, Mihai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți — вежливая форма глагола «иметь»; с другом ты спросил бы Ai frați?
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit05.lesson03.order.002
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: word_order
  frame:
    text: Da, am un frate și o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, am un frate și o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un frate мужского рода, а o soră женского; это предложение — ответ на вопрос Aveți frați?
    language_code: ru
    direction: ltr
