schema_version: '1.0'
pack_key: practice.ru-ro.a1.unit40
source_language: ru
target_language: ro
unit_content_key: ro.a1.unit40.posta
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_adresa
    - w_ajunge
    - w_angajatul
    - w_bunica
    - w_bunici
    - w_colet
    - w_coletul
    - w_cumpără
    - w_dura
    - w_durează
    - w_grozav
    - w_scrie
    - w_scrisoare
    - w_scrisoarea
    - w_timbru
    - w_timbrul
    - w_zile
templates:
- content_key: practice.ru-ro.ro.a1.unit40.lesson01.choose.001
  lesson_content_key: ro.a1.unit40.lesson01.scrisoarea_si_coletul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_scrisoarea
        - w_scrisoare
        - w_coletul
        - w_colet
        - w_bunica
        - w_timbrul
        - w_timbru
        - w_adresa
        - w_scrie
        - w_ajunge
        - w_bunici
        - w_dura
        - w_durează
        - w_zile
        - w_angajatul
        - w_grozav
        - w_cumpără
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о письме и посылке.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit40.lesson02.listen.001
  lesson_content_key: ro.a1.unit40.lesson02.timbrul_adresa_si_a
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о марке, адресе и письме.'
    language_code: ru
    direction: ltr
