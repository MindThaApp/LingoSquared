schema_version: '1.0'
pack_key: practice.ru-ro.a1.unit59
source_language: ru
target_language: ro
unit_content_key: ro.a1.unit59.plaja
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_caldă
    - w_grădina
    - w_marea
    - w_nisip
    - w_nisipul
    - w_plăcută
    - w_stau
    - w_umbrela
    - w_umbrele
    - w_valul
    - w_zoologică
templates:
- content_key: practice.ru-ro.ro.a1.unit59.lesson01.choose.001
  lesson_content_key: ro.a1.unit59.lesson01.hai_sa_mergem_la
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_plăcută
        - w_marea
        - w_nisipul
        - w_valul
        - w_umbrela
        - w_stau
        - w_umbrele
        - w_nisip
        - w_caldă
        - w_grădina
        - w_zoologică
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Пойдём на пляж?».'
    language_code: ru
    direction: ltr
