schema_version: '1.0'
pack_key: practice.ru-ro.a1.unit47
source_language: ru
target_language: ro
unit_content_key: ro.a1.unit47.programare
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_amintești
    - w_calculator
    - w_confirmare
    - w_confirmat
    - w_convine
    - w_disponibil
    - w_plăcut
    - w_programare
    - w_programarea
templates:
- content_key: practice.ru-ro.ro.a1.unit47.lesson01.choose.001
  lesson_content_key: ro.a1.unit47.lesson01.facem_o_programare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_programarea
        - w_programare
        - w_disponibil
        - w_convine
        - w_calculator
        - w_confirmat
        - w_confirmare
        - w_amintești
        - w_plăcut
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Запись на приём».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit47.lesson02.listen.001
  lesson_content_key: ro.a1.unit47.lesson02.o_ora_este_disponibila
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Свободное время».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit47.lesson03.translate.001
  lesson_content_key: ro.a1.unit47.lesson03.pentru_ce_este_programarea
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Зачем нужна встреча?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit47.lesson05.match.001
  lesson_content_key: ro.a1.unit47.lesson05.citim_o_confirmare
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое румынское слово с его значением; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit47.lesson06.choose.001
  lesson_content_key: ro.a1.unit47.lesson06.mihai_o_ajuta_sa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Михай помогает ей вспомнить».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit47.lesson01.translate.002
  lesson_content_key: ro.a1.unit47.lesson01.facem_o_programare
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Запись на приём».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit47.lesson01.order.003
  lesson_content_key: ro.a1.unit47.lesson01.facem_o_programare
  type: word_order
  frame:
    text: Pentru ce este {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_programarea
  answer_derivation:
    kind: render_frame
    frame:
      text: Pentru ce este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Для чего нужна запись? programarea значит «запись, приём» (с определённым артиклем).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit47.lesson01.fill.004
  lesson_content_key: ro.a1.unit47.lesson01.facem_o_programare
  type: fill_in_blank
  frame:
    text: Aș vrea să fac o {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_programare
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_programare
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Я хотел бы записаться на приём. programare значит «запись, приём».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit47.lesson02.order.002
  lesson_content_key: ro.a1.unit47.lesson02.o_ora_este_disponibila
  type: word_order
  frame:
    text: Miercuri la ora zece este {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_disponibil
  answer_derivation:
    kind: render_frame
    frame:
      text: Miercuri la ora zece este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: В среду в десять часов свободно. disponibil значит «свободный, доступный» (м. р.).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit47.lesson02.fill.003
  lesson_content_key: ro.a1.unit47.lesson02.o_ora_este_disponibila
  type: fill_in_blank
  frame:
    text: Îmi {item} bine. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_convine
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_convine
