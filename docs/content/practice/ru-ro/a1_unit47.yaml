    slot: item
  feedback_frame:
    text: Мне это хорошо подходит. convine значит «подходит, устраивает (кого-то)».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit47.lesson03.order.002
  lesson_content_key: ro.a1.unit47.lesson03.pentru_ce_este_programarea
  type: word_order
  frame:
    text: Pentru ajutor la {item}, vă rog.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_calculator
  answer_derivation:
    kind: render_frame
    frame:
      text: Pentru ajutor la {item}, vă rog.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Помощь с компьютером, пожалуйста. calculator значит «компьютер».
    language_code: ru
    direction: ltr
