schema_version: '1.0'
pack_key: practice.ru-ro.a1.unit41
source_language: ru
target_language: ro
unit_content_key: ro.a1.unit41.gatit
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_bucătăria
    - w_ceapa
    - w_ceapă
    - w_delicios
    - w_gusta
    - w_gustoasă
    - w_gustă
    - w_guști
    - w_intră
    - w_mâncarea
    - w_obiect
    - w_poftă
    - w_pregătesc
    - w_pregătește
    - w_pregătești
    - w_pregăti
    - w_pregătim
    - w_prăjesc
    - w_prăjește
    - w_prăjești
    - w_prăji
    - w_roșia
    - w_roșie
    - w_tai
    - w_taie
    - w_tigaia
    - w_tigaie
    - w_tăia
    - w_tăiem
templates:
- content_key: practice.ru-ro.ro.a1.unit41.lesson01.choose.001
  lesson_content_key: ro.a1.unit41.lesson01.ceapa_rosia_si_taiatul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_ceapa
        - w_ceapă
        - w_roșia
        - w_roșie
        - w_tăia
        - w_tai
        - w_tigaia
        - w_tigaie
        - w_prăji
        - w_prăjesc
        - w_pregăti
        - w_pregătesc
        - w_mâncarea
        - w_obiect
        - w_gusta
        - w_gustă
        - w_intră
        - w_tăiem
        - w_prăjești
        - w_guști
        - w_bucătăria
        - w_taie
        - w_prăjește
        - w_pregătește
        - w_gustoasă
        - w_pregătești
        - w_pregătim
        - w_delicios
        - w_poftă
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока про лук, помидор и нарезку.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit41.lesson02.listen.001
  lesson_content_key: ro.a1.unit41.lesson02.tigaia_si_prajitul
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока про сковороду и жарку.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit41.lesson03.translate.001
  lesson_content_key: ro.a1.unit41.lesson03.a_pregati_si_a
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока про приготовление и дегустацию.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit41.lesson04.match.001
  lesson_content_key: ro.a1.unit41.lesson04.in_bucataria_lui_mihai
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое румынское слово с его значением; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
