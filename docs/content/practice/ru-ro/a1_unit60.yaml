    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока про льва и слона.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit60.lesson03.translate.001
