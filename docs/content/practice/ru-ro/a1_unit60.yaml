- content_key: practice.ru-ro.ro.a1.unit60.lesson04.match.001
  lesson_content_key: ro.a1.unit60.lesson04.panoul_de_la_gradina
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое румынское слово с его значением; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
