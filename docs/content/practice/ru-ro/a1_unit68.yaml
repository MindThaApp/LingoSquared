schema_version: '1.0'
pack_key: practice.ru-ro.a1.unit68
source_language: ru
target_language: ro
unit_content_key: ro.a1.unit68.librarie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_această
    - w_cartea
    - w_cunoscut
    - w_cărți
    - w_căutați
    - w_interesantă
    - w_librăria
    - w_populară
    - w_roman
    - w_romanul
    - w_scriitorul
    - w_semn
    - w_semnul
    - w_titlu
    - w_titlul
templates:
- content_key: practice.ru-ro.ro.a1.unit68.lesson01.choose.001
  lesson_content_key: ro.a1.unit68.lesson01.mergem_la_librarie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_librăria
        - w_cartea
        - w_romanul
        - w_roman
        - w_titlul
        - w_titlu
        - w_scriitorul
        - w_cunoscut
        - w_cărți
        - w_căutați
        - w_această
        - w_populară
        - w_semnul
        - w_semn
        - w_interesantă
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — слово этого урока, из темы «Пойдём в книжный магазин?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit68.lesson02.listen.001
