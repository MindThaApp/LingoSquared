  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого модуля, из урока о писателе и сотруднике.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit68.lesson04.match.001
