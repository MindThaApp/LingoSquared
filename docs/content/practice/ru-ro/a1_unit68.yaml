    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого модуля, из урока о романе и названии.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit68.lesson03.translate.001
