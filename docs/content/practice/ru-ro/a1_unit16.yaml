  lesson_content_key: ro.a1.unit16.lesson03.mihai_este_bolnav
  type: translation
  frame:
    text: Вам нужен отдых. (вежливо, к собеседнику, к которому обращаются на dumneavoastră)
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Aveți nevoie de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți — форма «иметь» для dumneavoastră; с другом ты скажешь Ai.
    language_code: ru
    direction: ltr
