    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aveți nevoie de — вежливое «вам нужно»; после de стоит odihnă.
    language_code: ru
    direction: ltr
