    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Перед doctor стоит un: un doctor.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit16.lesson02.translate.008
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: translation
  frame:
    text: Я плохо себя чувствую.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu mă {item} bine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Nu стоит перед mă simt и образует отрицание.
    language_code: ru
    direction: ltr
