    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Odihnă și {item} apă!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Multă согласуется с существительным женского рода apă.
    language_code: ru
    direction: ltr
