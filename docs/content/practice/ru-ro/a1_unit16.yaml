  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: translation
  frame:
    text: Я болен. (говорит мужчина)
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Sunt {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Bolnav — форма для говорящего мужчины; женщина говорит Sunt bolnavă.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit16.lesson02.translate.010
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
  type: translation
  frame:
    text: Мне нужен врач.
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Am nevoie de un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Am nevoie de — обычный способ сказать «мне нужно».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit16.lesson03.choose.001
  lesson_content_key: ro.a1.unit16.lesson03.mihai_este_bolnav
