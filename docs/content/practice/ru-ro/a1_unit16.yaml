    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit16.lesson01.translate.006
  lesson_content_key: ro.a1.unit16.lesson01.ma_doare_capul
  type: translation
  frame:
    text: У меня болит голова.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mă doare {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: По-румынски говорят «мне болит голова», а не «моя голова болит».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit16.lesson01.translate.007
  lesson_content_key: ro.a1.unit16.lesson01.ma_doare_capul
  type: translation
  frame:
    text: У меня болит живот.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mă doare {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Doare не меняется, потому что то, что болит, стоит в единственном числе.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit16.lesson01.translate.008
  lesson_content_key: ro.a1.unit16.lesson01.ma_doare_capul
  type: translation
  frame:
    text: У вас болит голова или живот? (вежливо, к собеседнику, которому вы говорите dumneavoastră)
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Vă doare capul sau {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă — форма вежливого «вы» (dumneavoastră); с другом сказали бы Te doare.
    language_code: ru
    direction: ltr
