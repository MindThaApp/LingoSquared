  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Am nevoie de значит «мне нужно»; после этого выражения стоит de.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit16.lesson02.fill.007
  lesson_content_key: ro.a1.unit16.lesson02.nu_ma_simt_bine
