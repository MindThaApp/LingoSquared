    - w_felicitări
    - w_invit
    - w_invita
    - w_invită
    - w_inviți
    - w_naștere
    - w_numești
    - w_persoana
    - w_petrecere
    - w_petrecerea
    - w_sărbătorească
    - w_sărbători
    - w_sărbătorim
    - w_vii
    - w_voastră
    - w_începem
templates:
- content_key: practice.ru-ro.ro.a1.unit37.lesson01.choose.001
  lesson_content_key: ro.a1.unit37.lesson01.ziua_de_nastere
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_naștere
        - w_sărbători
        - w_sărbătorim
        - w_petrecerea
        - w_invita
        - w_invit
        - w_numești
        - w_persoana
        - w_vii
        - w_petrecere
        - w_inviți
        - w_invită
        - w_sărbătorească
        - w_bucuroși
        - w_felicitări
        - w_cadou
        - w_voastră
        - w_începem
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого модуля, из урока о дне рождения.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit37.lesson02.listen.001
  lesson_content_key: ro.a1.unit37.lesson02.a_sarbatori_si_petrecerea
