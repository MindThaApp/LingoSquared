    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о том, кто чем пользуется.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit35.lesson06.translate.001
  lesson_content_key: ro.a1.unit35.lesson06.ne_vedem_sambata_in
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Увидимся в субботу в парке!».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit35.lesson01.order.002
  lesson_content_key: ro.a1.unit35.lesson01.telefonul_computerul_si_internetul
  type: word_order
  frame:
    text: Folosesc {item} meu.
    language_code: ro
