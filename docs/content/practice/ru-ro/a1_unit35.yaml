      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_telefonul
  answer_derivation:
    kind: render_frame
    frame:
      text: Folosesc {item} meu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Я пользуюсь телефоном. telefonul значит «телефон».
    language_code: ru
    direction: ltr
