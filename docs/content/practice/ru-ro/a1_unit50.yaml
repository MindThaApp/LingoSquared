schema_version: '1.0'
pack_key: practice.ru-ro.a1.unit50
source_language: ru
target_language: ro
unit_content_key: ro.a1.unit50.frizerie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aceeași
    - w_coafura
    - w_coafură
    - w_frizer
    - w_frizerul
    - w_lista
    - w_listă
    - w_loc
    - w_nicio
    - w_prea
    - w_prețuri
    - w_problemă
    - w_puteți
    - w_scurtă
    - w_spălat
    - w_sta
    - w_stă
    - w_tocmai
    - w_tunde
    - w_tundeți
    - w_tuns
    - w_tunsoare
    - w_tunsoarea
    - w_veniți
templates:
- content_key: practice.ru-ro.ro.a1.unit50.lesson01.choose.001
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_prea
        - w_frizerul
        - w_frizer
        - w_tunde
        - w_puteți
        - w_tundeți
        - w_veniți
        - w_aceeași
        - w_coafură
        - w_scurtă
        - w_nicio
        - w_problemă
        - w_loc
        - w_lista
        - w_prețuri
        - w_tunsoarea
        - w_tunsoare
        - w_listă
        - w_spălat
        - w_tuns
        - w_coafura
        - w_sta
        - w_stă
        - w_tocmai
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Мои волосы слишком длинные».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson02.listen.001
  lesson_content_key: ro.a1.unit50.lesson02.puteti_sa_mi_tundeti
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Можете подстричь меня?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson03.translate.001
  lesson_content_key: ro.a1.unit50.lesson03.facem_o_programare
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Запись на приём».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson04.match.001
  lesson_content_key: ro.a1.unit50.lesson04.la_frizer
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое румынское слово с его значением; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson05.choose.001
  lesson_content_key: ro.a1.unit50.lesson05.citim_lista_de_preturi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Читаем прейскурант».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson06.translate.001
  lesson_content_key: ro.a1.unit50.lesson06.ana_vede_coafura_noua
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Ана видит новую причёску».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson01.order.002
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: word_order
  frame:
    text: Părul meu este {item} lung.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_prea
  answer_derivation:
    kind: render_frame
    frame:
      text: Părul meu este {item} lung.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Мои волосы слишком длинные. prea означает «слишком».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson01.fill.003
  lesson_content_key: ro.a1.unit50.lesson01.parul_meu_este_prea
  type: fill_in_blank
  frame:
    text: Merg la {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_frizer
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_frizer
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Я иду к парикмахеру. frizer означает «парикмахер».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson02.order.002
  lesson_content_key: ro.a1.unit50.lesson02.puteti_sa_mi_tundeti
  type: word_order
  frame:
    text: Puteți să-mi {item} părul?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_tundeți
  answer_derivation:
    kind: render_frame
    frame:
      text: Puteți să-mi {item} părul?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Не могли бы вы подстричь меня? tundeți означает «вы стрижёте» (вежливая форма).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson04.order.002
  lesson_content_key: ro.a1.unit50.lesson04.la_frizer
  type: word_order
  frame:
    text: Perfect, și doriți {item} coafură?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: adjective
      agreement_tags:
        semantic: w_aceeași
  answer_derivation:
    kind: render_frame
    frame:
      text: Perfect, și doriți {item} coafură?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Отлично, и вы хотите ту же причёску? aceeași означает «та же» (ж. р.).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson04.fill.003
  lesson_content_key: ro.a1.unit50.lesson04.la_frizer
  type: fill_in_blank
  frame:
    text: Da, aceeași {item}, dar mai scurtă. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_coafură
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_coafură
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Да, ту же причёску, но короче. coafură означает «причёска; стрижка».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson05.order.002
  lesson_content_key: ro.a1.unit50.lesson05.citim_lista_de_preturi
  type: word_order
  frame:
    text: Citesc {item} de prețuri.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_lista
  answer_derivation:
    kind: render_frame
    frame:
      text: Citesc {item} de prețuri.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Я читаю прайс-лист. lista означает «список» (с определённым артиклем).
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson05.fill.003
  lesson_content_key: ro.a1.unit50.lesson05.citim_lista_de_preturi
  type: fill_in_blank
  frame:
    text: O {item} costă șaizeci de lei. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_tunsoare
    hint:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_tunsoare
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Стрижка стоит шестьдесят лей. tunsoare означает «стрижка».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit50.lesson06.order.002
  lesson_content_key: ro.a1.unit50.lesson06.ana_vede_coafura_noua
  type: word_order
  frame:
    text: Îți {item} bine!
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_stă
  answer_derivation:
    kind: render_frame
    frame:
      text: Îți {item} bine!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Тебе идёт! stă означает «стоит; находится».
    language_code: ru
    direction: ltr
