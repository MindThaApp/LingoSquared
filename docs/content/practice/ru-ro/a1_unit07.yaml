templates:
- content_key: practice.ru-ro.ro.a1.unit07.lesson01.choose.001
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Leu — одна денежная единица, lei — множественное число; costă спрашивает о цене или называет её.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson01.listen.002
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scump значит «дорогой», а ieftin — «дешёвый»; оба слова описывают цену.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson02.match.001
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Costă — глагол цены, а kilogram, piață и продукты — то, что покупают.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson01.translate.003
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Costă — форма «стоит»: Cât costă? спрашивает о цене, а Costă opt lei отвечает.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson01.order.004
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: word_order
  frame:
    text: Costă cinci {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'После чисел от двух до девятнадцати lei стоит без de: opt lei. Начиная с двадцати de появляется: treizeci de lei.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson01.fill.005
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: fill_in_blank
  frame:
    text: Cât {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cât costă? — основной вопрос о цене; costă — форма глагола для «он/она/оно».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson01.translate.006
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: translation
  frame:
    text: Это стоит восемь лей.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Lei — множественное число от leu, оно употребляется с числами: opt lei.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson02.choose.002
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vreau значит «я хочу»; unde — «где», а pot в Unde pot...? — «я могу».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson02.listen.003
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cumpăr — «я покупаю»; после pot нужно să: pot să cumpăr, «я могу купить».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson02.translate.004
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vreau звучит резко, как «я хочу»; aș dori — более мягкий способ о чём-то попросить.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson02.order.005
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: word_order
  frame:
    text: Cât costă un {item} de roșii?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un {item} de roșii?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Между мерой и тем, что измеряется, в румынском стоит de: un kilogram de roșii.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson02.order.006
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: word_order
  frame:
    text: Unde pot să {item} roșii?
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să {item} roșii?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'После pot в румынском идёт să и второй глагол: pot să cumpăr, «я могу купить».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson02.fill.007
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: fill_in_blank
  frame:
    text: Vreau un kilogram de {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cartofi — множественное число; после un kilogram de то, что измеряется, остаётся во множественном числе.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson02.translate.008
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: Где можно купить помидоры?
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să cumpăr {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Roșii стоит во множественном числе, поэтому перед ним нет un или o; pot să cumpăr значит «я могу купить».
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson02.translate.009
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: Я хочу килограмм картофеля.
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Vreau un kilogram de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un kilogram de и множественное число cartofi называют количество и сам продукт.
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit07.lesson02.translate.010
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: Сколько стоит килограмм помидоров?
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un kilogram de {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât costă спрашивает о цене; форма единственного числа costă подходит к одному килограмму.
    language_code: ru
    direction: ltr
