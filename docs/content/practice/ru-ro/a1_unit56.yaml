    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока о чтении программы.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-ro.ro.a1.unit56.lesson06.translate.001
  lesson_content_key: ro.a1.unit56.lesson06.mihai_nina_si_ana
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
