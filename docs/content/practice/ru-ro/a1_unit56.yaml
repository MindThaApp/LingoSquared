    frame:
      text: Aș vrea să merg la concertul {item}, vă rog.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Мне хотелось бы пойти на концерт группы, пожалуйста. trupei означает «группы» (как в «концерт группы»).
    language_code: ru
    direction: ltr
