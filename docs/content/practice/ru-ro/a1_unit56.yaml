  lesson_content_key: ro.a1.unit56.lesson01.vreau_sa_merg_la
  type: word_order
  frame:
    text: Aș vrea să merg la concertul {item}, vă rog.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: noun
      agreement_tags:
        semantic: w_trupei
  answer_derivation:
