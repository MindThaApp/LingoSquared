  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_actorii
    - w_buni
    - w_cortina
    - w_călătoria
    - w_grozavi
    - w_locuri
    - w_mulțumit
    - w_pauză
    - w_piesa
    - w_popular
    - w_teatrul
templates:
- content_key: practice.nl-ro.ro.a1.unit63.lesson01.choose.001
  lesson_content_key: ro.a1.unit63.lesson01.hai_sa_mergem_azi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_teatrul
        - w_popular
        - w_cortina
        - w_actorii
        - w_buni
        - w_piesa
        - w_călătoria
        - w_pauză
        - w_locuri
        - w_mulțumit
        - w_grozavi
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een van de woorden van deze unit, uit de les over Gaan we vandaag naar het theater?'
    language_code: nl
    direction: ltr
