  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Dutch). Needs native review of frame grammar across the whole slot pool.
tag_schema:
