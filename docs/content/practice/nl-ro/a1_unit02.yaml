    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Doi is de mannelijke vorm van twee en două de vrouwelijke en onzijdige vorm; de andere getallen veranderen niet.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson01.translate.004
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
