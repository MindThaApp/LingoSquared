    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Voor een zelfstandig naamwoord veranderen een en twee mee met het geslacht (un of o, doi of două); als je alleen telt, zeg je unu, doi.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson02.choose.001
