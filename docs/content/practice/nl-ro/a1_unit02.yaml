    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'De getallen 13-19 worden gevormd met de eenheid plus -sprezece: doisprezece is twee plus tien.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson02.listen.002
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
