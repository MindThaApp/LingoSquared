    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson03.order.001
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Am {item} ani.
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Van twee tot negentien is er geen de: am nouăsprezece ani. Vanaf twintig komt het wel: am treizeci de ani.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson02.translate.005
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: translation
  frame:
    text: Ik ben dertig jaar oud.
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} de ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Vanaf twintig komt na het getal de voor het zelfstandig naamwoord: treizeci de ani.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson03.choose.002
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ai is de tu-vorm van hebben en aveți is de dumneavoastră-vorm: Câți ani ai? of Câți ani aveți?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson03.fill.003
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: fill_in_blank
  frame:
    text: Am treizeci {item} ani. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De staat na getallen vanaf twintig: treizeci de ani, maar nouăsprezece ani.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson03.translate.004
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: Hoe oud ben je? (informeel, tegen een vriend)
    language_code: nl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Câți ani ai? vraagt letterlijk hoeveel jaren je hebt: het Roemeens gebruikt hebben, niet zijn, voor leeftijd.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson03.translate.005
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: Hoe oud bent u? (formeel, tegen iemand die je met dumneavoastră aanspreekt)
    language_code: nl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți is de beleefde vorm van hebben, gebruikt met dumneavoastră.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson03.order.006
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Care e numărul {item} de telefon?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Care e numărul {item} de telefon?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Numărul is onzijdig, en een onzijdig enkelvoudig zelfstandig naamwoord krijgt de mannelijke vorm tău; de beleefde versie is Care este numărul dumneavoastră de telefon?
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson03.translate.007
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Het Roemeens zegt ik heb dertig jaar: am treizeci de ani, niet ik ben.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson03.match.008
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ani is het meervoud van an; de vraag Câți ani ai? vraagt naar het aantal jaren.
    language_code: nl
    direction: ltr
