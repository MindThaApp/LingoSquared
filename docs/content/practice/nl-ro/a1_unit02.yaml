    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Nul tot tien zijn de bouwstenen: bij de getallen 11-19 komt -sprezece (unsprezece, doisprezece) en bij de tientallen -zeci.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit02.lesson01.match.003
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: matching_pairs
