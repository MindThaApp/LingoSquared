templates:
- content_key: practice.nl-ro.ro.a1.unit04.lesson01.choose.001
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jumătate betekent half en un sfert betekent een kwartier; beide worden met și aan het uur vastgemaakt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson01.listen.002
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cât este ora? vraagt hoe laat het is; het antwoord is Este ora + getal.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson01.match.003
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ora is het uur of de tijd op de klok; fără en și schuiven de tijd vooruit of achteruit.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson01.order.004
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: word_order
  frame:
    text: Este {item} unu.
    language_code: ro
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Este {item} unu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Na ora gebruik je unu voor één en două voor twee: ora unu, ora două.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson01.fill.005
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: fill_in_blank
  frame:
    text: Este ora unu și {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Și jumătate telt dertig minuten erbij: ora unu și jumătate is half twee.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson01.translate.006
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: translation
  frame:
    text: Hoe laat is het?
    language_code: nl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât este ora? vraagt letterlijk 'hoeveel is het uur'; antwoord met Este ora + getal.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson01.translate.007
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fără betekent normaal zonder; bij het zeggen van de tijd betekent fără un sfert kwart voor.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson02.translate.001
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: translation
  frame:
    text: Het is kwart over twee.
    language_code: nl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Este ora două și un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Și un sfert telt vijftien minuten erbij; fără un sfert haalt er vijftien af.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson02.fill.002
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: fill_in_blank
  frame:
    text: Este ora trei {item} un sfert. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Fără un sfert trekt vijftien minuten af: ora trei fără un sfert is 2:45.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson02.translate.003
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: translation
  frame:
    text: Hoe laat?
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: La ce {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'La ce oră? vraagt wanneer iets gebeurt; antwoord met la ora + getal: la ora nouă.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson02.order.004
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: word_order
  frame:
    text: Este ora trei fără un {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Este ora trei fără un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sfert is onzijdig en krijgt in het enkelvoud un; de klokuitdrukking telt terug vanaf het volgende hele uur.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson03.choose.001
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dimineața, seara en noaptea zijn dagdelen en eindigen op -a, omdat ze het bepaalde lidwoord bij zich hebben.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson03.listen.002
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cursul is de les; 'beginnen' is începe, dat je zowel voor lessen als voor evenementen gebruikt.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson03.order.003
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: word_order
  frame:
    text: Cursul {item} la ora nouă.
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul {item} la ora nouă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Începe is de hij-, zij- of het-vorm van 'beginnen' en past bij het enkelvoudige onderwerp cursul.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson03.translate.004
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: translation
  frame:
    text: De les begint om negen uur 's ochtends.
    language_code: nl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul începe la ora nouă, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Zet het dagdeel achter de tijd: la ora nouă, dimineața of la ora nouă, seara.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit04.lesson03.fill.005
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: fill_in_blank
  frame:
    text: Când începe {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Când începe cursul? vraagt wanneer de les begint; het antwoord is Cursul începe la ora nouă.
    language_code: nl
    direction: ltr
