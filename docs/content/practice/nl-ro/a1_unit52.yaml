        - w_piscina
        - w_piscină
        - w_biletul
        - w_costa
        - w_deschis
        - w_deschisă
        - w_funcționare
        - w_deschide
        - w_închiriați
        - w_dulap
        - w_închide
        - w_regula
        - w_duș
        - w_regulă
        - w_geanta
