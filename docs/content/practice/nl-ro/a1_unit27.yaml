      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Maak je geen zorgen. Nu-ți face griji (letterlijk "maak geen zorgen voor jezelf") is de vaste standaarduitdrukking om iemand gerust te stellen. Tegen een vreemde: Nu vă faceți griji.'
    language_code: nl
    direction: ltr
