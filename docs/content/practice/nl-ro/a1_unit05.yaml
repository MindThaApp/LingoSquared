  feedback_frame:
    text: 'Meu en mea betekenen allebei mijn: meu hoort bij mannelijke en onzijdige zelfstandige naamwoorden (tatăl meu) en mea bij vrouwelijke (mama mea).'
    language_code: nl
    direction: ltr
