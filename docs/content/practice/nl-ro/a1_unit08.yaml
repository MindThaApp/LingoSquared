  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lângă, vizavi en între staan vóór de plek waarnaar ze verwijzen: lângă bibliotecă, vizavi de magazin.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit08.lesson02.listen.002
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
