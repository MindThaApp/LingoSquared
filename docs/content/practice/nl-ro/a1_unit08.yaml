  answer_derivation:
    kind: render_frame
    frame:
      text: Unde este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Gară wordt gara als het lidwoord aan het eind wordt toegevoegd.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit08.lesson01.translate.008
  lesson_content_key: ro.a1.unit08.lesson01.unde_este
