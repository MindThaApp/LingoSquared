    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gară, magazin en bancă zijn de zelfstandige naamwoorden zonder lidwoord; met lidwoord worden het gara, magazinul en banca.
    language_code: nl
    direction: ltr
