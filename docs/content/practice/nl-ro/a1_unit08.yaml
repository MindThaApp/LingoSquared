  answer_derivation:
    kind: render_frame
    frame:
      text: Magazinul este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Magazinul is magazin plus het lidwoord -ul; aproape is een bijwoord en verandert nooit.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit08.lesson02.choose.001
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: multiple_choice
