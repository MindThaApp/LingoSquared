    kind: render_frame
    frame:
      text: Da, magazinul este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aproape betekent dichtbij; Este aproape? vraagt of iets dichtbij is.
    language_code: nl
    direction: ltr
