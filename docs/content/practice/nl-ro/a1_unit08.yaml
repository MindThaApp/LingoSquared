    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poștă is het postkantoor en bibliotecă is een bibliotheek; stație is een halte en autobuz een bus.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit08.lesson02.translate.003
  lesson_content_key: ro.a1.unit08.lesson02.langa_vizavi_intre
  type: translation
  frame:
