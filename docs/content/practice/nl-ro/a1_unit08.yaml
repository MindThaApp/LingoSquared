  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Gară is een station, magazin een winkel en bancă een bank; aproape en departe geven aan hoe ver iets is.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit08.lesson01.listen.002
