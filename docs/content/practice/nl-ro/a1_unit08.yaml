      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Het lidwoord staat aan het eind: bancă wordt banca, dus Unde este banca? betekent Waar is de bank?'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit08.lesson01.translate.007
