    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'In deze zinnen over je naam staat het voornaamwoord vóór het werkwoord: mă numesc, vă numiți, te cheamă.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit01.lesson03.translate.001
  lesson_content_key: ro.a1.unit01.lesson03.street_meeting
  type: translation
  frame:
    text: Goed, dank je.
    language_code: nl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Bine, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Na Bine, mulțumesc geef je de vraag terug: Și dumneavoastră? (formeel) of Și tu? (informeel).'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit01.lesson03.order.002
  lesson_content_key: ro.a1.unit01.lesson03.street_meeting
  type: word_order
  frame:
    text: Și {item} îmi pare bine!
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Și {item} îmi pare bine!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Și mie îmi pare bine betekent 'ik vind het ook aangenaam'; mie benadrukt 'mij' en reageert op de ander.
    language_code: nl
    direction: ltr
