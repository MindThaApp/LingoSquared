  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Îmi pare bine betekent letterlijk 'het lijkt mij goed'; het antwoord is Și mie îmi pare bine.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit01.lesson02.translate.003
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
