    language_code: ro
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Mă numesc {name}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mă numesc betekent letterlijk 'ik noem mezelf'; Mă cheamă betekent 'ik word genoemd'.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit01.lesson02.fill.002
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: fill_in_blank
