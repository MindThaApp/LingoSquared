templates:
- content_key: practice.nl-ro.ro.a1.unit01.lesson01.choose.001
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Roemeens kent twee woorden voor ''je/u'': tu met vrienden en familie, dumneavoastră met vreemden en om respect te tonen.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit01.lesson01.listen.002
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Faceți hoort bij dumneavoastră en faci bij tu, dus de werkwoordsuitgang laat al het register zien.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit01.lesson01.match.003
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Bună ziua hoort bij dumneavoastră en salut bij tu: de groet die je kiest, bepaalt het register van het hele gesprek.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit01.lesson01.translate.004
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mulțumesc is het gewone 'dank je' en werkt met zowel tu als dumneavoastră.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit01.lesson01.order.005
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: word_order
  frame:
    text: Bună {item}!
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Bună {item}!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Bună ziua is de beleefde groet overdag voor vreemden; bij vrienden zeg je salut.
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit01.lesson01.fill.006
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: fill_in_blank
  frame:
    text: Bine, mulțumesc. Și {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Și dumneavoastră? geeft de beleefde vraag terug; bij een vriend zeg je Și tu?
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit01.lesson01.translate.007
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: Hoe gaat het? (informeel, tegen een vriend)
    language_code: nl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faci? is voor een vriend (tu); bij een vreemde zeg je Ce mai faceți?
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit01.lesson01.translate.008
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: Hoe gaat het met u? (formeel, tegen iemand die je met dumneavoastră aanspreekt)
    language_code: nl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faceți? is de beleefde vraag; het beleefde antwoord is Bine, mulțumesc. Și dumneavoastră?
    language_code: nl
    direction: ltr
- content_key: practice.nl-ro.ro.a1.unit01.lesson02.order.001
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
