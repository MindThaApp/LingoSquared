templates:
- content_key: practice.pl-hi.hi.a1.unit02.lesson01.choose.001
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hindi nazwy liczb są nieregularne i trzeba uczyć się ich po kolei; na przykład छह to sześć, a सात to siedem.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit02.lesson01.listen.002
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hindi nazwy liczb od jedenastu do dziewięćdziesięciu dziewięciu są nieregularne, więc każdą z nich, na przykład पंद्रह (piętnaście) czy पचास (pięćdziesiąt), trzeba zapamiętać osobno.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit02.lesson02.match.001
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Hindi rzeczowniki takie jak नंबर, फ़ोन i कीमत nie mają rodzajnika; to kontekst decyduje, czy chodzi o jakąś cenę, czy o konkretną cenę.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit02.lesson02.fill.002
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: इसकी {item} पचास रुपये है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इसकी znaczy „jego/jej” i zgadza się z rzeczownikiem żeńskim कीमत, dlatego kończy się na -ी, a nie na -ा.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit02.lesson02.order.003
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: इसकी कीमत {item} रुपये है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी कीमत {item} रुपये है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'W hindi liczebnik stoi przed tym, co jest liczone, a czasownik है zostaje na końcu: इसकी कीमत पचास रुपये है.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit02.lesson02.translate.004
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: Ile to kosztuje?
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी {item} क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'W hindi pytanie ma szyk jak zdanie oznajmujące: इसकी कीमत पचास रुपये है odpowiada na pytanie इसकी कीमत क्या है?'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit02.lesson03.choose.001
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Zaimki dzierżawcze zgadzają się z posiadanym przedmiotem: आपका फ़ोन नंबर ma męskie आपका, ale आपकी उम्र ma żeńskie आपकी.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit02.lesson03.order.002
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: मेरी उम्र {item} साल है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {item} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Wiek podaje się jako liczbę साल (lat) z है: dosłownie „Mój wiek to trzydzieści lat”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit02.lesson03.order.003
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: आपका {item} नंबर क्या है?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: आपका to formalne „twój/Pana/Pani”, tu w rodzaju męskim, bo नंबर jest rodzaju męskiego; z तुम powiesz तुम्हारा.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit02.lesson03.fill.004
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: मेरी उम्र तीस {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'साल (rok) nie zmienia się w liczbie mnogiej po liczebniku: तीस साल to trzydzieści lat.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit02.lesson03.translate.005
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Mam {n} lat.
    language_code: pl
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {n} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: उम्र jest rzeczownikiem żeńskim, więc zaimek dzierżawczy to मेरी, a nie मेरा.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit02.lesson03.translate.006
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Jaki jest Pana/Pani numer telefonu? (formalnie)
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Numer telefonu w hindi czyta się cyfra po cyfrze, na przykład छह दो आठ तीन पाँच.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit02.lesson03.translate.007
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Po liczbie większej niż jeden pieniądze liczy się w liczbie mnogiej रुपये; liczba pojedyncza to रुपया.
    language_code: pl
    direction: ltr
