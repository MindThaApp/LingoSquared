templates:
- content_key: practice.pl-hi.hi.a1.unit03.lesson01.choose.001
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hindi nazwy dni tygodnia kończą się na -वार (dzień tygodnia), więc सोमवार, मंगलवार i रविवार mają to samo zakończenie.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson02.listen.001
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Nazwy miesięcy są zapożyczone z angielskiego, dlatego जनवरी, मार्च i दिसंबर łatwo rozpoznać.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson03.choose.001
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'अगली znaczy „następny” i zgadza się z rzeczownikiem rodzaju żeńskiego: अगली क्लास to „następne zajęcia”, a przy rzeczowniku rodzaju męskiego użyjesz अगला.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson03.match.002
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: आज (dziś) nie potrzebuje dodatkowego słowa, ale dzień tygodnia łączy się z को (सोमवार को, w poniedziałek), a miesiąc z में (जनवरी में, w styczniu).
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson01.order.002
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Dzień tygodnia jest podmiotem zdania, więc आज सोमवार है dosłownie znaczy „Dziś poniedziałek jest”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson01.order.003
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: योग क्लास {item} को है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {item} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'को po dniu tygodnia znaczy „w”: सोमवार को to „w poniedziałek”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson02.fill.002
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: fill_in_blank
  frame:
    text: आज कितनी {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कितनी zgadza się z rzeczownikiem rodzaju żeńskiego तारीख़, dlatego kończy się na -ी.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson02.order.003
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: word_order
  frame:
    text: मेरा जन्मदिन {item} में है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {item} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'में po nazwie miesiąca znaczy „w”: जनवरी में to „w styczniu”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson03.fill.003
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: अगली क्लास {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'कब znaczy „kiedy” i stoi tam, gdzie w odpowiedzi byłaby data: अगली क्लास मंगलवार को है.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson03.fill.004
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: कोई {item} नहीं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कोई बात नहीं to codzienna odpowiedź na podziękowanie lub przeprosiny, jak „nie ma sprawy”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson01.translate.004
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: Jaki dziś jest dzień tygodnia?
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} सा दिन है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कौन सा znaczy „który”; w pytaniu आज कौन सा दिन है? pyta o to, jaki jest dzień tygodnia.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson02.translate.004
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: Moje urodziny są w {month}.
    language_code: pl
    direction: ltr
    slot_rendering:
      month: english_gloss
  slots:
    month: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {month} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Miesiące łączą się z में („w”), a dni tygodnia z को („w”).
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson01.translate.005
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: 'Zajęcia jogi są: {day}.'
    language_code: pl
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {day} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Dni tygodnia są rodzaju męskiego, a को wskazuje dzień, w którym coś się dzieje.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson03.translate.005
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: translation
  frame:
    text: Kiedy masz urodziny? (nieformalnie)
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा जन्मदिन {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: W formie grzecznościowej z आप powiesz आपका जन्मदिन कब है?
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit03.lesson02.translate.005
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nazw dni tygodnia i miesięcy nie pisze się w devanagari wielką literą, bo to pismo nie ma wielkich liter.
    language_code: pl
    direction: ltr
