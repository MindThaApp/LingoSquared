templates:
- content_key: practice.pl-hi.hi.a1.unit12.lesson01.choose.001
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'था i थी zastępują है w czasie przeszłym i zgadzają się z podmiotem: दिन अच्छा था, फ़िल्म अच्छी थी.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson01.order.002
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: कल का दिन {item} था?
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: कल का दिन {item} था?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा zgadza się z rzeczownikiem rodzaju męskiego दिन; przy rzeczowniku rodzaju żeńskiego byłoby कैसी.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson01.order.003
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: चाय की दुकान बहुत {item} थी।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अच्छी jest rodzaju żeńskiego, bo दुकान jest rodzaju żeńskiego, a थी zgadza się z tym rzeczownikiem.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson01.fill.004
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: fill_in_blank
  frame:
    text: फ़िल्म अच्छी {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थी to żeńska forma czasu przeszłego od „być” i zgadza się z rzeczownikiem rodzaju żeńskiego फ़िल्म.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson01.translate.005
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: Film był dobry.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फ़िल्म अच्छी {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म jest rodzaju żeńskiego, więc zarówno przymiotnik, jak i czas przeszły od „być” mają formę żeńską.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson01.translate.006
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: Herbaciarnia była bardzo dobra.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की łączy चाय z rzeczownikiem rodzaju żeńskiego दुकान, a अच्छी i थी zgadzają się z nim.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson02.choose.001
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Formy czasu przeszłego od जाना i मिलना kończą się na -आ u mężczyzny i na -ई u kobiety: गया lub गई, मिला lub मिली.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson02.order.002
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: word_order
  frame:
    text: मैं वहाँ प्रिया से {item}।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं वहाँ प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'से oznacza tu „z”: प्रिया से मिला to „spotkałem Priyę”, a końcówka zależy od osoby mówiącej.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson02.fill.003
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं कल बाज़ार {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Końcówka -ई pokazuje, że mówi kobieta.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson02.fill.004
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं वहाँ अर्जुन से {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Czas przeszły od मिलना zgadza się z osobą mówiącą, więc kobieta mówi मिली.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson02.translate.005
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: Poszłam do domu. (mówi kobieta)
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं घर {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Kobieta używa गई; mężczyzna powiedziałby गया.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson02.translate.006
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: Spotkałam Priyę. (mówi kobieta)
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से po osobie, z którą się spotykamy, oznacza „z”; końcówka czasownika zależy od osoby mówiącej.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson02.translate.007
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Czas przeszły czasownika zgadza się z wykonawcą czynności: mężczyzna mówi मिला, a kobieta मिली.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson03.choose.001
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'मिले używa się z हम, तुम i वे: हम मिले, „spotkaliśmy się”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson03.fill.002
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: fill_in_blank
  frame:
    text: वहाँ हम {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Przy हम forma czasu przeszłego kończy się na -ए, tak samo jak liczba mnoga rodzaju męskiego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit12.lesson03.translate.003
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: translation
  frame:
    text: Spotkaliśmy się.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: हम {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: हम przyjmuje formę liczby mnogiej मिले, niezależnie od tego, kto jest w grupie.
    language_code: pl
    direction: ltr
