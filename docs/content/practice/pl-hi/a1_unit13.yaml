templates:
- content_key: practice.pl-hi.hi.a1.unit13.lesson01.choose.001
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पसंद है znaczy „jest miłe, podoba się”: मुझे चाय पसंद है to „Lubię herbatę”, zbudowane z मुझे, a nie z मैं.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson01.listen.002
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'है łączy się z jedną rzeczą, a हैं z wieloma: किताब पसंद है, किताबें पसंद हैं.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson01.order.003
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: W hindi nie ma słów odpowiadających „a” ani „the”, a lubiana rzecz stoi między मुझे a पसंद.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson01.order.004
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Czasownik to हैं, bo किताबें jest w liczbie mnogiej: पसंद है zmienia się w पसंद हैं.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson01.fill.005
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पसंद w hindi nie jest czasownikiem, lecz słowem używanym z है, więc zdanie jest zbudowane jak „mnie herbata jest miła”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson01.fill.006
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे {item} पसंद हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gdy lubianych rzeczy jest kilka, po पसंद stoi हैं.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson01.translate.007
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: Lubię muzykę.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Osoba, która lubi, idzie na miejsce मुझे, a muzyka jest tym, co się jej podoba.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson01.translate.008
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: Lubię książki.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: किताबें jest w liczbie mnogiej, więc czasownik to हैं, a nie है.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson01.translate.009
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Liczba pojedyncza किताब i mnoga किताबें różnią się tylko końcówką -ें, która w tym rzeczowniku rodzaju żeńskiego oznacza liczbę mnogą.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson02.choose.001
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'खेल znaczy zarówno „sport”, jak i „gra”, a ज़्यादा znaczy „więcej”: मुझे चाय ज़्यादा पसंद है to „Bardziej lubię herbatę”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson02.order.002
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: word_order
  frame:
    text: मुझे यह {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: यह („ten”) stoi tuż przed rzeczownikiem, na który wskazuje, jak w यह खेल.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson02.fill.003
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} पसंद है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ज़्यादा stoi przed पसंद, by powiedzieć, którą z dwóch rzeczy lubi się bardziej.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson02.translate.004
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: Lubię ten sport.
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: है zgadza się z lubianą rzeczą (jeden sport), a nie z osobą, która lubi.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson02.translate.005
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: Bardziej lubię herbatę.
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे चाय {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Hindi mówi dosłownie „herbata jest dla mnie bardziej miła”, a ज़्यादा stoi tuż przed पसंद.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit13.lesson02.translate.006
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खेल („sport” lub „gra”) to rzeczownik rodzaju męskiego, a ज़्यादा („więcej”) nigdy nie zmienia formy.
    language_code: pl
    direction: ltr
