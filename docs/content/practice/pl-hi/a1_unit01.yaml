templates:
- content_key: practice.pl-hi.hi.a1.unit01.lesson01.choose.001
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Hindi ma dwa słowa oznaczające „ty”: आप jest formalne i pełne szacunku, a तुम jest nieformalne i używa się go wobec przyjaciół oraz osób w twoim wieku lub młodszych.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson01.fill.002
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Czasownik „być” zmienia się zależnie od podmiotu: हूँ pasuje do मैं, हो do तुम, a हैं do आप.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson01.order.003
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: word_order
  frame:
    text: आप {item} हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Słowo pytające zgadza się z osobą, o którą pytasz: कैसे dla mężczyzny i कैसी dla kobiety, a आप zawsze łączy się z हैं.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson01.translate.004
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: Jak się masz? (nieformalnie, pytanie do mężczyzny)
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Z तुम czasownik ma formę हो; gdy pytasz kobietę, कैसे zmienia się w कैसी: तुम कैसी हो?'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson01.translate.005
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: Jak się Pani miewa? (formalnie, pytanie do kobiety)
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Formalne आप łączy się z formą हैं, która wygląda na liczbę mnogą, nawet gdy mowa o jednej osobie, a कैसी to żeńska forma słowa „jak”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson02.listen.001
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अलविदा to pożegnanie; w codziennej mowie नमस्ते sprawdza się zarówno jako powitanie, jak i pożegnanie.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson02.order.002
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: word_order
  frame:
    text: आपका {item} अच्छा रहे।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} अच्छा रहे।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रहे sprawia, że to zdanie jest życzeniem (oby było dobrze), a आपका pokazuje, że mówisz formalnie do kogoś na „Pan/Pani”; w rozmowie na „ty” użyjesz तुम्हारा.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson02.match.003
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'W hindi nie ma słów odpowiadających „a” ani „the”: नाम może znaczyć „imię”, „jakieś imię” lub „to imię”, zależnie od zdania.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson03.choose.001
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pytania w hindi zachowują szyk zdania oznajmującego: słowo pytające कहाँ zajmuje miejsce odpowiedzi (आप कहाँ से हैं? i मैं भारत से हूँ).'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson03.order.002
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मेरा नाम {name} है।
    language_code: hi
    direction: ltr
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: W hindi czasownik stoi na końcu, więc मेरा नाम ... है to dosłownie „Moje imię ... jest”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson03.order.003
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मैं {place} से हूँ।
    language_code: hi
    direction: ltr
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से stoi po nazwie miejsca i znaczy „z”; to postpozycja, a nie przyimek.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson03.fill.004
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: fill_in_blank
  frame:
    text: आपसे मिलकर {item} हुई। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: To formalne „Miło mi Pana/Panią poznać”, dosłownie „radość stała się przy spotkaniu z tobą”; wersja nieformalna to तुमसे मिलकर अच्छा लगा.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson03.translate.005
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Mam na imię {name}.
    language_code: pl
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नाम to rzeczownik rodzaju męskiego, więc wszyscy, zarówno mężczyźni, jak i kobiety, mówią मेरा नाम.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson03.translate.006
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: 'Pochodzę z: {place}.'
    language_code: pl
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Kobieta też mówi मैं भारत से हूँ: czasownik हूँ nie zmienia się zależnie od płci mówiącego.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson03.translate.007
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Skąd jesteś? (nieformalnie)
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} से हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Aby zadać to samo pytanie formalnie, użyj आप z हैं: आप कहाँ से हैं?'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit01.lesson03.translate.008
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Rzeczowniki w hindi są rodzaju męskiego lub żeńskiego: दिन, नाम i योग są rodzaju męskiego, a खुशी żeńskiego.'
    language_code: pl
    direction: ltr
