    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pytanie rozstrzygnięte (tak/nie) może zaczynać się od opcjonalnego क्या, ale sama rosnąca intonacja w zupełności wystarcza.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit17.lesson03.translate.004
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: translation
  frame:
    text: Codziennie chodzisz do biura. (nieformalnie, do mężczyzny)
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Przy तुम czasownik ma końcówkę -ते, a po nim stoi हो – gdy mowa o mężczyźnie.
