    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: W hindi nie ma odpowiednika „a/an”, a miejsce stoi przed काम करता हूँ.
    language_code: pl
    direction: ltr
