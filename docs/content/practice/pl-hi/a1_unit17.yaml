  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: Arjun pracuje w biurze.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: अर्जुन {item} में काम करता है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Przy imieniu czasownik kończy się na है, a nie हूँ, a -ता pokazuje, że Arjun jest mężczyzną.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit17.lesson03.choose.001
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाते w zdaniu तुम रोज़ दफ़्तर जाते हो to forma -ते używana z तुम, gdy mówisz do mężczyzny.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit17.lesson03.order.002
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: word_order
  frame:
    text: तुम रोज़ दफ़्तर {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Z तुम czasownik kończy się na -ते i występuje z हो, gdy mówisz do mężczyzny.
    language_code: pl
    direction: ltr
