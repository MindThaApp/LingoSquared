    slot: item
  feedback_frame:
    text: शिक्षक to nauczyciel, a शिक्षिका to nauczycielka; इंजीनियर jest używane dla obu płci.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit17.lesson01.listen.002
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Niektóre hindi nazwy zawodów mają osobną formę żeńską, jak शिक्षक i शिक्षिका, natomiast zapożyczenia takie jak इंजीनियर jej nie mają.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit17.lesson01.order.003
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: मैं {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Słowo „nauczyciel” zależy od płci mówiącego: शिक्षक dla mężczyzny, शिक्षिका dla kobiety.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit17.lesson01.order.004
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: प्रिया {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: प्रिया jest kobietą, więc jest शिक्षिका.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit17.lesson01.fill.005
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
