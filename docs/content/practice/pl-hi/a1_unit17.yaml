    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: इंजीनियर nie zmienia się w zależności od płci, a w hindi nie ma odpowiednika „a/an”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit17.lesson02.choose.001
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
