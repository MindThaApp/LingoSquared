templates:
- content_key: practice.pl-hi.hi.a1.unit10.lesson01.choose.001
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Czasowniki opisujące czynności powtarzalne kończą się na -ता u mężczyzny i -ती u kobiety: मैं उठता हूँ, मैं उठती हूँ.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson01.listen.002
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: वह znaczy „on” lub „ona”, a końcówka czasownika pokazuje, o kogo chodzi; वे znaczy „oni”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson01.order.003
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ सात बजे {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ सात बजे {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Końcówka czasownika zależy od płci mówiącego: उठता u mężczyzny i उठती u kobiety, a हूँ występuje z मैं.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson01.order.004
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ काम पर {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: काम पर जाना, czyli „iść do pracy”, wymaga पर, a końcówka czasownika nadal zależy od płci mówiącego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson01.fill.005
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: fill_in_blank
  frame:
    text: मैं रोज़ नाश्ता {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Wiele hindi czynności to rzeczownik + करना: नाश्ता करना znaczy „jeść śniadanie”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson01.translate.006
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: Codziennie idę do pracy. (mówi kobieta)
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Kobieta używa końcówki -ती: जाती हूँ; mężczyzna powiedziałby जाता हूँ.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson01.translate.007
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: Codziennie jem śniadanie. (mówi mężczyzna)
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ नाश्ता {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Hindi mówi नाश्ता करना, dosłownie „robić śniadanie”, a po polsku mówimy „jeść śniadanie”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson02.choose.001
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Z तुम czasownik kończy się na -ते u mężczyzny i -ती u kobiety oraz występuje z हो: तुम उठते हो, तुम उठती हो.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson02.match.002
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Każdy czasownik czynności powtarzalnej ma formę męską na -ता i żeńską na -ती, a forma zależy od mówiącego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson02.order.003
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: word_order
  frame:
    text: तुम कब {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Z तुम czasownik ma formę -ते हो, gdy pytamy mężczyznę; końcówka zależy od osoby, do której mówimy.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson02.fill.004
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: fill_in_blank
  frame:
    text: मैं रात को ग्यारह बजे {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mówi tu kobieta, więc czasownik ma końcówkę -ती; końcówka zależy od osoby, która śpi.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson02.translate.005
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: Kiedy śpisz? (nieformalnie, pytasz mężczyznę)
    language_code: pl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Z तुम końcówka zależy od osoby, którą pytamy, a nie od pytającego: सोते u mężczyzny, सोती u kobiety.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson02.translate.006
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: Kiedy wstajesz? (nieformalnie, pytasz kobietę)
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Gdy pytasz kobietę, czasownik kończy się na -ती: तुम उठती हो.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson03.choose.001
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: आते w zdaniu तुम कब वापस आते हो? to forma na -ते używana z तुम, gdy pytamy mężczyznę.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson03.fill.002
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: fill_in_blank
  frame:
    text: मैं शाम को छह बजे वापस {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: आता to forma męska, więc mówi mężczyzna; kobieta powiedziałaby आती.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson03.translate.003
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: Wieczorem wracam. (mówi mężczyzna)
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं शाम को वापस {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: को po शाम oznacza „wieczorem”, a वापस आना znaczy „wracać”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson03.translate.004
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: Jem kolację. (mówi kobieta)
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रात का खाना {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रात का खाना, dosłownie „posiłek nocy”, znaczy „kolacja”; końcówka -ती pokazuje, że mówi kobieta.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit10.lesson03.translate.005
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'वापस znaczy „z powrotem” i łączy się z czasownikami takimi jak आना: वापस आता हूँ, „wracam”.'
    language_code: pl
    direction: ltr
