templates:
- content_key: practice.pl-hi.hi.a1.unit05.lesson01.choose.001
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: माता-पिता (rodzice) łączy माता, formalne słowo oznaczające matkę, z पिता (ojciec), podobnie jak दादा-दादी obejmuje oboje dziadków.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson02.listen.001
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: W hindi dziadkowie ze strony ojca (दादा, दादी) mają inne nazwy niż dziadkowie ze strony matki (नाना, नानी).
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson03.choose.001
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'बड़ा i छोटा łączą się z rzeczownikami rodzaju męskiego, a बड़ी i छोटी z rzeczownikami rodzaju żeńskiego; oba słowa określają też wiek: starszy lub młodszy.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson02.match.002
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Hindi słowa o rodzinie występują parami rodzaju męskiego i żeńskiego: भाई i बहन, दादा i दादी, नाना i नानी.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson01.order.002
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरा {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: भाई jest rodzaju męskiego, więc występuje z मेरा; słowo rodzaju żeńskiego, jak बहन, występuje z मेरी.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson01.order.003
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहन jest rodzaju żeńskiego, więc zaimek dzierżawczy to मेरी, a nie मेरा.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson01.order.004
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरे {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Z szacunku dla starszej osoby मेरा zmienia się w मेरे, a है w हैं, nawet gdy mowa o jednej osobie.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson02.order.003
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: word_order
  frame:
    text: मेरे माता-पिता {city} में रहते हैं।
    language_code: hi
    direction: ltr
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में po nazwie miasta oznacza „w”, a czasownik przy grzecznościowej liczbie mnogiej to रहते हैं.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson03.order.002
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: word_order
  frame:
    text: मेरा एक {item} भाई भी है।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा एक {item} भाई भी है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बड़ा i छोटा zgadzają się z rzeczownikiem rodzaju męskiego भाई, a एक oznacza tu „jakiś/jeden” w znaczeniu nieokreślonym, a nie liczebnik podkreślający ilość.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson01.fill.005
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: fill_in_blank
  frame:
    text: तुम्हारा {item} कहाँ रहता है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: परिवार traktuje się jako rzeczownik rodzaju męskiego w liczbie pojedynczej, dlatego czasownik ma formę रहता है.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson02.fill.004
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: fill_in_blank
  frame:
    text: मेरे दादा-दादी दिल्ली में {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Przy dziadkach, o których mówi się z szacunkiem i w liczbie mnogiej, czasownik ma formę रहते हैं, a nie रहता है.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson03.fill.003
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: fill_in_blank
  frame:
    text: मेरी भी एक {item} बहन है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: छोटी to forma żeńska, bo बहन jest rodzaju żeńskiego; przy bracie byłoby छोटा.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson02.translate.005
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: translation
  frame:
    text: Moi rodzice mieszkają w {city}.
    language_code: pl
    direction: ltr
    slot_rendering:
      city: english_gloss
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Rodzice to osoby, które darzy się szacunkiem, dlatego używa się मेरे i czasownika w liczbie mnogiej रहते हैं.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson01.translate.006
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: Gdzie mieszka twoja rodzina? (nieformalnie)
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा {item} कहाँ रहता है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Z grzecznościowym आप powiedziałbyś: आपका परिवार कहाँ रहता है?'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson01.translate.007
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: To jest mój ojciec. (powiedziane z szacunkiem)
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Szacunek widać dwukrotnie: मेरे zamiast मेरा i हैं zamiast है.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit05.lesson01.translate.008
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: W hindi są dwa słowa na dziadka i dwa na babcię, zależnie od tego, czy są ze strony ojca, czy matki.
    language_code: pl
    direction: ltr
