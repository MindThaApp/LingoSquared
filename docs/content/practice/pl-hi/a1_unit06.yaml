templates:
- content_key: practice.pl-hi.hi.a1.unit06.lesson01.choose.001
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: खाना to rzeczownik rodzaju męskiego oznaczający jedzenie lub posiłek; चाय i कॉफ़ी są rodzaju żeńskiego, a पानी i जूस męskiego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson01.listen.002
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Hindi nadaje rodzaj także nazwom napojów: पानी i जूस są rodzaju męskiego, चाय i कॉफ़ी żeńskiego.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson01.fill.003
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: fill_in_blank
  frame:
    text: आपको क्या {item}? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: चाहिए nie zmienia się w zależności od płci mówiącego (inaczej niż चाहता i चाहती) i nie występuje z है.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson01.translate.004
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: Czego chcesz? (nieformalnie)
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें क्या {item}?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Z आप to samo pytanie brzmi आपको क्या चाहिए?; zmienia się tylko słowo oznaczające „ty”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson01.translate.005
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: Poproszę herbatę, dziękuję.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} चाहिए, शुक्रिया।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए dosłownie znaczy „mnie ... potrzebne”, więc to, czego chcesz, stoi między tymi dwoma słowami.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson01.translate.006
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: W hindi nie ma rodzajników, więc खाना może znaczyć jedzenie lub posiłek, zależnie od sytuacji.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson02.choose.001
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: रोटी, दाल i सब्ज़ी są rzeczownikami rodzaju żeńskiego, a चावल (ryż) męskiego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson02.match.002
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'W hindi na pierwszym miejscu stoi naczynie, a słowa „z” brakuje: एक गिलास पानी to dosłownie „jedna szklanka woda”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson02.order.003
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: word_order
  frame:
    text: मुझे एक प्लेट {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे एक प्लेट {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'W hindi nie ma słowa łączącego w wyrażeniu „talerz ryżu”: naczynie stoi przed jedzeniem.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson02.order.004
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: word_order
  frame:
    text: यह {item} बहुत स्वादिष्ट है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बहुत स्वादिष्ट है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: स्वादिष्ट nie zmienia się w rodzaju męskim i żeńskim, inaczej niż अच्छा i अच्छी.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson02.fill.005
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: fill_in_blank
  frame:
    text: नहीं, {item}, शुक्रिया। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'नहीं, बस grzecznie odmawia dalszego jedzenia lub picia: nie, wystarczy.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson02.fill.006
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: fill_in_blank
  frame:
    text: मुझे कॉफ़ी चाहिए, {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कृपया to grzeczne słowo „proszę” i może stać na końcu prośby.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson02.translate.007
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: translation
  frame:
    text: Poproszę szklankę wody.
    language_code: pl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे एक {item} पानी चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Miara, taka jak गिलास, stoi bezpośrednio przed tym, co mierzy, bez słowa łączącego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson02.translate.008
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: translation
  frame:
    text: Ten dal jest bardzo smaczny.
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बहुत स्वादिष्ट है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: दाल jest rodzaju żeńskiego, ale स्वादिष्ट pozostaje bez zmian przy rzeczownikach żeńskich i męskich.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson03.choose.001
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: या łączy dwie możliwości, jak w तुम्हें चाय चाहिए या कॉफ़ी?, a खाते हैं po चलो tworzy propozycję.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson03.fill.002
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: fill_in_blank
  frame:
    text: तुम्हें चाय चाहिए {item} कॉफ़ी? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: W pytaniu या daje wybór między dwiema rzeczami, tak jak polskie „czy” lub „albo”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit06.lesson03.translate.003
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: translation
  frame:
    text: Chodźmy coś zjeść!
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो plus czasownik w liczbie mnogiej z końcówką -ते i हैं to zwykły sposób na wyrażenie propozycji.
    language_code: pl
    direction: ltr
