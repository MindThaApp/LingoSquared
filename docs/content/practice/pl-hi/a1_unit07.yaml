templates:
- content_key: practice.pl-hi.hi.a1.unit07.lesson01.choose.001
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दुकानदार składa się z दुकान (sklep) i końcówki -दार, która często oznacza osobę, która coś prowadzi lub posiada.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson01.listen.002
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कमीज़ i टोपी to rzeczowniki rodzaju żeńskiego, a बैग jest rodzaju męskiego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson01.order.003
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: word_order
  frame:
    text: मुझे यह {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'यह (ten/ta) stoi tuż przed rzeczownikiem, na który wskazuje: मुझे यह कमीज़ चाहिए.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson01.fill.004
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: fill_in_blank
  frame:
    text: जी नहीं, {item} यह। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जी नहीं to grzeczne „nie”; सिर्फ़ zawęża prośbę do samego tego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson01.match.005
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: W hindi nazwy związane ze sklepem nie mają rodzajnika, więc बाज़ार może znaczyć „targ” lub „ten targ”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson01.translate.006
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: Poproszę tę koszulę.
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए pozostaje takie samo niezależnie od mówiącego, a यह wskazuje na rzeczownik tuż po nim.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson01.translate.007
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: W hindi sprzedający to दुकानदार, a miejsce to दुकान; sam targ to बाज़ार.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson02.choose.001
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'सस्ता i महंगा zmieniają się tak jak मेरा i मेरी: rzeczowniki rodzaju żeńskiego mają सस्ती i महंगी.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson02.order.002
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: word_order
  frame:
    text: यह टोपी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह टोपी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'टोपी jest rodzaju żeńskiego, więc przymiotnik kończy się na -ी: सस्ती lub महंगी.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson02.fill.003
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह कमीज़ बहुत {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कमीज़ jest rodzaju żeńskiego, więc przymiotnik to महंगी, a nie महंगा.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson02.fill.004
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह बैग {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बैग jest rodzaju męskiego, więc przymiotnik to सस्ता, a nie सस्ती.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson02.translate.005
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 'Ile kosztuje ta koszula? (dosłownie: ta koszula jest za ile?)'
    language_code: pl
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: यह कमीज़ कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'का lub की w pytaniu o cenę zgadza się z wycenianym przedmiotem, a nie z कितने: कमीज़ jest rodzaju żeńskiego, więc की.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson02.translate.006
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 'Ile kosztuje ta torba? (dosłownie: ta torba jest za ile?)'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह बैग कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'का lub की w pytaniu o cenę zgadza się z wycenianym przedmiotem: बैग jest rodzaju męskiego, więc का.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson03.listen.001
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'खरीदते हैं po चलो tworzy propozycję, a खरीदना to forma podstawowa: kupować.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson03.order.002
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: word_order
  frame:
    text: ठीक है! {item} या टोपी?
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: ठीक है! {item} या टोपी?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: या łączy dwie możliwości, a pytanie zaznacza się tylko wznoszącą intonacją i znakiem zapytania.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson03.fill.003
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: चलो, कुछ {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खरीदते z हैं po चलो znaczy „kupmy”; forma na -ते nie zależy od rodzaju grupy.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson03.fill.004
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: यह टोपी पाँच सौ रुपये {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: W zdaniu यह टोपी पाँच सौ रुपये की है, की zgadza się z rzeczownikiem rodzaju żeńskiego टोपी.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit07.lesson03.translate.005
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: translation
  frame:
    text: Kupmy coś!
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो plus czasownik w liczbie mnogiej z końcówką -ते i हैं to zwykły sposób na wyrażenie propozycji.
    language_code: pl
    direction: ltr
