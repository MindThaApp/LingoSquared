templates:
- content_key: practice.pl-hi.hi.a1.unit08.lesson01.choose.001
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Wszystkie te określenia miejsc są rodzaju męskiego, więc czasownik lub przymiotnik uzgodniony z nimi przyjmuje formę na -ा.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson01.listen.002
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: यहाँ i वहाँ to przysłówki, więc nigdy nie zmieniają się ze względu na rodzaj ani liczbę.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson01.order.003
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: word_order
  frame:
    text: मैं {item} में हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में po nazwie miejsca oznacza „w”, a हूँ występuje z मैं.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson01.order.004
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: word_order
  frame:
    text: बैंक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Czasownik है zwykle stoi na końcu, po określeniu miejsca: बैंक वहाँ है znaczy dosłownie „bank tam jest”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson01.fill.005
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: fill_in_blank
  frame:
    text: स्कूल {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: यहाँ znaczy „tutaj”, czyli blisko mówiącego, a वहाँ – „tam”, czyli z dala od mówiącego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson01.translate.006
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: translation
  frame:
    text: Bank jest tam.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: W hindi nie ma rodzajników, więc बैंक może znaczyć po prostu „bank” albo „ten bank”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson01.translate.007
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: W hindi wiele nazw miejsc to zapożyczenia z angielskiego, np. स्कूल, बैंक, पार्क i स्टेशन.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson02.choose.001
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पास, सामने i पीछे przyjmują के po miejscu odniesienia: बैंक के पास, „blisko banku”.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson02.match.002
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Hindi określenia miejsca tworzą pary przeciwieństw: यहाँ i वहाँ, पास i दूर, सामने i पीछे.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson02.order.003
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: word_order
  frame:
    text: स्कूल बैंक के {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: स्कूल बैंक के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के łączy miejsce odniesienia z पास, सामने lub पीछे; w polskim odpowiada temu dopełniacz, np. „blisko banku”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson02.fill.004
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: fill_in_blank
  frame:
    text: पार्क स्कूल के {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पीछे i सामने są przeciwieństwami, więc te same dwa miejsca można opisać z obu stron.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson02.fill.005
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: fill_in_blank
  frame:
    text: स्टेशन {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'दूर może stać samodzielnie (स्टेशन दूर है), a z miejscem odniesienia łączy się z से, nie z के: बैंक से दूर.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson02.translate.006
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: translation
  frame:
    text: Szkoła jest naprzeciwko parku.
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: स्कूल पार्क के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के po miejscu odniesienia łączy je z सामने, „naprzeciwko”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson02.translate.007
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: translation
  frame:
    text: Bank jest blisko szkoły.
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक स्कूल के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: To पास znaczy „blisko”; w मेरे पास znaczy „mam” – jedno słowo, dwa zastosowania.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson03.listen.001
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: तो w zwrocie हाँ, तो ... wprowadza wniosek, a थोड़ा znaczy „trochę”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson03.order.002
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: word_order
  frame:
    text: यह {item} बैंक के पास है।
    language_code: hi
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बैंक के पास है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: डाकघर to złożenie słów डाक (poczta) i घर (dom), dosłownie „dom poczty”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson03.fill.003
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: fill_in_blank
  frame:
    text: हाँ, {item} दूर है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थोड़ा przed przymiotnikiem lub przysłówkiem łagodzi go, podobnie jak polskie „trochę”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit08.lesson03.translate.004
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: translation
  frame:
    text: Tak, poczta jest blisko banku.
    language_code: pl
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: हाँ, {item} बैंक के पास है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Najpierw stoi miejsce odniesienia बैंक, potem के पास, a na końcu है.
    language_code: pl
    direction: ltr
