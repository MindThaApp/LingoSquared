  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कितने बजे है? to codzienny sposób pytania, o której godzinie coś się dzieje.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit04.lesson01.fill.005
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: fill_in_blank
  frame:
    text: अभी पाँच {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Jest ... (godzina) – dla godzin od drugiej do dwunastej używa się बजे हैं; बजे znaczy też „o godzinie ...”, jak w सुबह सात बजे.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit04.lesson03.fill.002
  lesson_content_key: hi.a1.unit04.lesson03.agli_class_ka_samay
  type: fill_in_blank
  frame:
    text: ठीक है, {item} मिलते हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ठीक है, कल मिलते हैं dosłownie znaczy „dobrze, jutro się spotykamy”; czas teraźniejszy często odnosi się do bliskiej przyszłości.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit04.lesson01.translate.006
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: translation
  frame:
    text: Która jest godzina?
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} बजे हैं?'
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Aby podać godzinę, postaw liczebnik przed बजे: अभी पाँच बजे हैं.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit04.lesson02.translate.004
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: translation
  frame:
    text: Następna lekcja jest o piątej po południu.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: अगली क्लास {item} पाँच बजे है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अगली zgadza się z żeńskim rzeczownikiem क्लास, dlatego kończy się na -ी, a nie na -ा.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit04.lesson01.translate.007
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: translation
  frame:
    text: Teraz jest pierwsza.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Pierwsza to jedyna godzina z czasownikiem w liczbie pojedynczej: एक बजा है, ale दो बजे हैं.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit04.lesson02.translate.005
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: translation
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'W hindi nie ma osobnego słowa na południe: दोपहr obejmuje środek dnia i popołudnie.'
    language_code: pl
    direction: ltr
