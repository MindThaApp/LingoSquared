templates:
- content_key: practice.pl-hi.hi.a1.unit04.lesson01.choose.001
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बजे (o'clock) stoi po liczebniku; tylko przy podawaniu aktualnej godziny pierwszej mówi się एक बजा है, natomiast o pierwszej to nadal एक बजे.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit04.lesson02.listen.001
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: W hindi dzień dzieli się na सुबह, दोपहर, शाम i रात; nie ma jednego słowa na oznaczenie a.m. ani p.m.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit04.lesson03.choose.001
  lesson_content_key: hi.a1.unit04.lesson03.agli_class_ka_samay
  type: multiple_choice
