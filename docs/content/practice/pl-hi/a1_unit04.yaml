  feedback_frame:
    text: Pory dnia to rzeczowniki używane bez rodzajnika; सुबह, शाम i रात są rodzaju żeńskiego.
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit04.lesson01.order.002
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: word_order
  frame:
    text: अभी पाँच {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी पाँच {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Przy podawaniu godziny każda godzina oprócz pierwszej ma बजे z czasownikiem w liczbie mnogiej: पाँच बजे हैं, ale एक बजा है.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit04.lesson01.order.003
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: word_order
  frame:
    text: अभी एक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Tylko pierwsza godzina ma बजा w liczbie pojedynczej i है w liczbie pojedynczej: एक बजा है.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit04.lesson02.order.003
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: word_order
  frame:
    text: क्लास {item} सात बजे है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: क्लास {item} सात बजे है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Pora dnia stoi bezpośrednio przed godziną, bez żadnego słowa pomiędzy nimi: सुबह सात बजे.'
    language_code: pl
    direction: ltr
- content_key: practice.pl-hi.hi.a1.unit04.lesson01.fill.004
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
