    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कल znaczy zarówno „jutro”, jak i „wczoraj”; o znaczeniu decyduje czas czasownika.
    language_code: pl
    direction: ltr
