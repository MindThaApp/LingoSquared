- content_key: practice.ja-it.it.a1.unit65.lesson01.order.002
  lesson_content_key: it.a1.unit65.lesson01.voglio_guardare_un_film
  type: word_order
  frame:
    text: Voglio {item} un film.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags:
        semantic: w_guardare
  answer_derivation:
    kind: render_frame
    frame:
      text: Voglio {item} un film.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 映画を見たいです。guardare は「見る、眺める」という意味です。
    language_code: ja
    direction: ltr
