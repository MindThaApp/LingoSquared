    direction: ltr
- content_key: practice.ja-it.it.a1.unit65.lesson04.match.001
  lesson_content_key: it.a1.unit65.lesson04.al_cinema
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
