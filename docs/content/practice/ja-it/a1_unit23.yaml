templates:
- content_key: practice.ja-it.it.a1.unit23.lesson01.choose.001
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pronto は、イタリア語で電話に出るときの言葉です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson01.listen.002
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chi は「だれ」という意味で、chi parla? の形で使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson01.order.003
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: word_order
  frame:
    text: Pronto, {item} parla?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Pronto, {item} parla?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Pronto, chi parla? は、電話での決まった出だしの言葉です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson01.order.004
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: word_order
  frame:
    text: Ti mando un {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ti mando un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un messaggio は男性名詞なので、un がつきます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson01.fill.005
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: fill_in_blank
  frame:
    text: Ti {item} un messaggio. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mando は mandare の「私」の形で、「(私は)送る」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson01.translate.006
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: translation
  frame:
    text: もしもし、どちら様ですか。
    language_code: ja
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Pronto, {item} parla?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Pronto は電話に出るときの言葉で、chi は「だれ」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson01.translate.007
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: translation
  frame:
    text: あなたにメッセージを送ります。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Ti {item} un messaggio.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ti は「あなたに」という意味で、動詞の前に置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson01.translate.008
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: あいさつとしての pronto は電話でだけ使います。それ以外の場面では「準備ができた」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson02.choose.001
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Puoi は potere の親しい相手向けの tu の形で、「(あなたは)できる」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson02.order.002
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: word_order
  frame:
    text: Sam, puoi {item}, per favore?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sam, puoi {item}, per favore?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Puoi のあとに不定詞を続けると、相手に何かをしてほしいとお願いする表現になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson02.order.003
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: word_order
  frame:
    text: Parla più {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parla più {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Più piano は「もっとゆっくり」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson02.fill.004
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: fill_in_blank
  frame:
    text: Sam, {item} ripetere, per favore? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Puoi は tu の形なので、語尾が -i になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson02.translate.005
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: translation
  frame:
    text: サム、もう一度言ってくれますか。(親しい相手向け、tu)
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Sam, {item} ripetere, per favore?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Puoi は親しい相手向けの形で、友だちに対して使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit23.lesson02.translate.006
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: translation
  frame:
    text: もっとゆっくり話してください。(親しい相手向け、tu)
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parla più {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Piano は「遅い」とも「ゆっくり」とも訳せます。
    language_code: ja
    direction: ltr
