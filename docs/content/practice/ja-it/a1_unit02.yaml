templates:
- content_key: practice.ja-it.it.a1.unit02.lesson01.choose.001
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 国籍を表す語は話す人によって変わります。男性は americano、女性は americana です。italiano と italiana も同じです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson01.order.002
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: word_order
  frame:
    text: Di {item} sei?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? は友だちに出身をたずねる言い方です。初対面の人には Di dov'è, Lei? と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson01.fill.003
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: fill_in_blank
  frame:
    text: Sono italiana, di {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 都市名は、イタリア語の綴りで覚えましょう。Milano はミラノのことです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson01.match.004
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 語尾で性別がわかります。男性は -o(americano)、女性は -a(americana)です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson01.translate.005
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: イタリア語では、国籍や言語の名前を大文字で始めません：italiano, inglese。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson01.translate.006
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: どこの出身？（くだけた表現）
    language_code: ja
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? は tu を使う質問です。丁寧な Lei の言い方は Di dov'è, Lei? です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson02.choose.001
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 動詞の語尾で、だれの動作かがわかります。parlo は「私が話す」、parli は「あなたが話す」(くだけた言い方)、parla は「あなたが話す」(丁寧な言い方)または「彼・彼女が話す」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson02.listen.002
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Parli と parla は音が似ています。最後の母音が、tu(-i)か Lei(-a)かを教えてくれます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson02.order.003
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: word_order
  frame:
    text: Parlo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parlo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: parlare のあとに言語名がくるときは、普通は冠詞が要りません：parlo inglese, parlo italiano。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson02.fill.004
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: fill_in_blank
  frame:
    text: Da {item} studi? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Da quanto studi? は、どのくらい勉強しているかをたずねる質問です。イタリア語では、「〜前から」を表す da と現在形を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson02.translate.005
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: translation
  frame:
    text: 英語を話しますか？(くだけた言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Parli {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Parli は tu の形です。初対面の人には Lei の形を使って、Parla inglese? と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson03.choose.001
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fai と fa はどちらも fare の形です。fai は tu、fa は Lei または彼・彼女に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson03.listen.002
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ingegnere は後ろから2番目の音節にアクセントがあります：in-ge-GNE-re。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson03.order.003
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: word_order
  frame:
    text: Che {item} fai?
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} fai?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che lavoro fai? は直訳すると「どんな仕事をしていますか」です。丁寧な言い方は Che lavoro fa, Lei? です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson03.fill.004
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: fill_in_blank
  frame:
    text: Che lavoro {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fai は fare の tu の形です。Lei のときは fa になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson03.match.005
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Che は使い道の広い語です。Che lavoro fai? では「何の」、Che bello! では「なんて」という意味になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson03.translate.006
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Per は「〜のために」「〜の間」を表します。per lavoro は「仕事で」、per due anni は「2年間」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit02.lesson03.translate.007
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: translation
  frame:
    text: 仕事でここに来ています。
    language_code: ja
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono qui per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: ここでは per のあとに冠詞をつけません：per lavoro(仕事で)。
    language_code: ja
    direction: ltr
