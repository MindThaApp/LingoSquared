- content_key: practice.ja-it.it.a1.unit13.lesson01.choose.001
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Andato と andata は、「行く」の過去の形の男性形と女性形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson01.listen.002
