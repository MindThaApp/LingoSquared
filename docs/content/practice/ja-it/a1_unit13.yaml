    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 多くの過去形は ho と過去分詞で作ります:ho visto、ho mangiato、ho fatto。andare は代わりに sono を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson02.choose.002
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pranzo は「昼食」という意味で、a と一緒に使います:a pranzo。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson02.listen.003
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ho mangiato は「私は食べました」、hai fatto は「あなたはしました」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson02.fill.004
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
