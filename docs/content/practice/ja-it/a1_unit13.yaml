- content_key: practice.ja-it.it.a1.unit13.lesson01.translate.007
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: translation
  frame:
    text: 昨日、映画に行きました。(男性が言う場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono {item} al cinema ieri.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 男性は sono andato、女性は sono andata と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson01.translate.008
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: translation
  frame:
    text: 昨日、映画を見に行きました。(女性の発言)
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono {item} al cinema ieri.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Andare は sono を使うので、語尾は話し手に合わせて変わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson01.translate.009
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: translation
  frame:
    text: いい映画を見ました!
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho visto un bel {item}!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Vedere は ho を使います:ho visto(見ました)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson02.match.001
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
