    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mangiato は、ho の後に使う過去の形(過去分詞)です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson02.fill.005
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
