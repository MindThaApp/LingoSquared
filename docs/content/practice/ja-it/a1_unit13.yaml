    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A pranzo は「昼食に」「昼食の時間に」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson02.order.006
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: word_order
  frame:
    text: Cosa hai {item} ieri?
    language_code: it
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa hai {item} ieri?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai fatto は「あなたはした」または「あなたは作った」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson02.translate.007
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: translation
  frame:
    text: 昼食にサンドイッチを食べました。
    language_code: ja
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho mangiato un panino a {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: A pranzo は「昼食に」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson02.translate.008
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: translation
  frame:
    text: 昨日は何をしましたか?(親しい相手に、tu)
    language_code: ja
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa hai {item} ieri?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai fatto は親しい相手に使う tu の形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson02.translate.009
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
