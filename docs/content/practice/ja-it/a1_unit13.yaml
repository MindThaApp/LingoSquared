    slot: item
  feedback_frame:
    text: Andata は女性が、andato は男性が使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson01.order.003
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: word_order
  frame:
    text: Sono {item} al cinema ieri.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono {item} al cinema ieri.
      language_code: it
      direction: ltr
  feedback_frame:
    text: sono と一緒に使うとき、過去分詞は話し手の性に合わせます。男性は andato、女性は andata です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit13.lesson01.fill.004
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
