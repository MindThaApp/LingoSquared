  frame:
    text: たいてい何時に朝食をとりますか?(親しい相手に使う tu の形)
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: A che ora fai colazione di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di solito は「たいてい」という意味で、fai は親しい相手に使う tu の形です。
    language_code: ja
    direction: ltr
