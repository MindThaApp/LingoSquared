  lesson_content_key: it.a1.unit11.lesson02.a_che_ora_torni_a_casa
  type: word_order
  frame:
    text: Vado a letto {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Vado a letto {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: ここでは presto は「早く」の意味です。a presto(また近いうちに)では「まもなく」の意味になります。
