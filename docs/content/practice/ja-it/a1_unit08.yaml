templates:
- content_key: practice.ja-it.it.a1.unit08.lesson01.choose.001
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mele は mela の複数形です。-a で終わる女性名詞は、複数形が -e になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson01.listen.002
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mele, banane, patate は女性複数形で le が付き、pomodori は男性複数形で i が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson01.order.003
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: word_order
  frame:
    text: Quanto costano le {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costano le {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Le は女性複数形の名詞に付きます。複数の物の値段を言うので、動詞も複数形の costano になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson01.order.004
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: word_order
  frame:
    text: Quanto costano i {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costano i {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Pomodori は男性複数形なので、le ではなく i が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson01.fill.005
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: fill_in_blank
  frame:
    text: Costano tre euro al {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al chilo は「1キロあたり」という意味で、野菜や果物の値段を言うときの一般的な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson01.fill.006
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: fill_in_blank
  frame:
    text: Quanto {item} le mele? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mele は複数形なので、動詞は costa ではなく costano です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson03.match.001
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: イタリアのお店では、果物や野菜はキロ単位で値段が付けられています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson01.translate.007
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: りんごはいくらですか?
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto {item} le mele?
      language_code: it
      direction: ltr
  feedback_frame:
    text: '複数形の名詞には costano を使います: quanto costano le mele.'
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson01.translate.008
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: 1キロ3ユーロです。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costano tre euro al {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: '数字の後でも、イタリア語の euro は形が変わりません: tre euro.'
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson01.translate.009
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: りんごを1キロお願いします。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un {item} di mele, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Di は量と物をつなぎます: un chilo di mele.'
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson01.translate.010
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mele, banane, pomodori, patate は、キロ単位で買うので、ここでは複数形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson03.choose.002
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lo prendo は「それにします」という意味で、lo は男性名詞の品物を指します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson03.listen.003
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Va bene は「いいですよ」と言うときの、とてもよく使われる表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson03.fill.004
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: fill_in_blank
  frame:
    text: Va bene, {item} prendo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Lo は「それを」という意味で、動詞の前に置きます: lo prendo.'
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson03.order.005
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: word_order
  frame:
    text: Va bene, lo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Prendo は prendere(取る)の「私」の形で、値段に納得して買うときに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit08.lesson03.translate.006
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: translation
  frame:
    text: じゃあ、それにします。
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Va bene, lo prendo は、買い物を決めるときの定番の言い方です。
    language_code: ja
    direction: ltr
