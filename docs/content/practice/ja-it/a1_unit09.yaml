templates:
- content_key: practice.ja-it.it.a1.unit09.lesson01.choose.001
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La farmacia、la banca、la stazione は女性名詞です。l'ufficio postale は男性名詞で、冠詞が l' の形になっています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson01.listen.002
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Via は「通り」や「道」の意味で、Via Roma のように通りの名前に使われます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson01.order.003
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: word_order
  frame:
    text: Scusi, dov'è la {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dov'è la のあとに女性名詞を続けると、場所がどこにあるかをたずねられます。scusi は丁寧な「すみません」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson01.fill.004
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: fill_in_blank
  frame:
    text: È qui {item}, in Via Roma. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Qui vicino は「この近く」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson01.match.005
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Vicino は「近い」、qui vicino は「この近く」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson01.translate.006
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: すみません、薬局はどこですか。(丁寧な言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi は丁寧な命令形(Lei に対する形)で、知らない人に話しかけるときに合います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson01.translate.007
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: il か la かは名詞の性で変わりますが、母音の前では l' を使います:l'ufficio。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson02.choose.001
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: C'è は「〜がある」とたずねたり述べたりする表現で、ce n'è は「それが1つある」と答える表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson02.listen.002
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ce n'è una は「1つあります」という意味で、ne は「それらのうち」を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson02.fill.003
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: C'è una {item} qui vicino? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: C'è una banca? は、この近くに銀行が存在するかどうかをたずねる文です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson02.order.004
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: word_order
  frame:
    text: Sì, {item} una qui vicino.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, {item} una qui vicino.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ce n'è una は、c'è una ... の質問に「1つあります」と答える表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson02.fill.005
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: È {item} alla stazione. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Accanto alla は「〜のそばの」という意味で、alla は前置詞 a と冠詞 la が合わさった形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson02.fill.006
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: Sì, ce n'è una qui vicino, accanto {item} stazione. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alla は、女性名詞の前で前置詞 a と冠詞 la が合わさった形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson02.translate.007
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: この近くに銀行はありますか。
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: C'è una {item} qui vicino?
      language_code: it
      direction: ltr
  feedback_frame:
    text: C'è una banca qui vicino? で una を使うのは、banca が女性名詞だからです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson02.translate.008
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: はい、この近くに1軒あります。
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, {item} una qui vicino.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ce n'è una は「それが1つあります」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit09.lesson02.translate.009
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: 駅のそばです。
    language_code: ja
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: È {item} alla stazione.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Accanto alla stazione は「駅のそば」という意味です。
    language_code: ja
    direction: ltr
