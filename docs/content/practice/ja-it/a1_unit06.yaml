templates:
- content_key: practice.ja-it.it.a1.unit06.lesson01.choose.001
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 所有詞がつくと、単数の家族名詞には冠詞をつけません:mio padre, mia madre.
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson01.listen.002
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Padre と madre はどちらも -e で終わりますが性が違うので、それぞれ性とセットで覚えましょう。nonno と nonna は -o と -a で終わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson01.order.003
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: word_order
  frame:
    text: Questo è mio {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Questo è mio {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Questo と mio は男性形なので、男性名詞と一緒に使います:questo è mio padre.
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson01.fill.004
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: fill_in_blank
  frame:
    text: Questa è mia {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Questa と mia は女性形で、madre に合わせた形です:こちらは私の母です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson01.translate.005
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: こちらは私の母です。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Questa è mia {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 女性名詞には questa と mia、男性名詞には questo と mio を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson01.translate.006
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Madre と padre、fratello と sorella、nonno と nonna は、家族を表す語の男性形と女性形のペアです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson02.choose.001
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fratelli は fratello の複数形で、「きょうだい」の意味にもなります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson02.listen.002
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marito と moglie は夫と妻です。moglie は -e で終わりますが女性名詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson02.order.003
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: word_order
  frame:
    text: Ho un fratello e una {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un は男性名詞に、una は女性名詞に使います:un fratello, una sorella.
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson02.fill.004
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: fill_in_blank
  frame:
    text: Hai fratelli o {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: sorella の複数形は sorelle で、語尾の -a が -e になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson02.translate.005
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: 兄弟が一人と姉妹が一人います。
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ho は「私は持っています」という意味です。男性名詞の前には un、女性名詞の前には una を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson02.translate.006
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: 兄弟か姉妹はいますか?(親しい相手への tu)
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai fratelli o {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai は「持っている」の親称 tu の形なので、この質問は友人や同僚に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson03.match.001
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 家族を表す語には、男性形と女性形のペアがあります:marito と moglie、figlio と figlia。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson03.choose.002
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Figli は子どもたち全般を指し、figlio と figlia はそれぞれ息子と娘を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson03.listen.003
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Maschio と femmina は、家族の中の男の子と女の子を表すときに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson03.fill.004
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: fill_in_blank
  frame:
    text: Sì, ho due {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Figli は figlio の複数形で、男女どちらの子どもも含みます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson03.translate.005
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: translation
  frame:
    text: お子さんはいますか?(親しい相手への tu)
    language_code: ja
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai figli? は、相手に子どもがいるかどうかを尋ねる親しい言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit06.lesson03.translate.006
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Figlio と figlia は息子と娘を表し、maschio と femmina は子どもたちのうちの男の子と女の子を表します。
    language_code: ja
    direction: ltr
