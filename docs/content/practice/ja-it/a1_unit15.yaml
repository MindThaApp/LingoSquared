  feedback_frame:
    text: Dei は男性複数名詞に、delle は女性複数名詞に付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson01.order.003
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: word_order
  frame:
    text: Voglio {item} caffè, meno tè.
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Voglio {item} caffè, meno tè.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Più は「もっと」、meno は「より少なく」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson01.order.004
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: word_order
  frame:
    text: I pomodori costano meno {item} mele.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: I pomodori costano meno {item} mele.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mele は女性複数形なので、di + le は delle になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson01.fill.005
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: fill_in_blank
  frame:
    text: Le mele costano più {item} pomodori. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pomodori は男性複数形なので、di + i は dei になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson01.translate.006
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: translation
  frame:
    text: りんごはトマトより高いです。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Le mele costano più {item} pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dei は di + i で、mele ではなく、比べる相手の pomodori に合わせた形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson01.translate.007
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: translation
  frame:
    text: トマトはりんごより安いです。
    language_code: ja
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: I pomodori costano meno {item} mele.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Meno delle は、女性複数名詞の前で「〜より少なく」を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson03.choose.001
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Quale は「どちら」という意味で、選択肢の中から選ぶよう尋ねるときに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson02.order.001
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: word_order
  frame:
    text: Ciao, {item} preferisci, le mele o i pomodori?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, {item} preferisci, le mele o i pomodori?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Quale preferisci? は、2つのうちどちらが好きかを尋ねる表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson02.fill.002
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: fill_in_blank
  frame:
    text: Ciao, {item} preferisci, il caffè o il tè? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quale は「どちら」という意味で、この疑問文では動詞の前に来ます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson02.translate.003
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: translation
  frame:
    text: こんにちは、りんごとトマトのどちらが好きですか？(親しい相手への言い方、tu)
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, {item} preferisci, le mele o i pomodori?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Preferisci は親しい相手に使う tu の形なので、この質問は友達向けです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson03.choose.002
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buone は buono の女性複数形で、mele に合わせた形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson03.listen.003
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buone が -e で終わるのは、女性複数名詞を説明しているからです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson03.order.004
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: word_order
  frame:
    text: Sì, le mele sono {item} come i pomodori.
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, le mele sono {item} come i pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Sono buone は複数形なので、女性複数の mele に合わせて buono は buone になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson03.fill.005
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: fill_in_blank
  frame:
    text: Le mele sono {item} come i pomodori. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Come は同等の2つのものを結びます。buone come は「〜と同じくらいおいしい」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit15.lesson03.translate.006
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: translation
  frame:
    text: りんごはトマトと同じくらいおいしいです。
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Le mele sono {item} come i pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Buone は mele に合わせた形で、この比較では come が「〜と同じくらい」を表します。
    language_code: ja
    direction: ltr
