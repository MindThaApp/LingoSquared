schema_version: '1.0'
pack_key: practice.ja-it.a1.unit58
source_language: ja
target_language: it
unit_content_key: it.a1.unit58.appuntamento
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_appuntamento
    - w_conferma
    - w_confermato
    - w_disponibile
    - w_fissare
    - w_informatica
    - w_maggio
    - w_ricordare
    - w_tredici
templates:
- content_key: practice.ja-it.it.a1.unit58.lesson01.choose.001
  lesson_content_key: it.a1.unit58.lesson01.fissare_un_appuntamento
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_fissare
        - w_appuntamento
        - w_disponibile
        - w_informatica
        - w_confermato
        - w_conferma
        - w_tredici
        - w_maggio
        - w_ricordare
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、この単元の単語です。予約を取るレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit58.lesson02.listen.001
  lesson_content_key: it.a1.unit58.lesson02.un_orario_e_disponibile
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、「空きがある時間」のレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit58.lesson03.translate.001
  lesson_content_key: it.a1.unit58.lesson03.per_che_cosa_e
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} はこのユニットの単語で、「予約は何のため？」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit58.lesson05.match.001
  lesson_content_key: it.a1.unit58.lesson05.leggere_una_conferma
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: イタリア語の単語と日本語の意味を結びましょう。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
