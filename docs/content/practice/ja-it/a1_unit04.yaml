templates:
- content_key: practice.ja-it.it.a1.unit04.lesson01.choose.001
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: イタリア語の曜日は小文字で書きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson01.listen.002
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Martedì と mercoledì は最後の音節にアクセント記号があり、そこを強く読みます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson01.order.003
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: word_order
  frame:
    text: Che {item} è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} è oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che giorno è oggi? は曜日をたずねる文です。日付をたずねるときは Che data è oggi? と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson01.fill.004
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: fill_in_blank
  frame:
    text: Che giorno è {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Oggi は「今日」、domani は「明日」で、同じ質問がどちらにも使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson01.match.005
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 月曜日から金曜日は、「日」を意味するラテン語 dies に由来する -dì で終わります。sabato と domenica は違います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson01.translate.006
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: translation
  frame:
    text: 今日は{day}です。
    language_code: ja
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi è {day}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 曜日をこのように使うときは、冠詞をつけません。Oggi è lunedì であり、Oggi è il lunedì ではありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson02.choose.001
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: イタリア語の月名は小文字で書きます:gennaio, febbraio, marzo。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson02.listen.002
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Febbraio には b が2つあります。長く保たれる子音に注意して聞きましょう。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson02.order.003
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: word_order
  frame:
    text: Che {item} è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} è oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Data は「日付」という意味です。Che data è oggi? は曜日ではなく、月と日をたずねます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson02.fill.004
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: fill_in_blank
  frame:
    text: Oggi è il {item} marzo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 日付は il + 基数で表します:il quindici marzo(3月15日)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson02.translate.005
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gennaio, febbraio, marzo, aprile は、1月から4月までの順に並んでいます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson02.translate.006
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: translation
  frame:
    text: 今日は{month}5日です。
    language_code: ja
    direction: ltr
    slot_rendering:
      month: english_gloss
  slots:
    month: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi è il cinque {month}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 日本語と逆に、イタリア語は日を先に言います:il cinque gennaio、直訳は「5日 1月」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson03.choose.001
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Arrivo は「私は着く」、arrivi は「あなたは着く」(くだけた言い方)です。語尾の -i が tu を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson03.order.002
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: word_order
  frame:
    text: Quando arrivi a {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Quando arrivi a {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Roma は「ローマ」です。前置詞 a は、都市名の前で「〜に」「〜で」を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson03.fill.003
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: fill_in_blank
  frame:
    text: Quando {item} a Roma? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quando arrivi? は友だちにいつ着くかをたずねる言い方で、丁寧な形は Quando arriva? です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson03.match.004
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Dopodomani は dopo(〜の後)と domani(明日)からできていて、「あさって」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson03.translate.005
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Arrivo は「私は着く」、arrivi は「あなたは着く」です。変わるのは最後の母音だけです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit04.lesson03.translate.006
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: translation
  frame:
    text: 木曜日の午後に着きます。
    language_code: ja
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Arrivo giovedì {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: イタリア語では、曜日の前に「〜に」にあたる語は要りません:arrivo giovedì(木曜日に着きます)。
    language_code: ja
    direction: ltr
