templates:
- content_key: practice.ja-it.it.a1.unit07.lesson01.choose.001
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cosa desidera? は、バールの店員が何にするかを尋ねる丁寧な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson01.listen.002
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Per favore は、どの注文にも添える丁寧な表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson01.order.003
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: word_order
  frame:
    text: Vorrei un caffè e un {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Vorrei は「〜をお願いしたい」という意味で、注文するときの丁寧な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson01.fill.004
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: fill_in_blank
  frame:
    text: Vorrei un caffè, per {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Per favore は「お願いします」という意味で、依頼の最後に置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson01.translate.005
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: コーヒーとクロワッサンをお願いします。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un cornetto, per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un は caffè や cornetto のような男性名詞につき、per favore で依頼を締めくくります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson01.translate.006
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: 何になさいますか?(丁寧な Lei)
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Desidera は店員が使う丁寧な Lei の形で、親称の tu の形ではありません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson03.choose.001
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Basta così は「以上です、もう結構です」という意味の決まり文句です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson03.listen.002
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Così は「このように」「それで」という意味で、basta così では注文を締めくくります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson02.fill.001
  lesson_content_key: it.a1.unit07.lesson02.ordinare_al_bar
  type: fill_in_blank
  frame:
    text: Grazie, {item} così. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Basta は「十分です」という意味で、basta così で店員にもう十分だと伝えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson02.translate.002
  lesson_content_key: it.a1.unit07.lesson02.ordinare_al_bar
  type: translation
  frame:
    text: 以上です、ありがとう。
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} così, grazie.'
      language_code: it
      direction: ltr
  feedback_frame:
    text: Basta così, grazie は、注文を終えるときの丁寧な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson03.choose.003
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Un'acqua にアポストロフィがあるのは、acqua が女性名詞で母音で始まるからです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson03.listen.004
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Il menù と il conto は男性名詞なので、il がつきます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson03.fill.005
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: fill_in_blank
  frame:
    text: Il {item}, per favore. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il conto, per favore は、お会計を頼むときの言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson03.order.006
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: word_order
  frame:
    text: Un panino e {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Un panino e {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un'acqua は女性形です。母音の前で una が un' になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson03.match.007
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Il panino と il conto は男性名詞で、l'acqua は女性名詞で母音の前の省略形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson03.translate.008
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: translation
  frame:
    text: サンドイッチと水をお願いします。
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Un panino e {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Acqua は女性名詞なので、「水を1つ」は una acqua となり、una の a が落ちて un'acqua になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson03.translate.009
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: translation
  frame:
    text: お会計をお願いします。
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Il {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Il conto は、食事の最後に頼む「お会計」のことです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit07.lesson03.translate.010
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'イタリア語の名詞には冠詞が付きます: il panino, l''acqua, il menù, il conto.'
    language_code: ja
    direction: ltr
