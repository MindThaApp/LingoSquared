templates:
- content_key: practice.ja-it.it.a1.unit05.lesson01.choose.001
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 時刻には女性複数の冠詞 le を使います。ore(時間)が女性複数だからです。例:sono le tre。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson01.listen.002
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 1時だけは例外です。l'una は単数なので、sono ではなく è を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson01.order.003
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: word_order
  frame:
    text: Che {item} sono?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} sono?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che ore sono? は直訳すると「時間はいくつですか」で、そのため答えも sono le で始まります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson01.fill.004
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: fill_in_blank
  frame:
    text: Sono {item} tre. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: le は、省略されている ore に合わせた形です。sono le tre は「3時です」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson01.translate.005
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: translation
  frame:
    text: '{n}時です。'
    language_code: ja
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le {n}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 1時の l'una 以外は、すべての時刻に sono le を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson02.choose.001
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: e は分を足し、meno は分を引きます。le tre e mezzo は3時30分、le quattro meno un quarto は3時45分です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson02.listen.002
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: mezzo の z は2つ重なります。音を少し長めに保ちましょう。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson02.order.003
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: word_order
  frame:
    text: Sono le tre e un {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le tre e un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: e un quarto は15分を足します。le tre e un quarto は3時15分です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson02.fill.004
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: fill_in_blank
  frame:
    text: Sono le tre e {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: mezzo は「半分」の意味なので、e mezzo は30分を足します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson02.match.005
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: mezzo は「半分」、quarto は「4分の1」です。まず時刻を言い、そのあとに e または meno を続けます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson02.translate.006
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: translation
  frame:
    text: 4時15分前です。
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le quattro meno un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: meno は次の時刻から引きます。le quattro meno un quarto は3時45分です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson02.translate.007
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: translation
  frame:
    text: 3時半です。
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le tre e {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: e mezzo(と半分)は、「〜時半」を言う日常的な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson03.choose.001
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: alle は「〜に」にあたる女性複数の形で、時刻に使います。alle tre は「3時に」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson03.listen.002
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ora は「時間」や「時刻」の意味で、ore はその複数形です。そのため質問は Che ore sono? になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson03.order.003
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: word_order
  frame:
    text: A che {item} ci vediamo?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: A che {item} ci vediamo?
      language_code: it
      direction: ltr
  feedback_frame:
    text: A che ora は「何時に」とたずねる表現です。ひとつの時点をたずねるので、ora は単数です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson03.fill.004
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: fill_in_blank
  frame:
    text: Ci vediamo {item} tre e mezzo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 1時以外のすべての時刻に alle を使います。1時は all'una と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson03.translate.005
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: translation
  frame:
    text: 3時半に会いましょう。
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ci vediamo {item} tre e mezzo.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo alle の後ろに時刻を続けるのが、待ち合わせを決める基本の言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit05.lesson03.translate.006
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: mattina は「朝」、sera は「夕方・夜」です。イタリア語ではその前に di を置きます。di mattina、di sera。
    language_code: ja
    direction: ltr
