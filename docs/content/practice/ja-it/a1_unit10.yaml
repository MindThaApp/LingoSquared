      text: È {item} da qui?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Lontano da qui は「ここから遠い」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit10.lesson02.translate.006
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: ここから遠いですか。
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: È {item} da qui?
      language_code: it
      direction: ltr
  feedback_frame:
    text: È lontano da qui? は、距離を尋ねる日常的な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit10.lesson02.translate.007
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: いいえ、歩いてたった5分です。
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: No, sono {item} cinque minuti a piedi.
      language_code: it
      direction: ltr
  feedback_frame:
    text: minuti が複数形なので、Sono cinque minuti を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit10.lesson02.translate.008
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: どうもありがとうございます、ご親切に。(丁寧な言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Grazie mille, {item} gentile.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Molto gentile は、丁寧にお礼を言うときの表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit10.lesson03.choose.001
  lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
