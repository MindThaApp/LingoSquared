  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: A piedi は「徒歩で」という意味で、直訳は「足で」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit10.lesson02.listen.003
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
