      direction: ltr
  feedback_frame:
    text: A destra と a sinistra は、曲がる方向を表す2つの表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit10.lesson01.fill.004
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: fill_in_blank
