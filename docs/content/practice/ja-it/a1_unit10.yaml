    text: Scusi, come arrivo al {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al museo は a + il で、al は男性名詞の場所に使う縮約形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit10.lesson02.match.001
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
