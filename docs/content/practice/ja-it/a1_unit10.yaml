    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit10.lesson01.translate.005
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: translation
  frame:
    text: すみません、博物館へはどう行けばいいですか。(丁寧な言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, come arrivo al {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi は、知らない人に丁寧に呼びかけるときに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit10.lesson01.translate.006
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: translation
  frame:
    text: まっすぐ行って、交差点で右に曲がってください。(丁寧な言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vada sempre dritto, poi giri a destra {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: All'incrocio は「交差点で」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit10.lesson02.choose.002
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
