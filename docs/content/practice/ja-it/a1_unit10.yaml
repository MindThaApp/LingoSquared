    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Solo を cinque minuti の前に置くと、「たった5分」という意味になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit10.lesson02.order.005
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
