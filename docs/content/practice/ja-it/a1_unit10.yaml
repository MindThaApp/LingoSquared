  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Solo は「たった」という意味で、数量の前に置きます：solo cinque minuti。
    language_code: ja
    direction: ltr
- content_key: practice.ja-it.it.a1.unit10.lesson02.fill.004
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
