- content_key: practice.ja-it.it.a1.unit10.lesson03.translate.003
  lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
  type: translation
  frame:
    text: それから、そのまままっすぐ進んでください。(丁寧な言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
