      - lost_item_possessive
  possessive: &id004
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: lost_item_possessive
  see_verb: &id003
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: see_verb
