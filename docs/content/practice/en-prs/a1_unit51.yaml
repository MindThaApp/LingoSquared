schema_version: '1.0'
pack_key: practice.en-prs.a1.unit51
source_language: en
target_language: prs
unit_content_key: prs.a1.unit51.restaurant
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Vocabulary unit (restaurant), 8 lexemes across 5 lexeme-bearing lessons (lesson04''s dialogue
    introduced zero lexemes of its own). Recognition+production union: restaurant_word, service_person_word,
    food_item, dialogue_word, third_person_possessive_word, formal_possessive_word (5 lessons x2 = 10).
    Structured: 2x matching_pairs (6 of 8 tokens each, different anchors) + 1 word_order on restaurant_word
    (course-wide 5 members: رستوران، فرمایش، مینو، پیشخدمت، کباب -- all checked individually against ''in
    X ast'', all are plain countable nouns and fit). No course-wide single-candidate tag existed for fill_in_blank.
    13 templates, recognition 5, structured 3, production 5, all 5 lexeme lessons covered. No mis-glossed
    lexemes found.


    Review 2026-10-24 (en-prs practice native-quality pass): 3 fixes. (1) MC/translation/matching pools
    narrowed from 235 course-wide tokens to the unit''s own 8 words (en_prs_a1_unit51_words). (2) matching_pairs
    6 of 8 words. (3) order.005 pool restaurant_word omitted رستورانت and feedback listed words inconsistent
    with it -> noun members of the unit tag, feedback aligned. NATIVE FLAGS: فرمایش ''order; request''
    for the diner''s order; بیارین (colloquial for بیاورین).'
  required_next_reviewer: native_speaker_review
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_prs_a1_unit51_words
