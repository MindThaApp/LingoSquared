schema_version: '1.0'
pack_key: practice.en-prs.a1.unit50
source_language: en
target_language: prs
unit_content_key: prs.a1.unit50.swimming_pool
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Vocabulary unit (swimming pool), 8 lexemes across 4 lexeme-bearing lessons (lesson02/04 introduced
    zero lexemes of their own). Two lexemes (کارمند ''clerk'', باز ''open'') carry ONLY the broad dialogue_word
    tag -- included for full 8/8 coverage on this thin unit; unit-scoped satisfiability is unaffected.
    Recognition+production union: pool_word, dialogue_word, formal_possessive_word, disruption_word, third_person_possessive_word
    (4 lessons x2 = 8). Structured: 1 matching_pairs (6 of 8 tokens), 2 word_order -- disruption_word
    (single candidate بسته within the A1 course; NOT direction-wide single -- 6 more disruption_word tokens
    exist at A2/B1/B2, so fill_in_blank''s direction-wide ambiguity check correctly hard-failed it; word_order''s
    grammaticality check is only course-scoped so this is safe there) and pool_word (course-wide 2 members:
    حوض آببازی and کمد, both fit ''in X ast''). Production tier gets 1 extra fixed-sentence translation
    on the same A1-single disruption_word slot. 14 templates, recognition 4, structured 3, production
    5, all 4 lexeme lessons covered. No mis-glossed lexemes found.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - dialogue_word
    - disruption_word
    - formal_possessive_word
    - pool_word
    - third_person_possessive_word
templates:
- content_key: practice.en-prs.prs.a1.unit50.lesson01.pool_and_staff_vocabulary.choose.001
  lesson_content_key: prs.a1.unit50.lesson01.pool_and_staff_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: prs
      part_of_speech: &id001
      - noun
      - adjective
      agreement_tags:
        semantic: &id002
        - pool_word
        - dialogue_word
        - formal_possessive_word
        - disruption_word
        - third_person_possessive_word
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is swimming-pool vocabulary from this unit.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit50.lesson01.pool_and_staff_vocabulary.translate.002
  lesson_content_key: prs.a1.unit50.lesson01.pool_and_staff_vocabulary
