schema_version: '1.0'
pack_key: practice.en-prs.a2.unit28
source_language: en
target_language: prs
unit_content_key: prs.a2.unit28.predictions_promises
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: 'Generated from the unit''s realization and en-prs backfill lexemes. Pools are unions of single-member w_<token> tags restricted to noun/verb/adjective/adverb, which keeps phrase rows, proper nouns,
    pronouns and particles out. No listen_select (prs has no TTS). Per lesson one multiple_choice and one bare-word translation (lesson pool if >=4 words, else unit pool); two curated matching_pairs templates
    with 6 slots and distinct glosses; word_order, fill_in_blank and fixed-sentence translation templates are single-member anchors on the unit''s own teaching sentences. Dari register: Kabul Dari, 2pl
    -ین, copula است/استند. Needs native review of frames and feedback. Excluded: هوای (gloss ''weather of'', a bound ezafe form). خواهد/نخواهد are recognition-only (written future, never typed). بارید (''it
    rained; snowed'') is used in typed tiers as the past verb it glosses, though the unit shows it only after خواهد in reading cards; this is the only typed host for lesson 05. Lesson 06 has no lexemes.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_آفتابی
    - w_ابری
    - w_احتمالاً
    - w_امشب
    - w_بارید
    - w_برسد
    - w_بعداً
    - w_بیاید
    - w_حتماً
    - w_خواهد
    - w_سرد
    - w_فراموش
    - w_قول
    - w_مهم
    - w_می‌دهم
    - w_نبارد
    - w_نخواهد
    - w_نرویم
    - w_نمی‌آیم
    - w_نیاید
    - w_هوا
    - w_پس‌فردا
    - w_پیش‌بینی
