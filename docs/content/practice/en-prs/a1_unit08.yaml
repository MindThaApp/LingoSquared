schema_version: "1.0"
pack_key: practice.en-prs.a1.unit08
source_language: en
target_language: prs
unit_content_key: prs.a1.unit08.food
review:
  status: reviewed
  fresh_context: true
  notes: >-
    Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-06,
    same pass as this bundle's a1_unit03.yaml sibling (see that file's
    notes for the full extension rationale and verification method).
    Deliberately double-checked this pack's own lesson06 dialogue anchor
    against the real anchor-bug class found and fixed live tonight in
    the sibling fa-en direction's own unit08 pack (a template pointed at
    a pure-review lesson with zero introduced_tokens of its own) --
    prs.a1.unit08.lesson06.restaurant_dialogue genuinely introduces new
    vocabulary (دکاندار, مشتری, هردو, چشم, دوصد, افغانی, etc., confirmed
    directly against the realization file), so no equivalent bug here.

    Three groups: food_item (نان/پلو/قورمه/چای/آب, 5 members) from
    lesson01, role_word (مشتری, 1 member -- translation only) from
    lesson06's dialogue, and counting_word (بشقاب/تا, 2 members --
    matching_pairs/translation only) from lesson04. Deliberately
    skipped تازه/لطفاً/خیلی/خوش‌مزه as slot fillers -- each is a genuine
    single-candidate token on its own semantic point, matching this
    bundle's standing precedent of leaving single-candidate vocabulary
    as taught-but-not-drilled rather than forcing an artificial shared
    tag.

    REAUTH 2026-07-24 (unit-scope DEAD-template repair,
    docs/content/PRACTICE_PACK_RECIPE.md §1.1/§3.1): the original note
    above claimed role_word had 2 members here (دکاندار/مشتری) -- that
    was wrong; دکاندار is unit06's lesson06 (giving_directions_dialogue),
    a genuinely EARLIER unit (recipe DO-NOT #2), and unit08 itself
    introduces only مشتری. role_pair.003 declared a 2-slot
    matching_pairs against that non-existent 2nd candidate -> DEAD at
    checkpoint scope (unit-scoped pool of 1). Re-anchored role_pair.003
    to a new role_and_dialogue preset unioning this unit's own
    role_word + dialogue_word + food_item tags (§3.1a): مشتری, چای, بل,
    افغانی, نان, پلو, قورمه, آب -- 8 distinct unit-scoped tokens, all
    noun, no confusable glosses, comfortably over the 6-pair floor.
    Standard 6 slots used (2 of 8 left unsampled at random each
    generation). role_word (مشتری) still also hosted by
    role_translate.002 (bare-word translation, no candidate floor),
    unaffected. food_item/counting_word's own food_and_counting preset
    (food_pair.004, counting_pair.003) is untouched.

    Every fill_in_blank frame embeds the slot in a real Dari sentence
    with visible surrounding context (guide §13). No listen_select/
    listen_type anywhere. No bare unquoted yes/no/true/false anywhere.

    Verified with a standalone throwaway script reusing
    scripts/_practice_slot_check.py's lexeme_matches()/check_pack()
    against scripts/backfill_lexemes_en_prs.py's real iter_specs()
    output -- 0 problems. scripts/compile_content.py practice-validate
    for the full en-prs pack (units 01-10 together) -- 0 errors/0
    warnings. Needs the standard fresh-context review before import; no
    backfill_lexemes_en_prs.py run has actually happened against a real
    database yet in this pass.
tag_schema:
  part_of_speech: [noun, particle]
  agreement_tags:
    semantic: [food_item, role_word, counting_word, dialogue_word]
slot_presets:
  food_item: &food_item {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: food_item}}
  role_word: &role_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: role_word}}
  counting_word: &counting_word {language_code: prs, part_of_speech: [noun, particle], agreement_tags: {semantic: counting_word}}
  # counting_word alone only has 2 distinct candidates; pooled with
  # lesson01's food_item (same unit, same dining theme) for the
  # matching_pairs templates below to reach 7 (AUTHORING_GUIDE.md #16) --
  # real vocabulary only.
  food_and_counting: &food_and_counting {language_code: prs, part_of_speech: [noun, particle], agreement_tags: {semantic: [food_item, counting_word]}}
  # REAUTH 2026-07-24: role_word alone has only 1 unit-scoped candidate
  # (مشتری) -- see review.notes. Unions this unit's own role_word +
  # dialogue_word + food_item tags to reach 8 distinct unit-scoped
  # tokens for role_pair.003 below.
  role_and_dialogue: &role_and_dialogue {language_code: prs, part_of_speech: [noun], agreement_tags: {semantic: [role_word, dialogue_word, food_item]}}
templates:
  # Lesson 1: food and drink vocabulary.
  - content_key: practice.en-prs.prs.a1.unit08.lesson01.food_gloss.001
    lesson_content_key: prs.a1.unit08.lesson01.food_and_drink_vocabulary
    type: multiple_choice
    frame: {text: "{food_item}", language_code: prs, direction: rtl}
    slots: {food_item: *food_item}
    answer_derivation: {kind: slot_gloss, slot: food_item}
    feedback_frame: {text: "{food_item} names a food or drink item.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit08.lesson01.food_translate.003
    lesson_content_key: prs.a1.unit08.lesson01.food_and_drink_vocabulary
    type: translation
    frame: {text: "{food_item}", language_code: en, direction: ltr, slot_rendering: {food_item: english_gloss}}
    slots: {food_item: *food_item}
    answer_derivation: {kind: slot_text, slot: food_item}
    feedback_frame: {text: "{food_item} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit08.lesson01.food_pair.004
    lesson_content_key: prs.a1.unit08.lesson01.food_and_drink_vocabulary
    type: matching_pairs
    # Expanded 2->7 pairs 2026-07-06 (AUTHORING_GUIDE.md #16 retrofit),
    # pooling food_item with lesson04's counting_word (food_and_counting
    # preset above) -- verified via scripts/_practice_slot_check.py.
    frame: {text: "{food_item_one} — {food_item_two} — {food_item_three} — {food_item_four} — {food_item_five} — {food_item_six} — {food_item_seven}", language_code: prs, direction: rtl}
    slots: {food_item_one: *food_and_counting, food_item_two: *food_and_counting, food_item_three: *food_and_counting, food_item_four: *food_and_counting, food_item_five: *food_and_counting, food_item_six: *food_and_counting, food_item_seven: *food_and_counting}
    slot_relations: [{kind: distinct, slots: [food_item_one, food_item_two, food_item_three, food_item_four, food_item_five, food_item_six, food_item_seven]}]
    answer_derivation: {kind: matching_pairs, slots: [food_item_one, food_item_two, food_item_three, food_item_four, food_item_five, food_item_six, food_item_seven]}
    feedback_frame: {text: "Match each word with its English meaning.", language_code: en, direction: ltr}

  # Lesson 4: quantities.
  - content_key: practice.en-prs.prs.a1.unit08.lesson04.counting_translate.002
    lesson_content_key: prs.a1.unit08.lesson04.quantities
    type: translation
    frame: {text: "{counting_word}", language_code: en, direction: ltr, slot_rendering: {counting_word: english_gloss}}
    slots: {counting_word: *counting_word}
    answer_derivation: {kind: slot_text, slot: counting_word}
    feedback_frame: {text: "{counting_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit08.lesson04.counting_pair.003
    lesson_content_key: prs.a1.unit08.lesson04.quantities
    type: matching_pairs
    # Expanded 2->7 pairs 2026-07-06 (AUTHORING_GUIDE.md #16 retrofit),
    # pooling counting_word with lesson01's food_item (food_and_counting
    # preset above) -- verified via scripts/_practice_slot_check.py.
    frame: {text: "{counting_word_one} — {counting_word_two} — {counting_word_three} — {counting_word_four} — {counting_word_five} — {counting_word_six} — {counting_word_seven}", language_code: prs, direction: rtl}
    slots: {counting_word_one: *food_and_counting, counting_word_two: *food_and_counting, counting_word_three: *food_and_counting, counting_word_four: *food_and_counting, counting_word_five: *food_and_counting, counting_word_six: *food_and_counting, counting_word_seven: *food_and_counting}
    slot_relations: [{kind: distinct, slots: [counting_word_one, counting_word_two, counting_word_three, counting_word_four, counting_word_five, counting_word_six, counting_word_seven]}]
    answer_derivation: {kind: matching_pairs, slots: [counting_word_one, counting_word_two, counting_word_three, counting_word_four, counting_word_five, counting_word_six, counting_word_seven]}
    feedback_frame: {text: "Match each counting word to its English meaning.", language_code: en, direction: ltr}
  # POLISH 2026-07-24 (tier-thinness, recipe SS8): the recognition tier had
  # only 1 live template (food_gloss.001, food_item alone). This MC reuses
  # the existing food_and_counting union (7 distinct unit-scoped tokens /
  # 7 distinct glosses) so lesson04's بشقاب/تا get recognition coverage --
  # pool differs from food_gloss.001's.
  - content_key: practice.en-prs.prs.a1.unit08.lesson04.counting_gloss.004
    lesson_content_key: prs.a1.unit08.lesson04.quantities
    type: multiple_choice
    frame: {text: "{item}", language_code: prs, direction: rtl}
    slots: {item: *food_and_counting}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is food or quantity vocabulary from this unit.", language_code: en, direction: ltr}

  # Lesson 6: the full teahouse dialogue.
  - content_key: practice.en-prs.prs.a1.unit08.lesson06.role_translate.002
    lesson_content_key: prs.a1.unit08.lesson06.restaurant_dialogue
    type: translation
    frame: {text: "{role_word}", language_code: en, direction: ltr, slot_rendering: {role_word: english_gloss}}
    slots: {role_word: *role_word}
    answer_derivation: {kind: slot_text, slot: role_word}
    feedback_frame: {text: "{role_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit08.lesson06.role_pair.003
    lesson_content_key: prs.a1.unit08.lesson06.restaurant_dialogue
    type: matching_pairs
    # REAUTH 2026-07-24: re-anchored to role_and_dialogue (8 distinct
    # unit-scoped tokens: مشتری, چای, بل, افغانی, نان, پلو, قورمه, آب) --
    # the old role_word-only pool had 1 unit-scoped candidate (دکاندار
    # is unit06's, not unit08's), DEAD at checkpoint scope. See
    # review.notes. Standard 6 slots.
    frame: {text: "{item_one} — {item_two} — {item_three} — {item_four} — {item_five} — {item_six}", language_code: prs, direction: rtl}
    slots: {item_one: *role_and_dialogue, item_two: *role_and_dialogue, item_three: *role_and_dialogue, item_four: *role_and_dialogue, item_five: *role_and_dialogue, item_six: *role_and_dialogue}
    slot_relations: [{kind: distinct, slots: [item_one, item_two, item_three, item_four, item_five, item_six]}]
    answer_derivation: {kind: matching_pairs, slots: [item_one, item_two, item_three, item_four, item_five, item_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  # POLISH 2026-07-24: second recognition-tier addition (recipe SS8; see
  # counting_gloss.004 note). Reuses the existing role_and_dialogue union
  # (8 distinct unit-scoped tokens / 8 distinct glosses: مشتری, چای, بل,
  # افغانی, نان, پلو, قورمه, آب) so lesson06's مشتری/بل/افغانی get
  # recognition coverage -- pool differs from both other MC templates.
  - content_key: practice.en-prs.prs.a1.unit08.lesson06.dialogue_gloss.004
    lesson_content_key: prs.a1.unit08.lesson06.restaurant_dialogue
    type: multiple_choice
    frame: {text: "{item}", language_code: prs, direction: rtl}
    slots: {item: *role_and_dialogue}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} appears in this unit's teahouse dialogue vocabulary.", language_code: en, direction: ltr}
