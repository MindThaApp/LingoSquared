schema_version: "1.0"
pack_key: practice.en-prs.a1.unit01
source_language: en
target_language: prs
unit_content_key: prs.a1.unit01.greetings
review:
  status: unreviewed
  fresh_context: false
  notes: "Authored directly (Codex rate-limited at authoring time), mirroring the en-fa pilot pack's schema and rigor for the letter-recognition lesson pattern. Underlying en-prs overlay is itself unreviewed -- needs a fresh-context content review before shipping, same as any other content, plus normal practice-pack review."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [letter, greeting, time_period, good_wish, farewell, wellbeing_question, wellbeing_answer, politeness, identity, person_name, dialogue_word]
    register: [formal, informal]
    person: [first, second, third]
slot_presets:
  letter: &letter {language_code: prs, part_of_speech: symbol, agreement_tags: {semantic: letter}}
  greeting: &greeting {language_code: prs, part_of_speech: [noun, adjective, particle], agreement_tags: {semantic: greeting}}
  time_period: &time_period {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: time_period}}
  wellbeing_answer: &wellbeing_answer {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: wellbeing_answer}}
  politeness: &politeness {language_code: prs, part_of_speech: [noun, verb], agreement_tags: {semantic: politeness}}
  identity: &identity {language_code: prs, part_of_speech: [pronoun, verb, noun], agreement_tags: {semantic: identity}}
  dialogue_word: &dialogue_word {language_code: prs, part_of_speech: [noun, adjective], agreement_tags: {semantic: dialogue_word}}
templates:
  # Lesson 1: script recognition. No listen_select anywhere in this pack --
  # Dari has zero TTS voice coverage project-wide, a hard exclusion, not a
  # style choice.
  - content_key: practice.en-prs.prs.a1.unit01.lesson01.letter_gloss.001
    lesson_content_key: prs.a1.unit01.lesson01.script_ramp
    type: multiple_choice
    frame: {text: "{letter}", language_code: prs, direction: rtl}
    slots: {letter: *letter}
    answer_derivation: {kind: slot_gloss, slot: letter}
    feedback_frame: {text: "{letter} has this sound value.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit01.lesson01.letter_fill.002
    lesson_content_key: prs.a1.unit01.lesson01.script_ramp
    type: fill_in_blank
    frame: {text: "{letter}", language_code: prs, direction: rtl}
    slots: {letter: *letter}
    answer_derivation: {kind: slot_text, slot: letter}
    feedback_frame: {text: "The missing letter is {letter}.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit01.lesson01.letter_pair.003
    lesson_content_key: prs.a1.unit01.lesson01.script_ramp
    type: matching_pairs
    frame: {text: "{letter_one}، {letter_two}", language_code: prs, direction: rtl}
    slots: {letter_one: *letter, letter_two: *letter}
    answer_derivation: {kind: matching_pairs, slots: [letter_one, letter_two]}
    slot_relations: [{kind: distinct, slots: [letter_one, letter_two]}]
    feedback_frame: {text: "Match {letter_one} and {letter_two} to their sound labels.", language_code: en, direction: ltr}

  # Lesson 2: everyday greetings.
  - content_key: practice.en-prs.prs.a1.unit01.lesson02.greeting_meaning.001
    lesson_content_key: prs.a1.unit01.lesson02.everyday_greetings
    type: multiple_choice
    frame: {text: "{greeting}", language_code: prs, direction: rtl}
    slots: {greeting: *greeting}
    answer_derivation: {kind: slot_gloss, slot: greeting}
    feedback_frame: {text: "{greeting} is used in everyday greetings.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit01.lesson02.politeness_translate.002
    lesson_content_key: prs.a1.unit01.lesson02.everyday_greetings
    type: translation
    frame: {text: "{politeness}", language_code: en, direction: ltr, slot_rendering: {politeness: english_gloss}}
    slots: {politeness: *politeness}
    answer_derivation: {kind: slot_text, slot: politeness}
    feedback_frame: {text: "{politeness} is used to thank someone or respond politely.", language_code: en, direction: ltr}

  # Lesson 3: time-specific greetings and farewells.
  - content_key: practice.en-prs.prs.a1.unit01.lesson03.time_fill.001
    lesson_content_key: prs.a1.unit01.lesson03.time_and_farewells
    type: fill_in_blank
    frame: {text: "{time_period} بخیر", language_code: prs, direction: rtl}
    slots: {time_period: *time_period}
    answer_derivation: {kind: slot_text, slot: time_period}
    feedback_frame: {text: "{time_period} is the time-of-day word in this greeting.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit01.lesson03.time_meaning.002
    lesson_content_key: prs.a1.unit01.lesson03.time_and_farewells
    type: multiple_choice
    frame: {text: "{time_period}", language_code: prs, direction: rtl}
    slots: {time_period: *time_period}
    answer_derivation: {kind: slot_gloss, slot: time_period}
    feedback_frame: {text: "{time_period} names a time of day.", language_code: en, direction: ltr}

  # Lesson 4: formal/informal wellbeing exchange.
  - content_key: practice.en-prs.prs.a1.unit01.lesson04.wellbeing_meaning.001
    lesson_content_key: prs.a1.unit01.lesson04.formal_informal_small_talk
    type: multiple_choice
    frame: {text: "{wellbeing_answer}", language_code: prs, direction: rtl}
    slots: {wellbeing_answer: *wellbeing_answer}
    answer_derivation: {kind: slot_gloss, slot: wellbeing_answer}
    feedback_frame: {text: "{wellbeing_answer} answers how someone is doing.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit01.lesson04.wellbeing_fill.002
    lesson_content_key: prs.a1.unit01.lesson04.formal_informal_small_talk
    type: fill_in_blank
    frame: {text: "{wellbeing_answer} استم، تشکر", language_code: prs, direction: rtl}
    slots: {wellbeing_answer: *wellbeing_answer}
    answer_derivation: {kind: slot_text, slot: wellbeing_answer}
    feedback_frame: {text: "{wellbeing_answer} fits before استم, thanks.", language_code: en, direction: ltr}

  # Lesson 5: Afghan hospitality vocabulary.
  - content_key: practice.en-prs.prs.a1.unit01.lesson05.dialogue_meaning.001
    lesson_content_key: prs.a1.unit01.lesson05.afghan_hospitality
    type: multiple_choice
    frame: {text: "{dialogue_word}", language_code: prs, direction: rtl}
    slots: {dialogue_word: *dialogue_word}
    answer_derivation: {kind: slot_gloss, slot: dialogue_word}
    feedback_frame: {text: "{dialogue_word} appears in polite hospitality exchanges.", language_code: en, direction: ltr}

  # Lesson 6: Kabul workplace first-day dialogue.
  - content_key: practice.en-prs.prs.a1.unit01.lesson06.identity_meaning.001
    lesson_content_key: prs.a1.unit01.lesson06.first_meeting_dialogue
    type: multiple_choice
    frame: {text: "{identity}", language_code: prs, direction: rtl}
    slots: {identity: *identity}
    answer_derivation: {kind: slot_gloss, slot: identity}
    feedback_frame: {text: "{identity} is used when exchanging names.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit01.lesson06.dialogue_translate.002
    lesson_content_key: prs.a1.unit01.lesson06.first_meeting_dialogue
    type: translation
    frame: {text: "{dialogue_word}", language_code: en, direction: ltr, slot_rendering: {dialogue_word: english_gloss}}
    slots: {dialogue_word: *dialogue_word}
    answer_derivation: {kind: slot_text, slot: dialogue_word}
    feedback_frame: {text: "That's the workplace-dialogue word you just typed.", language_code: en, direction: ltr}
