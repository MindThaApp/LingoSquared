schema_version: '1.0'
pack_key: practice.en-prs.a2.unit25
source_language: en
target_language: prs
unit_content_key: prs.a2.unit25.have_you_ever
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: 'Hand-authored from the unit''s realization and overlay and the en-prs backfill pool (tags en_prs_a2_unit25_* and w_<token>). 63 pool lexemes in 5 lessons (lesson 5 has none). Recognition, matching and bare-word production use single-word w_ tags only; the phrase lexemes of lessons 4 and 6 (once, twice / yes, no / the ever-been question / the first conversation line) form a 4-member phrase pool for multiple_choice, and lesson 6 is hosted by word_order and bare translation over its one conversation sentence. Paradigm-row phrases are not used. Kept OUT of recognition, matching and bare-word production: قابلی (stored gloss ''worth'' is the sense in ''don''t mention it''; here it is only part of the dish name قابلی پلو), دیدیم/پختیم/کردیم (stored as ''we saw / we cooked / we did'' although the unit teaches these spoken forms as ''I have seen / cooked / done'' -- see the native-review question), پخت (''he/she cooked'' is a near-duplicate of پخته ''cooked; he/she has cooked''), هیچ‌وقت (''never; at no time'' duplicates هرگز ''never'', which makes a typed or chosen answer ambiguous), so these are only hosted where the exact word is shown (word_order) or the sentence fixes it. The unit''s own spoken forms (رفتیم for ''I have gone'' etc.) are not used in any frame. Sentence frames are single-member w_ anchors on the unit''s own teaching lines; Afghan Dari forms (plural -ین, -این). Needs native review of every frame and of the English feedback.'
