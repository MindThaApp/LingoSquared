schema_version: '1.0'
pack_key: practice.en-prs.a2.unit30
source_language: en
target_language: prs
unit_content_key: prs.a2.unit30.can_and_might
review: {status: reviewed, required_next_reviewer: native_speaker_review, fresh_context: 'true', notes: 'Fresh-context review 2026-11-27 (en-prs A2 units 28-33 pass): every slot''s unit-scope and course-scope pool dumped and every gloss read; sentence anchors are single-member at course scope, no listen_select, MC pools 10-30 distinct glosses, matching pools 8 and 20. 3 fixes - (1) two fixed-sentence prompts said only You, while the answer is the تو form, so a learner writing the شما form was marked wrong: You cannot go. and Are you free on Thursday? now say (to a friend); (2) the feedback of the three بمانیم templates said it means let''s stay; it now says it is the subjunctive (that) we stay after نمی‌توانیم; (3) accepted_variants for the optional pronoun and time-word placement the unit teaches (می‌توانم نقاشی کنم, نمی‌توانی بروی, مشغول استم, شاید من نتوانم بیایم, نمی‌توانیم در پارک بمانیم, پنجشنبه / روز پنجشنبه آزاد استی). Capacity after the fixes: 40 templates, ALL 64%, recognition 64%, structured 64%, production 64%, 6/6 lessons in every tier. Backfill gloss to route: بمانیم "let''s stay" (taught as the subjunctive after نمی‌توانیم, (that) we stay; the fill_in_blank hint still shows the backfill gloss). NATIVE FLAGS: frame من می‌توانم یک نامه بنویسم (یک may be unneeded). Authored for unit 30 from the realization and the en-prs backfill lexemes (tags w_<token> single-member anchors, en_prs_a2_unit30_lessonNN_words for phrase word_order). Broad recognition/production templates use unions of the unit''s w_ tags (lessons with fewer than 5 words draw on the whole unit); matching_pairs split into non-verbs and verbs. Sentence templates are single-lexeme anchors on the unit''s own teaching lines (Dari register: 2pl -ین, copula است/استم/استی). No listen_select (prs has no TTS). Not hosted: pronoun خودم and proper-noun names have no w_ tag or semantic tag. Phrase lexemes are not drilled. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_استی, w_ببینم, w_بتواند, w_بتوانم, w_بتوانند, w_بتوانی, w_بتوانیم, w_بتوانین, w_بخوانم, w_بمانیم, w_بنویسم, w_بپزم, w_بگویم, w_بیایی, w_دری, w_شنا, w_مشغول, w_مطمئن, w_نامه, w_نتوانم, w_نقاشی, w_نمی‌تواند, w_نمی‌توانند, w_نمی‌توانی, w_نمی‌توانیم, w_نوشتن, w_نیایند, w_نیستم, w_پنج, w_کمپیوترم]
