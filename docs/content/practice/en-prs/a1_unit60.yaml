schema_version: '1.0'
pack_key: practice.en-prs.a1.unit60
source_language: en
target_language: prs
unit_content_key: prs.a1.unit60.sports_event
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    en-prs A1 practice pack (unit60 sports_event), authored 2026-07-23.
    EXTREMELY THIN UNIT: only 4 lexemes total across 3 lessons with lexemes
    (lesson01: مسابقه "match/game", تیم "team"; lesson05: برد "he/she/it won";
    lesson06: مسابقه‌تان "your match"). lesson02/03/04 have ZERO lexemes.
    unit_word_all union (match_word+past_verb_third+formal_possessive_word,
    pos [noun,verb]) gives exactly 4 distinct glosses -- clears the MC >=3
    floor but is far short of matching_pairs' 6-pair floor (only 4 unit
    lexemes exist at all), so matching_pairs is DELIBERATELY OMITTED.
    Structured tier: word_order over match_word (course-wide 2: تیم team,
    مسابقه match) in the frame "{item} خوب است." (the X is good) -- both
    team and match fit; checked at course scope. 2026-07-24 polish wave 2:
    added two more word_order templates over the same course-safe match_word
    pool, using the unit's own authored sentences -- lesson05.order.001
    "{item} جالب بود." (from lesson05's reading مسابقه جالب بود; both
    members fit "X was interesting") and lesson06.order.001
    "این {item} فوتبال است." (from lesson01's example این مسابقه فوتبال است;
    both "football match" and "football team" are grammatical). Structured
    tier now 3 live; lessons 05/06 gain structured anchors. past_verb_third
    and formal_possessive_word remain frame-unsafe as analysed below.
    past_verb_third (برد) is course-wide 5 members (برد,دید,رفت,شد,کرد --
    won/saw/went/became/did) with very different subcategorisation, so it is
    NOT used in a fixed-subject frame (several would be ungrammatical there)
    -- kept to bare-word translation only, which is frame-safe regardless.
    formal_possessive_word (مسابقه‌تان) is course-wide 14 nouns, also kept to
    bare-word translation only. No single-member course-wide anchor exists
    for fill_in_blank. 7 templates total, 1 structured -- capacity-limited,
    not padded; this is the thinnest unit in the batch. No mis-glossed
    lexemes found. No listen_select (no prs TTS).
    Review 2026-10-24 (en-prs practice native-quality pass): 2 fixes. All
    three word_order feedbacks hard-coded one item (تیم / مسابقه) although the
    slot draws either -> generic {item}; MC feedback 'sports-event
    vocabulary' on a pool that includes the verb برد -> 'this unit's
    vocabulary'. NATIVE FLAGS: 'این تیم فوتبال است' (this is a football team)
    reads slightly odd vs 'این مسابقه فوتبال است'; consider if kept.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - match_word
    - past_verb_third
    - formal_possessive_word
slot_presets:
  unit_word_all: &uwa
    language_code: prs
    part_of_speech: [noun, verb]
    agreement_tags:
      semantic: [match_word, past_verb_third, formal_possessive_word]
  match: &mw
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: match_word
templates:
