schema_version: "1.0"
pack_key: practice.en-prs.a1.unit38
source_language: en
target_language: prs
unit_content_key: prs.a1.unit38.colors
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-11, same units 31-40 practice-pool depth-extension
    pass as this bundle's a1_unit31.yaml sibling (see that file's notes
    for the shared pass context). Realization and overlay are both
    status reviewed.

    One group: "color_word" extends the existing color_word tag
    (unit21: سیاه/سفید/سرخ) with this unit's new colors
    (زرد/سبز/نارنجی/خاکستری/بنفش/قهوه‌یی, 6) plus آبی (REUSED existing
    lexeme from unit27 appearance, additive tag on top of its
    eye_hair_color_word tag) -- 10 candidates total. Every member
    combines grammatically with the taught "رنگ ... را دوست دارم" (I
    like the color X) frame, checked per candidate (all ten are simple
    color adjectives with no exceptions).

    Word_order template checked for grammaticality: "رنگ {color_word}
    را دوست دارم" (lesson03, matches the real taught "رنگ سبز را دوست
    دارم."/"رنگ آبی را دوست دارم." verbatim for those two members, and
    generalizes cleanly to the rest).

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    No bare unquoted yes/no/true/false anywhere. Verified with
    scripts/_practice_slot_check.py (0 problems) and
    scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context
    review before import.
tag_schema:
  part_of_speech: [adjective]
  agreement_tags:
    semantic: [color_word]
slot_presets:
  color_word: &color_word {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: color_word}}
templates:
  # Lesson 1: primary colors.
  - content_key: practice.en-prs.prs.a1.unit38.lesson01.color_gloss.001
    lesson_content_key: prs.a1.unit38.lesson01.primary_colors
    type: multiple_choice
    frame: {text: "{color_word}", language_code: prs, direction: rtl}
    slots: {color_word: *color_word}
    answer_derivation: {kind: slot_gloss, slot: color_word}
    feedback_frame: {text: "{color_word} is a color word.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit38.lesson02.color_pair.002
    lesson_content_key: prs.a1.unit38.lesson02.more_colors
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots: {word_one: *color_word, word_two: *color_word, word_three: *color_word, word_four: *color_word, word_five: *color_word, word_six: *color_word}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 3: asking about colors.
  - content_key: practice.en-prs.prs.a1.unit38.lesson03.color_liked_order.001
    lesson_content_key: prs.a1.unit38.lesson03.asking_about_colors
    type: word_order
    frame: {text: "رنگ {color_word} را دوست دارم", language_code: prs, direction: rtl}
    slots: {color_word: *color_word}
    answer_derivation: {kind: render_frame, frame: {text: "رنگ {color_word} را دوست دارم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: رنگ [color] را دوست دارم (I like the color [color]).", language_code: en, direction: ltr}

  # Lesson 6: wrap-up.
  - content_key: practice.en-prs.prs.a1.unit38.lesson06.color_translate.001
    lesson_content_key: prs.a1.unit38.lesson06.wrap_up
    type: translation
    frame: {text: "{color_word}", language_code: en, direction: ltr, slot_rendering: {color_word: english_gloss}}
    slots: {color_word: *color_word}
    answer_derivation: {kind: slot_text, slot: color_word}
    feedback_frame: {text: "{color_word} is the Dari word for this.", language_code: en, direction: ltr}
