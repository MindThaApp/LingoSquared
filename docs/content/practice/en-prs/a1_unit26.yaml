schema_version: "1.0"
pack_key: practice.en-prs.a1.unit26
source_language: en
target_language: prs
unit_content_key: prs.a1.unit26.hobbies
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    RE-AUTH PASS 2026-07-24 (scripts/_practice_unit_scope_check.py DEAD-
    template fix, PACK-ONLY): lesson01.hobby_pair.002 slotted
    hobby_topic_word alone (6 slots), but this unit's OWN hobby_topic_word
    pool is only 4 unit-scoped tokens (موسیقی/فلم are REUSED from earlier
    units, out of this unit's checkpoint scope) -- DEAD at checkpoint
    scope, not caught by the earlier fresh-context review below because
    that review checked whole-direction/course-scope satisfiability, not
    generate_checkpoint()'s stricter unit-only scope. Re-anchored to a new
    unit_noun_pool preset (part_of_speech-only, no semantic tag -- SS3.1(c))
    unioning every noun this unit's own lessons introduce (6 unit-scoped
    distinct tokens: hobby_topic_word's 4 + گوش "listening" + آخر "end",
    all genuinely distinct glosses, no case duplicates). No backfill/
    realization/overlay edits. Status reset to unreviewed because the fix
    changes generated-checkpoint behavior; needs a fresh-context re-review.
    Post-fix: scripts/_practice_unit_scope_check.py reports 0 DEAD, 0
    below-floor for this pack.

    POLISH 2026-07-24 (tier-thinness + POS-only matching wave 2,
    PACK-ONLY): recognition and production tiers each had only 1 live
    template. Added 4 templates from the unit's own vocabulary:
    lesson02.free_time_word_gloss.001 (MC over the unit's untagged
    verb/adjective lexemes خواندن/می‌کنی/آزاد, 3 glosses -- POS-only by
    necessity, bare frame), lesson03.unit_noun_gloss.002 (MC over the
    existing unit_noun_pool, 6 glosses), lesson03.unit_noun_translate.003
    and lesson04.hobby_activity_translate.002 (bare-word translations
    over unit_noun_pool / hobby_activity_word). Both tiers now 3 live;
    tag_schema part_of_speech extended with verb/adjective.
    HONEST LIMIT -- hobby_pair.002 stays POS-only: the dispatch flagged
    its bare noun constraint (492 off-theme course-scope extras), but
    the unit's tagged vocabulary maxes out at hobby_topic_word(4) --
    hobby_activity_word is a strict subset -- below the 6-pair floor,
    and گوش/آخر (plus خواندن/می‌کنی/آزاد) carry no semantic tag
    (backfill scripts are off-limits in this lane). No semantic union
    can reach 6, so the POS-only constraint is left in place rather
    than replaced with a wrong union; the new POS-only templates use
    bare frames only, where SS3.1(c) declares POS-only safe. LOGGED for
    the coordinator: a backfill_lexemes_en_prs.py extension tagging
    گوش/آخر (e.g. free_time_word) would let hobby_pair.002 move to a
    semantic union.

    --- prior authoring notes (2026-07-11), kept for context ---

    Authored 2026-07-11, same A1 units 25-30 practice-pool
    depth-extension pass as this bundle's a1_unit25.yaml sibling (see
    that file's notes for the shared pass context). Realization is
    status reviewed.

    Two groups: "hobby_topic_word" (سرگرمی/پیاده‌روی/آشپزی/موسیقی/کتاب/
    فلم, 6 members, completes lesson01 -- موسیقی/کتاب/فلم/آشپزی are
    REUSED existing lexemes genuinely re-taught in this unit's lesson01
    hobby compounds, additive tags; glosses hobby/walking/cooking/music/
    book/film all distinct) is the recognition pool.
    "hobby_activity_word" (پیاده‌روی/آشپزی, 2) is the strict subset that
    combines grammatically with می‌کنم ("I do X") -- composing کتاب or
    موسیقی into a می‌کنم frame would be ungrammatical, the same
    composition trap as unit24's پیاده/با split, so the word_order
    frames below only ever draw from the 2-member subset.

    Word_order templates checked for grammaticality: "من هر هفته
    {hobby_activity_word} می‌کنم" (lesson03, matches the real taught
    "من هر هفته پیاده‌روی می‌کنم"; آشپزی می‌کنم is itself taught in
    lesson04) and "من هم گاهی {hobby_activity_word} می‌کنم" (lesson04,
    matches the real taught "من هم گاهی آشپزی می‌کنم" generalized).

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    No bare unquoted yes/no/true/false anywhere. Verified with
    scripts/_practice_slot_check.py (0 problems) and
    scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context
    review before import.

    Fresh-context review 2026-07-11 (Opus, zero access to authoring
    reasoning; sibling prs-en/en-prs overlays not consulted): PASS, no
    defects, status flipped to reviewed. Confirmed the composition-trap
    guard: hobby_activity_word (پیاده‌روی/آشپزی) is the strict subset
    that combines with می‌کنم, so both word_order frames stay
    grammatical for every filling (کتاب/موسیقی correctly excluded);
    both frame sentences appear verbatim in the reviewed realization;
    matching_pairs covers all 6 distinct pairs with unique glosses;
    word_order answers list-shaped; ZWNJ preserved in پیاده‌روی/می‌کنم;
    no listen_select/listen_type, no bare YAML booleans, no jargon
    leaks. practice-validate 0/0 and scripts/_practice_slot_check.py
    clean for the full en-prs set.

    POLISH WAVE 4 (2026-07-26): hobby_pair.002's HONEST LIMIT above is RESOLVED -- backfill_lexemes_en_prs.py now emits en_prs_a1_unit26_words. The matcher is de-aliased from the shared unit_noun_pool onto its own hobby_pair_word preset carrying that tag (6 distinct unit nouns = the 6-pair need, collision-free); unit_noun_pool is left untouched for the gloss/translate templates that share it. Course pool == unit pool. Verified with pool_check.py + unit-scope check.

    FRESH-CONTEXT NATIVE REVIEW 2026-07-27 (batch 1): reviewed against AUTHORING_PREFLIGHT.md with the realization/overlay + live backfill lexeme pools cross-checked. All CRITICAL/MAJOR findings fixed and committed (see docs/RAMIN_REVIEW_BACKLOG.md 'Native review batch 1' for the per-pack findings + residual MINOR/known-limitation notes; some backfill gloss fixes take effect on the next re-backfill). Status -> reviewed.
tag_schema:
  # POLISH 2026-07-24: verb/adjective added for the free_time_word_gloss
  # pool below (خواندن/می‌کنی/آزاد are this unit's own untagged
  # verb/adjective lexemes).
  part_of_speech: [noun, verb, adjective]
  agreement_tags:
    semantic: [hobby_topic_word, hobby_activity_word, en_prs_a1_unit26_words]
slot_presets:
  hobby_topic_word: &hobby_topic_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: hobby_topic_word}}
  hobby_activity_word: &hobby_activity_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: hobby_activity_word}}
  # Re-anchor fix (2026-07-24): hobby_topic_word alone is only 4 unit-scoped
  # tokens (موسیقی/فلم are REUSED from earlier units, out of this unit's
  # checkpoint scope) -- 6 slots over 4 real tokens was DEAD. Per recipe
  # SS3.1(c), omitting `semantic:` and constraining by part_of_speech alone
  # pools every noun this unit's own lessons introduce: the same 4 plus
  # گوش ("listening") and آخر ("end") -- 6 unit-scoped distinct nouns, all
  # genuinely distinct glosses, no case duplicates.
  unit_noun_pool: &unit_noun_pool {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: en_prs_a1_unit26_words}}
  # POLISH 2026-07-24 (tier-thinness wave 2): this unit's own non-noun
  # lexemes -- خواندن ("reading / to read", lesson01), می‌کنی ("you do
  # (informal)", lesson04), آزاد ("free (available time)", lesson02) --
  # carry NO semantic tag, so only a POS constraint can reach them
  # (recipe SS3.1(c); backfill scripts are off-limits in this PACK-ONLY
  # lane). 3 unit-scoped distinct glosses, exactly the MC floor. Used
  # only in a bare-'{slot}' frame, so the wide course-scope pool poses
  # no frame-grammaticality risk.
  # POLISH WAVE 4 follow-up (2026-07-27, native review): tagged with the
  # generated en_prs_a1_unit26_words (and unit_noun_pool likewise above) so
  # these pools are unit-scoped at COURSE scope -- free_time_word_gloss.001 /
  # unit_noun_gloss.002 feedback ("one of this unit's own words") was false
  # when an untagged pool drew a course-wide token in Endless Practice.
  verb_adjective_pool: &verb_adjective_pool {language_code: prs, part_of_speech: [verb, adjective], agreement_tags: {semantic: en_prs_a1_unit26_words}}
templates:
  # Lesson 1: hobby vocabulary.
  - content_key: practice.en-prs.prs.a1.unit26.lesson01.hobby_gloss.001
    lesson_content_key: prs.a1.unit26.lesson01.hobby_vocabulary
    type: multiple_choice
    frame: {text: "{hobby_topic_word}", language_code: prs, direction: rtl}
    slots: {hobby_topic_word: *hobby_topic_word}
    answer_derivation: {kind: slot_gloss, slot: hobby_topic_word}
    feedback_frame: {text: "{hobby_topic_word} belongs to this unit's free-time vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit26.lesson01.hobby_pair.002
    lesson_content_key: prs.a1.unit26.lesson01.hobby_vocabulary
    # Re-anchored (2026-07-24) to unit_noun_pool: hobby_topic_word alone is
    # only 4 unit-scoped tokens (was DEAD). Widened to this unit's full
    # 6-noun pool (see preset comment above).
    # POLISH WAVE 4 (2026-07-26): de-aliased from the shared unit_noun_pool
    # onto its own hobby_pair_word preset carrying the generated
    # en_prs_a1_unit26_words tag (6 distinct unit-scoped nouns = the 6-pair
    # need, collision-free), so the course-scope pool == the unit pool. Kept
    # unit_noun_pool untouched for the gloss/translate templates that share it.
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots: {word_one: &hobby_pair_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: en_prs_a1_unit26_words}}, word_two: *hobby_pair_word, word_three: *hobby_pair_word, word_four: *hobby_pair_word, word_five: *hobby_pair_word, word_six: *hobby_pair_word}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 2: the free-time question.
  - content_key: practice.en-prs.prs.a1.unit26.lesson02.free_time_word_gloss.001
    lesson_content_key: prs.a1.unit26.lesson02.free_time_question
    type: multiple_choice
    # ADDED (POLISH 2026-07-24, tier-thinness): recognition tier had only
    # 1 live template, and lesson02 (own vocab آزاد) had no template at
    # all. POS-only slot per recipe SS3.1(c) -- see the
    # verb_adjective_pool preset comment; 3 unit-scoped distinct glosses
    # (reading / to read, you do (informal), free (available time)).
    frame: {text: "{free_time_word}", language_code: prs, direction: rtl}
    slots: {free_time_word: *verb_adjective_pool}
    answer_derivation: {kind: slot_gloss, slot: free_time_word}
    feedback_frame: {text: "{free_time_word} is one of this unit's own free-time words.", language_code: en, direction: ltr}

  # Lesson 3: every week / weekend.
  - content_key: practice.en-prs.prs.a1.unit26.lesson03.weekly_hobby_order.001
    lesson_content_key: prs.a1.unit26.lesson03.frequency
    type: word_order
    frame: {text: "من هر هفته {hobby_activity_word} می‌کنم", language_code: prs, direction: rtl}
    slots: {hobby_activity_word: *hobby_activity_word}
    answer_derivation: {kind: render_frame, frame: {text: "من هر هفته {hobby_activity_word} می‌کنم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: من هر هفته [activity] می‌کنم (I do [activity] every week).", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit26.lesson03.unit_noun_gloss.002
    lesson_content_key: prs.a1.unit26.lesson03.frequency
    type: multiple_choice
    # ADDED (POLISH 2026-07-24, tier-thinness): recognition tier had only
    # 1 live template. Reuses the existing unit_noun_pool (6 unit-scoped
    # distinct glosses: hobby/book/listening/walking/cooking/end),
    # anchored to lesson03, whose own vocabulary (آخر, untagged) no
    # semantic constraint can reach.
    frame: {text: "{unit_noun}", language_code: prs, direction: rtl}
    slots: {unit_noun: *unit_noun_pool}
    answer_derivation: {kind: slot_gloss, slot: unit_noun}
    feedback_frame: {text: "{unit_noun} is one of this unit's own words.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit26.lesson03.unit_noun_translate.003
    lesson_content_key: prs.a1.unit26.lesson03.frequency
    type: translation
    # ADDED (POLISH 2026-07-24, tier-thinness): production tier had only
    # 1 live template. Bare-word translation over the same unit_noun_pool
    # (6 unit-scoped) -- POS-only is safe for bare-word translation
    # (recipe SS3.1(c)): the English-gloss prompt varies with the answer.
    frame: {text: "{unit_noun}", language_code: en, direction: ltr, slot_rendering: {unit_noun: english_gloss}}
    slots: {unit_noun: *unit_noun_pool}
    answer_derivation: {kind: slot_text, slot: unit_noun}
    feedback_frame: {text: "{unit_noun} is the Dari word for this.", language_code: en, direction: ltr}

  # Lesson 4: hobbies dialogue.
  - content_key: practice.en-prs.prs.a1.unit26.lesson04.sometimes_hobby_order.001
    lesson_content_key: prs.a1.unit26.lesson04.hobbies_dialogue
    type: word_order
    frame: {text: "من هم گاهی {hobby_activity_word} می‌کنم", language_code: prs, direction: rtl}
    slots: {hobby_activity_word: *hobby_activity_word}
    answer_derivation: {kind: render_frame, frame: {text: "من هم گاهی {hobby_activity_word} می‌کنم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: من هم گاهی [activity] می‌کنم (I also sometimes do [activity]).", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit26.lesson04.hobby_activity_translate.002
    lesson_content_key: prs.a1.unit26.lesson04.hobbies_dialogue
    type: translation
    # ADDED (POLISH 2026-07-24, tier-thinness): production tier had only
    # 1 live template. Bare-word translation over hobby_activity_word
    # (2 unit-scoped: پیاده‌روی/آشپزی), the pair this lesson's own
    # dialogue drills (من هم گاهی آشپزی می‌کنم).
    frame: {text: "{hobby_activity_word}", language_code: en, direction: ltr, slot_rendering: {hobby_activity_word: english_gloss}}
    slots: {hobby_activity_word: *hobby_activity_word}
    answer_derivation: {kind: slot_text, slot: hobby_activity_word}
    feedback_frame: {text: "{hobby_activity_word} is the Dari word for this activity.", language_code: en, direction: ltr}

  # Lesson 6: wrap-up.
  - content_key: practice.en-prs.prs.a1.unit26.lesson06.hobby_translate.001
    lesson_content_key: prs.a1.unit26.lesson06.wrap_up
    type: translation
    frame: {text: "{hobby_topic_word}", language_code: en, direction: ltr, slot_rendering: {hobby_topic_word: english_gloss}}
    slots: {hobby_topic_word: *hobby_topic_word}
    answer_derivation: {kind: slot_text, slot: hobby_topic_word}
    feedback_frame: {text: "{hobby_topic_word} is the Dari word for this.", language_code: en, direction: ltr}
