# ---------------------------------------------------------------------------
# lesson01 -- باید بخرم (present necessity, 1st/2nd person)
# ---------------------------------------------------------------------------
- content_key: practice.en-prs.prs.b1.unit02.lesson01.choose.001
  lesson_content_key: prs.b1.unit02.lesson01.present_necessity_1st2nd
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: prs
      part_of_speech: verb
      agreement_tags:
        semantic:
        - necessity_subjunctive_verb
        - necessity_negation_word
        - past_necessity_verb
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*{item}* is a verb form from the *باید* paradigm (present, past, or negated) -- the person ending carries the subject.'
    language_code: en
    direction: ltr

- content_key: practice.en-prs.prs.b1.unit02.lesson01.order.002
  lesson_content_key: prs.b1.unit02.lesson01.present_necessity_1st2nd
  type: word_order
  frame:
    text: 'باید {item} بخرم.'
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: food_item
  answer_derivation:
    kind: render_frame
    frame:
      text: 'باید {item} بخرم.'
      language_code: prs
      direction: rtl
  feedback_frame:
    text: '*باید {item} بخرم.* -- I must buy this item. *باید* never changes; only the second verb agrees with the subject.'
    language_code: en
    direction: ltr

- content_key: practice.en-prs.prs.b1.unit02.lesson01.match.003
  lesson_content_key: prs.b1.unit02.lesson01.present_necessity_1st2nd
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: prs
    direction: rtl
  slots:
    first: &grammar_word
      language_code: prs
      part_of_speech:
      - noun
      - pronoun
      - adverb
      - adjective
      agreement_tags:
        semantic:
        - grammar_term_word
        - sequence_word
        - demonstrative_word
        - identity
        - ones_number
    second: *grammar_word
    third: *grammar_word
    fourth: *grammar_word
    fifth: *grammar_word
    sixth: *grammar_word
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each Dari word with its English meaning.
    language_code: en
    direction: ltr

- content_key: practice.en-prs.prs.b1.unit02.lesson01.translate.004
  lesson_content_key: prs.b1.unit02.lesson01.present_necessity_1st2nd
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: prs
      part_of_speech: verb
      agreement_tags:
        semantic:
        - necessity_subjunctive_verb
        - necessity_negation_word
        - past_necessity_verb
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: The Dari form is {item}.
    language_code: en
    direction: ltr

