schema_version: '1.0'
pack_key: practice.en-prs.b1.unit02
source_language: en
target_language: prs
unit_content_key: prs.b1.unit02.necessity
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md. en-prs B1
    unit02 (باید / necessity with the subjunctive, plus past necessity and
    negation) had a full realization + overlay and 51 classified lexemes across
    lessons 01-05, but no practice pack, so its unit checkpoint returned
    checkpoint_unavailable.


    16 templates: multiple_choice x4, matching_pairs x3, word_order x2,
    fill_in_blank x2, translation x5. ZERO listen_select --
    tts_actually_configured('prs') is false, so _material() would delete them
    (recipe section 6.2 / DO-NOT 3); recognition tier is multiple_choice only.


    lesson06 (wrapup_production) exists in the realization but contributes ZERO
    lexemes to backfill_lexemes_en_prs.py, so it cannot be represented in the
    checkpoint by any pack -- the 5 lessons that DO have lexemes are each hosted
    in all three difficulty tiers. The whole necessity paradigm is drilled as one
    pool (necessity_subjunctive_verb + necessity_negation_word +
    past_necessity_verb, 9 unit-scoped members) because the individual tags are
    below the 6-member matching_pairs floor on their own; the person glosses
    ("(that) you buy" vs "(that) you (plural/polite) buy") are a genuine
    singular/plural discrimination, not a paraphrase pair, which is exactly the
    B1 competence this unit teaches.


    Both fill_in_blank slots (clean_word -> پاک, past_have_verb -> داشت) have
    exactly ONE distinct MODULE-wide candidate (AUTHORING_GUIDE section 17). No
    typed-answer pool contains a duplicate English gloss at B1-course scope, so
    no production prompt is underdetermined. Dari has no letter case and none of
    this unit's tokens carry harakat, so defects 1.25/1.30 cannot fire. Every
    frame is taken from the realization's own tested_text / teaching examples;
    no new verb form was invented, and the unit's ه/ین/ن colloquial paradigm for
    خریدن is preserved (بخره / بخرین, never بخرید). Needs the standard
    fresh-context review before import.

    Review 2026-10-24 (en-prs practice native-quality pass): 6 fixes. Four
    feedback statements that were false for the mixed pools (verb forms
    "governed by باید", "grammar explanation" words that include numbers,
    "describes how someone is" for امشب/اول/بعد) are neutral now;
    lesson05 fill frame uses ولی so that نداشت cannot also fit. Dari spans in
    edited feedback are *asterisked*. NATIVE FLAGS: translate.005 accepts only
    پاک کنیم (not تمیز کنیم); written نان vs spoken نون; colloquial بخره/بخرین/
    بخرن (-ه/-ین/-ن) next to written می‌آیند in the same unit; glosses of
    خودش and می‌کرد (see Gloss lane in the worker log).

tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - necessity_subjunctive_verb
    - necessity_negation_word
    - past_necessity_verb
    - grammar_term_word
    - sequence_word
    - demonstrative_word
    - identity
    - ones_number
    - food_item
    - cooking_word
    - cook_object_word
    - guest_word
    - room_word
    - chore_word
    - money_word
    - health_advice_word
    - condition_word
    - health_feeling_word
    - worry_word
    - clean_word
    - wellbeing_answer
    - confirmation_word
    - past_have_verb
