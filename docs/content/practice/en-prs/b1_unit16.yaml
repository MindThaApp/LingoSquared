# ---- structured ----
- content_key: practice.en-prs.prs.b1.unit16.lesson01.fill.001
  lesson_content_key: prs.b1.unit16.lesson01.whats_wrong
  type: fill_in_blank
  frame: {text: 'صفحه‌ی تیلفون {item} است.', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: adjective
      agreement_tags:
        semantic: en_prs_b1_unit16_lesson01_words
  answer_derivation: {kind: slot_text, slot: item, accepted_variants: ['خراب']}
  feedback_frame:
    text: 'صفحه‌ی تیلفون شکسته است. = The phone screen is broken.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.b1.unit16.lesson02.fill.001
  lesson_content_key: prs.b1.unit16.lesson02.what_happened
  type: fill_in_blank
  frame: {text: 'هیچ کس جواب {item}.', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: verb
      agreement_tags:
        semantic: en_prs_b1_unit16_lesson02_words
  answer_derivation: {kind: slot_text, slot: item, accepted_variants: ['نمی‌دهد']}
  feedback_frame:
    text: 'هیچ کس جواب نداد. = Nobody answered.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.b1.unit16.lesson05.fill.001
  lesson_content_key: prs.b1.unit16.lesson05.reading_complaint
  type: fill_in_blank
  frame: {text: '{item} جواب نداد.', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: en_prs_b1_unit16_lesson05_words
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: 'دوکاندار جواب نداد. = The shopkeeper did not answer.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.b1.unit16.lesson02.order.001
  lesson_content_key: prs.b1.unit16.lesson02.what_happened
  type: word_order
  frame: {text: 'هفتهٔ {item} تیلفون را خریدم.', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: adjective
      agreement_tags:
        semantic: en_prs_b1_unit16_lesson02_words
  answer_derivation:
    kind: render_frame
    frame: {text: 'هفتهٔ {item} تیلفون را خریدم.', language_code: prs, direction: rtl}
  feedback_frame:
    text: 'هفتهٔ گذشته تیلفون را خریدم. = I bought the phone last week.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.b1.unit16.lesson03.match.001
  lesson_content_key: prs.b1.unit16.lesson03.ask_resolution
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: prs, direction: rtl}
  slots:
    first: *uw
    second: *uw
    third: *uw
    fourth: *uw
    fifth: *uw
    sixth: *uw
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
  feedback_frame:
    text: 'Match each Dari word with its English meaning.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.b1.unit16.lesson05.match.001
  lesson_content_key: prs.b1.unit16.lesson05.reading_complaint
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: prs, direction: rtl}
  slots:
