schema_version: '1.0'
pack_key: practice.en-prs.b1.unit16
source_language: en
target_language: prs
unit_content_key: prs.b1.unit16.complaint
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    en-prs B1 practice pack (unit16 complaint), authored 2026-11-06. GRAMMAR/DIALOGUE UNIT, THIN: 15 usable lexemes over 5 of 6 lessons (lesson06 wrapup has none and cannot be represented in the checkpoint). Recognition/production/matching pool = unit-wide tag en_prs_b1_unit16_words, pos noun/verb/adjective/adverb (15 tokens). Untagged/foreign-tag unit lexemes excluded by the tag choice: هیچ (pronoun, no semantic), پس (particle, none), یا (choice_word only).
        Glosses read: no mis-gloss found; note تیلفونی "a phone (that)" is a bound relative-head form and awkward as a standalone answer (kept, flagged for a backfill gloss polish).
        fill_in_blank / word_order anchors are lesson-tag + part_of_speech single-candidate slots: شکسته (lesson01 adjective), نداد (lesson02 verb), دوکاندار (lesson05 noun), گذشته (lesson02 adjective, word_order). Tags en_prs_b1_unit16_lessonNN_words exist only in this unit so unit scope = course scope. lesson03 and lesson04 have no single-candidate anchor (two verbs/nouns each), so their structured coverage is matching_pairs only.
        16 templates: MC x5, fill x3, word_order x1, matching x2, translation x5. No listen_select (no prs TTS).
        Review 2026-11-06 (author pass, unreviewed): needs the standard
        fresh-context review before import.

tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_prs_b1_unit16_lesson01_words
    - en_prs_b1_unit16_lesson02_words
    - en_prs_b1_unit16_lesson03_words
    - en_prs_b1_unit16_lesson04_words
    - en_prs_b1_unit16_lesson05_words
    - en_prs_b1_unit16_words
slot_presets:
  unit_word: &uw
    language_code: prs
    part_of_speech: [noun, verb, adjective, adverb]
    agreement_tags:
      semantic: [en_prs_b1_unit16_words]
