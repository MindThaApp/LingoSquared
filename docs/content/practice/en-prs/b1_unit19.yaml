schema_version: '1.0'
pack_key: practice.en-prs.b1.unit19
source_language: en
target_language: prs
unit_content_key: prs.b1.unit19.summarize
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    en-prs B1 practice pack (unit19 summarize), authored 2026-11-06. THIN: 15 lexemes over 4 of 6 lessons (lesson04 dialogue and lesson06 wrapup have none and cannot be represented). Pool = unit tag en_prs_b1_unit19_words with pos noun/verb/adverb = 13 tokens.
        MIS-GLOSS EXCLUSION (recipe 0.1): اصلی is glossed "original" but the unit teaches نکتهٔ اصلی = "main point" (and carries the stray tag return_policy_word). It is excluded via part_of_speech (adjective left out of the broad pool); this also drops the correctly glossed adjective جدید ("new") from MC/matching/translation pools. Coordinator: route a backfill gloss fix for اصلی ("main").
        Fill anchors are single-candidate lesson-tag + pos slots: نویسنده (lesson02 noun), می‌گوید (lesson02 verb), می‌گیرند (lesson03 verb), مثلاً (lesson03 adverb), خواند (lesson05 verb). lesson01 (nouns مقاله/نکتهٔ, verbs خواندم/خواندن) has no single-candidate anchor, so lesson01 structured coverage is matching_pairs only. Lesson tags are unit-specific so unit = course scope.
        15 templates: MC x4, fill x5, matching x2, translation x4. No listen_select (no prs TTS).
        Review 2026-11-06 (author pass, unreviewed): needs the standard
        fresh-context review before import.

tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_prs_b1_unit19_lesson01_words
    - en_prs_b1_unit19_lesson02_words
    - en_prs_b1_unit19_lesson03_words
    - en_prs_b1_unit19_lesson04_words
    - en_prs_b1_unit19_lesson05_words
    - en_prs_b1_unit19_words
slot_presets:
  unit_word: &uw
    language_code: prs
    part_of_speech: [noun, verb, adverb]
    agreement_tags:
      semantic: [en_prs_b1_unit19_words]
