schema_version: "1.0"
pack_key: practice.en-prs.a1.unit34
source_language: en
target_language: prs
unit_content_key: prs.a1.unit34.neighborhood
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-11, same units 31-40 practice-pool depth-extension
    pass as this bundle's a1_unit31.yaml sibling (see that file's notes
    for the shared pass context). Realization and overlay are both
    status reviewed.

    Two groups: "neighborhood_word" (محله/همسایه/سرک/دوکان/مکتب, 5
    members, completes lesson01 -- مکتب is a REUSED existing lexeme,
    additive tag) is the recognition pool. "place_proximity_word"
    (دوکان/مکتب, 2) is the strict subset the taught "... نزدیک است"/
    "... دور نیست" frames actually use.

    Word_order template checked for grammaticality: "{place_proximity_word}
    نزدیک است" (lesson02, matches the real taught "دوکان نزدیک است."
    verbatim; "مکتب نزدیک است." is an equally grammatical generalization
    checked directly, even though the unit's own taught sentence for
    مکتب uses the negative "دور نیست" instead).

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    No bare unquoted yes/no/true/false anywhere. Verified with
    scripts/_practice_slot_check.py (0 problems) and
    scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context
    review before import.
tag_schema:
  part_of_speech: [noun]
  agreement_tags:
    semantic: [neighborhood_word, place_proximity_word]
slot_presets:
  neighborhood_word: &neighborhood_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: neighborhood_word}}
  place_proximity_word: &place_proximity_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: place_proximity_word}}
templates:
  # Lesson 1: neighborhood vocabulary.
  - content_key: practice.en-prs.prs.a1.unit34.lesson01.neighborhood_gloss.001
    lesson_content_key: prs.a1.unit34.lesson01.neighborhood_words
    type: multiple_choice
    frame: {text: "{neighborhood_word}", language_code: prs, direction: rtl}
    slots: {neighborhood_word: *neighborhood_word}
    answer_derivation: {kind: slot_gloss, slot: neighborhood_word}
    feedback_frame: {text: "{neighborhood_word} belongs to this unit's neighborhood vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit34.lesson01.neighborhood_pair.002
    lesson_content_key: prs.a1.unit34.lesson01.neighborhood_words
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five}", language_code: prs, direction: rtl}
    slots: {word_one: *neighborhood_word, word_two: *neighborhood_word, word_three: *neighborhood_word, word_four: *neighborhood_word, word_five: *neighborhood_word}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 2: near and far.
  - content_key: practice.en-prs.prs.a1.unit34.lesson02.proximity_order.001
    lesson_content_key: prs.a1.unit34.lesson02.near_and_far
    type: word_order
    frame: {text: "{place_proximity_word} نزدیک است", language_code: prs, direction: rtl}
    slots: {place_proximity_word: *place_proximity_word}
    answer_derivation: {kind: render_frame, frame: {text: "{place_proximity_word} نزدیک است", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: [place] نزدیک است ([place] is near).", language_code: en, direction: ltr}

  # Lesson 6: wrap-up.
  - content_key: practice.en-prs.prs.a1.unit34.lesson06.neighborhood_translate.001
    lesson_content_key: prs.a1.unit34.lesson06.wrap_up
    type: translation
    frame: {text: "{neighborhood_word}", language_code: en, direction: ltr, slot_rendering: {neighborhood_word: english_gloss}}
    slots: {neighborhood_word: *neighborhood_word}
    answer_derivation: {kind: slot_text, slot: neighborhood_word}
    feedback_frame: {text: "{neighborhood_word} is the Dari word for this.", language_code: en, direction: ltr}
