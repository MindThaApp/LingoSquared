schema_version: '1.0'
pack_key: practice.en-prs.a2.unit22
source_language: en
target_language: prs
unit_content_key: prs.a2.unit22.busy_morning
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: 'Hand-authored from the unit''s realization and overlay and the en-prs backfill pool (tags en_prs_a2_unit22_* and w_<token>). 62 pool lexemes, 59 reachable (the particle نی and the names ثریا and نوید carry no semantic tag). Recognition and bare-word production pools use single-word w_ tags only; the phrase lexemes in lessons 4, 5 and 6 (sentences from the reading and conversation) are used in lesson-tag phrase pools for multiple_choice, word_order and bare translation. Phrase lexemes that are paradigm lists (for example the six-form bidar shodam rows) are left out of every pool. Kept OUT of recognition and matching because the stored gloss is a literal sense that misleads in this unit''s light-verb use: زدن/زد/زدم/زدیم/نزدم (''strike; do''), کشیدن/کشید/کشیدم/نکشیدم (''pull; do''), حرف (''point; what someone says''), and رسیدن (stored as the noun ''arrival; arriving'', the unit teaches the verb ''to arrive''). Where possible these are hosted by fixed-sentence translations whose English prompt never shows the gloss. رسیدن, زدن and کشیدن (infinitives) have no natural frame and are not hosted. Sentence frames are single-member w_ anchors on the unit''s own teaching lines; Afghan Dari forms (plural -ین). Needs native review of every frame and of the English feedback.'
