schema_version: '1.0'
pack_key: practice.en-prs.a1.unit31
source_language: en
target_language: prs
unit_content_key: prs.a1.unit31.education
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (en-fa/en-prs practice pass, fresh context; 0 fixes). Pools, glosses and the one word_order frame (من {field} می‌خوانم, 4 fields, natural Dari, matches the unit''s رشته من طب است) checked at unit and course scope; no Arabic Yeh/Kaf; no leakage. NATIVE FLAGS / backfill: ''medicine'' is the gloss of both طب (this unit, the field) and دوا (earlier unit, a drug), so in Endless Practice field_translate.002 / study_pair_translate.003 can show ''medicine'' and reject دوا; a backfill gloss like ''medicine (field of study)'' would fix it (not fixable pack-side without dropping طب).

    TIER-THINNESS POLISH 2026-07-24 (wave 2): recognition was 2 live and production 1 live. Added lesson04.education_gloss.001
    (MC on the existing study_pair_word union preset, 7 distinct unit tokens/glosses, anchored to the dialogue lesson which
    has its own vocab), lesson02.field_translate.002 (bare-word translation on field_word, 4 unit-native members) and
    lesson01.study_pair_translate.003 (bare-word translation on study_pair_word, 7). All corpus-standard bare-slot shapes --
    no new Dari strings, no literal-text frames, pools all distinct from their siblings. Tiers now 3/3/3 live. Still
    unreviewed pending fresh-context review.


    UNIT-SCOPE DEAD-TEMPLATE FIX 2026-07-24 (checkpoint re-authoring pass): both lesson01.study_pair.002 and
    lesson01.study_pair.002.volume_match.010 (matching_pairs, 6 slots) were DEAD. The original notes below counted
    مکتب/محصل (and درس, which the tag_schema/slot never actually referenced beyond the prose) as part of a 6-member
    study_vocab_word pool, but all three -- محصل (unit03), مکتب (unit05), درس (unit18) -- are additive tags on
    EARLIER-unit lexemes; generate_checkpoint() scopes candidates to this unit''s own lexemes only, so the real
    unit-scoped study_vocab_word pool is just 3 (تحصیل/پوهنتون/رشته), half the 6-pair floor. RE-ANCHORED (did not
    drop): added a matching_pairs-only preset `study_pair_word` that unions study_vocab_word with this same unit''s
    own field_word tag (طب/حقوق/اقتصاد/ادبیات, all 4 genuinely native to lesson02, already used cleanly by the
    lesson02 MC/word_order templates) -- both tags were already declared in tag_schema. That yields 7 distinct
    unit-scoped tokens/glosses (study/education, university, field of study, medicine, law, economics, literature),
    comfortably over the floor, thematically coherent (both halves are this unit''s own education vocabulary), and
    with no confusable pairs. The lesson01 MC and lesson06 translation templates keep the original narrower
    study_vocab_word preset (3 nouns, exactly at the >=3 MC floor already) untouched since they were not broken.
    Re-verified with scripts/_practice_unit_scope_check.py (0 DEAD for this file) and scripts/compile_content.py
    practice-validate.

    Authored 2026-07-11, second practice-pool depth-extension pass for en-prs (units 31-40, continuing directly from
    the units 25-30 pass the same day) -- extends both scripts/backfill_lexemes_en_prs.py (UNIT_FILES 31-40, new glosses/POS/semantic
    tags, and three genuine homograph overrides in _classify()) and the en-prs pack set past its previous unit30 cap. Realization
    and overlay are both status reviewed.

    Two groups: "study_vocab_word" (تحصیل/پوهنتون/مکتب/رشته/محصل/درس, 6 members, completes lesson01 -- مکتب/محصل are REUSED
    existing lexemes, additive tags) is the recognition pool. "field_word" (طب/حقوق/اقتصاد/ادبیات, 4, lesson02) is the academic-fields
    subset; حقوق is a genuine homograph against the existing "salary" sense (A2 unit14) -- this unit''s sense ("law") is special-cased
    by content_key in _classify() so a field_word template only ever draws the law sense, never salary.

    Word_order template checked for grammaticality: "من {field_word} می‌خوانم" (lesson02, matches the real taught "من طب می‌خوانم."
    generalized to all four fields -- checked per candidate, not just the taught example: "من حقوق می‌خوانم."/"من اقتصاد می‌خوانم."/"من
    ادبیات می‌خوانم." are all grammatical).

    No listen_select/listen_type anywhere (en-prs has no TTS voices). No bare unquoted yes/no/true/false anywhere. Verified
    with scripts/_practice_slot_check.py (0 problems) and scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context review before import; no backfill_lexemes_en_prs.py run
    has happened against a real database yet in this pass.

    Fresh-context review 2026-07-11 (Opus, zero access to authoring reasoning; sibling prs-en/en-prs overlays not consulted):
    PASS, no defects, status flipped to reviewed. Verified every slot member is taught in this unit or earlier (realizations
    units <=40); Afghan Dari register throughout (مکتب/پوهنتون/سرک/دوکان/پولیس/امبولانس/ اطفائیه/موتر, no Iranian calques);
    ZWNJ correct in all می‌-forms and compounds; every word_order frame grammatical for EVERY candidate filling (composition-trap
    subsets -- sweep_clean/cook_object/ field/service/specific_season -- correctly exclude tokens that need a different light
    verb or read unnaturally); matching_pairs pulls distinct glosses covering every pair; no listen_select/listen_type (Dari
    has zero TTS); no bare YAML booleans; no snake_case jargon in learner-facing text. The three unit31/33 homograph splits
    (حقوق law vs salary, ظرف dishes vs within-period, می‌شویم wash vs become) are correctly scoped by content_key in _classify()
    and by lesson_key in prs_agreement_tags(), leaving each other sense untouched. practice-validate 0/0 and _practice_slot_check.py
    clean for the full en-prs set.'
tag_schema:
  part_of_speech:
  - noun
  agreement_tags:
    semantic:
    - study_vocab_word
    - field_word
slot_presets:
  study_vocab_word: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: study_vocab_word
  field_word: &id002
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: field_word
  study_pair_word: &study_pair_word
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: [study_vocab_word, field_word]
templates:
- content_key: practice.en-prs.prs.a1.unit31.lesson01.study_gloss.001
  lesson_content_key: prs.a1.unit31.lesson01.study_vocabulary
  type: multiple_choice
  frame:
    text: '{study_vocab_word}'
    language_code: prs
    direction: rtl
  slots:
    study_vocab_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: study_vocab_word
  feedback_frame:
    text: '{study_vocab_word} belongs to this unit''s education vocabulary.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit31.lesson01.study_pair.002
  lesson_content_key: prs.a1.unit31.lesson01.study_vocabulary
  type: matching_pairs
  frame:
    text: '{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}'
    language_code: prs
    direction: rtl
  slots:
    word_one: *study_pair_word
    word_two: *study_pair_word
    word_three: *study_pair_word
    word_four: *study_pair_word
    word_five: *study_pair_word
    word_six: *study_pair_word
  slot_relations:
  - kind: distinct
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
    - word_six
  answer_derivation:
    kind: matching_pairs
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
    - word_six
  feedback_frame:
    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit31.lesson02.field_gloss.001
  lesson_content_key: prs.a1.unit31.lesson02.fields_of_study
  type: multiple_choice
  frame:
    text: '{field_word}'
    language_code: prs
    direction: rtl
  slots:
    field_word: *id002
  answer_derivation:
    kind: slot_gloss
    slot: field_word
  feedback_frame:
    text: '{field_word} is a field of study.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit31.lesson02.field_study_order.001
  lesson_content_key: prs.a1.unit31.lesson02.fields_of_study
  type: word_order
  frame:
    text: من {field_word} می‌خوانم
    language_code: prs
    direction: rtl
  slots:
    field_word: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: من {field_word} می‌خوانم
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'Word order: من [field] می‌خوانم (I study [field]).'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit31.lesson06.study_translate.001
  lesson_content_key: prs.a1.unit31.lesson06.wrap_up
  type: translation
  frame:
    text: '{study_vocab_word}'
    language_code: en
    direction: ltr
    slot_rendering:
      study_vocab_word: english_gloss
  slots:
    study_vocab_word: *id001
  answer_derivation:
    kind: slot_text
    slot: study_vocab_word
  feedback_frame:
    text: '{study_vocab_word} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit31.lesson04.education_gloss.001
  lesson_content_key: prs.a1.unit31.lesson04.education_dialogue
  type: multiple_choice
  frame:
    text: '{study_pair_word}'
    language_code: prs
    direction: rtl
  slots:
    study_pair_word: *study_pair_word
  answer_derivation:
    kind: slot_gloss
    slot: study_pair_word
  feedback_frame:
    text: '{study_pair_word} belongs to this unit''s education vocabulary.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit31.lesson02.field_translate.002
  lesson_content_key: prs.a1.unit31.lesson02.fields_of_study
  type: translation
  frame:
    text: '{field_word}'
    language_code: en
    direction: ltr
    slot_rendering:
      field_word: english_gloss
  slots:
    field_word: *id002
  answer_derivation:
    kind: slot_text
    slot: field_word
  feedback_frame:
    text: '{field_word} is the Dari word for this field of study.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit31.lesson01.study_pair_translate.003
  lesson_content_key: prs.a1.unit31.lesson01.study_vocabulary
  type: translation
  frame:
    text: '{study_pair_word}'
    language_code: en
    direction: ltr
    slot_rendering:
      study_pair_word: english_gloss
  slots:
    study_pair_word: *study_pair_word
  answer_derivation:
    kind: slot_text
    slot: study_pair_word
  feedback_frame:
    text: '{study_pair_word} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit31.lesson01.study_pair.002.volume_match.010
  lesson_content_key: prs.a1.unit31.lesson01.study_vocabulary
  type: matching_pairs
  frame:
    text: '{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}'
    language_code: prs
    direction: rtl
    text_blocks:
    - text: Second review matching set for this unit.
      language_code: en
      direction: ltr
  slots:
    word_one: *study_pair_word
    word_two: *study_pair_word
    word_three: *study_pair_word
    word_four: *study_pair_word
    word_five: *study_pair_word
    word_six: *study_pair_word
  slot_relations:
  - kind: distinct
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
    - word_six
  answer_derivation:
    kind: matching_pairs
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
    - word_six
  feedback_frame:
