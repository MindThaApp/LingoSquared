schema_version: '1.0'
pack_key: practice.en-prs.a2.unit37
source_language: en
target_language: prs
unit_content_key: prs.a2.unit37.if_conditions
review: {status: reviewed, required_next_reviewer: native_speaker_review, fresh_context: 'true', notes: 'Fresh-context review 2026-11-27 (en-prs A2 units 34-39 pass): 2 fixes - (1) lesson03 order.002 and fill.002 rendered اگر سردت، لباس گرم بپوش, which drops the verb; the frame is now اگر {item} است، لباس گرم بپوش as the unit teaches it. (2) The backfill token سردت carries the gloss you are cold, so the six bare-word translations asked for you are cold and graded سردت است wrong; w_سردت is removed from those six translation slots only (it stays hosted in recognition, matching, word_order and fill_in_blank). Dumped the unit pool (26 lexemes, 6 lessons) and read every gloss; every anchor has one course-wide candidate, no self-reference. Capacity after the fix: 50 live templates, ALL 62%, recognition 62%, structured 62%, production 58%, 6/6 lessons in every tier, no dead templates. Backfill item for the coordinator: سردت is glossed you are cold but is only the clitic form; the taught phrase is سردت است. Authored by hand for the sparse grammar-led unit. Word pools use the single-member w_<token> tags only (plus lesson tags where a clean phrase pool exists); the unit-wide and lesson tags are not used for word pools because they also carry multi-form paradigm phrases (comma lists of six forms) whose glosses are lists. Names (proper nouns) carry no semantic tag and stay out of every pool. fa/prs have no TTS so no listen_select. Anchor frames reuse the unit''s own teaching lines (Kabul Dari, -ین 2pl). Excluded from pools: the comma-list paradigm phrases (L1 اگر بروم..., L2 باشم... and نروم، نیایم... lists, L3 بگیر.../نرو... lists) and the L2 phrases آخر هفته and ''اگر دوستم بیاید...'' (only reachable through the lesson02 tag that also carries the lists); names شاهین, زینب, فریبا. Sentence phrases of L4-L6 are used as whole-sentence MC/word_order/translation items (L6 sentence is three sentences long). Questions: see report.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [en_prs_a2_unit37_lesson04_words, en_prs_a2_unit37_lesson05_words, en_prs_a2_unit37_lesson06_words, w_بپوش, w_بیرون, w_سردت, w_شوی, w_مشتری, w_مشتریان, w_نباشد, w_نخرم, w_نداشته, w_نروم, w_نمی‌خواهین, w_نیایم, w_کالا]
