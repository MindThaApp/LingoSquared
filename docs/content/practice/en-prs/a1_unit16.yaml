    language_code: prs
    direction: rtl
  slots:
    when_word: *id005
  answer_derivation:
    kind: slot_text
    slot: when_word
  feedback_frame:
    text: کی means when.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit16.lesson03.travel_noun_gloss.003
  lesson_content_key: prs.a1.unit16.lesson03.asking_departure_details
  type: multiple_choice
  frame:
