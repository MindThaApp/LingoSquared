schema_version: '1.0'
pack_key: practice.en-prs.a1.unit16
source_language: en
target_language: prs
unit_content_key: prs.a1.unit16.travel
review:
  status: unreviewed
  fresh_context: false
  notes: 'UNIT-SCOPE REPAIR 2026-07-24 (pack-only): _practice_unit_scope_check.py found
    10 DEAD templates + 1 below-floor -- the worst of this reauth batch. LOG FOR
    COORDINATOR: contrary to this file''s original notes, want_verb (می‌خواهم), city_name
    (هرات/کابل/مزار/شریف), confirmation_word (بسیار/خوب), tomorrow_word (فردا), and
    travel_farewell_word (تشکر/زیاد/قابلی/نداره/سفر/خوش) all have ZERO unit16-scoped
    Lexeme rows -- every one of those strings is already registered to an EARLIER unit
    (verified via iter_specs()), so the classifier never emits a fresh unit16-anchored
    row for them even though the realization''s own introduced_tokens genuinely lists
    them at lesson02/04/05/06. This unit''s TRUE own vocabulary is only 9 tokens:
    travel_noun (بلیط/قطار/بس/سکو, 4), platform_ezafe (سکوی, 1), depart_noun (حرکت, 1),
    when_word (کی, 1), and travel_role_word (مسافر/فروشنده, 2 -- the only genuinely-new
    tokens, now added to this pack''s tag_schema). Fixes: want_verb_translate.001,
    city_name_gloss.002, travel_farewell_gloss.001, travel_farewell_translate.002,
    travel_review_pair.003 (slots 10->6) all re-anchored to travel_review_pool, widened
    in place to union all 5 real tags (9 distinct). ticket_request_order.003 (needed a
    destination-city slot with no in-unit substitute) redesigned as a simple "این
    {travel_noun} است" predicate frame -- travel_noun''s 4 members (ticket/train/bus/
    platform) are all grammatical there and the tag is unit16-exclusive within the a1
    course. schedule_number_order.002 (needed `ones_number`, a1 unit03/unit04''s tag)
    DROPPED outright -- no in-unit noun fits "the [X] departs" grammatically/sensibly
    (platform/ticket don''t "depart") and platform_ezafe_order.001 already covers
    lesson04''s structured tier. confirmation_word_translate.001 re-anchored to
    travel_role_word. tomorrow_word_fill.002 (fill_in_blank, needs a genuine
    single-candidate slot) re-anchored to platform_ezafe (already direction-wide
    single-candidate, previously only used by the word_order sibling) reusing that
    exact frame. Its word_order twin (.005) re-anchored to travel_role_word instead
    (avoiding an exact duplicate of platform_ezafe_order.001) with a fresh "این
    {travel_role_word} است" frame -- both members grammatical, course-scope checked.
    travel_noun_core_pair.003 (below the 6-pair floor at 3 slots) widened to
    unit_core_pool (travel_noun+platform_ezafe+depart_noun, 6 distinct exact). Net:
    19 templates -> 18 (1 drop, no replacement needed -- pack stays comfortably above
    the 12-template floor with all three tiers populated). Post-fix:
    _practice_unit_scope_check.py reports 0 DEAD, 0 below-floor; practice-validate 0
    errors (see coordinator report). `ones_number` is now unused in this pack''s
    tag_schema (harmless, left declared). Pre-existing authoring notes below, retained
    for provenance.

    Authored 2026-07-07 for the new A1 unit16 (travel) realization, the same night prs''s real A1 realization grew 15->17
    units (unit16 travel, unit17 health). This pack (and its unit17 sibling) extends scripts/backfill_lexemes_en_prs.py''s
    UNIT_FILES tuple, PRS_GLOSSES/ PRS_POS entries, and prs_agreement_tags() -- re-read fresh immediately before editing.

    New groups, all real vocabulary from this unit''s own realization: travel_noun_core (بلیط/قطار/بس, 3 members -- this unit''s
    lesson01 core nouns), travel_noun (adds سکو once lesson03 introduces it, 4 members, used for a later-lesson review multiple_choice),
    depart_noun (حرکت alone, a real single-candidate group used for fill_in_blank), want_verb (می‌خواهم alone -- a single
    Lexeme project-wide regardless of how many units reuse the same string, genuinely single-candidate), city_name (reuses
    the existing course-wide 4-member group: کابل/هرات/مزار/شریف), platform_ezafe (سکوی alone, the ezafe-marked form, distinct
    token from سکو), confirmation_word (بسیار/خوب, 2 members), tomorrow_word (فردا alone, single-candidate, used for a second
    fill_in_blank), and travel_farewell_word (تشکر/زیاد/قابلی/نداره/سفر/خوش, 6 members -- this unit''s closing polite phrases,
    already established Afghan Dari forms reused from unit05/unit06). The final review matching_pairs pools travel_farewell_word
    with travel_noun (10 distinct tokens), the same plan_pool-style pooling pattern as a1_unit13.yaml.

    Fixed a real homograph gap while extending the classifier: "کی" is genuinely two different lexemes -- unit07''s interrogative
    pronoun ("who") versus this unit''s interrogative adverb ("when," قطار کی حرکت می‌کند؟). Given its own part_of_speech
    ("adverb" vs. the existing "pronoun") and a content_key-scoped override in _classify(), mirroring the existing و/می‌شود
    homograph guards -- verified the two senses resolve to separate Lexeme rows via the dry run. Also fixed two missing glosses
    caught by the classifier''s own hard-fail (مسافر "traveler," فروشنده "seller," the dialogue''s two speakers) -- both real,
    newly-introduced nouns, not previously covered by any earlier unit.

    Three fill_in_blank templates (depart_noun, when_word, tomorrow_word), each verified via scripts/_fill_in_blank_ambiguity_check.py
    as a real single-project-wide-candidate group -- not just candidate-count sufficient but genuinely unambiguous: depart_noun
    and tomorrow_word are the only Lexeme with that exact tag anywhere in the course, and when_word''s tag is lesson_key-scoped
    to only this unit''s "when" sense of کی (the unit07 "who" sense never gets this tag). No listen_select/listen_type anywhere
    (en-prs has no TTS voices). No bare unquoted yes/no/true/false anywhere.

    Verified with scripts/_practice_slot_check.py (reusing backfill_lexemes_en_prs.py''s real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py practice-validate for the full en-prs pack -- 0 errors/0
    warnings. scripts/_fill_in_blank_ambiguity_check.py -- zero AMBIGUOUS flags. Needs the standard fresh-context review before
    import; no backfill_lexemes_en_prs.py run has happened against a real database yet in this pass.'
tag_schema:
  part_of_speech:
  - noun
  - verb
  - adjective
  - adverb
  - proper_noun
  agreement_tags:
    semantic:
    - travel_noun_core
    - travel_noun
    - depart_noun
    - want_verb
    - city_name
    - when_word
    - platform_ezafe
    - confirmation_word
    - tomorrow_word
    - travel_farewell_word
    - ones_number
    - travel_role_word
slot_presets:
  travel_noun_core: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: travel_noun_core
  travel_noun: &id006
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: travel_noun
  depart_noun: &id004
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: depart_noun
  want_verb: &id002
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: want_verb
  city_name: &id003
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic: city_name
  when_word: &id005
    language_code: prs
    part_of_speech: adverb
    agreement_tags:
      semantic: when_word
  platform_ezafe: &id007
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: platform_ezafe
  confirmation_word: &id009
    language_code: prs
    part_of_speech:
    - adverb
    - adjective
    agreement_tags:
      semantic: confirmation_word
  tomorrow_word: &id010
    language_code: prs
    part_of_speech: adverb
    agreement_tags:
      semantic: tomorrow_word
  travel_farewell_word: &id011
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    - verb
    agreement_tags:
      semantic: travel_farewell_word
  ones_number: &id008
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: ones_number
  # UNIT-SCOPE REPAIR 2026-07-24: `travel_farewell_word` has ZERO
  # unit16-scoped candidates (its 9 members -- خوش/تشکر/زیاد/قابلی/نداره/
  # سفر -- are all registered to a1 unit01/unit05/unit06, despite this
  # file's original notes claiming they were "this unit's closing polite
  # phrases"; LOG FOR COORDINATOR). This unit's TRUE own vocabulary is
  # only 9 tokens total: travel_noun (بلیط/قطار/بس/سکو, 4),
  # platform_ezafe (سکوی, 1), depart_noun (حرکت, 1), when_word (کی, 1),
  # and travel_role_word (مسافر/فروشنده, 2 -- newly declared below, the
  # only genuinely-new-to-the-corpus tokens this unit introduces). Widened
  # this preset (keeping its original anchor id so every template that
  # referenced it keeps working) to union all five, 9 distinct total.
  # Reused by want_verb_translate.001, city_name_gloss.002,
  # travel_farewell_gloss.001, travel_farewell_translate.002 and
  # travel_review_pair.003 (all previously constrained on a 0-candidate
  # earlier-unit tag), slots reduced 10->6 where declared.
  travel_review_pool: &id012
    language_code: prs
    part_of_speech:
    - noun
    - adverb
    agreement_tags:
      semantic:
      - travel_noun
      - platform_ezafe
      - depart_noun
      - when_word
      - travel_role_word
  # Narrower unit_core_pool for travel_noun_core_pair.003 (lesson01): just
  # the "core travel nouns" cluster (travel_noun + platform_ezafe +
  # depart_noun = 6 distinct), no when_word/travel_role_word.
  unit_core_pool: &id014
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic:
      - travel_noun
      - platform_ezafe
      - depart_noun
  # NEW real vocabulary this pack never used: مسافر "traveler" and
  # فروشنده "seller" (lesson05's own dialogue-role nouns, genuinely new to
  # the corpus -- not reused from an earlier unit).
  travel_role_word: &id013
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: travel_role_word
templates:
- content_key: practice.en-prs.prs.a1.unit16.lesson01.travel_noun_core_gloss.001
  lesson_content_key: prs.a1.unit16.lesson01.basic_travel_vocab
  type: multiple_choice
  frame:
    text: '{travel_noun_core}'
    language_code: prs
    direction: rtl
  slots:
    travel_noun_core: *id001
  answer_derivation:
    kind: slot_gloss
    slot: travel_noun_core
  feedback_frame:
    text: '{travel_noun_core} is one of this unit''s basic travel words.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit16.lesson01.travel_noun_core_translate.002
  lesson_content_key: prs.a1.unit16.lesson01.basic_travel_vocab
  type: translation
  frame:
    text: '{travel_noun_core}'
    language_code: en
    direction: ltr
    slot_rendering:
      travel_noun_core: english_gloss
  slots:
    travel_noun_core: *id001
  answer_derivation:
    kind: slot_text
    slot: travel_noun_core
  feedback_frame:
    text: '{travel_noun_core} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit16.lesson01.travel_noun_core_pair.003
  lesson_content_key: prs.a1.unit16.lesson01.basic_travel_vocab
  # UNIT-SCOPE REPAIR 2026-07-24: travel_noun_core alone only has 3
  # members, below the recipe's 6-pair floor. Widened to unit_core_pool
  # (travel_noun + platform_ezafe + depart_noun = 6 distinct exact).
  type: matching_pairs
  frame:
    text: '{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}'
    language_code: prs
    direction: rtl
  slots:
    word_one: *id014
    word_two: *id014
    word_three: *id014
    word_four: *id014
    word_five: *id014
    word_six: *id014
  slot_relations:
  - kind: distinct
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
    - word_six
  answer_derivation:
    kind: matching_pairs
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
    - word_six
  feedback_frame:
    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit16.lesson02.want_verb_translate.001
  lesson_content_key: prs.a1.unit16.lesson02.buying_a_ticket
  # UNIT-SCOPE REPAIR 2026-07-24: `want_verb` (می‌خواهم) has ZERO
  # unit16-scoped candidates -- it's registered to a1 unit07, despite
  # this file's original notes claiming it as "a single Lexeme
  # project-wide ... genuinely single-candidate" for this unit. LOG FOR
  # COORDINATOR. Re-anchored to travel_review_pool (9 distinct: this
  # unit's real travel_noun+platform_ezafe+depart_noun+when_word+
  # travel_role_word union).
  type: translation
  frame:
    text: '{want_verb}'
    language_code: en
    direction: ltr
    slot_rendering:
      want_verb: english_gloss
  slots:
    want_verb: *id012
  answer_derivation:
    kind: slot_text
    slot: want_verb
  feedback_frame:
    text: '{want_verb} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit16.lesson02.city_name_gloss.002
  lesson_content_key: prs.a1.unit16.lesson02.buying_a_ticket
  # UNIT-SCOPE REPAIR 2026-07-24: `city_name` has ZERO unit16-scoped
  # candidates (هرات/کابل/مزار/شریف are all registered to earlier units --
  # LOG FOR COORDINATOR, same class as want_verb above). Re-anchored to
  # travel_review_pool (9 distinct).
  type: multiple_choice
  frame:
    text: '{city_name}'
    language_code: prs
    direction: rtl
  slots:
    city_name: *id012
  answer_derivation:
    kind: slot_gloss
    slot: city_name
  feedback_frame:
    text: '{city_name} is one of this unit''s travel words.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit16.lesson02.ticket_request_order.003
  lesson_content_key: prs.a1.unit16.lesson02.buying_a_ticket
  # UNIT-SCOPE REPAIR 2026-07-24: the original frame needed `city_name`
  # (0 unit-scoped candidates, LOG FOR COORDINATOR above) and no in-unit
  # tag can safely fill a destination-city slot without producing an
  # ungrammatical/nonsensical sentence (this unit's other nouns --
  # platform, departure -- aren't travel destinations). Redesigned as a
  # simple predicate frame ("this is a/the [travel_noun]") over
  # travel_noun (id006, unchanged, 4 distinct: ticket/train/bus/
  # platform), all of which are grammatical in this shape. Course-scope
  # checked: travel_noun is unit16-exclusive within the a1 course (see
  # review notes), so no widening risk.
  type: word_order
  frame:
    text: این {travel_noun} است
    language_code: prs
    direction: rtl
  slots:
    travel_noun: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: این {travel_noun} است
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'Word order: این [thing] است (this is a/the [thing]).'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit16.lesson03.depart_noun_fill.001
  lesson_content_key: prs.a1.unit16.lesson03.asking_departure_details
