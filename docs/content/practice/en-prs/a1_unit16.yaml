- content_key: practice.en-prs.prs.a1.unit16.lesson05.confirmation_word_translate.001
  lesson_content_key: prs.a1.unit16.lesson05.ticket_counter_dialogue
  # UNIT-SCOPE REPAIR 2026-07-24: `confirmation_word` (بسیار/خوب) has
