schema_version: '1.0'
pack_key: practice.en-prs.a1.unit16
source_language: en
target_language: prs
unit_content_key: prs.a1.unit16.travel
review:
  status: unreviewed
  fresh_context: false
  notes: 'Authored 2026-07-07 for the new A1 unit16 (travel) realization, the same night prs''s real A1 realization grew 15->17
    units (unit16 travel, unit17 health). This pack (and its unit17 sibling) extends scripts/backfill_lexemes_en_prs.py''s
    UNIT_FILES tuple, PRS_GLOSSES/ PRS_POS entries, and prs_agreement_tags() -- re-read fresh immediately before editing.

    New groups, all real vocabulary from this unit''s own realization: travel_noun_core (بلیط/قطار/بس, 3 members -- this unit''s
    lesson01 core nouns), travel_noun (adds سکو once lesson03 introduces it, 4 members, used for a later-lesson review multiple_choice),
    depart_noun (حرکت alone, a real single-candidate group used for fill_in_blank), want_verb (می‌خواهم alone -- a single
    Lexeme project-wide regardless of how many units reuse the same string, genuinely single-candidate), city_name (reuses
    the existing course-wide 4-member group: کابل/هرات/مزار/شریف), platform_ezafe (سکوی alone, the ezafe-marked form, distinct
    token from سکو), confirmation_word (بسیار/خوب, 2 members), tomorrow_word (فردا alone, single-candidate, used for a second
    fill_in_blank), and travel_farewell_word (تشکر/زیاد/قابلی/نداره/سفر/خوش, 6 members -- this unit''s closing polite phrases,
    already established Afghan Dari forms reused from unit05/unit06). The final review matching_pairs pools travel_farewell_word
    with travel_noun (10 distinct tokens), the same plan_pool-style pooling pattern as a1_unit13.yaml.

    Fixed a real homograph gap while extending the classifier: "کی" is genuinely two different lexemes -- unit07''s interrogative
    pronoun ("who") versus this unit''s interrogative adverb ("when," قطار کی حرکت می‌کند؟). Given its own part_of_speech
    ("adverb" vs. the existing "pronoun") and a content_key-scoped override in _classify(), mirroring the existing و/می‌شود
    homograph guards -- verified the two senses resolve to separate Lexeme rows via the dry run. Also fixed two missing glosses
    caught by the classifier''s own hard-fail (مسافر "traveler," فروشنده "seller," the dialogue''s two speakers) -- both real,
    newly-introduced nouns, not previously covered by any earlier unit.

    Three fill_in_blank templates (depart_noun, when_word, tomorrow_word), each verified via scripts/_fill_in_blank_ambiguity_check.py
    as a real single-project-wide-candidate group -- not just candidate-count sufficient but genuinely unambiguous: depart_noun
    and tomorrow_word are the only Lexeme with that exact tag anywhere in the course, and when_word''s tag is lesson_key-scoped
    to only this unit''s "when" sense of کی (the unit07 "who" sense never gets this tag). No listen_select/listen_type anywhere
    (en-prs has no TTS voices). No bare unquoted yes/no/true/false anywhere.

    Verified with scripts/_practice_slot_check.py (reusing backfill_lexemes_en_prs.py''s real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py practice-validate for the full en-prs pack -- 0 errors/0
    warnings. scripts/_fill_in_blank_ambiguity_check.py -- zero AMBIGUOUS flags. Needs the standard fresh-context review before
    import; no backfill_lexemes_en_prs.py run has happened against a real database yet in this pass.'
