schema_version: "1.0"
pack_key: practice.en-prs.a1.unit37
source_language: en
target_language: prs
unit_content_key: prs.a1.unit37.personality
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-11, same units 31-40 practice-pool depth-extension
    pass as this bundle's a1_unit31.yaml sibling (see that file's notes
    for the shared pass context). Realization and overlay are both
    status reviewed.

    One group: "personality_word" (مهربان/زحمتکش/باهوش/تنبل/شوخ/
    کم‌حرف/راستگو, 7 members, completes lesson01+lesson02). All seven
    are simple predicate adjectives that combine grammatically with the
    taught "او ... است" frame -- checked per candidate, not just the
    taught examples (all seven read naturally as "He/she is [trait].").

    Word_order template checked for grammaticality: "او {personality_word}
    است" (lesson01, matches the real taught "او مهربان است"-style
    predicate pattern used throughout the unit, e.g. "او باهوش است؟").

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    No bare unquoted yes/no/true/false anywhere. Verified with
    scripts/_practice_slot_check.py (0 problems) and
    scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context
    review before import.
tag_schema:
  part_of_speech: [adjective]
  agreement_tags:
    semantic: [personality_word]
slot_presets:
  personality_word: &personality_word {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: personality_word}}
templates:
  # Lesson 1: personality vocabulary.
  - content_key: practice.en-prs.prs.a1.unit37.lesson01.personality_gloss.001
    lesson_content_key: prs.a1.unit37.lesson01.personality_words
    type: multiple_choice
    frame: {text: "{personality_word}", language_code: prs, direction: rtl}
    slots: {personality_word: *personality_word}
    answer_derivation: {kind: slot_gloss, slot: personality_word}
    feedback_frame: {text: "{personality_word} describes a person's character.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit37.lesson02.personality_pair.002
    lesson_content_key: prs.a1.unit37.lesson02.more_traits
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six} — {word_seven}", language_code: prs, direction: rtl}
    slots: {word_one: *personality_word, word_two: *personality_word, word_three: *personality_word, word_four: *personality_word, word_five: *personality_word, word_six: *personality_word, word_seven: *personality_word}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six, word_seven]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six, word_seven]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 1: describing someone.
  - content_key: practice.en-prs.prs.a1.unit37.lesson01.personality_order.001
    lesson_content_key: prs.a1.unit37.lesson01.personality_words
    type: word_order
    frame: {text: "او {personality_word} است", language_code: prs, direction: rtl}
    slots: {personality_word: *personality_word}
    answer_derivation: {kind: render_frame, frame: {text: "او {personality_word} است", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: او [trait] است (He/she is [trait]).", language_code: en, direction: ltr}

  # Lesson 6: wrap-up.
  - content_key: practice.en-prs.prs.a1.unit37.lesson06.personality_translate.001
    lesson_content_key: prs.a1.unit37.lesson06.wrap_up
    type: translation
    frame: {text: "{personality_word}", language_code: en, direction: ltr, slot_rendering: {personality_word: english_gloss}}
    slots: {personality_word: *personality_word}
    answer_derivation: {kind: slot_text, slot: personality_word}
    feedback_frame: {text: "{personality_word} is the Dari word for this.", language_code: en, direction: ltr}
