schema_version: '1.0'
pack_key: practice.en-prs.a1.unit32
source_language: en
target_language: prs
unit_content_key: prs.a1.unit32.celebrations
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (en-fa/en-prs practice pass, fresh context; 2 fixes). (1)-(2) celebration_pair.002 and its volume_match.009 twin were 5-pair matching_pairs (below the 6-pair floor, AUTHORING_GUIDE 16): both now 6 pairs over the union of celebration_word and this unit''s own nouns/adjectives (adds تولدت, مبارک, ماه; 8 distinct glosses). The word_order frame {thing} را دوست دارم matches the unit''s own taught pattern (جشن را دوست دارم) and every pool member fits. No Arabic Yeh/Kaf. NATIVE FLAGS: none new.

    TIER-THINNESS POLISH 2026-07-24 (wave 2): recognition and production tiers each had only 1 live template. Added
    lesson01.celebration_liked_gloss.003 + lesson01.celebration_liked_translate.004 on the existing celebration_liked_word
    preset (4 distinct unit tokens/glosses birthday/party/cake/gift, over the MC floor, pool distinct from
    celebration_word by excluding تبریک) and lesson04.celebration_dialogue_gloss.001 +
    lesson04.celebration_dialogue_translate.002 on a new celebration_dialogue_word preset (union of the unit''s own
    celebration_word + come_verb_present tags, pos [noun, verb] -- come_verb_present reaches the unit''s own lesson04
    می‌آیی "you come", the invitation-dialogue verb -- 6 distinct unit tokens/glosses). come_verb_present and verb added
    to tag_schema. All corpus-standard bare-slot MC/translation shapes -- no new Dari strings, no literal-text frames.
    Tiers now 3/3/3 live. The two pre-existing 5-pair matching_pairs FLOOR flags are not in this dispatch and are left
    as-is (celebration_word genuinely has only 5 unit members; the fix would be the same union used here). Status flipped
    back to unreviewed pending fresh-context review of the additions.


    Authored 2026-07-11, same units 31-40 practice-pool depth-extension pass as this bundle''s a1_unit31.yaml sibling
    (see that file''s notes for the shared pass context). Realization and overlay are both status reviewed.

    Two groups: "celebration_word" (تولد/جشن/کیک/هدیه/تبریک, 5 members, completes lesson01) is the recognition pool. "celebration_liked_word"
    (تولد/جشن/کیک/هدیه, 4) deliberately excludes تبریک -- "I like congratulations" is not a sentence this unit teaches or
    a natural generalization of the taught "... را دوست دارم" wrap-up frame, same composition-trap discipline as unit24''s
    پیاده/با split.

    Word_order template checked for grammaticality: "{celebration_liked_word} را دوست دارم" (lesson06, matches the real taught
    "جشن را دوست دارم اما وقت ندارم." generalized to all four -- checked per candidate: "تولد را دوست دارم."/"کیک را دوست
    دارم."/"هدیه را دوست دارم." are all grammatical, natural sentences).

    No listen_select/listen_type anywhere (en-prs has no TTS voices). No bare unquoted yes/no/true/false anywhere. Verified
    with scripts/_practice_slot_check.py (0 problems) and scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context review before import.

    Fresh-context review 2026-07-11 (Opus, zero access to authoring reasoning; sibling prs-en/en-prs overlays not consulted):
    PASS, no defects, status flipped to reviewed. Verified every slot member is taught in this unit or earlier (realizations
    units <=40); Afghan Dari register throughout (مکتب/پوهنتون/سرک/دوکان/پولیس/امبولانس/ اطفائیه/موتر, no Iranian calques);
    ZWNJ correct in all می‌-forms and compounds; every word_order frame grammatical for EVERY candidate filling (composition-trap
    subsets -- sweep_clean/cook_object/ field/service/specific_season -- correctly exclude tokens that need a different light
    verb or read unnaturally); matching_pairs pulls distinct glosses covering every pair; no listen_select/listen_type (Dari
    has zero TTS); no bare YAML booleans; no snake_case jargon in learner-facing text. The three unit31/33 homograph splits
    (حقوق law vs salary, ظرف dishes vs within-period, می‌شویم wash vs become) are correctly scoped by content_key in _classify()
    and by lesson_key in prs_agreement_tags(), leaving each other sense untouched. practice-validate 0/0 and _practice_slot_check.py
    clean for the full en-prs set.'
tag_schema:
  part_of_speech:
  - noun
  - verb
  - adjective
  agreement_tags:
    semantic:
    - celebration_word
    - celebration_liked_word
    - come_verb_present
    - en_prs_a1_unit32_words
slot_presets:
  celebration_match_word: &celebration_match_word {language_code: prs, part_of_speech: [noun, adjective], agreement_tags: {semantic: [celebration_word, en_prs_a1_unit32_words]}}
  celebration_word: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: celebration_word
  celebration_liked_word: &id002
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: celebration_liked_word
  # Union of the unit's own tags: come_verb_present reaches the unit's own
  # lesson04 lexeme می‌آیی ("you come"), the invitation-dialogue verb,
  # giving 6 distinct unit-scoped tokens/glosses.
  celebration_dialogue_word: &celebration_dialogue_word
    language_code: prs
    part_of_speech:
    - noun
    - verb
    agreement_tags:
      semantic:
      - celebration_word
      - come_verb_present
templates:
- content_key: practice.en-prs.prs.a1.unit32.lesson01.celebration_gloss.001
  lesson_content_key: prs.a1.unit32.lesson01.celebration_vocabulary
  type: multiple_choice
  frame:
    text: '{celebration_word}'
    language_code: prs
    direction: rtl
  slots:
    celebration_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: celebration_word
  feedback_frame:
    text: '{celebration_word} belongs to this unit''s celebration vocabulary.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit32.lesson01.celebration_pair.002
  lesson_content_key: prs.a1.unit32.lesson01.celebration_vocabulary
  type: matching_pairs
  frame:
    text: '{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}'
    language_code: prs
    direction: rtl
  slots:
    word_one: *celebration_match_word
    word_two: *celebration_match_word
    word_three: *celebration_match_word
    word_four: *celebration_match_word
    word_five: *celebration_match_word
    word_six: *celebration_match_word
