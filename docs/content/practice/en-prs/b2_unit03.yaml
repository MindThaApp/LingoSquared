unit_content_key: prs.b2.unit03.nuance
review:
  status: unreviewed
  fresh_context: 'false'
  required_next_reviewer: native_speaker_review
  notes: 'Authored 2026-10-19 against docs/content/PRACTICE_PACK_RECIPE.md to close the en-prs B2 unit-checkpoint
    gap (lexemes from the B2 extension of scripts/backfill_lexemes_en_prs.py, same commit series). Grammar/discourse
    unit, so the section 8.1 pattern is used: broad slots pool the whole unit and are shaped by part_of_speech,
    every template''s lesson_content_key stays on one lesson. 15 templates over all 3 lessons: multiple_choice
    x3, matching_pairs x2, word_order x5, translation x5 (3 bare-word + 2 fixed-sentence). No listen_select
    (no Dari TTS) and no fill_in_blank (the runtime shows no English cue, so a blank in a unit sentence
    is guessable only by recall; every such sentence is a word_order with the slot gloss as hint). TAGS
    (PRS_B2_EXTRA_TAGS): b2u03_core is the curated content-word pool for every multiple_choice and matching
    slot (no function words, proper nouns, -ید formal 2pl forms or helper participles; one side of each
    near-synonym gloss pair held out); b2u03_vert is core minus tokens whose English gloss another common
    Dari word also answers, for bare-word translation; single-member anchors pin the word_order frames
    (اعتماد, تند, البته, تب, مبهم) and the fixed-sentence translations (تاکید, صبر) to exactly one token
    at course scope. Every frame is a sentence from this unit''s own realization with one token slotted;
    the fixed-sentence English prompts are the overlay''s example_gloss for that sentence. B2 sense overrides
    used: ناراحت upset, رسید arrived (was the noun ''receipt''), نه not (was ''nine''). مشوره narrowed
    to ''consultation'' so it does not paraphrase توصیه. Held out: the formal 2pl بدهید. Realization flag
    (not used here): lesson03 exercise 8 target ''دقیقا همین نکته باعث نگرانی داکتران شده هستند'' is ungrammatical
    (Iranian هستند after a 3sg subject). MEASURED (recipe section 9 step 4, filter .b2.unit03.): ALL 53/75
    (71%), recognition 53/75 (71%), structured 53/75 (71%), production 46/75 (61%); 3/3 lessons in every
    tier, no dead template, every MC slot >=3 distinct glosses, every matching pool >=6 tokens. Course
    scope: every word_order / fixed-sentence slot resolves to exactly 1 token, none is a literal word
    of its own frame. Offline port of generate_checkpoint() pass 1: 15/15 items on 5 seeds, all three
    tiers and all lessons represented. No gloss in any pool contains Dari script. Needs native-Dari review
    of the B2 glosses and a fresh-context review before import.'
