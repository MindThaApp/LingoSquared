schema_version: "1.0"
pack_key: practice.en-prs.a1.unit35
source_language: en
target_language: prs
unit_content_key: prs.a1.unit35.post
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-11, same units 31-40 practice-pool depth-extension
    pass as this bundle's a1_unit31.yaml sibling (see that file's notes
    for the shared pass context). Realization and overlay are both
    status reviewed.

    Two groups: "post_word" (پُسته/پُستی/نامه/پارسل, 4 members, lesson01
    -- "پُسته خانه" (post office) and "تکت پُستی" (stamp) are taught as
    vocabulary whose own introduced_tokens are two SEPARATE pieces
    (پُسته + the already-existing خانه; the already-existing تکت +
    پُستی), not a combined single lexeme, so پُسته/پُستی are drawn
    individually here, each with its own standalone gloss -- "post (as
    in پُسته خانه, post office)"/"postal (as in تکت پُستی, postage
    stamp)") is the recognition pool. "sendable_item_word" (نامه/پارسل,
    2) is the subset the taught "... روان می‌کنم" frame actually uses.

    Word_order template checked for grammaticality: "{sendable_item_word}
    روان می‌کنم" (lesson02, matches the real taught "نامه روان می‌کنم."/
    "پارسل روان می‌کنم." verbatim for both members).

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    No bare unquoted yes/no/true/false anywhere. Verified with
    scripts/_practice_slot_check.py (0 problems) and
    scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context
    review before import.
tag_schema:
  part_of_speech: [noun, adjective]
  agreement_tags:
    semantic: [post_word, sendable_item_word]
slot_presets:
  post_word: &post_word {language_code: prs, part_of_speech: [noun, adjective], agreement_tags: {semantic: post_word}}
  sendable_item_word: &sendable_item_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: sendable_item_word}}
templates:
  # Lesson 1: post office vocabulary.
  - content_key: practice.en-prs.prs.a1.unit35.lesson01.post_gloss.001
    lesson_content_key: prs.a1.unit35.lesson01.post_words
    type: multiple_choice
    frame: {text: "{post_word}", language_code: prs, direction: rtl}
    slots: {post_word: *post_word}
    answer_derivation: {kind: slot_gloss, slot: post_word}
    feedback_frame: {text: "{post_word} belongs to this unit's post office vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit35.lesson01.post_pair.002
    lesson_content_key: prs.a1.unit35.lesson01.post_words
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four}", language_code: prs, direction: rtl}
    slots: {word_one: *post_word, word_two: *post_word, word_three: *post_word, word_four: *post_word}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 2: sending letters and parcels.
  - content_key: practice.en-prs.prs.a1.unit35.lesson02.send_item_order.001
    lesson_content_key: prs.a1.unit35.lesson02.sending_mail
    type: word_order
    frame: {text: "{sendable_item_word} روان می‌کنم", language_code: prs, direction: rtl}
    slots: {sendable_item_word: *sendable_item_word}
    answer_derivation: {kind: render_frame, frame: {text: "{sendable_item_word} روان می‌کنم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: [item] روان می‌کنم (I send the [item]).", language_code: en, direction: ltr}

  # Lesson 1: wrap-up translation.
  - content_key: practice.en-prs.prs.a1.unit35.lesson01.post_translate.001
    lesson_content_key: prs.a1.unit35.lesson01.post_words
    type: translation
    frame: {text: "{post_word}", language_code: en, direction: ltr, slot_rendering: {post_word: english_gloss}}
    slots: {post_word: *post_word}
    answer_derivation: {kind: slot_text, slot: post_word}
    feedback_frame: {text: "{post_word} is the Dari word for this.", language_code: en, direction: ltr}
