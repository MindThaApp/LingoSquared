schema_version: '1.0'
pack_key: practice.en-prs.a1.unit35
source_language: en
target_language: prs
unit_content_key: prs.a1.unit35.post
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (en-fa/en-prs practice pass, fresh context; 7 fixes). The backfill glosses of پُسته (''post (as in پُسته خانه, post office)'') and پُستی (''postal (as in تکت پُستی, ...)'') print the Dari token inside the English gloss. (1)-(2) post_translate.001 and its volume_translate.006 twin showed that gloss as the translation prompt, i.e. the answer: both now use a clean pool (نامه, پارسل, می‌رسد). (3)-(4) post_gloss.001 / post_noun_gloss.001 offered that gloss as an MC option next to the same token: same clean pool. (5) post_where_gloss.001 rendered پُسته کجاست (''where is post?'') and its pool had only 2 nouns once cleaned: now bare-word over the clean pool, feedback reworded. (6) volume_fill.011 blanked ___ روان می‌کنم with only نامه accepted, though پارسل is equally correct (underdetermined): slot is now sendable_item_word with interchangeable: true. (7) its feedback was the bare Dari token: now an English explanation. LEFT: the two 4-pair matching_pairs (below the 6-pair floor) still show the leaky glosses; the unit has only 3 leak-free lexemes, so the real fix is the backfill gloss (write ''post'' / ''postal''). NATIVE FLAGS: send_item_translate ''I send a letter.'' accepts only نامه روان می‌کنم (not من نامه ... / یک نامه ...); backfill glosses of روان and روزه also embed Dari.

    TIER-DEPTH POLISH 2026-07-24 (wave-2 rubric): recognition tier was 1 live template and production tier 2. Added
    (1) lesson01.post_noun_gloss.001 (multiple_choice, post_word narrowed to part_of_speech noun -- نامه/پارسل/پُسته, 3
    distinct unit glosses at the floor; distinct POOL from post_gloss.001''s noun+adjective pool which also holds پُستی);
    (2) lesson04.post_where_gloss.001 (multiple_choice, frame "{post_word} کجاست" over the same noun pool -- کجاست is
    course-taught (بانک کجاست/بازار کجاست) and "نامه/پارسل/پُسته کجاست" all read naturally; course scope adds only b1''s
    duplicate نامه, same token); (3) lesson02.send_item_translate.001 (translation, slotted-English-frame + render_frame
    shape used across en-fa/nl-en: "I send a {sendable_item_word}." -> "{sendable_item_word} روان می‌کنم", the unit''s own
    taught sentences "نامه روان می‌کنم."/"پارسل روان می‌کنم." verbatim; prompt varies with the answer so the multi-member
    pool is determinate, and both glosses (letter/parcel) render cleanly in the English frame). Recognition now 3 live,
    production 3 live. No new self-reference (کجاست/روان/می‌کنم are not slot candidates). Verified: practice-validate 0
    errors; _practice_unit_scope_check.py 0 DEAD / tier-short lines gone for this file (the two pre-existing 4-pair
    matching FLOOR lines are out of this dispatch''s scope and untouched); _practice_self_reference_check.py 0 hits;
    check_dari_register.py 0 new findings. Prior history below.

    Authored 2026-07-11, same units 31-40 practice-pool depth-extension pass as this bundle''s a1_unit31.yaml sibling
    (see that file''s notes for the shared pass context). Realization and overlay are both status reviewed.

    Two groups: "post_word" (پُسته/پُستی/نامه/پارسل, 4 members, lesson01 -- "پُسته خانه" (post office) and "تکت پُستی" (stamp)
    are taught as vocabulary whose own introduced_tokens are two SEPARATE pieces (پُسته + the already-existing خانه; the already-existing
    تکت + پُستی), not a combined single lexeme, so پُسته/پُستی are drawn individually here, each with its own standalone gloss
    -- "post (as in پُسته خانه, post office)"/"postal (as in تکت پُستی, postage stamp)") is the recognition pool. "sendable_item_word"
    (نامه/پارسل, 2) is the subset the taught "... روان می‌کنم" frame actually uses.

    Word_order template checked for grammaticality: "{sendable_item_word} روان می‌کنم" (lesson02, matches the real taught
    "نامه روان می‌کنم."/ "پارسل روان می‌کنم." verbatim for both members).

    No listen_select/listen_type anywhere (en-prs has no TTS voices). No bare unquoted yes/no/true/false anywhere. Verified
    with scripts/_practice_slot_check.py (0 problems) and scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context review before import.

    Fresh-context review 2026-07-11 (Opus, zero access to authoring reasoning; sibling prs-en/en-prs overlays not consulted):
    PASS, no defects, status flipped to reviewed. Verified every slot member is taught in this unit or earlier (realizations
    units <=40); Afghan Dari register throughout (مکتب/پوهنتون/سرک/دوکان/پولیس/امبولانس/ اطفائیه/موتر, no Iranian calques);
    ZWNJ correct in all می‌-forms and compounds; every word_order frame grammatical for EVERY candidate filling (composition-trap
    subsets -- sweep_clean/cook_object/ field/service/specific_season -- correctly exclude tokens that need a different light
    verb or read unnaturally); matching_pairs pulls distinct glosses covering every pair; no listen_select/listen_type (Dari
    has zero TTS); no bare YAML booleans; no snake_case jargon in learner-facing text. The three unit31/33 homograph splits
    (حقوق law vs salary, ظرف dishes vs within-period, می‌شویم wash vs become) are correctly scoped by content_key in _classify()
    and by lesson_key in prs_agreement_tags(), leaving each other sense untouched. practice-validate 0/0 and _practice_slot_check.py
    clean for the full en-prs set.'
tag_schema:
  part_of_speech:
  - noun
  - adjective
  - verb
  agreement_tags:
    semantic:
    - post_word
    - sendable_item_word
    - en_prs_a1_unit35_lesson03_words
    - volume_en_prs_a1_unit35_sendable_item_word_11_single
slot_presets:
  clean_post_word: &clean_post_word {language_code: prs, part_of_speech: [noun, verb], agreement_tags: {semantic: [sendable_item_word, en_prs_a1_unit35_lesson03_words]}}
  post_noun_word: &post_noun
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: post_word
  post_word: &id001
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: post_word
  sendable_item_word: &id002
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: sendable_item_word
templates:
- content_key: practice.en-prs.prs.a1.unit35.lesson01.post_gloss.001
  lesson_content_key: prs.a1.unit35.lesson01.post_words
  type: multiple_choice
  frame:
    text: '{post_word}'
    language_code: prs
    direction: rtl
  slots:
    post_word: *clean_post_word
  answer_derivation:
    kind: slot_gloss
    slot: post_word
  feedback_frame:
    text: '{post_word} belongs to this unit''s post office vocabulary.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit35.lesson01.post_pair.002
  lesson_content_key: prs.a1.unit35.lesson01.post_words
  type: matching_pairs
  frame:
    text: '{word_one} — {word_two} — {word_three} — {word_four}'
    language_code: prs
    direction: rtl
  slots:
    word_one: *id001
    word_two: *id001
    word_three: *id001
    word_four: *id001
  slot_relations:
  - kind: distinct
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
  answer_derivation:
    kind: matching_pairs
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
  feedback_frame:
    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit35.lesson02.send_item_order.001
  lesson_content_key: prs.a1.unit35.lesson02.sending_mail
  type: word_order
  frame:
    text: '{sendable_item_word} روان می‌کنم'
    language_code: prs
    direction: rtl
  slots:
    sendable_item_word: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: '{sendable_item_word} روان می‌کنم'
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'Word order: [item] روان می‌کنم (I send the [item]).'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit35.lesson01.post_translate.001
  lesson_content_key: prs.a1.unit35.lesson01.post_words
  type: translation
  frame:
    text: '{post_word}'
    language_code: en
    direction: ltr
    slot_rendering:
      post_word: english_gloss
  slots:
    post_word: *clean_post_word
  answer_derivation:
    kind: slot_text
    slot: post_word
  feedback_frame:
    text: '{post_word} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit35.lesson01.post_noun_gloss.001
  lesson_content_key: prs.a1.unit35.lesson01.post_words
  type: multiple_choice
  frame:
    text: '{post_word}'
    language_code: prs
    direction: rtl
  slots:
    post_word: *clean_post_word
  answer_derivation:
    kind: slot_gloss
    slot: post_word
  feedback_frame:
    text: '{post_word} is one of this unit''s post-office nouns.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit35.lesson04.post_where_gloss.001
  lesson_content_key: prs.a1.unit35.lesson04.counter_dialogue
  type: multiple_choice
  frame:
    text: '{post_word}'
    language_code: prs
    direction: rtl
  slots:
    post_word: *clean_post_word
  answer_derivation:
    kind: slot_gloss
    slot: post_word
  feedback_frame:
    text: '{post_word} is one of this unit''s post-office words.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit35.lesson02.send_item_translate.001
  lesson_content_key: prs.a1.unit35.lesson02.sending_mail
  type: translation
  frame:
    text: I send a {sendable_item_word}.
    language_code: en
    direction: ltr
    slot_rendering:
      sendable_item_word: english_gloss
  slots:
    sendable_item_word: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: '{sendable_item_word} روان می‌کنم'
      language_code: prs
      direction: rtl
  feedback_frame:
    text: '[item] روان می‌کنم means "I send the [item]" — روان کردن is the taught verb for sending mail.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit35.lesson02.send_item_order.001.volume_fill.011
  lesson_content_key: prs.a1.unit35.lesson02.sending_mail
  type: fill_in_blank
  frame:
    text: '{sendable_item_word} روان می‌کنم'
    language_code: prs
    direction: rtl
  slots:
    sendable_item_word:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: sendable_item_word
  answer_derivation:
    kind: slot_text
    slot: sendable_item_word
    interchangeable: true
  feedback_frame:
    text: 'Name the thing you send, then روان می‌کنم: نامه روان می‌کنم (I send a letter), پارسل روان می‌کنم (I send a parcel).'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit35.lesson01.post_pair.002.volume_match.006
  lesson_content_key: prs.a1.unit35.lesson01.post_words
  type: matching_pairs
  frame:
    text: '{word_one} — {word_two} — {word_three} — {word_four}'
    language_code: prs
    direction: rtl
    text_blocks:
    - text: Second review matching set for this unit.
      language_code: en
      direction: ltr
  slots:
    word_one: &id003
      language_code: prs
      part_of_speech:
      - noun
      - adjective
      agreement_tags:
        semantic: post_word
    word_two: *id003
    word_three: *id003
    word_four: *id003
  slot_relations:
  - kind: distinct
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
  answer_derivation:
    kind: matching_pairs
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
  feedback_frame:
    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit35.lesson01.post_translate.001.volume_translate.006
  lesson_content_key: prs.a1.unit35.lesson01.post_words
  type: translation
  frame:
    text: '{post_word}'
    language_code: en
    direction: ltr
    slot_rendering:
      post_word: english_gloss
  slots:
    post_word: *clean_post_word
  answer_derivation:
    kind: slot_text
    slot: post_word
  feedback_frame:
    text: '{post_word} is the Dari word for this.'
    language_code: en
    direction: ltr
