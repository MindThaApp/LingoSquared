    direction: ltr
- content_key: practice.en-prs.prs.a1.unit13.lesson02.plan_verb_translate.002
  lesson_content_key: prs.a1.unit13.lesson02.proposing_a_plan
  type: translation
  frame:
    text: '{plan_verb}'
    language_code: en
    direction: ltr
    slot_rendering:
      plan_verb: english_gloss
  slots:
    plan_verb: *id002
  answer_derivation:
    kind: slot_text
    slot: plan_verb
  feedback_frame:
    text: '{plan_verb} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit13.lesson03.accept_decline_gloss.001
  lesson_content_key: prs.a1.unit13.lesson03.accepting_a_plan
  type: multiple_choice
  frame:
    text: '{accept_decline_word}'
    language_code: prs
    direction: rtl
  slots:
    accept_decline_word: *id004
  answer_derivation:
    kind: slot_gloss
    slot: accept_decline_word
  feedback_frame:
