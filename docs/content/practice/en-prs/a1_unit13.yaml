- content_key: practice.en-prs.prs.a1.unit13.lesson03.accept_decline_translate.002
  lesson_content_key: prs.a1.unit13.lesson03.accepting_a_plan
  type: translation
  frame:
    text: '{accept_decline_word}'
    language_code: en
    direction: ltr
    slot_rendering:
      accept_decline_word: english_gloss
  slots:
    accept_decline_word: *id004
  answer_derivation:
    kind: slot_text
    slot: accept_decline_word
  feedback_frame:
    text: '{accept_decline_word} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit13.lesson03.plan_pool_pair.003
  lesson_content_key: prs.a1.unit13.lesson03.accepting_a_plan
  type: matching_pairs
  frame:
    text: '{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six} — {word_seven} — {word_eight} —
      {word_nine} — {word_ten} — {word_eleven}'
    language_code: prs
    direction: rtl
  slots:
    word_one: *id005
    word_two: *id005
    word_three: *id005
    word_four: *id005
    word_five: *id005
    word_six: *id005
    word_seven: *id005
    word_eight: *id005
    word_nine: *id005
    word_ten: *id005
    word_eleven: *id005
  slot_relations:
  - kind: distinct
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
    - word_six
    - word_seven
    - word_eight
    - word_nine
    - word_ten
    - word_eleven
  answer_derivation:
    kind: matching_pairs
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
    - word_six
    - word_seven
    - word_eight
    - word_nine
    - word_ten
    - word_eleven
  feedback_frame:
    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit13.lesson05.waiting_word_translate.002
  lesson_content_key: prs.a1.unit13.lesson05.reading_an_invitation
  # UNIT-SCOPE REPAIR 2026-07-24: `waiting_word` (منتظر) has ZERO
  # unit13-scoped candidates -- it's registered to a1 unit11 (meeting_
  # time_dialogue), not this unit, despite this file's original notes
  # calling it "a private single-candidate tag layered on top of
  # accept_decline_word ... used only by this pack". Cannot fix pack-only
  # (would need a new backfill Lexeme row anchored to unit13) -- LOGGED
  # for the coordinator. The sibling fill_in_blank (waiting_word_fill.001)
  # and its word_order twin (.007) both required a genuinely
  # single-candidate slot and no other unit13 tag is single-candidate
  # course-wide, so both were DROPPED rather than mis-re-anchored; see
  # review notes. This translation (no candidate-count floor) is
  # re-anchored to plan_pool (11 distinct) instead.
  type: translation
  frame:
    text: '{waiting_word}'
    language_code: en
    direction: ltr
    slot_rendering:
      waiting_word: english_gloss
  slots:
    waiting_word: *id005
  answer_derivation:
    kind: slot_text
    slot: waiting_word
  feedback_frame:
    text: '{waiting_word} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit13.lesson05.weekday_gloss.003
  lesson_content_key: prs.a1.unit13.lesson05.reading_an_invitation
  # UNIT-SCOPE REPAIR 2026-07-24: `weekday_name` has ZERO unit13-scoped
  # candidates (it's introduced at a1 unit09, a2 unit09/unit12, b1 unit03
  # -- never unit13; the DROPPED sibling weekday_order.003 had the same
  # defect and could not be salvaged pack-only, see review notes). Slot
  # re-anchored to plan_verb (4 distinct: "let's go"/"do you want
  # (polite)"/"I can't"/"I'll see"), which this unit genuinely teaches.
  type: multiple_choice
  frame:
    text: '{weekday_name}'
    language_code: prs
    direction: rtl
  slots:
    weekday_name: *id002
  answer_derivation:
    kind: slot_gloss
    slot: weekday_name
  feedback_frame:
    text: '{weekday_name} is a verb used when making a plan.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit13.lesson06.person_name_gloss.001
  lesson_content_key: prs.a1.unit13.lesson06.making_a_plan_dialogue
  # UNIT-SCOPE REPAIR 2026-07-24: person_name alone is only 1 distinct
  # gloss at unit13 scope (نگار), below the 3-option floor. Widened to
  # plan_pool (now 11 distinct: پلان/پارک/برویم/می‌خواهین/عالی/قبول/متأسف/
  # نمی‌توانم/دعوت/می‌بینم/نگار), fitting for lesson06's whole-unit
  # dialogue review.
  type: multiple_choice
  frame:
    text: '{person_name}'
    language_code: prs
    direction: rtl
  slots:
    person_name: *id005
  answer_derivation:
    kind: slot_gloss
    slot: person_name
  feedback_frame:
    text: '{person_name} is a word from this unit''s plan-making vocabulary.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit13.lesson06.person_name_pair.002
  lesson_content_key: prs.a1.unit13.lesson06.making_a_plan_dialogue
  # UNIT-SCOPE REPAIR 2026-07-24: person_name alone is 1 distinct token,
  # needed 12 -> DEAD. Widened to plan_pool (11 distinct, same as
  # person_name_gloss.001 above), slots reduced 12->6.
  type: matching_pairs
  frame:
    text: '{person_name_one} — {person_name_two} — {person_name_three} — {person_name_four} — {person_name_five} — {person_name_six}'
    language_code: prs
    direction: rtl
  slots:
    person_name_one: *id005
    person_name_two: *id005
    person_name_three: *id005
    person_name_four: *id005
    person_name_five: *id005
    person_name_six: *id005
  slot_relations:
  - kind: distinct
    slots:
    - person_name_one
    - person_name_two
    - person_name_three
    - person_name_four
    - person_name_five
    - person_name_six
  answer_derivation:
    kind: matching_pairs
    slots:
    - person_name_one
    - person_name_two
    - person_name_three
    - person_name_four
    - person_name_five
    - person_name_six
  feedback_frame:
    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit13.lesson05.accept_decline_translate.010
  lesson_content_key: prs.a1.unit13.lesson05.reading_an_invitation
  # UNIT-SCOPE REPAIR 2026-07-24: REPLACES the DROPPED
  # waiting_word_fill.001.volume_order.007 (word_order twin of the
  # DROPPED waiting_word_fill.001 -- see waiting_word_translate.002's
  # note: `waiting_word`/منتظر is 0-candidate at unit13 scope, registered
  # to a1 unit11 instead, and no other unit13 tag is single-candidate
  # course-wide so fill_in_blank/word_order pack-only fixes weren't
  # available). Added as a bare-word translation over accept_decline_word
  # (3 distinct: عالی/قبول/متأسف) anchored to lesson05, to keep this
  # lesson represented and the pack's template count/tier balance intact.
  type: translation
  frame:
    text: '{accept_decline_word}'
    language_code: en
    direction: ltr
    slot_rendering:
      accept_decline_word: english_gloss
  slots:
    accept_decline_word: *id004
  answer_derivation:
    kind: slot_text
    slot: accept_decline_word
  feedback_frame:
    text: '{accept_decline_word} is the Dari word for this.'
    language_code: en
    direction: ltr
