schema_version: '1.0'
pack_key: practice.en-prs.a1.unit13
source_language: en
target_language: prs
unit_content_key: prs.a1.unit13.plans
review:
  status: unreviewed
  fresh_context: false
  notes: 'UNIT-SCOPE REPAIR 2026-07-24 (pack-only): _practice_unit_scope_check.py found
    7 DEAD templates + 1 below-floor, all from tags reused from EARLIER units (DO-NOT
    #2), despite this file''s original notes claiming they were unit13''s own. weekday_order.003
    (lesson02 word_order) and weekday_gloss.003 (lesson05 MC) relied on `weekday_name`
    -- 0 unit13-scoped candidates (introduced a1 unit09, a2 unit09/unit12, b1 unit03,
    never unit13). weekday_order.003 DROPPED (no in-unit day-word substitute and no
    frame using plan_verb''s 4 differing-person members could work); weekday_gloss.003
    re-anchored to plan_verb (4 distinct). waiting_word_fill.001 (fill_in_blank),
    waiting_word_translate.002, and their word_order twin (.007) relied on `waiting_word`
    (منتظر) -- 0 unit13-scoped candidates (registered to a1 unit11, not unit13). waiting_word_fill.001
    and its word_order twin DROPPED (no other unit13 tag is single-candidate course-wide,
    which fill_in_blank/its deterministic word_order twin require); REPLACED the word_order
    slot with a new lesson05 bare-word translation over accept_decline_word (accept_decline_translate.010)
    to keep template count/tier balance. waiting_word_translate.002 (no candidate-count
    floor) re-anchored to plan_pool instead. plan_pool_pair.003 (lesson03 matching_pairs,
    needed 11 distinct, had 10) and person_name_gloss.001/person_name_pair.002 (lesson06,
    person_name alone is only 1 distinct (نگار) -- below the MC floor, and far short
    of the pair''s declared 12) all fixed by widening `plan_pool` to also include person_name
    (+ proper_noun POS), reaching exactly 11 distinct (پلان/پارک/برویم/می‌خواهین/عالی/قبول/متأسف/نمی‌توانم/دعوت/می‌بینم/نگار);
    person_name_pair.002''s declared slots reduced 12->6. LOG FOR COORDINATOR: `waiting_word`
    (منتظر) and `weekday_name` both need a unit13-anchored backfill Lexeme (or their
    templates permanently rely on cross-unit reuse); a pack-only fix cannot add one.
    Post-fix: _practice_unit_scope_check.py reports 0 DEAD, 0 below-floor for this pack
    (13 templates, down from 15 -- 2 net drops, 1 replacement added); practice-validate
    0 errors (see coordinator report). Pre-existing authoring notes below, retained for
    provenance.

    Authored 2026-07-07 for the new A1 unit13 (making plans) realization, same pass as this bundle''s a1_unit12.yaml
    sibling (see that file''s notes for the full extension context: a parallel session authored units 09-11''s practice pool
    separately, this bundle only touches units 12-15).

    Four new groups plus reuse of the course-wide person_name and weekday_name pools: plan_noun (پلان/پارک/دعوت, 3 members),
    plan_verb (برویم/می‌خواهین/نمی‌توانم/می‌بینم, 4 members), accept_decline_word (منتظر/عالی/قبول/متأسف, 4 members -- pooled
    with plan_noun and plan_verb for one 11-pair matching_pairs template), and waiting_word (منتظر alone, a private single-candidate
    tag layered on top of accept_decline_word, used only by this pack''s own fill_in_blank template). جمعه/کدام/منتظر''s glosses/POS
    were already added by the parallel session''s units 09/11 work -- reused as-is, not re-added; only their semantic tags
    needed extending here (weekday_name for جمعه, person_name for نگار/کریم -- the latter two fixing a real pre-existing gap,
    since کریم was glossed in A2 unit09 but never tagged person_name until this unit''s own dialogue use).

    The one fill_in_blank template (waiting_word/منتظر) is a real single-project-wide-candidate group, verified via scripts/_fill_in_blank_ambiguity_check.py.
    No listen_select/ listen_type anywhere. No bare unquoted yes/no/true/false anywhere.

    Verified with scripts/_practice_slot_check.py (reusing backfill_lexemes_en_prs.py''s real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py practice-validate for the full en-prs pack -- 0 errors/0
    warnings. Needs the standard fresh-context review before import; no backfill_lexemes_en_prs.py run has happened against
    a real database yet in this pass.'
tag_schema:
  part_of_speech:
  - noun
  - verb
  - adjective
  - proper_noun
  agreement_tags:
    semantic:
    - plan_noun
    - plan_verb
    - accept_decline_word
    - waiting_word
    - weekday_name
    - person_name
slot_presets:
  plan_noun: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: plan_noun
  plan_verb: &id002
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: plan_verb
  accept_decline_word: &id004
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: accept_decline_word
  waiting_word: &id006
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: waiting_word
  weekday_name: &id003
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: weekday_name
  person_name: &id007
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  # UNIT-SCOPE REPAIR 2026-07-24: widened with `person_name` (+
  # `proper_noun` POS) so this preset reaches exactly the 11 distinct
  # tokens plan_pool_pair.003 already declared (پلان/پارک/برویم/می‌خواهین/
  # عالی/قبول/متأسف/نمی‌توانم/دعوت/می‌بینم = 10 without person_name, one
  # short of the declared 11 -- see plan_pool_pair.003). Also now used by
  # person_name_gloss.001 / person_name_pair.002 (both re-anchored off
  # the 0-candidate `person_name`-alone constraint).
  plan_pool: &id005
    language_code: prs
    part_of_speech:
    - noun
    - verb
    - adjective
    - proper_noun
    agreement_tags:
      semantic:
      - plan_noun
      - plan_verb
      - accept_decline_word
      - person_name
templates:
- content_key: practice.en-prs.prs.a1.unit13.lesson01.plan_noun_gloss.001
  lesson_content_key: prs.a1.unit13.lesson01.plan_vocabulary
  type: multiple_choice
  frame:
    text: '{plan_noun}'
    language_code: prs
    direction: rtl
  slots:
    plan_noun: *id001
  answer_derivation:
    kind: slot_gloss
    slot: plan_noun
  feedback_frame:
    text: '{plan_noun} is a noun used when making a plan.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit13.lesson01.plan_noun_translate.002
  lesson_content_key: prs.a1.unit13.lesson01.plan_vocabulary
  type: translation
  frame:
    text: '{plan_noun}'
    language_code: en
    direction: ltr
    slot_rendering:
      plan_noun: english_gloss
  slots:
    plan_noun: *id001
  answer_derivation:
    kind: slot_text
    slot: plan_noun
  feedback_frame:
    text: '{plan_noun} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit13.lesson01.plan_noun_order.003
  lesson_content_key: prs.a1.unit13.lesson01.plan_vocabulary
  type: word_order
  frame:
    text: '{plan_noun} خوب است'
    language_code: prs
    direction: rtl
  slots:
    plan_noun: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: '{plan_noun} خوب است'
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'Word order: [noun] خوب است (the [noun] is good).'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit13.lesson02.plan_verb_gloss.001
  lesson_content_key: prs.a1.unit13.lesson02.proposing_a_plan
  type: multiple_choice
  frame:
    text: '{plan_verb}'
    language_code: prs
    direction: rtl
  slots:
    plan_verb: *id002
  answer_derivation:
    kind: slot_gloss
