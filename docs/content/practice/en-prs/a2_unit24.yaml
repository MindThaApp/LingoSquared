schema_version: '1.0'
pack_key: practice.en-prs.a2.unit24
source_language: en
target_language: prs
unit_content_key: prs.a2.unit24.what_was_happening
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: 'Fresh-context review 2026-11-27 (en-prs A2 units 22-27 pass): 6 fixes - (1)-(6) the feedback of lesson02/04/06 choose.001 and translate.003 named one lesson while each slot pools lexemes from several lessons; now says this unit. Read every gloss of every slot pool at unit and course scope (حال correctly kept out), every fixed-sentence frame (single-member w_ anchors, deterministic), fill_in_blank hints and feedback. Capacity (unit scope, TTS off): 34 templates, 24 lexemes in 5 lessons (lesson 5 has none), ALL 71%, recognition 67%, structured 71%, production 67%, 5/5 lessons in every tier, no dead template. BACKFILL FLAG: حال carries state; case (as in nevertheless) while this unit uses it only in در حال (in the middle of). NATIVE FLAGS: every frame and the English feedback. Prior notes: Hand-authored from the unit''s realization and overlay and the en-prs backfill pool (tags en_prs_a2_unit24_* and w_<token>). 24 pool lexemes in 5 lessons (lesson 5 has none). Recognition, matching and bare-word production use single-word w_ tags only; the unit''s phrase lexemes are mostly paradigm rows (six-form lists) and are left out of every pool; the one good phrase همان وقت (''at that same moment'', lesson04 tag, single member) is hosted by a word_order and a fill_in_blank. زنگ زدن shares the lesson02 phrase tag with a paradigm row, so it cannot be pinned to a single-member slot and is not hosted. Kept OUT of every pool: حال (stored gloss ''state; case (as in nevertheless)'' is the concession-connector sense; the unit teaches در حال ''in the middle of''). Sentence frames are single-member w_ anchors on the unit''s own teaching lines; Afghan Dari forms. Needs native review of every frame and of the English feedback.'
