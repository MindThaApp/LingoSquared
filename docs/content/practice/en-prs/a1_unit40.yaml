    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit40.lesson01.emergency_service_order.001
  lesson_content_key: prs.a1.unit40.lesson01.emergency_types
  type: word_order
  frame:
    text: '{emergency_service_word} می‌خواهم'
    language_code: prs
    direction: rtl
  slots:
    emergency_service_word: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: '{emergency_service_word} می‌خواهم'
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'Word order: [service] می‌خواهم (I need the [service]).'
