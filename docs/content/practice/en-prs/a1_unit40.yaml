schema_version: '1.0'
pack_key: practice.en-prs.a1.unit40
source_language: en
target_language: prs
unit_content_key: prs.a1.unit40.emergencies
review:
  status: reviewed
  fresh_context: true
  notes: 'Authored 2026-07-11, same units 31-40 practice-pool depth-extension pass as this bundle''s a1_unit31.yaml sibling
    (see that file''s notes for the shared pass context) -- the last unit in this pass. Realization and overlay are both status
    reviewed.

    Two groups: "emergency_topic_word" (اضطراری/پولیس/امبولانس/آتش/ اطفائیه/زخمی/خون‌ریزی, 7 members, spans lesson01+lesson03)
    is the recognition pool. "emergency_service_word" (پولیس/امبولانس/ اطفائیه, 3) is the strict subset of callable services
    that combine with the taught "... می‌خواهم" (I need X) frame -- اضطراری describes the situation itself (not something
    you "need"), and زخمی/ خون‌ریزی describe a person''s condition rather than a service, so all three are excluded from this
    frame.

    Word_order template checked for grammaticality: "{emergency_service_word} می‌خواهم" (lesson01, matches the real taught
    "پولیس می‌خواهم!"/ "امبولانس می‌خواهم!" verbatim for those two members; "اطفائیه می‌خواهم!" is an equally natural generalization
    -- checked directly, even though the unit''s own taught text never uses that exact sentence for the fire brigade).

    No listen_select/listen_type anywhere (en-prs has no TTS voices). No bare unquoted yes/no/true/false anywhere. Verified
    with scripts/_practice_slot_check.py (0 problems) and scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context review before import; no backfill_lexemes_en_prs.py run
    has happened against a real database yet in this pass.

    Fresh-context review 2026-07-11 (Opus, zero access to authoring reasoning; sibling prs-en/en-prs overlays not consulted):
    PASS, no defects, status flipped to reviewed. Verified every slot member is taught in this unit or earlier (realizations
    units <=40); Afghan Dari register throughout (مکتب/پوهنتون/سرک/دوکان/پولیس/امبولانس/ اطفائیه/موتر, no Iranian calques);
    ZWNJ correct in all می‌-forms and compounds; every word_order frame grammatical for EVERY candidate filling (composition-trap
    subsets -- sweep_clean/cook_object/ field/service/specific_season -- correctly exclude tokens that need a different light
    verb or read unnaturally); matching_pairs pulls distinct glosses covering every pair; no listen_select/listen_type (Dari
    has zero TTS); no bare YAML booleans; no snake_case jargon in learner-facing text. The three unit31/33 homograph splits
    (حقوق law vs salary, ظرف dishes vs within-period, می‌شویم wash vs become) are correctly scoped by content_key in _classify()
    and by lesson_key in prs_agreement_tags(), leaving each other sense untouched. practice-validate 0/0 and _practice_slot_check.py
    clean for the full en-prs set.


    Polish wave 2 (2026-07-24): tier-thinness fix — added 2 recognition templates (bare MC over the 3-member emergency_service_word
    pool; sentence MC over the taught "…می‌خواهم" frame, grammatical for every course-scope member of the service pool) and 1
    production template (deterministic fixed-sentence translation "I need the police." over the single-member
    volume_…_emergency_service_word_01_single anchor). No existing template touched.'
tag_schema:
  part_of_speech:
  - noun
  - adjective
  agreement_tags:
    semantic:
    - emergency_topic_word
    - emergency_service_word
    - volume_en_prs_a1_unit40_emergency_service_word_01_single
slot_presets:
  emergency_topic_word: &id001
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: emergency_topic_word
  emergency_service_word: &id002
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: emergency_service_word
templates:
- content_key: practice.en-prs.prs.a1.unit40.lesson01.emergency_gloss.001
  lesson_content_key: prs.a1.unit40.lesson01.emergency_types
  type: multiple_choice
  frame:
    text: '{emergency_topic_word}'
    language_code: prs
    direction: rtl
  slots:
    emergency_topic_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: emergency_topic_word
  feedback_frame:
    text: '{emergency_topic_word} belongs to this unit''s emergency vocabulary.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit40.lesson03.emergency_pair.002
  lesson_content_key: prs.a1.unit40.lesson03.describing_the_emergency
  type: matching_pairs
