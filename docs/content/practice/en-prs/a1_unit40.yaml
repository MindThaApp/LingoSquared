    text: '{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six} — {word_seven}'
    language_code: prs
    direction: rtl
  slots:
    word_one: *id001
    word_two: *id001
    word_three: *id001
    word_four: *id001
    word_five: *id001
    word_six: *id001
    word_seven: *id001
