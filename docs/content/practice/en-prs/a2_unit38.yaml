source_language: en
target_language: prs
unit_content_key: prs.a2.unit38.asking_indirectly
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Authored by hand for the sparse grammar-led unit. Word pools use the single-member w_<token> tags only (plus lesson tags where a clean phrase pool exists); the unit-wide and lesson tags are not used for word pools because they also carry multi-form paradigm phrases (comma lists of six forms) whose glosses are lists. Names (proper nouns) carry no semantic tag and stay out of every pool. fa/prs have no TTS so no listen_select. Anchor frames reuse the unit''s own teaching lines (Kabul Dari, -ین 2pl). Lesson02 tag is added to the word pool only for its two clean phrases (باز می‌شود, حرکت می‌کند). Excluded: the six-form paradigm phrase in L1 (comma list), names ثمینه, سمیر. L3 has only two multi-sentence phrase lexemes (a question plus a whole follow-up, and a Yes/No pair), used as whole-sentence items; the Yes/No pair is long to type as a translation.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [en_prs_a2_unit38_lesson02_words, en_prs_a2_unit38_lesson03_words, en_prs_a2_unit38_lesson04_words, en_prs_a2_unit38_lesson05_words, w_بلیت, w_موزیم, w_می‌داند, w_می‌دانم, w_می‌دانند, w_می‌دانی, w_می‌دانیم, w_می‌دانین, w_نمی‌دانم, w_کجاست]
