  answer_derivation:
    kind: render_frame
    frame:
      text: '{cook_object_word} می‌خورم'
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'Word order: [food] می‌خورم (I eat [food]).'
    language_code: en
    direction: ltr
