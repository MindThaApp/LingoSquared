schema_version: "1.0"
pack_key: practice.en-prs.a1.unit36
source_language: en
target_language: prs
unit_content_key: prs.a1.unit36.cooking
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-11, same units 31-40 practice-pool depth-extension
    pass as this bundle's a1_unit31.yaml sibling (see that file's notes
    for the shared pass context). Realization and overlay are both
    status reviewed.

    Two groups: "cooking_word" (آشپزخانه/غذا/پیاز/گوشت/نمک/برنج, 6
    members, completes lesson01 -- آشپزخانه/غذا/گوشت are REUSED
    existing lexemes, additive tags) is the recognition pool.
    "cook_object_word" (غذا/گوشت/برنج, 3) is the strict subset that
    combines grammatically with the taught "... می‌پزم" (I cook X)
    frame -- پیاز pairs with خرد می‌کنم (chop) and نمک pairs with
    می‌اندازم (add) instead, so drawing either into a می‌پزم frame
    would be a composition trap, same class as unit24's پیاده/با split.

    Word_order template checked for grammaticality: "{cook_object_word}
    می‌پزم" (lesson02, matches the real taught "غذا می‌پزم."/"گوشت
    می‌پزم." verbatim; "برنج می‌پزم." is an equally natural
    generalization -- rice is genuinely something you cook -- checked
    directly, not just reasoned about).

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    No bare unquoted yes/no/true/false anywhere. Verified with
    scripts/_practice_slot_check.py (0 problems) and
    scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context
    review before import.
tag_schema:
  part_of_speech: [noun]
  agreement_tags:
    semantic: [cooking_word, cook_object_word]
slot_presets:
  cooking_word: &cooking_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: cooking_word}}
  cook_object_word: &cook_object_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: cook_object_word}}
templates:
  # Lesson 1: cooking vocabulary.
  - content_key: practice.en-prs.prs.a1.unit36.lesson01.cooking_gloss.001
    lesson_content_key: prs.a1.unit36.lesson01.cooking_words
    type: multiple_choice
    frame: {text: "{cooking_word}", language_code: prs, direction: rtl}
    slots: {cooking_word: *cooking_word}
    answer_derivation: {kind: slot_gloss, slot: cooking_word}
    feedback_frame: {text: "{cooking_word} belongs to this unit's cooking vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit36.lesson01.cooking_pair.002
    lesson_content_key: prs.a1.unit36.lesson01.cooking_words
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots: {word_one: *cooking_word, word_two: *cooking_word, word_three: *cooking_word, word_four: *cooking_word, word_five: *cooking_word, word_six: *cooking_word}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 2: cooking actions.
  - content_key: practice.en-prs.prs.a1.unit36.lesson02.cook_object_order.001
    lesson_content_key: prs.a1.unit36.lesson02.cooking_actions
    type: word_order
    frame: {text: "{cook_object_word} می‌پزم", language_code: prs, direction: rtl}
    slots: {cook_object_word: *cook_object_word}
    answer_derivation: {kind: render_frame, frame: {text: "{cook_object_word} می‌پزم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: [food] می‌پزم (I cook [food]).", language_code: en, direction: ltr}

  # Lesson 6: wrap-up.
  - content_key: practice.en-prs.prs.a1.unit36.lesson06.cooking_translate.001
    lesson_content_key: prs.a1.unit36.lesson06.wrap_up
    type: translation
    frame: {text: "{cooking_word}", language_code: en, direction: ltr, slot_rendering: {cooking_word: english_gloss}}
    slots: {cooking_word: *cooking_word}
    answer_derivation: {kind: slot_text, slot: cooking_word}
    feedback_frame: {text: "{cooking_word} is the Dari word for this.", language_code: en, direction: ltr}
