schema_version: "1.0"
pack_key: practice.en-prs.a1.unit04
source_language: en
target_language: prs
unit_content_key: prs.a1.unit04.numbers
review:
  status: reviewed
  fresh_context: false
  notes: >-
    Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-06,
    same pass as this bundle's a1_unit03.yaml sibling (see that file's
    notes for the full extension rationale and verification method).

    Four semantic groups: ones_number (یک..ده, 10 members),
    teens_number (یازده..نوزده, 9 members), tens_number (بیست..صد, 9
    members), phone_word (نمبر/تلفن/صفر, 3 members) -- all well above
    the >=3-distinct-candidate threshold for multiple_choice/
    matching_pairs. Deliberately left چند/سال (how many / year) and the
    استین/استی age-question copula pair untested by a template here --
    thin (1-2 members), and this pass prioritized the four richer,
    better-populated groups; still taught in the lesson itself.

    Every fill_in_blank frame embeds the number/phone-word slot in a
    real Dari sentence with visible surrounding context (guide §13),
    never a bare blanked digit alone. Every lesson_content_key anchor
    verified against the real realization file to introduce genuinely
    new vocabulary at that lesson. No listen_select/listen_type
    anywhere (Dari has zero TTS coverage project-wide). No bare
    unquoted yes/no/true/false anywhere.

    Verified with a standalone throwaway script reusing
    scripts/_practice_slot_check.py's lexeme_matches()/check_pack()
    against scripts/backfill_lexemes_en_prs.py's real iter_specs()
    output -- 0 problems. scripts/compile_content.py practice-validate
    for the full en-prs pack (units 01-10 together) -- 0 errors/0
    warnings. Needs the standard fresh-context review before import; no
    backfill_lexemes_en_prs.py run has actually happened against a real
    database yet in this pass.

    REAUTH PASS 2026-07-24 (unit-scope DEAD/FLOOR fix,
    scripts/_practice_unit_scope_check.py): "ones_number (یک..ده, 10
    members)" above measured the WHOLE-DIRECTION pool, not this unit's
    own. generate_checkpoint() only loads a unit's own lexemes, and 5 of
    those 10 digits (یک/دو/چهار/پنج/شش) were actually first introduced in
    unit03's family_size lesson (counting family members) -- this unit's
    OWN ones_number pool is only 5 (سه/هفت/هشت/نه/ده). That left
    ones_pair.004 DEAD (declared 10 slots, could never fill from unit04
    alone). Likewise phone_pair.004 pooled in unit07's phone_opening/
    message_word tokens to reach its declared 6 slots -- also DEAD at
    checkpoint scope, since those tokens aren't unit04 lexemes either.
    Fixed pack-only, no backfill/realization/overlay edits, no new
    vocabulary: (1) ones_pair.004 widened via a new ones_and_phone preset
    (ones_number UNION phone_word, both genuinely unit04-native) to 8
    distinct. (2) phone_pair.004 REMOVED -- with phone_word now used by
    ones_pair.004 and no other unit04-native tag left for it to pool with
    honestly, this unit cannot support a second 6-distinct phone-only
    matching_pairs template without either re-declaring an earlier-unit
    dependency or fully duplicating ones_pair.004's own pool; per the
    recipe's option 3 it was dropped (phone_gloss.001/phone_translate.003
    still cover phone_word, and its tokens remain hostable via the
    widened ones_pair.004). Structured tier for this pack is now 3 live
    matching_pairs templates (ones_pair, teens_pair, tens_pair), meeting
    the recipe's >=3-structured floor. Re-verified 0 DEAD / 0 below-floor
    via scripts/_practice_unit_scope_check.py and 0 errors via
    scripts/compile_content.py practice-validate (see coordinator report
    for the exact invocation/output).
tag_schema:
  part_of_speech: [noun, adjective, particle]
  agreement_tags:
    semantic: [ones_number, teens_number, tens_number, phone_word]
slot_presets:
  ones_number: &ones_number {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: ones_number}}
  teens_number: &teens_number {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: teens_number}}
  tens_number: &tens_number {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: tens_number}}
  phone_word: &phone_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: phone_word}}
  # REAUTH 2026-07-24 (unit-scope DEAD/FLOOR fix, see review.notes below):
  # ones_number's real unit-scoped pool is only 5 (سه/هفت/هشت/نه/ده -- یک/
  # دو/چهار/پنج/شش were already introduced in unit03's family_size lesson
  # and don't recount here). Widened with this unit's own phone_word (3:
  # نمبر/تلفن/تلفنم) to reach 8 -- "numbers and phone words" is a coherent
  # pairing for a numbers-then-phone-numbers unit, and it's real
  # unit04-native vocabulary only (no cross-unit borrow, unlike the old
  # phone_and_message preset this replaces -- see phone_pair.004's removal
  # note below).
  ones_and_phone: &ones_and_phone {language_code: prs, part_of_speech: [adjective, noun], agreement_tags: {semantic: [ones_number, phone_word]}}
templates:
  # Lesson 1: numbers one to ten.
  - content_key: practice.en-prs.prs.a1.unit04.lesson01.ones_gloss.001
    lesson_content_key: prs.a1.unit04.lesson01.numbers_one_to_ten
    type: multiple_choice
    frame: {text: "{ones_number}", language_code: prs, direction: rtl}
    slots: {ones_number: *ones_number}
    answer_derivation: {kind: slot_gloss, slot: ones_number}
    feedback_frame: {text: "{ones_number} is a number from one to ten.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit04.lesson01.ones_translate.003
    lesson_content_key: prs.a1.unit04.lesson01.numbers_one_to_ten
    type: translation
    frame: {text: "{ones_number}", language_code: en, direction: ltr, slot_rendering: {ones_number: english_gloss}}
    slots: {ones_number: *ones_number}
    answer_derivation: {kind: slot_text, slot: ones_number}
    feedback_frame: {text: "{ones_number} is the Dari word for this number.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit04.lesson01.ones_pair.004
    lesson_content_key: prs.a1.unit04.lesson01.numbers_one_to_ten
    type: matching_pairs
    # REAUTH 2026-07-24: was DEAD (declared 10 slots but this unit only
    # introduces 5 of the 10 ones-digits itself -- 1/2/4/5/6 were already
    # taught in unit03's family_size lesson and don't recount at
    # checkpoint scope). Widened via ones_and_phone (see preset above) to
    # 8 distinct: سه/هفت/هشت/نه/ده (this unit's own 5 digits) + نمبر/تلفن/
    # تلفنم (phone_word, this unit's own lesson05 vocabulary).
    frame: {text: "{item_one} — {item_two} — {item_three} — {item_four} — {item_five} — {item_six} — {item_seven} — {item_eight}", language_code: prs, direction: rtl}
    slots: {item_one: *ones_and_phone, item_two: *ones_and_phone, item_three: *ones_and_phone, item_four: *ones_and_phone, item_five: *ones_and_phone, item_six: *ones_and_phone, item_seven: *ones_and_phone, item_eight: *ones_and_phone}
    slot_relations: [{kind: distinct, slots: [item_one, item_two, item_three, item_four, item_five, item_six, item_seven, item_eight]}]
    answer_derivation: {kind: matching_pairs, slots: [item_one, item_two, item_three, item_four, item_five, item_six, item_seven, item_eight]}
    feedback_frame: {text: "Match each Dari number or phone word to its meaning.", language_code: en, direction: ltr}

  # Lesson 2: numbers eleven to twenty.
  - content_key: practice.en-prs.prs.a1.unit04.lesson02.teens_gloss.001
    lesson_content_key: prs.a1.unit04.lesson02.numbers_eleven_to_twenty
    type: multiple_choice
    frame: {text: "{teens_number}", language_code: prs, direction: rtl}
    slots: {teens_number: *teens_number}
    answer_derivation: {kind: slot_gloss, slot: teens_number}
    feedback_frame: {text: "{teens_number} is a number from eleven to nineteen.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit04.lesson02.teens_translate.003
    lesson_content_key: prs.a1.unit04.lesson02.numbers_eleven_to_twenty
    type: translation
    frame: {text: "{teens_number}", language_code: en, direction: ltr, slot_rendering: {teens_number: english_gloss}}
    slots: {teens_number: *teens_number}
    answer_derivation: {kind: slot_text, slot: teens_number}
    feedback_frame: {text: "{teens_number} is the Dari word for this number.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit04.lesson02.teens_pair.004
    lesson_content_key: prs.a1.unit04.lesson02.numbers_eleven_to_twenty
    type: matching_pairs
    # Expanded 2->9 pairs 2026-07-06 (AUTHORING_GUIDE.md #16 retrofit) --
    # verified via scripts/_practice_slot_check.py: exactly 9 teens_number
    # candidates (11-19), all taught, used fully.
    frame: {text: "{teens_number_one} — {teens_number_two} — {teens_number_three} — {teens_number_four} — {teens_number_five} — {teens_number_six} — {teens_number_seven} — {teens_number_eight} — {teens_number_nine}", language_code: prs, direction: rtl}
    slots: {teens_number_one: *teens_number, teens_number_two: *teens_number, teens_number_three: *teens_number, teens_number_four: *teens_number, teens_number_five: *teens_number, teens_number_six: *teens_number, teens_number_seven: *teens_number, teens_number_eight: *teens_number, teens_number_nine: *teens_number}
    slot_relations: [{kind: distinct, slots: [teens_number_one, teens_number_two, teens_number_three, teens_number_four, teens_number_five, teens_number_six, teens_number_seven, teens_number_eight, teens_number_nine]}]
    answer_derivation: {kind: matching_pairs, slots: [teens_number_one, teens_number_two, teens_number_three, teens_number_four, teens_number_five, teens_number_six, teens_number_seven, teens_number_eight, teens_number_nine]}
    feedback_frame: {text: "Match each Dari number word to its digit.", language_code: en, direction: ltr}

  # Lesson 3: tens up to a hundred.
  - content_key: practice.en-prs.prs.a1.unit04.lesson03.tens_gloss.001
    lesson_content_key: prs.a1.unit04.lesson03.tens
    type: multiple_choice
    frame: {text: "{tens_number}", language_code: prs, direction: rtl}
    slots: {tens_number: *tens_number}
    answer_derivation: {kind: slot_gloss, slot: tens_number}
    feedback_frame: {text: "{tens_number} is a tens number up to a hundred.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit04.lesson03.tens_translate.003
    lesson_content_key: prs.a1.unit04.lesson03.tens
    type: translation
    frame: {text: "{tens_number}", language_code: en, direction: ltr, slot_rendering: {tens_number: english_gloss}}
    slots: {tens_number: *tens_number}
    answer_derivation: {kind: slot_text, slot: tens_number}
    feedback_frame: {text: "{tens_number} is the Dari word for this number.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit04.lesson03.tens_pair.004
    lesson_content_key: prs.a1.unit04.lesson03.tens
    type: matching_pairs
    # Expanded 2->9 pairs 2026-07-06 (AUTHORING_GUIDE.md #16 retrofit) --
    # verified via scripts/_practice_slot_check.py: exactly 9 tens_number
    # candidates (20-100 by tens), all taught, used fully.
    frame: {text: "{tens_number_one} — {tens_number_two} — {tens_number_three} — {tens_number_four} — {tens_number_five} — {tens_number_six} — {tens_number_seven} — {tens_number_eight} — {tens_number_nine}", language_code: prs, direction: rtl}
    slots: {tens_number_one: *tens_number, tens_number_two: *tens_number, tens_number_three: *tens_number, tens_number_four: *tens_number, tens_number_five: *tens_number, tens_number_six: *tens_number, tens_number_seven: *tens_number, tens_number_eight: *tens_number, tens_number_nine: *tens_number}
    slot_relations: [{kind: distinct, slots: [tens_number_one, tens_number_two, tens_number_three, tens_number_four, tens_number_five, tens_number_six, tens_number_seven, tens_number_eight, tens_number_nine]}]
    answer_derivation: {kind: matching_pairs, slots: [tens_number_one, tens_number_two, tens_number_three, tens_number_four, tens_number_five, tens_number_six, tens_number_seven, tens_number_eight, tens_number_nine]}
    feedback_frame: {text: "Match each Dari number word to its digit.", language_code: en, direction: ltr}

  # Lesson 5: exchanging phone numbers.
  - content_key: practice.en-prs.prs.a1.unit04.lesson05.phone_gloss.001
    lesson_content_key: prs.a1.unit04.lesson05.phone_numbers
    type: multiple_choice
    frame: {text: "{phone_word}", language_code: prs, direction: rtl}
    slots: {phone_word: *phone_word}
    answer_derivation: {kind: slot_gloss, slot: phone_word}
    feedback_frame: {text: "{phone_word} is used when exchanging phone numbers.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit04.lesson05.phone_translate.003
    lesson_content_key: prs.a1.unit04.lesson05.phone_numbers
    type: translation
    frame: {text: "{phone_word}", language_code: en, direction: ltr, slot_rendering: {phone_word: english_gloss}}
    slots: {phone_word: *phone_word}
    answer_derivation: {kind: slot_text, slot: phone_word}
    feedback_frame: {text: "{phone_word} is the Dari word for this.", language_code: en, direction: ltr}
  # phone_pair.004 REMOVED 2026-07-24 (REAUTH pass, see review.notes below):
  # was DEAD (declared 6 slots pooling in unit07's phone_opening/
  # message_word tokens, which don't exist in unit04's own checkpoint-
  # scoped lexeme pool -- generate_checkpoint() only loads THIS unit's
  # lexemes). phone_word's real unit04-scoped pool is 3, and every other
  # unit04-native tag is already spoken for (ones_and_phone above already
  # claims phone_word itself); the unit genuinely can't reach 6 distinct
  # phone-specific pairs of its own, so per the recipe's option 3 this
  # template was dropped rather than re-anchored to borrowed vocabulary.
  # phone_gloss.001 and phone_translate.003 below still cover phone_word
  # (both floor-free / already at the 3-candidate floor), and phone_word's
  # tokens remain hostable via the widened ones_pair.004 matching_pairs
  # template above, so lesson05 stays represented in the checkpoint.
