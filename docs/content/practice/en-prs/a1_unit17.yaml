schema_version: "1.0"
pack_key: practice.en-prs.a1.unit17
source_language: en
target_language: prs
unit_content_key: prs.a1.unit17.health
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Authored 2026-07-07 for the new A1 unit17 (health) realization, same
    pass as this bundle's a1_unit16.yaml sibling (see that file's notes
    for the shared classifier-extension context).

    New groups, all real vocabulary from this unit's own realization:
    symptom_word (سردرد/تب/دل‌درد, 3 members), health_feeling_word
    (مریض/خوب/بد, 3 members -- adds this unit's own مریض to two
    already-existing adjectives from unit01's wellbeing_answer group,
    an additive tag layered alongside the existing one, not a
    replacement), seek_help_noun (داکتر/دوا, 2 members -- داکتر already
    glossed/tagged occupation from unit02, reused as-is), health_advice_word
    (استراحت/کنین/آب/زیاد/بنوشین, 5 members, mixed noun/verb/adjective --
    کنین/آب/زیاد already existed from units 07/08/05 respectively, reused
    as-is), and condition_word (حالم alone, a real single-candidate group
    used for fill_in_blank).

    Reused two course-wide groups as-is: greeting (سلام/علیکم/وعلیکم/خوش)
    and wellbeing_question (چطور/استین/استی). Fixed a real pre-existing
    gap while extending the classifier: بشیر (already glossed "Bashir
    (name)" from unit04) had never been given the person_name tag any
    earlier unit needed -- this unit's dialogue is the first
    practice-pool use of him as a named speaker, same class of gap
    already fixed for زرمینه/کریم in earlier units' passes. Also
    extended the existing title tag (previously جناب/خانم only) to
    include this unit's own صاحب, a genuine third member of the same
    "polite address title" set, not a new parallel tag.

    The one fill_in_blank template (condition_word/حالم) is a real
    single-project-wide-candidate group, verified via
    scripts/_fill_in_blank_ambiguity_check.py -- حالم is not reused
    anywhere else in the course. The final review matching_pairs pools
    symptom_word (3) + seek_help_noun (2) + health_advice_word (5) --
    10 distinct real tokens, the same plan_pool-style pooling pattern as
    a1_unit13.yaml. No listen_select/listen_type anywhere (en-prs has no
    TTS voices). No bare unquoted yes/no/true/false anywhere.

    Verified with scripts/_practice_slot_check.py (reusing
    backfill_lexemes_en_prs.py's real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py
    practice-validate for the full en-prs pack -- 0 errors/0 warnings.
    scripts/_fill_in_blank_ambiguity_check.py -- zero AMBIGUOUS flags.
    Needs the standard fresh-context review before import; no
    backfill_lexemes_en_prs.py run has happened against a real database
    yet in this pass.

    CORRECTION, 2026-07-11: the claim above that condition_word/حالم
    was a single-project-wide-candidate group stopped being true once
    b1_unit02_necessity.yaml (a later, separately-authored B1 unit)
    additively extended the SAME condition_word semantic tag with
    حالش ("his/her condition," backfill_lexemes_en_prs.py's iter_specs()
    comment at the حالش entry documents this explicitly). Since the
    compiler's fill_in_blank ambiguity check (AUTHORING_GUIDE.md #17)
    pools lexeme candidates by (source_language, target_language) only,
    not by course, this made the lesson02.condition_word_fill.002
    template's blanked-slot pool hit 2 distinct candidates
    (حالم vs حالش) with nothing else in the frame ("{condition_word}
    خوب نیست") able to disambiguate first-person "my condition" from
    third-person "his/her condition" -- a real cross-file hard error
    caught by `scripts/verify.sh --content-only`. NOT fixed with
    `interchangeable: true`: the two candidates are grammatically
    distinct persons, not synonyms, so accepting either would defeat
    the point of the drill. Fixed instead by converting this one
    template from fill_in_blank to word_order (content_key renamed
    condition_word_fill.002 -> condition_state_order.002,
    answer_derivation kind slot_text -> render_frame), the same
    "no minimum-candidate-floor exercise type" remedy AUTHORING_GUIDE.md
    #18 already prescribes for cross-course-boundary tag reuse --
    word_order's answer is the rendered frame for whichever candidate
    generation actually picked, so the learner arranges given tiles
    rather than having to guess among the pool, which sidesteps the
    ambiguity entirely while still testing "{condition_word} خوب نیست"
    exactly as before. Mirrors this same file's own sick_state_order.003
    sibling template. Re-verified: scripts/compile_content.py
    practice-validate for en-prs -- 0 errors/0 warnings (was 1 error);
    full scripts/verify.sh --content-only re-run confirms no new
    failures introduced elsewhere in the corpus.

    REAUTH 2026-07-24 (unit-scope DEAD-template repair, PACK-ONLY, per
    docs/content/PRACTICE_PACK_RECIPE.md): scripts/_practice_unit_scope_check.py
    found 5 DEAD templates + 2 below-floor in this pack. Root cause: the
    person_name/greeting/wellbeing_question slots (and the bare
    health_feeling_word/health_advice_word slots) were all built from
    tags whose real candidates were introduced in EARLIER units (بشیر
    unit04; سلام/علیکم/وعلیکم/خوش and چطور/استین/استی all pre-unit17).
    generate_checkpoint() scopes candidates to this unit's OWN lexemes
    only, so those slots had 0 (or below-floor) unit-scoped candidates
    and could never generate at checkpoint time, even though they work
    fine in Endless Practice (course scope). This unit is genuinely
    thin: only 9 distinct content tokens are natively introduced across
    the whole unit (سردرد/تب/دل‌درد/مریض/حالم/دوا/استراحت/بنوشین/صاحب),
    and lesson05 introduces zero new tokens of its own (its two
    teaching cards re-teach سلام and و, both already known). No
    backfill_lexemes_en_prs.py or realization change was made (PACK-ONLY
    lane) -- every fix below re-anchors a slot to a union of this unit's
    OWN tags (§3.1a) rather than adding vocabulary the unit doesn't
    teach:
    - health_feeling_gloss.001 (lesson02, was FLOOR: 1 candidate) ->
      feeling_review_pool (health_feeling_word+condition_word+
      symptom_word, 5 distinct).
    - health_advice_gloss.001 (lesson04, was FLOOR: 2 candidates) and
      health_advice_pair.003 (lesson04, was DEAD: needed 5 had 2) ->
      advice_review_pool (health_advice_word+seek_help_noun+
      symptom_word, 6 distinct; health_advice_pair.003's declared slot
      count dropped 5->6 to match).
    - greeting_gloss.001 (lesson05, was DEAD: 0 candidates) ->
      re-anchored straight to the existing symptom_word tag (3), the
      same pool lesson01's own symptom_word_gloss.001 uses (identical
      slot -- an honest consequence of lesson05's own thinness, not an
      oversight).
    - person_name_gloss.001 (lesson06, was DEAD: 0 candidates) ->
      doctor_visit_pool (health_advice_word+seek_help_noun+
      condition_word, 4 distinct), the vocabulary of the doctor's own
      dialogue lines.
    - wellbeing_question_translate.002 (lesson06, was DEAD: 0
      candidates) -> re-anchored to the (newly named) `title` tag
      (صاحب alone, 1 candidate), this lesson's own genuinely new token;
      translation (bare-word) has no candidate-count floor.
    - health_review_pair.003 (lesson06, was DEAD: needed 10 had 6) ->
      widened health_review_pool from a 3-tag union (6 distinct) to the
      full 6-tag union (9 distinct, adding condition_word+
      health_feeling_word+title); declared slot count dropped 10->9 to
      match this unit's true total native-token count.
    No new backfill tag, gloss, or lexeme was introduced; every pool
    used above already existed in backfill_lexemes_en_prs.py's
    classifier, just re-composed at the pack level. Removed the now-fully
    -unused person_name/greeting/wellbeing_question slot_presets and
    tag_schema entries (nothing in this pack references them anymore).
    Consequence of the genuine thinness: health_feeling_gloss.001,
    health_advice_gloss.001, person_name_gloss.001, and
    health_advice_pair.003/health_review_pair.003 draw from overlapping
    9-token-or-fewer pools -- flagged here rather than padded with
    untaught vocabulary, per the recipe's explicit instruction. Verified
    with scripts/_practice_unit_scope_check.py (0 DEAD, 0 below-floor
    for this file after the fix), scripts/compile_content.py
    practice-validate (0 errors), and scripts/check_dari_register.py
    (0 new findings) -- see the coordinator report for exact output.

    Review 2026-10-24 (en-prs practice native-quality pass): 3 fixes. health_review_pair.003 dealt the same 9 cards every time and included صاحب with a jargon gloss, now 6 slots over 8 words without صاحب; health_advice_pair.003 dealt the same 6 cards, widened to 8 (adds مریض and حالم, taught in lesson02); symptom_and_word_order.002 was the fragment [symptom] و [symptom], now the sentence from the message, [symptom] و [symptom] دارم. NATIVE FLAGS: wellbeing_question_translate.002 prompts the long gloss for صاحب; see Gloss lane. حالم خوب نیست and مریض استم are as taught.
tag_schema:
  part_of_speech: [noun, verb, adjective, adverb, particle, proper_noun]
  agreement_tags:
    semantic: [symptom_word, health_feeling_word, seek_help_noun, health_advice_word, condition_word, title]
slot_presets:
  symptom_word: &symptom_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: symptom_word}}
  health_feeling_word: &health_feeling_word {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: health_feeling_word}}
  seek_help_noun: &seek_help_noun {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: seek_help_noun}}
  health_advice_word: &health_advice_word {language_code: prs, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: health_advice_word}}
  condition_word: &condition_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: condition_word}}
  # صاحب only (this unit's own genuinely-introduced member of the
  # course-wide title group; جناب/خانم are reused from earlier units and
  # are NOT unit-scoped here).
  title: &title {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: title}}
  # REAUTH 2026-07-24 (unit-scope DEAD-template repair, PACK-ONLY):
  # `person_name`, `greeting`, `wellbeing_question` were all
  # course-wide tags reused from earlier units with ZERO unit17-scoped
  # candidates (بشیر/سلام-علیکم-وعلیکم-خوش/چطور-استین-استی are all
  # introduced by earlier units; unit17 only additively re-tags them).
  # generate_checkpoint() scopes lexeme candidates to THIS unit's own
  # lexemes only, so every slot built on those three tags was DEAD at
  # checkpoint scope (0 candidates). Removed the three dead presets and
  # replaced their four templates below (greeting_gloss.001,
  # person_name_gloss.001, wellbeing_question_translate.002, plus
  # widening health_feeling_gloss.001/health_advice_gloss.001/
  # health_advice_pair.003/health_review_pair.003) with unions of this
  # unit's own genuinely-introduced tags (§3.1a). This unit is real thin
  # (9 distinct native content tokens total, across only 5 of 6
  # lessons -- lesson05 introduces zero new tokens of its own), so
  # several of the new pools below unavoidably overlap; documented
  # per-template below and in review.notes.
  #
  # feeling_review_pool: health_feeling_word (1: مریض) + condition_word
  # (1: حالم) + symptom_word (3: سردرد/تب/دل‌درد) -- 5 distinct, all
  # "how the patient is/feels" vocabulary. Used by health_feeling_gloss.001.
  feeling_review_pool: &feeling_review_pool {language_code: prs, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [health_feeling_word, condition_word, symptom_word]}}
  # advice_review_pool: health_advice_word (2: استراحت/بنوشین) +
  # seek_help_noun (1: دوا) + symptom_word (3: سردرد/تب/دل‌درد) -- 6
  # distinct, exactly the matching_pairs floor. Used by
  # health_advice_gloss.001 and health_advice_pair.003.
  advice_review_pool: &advice_review_pool {language_code: prs, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [health_advice_word, seek_help_noun, symptom_word]}}
  # doctor_visit_pool: health_advice_word (2) + seek_help_noun (1) +
  # condition_word (1) -- 4 distinct, the vocabulary of the doctor's own
  # dialogue lines. Used by person_name_gloss.001 (re-anchored away from
  # the dead person_name tag).
  doctor_visit_pool: &doctor_visit_pool {language_code: prs, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [health_advice_word, seek_help_noun, condition_word]}}
  # Pools symptom_word (3) + seek_help_noun (1) + health_advice_word (2)
  # + condition_word (1) + health_feeling_word (1) + title (1) -- 9
  # distinct real unit-scoped tokens (widened from the original 3-tag,
  # 6-distinct union, which was 4 short of the 10 pairs this template
  # declared -- see the matching_pairs slot count below, now 9).
  health_review_pool: &health_review_pool {language_code: prs, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [symptom_word, seek_help_noun, health_advice_word, condition_word, health_feeling_word]}}
  # REVIEW 2026-10-24: pool for health_advice_pair.003 (lesson04): adds مریض/حالم (lesson02) so it is not the same 6 cards every time.
  advice_pair_pool: &advice_pair_pool {language_code: prs, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [health_advice_word, seek_help_noun, symptom_word, health_feeling_word, condition_word]}}
templates:
  # Lesson 1: symptom vocabulary.
  - content_key: practice.en-prs.prs.a1.unit17.lesson01.symptom_word_gloss.001
    lesson_content_key: prs.a1.unit17.lesson01.symptom_words
    type: multiple_choice
    frame: {text: "{symptom_word}", language_code: prs, direction: rtl}
    slots: {symptom_word: *symptom_word}
    answer_derivation: {kind: slot_gloss, slot: symptom_word}
    feedback_frame: {text: "{symptom_word} names a symptom.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit17.lesson01.symptom_word_translate.002
    lesson_content_key: prs.a1.unit17.lesson01.symptom_words
    type: translation
    frame: {text: "{symptom_word}", language_code: en, direction: ltr, slot_rendering: {symptom_word: english_gloss}}
    slots: {symptom_word: *symptom_word}
    answer_derivation: {kind: slot_text, slot: symptom_word}
    feedback_frame: {text: "{symptom_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit17.lesson01.symptom_have_order.003
    lesson_content_key: prs.a1.unit17.lesson01.symptom_words
    type: word_order
    frame: {text: "{symptom_word} دارم", language_code: prs, direction: rtl}
    slots: {symptom_word: *symptom_word}
    answer_derivation: {kind: render_frame, frame: {text: "{symptom_word} دارم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: [symptom] دارم (I have a [symptom]).", language_code: en, direction: ltr}

  # Lesson 2: saying you feel unwell.
  - content_key: practice.en-prs.prs.a1.unit17.lesson02.health_feeling_gloss.001
    lesson_content_key: prs.a1.unit17.lesson02.feeling_unwell
    type: multiple_choice
    # Widened from the bare health_feeling_word tag (1 unit-scoped
    # candidate, مریض alone -- below the 3-option MC floor) to
    # feeling_review_pool (5): health_feeling_word + condition_word +
    # symptom_word.
    frame: {text: "{unit_word}", language_code: prs, direction: rtl}
    slots: {unit_word: *feeling_review_pool}
    answer_derivation: {kind: slot_gloss, slot: unit_word}
    feedback_frame: {text: "{unit_word} is one of this unit's health words.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit17.lesson02.condition_state_order.002
    lesson_content_key: prs.a1.unit17.lesson02.feeling_unwell
    type: word_order
    frame: {text: "{condition_word} خوب نیست", language_code: prs, direction: rtl}
    slots: {condition_word: *condition_word}
    answer_derivation: {kind: render_frame, frame: {text: "{condition_word} خوب نیست", language_code: prs, direction: rtl}}
    feedback_frame: {text: "حالم خوب نیست means I don't feel well.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit17.lesson02.sick_state_order.003
    lesson_content_key: prs.a1.unit17.lesson02.feeling_unwell
    type: word_order
    frame: {text: "{health_feeling_word} استم", language_code: prs, direction: rtl}
    slots: {health_feeling_word: *health_feeling_word}
    answer_derivation: {kind: render_frame, frame: {text: "{health_feeling_word} استم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: [feeling] استم (I am [feeling]).", language_code: en, direction: ltr}

  # Lesson 3: asking for a doctor or medicine.
  - content_key: practice.en-prs.prs.a1.unit17.lesson03.seek_help_translate.001
    lesson_content_key: prs.a1.unit17.lesson03.asking_for_help
    type: translation
    frame: {text: "{seek_help_noun}", language_code: en, direction: ltr, slot_rendering: {seek_help_noun: english_gloss}}
    slots: {seek_help_noun: *seek_help_noun}
    answer_derivation: {kind: slot_text, slot: seek_help_noun}
    feedback_frame: {text: "{seek_help_noun} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit17.lesson03.seek_help_request_order.002
    lesson_content_key: prs.a1.unit17.lesson03.asking_for_help
    type: word_order
    frame: {text: "{seek_help_noun} می‌خواهم", language_code: prs, direction: rtl}
    slots: {seek_help_noun: *seek_help_noun}
    answer_derivation: {kind: render_frame, frame: {text: "{seek_help_noun} می‌خواهم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: [noun] می‌خواهم (I want [noun]).", language_code: en, direction: ltr}

  # Lesson 4: reading a health-instruction note.
  - content_key: practice.en-prs.prs.a1.unit17.lesson04.health_advice_gloss.001
    lesson_content_key: prs.a1.unit17.lesson04.reading_health_advice
    type: multiple_choice
    # Widened from the bare health_advice_word tag (2 unit-scoped
    # candidates -- below the 3-option MC floor) to advice_review_pool
    # (6): health_advice_word + seek_help_noun + symptom_word.
    frame: {text: "{unit_word}", language_code: prs, direction: rtl}
    slots: {unit_word: *advice_review_pool}
    answer_derivation: {kind: slot_gloss, slot: unit_word}
    feedback_frame: {text: "{unit_word} is one of this unit's health words.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit17.lesson04.health_advice_translate.002
    lesson_content_key: prs.a1.unit17.lesson04.reading_health_advice
    type: translation
    frame: {text: "{health_advice_word}", language_code: en, direction: ltr, slot_rendering: {health_advice_word: english_gloss}}
    slots: {health_advice_word: *health_advice_word}
    answer_derivation: {kind: slot_text, slot: health_advice_word}
    feedback_frame: {text: "{health_advice_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit17.lesson04.health_advice_pair.003
    lesson_content_key: prs.a1.unit17.lesson04.reading_health_advice
    type: matching_pairs
    # Widened from the bare health_advice_word tag (2 unit-scoped
    # candidates -- needed 5, had 2, never generated) to
    # advice_review_pool (6): health_advice_word + seek_help_noun +
    # symptom_word -- exactly the 6-pair floor. Declared slot count
    # dropped 5 -> 6 to match the real pool size.
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots: {word_one: *advice_pair_pool, word_two: *advice_pair_pool, word_three: *advice_pair_pool, word_four: *advice_pair_pool, word_five: *advice_pair_pool, word_six: *advice_pair_pool}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 5: reading a health message.
  - content_key: practice.en-prs.prs.a1.unit17.lesson05.greeting_gloss.001
    lesson_content_key: prs.a1.unit17.lesson05.reading_a_health_message
    type: multiple_choice
    # Re-anchored from the course-wide `greeting` tag (0 unit-scoped
    # candidates -- سلام/علیکم/وعلیکم/خوش are all reused from earlier
    # units; this unit's own lesson05 introduces zero new tokens of its
    # own) to symptom_word (3), which is exactly the vocabulary the
    # lesson05 reading passage itself tests (سردرد و تب). Identical
    # slot/pool to lesson01.symptom_word_gloss.001 -- an honest
    # consequence of this lesson's genuine thinness (see review.notes).
    frame: {text: "{symptom_word}", language_code: prs, direction: rtl}
    slots: {symptom_word: *symptom_word}
    answer_derivation: {kind: slot_gloss, slot: symptom_word}
    feedback_frame: {text: "{symptom_word} names a symptom.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit17.lesson05.symptom_and_word_order.002
    lesson_content_key: prs.a1.unit17.lesson05.reading_a_health_message
    type: word_order
    # REVIEW 2026-10-24: was the bare fragment '{a} و {b}'; now the full sentence
    # from the lesson05 message (سردرد و تب دارم).
    frame: {text: "{symptom_word_one} و {symptom_word_two} دارم", language_code: prs, direction: rtl}
    slots: {symptom_word_one: *symptom_word, symptom_word_two: *symptom_word}
    slot_relations: [{kind: distinct, slots: [symptom_word_one, symptom_word_two]}]
    answer_derivation: {kind: render_frame, frame: {text: "{symptom_word_one} و {symptom_word_two} دارم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: [symptom] و [symptom] دارم (I have a [symptom] and a [symptom]).", language_code: en, direction: ltr}

  # Lesson 6: a dialogue with the doctor.
  - content_key: practice.en-prs.prs.a1.unit17.lesson06.person_name_gloss.001
    lesson_content_key: prs.a1.unit17.lesson06.doctor_dialogue
    type: multiple_choice
    # Re-anchored from the course-wide `person_name` tag (0 unit-scoped
    # candidates -- بشیر was already introduced in unit04; this unit
    # only additively extends his existing tag set, it introduces no
    # new name) to doctor_visit_pool (4): health_advice_word +
    # seek_help_noun + condition_word -- the vocabulary the doctor's
    # own dialogue lines actually use.
    frame: {text: "{unit_word}", language_code: prs, direction: rtl}
    slots: {unit_word: *doctor_visit_pool}
    answer_derivation: {kind: slot_gloss, slot: unit_word}
