schema_version: '1.0'
pack_key: practice.en-prs.c1.unit01
source_language: en
target_language: prs
unit_content_key: prs.c1.unit01.sakhtar_goftar
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: "Fresh-context review 2026-11-27 (en-prs C1 units 01-08 pass): 3 fixes - (1) feedback frames said '{item} ... from the lesson on <label>' but every pool is unit-wide (and several named a different lesson than the anchor), so they now say '{item} is one of this unit's words.', and the word_order feedback no longer calls its sentence the model of the anchor lesson; (2) the unit-wide union pool gained حاشیه‌روی, کنترول‌شده, نتیجه‌گیری, راه‌حل, نکته‌ها (all content words with distinct glosses; coverage 51% -> 60%); (3) backfill C1 gloss fixes for this unit's lexemes: دیگر 'more; another' -> 'other; another' (it is in the pool; از سوی دیگر), می‌دهد 'he/she gives (as in teaches)' -> 'he/she/it gives' (not pooled). Read every gloss in the 55-lexeme unit dump and the 33-lexeme pool: no same-gloss or interchangeable-gloss members; verbs and function words stay out of the pool. Bare-word frames only, apart from the single-anchor word_order (w_آغاز, 1 course-scope candidate, not a literal word of its frame). Capacity (level+unit filter, TTS off): 16 live templates, recognition 5 / structured 6 / production 5, each hosting 33/55 lexemes (60%) and 5/5 lessons with lexemes; MC pools 33 distinct glosses, matching pools 33 >= 6 slots; no dead template, so a checkpoint can be drawn (33 distinct recognition and production prompts each). NATIVE FLAGS: none beyond the unit's realization flags. Earlier note: Derived by scripts/derive_target.py packs from the unit's realization/overlay and the en-prs backfill lexemes (tags prs_c1_u1 / w_<token>). 28 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit's own teaching lines. Needs native review of frames and feedback."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_آغاز, w_آغازین, w_ارائه, w_ارتباط, w_اشاره, w_بازگشت, w_بعدی, w_بیان, w_تصمیم, w_توضیح, w_دفتر, w_دیگر, w_سوی, w_طرح, w_عملی, w_مثال, w_مرتبط, w_مشکل, w_معرفی, w_موضوع, w_پیشنهاد, w_پیشنهادی, w_پیشین, w_کامل, w_کوتاه, w_گزارش, w_گفتار, w_یکپارچه, w_حاشیه‌روی, w_کنترول‌شده, w_نتیجه‌گیری, w_راه‌حل, w_نکته‌ها]
