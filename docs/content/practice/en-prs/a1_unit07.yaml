schema_version: "1.0"
pack_key: practice.en-prs.a1.unit07
source_language: en
target_language: prs
unit_content_key: prs.a1.unit07.communication
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: |-
    Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-06, same pass as this bundle's a1_unit03.yaml sibling (see that file's notes for the full extension rationale and verification method).
    REAUTH 2026-07-24 (unit-scope DEAD-template repair, docs/content/PRACTICE_PACK_RECIPE.md §1.1/§3.1/§8.1): the original phone_and_message preset pooled this unit's phone_opening/ message_word with unit04's phone_word -- exactly recipe DO-NOT #2 (a slot constrained to vocabulary introduced in an EARLIER unit). generate_checkpoint() scopes candidates to unit07's own lexemes only, so phone_word contributed 0 there and the pool sat at 3, not the 6 the templates declared -- phone_open_pair.003, message_pair.003 DEAD. Likewise name_pair.004 declared 10 slots against the course-wide person_name population (10 names across the whole direction) while unit07 itself introduces only 2 (فرید, لیمه) -- also DEAD; name_gloss.001 (MC over the same 2) sat below the 3-option floor.
    FIX: re-anchored all four to the unit's own already-tagged `dialogue_word` vocabulary (an established corpus-wide tag; see a1_unit45's pilot pack), unioned with this unit's own phone_opening/message_word (§3.1a). unit07 carries 10 distinct unit-scoped tokens under {phone_opening, message_word, dialogue_word}: الو, پیام, کوتاه, می‌کند, لطفاً, کنین, می‌خواهم, فردا, ساعت, برای -- 10 distinct glosses, no collisions. Verified via the iter_specs filter in REAUTH_TASK.md. phone_open_pair.003 (6 slots, lesson01), message_pair.003 (6 slots, lesson04) and name_pair.004 (reduced from 10 to the standard 6 slots, lesson06) now draw from this pool; name_gloss.001 (MC, lesson06) does too -- 7 -> 10 distinct answer values, clears the 3-option floor. person_name (فرید/لیمه) stays real, single-purpose vocabulary in name_translate.003 (bare-word translation has no candidate floor) -- unaffected, still hosts both names. phone_opening/message_word keep their own narrow translation templates unchanged. dropped the stale unit04 phone_word cross-reference entirely (PACK-ONLY: no other unit's tag is referenced here anymore).
    This unit's own vocabulary is mostly full phrases (کی صحبت می‌کند؟, لطفاً آهسته صحبت کنین, etc.) rather than atomic nouns, so well- populated single-token semantic groups are thinner here than in other units. Deliberately skipped the many multi-word phrase tokens (بلی بفرمایین, کی صحبت می‌کند, لطفاً آهسته صحبت کنین, etc.) as slot fillers -- this project's backfill scripts only build single-token lexemes, so phrase-level vocabulary stays taught in the lesson itself rather than forced into an ungrammatical partial slot, matching this bundle's standing precedent.
    Every fill_in_blank frame embeds the slot in a real Dari sentence with visible surrounding context (guide §13). Every lesson_content_key anchor verified against the real realization file to introduce genuinely new vocabulary. No listen_select/ listen_type anywhere. No bare unquoted yes/no/true/false anywhere.
    Verified with a standalone throwaway script reusing scripts/_practice_slot_check.py's lexeme_matches()/check_pack() against scripts/backfill_lexemes_en_prs.py's real iter_specs() output -- 0 problems. scripts/compile_content.py practice-validate for the full en-prs pack (units 01-10 together) -- 0 errors/0 warnings. Needs the standard fresh-context review before import; no backfill_lexemes_en_prs.py run has actually happened against a real database yet in this pass.

    Review 2026-10-24 (en-prs practice native-quality pass): 4 fixes. unit_vocab (phone_open_pair, message_pair, name_gloss, name_pair) now uses the unit07 words instead of the level-wide dialogue_word tag (189 words); phone_verb_gloss uses the 8 unit07 verbs with accurate feedback; message_time and name_translate feedback no longer make false unit/speaker claims. NATIVE FLAGS: الو as phone greeting; بگذارم / می‌رسانم glosses are phrase-fragments ('let me leave / put', 'I'll pass it along / deliver') and may need a native check; Homayoun is a speaker but not in the unit-scoped name pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic: [person_name, phone_opening, message_word, dialogue_word, tomorrow_word, appointment_word, time_unit, want_verb, phone_action_verb, work_verb_form, en_prs_a1_unit07_words]
slot_presets:
  person_name: &person_name {language_code: prs, part_of_speech: proper_noun, agreement_tags: {semantic: person_name}}
  phone_opening: &phone_opening {language_code: prs, part_of_speech: [noun, particle], agreement_tags: {semantic: phone_opening}}
  message_word: &message_word {language_code: prs, part_of_speech: [noun, adjective], agreement_tags: {semantic: message_word}}
  # REAUTH 2026-07-24: replaces the old phone_and_message preset, which
  # pooled in unit04's phone_word (an EARLIER unit -- 0 unit-scoped
  # candidates at checkpoint time, recipe DO-NOT #2). This unions only
  # unit07's OWN tags: phone_opening (1) + message_word (2) +
  # dialogue_word (7, this unit's own already-tagged dialogue vocabulary
  # spanning lessons 02-06) = 10 distinct unit-scoped tokens, comfortably
  # over the 6-pair matching_pairs floor and the 3-option MC floor.
  unit_vocab: &unit_vocab {language_code: prs, part_of_speech: [noun, verb, adjective, adverb, particle], agreement_tags: {semantic: [phone_opening, en_prs_a1_unit07_words]}}
  # POLISH 2026-07-24 (tier-thinness, recipe SS8): the recognition tier had
  # only 1 live template (name_gloss.001). Two narrower unions of this
  # unit's OWN tags (SS3.1a) feed the two added multiple_choice templates
  # below -- both pools differ from unit_vocab and from each other.
  # message_time: پیام/کوتاه (message_word) + فردا (tomorrow_word) +
  # جلسه (appointment_word) + ساعت (time_unit) = 5 distinct unit-scoped
  # tokens / 5 distinct glosses.
  message_time: &message_time {language_code: prs, part_of_speech: [noun, adjective, adverb], agreement_tags: {semantic: [message_word, tomorrow_word, appointment_word, time_unit]}}
  # phone_verbs: می‌خواهم (want_verb) + می‌زنم (phone_action_verb) +
  # می‌کند (work_verb_form) = 3 distinct unit-scoped tokens / 3 distinct
  # glosses -- exactly clears the 3-option MC floor. کنین deliberately
  # left out (its "do (polite imperative)" gloss is confusable with
  # می‌کند's "does / is doing" as an option pair).
  phone_verbs: &phone_verbs {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: en_prs_a1_unit07_words}}
templates:
  # Lesson 1: answering the phone.
  - content_key: practice.en-prs.prs.a1.unit07.lesson01.phone_open_translate.002
    lesson_content_key: prs.a1.unit07.lesson01.answering_the_phone
    type: translation
    frame: {text: "{phone_opening}", language_code: en, direction: ltr, slot_rendering: {phone_opening: english_gloss}}
    slots: {phone_opening: *phone_opening}
    answer_derivation: {kind: slot_text, slot: phone_opening}
    feedback_frame: {text: "{phone_opening} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit07.lesson01.phone_open_pair.003
    lesson_content_key: prs.a1.unit07.lesson01.answering_the_phone
    type: matching_pairs
    # REAUTH 2026-07-24: re-anchored to unit_vocab (this unit's own
    # phone_opening + message_word + dialogue_word union, 10 distinct
    # unit-scoped tokens) -- the old phone_and_message preset pooled in
    # unit04's phone_word (an earlier unit), 0 unit-scoped candidates,
    # DEAD at checkpoint scope. See review.notes.
    frame: {text: "{phone_opening_one} — {phone_opening_two} — {phone_opening_three} — {phone_opening_four} — {phone_opening_five} — {phone_opening_six}", language_code: prs, direction: rtl}
    slots: {phone_opening_one: *unit_vocab, phone_opening_two: *unit_vocab, phone_opening_three: *unit_vocab, phone_opening_four: *unit_vocab, phone_opening_five: *unit_vocab, phone_opening_six: *unit_vocab}
    slot_relations: [{kind: distinct, slots: [phone_opening_one, phone_opening_two, phone_opening_three, phone_opening_four, phone_opening_five, phone_opening_six]}]
    answer_derivation: {kind: matching_pairs, slots: [phone_opening_one, phone_opening_two, phone_opening_three, phone_opening_four, phone_opening_five, phone_opening_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 4/5: leaving a message and text messages.
  - content_key: practice.en-prs.prs.a1.unit07.lesson04.message_translate.002
    lesson_content_key: prs.a1.unit07.lesson04.leaving_a_message
    type: translation
    frame: {text: "{message_word}", language_code: en, direction: ltr, slot_rendering: {message_word: english_gloss}}
    slots: {message_word: *message_word}
    answer_derivation: {kind: slot_text, slot: message_word}
    feedback_frame: {text: "{message_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit07.lesson04.message_pair.003
    lesson_content_key: prs.a1.unit07.lesson04.leaving_a_message
    type: matching_pairs
    # REAUTH 2026-07-24: re-anchored to unit_vocab, same fix as
    # phone_open_pair.003 above -- see review.notes.
    frame: {text: "{message_word_one} — {message_word_two} — {message_word_three} — {message_word_four} — {message_word_five} — {message_word_six}", language_code: prs, direction: rtl}
    slots: {message_word_one: *unit_vocab, message_word_two: *unit_vocab, message_word_three: *unit_vocab, message_word_four: *unit_vocab, message_word_five: *unit_vocab, message_word_six: *unit_vocab}
    slot_relations: [{kind: distinct, slots: [message_word_one, message_word_two, message_word_three, message_word_four, message_word_five, message_word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [message_word_one, message_word_two, message_word_three, message_word_four, message_word_five, message_word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  # POLISH 2026-07-24: recognition-tier addition (see slot_presets note).
  - content_key: practice.en-prs.prs.a1.unit07.lesson04.phone_verb_gloss.004
    lesson_content_key: prs.a1.unit07.lesson04.leaving_a_message
    type: multiple_choice
    frame: {text: "{item}", language_code: prs, direction: rtl}
    slots: {item: *phone_verbs}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a verb form from this unit's phone conversations.", language_code: en, direction: ltr}

  # Lesson 5: text messages.
  # POLISH 2026-07-24: recognition-tier addition (see slot_presets note).
  # Lesson05 introduces کوتاه/فردا/جلسه/ساعت itself but previously had no
  # template at all.
  - content_key: practice.en-prs.prs.a1.unit07.lesson05.message_time_gloss.001
    lesson_content_key: prs.a1.unit07.lesson05.text_messages
    type: multiple_choice
    frame: {text: "{item}", language_code: prs, direction: rtl}
    slots: {item: *message_time}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a message or time word.", language_code: en, direction: ltr}

  # Lesson 6: the full phone call dialogue (Farid, Homayoun, Lima).
  - content_key: practice.en-prs.prs.a1.unit07.lesson06.name_gloss.001
    lesson_content_key: prs.a1.unit07.lesson06.phone_call_dialogue
    type: multiple_choice
    # REAUTH 2026-07-24: re-anchored from person_name (only 2
    # unit-scoped candidates, below the 3-option floor) to unit_vocab
    # (10 distinct) -- see review.notes. person_name stays real,
    # single-purpose vocabulary in name_translate.003 below.
    frame: {text: "{item}", language_code: prs, direction: rtl}
    slots: {item: *unit_vocab}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is from this unit's phone-call vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit07.lesson06.name_translate.003
    lesson_content_key: prs.a1.unit07.lesson06.phone_call_dialogue
    type: translation
    frame: {text: "{person_name}", language_code: en, direction: ltr, slot_rendering: {person_name: english_gloss}}
    slots: {person_name: *person_name}
    answer_derivation: {kind: slot_text, slot: person_name}
    feedback_frame: {text: "{person_name} is the Dari spelling of this name.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit07.lesson06.name_pair.004
    lesson_content_key: prs.a1.unit07.lesson06.phone_call_dialogue
    type: matching_pairs
    # REAUTH 2026-07-24: the old person_name pool (10 slots) was
    # backfilled COURSE-WIDE (10 names across the whole direction);
    # unit07 itself introduces only 2 (فرید, لیمه) -- 0 unit-scoped
    # candidates below what 10 slots need, DEAD at checkpoint scope.
    # Re-anchored to unit_vocab (10 distinct unit-scoped tokens) and
    # reduced to the standard 6 slots -- see review.notes. person_name
    # stays real, single-purpose vocabulary in name_translate.003 above.
    frame: {text: "{item_one} — {item_two} — {item_three} — {item_four} — {item_five} — {item_six}", language_code: prs, direction: rtl}
    slots: {item_one: *unit_vocab, item_two: *unit_vocab, item_three: *unit_vocab, item_four: *unit_vocab, item_five: *unit_vocab, item_six: *unit_vocab}
    slot_relations: [{kind: distinct, slots: [item_one, item_two, item_three, item_four, item_five, item_six]}]
    answer_derivation: {kind: matching_pairs, slots: [item_one, item_two, item_three, item_four, item_five, item_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
