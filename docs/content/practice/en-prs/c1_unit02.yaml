schema_version: '1.0'
pack_key: practice.en-prs.c1.unit02
source_language: en
target_language: prs
unit_content_key: prs.c1.unit02.manaye_zemni
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: "Fresh-context review 2026-11-27 (en-prs C1 units 01-08 pass): 1 fix - feedback frames said '{item} ... from the lesson on <label>' but every pool is unit-wide (and several named a different lesson than the anchor), so they now say '{item} is one of this unit's words.'. Read every gloss in the 36-lexeme unit dump and the 25-lexeme pool: glosses match the C1 senses (عکس already overridden to 'photo; the opposite', ساده to 'simple'); no same-gloss pair; کلام 'speech; wording' and عبارت 'phrase; expression' stay distinguishable. All frames are bare-word. Capacity (level+unit filter, TTS off): 15 live templates, recognition 5 / structured 5 / production 5, each hosting 25/36 lexemes (69%) and 5/5 lessons with lexemes; MC pools 25 distinct glosses, matching pools 25 >= 6; no dead template, so a checkpoint can be drawn. NATIVE FLAGS: the pool keeps the copula forms است / نیست / دارد (simple but correct glosses). Earlier note: Derived by scripts/derive_target.py packs from the unit's realization/overlay and the en-prs backfill lexemes (tags prs_c1_u2 / w_<token>). 25 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit's own teaching lines. Needs native review of frames and feedback."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_آشکار, w_است, w_استنباط, w_اشتباه, w_بار, w_بافت, w_بعد, w_جدی, w_دارد, w_درک, w_راضی, w_ساده, w_ضمنی, w_طعنه, w_عالی, w_عبارت, w_عکس, w_قرائت, w_منظورش, w_موضع, w_نیاز, w_نیست, w_چندان, w_کلام, w_گوینده]
