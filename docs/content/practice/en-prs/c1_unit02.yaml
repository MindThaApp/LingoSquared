  lesson_content_key: prs.c1.unit02.manaye_zemni.lesson01
  type: multiple_choice
  frame: {text: '{item}', language_code: prs, direction: rtl}
  slots:
    item: &id001
      language_code: prs
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_ضمنی, w_بافت, w_کلام, w_طعنه, w_استنباط, w_قرائت, w_بار, w_نیاز, w_دارد, w_درک, w_راضی, w_نیست, w_بعد, w_اشتباه, w_آشکار, w_عالی, w_است, w_منظورش, w_عکس, w_چندان, w_ساده, w_جدی, w_موضع, w_گوینده, w_عبارت]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words.', language_code: en, direction: ltr}
