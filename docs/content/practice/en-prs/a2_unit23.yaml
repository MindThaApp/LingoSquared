schema_version: '1.0'
pack_key: practice.en-prs.a2.unit23
source_language: en
target_language: prs
unit_content_key: prs.a2.unit23.how_it_used_to_be
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: 'Hand-authored from the unit''s realization and overlay and the en-prs backfill pool (tags en_prs_a2_unit23_* and w_<token>). Recognition, matching and bare-word production use single-word w_ tags only; lesson 6 consists only of conversation sentences, so its recognition, word_order and production templates use the lesson06 phrase pool (4 sentences; the typed production items there are full sentences). Paradigm-list phrase rows (six-form rows) and the long reading paragraph are not used in any pool. Kept OUT of recognition, matching and bare-word production: می‌خورد (stored gloss ''eats; takes'' is the wrong tense for this unit, which teaches ''used to eat''), بودند (''they were; they had (past perfect helper)'' carries grammar jargon), داشتی/داشتیم/داشتین/داشتند (gloss ends in ''(irrealis)'', a grammar label the learner should not see), مادرکلانم (''my grandmother'', a near-duplicate of مادرکلان ''grandmother'' that would make options and pairs confusable). These are still hosted by fixed-sentence translations or a fill_in_blank so they stay practised. Gloss notes for the coordinator: می‌رفتم and می‌رفتیم are stored as ''I would go'' / ''we would go'' and می‌کردم as ''I would do'' while the unit teaches ''used to''; Paradigm glosses mix ''was going / used to go / would go'' for the same form (می‌رفت ''he/she was going''). Sentence frames are single-member w_ anchors on the unit''s own teaching lines; Afghan Dari forms (plural -ین). Needs native review of every frame and of the English feedback.'
