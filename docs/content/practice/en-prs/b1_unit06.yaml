schema_version: '1.0'
pack_key: practice.en-prs.b1.unit06
source_language: en
target_language: prs
unit_content_key: prs.b1.unit06.purpose
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md. en-prs B1
    unit06 (تا / purpose clauses with the subjunctive, plus negative purpose) had
    a full realization + overlay and 30 classified lexemes across lessons 01-05,
    but no practice pack, so its unit checkpoint returned
    checkpoint_unavailable.


    17 templates: multiple_choice x4, matching_pairs x2, word_order x3,
    fill_in_blank x3, translation x5. ZERO listen_select --
    tts_actually_configured('prs') is false, so _material() would delete them
    (recipe section 6.2 / DO-NOT 3); recognition tier is multiple_choice only.
    lesson06 (wrapup_production) exists in the realization but contributes ZERO
    lexemes and therefore cannot appear in a checkpoint; lessons 01-05 are each
    hosted in all three tiers.


    purpose_subjunctive_verb is the unit's spine (9 unit-scoped members spanning
    lessons 01, 02 and 05) and carries recognition, matching and production on
    its own. The compound-verb stems یاد / جمع / پیدا / تلاش are glossed in the
    backfill script with an explicit "(used with گرفتن: to learn)"-style note, so
    their options and prompts stay unambiguous next to each other and next to
    هدف "goal; purpose".


    All three fill_in_blank slots (find_word -> پیدا, every_word -> هر,
    go_verb_third -> می‌رود) have exactly ONE distinct MODULE-wide candidate
    (AUTHORING_GUIDE section 17). lesson01's word_order slot is deliberately
    city_place + occupation_workplace and NOT study_vocab_word: the latter also
    contains درس / محصل / رشته, which would render ungrammatical sentences in
    "به {item} می‌روم تا انگلیسی یاد بگیرم." No typed-answer pool has a duplicate
    English gloss at B1-course scope, and every word_order frame was rendered
    with every B1-course candidate and hand-checked for grammaticality.
    بگیرم / انگلیسی / می‌خوابی / می‌خواهد carry no
    semantic tag in the backfill script and stay unhosted. Register: unit06 keeps
    the Afghan -ین 2pl (بگیرین, کنین) and می‌خواهد uncontracted, both correct
    Dari; scripts/check_dari_register.py reports zero findings on this file.
    Every frame is lifted from the realization's own tested_text. Needs the
    standard fresh-context review before import.

    Review 2026-10-24 (en-prs practice native-quality pass): 11 fixes. Pools:
    verb and noun/adjective/adverb pools that spanned B1 unit01-11 (incl.
    numbers سه/نه/یک, دفتر, باید, است, نرفت...) now use en_prs_b1_unit06_words /
    lesson tags so feedback 'from this unit/reading' is true. lesson01.order.002
    narrowed to study_vocab_word (مکتب) - دفتر made 'go to the office to learn
    English'. lesson03.order.001 DROPPED: its pool negative_purpose_verb has
    نشوم AND نشوی but the frame's main verb is fixed first person, so half of
    the draws gave 'کمی استراحت می‌کنم تا خسته نشوی' (mismatched subject); no
    tag separates the two (see Owner questions). Inline Dari in feedback wrapped
    in asterisks. NATIVE FLAGS: (1) 'تا خسته نشوی' with first-person main clause
    was dropped, please confirm no natural reading. (2) 'هر روز به مکتب می‌رود'
    accepted only in this word order. (3) gloss 'let me take/let me do' for
    بگیرم/کنم (subjunctive) vs '(that) I take' - confirm which reading the unit
    teaches.

tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - purpose_subjunctive_verb
    - negative_purpose_verb
    - routine_verb
    - health_advice_word
    - go_verb_present
    - go_verb_third
    - dialogue_word
    - purpose_noun_stem
    - city_place
    - occupation_workplace
    - study_vocab_word
    - transport_mode_word
    - goal_word
    - degree_word
    - find_word
    - every_word
    - ones_number
    - en_prs_b1_unit06_words
    - en_prs_b1_unit06_lesson02_words
    - en_prs_b1_unit06_lesson03_words
templates:

# ---------------------------------------------------------------------------
# lesson01 -- تا یاد بگیرم (purpose clauses, 1st/2nd person)
# ---------------------------------------------------------------------------
- content_key: practice.en-prs.prs.b1.unit06.lesson01.choose.001
  lesson_content_key: prs.b1.unit06.lesson01.present_purpose_1st2nd
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: prs
      part_of_speech: verb
      agreement_tags:
        semantic: purpose_subjunctive_verb
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is the subjunctive verb that follows *تا* -- its ending must match the person of the main clause.'
    language_code: en
    direction: ltr

- content_key: practice.en-prs.prs.b1.unit06.lesson01.order.002
  lesson_content_key: prs.b1.unit06.lesson01.present_purpose_1st2nd
  type: word_order
  frame:
    text: 'به {item} می‌روم تا انگلیسی یاد بگیرم.'
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: study_vocab_word
  answer_derivation:
    kind: render_frame
    frame:
      text: 'به {item} می‌روم تا انگلیسی یاد بگیرم.'
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'به مکتب می‌روم تا انگلیسی یاد بگیرم. -- I go to school to learn English.'
    language_code: en
    direction: ltr

- content_key: practice.en-prs.prs.b1.unit06.lesson01.match.003
  lesson_content_key: prs.b1.unit06.lesson01.present_purpose_1st2nd
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: prs
    direction: rtl
  slots:
    first: &purpose_verb
      language_code: prs
      part_of_speech: verb
      agreement_tags:
        semantic: en_prs_b1_unit06_words
    second: *purpose_verb
    third: *purpose_verb
    fourth: *purpose_verb
    fifth: *purpose_verb
    sixth: *purpose_verb
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each Dari verb form with the person and meaning it expresses.
    language_code: en
    direction: ltr

- content_key: practice.en-prs.prs.b1.unit06.lesson01.translate.004
  lesson_content_key: prs.b1.unit06.lesson01.present_purpose_1st2nd
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: prs
      part_of_speech: verb
      agreement_tags:
        semantic: en_prs_b1_unit06_words
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: The Dari form is {item}.
    language_code: en
    direction: ltr

