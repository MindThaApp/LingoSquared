schema_version: '1.0'
pack_key: practice.en-prs.b1.unit03
source_language: en
target_language: prs
unit_content_key: prs.b1.unit03.conditions
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md. en-prs B1
    unit03 (اگر / real conditionals with داشته باشم + a present result clause)
    had a full realization + overlay and 38 classified lexemes across all 6
    lessons, but no practice pack, so its unit checkpoint returned
    checkpoint_unavailable.


    15 templates: multiple_choice x4, matching_pairs x2, word_order x3,
    fill_in_blank x2, translation x4. ZERO listen_select --
    tts_actually_configured('prs') is false, so _material() would delete them
    (recipe section 6.2 / DO-NOT 3); recognition tier is multiple_choice only.


    IMPORTANT reviewer note: آنجا is deliberately EXCLUDED from every slot in
    this pack. Its english_gloss in backfill_lexemes_en_prs.py is "there
    (spelling variant of آن‌جا, no ZWNJ)" -- an authoring annotation, not a
    learner-facing gloss. Any multiple_choice option, matching_pairs right or
    bare-word translation prompt built from it would leak the internal term
    "ZWNJ" into the learner UI (defect class 1.5). Its tag location_word is
    therefore never used here; fixing the gloss is a backfill-script change and
    belongs to whoever owns that script.


    lesson06 introduces exactly one lexeme (هوا, weather_noun, module-wide
    unique), so it is hosted in all three tiers via choose.001/translate.002 on
    the weather-and-place noun pool, fill.003, and the fixed-sentence
    translate.004 -- all four ride that single lexeme, which is the only way
    lesson06 can appear in a checkpoint at all. باشد / باشند / می‌آید / ما /
    دیگر / خوبی / داشته carry no semantic tag in the backfill script and stay
    unhosted; هوا aside, the two fill_in_blank slots (weekday single -> جمعه,
    weather_noun -> هوا) each have exactly ONE distinct MODULE-wide candidate
    (AUTHORING_GUIDE section 17).


    Register: unit03's own register_policy pins the standard د/ید/ند paradigm
    for NEW verbs while keeping the already-established Afghan باشین (this file
    was normalized باشید -> باشین on 2026-07-11); every frame here is lifted
    from the realization's own tested_text, so no new form is introduced. Needs
    the standard fresh-context review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - subjunctive_be_verb
    - come_verb_present
    - meeting_verb
    - go_verb_plural
    - go_verb_present
    - routine_verb
    - stay_verb
    - drink_verb_plural
    - past_verb_plural_third
    - rain_verb
    - know_verb
    - dialogue_word
    - weather_precip_noun
    - weather_descriptor
    - weather_noun
    - plan_noun
    - sport_place_word
    - weekday_name
    - volume_en_prs_a1_unit09_weekday_name_10_single
    - food_item
    - preference_topic
    - time_period
    - politeness
