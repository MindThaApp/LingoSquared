      language_code: prs
      part_of_speech: verb
      agreement_tags:
        semantic: subjunctive_be_verb
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is the subjunctive بودن form that closes an اگر ... داشته clause.'
    language_code: en
    direction: ltr

- content_key: practice.en-prs.prs.b1.unit03.lesson01.order.002
