        - stay_verb
        - drink_verb_plural
        - past_verb_plural_third
        - rain_verb
        - know_verb
    second: *condition_verb
    third: *condition_verb
    fourth: *condition_verb
    fifth: *condition_verb
    sixth: *condition_verb
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each Dari verb form with the person and tense it expresses.
    language_code: en
    direction: ltr

- content_key: practice.en-prs.prs.b1.unit03.lesson01.translate.004
  lesson_content_key: prs.b1.unit03.lesson01.present_condition_1st2nd
  type: translation
