schema_version: '1.0'
pack_key: practice.en-prs.c1.unit08
source_language: en
target_language: prs
unit_content_key: prs.c1.unit08.eqna_va_balaghat
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: "Fresh-context review 2026-11-27 (en-prs C1 units 01-08 pass): 3 fixes - (1) feedback frames said '{item} ... from the lesson on <label>' but every pool is unit-wide (and several named a different lesson than the anchor), so they now say '{item} is one of this unit's words.', and word_order feedback no longer calls its sentence the model of the anchor lesson; (2) the union pool gained آیندهٔ 'future (of)', the only lexeme of lesson03, so lesson03 is now hosted in every tier (was 4/5 lessons); (3) backfill C1 fix: تا 'counter word (pieces)' (counting_word tag) -> 'until' (tag dropped; not pooled). Read every gloss in the 26-lexeme unit dump and the 24-lexeme pool; no same-gloss pair. The word_order anchor w_عمل has 1 course-scope candidate and is not a literal word of its frame. Capacity (level+unit filter, TTS off): 17 live templates, recognition 6 / structured 6 / production 5, each hosting 24/26 lexemes (92%) and 5/5 lessons with lexemes; MC pools 24 distinct glosses, matching pools 24 >= 6; no dead template, so a checkpoint can be drawn. NATIVE FLAGS: بمانیم is glossed 'let's stay' and برود '(that) he/she go' (subjunctive senses in the unit are 'we wait' / 'it slips away'). Earlier note: Derived by scripts/derive_target.py packs from the unit's realization/overlay and the en-prs backfill lexemes (tags prs_c1_u8 / w_<token>). 23 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit's own teaching lines. Needs native review of frames and feedback."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_آرام, w_باید, w_برود, w_بلاغی, w_بمانیم, w_تأکید, w_تردید, w_توازی, w_حاضران, w_خطاب, w_دعوت, w_دقیق, w_زمان, w_سخنرانی, w_سریع, w_سوال, w_سپس, w_شدت, w_عمل, w_فرصت, w_منتظر, w_همکاران, w_پیگیری, w_آیندهٔ]
