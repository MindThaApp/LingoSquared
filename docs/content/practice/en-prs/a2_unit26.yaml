schema_version: '1.0'
pack_key: practice.en-prs.a2.unit26
source_language: en
target_language: prs
unit_content_key: prs.a2.unit26.already_happened
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: 'Generated from the unit''s realization and en-prs backfill lexemes. Pools are unions of single-member w_<token> tags restricted to noun/verb/adjective/adverb, which keeps phrase rows, proper nouns,
    pronouns and particles out. No listen_select (prs has no TTS). Per lesson one multiple_choice and one bare-word translation (lesson pool if >=4 words, else unit pool); two curated matching_pairs templates
    with 6 slots and distinct glosses; word_order, fill_in_blank and fixed-sentence translation templates are single-member anchors on the unit''s own teaching sentences. Dari register: Kabul Dari, 2pl
    -ین, copula است/استند. Needs native review of frames and feedback. Gloss notes: پیدا carries ''found (as in to find)'' typed adjective and is the only lexeme of lesson 06, kept in recognition/production
    pools only (excluded from matching). Phrase rows for میدان هوایی and گم کردن and the paradigm/sentence rows are untagged and not used. Matching avoids the confusable possessive pairs (پاسپورت/پاسپورتم,
    کلید/کلیدم).'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_آمده
    - w_برسم
    - w_برسیم
    - w_برگشتم
    - w_برگشتن
    - w_برگشته
    - w_جلسه
    - w_رسیده
    - w_رسیدی
    - w_قبلاً
    - w_مدیر
    - w_موترم
    - w_میدان
    - w_نخورده
    - w_ندیده
    - w_نرسیده
    - w_نیامده
    - w_هوایی
    - w_پاسپورت
    - w_پاسپورتم
    - w_پیدا
    - w_چهار
    - w_کارمندان
    - w_کلید
    - w_کلیدم
    - w_گم
