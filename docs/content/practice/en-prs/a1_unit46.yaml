      part_of_speech: &id001
      - noun
      - verb
      agreement_tags:
        semantic: &id002
        - service_person_word
        - symptom_word
        - medicine_form_word
        - purpose_subjunctive_verb
        - paperwork_word
        - formal_possessive_word
