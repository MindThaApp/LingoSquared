schema_version: '1.0'
pack_key: practice.en-prs.a1.unit46
source_language: en
target_language: prs
unit_content_key: prs.a1.unit46.pharmacy
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: 'Vocabulary unit (pharmacy), 8 lexemes across all 6 lessons. Recognition+production templates
    use a union of all 6 lessons'' own semantic tags (service_person_word, symptom_word, medicine_form_word,
    purpose_subjunctive_verb, paperwork_word, formal_possessive_word), one MC + one bare-word translation
    per lesson (6+6=12). Structured tier: 1 matching_pairs (6 of 8 tokens, anchored lesson04) + 2 word_order
    (medicine_form_word 3 course-wide members -- من X می‌خواهم is grammatical for all 3; symptom_word
    4 course-wide members -- X دارم is grammatical for all 4, matches the unit''s own realization dialogue
    pattern). No course-wide single-candidate tag existed for fill_in_blank (purpose_subjunctive_verb
    has 2 members, both verb pos, not separable). 15 templates total, all 3 tiers >=3, all 6 lessons covered
    in every tier. No mis-glossed lexemes found; all 8 glosses cross-checked against the realization dialogue/reading
    text.

    Review 2026-10-24 (en-prs practice native-quality pass): 4 fixes. Feedback on the 12 MC and translation items and matching no longer claims words come from this unit (pool unions six course-wide tags incl. other units service roles and possessives); medicine word_order frame now من یک X می‌خواهم (من دانه می‌خواهم is not grammatical without a number) with an accurate feedback; symptom word_order feedback rewritten (internal-looking text removed). NATIVE FLAGS: the course-wide formal_possessive_word pool draws بلیط‌تان (unit-other token; the Dari convention is تکت) - needs a decision outside this pack; confirm دانه as piece; dose counter.'

tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - formal_possessive_word
    - medicine_form_word
    - paperwork_word
    - purpose_subjunctive_verb
    - service_person_word
    - symptom_word
