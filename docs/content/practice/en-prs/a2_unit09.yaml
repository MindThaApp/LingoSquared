schema_version: '1.0'
pack_key: practice.en-prs.a2.unit09
source_language: en
target_language: prs
unit_content_key: prs.a2.unit09.bureaucracy
review:
  status: reviewed
  fresh_context: true
  notes: 'Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-06, same pass as this bundle''s a1_unit03.yaml
    sibling (see that file''s notes for the full extension rationale and verification method) -- this is the first A2-level
    en-prs practice pack, matching prs''s own first A2 realization unit (registering a new address at the municipality). Smaller
    unit (4 lessons, not 6), so a smaller template set is expected and correct, not a shortcut.

    Two groups: office_word (وقت/سند/آدرس/تذکره/شاروالی, 5 members) from lesson01, and paperwork_word (رسید/مهلت, 2 members
    -- matching_pairs/ translation only) from lesson03. Deliberately skipped the many A2- level grammatical constructions
    this unit teaches (چون clauses, می‌شود/می‌توانم polite forms) as slot fillers -- these are sentence- level patterns, not
    atomic vocabulary, and stay taught/drilled via the lesson''s own exercises rather than forced into a single-token slot.

    Every fill_in_blank frame embeds the slot in a real Dari sentence with visible surrounding context (guide §13). Every
    note/feedback string doesn''t mix Dari inline with English (frames use separate language_code blocks throughout, so §15''s
    asterisk convention doesn''t apply here). No listen_select/listen_type anywhere. No bare unquoted yes/no/true/false anywhere.

    Verified with a standalone throwaway script reusing scripts/_practice_slot_check.py''s lexeme_matches()/check_pack() against
    scripts/backfill_lexemes_en_prs.py''s real iter_specs() output -- 0 problems. scripts/compile_content.py practice-validate
    for the full en-prs pack (units 01-10 together) -- 0 errors/0 warnings. Needs the standard fresh-context review before
    import; no backfill_lexemes_en_prs.py run has actually happened against a real database yet in this pass.

    DEPTH PASS 2026-07-06 (per-unit template audit found this unit thin at 7 vs unit02/03/04''s 16-24): added office_word''s
    remaining word_ order slot, plus paperwork_word''s remaining multiple_choice (pooled via office_and_paperwork, same precedent
    as the existing paperwork_ pair template) and word_order slots -- 7 -> 10 templates. This is the real ceiling for this
    unit without inventing vocabulary or extending scripts/backfill_lexemes_en_prs.py''s classifier: office_ word and paperwork_word
    are the only two semantic tags this unit''s real vocabulary has (verified by re-reading the classifier''s own A2 unit09
    section) -- lesson02''s چون/می‌شود grammatical constructions and lesson04''s dialogue vocabulary are deliberately untagged
    (sentence-level patterns / dialogue-specific, per this file''s own prior notes above), and tagging them would need a classifier
    change, out of scope for a practice-pack-only pass. With both tags now at 5 templates each (multiple_choice, fill_in_blank,
    translation, matching_pairs, word_order), every PRACTICE_EXERCISE_TYPES member this direction supports (no listen_select
    for prs) is covered. Re-verified: scripts/_practice_slot_check.py 0 problems across the whole en-prs pack; scripts/compile_content.py
    practice-validate for the full pack -- 0 errors/0 warnings.

    TAGGING-DEPTH PASS 2026-07-07: an audit comparing this course''s real A2-level tagged-lexeme pool against en-fa''s found
    this unit''s own en-prs backfill classifier (scripts/backfill_lexemes_en_prs.py) was missing the whole-phrase auto-derivation
    backfill_lexemes.py''s own _classify_fa() already does for fa -- every teaching card that introduces more than one new
    token at once (a real taught sentence, not a bare word) also becomes its own separate "phrase" lexeme. Added that derivation
    (A2-only, via a new derive_phrases=True opt-in parameter that can never touch A1''s pool) plus a new "bureaucracy_phrase"
    tag scoping it to this unit''s own lesson_key prefix, mirroring fa''s own "bureaucracy_phrase" tag exactly. Verified via
    scripts/backfill_lexemes_en_prs.py''s actual iter_specs() output, filtered to level==''a2'' per AUTHORING_GUIDE.md #18
    (never trust the pooled A1+A2 count): 10 real, distinct bureaucracy_phrase candidates (close to fa''s own 11 -- the small
    difference is genuine, from how this unit''s teaching cards chunk newly-introduced tokens per card, not a gap). Added
    3 new templates (multiple_choice, matching_pairs over all 10, translation) anchored at lesson04 where the pool completes
    -- 8 -> 11 templates. Re-verified: scripts/ _practice_slot_check.py 0 problems across the whole en-prs pack; scripts/compile_content.py
    practice-validate for the full pack -- 0 errors/0 warnings.'
