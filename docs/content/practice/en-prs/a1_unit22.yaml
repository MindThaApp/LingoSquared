schema_version: "1.0"
pack_key: practice.en-prs.a1.unit22
source_language: en
target_language: prs
unit_content_key: prs.a1.unit22.weather
review:
  status: reviewed
  fresh_context: true
  notes: >-
    Authored 2026-07-09, same practice-pool depth-extension pass as this
    bundle's a1_unit20.yaml/a1_unit21.yaml siblings (see a1_unit20.yaml's
    notes for the shared pass context).

    New groups, all real vocabulary from this unit's own realization:
    "weather_descriptor" (آفتابی/ابری/گرم/سرد, 4 members -- گرم is a
    REUSED existing lexeme, additively tagged here alongside its
    existing unit14 warm_word tag) combines grammatically with است ("هوا
    X است") for BOTH the sky-condition adjectives AND the temperature
    adjectives -- deliberately merged into one uniform-POS-adjective
    group rather than kept separate, since both categories combine
    identically with the same frame. "weather_precip_noun" (باران/برف,
    2 members) are kept SEPARATE (genuine nouns, not adjectives) since
    they combine with می‌بارد ("X می‌بارد"), not است -- composing them
    with است instead would be ungrammatical, the same class of
    constraint as unit20's eat_verb/work_past_verb single-candidate
    subsets. "stay_verb" (بمانیم/می‌مانیم/می‌مانند, 3 members, completes
    lesson06) is the "stay home" verb paradigm across subjunctive/1pl/
    3pl forms -- three genuinely distinct glosses. "future_become_verb"
    is a THIRD homograph sense of می‌شود (weather "will become"),
    special-cased by content_key in backfill_lexemes_en_prs.py's
    _classify(), unrelated to both A2-unit09's polite-request sense and
    unit12's present-tense "wakes up" sense -- same collision class as
    those two existing splits.

    Checked for the "fine"/"okay" gloss-collision trap: weather_
    descriptor's 4 glosses (sunny/cloudy/warm/cold) are all genuinely
    distinct; weather_precip_noun's 2 (rain/snow) likewise. Checked POS
    uniformity before pooling: all 4 weather_descriptor members are POS
    adjective (confirmed گرم's existing POS entry before reusing it, not
    assumed).

    Word_order templates checked for grammaticality: "{weather_precip_
    noun} می‌بارد" (lessons 1-2, matches the real taught "امروز برف
    می‌بارد" pattern), "هوا {weather_descriptor} است" (lesson03, matches
    "هوا آفتابی است"/"هوا سرد است"), "فردا هوا {weather_descriptor}
    {future_become_verb}" (lesson04, matches "فردا هوا سرد می‌شود"
    exactly), "بهتر است در خانه {stay_verb_subjunctive}" (lesson05,
    single-candidate بمانیم, matches the real taught sentence exactly),
    and a two-clause "امروز هوا {weather_descriptor} است اما فردا
    {weather_precip_noun} می‌بارد" (lesson06, generalizes the real
    wrap-up reading's own two-clause pattern -- both independent slots
    remain grammatical in every combination since neither clause
    references the other).

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    Zero fill_in_blank templates -- this unit's real vocabulary doesn't
    need one beyond what translation/word_order already safely cover.

    Verified with scripts/_practice_slot_check.py (reusing
    backfill_lexemes_en_prs.py's real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py
    practice-validate for the full en-prs pack -- 0 errors/0 warnings.
    Needs the standard fresh-context review before import; no
    backfill_lexemes_en_prs.py run has happened against a real database
    yet in this pass.

    RE-AUTH PASS 2026-07-24 (scripts/_practice_unit_scope_check.py DEAD-
    template fixes, PACK-ONLY): the whole-direction slot check above
    only proved candidates exist somewhere in en-prs; it never proved
    they exist WITHIN this unit's own lessons, which is what
    generate_checkpoint() actually loads. Two templates were DEAD at
    checkpoint scope: (1) lesson04.time_reference_gloss.001 slotted the
    course-wide "time_reference" tag (دیروز/امروز/فردا), which unit22
    introduces zero lexemes for -- re-anchored (now weather_verb_gloss.001)
    to a union of this unit's own verb tags (future_become_verb,
    fall_verb, cant_verb, watch_verb, stay_verb -- 7 unit-scoped tokens,
    7 distinct glosses). (2) lesson06.weather_review_pair.002's 4-way
    weather_descriptor distinct-group needed 4 tokens but this unit's OWN
    weather_descriptor pool is only 3 (آفتابی/ابری/سرد) -- گرم is
    additively tagged here but its lexeme spec is still keyed to unit14's
    lesson_content_key (first-introduced there), so it is out of unit
    scope for THIS unit's checkpoint no matter how many tags it also
    carries. Re-anchored to a single 6-way distinct group unioning
    weather_descriptor (3) + weather_precip_noun (2) + weather_noun (1) =
    exactly 6 unit-scoped distinct tokens. Both fixes keep the same
    template type/tier and the same lesson anchor; no backfill/realization/
    overlay change needed. Post-fix: scripts/_practice_unit_scope_check.py
    reports 0 DEAD, 0 below-floor for this pack.
tag_schema:
  part_of_speech: [noun, verb, adjective, adverb]
  agreement_tags:
    semantic:
      [weather_descriptor, weather_noun, weather_precip_noun, fall_verb,
       stay_verb, stay_verb_subjunctive, watch_verb, cant_verb,
       film_word, future_become_verb]
slot_presets:
  weather_descriptor: &weather_descriptor {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: weather_descriptor}}
  weather_noun: &weather_noun {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: weather_noun}}
  weather_precip_noun: &weather_precip_noun {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: weather_precip_noun}}
  stay_verb: &stay_verb {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: stay_verb}}
  stay_verb_subjunctive: &stay_verb_subjunctive {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: stay_verb_subjunctive}}
  cant_verb: &cant_verb {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: cant_verb}}
  film_word: &film_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: film_word}}
  future_become_verb: &future_become_verb {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: future_become_verb}}
  # Re-anchor fix (2026-07-24): unions this unit's OWN verb tags (all five are
  # native to unit22 -- future_become_verb/fall_verb from lessons02+04,
  # cant_verb/watch_verb/stay_verb from lesson05) so lesson04's recognition
  # template no longer depends on the course-wide "time_reference" tag, which
  # unit22 introduces zero lexemes for (it was an earlier unit's tag -- DEAD
  # at checkpoint scope). 7 unit-scoped tokens, 7 distinct glosses.
  weather_verb: &weather_verb {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: [future_become_verb, fall_verb, cant_verb, watch_verb, stay_verb]}}
  # Re-anchor fix (2026-07-24): unions weather_descriptor + weather_precip_noun
  # + weather_noun so the lesson06 review matching_pairs has 6 unit-scoped
  # distinct tokens (سرد/آفتابی/ابری/باران/برف/هوا). گرم stays excluded --
  # its spec is still keyed to unit14's own lesson_content_key (only
  # additively re-tagged here), so it is out of scope for THIS unit's
  # checkpoint even though it shares the weather_descriptor tag.
  weather_review_word: &weather_review_word {language_code: prs, part_of_speech: [adjective, noun], agreement_tags: {semantic: [weather_descriptor, weather_precip_noun, weather_noun]}}
templates:
  # Lesson 1: weather vocabulary.
  - content_key: practice.en-prs.prs.a1.unit22.lesson01.weather_noun_translate.001
    lesson_content_key: prs.a1.unit22.lesson01.weather_vocabulary
    type: translation
    frame: {text: "{weather_noun}", language_code: en, direction: ltr, slot_rendering: {weather_noun: english_gloss}}
    slots: {weather_noun: *weather_noun}
    answer_derivation: {kind: slot_text, slot: weather_noun}
    feedback_frame: {text: "{weather_noun} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit22.lesson01.precip_falling_order.002
    lesson_content_key: prs.a1.unit22.lesson01.weather_vocabulary
    type: word_order
    frame: {text: "{weather_precip_noun} می‌بارد", language_code: prs, direction: rtl}
    slots: {weather_precip_noun: *weather_precip_noun}
    answer_derivation: {kind: render_frame, frame: {text: "{weather_precip_noun} می‌بارد", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: [rain/snow] می‌بارد (it's [raining/snowing]).", language_code: en, direction: ltr}

  # Lesson 2: snow and asking about the weather.
  - content_key: practice.en-prs.prs.a1.unit22.lesson02.precip_noun_translate.001
    lesson_content_key: prs.a1.unit22.lesson02.snow_and_asking
    type: translation
    frame: {text: "{weather_precip_noun}", language_code: en, direction: ltr, slot_rendering: {weather_precip_noun: english_gloss}}
    slots: {weather_precip_noun: *weather_precip_noun}
    answer_derivation: {kind: slot_text, slot: weather_precip_noun}
    feedback_frame: {text: "{weather_precip_noun} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit22.lesson02.today_precip_order.002
    lesson_content_key: prs.a1.unit22.lesson02.snow_and_asking
    type: word_order
    frame: {text: "امروز {weather_precip_noun} می‌بارد", language_code: prs, direction: rtl}
    slots: {weather_precip_noun: *weather_precip_noun}
    answer_derivation: {kind: render_frame, frame: {text: "امروز {weather_precip_noun} می‌بارد", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: امروز [rain/snow] می‌بارد (it's [raining/snowing] today).", language_code: en, direction: ltr}

  # Lesson 3: hot and cold.
  - content_key: practice.en-prs.prs.a1.unit22.lesson03.weather_descriptor_gloss.001
    lesson_content_key: prs.a1.unit22.lesson03.temperature
    type: multiple_choice
    frame: {text: "{weather_descriptor}", language_code: prs, direction: rtl}
    slots: {weather_descriptor: *weather_descriptor}
    answer_derivation: {kind: slot_gloss, slot: weather_descriptor}
    feedback_frame: {text: "{weather_descriptor} describes the weather.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit22.lesson03.weather_is_order.002
    lesson_content_key: prs.a1.unit22.lesson03.temperature
    type: word_order
    frame: {text: "هوا {weather_descriptor} است", language_code: prs, direction: rtl}
    slots: {weather_descriptor: *weather_descriptor}
    answer_derivation: {kind: render_frame, frame: {text: "هوا {weather_descriptor} است", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: هوا [descriptor] است (the weather is [descriptor]).", language_code: en, direction: ltr}

  # Lesson 4: tomorrow's forecast.
  - content_key: practice.en-prs.prs.a1.unit22.lesson04.weather_verb_gloss.001
    lesson_content_key: prs.a1.unit22.lesson04.tomorrow_forecast
    # Re-anchored (2026-07-24): was slotted to the course-wide "time_reference"
    # tag (دیروز/امروز/فردا), which THIS unit introduces zero lexemes for --
    # 0 unit-scoped candidates, DEAD at checkpoint scope. Re-anchored to a
    # union of this unit's own verb tags (see weather_verb preset above).
    type: multiple_choice
    frame: {text: "{weather_verb}", language_code: prs, direction: rtl}
    slots: {weather_verb: *weather_verb}
    answer_derivation: {kind: slot_gloss, slot: weather_verb}
    feedback_frame: {text: "{weather_verb} is one of this unit's Dari verbs.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit22.lesson04.forecast_order.002
    lesson_content_key: prs.a1.unit22.lesson04.tomorrow_forecast
    type: word_order
    frame: {text: "فردا هوا {weather_descriptor} {future_become_verb}", language_code: prs, direction: rtl}
    slots: {weather_descriptor: *weather_descriptor, future_become_verb: *future_become_verb}
    answer_derivation: {kind: render_frame, frame: {text: "فردا هوا {weather_descriptor} {future_become_verb}", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: فردا هوا [descriptor] می‌شود (it will get [descriptor] tomorrow).", language_code: en, direction: ltr}

  # Lesson 5: weather changes a plan.
  - content_key: practice.en-prs.prs.a1.unit22.lesson05.cant_verb_translate.001
    lesson_content_key: prs.a1.unit22.lesson05.weather_changes_a_plan
    type: translation
    frame: {text: "{cant_verb}", language_code: en, direction: ltr, slot_rendering: {cant_verb: english_gloss}}
    slots: {cant_verb: *cant_verb}
    answer_derivation: {kind: slot_text, slot: cant_verb}
    feedback_frame: {text: "{cant_verb} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit22.lesson05.stay_home_order.002
    lesson_content_key: prs.a1.unit22.lesson05.weather_changes_a_plan
    type: word_order
    frame: {text: "بهتر است در خانه {stay_verb_subjunctive}", language_code: prs, direction: rtl}
    slots: {stay_verb_subjunctive: *stay_verb_subjunctive}
    answer_derivation: {kind: render_frame, frame: {text: "بهتر است در خانه {stay_verb_subjunctive}", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: بهتر است در خانه بمانیم (it's better to stay home).", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit22.lesson05.film_word_translate.003
    lesson_content_key: prs.a1.unit22.lesson05.weather_changes_a_plan
    type: translation
    frame: {text: "{film_word}", language_code: en, direction: ltr, slot_rendering: {film_word: english_gloss}}
    slots: {film_word: *film_word}
    answer_derivation: {kind: slot_text, slot: film_word}
    feedback_frame: {text: "{film_word} is the Dari word for this.", language_code: en, direction: ltr}

  # Lesson 6: wrap-up reading.
  - content_key: practice.en-prs.prs.a1.unit22.lesson06.stay_verb_gloss.001
    lesson_content_key: prs.a1.unit22.lesson06.wrap_up_reading
    type: multiple_choice
    frame: {text: "{stay_verb}", language_code: prs, direction: rtl}
    slots: {stay_verb: *stay_verb}
    answer_derivation: {kind: slot_gloss, slot: stay_verb}
    feedback_frame: {text: "{stay_verb} means to stay/remain.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit22.lesson06.weather_review_pair.002
    lesson_content_key: prs.a1.unit22.lesson06.wrap_up_reading
    # Re-anchored (2026-07-24): was weather_descriptor (4 slots) + weather_
    # precip_noun (2 slots) as two separate distinct-groups, but this unit's
    # OWN weather_descriptor pool is only 3 tokens (آفتابی/ابری/سرد -- گرم
    # stays keyed to unit14, out of unit scope), so the 4-slot group was DEAD.
    # Now a single 6-way distinct group over weather_descriptor (3) +
    # weather_precip_noun (2) + weather_noun (1) = 6 distinct unit-scoped
    # tokens -- exactly meets the matching_pairs floor.
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots:
      word_one: *weather_review_word
      word_two: *weather_review_word
      word_three: *weather_review_word
      word_four: *weather_review_word
      word_five: *weather_review_word
      word_six: *weather_review_word
    slot_relations:
      - {kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning -- weather conditions.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit22.lesson06.today_tomorrow_order.003
    lesson_content_key: prs.a1.unit22.lesson06.wrap_up_reading
    type: word_order
    frame: {text: "امروز هوا {weather_descriptor} است اما فردا {weather_precip_noun} می‌بارد", language_code: prs, direction: rtl}
    slots: {weather_descriptor: *weather_descriptor, weather_precip_noun: *weather_precip_noun}
    answer_derivation: {kind: render_frame, frame: {text: "امروز هوا {weather_descriptor} است اما فردا {weather_precip_noun} می‌بارد", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: امروز هوا [descriptor] است اما فردا [rain/snow] می‌بارد (today the weather is [descriptor] but tomorrow it will [rain/snow]).", language_code: en, direction: ltr}
