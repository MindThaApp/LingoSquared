schema_version: "1.0"
pack_key: practice.en-prs.a2.unit10
source_language: en
target_language: prs
unit_content_key: prs.a2.unit10.opinions
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    POLISH WAVE 2 2026-07-24 (tier-thinness): recognition tier was 2 live
    templates (opinion_gloss.001, opinion_phrase_choice.006; listen_select is
    banned for prs -- no TTS). Added lesson03.message_noun_gloss.009, a
    multiple_choice anchored to lesson03 (which previously had no
    recognition-tier template at all) pooling the semantic union
    [opinion_word, family_message_word] (nouns only): 7 unit-scoped tokens /
    7 distinct glosses, comfortably over the >=3 MC floor. Differs from
    opinion_gloss.001 in pool (adds lesson03's پیام/فامیل). Recognition tier
    is now 3 live templates. No other change.

    UNIT-SCOPE DEAD-TEMPLATE FIX 2026-07-24: scripts/_practice_unit_scope_check.py
    flagged this pack (1 DEAD, 3 below-floor), all four stemming from the same
    root cause the prior authoring notes below actually documented as a
    justification rather than recognizing as the defect it is: person_name
    and family_message_word/opinion_word templates were sized to a COURSE-WIDE
    or aspirational candidate count, but generate_checkpoint() scopes every
    slot to THIS unit's own lexemes only (recipe DO-NOT #2 / SS1.1). Dropped
    four templates that cannot be pack-only re-anchored to reach their floor
    (no unit-native way to widen without a scripts/backfill_lexemes_en_prs.py
    change -- LOGGED for the coordinator, see each drop's inline note for the
    specific gap): lesson01.opinion_pair.004 (matching_pairs, needed 6,
    unit ceiling is 5), lesson04.name_pair.003 (matching_pairs, needed 10
    slots declared but unit ceiling is 2 -- this one was DEAD, not just
    below-floor), lesson04.name_gloss.004 (multiple_choice, needed 3, unit
    ceiling is 2), lesson03.family_message_pair.001 (matching_pairs, needed
    6, unit ceiling is 2). Every dropped template's tag still has at least
    one other LIVE template covering the same lesson (word_order and/or
    translation, both floor-free), so no lesson/tier was left uncovered --
    verified via scripts/_practice_unit_scope_check.py (0 DEAD / 0 below-floor
    remaining for this file after the fix), scripts/compile_content.py
    practice-validate (0 errors), and scripts/check_dari_register.py (0
    findings for this file). Net: 13 -> 9 templates, all genuinely live;
    tier counts after the fix: recognition 2 (opinion_gloss.001,
    opinion_phrase_choice.006), structured 3 (opinion_order.005,
    name_order.005, opinion_phrase_pair.007 [7 pairs, unaffected]),
    production 4 (opinion_translate.003, name_translate.002,
    family_message_translate.002, opinion_phrase_translate.008). Capacity
    comfortably clears the 12-item checkpoint floor across the surviving
    templates (opinion_word alone hosts 5+5+5=15 target-lexeme item
    possibilities across its three live templates; opinion_phrase adds a
    further 7+7=14). Prior authoring history retained below UNCHANGED --
    read the person_name/family_message_word/opinion_word paragraphs below
    with the understanding that "tags aren't unit-scoped, so sharing the tag
    string is fine" was the bug, not a mitigation: it is true for Endless
    Practice and false for the unit checkpoint.

    Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-06,
    same pass as this bundle's a1_unit03.yaml sibling (see that file's
    notes for the full extension rationale and verification method) --
    this is the second and last A2-level en-prs practice pack this pass
    adds, matching prs's own second A2 realization unit (a debate
    between two students, پروین and احمد, about studying abroad).
    Smaller unit (4 lessons), so a smaller template set is expected.

    Two groups: opinion_word (نظر/دلیل/تحصیل/خارج/وطن, 5 members) from
    lesson01, and person_name (پروین/احمد, 2 members -- matching_pairs/
    translation only, reusing the same "person_name" semantic tag this
    bundle's a1_unit07.yaml already established for فرید/همایون/لیمه;
    tags aren't unit-scoped, so sharing the tag string across units is
    fine, each candidate pool is filtered by its own token set anyway)
    from lesson04's debate dialogue. Deliberately skipped the A2-level
    sentence patterns this unit teaches (به نظر من ... چون ..., من فکر
    نمی‌کنم) as slot fillers -- these are multi-clause constructions,
    not atomic vocabulary, and stay taught/drilled via the lesson's own
    exercises.

    Every fill_in_blank frame embeds the slot in a real Dari sentence
    with visible surrounding context (guide §13), each checked for
    genuine grammatical fit across every member of its slot group (a
    real class of bug caught and fixed in this bundle's other new packs
    this same pass -- e.g. a mixed noun/adjective group that only made
    sense with one specific member plugged in). No listen_select/
    listen_type anywhere. No bare unquoted yes/no/true/false anywhere.

    Verified with a standalone throwaway script reusing
    scripts/_practice_slot_check.py's lexeme_matches()/check_pack()
    against scripts/backfill_lexemes_en_prs.py's real iter_specs()
    output -- 0 problems. scripts/compile_content.py practice-validate
    for the full en-prs pack (units 01-10 together) -- 0 errors/0
    warnings. Needs the standard fresh-context review before import; no
    backfill_lexemes_en_prs.py run has actually happened against a real
    database yet in this pass.

    DEPTH PASS 2026-07-06 (per-unit template audit found this unit thin
    at 7 vs unit02/03/04's 16-24): added opinion_word's remaining word_
    order slot, plus person_name's remaining multiple_choice (pooled via
    the already-unscoped *person_name preset, drawing the same real
    10-candidate course-wide pool the existing name_pair template already
    uses -- exactly mirrors a1_unit07.yaml's own person_name multiple_
    choice template) and word_order (reusing a1_unit02.yaml's own "این
    {person_name} است" frame verbatim) slots -- 7 -> 10 templates. This
    is the real ceiling for this unit without inventing vocabulary or
    extending scripts/backfill_lexemes_en_prs.py's classifier: opinion_
    word and person_name are the only two semantic tags this unit's real
    vocabulary has (verified by re-reading the classifier's own A2
    unit10 section) -- lesson02/lesson04's به نظر من/چون/فکر نمی‌کنم
    sentence patterns are deliberately untagged (multi-clause
    constructions, not atomic vocabulary, per this file's own prior notes
    above), and tagging them would need a classifier change, out of
    scope for a practice-pack-only pass. With both tags now at 5
    templates each (multiple_choice, fill_in_blank, translation,
    matching_pairs, word_order), every PRACTICE_EXERCISE_TYPES member
    this direction supports (no listen_select for prs) is covered.
    Re-verified: scripts/_practice_slot_check.py 0 problems across the
    whole en-prs pack; scripts/compile_content.py practice-validate for
    the full pack -- 0 errors/0 warnings.

    TAGGING-DEPTH PASS 2026-07-07: same audit/fix as the a2_unit09.yaml
    sibling (see that file's matching notes for the full rationale) --
    scripts/backfill_lexemes_en_prs.py was missing backfill_lexemes.py's
    (fa) own whole-phrase auto-derivation and two real, previously-
    untagged word-level lexemes. Added: (1) "family_message_word"
    (پیام/فامیل, 2 real members, lesson03 -- both already-classified
    tokens that had never been given any semantic tag at all; mirrors
    fa's own "family_message_word" tag for پیام/خانواده exactly), and
    (2) "opinion_phrase" (the A2-only whole-phrase auto-derivation, same
    mechanism as a2_unit09's "bureaucracy_phrase"), 7 real distinct
    candidates -- an exact match to fa's own opinion_phrase count.
    Verified both counts via scripts/backfill_lexemes_en_prs.py's actual
    iter_specs() output filtered to level=='a2' per AUTHORING_GUIDE.md
    #18 (never trust the pooled A1+A2 count) -- also reconfirmed
    person_name is already correctly A2-scoped at 3 real members
    (کریم/پروین/احمد; کریم's tag was already unconditional on the bare
    token, not lesson-scoped, so it already applied here pre-existing,
    no change needed). Added 5 new templates: family_message_word's
    remaining matching_pairs/translation (below the multiple_choice
    floor at 2 members, same as fa's own pair), plus opinion_phrase's
    multiple_choice/matching_pairs (7 pairs)/translation, anchored at
    lesson03/lesson04 respectively -- 8 -> 13 templates. Re-verified:
    scripts/_practice_slot_check.py 0 problems across the whole en-prs
    pack; scripts/compile_content.py practice-validate for the full pack
    -- 0 errors/0 warnings.
tag_schema:
  part_of_speech: [noun, proper_noun, phrase]
  agreement_tags:
    semantic: [opinion_word, person_name, family_message_word, opinion_phrase]
slot_presets:
  opinion_word: &opinion_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: opinion_word}}
  person_name: &person_name {language_code: prs, part_of_speech: proper_noun, agreement_tags: {semantic: person_name}}
  # Added 2026-07-07 (tagging-depth pass): پیام/فامیل, 2 real members,
  # matching_pairs/translation only (below the multiple_choice floor).
  family_message_word: &family_message_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: family_message_word}}
  # Every genuine whole-sentence/whole-phrase lexeme this unit's own four
  # lessons introduce (7 real distinct candidates, level a2 -- verified
  # via iter_specs()).
  opinion_phrase: &opinion_phrase {language_code: prs, part_of_speech: phrase, agreement_tags: {semantic: opinion_phrase}}
  # Added 2026-07-24 (polish wave 2, tier-thinness): union of the unit's two
  # noun tags (recipe SS3.1a) -- 7 unit-scoped tokens / 7 distinct glosses.
  unit_noun: &unit_noun {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: [opinion_word, family_message_word]}}
templates:
  # Lesson 1: opinions vocabulary.
  - content_key: practice.en-prs.prs.a2.unit10.lesson01.opinion_gloss.001
    lesson_content_key: prs.a2.unit10.lesson01.opinions_vocabulary
    type: multiple_choice
    frame: {text: "{opinion_word}", language_code: prs, direction: rtl}
    slots: {opinion_word: *opinion_word}
    answer_derivation: {kind: slot_gloss, slot: opinion_word}
    feedback_frame: {text: "{opinion_word} is used when discussing opinions.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a2.unit10.lesson01.opinion_translate.003
    lesson_content_key: prs.a2.unit10.lesson01.opinions_vocabulary
    type: translation
    frame: {text: "{opinion_word}", language_code: en, direction: ltr, slot_rendering: {opinion_word: english_gloss}}
    slots: {opinion_word: *opinion_word}
    answer_derivation: {kind: slot_text, slot: opinion_word}
    feedback_frame: {text: "{opinion_word} is the Dari word for this.", language_code: en, direction: ltr}
  # DROPPED 2026-07-24 (unit-scope DEAD-template fix): opinion_pair.004
  # (matching_pairs, 5 slots over opinion_word) was FLOOR-flagged by
  # scripts/_practice_unit_scope_check.py -- 5 unit-scoped candidates is
  # this unit's genuine ceiling for opinion_word (نظر/دلیل/تحصیل/خارج/وطن,
  # verified via iter_specs()), below the 6-pair floor, and there is no
  # unit-native way to reach 6 distinct nouns without either a new
  # backfill_lexemes_en_prs.py tag or dropping the semantic constraint
  # entirely (which at course scope would pull in inflected/construct
  # forms like پوهنتون‌های/تجربهٔ/وطنم that are not safe matching_pairs
  # display candidates -- a data-quality regression, not a fix). Dropped
  # rather than padded; opinion_word's structured tier still has a live
  # template (opinion_order.005, word_order, no candidate floor) so the
  # tier survives. LOGGED for the coordinator: a real fix needs one more
  # backfill-recognized opinion_word noun in this unit.
  - content_key: practice.en-prs.prs.a2.unit10.lesson01.opinion_order.005
    lesson_content_key: prs.a2.unit10.lesson01.opinions_vocabulary
    # Added 2026-07-06 (practice-pool-sync depth pass): opinion_word's
    # remaining PRACTICE_EXERCISE_TYPES gap (word_order), using the
    # course-wide "این [noun] است" copula pattern already established for
    # other noun categories (e.g. unit03's family_fill, unit09's office_
    # order) -- grammatical for all 5 opinion_word candidates, no
    # invented vocabulary.
    type: word_order
    frame: {text: "این {opinion_word} است", language_code: prs, direction: rtl}
    slots: {opinion_word: *opinion_word}
    answer_derivation: {kind: render_frame, frame: {text: "این {opinion_word} است", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: این [word] است (this is ___).", language_code: en, direction: ltr}

  # Lesson 4: the study-abroad debate dialogue (پروین and احمد).
  - content_key: practice.en-prs.prs.a2.unit10.lesson04.name_translate.002
    lesson_content_key: prs.a2.unit10.lesson04.study_debate_dialogue
    type: translation
    frame: {text: "{person_name}", language_code: en, direction: ltr, slot_rendering: {person_name: english_gloss}}
    slots: {person_name: *person_name}
    answer_derivation: {kind: slot_text, slot: person_name}
    feedback_frame: {text: "{person_name} is this speaker's name in Dari.", language_code: en, direction: ltr}
  # DROPPED 2026-07-24 (unit-scope DEAD-template fix): name_pair.003
  # (matching_pairs, 10 slots over person_name) was DEAD per
  # scripts/_practice_unit_scope_check.py -- generate_checkpoint() scopes
  # candidates to THIS unit's own lexemes only, and this unit's own
  # person_name pool is پروین/احمد (2), not the 10-member course-wide
  # pool the prior notes cited. "This tag isn't unit-scoped" was the bug,
  # not a justification (recipe DO-NOT #2 / SS1.1): it works in Endless
  # Practice and is invisible to the checkpoint. Also dropped
  # name_gloss.004 (multiple_choice over the same tag) for the same
  # reason -- 2 unit-scoped candidates is below the >=3 MC floor. No
  # unit-native way to reach 3+ names: this unit's own dialogue
  # (lesson04.study_debate_dialogue) introduces exactly پروین and احمد,
  # a genuine ceiling. person_name still has two live templates covering
  # lesson04 (name_translate.002, translation; name_order.005,
  # word_order -- no candidate floor), so both the production and
  # structured tiers keep real lesson04 coverage; only the DEAD/FLOOR
  # matching_pairs and multiple_choice were dropped. LOGGED for the
  # coordinator: reaching a real recognition/matching_pairs template for
  # person_name here needs this unit's own dialogue to introduce a third
  # named character, or a backfill change -- not fixable pack-only.
  - content_key: practice.en-prs.prs.a2.unit10.lesson04.name_order.005
    lesson_content_key: prs.a2.unit10.lesson04.study_debate_dialogue
    # Added 2026-07-06, same pass: person_name's remaining
    # PRACTICE_EXERCISE_TYPES gap (word_order), reusing the exact "این
    # {person_name} است" frame a1_unit02.yaml's own person_name word_order
    # template already established course-wide -- grammatical for every
    # person_name candidate, no invented vocabulary.
    type: word_order
    frame: {text: "این {person_name} است", language_code: prs, direction: rtl}
    slots: {person_name: *person_name}
    answer_derivation: {kind: render_frame, frame: {text: "این {person_name} است", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: این [name] است (this is ___).", language_code: en, direction: ltr}

  # Lesson 3: reading a written opinion (پیام/فامیل, added 2026-07-07).
  # DROPPED 2026-07-24 (unit-scope DEAD-template fix): family_message_pair.001
  # (matching_pairs, 2 slots) was FLOOR-flagged -- family_message_word's
  # unit-scoped ceiling is پیام/فامیل (2), far below the 6-pair floor
  # (AUTHORING_GUIDE #16), and it always was (this template pre-dates the
  # floor requirement; it was never going to generate). No unit-native way
  # to reach 6: lesson03's own untagged nouns (خیلی/تجربهٔ/کسب) are
  # inflected/construct forms, not clean matching_pairs display
  # candidates, and widening the semantic constraint would need a
  # backfill change. Dropped rather than padded; family_message_word keeps
  # a live production-tier template below (family_message_translate.002,
  # translation -- no candidate floor) so lesson03 is not left with zero
  # coverage. LOGGED for the coordinator: no structured-tier template is
  # possible for lesson03 without either a new backfill tag/lexeme or a
  # word_order hero-sentence frame authored around پیام/فامیل specifically
  # (out of scope for this pack-only pass since it would need its own
  # single-member anchor tags).
  - content_key: practice.en-prs.prs.a2.unit10.lesson03.message_noun_gloss.009
    lesson_content_key: prs.a2.unit10.lesson03.reading_an_opinion_message
    # Added 2026-07-24 (polish wave 2, tier-thinness): third live
    # recognition-tier template; lesson03 previously had no recognition
    # coverage. Pools the [opinion_word, family_message_word] union -- 7
    # unit-scoped tokens / 7 distinct glosses (>=3 MC floor).
    type: multiple_choice
    frame: {text: "{unit_noun}", language_code: prs, direction: rtl}
    slots: {unit_noun: *unit_noun}
    answer_derivation: {kind: slot_gloss, slot: unit_noun}
    feedback_frame: {text: "{unit_noun} is a noun from this unit's opinion lessons.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a2.unit10.lesson03.family_message_translate.002
    lesson_content_key: prs.a2.unit10.lesson03.reading_an_opinion_message
    type: translation
    frame: {text: "{family_message_word}", language_code: en, direction: ltr, slot_rendering: {family_message_word: english_gloss}}
    slots: {family_message_word: *family_message_word}
    answer_derivation: {kind: slot_text, slot: family_message_word}
    feedback_frame: {text: "{family_message_word} is the Dari word for this.", language_code: en, direction: ltr}

  # Lesson 4: whole taught opinion sentences/phrases, added 2026-07-07.
  - content_key: practice.en-prs.prs.a2.unit10.lesson04.opinion_phrase_choice.006
    lesson_content_key: prs.a2.unit10.lesson04.study_debate_dialogue
    # opinion_phrase pools every genuine whole-sentence/whole-phrase
    # lexeme this unit's own four lessons introduce (7 real distinct
    # candidates, level a2 -- verified via scripts/
    # backfill_lexemes_en_prs.py's iter_specs() filtered to level=='a2'
    # per AUTHORING_GUIDE.md #18). Anchored here at lesson04 since that's
    # where the pool completes.
    type: multiple_choice
    frame: {text: "{opinion_phrase}", language_code: prs, direction: rtl}
    slots: {opinion_phrase: *opinion_phrase}
    answer_derivation: {kind: slot_gloss, slot: opinion_phrase}
    feedback_frame: {text: "This is a sentence or phrase from this unit's study-abroad debate.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a2.unit10.lesson04.opinion_phrase_pair.007
    lesson_content_key: prs.a2.unit10.lesson04.study_debate_dialogue
    type: matching_pairs
    # 7 pairs -- the full real opinion_phrase pool (AUTHORING_GUIDE.md
    # #16), verified via scripts/_practice_slot_check.py.
    frame: {text: "Match each sentence or phrase with its meaning.", language_code: en, direction: ltr}
    slots:
      first: *opinion_phrase
      second: *opinion_phrase
      third: *opinion_phrase
      fourth: *opinion_phrase
      fifth: *opinion_phrase
      sixth: *opinion_phrase
      seventh: *opinion_phrase
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth, seventh]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth, seventh]}
    feedback_frame: {text: "Match each sentence or phrase to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a2.unit10.lesson04.opinion_phrase_translate.008
    lesson_content_key: prs.a2.unit10.lesson04.study_debate_dialogue
    type: translation
    frame: {text: "{opinion_phrase}", language_code: en, direction: ltr, slot_rendering: {opinion_phrase: english_gloss}}
    slots: {opinion_phrase: *opinion_phrase}
    answer_derivation: {kind: slot_text, slot: opinion_phrase}
    feedback_frame: {text: "This sentence or phrase appears in this unit's study-abroad debate.", language_code: en, direction: ltr}
