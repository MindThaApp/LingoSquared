schema_version: "1.0"
pack_key: practice.en-prs.a1.unit33
source_language: en
target_language: prs
unit_content_key: prs.a1.unit33.household
review:
  status: reviewed
  fresh_context: true
  notes: >-
    Authored 2026-07-11, same units 31-40 practice-pool depth-extension
    pass as this bundle's a1_unit31.yaml sibling (see that file's notes
    for the shared pass context). Realization and overlay are both
    status reviewed.

    Two groups: "chore_word" (جاروب/ظرف/پاک/کمک, 4 members, completes
    lesson01 -- "کار خانه" deliberately excluded: its own
    introduced_tokens are the two separate already-existing words
    کار/خانه, not a combined "کار خانه" lexeme, so there is no single
    token to draw into a slot) is the recognition pool -- ظرف is a
    genuine homograph against the existing "within a period of time"
    sense (A2 unit18) -- this unit's sense ("dishes") is special-cased
    by content_key in _classify() so this tag only ever draws the
    dishes sense. "sweep_clean_word" (جاروب/پاک, 2) is the strict subset that
    combines with the taught "باید ... کنم" light-verb frame (جاروب
    کردن/پاک کردن) -- ظرف uses شستن instead, a different light verb, so
    including it would be a composition trap, same class as unit24's
    پیاده/با split.

    Word_order template checked for grammaticality: "باید {sweep_clean_word}
    کنم" (lesson02, matches the real taught "امروز باید جاروب کنم."/
    "باید پاک کنم." -- both members verified against the taught text
    directly, not just reasoned about).

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    No bare unquoted yes/no/true/false anywhere. Verified with
    scripts/_practice_slot_check.py (0 problems) and
    scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context
    review before import.

    Fresh-context review 2026-07-11 (Opus, zero access to authoring
    reasoning; sibling prs-en/en-prs overlays not consulted): PASS, no
    defects, status flipped to reviewed. Verified every slot member is
    taught in this unit or earlier (realizations units <=40); Afghan
    Dari register throughout (مکتب/پوهنتون/سرک/دوکان/پولیس/امبولانس/
    اطفائیه/موتر, no Iranian calques); ZWNJ correct in all می‌-forms and
    compounds; every word_order frame grammatical for EVERY candidate
    filling (composition-trap subsets -- sweep_clean/cook_object/
    field/service/specific_season -- correctly exclude tokens that need
    a different light verb or read unnaturally); matching_pairs pulls
    distinct glosses covering every pair; no listen_select/listen_type
    (Dari has zero TTS); no bare YAML booleans; no snake_case jargon in
    learner-facing text. The three unit31/33 homograph splits (حقوق law
    vs salary, ظرف dishes vs within-period, می‌شویم wash vs become) are
    correctly scoped by content_key in _classify() and by lesson_key in
    prs_agreement_tags(), leaving each other sense untouched.
    practice-validate 0/0 and _practice_slot_check.py clean for the
    full en-prs set.
tag_schema:
  part_of_speech: [noun, adjective]
  agreement_tags:
    semantic: [chore_word, sweep_clean_word]
slot_presets:
  chore_word: &chore_word {language_code: prs, part_of_speech: [noun, adjective], agreement_tags: {semantic: chore_word}}
  sweep_clean_word: &sweep_clean_word {language_code: prs, part_of_speech: [noun, adjective], agreement_tags: {semantic: sweep_clean_word}}
templates:
  # Lesson 1: chore vocabulary.
  - content_key: practice.en-prs.prs.a1.unit33.lesson01.chore_gloss.001
    lesson_content_key: prs.a1.unit33.lesson01.chore_vocabulary
    type: multiple_choice
    frame: {text: "{chore_word}", language_code: prs, direction: rtl}
    slots: {chore_word: *chore_word}
    answer_derivation: {kind: slot_gloss, slot: chore_word}
    feedback_frame: {text: "{chore_word} belongs to this unit's household-chore vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit33.lesson01.chore_pair.002
    lesson_content_key: prs.a1.unit33.lesson01.chore_vocabulary
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four}", language_code: prs, direction: rtl}
    slots: {word_one: *chore_word, word_two: *chore_word, word_three: *chore_word, word_four: *chore_word}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 2: needing to do chores.
  - content_key: practice.en-prs.prs.a1.unit33.lesson02.must_chore_order.001
    lesson_content_key: prs.a1.unit33.lesson02.needing_to_do_chores
    type: word_order
    frame: {text: "باید {sweep_clean_word} کنم", language_code: prs, direction: rtl}
    slots: {sweep_clean_word: *sweep_clean_word}
    answer_derivation: {kind: render_frame, frame: {text: "باید {sweep_clean_word} کنم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: باید [chore] کنم (I need to [chore]).", language_code: en, direction: ltr}

  # Lesson 6: wrap-up.
  - content_key: practice.en-prs.prs.a1.unit33.lesson06.chore_translate.001
    lesson_content_key: prs.a1.unit33.lesson06.wrap_up
    type: translation
    frame: {text: "{chore_word}", language_code: en, direction: ltr, slot_rendering: {chore_word: english_gloss}}
    slots: {chore_word: *chore_word}
    answer_derivation: {kind: slot_text, slot: chore_word}
    feedback_frame: {text: "{chore_word} is the Dari word for this.", language_code: en, direction: ltr}
