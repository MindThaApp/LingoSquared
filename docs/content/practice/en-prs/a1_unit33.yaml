      language_code: en
      direction: ltr
  slots:
    word_one: &id003
      language_code: prs
      part_of_speech:
      - noun
      - adjective
      agreement_tags:
        semantic: chore_word
    word_two: *id003
    word_three: *id003
    word_four: *id003
  slot_relations:
  - kind: distinct
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
  answer_derivation:
    kind: matching_pairs
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
  feedback_frame:
    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit33.lesson06.chore_translate.001.volume_translate.008
  lesson_content_key: prs.a1.unit33.lesson06.wrap_up
  type: translation
  frame:
    text: '{chore_word}'
    language_code: en
    direction: ltr
    slot_rendering:
      chore_word: english_gloss
  slots:
    chore_word:
      language_code: prs
      part_of_speech:
      - noun
      - adjective
      agreement_tags:
        semantic: chore_word
  answer_derivation:
    kind: slot_text
    slot: chore_word
  feedback_frame:
    text: '{chore_word} is the Dari word for this.'
    language_code: en
    direction: ltr
