schema_version: '1.0'
pack_key: practice.en-prs.a1.unit33
source_language: en
target_language: prs
unit_content_key: prs.a1.unit33.household
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'TIER-DEPTH POLISH 2026-07-24 (wave-2 rubric): recognition tier was 1 live template and production tier 2. Added
    (1) lesson03.chore_noun_gloss.001 (multiple_choice, chore_word narrowed to part_of_speech noun -- جاروب/ظرف/کمک, 3
    distinct unit glosses at the floor; distinct POOL from chore_gloss.001, which keeps the noun+adjective pool with پاک);
    (2) lesson01.chore_this_gloss.001 (multiple_choice, frame "این {chore_word} است" over the same noun pool -- این/است
    are course-taught since the early units and the frame reads grammatically for every course-scope candidate: this-is-a
    broom/dishes/help; کجاست and را-دوست-دارم frames were rejected because "کمک کجاست"/"پاک را دوست دارم" fail per-candidate);
    (3) lesson01.clean_room_translate.001 (translation, fixed-sentence SS6.6(b): "The room is clean." -> "اتاق {clean_word}
    است", the unit''s own taught sentence "اتاق پاک است."; clean_word has exactly ONE distinct course-wide token (پاک,
    twice -- a1_unit33 + b1_unit02, same token/gloss) so the fixed English prompt is deterministic). clean_word added to
    tag_schema. Recognition now 3 live, production 3 live. Sentence-frame candidates checked at COURSE scope: chore_word
    nouns have no course-scope extras beyond duplicate کمک entries (same token). No new self-reference (این/است/اتاق are
    not slot candidates). Verified: practice-validate 0 errors; _practice_unit_scope_check.py 0 DEAD / tier-short lines
    gone for this file (the two pre-existing 4-pair matching FLOOR lines are out of this dispatch''s scope and untouched);
    _practice_self_reference_check.py 0 hits; check_dari_register.py 0 new findings. Prior history below.

    Authored 2026-07-11, same units 31-40 practice-pool depth-extension pass as this bundle''s a1_unit31.yaml sibling
    (see that file''s notes for the shared pass context). Realization and overlay are both status reviewed.

    Two groups: "chore_word" (جاروب/ظرف/پاک/کمک, 4 members, completes lesson01 -- "کار خانه" deliberately excluded: its own
    introduced_tokens are the two separate already-existing words کار/خانه, not a combined "کار خانه" lexeme, so there is
    no single token to draw into a slot) is the recognition pool -- ظرف is a genuine homograph against the existing "within
    a period of time" sense (A2 unit18) -- this unit''s sense ("dishes") is special-cased by content_key in _classify() so
    this tag only ever draws the dishes sense. "sweep_clean_word" (جاروب/پاک, 2) is the strict subset that combines with the
    taught "باید ... کنم" light-verb frame (جاروب کردن/پاک کردن) -- ظرف uses شستن instead, a different light verb, so including
    it would be a composition trap, same class as unit24''s پیاده/با split.

    Word_order template checked for grammaticality: "باید {sweep_clean_word} کنم" (lesson02, matches the real taught "امروز
    باید جاروب کنم."/ "باید پاک کنم." -- both members verified against the taught text directly, not just reasoned about).

    No listen_select/listen_type anywhere (en-prs has no TTS voices). No bare unquoted yes/no/true/false anywhere. Verified
    with scripts/_practice_slot_check.py (0 problems) and scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context review before import.

    Fresh-context review 2026-07-11 (Opus, zero access to authoring reasoning; sibling prs-en/en-prs overlays not consulted):
    PASS, no defects, status flipped to reviewed. Verified every slot member is taught in this unit or earlier (realizations
    units <=40); Afghan Dari register throughout (مکتب/پوهنتون/سرک/دوکان/پولیس/امبولانس/ اطفائیه/موتر, no Iranian calques);
    ZWNJ correct in all می‌-forms and compounds; every word_order frame grammatical for EVERY candidate filling (composition-trap
    subsets -- sweep_clean/cook_object/ field/service/specific_season -- correctly exclude tokens that need a different light
    verb or read unnaturally); matching_pairs pulls distinct glosses covering every pair; no listen_select/listen_type (Dari
    has zero TTS); no bare YAML booleans; no snake_case jargon in learner-facing text. The three unit31/33 homograph splits
    (حقوق law vs salary, ظرف dishes vs within-period, می‌شویم wash vs become) are correctly scoped by content_key in _classify()
    and by lesson_key in prs_agreement_tags(), leaving each other sense untouched. practice-validate 0/0 and _practice_slot_check.py
    clean for the full en-prs set.'
tag_schema:
  part_of_speech:
  - noun
  - adjective
  agreement_tags:
    semantic:
    - chore_word
    - sweep_clean_word
    - clean_word
slot_presets:
  chore_noun_word: &chore_noun
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: chore_word
  chore_word: &id001
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: chore_word
  sweep_clean_word: &id002
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: sweep_clean_word
templates:
- content_key: practice.en-prs.prs.a1.unit33.lesson01.chore_gloss.001
  lesson_content_key: prs.a1.unit33.lesson01.chore_vocabulary
  type: multiple_choice
  frame:
    text: '{chore_word}'
    language_code: prs
    direction: rtl
  slots:
    chore_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: chore_word
  feedback_frame:
    text: '{chore_word} belongs to this unit''s household-chore vocabulary.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit33.lesson01.chore_pair.002
  lesson_content_key: prs.a1.unit33.lesson01.chore_vocabulary
  type: matching_pairs
  frame:
    text: '{word_one} — {word_two} — {word_three} — {word_four}'
    language_code: prs
    direction: rtl
  slots:
    word_one: *id001
    word_two: *id001
    word_three: *id001
    word_four: *id001
  slot_relations:
  - kind: distinct
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
  answer_derivation:
    kind: matching_pairs
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
  feedback_frame:
    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit33.lesson02.must_chore_order.001
  lesson_content_key: prs.a1.unit33.lesson02.needing_to_do_chores
  type: word_order
  frame:
    text: باید {sweep_clean_word} کنم
    language_code: prs
    direction: rtl
  slots:
    sweep_clean_word: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: باید {sweep_clean_word} کنم
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'Word order: باید [chore] کنم (I need to [chore]).'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit33.lesson06.chore_translate.001
  lesson_content_key: prs.a1.unit33.lesson06.wrap_up
  type: translation
  frame:
    text: '{chore_word}'
    language_code: en
    direction: ltr
    slot_rendering:
      chore_word: english_gloss
  slots:
    chore_word: *id001
  answer_derivation:
    kind: slot_text
    slot: chore_word
  feedback_frame:
    text: '{chore_word} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit33.lesson03.chore_noun_gloss.001
  lesson_content_key: prs.a1.unit33.lesson03.asking_for_help
  type: multiple_choice
  frame:
    text: '{chore_word}'
    language_code: prs
    direction: rtl
  slots:
    chore_word: *chore_noun
  answer_derivation:
    kind: slot_gloss
    slot: chore_word
  feedback_frame:
    text: '{chore_word} is one of this unit''s household nouns.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit33.lesson01.chore_this_gloss.001
  lesson_content_key: prs.a1.unit33.lesson01.chore_vocabulary
  type: multiple_choice
  frame:
    text: این {chore_word} است
    language_code: prs
    direction: rtl
  slots:
    chore_word: *chore_noun
  answer_derivation:
    kind: slot_gloss
    slot: chore_word
  feedback_frame:
    text: 'این ... است means "This is ...". Pick the English meaning of the household word.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit33.lesson01.clean_room_translate.001
  lesson_content_key: prs.a1.unit33.lesson01.chore_vocabulary
  type: translation
  frame:
    text: The room is clean.
    language_code: en
    direction: ltr
  slots:
    clean_word:
      language_code: prs
      part_of_speech: adjective
      agreement_tags:
        semantic: clean_word
  answer_derivation:
    kind: render_frame
    frame:
      text: اتاق {clean_word} است
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'The taught pattern is [noun] [adjective] است: اتاق پاک است (The room is clean).'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit33.lesson01.chore_pair.002.volume_match.008
  lesson_content_key: prs.a1.unit33.lesson01.chore_vocabulary
  type: matching_pairs
  frame:
    text: '{word_one} — {word_two} — {word_three} — {word_four}'
    language_code: prs
    direction: rtl
    text_blocks:
