schema_version: "1.0"
pack_key: practice.en-prs.a1.unit18
source_language: en
target_language: prs
unit_content_key: prs.a1.unit18.work
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-07 for the new A1 unit18 (work) realization -- en-prs's
    A1 pack grew 17->19 units this session with zero prior Endless Practice
    coverage, same pass as this bundle's a1_unit19.yaml sibling. Extended
    scripts/backfill_lexemes_en_prs.py's UNIT_FILES tuple; the only
    genuinely new PRS_GLOSSES/PRS_POS entries needed were درس ("lesson")
    and می‌دهد ("he/she gives") -- every other token this unit teaches
    (معلم/مهندس/داکتر/دوکاندار/کار/استم/دفتر/دوکان/شفاخانه/مکتب/در/
    می‌کنم/کجا/می‌کنید/و/است/هر/روز/بشیر/شما/چیست/بلی) was already
    established from earlier units, and لیلا/می‌کند were also already
    established (unit02/unit07 respectively) -- genuinely the same
    lexemes reused, not new entries or homograph collisions.

    Four semantic groups: reuses the existing course-wide "occupation" tag
    (معلم/مهندس/داکتر/دوکاندار, 4 members, established unit02/unit10) as-is.
    New "occupation_workplace" (دفتر/دوکان/شفاخانه/مکتب, 4 members, each
    pairing with one of the 4 occupation members -- معلم<->مکتب،
    داکتر<->شفاخانه، مهندس<->دفتر، دوکاندار<->دوکان -- additive on top of
    each token's existing city_place/shop_word tags, anchored lesson02
    where the pool completes). New "work_verb_form" (می‌کنم/می‌کنید/می‌کند,
    3 members -- a genuine compositional reuse, not a homograph: each
    token always literally means "do/does," and combining any of them
    with the fixed noun کار is grammatically valid regardless of which
    lesson first introduced them, anchored lesson04 where می‌کند
    completes the set). New "teach_word" (درس/می‌دهد, 2 members,
    translation/matching-only -- below the multiple_choice floor,
    anchored lesson05). Also reuses the existing course-wide "person_name"
    tag (لیلا/نگار/etc., now includes both this unit's own characters).

    Five generative word_order templates: "{occupation} استم" (lesson01,
    all 4 occupations combine naturally with the first-person copula),
    "در {occupation_workplace} کار می‌کنم" (lesson02, all 4 workplaces),
    "{occupation} استم و در {occupation_workplace} کار می‌کنم" (lesson03,
    the unit's own "combining" lesson -- 2 independent slots, 16
    combinations, all grammatically valid regardless of real-world
    plausibility, the same generalization precedent already used
    throughout this course's Endless Practice content), "کار
    {work_verb_form}" (lesson04, drills all three persons: I/you-polite/
    he-she work[s]), and "{person_name} {occupation} است" (lesson06,
    matches the dialogue's own لیلا معلم است-style third-person
    statement, generalized across the full course-wide person_name pool).

    No listen_select/listen_type anywhere (en-prs has no TTS voices, per
    AUTHORING_GUIDE.md #14). Zero fill_in_blank templates: this unit's
    real vocabulary doesn't support one safely, matching the standing
    en-prs precedent from units 03-17. scripts/_fill_in_blank_ambiguity_
    check.py reports zero flags. Verified with scripts/_practice_slot_
    check.py (reusing backfill_lexemes_en_prs.py's real iter_specs()
    output) -- every slot has enough distinct candidates.
    scripts/compile_content.py practice-validate for the full en-prs pack
    -- 0 errors/0 warnings. Needs the standard fresh-context review
    before import; no backfill_lexemes_en_prs.py run has happened against
    a real database yet in this pass.
tag_schema:
  part_of_speech: [noun, verb, adjective, adverb, particle, proper_noun]
  agreement_tags:
    semantic: [occupation, occupation_workplace, work_verb_form, teach_word, person_name]
slot_presets:
  # Reuses the existing course-wide "occupation" tag (established unit02/
  # unit10: معلم/مهندس/داکتر/دوکاندار).
  occupation: &occupation {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: occupation}}
  occupation_workplace: &occupation_workplace {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: occupation_workplace}}
  work_verb_form: &work_verb_form {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: work_verb_form}}
  teach_word: &teach_word {language_code: prs, part_of_speech: [noun, verb], agreement_tags: {semantic: teach_word}}
  # Reuses the existing course-wide "person_name" tag.
  person_name: &person_name {language_code: prs, part_of_speech: proper_noun, agreement_tags: {semantic: person_name}}
templates:
  # Lesson 1: occupation vocabulary.
  - content_key: practice.en-prs.prs.a1.unit18.lesson01.occupation_gloss.001
    lesson_content_key: prs.a1.unit18.lesson01.occupation_words
    type: multiple_choice
    frame: {text: "{occupation}", language_code: prs, direction: rtl}
    slots: {occupation: *occupation}
    answer_derivation: {kind: slot_gloss, slot: occupation}
    feedback_frame: {text: "{occupation} names an occupation.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit18.lesson01.occupation_pair.002
    lesson_content_key: prs.a1.unit18.lesson01.occupation_words
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four}", language_code: prs, direction: rtl}
    slots: {word_one: *occupation, word_two: *occupation, word_three: *occupation, word_four: *occupation}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit18.lesson01.occupation_am_order.003
    lesson_content_key: prs.a1.unit18.lesson01.occupation_words
    type: word_order
    frame: {text: "{occupation} استم", language_code: prs, direction: rtl}
    slots: {occupation: *occupation}
    answer_derivation: {kind: render_frame, frame: {text: "{occupation} استم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: [occupation] استم (I am [occupation]).", language_code: en, direction: ltr}

  # Lesson 2: workplace vocabulary.
  - content_key: practice.en-prs.prs.a1.unit18.lesson02.workplace_gloss.001
    lesson_content_key: prs.a1.unit18.lesson02.workplace_words
    type: multiple_choice
    frame: {text: "{occupation_workplace}", language_code: prs, direction: rtl}
    slots: {occupation_workplace: *occupation_workplace}
    answer_derivation: {kind: slot_gloss, slot: occupation_workplace}
    feedback_frame: {text: "{occupation_workplace} names a workplace.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit18.lesson02.workplace_pair.002
    lesson_content_key: prs.a1.unit18.lesson02.workplace_words
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four}", language_code: prs, direction: rtl}
    slots: {word_one: *occupation_workplace, word_two: *occupation_workplace, word_three: *occupation_workplace, word_four: *occupation_workplace}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit18.lesson02.workplace_work_order.003
    lesson_content_key: prs.a1.unit18.lesson02.workplace_words
    type: word_order
    frame: {text: "در {occupation_workplace} کار می‌کنم", language_code: prs, direction: rtl}
    slots: {occupation_workplace: *occupation_workplace}
    answer_derivation: {kind: render_frame, frame: {text: "در {occupation_workplace} کار می‌کنم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: در [workplace] کار می‌کنم (I work in [workplace]).", language_code: en, direction: ltr}

  # Lesson 3: combining a job and a workplace.
  - content_key: practice.en-prs.prs.a1.unit18.lesson03.occupation_workplace_combo_order.001
    lesson_content_key: prs.a1.unit18.lesson03.combining_job_and_place
    type: word_order
    frame: {text: "{occupation} استم و در {occupation_workplace} کار می‌کنم", language_code: prs, direction: rtl}
    slots: {occupation: *occupation, occupation_workplace: *occupation_workplace}
    answer_derivation: {kind: render_frame, frame: {text: "{occupation} استم و در {occupation_workplace} کار می‌کنم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: [occupation] استم و در [workplace] کار می‌کنم (I am [occupation] and I work in [workplace]).", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit18.lesson03.review_pair.002
    lesson_content_key: prs.a1.unit18.lesson03.combining_job_and_place
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six} — {word_seven} — {word_eight}", language_code: prs, direction: rtl}
    slots:
      word_one: *occupation
      word_two: *occupation
      word_three: *occupation
      word_four: *occupation
      word_five: *occupation_workplace
      word_six: *occupation_workplace
      word_seven: *occupation_workplace
      word_eight: *occupation_workplace
    slot_relations:
      - {kind: distinct, slots: [word_one, word_two, word_three, word_four]}
      - {kind: distinct, slots: [word_five, word_six, word_seven, word_eight]}
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six, word_seven, word_eight]}
    feedback_frame: {text: "Match each word to its English meaning -- occupations and workplaces together.", language_code: en, direction: ltr}

  # Lesson 4: reading a work profile.
  - content_key: practice.en-prs.prs.a1.unit18.lesson04.work_verb_gloss.001
    lesson_content_key: prs.a1.unit18.lesson04.reading_a_work_profile
    type: multiple_choice
    frame: {text: "{work_verb_form}", language_code: prs, direction: rtl}
    slots: {work_verb_form: *work_verb_form}
    answer_derivation: {kind: slot_gloss, slot: work_verb_form}
    feedback_frame: {text: "{work_verb_form} combines with کار (کار {work_verb_form}) to mean 'work.'", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit18.lesson04.work_verb_order.002
    lesson_content_key: prs.a1.unit18.lesson04.reading_a_work_profile
    type: word_order
    frame: {text: "کار {work_verb_form}", language_code: prs, direction: rtl}
    slots: {work_verb_form: *work_verb_form}
    answer_derivation: {kind: render_frame, frame: {text: "کار {work_verb_form}", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: کار [verb form] (I/you/he-she work[s], depending on the verb form).", language_code: en, direction: ltr}

  # Lesson 5: reading a longer work profile.
  - content_key: practice.en-prs.prs.a1.unit18.lesson05.teach_word_translate.001
    lesson_content_key: prs.a1.unit18.lesson05.reading_a_longer_profile
    type: translation
    frame: {text: "{teach_word}", language_code: en, direction: ltr, slot_rendering: {teach_word: english_gloss}}
    slots: {teach_word: *teach_word}
    answer_derivation: {kind: slot_text, slot: teach_word}
    feedback_frame: {text: "{teach_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit18.lesson05.teach_word_pair.002
    lesson_content_key: prs.a1.unit18.lesson05.reading_a_longer_profile
    type: matching_pairs
    frame: {text: "{word_one} — {word_two}", language_code: prs, direction: rtl}
    slots: {word_one: *teach_word, word_two: *teach_word}
    slot_relations: [{kind: distinct, slots: [word_one, word_two]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 6: a dialogue about someone's job.
  - content_key: practice.en-prs.prs.a1.unit18.lesson06.person_name_gloss.001
    lesson_content_key: prs.a1.unit18.lesson06.job_dialogue
    type: multiple_choice
    frame: {text: "{person_name}", language_code: prs, direction: rtl}
    slots: {person_name: *person_name}
    answer_derivation: {kind: slot_gloss, slot: person_name}
    feedback_frame: {text: "{person_name} is a name used in this course.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit18.lesson06.person_occupation_order.002
    lesson_content_key: prs.a1.unit18.lesson06.job_dialogue
    type: word_order
    frame: {text: "{person_name} {occupation} است", language_code: prs, direction: rtl}
    slots: {person_name: *person_name, occupation: *occupation}
    answer_derivation: {kind: render_frame, frame: {text: "{person_name} {occupation} است", language_code: prs, direction: rtl}}
    feedback_frame: {text: "است means is, as in لیلا معلم است (Laila is a teacher).", language_code: en, direction: ltr}
