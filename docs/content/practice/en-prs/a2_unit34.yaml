unit_content_key: prs.a2.unit34.because_so
review: {status: reviewed, required_next_reviewer: native_speaker_review, fresh_context: 'true', notes: 'Fresh-context review 2026-11-27 (en-prs A2 units 34-39 pass): 2 fixes - (1) lesson04.fill.004 and (2) lesson04.translate.005 were dead templates: their anchor w_بنابراین has no lexeme because the backfill classes بنابراین as a particle with no semantic tag, so neither could ever generate. Both now anchor the unit''s own sentence برنامه را تغییر دادیم on w_دادیم (one course-wide candidate); the translation also accepts برنامه را عوض کردیم, the variant the lesson''s overlay accepts. Dumped the unit pool (41 lexemes, 5 lessons; lesson06 has none) and read every gloss; checked every fixed frame at course scope (each anchor has exactly one course-wide candidate) and no self-reference. Capacity after the fix: 29 live templates, ALL 66%, recognition 63%, structured 66%, production 63%, 5/5 lessons in every tier, no dead templates. Backfill items for the coordinator: بنابراین and زیرا carry no semantic tag; هارون is glossed Haroun while the overlays write Haroon. Hand-authored (not derive_target). Lexeme pool read in full. Unit-wide tag en_prs_a2_unit34_words and per-lesson tags drive the broad recognition/production/matching slots (pos noun/verb/adjective/adverb); sentence templates are single-lexeme w_<token> anchors on the unit''s own teaching lines (Kabul Dari, copula است/استم, 2pl -ین). Excluded from every pool: the conjugation-table lexemes (آمدم، آمدی، … and نیامدم، نیامدی، …), the list lexeme ''به دلیل برف، …'', the connector summary ''چون، زیرا، به دلیل: دلیل …'' and the two-sentence reading lines, whose glosses are unanswerable as flashcards (phrase pos is only used in single-lesson pools where every member is one clean sentence: lesson01, lesson03). زیرا (particle) has no semantic tag so no slot can host it without pulling every particle in the course; it is not hosted. Proper nouns مرجان/هارون/نیلوفر are not hosted (no semantic tag; an untagged proper_noun slot would pull all 61 course names and places, some self-glossed such as Kabul). Lesson06 has no lexemes and no introduced_tokens, so it carries no template. Glosses to check: نکردی ''you did not do'' (the unit uses it as the negative past of تیلفون کردن); دادم/دادی/دادیم/می‌دهیم are the plain verb ''give'' although the unit also uses them inside تغییر دادن.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [en_prs_a2_unit34_lesson01_words, en_prs_a2_unit34_lesson02_words, en_prs_a2_unit34_lesson03_words, en_prs_a2_unit34_lesson04_words, en_prs_a2_unit34_lesson05_words, en_prs_a2_unit34_words, w_خسته, w_دادم, w_دادیم, w_سردرد, w_ماندم, w_ماندیم, w_مصروف, w_می‌دهیم, w_نکردی, w_نیامدم, w_نیامدند]
