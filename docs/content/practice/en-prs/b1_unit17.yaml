schema_version: '1.0'
pack_key: practice.en-prs.b1.unit17
source_language: en
target_language: prs
unit_content_key: prs.b1.unit17.regrets
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    en-prs B1 practice pack (unit17 regrets), authored 2026-11-06. THIN: 13 lexemes over 5 of 6 lessons (lesson06 wrapup has none). Pool for MC/matching/translation = UNION of lesson01-04 tags (10 content tokens: درس، می‌خواندم، می‌خواند، خوانده، آمده، می‌گذراندم، نگذراندم، نگذراند، متأسفانه، دفعهٔ). Untagged کاش (particle) is outside every pool.
        MIS-GLOSS EXCLUSION (recipe 0.1): می‌خورد is glossed "eats; takes" but the unit teaches the collocation افسوس می‌خورد = "feels regret"; it is kept out by omitting the lesson05 tag from the broad pool. Same omission drops افسوس and می‌گذراند from MC/matching pools; lesson05 is hosted only by the single-candidate fill (افسوس, lesson05 tag + pos noun) and a single-candidate bare-word translation, so recognition covers lessons 1-4 only (below the all-lesson recognition coverage bar, deliberate). Coordinator: route a backfill gloss fix for می‌خورد.
        Anchors: درس (lesson01 noun), متأسفانه (lesson03 adverb), دفعهٔ (lesson04 noun), افسوس (lesson05 noun), word_order خوانده/آمده in 'کاش زودتر {item} بودم' (lesson02 verbs, both grammatical). Unit-specific lesson tags so unit = course scope.
        15 templates: MC x4, fill x4, word_order x1, matching x1, translation x5. No listen_select (no prs TTS).
        Review 2026-11-06 (author pass, unreviewed): needs the standard
        fresh-context review before import.

tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_prs_b1_unit17_lesson01_words
    - en_prs_b1_unit17_lesson02_words
    - en_prs_b1_unit17_lesson03_words
    - en_prs_b1_unit17_lesson04_words
    - en_prs_b1_unit17_lesson05_words
    - en_prs_b1_unit17_words
slot_presets:
  unit_word: &uw
    language_code: prs
    part_of_speech: [noun, verb, adjective, adverb]
    agreement_tags:
      semantic: [en_prs_b1_unit17_lesson01_words, en_prs_b1_unit17_lesson02_words, en_prs_b1_unit17_lesson03_words, en_prs_b1_unit17_lesson04_words]
