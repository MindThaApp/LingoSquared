    direction: ltr
- content_key: practice.en-prs.prs.b1.unit17.lesson02.match.001
  lesson_content_key: prs.b1.unit17.lesson02.i_wish
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: prs, direction: rtl}
  slots:
    first: *uw
    second: *uw
    third: *uw
    fourth: *uw
    fifth: *uw
    sixth: *uw
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
  feedback_frame:
    text: 'Match each Dari word with its English meaning.'
    language_code: en
    direction: ltr
