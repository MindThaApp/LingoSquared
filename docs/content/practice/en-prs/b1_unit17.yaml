  type: fill_in_blank
  frame: {text: 'او {item} می‌خورد، چون بیشتر درس نخواند.', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: en_prs_b1_unit17_lesson05_words
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: 'او افسوس می‌خورد، چون بیشتر درس نخواند. = She regrets it, because she did not study more.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.b1.unit17.lesson02.order.001
  lesson_content_key: prs.b1.unit17.lesson02.i_wish
  type: word_order
  frame: {text: 'کاش زودتر {item} بودم.', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: verb
      agreement_tags:
        semantic: en_prs_b1_unit17_lesson02_words
  answer_derivation:
    kind: render_frame
    frame: {text: 'کاش زودتر {item} بودم.', language_code: prs, direction: rtl}
  feedback_frame:
    text: 'کاش زودتر آمده بودم. = I wish I had come earlier.'
