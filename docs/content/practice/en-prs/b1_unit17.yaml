    direction: ltr
- content_key: practice.en-prs.prs.b1.unit17.lesson04.choose.001
  lesson_content_key: prs.b1.unit17.lesson04.dialogue_exam
  type: multiple_choice
  frame: {text: '{item}', language_code: prs, direction: rtl}
  slots:
    item: *uw
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is from this unit''s vocabulary.'
    language_code: en
    direction: ltr
# lesson05 recognition: nouns and adverbs of the whole unit (درس, متأسفانه,
# دفعهٔ, افسوس), so افسوس is recognised without the mis-glossed verb می‌خورد.
- content_key: practice.en-prs.prs.b1.unit17.lesson05.choose.001
  lesson_content_key: prs.b1.unit17.lesson05.reading_regret
  type: multiple_choice
  frame: {text: '{item}', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: [noun, adverb]
      agreement_tags:
        semantic: [en_prs_b1_unit17_lesson01_words, en_prs_b1_unit17_lesson02_words, en_prs_b1_unit17_lesson03_words, en_prs_b1_unit17_lesson04_words, en_prs_b1_unit17_lesson05_words]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is from this unit''s vocabulary.'
    language_code: en
    direction: ltr
# ---- structured ----
- content_key: practice.en-prs.prs.b1.unit17.lesson01.fill.001
  lesson_content_key: prs.b1.unit17.lesson01.should_have
  type: fill_in_blank
  frame: {text: 'من هر روز {item} می‌خوانم.', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: en_prs_b1_unit17_lesson01_words
  answer_derivation: {kind: slot_text, slot: item, accepted_variants: ['کتاب']}
  feedback_frame:
    text: 'من هر روز درس می‌خوانم. = I study every day.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.b1.unit17.lesson03.fill.001
