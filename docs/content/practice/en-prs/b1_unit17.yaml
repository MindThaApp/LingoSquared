    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.b1.unit17.lesson03.choose.001
  lesson_content_key: prs.b1.unit17.lesson03.would_have_been
  type: multiple_choice
  frame: {text: '{item}', language_code: prs, direction: rtl}
