  frame: {text: '{item} امتحان را نگذراندم.', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: adverb
      agreement_tags:
        semantic: en_prs_b1_unit17_lesson03_words
  answer_derivation: {kind: slot_text, slot: item, accepted_variants: ['متاسفانه', 'من']}
  feedback_frame:
    text: 'متأسفانه امتحان را نگذراندم. = Unfortunately I did not pass the exam.'
