    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
  feedback_frame:
    text: 'Match each Dari word with its English meaning.'
    language_code: en
    direction: ltr
