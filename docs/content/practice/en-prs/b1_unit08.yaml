schema_version: '1.0'
pack_key: practice.en-prs.b1.unit08
source_language: en
target_language: prs
unit_content_key: prs.b1.unit08.opinions
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    en-prs B1 practice pack (unit08 opinions -- concession/agreement/
    disagreement), authored 2026-07-23. GRAMMAR UNIT: per §8.1, unions ALL
    11 of the unit's own lesson tags (concession_connector, connector_word,
    fuel_word, shop_word, buy_verb, opinion_stance_word, wellbeing_answer,
    identity, understand_verb, opinion_word, debate_word,
    subjunctive_negative_verb, sequence_word, sequence_connector,
    about_preposition) giving 27 distinct unit lexemes, comfortably over
    both the MC and matching_pairs floors. lesson06 (wrapup_production) has
    ZERO of its OWN new lexemes (all its exercises reuse earlier lessons'
    forms) so it carries no anchored template -- lessons 01-05 all have
    lexemes and are anchored. Structured tier uses 4 COURSE-WIDE
    single-member anchors (verified against the b1-level lexeme dump):
    fuel_word (تیل, 1), understand_verb (می‌فهمم, 1), subjunctive_negative_verb
    (نکنیم, 1), about_preposition (دربارهٔ, 1) -- each gives a deterministic
    fill_in_blank/word_order frame. Three of the four reuse sentences
    already authored in the unit's own realization file verbatim ("هرچند
    تیل گران است، اما موتر می‌خرم.", "من مخالف استم، اما دلیل شما را
    می‌فهمم.", "با این حال، فکر می‌کنم عجله نکنیم بهتر است."); دربارهٔ's frame
    is newly composed ("این بحث دربارهٔ موتر بود.") since no existing
    exercise used it, kept simple and unambiguous. concession_connector
    (اگرچه/حال/هرچند, 3 members with divergent syntax -- حال only appears
    in the idiom با این حال) is deliberately NOT used in any fixed-subject
    frame; it only appears in the broad bare-word/MC union. 16 templates: 5
    recognition (MC, one per lesson with lexemes), 6 structured
    (matching_pairs x1 + 3 fill_in_blank + 1 word_order, all single-member
    anchors, at the ideal >=3 count), 5 production (bare-word translation,
    one per lesson with lexemes). Afghan Dari register throughout (verified
    against realizations/prs -- موافق استم/مخالف استم/می‌فهمم are the
    unit's own Kabuli-colloquial forms). No mis-glossed lexemes found. No
    listen_select (no prs TTS).

    Review 2026-10-24 (en-prs practice native-quality pass): 3 fixes. Pool: the
    15-tag course-wide unit_content union (it reached B1 unit01/02/09/10: است,
    چون, و, خوب, استند, ارزان...) is replaced by en_prs_b1_unit08_words
    (noun/verb/adjective/adverb), so 'from this unit's vocabulary' is true;
    particle connectors هرچند/اگرچه/اما/چون leave the bare-word pool (هرچند
    'although' and اگرچه 'although; even though' were an underdetermined typed
    pair). lesson04.fill.001 (نکنیم vs the equally grammatical کنیم) became a
    fixed-English translation; key unchanged. Matching feedback made specific.
    NATIVE FLAGS: (1) 'هرچند ... اما ...' (although ... but) double connector -
    confirm natural. (2) 'دربارهٔ' with hamza vs spoken 'درباره'. (3) 'تیل' for
    petrol/fuel in Kabul usage. (4) 'با این حال، فکر می‌کنم عجله نکنیم بهتر است'
    word order.

tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - concession_connector
    - connector_word
    - fuel_word
    - shop_word
    - buy_verb
    - opinion_stance_word
    - wellbeing_answer
    - identity
    - understand_verb
    - opinion_word
    - debate_word
    - subjunctive_negative_verb
    - sequence_word
    - sequence_connector
    - about_preposition
    - en_prs_b1_unit08_words
slot_presets:
  unit_content: &uc
    language_code: prs
    part_of_speech: [noun, verb, adjective, adverb]
    agreement_tags:
      semantic: en_prs_b1_unit08_words
  fuel_single: &fl
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: fuel_word
  understand_single: &us
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: understand_verb
  not_do_single: &nd
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: subjunctive_negative_verb
  about_single: &ab
    language_code: prs
    part_of_speech: preposition
    agreement_tags:
      semantic: about_preposition
