schema_version: '1.0'
pack_key: practice.en-prs.b1.unit07
source_language: en
target_language: prs
unit_content_key: prs.b1.unit07.hypotheticals
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    en-prs B1 practice pack (unit07 hypotheticals -- present unreal
    conditionals), authored 2026-07-23. GRAMMAR UNIT: per §8.1, the
    per-lesson tag pattern does not reach the floors (most lessons carry
    only 1-2 content words alongside function-word-heavy conditional verb
    forms), so every recognition/production slot unions ALL 12 of the
    unit's own lesson tags (irrealis_have_verb, irrealis_verb,
    irrealis_negative_verb, time_comparative_word, relationship_word,
    practice_word, choice_word, wellbeing_question, time_reference,
    state_adjective, preference_verb, comparative_adjective) giving 25
    distinct unit lexemes -- comfortably clears both the MC and
    matching_pairs floors. Structured tier uses 6 COURSE-WIDE
    single-member anchors (verified against the b1-level lexeme dump,
    not just this unit): irrealis_negative_verb (نمی‌خریدم, unit-only, 1),
    time_comparative_word (زودتر, 1), practice_word (تمرین, 1), choice_word
    (بیشتر, 1), wellbeing_question (چطور, 1), state_adjective (کافی, 1) --
    each therefore serves a deterministic fill_in_blank/word_order/
    fixed-sentence-translation frame with zero grammaticality risk at any
    scope. All six structured frames reuse or adapt sentences already
    authored in the unit's own realization file (e.g. "اگر پول نداشتم،
    موتر نمی‌خریدم.", "می‌شد که با هم تمرین کنیم؟", "هنوز پول کافی ندارد.")
    to keep the Dari register identical to the taught content. 20
    templates: 6 recognition (MC, one per lesson), 6 structured
    (matching_pairs x1 over the union + 3 fill_in_blank + 2 word_order,
    all on single-member anchors), 8 production (6 bare-word translation,
    one per lesson, + 1 fixed-sentence translation on چطور). All 6 lessons
    covered in every tier that has a template anchored to them; every
    lesson has >=1 lexeme. Afghan Dari register throughout (verified
    against realizations/prs -- می‌کردی/می‌رفتیم/داشتین etc. are the unit's
    own forms, not Iranian). No mis-glossed lexemes found. No listen_select
    (no prs TTS).
    Review 2026-10-24 (en-prs practice native-quality pass): 1 fix. MC feedback
    'hypothetical/conditional vocabulary' on a pool that includes دوست, تمرین,
    بزرگ‌تر -> 'this unit's vocabulary'. NATIVE FLAGS: می‌کردی glossed 'you
    would do' (no 'informal' label unlike داشتی), so می‌کردین is not
    distinguishable in the English prompt; 'موتر' (car) and 'می‌شد که ... کنیم؟'
    polite request; fill lesson03 answer نمی‌خریدم is the only accepted form.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - irrealis_have_verb
    - irrealis_verb
    - irrealis_negative_verb
    - time_comparative_word
    - relationship_word
    - practice_word
    - choice_word
    - wellbeing_question
    - time_reference
    - state_adjective
    - preference_verb
    - comparative_adjective
slot_presets:
  unit_content: &uc
    language_code: prs
    part_of_speech: [noun, verb, adjective, adverb]
    agreement_tags:
      semantic:
      - irrealis_have_verb
      - irrealis_verb
      - irrealis_negative_verb
      - time_comparative_word
      - relationship_word
      - practice_word
      - choice_word
      - wellbeing_question
      - time_reference
      - state_adjective
      - preference_verb
      - comparative_adjective
  neg_buy_single: &nb
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: irrealis_negative_verb
  practice_single: &pr
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: practice_word
  more_single: &mr
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: choice_word
  how_single: &hw
    language_code: prs
    part_of_speech: adverb
    agreement_tags:
      semantic: wellbeing_question
  sooner_single: &sn
    language_code: prs
    part_of_speech: adverb
    agreement_tags:
      semantic: time_comparative_word
  enough_single: &en
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: state_adjective
