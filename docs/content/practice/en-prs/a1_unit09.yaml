schema_version: '1.0'
pack_key: practice.en-prs.a1.unit09
source_language: en
target_language: prs
unit_content_key: prs.a1.unit09.dates
review:
  status: unreviewed
  fresh_context: false
  notes: 'Authored 2026-07-07, closing the en-prs practice-pool gap for the real A1 realization''s new unit09 (dates: weekdays,
    Hijri Shamsi calendar months, asking/giving a date, arranging a meeting date -- grew from 8 to 15 A1 units the same night
    this pack was authored; units 12-15 are a separate parallel worker''s lane, not touched here).

    Four groups, all genuine vocabulary confirmed directly against docs/content/realizations/prs/a1_unit09_dates.yaml: weekday_name
    (شنبه/یکشنبه/دوشنبه/سه‌شنبه/چهارشنبه/پنجشنبه/جمعه, 7 members, lesson01), month_name (حمل/ثور/جوزا, 3 members, lesson02),
    ordinal_date (پانزدهم/نوزدهم, 2 members, lesson04), calendar_word (تاریخ/تقویم/هجری/شمسی, 4 members, lesson02). Also extended
    the course-wide person_name pool with بشیر (lesson06''s dialogue speaker) -- reusing the already-large person_name group
    first built for units 02/07 rather than inventing a new tag.

    weekday_name/month_name/ordinal_date are additionally pooled into a single date_word group (12 distinct) for one big matching_pairs
    template, deliberately mirroring the realization''s OWN lesson04.match_date_parts exercise, which pools exactly the same
    three categories (day + ordinal + month) for the same reason.

    No fill_in_blank templates in this pack: every group here has 2+ real distinct candidates and no single-slot frame in
    this unit''s vocabulary has a fixed disambiguating anchor beyond the tag itself (a bare "امروز ___ است" is genuinely answerable
    by any of the 7 weekdays, any of the 3 months, etc.) -- per AUTHORING_GUIDE.md #17, zero fill_in_blank for a unit this
    vocabulary-shaped is the correct call, same as two other units earlier in this same session''s fill_in_blank ambiguity
    pass. word_order templates instead reuse real taught sentence shapes ("امروز [weekday] است" from lesson03/04) generalized
    across their full candidate pool, grammatically checked by hand for every member.

    No listen_select/listen_type anywhere (en-prs has no TTS voices). No bare unquoted yes/no/true/false anywhere.

    Verified with a standalone throwaway script reusing scripts/_practice_slot_check.py''s lexeme_matches()/check_pack() against
    scripts/backfill_lexemes_en_prs.py''s real iter_specs() output (after extending that script''s classifier for units 09-11)
    -- 0 problems. scripts/compile_content.py practice-validate for the full en-prs pack -- 0 errors/0 warnings. scripts/_fill_in_blank_ambiguity_check.py
    -- 0 AMBIGUOUS flags (no fill_in_blank templates exist in this file to flag). Needs the standard fresh-context review
    before import; no backfill_lexemes_en_prs.py run has actually happened against a real database yet in this pass.


    REAUTH 2026-07-24 (unit-scope DEAD-template repair, docs/content/PRACTICE_PACK_RECIPE.md SS1.1/SS3.1): the ''extended
    the course-wide person_name pool with بشیر'' claim above never actually landed in backfill_lexemes_en_prs.py -- بشیر
    is unit04''s lesson06 and a2 unit12''s lesson04 only, both NOT this unit. unit09 itself introduces zero person_name
    lexemes, so person_name_gloss.001 (MC) and person_name_translate.002 (translation) were both DEAD at checkpoint scope
    (recipe DO-NOT #2: constrained to an earlier unit''s vocabulary). PACK-ONLY, so بشیر cannot be added here -- re-anchored
    both templates instead to lesson06''s OWN real vocabulary via a new lesson06_word preset unioning this lesson''s own
    office_word/state_adjective/meeting_verb/ordinal_date tags: وقت "appointment / time", مصروف "busy", می‌بینمت "I''ll see
    you", نوزدهم "19th" -- 4 distinct unit-scoped tokens, no collisions, clears the 3-option MC floor. Slot renamed
    person_name -> item; frame/feedback text genericized accordingly. Also widened calendar_pair.005 (4 slots, below the
    6-pair floor) by unioning calendar_word with this unit''s own month_name (no overlap): تاریخ, تقویم, هجری, شمسی, حمل,
    ثور, جوزا -- 7 distinct, 6 slots used. person_name removed from tag_schema (no longer referenced by any slot).'
tag_schema:
  part_of_speech:
  - noun
  - adjective
  - proper_noun
  - verb
  agreement_tags:
    semantic:
    - weekday_name
    - month_name
    - ordinal_date
    - calendar_word
    - office_word
    - state_adjective
    - meeting_verb
    - volume_en_prs_a1_unit09_weekday_name_10_single
slot_presets:
  weekday_name: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: weekday_name
  month_name: &id002
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: month_name
  ordinal_date: &id004
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: ordinal_date
  calendar_word: &id003
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: calendar_word
  # REAUTH 2026-07-24: replaces person_name (0 unit-scoped candidates --
  # see review.notes). Unions lesson06's own office_word/state_adjective/
  # meeting_verb tags with ordinal_date (also lesson06's نوزدهم) to reach
  # 4 distinct unit-scoped tokens for lesson06's recognition/production
  # templates.
  lesson06_word: &id006
    language_code: prs
    part_of_speech:
    - noun
    - verb
    - adjective
    agreement_tags:
      semantic:
      - office_word
      - state_adjective
      - meeting_verb
      - ordinal_date
  date_word: &id005
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic:
      - weekday_name
      - month_name
      - ordinal_date
  # REAUTH 2026-07-24: widens calendar_word (4 distinct, below the
  # 6-pair matching_pairs floor -- see review.notes) with this unit's
  # own month_name (no token overlap) to reach 7 distinct.
  calendar_and_month: &id007
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic:
      - calendar_word
      - month_name
