schema_version: '1.0'
pack_key: practice.en-prs.a1.unit09
source_language: en
target_language: prs
unit_content_key: prs.a1.unit09.dates
review:
  status: unreviewed
  fresh_context: false
  notes: 'Authored 2026-07-07, closing the en-prs practice-pool gap for the real A1 realization''s new unit09 (dates: weekdays,
    Hijri Shamsi calendar months, asking/giving a date, arranging a meeting date -- grew from 8 to 15 A1 units the same night
    this pack was authored; units 12-15 are a separate parallel worker''s lane, not touched here).

    Four groups, all genuine vocabulary confirmed directly against docs/content/realizations/prs/a1_unit09_dates.yaml: weekday_name
    (شنبه/یکشنبه/دوشنبه/سه‌شنبه/چهارشنبه/پنجشنبه/جمعه, 7 members, lesson01), month_name (حمل/ثور/جوزا, 3 members, lesson02),
    ordinal_date (پانزدهم/نوزدهم, 2 members, lesson04), calendar_word (تاریخ/تقویم/هجری/شمسی, 4 members, lesson02). Also extended
    the course-wide person_name pool with بشیر (lesson06''s dialogue speaker) -- reusing the already-large person_name group
    first built for units 02/07 rather than inventing a new tag.

    weekday_name/month_name/ordinal_date are additionally pooled into a single date_word group (12 distinct) for one big matching_pairs
    template, deliberately mirroring the realization''s OWN lesson04.match_date_parts exercise, which pools exactly the same
    three categories (day + ordinal + month) for the same reason.

    No fill_in_blank templates in this pack: every group here has 2+ real distinct candidates and no single-slot frame in
    this unit''s vocabulary has a fixed disambiguating anchor beyond the tag itself (a bare "امروز ___ است" is genuinely answerable
    by any of the 7 weekdays, any of the 3 months, etc.) -- per AUTHORING_GUIDE.md #17, zero fill_in_blank for a unit this
    vocabulary-shaped is the correct call, same as two other units earlier in this same session''s fill_in_blank ambiguity
    pass. word_order templates instead reuse real taught sentence shapes ("امروز [weekday] است" from lesson03/04) generalized
    across their full candidate pool, grammatically checked by hand for every member.

    No listen_select/listen_type anywhere (en-prs has no TTS voices). No bare unquoted yes/no/true/false anywhere.

    Verified with a standalone throwaway script reusing scripts/_practice_slot_check.py''s lexeme_matches()/check_pack() against
    scripts/backfill_lexemes_en_prs.py''s real iter_specs() output (after extending that script''s classifier for units 09-11)
    -- 0 problems. scripts/compile_content.py practice-validate for the full en-prs pack -- 0 errors/0 warnings. scripts/_fill_in_blank_ambiguity_check.py
    -- 0 AMBIGUOUS flags (no fill_in_blank templates exist in this file to flag). Needs the standard fresh-context review
    before import; no backfill_lexemes_en_prs.py run has actually happened against a real database yet in this pass.'
