unit_content_key: prs.a2.unit39.passing_message
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Authored by hand for the sparse grammar-led unit. Word pools use the single-member w_<token> tags only (plus lesson tags where a clean phrase pool exists); the unit-wide and lesson tags are not used for word pools because they also carry multi-form paradigm phrases (comma lists of six forms) whose glosses are lists. Names (proper nouns) carry no semantic tag and stay out of every pool. fa/prs have no TTS so no listen_select. Anchor frames reuse the unit''s own teaching lines (Kabul Dari, -ین 2pl). Excluded: the three comma-list paradigm phrases in L3 (بیایم..., کنم..., بگویم...), names مینا, حشمت, بهزاد, راحله. L6 has one sentence lexeme only, so its MC uses a mixed words-plus-sentence pool and its word_order/translation use the sentence directly. The L6 gloss spells the name Rahila while the token is راحله (Rahela in the unit''s own list); harmless but inconsistent.'}
