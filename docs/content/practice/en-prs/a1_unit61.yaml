  lesson_content_key: prs.a1.unit61.lesson01.amusement_park_vocabulary
  type: multiple_choice
  frame: {text: '{item}', language_code: prs, direction: rtl}
  slots:
    item: *uw
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is from this unit''s amusement-park vocabulary.'
    language_code: en
    direction: ltr
