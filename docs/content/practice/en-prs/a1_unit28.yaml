schema_version: "1.0"
pack_key: practice.en-prs.a1.unit28
source_language: en
target_language: prs
unit_content_key: prs.a1.unit28.animals
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-11, same A1 units 25-30 practice-pool
    depth-extension pass as this bundle's a1_unit25.yaml sibling (see
    that file's notes for the shared pass context). Realization is
    status reviewed. Vocabulary is genuinely Afghan Dari (پشک for cat,
    not the Iranian گربه) straight from the realization.

    Three groups: "animal_topic_word" (حیوان/سگ/پشک/پرنده/ماهی, 5
    members, completes lesson01; glosses animal/dog/cat/bird/fish all
    distinct) is the recognition pool. "animal_word" (سگ/پشک/پرنده/
    ماهی, 4) excludes the generic حیوان so the taught "یک ... دارم"
    frame never drills the odd "یک حیوان دارم" as a sentence.
    "pet_color_word" (سیاه/سفید, 2, both REUSED existing lexemes) is
    deliberately narrower than unit21's color_word -- سرخ is excluded
    since a red pet is not a sentence this unit teaches.

    Word_order templates checked for grammaticality: "یک {animal_word}
    دارم" (lesson02, matches the real taught "بلی، یک پشک دارم" minus
    the leading بلی، and "سگ دارم", generalized across all 4 animals)
    and "{animal_word} من {pet_color_word} است" (lesson03, composed
    from the taught "سگ من سیاه و بزرگ است" and "سفید است" patterns --
    every combination is a natural Dari sentence).

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    No bare unquoted yes/no/true/false anywhere. Verified with
    scripts/_practice_slot_check.py (0 problems) and
    scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context
    review before import.

    Fresh-context review 2026-07-11 (Opus, zero access to authoring
    reasoning; sibling prs-en/en-prs overlays not consulted): PASS, no
    defects, status flipped to reviewed. Confirmed پشک (cat) is the
    Afghan Dari form, not the Iranian گربه; animal_word excludes the
    generic حیوان so "یک {animal_word} دارم" never renders the odd "یک
    حیوان دارم"; all 8 combinations of "{animal_word} من {pet_color_word}
    است" are natural Dari sentences; both frames appear verbatim in the
    reviewed realization; matching_pairs covers all 5 distinct pairs with
    unique glosses; word_order answers list-shaped; no listen_select/
    listen_type, no bare YAML booleans, no jargon leaks. practice-validate
    0/0 and scripts/_practice_slot_check.py clean for the full en-prs set.

    UNIT-SCOPE DEAD-TEMPLATE + FLOOR FIX 2026-07-24 (checkpoint
    re-authoring pass), two defects:

    (1) lesson03.pet_color_order.001 (word_order) was DEAD: pet_color_word
    (سیاه/سفید) turned out to be entirely REUSED from unit21.lesson02 --
    zero unit-scoped candidates, contradicting the 2026-07-11 review's
    "8 combinations" claim, which was never checked at unit (checkpoint)
    scope. Checked lesson03's whole teaching block for a genuinely fresh
    unit28 lexeme to re-anchor onto instead: none exists -- سیاه/سفید/
    کوچک/بزرگ/رنگ are ALL reused from earlier units (21/19/21/21/21), and
    the one truly fresh lesson01 token (خانگی, "domestic/household") has
    no semantic tag in the backfill script, so it can only be reached by
    dropping `semantic` to bare part_of_speech -- unsafe here because the
    old frame has literal Dari text ("{animal_word} من {pet_color_word}
    است") that must stay grammatical at COURSE scope (§1.1), and an
    untagged adjective slot would pool every a1 adjective course-wide.
    This needs a backfill tag that doesn't exist -- can't add one here
    (pack-only) -- so DROPPED the color/size slot and REPLACED the
    template (renamed pet_ownership_order.001, same type/tier, same
    lesson03 anchor) with a frame built from the pack's own already-vetted
    animal_word tag (4 unit-native members, course-scope-safe: shیر/فیل/
    میمون from unit58 are the only other members, already accepted for
    this exact tag by lesson02's sibling frame): "{animal_word} حیوان
    خانگی من است" ("[animal] is my pet") -- grammatically parallel to the
    unit's own taught example (lesson01: "سگ حیوان خانگی من است."), no
    self-reference (animal_word excludes the literal حیوان token used in
    the frame's fixed text).

    (2) lesson01.animal_pair.002 (matching_pairs) was below the 6-pair
    floor: only 5 slots declared, and animal_topic_word only has 5
    unit-scoped members anyway (حیوان/سگ/پشک/پرنده/ماهی) so widening that
    same tag wouldn't have helped. Added a 6th slot. Rather than reuse
    the shared animal_topic_word preset (which also backs the still-fine
    MC and translation templates -- left untouched), added a
    matching_pairs-only preset `pet_vocab_word` that drops the semantic
    tag entirely and constrains by part_of_speech: [noun, adjective] only
    (the recipe's preferred technique for a frame with no literal
    semantic requirement -- matching_pairs' frame is pure placeholders).
    At unit (checkpoint) scope this yields exactly the unit's own 7
    nominal tokens (the prior 5 plus خانگی "domestic/household" and غذا
    "food", both genuinely introduced in this unit's lesson01/lesson04) --
    all animal/pet-themed, no confusable or duplicate glosses. Re-verified
    with scripts/_practice_unit_scope_check.py (0 DEAD, 0 below-floor for
    this file) and scripts/compile_content.py practice-validate.
tag_schema:
  part_of_speech: [noun, adjective]
  agreement_tags:
    semantic: [animal_topic_word, animal_word, pet_animal]
slot_presets:
  animal_topic_word: &animal_topic_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: animal_topic_word}}
  # pet_animal = unit28's own 4 pets only (backfill_lexemes_en_prs.py):
  # bare animal_word is shared with unit58's zoo animals, which at
  # Endless-Practice course scope rendered "the lion is my pet" through
  # the ownership claim frames below.
  animal_word: &animal_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: pet_animal}}
  # No semantic tag: matching_pairs' frame is pure placeholders (no literal
  # grammatical requirement), so this is the recipe's sanctioned untagged
  # part_of_speech-only pool. At unit (checkpoint) scope it resolves to
  # exactly this unit's own 7 nominal tokens (see review.notes).
  pet_vocab_word: &pet_vocab_word {language_code: prs, part_of_speech: [noun, adjective]}
templates:
  # Lesson 1: animal vocabulary.
  - content_key: practice.en-prs.prs.a1.unit28.lesson01.animal_gloss.001
    lesson_content_key: prs.a1.unit28.lesson01.animal_vocabulary
    type: multiple_choice
    frame: {text: "{animal_topic_word}", language_code: prs, direction: rtl}
    slots: {animal_topic_word: *animal_topic_word}
    answer_derivation: {kind: slot_gloss, slot: animal_topic_word}
    feedback_frame: {text: "{animal_topic_word} belongs to this unit's animal vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit28.lesson01.animal_pair.002
    lesson_content_key: prs.a1.unit28.lesson01.animal_vocabulary
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots: {word_one: *pet_vocab_word, word_two: *pet_vocab_word, word_three: *pet_vocab_word, word_four: *pet_vocab_word, word_five: *pet_vocab_word, word_six: *pet_vocab_word}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 2: do you have a pet?
  - content_key: practice.en-prs.prs.a1.unit28.lesson02.have_animal_order.001
    lesson_content_key: prs.a1.unit28.lesson02.have_a_pet
    type: word_order
    frame: {text: "یک {animal_word} دارم", language_code: prs, direction: rtl}
    slots: {animal_word: *animal_word}
    answer_derivation: {kind: render_frame, frame: {text: "یک {animal_word} دارم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: یک [animal] دارم (I have a [animal]).", language_code: en, direction: ltr}

  # Lesson 3: describing a pet.
  - content_key: practice.en-prs.prs.a1.unit28.lesson03.pet_ownership_order.001
    lesson_content_key: prs.a1.unit28.lesson03.describe_pet
    type: word_order
    frame: {text: "{animal_word} حیوان خانگی من است", language_code: prs, direction: rtl}
    slots: {animal_word: *animal_word}
    answer_derivation: {kind: render_frame, frame: {text: "{animal_word} حیوان خانگی من است", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: [animal] حیوان خانگی من است ([animal] is my pet).", language_code: en, direction: ltr}

  # Lesson 6: wrap-up.
  - content_key: practice.en-prs.prs.a1.unit28.lesson06.animal_translate.001
    lesson_content_key: prs.a1.unit28.lesson06.wrap_up
    type: translation
    frame: {text: "{animal_topic_word}", language_code: en, direction: ltr, slot_rendering: {animal_topic_word: english_gloss}}
    slots: {animal_topic_word: *animal_topic_word}
    answer_derivation: {kind: slot_text, slot: animal_topic_word}
    feedback_frame: {text: "{animal_topic_word} is the Dari word for this.", language_code: en, direction: ltr}
