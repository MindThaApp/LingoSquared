schema_version: '1.0'
pack_key: practice.en-prs.a1.unit56
source_language: en
target_language: prs
unit_content_key: prs.a1.unit56.gym
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    en-prs A1 practice pack (unit56 gym), authored 2026-07-23 per
    docs/content/PRACTICE_PACK_RECIPE.md. THIN UNIT: only 8 lexemes across 4 of
    6 lessons (lesson01: عضویت "membership", وسایل "equipment;things; lesson03:
    کورس "class;course", الماری "locker;cupboard"; lesson04: روز خوش "have a
    good day", کارمند باشگاه "gym staff member"; lesson06: ماهانه "monthly",
    عضویت‌تان "your membership"). lesson02/05 have ZERO lexemes and cannot be
    represented in the checkpoint. unit_word union (gym_word + good_wish +
    service_person_word + bank_notice_word + formal_possessive_word, pos
    [noun, adjective, phrase]) gives exactly the 8 distinct unit glosses --
    clears the matching_pairs 6-pair floor and the MC >=3 floor. Checked each
    of those 5 semantic tags' whole-direction size before using them
    (gym_word=4, good_wish=3, service_person_word=8, bank_notice_word=2,
    formal_possessive_word=13) -- none is a course-wide-huge tag, so the
    broad union is safe for MC/matching_pairs/bare-word translation (no
    literal frame text, so course-scope breadth is not a grammaticality risk
    there). Deliberately did NOT fold in dialogue_word (course-wide 209 at A1)
    even though several of these lexemes carry it too -- unnecessary, since
    the 5 narrower tags already capture every one of the unit's 8 lexemes,
    and folding it in would have made the word_order slot's course-scope pool
    unreviewable.
    word_order narrows to gym_word alone (4 distinct: عضویت, وسایل, کورس,
    الماری) -- checked whole-direction: gym_word appears ONLY in this unit, so
    course scope = unit scope = 4, and all 4 fit "این {item} جدید است." (This
    [item] is new.) grammatically. No fill_in_blank: no semantic
    tag+part_of_speech combination in this unit's pool reduces to exactly one
    course-wide candidate (bank_notice_word+adjective=2, formal_possessive_word
    course-wide=13 with no narrower distinguishing tag available), so a
    single-member anchor could not be constructed without
    `interchangeable: true`, which would be false here -- omitted rather than
    forced.
    11 templates (MC x5, word_order x2, matching_pairs x1, translation x4) --
    one short of the recipe's 12-template floor; flagging as checkpoint-thin,
    capacity-limited by the unit's own lexeme count, not padded with
    untaught/forward vocabulary. All 4 lessons that have lexemes are
    represented in recognition and production; only lesson01/lesson03 (via
    gym_word) get a structured-tier anchor -- lesson04/lesson06's lexemes
    have no safe single-member or narrow-tag structured anchor, so they are
    only reachable via matching_pairs (which pools the whole unit) and
    recognition/production. No mis-glossed lexeme found: every gloss checked
    against the realization/overlay matches what the lesson actually teaches.
    No listen_select (no prs TTS -- AZURE_SPEECH_KEY unset, no Dari voice).
    Needs the standard fresh-context review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - gym_word
    - good_wish
    - service_person_word
    - bank_notice_word
    - formal_possessive_word
slot_presets:
  unit_word: &uw
    language_code: prs
    part_of_speech: [noun, adjective, phrase]
    agreement_tags:
      semantic: [gym_word, good_wish, service_person_word, bank_notice_word, formal_possessive_word]
  gym_only: &gym
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: gym_word
