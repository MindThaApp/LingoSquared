  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - barbershop_word
    - comparative_adjective
    - formal_possessive_word
    - grooming_verb
    - service_person_word
    - want_verb
