schema_version: '1.0'
pack_key: practice.en-prs.a1.unit47
source_language: en
target_language: prs
unit_content_key: prs.a1.unit47.personal_care
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Vocabulary unit (barbershop/personal care), 7 lexemes across 5 lexeme-bearing lessons (lesson04''s
    dialogue introduced zero lexemes of its own -- not anchored). Recognition+production union tag: barbershop_word,
    service_person_word, comparative_adjective, grooming_verb, want_verb, formal_possessive_word (5+5=10).
    Structured: 1 matching_pairs (6 of 7 tokens) + 2 word_order (grooming_verb is a course-wide SINGLE
    candidate -- amroz + verb is grammatical; comparative_adjective has 9 course-wide members, all predicate-adjective-compatible
    with ''in X ast'' -- checked the full course-wide list, all 9 are plain comparative adjectives). 13
    templates, all 3 tiers >=3, all 5 lexeme lessons covered. No mis-glossed lexemes found.


    Review 2026-10-24 (en-prs practice native-quality pass): 3 fixes. (1) MC/translation/matching pools
    narrowed from 46 course-wide barbershop+comparative+want+possessive tokens (incl. unit15 comparatives)
    to the unit''s own 7 words (tag en_prs_a1_unit47_words), making the feedback ''from this unit'' true.
    (2) matching_pairs now deals 6 of the unit''s 7 words. (3) order.005 feedback showed internal placeholder
    ''[comparative]''. NATIVE FLAGS: سلمانی (barbershop) vs دلاک (barber) usage in Kabul; اصلاح for haircut/trim;
    ''امروز می‌تراشم'' (frame order.004) bare ''I shave'' with implicit object.'
  required_next_reviewer: native_speaker_review
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - comparative_adjective
    - en_prs_a1_unit47_words
    - grooming_verb
