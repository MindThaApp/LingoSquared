schema_version: '1.0'
pack_key: practice.en-prs.a1.unit12
source_language: en
target_language: prs
unit_content_key: prs.a1.unit12.routines
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'UNIT-SCOPE REPAIR 2026-07-24 (pack-only): _practice_unit_scope_check.py found
    16 DEAD templates + 1 below-floor. Fixed all 17: wake_time_order.001 (lesson02
    word_order) relied on `ones_number` (introduced a1 unit03/unit04, earlier than
    this unit -- DO-NOT #2) -- DROPPED (no in-unit numeric-time vocab and routine_verb''s
    6 members differ in grammatical person so no single word_order frame could host
    the union) and REPLACED with a multiple_choice at the same lesson02 anchor reusing
    the routine_verb pool. time_period_gloss.003 and routine_and_time_pair.004 relied
    on `time_period` (a1 unit01/unit11, earlier -- same defect class) -- re-anchored
    to a union of this unit''s OWN tags (day_word_pool = routine_word+every_word+early_word,
    4 distinct; routine_and_time_word widened to routine_verb+routine_word+every_word+early_word,
    10 distinct, matching_pairs slots reduced 8->6). person_name_gloss.001 and person_name_pair.002
    relied on `person_name`, which has ZERO unit12-scoped lexemes despite this file''s
    original notes claiming زرمینه/همایون were tagged for it -- LOG FOR COORDINATOR:
    no person_name Lexeme is anchored to unit12 in backfill_lexemes_en_prs.py (verified
    via iter_specs()); a pack-only fix cannot add one. Re-anchored both templates to
    routine_verb / the same 10-token union instead (matching_pairs slots reduced 12->6).
    routine_word_gloss.004 (only 2 distinct glosses, below the 3-option MC floor) widened
    to the same day_word_pool (4 distinct). NOTE: routine_and_time_pair.004 (lesson03)
    and person_name_pair.002 (lesson06) now share the identical 10-token pool -- this
    unit genuinely has only 12 total lexemes across 5 lessons (lesson04 has none), so
    real pool differentiation across 3 matching_pairs anchors is not possible; this
    mirrors the recipe''s SS8.1(2) "anchor per lesson, pool across the unit" pattern
    and is documented here rather than hidden. Post-fix: _practice_unit_scope_check.py
    reports 0 DEAD, 0 below-floor for this pack; practice-validate 0 errors (see coordinator
    report). Pre-existing authoring notes below, retained for provenance.

    Authored 2026-07-07 for the new A1 unit12 (routines) realization, same night the real en-prs A1 realization grew
    8->15 units. A parallel session authored units 09-11''s practice pool separately; this pack (and its 13/14/15 siblings)
    only touches units 12-15, both in scripts/backfill_lexemes_en_prs.py (UNIT_FILES tuple, PRS_GLOSSES/PRS_POS entries, prs_agreement_tags
    additions -- all re-read fresh immediately before editing to avoid clobbering the parallel session''s own unit09-11 additions)
    and here.

    Six groups, all real vocabulary from this unit''s own realization: routine_verb (بیدار می‌شوم/صبحانه می‌خورم/به دفتر می‌روم/شب
    می‌خوابم''s verb heads plus their 2nd/3rd-person forms, 6 members -- می‌شود''s third-person "he/she wakes up" sense required
    a homograph special-case in _classify(), since the bare string می‌شود is ALSO A2 unit09''s unrelated "would it be possible"
    idiom; verified via iter_specs() that the two stay separate Lexeme specs with distinct glosses), routine_word (خواب/صبحانه/دفتر/شب,
    4 members, pools with the existing time_period group for one matching_pairs template), every_word and early_word (هر/زود,
    1 member each -- real single-candidate groups, matching this bundle''s turn_verb precedent from unit06), and person_name
    (زرمینه/همایون, reusing the course-wide 12-member pool -- fixed a real pre-existing gap while extending prs_agreement_tags:
    زرمینه was already glossed from unit05 as a passerby character but never tagged person_name until now, since this is her
    first real practice-pool dialogue use).

    Both fill_in_blank templates (every_word, early_word) are single-project-wide-candidate groups verified via scripts/_fill_in_blank_ambiguity_check.py
    -- not just candidate- count-sufficient but genuinely unambiguous, since the constraint itself can never match more than
    one lexeme. No listen_select/ listen_type anywhere (en-prs has no TTS voices). No bare unquoted yes/no/true/false anywhere.

    Verified with scripts/_practice_slot_check.py (reusing backfill_lexemes_en_prs.py''s real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py practice-validate for the full en-prs pack -- 0 errors/0
    warnings. Needs the standard fresh-context review before import; no backfill_lexemes_en_prs.py run has happened against
    a real database yet in this pass.

    Review 2026-10-24 (en-prs practice native-quality pass): 0 fixes (content checked). NATIVE FLAGS:
    every_word_fill.001 (''___ روز صبحانه می‌خورم.'') and early_word_fill.001 (''به دفتر ___ می‌روم.'') are
    single-answer blanks where another taught word could plausibly fit (e.g. ''به دفتر هر روز می‌روم'');
    می‌شوم/می‌شوی/می‌شود are glossed ''wake up'' but the natural phrase is بیدار می‌شوم, so a learner
    translating ''you wake up'' may type بیدار می‌شوی (see log owner questions).'

tag_schema:
  part_of_speech:
  - noun
  - adjective
  - adverb
  - verb
  - proper_noun
  agreement_tags:
    semantic:
    - routine_verb
    - routine_word
    - time_period
    - every_word
    - early_word
    - person_name
    - ones_number
slot_presets:
  routine_verb: &id001
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: routine_verb
  routine_word: &id002
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: routine_word
  # UNIT-SCOPE REPAIR 2026-07-24: `time_period` has zero unit12-scoped
  # lexemes (it's introduced by a1 unit01/unit11, both earlier than
  # unit12) so any slot constrained to it alone is DEAD at checkpoint
  # scope. Re-anchored to a union of this unit's OWN noun+adverb content
  # tags instead (routine_word + every_word + early_word = 4 distinct:
  # خواب/صبحانه/هر/زود) -- the recipe's SS8.1(1) "union the unit's lesson
  # tags" pattern. Reused by both routine_word_gloss.004 (was: 2 distinct,
  # below the 3-option floor) and time_period_gloss.003 (was: DEAD).
  day_word_pool: &id009
    language_code: prs
    part_of_speech:
    - noun
    - adverb
    agreement_tags:
      semantic:
      - routine_word
      - every_word
      - early_word
  # UNIT-SCOPE REPAIR 2026-07-24: was `routine_word` union'd with
  # `time_period` (a1 unit01/unit11 tag, absent from unit12 -> DEAD).
  # Now the full union of this unit's own content tags (routine_verb +
  # routine_word + every_word + early_word = 10 distinct tokens: the 6
  # می‌شوم/می‌خورم/می‌روم/می‌خوابم/می‌شوی/می‌شود routine_verb forms plus
  # خواب/صبحانه/هر/زود). Reused by routine_and_time_pair.004 (originally
  # 8 slots, reduced to 6 -- the pool of 2 could never fill 8) and
  # person_name_pair.002 (originally 12 slots over the DEAD person_name
  # tag, reduced to 6).
  routine_and_time_word: &id006
    language_code: prs
    part_of_speech:
    - verb
    - noun
    - adverb
    agreement_tags:
      semantic:
      - routine_verb
      - routine_word
      - every_word
      - early_word
  time_period: &id005
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: time_period
  every_word: &id004
    language_code: prs
    part_of_speech: adverb
    agreement_tags:
      semantic: every_word
  early_word: &id007
    language_code: prs
    part_of_speech: adverb
    agreement_tags:
      semantic: early_word
  person_name: &id008
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  ones_number: &id003
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: ones_number
