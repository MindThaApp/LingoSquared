schema_version: '1.0'
pack_key: practice.en-prs.a1.unit12
source_language: en
target_language: prs
unit_content_key: prs.a1.unit12.routines
review:
  status: unreviewed
  fresh_context: false
  notes: 'Authored 2026-07-07 for the new A1 unit12 (routines) realization, same night the real en-prs A1 realization grew
    8->15 units. A parallel session authored units 09-11''s practice pool separately; this pack (and its 13/14/15 siblings)
    only touches units 12-15, both in scripts/backfill_lexemes_en_prs.py (UNIT_FILES tuple, PRS_GLOSSES/PRS_POS entries, prs_agreement_tags
    additions -- all re-read fresh immediately before editing to avoid clobbering the parallel session''s own unit09-11 additions)
    and here.

    Six groups, all real vocabulary from this unit''s own realization: routine_verb (بیدار می‌شوم/صبحانه می‌خورم/به دفتر می‌روم/شب
    می‌خوابم''s verb heads plus their 2nd/3rd-person forms, 6 members -- می‌شود''s third-person "he/she wakes up" sense required
    a homograph special-case in _classify(), since the bare string می‌شود is ALSO A2 unit09''s unrelated "would it be possible"
    idiom; verified via iter_specs() that the two stay separate Lexeme specs with distinct glosses), routine_word (خواب/صبحانه/دفتر/شب,
    4 members, pools with the existing time_period group for one matching_pairs template), every_word and early_word (هر/زود,
    1 member each -- real single-candidate groups, matching this bundle''s turn_verb precedent from unit06), and person_name
    (زرمینه/همایون, reusing the course-wide 12-member pool -- fixed a real pre-existing gap while extending prs_agreement_tags:
    زرمینه was already glossed from unit05 as a passerby character but never tagged person_name until now, since this is her
    first real practice-pool dialogue use).

    Both fill_in_blank templates (every_word, early_word) are single-project-wide-candidate groups verified via scripts/_fill_in_blank_ambiguity_check.py
    -- not just candidate- count-sufficient but genuinely unambiguous, since the constraint itself can never match more than
    one lexeme. No listen_select/ listen_type anywhere (en-prs has no TTS voices). No bare unquoted yes/no/true/false anywhere.

    Verified with scripts/_practice_slot_check.py (reusing backfill_lexemes_en_prs.py''s real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py practice-validate for the full en-prs pack -- 0 errors/0
    warnings. Needs the standard fresh-context review before import; no backfill_lexemes_en_prs.py run has happened against
    a real database yet in this pass.'
tag_schema:
  part_of_speech:
  - noun
  - adjective
  - adverb
  - verb
  - proper_noun
  agreement_tags:
    semantic:
    - routine_verb
    - routine_word
    - time_period
    - every_word
    - early_word
    - person_name
    - ones_number
slot_presets:
  routine_verb: &id001
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: routine_verb
  routine_word: &id002
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: routine_word
  routine_and_time_word: &id006
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic:
      - routine_word
      - time_period
  time_period: &id005
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: time_period
  every_word: &id004
    language_code: prs
    part_of_speech: adverb
    agreement_tags:
      semantic: every_word
  early_word: &id007
    language_code: prs
    part_of_speech: adverb
    agreement_tags:
      semantic: early_word
  person_name: &id008
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  ones_number: &id003
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: ones_number
