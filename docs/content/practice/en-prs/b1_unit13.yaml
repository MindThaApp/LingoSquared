schema_version: '1.0'
pack_key: practice.en-prs.b1.unit13
source_language: en
target_language: prs
unit_content_key: prs.b1.unit13.workplace
review:
  status: reviewed
  fresh_context: 'true'
  notes: en-prs B1 practice pack (unit13 workplace), authored 2026-11-06. GRAMMAR UNIT. Lexeme dump run on the en-prs backfill with the .b1.unit13. filter; every gloss read, no mis-glossed token found.
    All pools use the unit-wide tag en_prs_b1_unit13_words (unit-specific, so unit scope equals course scope) with part_of_speech [noun, verb, adjective, adverb]. fill_in_blank / word_order use single-member
    lesson tags (en_prs_b1_unit13_lessonNN_words narrowed by part_of_speech) so each frame is deterministic and has exactly one course-wide candidate. No listen_select (no prs TTS). Frames use Afghan register;
    no 2pl forms. Needs the standard fresh-context review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_prs_b1_unit13_lesson01_words
    - en_prs_b1_unit13_lesson02_words
    - en_prs_b1_unit13_lesson04_words
    - en_prs_b1_unit13_lesson05_words
