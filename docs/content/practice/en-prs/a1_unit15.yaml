schema_version: "1.0"
pack_key: practice.en-prs.a1.unit15
source_language: en
target_language: prs
unit_content_key: prs.a1.unit15.comparisons
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    UNIT-SCOPE REPAIR 2026-07-24 (pack-only): _practice_unit_scope_check.py found
    14 DEAD templates (12 of them the 12 individually-listed slots of
    person_name_pair.001) + 1 below-floor. person_name_gloss.002 (lesson03 MC) and
    person_name_pair.001 (matching, needed 12, had 0) both relied on `person_name` --
    ZERO unit15-scoped candidates, despite this file's own pre-existing comment
    insisting کریم/نگار are "this lesson's own reading-text subjects" found and fixed
    in an earlier sweep. iter_specs() shows no person_name Lexeme anchored to unit15 --
    کریم/نگار are reused strings already registered to a1 unit14/unit13 respectively
    (the classifier keeps a token's very first registration; a later unit reusing the
    same string gets no fresh row). LOGGED for the coordinator; re-anchored both
    templates to a new comparative_and_height union (comparative_adjective +
    height_word, 9 distinct, on-theme for "comparing people"), person_name_pair.001's
    slots reduced 12->8. connector_word_gloss.001 (lesson04 MC) had only 1 distinct
    (اما) at unit15 scope, below the floor -- widened to connector_and_comparative
    (+ comparative_adjective, 9 distinct). demonstrative_and_comparative_pair.001
    (lesson06 matching_pairs) declared 10 slots but its own comment's "2-member
    demonstrative_word" was wrong -- only آن is unit15-scoped (این is a1 unit01's),
    so the real pool was 9, one short -- slots reduced 10->8. Post-fix:
    _practice_unit_scope_check.py reports 0 DEAD, 0 below-floor (13 templates,
    unchanged count -- every fix was a re-anchor/resize, nothing dropped);
    practice-validate 0 errors (see coordinator report). Pre-existing authoring
    notes below, retained for provenance.

    Authored 2026-07-07 for the new A1 unit15 (comparisons)
    realization, same pass as this bundle's a1_unit12/13/14.yaml
    siblings (see a1_unit12.yaml's notes for the full extension
    context: a parallel session authored units 09-11's practice pool
    separately, this bundle only touches units 12-15).

    Two new groups plus reuse of the course-wide person_name pool:
    comparative_adjective (بزرگ‌تر/کوچک‌تر/گران‌تر/ارزان‌تر/بلندتر/
    جوان‌تر/بهتر/بدتر, 8 members -- this unit's own core vocabulary,
    real vocabulary alone reaches AUTHORING_GUIDE.md #16's 6-12 range
    with zero pooling needed) and connector_word (چون/و/اما, 3
    members -- و required excluding its lesson01 script-ramp
    letter-name occurrence from this new tag, the same lesson_key-
    scoped guard the existing "letter" tag already uses, to avoid
    silently pulling the letter sense into a connector-word drill).
    height_word (قد alone) and demonstrative_word (این/آن) are real
    but thin groups, used for translation only (no multiple_choice,
    since a 1- or 2-member pool can't meet the 3-distinct threshold).

    Deliberately NO fill_in_blank in this unit: comparative_adjective
    (8 members) and connector_word (3 members) are both real
    multi-candidate groups with no natural single-candidate subset (no
    grammatical category like person/number splits them further, unlike
    unit13/14's waiting_word/warm_word), so a single-slot fill_in_blank
    against either would be genuinely ambiguous per AUTHORING_GUIDE.md
    #17 -- relying on multiple_choice/translation/word_order/
    matching_pairs against the same tags instead, per this task's own
    guidance ("if real vocabulary is too thin to safely support a
    fill_in_blank, zero for that unit is fine"). No listen_select/
    listen_type anywhere (en-prs has no TTS voices). No bare unquoted
    yes/no/true/false anywhere.

    Verified with scripts/_practice_slot_check.py (reusing
    backfill_lexemes_en_prs.py's real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py
    practice-validate for the full en-prs pack -- 0 errors/0 warnings.
    scripts/_fill_in_blank_ambiguity_check.py -- zero fill_in_blank
    templates in this file, so nothing to flag. Needs the standard
    fresh-context review before import; no backfill_lexemes_en_prs.py
    run has happened against a real database yet in this pass.

    Review 2026-10-24 (en-prs practice native-quality pass): 14 fixes. comparative_pair.003, person_name_pair.001 and demonstrative_and_comparative_pair.001 dealt the same cards every time (slot count equal or nearly equal to pool size), now 6 slots; re-anchored 6 templates whose pools reached past the anchor lesson (comparative MC/translate/pair to lesson04, person_name_gloss.002, person_name_pair.001, connector_word_gloss/translate to the lesson that teaches اما); reason_order.003 produced nonsense such as bigger because bigger or bigger because cheaper, now این از آن بهتر است چون [بزرگ‌تر/کوچک‌تر] است; compare_order.005 pinned to lesson01 words; agree_order.002 now has آن as in the dialogue; two false feedback lines (joins two clauses; word used when comparing people) made neutral. NATIVE FLAGS: confirm بلندتر است for taller and the pattern این از آن X است as natural Kabul usage; بلی، اما آن [adj] است is an extrapolation of the taught dialogue line.
tag_schema:
  part_of_speech: [noun, adjective, pronoun, particle, proper_noun]
  agreement_tags:
    semantic: [comparative_adjective, connector_word, demonstrative_word, height_word, person_name, en_prs_a1_unit15_lesson01_words]
slot_presets:
  comparative_adjective: &comparative_adjective {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: comparative_adjective}}
  # REVIEW 2026-10-24: lesson01 anchor must only draw lesson01 words (bigger/smaller).
  lesson01_comparative: &lesson01_comparative {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: en_prs_a1_unit15_lesson01_words}}
  connector_word: &connector_word {language_code: prs, part_of_speech: [particle, adjective], agreement_tags: {semantic: connector_word}}
  demonstrative_word: &demonstrative_word {language_code: prs, part_of_speech: pronoun, agreement_tags: {semantic: demonstrative_word}}
  height_word: &height_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: height_word}}
  person_name: &person_name {language_code: prs, part_of_speech: proper_noun, agreement_tags: {semantic: person_name}}
  # UNIT-SCOPE REPAIR 2026-07-24: `person_name` has ZERO unit15-scoped
  # candidates (despite this file's own comment above person_name_pair.001
  # claiming کریم/نگار are "this lesson's own reading-text subjects" --
  # iter_specs() shows no person_name lexeme anchored to unit15 at all;
  # LOGGED for the coordinator). Both person_name_gloss.002 and
  # person_name_pair.001 are anchored to lesson03 (comparing_people), so
  # re-anchored to this unit's own comparative_adjective + height_word
  # union (9 distinct: بزرگ‌تر/کوچک‌تر/گران‌تر/ارزان‌تر/بلندتر/جوان‌تر/
  # بهتر/بدتر + قد) -- on-theme for a "comparing people (height, age)"
  # lesson.
  comparative_and_height: &comparative_and_height {language_code: prs, part_of_speech: [adjective, noun], agreement_tags: {semantic: [comparative_adjective, height_word]}}
  # UNIT-SCOPE REPAIR 2026-07-24: connector_word alone is only 1 distinct
  # (اما) at unit15 scope, below the MC floor. Widened with
  # comparative_adjective (this lesson04's own giving-reasons pairing, as
  # reason_order.003 already does structurally) to reach 9 distinct.
  connector_and_comparative: &connector_and_comparative {language_code: prs, part_of_speech: [particle, adjective], agreement_tags: {semantic: [connector_word, comparative_adjective]}}
templates:
  # Lesson 1: basic comparatives (this/that, bigger/smaller).
  - content_key: practice.en-prs.prs.a1.unit15.lesson01.comparative_gloss.001
    lesson_content_key: prs.a1.unit15.lesson04.giving_reasons
    type: multiple_choice
    frame: {text: "{comparative_adjective}", language_code: prs, direction: rtl}
    slots: {comparative_adjective: *comparative_adjective}
    answer_derivation: {kind: slot_gloss, slot: comparative_adjective}
    feedback_frame: {text: "{comparative_adjective} is a comparative adjective form.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit15.lesson01.comparative_translate.002
    lesson_content_key: prs.a1.unit15.lesson04.giving_reasons
    type: translation
    frame: {text: "{comparative_adjective}", language_code: en, direction: ltr, slot_rendering: {comparative_adjective: english_gloss}}
    slots: {comparative_adjective: *comparative_adjective}
    answer_derivation: {kind: slot_text, slot: comparative_adjective}
    feedback_frame: {text: "{comparative_adjective} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit15.lesson01.comparative_pair.003
    lesson_content_key: prs.a1.unit15.lesson04.giving_reasons
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots: {word_one: *comparative_adjective, word_two: *comparative_adjective, word_three: *comparative_adjective, word_four: *comparative_adjective, word_five: *comparative_adjective, word_six: *comparative_adjective}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each comparative form to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit15.lesson01.demonstrative_translate.004
    lesson_content_key: prs.a1.unit15.lesson01.basic_comparative
    type: translation
    frame: {text: "{demonstrative_word}", language_code: en, direction: ltr, slot_rendering: {demonstrative_word: english_gloss}}
    slots: {demonstrative_word: *demonstrative_word}
    answer_derivation: {kind: slot_text, slot: demonstrative_word}
    feedback_frame: {text: "{demonstrative_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit15.lesson01.compare_order.005
    lesson_content_key: prs.a1.unit15.lesson01.basic_comparative
    type: word_order
    frame: {text: "این از آن {comparative_adjective} است", language_code: prs, direction: rtl}
    slots: {comparative_adjective: *lesson01_comparative}
    answer_derivation: {kind: render_frame, frame: {text: "این از آن {comparative_adjective} است", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: این از آن [adjective] است (this is [adjective] than that, for example: this is bigger than that).", language_code: en, direction: ltr}

  # Lesson 3: comparing people (height, age).
  - content_key: practice.en-prs.prs.a1.unit15.lesson03.height_word_translate.001
    lesson_content_key: prs.a1.unit15.lesson03.comparing_people
    type: translation
    frame: {text: "{height_word}", language_code: en, direction: ltr, slot_rendering: {height_word: english_gloss}}
    slots: {height_word: *height_word}
    answer_derivation: {kind: slot_text, slot: height_word}
    feedback_frame: {text: "{height_word} is the Dari word for this.", language_code: en, direction: ltr}
  # UNIT-SCOPE REPAIR 2026-07-24: person_name has ZERO unit15-scoped
  # candidates -- see comparative_and_height's definition note above.
  # Re-anchored to comparative_and_height (9 distinct).
  - content_key: practice.en-prs.prs.a1.unit15.lesson03.person_name_gloss.002
    lesson_content_key: prs.a1.unit15.lesson04.giving_reasons
    type: multiple_choice
    frame: {text: "{person_name}", language_code: prs, direction: rtl}
    slots: {person_name: *comparative_and_height}
    answer_derivation: {kind: slot_gloss, slot: person_name}
    feedback_frame: {text: "{person_name} is a word from this unit's comparison vocabulary.", language_code: en, direction: ltr}

  # Lesson 4: giving a reason for a comparison.
  # UNIT-SCOPE REPAIR 2026-07-24: connector_word alone is only 1 distinct
  # (اما) at unit15 scope, below the MC floor. Widened to
  # connector_and_comparative (9 distinct).
  - content_key: practice.en-prs.prs.a1.unit15.lesson04.connector_word_gloss.001
    lesson_content_key: prs.a1.unit15.lesson06.comparisons_dialogue
    type: multiple_choice
    frame: {text: "{connector_word}", language_code: prs, direction: rtl}
    slots: {connector_word: *connector_and_comparative}
    answer_derivation: {kind: slot_gloss, slot: connector_word}
    feedback_frame: {text: "{connector_word} is a word from this unit's vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit15.lesson04.connector_word_translate.002
    lesson_content_key: prs.a1.unit15.lesson06.comparisons_dialogue
    type: translation
    frame: {text: "{connector_word}", language_code: en, direction: ltr, slot_rendering: {connector_word: english_gloss}}
    slots: {connector_word: *connector_word}
    answer_derivation: {kind: slot_text, slot: connector_word}
    feedback_frame: {text: "{connector_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit15.lesson04.reason_order.003
    lesson_content_key: prs.a1.unit15.lesson04.giving_reasons
    type: word_order
    # REVIEW 2026-10-24: was two free comparatives ("bigger because cheaper",
    # even "bigger because bigger"). Now this is better than that BECAUSE it is
    # bigger/smaller (lesson01 words), a coherent reason.
    frame: {text: "این از آن بهتر است چون {comparative_adjective} است", language_code: prs, direction: rtl}
    slots: {comparative_adjective: *lesson01_comparative}
    answer_derivation: {kind: render_frame, frame: {text: "این از آن بهتر است چون {comparative_adjective} است", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: این از آن بهتر است چون [reason] است (this is better than that because it is [reason], for example bigger).", language_code: en, direction: ltr}

  # UNIT-SCOPE REPAIR 2026-07-24: `person_name` has ZERO unit15-scoped
  # candidates. The comment below (pre-existing) claims کریم/نگار are
  # "this lesson's own reading-text subjects" and were "found and fixed"
  # during an earlier sweep, but iter_specs() shows no person_name Lexeme
  # anchored to unit15 at all -- کریم/نگار are reused strings already
  # registered to a1 unit14/unit13 respectively, so the classifier never
  # emits a fresh unit15-anchored row for them (same defect class as this
  # file's connector_word/person_name_gloss.002 fixes). LOGGED for the
  # coordinator; a pack-only fix cannot add a unit15-anchored Lexeme.
  # Re-anchored to comparative_and_height (9 distinct, same pool as
  # person_name_gloss.002 above), slots reduced 12->8 (9 >= 8, keeps some
  # combinatorial variety: C(9,8)=9).
  - content_key: practice.en-prs.prs.a1.unit15.lesson05.person_name_pair.001
    lesson_content_key: prs.a1.unit15.lesson05.reading_a_comparison
    type: matching_pairs
    frame: {text: "{person_name_one} — {person_name_two} — {person_name_three} — {person_name_four} — {person_name_five} — {person_name_six}", language_code: prs, direction: rtl}
    slots: {person_name_one: *comparative_and_height, person_name_two: *comparative_and_height, person_name_three: *comparative_and_height, person_name_four: *comparative_and_height, person_name_five: *comparative_and_height, person_name_six: *comparative_and_height}
    slot_relations: [{kind: distinct, slots: [person_name_one, person_name_two, person_name_three, person_name_four, person_name_five, person_name_six]}]
    answer_derivation: {kind: matching_pairs, slots: [person_name_one, person_name_two, person_name_three, person_name_four, person_name_five, person_name_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 6: a dialogue comparing two things while shopping.
  # UNIT-SCOPE REPAIR 2026-07-24: demonstrative_word is only 1 distinct at
  # unit15 scope (آن -- این is registered to a1 unit01, not unit15,
  # despite the comment below claiming 2). Union pool is really 9
  # (1+8), one short of the declared 10 -> was DEAD. Slots reduced 10->8.
  - content_key: practice.en-prs.prs.a1.unit15.lesson06.demonstrative_and_comparative_pair.001
    lesson_content_key: prs.a1.unit15.lesson06.comparisons_dialogue
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots:
      word_one: {language_code: prs, part_of_speech: [pronoun, adjective], agreement_tags: {semantic: [demonstrative_word, comparative_adjective]}}
      word_two: {language_code: prs, part_of_speech: [pronoun, adjective], agreement_tags: {semantic: [demonstrative_word, comparative_adjective]}}
      word_three: {language_code: prs, part_of_speech: [pronoun, adjective], agreement_tags: {semantic: [demonstrative_word, comparative_adjective]}}
      word_four: {language_code: prs, part_of_speech: [pronoun, adjective], agreement_tags: {semantic: [demonstrative_word, comparative_adjective]}}
      word_five: {language_code: prs, part_of_speech: [pronoun, adjective], agreement_tags: {semantic: [demonstrative_word, comparative_adjective]}}
      word_six: {language_code: prs, part_of_speech: [pronoun, adjective], agreement_tags: {semantic: [demonstrative_word, comparative_adjective]}}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit15.lesson06.agree_order.002
    lesson_content_key: prs.a1.unit15.lesson06.comparisons_dialogue
    type: word_order
    frame: {text: "بلی، اما آن {comparative_adjective} است", language_code: prs, direction: rtl}
    slots: {comparative_adjective: *comparative_adjective}
    answer_derivation: {kind: render_frame, frame: {text: "بلی، اما آن {comparative_adjective} است", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: بلی، اما آن [adjective] است (yes, but that one is [adjective], for example cheaper).", language_code: en, direction: ltr}
