schema_version: '1.0'
pack_key: practice.en-prs.a2.unit19
source_language: en
target_language: prs
unit_content_key: prs.a2.unit19.last_weekend
review:
  status: reviewed
  fresh_context: false
  required_next_reviewer: native_speaker_review
  notes: "Authored 2026-10-25 (session 12) for A2 unit 19 \"Last weekend\", which had overlay and realization content\
    \ but no lexemes and no practice pack, so its unit checkpoint returned checkpoint_unavailable. scripts/backfill_lexemes_en_prs.py\
    \ now covers the unit: the unit joins UNIT_FILES_A2, 22 new English-only glosses and parts of speech (infinitives,\
    \ plural and negative past forms, میوه, دوستم), unit-scoped glosses for نرفت, داشت and داشتم (person spelled\
    \ out), and curated pool tags (en_prs_a2_unit19_*) that keep each slot to one grammatical kind (all I-forms,\
    \ all negatives, all forms of one verb). \n\n36 templates over lessons 1, 2, 3, 4 and 5 (lessons 4 and 6 introduce\
    \ no new vocabulary): multiple_choice x10, matching_pairs x6, word_order x4, fill_in_blank x1, translation x15\
    \ (9 bare-word, 6 fixed-sentence). No listen_select (no TTS for prs in the practice runtime), no phrase lexeme\
    \ in any slot. Lesson 5 holds one lexeme (دوستم): hosted by the production tier only. Unhosted: ما and آن‌ها\
    \ (only two pronouns, below the three-option minimum).\n\nFixed-sentence translations use one-member anchor\
    \ tags and carry answer_derivation.accepted_variants for the word orders the unit teaches (pronoun added, time\
    \ words swapped). English contraction expansions are folded by the shared grader and are not listed.\n\nNATIVE\
    \ SPEAKER CHECK (items for the reviewer):\n(1) Glosses of the new forms: رفتین \"you (plural) went\" and خوردین\
    \ \"you (plural) ate\" (the unit uses -ین as the written Dari second-person plural; the realization asks whether\
    \ -ید would be better, open question 6); رفتند \"they went\".\n(2) Accepted variants: من پنجشنبه عصر به بانک\
    \ رفتم, عصر پنجشنبه به بانک رفتم, من دیروز صبحانه خوردم, دیروز من صبحانه خوردم, یک فلم دیدم. Please confirm\
    \ each is natural Dari.\n(3) Frames: دیروز X و Y with two of رفتم، خوردم، دیدم (for example \"دیروز دیدم و رفتم\"\
    \ is grammatical but odd), اول X، بعد Y، در آخر Z with the three I-forms, and joins of two negatives such as\
    \ نرفتم و ندیدم.\n(4) The bare-word English prompt \"my friend\" accepts only دوستم, the possessive form the\
    \ unit teaches.\n(5) The gloss \"I became\" for شدم and the pool mix of رفتم, خوردم, دیدم, شدم, داشتم in the\
    \ recognition item; the reviewer may drop شدم.\n(6) فلم (film) and عصر (afternoon/evening) follow the unit's\
    \ own Dari wording.\n(7) The single fill_in_blank (a verb slot with one candidate) may be dropped by the reviewer.\n\
    \nPool tags: slots use the unit's own first-introduced tokens only. Tokens that earlier A2 units already introduced\
    \ (به، بانک، کردم، خریدم ...) are not in these pools. Dari register only (Afghan forms); the fa lane was not\
    \ opened. Needs the standard fresh-context review before import."
