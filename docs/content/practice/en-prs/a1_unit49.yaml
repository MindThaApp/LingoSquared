schema_version: '1.0'
pack_key: practice.en-prs.a1.unit49
source_language: en
target_language: prs
unit_content_key: prs.a1.unit49.laundry
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Vocabulary unit (laundry), 6 lexemes -- exactly the matching_pairs floor -- across 4 lexeme-bearing
    lessons (lesson04/05 introduced zero lexemes of their own). Recognition+production union: laundry_word,
    wash_verb, ready_word, formal_possessive_word (4 lessons x2 = 8). Structured: 1 matching_pairs (all
    6 tokens), 1 fill_in_blank on ready_word (course-wide SINGLE candidate تیار -- satisfies the compiler''s
    single-candidate hard requirement), 1 word_order on wash_verb (course-wide SINGLE candidate بشویم
    -- ''mikhwaham lebasha ra beshuyam'' is the standard Dari subjunctive-purpose construction). Production
    tier gets 1 extra fixed-sentence translation on the same single-candidate ready_word slot (''My clothes
    are ready.''). 12 templates total (the recipe''s floor, exactly), recognition 4, structured 3, production
    5. All 4 lexeme lessons covered in every tier. No mis-glossed lexemes found.


    Review 2026-10-24 (en-prs practice native-quality pass): 4 fixes. (1) MC/translation pools narrowed
    from 18 course-wide ''your X'' possessives (units 46-61) + laundry words to the unit''s own words
    (en_prs_a1_unit49_words + laundry_word, 5 words; لباس شویی‌تان has no unit tag because of the space).
    (2) lesson06 MC/translation and the matching template keep formal_possessive_word so the wrap-up word
    لباس شویی‌تان stays reachable; their feedback no longer claims ''laundry vocabulary from this unit''.
    (3) matching_pairs feedback ''Match each laundry word'' was false for the mixed pool -> neutral. (4)
    fill.004 ''لباس‌های من ___ است'' was open-ended (any adjective) -> ''لباس‌های من فردا ساعت پنج ___
    است.'' (the taught تیار collocation). NATIVE FLAGS: ''لباس‌های من تیار است'' plural subject + singular
    است (colloquial) and alternative لباس‌هایم تیار است; matching pool is mixed-unit (22 words) because
    the unit has only 5 tagged words.'
  required_next_reviewer: native_speaker_review
