schema_version: '1.0'
pack_key: practice.en-prs.a1.unit06
source_language: en
target_language: prs
unit_content_key: prs.a1.unit06.directions
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-06, same pass as this bundle's a1_unit03.yaml
    sibling (see that file's notes for the full extension rationale and verification method).

    Note on dialect authenticity: this unit's own realization review already found and fixed a real bug where "گرد کنین"
    (a mechanical/ rotational term, not genuine direction-giving Dari) had been used throughout instead of the correct "بپیچین"
    -- confirmed the fix fully carried through before building any template on top of it, so every frame below correctly uses
    بپیچین.

    Two full groups plus one thin single-member group: direction_word (مستقیم/چپ/راست, 3 members), sequence_word (اول/بعد,
    2 members -- matching_pairs/translation only, below the multiple_choice threshold), and turn_verb (بپیچین, 1 member --
    translation/fill_in_ blank only, the verb these direction words combine with). Skipped the thin روبه‌رو/بعد "landmark"
    pairing (بعد is already covered under sequence_word) and the multi-word polite-ask/landmark phrases, matching this bundle's
    standing precedent of not forcing phrase-level content into single-token slots.

    Every fill_in_blank frame embeds the slot in a real Dari sentence with visible surrounding context (guide §13). Every
    lesson_content_key anchor verified against the real realization file. No listen_select/listen_type anywhere. No bare unquoted
    yes/no/true/false anywhere.

    Verified with a standalone throwaway script reusing scripts/_practice_slot_check.py's lexeme_matches()/check_pack() against
    scripts/backfill_lexemes_en_prs.py's real iter_specs() output -- 0 problems. scripts/compile_content.py practice-validate
    for the full en-prs pack (units 01-10 together) -- 0 errors/0 warnings. Needs the standard fresh-context review before
    import; no backfill_lexemes_en_prs.py run has actually happened against a real database yet in this pass.

    REAUTH PASS 2026-07-24 (unit-scope DEAD/FLOOR fix, scripts/_practice_unit_scope_check.py): "direction_word
    (مستقیم/چپ/راست, 3 members)" and "sequence_word (اول/بعد, 2 members)" above measured the WHOLE-DIRECTION pool.
    generate_checkpoint() only loads a unit's own lexemes, and every one of those five tokens turned out to be
    introduced by an EARLIER unit: مستقیم and بعد by unit05, اول by unit01 -- this unit's own direction_word pool
    is only 2 (چپ/راست) and its own sequence_word pool is 0. Worse, lesson03 (sequencing_directions) re-teaches
    ONLY اول/بعد, so it introduces zero lexemes of its own at all -- a genuine backfill gap (recipe SS0), not a
    slot-tag problem, and not fixable pack-only. This left direction_gloss.001 below the multiple_choice floor
    (2<3), direction_pair.004 DEAD (5 slots declared, real ceiling 2), and both lesson03 templates
    (sequence_translate.002, sequence_pair.003) DEAD (0 candidates). Fixed, pack-only, no backfill/realization/
    overlay edits: (1) direction_gloss.001 and direction_translate.003 widened via direction_or_turn (direction_word
    UNION turn_verb = 2+1 = 3 distinct: چپ/راست/بپیچین). (2) direction_pair.004 re-anchored to a new
    unit_content_word preset -- an untagged, part_of_speech-only pool (recipe SS3.1c) spanning every real
    unit06-native content word across lessons 01/04/05/06 (proper_noun excluded so سهیلا's self-gloss never
    appears), 10 distinct. (3) sequence_translate.002 and sequence_pair.003 REMOVED -- lesson03 has no lexemes of
    its own to re-anchor to; logged for the coordinator as a backfill gap (لesson03's اول/بعد need their own
    introduced-token registration in scripts/backfill_lexemes_en_prs.py, out of scope for a pack-only pass). To
    keep the checkpoint's production/recognition tiers viable after that removal (this pack also had ZERO
    templates anchored to lessons 02/04/05/06 before this pass, despite 04/05/06 having real vocabulary of their
    own), ADDED three new templates: lesson05.review_choose.001 (multiple_choice over unit_content_word, restoring
    lesson05 coverage), lesson06.people_choose.001 and lesson06.people_translate.002 (role_word UNION
    travel_farewell_word, plus turn_verb for the multiple_choice floor -- 2/3 distinct respectively), restoring
    lesson06 coverage. Lessons 02 and 03 remain uncovered by any template -- both have 0 introduced tokens of
    their own per iter_specs() and are backfill-blocked, not a defect this pass can close. Post-fix tier counts:
    recognition 3 (direction_gloss, review_choose, people_choose), structured 3 (turn_verb_fill, direction_pair,
    turn_verb_fill.volume_order), production 3 (direction_translate, turn_verb_translate, people_translate) -- all
    three now clear the recipe's >=3-per-tier bar (previously 1/2/2 live). Re-verified 0 DEAD / 0 below-floor for
    this pack via scripts/_practice_unit_scope_check.py and 0 errors via scripts/compile_content.py
    practice-validate (see coordinator report for the exact invocation/output).

    POLISH WAVE 4 (2026-07-26): the direction_pair.004 + review_choose.001 POS-only honest-leave is RESOLVED via the generated en_prs_a1_unit06_words tag (see the unit_content_word preset + direction_pair.004 comments). Course-scope pool now == the unit pool. Verified with pool_check.py + unit-scope check (0 DEAD, 8-pair floor holds; review_choose.001 keeps >=3 distinct glosses).
tag_schema:
  part_of_speech:
  - noun
  - adjective
  - adverb
  - verb
  - preposition
  agreement_tags:
    semantic:
    - direction_word
    - sequence_word
    - turn_verb
    - role_word
    - travel_farewell_word
    - en_prs_a1_unit06_words
slot_presets:
  direction_word: &id001
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: direction_word
  sequence_word: &id004
    language_code: prs
    part_of_speech: adverb
    agreement_tags:
      semantic: sequence_word
  turn_verb: &id003
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: turn_verb
  # REAUTH 2026-07-24 (unit-scope DEAD/FLOOR fix, see review.notes below):
  # direction_word alone has only 2 unit-scoped candidates (چپ/راست --
  # مستقیم, this pack's assumed 3rd member, was actually introduced in
  # unit05). Widened with turn_verb (بپیچین, this unit's own lesson01
  # verb) to clear the multiple_choice 3-option floor.
  direction_or_turn: &direction_or_turn
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    - verb
    agreement_tags:
      semantic:
      - direction_word
      - turn_verb
  # sequence_word has ZERO unit-scoped candidates here -- اول and بعد, the
  # tokens lesson03 re-teaches, were both already introduced in earlier
  # units (unit01 and unit05 respectively) and the backfill classifier's
  # bare-token keying means lesson03 contributes no lexeme of its own to
  # this unit at all (see review.notes: lesson03 is backfill-blocked, not
  # fixable pack-only). direction_and_sequence removed; replaced below by
  # an untagged content-word pool spanning every lesson with real
  # unit06-native vocabulary (POS-only constraint, deliberately excluding
  # proper_noun so سهیلا's self-gloss never appears -- see recipe SS3.1c).
  # POLISH WAVE 4 (2026-07-26): re-anchored onto the generated
  # en_prs_a1_unit06_words tag (backfill_lexemes_en_prs.py now emits it for
  # every first-introduced content token in this unit). preposition dropped
  # because a generated tag only attaches to noun/verb/adjective/adverb, so
  # the tagged unit pool is 9 distinct tokens (چپ/راست/بپیچین/بروم/فهمیدم/
  # روبه‌رو/شماست/دکاندار/سفر) -- direction_pair.004 is trimmed 10->8 slots
  # to fit, and review_choose.001 (which also aliases this preset) now scopes
  # its options to the unit instead of the whole level. Course pool == unit
  # pool; no duplicate-gloss collisions in the 9-token pool.
  unit_content_word: &unit_content_word
    language_code: prs
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: en_prs_a1_unit06_words
  # role_word (دکاندار) UNION travel_farewell_word (سفر) -- lesson06's own
  # tagged nouns, otherwise undrilled by any template in this pack.
  people_and_travel: &people_and_travel
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic:
      - role_word
      - travel_farewell_word
  # Same pool plus turn_verb (بپیچین) to clear the multiple_choice floor
  # for the lesson06-anchored recognition template below.
  people_travel_or_turn: &people_travel_or_turn
    language_code: prs
    part_of_speech:
    - noun
    - verb
    agreement_tags:
      semantic:
      - role_word
      - travel_farewell_word
      - turn_verb
templates:
- content_key: practice.en-prs.prs.a1.unit06.lesson01.direction_gloss.001
  lesson_content_key: prs.a1.unit06.lesson01.direction_words
  type: multiple_choice
  frame:
    text: '{direction_word}'
    language_code: prs
    direction: rtl
  slots:
    direction_word: *direction_or_turn
  answer_derivation:
    kind: slot_gloss
    slot: direction_word
  feedback_frame:
    text: '{direction_word} is a basic direction or turning word.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit06.lesson01.direction_translate.003
  lesson_content_key: prs.a1.unit06.lesson01.direction_words
  type: translation
  frame:
    text: '{direction_word}'
    language_code: en
    direction: ltr
    slot_rendering:
      direction_word: english_gloss
  slots:
    direction_word: *direction_or_turn
  answer_derivation:
    kind: slot_text
    slot: direction_word
  feedback_frame:
    text: '{direction_word} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit06.lesson01.direction_pair.004
  lesson_content_key: prs.a1.unit06.lesson01.direction_words
  type: matching_pairs
  # REAUTH 2026-07-24: was DEAD (declared 5 slots via direction_word UNION
  # sequence_word; direction_word's real unit-scoped pool is only 2 and
  # sequence_word is 0 -- see review.notes). Re-anchored to
  # unit_content_word, an untagged part_of_speech-only pool spanning every
  # real unit06-native content word (proper_noun deliberately excluded so
  # سهیلا's self-gloss never appears) -- a legitimate unit-wide vocabulary
  # review (recipe SS3.1c), 10 distinct: چپ/راست/بپیچین/بروم/فهمیدم/
  # روبه‌رو/روبه‌روی/شماست/دکاندار/سفر.
  # POLISH 2026-07-24 (POS-only matching audit, recipe SS6.3): checked for
  # a semantic-union replacement and there was none -- only 5 of this
  # unit's 11 native tokens carried ANY semantic tag (direction_word 2 +
  # turn_verb 1 + role_word 1 + travel_farewell_word 1 = 5 < the 6-pair
  # floor; بروم/فهمیدم/روبه‌رو/روبه‌روی/شماست were untagged in the backfill,
  # which a pack-only pass could not change). Left POS-only at the time.
  # POLISH WAVE 4 2026-07-26 (RESOLVED): backfill_lexemes_en_prs.py now
  # emits en_prs_a1_unit06_words for every first-introduced content token,
  # so the shared unit_content_word preset is re-anchored onto it (see the
  # preset comment). The tagged pool is 9 distinct (drops the روبه‌روی
  # preposition a generated tag can't carry), so this matcher is trimmed
  # from 10 slots to 8 to fit; course pool == unit pool, off-theme pulls
  # eliminated.
  frame:
    text: '{item_one} — {item_two} — {item_three} — {item_four} — {item_five} — {item_six} — {item_seven} — {item_eight}'
    language_code: prs
    direction: rtl
  slots:
    item_one: *unit_content_word
    item_two: *unit_content_word
    item_three: *unit_content_word
    item_four: *unit_content_word
    item_five: *unit_content_word
    item_six: *unit_content_word
    item_seven: *unit_content_word
    item_eight: *unit_content_word
  slot_relations:
  - kind: distinct
    slots:
    - item_one
    - item_two
    - item_three
    - item_four
    - item_five
    - item_six
    - item_seven
    - item_eight
  answer_derivation:
    kind: matching_pairs
    slots:
    - item_one
    - item_two
    - item_three
    - item_four
    - item_five
    - item_six
    - item_seven
    - item_eight
  feedback_frame:
    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit06.lesson01.turn_verb_fill.005
  lesson_content_key: prs.a1.unit06.lesson01.direction_words
  type: fill_in_blank
  frame:
    text: به راست {turn_verb}.
    language_code: prs
    direction: rtl
  slots:
    turn_verb: *id003
  answer_derivation:
    kind: slot_text
    slot: turn_verb
  feedback_frame:
    text: '{turn_verb} completes ''turn to the right.'''
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit06.lesson01.turn_verb_translate.006
  lesson_content_key: prs.a1.unit06.lesson01.direction_words
  type: translation
  frame:
    text: '{turn_verb}'
    language_code: en
    direction: ltr
    slot_rendering:
      turn_verb: english_gloss
  slots:
    turn_verb: *id003
  answer_derivation:
    kind: slot_text
    slot: turn_verb
  feedback_frame:
    text: '{turn_verb} is the polite imperative form of ''to turn.'''
    language_code: en
    direction: ltr
# sequence_translate.002 and sequence_pair.003 REMOVED 2026-07-24 (REAUTH
# pass, see review.notes below): both anchored to
# prs.a1.unit06.lesson03.sequencing_directions, which introduces ZERO
# lexemes of its own at checkpoint scope -- اول and بعد, the only tokens
# this lesson re-teaches, were already classified under unit01 and unit05
# respectively (bare-token dedup in the backfill classifier). No
# pack-only slot re-anchor can fix a lesson with 0 real lexemes (recipe
# SS0); this is a genuine backfill gap, logged for the coordinator, not
# fixed here. Replaced with two templates below anchored to lesson05/
# lesson06, which DO have real unit06-native vocabulary of their own but
# previously had no template at all.
- content_key: practice.en-prs.prs.a1.unit06.lesson05.review_choose.001
  lesson_content_key: prs.a1.unit06.lesson05.landmark_directions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
  slots:
    item: *unit_content_word
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} appears in this unit''s directions vocabulary.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit06.lesson06.people_choose.001
  lesson_content_key: prs.a1.unit06.lesson06.giving_directions_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
  slots:
    item: *people_travel_or_turn
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} appears in the giving-directions dialogue.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit06.lesson06.people_translate.002
  lesson_content_key: prs.a1.unit06.lesson06.giving_directions_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *people_and_travel
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit06.lesson01.turn_verb_fill.005.volume_order.010
  lesson_content_key: prs.a1.unit06.lesson01.direction_words
  type: word_order
  frame:
    text: به راست {turn_verb}.
    language_code: prs
    direction: rtl
  slots:
    turn_verb:
      language_code: prs
      part_of_speech: verb
      agreement_tags:
        semantic: turn_verb
  answer_derivation:
    kind: render_frame
    frame:
      text: به راست {turn_verb}.
      language_code: prs
      direction: rtl
  feedback_frame:
    text: به راست {turn_verb}.
    language_code: prs
    direction: rtl
