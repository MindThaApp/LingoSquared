schema_version: "1.0"
pack_key: practice.en-prs.a1.unit06
source_language: en
target_language: prs
unit_content_key: prs.a1.unit06.directions
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-06,
    same pass as this bundle's a1_unit03.yaml sibling (see that file's
    notes for the full extension rationale and verification method).

    Note on dialect authenticity: this unit's own realization review
    already found and fixed a real bug where "گرد کنید" (a mechanical/
    rotational term, not genuine direction-giving Dari) had been used
    throughout instead of the correct "بپیچید" -- confirmed the fix
    fully carried through before building any template on top of it, so
    every frame below correctly uses بپیچید.

    Two full groups plus one thin single-member group: direction_word
    (مستقیم/چپ/راست, 3 members), sequence_word (اول/بعد, 2 members --
    matching_pairs/translation only, below the multiple_choice
    threshold), and turn_verb (بپیچید, 1 member -- translation/fill_in_
    blank only, the verb these direction words combine with). Skipped
    the thin روبه‌رو/بعد "landmark" pairing (بعد is already covered
    under sequence_word) and the multi-word polite-ask/landmark
    phrases, matching this bundle's standing precedent of not forcing
    phrase-level content into single-token slots.

    Every fill_in_blank frame embeds the slot in a real Dari sentence
    with visible surrounding context (guide §13). Every
    lesson_content_key anchor verified against the real realization
    file. No listen_select/listen_type anywhere. No bare unquoted
    yes/no/true/false anywhere.

    Verified with a standalone throwaway script reusing
    scripts/_practice_slot_check.py's lexeme_matches()/check_pack()
    against scripts/backfill_lexemes_en_prs.py's real iter_specs()
    output -- 0 problems. scripts/compile_content.py practice-validate
    for the full en-prs pack (units 01-10 together) -- 0 errors/0
    warnings. Needs the standard fresh-context review before import; no
    backfill_lexemes_en_prs.py run has actually happened against a real
    database yet in this pass.
tag_schema:
  part_of_speech: [noun, adjective, adverb, verb]
  agreement_tags:
    semantic: [direction_word, sequence_word, turn_verb]
slot_presets:
  direction_word: &direction_word {language_code: prs, part_of_speech: [noun, adjective], agreement_tags: {semantic: direction_word}}
  sequence_word: &sequence_word {language_code: prs, part_of_speech: adverb, agreement_tags: {semantic: sequence_word}}
  turn_verb: &turn_verb {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: turn_verb}}
  # direction_word (3) and sequence_word (2) are each too thin alone;
  # pooled together for the matching_pairs templates below to reach 5
  # (AUTHORING_GUIDE.md #16) -- both are used in this same unit's
  # direction-giving dialogue, a coherent theme, real vocabulary only.
  direction_and_sequence: &direction_and_sequence {language_code: prs, part_of_speech: [noun, adjective, adverb], agreement_tags: {semantic: [direction_word, sequence_word]}}
templates:
  # Lesson 1: basic direction words.
  - content_key: practice.en-prs.prs.a1.unit06.lesson01.direction_gloss.001
    lesson_content_key: prs.a1.unit06.lesson01.direction_words
    type: multiple_choice
    frame: {text: "{direction_word}", language_code: prs, direction: rtl}
    slots: {direction_word: *direction_word}
    answer_derivation: {kind: slot_gloss, slot: direction_word}
    feedback_frame: {text: "{direction_word} is a basic direction word.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit06.lesson01.direction_fill.002
    lesson_content_key: prs.a1.unit06.lesson01.direction_words
    type: fill_in_blank
    frame: {text: "این جهت {direction_word} است.", language_code: prs, direction: rtl}
    slots: {direction_word: *direction_word}
    answer_derivation: {kind: slot_text, slot: direction_word}
    feedback_frame: {text: "{direction_word} completes 'this direction is ___.'", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit06.lesson01.direction_translate.003
    lesson_content_key: prs.a1.unit06.lesson01.direction_words
    type: translation
    frame: {text: "{direction_word}", language_code: en, direction: ltr, slot_rendering: {direction_word: english_gloss}}
    slots: {direction_word: *direction_word}
    answer_derivation: {kind: slot_text, slot: direction_word}
    feedback_frame: {text: "{direction_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit06.lesson01.direction_pair.004
    lesson_content_key: prs.a1.unit06.lesson01.direction_words
    type: matching_pairs
    # Expanded 2->5 pairs 2026-07-06 (AUTHORING_GUIDE.md #16 retrofit),
    # pooling direction_word with lesson03's sequence_word
    # (direction_and_sequence preset above) -- verified via
    # scripts/_practice_slot_check.py.
    frame: {text: "{direction_word_one} — {direction_word_two} — {direction_word_three} — {direction_word_four} — {direction_word_five}", language_code: prs, direction: rtl}
    slots: {direction_word_one: *direction_and_sequence, direction_word_two: *direction_and_sequence, direction_word_three: *direction_and_sequence, direction_word_four: *direction_and_sequence, direction_word_five: *direction_and_sequence}
    slot_relations: [{kind: distinct, slots: [direction_word_one, direction_word_two, direction_word_three, direction_word_four, direction_word_five]}]
    answer_derivation: {kind: matching_pairs, slots: [direction_word_one, direction_word_two, direction_word_three, direction_word_four, direction_word_five]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit06.lesson01.turn_verb_fill.005
    lesson_content_key: prs.a1.unit06.lesson01.direction_words
    type: fill_in_blank
    frame: {text: "به راست {turn_verb}.", language_code: prs, direction: rtl}
    slots: {turn_verb: *turn_verb}
    answer_derivation: {kind: slot_text, slot: turn_verb}
    feedback_frame: {text: "{turn_verb} completes 'turn to the right.'", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit06.lesson01.turn_verb_translate.006
    lesson_content_key: prs.a1.unit06.lesson01.direction_words
    type: translation
    frame: {text: "{turn_verb}", language_code: en, direction: ltr, slot_rendering: {turn_verb: english_gloss}}
    slots: {turn_verb: *turn_verb}
    answer_derivation: {kind: slot_text, slot: turn_verb}
    feedback_frame: {text: "{turn_verb} is the polite imperative form of 'to turn.'", language_code: en, direction: ltr}

  # Lesson 3: sequencing multi-step directions.
  - content_key: practice.en-prs.prs.a1.unit06.lesson03.sequence_fill.001
    lesson_content_key: prs.a1.unit06.lesson03.sequencing_directions
    type: fill_in_blank
    frame: {text: "{sequence_word} مستقیم بروید.", language_code: prs, direction: rtl}
    slots: {sequence_word: *sequence_word}
    answer_derivation: {kind: slot_text, slot: sequence_word}
    feedback_frame: {text: "{sequence_word} sequences this step of the directions.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit06.lesson03.sequence_translate.002
    lesson_content_key: prs.a1.unit06.lesson03.sequencing_directions
    type: translation
    frame: {text: "{sequence_word}", language_code: en, direction: ltr, slot_rendering: {sequence_word: english_gloss}}
    slots: {sequence_word: *sequence_word}
    answer_derivation: {kind: slot_text, slot: sequence_word}
    feedback_frame: {text: "{sequence_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit06.lesson03.sequence_pair.003
    lesson_content_key: prs.a1.unit06.lesson03.sequencing_directions
    type: matching_pairs
    # Expanded 2->5 pairs 2026-07-06 (AUTHORING_GUIDE.md #16 retrofit),
    # pooling sequence_word with lesson01's direction_word
    # (direction_and_sequence preset above) -- verified via
    # scripts/_practice_slot_check.py.
    frame: {text: "{sequence_word_one} — {sequence_word_two} — {sequence_word_three} — {sequence_word_four} — {sequence_word_five}", language_code: prs, direction: rtl}
    slots: {sequence_word_one: *direction_and_sequence, sequence_word_two: *direction_and_sequence, sequence_word_three: *direction_and_sequence, sequence_word_four: *direction_and_sequence, sequence_word_five: *direction_and_sequence}
    slot_relations: [{kind: distinct, slots: [sequence_word_one, sequence_word_two, sequence_word_three, sequence_word_four, sequence_word_five]}]
    answer_derivation: {kind: matching_pairs, slots: [sequence_word_one, sequence_word_two, sequence_word_three, sequence_word_four, sequence_word_five]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
