schema_version: '1.0'
pack_key: practice.en-prs.a1.unit20
source_language: en
target_language: prs
unit_content_key: prs.a1.unit20.past_events
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Authored 2026-07-09, part of an overnight practice-pool depth-extension pass closing the gap between the practice
    manifest (previously capped at unit19) and the real prs realization depth (now through unit44+). This pass covers units
    20-24 only.

    New groups, all real vocabulary from this unit''s own realization: "past_verb_first" (رفتم/خوردم/کردم/شدم, 4 members --
    شدم/کردم are REUSED existing lexemes from unit02/A2-unit09 respectively, genuinely the same words, not new entries) is
    the unit''s core first-person simple-past paradigm, completed at lesson05 (شدم''s "خسته شدم" occurrence). "go_verb"/"eat_verb"/"work_past_verb"
    are private single-candidate subsets layered on top of past_verb_first (same pattern as AUTHORING_GUIDE''s منتظر/گرم precedent
    from units 13/14), used only where composing with a fixed noun requires ONE SPECIFIC verb for grammaticality -- "دیروز
    صبحانه {X}" only parses with خوردم (breakfast I-ATE), not رفتم/کردم/شدم (breakfast I-went/did/ became is ungrammatical,
    not just implausible), same class of constraint already documented in this file for other units. "past_verb_second" (رفتی/کردی,
    2 members) and "past_verb_third" (رفت/کرد/شد, 3 members) are the matching 2nd/3rd-person forms, both completed in lesson06''s
    dialogue. "time_reference" pools this unit''s new دیروز together with the ALREADY-EXISTING امروز (unit09) and فردا (unit07/13)
    -- additive extension of those two tokens'' tags, not a new parallel group. "tired_word" (خسته, 1 member) is a real single-project-wide-candidate
    group, verified via scripts/_fill_in_blank_ambiguity_check.py.

    Checked for the "fine"/"okay"-sharing-one-gloss trap (this session''s standing awareness) -- no two past_verb_first/second/third
    members share a gloss; all 9 forms have genuinely distinct English glosses. Checked POS uniformity for every multi-member
    tag before using it in multiple_choice/matching_pairs (all past_verb_* members are POS verb, time_reference members are
    POS adverb) -- no POS-restriction gap like the pre-existing politeness/title bugs this session''s methodology doc flags.

    Six word_order templates checked for grammaticality and self- reference risk: "دیروز {go_verb}" (lesson01, matches the
    real taught "دیروز رفتم"), "دیروز صبحانه {eat_verb}" (lesson02, matches "دیروز صبحانه خوردم" exactly), "دیروز کار {work_past_verb}"
    (lesson03, matches "دیروز کار کردم" exactly), "دیروز به دفتر {go_verb}" (lesson04, matches the reading''s own "دیروز به
    دفتر رفتم"), "ساعت هفت {go_verb}" (lesson05, matches the teach item''s own "ساعت هفت رفتم" example), and "{person_name}
    دیروز {past_verb_third}" (lesson06, uses the full course-wide person_name pool -- every name combines grammatically with
    "[name] yesterday [went/did/became]").

    No listen_select/listen_type anywhere (en-prs has no TTS voices). Zero fill_in_blank ambiguity: the one fill_in_blank
    ("{tired_word} شدم") has exactly 1 project-wide candidate (خسته), unambiguous by construction, matches unit17''s condition_word
    precedent exactly.

    Verified with scripts/_practice_slot_check.py (reusing backfill_lexemes_en_prs.py''s real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py practice-validate for the full en-prs pack -- 0 errors/0
    warnings. scripts/_fill_in_blank_ambiguity_check.py -- zero AMBIGUOUS flags. Needs the standard fresh-context review before
    import; no backfill_lexemes_en_prs.py run has happened against a real database yet in this pass.


    REAUTH 2026-07-24 (unit-scope DEAD-template repair, PACK-ONLY, per docs/content/PRACTICE_PACK_RECIPE.md):
    scripts/_practice_unit_scope_check.py found 4 DEAD templates + 1 below-floor in this pack. Root cause: the course-wide
    work_noun_word (کار, established far earlier), routine_word (صبحانه, established unit12), and person_name tags all had ZERO
    unit20-scoped candidates -- this unit reuses them but introduces no new members of its own -- while the bare time_reference
    tag had only 1 unit-scoped member (دیروز), below the multiple_choice 3-option floor, and past_verb_pool_pair.003 declared 9
    slots against a real 8-distinct unit-scoped pool. generate_checkpoint() scopes candidates to this unit''s own lexemes only,
    so every affected slot could never generate at checkpoint scope. No backfill_lexemes_en_prs.py or realization change was
    made (PACK-ONLY lane):
    - time_reference_gloss.001 (lesson01, was FLOOR: 1 candidate) -> widened to time_reference_review_pool (time_reference +
    past_verb_first, 4 distinct: دیروز/رفتم/خوردم/کردم).
    - routine_word_translate.001 (lesson02, was DEAD: 0 candidates) -> re-anchored to eat_verb (1: خوردم), this lesson''s own
    genuinely new token.
    - work_noun_translate.001 (lesson03, was DEAD: 0 candidates) -> re-anchored to work_past_verb (1: کردم), this lesson''s own
    genuinely new token.
    - person_past_order.002 (lesson06, was DEAD: person_name 0 candidates) -> re-anchored from a 2-slot person_name+
    past_verb_third combo to a single past_verb_third slot (3: رفت/کرد/شد), all grammatical in "دیروز [verb]" regardless of
    which fills it.
    - past_verb_pool_pair.003 (lesson06, was DEAD: needed 9, had 8) -> declared slot count reduced 9 -> 8 to match the real
    past_verb_pool union size exactly.
    No new backfill tag, gloss, or lexeme was introduced. Removed the now-fully-unused work_noun_word/routine_word/person_name
    slot_presets and tag_schema entries (nothing in this pack references them anymore). Template count unchanged (16 -- nothing
    dropped, only re-anchored/widened/reduced). Verified with scripts/_practice_unit_scope_check.py (0 DEAD, 0 below-floor for
    this file after the fix), scripts/compile_content.py practice-validate (0 errors), and scripts/check_dari_register.py (0
    new findings) -- see the coordinator report for exact output.

    Review 2026-10-24 (en-prs practice native-quality pass): 5 fixes. time_reference_gloss.001 feedback no longer claims all pool words are this unit''s own (pool spans units); tired_fill.001 frame now carries context (دیروز کار کردم و ___ شدم) instead of a bare ''___ شدم''; tired_fill volume_order feedback was the bare Dari sentence, now an English explanation; person_past_order.002 word_order replaced by a past_verb_third translation (the third-person pool also fills کرد/شد/دید/برد, ungrammatical after a bare دیروز); past_verb_pool_pair.003 feedback no longer says ''in this unit''. NATIVE FLAGS: the third-person gloss of کرد (''did; made (he/she, past)'') is inconsistent with the others (see gloss lane); native speaker to confirm that ''دیروز کار کردم و خسته شدم'' is the natural phrasing.'
tag_schema:
  part_of_speech:
  - noun
  - verb
  - adjective
  - adverb
  - proper_noun
  agreement_tags:
    semantic:
    - past_verb_first
    - go_verb
    - eat_verb
    - work_past_verb
    - tired_word
    - past_verb_second
    - past_verb_third
    - time_reference
    # REAUTH 2026-07-24: work_noun_word, routine_word, and person_name
    # removed -- all had ZERO unit20-scoped candidates (established in
    # earlier units) and every template that used them has been
    # re-anchored to this unit's own tags above. See review.notes.
slot_presets:
  past_verb_first: &id008
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: past_verb_first
  go_verb: &id002
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: go_verb
  eat_verb: &id004
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: eat_verb
  work_past_verb: &id006
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: work_past_verb
  tired_word: &id007
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: tired_word
  past_verb_second: &id012
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: past_verb_second
  past_verb_third: &id009
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: past_verb_third
  past_verb_pool: &id011
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic:
      - past_verb_first
      - past_verb_second
      - past_verb_third
  # REAUTH 2026-07-24 (unit-scope DEAD-template repair, PACK-ONLY): the
  # bare time_reference tag has only 1 unit-scoped candidate (دیروز --
  # امروز/فردا are both reused from earlier units), below the
  # multiple_choice 3-option floor. Widened by unioning with
  # past_verb_first (3: رفتم/خوردم/کردم) -- 4 distinct total, all
  # genuinely this unit's own lesson01/02/03 vocabulary.
  time_reference_review_pool: &time_reference_review_pool
    language_code: prs
    part_of_speech: [adverb, verb]
    agreement_tags:
      semantic:
      - time_reference
      - past_verb_first
  time_reference: &id001
    language_code: prs
    part_of_speech: adverb
    agreement_tags:
      semantic: time_reference
