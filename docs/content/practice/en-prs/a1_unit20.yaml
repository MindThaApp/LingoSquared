schema_version: '1.0'
pack_key: practice.en-prs.a1.unit20
source_language: en
target_language: prs
unit_content_key: prs.a1.unit20.past_events
review:
  status: unreviewed
  fresh_context: false
  notes: 'Authored 2026-07-09, part of an overnight practice-pool depth-extension pass closing the gap between the practice
    manifest (previously capped at unit19) and the real prs realization depth (now through unit44+). This pass covers units
    20-24 only.

    New groups, all real vocabulary from this unit''s own realization: "past_verb_first" (رفتم/خوردم/کردم/شدم, 4 members --
    شدم/کردم are REUSED existing lexemes from unit02/A2-unit09 respectively, genuinely the same words, not new entries) is
    the unit''s core first-person simple-past paradigm, completed at lesson05 (شدم''s "خسته شدم" occurrence). "go_verb"/"eat_verb"/"work_past_verb"
    are private single-candidate subsets layered on top of past_verb_first (same pattern as AUTHORING_GUIDE''s منتظر/گرم precedent
    from units 13/14), used only where composing with a fixed noun requires ONE SPECIFIC verb for grammaticality -- "دیروز
    صبحانه {X}" only parses with خوردم (breakfast I-ATE), not رفتم/کردم/شدم (breakfast I-went/did/ became is ungrammatical,
    not just implausible), same class of constraint already documented in this file for other units. "past_verb_second" (رفتی/کردی,
    2 members) and "past_verb_third" (رفت/کرد/شد, 3 members) are the matching 2nd/3rd-person forms, both completed in lesson06''s
    dialogue. "time_reference" pools this unit''s new دیروز together with the ALREADY-EXISTING امروز (unit09) and فردا (unit07/13)
    -- additive extension of those two tokens'' tags, not a new parallel group. "tired_word" (خسته, 1 member) is a real single-project-wide-candidate
    group, verified via scripts/_fill_in_blank_ambiguity_check.py.

    Checked for the "fine"/"okay"-sharing-one-gloss trap (this session''s standing awareness) -- no two past_verb_first/second/third
    members share a gloss; all 9 forms have genuinely distinct English glosses. Checked POS uniformity for every multi-member
    tag before using it in multiple_choice/matching_pairs (all past_verb_* members are POS verb, time_reference members are
    POS adverb) -- no POS-restriction gap like the pre-existing politeness/title bugs this session''s methodology doc flags.

    Six word_order templates checked for grammaticality and self- reference risk: "دیروز {go_verb}" (lesson01, matches the
    real taught "دیروز رفتم"), "دیروز صبحانه {eat_verb}" (lesson02, matches "دیروز صبحانه خوردم" exactly), "دیروز کار {work_past_verb}"
    (lesson03, matches "دیروز کار کردم" exactly), "دیروز به دفتر {go_verb}" (lesson04, matches the reading''s own "دیروز به
    دفتر رفتم"), "ساعت هفت {go_verb}" (lesson05, matches the teach item''s own "ساعت هفت رفتم" example), and "{person_name}
    دیروز {past_verb_third}" (lesson06, uses the full course-wide person_name pool -- every name combines grammatically with
    "[name] yesterday [went/did/became]").

    No listen_select/listen_type anywhere (en-prs has no TTS voices). Zero fill_in_blank ambiguity: the one fill_in_blank
    ("{tired_word} شدم") has exactly 1 project-wide candidate (خسته), unambiguous by construction, matches unit17''s condition_word
    precedent exactly.

    Verified with scripts/_practice_slot_check.py (reusing backfill_lexemes_en_prs.py''s real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py practice-validate for the full en-prs pack -- 0 errors/0
    warnings. scripts/_fill_in_blank_ambiguity_check.py -- zero AMBIGUOUS flags. Needs the standard fresh-context review before
    import; no backfill_lexemes_en_prs.py run has happened against a real database yet in this pass.'
tag_schema:
  part_of_speech:
  - noun
  - verb
  - adjective
  - adverb
  - proper_noun
  agreement_tags:
    semantic:
    - past_verb_first
    - go_verb
    - eat_verb
    - work_past_verb
    - work_noun_word
    - tired_word
    - past_verb_second
    - past_verb_third
    - time_reference
    - routine_word
    - person_name
slot_presets:
  past_verb_first: &id008
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: past_verb_first
  go_verb: &id002
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: go_verb
  eat_verb: &id004
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: eat_verb
  work_past_verb: &id006
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: work_past_verb
  work_noun_word: &id005
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: work_noun_word
  tired_word: &id007
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: tired_word
  past_verb_second: &id012
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: past_verb_second
  past_verb_third: &id009
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: past_verb_third
  past_verb_pool: &id011
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic:
      - past_verb_first
      - past_verb_second
      - past_verb_third
  time_reference: &id001
    language_code: prs
    part_of_speech: adverb
    agreement_tags:
      semantic: time_reference
  routine_word: &id003
    language_code: prs
