  # Widened from the bare time_reference tag (1 unit-scoped candidate --
  # below the 3-option MC floor) to time_reference_review_pool (4):
  # time_reference + past_verb_first.
  frame:
    text: '{unit_word}'
    language_code: prs
    direction: rtl
  slots:
