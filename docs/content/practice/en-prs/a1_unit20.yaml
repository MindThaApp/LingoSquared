schema_version: "1.0"
pack_key: practice.en-prs.a1.unit20
source_language: en
target_language: prs
unit_content_key: prs.a1.unit20.past_events
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-09, part of an overnight practice-pool depth-extension
    pass closing the gap between the practice manifest (previously capped
    at unit19) and the real prs realization depth (now through unit44+).
    This pass covers units 20-24 only.

    New groups, all real vocabulary from this unit's own realization:
    "past_verb_first" (رفتم/خوردم/کردم/شدم, 4 members -- شدم/کردم are
    REUSED existing lexemes from unit02/A2-unit09 respectively, genuinely
    the same words, not new entries) is the unit's core first-person
    simple-past paradigm, completed at lesson05 (شدم's "خسته شدم"
    occurrence). "go_verb"/"eat_verb"/"work_past_verb" are private
    single-candidate subsets layered on top of past_verb_first (same
    pattern as AUTHORING_GUIDE's منتظر/گرم precedent from units 13/14),
    used only where composing with a fixed noun requires ONE SPECIFIC
    verb for grammaticality -- "دیروز صبحانه {X}" only parses with
    خوردم (breakfast I-ATE), not رفتم/کردم/شدم (breakfast I-went/did/
    became is ungrammatical, not just implausible), same class of
    constraint already documented in this file for other units.
    "past_verb_second" (رفتی/کردی, 2 members) and "past_verb_third"
    (رفت/کرد/شد, 3 members) are the matching 2nd/3rd-person forms, both
    completed in lesson06's dialogue. "time_reference" pools this unit's
    new دیروز together with the ALREADY-EXISTING امروز (unit09) and فردا
    (unit07/13) -- additive extension of those two tokens' tags, not a
    new parallel group. "tired_word" (خسته, 1 member) is a real
    single-project-wide-candidate group, verified via
    scripts/_fill_in_blank_ambiguity_check.py.

    Checked for the "fine"/"okay"-sharing-one-gloss trap (this session's
    standing awareness) -- no two past_verb_first/second/third members
    share a gloss; all 9 forms have genuinely distinct English glosses.
    Checked POS uniformity for every multi-member tag before using it in
    multiple_choice/matching_pairs (all past_verb_* members are POS verb,
    time_reference members are POS adverb) -- no POS-restriction gap like
    the pre-existing politeness/title bugs this session's methodology
    doc flags.

    Six word_order templates checked for grammaticality and self-
    reference risk: "دیروز {go_verb}" (lesson01, matches the real taught
    "دیروز رفتم"), "دیروز صبحانه {eat_verb}" (lesson02, matches "دیروز
    صبحانه خوردم" exactly), "دیروز کار {work_past_verb}" (lesson03,
    matches "دیروز کار کردم" exactly), "دیروز به دفتر {go_verb}"
    (lesson04, matches the reading's own "دیروز به دفتر رفتم"), "ساعت
    هفت {go_verb}" (lesson05, matches the teach item's own "ساعت هفت
    رفتم" example), and "{person_name} دیروز {past_verb_third}"
    (lesson06, uses the full course-wide person_name pool -- every name
    combines grammatically with "[name] yesterday [went/did/became]").

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    Zero fill_in_blank ambiguity: the one fill_in_blank
    ("{tired_word} شدم") has exactly 1 project-wide candidate (خسته),
    unambiguous by construction, matches unit17's condition_word
    precedent exactly.

    Verified with scripts/_practice_slot_check.py (reusing
    backfill_lexemes_en_prs.py's real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py
    practice-validate for the full en-prs pack -- 0 errors/0 warnings.
    scripts/_fill_in_blank_ambiguity_check.py -- zero AMBIGUOUS flags.
    Needs the standard fresh-context review before import; no
    backfill_lexemes_en_prs.py run has happened against a real database
    yet in this pass.
tag_schema:
  part_of_speech: [noun, verb, adjective, adverb, proper_noun]
  agreement_tags:
    semantic:
      [past_verb_first, go_verb, eat_verb, work_past_verb, work_noun_word,
       tired_word, past_verb_second, past_verb_third, time_reference,
       routine_word, person_name]
slot_presets:
  past_verb_first: &past_verb_first {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: past_verb_first}}
  go_verb: &go_verb {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: go_verb}}
  eat_verb: &eat_verb {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: eat_verb}}
  work_past_verb: &work_past_verb {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: work_past_verb}}
  work_noun_word: &work_noun_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: work_noun_word}}
  tired_word: &tired_word {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: tired_word}}
  past_verb_second: &past_verb_second {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: past_verb_second}}
  past_verb_third: &past_verb_third {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: past_verb_third}}
  # Union of all three past-tense paradigms (9 real distinct forms) for
  # the lesson06 review matching_pairs, AUTHORING_GUIDE.md #16.
  past_verb_pool: &past_verb_pool {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: [past_verb_first, past_verb_second, past_verb_third]}}
  # Reuses the existing course-wide "time_reference" group (دیروز/امروز/فردا).
  time_reference: &time_reference {language_code: prs, part_of_speech: adverb, agreement_tags: {semantic: time_reference}}
  # Reuses the existing course-wide "routine_word" group (خواب/صبحانه/دفتر/شب).
  routine_word: &routine_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: routine_word}}
  # Reuses the existing course-wide "person_name" group.
  person_name: &person_name {language_code: prs, part_of_speech: proper_noun, agreement_tags: {semantic: person_name}}
templates:
  # Lesson 1: yesterday + "I went".
  - content_key: practice.en-prs.prs.a1.unit20.lesson01.time_reference_gloss.001
    lesson_content_key: prs.a1.unit20.lesson01.yesterday_went
    type: multiple_choice
    frame: {text: "{time_reference}", language_code: prs, direction: rtl}
    slots: {time_reference: *time_reference}
    answer_derivation: {kind: slot_gloss, slot: time_reference}
    feedback_frame: {text: "{time_reference} refers to a day relative to today.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit20.lesson01.yesterday_went_order.002
    lesson_content_key: prs.a1.unit20.lesson01.yesterday_went
    type: word_order
    frame: {text: "دیروز {go_verb}", language_code: prs, direction: rtl}
    slots: {go_verb: *go_verb}
    answer_derivation: {kind: render_frame, frame: {text: "دیروز {go_verb}", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: دیروز رفتم (yesterday I went).", language_code: en, direction: ltr}

  # Lesson 2: "I ate".
  - content_key: practice.en-prs.prs.a1.unit20.lesson02.routine_word_translate.001
    lesson_content_key: prs.a1.unit20.lesson02.i_ate
    type: translation
    frame: {text: "{routine_word}", language_code: en, direction: ltr, slot_rendering: {routine_word: english_gloss}}
    slots: {routine_word: *routine_word}
    answer_derivation: {kind: slot_text, slot: routine_word}
    feedback_frame: {text: "{routine_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit20.lesson02.ate_breakfast_order.002
    lesson_content_key: prs.a1.unit20.lesson02.i_ate
    type: word_order
    frame: {text: "دیروز صبحانه {eat_verb}", language_code: prs, direction: rtl}
    slots: {eat_verb: *eat_verb}
    answer_derivation: {kind: render_frame, frame: {text: "دیروز صبحانه {eat_verb}", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: دیروز صبحانه خوردم (yesterday I ate breakfast).", language_code: en, direction: ltr}

  # Lesson 3: "I worked".
  - content_key: practice.en-prs.prs.a1.unit20.lesson03.work_noun_translate.001
    lesson_content_key: prs.a1.unit20.lesson03.i_worked
    type: translation
    frame: {text: "{work_noun_word}", language_code: en, direction: ltr, slot_rendering: {work_noun_word: english_gloss}}
    slots: {work_noun_word: *work_noun_word}
    answer_derivation: {kind: slot_text, slot: work_noun_word}
    feedback_frame: {text: "{work_noun_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit20.lesson03.worked_order.002
    lesson_content_key: prs.a1.unit20.lesson03.i_worked
    type: word_order
    frame: {text: "دیروز کار {work_past_verb}", language_code: prs, direction: rtl}
    slots: {work_past_verb: *work_past_verb}
    answer_derivation: {kind: render_frame, frame: {text: "دیروز کار {work_past_verb}", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: دیروز کار کردم (yesterday I worked).", language_code: en, direction: ltr}

  # Lesson 4: reading about yesterday.
  - content_key: practice.en-prs.prs.a1.unit20.lesson04.time_reference_translate.001
    lesson_content_key: prs.a1.unit20.lesson04.reading_yesterday
    type: translation
    frame: {text: "{time_reference}", language_code: en, direction: ltr, slot_rendering: {time_reference: english_gloss}}
    slots: {time_reference: *time_reference}
    answer_derivation: {kind: slot_text, slot: time_reference}
    feedback_frame: {text: "{time_reference} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit20.lesson04.office_order.002
    lesson_content_key: prs.a1.unit20.lesson04.reading_yesterday
    type: word_order
    frame: {text: "دیروز به دفتر {go_verb}", language_code: prs, direction: rtl}
    slots: {go_verb: *go_verb}
    answer_derivation: {kind: render_frame, frame: {text: "دیروز به دفتر {go_verb}", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: دیروز به دفتر رفتم (yesterday I went to the office).", language_code: en, direction: ltr}

  # Lesson 5: a longer reading, "tired".
  - content_key: practice.en-prs.prs.a1.unit20.lesson05.tired_fill.001
    lesson_content_key: prs.a1.unit20.lesson05.reading_longer_yesterday
    type: fill_in_blank
    frame: {text: "{tired_word} شدم", language_code: prs, direction: rtl}
    slots: {tired_word: *tired_word}
    answer_derivation: {kind: slot_text, slot: tired_word}
    feedback_frame: {text: "خسته شدم means I got tired.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit20.lesson05.past_verb_first_gloss.002
    lesson_content_key: prs.a1.unit20.lesson05.reading_longer_yesterday
    type: multiple_choice
    frame: {text: "{past_verb_first}", language_code: prs, direction: rtl}
    slots: {past_verb_first: *past_verb_first}
    answer_derivation: {kind: slot_gloss, slot: past_verb_first}
    feedback_frame: {text: "{past_verb_first} is a first-person simple-past verb form.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit20.lesson05.seven_oclock_order.003
    lesson_content_key: prs.a1.unit20.lesson05.reading_longer_yesterday
    type: word_order
    frame: {text: "ساعت هفت {go_verb}", language_code: prs, direction: rtl}
    slots: {go_verb: *go_verb}
    answer_derivation: {kind: render_frame, frame: {text: "ساعت هفت {go_verb}", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: ساعت هفت رفتم (I went at seven o'clock).", language_code: en, direction: ltr}

  # Lesson 6: a dialogue about yesterday (2nd/3rd person past forms).
  - content_key: practice.en-prs.prs.a1.unit20.lesson06.past_verb_third_gloss.001
    lesson_content_key: prs.a1.unit20.lesson06.yesterday_dialogue
    type: multiple_choice
    frame: {text: "{past_verb_third}", language_code: prs, direction: rtl}
    slots: {past_verb_third: *past_verb_third}
    answer_derivation: {kind: slot_gloss, slot: past_verb_third}
    feedback_frame: {text: "{past_verb_third} is a third-person simple-past verb form.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit20.lesson06.person_past_order.002
    lesson_content_key: prs.a1.unit20.lesson06.yesterday_dialogue
    type: word_order
    frame: {text: "{person_name} دیروز {past_verb_third}", language_code: prs, direction: rtl}
    slots: {person_name: *person_name, past_verb_third: *past_verb_third}
    answer_derivation: {kind: render_frame, frame: {text: "{person_name} دیروز {past_verb_third}", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: [name] دیروز [verb] ([name] VERBED yesterday).", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit20.lesson06.past_verb_pool_pair.003
    lesson_content_key: prs.a1.unit20.lesson06.yesterday_dialogue
    type: matching_pairs
    # Pools past_verb_first (4) + past_verb_second (2) + past_verb_third
    # (3) -- 9 distinct real past-tense forms, AUTHORING_GUIDE.md #16.
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six} — {word_seven} — {word_eight} — {word_nine}", language_code: prs, direction: rtl}
    slots:
      word_one: *past_verb_pool
      word_two: *past_verb_pool
      word_three: *past_verb_pool
      word_four: *past_verb_pool
      word_five: *past_verb_pool
      word_six: *past_verb_pool
      word_seven: *past_verb_pool
      word_eight: *past_verb_pool
      word_nine: *past_verb_pool
    slot_relations:
      - {kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six, word_seven, word_eight, word_nine]}
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six, word_seven, word_eight, word_nine]}
    feedback_frame: {text: "Match each word to its meaning -- all the past-tense verb forms in this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit20.lesson06.past_verb_second_translate.004
    lesson_content_key: prs.a1.unit20.lesson06.yesterday_dialogue
    type: translation
    frame: {text: "{past_verb_second}", language_code: en, direction: ltr, slot_rendering: {past_verb_second: english_gloss}}
    slots: {past_verb_second: *past_verb_second}
    answer_derivation: {kind: slot_text, slot: past_verb_second}
    feedback_frame: {text: "{past_verb_second} is the Dari word for this.", language_code: en, direction: ltr}
