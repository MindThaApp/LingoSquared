schema_version: '1.0'
pack_key: practice.en-prs.a1.unit39
source_language: en
target_language: prs
unit_content_key: prs.a1.unit39.seasons
review:
  status: reviewed
  fresh_context: true
  notes: 'Authored 2026-07-11, same units 31-40 practice-pool depth-extension pass as this bundle''s a1_unit31.yaml sibling
    (see that file''s notes for the shared pass context). Realization and overlay are both status reviewed.

    Two groups: "season_word" (فصل/بهار/تابستان/خزان/زمستان, 5 members, completes lesson01 -- includes the generic "season"
    noun فصل alongside the four specific season names) is the recognition pool. "specific_season_word" (بهار/تابستان/خزان/زمستان,
    4 -- excludes the generic فصل) is the subset that combines grammatically with the taught "... را دوست دارم" frame.

    Word_order template checked for grammaticality: "{specific_season_word} را دوست دارم" (lesson03, matches the real taught
    "بهار را دوست دارم." verbatim; "تابستان را دوست دارم."/"خزان را دوست دارم."/ "زمستان را دوست دارم." are all equally grammatical
    generalizations checked directly, even though the taught dialogue''s زمستان line uses the negative "دوست ندارم" instead).

    No listen_select/listen_type anywhere (en-prs has no TTS voices). No bare unquoted yes/no/true/false anywhere. Verified
    with scripts/_practice_slot_check.py (0 problems) and scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context review before import.

    Fresh-context review 2026-07-11 (Opus, zero access to authoring reasoning; sibling prs-en/en-prs overlays not consulted):
    PASS, no defects, status flipped to reviewed. Verified every slot member is taught in this unit or earlier (realizations
    units <=40); Afghan Dari register throughout (مکتب/پوهنتون/سرک/دوکان/پولیس/امبولانس/ اطفائیه/موتر, no Iranian calques);
    ZWNJ correct in all می‌-forms and compounds; every word_order frame grammatical for EVERY candidate filling (composition-trap
    subsets -- sweep_clean/cook_object/ field/service/specific_season -- correctly exclude tokens that need a different light
    verb or read unnaturally); matching_pairs pulls distinct glosses covering every pair; no listen_select/listen_type (Dari
    has zero TTS); no bare YAML booleans; no snake_case jargon in learner-facing text. The three unit31/33 homograph splits
    (حقوق law vs salary, ظرف dishes vs within-period, می‌شویم wash vs become) are correctly scoped by content_key in _classify()
    and by lesson_key in prs_agreement_tags(), leaving each other sense untouched. practice-validate 0/0 and _practice_slot_check.py
    clean for the full en-prs set.'
tag_schema:
  part_of_speech:
  - noun
  agreement_tags:
    semantic:
    - season_word
    - specific_season_word
    - volume_en_prs_a1_unit39_specific_season_word_03_single
slot_presets:
  season_word: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: season_word
  specific_season_word: &id002
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: specific_season_word
templates:
- content_key: practice.en-prs.prs.a1.unit39.lesson01.season_gloss.001
  lesson_content_key: prs.a1.unit39.lesson01.primary_seasons
  type: multiple_choice
  frame:
    text: '{season_word}'
    language_code: prs
    direction: rtl
  slots:
    season_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: season_word
  feedback_frame:
    text: '{season_word} belongs to this unit''s seasons vocabulary.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit39.lesson01.season_pair.002
  lesson_content_key: prs.a1.unit39.lesson01.primary_seasons
  type: matching_pairs
  frame:
    text: '{word_one} — {word_two} — {word_three} — {word_four} — {word_five}'
    language_code: prs
    direction: rtl
  slots:
    word_one: *id001
    word_two: *id001
    word_three: *id001
    word_four: *id001
    word_five: *id001
  slot_relations:
  - kind: distinct
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
  answer_derivation:
    kind: matching_pairs
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
  feedback_frame:
    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit39.lesson03.season_liked_order.001
  lesson_content_key: prs.a1.unit39.lesson03.asking_about_seasons
  type: word_order
  frame:
    text: '{specific_season_word} را دوست دارم'
    language_code: prs
    direction: rtl
  slots:
    specific_season_word: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: '{specific_season_word} را دوست دارم'
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'Word order: [season] را دوست دارم (I like [season]).'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit39.lesson06.season_translate.001
  lesson_content_key: prs.a1.unit39.lesson06.wrap_up
  type: translation
  frame:
    text: '{season_word}'
    language_code: en
    direction: ltr
    slot_rendering:
