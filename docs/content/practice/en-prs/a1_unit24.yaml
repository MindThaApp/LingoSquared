schema_version: "1.0"
pack_key: practice.en-prs.a1.unit24
source_language: en
target_language: prs
unit_content_key: prs.a1.unit24.transportation
review:
  status: reviewed
  fresh_context: true
  notes: >-
    Authored 2026-07-09, same practice-pool depth-extension pass as this
    bundle's a1_unit20.yaml/a1_unit21.yaml/a1_unit22.yaml/a1_unit23.yaml
    siblings (see a1_unit20.yaml's notes for the shared pass context) --
    the last unit in this pass.

    New groups, all real vocabulary from this unit's own realization:
    "transport_mode_word" (بس/تکسی/موتر/دوچرخه, 4 members, completes
    lesson01 -- بس is a REUSED existing lexeme from unit16 travel,
    genuinely the same word "bus") is the unit's core vehicle
    vocabulary, all combining grammatically with با ... می‌روم ("I go by
    X"). "on_foot_word" (پیاده, 1 member) is kept SEPARATE from
    transport_mode_word since it's an adverb, not a vehicle noun, and
    combines differently in a sentence (پیاده می‌روم, no با) --
    composing پیاده into transport_mode_word's "با {X} می‌روم" frame
    would produce the ungrammatical "با پیاده می‌روم." "go_verb_present"
    (می‌روم/می‌روی/می‌رود, 3 members, completes lesson05) is the "go" verb
    paradigm across 1st/2nd/3rd person -- three distinct glosses.
    "you_go_verb"/"go_verb_third" are private single-candidate subsets
    layered on top, same pattern as this pass's unit20 go_verb/eat_verb.
    "speed_adjective" (تیز/تیزتر, 2 members) is a genuine small closed
    set (comparative and base form, not padded). "ticket_word"
    (تکت/ایستگاه, 2 members) and "ticket_only" (تکت, 1 member --
    additive subset, since "ایستگاه چند است؟" would be nonsensical,
    stations don't have a price the way tickets do) round out the set.
    "buy_verb" (می‌خرم, 1 member) is REUSED as-is from this pass's own
    a1_unit21.yaml.

    Checked for the "fine"/"okay" gloss-collision trap: transport_mode_
    word's 4 glosses (bus/taxi/car/bicycle) and go_verb_present's 3
    (I go/you go/he-she goes) are all genuinely distinct. Checked POS
    uniformity: all 4 transport_mode_word members are POS noun; all 3
    go_verb_present members are POS verb.

    Word_order templates checked for grammaticality: "با {transport_
    mode_word} می‌روم" (lesson01, matches the real taught "با بس
    می‌روم"/"با تکسی می‌روم" pattern generalized across all 4 vehicles),
    "چطور {you_go_verb}" (lesson02, single-candidate می‌روی, matches
    "چطور می‌روی؟" exactly), "{ticket_only} چند است" (lesson03, single-
    candidate تکت, matches "تکت چند است؟" exactly), "تکسی {speed_
    comparative_only} است" (lesson04, single-candidate تیزتر, matches
    "تکسی تیزتر است" exactly), "{person_name} با {transport_mode_word}
    {go_verb_third}" (lesson05, uses the full course-wide person_name
    pool with the single-candidate 3rd-person می‌رود, matches "زرمینه با
    تکسی می‌رود" generalized), and "من هر روز {on_foot_word} یا با
    {transport_mode_word} می‌روم" (lesson06, matches the real wrap-up
    sentence "من هر روز پیاده یا با بس می‌روم" generalized across all 4
    vehicles).

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    Zero fill_in_blank templates -- this unit's real vocabulary doesn't
    need one beyond what translation/word_order already safely cover.

    Verified with scripts/_practice_slot_check.py (reusing
    backfill_lexemes_en_prs.py's real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py
    practice-validate for the full en-prs pack -- 0 errors/0 warnings.
    Needs the standard fresh-context review before import; no
    backfill_lexemes_en_prs.py run has happened against a real database
    yet in this pass.

    RE-AUTH PASS 2026-07-24 (scripts/_practice_unit_scope_check.py DEAD/
    FLOOR fixes, PACK-ONLY): the whole-direction slot check above never
    proved candidates exist WITHIN this unit's own lessons -- 4 templates
    were DEAD and 2 below-floor at checkpoint scope, all from the same
    root cause: this unit's own "transport_mode_word" is only 3
    unit-scoped tokens (بس is REUSED from unit16, its lexeme spec is still
    keyed there, out of unit24's checkpoint scope no matter how the notes
    above describe it), and "buy_verb"/"person_name" are 0 unit-scoped
    tokens (REUSED from unit21 / an earlier-unit course-wide tag
    respectively). Fixes: (1) lesson01.transport_word_pair.002 and (2)
    lesson04.speed_pair.003 (2 slots, far below the 6-pair floor) widened
    to new transport_ticket_pool / commute_review_pool presets (6
    unit-scoped distinct tokens each). (3) lesson05.go_verb_gloss.001 (only
    2 unit-scoped glosses, below the multiple_choice floor) and (4)
    lesson06.transport_review_pair.001 (need 5, had 4) both re-anchored to
    a new unit_vocab_pool unioning all 5 of this unit's own content tags
    (10 unit-scoped distinct tokens) -- renamed
    lesson05.unit_vocab_gloss.001 and widened lesson06's matching_pairs to
    10 pairs. (5) lesson05.person_transport_order.002 required "person_name"
    (0 unit-scoped candidates) -- re-anchored (now commute_go_order.002) by
    dropping the subject slot entirely: Dari is pro-drop and this unit's OWN
    realization already tests this same sentence subject-less ("هر روز با
    تکسی می‌رود"). (6) lesson06.buy_ticket_translate.003 required "buy_verb"
    (0 unit-scoped candidates) -- replaced (now ticket_word_translate.003)
    with a bare-word translation over the unit's own ticket_word tag.
    Removed the now-unused buy_verb/person_name tags and presets, and
    proper_noun from tag_schema.part_of_speech. Every fix keeps the
    template's type/tier and lesson anchor. No backfill/realization/overlay
    edits. Post-fix: scripts/_practice_unit_scope_check.py reports 0 DEAD,
    0 below-floor for this pack.

    POLISH 2026-07-24 (tier-thinness wave 2, PACK-ONLY): recognition tier
    had only 2 live templates (transport_word_gloss.001,
    unit_vocab_gloss.001). Added lesson03.travel_vocab_gloss.003, a
    multiple_choice over the pre-existing transport_ticket_pool (6
    unit-scoped distinct glosses) anchored to lesson03 (own vocab
    تکت/ایستگاه, 2 glosses, below the 3-option floor alone). Recognition
    tier now 3 live; no other change.
tag_schema:
  part_of_speech: [noun, verb, adjective, adverb]
  agreement_tags:
    semantic:
      [transport_mode_word, on_foot_word, go_verb_present, you_go_verb,
       go_verb_third, speed_adjective, speed_comparative_only,
       ticket_word, ticket_only]
slot_presets:
  transport_mode_word: &transport_mode_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: transport_mode_word}}
  on_foot_word: &on_foot_word {language_code: prs, part_of_speech: adverb, agreement_tags: {semantic: on_foot_word}}
  go_verb_present: &go_verb_present {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: go_verb_present}}
  you_go_verb: &you_go_verb {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: you_go_verb}}
  go_verb_third: &go_verb_third {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: go_verb_third}}
  speed_adjective: &speed_adjective {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: speed_adjective}}
  speed_comparative_only: &speed_comparative_only {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: speed_comparative_only}}
  ticket_word: &ticket_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: ticket_word}}
  ticket_only: &ticket_only {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: ticket_only}}
  # Re-anchor fix (2026-07-24): transport_mode_word is only 3 unit-scoped
  # tokens (بس is REUSED from unit16 -- its spec is still keyed to unit16,
  # out of THIS unit's checkpoint scope even though the notes above call it
  # a "4th member"). Union with on_foot_word (1) + ticket_word (2) reaches
  # 6 unit-scoped distinct tokens for lesson01's review matching_pairs.
  transport_ticket_pool: &transport_ticket_pool {language_code: prs, part_of_speech: [noun, adverb], agreement_tags: {semantic: [transport_mode_word, on_foot_word, ticket_word]}}
  # Re-anchor fix (2026-07-24): speed_adjective alone is only 2 unit-scoped
  # tokens (was declared as a 2-slot matching_pairs, below the 6-pair
  # floor). Union with go_verb_present (2) + ticket_word (2) reaches 6.
  commute_review_pool: &commute_review_pool {language_code: prs, part_of_speech: [adjective, verb, noun], agreement_tags: {semantic: [speed_adjective, go_verb_present, ticket_word]}}
  # Re-anchor fix (2026-07-24): unions ALL FIVE of this unit's own content
  # tags (transport_mode_word 3 + on_foot_word 1 + ticket_word 2 +
  # speed_adjective 2 + go_verb_present 2 = 10 unit-scoped distinct
  # tokens) -- replaces the old transport_mode_word(4)+on_foot_word(1)
  # assumption (only 4 unit-scoped, not 5: بس is out of scope, see above),
  # and doubles as lesson05's recognition-tier pool since go_verb_present
  # alone (2 unit-scoped glosses) can't clear the multiple_choice 3-option
  # floor on its own.
  unit_vocab_pool: &unit_vocab_pool {language_code: prs, part_of_speech: [noun, adverb, adjective, verb], agreement_tags: {semantic: [transport_mode_word, on_foot_word, ticket_word, speed_adjective, go_verb_present]}}
templates:
  # Lesson 1: transport vocabulary.
  - content_key: practice.en-prs.prs.a1.unit24.lesson01.transport_word_gloss.001
    lesson_content_key: prs.a1.unit24.lesson01.transport_vocabulary
    type: multiple_choice
    frame: {text: "{transport_mode_word}", language_code: prs, direction: rtl}
    slots: {transport_mode_word: *transport_mode_word}
    answer_derivation: {kind: slot_gloss, slot: transport_mode_word}
    feedback_frame: {text: "{transport_mode_word} names a way to get around town.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit24.lesson01.transport_word_pair.002
    lesson_content_key: prs.a1.unit24.lesson01.transport_vocabulary
    # Re-anchored (2026-07-24) to transport_ticket_pool: transport_mode_word
    # alone is only 3 unit-scoped tokens (بس is out of scope, see preset
    # comment above) -- 4 slots over it was DEAD. Now 6 slots over 6
    # unit-scoped distinct tokens.
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots: {word_one: *transport_ticket_pool, word_two: *transport_ticket_pool, word_three: *transport_ticket_pool, word_four: *transport_ticket_pool, word_five: *transport_ticket_pool, word_six: *transport_ticket_pool}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit24.lesson01.go_by_order.003
    lesson_content_key: prs.a1.unit24.lesson01.transport_vocabulary
    type: word_order
    frame: {text: "با {transport_mode_word} می‌روم", language_code: prs, direction: rtl}
    slots: {transport_mode_word: *transport_mode_word}
    answer_derivation: {kind: render_frame, frame: {text: "با {transport_mode_word} می‌روم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: با [vehicle] می‌روم (I go by [vehicle]).", language_code: en, direction: ltr}

  # Lesson 2: how you go.
  - content_key: practice.en-prs.prs.a1.unit24.lesson02.on_foot_translate.001
    lesson_content_key: prs.a1.unit24.lesson02.how_you_go
    type: translation
    frame: {text: "{on_foot_word}", language_code: en, direction: ltr, slot_rendering: {on_foot_word: english_gloss}}
    slots: {on_foot_word: *on_foot_word}
    answer_derivation: {kind: slot_text, slot: on_foot_word}
    feedback_frame: {text: "{on_foot_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit24.lesson02.how_go_order.002
    lesson_content_key: prs.a1.unit24.lesson02.how_you_go
    type: word_order
    frame: {text: "چطور {you_go_verb}", language_code: prs, direction: rtl}
    slots: {you_go_verb: *you_go_verb}
    answer_derivation: {kind: render_frame, frame: {text: "چطور {you_go_verb}", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: چطور می‌روی (how do you go?).", language_code: en, direction: ltr}

  # Lesson 3: buying a ticket.
  - content_key: practice.en-prs.prs.a1.unit24.lesson03.ticket_word_translate.001
    lesson_content_key: prs.a1.unit24.lesson03.buying_a_ticket
    type: translation
    frame: {text: "{ticket_word}", language_code: en, direction: ltr, slot_rendering: {ticket_word: english_gloss}}
    slots: {ticket_word: *ticket_word}
    answer_derivation: {kind: slot_text, slot: ticket_word}
    feedback_frame: {text: "{ticket_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit24.lesson03.ticket_price_order.002
    lesson_content_key: prs.a1.unit24.lesson03.buying_a_ticket
    type: word_order
    frame: {text: "{ticket_only} چند است", language_code: prs, direction: rtl}
    slots: {ticket_only: *ticket_only}
    answer_derivation: {kind: render_frame, frame: {text: "{ticket_only} چند است", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: تکت چند است (how much is the ticket?).", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit24.lesson03.travel_vocab_gloss.003
    lesson_content_key: prs.a1.unit24.lesson03.buying_a_ticket
    type: multiple_choice
    # ADDED (POLISH 2026-07-24, tier-thinness): recognition tier had only
    # 2 live templates. Reuses the existing transport_ticket_pool
    # (transport_mode_word + on_foot_word + ticket_word, 6 unit-scoped
    # distinct glosses: taxi/car/bicycle/on foot/ticket/station),
    # anchored to lesson03, whose own ticket_word vocabulary (تکت/
    # ایستگاه, 2 glosses) is below the 3-option MC floor on its own.
    frame: {text: "{travel_word}", language_code: prs, direction: rtl}
    slots: {travel_word: *transport_ticket_pool}
    answer_derivation: {kind: slot_gloss, slot: travel_word}
    feedback_frame: {text: "{travel_word} is from this unit's getting-around vocabulary.", language_code: en, direction: ltr}

  # Lesson 4: commute dialogue.
  - content_key: practice.en-prs.prs.a1.unit24.lesson04.speed_adjective_translate.001
    lesson_content_key: prs.a1.unit24.lesson04.commute_dialogue
    type: translation
    frame: {text: "{speed_adjective}", language_code: en, direction: ltr, slot_rendering: {speed_adjective: english_gloss}}
    slots: {speed_adjective: *speed_adjective}
    answer_derivation: {kind: slot_text, slot: speed_adjective}
    feedback_frame: {text: "{speed_adjective} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit24.lesson04.taxi_faster_order.002
    lesson_content_key: prs.a1.unit24.lesson04.commute_dialogue
    type: word_order
    frame: {text: "تکسی {speed_comparative_only} است", language_code: prs, direction: rtl}
    slots: {speed_comparative_only: *speed_comparative_only}
    answer_derivation: {kind: render_frame, frame: {text: "تکسی {speed_comparative_only} است", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: تکسی تیزتر است (the taxi is faster).", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit24.lesson04.speed_pair.003
    lesson_content_key: prs.a1.unit24.lesson04.commute_dialogue
    # Re-anchored (2026-07-24) to commute_review_pool: speed_adjective alone
    # is only 2 unit-scoped tokens (2 slots is far below the 6-pair floor).
    # Widened to 6 unit-scoped distinct tokens.
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots: {word_one: *commute_review_pool, word_two: *commute_review_pool, word_three: *commute_review_pool, word_four: *commute_review_pool, word_five: *commute_review_pool, word_six: *commute_review_pool}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 5: reading about commuting.
  - content_key: practice.en-prs.prs.a1.unit24.lesson05.unit_vocab_gloss.001
    lesson_content_key: prs.a1.unit24.lesson05.reading_commute
    # Re-anchored (2026-07-24): go_verb_present alone is only 2 unit-scoped
    # distinct glosses (below the multiple_choice 3-option floor) and this
    # unit introduces no third go-verb form. Widened to unit_vocab_pool
    # (all 5 of this unit's own content tags, 10 unit-scoped distinct
    # glosses) instead of padding with an earlier unit's vocabulary.
    type: multiple_choice
    frame: {text: "{unit_vocab_word}", language_code: prs, direction: rtl}
    slots: {unit_vocab_word: *unit_vocab_pool}
    answer_derivation: {kind: slot_gloss, slot: unit_vocab_word}
    feedback_frame: {text: "{unit_vocab_word} is from this unit's transportation vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit24.lesson05.commute_go_order.002
    lesson_content_key: prs.a1.unit24.lesson05.reading_commute
    # Re-anchored (2026-07-24): the original frame required "person_name",
    # a course-wide tag this unit introduces zero lexemes for (0
    # unit-scoped candidates, DEAD at checkpoint scope). Dari is pro-drop --
    # این می‌رود already reads as a complete "(he/she) goes" without a named
    # subject, and this unit's OWN realization teaches exactly this pattern
    # subject-less (lesson05's real word_order exercise tests "هر روز با
    # تکسی می‌رود" with no name). Dropped the person_name slot instead of
    # inventing a subject.
    type: word_order
    frame: {text: "با {transport_mode_word} {go_verb_third}", language_code: prs, direction: rtl}
    slots: {transport_mode_word: *transport_mode_word, go_verb_third: *go_verb_third}
    answer_derivation: {kind: render_frame, frame: {text: "با {transport_mode_word} {go_verb_third}", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: با [vehicle] می‌رود ((he/she) goes by [vehicle]).", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit24.lesson05.transport_word_translate.003
    lesson_content_key: prs.a1.unit24.lesson05.reading_commute
    type: translation
    frame: {text: "{transport_mode_word}", language_code: en, direction: ltr, slot_rendering: {transport_mode_word: english_gloss}}
    slots: {transport_mode_word: *transport_mode_word}
    answer_derivation: {kind: slot_text, slot: transport_mode_word}
    feedback_frame: {text: "{transport_mode_word} is the Dari word for this.", language_code: en, direction: ltr}

  # Lesson 6: wrap-up.
  - content_key: practice.en-prs.prs.a1.unit24.lesson06.transport_review_pair.001
    lesson_content_key: prs.a1.unit24.lesson06.wrap_up
    # Re-anchored (2026-07-24): the old transport_mode_word(4)+on_foot_word(1)
    # union assumed transport_mode_word had 4 unit-scoped members: it has
    # only 3 (بس is REUSED from unit16, out of this unit's checkpoint scope)
    # -- 5 slots over 4 real tokens was DEAD. Widened to unit_vocab_pool,
    # the full 10-token union of every content tag this unit introduces --
    # a genuine final wrap-up review of the whole unit.
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six} — {word_seven} — {word_eight} — {word_nine} — {word_ten}", language_code: prs, direction: rtl}
    slots:
      word_one: *unit_vocab_pool
      word_two: *unit_vocab_pool
      word_three: *unit_vocab_pool
      word_four: *unit_vocab_pool
      word_five: *unit_vocab_pool
      word_six: *unit_vocab_pool
      word_seven: *unit_vocab_pool
      word_eight: *unit_vocab_pool
      word_nine: *unit_vocab_pool
      word_ten: *unit_vocab_pool
    slot_relations:
      - {kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six, word_seven, word_eight, word_nine, word_ten]}
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six, word_seven, word_eight, word_nine, word_ten]}
    feedback_frame: {text: "Match each word to its English meaning -- transportation.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit24.lesson06.daily_commute_order.002
    lesson_content_key: prs.a1.unit24.lesson06.wrap_up
    type: word_order
    frame: {text: "من هر روز {on_foot_word} یا با {transport_mode_word} می‌روم", language_code: prs, direction: rtl}
    slots: {on_foot_word: *on_foot_word, transport_mode_word: *transport_mode_word}
    answer_derivation: {kind: render_frame, frame: {text: "من هر روز {on_foot_word} یا با {transport_mode_word} می‌روم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: من هر روز پیاده یا با [vehicle] می‌روم (I go on foot or by [vehicle] every day).", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit24.lesson06.ticket_word_translate.003
    lesson_content_key: prs.a1.unit24.lesson06.wrap_up
    # Replaced (2026-07-24): the original slotted "buy_verb" (می‌خرم),
    # REUSED as-is from a1_unit21 -- this unit introduces zero buy_verb
    # lexemes (0 unit-scoped candidates, DEAD at checkpoint scope). PACK-
    # ONLY means no backfill re-tagging, so replaced with a bare-word
    # production template over ticket_word (native to lesson03, valid
    # unit-wide per the standard pooling technique).
    type: translation
    frame: {text: "{ticket_word}", language_code: en, direction: ltr, slot_rendering: {ticket_word: english_gloss}}
    slots: {ticket_word: *ticket_word}
    answer_derivation: {kind: slot_text, slot: ticket_word}
    feedback_frame: {text: "{ticket_word} is the Dari word for this.", language_code: en, direction: ltr}
