schema_version: "1.0"
pack_key: practice.en-prs.a1.unit03
source_language: en
target_language: prs
unit_content_key: prs.a1.unit03.family
review:
  status: reviewed
  fresh_context: false
  required_next_reviewer: native_speaker_review
  notes: |-
    Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-06, closing the en-prs gap where the practice pool only covered units 01-02 despite the realization/overlay already having 8 stable A1 units plus 2 A2 units. Extended scripts/backfill_lexemes_en_prs.py's UNIT_FILES to add units 03-08 and a2 units 09-10 in one pass, hand-classifying every genuinely new introduced_token directly from each real realization/overlay file pair (not guessed), reusing this file's own established four-slot-shape convention (multiple_choice recognition, a natural-sentence fill_in_blank per guide §13, translation, matching_pairs) exactly as unit02's pack already does.
    Four semantic groups, each with >=3 distinct members (verified against scripts/_practice_slot_check.py's >=3-for-multiple_choice/ matching_pairs rule): immediate_family (مادر/پدر/برادر/خواهر), uncle_aunt (کاکا/عمه/ماما/خاله -- the paternal/maternal distinction this unit's own review notes call out as the key English-speaker teaching point), marital_word (متأهل/مجرد/شوهر/خانم), have_verb (دارم/داریم/دارین). Deliberately left the two-member پدرکلان/ مادرکلان "grandparent" pair untested by any template (thin, below the matching_pairs-friendly threshold this pass prioritized covering the richer groups instead) -- still taught in the lesson itself, just not drilled here; a follow-up pass could add a matching_pairs-only pair for it later.
    Every fill_in_blank frame embeds the slot in a real Dari sentence with visible surrounding context, never a bare blanked token alone (guide §13). Every lesson_content_key anchor verified directly against the real realization file to introduce genuinely new vocabulary of its own (non-empty introduced_tokens) -- avoiding the exact anchor-bug class found and fixed live tonight in this session's fa-en QA pass (a template pointing at a pure-review lesson with no Lexeme provenance). No listen_select/listen_type anywhere, matching this direction's standing zero-TTS-for-Dari exclusion. No bare unquoted yes/no/true/false anywhere.
    Verified with a standalone throwaway script reusing scripts/_practice_slot_check.py's lexeme_matches()/check_pack() against scripts/backfill_lexemes_en_prs.py's real iter_specs() output -- 0 problems across all templates in this pack. Also ran scripts/compile_content.py practice-validate for the full en-prs pack (units 01-10 together) -- 0 errors/0 warnings. Needs the standard fresh-context review before import; no backfill_lexemes_ en_prs.py run has actually happened against a real database yet in this pass.
    REAUTH PASS 2026-07-24 (unit-scope DEAD/FLOOR fix, scripts/_practice_unit_scope_check.py): the whole-direction check above only proves a slot has candidates SOMEWHERE in en-prs; generate_checkpoint() scopes candidates to THIS unit's own lexemes only, and khanem/خانم above turned out to be introduced in unit02, not here -- marital_word's real unit03-scoped pool is 3 (متأهل/مجرد/شوهر), not 4, which left marital_pair.004 DEAD (declared 4 slots, 0 could ever fill from this unit alone) and have_pair.004 below the 6-pair floor (3 slots, the honest have_verb-only ceiling). Fixed pack-only, no backfill/realization/overlay edits, no new vocabulary: (1) marital_pair.004 widened via a new marital_review preset (marital_word UNION study_vocab_word UNION family_message_word UNION time_reference = 3+1+1+1 = 6 distinct: متأهل/مجرد/شوهر/محصل/فامیل/هنوز, all genuinely introduced by this unit's own lesson05/lesson06). (2) have_pair.004 widened via a new have_and_preference preset (have_verb UNION preference_verb = the full داشتن paradigm this unit teaches: دارم/داریم/دارین/ندارم/دارد/ندارد, 6 distinct), kept disjoint from marital_review so the two matching_pairs templates don't recycle each other's tokens. Re-verified 0 DEAD / 0 below-floor for this pack via scripts/_practice_unit_scope_check.py and 0 errors via scripts/compile_content.py practice-validate (see coordinator report for the exact invocation/output).

    Review 2026-10-24 (en-prs practice native-quality pass): 3 fixes. uncle_aunt_pair.004 was an exact duplicate of family_pair.004 (same 8 words); it now uses the 12 lesson-02 extended-family words. have_pair feedback said 'to its subject' for a pool that includes negatives; Dari verb *داشتن* wrapped in asterisks in two feedback lines. NATIVE FLAGS: پدرکلان / مادرکلان as grandparent terms (vs بابا کلان / ننه کلان regionally); کاکا for paternal uncle.
tag_schema:
  part_of_speech: [noun, adjective, verb, adverb]
  agreement_tags:
    semantic: [immediate_family, uncle_aunt, marital_word, have_verb,
               en_prs_a1_unit03_lesson02_words, study_vocab_word, family_message_word, time_reference, preference_verb]
slot_presets:
  immediate_family: &immediate_family {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: immediate_family}}
  uncle_aunt: &uncle_aunt {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: uncle_aunt}}
  marital_word: &marital_word {language_code: prs, part_of_speech: [noun, adjective], agreement_tags: {semantic: marital_word}}
  have_verb: &have_verb {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: have_verb}}
  # immediate_family and uncle_aunt each only have 4 distinct candidates
  # alone; pooled together for the matching_pairs templates below to reach
  # 8 (AUTHORING_GUIDE.md #16) -- both are lesson01/lesson02 of this same
  # unit, a coherent single "family members" theme, real vocabulary only.
  # Lesson-2 extended-family words (uncles, aunts, grandparents, my-forms, paternal/maternal).
  extended_family: &extended_family {language_code: prs, part_of_speech: [noun, adjective], agreement_tags: {semantic: en_prs_a1_unit03_lesson02_words}}
  family_pool: &family_pool {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: [immediate_family, uncle_aunt]}}
  # REAUTH 2026-07-24 (unit-scope DEAD/FLOOR fix, see review.notes below):
  # marital_word alone has only 3 unit-scoped candidates (متأهل/مجرد/شوهر --
  # خانم, the 4th token this pack's original notes assumed, was actually
  # introduced in unit02, not here). Widened with the OTHER small
  # lesson05/06 tags this unit genuinely introduces of its own
  # (study_vocab_word: محصل; family_message_word: فامیل; time_reference:
  # هنوز) to reach 6 distinct without touching have_verb/preference_verb
  # (kept disjoint from the have_and_preference pool below).
  marital_review: &marital_review {language_code: prs, part_of_speech: [noun, adjective, adverb], agreement_tags: {semantic: [marital_word, study_vocab_word, family_message_word, time_reference]}}
  # have_verb alone has only 3 unit-scoped candidates (دارم/داریم/دارین).
  # preference_verb is the same "to have" paradigm's negative/3rd-person
  # forms taught later in this unit (ندارم/دارد/ندارد, plus دارم/دارین
  # again) -- unioning reaches 6 distinct (دارم/داریم/دارین/ندارم/دارد/ندارد),
  # a single coherent "have/don't have" verb-form review.
  have_and_preference: &have_and_preference {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: [have_verb, preference_verb]}}
templates:
  # Lesson 1: immediate family members.
  - content_key: practice.en-prs.prs.a1.unit03.lesson01.family_gloss.001
    lesson_content_key: prs.a1.unit03.lesson01.immediate_family
    type: multiple_choice
    frame: {text: "{immediate_family}", language_code: prs, direction: rtl}
    slots: {immediate_family: *immediate_family}
    answer_derivation: {kind: slot_gloss, slot: immediate_family}
    feedback_frame: {text: "{immediate_family} names an immediate family member.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit03.lesson01.family_translate.003
    lesson_content_key: prs.a1.unit03.lesson01.immediate_family
    type: translation
    frame: {text: "{immediate_family}", language_code: en, direction: ltr, slot_rendering: {immediate_family: english_gloss}}
    slots: {immediate_family: *immediate_family}
    answer_derivation: {kind: slot_text, slot: immediate_family}
    feedback_frame: {text: "{immediate_family} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit03.lesson01.family_pair.004
    lesson_content_key: prs.a1.unit03.lesson01.immediate_family
    type: matching_pairs
    # Expanded 2->8 pairs 2026-07-06 (AUTHORING_GUIDE.md #16 retrofit),
    # pooling immediate_family with lesson02's uncle_aunt (family_pool
    # preset above) -- verified via scripts/_practice_slot_check.py.
    frame: {text: "{family_one} — {family_two} — {family_three} — {family_four} — {family_five} — {family_six} — {family_seven} — {family_eight}", language_code: prs, direction: rtl}
    slots: {family_one: *family_pool, family_two: *family_pool, family_three: *family_pool, family_four: *family_pool, family_five: *family_pool, family_six: *family_pool, family_seven: *family_pool, family_eight: *family_pool}
    slot_relations: [{kind: distinct, slots: [family_one, family_two, family_three, family_four, family_five, family_six, family_seven, family_eight]}]
    answer_derivation: {kind: matching_pairs, slots: [family_one, family_two, family_three, family_four, family_five, family_six, family_seven, family_eight]}
    feedback_frame: {text: "Match each family word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 2: paternal and maternal relatives.
  - content_key: practice.en-prs.prs.a1.unit03.lesson02.uncle_aunt_gloss.001
    lesson_content_key: prs.a1.unit03.lesson02.extended_family
    type: multiple_choice
    frame: {text: "{uncle_aunt}", language_code: prs, direction: rtl}
    slots: {uncle_aunt: *uncle_aunt}
    answer_derivation: {kind: slot_gloss, slot: uncle_aunt}
    feedback_frame: {text: "{uncle_aunt} identifies a specific side of the family.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit03.lesson02.uncle_aunt_translate.003
    lesson_content_key: prs.a1.unit03.lesson02.extended_family
    type: translation
    frame: {text: "{uncle_aunt}", language_code: en, direction: ltr, slot_rendering: {uncle_aunt: english_gloss}}
    slots: {uncle_aunt: *uncle_aunt}
    answer_derivation: {kind: slot_text, slot: uncle_aunt}
    feedback_frame: {text: "{uncle_aunt} is the Dari word for this relative.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit03.lesson02.uncle_aunt_pair.004
    lesson_content_key: prs.a1.unit03.lesson02.extended_family
    type: matching_pairs
    # Expanded 2->8 pairs 2026-07-06 (AUTHORING_GUIDE.md #16 retrofit),
    # now the lesson-2 extended-family words (uncles, aunts, grandparents,
    # my-forms, paternal/maternal; the old pool duplicated family_pair.004 exactly) -- verified via scripts/_practice_slot_check.py.
    frame: {text: "{family_one} — {family_two} — {family_three} — {family_four} — {family_five} — {family_six} — {family_seven} — {family_eight}", language_code: prs, direction: rtl}
    slots: {family_one: *extended_family, family_two: *extended_family, family_three: *extended_family, family_four: *extended_family, family_five: *extended_family, family_six: *extended_family, family_seven: *extended_family, family_eight: *extended_family}
    slot_relations: [{kind: distinct, slots: [family_one, family_two, family_three, family_four, family_five, family_six, family_seven, family_eight]}]
    answer_derivation: {kind: matching_pairs, slots: [family_one, family_two, family_three, family_four, family_five, family_six, family_seven, family_eight]}
    feedback_frame: {text: "Match each extended-family word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 3: describing family size, incl. the دارم/داریم/دارین have-forms.
  - content_key: practice.en-prs.prs.a1.unit03.lesson03.have_gloss.001
    lesson_content_key: prs.a1.unit03.lesson03.family_size
    type: multiple_choice
    frame: {text: "{have_verb}", language_code: prs, direction: rtl}
    slots: {have_verb: *have_verb}
    answer_derivation: {kind: slot_gloss, slot: have_verb}
    feedback_frame: {text: "{have_verb} is a form of *داشتن* (to have).", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit03.lesson03.have_translate.003
    lesson_content_key: prs.a1.unit03.lesson03.family_size
    type: translation
    frame: {text: "{have_verb}", language_code: en, direction: ltr, slot_rendering: {have_verb: english_gloss}}
    slots: {have_verb: *have_verb}
    answer_derivation: {kind: slot_text, slot: have_verb}
    feedback_frame: {text: "{have_verb} is the Dari form for this subject.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit03.lesson03.have_pair.004
    lesson_content_key: prs.a1.unit03.lesson03.family_size
    type: matching_pairs
    # REAUTH 2026-07-24: was below the 6-pair floor at 3 slots (real
    # unit-scoped ceiling for have_verb alone). Widened via
    # have_and_preference (have_verb UNION preference_verb, see preset
    # above) to the full 6-member داشتن paradigm this unit actually
    # teaches (دارم/داریم/دارین/ندارم/دارد/ندارد), still one coherent verb.
    frame: {text: "{have_verb_one} — {have_verb_two} — {have_verb_three} — {have_verb_four} — {have_verb_five} — {have_verb_six}", language_code: prs, direction: rtl}
    slots: {have_verb_one: *have_and_preference, have_verb_two: *have_and_preference, have_verb_three: *have_and_preference, have_verb_four: *have_and_preference, have_verb_five: *have_and_preference, have_verb_six: *have_and_preference}
    slot_relations: [{kind: distinct, slots: [have_verb_one, have_verb_two, have_verb_three, have_verb_four, have_verb_five, have_verb_six]}]
    answer_derivation: {kind: matching_pairs, slots: [have_verb_one, have_verb_two, have_verb_three, have_verb_four, have_verb_five, have_verb_six]}
    feedback_frame: {text: "Match each form of *داشتن* (to have) to its English meaning.", language_code: en, direction: ltr}

  # Lesson 5: marriage and marital status.
  - content_key: practice.en-prs.prs.a1.unit03.lesson05.marital_gloss.001
    lesson_content_key: prs.a1.unit03.lesson05.marital_status
    type: multiple_choice
    frame: {text: "{marital_word}", language_code: prs, direction: rtl}
    slots: {marital_word: *marital_word}
    answer_derivation: {kind: slot_gloss, slot: marital_word}
    feedback_frame: {text: "{marital_word} describes marital status or a spouse.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit03.lesson05.marital_translate.003
    lesson_content_key: prs.a1.unit03.lesson05.marital_status
    type: translation
    frame: {text: "{marital_word}", language_code: en, direction: ltr, slot_rendering: {marital_word: english_gloss}}
    slots: {marital_word: *marital_word}
    answer_derivation: {kind: slot_text, slot: marital_word}
    feedback_frame: {text: "{marital_word} is the Dari word for this.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit03.lesson05.marital_pair.004
    lesson_content_key: prs.a1.unit03.lesson05.marital_status
    type: matching_pairs
    # REAUTH 2026-07-24: was DEAD (declared 4 slots but only 3 unit-scoped
    # marital_word candidates exist -- خانم, the notes' assumed 4th member,
    # was actually introduced in unit02). Widened via marital_review
    # (marital_word UNION study_vocab_word UNION family_message_word UNION
    # time_reference, see preset above) to 6 distinct, all genuinely
    # introduced by this unit's own lesson05/lesson06 lexemes.
    frame: {text: "{marital_word_one} — {marital_word_two} — {marital_word_three} — {marital_word_four} — {marital_word_five} — {marital_word_six}", language_code: prs, direction: rtl}
    slots: {marital_word_one: *marital_review, marital_word_two: *marital_review, marital_word_three: *marital_review, marital_word_four: *marital_review, marital_word_five: *marital_review, marital_word_six: *marital_review}
    slot_relations: [{kind: distinct, slots: [marital_word_one, marital_word_two, marital_word_three, marital_word_four, marital_word_five, marital_word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [marital_word_one, marital_word_two, marital_word_three, marital_word_four, marital_word_five, marital_word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
