  type: multiple_choice
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: b2u08_core
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word from this unit on comparing and synthesizing sources (a village canal).'
    language_code: en
    direction: ltr
