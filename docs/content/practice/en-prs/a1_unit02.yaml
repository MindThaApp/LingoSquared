schema_version: '1.0'
pack_key: practice.en-prs.a1.unit02
source_language: en
target_language: prs
unit_content_key: prs.a1.unit02.introductions
review:
  status: reviewed
  fresh_context: false
  notes: 'Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-05, closing the gap where en-prs''s practice pool
    only covered unit01 despite the realization/overlay already having units 1-7 (units 2-6 reviewed and stable, unit07 unreviewed/mid-edit
    -- correctly left alone). Extended scripts/backfill_lexemes_en_prs.py''s UNIT_FILES to cover unit02 (previously unit01
    only), hand-classifying all 28 genuinely new introduced_tokens directly from docs/content/realizations/prs/a1_unit02_introductions.yaml
    (checked against the existing unit01 token set first so no already-reviewed gloss/POS entry was silently overwritten).

    Found and fixed a real pre-existing bug while extending the classifier: "کابل" (Kabul, a city) was incorrectly tagged
    semantic=person_name in the ORIGINAL unit01-era code (grouped with real person names حامد/نجیب) -- moved it to a proper
    city_name tag (now shared with unit02''s هرات/مزار/شریف) instead.

    No listen_select anywhere in this pack, matching the existing a1_unit01.yaml pack''s own stated rule: Dari has zero TTS
    voice coverage project-wide, a hard exclusion, not a style choice.

    Deliberately did NOT pair the "title" slot (جناب/خانم, 2 candidates) with any specific person_name in a single frame --
    جناب is male-specific and خانم is female-specific, but this course''s lexeme model has no gender agreement tag on either
    titles or names yet, so a randomly-filled "{title} فریدون"-shaped frame would render the ungrammatical "خانم فریدون" (Ms.
    Faridun) roughly half the time. Same class of bug as the nl-en lane''s زیjn/homograph caution and this lane''s own en-fa/en-fa
    unit03/04 "quantity"/title-pairing avoidances -- verified via scripts/_practice_slot_check.py that no template below combines
    two independently-slotted values that could disagree on an untracked grammatical feature. "title" is tested standalone
    (multiple_choice/translation/a name-free fill_in_blank frame) instead.

    "title" (2 candidates) and "name_word" (3 candidates: نام/نام‌تان/نامت) are at or near the minimum for multiple_choice;
    "title" specifically is never used in multiple_choice here (2 < 3), only fill_in_blank/ translation. Not yet compiler-validated
    or DB-verified as of this writing (left for the end-of-session scripts/verify.sh run); status left unreviewed pending
    a real fresh-context review -- this lane does not self-certify review status, and human native-speaker review is still
    recommended before Dari content ships, per standing project policy.


    REAUTH PASS 2026-07-24 (unit-scope DEAD/FLOOR fix, scripts/_practice_unit_scope_check.py):
    generate_checkpoint() scopes candidates to THIS unit''s own lexemes only, and several slots
    here had silently drifted to depend on lexemes actually introduced by an EARLIER unit (the
    backfill classifier keys glosses by bare token, so a token re-taught in this unit but first
    classified in an earlier one contributes 0 to unit02''s own pool). Fixed, all pack-only (no
    backfill/realization/overlay edits):
    (1) person_pair.004 was DEAD (10 slots declared, only 3 unit-scoped person_name candidates
    existed -- ONLY 3 person names are actually introduced anywhere in this unit). Repurposed to
    a "social words" matching_pairs over politeness UNION title (4+2=6 distinct, both genuinely
    unit02-introduced, no overlap with the other two matching_pairs templates below).
    (2) city_pair.004 was DEAD (5 slots declared, only 4 unit-scoped city_name+country candidates
    existed). Widened to the full unit-scoped proper-noun pool (person_name UNION city_name UNION
    country = 3+3+1 = 7 distinct), reusing the person names freed up by fix (1) instead of
    duplicating them into two separate templates.
    (3) occupation_pair.004 was below the 6-pair floor (4 occupation-only candidates). Widened to
    occupation UNION relationship_word (4+2=6 distinct, both genuinely unit02-introduced,
    disjoint from politeness/title used in fix (1)).
    (4) name_gloss.001 was below the multiple_choice 3-option floor (name_word alone = 1
    unit-scoped candidate, نامت). Widened to name_word UNION person_name (1+3=4 distinct);
    name_translate.003 widened the same way for consistency/variety (translation has no floor,
    this is purely a quality improvement).
    (5) relationship_gloss.001 was below the multiple_choice 3-option floor (relationship_word
    alone = 2 unit-scoped candidates). Widened to relationship_word UNION title (2+2=4 distinct);
    relationship_translate.004 widened the same way for consistency.
    All five fixes only recombine semantic tags this unit''s OWN lexemes already carry -- no new
    vocabulary, no backfill/gloss changes. Re-verified 0 DEAD / 0 below-floor for this pack via
    scripts/_practice_unit_scope_check.py and 0 errors via scripts/compile_content.py
    practice-validate (see coordinator report for the exact invocation/output).'
tag_schema:
  part_of_speech:
  - noun
  - proper_noun
  - verb
  - adjective
  - adverb
  agreement_tags:
    semantic:
    - name_word
    - person_name
    - city_name
    - country
    - city_word
    - occupation
    - title
    - relationship_word
    - politeness
    - dialogue_word
    - volume_en_prs_a1_unit02_city_name_02_single
    - volume_en_prs_a1_unit02_person_name_04_single
slot_presets:
  name_word: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: name_word
  person_name: &id002
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  city_name: &id003
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic: city_name
  country: &id005
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic: country
  city_or_country: &id004
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic:
      - city_name
      - country
  occupation: &id006
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: occupation
  title: &id008
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: title
  relationship_word: &id007
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: relationship_word
  politeness_word: &id009
    language_code: prs
    part_of_speech:
    - noun
    - verb
    - adverb
    - adjective
    agreement_tags:
      semantic: politeness
  dialogue_word: &id010
    language_code: prs
    part_of_speech:
    - noun
    - proper_noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: dialogue_word
  # REAUTH 2026-07-24 (unit-scope DEAD/FLOOR fix pass, see review.notes below):
  # name_word alone has only 1 unit-scoped member (نامت); unioned with
  # person_name (all 3 introduced somewhere in this unit) it clears the
  # multiple_choice 3-option floor without touching any other unit's vocab.
  name_or_person: &id011
    language_code: prs
    part_of_speech:
    - noun
    - proper_noun
    agreement_tags:
      semantic:
      - name_word
      - person_name
  # relationship_word alone has only 2 unit-scoped members; unioned with
  # title (also 2) it clears the multiple_choice floor. Both are "words
  # that describe or address a person" -- a coherent pairing.
  relationship_or_title: &id012
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic:
      - relationship_word
      - title
  # person_name(3) + city_name(3) + country(1) = 7 distinct proper nouns,
  # the complete unit-scoped proper-noun pool -- replaces the old
  # city_or_country preset (city_name+country only = 4, DEAD at 5 slots).
  proper_noun_pool: &id013
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic:
      - person_name
      - city_name
      - country
  # politeness(4) + title(2) = 6 distinct "polite social words" -- replaces
  # the old person_name-only preset used by person_pair.004 (DEAD at 10
  # slots; person_name itself only ever had 3 unit-scoped members). Kept
  # disjoint from proper_noun_pool above and occupation_and_relationship
  # below so the pack's three matching_pairs templates don't just recycle
  # the same tokens at each other.
  social_words_pool: &id014
    language_code: prs
    part_of_speech:
    - noun
    - verb
    - adverb
    - adjective
    agreement_tags:
      semantic:
      - politeness
      - title
  # occupation(4) + relationship_word(2) = 6 distinct "people & jobs" words
  # -- replaces the occupation-only preset (4 slots, below the 6-pair
  # floor). relationship_word is NOT reused in social_words_pool above.
  occupation_and_relationship: &id015
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic:
      - occupation
      - relationship_word
templates:
- content_key: practice.en-prs.prs.a1.unit02.lesson01.name_gloss.001
  lesson_content_key: prs.a1.unit02.lesson01.name_exchange
  type: multiple_choice
  frame:
    text: '{name_word}'
    language_code: prs
    direction: rtl
  slots:
    # NOT *id011: with the person_name union, 3 of 4 options were
    # "(name)" transliteration glosses (§6.1 proper_noun self-gloss).
    # This noun-only union of the unit's person words keeps the pool
    # >=3 distinct real glosses; names stay in translation-only
    # (name_translate.003).
    name_word:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic:
        - name_word
        - relationship_word
        - title
  answer_derivation:
    kind: slot_gloss
    slot: name_word
  feedback_frame:
    text: '{name_word} is a word used when meeting or addressing people.'
