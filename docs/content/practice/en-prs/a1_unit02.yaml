schema_version: '1.0'
pack_key: practice.en-prs.a1.unit02
source_language: en
target_language: prs
unit_content_key: prs.a1.unit02.introductions
review:
  status: unreviewed
  fresh_context: false
  notes: 'Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-05, closing the gap where en-prs''s practice pool
    only covered unit01 despite the realization/overlay already having units 1-7 (units 2-6 reviewed and stable, unit07 unreviewed/mid-edit
    -- correctly left alone). Extended scripts/backfill_lexemes_en_prs.py''s UNIT_FILES to cover unit02 (previously unit01
    only), hand-classifying all 28 genuinely new introduced_tokens directly from docs/content/realizations/prs/a1_unit02_introductions.yaml
    (checked against the existing unit01 token set first so no already-reviewed gloss/POS entry was silently overwritten).

    Found and fixed a real pre-existing bug while extending the classifier: "کابل" (Kabul, a city) was incorrectly tagged
    semantic=person_name in the ORIGINAL unit01-era code (grouped with real person names حامد/نجیب) -- moved it to a proper
    city_name tag (now shared with unit02''s هرات/مزار/شریف) instead.

    No listen_select anywhere in this pack, matching the existing a1_unit01.yaml pack''s own stated rule: Dari has zero TTS
    voice coverage project-wide, a hard exclusion, not a style choice.

    Deliberately did NOT pair the "title" slot (جناب/خانم, 2 candidates) with any specific person_name in a single frame --
    جناب is male-specific and خانم is female-specific, but this course''s lexeme model has no gender agreement tag on either
    titles or names yet, so a randomly-filled "{title} فریدون"-shaped frame would render the ungrammatical "خانم فریدون" (Ms.
    Faridun) roughly half the time. Same class of bug as the nl-en lane''s زیjn/homograph caution and this lane''s own en-fa/en-fa
    unit03/04 "quantity"/title-pairing avoidances -- verified via scripts/_practice_slot_check.py that no template below combines
    two independently-slotted values that could disagree on an untracked grammatical feature. "title" is tested standalone
    (multiple_choice/translation/a name-free fill_in_blank frame) instead.

    "title" (2 candidates) and "name_word" (3 candidates: نام/نام‌تان/نامت) are at or near the minimum for multiple_choice;
    "title" specifically is never used in multiple_choice here (2 < 3), only fill_in_blank/ translation. Not yet compiler-validated
    or DB-verified as of this writing (left for the end-of-session scripts/verify.sh run); status left unreviewed pending
    a real fresh-context review -- this lane does not self-certify review status, and human native-speaker review is still
    recommended before Dari content ships, per standing project policy.'
tag_schema:
  part_of_speech:
  - noun
  - proper_noun
  - verb
  - adjective
  - adverb
  agreement_tags:
    semantic:
    - name_word
    - person_name
    - city_name
    - country
    - city_word
    - occupation
    - title
    - relationship_word
    - politeness
    - dialogue_word
    - volume_en_prs_a1_unit02_city_name_02_single
    - volume_en_prs_a1_unit02_person_name_04_single
slot_presets:
  name_word: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: name_word
  person_name: &id002
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  city_name: &id003
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic: city_name
  country: &id005
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic: country
  city_or_country: &id004
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic:
      - city_name
      - country
  occupation: &id006
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: occupation
  title: &id008
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: title
  relationship_word: &id007
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: relationship_word
  politeness_word: &id009
    language_code: prs
    part_of_speech:
    - noun
    - verb
    - adverb
    - adjective
    agreement_tags:
      semantic: politeness
  dialogue_word: &id010
    language_code: prs
    part_of_speech:
    - noun
    - proper_noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: dialogue_word
