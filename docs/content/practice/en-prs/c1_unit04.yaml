schema_version: '1.0'
pack_key: practice.en-prs.c1.unit04
source_language: en
target_language: prs
unit_content_key: prs.c1.unit04.paziresh_va_pasokh
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: "Fresh-context review 2026-11-27 (en-prs C1 units 01-08 pass): 2 fixes - (1) feedback frames said '{item} ... from the lesson on <label>' but every pool is unit-wide (and several named a different lesson than the anchor), so they now say '{item} is one of this unit's words.', and word_order feedback no longer calls its sentence the model of the anchor lesson; (2) backfill C1 gloss fix: مخالف 'opposed (as in I disagree)' -> 'opposing; contrary' (pooled; the unit uses it in شواهد مخالف). Read every gloss in the 32-lexeme unit dump and the 26-lexeme pool; no same-gloss pair (مرحله / مرحلهٔ: only مرحله is pooled). Word_order anchors w_پرهزینه and w_فقط have 1 course-scope candidate each and are not literal words of their frames. Capacity (level+unit filter, TTS off): 17 live templates, recognition 5 / structured 7 / production 5, each hosting 26/32 lexemes (81%) and 5/5 lessons with lexemes; MC pools 26 distinct glosses, matching pools 26 >= 6; no dead template, so a checkpoint can be drawn. NATIVE FLAGS: none beyond the unit's realization flags. Earlier note: Derived by scripts/derive_target.py packs from the unit's realization/overlay and the en-prs backfill lexemes (tags prs_c1_u4 / w_<token>). 26 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit's own teaching lines. Needs native review of frames and feedback."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_اجرا, w_ارقام, w_اعتراض, w_باقی, w_بودجه, w_بیشتر, w_تعیین, w_حمایت, w_دامنه, w_داوری, w_درست, w_سنجش, w_شواهد, w_صدق, w_فقط, w_محدودسازی, w_مخالف, w_مرحله, w_مهم, w_موازنه, w_نشان, w_نهایی, w_همچنان, w_پذیرش, w_پرهزینه, w_کنونی]
