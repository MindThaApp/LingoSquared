schema_version: '1.0'
pack_key: practice.en-prs.a1.unit54
source_language: en
target_language: prs
unit_content_key: prs.a1.unit54.concert
review:
  status: reviewed
  fresh_context: 'true'
  notes: '**THIN UNIT** -- vocabulary unit (concert), only 4 lexemes total (1 is a proper noun, سیما,
    a person''s name), across 2 lexeme-bearing lessons (lesson03/04/05/06 introduced zero lexemes of their
    own). Recognition MC pool deliberately EXCLUDES the proper noun (part_of_speech: [noun] only) to avoid
    a self-gloss item (''Sima'' -> ''Sima''), leaving exactly 3 distinct glosses -- meets the MC floor
    with zero margin. Production/translation pool includes the proper noun (typing a transliterated name
    from its English gloss is legitimate). Structured: 2x word_order -- workplace_word (single candidate
    شروع within the A1 course; NOT direction-wide single, so this could not legally be fill_in_blank --
    4 more workplace_word tokens exist at A2/B1/B2) and concert_word (course-wide 2 members: کنسرت and
    خواننده, both fit ''in X ast''). 2026-07-24 polish wave 2: added a 3rd recognition MC (choose.006,
    REVERSED direction -- English gloss shown via slot_rendering, options are the Dari tokens via slot_text;
    backend build_prompt/_distractor_values and the unit-scope checker both support MC+slot_text, and
    this is the only way to get a genuinely non-clone 3rd MC when the unit''s only >=3-gloss pool is
    already used by both siblings) and a 3rd structured word_order (order.007, ''{item} خواننده است.''
    over person_name/proper_noun -- unit candidate سیما, matching lesson02''s own poster content; every
    course-scope person_name member is a name, so ''X is a singer'' stays grammatical). Both tiers now
    3 live. 1 extra fixed-sentence translation added for production depth. 9 templates total -- BELOW the 12-template floor and the >=40-distinct-item floor. Backfill-thin:
    lessons 03-06 contribute 0 lexemes each; routing to the backfill lane is the real fix. No mis-glossed
    lexemes found.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - concert_word
    - person_name
    - service_person_word
    - workplace_word
