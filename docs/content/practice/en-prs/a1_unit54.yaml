      language_code: prs
      part_of_speech: &id001
      - noun
      agreement_tags:
        semantic: &id002
        - concert_word
        - service_person_word
        - workplace_word
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is concert vocabulary from this unit.'
