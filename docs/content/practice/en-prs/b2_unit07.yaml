schema_version: '1.0'
pack_key: practice.en-prs.b2.unit07
source_language: en
target_language: prs
unit_content_key: prs.b2.unit07.negotiation
review:
  status: unreviewed
  fresh_context: 'false'
  required_next_reviewer: native_speaker_review
  notes: 'Authored 2026-10-19 against docs/content/PRACTICE_PACK_RECIPE.md to close the en-prs B2 unit-checkpoint
    gap (lexemes from the B2 extension of scripts/backfill_lexemes_en_prs.py, same commit series). Grammar/discourse
    unit, so the section 8.1 pattern is used: broad slots pool the whole unit and are shaped by part_of_speech,
    every template''s lesson_content_key stays on one lesson. 14 templates over all 3 lessons: multiple_choice
    x3, matching_pairs x2, word_order x4, translation x5 (3 bare-word + 2 fixed-sentence). No listen_select
    (no Dari TTS) and no fill_in_blank (the runtime shows no English cue, so a blank in a unit sentence
    is guessable only by recall; every such sentence is a word_order with the slot gloss as hint). TAGS
    (PRS_B2_EXTRA_TAGS): b2u07_core is the curated content-word pool for every multiple_choice and matching
    slot (no function words, proper nouns, -ید formal 2pl forms or helper participles; one side of each
    near-synonym gloss pair held out); b2u07_vert is core minus tokens whose English gloss another common
    Dari word also answers, for bare-word translation; single-member anchors pin the word_order frames
    (کرایه, سهم, قبول, خطر) and the fixed-sentence translations (دوم, قرارداد) to exactly one token at
    course scope. Every frame is a sentence from this unit''s own realization with one token slotted;
    the fixed-sentence English prompts are the overlay''s example_gloss for that sentence. B2 overrides
    used: حساب, شرایط terms, کاری working (adjective, was the B1 ''a job (that...)''), خراب damaged, می‌خواهد
    needs, موافق (English-only gloss). Held out of pools: شرایط (paraphrases شرط), موافق and قبول (paraphrase
    توافق), the formal 2pl بیایید. Realization flag: lesson02 exercise-8 target ends in ''بلند هستند''
    (ungrammatical). MEASURED (recipe section 9 step 4, filter .b2.unit07.): ALL 45/56 (80%), recognition
    44/56 (79%), structured 45/56 (80%), production 37/56 (66%); 3/3 lessons in every tier, no dead template,
    every MC slot >=3 distinct glosses, every matching pool >=6 tokens. Course scope: every word_order
    / fixed-sentence slot resolves to exactly 1 token, none is a literal word of its own frame. Offline
    port of generate_checkpoint() pass 1: 15/15 items on 5 seeds, all three tiers and all lessons represented.
    No gloss in any pool contains Dari script. Needs native-Dari review of the B2 glosses and a fresh-context
    review before import.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - b2u07_core
    - b2u07_vert
    - b2u07_rent_single
    - b2u07_share_single
    - b2u07_accepted_single
    - b2u07_risk_single
    - b2u07_second_single
    - b2u07_contract_single
