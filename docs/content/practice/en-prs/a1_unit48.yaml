review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Vocabulary unit (bike rental), 7 lexemes across all 6 lessons. Two of the 7 lexemes (کرایه ''rent'',
    روزانه ''daily'') carry ONLY the broad dialogue_word tag (209 course-wide members) in the backfill
    classification -- included in the recognition/production union for full 7/7 coverage on this already-thin
    unit; flagging per the recipe''s own note that dialogue_word is broad, but satisfiability is UNIT-scoped
    (checkpoint only sees this unit''s own 7 lexemes regardless of tag breadth) so this is safe for the
    checkpoint. 6 lessons x (MC+translate) = 12. Structured: 2x matching_pairs (6 of 7 tokens each, different
    anchors) + 1 word_order on office_word (course-wide 2 members: تذکره ''ID booklet'' and وقت ''appointment
    time'' -- both fit ''baraye keraye X lazem ast'' grammatically). No course-wide single-candidate tag
    existed for fill_in_blank. 15 templates, all tiers >=3 (recognition 6, structured 3, production 6),
    all 6 lessons covered. No mis-glossed lexemes found.'
