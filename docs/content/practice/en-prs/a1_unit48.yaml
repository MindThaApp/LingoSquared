schema_version: '1.0'
pack_key: practice.en-prs.a1.unit48
source_language: en
target_language: prs
unit_content_key: prs.a1.unit48.bike_rental
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Vocabulary unit (bike rental), 7 lexemes across all 6 lessons. Two of the 7 lexemes (کرایه ''rent'',
    روزانه ''daily'') carry ONLY the broad dialogue_word tag (209 course-wide members) in the backfill
    classification -- included in the recognition/production union for full 7/7 coverage on this already-thin
    unit; flagging per the recipe''s own note that dialogue_word is broad, but satisfiability is UNIT-scoped
    (checkpoint only sees this unit''s own 7 lexemes regardless of tag breadth) so this is safe for the
    checkpoint. 6 lessons x (MC+translate) = 12. Structured: 2x matching_pairs (6 of 7 tokens each, different
    anchors) + 1 word_order on office_word (course-wide 2 members: تذکره ''ID booklet'' and وقت ''appointment
    time'' -- both fit ''baraye keraye X lazem ast'' grammatically). No course-wide single-candidate tag
    existed for fill_in_blank. 15 templates, all tiers >=3 (recognition 6, structured 3, production 6),
    all 6 lessons covered. No mis-glossed lexemes found.


    Review 2026-10-24 (en-prs practice native-quality pass): 2 fixes. (1) MC/translation/matching pools
    narrowed from 285 course-wide dialogue_word/office_word/etc. tokens to the unit''s own 7 words (tag
    en_prs_a1_unit48_words); feedback ''from this unit'' now true. (2) order.005 frame ''برای کرایه {item}
    لازم است'' rendered nonsense for course-wide office_word members (e.g. ''برای کرایه شاروالی لازم است'')
    -> ''این {item} است.'' (grammatical for every office_word noun). NATIVE FLAGS: تذکره gloss ''national
    ID booklet''; ''بسیار خوب'' as ''very good'' (really ''all right/very well'' in the dialogue); کرایه
    ''rent'' as noun.'
  required_next_reviewer: native_speaker_review
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_prs_a1_unit48_words
    - office_word
