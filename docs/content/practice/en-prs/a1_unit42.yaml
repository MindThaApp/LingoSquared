schema_version: '1.0'
pack_key: practice.en-prs.a1.unit42
source_language: en
target_language: prs
unit_content_key: prs.a1.unit42.appointments
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (en-fa/en-prs practice pass, fresh context; 1 fix). (1) lesson04.order.001
    feedback was hard-coded to منشی استم although, in Endless Practice, the service_person_word slot
    also renders کتابدار/دلاک/پیشخدمت/... استم: feedback is now generic. All seven course-scope
    members are grammatical in {job} استم. The unit has only 3 lexemes (دندان, بگیرم, منشی), so most
    templates are single-member by necessity. NATIVE FLAGS: یک قرار با داکتر دندان می‌خواهم uses
    قرار for a dentist appointment; the realization's own source note cites وقت گرفتن (وقت داکتر
    دندان) as the live Afghan usage, so confirm قرار vs وقت/نوبت (realization lane).

    Pilot en-prs A1 practice pack (unit42 appointments), authored 2026-07-22.
    SEVERELY UNDER-PROVISIONED: only 3 lexemes exist for this unit
    (دندان=tooth/body_part_word, بگیرم="let me take"/dialogue_word+verb,
    منشی=receptionist/service_person_word+dialogue_word), spread over just 3 of the
    unit's 6 lessons (lesson01/03/04); lesson02/05/06 produce zero lexemes. This is
    below every recipe §8 bar and the unit's checkpoint will almost certainly return
    checkpoint_unavailable (a 12-item checkpoint cannot be drawn from 3 targets).
    Authored what the pool supports rather than padding with untaught vocab, per the
    dispatch. NO matching_pairs (needs 6 distinct tokens; only 3 exist). NO
    listen_select (no TTS). RECOMMEND to coordinator: this unit needs a
    backfill_lexemes_en_prs extension (its lessons teach قرار/آزاد/داکتر دندان/
    روز-of-week vocabulary that is not being classified into lexemes) before it can
    have a working checkpoint. NO structured tier at all: the only candidate frame
    ("قرار می‌خواهم {verb}" over the sole unit verb بگیرم) is unsafe because بگیرم's
    only tag, dialogue_word, pools 82 verbs at course scope (incl. می‌خواهم itself,
    a self-reference the integrity check flags) and no narrow anchor tag exists.
    Pack is recognition (1 MC) + production (3 translation) only. Afghan Dari
    register. No mis-glossed lexemes found.

    Polish wave 2 (2026-07-24): structured tier 0 -> 3 via safe anchors the
    original pass missed: body_part_word ∩ noun = {دندان} is single-member
    course-wide, so the taught hero sentence یک قرار با داکتر دندان می‌خواهم
    carries a word_order + a fill_in_blank; and "{item} استم" over
    service_person_word (منشی استم is taught verbatim; all 8 course-scope
    members are profession nouns, each grammatical). Recognition 1 -> 2 via an
    English-gloss-to-Dari-token MC (slot_text options, the mechanism the prs-en
    listen.002 corpus uses); a 3rd distinct recognition template is genuinely
    impossible with 3 unit lexemes/3 glosses — recognition stays honestly thin
    at 2. matching_pairs still impossible (3 tokens < 6).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - body_part_word
    - dialogue_word
    - service_person_word
templates:
# ---- recognition (pool = all 3 unit lexemes, exactly the 3-option floor) ----
- content_key: practice.en-prs.prs.a1.unit42.lesson04.choose.001
  lesson_content_key: prs.a1.unit42.lesson04.dentist_appointment_dialogue
  type: multiple_choice
  frame: {text: '{item}', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: [noun, verb]
      agreement_tags:
        semantic: [body_part_word, dialogue_word, service_person_word]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is a word from this unit.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit42.lesson03.choose.001
  lesson_content_key: prs.a1.unit42.lesson03.making_the_appointment
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: prs
      part_of_speech: [noun, verb]
      agreement_tags:
        semantic: [body_part_word, dialogue_word, service_person_word]
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: '{item} is the Dari word for this.'
    language_code: en
    direction: ltr
# ---- structured. The frame "قرار می‌خواهم {verb}" over the sole unit verb بگیرم
#      stays UNAUTHORED: بگیرم's only tag is dialogue_word, which pools 80+ verbs at
#      course scope (incl. می‌خواهم itself -> self-reference / ungrammatical frame).
#      Safe structured templates instead: the unit's hero sentence over the
#      single-course-wide-member body_part_word anchor (دندان), as word_order + fill,
#      and "{item} استم" over service_person_word (taught verbatim as منشی استم;
#      every course-scope member is a profession noun, all grammatical). ----
- content_key: practice.en-prs.prs.a1.unit42.lesson01.order.001
  lesson_content_key: prs.a1.unit42.lesson01.appointment_vocabulary
  type: word_order
  frame: {text: 'یک قرار با داکتر {item} می‌خواهم', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: body_part_word
  answer_derivation:
    kind: render_frame
    frame: {text: 'یک قرار با داکتر {item} می‌خواهم', language_code: prs, direction: rtl}
  feedback_frame:
    text: 'Word order: یک قرار با داکتر دندان می‌خواهم (I want an appointment with the dentist).'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit42.lesson01.fill.001
  lesson_content_key: prs.a1.unit42.lesson01.appointment_vocabulary
  type: fill_in_blank
  frame: {text: 'یک قرار با داکتر {item} می‌خواهم', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: body_part_word
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: 'داکتر دندان (tooth doctor) is the Dari word for dentist — the missing word is دندان.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit42.lesson04.order.001
  lesson_content_key: prs.a1.unit42.lesson04.dentist_appointment_dialogue
  type: word_order
  frame: {text: '{item} استم', language_code: prs, direction: rtl}
  slots:
    item:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: service_person_word
  answer_derivation:
    kind: render_frame
    frame: {text: '{item} استم', language_code: prs, direction: rtl}
  feedback_frame:
    text: 'Word order: [job] استم means "I am a [job]" (منشی استم: I am the receptionist).'
    language_code: en
    direction: ltr
# ---- production (one per lesson that has a lexeme) ----
- content_key: practice.en-prs.prs.a1.unit42.lesson01.translate.001
  lesson_content_key: prs.a1.unit42.lesson01.appointment_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: body_part_word
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: '{item} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit42.lesson03.translate.001
  lesson_content_key: prs.a1.unit42.lesson03.making_the_appointment
  type: translation
  frame:
    text: '{verb}'
    language_code: en
    direction: ltr
    slot_rendering: {verb: english_gloss}
  slots:
    verb:
      language_code: prs
      part_of_speech: verb
      agreement_tags:
        semantic: dialogue_word
  answer_derivation: {kind: slot_text, slot: verb}
  feedback_frame:
    text: '{verb} is the Dari form for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit42.lesson04.translate.001
  lesson_content_key: prs.a1.unit42.lesson04.dentist_appointment_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: service_person_word
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: '{item} is the Dari word for this.'
    language_code: en
    direction: ltr
