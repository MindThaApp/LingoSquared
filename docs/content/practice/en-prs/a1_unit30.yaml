schema_version: "1.0"
pack_key: practice.en-prs.a1.unit30
source_language: en
target_language: prs
unit_content_key: prs.a1.unit30.technology
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (en-fa/en-prs practice pass, fresh context; 1 fix). (1) phone_action_gloss.001
    had a single unit-scoped candidate (می‌فرستم), so the multiple_choice never built at checkpoint:
    slot widened to the union of phone_action_verb and this unit's own verbs (می‌فرستم, می‌گیرد,
    می‌فرستد; distinct glosses) and the feedback reworded. Frames, pools and the one word_order
    sentence (من هر روز از ... استفاده می‌کنم) read as natural Dari at unit and course scope; no
    Arabic Yeh/Kaf. NATIVE FLAGS: backfill gloss 'takes (third person)' for می‌گیرد is thin (in this
    unit it is 'takes (photos)'); realization lane.

    TIER-THINNESS POLISH 2026-07-24 (wave 2): recognition, structured and
    production tiers were 2/2/1 live. Added: lesson01 tech_use_gloss.003
    (MC on the existing tech_use_word preset, 3 distinct unit glosses
    mobile phone/computer/internet, exactly at the MC floor) and
    tech_use_translate.004 (bare-word translation, same preset); lesson02
    tech_online_gloss.002 (MC on a new tech_online_word preset = union of
    the unit's own tech_topic_word + online_habit_word tags --
    online_habit_word reaches the unit's own lesson02 دانلود "download" --
    7 distinct unit tokens/glosses) and send_verb_translate.003
    (bare-word translation on phone_action_verb; honest-thin at unit
    scope: only می‌فرستم is unit-native, می‌زنم/می‌گیرم are reused, but
    live and unit-taught; course pool's 3 glosses are all distinct);
    lesson05 tech_reading_pair.001 (matching_pairs, 6 slots, on
    tech_online_word -- 7 distinct unit tokens/glosses over the 6-pair
    floor; course scope adds only tech/online nouns: video, messaging
    app, game). online_habit_word added to tag_schema. All new frames are
    bare slot placeholders or pure matching placeholders -- no new Dari
    strings, no literal-text frames. Tiers now 4/3/3 live. Pre-existing
    below-MC-floor phone_action_gloss.001 (1 unit gloss) left as-is (not
    in this dispatch); the new MCs give the recognition tier 3
    floor-passing templates regardless. Status flipped back to unreviewed
    pending fresh-context review of the additions.

    Authored 2026-07-11, same A1 units 25-30 practice-pool
    depth-extension pass as this bundle's a1_unit25.yaml sibling (see
    that file's notes for the shared pass context) -- the last unit in
    this pass. Realization is status reviewed. تکنالوژی is the Afghan
    Dari spelling, straight from the realization.

    Three groups: "tech_topic_word" (تکنالوژی/موبایل/کمپیوتر/انترنت/
    اپلیکیشن/عکس, 6 members, completes lesson01 -- کمپیوتر/انترنت are
    REUSED existing lexemes; glosses technology/mobile phone/computer/
    internet/app/photo all distinct) is the recognition pool.
    "tech_use_word" (موبایل/کمپیوتر/انترنت, 3) is the subset the taught
    "از ... استفاده می‌کنم" frame actually uses (all three appear in
    that exact frame in the unit's own sentences); اپلیکیشن/عکس/
    تکنالوژی are excluded so the drilled sentences stay within what the
    unit teaches. "phone_action_verb" (می‌فرستم/می‌زنم/می‌گیرم, 3, all
    REUSED existing lexemes with genuinely distinct glosses: I send /
    I make (a call) / I take-receive) covers lesson02's phone actions
    as a recognition drill.

    Word_order template checked for grammaticality: "من هر روز از
    {tech_use_word} استفاده می‌کنم" (lesson03, matches the real taught
    "من هر روز از انترنت استفاده می‌کنم"; the موبایل and کمپیوتر
    variants appear verbatim in the unit's own question and dialogue
    lines).

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    No bare unquoted yes/no/true/false anywhere. Verified with
    scripts/_practice_slot_check.py (0 problems) and
    scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context
    review before import.

    Fresh-context review 2026-07-11 (Opus, zero access to authoring
    reasoning; sibling prs-en/en-prs overlays not consulted): PASS, no
    defects, status flipped to reviewed. Confirmed تکنالوژی/کمپیوتر/
    انترنت/موبایل are the Afghan Dari spellings (not Iranian
    تکنولوژی); tech_use_word (موبایل/کمپیوتر/انترنت) is the subset that
    reads naturally in "از ... استفاده می‌کنم" (اپلیکیشن/عکس/تکنالوژی
    excluded); phone_action_verb multiple_choice has exactly 3 distinct
    glosses (send / make-a-call / take-receive), meeting the MC floor;
    the word_order frame appears verbatim in the reviewed realization;
    matching_pairs covers all 6 distinct pairs with unique glosses; no
    listen_select/listen_type, no bare YAML booleans, no jargon leaks.
    practice-validate 0/0 and scripts/_practice_slot_check.py clean for
    the full en-prs set.
tag_schema:
  part_of_speech: [noun, verb]
  agreement_tags:
    semantic: [tech_topic_word, tech_use_word, phone_action_verb, online_habit_word, en_prs_a1_unit30_words]
slot_presets:
  tech_topic_word: &tech_topic_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: tech_topic_word}}
  tech_use_word: &tech_use_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: tech_use_word}}
  phone_action_verb: &phone_action_verb {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: phone_action_verb}}
  # Union of the unit's own tags: online_habit_word reaches the unit's own
  # lesson02 lexeme دانلود ("download"), giving 7 distinct unit-scoped tokens.
  unit_verb: &unit_verb {language_code: prs, part_of_speech: verb, agreement_tags: {semantic: [phone_action_verb, en_prs_a1_unit30_words]}}
  tech_online_word: &tech_online_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: [tech_topic_word, online_habit_word]}}
templates:
  # Lesson 1: device vocabulary.
  - content_key: practice.en-prs.prs.a1.unit30.lesson01.tech_gloss.001
    lesson_content_key: prs.a1.unit30.lesson01.device_vocabulary
    type: multiple_choice
    frame: {text: "{tech_topic_word}", language_code: prs, direction: rtl}
    slots: {tech_topic_word: *tech_topic_word}
    answer_derivation: {kind: slot_gloss, slot: tech_topic_word}
    feedback_frame: {text: "{tech_topic_word} belongs to this unit's technology vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit30.lesson01.tech_pair.002
    lesson_content_key: prs.a1.unit30.lesson01.device_vocabulary
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots: {word_one: *tech_topic_word, word_two: *tech_topic_word, word_three: *tech_topic_word, word_four: *tech_topic_word, word_five: *tech_topic_word, word_six: *tech_topic_word}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit30.lesson01.tech_use_gloss.003
    lesson_content_key: prs.a1.unit30.lesson01.device_vocabulary
    type: multiple_choice
    frame: {text: "{tech_use_word}", language_code: prs, direction: rtl}
    slots: {tech_use_word: *tech_use_word}
    answer_derivation: {kind: slot_gloss, slot: tech_use_word}
    feedback_frame: {text: "{tech_use_word} is a device or service you use every day.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit30.lesson01.tech_use_translate.004
    lesson_content_key: prs.a1.unit30.lesson01.device_vocabulary
    type: translation
    frame: {text: "{tech_use_word}", language_code: en, direction: ltr, slot_rendering: {tech_use_word: english_gloss}}
    slots: {tech_use_word: *tech_use_word}
    answer_derivation: {kind: slot_text, slot: tech_use_word}
    feedback_frame: {text: "{tech_use_word} is the Dari word for this.", language_code: en, direction: ltr}

  # Lesson 2: phone actions.
  - content_key: practice.en-prs.prs.a1.unit30.lesson02.phone_action_gloss.001
    lesson_content_key: prs.a1.unit30.lesson02.phone_actions
    type: multiple_choice
    frame: {text: "{phone_action_verb}", language_code: prs, direction: rtl}
    slots: {phone_action_verb: *unit_verb}
    answer_derivation: {kind: slot_gloss, slot: phone_action_verb}
    feedback_frame: {text: "{phone_action_verb} is a verb from this unit's phone and message talk.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit30.lesson02.tech_online_gloss.002
    lesson_content_key: prs.a1.unit30.lesson02.phone_actions
    type: multiple_choice
    frame: {text: "{tech_online_word}", language_code: prs, direction: rtl}
    slots: {tech_online_word: *tech_online_word}
    answer_derivation: {kind: slot_gloss, slot: tech_online_word}
    feedback_frame: {text: "{tech_online_word} belongs to this unit's technology vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit30.lesson02.send_verb_translate.003
    lesson_content_key: prs.a1.unit30.lesson02.phone_actions
    type: translation
    frame: {text: "{phone_action_verb}", language_code: en, direction: ltr, slot_rendering: {phone_action_verb: english_gloss}}
    slots: {phone_action_verb: *phone_action_verb}
    answer_derivation: {kind: slot_text, slot: phone_action_verb}
    feedback_frame: {text: "{phone_action_verb} is the Dari verb form for this phone action.", language_code: en, direction: ltr}

  # Lesson 3: how often do you use it?
  - content_key: practice.en-prs.prs.a1.unit30.lesson03.daily_use_order.001
    lesson_content_key: prs.a1.unit30.lesson03.frequency_question
    type: word_order
    frame: {text: "من هر روز از {tech_use_word} استفاده می‌کنم", language_code: prs, direction: rtl}
    slots: {tech_use_word: *tech_use_word}
    answer_derivation: {kind: render_frame, frame: {text: "من هر روز از {tech_use_word} استفاده می‌کنم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: من هر روز از [device] استفاده می‌کنم (I use the [device] every day).", language_code: en, direction: ltr}

  # Lesson 5: technology reading.
  - content_key: practice.en-prs.prs.a1.unit30.lesson05.tech_reading_pair.001
    lesson_content_key: prs.a1.unit30.lesson05.reading_technology
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots: {word_one: *tech_online_word, word_two: *tech_online_word, word_three: *tech_online_word, word_four: *tech_online_word, word_five: *tech_online_word, word_six: *tech_online_word}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 6: wrap-up.
  - content_key: practice.en-prs.prs.a1.unit30.lesson06.tech_translate.001
    lesson_content_key: prs.a1.unit30.lesson06.wrap_up
    type: translation
    frame: {text: "{tech_topic_word}", language_code: en, direction: ltr, slot_rendering: {tech_topic_word: english_gloss}}
    slots: {tech_topic_word: *tech_topic_word}
    answer_derivation: {kind: slot_text, slot: tech_topic_word}
    feedback_frame: {text: "{tech_topic_word} is the Dari word for this.", language_code: en, direction: ltr}
