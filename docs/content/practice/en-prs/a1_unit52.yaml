review:
  status: reviewed
  fresh_context: 'true'
  notes: '**THIN UNIT** -- vocabulary unit (cinema), only 4 lexemes total, across 2 lexeme-bearing lessons
    (lesson03/04/05/06 introduced zero lexemes of their own -- the backfill classification for this unit
    is sparse). Recognition+production union: cinema_word, schedule_word, film_word, third_person_possessive_word
    (2 lessons x2 = 4, exactly meeting the MC 3-distinct-gloss floor). Structured: 1 fill_in_blank on
    cinema_word (course-wide SINGLE candidate سینما) + 1 word_order on film_word (course-wide 2 members:
    آسمان ''sky/film title'' and فلم ''film'', both fit ''X khub ast''). 2026-07-24 polish wave 2: added
    a 3rd recognition MC (choose.006, lesson02''s own 3-tag pool schedule/film/possessive -- 3 distinct
    unit glosses, a genuinely different pool from the 4-tag sibling MCs) and a 3rd structured word_order
    (order.007, ''{item} سی افغانی است.'' from the unit''s own بلیطش سی افغانی است; slot third_person_possessive_word,
    all 4 course-wide members are price-able possessed nouns, so the frame stays grammatical at course
    scope). Both tiers now 3 live. 1 extra fixed-sentence translation added for production depth. 9 templates
    total -- BELOW the 12-template floor and the >=40-distinct-item floor. This unit is backfill-thin,
    not pack-authoring-thin: routing to the backfill lane for additional lexeme coverage (lessons 03-06
    currently contribute 0 lexemes each) would be the fix, not further padding here. No mis-glossed lexemes
    found in the 4 that exist.


    Review 2026-10-24 (en-prs practice native-quality pass): 4 fixes. (1) MC/translation pools narrowed
    from 15 course-wide tokens (week, sport, ''his bag'', ...) to the unit''s 4 words (en_prs_a1_unit52_words);
    choose.006 uses the lesson02 tag (3 words) instead of schedule/film/possessive course tags. (2) fill.003
    ''این ___ است.'' was open-ended -> ''ما فلم را در ___ می‌بینیم.'' (3) order.007 used third_person_possessive_word,
    which has 0 unit-scoped members (DEAD at checkpoint) and rendered off-unit nonsense like ''کبابش سی
    افغانی است'' -> ''تکت {item} سی افغانی است.'' over film_word (فلم/آسمان). NATIVE FLAGS: ''ما فلم را
    در سینما می‌بینیم''; ''تکت فلم سی افغانی است'' (vs تکت فلم آسمان).'
  required_next_reviewer: native_speaker_review
