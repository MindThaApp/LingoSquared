schema_version: "1.0"
pack_key: practice.en-prs.a1.unit29
source_language: en
target_language: prs
unit_content_key: prs.a1.unit29.sports
review:
  status: reviewed
  fresh_context: true
  notes: >-
    Authored 2026-07-11, same A1 units 25-30 practice-pool
    depth-extension pass as this bundle's a1_unit25.yaml sibling (see
    that file's notes for the shared pass context). Realization is
    status reviewed. کرکت (cricket) is genuinely Afghan sports
    vocabulary, straight from the realization.

    Three groups: "sport_topic_word" (ورزش/فوتبال/والیبال/کرکت/شنا/
    باشگاه, 6 members, spans lesson01+lesson03 -- ورزش is a REUSED
    existing lexeme; glosses sport/football/volleyball/cricket/swimming/
    gym all distinct) is the recognition pool. "ball_sport_word"
    (فوتبال/والیبال/کرکت, 3) is the strict subset that combines
    grammatically with "بازی می‌کنم" ("I play X") -- شنا composes as
    شنا می‌کنم instead, so drawing it into a بازی frame would produce
    the ungrammatical "شنا بازی می‌کنم," the same composition trap as
    unit24's پیاده/با split. "sport_place_word" (باشگاه/پارک, 2 --
    پارک REUSED) generalizes the taught location frame.

    Word_order templates checked for grammaticality: "من دو بار در
    هفته {ball_sport_word} بازی می‌کنم" (lesson02, matches the real
    taught "من دو بار در هفته فوتبال بازی می‌کنم" and the dialogue's
    والیبال variant, generalized to all 3 ball sports) and "در
    {sport_place_word} بازی می‌کنم" (lesson03, matches the real taught
    "در باشگاه بازی می‌کنم"; the پارک variant appears verbatim inside
    "من هر هفته در پارک فوتبال بازی می‌کنم").

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    No bare unquoted yes/no/true/false anywhere. Verified with
    scripts/_practice_slot_check.py (0 problems) and
    scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context
    review before import.

    Fresh-context review 2026-07-11 (Opus, zero access to authoring
    reasoning; sibling prs-en/en-prs overlays not consulted): PASS, no
    defects, status flipped to reviewed. Confirmed کرکت (cricket) is
    authentic Afghan sports vocabulary; ball_sport_word
    (فوتبال/والیبال/کرکت) is the strict subset that combines with بازی
    می‌کنم, so شنا (which takes شنا می‌کنم) is correctly excluded from
    the بازی frame; both word_order frames appear verbatim in / are
    grounded in the reviewed realization; matching_pairs covers all 6
    distinct pairs with unique glosses; word_order answers list-shaped;
    no listen_select/listen_type, no bare YAML booleans, no jargon
    leaks. practice-validate 0/0 and scripts/_practice_slot_check.py
    clean for the full en-prs set.
tag_schema:
  part_of_speech: [noun]
  agreement_tags:
    semantic: [sport_topic_word, ball_sport_word, sport_place_word]
slot_presets:
  sport_topic_word: &sport_topic_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: sport_topic_word}}
  ball_sport_word: &ball_sport_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: ball_sport_word}}
  sport_place_word: &sport_place_word {language_code: prs, part_of_speech: noun, agreement_tags: {semantic: sport_place_word}}
templates:
  # Lesson 1: sport vocabulary.
  - content_key: practice.en-prs.prs.a1.unit29.lesson01.sport_gloss.001
    lesson_content_key: prs.a1.unit29.lesson01.sport_vocabulary
    type: multiple_choice
    frame: {text: "{sport_topic_word}", language_code: prs, direction: rtl}
    slots: {sport_topic_word: *sport_topic_word}
    answer_derivation: {kind: slot_gloss, slot: sport_topic_word}
    feedback_frame: {text: "{sport_topic_word} belongs to this unit's sports vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit29.lesson01.sport_pair.002
    lesson_content_key: prs.a1.unit29.lesson01.sport_vocabulary
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots: {word_one: *sport_topic_word, word_two: *sport_topic_word, word_three: *sport_topic_word, word_four: *sport_topic_word, word_five: *sport_topic_word, word_six: *sport_topic_word}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 2: how often do you exercise?
  - content_key: practice.en-prs.prs.a1.unit29.lesson02.twice_a_week_order.001
    lesson_content_key: prs.a1.unit29.lesson02.frequency_question
    type: word_order
    frame: {text: "من دو بار در هفته {ball_sport_word} بازی می‌کنم", language_code: prs, direction: rtl}
    slots: {ball_sport_word: *ball_sport_word}
    answer_derivation: {kind: render_frame, frame: {text: "من دو بار در هفته {ball_sport_word} بازی می‌کنم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: من دو بار در هفته [sport] بازی می‌کنم (I play [sport] twice a week).", language_code: en, direction: ltr}

  # Lesson 3: where you play.
  - content_key: practice.en-prs.prs.a1.unit29.lesson03.play_location_order.001
    lesson_content_key: prs.a1.unit29.lesson03.location
    type: word_order
    frame: {text: "در {sport_place_word} بازی می‌کنم", language_code: prs, direction: rtl}
    slots: {sport_place_word: *sport_place_word}
    answer_derivation: {kind: render_frame, frame: {text: "در {sport_place_word} بازی می‌کنم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: در [place] بازی می‌کنم (I play at the [place]).", language_code: en, direction: ltr}

  # Lesson 6: wrap-up.
  - content_key: practice.en-prs.prs.a1.unit29.lesson06.sport_translate.001
    lesson_content_key: prs.a1.unit29.lesson06.wrap_up
    type: translation
    frame: {text: "{sport_topic_word}", language_code: en, direction: ltr, slot_rendering: {sport_topic_word: english_gloss}}
    slots: {sport_topic_word: *sport_topic_word}
    answer_derivation: {kind: slot_text, slot: sport_topic_word}
    feedback_frame: {text: "{sport_topic_word} is the Dari word for this.", language_code: en, direction: ltr}
