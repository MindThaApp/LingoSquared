schema_version: '1.0'
pack_key: practice.en-prs.a2.unit27
source_language: en
target_language: prs
unit_content_key: prs.a2.unit27.my_plans
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: 'Generated from the unit''s realization and en-prs backfill lexemes. Pools are unions of single-member w_<token> tags restricted to noun/verb/adjective/adverb, which keeps phrase rows, proper nouns,
    pronouns and particles out. No listen_select (prs has no TTS). Per lesson one multiple_choice and one bare-word translation (lesson pool if >=4 words, else unit pool); two curated matching_pairs templates
    with 6 slots and distinct glosses; word_order, fill_in_blank and fixed-sentence translation templates are single-member anchors on the unit''s own teaching sentences. Dari register: Kabul Dari, 2pl
    -ین, copula است/استند. Needs native review of frames and feedback. Excluded: می‌آیین (gloss ''will you come? (polite)'' does not match the ''you come'' paradigm sense it teaches); خواهم is recognition-only
    (multiple_choice) per the unit''s rule that the written future is never typed. Lessons 05 and 06 have no lexemes. Proper nouns مهتاب and لطیف are untagged and unused.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_استند
    - w_برود
    - w_بروند
    - w_بروی
    - w_برویم
    - w_بروین
    - w_بیاییم
    - w_تصمیم
    - w_خواهم
    - w_می‌آیند
    - w_می‌آیی
    - w_می‌آییم
    - w_می‌خرم
    - w_می‌خواهند
    - w_می‌خواهی
    - w_می‌خواهیم
    - w_می‌خواهین
    - w_می‌روند
    - w_می‌رویم
    - w_می‌روین
    - w_نمی‌خواهم
    - w_نمی‌خواهیم
    - w_نمی‌رود
    - w_نمی‌روند
    - w_نمی‌روی
    - w_نمی‌رویم
    - w_نمی‌روین
    - w_پوهنتون
