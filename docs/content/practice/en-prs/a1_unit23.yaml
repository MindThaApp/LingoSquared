schema_version: '1.0'
pack_key: practice.en-prs.a1.unit23
source_language: en
target_language: prs
unit_content_key: prs.a1.unit23.money
review:
  status: unreviewed
  fresh_context: false
  notes: 'Authored 2026-07-09, same practice-pool depth-extension pass as this bundle''s a1_unit20.yaml/a1_unit21.yaml/a1_unit22.yaml
    siblings (see a1_unit20.yaml''s notes for the shared pass context).

    New groups, all real vocabulary from this unit''s own realization: "money_word" (پول/نقد/کارت/دالر, 4 members, anchored
    lesson01) is the unit''s core recognition vocabulary. "countable_money_word" (کارت/دالر, 2 members -- additive subset
    of money_word, excludes the mass nouns پول/نقد) is used only where a "how many X" frame requires a genuinely countable
    noun -- composing "چند پول دارین" with a mass noun would be linguistically odd in a way "چند دالر دارین" isn''t, same
    class of grammaticality-driven subsetting as unit20''s eat_verb/unit22''s weather_precip_noun. "payment_verb" (می‌پردازم/می‌پردازین/بپردازم,
    3 members, completes lesson02) and "receive_verb" (می‌گیرم/گرفت/گرفتم, 3 members, completes lesson05) are both real distinct-gloss
    paradigms. "exchange_word" (صرافی/نرخ, 2 members) and "cash_or_card_adj" (نقدی/کارتی, 2 members) are genuine small closed
    sets, matching_pairs/translation only, per the established role_word/family_message_word precedent (AUTHORING_GUIDE.md).
    "can_verb" and "buy_verb" (both 1 member) are REUSED as-is from this pass''s own a1_unit21.yaml (genuinely the same words
    می‌توانم/می‌خرم, not new entries).

    Checked for the "fine"/"okay" gloss-collision trap: money_word''s 4 glosses (money/cash/card/dollar) and payment_verb''s
    3 (I pay/you pay (polite)/let me pay) are all genuinely distinct. Checked POS uniformity: all 4 money_word members are
    POS noun; all 3 payment_ verb and all 3 receive_verb members are POS verb.

    Word_order templates checked for grammaticality: "{money_word} دارم" (lesson01, "I have [money-word]", matches the real
    taught "صد دالر دارم" pattern generalized), "نقد {payment_verb}" (lesson02, all 3 forms combine grammatically with نقد
    -- "cash I- pay/you-pay/let-me-pay"), "امروز نرخ {currency_word} چند است" (lesson03, single-candidate دالر, matches "امروز
    نرخ دالر چند است" exactly), "{countable_money_word} چند دارین" (lesson04, restricted to the genuinely countable subset),
    and "می‌توانم {currency_word} را به افغانی تبدیل کنم" (lesson06, matches "می‌توانم دالر را به افغانی تبدیل کنم" exactly,
    reusing can_verb from a1_unit21.yaml).

    No listen_select/listen_type anywhere (en-prs has no TTS voices). The one fill_in_blank ("{receipt_word} می‌گیرم") uses
    رسید, a real single-project-wide-candidate group for THIS semantic tag (رسید itself is a REUSED A2-unit09 token that already
    carries a different tag there, paperwork_word -- additively layered, not overwritten, same precedent as منتظر/گرم/بمانیم
    elsewhere in this pass), verified via scripts/_fill_in_blank_ambiguity_check.py.

    Verified with scripts/_practice_slot_check.py (reusing backfill_lexemes_en_prs.py''s real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py practice-validate for the full en-prs pack -- 0 errors/0
    warnings. scripts/_fill_in_blank_ambiguity_check.py -- zero AMBIGUOUS flags. Needs the standard fresh-context review before
    import; no backfill_lexemes_en_prs.py run has happened against a real database yet in this pass.


    RE-AUTH PASS 2026-07-24 (scripts/_practice_unit_scope_check.py DEAD/FLOOR
    fixes, PACK-ONLY): the whole-direction slot check above never proved
    candidates exist WITHIN this unit''s own lessons, which is what
    generate_checkpoint() actually loads. (1) lesson06.can_exchange_order.002
    slotted "can_verb" (می‌توانم), REUSED as-is from a1_unit21 -- unit23 itself
    introduces zero can_verb lexemes, so this was 0 unit-scoped candidates,
    DEAD at checkpoint scope. Since PACK-ONLY forbids a backfill re-tag,
    replaced it (now lesson06.money_review_translate.002) with a bare-word
    translation over money_review_pool (money_word ∪ exchange_word, 6
    unit-scoped tokens, the same pool already verified safe for this
    lesson''s matching_pairs) -- this also fills a production-tier gap
    lesson06 otherwise had. (2) lesson01.money_word_pair.002 declared only 4
    matching_pairs slots (below the 6-pair floor). Widened to a new
    money_payment_review_word preset (money_word ∪ payment_verb, both native
    to this unit) -- 7 unit-scoped distinct tokens, now 6 slots. Removed the
    now-unused can_verb tag/preset. Both fixes keep every other template
    unchanged; no backfill/realization/overlay edits. Post-fix:
    scripts/_practice_unit_scope_check.py reports 0 DEAD, 0 below-floor for
    this pack.'
tag_schema:
  part_of_speech:
  - noun
  - verb
  - adjective
  - phrase
  agreement_tags:
    semantic:
    - money_word
    - countable_money_word
    - currency_word
    - payment_verb
    - cash_or_card_adj
    - exchange_word
    - exchange_noun
    - exchange_imperative
    - receipt_word
    - receive_verb
slot_presets:
  money_word: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: money_word
  countable_money_word: &id007
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: countable_money_word
  currency_word: &id005
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: currency_word
  payment_verb: &id002
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: payment_verb
  cash_or_card_adj: &id003
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: cash_or_card_adj
  exchange_word: &id004
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: exchange_word
  exchange_imperative: &id006
    language_code: prs
    part_of_speech: phrase
    agreement_tags:
      semantic: exchange_imperative
  receipt_word: &id008
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: receipt_word
  receive_verb: &id009
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: receive_verb
  money_review_pool: &id010
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic:
      - money_word
      - exchange_word
  # Re-anchor fix (2026-07-24): unions money_word (lesson01, 4) + payment_verb
  # (lesson02, 3) = 7 unit-scoped distinct tokens, so lesson01's review
  # matching_pairs clears the 6-pair floor from this unit's OWN vocabulary
  # (previously only 4 slots -- below floor).
  money_payment_review_word: &id012
    language_code: prs
    part_of_speech:
    - noun
    - verb
    agreement_tags:
      semantic:
      - money_word
      - payment_verb
templates:
- content_key: practice.en-prs.prs.a1.unit23.lesson01.money_word_gloss.001
  lesson_content_key: prs.a1.unit23.lesson01.money_vocabulary
  type: multiple_choice
  frame:
    text: '{money_word}'
    language_code: prs
    direction: rtl
  slots:
    money_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: money_word
  feedback_frame:
    text: '{money_word} names a form of money or payment.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit23.lesson01.money_word_pair.002
  lesson_content_key: prs.a1.unit23.lesson01.money_vocabulary
  # Re-anchor fix (2026-07-24): was money_word alone (4 slots, below the
  # 6-pair floor). Widened to money_payment_review_word (money_word ∪
  # payment_verb, both native to this unit) -- 7 unit-scoped distinct
  # tokens, comfortably clears the floor.
  type: matching_pairs
  frame:
    text: '{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}'
    language_code: prs
    direction: rtl
  slots:
    word_one: *id012
    word_two: *id012
    word_three: *id012
    word_four: *id012
    word_five: *id012
    word_six: *id012
  slot_relations:
  - kind: distinct
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
    - word_six
  answer_derivation:
    kind: matching_pairs
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
    - word_six
  feedback_frame:
    text: Match each word to its English meaning -- money and payment vocabulary.
    language_code: en
    direction: ltr
