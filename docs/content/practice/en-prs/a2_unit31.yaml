schema_version: '1.0'
pack_key: practice.en-prs.a2.unit31
source_language: en
target_language: prs
unit_content_key: prs.a2.unit31.polite_requests
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Authored for unit 31 from the realization and the en-prs backfill lexemes (tags w_<token> single-member anchors, en_prs_a2_unit31_lessonNN_words for phrase word_order). Broad recognition/production templates use unions of the unit''s w_ tags (lessons with fewer than 5 words draw on the whole unit); matching_pairs split into non-verbs and verbs. Sentence templates are single-lexeme anchors on the unit''s own teaching lines (Dari register: 2pl -ین, copula است/استم/استی). No listen_select (prs has no TTS). Glosses kept out of every pool: شیر (gloss "lion" but the unit teaches شیر = milk); نکشین (gloss "do not undergo" misrepresents زحمت نکشین (do not trouble yourself)). Not hosted: pronoun خودم and proper-noun names have no w_ tag or semantic tag (except unit-31 lesson 06 where names are the only lexemes: recognition/translation/word_order use proper_noun with no semantic tag, so at course scope they also draw on city and country names; glosses are ''X (name)'' / place names). Phrase lexemes are not drilled. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_آب, w_آقای, w_ببرین, w_بده, w_بدهد, w_بدهند, w_بدهی, w_برو, w_بفرستم, w_بگذار, w_بگذارم, w_بگذارین, w_بگو, w_بگیر, w_بیا, w_بیاور, w_خانم, w_دوکاندار, w_قند, w_لطف, w_میز, w_نده, w_ندهین, w_نرو, w_نروین, w_نکن, w_نکنین, w_نگذار, w_نگذارین, w_نگو, w_نگویین, w_نگیر, w_نگیرین, w_نیا, w_نیایین, w_همسایه, w_کن, w_کیسه, w_گل, w_گل‌هایم]
