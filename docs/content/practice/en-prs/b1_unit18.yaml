schema_version: '1.0'
pack_key: practice.en-prs.b1.unit18
source_language: en
target_language: prs
unit_content_key: prs.b1.unit18.future_plans
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    en-prs B1 practice pack (unit18 future_plans), authored 2026-11-06. VERY THIN: 10 lexemes in 4 of 6 lessons (lesson05 reading and lesson06 wrapup have ZERO lexemes and cannot be represented). Pool = unit tag en_prs_b1_unit18_words with pos noun/verb/adjective/adverb = 8 tokens (برنامه، حرکت، قصد، بیاید، احتمالاً، هفت، کجا، دارین); proper nouns پغمان/کابل are excluded by part_of_speech. 8 distinct tokens clear the 6-pair matching floor and the 3-option MC floor, but only barely.
        Glosses read: no mis-gloss found.
        Six single-candidate fill_in_blank anchors (lesson tag + pos): قصد, بیاید, احتمالاً, هفت, کجا, دارین. lesson01 (برنامه/حرکت, both nouns) has no single-candidate anchor and no safe word_order frame (حرکت does not fit 'چه ___ دارین'), so its structured coverage is matching_pairs only. No word_order: the lesson verbs/adverbs are already used as fill anchors. Lesson tags are unit-specific, so unit = course scope.
        16 templates: MC x4, fill x6, matching x2, translation x4. No listen_select (no prs TTS).
        Review 2026-11-06 (author pass, unreviewed): needs the standard
        fresh-context review before import.

tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_prs_b1_unit18_lesson01_words
    - en_prs_b1_unit18_lesson02_words
    - en_prs_b1_unit18_lesson03_words
    - en_prs_b1_unit18_lesson04_words
    - en_prs_b1_unit18_lesson05_words
    - en_prs_b1_unit18_words
slot_presets:
  unit_word: &uw
    language_code: prs
    part_of_speech: [noun, verb, adjective, adverb]
    agreement_tags:
      semantic: [en_prs_b1_unit18_words]
