schema_version: '1.0'
pack_key: practice.en-prs.c1.unit05
source_language: en
target_language: prs
unit_content_key: prs.c1.unit05.agar_chenin_bud
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: "Fresh-context review 2026-11-27 (en-prs C1 units 01-08 pass): 2 fixes - (1) feedback frames said '{item} ... from the lesson on <label>' but every pool is unit-wide (and several named a different lesson than the anchor), so they now say '{item} is one of this unit's words.', and word_order feedback no longer calls its sentence the model of the anchor lesson; (2) backfill C1 gloss fix: روشن 'turned on; lit' -> 'clear' (pooled, so the wrong sense was shown as the correct answer; the unit and unit08 use it in نتیجهٔ روشن / طرح روشن). Read every gloss in the 35-lexeme unit dump and the 24-lexeme pool; می‌خورد 'eats; takes' (افسوس می‌خورد) is not pooled. Word_order anchors w_چنین, w_تیم, w_جدول have 1 course-scope candidate each and are not literal words of their frames. Capacity (level+unit filter, TTS off): 18 live templates, recognition 5 / structured 8 / production 5, each hosting 24/35 lexemes (69%) and 5/5 lessons with lexemes; MC pools 24 distinct glosses, matching pools 24 >= 6; no dead template, so a checkpoint can be drawn. NATIVE FLAGS: the pool keeps auxiliary forms (کرده, بودیم, بود, کنیم) with grammatical glosses. Earlier note: Derived by scripts/derive_target.py packs from the unit's realization/overlay and the en-prs backfill lexemes (tags prs_c1_u5 / w_<token>). 24 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit's own teaching lines. Needs native review of frames and feedback."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ابراز, w_استدلال, w_امروز, w_انتخاب, w_بررسی, w_بود, w_بودیم, w_تیم, w_جدول, w_خطر, w_درخواست, w_دیگری, w_روشن, w_زمانی, w_زود, w_شرط, w_ممکن, w_منطقی, w_نکرد, w_پشیمانی, w_چنین, w_کرده, w_کنیم, w_گذشته]
