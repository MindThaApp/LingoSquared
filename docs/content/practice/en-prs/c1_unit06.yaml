schema_version: '1.0'
pack_key: practice.en-prs.c1.unit06
source_language: en
target_language: prs
unit_content_key: prs.c1.unit06.zaban_kenayei
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: "Fresh-context review 2026-11-27 (en-prs C1 units 01-08 pass): 3 fixes - (1) feedback frames said '{item} ... from the lesson on <label>' but every pool is unit-wide (and several named a different lesson than the anchor), so they now say '{item} is one of this unit's words.', and word_order feedback no longer calls its sentence the model of the anchor lesson; (2) the realization's lesson04 tokens lost their attached guillemets, and the union pool gained می‌گوییم 'we say', می‌گیریم 'we take (in take a decision)' and می‌کنیم 'we do', so lesson04 is now hosted in every tier (was 4/5 lessons); (3) backfill C1 fixes: نه 'nine' (adjective, ones_number tag) -> 'not (as in X, not Y)' (particle, tag dropped); نمی‌کند 'does not work' -> 'does not (do)'; a gloss for the bare token می‌گیریم. Read every gloss in the 31-lexeme unit dump and the 22-lexeme pool; no same-gloss pair. Word_order anchors w_ترجمه, w_کمبود, w_مبالغه have 1 course-scope candidate each and are not literal words of their frames. Capacity (level+unit filter, TTS off): 19 live templates, recognition 6 / structured 8 / production 5, each hosting 22/31 lexemes (71%) and 5/5 lessons with lexemes; MC pools 22 distinct glosses, matching pools 22 >= 6; no dead template, so a checkpoint can be drawn. NATIVE FLAGS: وقت keeps the inherited gloss 'appointment / time' (the unit means time). Earlier note: Derived by scripts/derive_target.py packs from the unit's realization/overlay and the en-prs backfill lexemes (tags prs_c1_u6 / w_<token>). 19 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit's own teaching lines. Needs native review of frames and feedback."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_اثر, w_استعاره, w_اصطلاح, w_بند, w_ترجمه, w_تصویر, w_ثابت, w_دست, w_سبک, w_طبیعی, w_مبالغه, w_مجازی, w_مویی, w_هشدار, w_همنشینی, w_وقت, w_پرهیز, w_پروژه, w_کمبود, w_می‌گوییم, w_می‌گیریم, w_می‌کنیم]
