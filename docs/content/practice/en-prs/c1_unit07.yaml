schema_version: '1.0'
pack_key: practice.en-prs.c1.unit07
source_language: en
target_language: prs
unit_content_key: prs.c1.unit07.miyanjigari_manabe
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: "Fresh-context review 2026-11-27 (en-prs C1 units 01-08 pass): 3 fixes - (1) feedback frames said '{item} ... from the lesson on <label>' but every pool is unit-wide, so they now say '{item} is one of this unit's words.'; (2) fixed-sentence feedback called each sentence 'the exact model sentence for the lesson' while several templates are anchored to a different lesson; it now says 'a model sentence from this unit'; (3) the fixed-sentence translation 'The two sources differ in estimating the final cost' only accepted هزینهٔ with the ezafe hamza; it now carries accepted_variants with the hamza-less spelling. Read every gloss in the 17-lexeme unit dump and the 13-lexeme pool; no same-gloss pair. Every sentence template (6 word_order, 1 fill_in_blank, 1 fixed translation) uses a single-member anchor with 1 course-scope candidate, not a literal word of its frame; the fill_in_blank hint slot renders the English gloss. Capacity (level+unit filter, TTS off): 13 live templates, recognition 3 / structured 7 / production 3, each hosting 13/17 lexemes (76%) and 5/5 lessons with lexemes; MC pools 13 distinct glosses, matching pools 13 >= 6; no dead template, so a checkpoint can be drawn (thin recognition/production tiers: 13 distinct prompts each). NATIVE FLAGS: none beyond the unit's realization flags. Earlier note: Derived by scripts/derive_target.py packs from the unit's realization/overlay and the en-prs backfill lexemes (tags prs_c1_u7 / w_<token>). 13 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit's own teaching lines. Needs native review of frames and feedback."
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_اختلاف
    - w_افزایش
    - w_بهتر
    - w_تخمین
    - w_ترکیب
    - w_توافق
    - w_دارند
    - w_دوم
    - w_غیرمتخصص
    - w_منبع
    - w_نخست
    - w_هزینه
    - w_کیفیت
templates:
- content_key: practice.en-prs.prs.c1.unit07.lesson01.choose.001
  lesson_content_key: prs.c1.unit07.miyanjigari_manabe.lesson01
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
  slots:
    item: &id001
      language_code: prs
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_منبع
        - w_نخست
        - w_دوم
        - w_توافق
        - w_اختلاف
        - w_ترکیب
        - w_افزایش
        - w_هزینه
        - w_غیرمتخصص
        - w_دارند
        - w_کیفیت
        - w_بهتر
        - w_تخمین
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is one of this unit''s words.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.c1.unit07.lesson02.choose.001
  lesson_content_key: prs.c1.unit07.miyanjigari_manabe.lesson02
  type: multiple_choice
