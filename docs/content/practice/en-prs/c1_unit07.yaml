- content_key: practice.en-prs.prs.c1.unit07.lesson04.match.001
  lesson_content_key: prs.c1.unit07.miyanjigari_manabe.lesson04
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: prs
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
