schema_version: '1.0'
pack_key: practice.en-prs.a1.unit14
source_language: en
target_language: prs
unit_content_key: prs.a1.unit14.preferences
review:
  status: reviewed
  fresh_context: true
  notes: 'UNIT-SCOPE REPAIR 2026-07-24 (pack-only): _practice_unit_scope_check.py found
    9 DEAD templates + 3 below-floor. LOG FOR COORDINATOR: `preference_verb`
    (دارم/ندارم/دارد/ندارد/دارین) has ZERO unit14-scoped candidates -- despite this
    file''s original notes claiming all 5 members were added for this unit, iter_specs()
    shows every one anchored to a1 unit03 instead; a pack-only fix cannot move them.
    This broke preference_verb_gloss.001, preference_verb_translate.002 (lesson02) and
    preference_verb_pair.002 (lesson05, needed 5 distinct, had 0). Also LOG: person_name
    (کریم) is only 1 distinct at unit14 scope (person_name_gloss.001 below the MC floor;
    person_name_pair.002 needed 12, had 1). This unit''s real own vocabulary is exactly
    7 content tokens (قهوه/موسیقی preference_topic, جالب/گرم description_adjective,
    بیشتر/یا choice_word, چون connector_word -- a tag not previously declared in this
    pack''s schema, added now) plus 1 name (کریم). Fixed all 9 DEAD + 3 below-floor by
    re-anchoring to unions of these 7 real tokens: preference_topic_gloss.001 (was 2
    distinct) and topic_description_pair.003 (was 4, needed 6) widened within
    topic-adjacent tags (topic_and_description, then +choice_word for the pair, 6
    distinct exact); choice_word_gloss.003 (was 2 distinct) widened with connector_word
    (3 distinct); preference_verb_gloss.001/translate.002, preference_verb_pair.002 (slots
    5->6), person_name_gloss.001, and person_name_pair.002 (slots 12->6) all re-anchored
    to a new unit_wide_pool unioning all 7 tokens (topic+description+choice+connector).
    No templates dropped -- unlike its a1_unit12/13 siblings, unit14''s real 7-token
    vocabulary was just barely enough to widen every dead/floor slot without needing a
    replacement. Post-fix: _practice_unit_scope_check.py reports 0 DEAD, 0 below-floor
    (16 templates, unchanged count); practice-validate 0 errors (see coordinator report).
    Pre-existing authoring notes below, retained for provenance.

    Authored 2026-07-07 for the new A1 unit14 (preferences) realization, same pass as this bundle''s a1_unit12/13.yaml
    siblings (see a1_unit12.yaml''s notes for the full extension context: a parallel session authored units 09-11''s practice
    pool separately, this bundle only touches units 12-15).

    Four new groups plus reuse of the course-wide person_name pool: preference_verb (دارم/ندارم/دارد/ندارد/دارین, 5 members
    -- all keep their literal "have/has" glosses, since the idiomatic "like" meaning comes from the دوست دارم construction
    as a whole, not any single re-glossed token), preference_topic (قهوه/چای/موسیقی, 3 members -- coffee/tea/music, the three
    "things you can like or dislike" in this unit, deliberately its own tag rather than pooled into the unrelated food_item
    group), description_adjective (خوش‌مزه/جالب/گرم, 3 members, pooled with preference_topic for one 6-pair matching_pairs
    template), and choice_word (کدام/یا/بیشتر, 3 members). warm_word is a private single-candidate tag layered on گرم (on
    top of description_adjective), used only by this pack''s own fill_in_blank template. نگار/کریم needed their person_name
    semantic tag added here (a real pre-existing gap -- both were already glossed from earlier units but never tagged), reusing
    the course-wide 12-member pool.

    The one fill_in_blank template (warm_word/گرم) is a real single-project-wide-candidate group, verified via scripts/_fill_in_blank_ambiguity_check.py
    -- the frame also embeds real disambiguating context (چای را دوست دارم چون ... است) even though the constraint alone already
    guarantees a single candidate. No listen_select/listen_type anywhere. No bare unquoted yes/no/true/false anywhere.

    Verified with scripts/_practice_slot_check.py (reusing backfill_lexemes_en_prs.py''s real iter_specs() output) -- every
    slot has enough distinct candidates. scripts/compile_content.py practice-validate for the full en-prs pack -- 0 errors/0
    warnings. Needs the standard fresh-context review before import; no backfill_lexemes_en_prs.py run has happened against
    a real database yet in this pass.'
tag_schema:
  part_of_speech:
  - noun
  - verb
  - adjective
  - particle
  - pronoun
  - proper_noun
  agreement_tags:
    semantic:
    - preference_verb
    - preference_topic
    - description_adjective
    - warm_word
    - choice_word
    - person_name
    - connector_word
slot_presets:
  preference_verb: &id003
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: preference_verb
  preference_topic: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: preference_topic
  description_adjective: &id005
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: description_adjective
  warm_word: &id006
    language_code: prs
    part_of_speech: adjective
    agreement_tags:
      semantic: warm_word
  choice_word: &id004
    language_code: prs
    part_of_speech:
    - pronoun
    - particle
    - adjective
    agreement_tags:
      semantic: choice_word
  person_name: &id007
    language_code: prs
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  topic_and_description: &id002
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic:
      - preference_topic
      - description_adjective
  # UNIT-SCOPE REPAIR 2026-07-24: `preference_verb` has ZERO unit14-scoped
  # candidates (its 5 members -- دارم/ندارم/دارد/ندارد/دارین -- are all
  # registered to a1 unit03, despite this file's original notes claiming
  # they were re-added here; verified via iter_specs()). This unit's ONLY
  # real content vocabulary is 7 tokens across preference_topic (قهوه/
  # موسیقی), description_adjective (جالب/گرم), choice_word (بیشتر/یا) and
  # connector_word (چون) -- unioned here as the full-unit review pool (7
  # distinct). Reused by every template that used to constrain on the
  # 0-candidate preference_verb or the 1-distinct person_name alone:
  # preference_verb_gloss.001, preference_verb_translate.002 (both
  # lesson02), preference_verb_pair.002 (lesson05), person_name_gloss.001,
  # person_name_pair.002 (both lesson06).
  unit_wide_pool: &id008
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    - pronoun
    - particle
    agreement_tags:
      semantic:
      - preference_topic
      - description_adjective
      - choice_word
      - connector_word
  # Narrower union for choice_word_gloss.003 (lesson02): choice_word alone
  # is only 2 distinct (بیشتر/یا) at unit14 scope, below the MC floor.
  # Adding connector_word (چون) reaches exactly 3.
  choice_and_connector: &id009
    language_code: prs
    part_of_speech:
    - adjective
    - particle
    agreement_tags:
      semantic:
      - choice_word
      - connector_word
  # Narrower union for topic_description_pair.003 (lesson01
  # matching_pairs): preference_topic + description_adjective alone is
  # only 4 distinct, below the needed 6. Adding choice_word reaches
  # exactly 6 (قهوه/موسیقی/جالب/گرم/بیشتر/یا).
  topic_description_choice: &id010
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    - particle
    agreement_tags:
      semantic:
      - preference_topic
      - description_adjective
      - choice_word
templates:
- content_key: practice.en-prs.prs.a1.unit14.lesson01.preference_topic_gloss.001
  lesson_content_key: prs.a1.unit14.lesson01.basic_likes
  # UNIT-SCOPE REPAIR 2026-07-24: preference_topic alone is only 2
  # distinct at unit14 scope (قهوه/موسیقی), below the 3-option MC floor.
  # Widened to topic_and_description (4 distinct: coffee/music/
  # interesting/warm).
  type: multiple_choice
  frame:
    text: '{preference_topic}'
    language_code: prs
    direction: rtl
  slots:
    preference_topic: *id002
  answer_derivation:
    kind: slot_gloss
    slot: preference_topic
  feedback_frame:
    text: '{preference_topic} is something you can like or dislike.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit14.lesson01.preference_topic_translate.002
  lesson_content_key: prs.a1.unit14.lesson01.basic_likes
  type: translation
  frame:
    text: '{preference_topic}'
    language_code: en
    direction: ltr
    slot_rendering:
      preference_topic: english_gloss
  slots:
    preference_topic: *id001
  answer_derivation:
    kind: slot_text
    slot: preference_topic
  feedback_frame:
    text: '{preference_topic} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit14.lesson01.topic_description_pair.003
  lesson_content_key: prs.a1.unit14.lesson01.basic_likes
  # UNIT-SCOPE REPAIR 2026-07-24: was topic_and_description alone (4
  # distinct), needed 6 -> DEAD. Widened to topic_description_choice
  # (adds choice_word: بیشتر/یا), reaching exactly 6 distinct.
  type: matching_pairs
  frame:
    text: '{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}'
    language_code: prs
    direction: rtl
  slots:
    word_one: *id010
    word_two: *id010
    word_three: *id010
    word_four: *id010
    word_five: *id010
    word_six: *id010
  slot_relations:
  - kind: distinct
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
    - word_six
  answer_derivation:
    kind: matching_pairs
    slots:
    - word_one
    - word_two
    - word_three
    - word_four
    - word_five
    - word_six
  feedback_frame:
    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit14.lesson01.topic_order.004
  lesson_content_key: prs.a1.unit14.lesson01.basic_likes
  type: word_order
  frame:
    text: '{preference_topic} را دوست دارم'
    language_code: prs
    direction: rtl
  slots:
    preference_topic: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: '{preference_topic} را دوست دارم'
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'Word order: [thing] را دوست دارم (I like [thing]).'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit14.lesson02.preference_verb_gloss.001
  lesson_content_key: prs.a1.unit14.lesson02.asking_preferences
  # UNIT-SCOPE REPAIR 2026-07-24: `preference_verb` has ZERO
  # unit14-scoped candidates (its 5 members are registered to a1 unit03
  # -- LOG FOR COORDINATOR, see review notes). Re-anchored to the
  # unit_wide_pool (7 distinct: coffee/music/interesting/warm/more/or/because).
  type: multiple_choice
  frame:
    text: '{preference_verb}'
    language_code: prs
    direction: rtl
  slots:
    preference_verb: *id008
  answer_derivation:
    kind: slot_gloss
    slot: preference_verb
  feedback_frame:
    text: '{preference_verb} is one of this unit''s preference/reason words.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit14.lesson02.preference_verb_translate.002
  lesson_content_key: prs.a1.unit14.lesson02.asking_preferences
  # UNIT-SCOPE REPAIR 2026-07-24: same 0-candidate `preference_verb`
  # defect as the MC sibling above. Re-anchored to unit_wide_pool.
  type: translation
  frame:
    text: '{preference_verb}'
    language_code: en
    direction: ltr
    slot_rendering:
      preference_verb: english_gloss
  slots:
    preference_verb: *id008
  answer_derivation:
    kind: slot_text
    slot: preference_verb
  feedback_frame:
    text: '{preference_verb} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit14.lesson02.choice_word_gloss.003
  lesson_content_key: prs.a1.unit14.lesson02.asking_preferences
  # UNIT-SCOPE REPAIR 2026-07-24: choice_word alone is only 2 distinct
  # (بیشتر/یا) at unit14 scope, below the MC floor. Widened to
  # choice_and_connector (adds چون "because"), reaching 3 distinct.
  type: multiple_choice
  frame:
    text: '{choice_word}'
    language_code: prs
    direction: rtl
  slots:
    choice_word: *id009
  answer_derivation:
    kind: slot_gloss
    slot: choice_word
  feedback_frame:
    text: '{choice_word} is used when asking about or comparing preferences.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit14.lesson03.choice_word_translate.001
  lesson_content_key: prs.a1.unit14.lesson03.choosing_between_options
  type: translation
  frame:
