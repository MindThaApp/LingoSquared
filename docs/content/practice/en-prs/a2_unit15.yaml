  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - depart_noun
    - disruption_word
    - station_word
    - transport_mode_word
    - travel_disruption_phrase
