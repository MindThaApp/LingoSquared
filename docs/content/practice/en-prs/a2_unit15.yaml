- content_key: practice.en-prs.prs.a2.unit15.lesson04.match.002
  lesson_content_key: prs.a2.unit15.lesson04.station_dialogue
  # POLISH WAVE 2 2026-07-24: was a bare-POS pool (verb/adjective/adverb/
  # pronoun/particle/preposition, no semantic constraint) -- fine at unit
  # scope but pulls the whole level's vocabulary at Endless-Practice COURSE
  # scope (recipe SS1.1/SS6.3). The unit's word-form tags cover only 2
  # distinct non-core tokens (امروز/هشت, <6), so the pool is now the
  # unit-native travel_disruption_phrase tag instead: 11 unit-scoped
  # sentences/phrases spanning all four lessons, zero course-scope extras.
  # Frame switched to the English instruction style this direction's other
  # phrase matching_pairs already use (a2_unit09 bureaucracy_phrase_pair.002,
  # a2_unit10 opinion_phrase_pair.007).
  type: matching_pairs
  frame:
    text: Match each sentence or phrase with its meaning.
    language_code: en
    direction: ltr
  slots:
    first: &pool_forms
      language_code: prs
      part_of_speech:
      - phrase
      agreement_tags:
        semantic:
        - travel_disruption_phrase
    second: *pool_forms
    third: *pool_forms
    fourth: *pool_forms
    fifth: *pool_forms
    sixth: *pool_forms
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
