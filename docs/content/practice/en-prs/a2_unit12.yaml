        - seek_help_noun
        - symptom_word
    second: *pool_core
    third: *pool_core
    fourth: *pool_core
    fifth: *pool_core
    sixth: *pool_core
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: "Match each doctor's-visit word with its English meaning."
