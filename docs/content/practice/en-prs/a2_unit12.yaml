- content_key: practice.en-prs.prs.a2.unit12.lesson04.match.002
  lesson_content_key: prs.a2.unit12.lesson04.doctor_visit_dialogue
  # POLISH WAVE 2 2026-07-24: was a bare-POS pool (verb/adjective/adverb/
  # pronoun/particle/preposition, no semantic constraint) -- fine at unit
  # scope but pulls the whole level's vocabulary at Endless-Practice COURSE
  # scope (recipe SS1.1/SS6.3). A union of the unit's conversational
  # word-form tags was considered and rejected: at course scope it pulls
  # near-synonym rights (تشکر 'thanks' vs شکر 'thank God; thanks', صاحب vs
  # جناب both 'sir') -- confusable-rights defect. The pool is now the
  # unit-native doctor_phrase tag instead: 9 unit-scoped sentences/phrases
  # spanning all four lessons, zero course-scope extras, all rights
  # distinct. Frame switched to the English instruction style this
  # direction's other phrase matching_pairs already use (a2_unit09
  # bureaucracy_phrase_pair.002, a2_unit10 opinion_phrase_pair.007).
  # KNOWN WART (corpus-side, not fixable pack-only): the lexeme token
  # 'از دو روز پیش (since two days ago)' has its English gloss baked into
  # the token, so that one pair is self-answering when drawn. Needs a
  # backfill_lexemes_en_prs.py token fix -- LOGGED for the coordinator.
  type: matching_pairs
  frame:
    text: Match each sentence or phrase with its meaning.
    language_code: en
    direction: ltr
  slots:
    first: &pool_forms
      language_code: prs
      part_of_speech:
      - phrase
      agreement_tags:
        semantic:
        - doctor_phrase
    second: *pool_forms
    third: *pool_forms
    fourth: *pool_forms
    fifth: *pool_forms
    sixth: *pool_forms
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: "Match each Dari sentence or phrase from this unit's doctor's-visit scenario with its English meaning."
    language_code: en
    direction: ltr

