- content_key: practice.en-prs.prs.a1.unit41.lesson05.translate.001
  lesson_content_key: prs.a1.unit41.lesson05.reading
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *item_any
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
