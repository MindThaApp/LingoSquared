schema_version: '1.0'
pack_key: practice.en-prs.a2.unit35
source_language: en
target_language: prs
unit_content_key: prs.a2.unit35.before_after_when
review: {status: reviewed, required_next_reviewer: native_speaker_review, fresh_context: 'true', notes: 'Fresh-context review 2026-11-27 (en-prs A2 units 34-39 pass): 0 fixes. Dumped the unit pool (31 lexemes, 6 lessons) and read every gloss against the unit (شام evening; dinner, خرد chopped, جوش boiling and می‌شوی you become are the parts of the taught phrases and are displayed honestly). Checked every fixed sentence frame: each anchor has one course-wide candidate, no frame word is a candidate of its own slot, and every frame is a sentence the unit teaches. MC pools have at least 4 distinct glosses; matching pools have at least 8 tokens. Capacity: 41 live templates, ALL 84%, recognition 74%, structured 81%, production 77%, 6/6 lessons in every tier, no dead templates. Hand-authored (not derive_target). Lexeme pool read in full. Unit-wide tag en_prs_a2_unit35_words and per-lesson tags drive the broad recognition/production/matching slots (pos noun/verb/adjective/adverb); sentence templates are single-lexeme w_<token> anchors on the unit''s own teaching lines (Kabul Dari, copula است/استم, 2pl -ین). Excluded from every pool: the conjugation-table lexeme ''من برسم، تو برسی، …'' (long multi-form gloss; phrase pos is only used in single-lesson pools made of clean single sentences or one phrase: lesson01 لباس پوشیدن, lesson05, lesson06). Proper nouns نرگس/اکبر/یوسف/نسرین are not hosted (no semantic tag; an untagged proper_noun slot would pull all 61 course names and places, some self-glossed such as Kabul). Glosses to check: خرد ''chopped (as in to chop)'' and جوش ''boiling'' are the parts of the phrases خرد کردن / جوش شدن; انداختم ''I threw; put in'' vs می‌اندازم ''I add / I throw in'' overlap in sense; می‌شوی ''you become; you get'' is taught as part of بیدار می‌شوی (wake up); شام ''evening; dinner''.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [en_prs_a2_unit35_lesson01_words, en_prs_a2_unit35_lesson02_words, en_prs_a2_unit35_lesson03_words, en_prs_a2_unit35_lesson04_words, en_prs_a2_unit35_lesson05_words, en_prs_a2_unit35_lesson06_words, en_prs_a2_unit35_words, w_انداختم, w_برسند, w_برسی, w_برنج, w_تکت, w_جوش, w_خرد, w_شام, w_لباس, w_می‌اندازم, w_می‌بندم, w_می‌خورم, w_می‌رسم, w_می‌شوی, w_می‌پزم, w_می‌پوشم, w_نمک, w_پختم, w_پیاز, w_چمدان, w_چمدانم, w_کارم]
