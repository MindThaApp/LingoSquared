schema_version: '1.0'
pack_key: practice.en-prs.a2.unit36
source_language: en
target_language: prs
unit_content_key: prs.a2.unit36.in_order_to
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Hand-authored (not derive_target). Lexeme pool read in full. Unit-wide tag en_prs_a2_unit36_words and per-lesson tags drive the broad recognition/production/matching slots (pos noun/verb/adjective/adverb); sentence templates are single-lexeme w_<token> anchors on the unit''s own teaching lines (Kabul Dari, copula است/استم, 2pl -ین). Excluded from every pool: the list lexeme ''خریدن: بخرم. رفتن: بروم. …'', the table lexeme ''من بخرم، تو بخری، …'', and the multi-sentence lexemes of lessons 03, 05 and 06 (''ما می‌رویم تا نان بخریم. …'', ''کرایه می‌دهم. …'', ''کتابم را به تو می‌دهم. …''), whose glosses are several sentences. Lesson01 phrase pool (the intro sentence and پُسته خانه) is used only in a bare-word translation. Proper nouns فروزان/عارف/فوزیه are not hosted (no semantic tag; an untagged proper_noun slot would pull all 61 course names and places, some self-glossed such as Kabul). Glosses to check: یاد ''memory (as in to learn)'' is the first part of یاد گرفتن (to learn); پُسته ''post (as in post office)'' (carries a damma mark in the token, normalised away by grading); بخرد/بفرستد ''he/she'' subjunctives; می‌خوانی is glossed ''you study'' but also means ''you read'' in the unit''s dialogue.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [en_prs_a2_unit36_lesson01_words, en_prs_a2_unit36_lesson02_words, en_prs_a2_unit36_lesson03_words, en_prs_a2_unit36_lesson05_words, en_prs_a2_unit36_words, w_آسان, w_آوردن, w_بخرد, w_بخرند, w_بخریم, w_بخرین, w_بفرستد, w_بگیرند, w_فرستادن, w_می‌خوانی, w_ندهم, w_نرسم, w_نمی‌دهم, w_نکنم, w_پُسته, w_یاد]
