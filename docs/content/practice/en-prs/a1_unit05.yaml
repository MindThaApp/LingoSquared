schema_version: '1.0'
pack_key: practice.en-prs.a1.unit05
source_language: en
target_language: prs
unit_content_key: prs.a1.unit05.places
review:
  status: unreviewed
  fresh_context: false
  notes: 'Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-06, same pass as this bundle''s a1_unit03.yaml
    sibling (see that file''s notes for the full extension rationale and verification method).

    Two semantic groups: city_place (بازار/بانک/مسجد/شفاخانه/مکتب/ دواخانه/سفارت/دفتر, 8 members, spanning lessons 01-02 --
    these are literally "places in the city," this unit''s own title, so grouping lesson01''s everyday places with lesson02''s
    سفارت/دفتر is a natural fit, not a forced one) and location_word (نزدیک/دور/این‌جا/آن‌جا, 4 members) from lesson04. Deliberately
    skipped multi-word phrase tokens as slot fillers entirely -- پوسته/خانه (post office) and میدان/هوایی (airport) are taught
    as two-token phrases in the realization, and this project''s backfill scripts don''t build phrase-level lexemes (only
    single tokens), so slotting them would either be ungrammatical (rendering just "پوسته" or "هوایی" alone) or impossible;
    they remain taught in the lesson itself, just not drilled via a template here, matching this bundle''s en-fa/a1_unit05
    sibling''s own precedent for single-candidate/phrase tokens. Also skipped the thin (2-member) پشت/مقابل preposition pair
    and the kojast-question phrases for the same reason.

    Every fill_in_blank frame embeds the slot in a real Dari sentence with visible surrounding context (guide §13). Every
    lesson_content_key anchor verified against the real realization file. No listen_select/listen_type anywhere. No bare unquoted
    yes/no/true/false anywhere.

    Verified with a standalone throwaway script reusing scripts/_practice_slot_check.py''s lexeme_matches()/check_pack() against
    scripts/backfill_lexemes_en_prs.py''s real iter_specs() output -- 0 problems. scripts/compile_content.py practice-validate
    for the full en-prs pack (units 01-10 together) -- 0 errors/0 warnings. Needs the standard fresh-context review before
    import; no backfill_lexemes_en_prs.py run has actually happened against a real database yet in this pass.

    DEPTH PASS 2026-07-06 (per-unit template audit found this unit thin at 8 vs unit02/03/04''s 16-24): added a word_order
    template for each of city_place and location_word (8 -> 10 templates), the one PRACTICE_EXERCISE_TYPES member (word_order)
    neither tag had yet. This is the real ceiling for this unit without inventing vocabulary or extending scripts/backfill_lexemes_en_prs.py''s
    classifier: city_ place and location_word are the ONLY two semantic tags this unit''s real taught vocabulary supports
    (verified by re-reading the classifier''s own unit05 section) -- lesson03''s کجاست questions and lesson05''s پشت/مقابل
    prepositions have no semantic tag at all in the classifier (POS-only), and lesson06''s dialogue words are intentionally
    dialogue-only per this file''s own prior notes above; giving them one would require editing the shared backfill script,
    out of scope for a practice-pack-only pass. Both new word_order frames reuse real sentence patterns already taught verbatim
    elsewhere in this unit ([place] این‌جا است from lesson04.exercise07; میدان هوایی [location_word] است from lesson04.teach.airport_far),
    confirmed grammatical for every candidate in each pool, not invented. Re-verified: scripts/_practice_slot_check.py 0 problems
    across the whole en-prs pack; scripts/compile_content.py practice-validate for the full pack -- 0 errors/0 warnings.

    REAUTH PASS 2026-07-24 (unit-scope DEAD/FLOOR fix, scripts/_practice_unit_scope_check.py): the whole-direction
    checks above only prove a slot has candidates SOMEWHERE in en-prs; generate_checkpoint() scopes candidates to
    THIS unit''s own lexemes only. دفتر (this pack''s assumed 8th city_place member) was actually introduced in
    unit01, and نزدیک (the assumed 4th location_word member) was actually introduced in unit02 -- neither recounts
    at unit05''s checkpoint scope. That left place_pair.004 DEAD (8 slots declared, real ceiling 7) and
    location_pair.004 DEAD (4 slots declared, real ceiling 3). Fixed pack-only, no backfill/realization/overlay
    edits, no new vocabulary: (1) place_pair.004 reduced to 7 slots, matching its honest unit-scoped city_place
    pool exactly -- still clears the 6-pair floor, no widening needed. (2) location_pair.004 widened via a new
    location_review preset (location_word UNION direction_word UNION sequence_word UNION home_description_word =
    3+1+1+1 = 6 distinct: دور/این‌جا/آن‌جا/مستقیم/بعد/مقابل), all genuinely introduced by this unit''s own lesson04/
    lesson06, and disjoint from place_pair.004''s city_place pool. Re-verified 0 DEAD / 0 below-floor for this pack
    via scripts/_practice_unit_scope_check.py and 0 errors via scripts/compile_content.py practice-validate (see
    coordinator report for the exact invocation/output).'
tag_schema:
  part_of_speech:
  - noun
  - adjective
  - adverb
  - preposition
  agreement_tags:
    semantic:
    - city_place
    - location_word
    - volume_en_prs_a1_unit05_city_place_06_single
    - volume_en_prs_a1_unit05_location_word_08_single
    - direction_word
    - sequence_word
    - home_description_word
slot_presets:
  city_place: &id001
    language_code: prs
    part_of_speech: noun
    agreement_tags:
      semantic: city_place
  location_word: &id002
    language_code: prs
    part_of_speech:
    - adjective
    - adverb
    agreement_tags:
      semantic: location_word
  # REAUTH 2026-07-24 (unit-scope DEAD/FLOOR fix, see review.notes below):
  # location_word alone has only 3 unit-scoped candidates (دور/این‌جا/
  # آن‌جا -- نزدیک, the pack's original assumed 4th member, was actually
  # introduced in unit02). Widened with the OTHER small "spatial /
  # sequential description" tags this unit's own lesson06 dialogue
  # genuinely introduces (direction_word: مستقیم; sequence_word: بعد;
  # home_description_word: مقابل) to reach 6 distinct without touching
  # city_place (kept fully disjoint from place_pair.004's pool below).
  location_review: &location_review
    language_code: prs
    part_of_speech:
    - adjective
    - adverb
    - noun
    - preposition
    agreement_tags:
      semantic:
      - location_word
      - direction_word
      - sequence_word
      - home_description_word
templates:
- content_key: practice.en-prs.prs.a1.unit05.lesson01.place_gloss.001
  lesson_content_key: prs.a1.unit05.lesson01.everyday_places
  type: multiple_choice
  frame:
    text: '{city_place}'
    language_code: prs
    direction: rtl
  slots:
    city_place: *id001
  answer_derivation:
    kind: slot_gloss
    slot: city_place
  feedback_frame:
    text: '{city_place} names a place in the city.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit05.lesson01.place_translate.003
  lesson_content_key: prs.a1.unit05.lesson01.everyday_places
  type: translation
  frame:
    text: '{city_place}'
    language_code: en
    direction: ltr
    slot_rendering:
      city_place: english_gloss
  slots:
    city_place: *id001
  answer_derivation:
    kind: slot_text
    slot: city_place
  feedback_frame:
    text: '{city_place} is the Dari word for this place.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit05.lesson01.place_pair.004
  lesson_content_key: prs.a1.unit05.lesson01.everyday_places
  type: matching_pairs
  # REAUTH 2026-07-24: was DEAD (declared 8 slots; دفتر, the assumed 8th
  # city_place member, was actually introduced in unit01, not this unit).
  # Reduced to 7, this unit's real unit-scoped city_place ceiling
  # (بازار/بانک/مسجد/شفاخانه/مکتب/دواخانه/سفارت) -- still clears the
  # 6-pair floor with no widening needed.
  frame:
    text: '{city_place_one} — {city_place_two} — {city_place_three} — {city_place_four} — {city_place_five} — {city_place_six}
      — {city_place_seven}'
    language_code: prs
    direction: rtl
  slots:
    city_place_one: *id001
    city_place_two: *id001
    city_place_three: *id001
    city_place_four: *id001
    city_place_five: *id001
    city_place_six: *id001
    city_place_seven: *id001
  slot_relations:
  - kind: distinct
    slots:
    - city_place_one
    - city_place_two
    - city_place_three
    - city_place_four
    - city_place_five
    - city_place_six
    - city_place_seven
  answer_derivation:
    kind: matching_pairs
    slots:
    - city_place_one
    - city_place_two
    - city_place_three
    - city_place_four
    - city_place_five
    - city_place_six
    - city_place_seven
  feedback_frame:
    text: Match each place with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit05.lesson01.place_order.005
  lesson_content_key: prs.a1.unit05.lesson01.everyday_places
  type: word_order
  frame:
    text: '{city_place} این‌جا است'
    language_code: prs
    direction: rtl
  slots:
    city_place: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: '{city_place} این‌جا است'
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'Word order: [place] این‌جا است (the place is here).'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit05.lesson04.location_gloss.001
  lesson_content_key: prs.a1.unit05.lesson04.simple_location_answers
  type: multiple_choice
  frame:
    text: '{location_word}'
    language_code: prs
    direction: rtl
  slots:
    location_word: *id002
  answer_derivation:
    kind: slot_gloss
    slot: location_word
  feedback_frame:
    text: '{location_word} describes a location.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit05.lesson04.location_translate.003
  lesson_content_key: prs.a1.unit05.lesson04.simple_location_answers
  type: translation
  frame:
    text: '{location_word}'
    language_code: en
    direction: ltr
    slot_rendering:
      location_word: english_gloss
  slots:
    location_word: *id002
  answer_derivation:
    kind: slot_text
    slot: location_word
  feedback_frame:
    text: '{location_word} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit05.lesson04.location_pair.004
  lesson_content_key: prs.a1.unit05.lesson04.simple_location_answers
  type: matching_pairs
  # REAUTH 2026-07-24: was DEAD (declared 4 slots; نزدیک, the assumed 4th
  # location_word member, was actually introduced in unit02). Widened via
  # location_review (see preset above) to 6 distinct: دور/این‌جا/آن‌جا
  # (location_word) + مستقیم (direction_word) + بعد (sequence_word) +
  # مقابل (home_description_word) -- all genuinely unit05-native, and
  # disjoint from place_pair.004's city_place pool above.
  frame:
    text: '{item_one} — {item_two} — {item_three} — {item_four} — {item_five} — {item_six}'
    language_code: prs
    direction: rtl
  slots:
    item_one: *location_review
    item_two: *location_review
    item_three: *location_review
    item_four: *location_review
    item_five: *location_review
    item_six: *location_review
  slot_relations:
  - kind: distinct
    slots:
    - item_one
    - item_two
    - item_three
    - item_four
    - item_five
    - item_six
  answer_derivation:
    kind: matching_pairs
    slots:
    - item_one
    - item_two
    - item_three
    - item_four
    - item_five
    - item_six
  feedback_frame:
    text: Match each word to its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit05.lesson04.location_order.005
  lesson_content_key: prs.a1.unit05.lesson04.simple_location_answers
  type: word_order
  frame:
    text: میدان هوایی {location_word} است
    language_code: prs
    direction: rtl
  slots:
    location_word: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: میدان هوایی {location_word} است
      language_code: prs
      direction: rtl
  feedback_frame:
    text: 'Word order: میدان هوایی [word] است (the airport is ___).'
    language_code: en
    direction: ltr
# POLISH 2026-07-24 (tier-thinness, recipe SS8): recognition and production
# each had only 2 live templates. Both additions below reuse the existing
# location_review union preset (6 distinct unit-scoped tokens / 6 distinct
# glosses: دور/این‌جا/آن‌جا/مستقیم/بعد/مقابل) and are anchored to lesson06,
# which introduces مستقیم/بعد itself but previously had no template at all.
- content_key: practice.en-prs.prs.a1.unit05.lesson06.direction_gloss.001
  lesson_content_key: prs.a1.unit05.lesson06.finding_pharmacy_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
  slots:
    item: *location_review
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} describes a location, direction, or sequence from this unit.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit05.lesson06.direction_translate.002
  lesson_content_key: prs.a1.unit05.lesson06.finding_pharmacy_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *location_review
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} is the Dari word for this.'
    language_code: en
    direction: ltr
- content_key: practice.en-prs.prs.a1.unit05.lesson01.place_order.005.volume_fill.006
  lesson_content_key: prs.a1.unit05.lesson01.everyday_places
  type: fill_in_blank
  frame:
    text: '{city_place} این‌جا است'
    language_code: prs
    direction: rtl
  slots:
    city_place:
      language_code: prs
      part_of_speech: noun
      agreement_tags:
        semantic: volume_en_prs_a1_unit05_city_place_06_single
  answer_derivation:
    kind: slot_text
    slot: city_place
  feedback_frame:
    text: '{city_place}'
    language_code: prs
    direction: rtl
- content_key: practice.en-prs.prs.a1.unit05.lesson04.location_order.005.volume_fill.008
  lesson_content_key: prs.a1.unit05.lesson04.simple_location_answers
  type: fill_in_blank
  frame:
    text: میدان هوایی {location_word} است
    language_code: prs
    direction: rtl
  slots:
    location_word:
      language_code: prs
      part_of_speech: adjective
      agreement_tags:
        semantic: volume_en_prs_a1_unit05_location_word_08_single
  answer_derivation:
    kind: slot_text
    slot: location_word
  feedback_frame:
    text: '{location_word}'
    language_code: prs
    direction: rtl
