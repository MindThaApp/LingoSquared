- content_key: practice.en-prs.prs.b1.unit04.lesson02.match.001
  lesson_content_key: prs.b1.unit04.lesson02.present_time_clause_all_persons
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: prs
    direction: rtl
  slots:
    first: &present_verb
      language_code: prs
      part_of_speech: verb
      agreement_tags:
        semantic:
        - en_prs_b1_unit04_lesson01_words
        - en_prs_b1_unit04_lesson02_words
        - en_prs_b1_unit04_lesson04_words
    second: *present_verb
    third: *present_verb
    fourth: *present_verb
    fifth: *present_verb
    sixth: *present_verb
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each present-tense Dari verb with the person it expresses.
    language_code: en
    direction: ltr

- content_key: practice.en-prs.prs.b1.unit04.lesson02.match.002
  lesson_content_key: prs.b1.unit04.lesson02.present_time_clause_all_persons
