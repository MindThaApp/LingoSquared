    language_code: prs
    direction: rtl
  slots:
    first: &any_verb
      language_code: prs
      part_of_speech: verb
      agreement_tags:
        semantic:
        - en_prs_b1_unit04_words
    second: *any_verb
    third: *any_verb
    fourth: *any_verb
    fifth: *any_verb
    sixth: *any_verb
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each Dari verb with the person and tense it expresses.
    language_code: en
    direction: ltr

- content_key: practice.en-prs.prs.b1.unit04.lesson02.translate.003
  lesson_content_key: prs.b1.unit04.lesson02.present_time_clause_all_persons
