  notes: '**THIN UNIT** -- vocabulary unit (museum), only 3 lexemes total, across 3 lexeme-bearing lessons
    (lesson03/04/06 introduced zero lexemes of their own). Recognition+production union: museum_word,
    see_verb, past_verb_third (3 lessons x2 = 6, exactly meeting the MC 3-distinct-gloss floor with no
    margin). Structured: 3x word_order -- two frames over museum_word (course-wide 2 members: موزیم and
    نمایشگاه, both fit ''emruz X baz ast'' and ''in X ast'') plus one over past_verb_third (course-wide
    5 members: برد، دید، رفت، شد، کرد -- all bare 3rd-person past-tense verbs, ''u X.'' is a grammatical
    minimal sentence for every one of them, checked individually). No fill_in_blank or matching_pairs
    possible: no course-wide single-candidate tag exists and 3 tokens is short of the matching_pairs 6-pair
    floor. 9 templates total -- BELOW the 12-template floor. Backfill-thin, not pack-authoring-thin: lessons
    03/04/06 contribute 0 lexemes each; routing to the backfill lane is the real fix. No mis-glossed lexemes
    found.'
