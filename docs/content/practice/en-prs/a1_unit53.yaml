schema_version: '1.0'
pack_key: practice.en-prs.a1.unit53
source_language: en
target_language: prs
unit_content_key: prs.a1.unit53.museum
review:
  status: reviewed
  fresh_context: 'true'
  notes: '**THIN UNIT** -- vocabulary unit (museum), only 3 lexemes total, across 3 lexeme-bearing lessons
    (lesson03/04/06 introduced zero lexemes of their own). Recognition+production union: museum_word,
    see_verb, past_verb_third (3 lessons x2 = 6, exactly meeting the MC 3-distinct-gloss floor with no
    margin). Structured: 3x word_order -- two frames over museum_word (course-wide 2 members: موزیم and
    نمایشگاه, both fit ''emruz X baz ast'' and ''in X ast'') plus one over past_verb_third (course-wide
    5 members: برد، دید، رفت، شد، کرد -- all bare 3rd-person past-tense verbs, ''u X.'' is a grammatical
    minimal sentence for every one of them, checked individually). No fill_in_blank or matching_pairs
    possible: no course-wide single-candidate tag exists and 3 tokens is short of the matching_pairs 6-pair
    floor. 9 templates total -- BELOW the 12-template floor. Backfill-thin, not pack-authoring-thin: lessons
    03/04/06 contribute 0 lexemes each; routing to the backfill lane is the real fix. No mis-glossed lexemes
    found.


    Review 2026-10-24 (en-prs practice native-quality pass): 2 fixes. (1) MC/translation pools narrowed
    from 20 course-wide tokens (past verbs, ''sees'', ''won'' ...) to the unit''s 3 words (en_prs_a1_unit53_words).
    (2) order.005 ''او {item}.'' offered incomplete/odd sentences (''او شد.'', ''او کرد.'', ''او برد.'')
    -> ''او نمایشگاه را {item}.'' with the unit verb دید (the taught sentence). NATIVE FLAGS: none beyond
    thin-unit coverage (3 words).


    Added 2026-10-25 (session 12): seven fill_in_blank / word_order / fixed-sentence translation templates
    over the unit''s own reading and dialogue sentences (the checkpoint returned 11 items, now 15). Every slot
    is single-candidate through the automatic per-lesson tags (en_prs_a1_unit53_lesson01_words = موزیم,
    lesson02_words = نمایشگاه, lesson05_words = دید); no frame word is a candidate, no vocabulary added, no
    Write-exactly task touched. Sentences are copied from the unit (Dari register, no 2pl endings needed).
    NATIVE FLAGS: none.'
  required_next_reviewer: native_speaker_review
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_prs_a1_unit53_words
    - museum_word
    - en_prs_a1_unit53_lesson01_words
    - en_prs_a1_unit53_lesson02_words
    - en_prs_a1_unit53_lesson05_words
