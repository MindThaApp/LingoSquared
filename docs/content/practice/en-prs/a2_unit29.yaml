schema_version: '1.0'
pack_key: practice.en-prs.a2.unit29
source_language: en
target_language: prs
unit_content_key: prs.a2.unit29.rules_permission
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: 'Fresh-context review 2026-11-27 (en-prs A2 units 28-33 pass): every slot''s unit-scope and course-scope pool dumped and every gloss read; sentence anchors are single-member at course scope, no listen_select, MC pools 5-49 distinct glosses, matching pools 12 and 16. The older note''s exclusion list is out of date: the backfill glosses of باشم, باشی, باشیم and اینجا have since been corrected and those tokens are now in the lesson02/03 pools, which is fine. 1 fix - accepted_variants on four fixed-sentence translations for forms the unit itself teaches: optional pronoun (آن‌ها باید به باشگاه بیایند, نباید غذا بخورند, می‌توانیم اینجا عکس بگیریم, ما اینجا می‌توانیم عکس بگیریم) and برای اولین بار / من اولین بار. Capacity: 32 templates, ALL 73%, recognition 73%, structured 44%, production 73%, 6/6 lessons in every tier. Backfill glosses to route: بلند ''tall; high'' (taught: loud, loudly; kept out of every pool), ضرورت "need (as in ''I need it'')" (taught: necessity; kept out), قانون ''law'' (taught: rule; shown in MC and matching, acceptable but narrow), بدهین ''give (polite imperative)'' and بیاورین/بیندازین ''bring/throw (polite/plural)'' (taught as the 2pl subjunctive after باید/لازم نیست). NATIVE FLAGS: frame اولین بار به باشگاه می‌روم (برای اولین بار, as in the realization note); ضرورت ندارد کارت بیاورین. Built from the unit''s realization and en-prs backfill lexemes. Pools are unions of single-member w_<token> tags restricted to noun/verb/adjective/adverb, which keeps phrase rows, proper nouns,
    pronouns and particles out. No listen_select (prs has no TTS). Per lesson one multiple_choice and one bare-word translation (lesson pool if >=4 words, else unit pool); two curated matching_pairs templates
    with 6 slots and distinct glosses; word_order, fill_in_blank and fixed-sentence translation templates are single-member anchors on the unit''s own teaching sentences. Dari register: Kabul Dari, 2pl
    -ین, copula است/استند. Needs native review of frames and feedback. Excluded: باشم/باشی/باشیم (gloss ''(if) I have'' is wrong, the unit teaches ''that I be''), اینجا (gloss ''here (spelling variant,
    no ZWNJ)'' is a junk note), بلند (''tall; high'' vs the loud sense taught), ضرورت (gloss "need (as in ''I need it'')" vs the necessity sense), قانون‌های (''rules of'' ezafe form duplicates قانون‌ها).'
