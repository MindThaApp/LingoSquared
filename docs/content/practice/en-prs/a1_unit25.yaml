schema_version: "1.0"
pack_key: practice.en-prs.a1.unit25
source_language: en
target_language: prs
unit_content_key: prs.a1.unit25.emotions
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    RE-AUTH PASS 2026-07-24 (scripts/_practice_unit_scope_check.py DEAD-
    template fix, PACK-ONLY): lesson01.emotion_pair.002 slotted emotion_word
    alone (5 slots), but this unit's OWN emotion_word pool is only 3
    unit-scoped tokens (خوشحال/خسته are REUSED from earlier units, out of
    this unit's checkpoint scope) -- DEAD at checkpoint scope, never caught
    by the earlier fresh-context review below because that review checked
    whole-direction/course-scope satisfiability, not generate_checkpoint()'s
    stricter unit-only scope. Re-anchored to a new unit_word_pool preset
    (part_of_speech-only, no semantic tag -- SS3.1(c)) unioning every
    adjective/adverb this unit's own lessons introduce (7 unit-scoped
    distinct tokens: emotion_word's 3 + complaint_word's 1 + three
    previously-untagged adverbs چرا/کمی/گاهی, all genuinely distinct
