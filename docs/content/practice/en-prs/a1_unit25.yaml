schema_version: "1.0"
pack_key: practice.en-prs.a1.unit25
source_language: en
target_language: prs
unit_content_key: prs.a1.unit25.emotions
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    RE-AUTH PASS 2026-07-24 (scripts/_practice_unit_scope_check.py DEAD-
