    reset to unreviewed because the fix changes generated-checkpoint
    behavior; needs a fresh-context re-review. Post-fix:
    scripts/_practice_unit_scope_check.py reports 0 DEAD, 0 below-floor for
    this pack.

    POLISH 2026-07-24 (tier-thinness + POS-only matching wave 2,
    PACK-ONLY): recognition and production tiers each had only 1 live
    template. Added 4 templates from the unit's own vocabulary:
    lesson03.feeling_state_gloss.002 (MC, semantic union emotion_word +
    complaint_word, 4 unit-scoped glosses), lesson04.adverb_gloss.001
    (MC over the unit's own untagged adverbs چرا/کمی/گاهی, 3 glosses --
    POS-only by necessity, see below), lesson02.adverb_translate.002
    (bare-word translation, same adverb pool) and
    lesson03.complaint_translate.003 (bare-word translation, خراب).
    Both tiers now 3 live. complaint_word added to tag_schema.
    HONEST LIMIT -- emotion_pair.002 stays POS-only: the dispatch
    flagged its bare [adjective, adverb] constraint (204 off-theme
    course-scope extras), but the unit's tagged vocabulary maxes out at
    emotion_word(3) + complaint_word(1) = 4 distinct tokens, below the
    6-pair floor, and چرا/کمی/گاهی carry no semantic tag (backfill
    scripts are off-limits in this lane). No semantic union can reach
    6, so the POS-only constraint is left in place rather than replaced
    with a wrong union; the same applies to the two new POS-only
    adverb templates (bare frames only, where SS3.1(c) declares POS-only
    safe). LOGGED for the coordinator: a backfill_lexemes_en_prs.py
    extension tagging چرا/کمی/گاهی (e.g. feelings_adverb) would let
    emotion_pair.002 move to a semantic union.

    --- prior authoring notes (2026-07-11), kept for context ---

    Authored 2026-07-11, practice-pool depth-extension pass for A1 units
    25-30 (this bundle's a1_unit26.yaml through a1_unit30.yaml siblings
    are the same pass) -- extends both scripts/backfill_lexemes_en_prs.py
    (UNIT_FILES 25-30, new glosses/POS/semantic tags) and the en-prs pack
    set past its previous unit24 cap. Realization is status reviewed.

    One group: "emotion_word" (خوشحال/ناراحت/خسته/عصبانی/نگران, 5
    members, completes lesson01 -- خوشحال/خسته/نگران are REUSED existing
    lexemes from earlier units, additive tags). All five are adjectives
    with genuinely distinct glosses (happy/sad/tired/angry/worried) and
    all combine grammatically with استم ("I am X") and the taught
    "چرا ... استین؟" question frame -- checked per candidate, not just
    per the taught examples.

    Word_order templates checked for grammaticality: "{emotion_word}
    استم" (lesson03, matches the real taught "خسته استم"/"عصبانی استم"/
    "نگران استم" pattern, generalizes to all 5) and "چرا {emotion_word}
    استین" (lesson02, matches the real taught "چرا خوشحال استین؟"
    generalized -- question mark omitted from the frame per the unit24
    "چطور {you_go_verb}" precedent).

    No listen_select/listen_type anywhere (en-prs has no TTS voices).
    No bare unquoted yes/no/true/false anywhere. Verified with
    scripts/_practice_slot_check.py (0 problems) and
    scripts/compile_content.py practice-validate for the full en-prs
    pack (0 errors / 0 warnings). Needs the standard fresh-context
    review before import; no backfill_lexemes_en_prs.py run has
