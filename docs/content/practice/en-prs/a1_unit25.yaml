    taught lexeme and both word_order frames ("{emotion_word} استم",
    "چرا {emotion_word} استین") appear verbatim in the reviewed
    realization and stay grammatical for all 5 emotion_word fillings;
    matching_pairs covers all 5 distinct pairs with unique glosses;
    word_order answers list-shaped; استم/استین are authentic Afghan Dari
    copula forms (not Iranian هستم/هستید); no listen_select/listen_type,
    no bare YAML booleans, no jargon leaks. practice-validate 0/0 and
    scripts/_practice_slot_check.py clean for the full en-prs set.

    POLISH WAVE 4 (2026-07-26): emotion_pair.002's POS-only honest-leave is RESOLVED -- backfill_lexemes_en_prs.py now emits en_prs_a1_unit25_words, and the matcher's dedicated unit_word_pool preset is re-anchored onto it ([adjective,adverb] preserved; 7 distinct unit-scoped tokens, collision-free). The matcher was trimmed 7 slots -> 6 (the pair floor) so the exactly-7 pool now carries 1 token of slack + sampling variety instead of generating deterministically at the pool ceiling. Course pool == unit pool. Verified with pool_check.py + unit-scope check.

    FRESH-CONTEXT NATIVE REVIEW 2026-07-27 (batch 1): reviewed against AUTHORING_PREFLIGHT.md with the realization/overlay + live backfill lexeme pools cross-checked. All CRITICAL/MAJOR findings fixed and committed (see docs/RAMIN_REVIEW_BACKLOG.md 'Native review batch 1' for the per-pack findings + residual MINOR/known-limitation notes; some backfill gloss fixes take effect on the next re-backfill). Status -> reviewed.

    Review 2026-10-24 (en-prs practice native-quality pass): 2 fixes. bracketed [feeling] feedback replaced by real slot text (2 word_orders); adverb_gloss.001 feedback no longer says 'small words'. NATIVE FLAGS: ناراحت has two lexeme rows with different glosses ('sad' a1 vs 'upset' b2) so an MC can offer both (gloss proposal); چرا ... استین (2pl) vs استی.
tag_schema:
  part_of_speech: [adjective, adverb]
  agreement_tags:
    semantic: [emotion_word, complaint_word, en_prs_a1_unit25_words]
slot_presets:
  emotion_word: &emotion_word {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: emotion_word}}
  # POLISH 2026-07-24 (tier-thinness wave 2): this unit's only tagged
  # lexemes are emotion_word (3 unit-scoped) + complaint_word (1: خراب,
  # lesson03) -- the three lesson02/04 adverbs (چرا/کمی/گاهی) carry NO
  # semantic tag at all. complaint_word + the union below let the
  # recognition and production tiers reach 3 live templates from the
  # unit's own vocabulary; adverb_word_pool is POS-only by necessity
  # (untagged lexemes), used only in bare-frame templates where the
  # course-scope pool needs no frame grammaticality.
  complaint_word: &complaint_word {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: complaint_word}}
  # feeling_state_pool: emotion_word (3) + complaint_word (1) -- 4
  # unit-scoped distinct glosses (sad/angry/worried/broken), over the MC
  # floor.
  feeling_state_pool: &feeling_state_pool {language_code: prs, part_of_speech: adjective, agreement_tags: {semantic: [emotion_word, complaint_word]}}
  # adverb_word_pool: this unit's own adverbs (چرا/کمی/گاهی, 3 distinct
  # glosses). POS-only per recipe SS3.1(c) -- these lexemes are untagged,
  # so no semantic constraint can reach them (backfill scripts are
  # off-limits in this PACK-ONLY lane).
  # POLISH WAVE 4 follow-up (2026-07-27, native review): tagged with the
  # generated en_prs_a1_unit25_words so this pool is unit-scoped at COURSE
  # scope too -- adverb_gloss.001's feedback ("one of this unit's own small
  # words") was false when the untagged pool drew a course-wide adverb in
  # Endless Practice. 3 unit adverbs (چرا/کمی/گاهی), = the MC floor.
  adverb_word_pool: &adverb_word_pool {language_code: prs, part_of_speech: adverb, agreement_tags: {semantic: en_prs_a1_unit25_words}}
  # Re-anchor fix (2026-07-24): emotion_word alone is only 3 unit-scoped
  # tokens (خوشحال/خسته are REUSED from earlier units, out of this unit's
  # checkpoint scope) -- 5 slots over 3 real tokens was DEAD. This unit is
  # genuinely thin: its only OTHER content words are complaint_word
  # (خراب, 1) plus three untagged adverbs (چرا/کمی/گاهی). Per recipe SS3.1(c)
  # a slot may omit `semantic:` entirely -- constraining by part_of_speech
  # alone pools every one of this unit's OWN adjectives/adverbs (7 distinct
  # unit-scoped tokens: sad/angry/worried/broken/why/a little; a bit/
  # sometimes, all genuinely distinct glosses, no case duplicates) without
  # reaching into any other unit's vocabulary.
  unit_word_pool: &unit_word_pool {language_code: prs, part_of_speech: [adjective, adverb], agreement_tags: {semantic: en_prs_a1_unit25_words}}
templates:
  # Lesson 1: feelings vocabulary.
  - content_key: practice.en-prs.prs.a1.unit25.lesson01.emotion_gloss.001
    lesson_content_key: prs.a1.unit25.lesson01.feelings_vocabulary
    type: multiple_choice
    frame: {text: "{emotion_word}", language_code: prs, direction: rtl}
    slots: {emotion_word: *emotion_word}
    answer_derivation: {kind: slot_gloss, slot: emotion_word}
    feedback_frame: {text: "*{emotion_word}* names a feeling.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit25.lesson01.emotion_pair.002
    lesson_content_key: prs.a1.unit25.lesson01.feelings_vocabulary
    # Re-anchored (2026-07-24) to unit_word_pool: emotion_word alone is only
    # 3 unit-scoped tokens (was declared 5 slots -- DEAD). Widened to this
    # unit's full 7-token content-word pool (see preset comment above).
    # POLISH WAVE 4 follow-up (2026-07-26): trimmed 7 slots -> 6 (the pair
    # floor). The tagged pool is exactly 7, so 7 slots left zero margin
    # (deterministic, and one DEAD-adjacent token drop away from failing);
    # 6 slots draw 6 of 7 each generation -- 1 token of slack plus real
    # sampling variety, still well within the tagged pool.
    type: matching_pairs
    frame: {text: "{word_one} — {word_two} — {word_three} — {word_four} — {word_five} — {word_six}", language_code: prs, direction: rtl}
    slots: {word_one: *unit_word_pool, word_two: *unit_word_pool, word_three: *unit_word_pool, word_four: *unit_word_pool, word_five: *unit_word_pool, word_six: *unit_word_pool}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "Match each word to its English meaning.", language_code: en, direction: ltr}

  # Lesson 2: why and because.
  - content_key: practice.en-prs.prs.a1.unit25.lesson02.why_feeling_order.001
    lesson_content_key: prs.a1.unit25.lesson02.why_and_because
    type: word_order
    frame: {text: "چرا {emotion_word} استین", language_code: prs, direction: rtl}
    slots: {emotion_word: *emotion_word}
    answer_derivation: {kind: render_frame, frame: {text: "چرا {emotion_word} استین", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: *چرا {emotion_word} استین* -- why are you ...? The feeling goes between چرا and استین.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit25.lesson02.adverb_translate.002
    lesson_content_key: prs.a1.unit25.lesson02.why_and_because
    type: translation
    # ADDED (POLISH 2026-07-24, tier-thinness): production tier had only
    # 1 live template. Bare-word translation over this unit's own
    # adverbs (چرا is this lesson's own vocabulary; کمی/گاهی lesson04's)
    # -- POS-only slot per recipe SS3.1(c), safe for bare-word
    # translation because the English-gloss prompt varies with the
    # answer.
    frame: {text: "{adverb_word}", language_code: en, direction: ltr, slot_rendering: {adverb_word: english_gloss}}
    slots: {adverb_word: *adverb_word_pool}
    answer_derivation: {kind: slot_text, slot: adverb_word}
    feedback_frame: {text: "{adverb_word} is the Dari word for this.", language_code: en, direction: ltr}

  # Lesson 3: more feelings and reasons.
  - content_key: practice.en-prs.prs.a1.unit25.lesson03.i_am_feeling_order.001
    lesson_content_key: prs.a1.unit25.lesson03.more_feelings_and_reasons
    type: word_order
    frame: {text: "{emotion_word} استم", language_code: prs, direction: rtl}
    slots: {emotion_word: *emotion_word}
    answer_derivation: {kind: render_frame, frame: {text: "{emotion_word} استم", language_code: prs, direction: rtl}}
    feedback_frame: {text: "Word order: *{emotion_word} استم* -- I am ... The feeling comes before استم.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit25.lesson03.feeling_state_gloss.002
    lesson_content_key: prs.a1.unit25.lesson03.more_feelings_and_reasons
    type: multiple_choice
    # ADDED (POLISH 2026-07-24, tier-thinness): recognition tier had only
    # 1 live template. Semantic union of the unit's own tags (recipe
    # SS3.1a): emotion_word (3) + complaint_word (1: خراب, this lesson's
    # own vocabulary) -- 4 unit-scoped distinct glosses
    # (sad/angry/worried/broken).
    frame: {text: "{feeling_state_word}", language_code: prs, direction: rtl}
    slots: {feeling_state_word: *feeling_state_pool}
    answer_derivation: {kind: slot_gloss, slot: feeling_state_word}
    feedback_frame: {text: "{feeling_state_word} describes a feeling or a state.", language_code: en, direction: ltr}
  - content_key: practice.en-prs.prs.a1.unit25.lesson03.complaint_translate.003
    lesson_content_key: prs.a1.unit25.lesson03.more_feelings_and_reasons
    type: translation
    # ADDED (POLISH 2026-07-24, tier-thinness): production tier had only
    # 1 live template. Bare-word translation over this lesson's own
    # complaint_word (1 unit-scoped: خراب).
    frame: {text: "{complaint_word}", language_code: en, direction: ltr, slot_rendering: {complaint_word: english_gloss}}
    slots: {complaint_word: *complaint_word}
    answer_derivation: {kind: slot_text, slot: complaint_word}
    feedback_frame: {text: "{complaint_word} is the Dari word for this.", language_code: en, direction: ltr}

  # Lesson 4: feelings dialogue.
  - content_key: practice.en-prs.prs.a1.unit25.lesson04.adverb_gloss.001
    lesson_content_key: prs.a1.unit25.lesson04.feelings_dialogue
    type: multiple_choice
    # ADDED (POLISH 2026-07-24, tier-thinness): recognition tier had only
    # 1 live template, and lesson04 (own vocab کمی/گاهی) had no template
    # at all. POS-only slot per recipe SS3.1(c) -- this unit's adverbs
    # carry no semantic tag, so no semantic constraint can reach them;
    # bare '{slot}' frame, so the wide course-scope pool poses no frame
    # grammaticality risk. 3 unit-scoped distinct glosses (why / a
    # little; a bit / sometimes) -- exactly the MC floor.
    frame: {text: "{adverb_word}", language_code: prs, direction: rtl}
    slots: {adverb_word: *adverb_word_pool}
    answer_derivation: {kind: slot_gloss, slot: adverb_word}
    feedback_frame: {text: "*{adverb_word}* is a question word or adverb from this unit.", language_code: en, direction: ltr}

  # Lesson 6: wrap-up.
  - content_key: practice.en-prs.prs.a1.unit25.lesson06.emotion_translate.001
    lesson_content_key: prs.a1.unit25.lesson06.wrap_up
    type: translation
    frame: {text: "{emotion_word}", language_code: en, direction: ltr, slot_rendering: {emotion_word: english_gloss}}
    slots: {emotion_word: *emotion_word}
    answer_derivation: {kind: slot_text, slot: emotion_word}
    feedback_frame: {text: "{emotion_word} is the Dari word for this.", language_code: en, direction: ltr}
