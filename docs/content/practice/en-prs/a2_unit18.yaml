schema_version: '1.0'
pack_key: practice.en-prs.a2.unit18
source_language: en
target_language: prs
unit_content_key: prs.a2.unit18.shopping_complaint
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (en-fa/en-prs practice pass, fresh context; 4 fixes).
    (1) lesson02.translate.002 bare-noun pool held lesson04's clitic/indefinite forms
    (روشنش "turning it on / its being turned on", مشکلی, رسیدم, پول‌تان) as typed answers
    no learner can derive from the gloss: pool now lessons 01-03. (2)+(3) lesson04.choose.001
    and lesson04.translate.003 taught پس as "so / then", but in this unit پس only occurs as
    "back" (پس بگیرم / پس بدهم) -- wrong-sense gloss; both pools now the unit's tagged
    verbs + choice_word (نمی‌شود, خریدم, می‌دهین, باشد, یا, کدام), which also drops the
    untagged وقتی/ظرف. (4) lesson02.order.003 rendered این تعویض است / این بازپرداخت است
    ("this is exchange"): narrowed to travel_role_word (فروشنده), feedback updated.
    NATIVE FLAGS: course-wide gloss clash "exchange" = تعویض (this unit) and تبدیل (A2
    banking) in bare-word translation -- gloss should read "exchange (an item)" (backfill
    lane); backfill gloss "پس = so / then" is wrong for this unit; رسیدم "my receipt" is a
    homograph of "I arrived" and is tagged past_verb_first_b1; dialogue "بلی، اینه رسیدم"
    mixes colloquial اینه into a written-register dialogue and its gloss says "his receipt";
    phrase glosses carry Persian names/narration ("کریم says exchange is better").

    Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md to unblock this
    unit's checkpoint. en-prs A2 unit18 had a full realization + overlay and 43
    backfilled lexemes across all 4 lessons but no practice pack at all, so
    generate_checkpoint() returned checkpoint_unavailable.


    13 templates -- multiple_choice x4, matching_pairs x2, word_order x2, fill_in_blank x1,
    translation x4. Every slot constraint is satisfiable from THIS unit's own lessons,
    because generate_checkpoint() calls _material() with only this unit's lesson ids.
    Recognition / structured / production each carry at least three templates and each
    reaches every lesson that has lexemes. Zero listen_select: Dari has no TTS from
    either provider and _material() deletes those templates (recipe 6.2 / DO-NOT 3).


    Slot design. The curated lesson01 pool (complaint_word + travel_role_word + return_policy_word + warm_word) drives the
    multiple_choice / matching_pairs / translation trio. Breadth, and the coverage bar,
    come from part-of-speech-only slots: one noun slot, one adjective/adverb slot and
    one verb/function-word slot in each tier. proper_noun and phrase are deliberately
    excluded everywhere -- proper nouns self-gloss (Homayoun to "Homayoun (name)"), and
    this unit's whole-sentence `phrase` lexemes carry narrative third-person glosses
    ("He asks when he will get the PIN") that would make an underdetermined production
    prompt and an unusable multiple_choice option. That caps achievable coverage at the
    non-phrase, non-proper share of the unit.


    matching_pairs uses six slots with a distinct relation (guide 16). The curated pool
    was hand-checked for interchangeable English rights; the broad word-form pool
    discriminates on person and mood, which are real taught contrasts. Both word_order
    frames and the fill_in_blank frame are real sentences from this unit's own
    realization, and no literal word of a frame is a candidate of that frame's own slot
    (defect 1.14). The fill_in_blank slot has exactly one distinct course-wide candidate, so the AUTHORING_GUIDE 17 ambiguity hard-fail is satisfied by construction.


    Dari register: every target-language string is taken from realizations/prs, Afghan
    forms only (استه/استم/استین copula, -ین second-person plural, افغانی, بس). The fa
    lane -- realizations/fa, overlays/*fa*, practice/en-fa -- was never opened while
    authoring this pack. scripts/check_dari_register.py reports zero findings on it.
    Needs the standard fresh-context review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - choice_word
    - complaint_word
    - ones_number
    - return_policy_word
    - time_reference
    - travel_role_word
    - warm_word
    - en_prs_a2_unit18_lesson01_words
    - en_prs_a2_unit18_lesson02_words
    - en_prs_a2_unit18_lesson03_words
    - en_prs_a2_unit18_lesson04_words
templates:
- content_key: practice.en-prs.prs.a2.unit18.lesson01.choose.001
  lesson_content_key: prs.a2.unit18.lesson01.complaint_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: prs
      part_of_speech:
      - noun
      - adjective
      agreement_tags:
        semantic:
        - complaint_word
        - travel_role_word
        - return_policy_word
        - warm_word
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: "{item} is part of this unit's shopping-complaint vocabulary."
    language_code: en
    direction: ltr

- content_key: practice.en-prs.prs.a2.unit18.lesson01.match.002
  lesson_content_key: prs.a2.unit18.lesson01.complaint_vocabulary
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: prs
    direction: rtl
  slots:
    first: &pool_core
      language_code: prs
      part_of_speech:
      - noun
      - adjective
      agreement_tags:
        semantic:
        - complaint_word
        - travel_role_word
        - return_policy_word
        - warm_word
    second: *pool_core
    third: *pool_core
    fourth: *pool_core
    fifth: *pool_core
    sixth: *pool_core
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: "Match each shopping-complaint word with its English meaning."
    language_code: en
    direction: ltr

- content_key: practice.en-prs.prs.a2.unit18.lesson01.translate.003
  lesson_content_key: prs.a2.unit18.lesson01.complaint_vocabulary
  type: translation
  frame:
