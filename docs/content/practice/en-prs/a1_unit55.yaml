schema_version: '1.0'
pack_key: practice.en-prs.a1.unit55
source_language: en
target_language: prs
unit_content_key: prs.a1.unit55.park
review:
  status: unreviewed
  fresh_context: 'false'
  notes: '**THIN UNIT** -- vocabulary unit (park), only 5 lexemes total, across 3 lexeme-bearing lessons
    (lesson02/03/05 introduced zero lexemes of their own). Recognition+production union: nature_word,
    outing_word, want_verb, formal_possessive_word (3 lessons x2 = 6). Structured: 1 fill_in_blank on
    outing_word (course-wide SINGLE candidate میله) + 1 word_order on nature_word (course-wide 2 members:
    درخت and گل, both fit ''in X ziba ast''). 2026-07-24 polish wave 2: added a 3rd structured word_order
    (order.006, ''{item} در پارک است.'' -- the unit''s own lesson01 sentence درخت در پارک است; nature_word
    is course-wide exactly {درخت، گل}, both grammatical in the frame). Structured tier now 3 live.
    want_verb has 3 course-wide members with mismatched persons (می‌خواهد/می‌خواهم/می‌خواهی) so no single
    safe frame covers all of them, and it was excluded rather than risk an ungrammatical course-scope
    frame. 1 extra fixed-sentence translation added for production depth. 9 templates total -- BELOW the
    12-template floor. Backfill-thin: lessons 02/03/05 contribute 0 lexemes each; routing to the backfill
    lane is the real fix. No mis-glossed lexemes found. (outing_word IS a real direction-wide single candidate,
    so its fill_in_blank is valid; disruption_word/workplace_word in sibling units 50/54 were NOT direction-wide
    single and were authored as word_order instead -- see those units'' notes.)'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - formal_possessive_word
    - nature_word
    - outing_word
    - want_verb
templates:
- content_key: practice.en-prs.prs.a1.unit55.lesson01.park_and_nature_vocabulary.choose.001
  lesson_content_key: prs.a1.unit55.lesson01.park_and_nature_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
  slots:
    item:
      language_code: prs
      part_of_speech: &id001
      - noun
      - verb
      agreement_tags:
        semantic: &id002
        - nature_word
        - outing_word
        - want_verb
        - formal_possessive_word
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is park vocabulary from this unit.'
    language_code: en
    direction: ltr
