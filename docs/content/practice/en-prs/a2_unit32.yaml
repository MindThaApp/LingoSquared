review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Authored for unit 32 from the realization and the en-prs backfill lexemes (tags w_<token> single-member anchors, en_prs_a2_unit32_lessonNN_words for phrase word_order). Broad recognition/production templates use unions of the unit''s w_ tags (lessons with fewer than 5 words draw on the whole unit); matching_pairs split into non-verbs and verbs. Sentence templates are single-lexeme anchors on the unit''s own teaching lines (Dari register: 2pl -ین, copula است/استم/استی). No listen_select (prs has no TTS). Glosses kept out of every pool: امتحان (gloss "trial; try" but the unit teaches امتحان = exam); چیزهای (gloss "things of; kinds of things" leaks the ezafe). Not hosted: pronoun خودم and proper-noun names have no w_ tag or semantic tag. Multi-sentence paradigm/reading phrases are not drilled except by the lesson-level phrase word_order in lessons [1, 2, 3, 4, 6]. Needs native review of frames and feedback.'}
