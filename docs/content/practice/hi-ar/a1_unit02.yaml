templates:
- content_key: practice.hi-ar.ar.a1.unit02.lesson01.listen.001
  lesson_content_key: ar.a1.unit02.lesson01.names
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'अरबी में स्वामित्व शब्द के अंत में जुड़ने वाले प्रत्यय से दिखाया जाता है: اسم यानी ''नाम'', اسمي यानी ''मेरा नाम'' और اسمك यानी ''आपका नाम''।'
    language_code: hi
    direction: ltr
