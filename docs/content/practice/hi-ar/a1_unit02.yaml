      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما का अर्थ 'क्या' है, इसलिए ما اسمك का शाब्दिक अर्थ है 'क्या आपका नाम'।
    language_code: hi
    direction: ltr
