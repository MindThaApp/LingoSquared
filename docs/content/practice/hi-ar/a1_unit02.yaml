      direction: rtl
  feedback_frame:
    text: 'नाम वैसे ही लिखे जाते हैं जैसे बोले जाते हैं: अरबी में बड़े अक्षर (कैपिटल लेटर) नहीं होते।'
    language_code: hi
    direction: ltr
