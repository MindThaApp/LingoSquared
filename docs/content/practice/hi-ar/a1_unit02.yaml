    slot: item
  feedback_frame:
    text: أنا ('मैं') का प्रयोग أنا سارة जैसे सरल वाक्यों में होता है; अरबी में यहाँ 'हूँ' जैसी किसी क्रिया की ज़रूरत नहीं पड़ती।
    language_code: hi
    direction: ltr
