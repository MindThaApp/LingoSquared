    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: امش पुरुष को दिया गया आदेश है; إلى الأمام का अर्थ "आगे की ओर" है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit10.lesson01.translate.007
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
