templates:
- content_key: practice.hi-ar.ar.a1.unit10.lesson01.choose.001
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يمين संज्ञा "दायाँ" है और اليسار "बायाँ" है, जिसमें ال जुड़ा है; उपपद ال इसे "बायाँ" बनाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit10.lesson01.listen.002
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الأمام का अर्थ है "आगे का भाग", और إلى الأمام का अर्थ है "सीधे"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit10.lesson01.order.003
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: word_order
  frame:
    text: امش إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'إلى (की ओर) दिशा से पहले आता है, और दिशा के साथ ال लगता है: الأمام, اليمين या اليسار।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit10.lesson01.fill.004
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: fill_in_blank
  frame:
    text: امش إلى {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '"सीधे" कहने का सामान्य तरीका إلى الأمام है।'
    language_code: hi
    direction: ltr
