  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: يمين का अर्थ "दायाँ" (दिशा) है, जो يسار का उलटा है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit10.lesson01.translate.006
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
