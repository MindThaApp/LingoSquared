    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ماء पानी है और قهوة कॉफ़ी है; خبز (रोटी) तीसरी चीज़ है जो आप माँग सकते हैं।
    language_code: hi
    direction: ltr
