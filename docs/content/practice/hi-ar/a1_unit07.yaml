  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أريد के साथ संज्ञा आए तो अर्थ होता है "मुझे ... चाहिए"; من فضلك (कृपया) अनुरोध को पूरा करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit07.lesson01.fill.005
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
