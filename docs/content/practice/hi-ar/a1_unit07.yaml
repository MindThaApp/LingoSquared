templates:
- content_key: practice.hi-ar.ar.a1.unit07.lesson01.choose.001
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أريد का अर्थ है "मुझे चाहिए"; पुरुष हो या स्त्री, यही रूप इस्तेमाल होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit07.lesson01.listen.002
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
