    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'و (और) अगले शब्द से जुड़ता है: وقهوة का अर्थ है "और कॉफ़ी"। من فضلك विनम्र "कृपया" है।'
    language_code: hi
    direction: ltr
