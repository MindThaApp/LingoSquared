    text: 'पसंद की चीज़ أحب के बाद आती है, और सामान्य प्रकार के लिए ال लगता है: أحب القهوة का अर्थ है "मुझे कॉफ़ी पसंद है"।'
    language_code: hi
    direction: ltr
