  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: अरबी की वर्तनी में छोटे स्वर प्रायः नहीं लिखे जाते; पाठक शब्द को पहचानकर उन्हें स्वयं जोड़ लेते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit01.lesson02.listen.001
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: listen_select
