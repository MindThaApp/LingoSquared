  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अरबी दाएँ से बाएँ लिखी जाती है, और ر तथा ا अपने बाद वाले अक्षर से कभी नहीं जुड़ते।
    language_code: hi
    direction: ltr
