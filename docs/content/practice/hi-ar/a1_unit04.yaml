    frame:
      text: اليوم الخامس من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: अरबी में तारीख़ पहले दिन, फिर من (का/की) और फिर महीना लिखकर बोली जाती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit04.lesson01.fill.004
  lesson_content_key: ar.a1.unit04.lesson01.date_words
