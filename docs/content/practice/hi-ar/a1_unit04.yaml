    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit04.lesson02.translate.008
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: आज छह जून है।
    language_code: hi
    direction: ltr
  slots:
    a: *id011
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {a} من {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: छठा السادس है; यह अन्य क्रमसूचक संख्याओं की तरह आगे ال लगाकर बनता है।
    language_code: hi
    direction: ltr
