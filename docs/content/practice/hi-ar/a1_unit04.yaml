  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الخامس (पाँचवाँ) जैसी क्रमसूचक संख्याओं में ال लगता है, और यहाँ ये पुल्लिंग हैं क्योंकि ये يوم (दिन) के लिए हैं, जो पुल्लिंग शब्द है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit04.lesson02.match.002
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: matching_pairs
  frame:
