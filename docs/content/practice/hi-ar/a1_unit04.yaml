  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: اليوم का शाब्दिक अर्थ है "दिन"; इसके आगे «the»-जैसा उपसर्ग ال जुड़ा है। अरबी में "आज" इसी तरह कहा जाता है।
    language_code: hi
    direction: ltr
