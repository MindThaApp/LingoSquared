    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما تاريخ اليوم؟ आज की तारीख़ पूछने का सामान्य तरीक़ा है।
    language_code: hi
    direction: ltr
