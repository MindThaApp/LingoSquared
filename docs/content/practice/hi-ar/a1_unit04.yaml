  frame:
    text: आज की तारीख क्या है?
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} اليوم
      language_code: ar
      direction: rtl
  feedback_frame:
    text: तारीख़ वाले प्रश्न में ما (क्या), تاريخ (तारीख़) और اليوم (आज) आते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit04.lesson02.listen.001
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
