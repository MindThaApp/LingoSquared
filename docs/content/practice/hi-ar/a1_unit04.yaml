    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: في का अर्थ है "में" या "पर"। यह अलग शब्द के रूप में लिखा जाता है, जबकि ب अगले शब्द से जुड़ जाता है।
    language_code: hi
    direction: ltr
