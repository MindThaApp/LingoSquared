  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'महीनों के नाम एक ही शब्द में लिखे जाते हैं: مايو यानी मई और يونيو यानी जून।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit04.lesson01.translate.006
