  feedback_frame:
    text: पार्सल पुल्लिंग है, इसलिए हम يصل (yaṣil) कहते हैं। चिट्ठी स्त्रीलिंग है, इसलिए हम تصل (taṣil) कहते हैं। वर्तमान काल की क्रिया पुल्लिंग कर्ता के लिए ي से और स्त्रीलिंग कर्ता के लिए ت से शुरू होती है, जैसे الطرد يصل (aṭ-ṭard yaṣil) और الرسالة تصل।
