templates:
- content_key: practice.hi-ar.ar.a1.unit11.lesson01.choose.001
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'أستيقظ, أدرس और أنام तीनों वर्तमान काल की उत्तम पुरुष क्रियाएँ हैं: मैं उठता/उठती हूँ, मैं पढ़ता/पढ़ती हूँ, मैं सोता/सोती हूँ।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit11.lesson01.listen.002
  lesson_content_key: ar.a1.unit11.lesson01.daily_actions
