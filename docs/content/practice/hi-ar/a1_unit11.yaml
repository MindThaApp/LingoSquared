  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ماذا प्रश्नवाचक शब्द «क्या» है; ماذا تفعل؟ का अर्थ है «तुम क्या करते हो?»
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit11.lesson02.choose.002
  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تفعل «करना» का पुल्लिंग «तुम» रूप है; ماذا تفعل كل يوم؟ किसी पुरुष से पूछता है कि वह रोज़ क्या करता है।
    language_code: hi
    direction: ltr
