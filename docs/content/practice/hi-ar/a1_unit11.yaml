  lesson_content_key: ar.a1.unit11.lesson02.my_day
  type: word_order
  frame:
    text: ماذا {item} كل يوم؟
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} كل يوم؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'क्रिया सीधे ماذا के बाद आती है: ماذا تفعل؟ का अर्थ है «तुम क्या करते हो?»'
