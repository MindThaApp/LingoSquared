templates:
- content_key: practice.hi-ar.ar.a1.unit03.lesson01.choose.001
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: हर संख्या-शब्द दाएँ से बाएँ पढ़ा जाता है; ثلاثة की शुरुआत ث से होती है, जिसकी ध्वनि अंग्रेज़ी के «think» के «th» जैसी है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson01.match.002
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: matching_pairs
