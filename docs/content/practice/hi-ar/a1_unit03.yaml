  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ثلاثة (तीन) और ثمانية (आठ) दोनों ث से शुरू होते हैं, जिसकी ध्वनि «th» जैसी है; शब्द का बाकी हिस्सा इन्हें अलग करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson01.order.003
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: word_order
  frame:
    text: واحد، اثنان، {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: واحد، اثنان، {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: तीन के लिए शब्द ثلاثة का अंत ة पर होता है, जो अरबी के कई अन्य संज्ञा शब्दों में भी मिलता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson01.fill.004
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: fill_in_blank
  frame:
    text: واحد، {item}، ثلاثة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: अरबी में दो चीज़ों के लिए एक विशेष द्विवचन प्रत्यय ـان है; اثنان स्वयं "दो" शब्द है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson01.translate.005
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: तीन से दस तक की संख्याएँ गिनती में ة पर समाप्त होती हैं, जैसे ثلاثة और خمسة।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson02.listen.001
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'سبعة (सात) और تسعة (नौ) का अंत एक ही अक्षरों عة से होता है, इसलिए पहली ध्वनि सुनिए: स और त का अंतर।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson02.order.002
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: word_order
  frame:
    text: رقمي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: رقمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'رقمي का अर्थ है मेरा नंबर: رقم यानी नंबर और प्रत्यय ـي यानी मेरा।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson02.fill.003
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: fill_in_blank
  frame:
    text: ثمانية، تسعة، {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: عشرة यानी दस; तीन से दस तक की हर गिनती-संख्या की तरह यह भी ة पर समाप्त होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson02.translate.004
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ستة (छह) और سبعة (सात) दोनों س से शुरू होते हैं; इन्हें अलग पहचानने के लिए अंत के अक्षर पढ़िए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson03.choose.001
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: كم का अर्थ है कितना या कितने, और هذا अपने पास की किसी चीज़ की ओर इशारा करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson03.match.002
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: بخمسة और بعشرة ب से शुरू होते हैं, जिसका यहाँ अर्थ है "के दाम पर" या "में"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson03.fill.003
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: fill_in_blank
  frame:
    text: كم {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كم هذا किसी एक चीज़ का दाम पूछता है; هذا (यह) पुल्लिंग रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson03.translate.004
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'وهذا यानी و (और) जुड़ा हुआ هذا (यह) के साथ: और यह।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson03.translate.005
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: यह कितने का है?
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: كم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'इस प्रश्न में "है" के लिए अरबी में कोई शब्द नहीं होता: كم هذا का शाब्दिक अर्थ है "कितना यह"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit03.lesson03.translate.006
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: यह पाँच का है।
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'पूर्वसर्ग ب संख्या से जुड़कर लिखा जाता है: ب + خمسة मिलकर بخمسة बनता है।'
    language_code: hi
    direction: ltr
