    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: ما اسم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أختك सुनने वाला पुरुष हो या स्त्री, एक ही तरह लिखा जाता है; यहाँ यूसुफ़ को संबोधित किया गया है।
    language_code: hi
    direction: ltr
