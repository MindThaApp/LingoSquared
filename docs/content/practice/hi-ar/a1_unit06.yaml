    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عائلة का अर्थ 'परिवार' है; इसी शब्द का स्वामित्व-अंत वाला रूप عائلتك अगले पाठ में आएगा।
    language_code: hi
    direction: ltr
