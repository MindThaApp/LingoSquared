  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ये पारिवारिक शब्द संज्ञाएँ हैं; أب 'पिता' है और أم 'माँ'।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ar.ar.a1.unit06.lesson01.translate.007
  lesson_content_key: ar.a1.unit06.lesson01.family_members
