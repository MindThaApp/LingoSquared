templates:
- content_key: practice.hi-ar.ar.a1.unit06.lesson01.choose.001
  lesson_content_key: ar.a1.unit06.lesson01.family_members
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أب 'पिता' है और أم 'माँ'; عندي एक ही शब्द है, जिसका अर्थ 'मेरे पास है' है।
    language_code: hi
    direction: ltr
