    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و (और) अगले शब्द से जुड़ा हुआ लिखा जाता है, इसलिए "और माँ" وأم लिखा जाता है।
