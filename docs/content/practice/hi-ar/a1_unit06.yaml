  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'अरबी में "एक" (a) के लिए कोई शब्द नहीं होता: عندي أخت का सीधा अर्थ है "मेरे पास बहन है"।'
    language_code: hi
    direction: ltr
