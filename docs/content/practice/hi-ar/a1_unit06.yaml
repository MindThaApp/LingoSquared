  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'अंत का ـك "आपका" दर्शाता है: عائلتك का अर्थ है "आपका परिवार" और أختك का अर्थ है "आपकी बहन"।'
    language_code: hi
    direction: ltr
