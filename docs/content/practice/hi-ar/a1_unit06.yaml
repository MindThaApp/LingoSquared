    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اسمها यानी اسم में ـها जुड़ा है, जिससे अर्थ बनता है "उसका नाम"।
    language_code: hi
    direction: ltr
