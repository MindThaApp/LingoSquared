    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Im Italienischen werden Nationalitäten und Sprachen kleingeschrieben: italiano, inglese.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit02.lesson01.translate.006
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: Woher kommst du? (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? ist die Frage mit tu; die höfliche Lei-Variante ist Di dov'è, Lei?
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit02.lesson02.choose.001
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Die Verbendung zeigt, wer handelt: parlo heißt ich spreche, parli du sprichst (informell), parla Sie sprechen (formell) oder er/sie spricht.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit02.lesson02.listen.002
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Parli und parla klingen ähnlich: Der letzte Vokal verrät, ob es tu (-i) oder Lei (-a) ist.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit02.lesson02.order.003
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: word_order
  frame:
    text: Parlo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parlo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Nach parlare braucht die Sprache meist keinen Artikel: parlo inglese, parlo italiano.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit02.lesson02.fill.004
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: fill_in_blank
  frame:
    text: Da {item} studi? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Da quanto studi? fragt, seit wann Sie schon lernen; das Italienische verwendet dafür das Präsens mit da, seit.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit02.lesson02.translate.005
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: translation
  frame:
    text: Sprichst du Englisch? (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Parli {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Parli ist die tu-Form; zu einem Fremden würden Sie die Lei-Form sagen: Parla inglese?'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit02.lesson03.choose.001
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Fai und fa sind beides Formen von fare: fai gehört zu tu, fa zu Lei oder er/sie.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit02.lesson03.listen.002
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ingegnere wird auf der vorletzten Silbe betont: in-ge-GNE-re.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit02.lesson03.order.003
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: word_order
  frame:
    text: Che {item} fai?
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} fai?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che lavoro fai? fragt wörtlich, welche Arbeit du machst; die höfliche Variante ist Che lavoro fa, Lei?
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit02.lesson03.fill.004
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: fill_in_blank
  frame:
    text: Che lavoro {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fai ist die tu-Form von fare; mit Lei wird daraus fa.
    language_code: de
    direction: ltr
