    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Die Endung zeigt das Geschlecht: -o für einen Mann (americano), -a für eine Frau (americana).'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit02.lesson01.translate.005
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
