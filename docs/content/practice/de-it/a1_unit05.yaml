templates:
- content_key: practice.de-it.it.a1.unit05.lesson01.choose.001
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Die Uhrzeit steht im Femininum Plural (le), weil ore („Stunden“) feminin im Plural ist: sono le tre.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson01.listen.002
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ein Uhr ist die Ausnahme: l''una steht im Singular, daher heißt es è und nicht sono.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson01.order.003
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: word_order
  frame:
    text: Che {item} sono?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} sono?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che ore sono? fragt wörtlich „Was sind die Stunden?“. Deshalb beginnt die Antwort mit sono le.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson01.fill.004
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: fill_in_blank
  frame:
    text: Sono {item} tre. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le richtet sich nach ore, das mitgedacht wird: sono le tre bedeutet „Es ist drei Uhr“.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson01.translate.005
  lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
  type: translation
  frame:
    text: Es ist {n} Uhr.
    language_code: de
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le {n}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Sono le steht bei allen Stunden außer bei ein Uhr, das heißt l'una.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson02.choose.001
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'E addiert Minuten, meno zieht sie ab: le tre e mezzo ist 3:30 Uhr, le quattro meno un quarto ist 3:45 Uhr.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson02.listen.002
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mezzo hat ein doppeltes z; sprechen Sie den Laut etwas länger.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson02.order.003
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: word_order
  frame:
    text: Sono le tre e un {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le tre e un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'E un quarto addiert fünfzehn Minuten: le tre e un quarto ist 3:15 Uhr.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson02.fill.004
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: fill_in_blank
  frame:
    text: Sono le tre e {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mezzo bedeutet „halb“, also addiert e mezzo dreißig Minuten.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson02.match.005
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mezzo ist „halb“ und quarto ist „Viertel“; zuerst kommt die Stunde, dann e oder meno.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson02.translate.006
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: translation
  frame:
    text: Es ist Viertel vor vier.
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le quattro meno un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Meno zieht von der nächsten Stunde ab: le quattro meno un quarto ist 3:45 Uhr.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson02.translate.007
  lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
  type: translation
  frame:
    text: Es ist drei Uhr dreißig.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono le tre e {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: E mezzo, „und eine halbe“, ist die alltägliche Art, die halbe Stunde nach einer vollen Stunde zu sagen.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson03.choose.001
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Alle bedeutet „um“ (mit Femininum Plural) und steht bei Uhrzeiten: alle tre, um drei.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson03.listen.002
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ora bedeutet „Stunde“ oder „Zeit“; ore ist der Plural. Deshalb lautet die Frage Che ore sono?
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson03.order.003
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: word_order
  frame:
    text: A che {item} ci vediamo?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: A che {item} ci vediamo?
      language_code: it
      direction: ltr
  feedback_frame:
    text: A che ora fragt „um wie viel Uhr“; ora steht hier im Singular, weil nach einem einzigen Zeitpunkt gefragt wird.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson03.fill.004
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: fill_in_blank
  frame:
    text: Ci vediamo {item} tre e mezzo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alle steht bei allen Stunden außer bei ein Uhr, dort sagt man all'una.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson03.translate.005
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: translation
  frame:
    text: Wir treffen uns um drei Uhr dreißig.
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ci vediamo {item} tre e mezzo.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo alle plus Uhrzeit ist die übliche Art, ein Treffen zu vereinbaren.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit05.lesson03.translate.006
  lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Mattina und sera bedeuten „Morgen“ und „Abend“; im Italienischen steht di davor: di mattina, di sera.'
    language_code: de
    direction: ltr
