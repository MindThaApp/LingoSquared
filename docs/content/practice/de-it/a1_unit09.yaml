  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Via kann „Straße“ oder „Weg“ bedeuten und steht in Namen wie Via Roma.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit09.lesson01.order.003
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: word_order
  frame:
    text: Scusi, dov'è la {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dov'è la plus ein feminines Nomen fragt, wo ein Ort ist; scusi ist das höfliche „Entschuldigung“.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit09.lesson01.fill.004
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: fill_in_blank
