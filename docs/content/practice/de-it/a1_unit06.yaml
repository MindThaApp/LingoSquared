templates:
- content_key: practice.de-it.it.a1.unit06.lesson01.choose.001
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mit einem Possessivbegleiter stehen Familienbezeichnungen im Singular ohne Artikel: mio padre, mia madre.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson01.listen.002
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Padre und madre enden beide auf -e, haben aber unterschiedliches Genus; lernen Sie daher jedes Wort mit seinem Genus. Nonno und nonna enden auf -o und -a.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson01.order.003
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: word_order
  frame:
    text: Questo è mio {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Questo è mio {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Questo und mio sind maskulin, sie stehen also bei einem maskulinen Nomen: questo è mio padre.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson01.fill.004
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: fill_in_blank
  frame:
    text: Questa è mia {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Questa und mia sind feminin und passen zu madre: Das ist meine Mutter.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson01.translate.005
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: Das ist meine Mutter.
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Questa è mia {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Verwenden Sie questa und mia bei einem femininen Nomen, questo und mio bei einem maskulinen.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson01.translate.006
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Madre und padre, fratello und sorella, nonno und nonna sind maskuline und feminine Paare von Familienwörtern.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson02.choose.001
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fratelli ist der Plural von fratello und kann auch „Geschwister“ bedeuten.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson02.listen.002
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marito und moglie bedeuten „Ehemann“ und „Ehefrau“; moglie endet auf -e, ist aber feminin.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson02.order.003
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: word_order
  frame:
    text: Ho un fratello e una {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Un steht bei einem maskulinen Nomen, una bei einem femininen: un fratello, una sorella.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson02.fill.004
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: fill_in_blank
  frame:
    text: Hai fratelli o {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Der Plural von sorella ist sorelle: Die Endung -a wird zu -e.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson02.translate.005
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: Ich habe einen Bruder und eine Schwester.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ho bedeutet „ich habe“; verwenden Sie un vor einem maskulinen Nomen und una vor einem femininen.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson02.translate.006
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: Hast du Brüder oder Schwestern? (informell, tu)
    language_code: de
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai fratelli o {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai ist die informelle tu-Form von „haben“, diese Frage richtet sich also an Freunde oder Kollegen.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson03.match.001
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Familienwörter gibt es in maskulinen und femininen Paaren: marito und moglie, figlio und figlia.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson03.choose.002
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Figli bedeutet allgemein „Kinder“; figlio und figlia bezeichnen einen Sohn oder eine Tochter.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson03.listen.003
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Maschio und femmina bezeichnen in einer Familie einen Jungen und ein Mädchen.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson03.fill.004
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: fill_in_blank
  frame:
    text: Sì, ho due {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Figli ist der Plural von figlio und umfasst Kinder beiderlei Geschlechts.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson03.translate.005
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: translation
  frame:
    text: Hast du Kinder? (informell, tu)
    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai figli? ist die informelle Art zu fragen, ob jemand Kinder hat.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit06.lesson03.translate.006
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Figlio und figlia bedeuten „Sohn“ und „Tochter“; maschio und femmina beschreiben einen Jungen und ein Mädchen unter Ihren Kindern.
    language_code: de
    direction: ltr
