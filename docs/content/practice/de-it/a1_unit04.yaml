    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Arrivo giovedì {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Vor einem Wochentag braucht das Italienische kein Wort für „am“: arrivo giovedì, ich komme Donnerstag an.'
