    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mele steht im Plural, deshalb heißt das Verb costano und nicht costa.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson03.match.001
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
