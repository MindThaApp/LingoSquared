templates:
- content_key: practice.de-it.it.a1.unit08.lesson01.choose.001
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mele ist der Plural von mela: Feminine Nomen auf -a bilden den Plural auf -e.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson01.listen.002
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mele, banane und patate sind feminin im Plural und haben le; pomodori ist maskulin im Plural und hat i.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson01.order.003
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: word_order
  frame:
    text: Quanto costano le {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costano le {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Le steht bei femininen Nomen im Plural, und costano ist die Pluralform des Verbs, weil mehrere Dinge einen Preis haben.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson01.order.004
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: word_order
  frame:
    text: Quanto costano i {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costano i {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Pomodori ist maskulin im Plural, deshalb steht i und nicht le.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson01.fill.005
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: fill_in_blank
  frame:
