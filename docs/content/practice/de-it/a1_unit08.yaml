    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: In italienischen Geschäften wird Obst und Gemüse nach Kilo verkauft.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson01.translate.007
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: Wie viel kosten die Äpfel?
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto {item} le mele?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Nomen im Plural verlangen costano: quanto costano le mele.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson01.translate.008
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: Sie kosten drei Euro das Kilo.
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costano tre euro al {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Nach einer Zahl bleibt euro im Italienischen unverändert: tre euro.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson01.translate.009
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: Ich hätte gern ein Kilo Äpfel, bitte.
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un {item} di mele, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Di verbindet die Menge mit der Ware: un chilo di mele.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson01.translate.010
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mele, banane, pomodori und patate stehen hier im Plural, weil man sie kiloweise kauft.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson03.choose.002
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lo prendo bedeutet „ich nehme es“; lo bezieht sich auf eine maskuline Ware.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson03.listen.003
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Va bene ist eine sehr gebräuchliche Art, „in Ordnung“ zu sagen.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson03.fill.004
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: fill_in_blank
  frame:
    text: Va bene, {item} prendo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Lo bedeutet „es“ und steht vor dem Verb: lo prendo.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson03.order.005
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: word_order
  frame:
    text: Va bene, lo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Prendo ist die ich-Form von prendere, „nehmen“, und wird verwendet, um einen Preis anzunehmen.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson03.translate.006
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: translation
  frame:
    text: Gut, ich nehme es.
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Va bene, lo prendo ist die übliche Art, einen Kauf abzuschließen.
    language_code: de
    direction: ltr
