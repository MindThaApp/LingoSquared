    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al chilo bedeutet „pro Kilo“, die übliche Art, den Preis von Obst und Gemüse anzugeben.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit08.lesson01.fill.006
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: fill_in_blank
  frame:
    text: Quanto {item} le mele? ({hint})
    language_code: it
