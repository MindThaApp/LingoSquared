      text: Ho la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Im Italienischen steht bei ho la febbre der Artikel la; im Deutschen sagt man einfach „Fieber“ ohne Artikel.
    language_code: de
    direction: ltr
