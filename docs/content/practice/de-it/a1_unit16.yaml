      text: Devo andare dal {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Dal ist da plus il: Es steht, wenn man zu einer Person geht; dal dottore bedeutet also „zum Arzt“.'
    language_code: de
    direction: ltr
