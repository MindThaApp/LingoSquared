templates:
- content_key: practice.de-it.it.a1.unit01.lesson01.choose.001
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu verwendet man für Freunde, Familie und Gleichaltrige; Lei, mit großem L, ist die höfliche Form für Fremde, ältere Menschen und im beruflichen Umfeld.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson01.listen.002
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ciao passt sowohl zur Begrüßung als auch zum Abschied, während buongiorno ein höfliches „Guten Tag“ ist.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson01.order.003
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: word_order
  frame:
    text: Ciao, come {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Come stai? fragt einen Freund, wie es ihm geht; zu einem Fremden sagt man Come sta?
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson01.match.004
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Viele italienische Adjektive auf -ale entsprechen deutschen auf -al oder -ell: informale heißt „informell“, formale heißt „formell“.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson01.translate.005
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Rispettoso passt zum formellen Lei: Es drückt Respekt gegenüber Personen aus, die man nicht gut kennt.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson01.translate.006
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: Hallo, wie geht es dir? (informell, an einen Freund)
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Stai ist die tu-Form; die höfliche Lei-Form derselben Frage lautet Buongiorno, come sta?
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson02.choose.001
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Arrivederla ist der formelle Abschied; das -la am Ende bezieht sich auf Lei. Unter Freunden sagt man auf Italienisch ciao.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson02.listen.002
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buonasera ist der Abendgruß; buonanotte sagt man nur, wenn jemand schlafen geht.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson02.order.003
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: word_order
  frame:
    text: Ciao, ci {item} domani!
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, ci {item} domani!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo bedeutet wörtlich „wir sehen uns“; so sagt man im Alltag „bis bald“.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson02.fill.004
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: fill_in_blank
  frame:
    text: Arrivederla, a {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A domani bedeutet „bis morgen“; das a gehört fest zu dieser Wendung.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson02.translate.005
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bene beantwortet Come stai? und kann auch allein stehen: „gut“ oder „in Ordnung“.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson03.choose.001
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scusi ist die höfliche Art, einen Fremden anzusprechen; es ist die formelle Form (Lei).
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson03.listen.002
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Benvenuto ist männlich; für eine Frau wird daraus benvenuta.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson03.order.003
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: word_order
  frame:
    text: Mi chiamo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mi chiamo bedeutet wörtlich „ich nenne mich“; der Name steht einfach am Ende.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson03.fill.004
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: fill_in_blank
  frame:
    text: Come ti {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ti ist das informelle „dich“; mit Lei wird die Frage zu Come si chiama?
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson03.match.005
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Piacere ist sowohl das Substantiv „Vergnügen“ als auch die Antwort bei einer Begegnung: „freut mich“.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson03.translate.006
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mille bedeutet „tausend“; grazie mille ist also ein herzliches „vielen Dank“.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit01.lesson03.translate.007
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: Ich heiße Elena.
    language_code: de
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Auf Italienisch sagt man mi chiamo, wörtlich „ich nenne mich“; im Deutschen sagt man dafür „ich heiße“.
    language_code: de
    direction: ltr
