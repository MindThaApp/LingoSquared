templates:
- content_key: practice.de-it.it.a1.unit03.lesson01.choose.001
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Uno ist die Zahl zum Zählen; vor einem maskulinen Nomen wird es zu un, vor einem femininen zu una.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson01.listen.002
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sette und otto haben beide ein doppeltes t; halten Sie es etwas länger.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson01.order.003
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: word_order
  frame:
    text: Ho {age} anni.
    language_code: it
    direction: ltr
  slots:
    age: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho {age} anni.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Das Alter gibt man im Italienischen mit avere (haben) an: ho cinque anni heißt wörtlich „ich habe fünf Jahre“.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson01.fill.004
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: fill_in_blank
  frame:
    text: Quanti anni {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hai ist die tu-Form von avere; bei Lei lautet die Frage Quanti anni ha?
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson01.match.005
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Von null bis zehn sind es die grundlegenden Bausteine; die Zahlen ab elf und die Zehner werden später daraus gebildet.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson01.translate.006
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: translation
  frame:
    text: Ich bin {age} Jahre alt.
    language_code: de
    direction: ltr
    slot_rendering:
      age: english_gloss
  slots:
    age: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho {age} anni.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Verwenden Sie für das Alter nie sono: Ho dieci anni, nicht Sono dieci anni.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson02.choose.001
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ne steht für „davon“: Ne vorrei tre heißt „Ich hätte gern drei davon“.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson02.listen.002
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Caffè wird auf der letzten Silbe betont, was der Akzent anzeigt.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson02.order.003
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: word_order
  frame:
    text: Quanto costa un {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costa un {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Costa steht im Singular, also bei einer einzelnen Sache: Quanto costa un cornetto? Bei mehreren sagt man costano.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson02.fill.004
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: fill_in_blank
  frame:
    text: Ne {item} tre, grazie. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vorrei ist die höfliche Art, etwas zu bestellen oder zu erbitten, weicher als „ich will“.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson02.translate.005
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cinquanta ist fünfzig; die italienischen Zehner enden ab vierzig auf -anta.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson02.translate.006
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: translation
  frame:
    text: Was kostet {item}?
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costa un {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Quanto costa? braucht kein Hilfswort wie „tun“: quanto, „wie viel“, plus costa, „es kostet“.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson03.choose.001
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tuo und mio richten sich nach dem Genus; hier sind beide maskulin, weil numero maskulin ist.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson03.order.002
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: word_order
  frame:
    text: Qual è il tuo numero di {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Qual è il tuo numero di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Qual ist die Kurzform von quale; vor einer Form von essere fällt das e am Ende weg.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson03.fill.003
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: fill_in_blank
  frame:
    text: Qual è il {item} numero di telefono? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il tuo numero fragt nach der Nummer der anderen Person; il mio numero antwortet mit Ihrer eigenen.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson03.match.004
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Il ist der bestimmte Artikel im Maskulinum Singular; numero und telefono sind beide maskulin.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson03.translate.005
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Perfetto richtet sich nach dem Bezugswort: Bei einem femininen Nomen wird es zu perfetta.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit03.lesson03.translate.006
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: translation
  frame:
    text: Wie lautet deine Telefonnummer? (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Qual è il tuo numero di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Tuo ist das informelle „dein“; bei Lei würde man il Suo numero sagen.
    language_code: de
    direction: ltr
