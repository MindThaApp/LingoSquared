  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Basta così ist eine feste Wendung und bedeutet: Das ist alles, nichts mehr.'
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit07.lesson03.listen.002
  lesson_content_key: it.a1.unit07.lesson03.il_conto
  type: listen_select
  frame:
