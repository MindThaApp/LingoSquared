- content_key: practice.de-it.it.a1.unit07.lesson01.translate.005
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: Ich möchte bitte einen Kaffee und ein Croissant.
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un cornetto, per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un steht bei maskulinen Nomen wie caffè und cornetto; per favore schließt die Bitte ab.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit07.lesson01.translate.006
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: Was möchten Sie? (formell, Lei)
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Desidera ist die formelle Lei-Form, die das Servicepersonal verwendet, nicht die informelle tu-Form.
    language_code: de
    direction: ltr
- content_key: practice.de-it.it.a1.unit07.lesson03.choose.001
  lesson_content_key: it.a1.unit07.lesson03.il_conto
