    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Così bedeutet „so“ oder „auf diese Weise“, und in basta così schließt es eine Bestellung ab.
    language_code: de
    direction: ltr
