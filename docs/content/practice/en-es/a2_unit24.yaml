schema_version: "1.0"
pack_key: practice.en-es.a2.unit24
source_language: en
target_language: es
unit_content_key: es.a2.unit24.semana_ocupada
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-es A2 set) from scripts/backfill_lexemes_en_es.py lexemes (es_a2_uNN* tags, w_<token> anchors). Weekly-routine vocabulary; weekdays share one pool because every weekday fits the same frame. This is the smallest unit of the set (13 new tokens), so the matching and recognition items overlap in their word lists.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_clase, w_gimnasio, w_fin, w_amigos, w_martes, w_comida, w_lunes, w_jueves, w_viernes, w_descanso, w_veo, w_compro, w_haces, w_normalmente, w_tu]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_clase, w_gimnasio, w_fin, w_amigos, w_martes, w_comida]}}
  p2: &p2 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_clase]}}
  p3: &p3 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_lunes, w_martes, w_jueves, w_viernes]}}
  p4: &p4 {language_code: es, part_of_speech: [adverb, noun, verb], agreement_tags: {semantic: [w_fin, w_descanso, w_veo, w_amigos, w_compro, w_haces, w_normalmente]}}
  p5: &p5 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_descanso]}}
  p6: &p6 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_compro]}}
  p7: &p7 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_haces]}}
  p8: &p8 {language_code: es, part_of_speech: [adverb, noun], agreement_tags: {semantic: [w_clase, w_gimnasio, w_amigos, w_comida, w_normalmente, w_fin]}}
  p9: &p9 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_normalmente]}}
  p10: &p10 {language_code: es, part_of_speech: [adverb, noun, pronoun, verb], agreement_tags: {semantic: [w_martes, w_compro, w_comida, w_tu, w_normalmente, w_haces]}}
templates:
  - content_key: practice.en-es.es.a2.unit24.lesson02.choose.001
    lesson_content_key: es.a2.unit24.lesson02.despues_de_clase
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These nouns come from the description of a busy week.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit24.lesson02.fill.002
    lesson_content_key: es.a2.unit24.lesson02.despues_de_clase
    type: fill_in_blank
    frame: {text: "Después de {item} voy al gimnasio. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Después de is followed by a noun or an infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit24.lesson02.order.003
    lesson_content_key: es.a2.unit24.lesson02.despues_de_clase
    type: word_order
    frame: {text: "Los {item} voy al gimnasio después de clase.", language_code: es, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Los {item} voy al gimnasio después de clase.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish uses los before a weekday for something that happens every week.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit24.lesson02.listen.004
    lesson_content_key: es.a2.unit24.lesson02.despues_de_clase
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard is a noun from the weekly routine.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit24.lesson03.choose.001
    lesson_content_key: es.a2.unit24.lesson03.fin_de_semana
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The weekend sentences use these words.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit24.lesson03.translate.002
    lesson_content_key: es.a2.unit24.lesson03.fin_de_semana
    type: translation
    frame: {text: "On the weekend I rest and see my friends.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "El fin de semana {item} y veo a mis amigos.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish uses a before a person who is the object of ver: veo a mis amigos.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit24.lesson03.match.003
    lesson_content_key: es.a2.unit24.lesson03.fin_de_semana
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Fin de semana is the weekend; fin alone means end.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit24.lesson04.fill.001
    lesson_content_key: es.a2.unit24.lesson04.mi_semana
    type: fill_in_blank
    frame: {text: "Los jueves {item} comida. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Comprar means to buy; compro is the form for yo.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit24.lesson04.order.002
    lesson_content_key: es.a2.unit24.lesson04.mi_semana
    type: word_order
    frame: {text: "¿Qué {item} el fin de semana?", language_code: es, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "¿Qué {item} el fin de semana?", language_code: es, direction: ltr}}
    feedback_frame: {text: "Haces is the informal form of hacer, used with tú.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit24.lesson04.translate.003
    lesson_content_key: es.a2.unit24.lesson04.mi_semana
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These words come from the description of a busy week.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit24.lesson04.translate.004
    lesson_content_key: es.a2.unit24.lesson04.mi_semana
    type: translation
    frame: {text: "On the weekend I normally rest.", language_code: en, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "El fin de semana {item} descanso.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Normalmente ends in -mente, like many English adverbs ending in -ly.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit24.lesson04.choose.005
    lesson_content_key: es.a2.unit24.lesson04.mi_semana
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The reading and the dialogue describe a typical week.", language_code: en, direction: ltr}
