  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: fill_in_blank
  frame:
    text: El tren {item} a las diez menos cuarto del andén cinco. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_sale}
    hint:
