      part_of_speech: noun
      agreement_tags: {semantic: w_tren}
  answer_derivation:
    kind: render_frame
    frame: {text: '¿A qué hora llega el {item}?', language_code: es, direction: ltr}
  feedback_frame: {text: 'What time does the train arrive? ¿A qué hora llega ...? asks for an arrival time; llegar is regular and takes a las before the time.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit51.lesson03.order.002
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: word_order
  frame: {text: 'Atención, el tren a Toledo lleva {item}.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
