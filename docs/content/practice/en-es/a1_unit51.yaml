  answer_derivation:
    kind: render_frame
    frame: {text: '¿De qué {item} sale el tren a Toledo?', language_code: es, direction: ltr}
  feedback_frame: {text: 'From which platform does the train to Toledo leave? andén means platform.', language_code: en, direction: ltr}
