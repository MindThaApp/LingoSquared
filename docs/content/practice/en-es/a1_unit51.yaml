      part_of_speech: verb
      agreement_tags: {semantic: w_sale}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: The train leaves at a quarter to ten from platform five. Las diez menos cuarto reuses the "minus a quarter" clock pattern from the lesson on time., language_code: en, direction: ltr}
