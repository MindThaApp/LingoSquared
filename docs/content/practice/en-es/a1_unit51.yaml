schema_version: '1.0'
pack_key: practice.en-es.a1.unit51
source_language: en
target_language: es
unit_content_key: es.a1.unit51.travel
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_a1_u51 / w_<token>). 26 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ahí, w_allá, w_andén, w_atención, w_billete, w_cuarenta, w_entrada, w_espera, w_ida, w_justo, w_llega, w_llegada, w_lleva, w_lugar, w_panel, w_precio, w_problema, w_quisiera, w_recto, w_retraso, w_sale, w_salida, w_suben, w_taquilla, w_tren, w_vuelta]
templates:
- content_key: practice.en-es.es.a1.unit51.lesson01.choose.001
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_billete, w_quisiera, w_ida, w_vuelta, w_taquilla, w_andén, w_sale, w_tren, w_llega, w_retraso, w_atención, w_lleva, w_lugar, w_entrada, w_salida, w_espera, w_recto, w_llegada, w_precio, w_cuarenta, w_ahí, w_panel, w_problema, w_justo, w_suben, w_allá]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on buying a ticket.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit51.lesson02.listen.001
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: listen_select
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what time does the train leave?.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit51.lesson03.translate.001
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on delay.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit51.lesson04.match.001
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: es, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Spanish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
