  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: word_order
  frame: {text: 'Quisiera un {item} a Toledo.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_billete}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Quisiera un {item} a Toledo.', language_code: es, direction: ltr}
  feedback_frame: {text: I would like a ticket to Toledo. billete means ticket., language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit51.lesson01.fill.003
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: fill_in_blank
  frame:
    text: ¿Quiere un billete de ida o de ida y {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_vuelta}
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_vuelta}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Would you like a one-way ticket or a return? Quiere is the formal usted form of querer, used here for an unfamiliar station employee.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit51.lesson01.translate.004
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: translation
  frame: {text: 'At the counter, you usually use the polite form usted.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_taquilla}
  answer_derivation:
    kind: render_frame
    frame: {text: 'En la {item} se suele usar la forma de cortesía usted.', language_code: es, direction: ltr}
  feedback_frame: {text: 'At the counter, you usually use the polite form usted. Strangers in a service role are addressed as usted, not tú.', language_code: en, direction: ltr}
