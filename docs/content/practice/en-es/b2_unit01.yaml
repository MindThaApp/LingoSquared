  answer_derivation:
    kind: render_frame
    frame: {text: 'Ahorras tiempo, por {item} el trayecto.', language_code: es, direction: ltr}
  feedback_frame: {text: 'You save time, for example commute time. ejemplo means example.', language_code: en, direction: ltr}
