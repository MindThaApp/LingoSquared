  feedback_frame: {text: Working from home has many advantages. ventajas means advantages., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit01.lesson06.order.002
  lesson_content_key: es.b2.unit01.lesson06.defender_una_postura
  type: word_order
  frame: {text: '¿Por qué {item} eso?', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_crees}
  answer_derivation:
    kind: render_frame
    frame: {text: '¿Por qué {item} eso?', language_code: es, direction: ltr}
  feedback_frame: {text: 'Why do you think that? ¿Por qué crees eso? asks a debating partner to support their claim -- the cue to give your reasons and evidence.', language_code: en, direction: ltr}
