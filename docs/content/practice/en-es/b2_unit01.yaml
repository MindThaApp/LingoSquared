  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading an argument.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit01.lesson06.translate.001
  lesson_content_key: es.b2.unit01.lesson06.defender_una_postura
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on defending a position.', language_code: en, direction: ltr}
