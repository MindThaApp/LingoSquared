      part_of_speech: noun
      agreement_tags: {semantic: w_lado}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Por otro {item}, echas de menos el contacto con tus compañeros.', language_code: es, direction: ltr}
  feedback_frame: {text: 'Mateo: On the other hand, you miss the contact with your colleagues. lado means side.', language_code: en, direction: ltr}
