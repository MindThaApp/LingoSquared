    kind: render_frame
    frame: {text: 'No {item}, las ventajas son claras.', language_code: es, direction: ltr}
  feedback_frame: {text: 'Nevertheless, the advantages are clear. obstante means withstanding; in no obstante: nevertheless.', language_code: en, direction: ltr}
