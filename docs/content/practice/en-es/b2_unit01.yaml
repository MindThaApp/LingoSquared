schema_version: '1.0'
pack_key: practice.en-es.b2.unit01
source_language: en
target_language: es
unit_content_key: es.b2.unit01.argumentacion
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_b2_u1 / w_<token>). 70 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_acuerdo, w_además, w_ahorra, w_ahorrar, w_ahorras, w_ahorro, w_cada, w_cambio, w_casa, w_cierto, w_claro, w_compañeros, w_contacto, w_convencida, w_crees, w_creo, w_cómodo, w_dicen, w_echa, w_echar, w_echas, w_ejemplo, w_eres, w_estoy, w_evolución, w_hacer, w_inconvenientes, w_investigaciones, w_lado, w_libertad, w_llamar, w_lugar, w_mejor, w_menos, w_mucho, w_más, w_obstante, w_oficina, w_opinión, w_otro, w_personas, w_pesa, w_pesan, w_pesar, w_pese, w_piensan, w_positiva, w_postura, w_primer, w_productivo, w_puedas, w_quita, w_razón, w_resumen, w_segundo, w_ser, w_son, w_suelen, w_teletrabajo, w_tiempo, w_tiene, w_tienes, w_todavía, w_trabajan, w_trabajar, w_trayecto, w_veces, w_ventajas, w_vez, w_videollamadas]
templates:
- content_key: practice.en-es.es.b2.unit01.lesson01.choose.001
  lesson_content_key: es.b2.unit01.lesson01.tomar_postura
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_teletrabajo, w_oficina, w_postura, w_creo, w_opinión, w_mejor, w_trabajar, w_casa, w_estoy, w_acuerdo, w_primer, w_lugar, w_segundo, w_además, w_ejemplo, w_investigaciones, w_trayecto, w_tiempo, w_ahorrar, w_ahorro, w_ahorras, w_ahorra, w_mucho, w_más, w_productivo, w_eres, w_lado, w_otro, w_claro, w_cierto, w_piensan, w_veces, w_compañeros, w_echar, w_echas, w_echa, w_menos, w_contacto, w_cómodo, w_obstante, w_cambio, w_quita, w_resumen, w_ventajas, w_inconvenientes, w_pesa, w_pesan, w_pesar, w_pese, w_libertad, w_tiene, w_cada, w_vez, w_personas, w_trabajan, w_convencida, w_evolución, w_positiva, w_suelen, w_ser, w_dicen, w_todavía, w_puedas, w_llamar, w_hacer, w_videollamadas, w_crees, w_razón, w_tienes, w_son]
