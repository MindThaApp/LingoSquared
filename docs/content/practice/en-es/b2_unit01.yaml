  lesson_content_key: es.b2.unit01.lesson06.defender_una_postura
  type: fill_in_blank
  frame:
    text: Algo de {item} tienes. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_razón}
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_razón}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: You have a point. / There's something to that. Algo de razón tienes concedes that the other person's argument is reasonable -- a natural way to acknowledge a good point in discussion., language_code: en, direction: ltr}
