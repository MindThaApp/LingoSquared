    frame: {text: 'A veces echo de menos a mis {item}.', language_code: es, direction: ltr}
  feedback_frame: {text: Sometimes I miss my colleagues. compañeros means colleagues (masc. or mixed plural)., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit01.lesson04.order.002
  lesson_content_key: es.b2.unit01.lesson04.rebatir
  type: word_order
  frame: {text: 'No {item}, las ventajas son claras.', language_code: es, direction: ltr}
