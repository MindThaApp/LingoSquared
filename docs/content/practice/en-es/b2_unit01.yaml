  feedback_frame: {text: I have a clear position. postura means position; viewpoint., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit01.lesson02.order.002
  lesson_content_key: es.b2.unit01.lesson02.dar_razones
  type: word_order
  frame: {text: 'Ahorras tiempo, por {item} el trayecto.', language_code: es, direction: ltr}
