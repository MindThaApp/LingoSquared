schema_version: '1.0'
pack_key: practice.en-es.b2.unit03
source_language: en
target_language: es
unit_content_key: es.b2.unit03.matices
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_b2_u3 / w_<token>). 37 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_agradable, w_ambiente, w_barato, w_bien, w_buena, w_calidad, w_caro, w_comida, w_delicioso, w_duda, w_especial, w_estaba, w_excelente, w_gusta, w_gustó, w_hecho, w_lento, w_mal, w_malo, w_merece, w_modo, w_muy, w_pareció, w_pasa, w_pena, w_perfecta, w_poco, w_postre, w_punto, w_realidad, w_realmente, w_restaurante, w_sea, w_servicio, w_vale, w_volver, w_voy]
templates:
- content_key: practice.en-es.es.b2.unit03.lesson01.choose.001
  lesson_content_key: es.b2.unit03.lesson01.suavizar
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_poco, w_mal, w_bien, w_restaurante, w_caro, w_postre, w_sea, w_malo, w_punto, w_modo, w_ambiente, w_agradable, w_hecho, w_realidad, w_duda, w_delicioso, w_estaba, w_muy, w_excelente, w_gusta, w_pasa, w_servicio, w_lento, w_gustó, w_vale, w_pena, w_comida, w_perfecta, w_especial, w_merece, w_volver, w_realmente, w_pareció, w_barato, w_calidad, w_buena, w_voy]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on softening a statement.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit03.lesson02.listen.001
  lesson_content_key: es.b2.unit03.lesson02.formular_con_cuidado
  type: listen_select
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on formulating carefully.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit03.lesson03.translate.001
  lesson_content_key: es.b2.unit03.lesson03.enfatizar
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on emphasizing something.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit03.lesson04.match.001
  lesson_content_key: es.b2.unit03.lesson04.poner_el_foco
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: es, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Spanish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit03.lesson05.choose.001
  lesson_content_key: es.b2.unit03.lesson05.leer_una_resena
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a review.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit03.lesson06.translate.001
  lesson_content_key: es.b2.unit03.lesson06.matices_en_conversacion
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on nuance in conversation.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit03.lesson01.order.002
  lesson_content_key: es.b2.unit03.lesson01.suavizar
  type: word_order
  frame: {text: 'El restaurante es un {item} caro.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: adverb
      agreement_tags: {semantic: w_poco}
  answer_derivation:
    kind: render_frame
    frame: {text: 'El restaurante es un {item} caro.', language_code: es, direction: ltr}
  feedback_frame: {text: The restaurant is a little expensive. poco means little; a little., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit03.lesson01.fill.003
  lesson_content_key: es.b2.unit03.lesson01.suavizar
  type: fill_in_blank
  frame:
    text: El restaurante no está {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: adverb
      agreement_tags: {semantic: w_mal}
    hint:
      language_code: es
      part_of_speech: adverb
      agreement_tags: {semantic: w_mal}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: The restaurant isn't bad. mal means badly., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit03.lesson01.translate.004
  lesson_content_key: es.b2.unit03.lesson01.suavizar
  type: translation
  frame: {text: The restaurant is somewhat expensive., language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_restaurante}
  answer_derivation:
    kind: render_frame
    frame: {text: 'El {item} es algo caro.', language_code: es, direction: ltr}
  feedback_frame: {text: The restaurant is somewhat expensive. restaurante means restaurant., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit03.lesson02.order.002
  lesson_content_key: es.b2.unit03.lesson02.formular_con_cuidado
  type: word_order
  frame: {text: 'No es que {item} malo.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_sea}
  answer_derivation:
    kind: render_frame
    frame: {text: 'No es que {item} malo.', language_code: es, direction: ltr}
  feedback_frame: {text: It's not that it's bad. sea means is; may be (after a phrase like I do not think that)., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit03.lesson02.fill.003
  lesson_content_key: es.b2.unit03.lesson02.formular_con_cuidado
  type: fill_in_blank
  frame:
    text: No es que sea {item}, sino que es caro. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags: {semantic: w_malo}
    hint:
      language_code: es
      part_of_speech: adjective
      agreement_tags: {semantic: w_malo}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'It''s not that it''s bad, but rather that it''s expensive. A careful qualification: deny one framing (no es que sea malo), offer the real one (sino que es caro).', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit03.lesson02.translate.004
  lesson_content_key: es.b2.unit03.lesson02.formular_con_cuidado
  type: translation
  frame: {text: 'In a way, it''s pleasant.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_modo}
  answer_derivation:
    kind: render_frame
    frame: {text: 'En cierto {item}, es agradable.', language_code: es, direction: ltr}
  feedback_frame: {text: 'In a way, it''s pleasant. modo means way; manner.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit03.lesson03.order.002
  lesson_content_key: es.b2.unit03.lesson03.enfatizar
  type: word_order
  frame: {text: 'De {item}, es excelente.', language_code: es, direction: ltr}
  slots:
    item:
