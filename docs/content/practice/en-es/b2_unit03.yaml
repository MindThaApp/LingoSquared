    hint:
      language_code: es
      part_of_speech: adjective
      agreement_tags: {semantic: w_delicioso}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: The dessert was delicious. delicioso means delicious., language_code: en, direction: ltr}
