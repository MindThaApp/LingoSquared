schema_version: "1.0"
pack_key: practice.en-es.a2.unit17
source_language: en
target_language: es
unit_content_key: es.a2.unit17.opiniones
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-es A2 set) from scripts/backfill_lexemes_en_es.py lexemes (es_a2_uNN* tags, w_<token> anchors). Opinion language for Elena and Mateo's neighbourhood debate. Single-token anchors fix the subjunctive after "no creo que" and the fixed English sentences. NATIVE FLAG: "extraño" (I miss) is the Latin American verb; Spain more often says "echo de menos".
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_opinión, w_barrio, w_tiendas, w_trabajo, w_ventajas, w_conveniencia, w_tranquilidad, w_acuerdo, w_hay, w_más, w_cerca, w_también, w_porque, w_piensas, w_creo, w_sea, w_extraño, w_tranquilo, w_viejo, w_tan, w_como, w_cada, w_mejor, w_razón, w_tienes, w_entiendo, w_supongo, w_verdad, w_era, w_pensar, w_piensa, w_parece, w_nuevo, w_me, w_sin, w_sus, w_mí, w_del, w_no, w_yo, w_estoy, w_pero, w_gusta, w_cree, w_este, w_dos, w_están]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_opinión, w_barrio, w_tiendas, w_trabajo, w_ventajas, w_conveniencia, w_tranquilidad, w_acuerdo]}}
  p2: &p2 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_opinión]}}
  p3: &p3 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_barrio]}}
  p4: &p4 {language_code: es, part_of_speech: [adverb, noun, particle, verb], agreement_tags: {semantic: [w_hay, w_más, w_cerca, w_tiendas, w_trabajo, w_también, w_porque]}}
  p5: &p5 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_trabajo]}}
  p6: &p6 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_tiendas]}}
  p7: &p7 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_piensas]}}
  p8: &p8 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_creo]}}
  p9: &p9 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_sea]}}
  p10: &p10 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_extraño]}}
  p11: &p11 {language_code: es, part_of_speech: [adjective, adverb, noun, verb], agreement_tags: {semantic: [w_tranquilo, w_tranquilidad, w_viejo, w_extraño, w_sea, w_tan, w_como]}}
  p12: &p12 {language_code: es, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_ventajas, w_opinión, w_barrio, w_tiendas, w_cada, w_mejor]}}
  p13: &p13 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_ventajas, w_opinión, w_barrio, w_tiendas, w_conveniencia]}}
  p14: &p14 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_acuerdo]}}
  p15: &p15 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_razón]}}
  p16: &p16 {language_code: es, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_tienes, w_razón, w_entiendo, w_supongo, w_verdad, w_conveniencia, w_era]}}
  p17: &p17 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_razón, w_verdad, w_conveniencia, w_acuerdo, w_ventajas, w_opinión]}}
  x1: &x1 {language_code: es, part_of_speech: [adjective, pronoun, verb], agreement_tags: {semantic: [w_pensar, w_piensa, w_parece, w_nuevo, w_me]}}
  x2: &x2 {language_code: es, part_of_speech: [particle, preposition, pronoun], agreement_tags: {semantic: [w_sin, w_sus, w_mí, w_del, w_no, w_yo]}}
  x3: &x3 {language_code: es, part_of_speech: [noun, particle, pronoun, verb], agreement_tags: {semantic: [w_estoy, w_pero, w_gusta, w_cree, w_este, w_dos, w_están]}}
templates:
  - content_key: practice.en-es.es.a2.unit17.lesson01.choose.001
    lesson_content_key: es.a2.unit17.lesson01.mi_opinion
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These nouns appear in the discussion about the new and the old neighbourhood.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson01.fill.002
    lesson_content_key: es.a2.unit17.lesson01.mi_opinion
    type: fill_in_blank
    frame: {text: "¿Cuál es tu {item} sobre el barrio nuevo? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Opinión is a feminine noun; ¿Cuál es tu opinión? is a common way to ask what someone thinks.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson01.translate.003
    lesson_content_key: es.a2.unit17.lesson01.mi_opinion
    type: translation
    frame: {text: "The new neighborhood is better.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "El {item} nuevo es mejor.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Barrio is masculine, so the adjectives nuevo and viejo end in -o.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson02.choose.001
    lesson_content_key: es.a2.unit17.lesson02.porque_hay_mas_tiendas
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Hay means both there is and there are.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson02.order.002
    lesson_content_key: es.a2.unit17.lesson02.porque_hay_mas_tiendas
    type: word_order
    frame: {text: "También está más cerca del {item}.", language_code: es, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "También está más cerca del {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "De plus el becomes del: del trabajo, not de el trabajo.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson02.translate.003
    lesson_content_key: es.a2.unit17.lesson02.porque_hay_mas_tiendas
    type: translation
    frame: {text: "The new neighborhood is better because there are more shops.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "El barrio nuevo es mejor porque hay más {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Hay does not change in the plural: hay una tienda, hay más tiendas.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson02.listen.004
    lesson_content_key: es.a2.unit17.lesson02.porque_hay_mas_tiendas
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard is a noun from the neighbourhood discussion.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson03.fill.001
    lesson_content_key: es.a2.unit17.lesson03.que_piensas_del_barrio
    type: fill_in_blank
    frame: {text: "¿Qué {item} del barrio nuevo? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pensar de asks for someone's opinion: ¿Qué piensas de...?", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson03.translate.002
    lesson_content_key: es.a2.unit17.lesson03.que_piensas_del_barrio
    type: translation
    frame: {text: "I think it is better because it is closer to work.", language_code: en, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "Yo {item} que es mejor porque está más cerca del trabajo.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Creo que is followed by the indicative: es, not sea.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson04.order.001
    lesson_content_key: es.a2.unit17.lesson04.no_creo_que
    type: word_order
    frame: {text: "No creo que {item} tan tranquilo como el viejo.", language_code: es, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "No creo que {item} tan tranquilo como el viejo.", language_code: es, direction: ltr}}
    feedback_frame: {text: "After no creo que, Spanish uses the subjunctive: sea, not es.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson04.translate.002
    lesson_content_key: es.a2.unit17.lesson04.no_creo_que
    type: translation
    frame: {text: "I miss the peace and quiet of the old neighborhood.", language_code: en, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Yo {item} la tranquilidad del barrio viejo.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Extrañar takes a direct object in this meaning: extraño la tranquilidad.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson04.choose.003
    lesson_content_key: es.a2.unit17.lesson04.no_creo_que
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Tranquilo is an adjective and tranquilidad is the noun that goes with it.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson05.match.001
    lesson_content_key: es.a2.unit17.lesson05.leer_la_nota
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p12, second: *p12, third: *p12, fourth: *p12, fifth: *p12, sixth: *p12}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Cada is followed by a singular noun: cada barrio.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson05.translate.002
    lesson_content_key: es.a2.unit17.lesson05.leer_la_nota
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These nouns come from the note comparing the two neighbourhoods.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson06.fill.001
    lesson_content_key: es.a2.unit17.lesson06.elena_mateo_debaten
    type: fill_in_blank
    frame: {text: "Estoy de {item}, y también está más cerca del trabajo. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p14, hint: *p14}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Estoy de acuerdo is a fixed phrase meaning I agree.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson06.translate.002
    lesson_content_key: es.a2.unit17.lesson06.elena_mateo_debaten
    type: translation
    frame: {text: "You are right.", language_code: en, direction: ltr}
    slots: {item: *p15}
    answer_derivation: {kind: render_frame, frame: {text: "Tienes {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish says tener razón (to have reason) where English says to be right.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson06.choose.003
    lesson_content_key: es.a2.unit17.lesson06.elena_mateo_debaten
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p16}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Elena and Mateo use these words to agree, concede and disagree politely.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson06.match.004
    lesson_content_key: es.a2.unit17.lesson06.elena_mateo_debaten
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p17, second: *p17, third: *p17, fourth: *p17, fifth: *p17, sixth: *p17}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "These nouns carry the reasons and opinions in the dialogue.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson01.choose.004
    lesson_content_key: es.a2.unit17.lesson01.mi_opinion
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *x1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the opinion dialogue: what people think and how things seem.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson01.translate.005
    lesson_content_key: es.a2.unit17.lesson01.mi_opinion
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *x1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Write the Spanish word as it appears in the opinion dialogue.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson05.choose.003
    lesson_content_key: es.a2.unit17.lesson05.leer_la_nota
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *x2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Small words from the note that link ideas or point to people.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson05.translate.004
    lesson_content_key: es.a2.unit17.lesson05.leer_la_nota
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *x2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Type the word as written in the note; an accent can change the meaning of a short word.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson06.choose.005
    lesson_content_key: es.a2.unit17.lesson06.elena_mateo_debaten
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *x3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the debate: what people believe, like and do.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson06.translate.006
    lesson_content_key: es.a2.unit17.lesson06.elena_mateo_debaten
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *x3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Type the word as it is written in the debate.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit17.lesson06.listen.007
    lesson_content_key: es.a2.unit17.lesson06.elena_mateo_debaten
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *x3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Listen to the last syllable; it can separate a singular form from a plural one.", language_code: en, direction: ltr}
