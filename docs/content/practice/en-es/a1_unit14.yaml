schema_version: "1.0"
pack_key: practice.en-es.a1.unit14
source_language: en
target_language: es
unit_content_key: es.a1.unit14.housing
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-es reference set) from
    scripts/backfill_lexemes_en_es.py lexemes (es_a1_u14* tags, w_<token>
    anchors). Only 15 new tokens (lesson04 introduces none, lesson03 and
    lesson05 one each), so recognition and production pool the whole unit.
    Opus pass 2026-10-24: the alguien fill item no longer reuses the ad's para alguien que quiere (normative Spanish wants quiera); it is now ¿Hay alguien en casa?; two feedback lines made accurate. NATIVE FLAG: realization uses para alguien que quiere (indicative) and desocupado/apartamento, which Spain would say as libre/piso.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [es_a1_u14, w_edificio, w_alquilar, w_desocupado, w_dormitorios, w_alguien, w_agencia]
slot_presets:
  nouns: &nouns {language_code: es, part_of_speech: noun, agreement_tags: {semantic: es_a1_u14}}
  content: &content {language_code: es, part_of_speech: [noun, verb, adjective, pronoun], agreement_tags: {semantic: es_a1_u14}}
  edificio: &edificio {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_edificio}}
  others: &others {language_code: es, part_of_speech: [verb, adjective, pronoun], agreement_tags: {semantic: es_a1_u14}}
  alquilar: &alquilar {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_alquilar}}
  desocupado: &desocupado {language_code: es, part_of_speech: adjective, agreement_tags: {semantic: w_desocupado}}
  dormitorios: &dormitorios {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_dormitorios}}
  alguien: &alguien {language_code: es, part_of_speech: pronoun, agreement_tags: {semantic: w_alguien}}
  agencia: &agencia {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_agencia}}
templates:
  - content_key: practice.en-es.es.a1.unit14.lesson01.choose.001
    lesson_content_key: es.a1.unit14.lesson01.el_apartamento_vocabulario
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *nouns}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Baño is both the bathroom and a bath; sala is the living room.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit14.lesson01.listen.002
    lesson_content_key: es.a1.unit14.lesson01.el_apartamento_vocabulario
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *nouns}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Dormitorio comes from dormir, to sleep: the room where you sleep.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit14.lesson01.match.003
    lesson_content_key: es.a1.unit14.lesson01.el_apartamento_vocabulario
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *content, second: *content, third: *content, fourth: *content, fifth: *content, sixth: *content}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Apartamento is common in Latin America; in Spain people also say piso.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit14.lesson02.order.001
    lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
    type: word_order
    frame: {text: "Quiero {item} un apartamento cerca del parque.", language_code: es, direction: ltr}
    slots: {item: *alquilar}
    answer_derivation: {kind: render_frame, frame: {text: "Quiero {item} un apartamento cerca del parque.", language_code: es, direction: ltr}}
    feedback_frame: {text: "I want to rent an apartment near the park. Querer + infinitive says what you want to do.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit14.lesson02.fill.002
    lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
    type: fill_in_blank
    frame: {text: "Hay un apartamento {item} en este edificio. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *desocupado, hint: *desocupado}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Desocupado describes a flat nobody lives in right now; it follows the noun.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit14.lesson03.translate.001
    lesson_content_key: es.a1.unit14.lesson03.cuantos_dormitorios_tiene
    type: translation
    frame: {text: "How many bedrooms does it have?", language_code: en, direction: ltr}
    slots: {item: *dormitorios}
    answer_derivation: {kind: render_frame, frame: {text: "¿Cuántos {item} tiene?", language_code: es, direction: ltr}}
    feedback_frame: {text: "Cuántos agrees with a masculine plural noun; with a feminine one it is cuántas.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit14.lesson05.fill.001
    lesson_content_key: es.a1.unit14.lesson05.leer_el_anuncio
    type: fill_in_blank
    frame: {text: "¿Hay {item} en casa? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *alguien, hint: *alguien}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Alguien means someone; its opposite is nadie, nobody.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit14.lesson06.order.001
    lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
    type: word_order
    frame: {text: "Voy a llamar a la {item} hoy mismo.", language_code: es, direction: ltr}
    slots: {item: *agencia}
    answer_derivation: {kind: render_frame, frame: {text: "Voy a llamar a la {item} hoy mismo.", language_code: es, direction: ltr}}
    feedback_frame: {text: "I'm going to call the agency today. Hoy mismo adds this very day.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit14.lesson06.translate.002
    lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *content}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pequeño becomes pequeña with a feminine noun: una cocina pequeña.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit14.lesson06.choose.003
    lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *others}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Alquilar is to rent; the monthly rent itself is el alquiler.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit14.lesson02.translate.003
    lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *nouns}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Edificio is any building, including a block of flats; casa is a house or home.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit14.lesson02.order.004
    lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
    type: word_order
    frame: {text: "El {item} está cerca del parque.", language_code: es, direction: ltr}
    slots: {item: *edificio}
    answer_derivation: {kind: render_frame, frame: {text: "El {item} está cerca del parque.", language_code: es, direction: ltr}}
    feedback_frame: {text: "The building is near the park. Cerca de + el contracts to cerca del.", language_code: en, direction: ltr}
