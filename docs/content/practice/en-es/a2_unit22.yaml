schema_version: "1.0"
pack_key: practice.en-es.a2.unit22
source_language: en
target_language: es
unit_content_key: es.a2.unit22.viaje_interrumpido
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-es A2 set) from scripts/backfill_lexemes_en_es.py lexemes (es_a2_uNN* tags, w_<token> anchors). Delayed-train vocabulary. Lessons 1-3 hold the new nouns; lesson 4 combines the reading, phrase and dialogue. NATIVE FLAG: autobús is the general word; Mexico also says camión for a bus.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_retraso, w_tren, w_minutos, w_autobús, w_centro, w_pasajeros, w_salida, w_opción, w_cancelado, w_cancelada, w_pueden, w_principal, w_disculpe, w_tarda, w_avisar]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_retraso, w_tren, w_minutos, w_autobús, w_centro, w_pasajeros, w_salida, w_opción]}}
  p2: &p2 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_minutos]}}
  p3: &p3 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_tren]}}
  p4: &p4 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_cancelado]}}
  p5: &p5 {language_code: es, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_cancelado, w_cancelada, w_retraso, w_tren, w_opción]}}
  p6: &p6 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_opción]}}
  p7: &p7 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_centro]}}
  p8: &p8 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_autobús]}}
  p9: &p9 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_tren, w_retraso, w_opción, w_centro, w_pasajeros, w_salida]}}
  p10: &p10 {language_code: es, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_pasajeros, w_pueden, w_salida, w_principal, w_disculpe, w_tarda, w_avisar]}}
  p11: &p11 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_tarda]}}
  p12: &p12 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_avisar]}}
templates:
  - content_key: practice.en-es.es.a2.unit22.lesson01.choose.001
    lesson_content_key: es.a2.unit22.lesson01.el_retraso
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These nouns come from the delayed-train scenes.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson01.fill.002
    lesson_content_key: es.a2.unit22.lesson01.el_retraso
    type: fill_in_blank
    frame: {text: "El tren lleva veinte {item} de retraso. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Llevar plus a length of time says how long something has been going on or how late it is.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson01.translate.003
    lesson_content_key: es.a2.unit22.lesson01.el_retraso
    type: translation
    frame: {text: "The train is twenty minutes late.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "El {item} lleva veinte minutos de retraso.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish says lleva veinte minutos de retraso, literally carries twenty minutes of delay.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson01.listen.004
    lesson_content_key: es.a2.unit22.lesson01.el_retraso
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard is a noun from the train announcement.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson02.translate.001
    lesson_content_key: es.a2.unit22.lesson02.esta_cancelado
    type: translation
    frame: {text: "My train is cancelled.", language_code: en, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Mi tren está {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Cancelado agrees with the masculine noun tren; for a feminine noun it becomes cancelada.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson02.choose.002
    lesson_content_key: es.a2.unit22.lesson02.esta_cancelado
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Cancelado and cancelada differ only in gender.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson03.fill.001
    lesson_content_key: es.a2.unit22.lesson03.otra_opcion
    type: fill_in_blank
    frame: {text: "¿Hay otra {item} para llegar al centro? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Otra is feminine because opción is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson03.translate.002
    lesson_content_key: es.a2.unit22.lesson03.otra_opcion
    type: translation
    frame: {text: "Is there another option to get downtown?", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "¿Hay otra opción para llegar al {item}?", language_code: es, direction: ltr}}
    feedback_frame: {text: "Al is a + el: llegar al centro.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson04.order.001
    lesson_content_key: es.a2.unit22.lesson04.avisar_que_llego_tarde
    type: word_order
    frame: {text: "Los pasajeros pueden tomar el {item}.", language_code: es, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "Los pasajeros pueden tomar el {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Pueden is the plural form of puede, used for los pasajeros.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson04.match.002
    lesson_content_key: es.a2.unit22.lesson04.avisar_que_llego_tarde
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p9, second: *p9, third: *p9, fourth: *p9, fifth: *p9, sixth: *p9}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The reading is an announcement from the station.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson04.choose.003
    lesson_content_key: es.a2.unit22.lesson04.avisar_que_llego_tarde
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The announcement and the dialogue use these words.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson04.fill.004
    lesson_content_key: es.a2.unit22.lesson04.avisar_que_llego_tarde
    type: fill_in_blank
    frame: {text: "¿Cuánto {item} el autobús? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Tardar means to take time: ¿cuánto tarda? asks how long something takes.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson04.translate.005
    lesson_content_key: es.a2.unit22.lesson04.avisar_que_llego_tarde
    type: translation
    frame: {text: "I am going to let Mateo know that I am arriving late.", language_code: en, direction: ltr}
    slots: {item: *p12}
    answer_derivation: {kind: render_frame, frame: {text: "Voy a {item} a Mateo de que llego tarde.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Avisar de que means to let someone know that something is the case.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit22.lesson04.translate.006
    lesson_content_key: es.a2.unit22.lesson04.avisar_que_llego_tarde
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These nouns come from the delayed-train scenes.", language_code: en, direction: ltr}
