schema_version: '1.0'
pack_key: practice.en-es.b2.unit02
source_language: en
target_language: es
unit_content_key: es.b2.unit02.especulacion
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_b2_u2 / w_<token>). 40 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_amigo, w_atrapado, w_autobús, w_contesta, w_debe, w_dónde, w_estar, w_está, w_esté, w_excusa, w_haber, w_hay, w_haya, w_llega, w_médico, w_normalmente, w_ocupado, w_perder, w_perdido, w_perdí, w_perdón, w_posible, w_pronto, w_puede, w_puntual, w_quizás, w_reunión, w_sabe, w_sabes, w_salido, w_salir, w_seguramente, w_seguro, w_tal, w_tarde, w_teléfono, w_tenga, w_tren, w_tráfico, w_verdad]
templates:
- content_key: practice.en-es.es.b2.unit02.lesson01.choose.001
  lesson_content_key: es.b2.unit02.lesson01.que_tan_seguro
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_quizás, w_tal, w_seguramente, w_seguro, w_contesta, w_teléfono, w_amigo, w_reunión, w_está, w_dónde, w_debe, w_estar, w_ocupado, w_tráfico, w_haber, w_hay, w_médico, w_verdad, w_puede, w_esté, w_posible, w_tenga, w_excusa, w_perder, w_tren, w_perdido, w_haya, w_salido, w_salir, w_tarde, w_sabes, w_sabe, w_atrapado, w_normalmente, w_puntual, w_llega, w_pronto, w_perdón, w_autobús, w_perdí]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on how certain are you?.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit02.lesson02.listen.001
  lesson_content_key: es.b2.unit02.lesson02.deduccion
  type: listen_select
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on deduction: it must be so.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit02.lesson03.translate.001
  lesson_content_key: es.b2.unit02.lesson03.suposicion_o_deduccion
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a guess or a deduction?.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit02.lesson04.match.001
  lesson_content_key: es.b2.unit02.lesson04.especular_pasado
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: es, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Spanish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit02.lesson05.choose.001
  lesson_content_key: es.b2.unit02.lesson05.hecho_o_especulacion
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on fact or speculation?.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit02.lesson06.translate.001
  lesson_content_key: es.b2.unit02.lesson06.especular_en_conversacion
