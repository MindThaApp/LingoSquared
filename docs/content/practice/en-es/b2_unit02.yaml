  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on speculating in conversation.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit02.lesson01.order.002
  lesson_content_key: es.b2.unit02.lesson01.que_tan_seguro
  type: word_order
  frame: {text: 'Tu amigo no {item} el teléfono.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_contesta}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Tu amigo no {item} el teléfono.', language_code: es, direction: ltr}
  feedback_frame: {text: Your friend isn't answering the phone. contesta means answers; reply (command)., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit02.lesson01.fill.003
  lesson_content_key: es.b2.unit02.lesson01.que_tan_seguro
  type: fill_in_blank
  frame:
    text: Quizás tu {item} está en una reunión. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_amigo}
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_amigo}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Maybe your friend is in a meeting. The lowest-commitment way to speculate: quizás + the indicative.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit02.lesson01.translate.004
  lesson_content_key: es.b2.unit02.lesson01.que_tan_seguro
  type: translation
