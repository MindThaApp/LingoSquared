    text: ¿Qué {item} esta mañana? ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_pasó}
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_pasó}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Mateo: What happened this morning? pasó means happened; passed (past).', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson06.translate.004
  lesson_content_key: es.b2.unit04.lesson06.contar_la_historia
