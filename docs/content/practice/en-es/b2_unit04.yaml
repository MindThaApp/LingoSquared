schema_version: '1.0'
pack_key: practice.en-es.b2.unit04
source_language: en
target_language: es
unit_content_key: es.b2.unit04.relato
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_b2_u4 / w_<token>). 36 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_alarma, w_antes, w_cama, w_corriendo, w_corrí, w_desperté, w_después, w_empezado, w_entonces, w_era, w_eran, w_esperaba, w_esperé, w_fin, w_frío, w_había, w_habían, w_hacía, w_horrible, w_hoy, w_ido, w_importante, w_jefe, w_llegada, w_llegué, w_luego, w_mañana, w_parada, w_pasó, w_primero, w_salí, w_siete, w_sonó, w_tan, w_taxi, w_tuve]
templates:
- content_key: practice.en-es.es.b2.unit04.lesson01.choose.001
  lesson_content_key: es.b2.unit04.lesson01.el_trasfondo
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_hacía, w_frío, w_eran, w_siete, w_mañana, w_cama, w_importante, w_llegué, w_desperté, w_salí, w_corriendo, w_primero, w_luego, w_después, w_entonces, w_parada, w_esperé, w_corrí, w_esperaba, w_era, w_sonó, w_taxi, w_había, w_ido, w_antes, w_llegada, w_jefe, w_fin, w_habían, w_empezado, w_hoy, w_tuve, w_horrible, w_pasó, w_alarma, w_tan]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the background: how things were.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson02.listen.001
  lesson_content_key: es.b2.unit04.lesson02.el_suceso
  type: listen_select
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the event and the sequence.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson03.translate.001
  lesson_content_key: es.b2.unit04.lesson03.cuando_mientras
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on when, while.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson04.match.001
  lesson_content_key: es.b2.unit04.lesson04.el_pasado_antes
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: es, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Spanish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson05.choose.001
  lesson_content_key: es.b2.unit04.lesson05.que_paso_primero
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what happened first?.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson06.translate.001
  lesson_content_key: es.b2.unit04.lesson06.contar_la_historia
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on telling the whole story.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson01.order.002
  lesson_content_key: es.b2.unit04.lesson01.el_trasfondo
  type: word_order
  frame: {text: 'Eran las {item} de la mañana.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_siete}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Eran las {item} de la mañana.', language_code: es, direction: ltr}
  feedback_frame: {text: 'It was seven in the morning. Telling time in the past always uses the imperfect (eran las siete, never fueron las siete) -- another background fact, not an event.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson01.fill.003
  lesson_content_key: es.b2.unit04.lesson01.el_trasfondo
  type: fill_in_blank
  frame:
    text: Esta {item} llegué tarde a una reunión importante. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_mañana}
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_mañana}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: This morning I arrived late to an important meeting. Llegué is PRETERITE -- the one-time foregrounded event the whole story explains. Everything in this lesson (imperfect) sets the scene BEFORE this happened., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson01.translate.004
  lesson_content_key: es.b2.unit04.lesson01.el_trasfondo
  type: translation
  frame: {text: I was still in bed., language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_cama}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Todavía estaba en la {item}.', language_code: es, direction: ltr}
  feedback_frame: {text: I was still in bed. cama means bed., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson02.order.002
  lesson_content_key: es.b2.unit04.lesson02.el_suceso
  type: word_order
  frame: {text: 'Me {item} tarde.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_desperté}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Me {item} tarde.', language_code: es, direction: ltr}
  feedback_frame: {text: I woke up late. desperté means I woke up (past)., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson02.fill.003
  lesson_content_key: es.b2.unit04.lesson02.el_suceso
  type: fill_in_blank
  frame:
    text: Salí de casa {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_corriendo}
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_corriendo}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I rushed out of the house. corriendo means running; in a hurry., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson02.translate.004
  lesson_content_key: es.b2.unit04.lesson02.el_suceso
  type: translation
  frame: {text: Then I ran to the stop., language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_parada}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Entonces corrí a la {item}.', language_code: es, direction: ltr}
  feedback_frame: {text: Then I ran to the stop. parada means stop; station., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson03.order.002
  lesson_content_key: es.b2.unit04.lesson03.cuando_mientras
  type: word_order
  frame: {text: 'Mientras {item}, llegó un taxi.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_esperaba}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Mientras {item}, llegó un taxi.', language_code: es, direction: ltr}
  feedback_frame: {text: 'While I was waiting, a taxi arrived. esperaba means I was waiting (imperfect).', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson03.fill.003
  lesson_content_key: es.b2.unit04.lesson03.cuando_mientras
  type: fill_in_blank
  frame:
    text: Cuando llegué, ya {item} tarde. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_era}
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_era}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'When I arrived, it was already late. era means was (a past description).', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson03.translate.004
  lesson_content_key: es.b2.unit04.lesson03.cuando_mientras
  type: translation
  frame: {text: 'While I was waiting for a taxi, the phone rang.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_sonó}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Mientras esperaba un taxi, {item} el teléfono.', language_code: es, direction: ltr}
  feedback_frame: {text: 'While I was waiting for a taxi, the phone rang. The model interruption: mientras esperaba (imperfect, ongoing) + sonó (preterite, the interrupting event).', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson04.order.002
  lesson_content_key: es.b2.unit04.lesson04.el_pasado_antes
  type: word_order
  frame: {text: 'El autobús ya se {item} ido.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_había}
  answer_derivation:
    kind: render_frame
    frame: {text: 'El autobús ya se {item} ido.', language_code: es, direction: ltr}
  feedback_frame: {text: 'The bus had already left. The model pre-past event: by the time the narrator''s own story catches up to the bus stop, the bus leaving is already finished.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson04.fill.003
  lesson_content_key: es.b2.unit04.lesson04.el_pasado_antes
  type: fill_in_blank
  frame:
    text: El autobús ya había salido {item} de mi llegada. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: adverb
      agreement_tags: {semantic: w_antes}
    hint:
      language_code: es
      part_of_speech: adverb
      agreement_tags: {semantic: w_antes}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'The bus had already left before my arrival. Antes de mi llegada (a noun phrase) sidesteps needing the imperfect subjunctive that a full clause ("before I arrived") would require -- a natural, simpler alternative this unit.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson04.translate.004
  lesson_content_key: es.b2.unit04.lesson04.el_pasado_antes
  type: translation
  frame: {text: 'Before my arrival, the bus had already left.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_llegada}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Antes de mi {item}, el autobús ya había salido.', language_code: es, direction: ltr}
  feedback_frame: {text: 'Before my arrival, the bus had already left. llegada means arrival.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson05.order.002
  lesson_content_key: es.b2.unit04.lesson05.que_paso_primero
  type: word_order
  frame: {text: 'Por {item} llegué a la reunión, pero ya habían empezado.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_fin}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Por {item} llegué a la reunión, pero ya habían empezado.', language_code: es, direction: ltr}
  feedback_frame: {text: 'Elena: I finally arrived at the meeting, but they had already started. fin means end.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson06.order.002
  lesson_content_key: es.b2.unit04.lesson06.contar_la_historia
  type: word_order
  frame: {text: 'Tuve una mañana {item}.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags: {semantic: w_horrible}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Tuve una mañana {item}.', language_code: es, direction: ltr}
  feedback_frame: {text: I had a horrible morning. Tuve (preterite of tener) frames the whole account -- a single completed morning being reported as a whole., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit04.lesson06.fill.003
  lesson_content_key: es.b2.unit04.lesson06.contar_la_historia
  type: fill_in_blank
