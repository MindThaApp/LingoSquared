    lesson_content_key: es.b1.unit39.lesson01.el_tren_sale
    type: word_order
    frame: {text: "El tren sale a las ocho {item}.", language_code: es, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "El tren sale a las ocho {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Mañana means tomorrow here.", language_code: en, direction: ltr}
