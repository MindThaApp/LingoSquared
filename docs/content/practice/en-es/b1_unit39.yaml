    lesson_content_key: es.b1.unit39.lesson03.probablemente_lloveremos
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p2, second: *p2, third: *p2, fourth: *p2, fifth: *p2, sixth: *p2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the vocabulary of the plans.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit39.lesson01.translate.001
    lesson_content_key: es.b1.unit39.lesson01.el_tren_sale
    type: translation
    frame: {text: "The train leaves at eight tomorrow.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "El tren {item} a las ocho mañana.", language_code: es, direction: ltr}, accepted_variants: ["Mañana el tren {item} a las ocho.", "El tren {item} mañana a las ocho."]}
    feedback_frame: {text: "A fixed schedule uses the present: sale.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit39.lesson01.fill.001
    lesson_content_key: es.b1.unit39.lesson01.el_tren_sale
    type: fill_in_blank
    frame: {text: "El {item} sale a las ocho mañana. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Tren is masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit39.lesson01.fill.002
    lesson_content_key: es.b1.unit39.lesson01.el_tren_sale
    type: fill_in_blank
    frame: {text: "El tren sale a las {item} mañana. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p5, hint: *p5}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Times take las: a las ocho.", language_code: en, direction: ltr}
