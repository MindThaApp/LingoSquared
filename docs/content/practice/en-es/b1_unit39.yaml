  p2: &p2 {language_code: es, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [w_tren, w_ocho, w_mañana, w_buscar, w_trabajo, w_nuevo, w_año, w_lloverá]}}
  p3: &p3 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_sale]}}
  p4: &p4 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_tren]}}
  p5: &p5 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_ocho]}}
  p6: &p6 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_mañana]}}
  p7: &p7 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_buscar]}}
  p8: &p8 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_voy]}}
  p9: &p9 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_trabajo]}}
  p10: &p10 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_nuevo]}}
  p11: &p11 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_año]}}
  p12: &p12 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_probablemente]}}
  p13: &p13 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_lloverá]}}
templates:
  - content_key: practice.en-es.es.b1.unit39.lesson01.choose.001
    lesson_content_key: es.b1.unit39.lesson01.el_tren_sale
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on future plans.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit39.lesson01.listen.001
    lesson_content_key: es.b1.unit39.lesson01.el_tren_sale
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on plans.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit39.lesson02.translate.001
    lesson_content_key: es.b1.unit39.lesson02.voy_a_buscar
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
