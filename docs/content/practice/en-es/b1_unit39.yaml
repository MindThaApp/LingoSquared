schema_version: "1.0"
pack_key: practice.en-es.b1.unit39
source_language: en
target_language: es
unit_content_key: es.b1.unit39.planes_futuros
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-es B1 set) from scripts/backfill_lexemes_en_es.py (en-es-b1 course; w_<token> anchors, one token per sentence slot). Future talk: present for schedules (el tren sale), ir a + infinitive for plans, future with probablemente. Variants move the time phrase. NATIVE FLAG: none.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_año, w_buscar, w_lloverá, w_mañana, w_nuevo, w_ocho, w_probablemente, w_sale, w_trabajo, w_tren, w_voy]
slot_presets:
