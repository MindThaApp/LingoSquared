schema_version: '1.0'
pack_key: practice.en-es.a1.unit45
source_language: en
target_language: es
unit_content_key: es.a1.unit45.money
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_a1_u45 / w_<token>). 14 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_amable, w_cambio, w_dividimos, w_efectivo, w_euros, w_paga, w_pagar, w_pago, w_pedimos, w_platos, w_puedo, w_separado, w_tarjeta, w_total]
templates:
- content_key: practice.en-es.es.a1.unit45.lesson01.choose.001
  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_total, w_euros, w_pagar, w_tarjeta, w_efectivo, w_puedo, w_pago, w_dividimos, w_separado, w_cambio, w_platos, w_pedimos, w_amable, w_paga]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on how much does it cost in total?.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson02.listen.001
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: listen_select
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on card or cash?.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson03.translate.001
  lesson_content_key: es.a1.unit45.lesson03.dividir_la_cuenta
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on splitting the bill.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson04.match.001
  lesson_content_key: es.a1.unit45.lesson04.el_cambio
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: es, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Spanish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson05.choose.001
  lesson_content_key: es.a1.unit45.lesson05.leer_un_ticket_de
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a restaurant receipt.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson06.translate.001
  lesson_content_key: es.a1.unit45.lesson06.elena_y_mateo_pagan
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on elena and mateo pay the bill.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson01.order.002
  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: word_order
  frame: {text: '¿Cuánto cuesta en {item}?', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_total}
  answer_derivation:
    kind: render_frame
    frame: {text: '¿Cuánto cuesta en {item}?', language_code: es, direction: ltr}
  feedback_frame: {text: 'How much does it cost in total? En total clarifies that you want the full combined price, not the price of one item.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson01.fill.003
  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: fill_in_blank
  frame:
    text: Cuesta veinticinco {item} en total. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_euros}
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_euros}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: It costs twenty-five euros in total. Cuesta is the third-person singular of costar (to cost); the stem vowel changes from o to ue when it is stressed., language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson02.order.002
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: word_order
  frame: {text: '¿Puedo {item} con tarjeta aquí?', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_pagar}
  answer_derivation:
    kind: render_frame
    frame: {text: '¿Puedo {item} con tarjeta aquí?', language_code: es, direction: ltr}
  feedback_frame: {text: 'Can I pay by card here? pagar means to pay.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson02.fill.003
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: fill_in_blank
  frame:
    text: ¿Quiere pagar en efectivo o con {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_tarjeta}
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_tarjeta}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Would you like to pay cash or by card? Quiere is the formal usted form of querer, used here by an unfamiliar cashier; with a friend you would say ¿quieres pagar...?', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson02.translate.004
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: translation
  frame: {text: I'm paying in cash., language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_efectivo}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Pago en {item}.', language_code: es, direction: ltr}
  feedback_frame: {text: I'm paying in cash. efectivo means cash., language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson03.order.002
  lesson_content_key: es.a1.unit45.lesson03.dividir_la_cuenta
  type: word_order
  frame: {text: '¿Puedo pagar por {item}?', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags: {semantic: w_separado}
  answer_derivation:
    kind: render_frame
    frame: {text: '¿Puedo pagar por {item}?', language_code: es, direction: ltr}
  feedback_frame: {text: 'May I pay separately? Por separado (separately) says how you pay; pagar (to pay) is the everyday verb for it.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson04.order.002
  lesson_content_key: es.a1.unit45.lesson04.el_cambio
  type: word_order
  frame: {text: 'Aquí tiene su {item}.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_cambio}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Aquí tiene su {item}.', language_code: es, direction: ltr}
  feedback_frame: {text: Here's your change. cambio means exchange; change., language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit45.lesson06.order.002
  lesson_content_key: es.a1.unit45.lesson06.elena_y_mateo_pagan
  type: word_order
  frame: {text: 'Mateo {item} la cuenta.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_paga}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Mateo {item} la cuenta.', language_code: es, direction: ltr}
  feedback_frame: {text: 'Mateo pays the bill. Paga is the third-person singular of pagar (to pay): Mateo paga la cuenta.', language_code: en, direction: ltr}
