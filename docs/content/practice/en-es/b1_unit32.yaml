schema_version: "1.0"
pack_key: practice.en-es.b1.unit32
source_language: en
target_language: es
unit_content_key: es.b1.unit32.condiciones
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-es B1 set) from scripts/backfill_lexemes_en_es.py (en-es-b1 course; w_<token> anchors, one token per sentence slot). Real conditions: si + present, then future or present. Variants accept the clause order reversed, una respuesta, ir a + infinitive, and the juntos position. NATIVE FLAG: voy a / vamos a ir a variants are accepted next to the simple future; confirm they fit the intended register.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_antes, w_cambiaremos, w_cinco, w_iremos, w_juntos, w_llamaremos, w_llega, w_llueve, w_plan, w_recibo, w_respuesta, w_revisaremos, w_tienes, w_trae]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [verb, noun, adverb], agreement_tags: {semantic: [w_llueve, w_plan, w_respuesta, w_juntos, w_antes, w_cinco, w_llega, w_trae]}}
  p2: &p2 {language_code: es, part_of_speech: [verb, noun, adverb], agreement_tags: {semantic: [w_llueve, w_plan, w_respuesta, w_juntos, w_antes, w_cinco, w_llega, w_trae, w_recibo]}}
  p3: &p3 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_llueve]}}
  p4: &p4 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_cambiaremos]}}
  p5: &p5 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_plan]}}
  p6: &p6 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_recibo]}}
  p7: &p7 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_respuesta]}}
  p8: &p8 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_tienes]}}
  p9: &p9 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_revisaremos]}}
  p10: &p10 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_juntos]}}
  p11: &p11 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_llega]}}
  p12: &p12 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_antes]}}
  p13: &p13 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_iremos]}}
  p14: &p14 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_cinco]}}
  p15: &p15 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_llamaremos]}}
  p16: &p16 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_trae]}}
templates:
  - content_key: practice.en-es.es.b1.unit32.lesson01.choose.001
    lesson_content_key: es.b1.unit32.lesson01.si_llueve
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on real conditions.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson01.listen.001
    lesson_content_key: es.b1.unit32.lesson01.si_llueve
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on conditions.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson04.translate.001
    lesson_content_key: es.b1.unit32.lesson04.mensaje_condicional
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson04.match.001
    lesson_content_key: es.b1.unit32.lesson04.mensaje_condicional
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the vocabulary of the conditional sentences.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson01.translate.001
    lesson_content_key: es.b1.unit32.lesson01.si_llueve
    type: translation
    frame: {text: "If it rains, we will change the plan.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Si {item}, cambiaremos el plan.", language_code: es, direction: ltr}, accepted_variants: ["Cambiaremos el plan si {item}."]}
    feedback_frame: {text: "Si is followed by the present: si llueve.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson01.fill.001
    lesson_content_key: es.b1.unit32.lesson01.si_llueve
    type: fill_in_blank
    frame: {text: "Si llueve, {item} el plan. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The result uses the future: cambiaremos.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson01.order.001
    lesson_content_key: es.b1.unit32.lesson01.si_llueve
    type: word_order
    frame: {text: "Si llueve, cambiaremos el {item}.", language_code: es, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Si llueve, cambiaremos el {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Plan is masculine: el plan.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson02.translate.001
    lesson_content_key: es.b1.unit32.lesson02.si_no_respuesta
    type: translation
    frame: {text: "If I do not receive a reply, I will call the office.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Si no {item} respuesta, llamaré a la oficina.", language_code: es, direction: ltr}, accepted_variants: ["Si no {item} una respuesta, llamaré a la oficina.", "Llamaré a la oficina si no {item} respuesta."]}
    feedback_frame: {text: "No goes before the verb: si no recibo.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson02.fill.001
    lesson_content_key: es.b1.unit32.lesson02.si_no_respuesta
    type: fill_in_blank
    frame: {text: "Si no recibo {item}, llamaré a la oficina. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Recibir una respuesta means to receive a reply.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson03.translate.001
    lesson_content_key: es.b1.unit32.lesson03.si_tienes_tiempo
    type: translation
    frame: {text: "If you have time, we will review the report together.", language_code: en, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "Si {item} tiempo, revisaremos el informe juntos.", language_code: es, direction: ltr}, accepted_variants: ["Si {item} tiempo, revisaremos juntos el informe.", "Revisaremos el informe juntos si {item} tiempo."]}
    feedback_frame: {text: "Tienes is the present for tú.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson03.fill.001
    lesson_content_key: es.b1.unit32.lesson03.si_tienes_tiempo
    type: fill_in_blank
    frame: {text: "Si tienes tiempo, {item} el informe juntos. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The result uses the future: revisaremos.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson03.order.001
    lesson_content_key: es.b1.unit32.lesson03.si_tienes_tiempo
    type: word_order
    frame: {text: "Si tienes tiempo, revisaremos el informe {item}.", language_code: es, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Si tienes tiempo, revisaremos el informe {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Juntos means together.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson04.translate.002
    lesson_content_key: es.b1.unit32.lesson04.mensaje_condicional
    type: translation
    frame: {text: "If Mateo arrives before five, we will go to the appointment.", language_code: en, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: render_frame, frame: {text: "Si Mateo {item} antes de las cinco, iremos a la cita.", language_code: es, direction: ltr}, accepted_variants: ["Si Mateo {item} antes de las cinco, vamos a ir a la cita."]}
    feedback_frame: {text: "Si Mateo llega uses the present for a real condition.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson04.fill.001
    lesson_content_key: es.b1.unit32.lesson04.mensaje_condicional
    type: fill_in_blank
    frame: {text: "Si Mateo llega {item} de las cinco, iremos a la cita. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p12, hint: *p12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Antes de means before.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson04.order.001
    lesson_content_key: es.b1.unit32.lesson04.mensaje_condicional
    type: word_order
    frame: {text: "Si Mateo llega antes de las cinco, {item} a la cita.", language_code: es, direction: ltr}
    slots: {item: *p13}
    answer_derivation: {kind: render_frame, frame: {text: "Si Mateo llega antes de las cinco, {item} a la cita.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Iremos is the future of ir for nosotros.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson04.order.002
    lesson_content_key: es.b1.unit32.lesson04.mensaje_condicional
    type: word_order
    frame: {text: "Si Mateo llega antes de las {item}, iremos a la cita.", language_code: es, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "Si Mateo llega antes de las {item}, iremos a la cita.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Times take las: las cinco.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson04.fill.002
    lesson_content_key: es.b1.unit32.lesson04.mensaje_condicional
    type: fill_in_blank
    frame: {text: "Si no trae el formulario, {item} a la oficina. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p15, hint: *p15}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The result uses the future: llamaremos.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson04.translate.003
    lesson_content_key: es.b1.unit32.lesson04.mensaje_condicional
    type: translation
    frame: {text: "If he does not bring the form, we will call the office.", language_code: en, direction: ltr}
    slots: {item: *p16}
    answer_derivation: {kind: render_frame, frame: {text: "Si no {item} el formulario, llamaremos a la oficina.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Trae is the present of traer for él.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit32.lesson04.choose.001
    lesson_content_key: es.b1.unit32.lesson04.mensaje_condicional
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
