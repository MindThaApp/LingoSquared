schema_version: "1.0"
pack_key: practice.en-es.a2.unit23
source_language: en
target_language: es
unit_content_key: es.a2.unit23.vida_digital
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-es A2 set) from scripts/backfill_lexemes_en_es.py lexemes (es_a2_uNN* tags, w_<token> anchors). Phone-habit vocabulary in the first person; nothing in the pack depends on which social network is meant. NATIVE FLAG: móvil is the Spain word; Latin America usually says celular.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_móvil, w_redes, w_noticias, w_mensajes, w_noche, w_veces, w_uso, w_miro, w_paso, w_demasiado, w_mucho, w_durante, w_usas, w_leer, w_escribir, w_útil, w_cansa]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_móvil, w_redes, w_noticias, w_mensajes, w_noche, w_veces]}}
  p2: &p2 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_uso]}}
  p3: &p3 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_móvil]}}
  p4: &p4 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_noche]}}
  p5: &p5 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_miro]}}
  p6: &p6 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_paso]}}
  p7: &p7 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_demasiado]}}
  p8: &p8 {language_code: es, part_of_speech: [adverb, preposition, verb], agreement_tags: {semantic: [w_paso, w_demasiado, w_mucho, w_durante, w_usas]}}
  p9: &p9 {language_code: es, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_leer, w_escribir, w_noticias, w_mensajes, w_útil, w_cansa]}}
  p10: &p10 {language_code: es, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_leer, w_escribir, w_útil, w_veces, w_cansa, w_usas]}}
  p11: &p11 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_leer]}}
  p12: &p12 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_noticias, w_mensajes, w_veces, w_móvil, w_redes, w_noche]}}
templates:
  - content_key: practice.en-es.es.a2.unit23.lesson01.choose.001
    lesson_content_key: es.a2.unit23.lesson01.uso_el_movil
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These nouns come from the reading about daily phone use.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit23.lesson01.fill.002
    lesson_content_key: es.a2.unit23.lesson01.uso_el_movil
    type: fill_in_blank
    frame: {text: "{item} el móvil todos los días. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Usar means to use; uso is the form for yo.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit23.lesson01.translate.003
    lesson_content_key: es.a2.unit23.lesson01.uso_el_movil
    type: translation
    frame: {text: "I use my phone every day.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Uso el {item} todos los días.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish uses the article el where English says my.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit23.lesson01.listen.004
    lesson_content_key: es.a2.unit23.lesson01.uso_el_movil
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard is a noun from the phone-habit reading.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit23.lesson02.translate.001
    lesson_content_key: es.a2.unit23.lesson02.redes_sociales
    type: translation
    frame: {text: "I look at social media at night.", language_code: en, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Miro las redes sociales por la {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Por la noche means at night; por la mañana means in the morning.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit23.lesson02.order.002
    lesson_content_key: es.a2.unit23.lesson02.redes_sociales
    type: word_order
    frame: {text: "Por la noche {item} las redes sociales.", language_code: es, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Por la noche {item} las redes sociales.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Mirar means to look at or watch; miro is the form for yo.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit23.lesson03.fill.001
    lesson_content_key: es.a2.unit23.lesson03.demasiado_tiempo
    type: fill_in_blank
    frame: {text: "Creo que {item} demasiado tiempo en línea. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pasar tiempo means to spend time; paso is the form for yo.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit23.lesson03.translate.002
    lesson_content_key: es.a2.unit23.lesson03.demasiado_tiempo
    type: translation
    frame: {text: "I think I spend too much time online.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Creo que paso {item} tiempo en línea.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Demasiado means too much; mucho only means a lot.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit23.lesson03.choose.003
    lesson_content_key: es.a2.unit23.lesson03.demasiado_tiempo
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Demasiado means too much; mucho only means a lot.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit23.lesson04.match.001
    lesson_content_key: es.a2.unit23.lesson04.mensaje_habito_opinion
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p9, second: *p9, third: *p9, fourth: *p9, fifth: *p9, sixth: *p9}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The reading and the dialogue talk about what the phone is used for.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit23.lesson04.choose.002
    lesson_content_key: es.a2.unit23.lesson04.mensaje_habito_opinion
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The dialogue weighs the good and bad sides of phone use.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit23.lesson04.order.003
    lesson_content_key: es.a2.unit23.lesson04.mensaje_habito_opinion
    type: word_order
    frame: {text: "Uso el móvil para {item} noticias.", language_code: es, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: render_frame, frame: {text: "Uso el móvil para {item} noticias.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Para plus an infinitive says what something is used for.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit23.lesson04.translate.004
    lesson_content_key: es.a2.unit23.lesson04.mensaje_habito_opinion
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These nouns come from the phone-habit reading.", language_code: en, direction: ltr}
