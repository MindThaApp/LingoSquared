schema_version: "1.0"
pack_key: practice.en-es.b1.unit26
source_language: en
target_language: es
unit_content_key: es.b1.unit26.habilidades
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-es B1 set) from scripts/backfill_lexemes_en_es.py (en-es-b1 course; w_<token> anchors, one token per sentence slot). Unit teaches puedo + que + clause and podria haber + participle. Sentence translations carry accepted_variants only where the alternative is plain everyday Spanish (trabajar de, subject pronoun, estar de acuerdo en). NATIVE FLAG: "trabaja de contable" is accepted next to "trabaja como contable"; confirm both are natural.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_cita, w_como, w_confirmar, w_contable, w_documento, w_estaba, w_explicado, w_explicar, w_haber, w_listo, w_martes, w_podría, w_profesora, w_puedo, w_también, w_tengo, w_trabaja, w_vive]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: [w_contable, w_cita, w_profesora, w_documento, w_martes, w_confirmar, w_explicar, w_listo, w_vive, w_trabaja, w_puedo, w_tengo, w_también]}}
  p2: &p2 {language_code: es, part_of_speech: [noun, verb, adverb], agreement_tags: {semantic: [w_contable, w_cita, w_profesora, w_documento, w_martes, w_confirmar, w_explicar, w_trabaja, w_vive, w_puedo, w_tengo, w_también]}}
  p3: &p3 {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: [w_contable, w_cita, w_profesora, w_documento, w_martes, w_confirmar, w_explicar, w_listo, w_explicado, w_vive, w_trabaja, w_puedo, w_tengo, w_también, w_podría]}}
  p4: &p4 {language_code: es, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_contable, w_cita, w_documento, w_martes, w_confirmar, w_explicar, w_profesora]}}
  p5: &p5 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_contable]}}
  p6: &p6 {language_code: es, part_of_speech: [preposition], agreement_tags: {semantic: [w_como]}}
  p7: &p7 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_profesora]}}
  p8: &p8 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_cita]}}
  p9: &p9 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_confirmar]}}
  p10: &p10 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_documento]}}
  p11: &p11 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_listo]}}
  p12: &p12 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_explicado]}}
  p13: &p13 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_haber]}}
  p14: &p14 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_estaba]}}
  p15: &p15 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_martes]}}
  p16: &p16 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_también]}}
templates:
  - content_key: practice.en-es.es.b1.unit26.lesson01.choose.001
    lesson_content_key: es.b1.unit26.lesson01.recordatorio_personas
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from Elena and Mateo's appointment messages.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson02.listen.001
    lesson_content_key: es.b1.unit26.lesson02.puedo_confirmar_que
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the appointment messages.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson02.translate.001
    lesson_content_key: es.b1.unit26.lesson02.puedo_confirmar_que
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson02.match.001
    lesson_content_key: es.b1.unit26.lesson02.puedo_confirmar_que
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p4, second: *p4, third: *p4, fourth: *p4, fifth: *p4, sixth: *p4}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Job and appointment words from the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson01.translate.001
    lesson_content_key: es.b1.unit26.lesson01.recordatorio_personas
    type: translation
    frame: {text: "Mateo works as an accountant.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo trabaja como {item}.", language_code: es, direction: ltr}, accepted_variants: ["Mateo trabaja de {item}."]}
    feedback_frame: {text: "Spanish says trabaja como contable for a job, with no article.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson01.fill.001
    lesson_content_key: es.b1.unit26.lesson01.recordatorio_personas
    type: fill_in_blank
    frame: {text: "Mateo trabaja {item} contable. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Como introduces the role someone works in.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson01.order.001
    lesson_content_key: es.b1.unit26.lesson01.recordatorio_personas
    type: word_order
    frame: {text: "Elena es {item} y vive en Londres.", language_code: es, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Elena es {item} y vive en Londres.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish marks the feminine: profesora, not profesor.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson02.translate.002
    lesson_content_key: es.b1.unit26.lesson02.puedo_confirmar_que
    type: translation
    frame: {text: "I can confirm that I have an appointment.", language_code: en, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "Puedo confirmar que tengo una {item}.", language_code: es, direction: ltr}, accepted_variants: ["Puedo confirmar que yo tengo una {item}."]}
    feedback_frame: {text: "Que links the two clauses, as English that does.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson02.fill.001
    lesson_content_key: es.b1.unit26.lesson02.puedo_confirmar_que
    type: fill_in_blank
    frame: {text: "Puedo {item} que tengo una cita. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Puedo is followed by the infinitive: puedo confirmar.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson02.order.001
    lesson_content_key: es.b1.unit26.lesson02.puedo_confirmar_que
    type: word_order
    frame: {text: "El {item} está listo.", language_code: es, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "El {item} está listo.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Documento is masculine, so it takes el.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson02.fill.002
    lesson_content_key: es.b1.unit26.lesson02.puedo_confirmar_que
    type: fill_in_blank
    frame: {text: "El documento está {item}. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Listo describes the state of the document: está listo.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson03.translate.001
    lesson_content_key: es.b1.unit26.lesson03.podria_haber_explicado
    type: translation
    frame: {text: "I could have explained that the document was ready.", language_code: en, direction: ltr}
    slots: {item: *p12}
    answer_derivation: {kind: render_frame, frame: {text: "Podría haber {item} que el documento estaba listo.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Podría haber plus a participle says what you could have done.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson03.fill.001
    lesson_content_key: es.b1.unit26.lesson03.podria_haber_explicado
    type: fill_in_blank
    frame: {text: "Podría {item} explicado que el documento estaba listo. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p13, hint: *p13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The participle explicado always follows haber.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson03.order.001
    lesson_content_key: es.b1.unit26.lesson03.podria_haber_explicado
    type: word_order
    frame: {text: "Podría haber explicado que el documento {item} listo.", language_code: es, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "Podría haber explicado que el documento {item} listo.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Estaba describes a state in the past.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson04.translate.001
    lesson_content_key: es.b1.unit26.lesson04.mensaje_habilidad
    type: translation
    frame: {text: "I can confirm that I have an appointment on Tuesday.", language_code: en, direction: ltr}
    slots: {item: *p15}
    answer_derivation: {kind: render_frame, frame: {text: "Puedo confirmar que tengo una cita el {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Days of the week take el and are not capitalised.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson04.order.001
    lesson_content_key: es.b1.unit26.lesson04.mensaje_habilidad
    type: word_order
    frame: {text: "También puedo explicar que Mateo trabaja como {item}.", language_code: es, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "También puedo explicar que Mateo trabaja como {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "A job after como takes no article.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson04.fill.001
    lesson_content_key: es.b1.unit26.lesson04.mensaje_habilidad
    type: fill_in_blank
    frame: {text: "{item} puedo explicar que Mateo trabaja como contable. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p16, hint: *p16}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "También means also and often opens the sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit26.lesson04.choose.001
    lesson_content_key: es.b1.unit26.lesson04.mensaje_habilidad
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
