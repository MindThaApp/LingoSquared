- content_key: practice.en-es.es.c1.unit03.lesson01.fill.004
  lesson_content_key: es.c1.unit03.lesson01.los_registros
  type: fill_in_blank
  frame:
    text: Con un desconocido, el trato es {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags: {semantic: w_formal}
