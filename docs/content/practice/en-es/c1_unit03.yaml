      language_code: es
      part_of_speech: adjective
      agreement_tags: {semantic: w_formal}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'With a stranger, the address is formal. formal means formal.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.c1.unit03.lesson01.translate.005
  lesson_content_key: es.c1.unit03.lesson01.los_registros
  type: translation
  frame: {text: 'With friends, the address is informal.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags: {semantic: w_informal}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Con los amigos, el trato es {item}.', language_code: es, direction: ltr}
  feedback_frame: {text: 'With friends, the address is informal. informal means informal.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.c1.unit03.lesson02.order.002
  lesson_content_key: es.c1.unit03.lesson02.el_registro_formal
  type: word_order
  frame: {text: '¿Cómo está usted, {item} García?', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_señor}
  answer_derivation:
    kind: render_frame
    frame: {text: '¿Cómo está usted, {item} García?', language_code: es, direction: ltr}
  feedback_frame: {text: 'How are you, Mr García? señor means Mr.; sir.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.c1.unit03.lesson02.fill.003
  lesson_content_key: es.c1.unit03.lesson02.el_registro_formal
  type: fill_in_blank
  frame:
    text: Le {item} para informarle de la avería. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_escribo}
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_escribo}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I am writing to inform you of the fault. escribo means I write., language_code: en, direction: ltr}
- content_key: practice.en-es.es.c1.unit03.lesson02.translate.004
  lesson_content_key: es.c1.unit03.lesson02.el_registro_formal
  type: translation
  frame: {text: 'Elena: I would be grateful if you could fix the fault as soon as possible.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_avería}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Le agradecería que solucionara la {item} lo antes posible.', language_code: es, direction: ltr}
  feedback_frame: {text: 'Elena: I would be grateful if you could fix the fault as soon as possible. Elena''s formal register, spoken as if to the landlord: le agradecería + subjunctive.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.c1.unit03.lesson03.order.002
  lesson_content_key: es.c1.unit03.lesson03.el_registro_diplomatico
  type: word_order
  frame: {text: 'Entiendo que esté muy ocupado, pero {item} podría darnos una fecha.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: adverb
      agreement_tags: {semantic: w_quizá}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Entiendo que esté muy ocupado, pero {item} podría darnos una fecha.', language_code: es, direction: ltr}
  feedback_frame: {text: 'Elena: I understand that you are very busy, but perhaps you could give us a date. Elena''s diplomatic register: entiendo que + quizá podría.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.c1.unit03.lesson03.fill.003
  lesson_content_key: es.c1.unit03.lesson03.el_registro_diplomatico
  type: fill_in_blank
  frame:
    text: Quizá no ha {item} nuestro mensaje. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_recibido}
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_recibido}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Perhaps you have not received our message. recibido means received (past participle)., language_code: en, direction: ltr}
- content_key: practice.en-es.es.c1.unit03.lesson03.translate.004
  lesson_content_key: es.c1.unit03.lesson03.el_registro_diplomatico
  type: translation
  frame: {text: 'Could you, with all due respect, give us a date?', language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_respeto}
  answer_derivation:
    kind: render_frame
    frame: {text: '¿Podría, con todo {item}, darnos una fecha?', language_code: es, direction: ltr}
  feedback_frame: {text: 'Could you, with all due respect, give us a date? ¿Podría...? makes a request without imposing -- the polite conditional form of poder.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.c1.unit03.lesson04.order.002
  lesson_content_key: es.c1.unit03.lesson04.el_registro_expresivo
  type: word_order
  frame: {text: '¡Ya es {item}!', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags: {semantic: w_suficiente}
  answer_derivation:
    kind: render_frame
    frame: {text: '¡Ya es {item}!', language_code: es, direction: ltr}
  feedback_frame: {text: 'that''s enough ¡Ya es suficiente! is emphatic: the speaker has run out of patience.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.c1.unit03.lesson04.fill.003
  lesson_content_key: es.c1.unit03.lesson04.el_registro_expresivo
  type: fill_in_blank
  frame:
    text: Exigimos una {item} inmediata. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_solución}
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_solución}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'We demand an immediate solution. Exigimos is the firmest emphatic form -- a demand, not a request.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.c1.unit03.lesson04.translate.004
  lesson_content_key: es.c1.unit03.lesson04.el_registro_expresivo
  type: translation
  frame: {text: By no means are we going to accept it., language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags: {semantic: w_ninguna}
  answer_derivation:
    kind: render_frame
    frame: {text: 'De {item} manera vamos a aceptarlo.', language_code: es, direction: ltr}
  feedback_frame: {text: By no means are we going to accept it. De ninguna manera is an emphatic absolute refusal., language_code: en, direction: ltr}
- content_key: practice.en-es.es.c1.unit03.lesson05.order.002
  lesson_content_key: es.c1.unit03.lesson05.leer_el_tono
  type: word_order
  frame: {text: 'Para el {item}, lo apropiado es un registro formal.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_propietario}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Para el {item}, lo apropiado es un registro formal.', language_code: es, direction: ltr}
  feedback_frame: {text: 'For the landlord, the appropriate thing is a formal register. propietario means landlord; owner.', language_code: en, direction: ltr}
