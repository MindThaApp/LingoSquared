    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_público}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Each text has a different audience. público means audience., language_code: en, direction: ltr}
