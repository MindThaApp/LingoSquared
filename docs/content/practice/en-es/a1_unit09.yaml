schema_version: "1.0"
pack_key: practice.en-es.a1.unit09
source_language: en
target_language: es
unit_content_key: es.a1.unit09.directions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-es reference set) from
    scripts/backfill_lexemes_en_es.py lexemes (es_a1_u09* tags, w_<token>
    anchors). dobla and gira are both glossed "turn (command)", so the
    bare-word production pool is a curated w_ list without them (an English
    "turn" prompt would have two right answers). No "Turn left." translation
    for the same reason.
    Opus pass 2026-10-24: Gira a la derecha/izquierda en la calle (unnatural) became en la esquina; dobla and gira glosses now differ (literal fold/spin) so the two turn commands are never interchangeable answers. NATIVE FLAG: peninsular Spanish prefers sigue recto / todo recto to sigue derecho.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [es_a1_u09, w_calle, w_esquina, w_derecha, w_izquierda, w_derecho, w_llego, w_fácil, w_pierdas, w_llegar, w_desde, w_nada, w_sigue, w_cruza]
slot_presets:
  content: &content {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: es_a1_u09}}
  production: &production {language_code: es, part_of_speech: [noun, verb, adjective, adverb, preposition, pronoun], agreement_tags: {semantic: [w_calle, w_esquina, w_derecho, w_izquierda, w_derecha, w_fácil, w_llegar, w_desde, w_nada, w_sigue, w_cruza]}}
  calle: &calle {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_calle}}
  esquina: &esquina {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_esquina}}
  side: &side {language_code: es, part_of_speech: noun, agreement_tags: {semantic: [w_derecha, w_izquierda]}}
  derecho: &derecho {language_code: es, part_of_speech: adverb, agreement_tags: {semantic: w_derecho}}
  llego: &llego {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_llego}}
  facil: &facil {language_code: es, part_of_speech: adjective, agreement_tags: {semantic: w_fácil}}
  pierdas: &pierdas {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_pierdas}}
  nada: &nada {language_code: es, part_of_speech: pronoun, agreement_tags: {semantic: w_nada}}
templates:
  - content_key: practice.en-es.es.a1.unit09.lesson01.order.001
    lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
    type: word_order
    frame: {text: "Cruza la {item}.", language_code: es, direction: ltr}
    slots: {item: *calle}
    answer_derivation: {kind: render_frame, frame: {text: "Cruza la {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Cross the street. Cruza is the tú command of cruzar.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit09.lesson01.fill.002
    lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
    type: fill_in_blank
    frame: {text: "Dobla a la izquierda en la {item}. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *esquina, hint: *esquina}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "En la esquina means at the corner; Spanish uses en where English uses at.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit09.lesson02.choose.001
    lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *content}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Doblar and girar both mean to turn; dobla and gira are their tú commands.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit09.lesson02.order.002
    lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
    type: word_order
    frame: {text: "Gira a la {item} en la esquina.", language_code: es, direction: ltr}
    slots: {item: *side}
    answer_derivation: {kind: render_frame, frame: {text: "Gira a la {item} en la esquina.", language_code: es, direction: ltr}}
    feedback_frame: {text: "A la izquierda is to the left and a la derecha to the right; derecho alone means straight ahead.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit09.lesson02.translate.003
    lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
    type: translation
    frame: {text: "Go straight ahead. (informal command)", language_code: en, direction: ltr}
    slots: {item: *derecho}
    answer_derivation: {kind: render_frame, frame: {text: "Sigue {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Sigue comes from seguir, to keep going; derecho, straight ahead, is not derecha, right.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit09.lesson03.order.001
    lesson_content_key: es.a1.unit09.lesson03.como_llego_a
    type: word_order
    frame: {text: "¿Cómo {item} a la biblioteca?", language_code: es, direction: ltr}
    slots: {item: *llego}
    answer_derivation: {kind: render_frame, frame: {text: "¿Cómo {item} a la biblioteca?", language_code: es, direction: ltr}}
    feedback_frame: {text: "How do I get to the library? With a masculine place, a + el becomes al: ¿Cómo llego al parque?", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit09.lesson03.fill.002
    lesson_content_key: es.a1.unit09.lesson03.como_llego_a
    type: fill_in_blank
    frame: {text: "Es muy {item}: sigue derecho. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *facil, hint: *facil}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Fácil has the same form for masculine and feminine nouns.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit09.lesson04.translate.001
    lesson_content_key: es.a1.unit09.lesson04.confirmar_direcciones
    type: translation
    frame: {text: "Don't get lost! (informal)", language_code: en, direction: ltr}
    slots: {item: *pierdas}
    answer_derivation: {kind: render_frame, frame: {text: "¡No te {item}!", language_code: es, direction: ltr}}
    feedback_frame: {text: "Negative commands use a different verb form: pierdas, not pierdes.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit09.lesson05.match.001
    lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *content, second: *content, third: *content, fourth: *content, fifth: *content, sixth: *content}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Directions in Spanish are usually given with tú commands: sigue, dobla, cruza.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit09.lesson05.translate.002
    lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *production}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Desde el mercado means from the market, the starting point of the route.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit09.lesson06.listen.001
    lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *content}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mateo repeats the route in the yo form, sigo and doblo, to check he has it right.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit09.lesson06.translate.002
    lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
    type: translation
    frame: {text: "You're welcome.", language_code: en, direction: ltr}
    slots: {item: *nada}
    answer_derivation: {kind: render_frame, frame: {text: "De {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "De nada literally means of nothing; it is the standard reply to gracias.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit09.lesson01.listen.003
    lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *production}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Derecha (right) and derecho (straight ahead) differ only in the last vowel; listen for it.", language_code: en, direction: ltr}
