schema_version: "1.0"
pack_key: practice.en-es.b1.unit34
source_language: en
target_language: es
unit_content_key: es.b1.unit34.estilo_indirecto
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-es B1 set) from scripts/backfill_lexemes_en_es.py (en-es-b1 course; w_<token> anchors, one token per sentence slot). Reported speech: dice que / pregunta si / dijo que. Only four lexemes are new in this unit (dice, pregunta, llave, llegó), so every sentence template is anchored on one of the four; no matching template (only four lexemes). Variants: the optional indirect pronoun me. NATIVE FLAG: none.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_dice, w_llave, w_llega, w_llegó, w_pregunta, w_trae]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_dice, w_pregunta, w_llave, w_llegó, w_llega, w_trae]}}
  p2: &p2 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_dice]}}
  p3: &p3 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_pregunta]}}
  p4: &p4 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_llave]}}
  p5: &p5 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_llegó]}}
templates:
  - content_key: practice.en-es.es.b1.unit34.lesson01.choose.001
    lesson_content_key: es.b1.unit34.lesson01.dice_que
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the messages Mateo and Elena send.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson02.listen.001
    lesson_content_key: es.b1.unit34.lesson02.pregunta_si
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the reported messages.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson03.translate.001
    lesson_content_key: es.b1.unit34.lesson03.dijo_que
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson01.translate.001
    lesson_content_key: es.b1.unit34.lesson01.dice_que
    type: translation
    frame: {text: "Mateo says he is arriving late.", language_code: en, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo {item} que llega tarde.", language_code: es, direction: ltr}, accepted_variants: ["Mateo me {item} que llega tarde."]}
    feedback_frame: {text: "Decir que reports what someone says.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson01.fill.001
    lesson_content_key: es.b1.unit34.lesson01.dice_que
    type: fill_in_blank
    frame: {text: "Mateo {item} que llega tarde. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Dice is the present of decir for él.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson01.order.001
    lesson_content_key: es.b1.unit34.lesson01.dice_que
    type: word_order
    frame: {text: "Mateo me {item} que llega tarde.", language_code: es, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo me {item} que llega tarde.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Decir que reports what someone says.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson02.translate.001
    lesson_content_key: es.b1.unit34.lesson02.pregunta_si
    type: translation
    frame: {text: "Elena asks whether I have the key.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Elena {item} si tengo la llave.", language_code: es, direction: ltr}, accepted_variants: ["Elena me {item} si tengo la llave."]}
    feedback_frame: {text: "Preguntar si reports a yes-or-no question.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson02.fill.001
    lesson_content_key: es.b1.unit34.lesson02.pregunta_si
    type: fill_in_blank
    frame: {text: "Elena {item} si tengo la llave. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Si means whether in a reported question.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson02.order.001
    lesson_content_key: es.b1.unit34.lesson02.pregunta_si
    type: word_order
    frame: {text: "Elena me {item} si tengo la llave.", language_code: es, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Elena me {item} si tengo la llave.", language_code: es, direction: ltr}}
    feedback_frame: {text: "The pronoun me goes before the verb.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson02.translate.002
    lesson_content_key: es.b1.unit34.lesson02.pregunta_si
    type: translation
    frame: {text: "Elena asks whether I have the key.", language_code: en, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Elena pregunta si tengo la {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Llave is feminine: la llave.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson02.fill.002
    lesson_content_key: es.b1.unit34.lesson02.pregunta_si
    type: fill_in_blank
    frame: {text: "¿Tienes la {item}? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Llave is feminine: la llave.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson02.order.002
    lesson_content_key: es.b1.unit34.lesson02.pregunta_si
    type: word_order
    frame: {text: "Elena pregunta si tengo la {item}.", language_code: es, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Elena pregunta si tengo la {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Llave is feminine: la llave.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson03.translate.002
    lesson_content_key: es.b1.unit34.lesson03.dijo_que
    type: translation
    frame: {text: "Elena said that she arrived late to the meeting.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Elena dijo que {item} tarde a la reunión.", language_code: es, direction: ltr}, accepted_variants: ["Elena dijo que {item} a la reunión tarde."]}
    feedback_frame: {text: "After dijo que the past event uses the preterite: llegó.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson03.fill.001
    lesson_content_key: es.b1.unit34.lesson03.dijo_que
    type: fill_in_blank
    frame: {text: "Elena dijo que {item} tarde a la reunión. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p5, hint: *p5}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Llegó is the preterite of llegar, he or she did.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson03.order.001
    lesson_content_key: es.b1.unit34.lesson03.dijo_que
    type: word_order
    frame: {text: "Elena dijo que {item} tarde.", language_code: es, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Elena dijo que {item} tarde.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Llegar tarde means to arrive late.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson04.translate.001
    lesson_content_key: es.b1.unit34.lesson04.mensaje_de_mateo
    type: translation
    frame: {text: "Mateo asks whether I have the key.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo {item} si tengo la llave.", language_code: es, direction: ltr}}
    feedback_frame: {text: "The direct question ¿Tienes la llave? becomes si tengo la llave.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson04.fill.001
    lesson_content_key: es.b1.unit34.lesson04.mensaje_de_mateo
    type: fill_in_blank
    frame: {text: "Mateo pregunta si tengo la {item}. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Llave is feminine: la llave.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit34.lesson04.choose.001
    lesson_content_key: es.b1.unit34.lesson04.mensaje_de_mateo
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
