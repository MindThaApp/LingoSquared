    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_cambiar}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I want to reschedule the meeting. cambiar means to change., language_code: en, direction: ltr}
