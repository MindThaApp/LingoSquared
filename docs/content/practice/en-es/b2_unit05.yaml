- content_key: practice.en-es.es.b2.unit05.lesson05.order.002
  lesson_content_key: es.b2.unit05.lesson05.dos_mensajes
  type: word_order
  frame: {text: '¿Le {item} la próxima semana?', language_code: es, direction: ltr}
