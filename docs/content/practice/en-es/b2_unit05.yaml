    frame: {text: '¿Le {item} la próxima semana?', language_code: es, direction: ltr}
  feedback_frame: {text: 'Does next week suit you? conviene means is advisable; suits.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson06.order.002
