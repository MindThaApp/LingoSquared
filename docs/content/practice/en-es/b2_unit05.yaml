schema_version: '1.0'
pack_key: practice.en-es.b2.unit05
source_language: en
target_language: es
unit_content_key: es.b2.unit05.registro
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_b2_u5 / w_<token>). 41 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_abrazo, w_amable, w_atentamente, w_ayudar, w_ayudarme, w_ayuntamiento, w_cambiar, w_convenir, w_conviene, w_corresponda, w_cuándo, w_escribe, w_escribes, w_escribir, w_escribirle, w_escribo, w_favor, w_formal, w_hacerlo, w_hazlo, w_lamentablemente, w_lunes, w_manera, w_mensaje, w_momento, w_otra, w_podemos, w_poder, w_podría, w_problema, w_próxima, w_puedes, w_puedo, w_querido, w_quiero, w_saluda, w_saludar, w_semana, w_sería, w_tener, w_tengo]
templates:
- content_key: practice.en-es.es.b2.unit05.lesson01.choose.001
  lesson_content_key: es.b2.unit05.lesson01.tu_o_usted
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_escribe, w_escribir, w_mensaje, w_escribo, w_tener, w_momento, w_puedes, w_poder, w_ayudarme, w_ayudar, w_abrazo, w_corresponda, w_atentamente, w_saluda, w_saludar, w_querido, w_hazlo, w_favor, w_podría, w_sería, w_amable, w_hacerlo, w_tengo, w_cambiar, w_quiero, w_lunes, w_puedo, w_lamentablemente, w_próxima, w_semana, w_podemos, w_conviene, w_convenir, w_problema, w_cuándo, w_ayuntamiento, w_escribirle, w_formal, w_otra, w_manera, w_escribes]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on you or usted?.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson02.listen.001
  lesson_content_key: es.b2.unit05.lesson02.saludos_despedidas
  type: listen_select
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on salutations and closings.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson03.translate.001
  lesson_content_key: es.b2.unit05.lesson03.directo_o_cortes
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on direct or polite?.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson04.match.001
  lesson_content_key: es.b2.unit05.lesson04.cambiar_la_cita
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: es, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Spanish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson05.choose.001
  lesson_content_key: es.b2.unit05.lesson05.dos_mensajes
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on two messages, two readers.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson06.translate.001
  lesson_content_key: es.b2.unit05.lesson06.elegir_el_registro
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on choosing the right register.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson01.order.002
  lesson_content_key: es.b2.unit05.lesson01.tu_o_usted
  type: word_order
  frame: {text: 'Elena {item} un mensaje.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_escribe}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Elena {item} un mensaje.', language_code: es, direction: ltr}
  feedback_frame: {text: 'Elena is writing a message. The situation this whole unit works with: Elena has to send the same request to two very different readers. Un mensaje = ''a message''.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson01.fill.003
  lesson_content_key: es.b2.unit05.lesson01.tu_o_usted
  type: fill_in_blank
  frame:
    text: Yo te escribo un {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_mensaje}
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_mensaje}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: I'm writing you a message. mensaje means message; text message., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson01.translate.004
  lesson_content_key: es.b2.unit05.lesson01.tu_o_usted
  type: translation
  frame: {text: I'm writing you a message., language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_escribo}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Yo le {item} un mensaje.', language_code: es, direction: ltr}
  feedback_frame: {text: I'm writing you a message. escribo means I write., language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson02.order.002
  lesson_content_key: es.b2.unit05.lesson02.saludos_despedidas
  type: word_order
  frame: {text: 'Un {item}, Elena.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_abrazo}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Un {item}, Elena.', language_code: es, direction: ltr}
  feedback_frame: {text: 'A hug, Elena. abrazo means hug.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson02.fill.003
  lesson_content_key: es.b2.unit05.lesson02.saludos_despedidas
  type: fill_in_blank
  frame:
    text: Le saluda {item}, Elena García. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: adverb
      agreement_tags: {semantic: w_atentamente}
    hint:
      language_code: es
      part_of_speech: adverb
      agreement_tags: {semantic: w_atentamente}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Yours faithfully, Elena García. atentamente means sincerely (formal closing).', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson03.order.002
  lesson_content_key: es.b2.unit05.lesson03.directo_o_cortes
  type: word_order
  frame: {text: 'Hazlo, por {item}.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_favor}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Hazlo, por {item}.', language_code: es, direction: ltr}
  feedback_frame: {text: 'Do it, please. favor means favour; kindness (in the phrase for please).', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson03.fill.003
  lesson_content_key: es.b2.unit05.lesson03.directo_o_cortes
  type: fill_in_blank
  frame:
    text: ¿Sería tan {item} de hacerlo? ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags: {semantic: w_amable}
    hint:
      language_code: es
      part_of_speech: adjective
      agreement_tags: {semantic: w_amable}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Would you be so kind as to do it? The very polite formal frame: ¿Sería usted tan amable de hacerlo? (''would you be so kind as to do it?''). Reserved for formal requests to an institution. Tan amable = ''so kind''.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit05.lesson04.order.002
