schema_version: "1.0"
pack_key: practice.en-es.b1.unit31
source_language: en
target_language: es
unit_content_key: es.b1.unit31.relato
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-es B1 set) from scripts/backfill_lexemes_en_es.py (en-es-b1 course; w_<token> anchors, one token per sentence slot). Telling a story in the past: preterite for the events (llegué, llamó, entregué), imperfect for the background (preparaba, estaba esperando). Variants accept luego for despues, the subject pronoun, and the clause order swapped. NATIVE FLAG: none.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_después, w_dijo, w_entregué, w_esperando, w_llamó, w_llegué, w_mientras, w_preparaba, w_primero]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [adverb, verb], agreement_tags: {semantic: [w_primero, w_llegué, w_preparaba, w_llamó, w_dijo, w_esperando, w_después, w_entregué]}}
  p2: &p2 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_llegué]}}
  p3: &p3 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_primero]}}
  p4: &p4 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_preparaba]}}
  p5: &p5 {language_code: es, part_of_speech: [particle], agreement_tags: {semantic: [w_mientras]}}
  p6: &p6 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_llamó]}}
  p7: &p7 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_dijo]}}
  p8: &p8 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_esperando]}}
  p9: &p9 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_entregué]}}
  p10: &p10 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_después]}}
templates:
  - content_key: practice.en-es.es.b1.unit31.lesson01.choose.001
    lesson_content_key: es.b1.unit31.lesson01.primero_llegue
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the story of Mateo's morning.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson01.listen.001
    lesson_content_key: es.b1.unit31.lesson01.primero_llegue
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the story.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson04.translate.001
    lesson_content_key: es.b1.unit31.lesson04.relato_completo
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the story.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson04.match.001
    lesson_content_key: es.b1.unit31.lesson04.relato_completo
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the storytelling vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson01.translate.001
    lesson_content_key: es.b1.unit31.lesson01.primero_llegue
    type: translation
    frame: {text: "First I arrived at the office.", language_code: en, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: render_frame, frame: {text: "Primero {item} a la oficina.", language_code: es, direction: ltr}, accepted_variants: ["Primero yo {item} a la oficina."]}
    feedback_frame: {text: "The preterite llegué reports a finished event.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson01.fill.001
    lesson_content_key: es.b1.unit31.lesson01.primero_llegue
    type: fill_in_blank
    frame: {text: "{item} llegué a la oficina. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Primero starts the sequence.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson02.translate.001
    lesson_content_key: es.b1.unit31.lesson02.mientras_preparaba
    type: translation
    frame: {text: "While I was preparing the document, Elena called.", language_code: en, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Mientras {item} el documento, Elena llamó.", language_code: es, direction: ltr}, accepted_variants: ["Elena llamó mientras {item} el documento."]}
    feedback_frame: {text: "The imperfect preparaba sets the background; llamó is the event that interrupts.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson02.fill.001
    lesson_content_key: es.b1.unit31.lesson02.mientras_preparaba
    type: fill_in_blank
    frame: {text: "{item} preparaba el documento, Elena llamó. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p5, hint: *p5}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mientras means while.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson02.order.001
    lesson_content_key: es.b1.unit31.lesson02.mientras_preparaba
    type: word_order
    frame: {text: "Mientras preparaba el documento, Elena {item}.", language_code: es, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Mientras preparaba el documento, Elena {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Llamó is the preterite of llamar, he or she did.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson03.translate.001
    lesson_content_key: es.b1.unit31.lesson03.dijo_que
    type: translation
    frame: {text: "Elena said that Mateo was waiting.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Elena {item} que Mateo estaba esperando.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Dijo is the preterite of decir.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson03.fill.001
    lesson_content_key: es.b1.unit31.lesson03.dijo_que
    type: fill_in_blank
    frame: {text: "Elena dijo que Mateo estaba {item}. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Estaba plus a gerund describes an action in progress.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson03.order.001
    lesson_content_key: es.b1.unit31.lesson03.dijo_que
    type: word_order
    frame: {text: "Elena {item} que Mateo estaba esperando.", language_code: es, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Elena {item} que Mateo estaba esperando.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Dijo is the preterite of decir, he or she did.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson04.translate.002
    lesson_content_key: es.b1.unit31.lesson04.relato_completo
    type: translation
    frame: {text: "Afterwards I handed in the form.", language_code: en, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Después {item} el formulario.", language_code: es, direction: ltr}, accepted_variants: ["Luego {item} el formulario.", "Después yo {item} el formulario."]}
    feedback_frame: {text: "Entregué is the preterite for yo.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson04.fill.001
    lesson_content_key: es.b1.unit31.lesson04.relato_completo
    type: fill_in_blank
    frame: {text: "{item} entregué el formulario. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p10, hint: *p10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Después means afterwards.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson04.order.001
    lesson_content_key: es.b1.unit31.lesson04.relato_completo
    type: word_order
    frame: {text: "Después {item} el formulario.", language_code: es, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Después {item} el formulario.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Entregué is the preterite of entregar for yo.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit31.lesson04.choose.001
    lesson_content_key: es.b1.unit31.lesson04.relato_completo
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
