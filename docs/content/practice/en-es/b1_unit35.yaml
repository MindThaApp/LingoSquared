schema_version: "1.0"
pack_key: practice.en-es.b1.unit35
source_language: en
target_language: es
unit_content_key: es.b1.unit35.propositos
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-es B1 set) from scripts/backfill_lexemes_en_es.py (en-es-b1 course; w_<token> anchors, one token per sentence slot). Purpose with para + infinitive. Variants accept a subject pronoun. NATIVE FLAG: ahorro is glossed as I save (money); the noun ahorro (saving) does not appear in the unit.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_España, w_ahorrar, w_ahorro, w_casa, w_comprar, w_dinero, w_español, w_estudio, w_horas, w_muchas, w_para, w_trabajar]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_español, w_dinero, w_casa, w_horas, w_estudio, w_ahorro, w_comprar, w_ahorrar, w_trabajar]}}
  p2: &p2 {language_code: es, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_español, w_dinero, w_casa, w_horas, w_comprar, w_ahorrar, w_trabajar, w_estudio]}}
  p3: &p3 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_estudio]}}
  p4: &p4 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_español]}}
  p5: &p5 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_trabajar]}}
  p6: &p6 {language_code: es, part_of_speech: [proper_noun], agreement_tags: {semantic: [w_España]}}
  p7: &p7 {language_code: es, part_of_speech: [preposition], agreement_tags: {semantic: [w_para]}}
  p8: &p8 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_ahorro]}}
  p9: &p9 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_dinero]}}
  p10: &p10 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_comprar]}}
  p11: &p11 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_casa]}}
  p12: &p12 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_muchas]}}
  p13: &p13 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_horas]}}
  p14: &p14 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_ahorrar]}}
templates:
  - content_key: practice.en-es.es.b1.unit35.lesson01.choose.001
    lesson_content_key: es.b1.unit35.lesson01.para_trabajar
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on goals and purposes.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson02.listen.001
    lesson_content_key: es.b1.unit35.lesson02.para_comprar
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on goals.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson03.translate.001
    lesson_content_key: es.b1.unit35.lesson03.mateo_trabaja_para
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson04.match.001
    lesson_content_key: es.b1.unit35.lesson04.mis_dos_metas
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p2, second: *p2, third: *p2, fourth: *p2, fifth: *p2, sixth: *p2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the vocabulary of the goals.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson01.translate.001
    lesson_content_key: es.b1.unit35.lesson01.para_trabajar
    type: translation
    frame: {text: "I study Spanish in order to work in Spain.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "{item} español para trabajar en España.", language_code: es, direction: ltr}, accepted_variants: ["Yo {item} español para trabajar en España."]}
    feedback_frame: {text: "Para plus an infinitive gives the purpose.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson01.fill.001
    lesson_content_key: es.b1.unit35.lesson01.para_trabajar
    type: fill_in_blank
    frame: {text: "Estudio {item} para trabajar en España. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Languages are not capitalised in Spanish.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson01.fill.002
    lesson_content_key: es.b1.unit35.lesson01.para_trabajar
    type: fill_in_blank
    frame: {text: "Estudio español para {item} en España. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p5, hint: *p5}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Para is followed by the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson01.order.001
    lesson_content_key: es.b1.unit35.lesson01.para_trabajar
    type: word_order
    frame: {text: "Estudio español para trabajar en {item}.", language_code: es, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Estudio español para trabajar en {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Country names are capitalised.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson01.fill.003
    lesson_content_key: es.b1.unit35.lesson01.para_trabajar
    type: fill_in_blank
    frame: {text: "Estudio español {item} trabajar en España. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Para introduces the purpose.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson02.translate.001
    lesson_content_key: es.b1.unit35.lesson02.para_comprar
    type: translation
    frame: {text: "I save money in order to buy a house.", language_code: en, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "{item} dinero para comprar una casa.", language_code: es, direction: ltr}, accepted_variants: ["Yo {item} dinero para comprar una casa."]}
    feedback_frame: {text: "Ahorrar is a regular -ar verb: ahorro.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson02.fill.001
    lesson_content_key: es.b1.unit35.lesson02.para_comprar
    type: fill_in_blank
    frame: {text: "Ahorro {item} para comprar una casa. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Dinero takes no article here.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson02.fill.002
    lesson_content_key: es.b1.unit35.lesson02.para_comprar
    type: fill_in_blank
    frame: {text: "Ahorro dinero para {item} una casa. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p10, hint: *p10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Comprar means to buy.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson02.order.001
    lesson_content_key: es.b1.unit35.lesson02.para_comprar
    type: word_order
    frame: {text: "Ahorro dinero para comprar una {item}.", language_code: es, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: render_frame, frame: {text: "Ahorro dinero para comprar una {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Casa is feminine: una casa.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson03.translate.002
    lesson_content_key: es.b1.unit35.lesson03.mateo_trabaja_para
    type: translation
    frame: {text: "Mateo works many hours in order to save money.", language_code: en, direction: ltr}
    slots: {item: *p12}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo trabaja {item} horas para ahorrar dinero.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Muchas agrees with horas, which is feminine plural.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson03.fill.001
    lesson_content_key: es.b1.unit35.lesson03.mateo_trabaja_para
    type: fill_in_blank
    frame: {text: "Mateo trabaja muchas {item} para ahorrar dinero. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p13, hint: *p13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Horas is feminine plural.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson03.order.001
    lesson_content_key: es.b1.unit35.lesson03.mateo_trabaja_para
    type: word_order
    frame: {text: "Mateo trabaja muchas horas para {item} dinero.", language_code: es, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo trabaja muchas horas para {item} dinero.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Ahorrar means to save money.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson03.translate.003
    lesson_content_key: es.b1.unit35.lesson03.mateo_trabaja_para
    type: translation
    frame: {text: "Mateo works many hours in order to save money.", language_code: en, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo trabaja muchas horas para {item} dinero.", language_code: es, direction: ltr}}
    feedback_frame: {text: "After para the verb stays in the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit35.lesson04.choose.001
    lesson_content_key: es.b1.unit35.lesson04.mis_dos_metas
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
