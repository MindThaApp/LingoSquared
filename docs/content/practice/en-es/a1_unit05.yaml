schema_version: "1.0"
pack_key: practice.en-es.a1.unit05
source_language: en
target_language: es
unit_content_key: es.a1.unit05.time
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-es reference set) from
    scripts/backfill_lexemes_en_es.py lexemes (es_a1_u05* tags, w_<token>
    anchors). The unit introduces 21 new tokens; recognition and bare-word
    production pool the whole unit, the clock sentences use single anchors.
    Opus pass 2026-10-24: clarified the siguiente feedback.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [es_a1_u05, es_a1_u05_l06, w_hora, w_cuarto, w_menos, w_tarde, w_mañana, w_noche, w_acuerdo, w_siguiente, w_idea, w_restaurante]
slot_presets:
  content: &content {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: es_a1_u05}}
  words: &words {language_code: es, part_of_speech: [noun, adjective, adverb, verb], agreement_tags: {semantic: es_a1_u05}}
  dialogue: &dialogue {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: es_a1_u05_l06}}
  hora: &hora {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_hora}}
  cuarto: &cuarto {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_cuarto}}
  menos: &menos {language_code: es, part_of_speech: adverb, agreement_tags: {semantic: w_menos}}
  tarde: &tarde {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_tarde}}
  part_of_day: &part_of_day {language_code: es, part_of_speech: noun, agreement_tags: {semantic: [w_mañana, w_noche]}}
  acuerdo: &acuerdo {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_acuerdo}}
  siguiente: &siguiente {language_code: es, part_of_speech: adjective, agreement_tags: {semantic: w_siguiente}}
  idea: &idea {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_idea}}
  restaurante: &restaurante {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_restaurante}}
templates:
  - content_key: practice.en-es.es.a1.unit05.lesson01.order.001
    lesson_content_key: es.a1.unit05.lesson01.decir_la_hora_en_punto
    type: word_order
    frame: {text: "¿Qué {item} es?", language_code: es, direction: ltr}
    slots: {item: *hora}
    answer_derivation: {kind: render_frame, frame: {text: "¿Qué {item} es?", language_code: es, direction: ltr}}
    feedback_frame: {text: "What time is it? Answer with son las + hour (son las dos), but es la una for one o'clock.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson01.choose.002
    lesson_content_key: es.a1.unit05.lesson01.decir_la_hora_en_punto
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *content}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Hours are feminine because they stand for horas: las dos, las cuatro.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson02.order.001
    lesson_content_key: es.a1.unit05.lesson02.cuarto_y_media
    type: word_order
    frame: {text: "Son las cuatro y {item}.", language_code: es, direction: ltr}
    slots: {item: *cuarto}
    answer_derivation: {kind: render_frame, frame: {text: "Son las cuatro y {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "It's a quarter past four. Half past is y media: son las cuatro y media.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson02.translate.002
    lesson_content_key: es.a1.unit05.lesson02.cuarto_y_media
    type: translation
    frame: {text: "It's a quarter to five.", language_code: en, direction: ltr}
    slots: {item: *menos}
    answer_derivation: {kind: render_frame, frame: {text: "Son las cinco {item} cuarto.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish counts back from the next hour: five minus a quarter.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson03.order.001
    lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
    type: word_order
    frame: {text: "Son las ocho de la {item}.", language_code: es, direction: ltr}
    slots: {item: *part_of_day}
    answer_derivation: {kind: render_frame, frame: {text: "Son las ocho de la {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "De la mañana, de la tarde and de la noche work like a.m. and p.m.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson03.translate.002
    lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
    type: translation
    frame: {text: "The workshop starts at four in the afternoon.", language_code: en, direction: ltr}
    slots: {item: *tarde}
    answer_derivation: {kind: render_frame, frame: {text: "El taller empieza a las cuatro de la {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "At a time is a las + hour: a las cuatro; at one o'clock is a la una.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson03.match.003
    lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *content, second: *content, third: *content, fourth: *content, fifth: *content, sixth: *content}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Mañana means morning (la mañana) and also tomorrow; the article usually tells them apart.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson04.fill.001
    lesson_content_key: es.a1.unit05.lesson04.proponer_una_hora_para_verse
    type: fill_in_blank
    frame: {text: "De {item}, a las tres y media. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *acuerdo, hint: *acuerdo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De acuerdo is the standard way to agree to a plan: okay, agreed.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson04.translate.002
    lesson_content_key: es.a1.unit05.lesson04.proponer_una_hora_para_verse
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Antes de means before: antes del taller, before the workshop.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson05.listen.001
    lesson_content_key: es.a1.unit05.lesson05.leer_el_horario_del_dia
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *content}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Almorzar is to have lunch; Spaniards usually eat lunch between two and three.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson05.fill.002
    lesson_content_key: es.a1.unit05.lesson05.leer_el_horario_del_dia
    type: fill_in_blank
    frame: {text: "Al día {item}, Elena y Mateo almuerzan juntos. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *siguiente, hint: *siguiente}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Al día siguiente means the next day; siguiente comes after the noun.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson06.order.001
    lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
    type: word_order
    frame: {text: "¡Buena {item}! Comemos mañana.", language_code: es, direction: ltr}
    slots: {item: *idea}
    answer_derivation: {kind: render_frame, frame: {text: "¡Buena {item}! Comemos mañana.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Good idea! We'll eat tomorrow. Idea is feminine, so good is buena.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson06.translate.002
    lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
    type: translation
    frame: {text: "There is a restaurant near here.", language_code: en, direction: ltr}
    slots: {item: *restaurante}
    answer_derivation: {kind: render_frame, frame: {text: "Hay un {item} cerca de aquí.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Hay introduces something new: hay un restaurante. For a known place use está: el restaurante está cerca.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit05.lesson06.choose.003
    lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *dialogue}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "¿Tienes hambre? Spanish has hunger rather than being hungry.", language_code: en, direction: ltr}
