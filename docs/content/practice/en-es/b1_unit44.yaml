schema_version: "1.0"
pack_key: practice.en-es.b1.unit44
source_language: en
target_language: es
unit_content_key: es.b1.unit44.descripciones
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-es B1 set) from scripts/backfill_lexemes_en_es.py (en-es-b1 course; w_<token> anchors, one token per sentence slot). Relative clauses with que, donde and con quien. Only six lexemes are new (donde, hay, muchos, empleados, colega, quien) and they all appear in lessons 2 and 3; lesson 1 (que, oficina) adds no new lexeme, so it has no template of its own. The MC, listen and bare-word pools borrow oficina and trabajo; no matching template. Variants: en la que for donde, con el que for con quien. NATIVE FLAG: con quien / con el que are both accepted; quien is the more formal choice.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_colega, w_donde, w_empleados, w_hay, w_muchos, w_oficina, w_quien, w_trabajo]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [verb, adjective, noun], agreement_tags: {semantic: [w_hay, w_muchos, w_empleados, w_colega, w_oficina, w_trabajo]}}
  p2: &p2 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_donde]}}
  p3: &p3 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_hay]}}
  p4: &p4 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_muchos]}}
  p5: &p5 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_empleados]}}
  p6: &p6 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_colega]}}
  p7: &p7 {language_code: es, part_of_speech: [pronoun], agreement_tags: {semantic: [w_quien]}}
templates:
  - content_key: practice.en-es.es.b1.unit44.lesson02.choose.001
    lesson_content_key: es.b1.unit44.lesson02.oficina_empleados
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on describing with relative clauses.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit44.lesson02.listen.001
    lesson_content_key: es.b1.unit44.lesson02.oficina_empleados
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on descriptions.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit44.lesson03.translate.001
    lesson_content_key: es.b1.unit44.lesson03.colega_con_quien
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit44.lesson02.translate.001
    lesson_content_key: es.b1.unit44.lesson02.oficina_empleados
    type: translation
    frame: {text: "Mateo works in an office where there are many employees.", language_code: en, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo trabaja en una oficina {item} hay muchos empleados.", language_code: es, direction: ltr}, accepted_variants: ["Mateo trabaja en una oficina en la que hay muchos empleados."]}
    feedback_frame: {text: "Donde introduces a place description.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit44.lesson02.fill.001
    lesson_content_key: es.b1.unit44.lesson02.oficina_empleados
    type: fill_in_blank
    frame: {text: "Mateo trabaja en una oficina donde {item} muchos empleados. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Hay means there is or there are.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit44.lesson02.fill.002
    lesson_content_key: es.b1.unit44.lesson02.oficina_empleados
    type: fill_in_blank
    frame: {text: "Mateo trabaja en una oficina donde hay {item} empleados. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Muchos agrees with empleados.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit44.lesson02.order.001
    lesson_content_key: es.b1.unit44.lesson02.oficina_empleados
    type: word_order
    frame: {text: "Mateo trabaja en una oficina donde hay muchos {item}.", language_code: es, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo trabaja en una oficina donde hay muchos {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Empleados is masculine plural.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit44.lesson03.translate.002
    lesson_content_key: es.b1.unit44.lesson03.colega_con_quien
    type: translation
    frame: {text: "Mateo has a colleague with whom he works every day.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo tiene un {item} con quien trabaja todos los días.", language_code: es, direction: ltr}, accepted_variants: ["Mateo tiene un {item} con el que trabaja todos los días."]}
    feedback_frame: {text: "Colega can refer to a man or a woman.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit44.lesson03.fill.001
    lesson_content_key: es.b1.unit44.lesson03.colega_con_quien
    type: fill_in_blank
    frame: {text: "Mateo tiene un colega con {item} trabaja todos los días. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After a preposition, quien refers to a person.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit44.lesson03.order.001
    lesson_content_key: es.b1.unit44.lesson03.colega_con_quien
    type: word_order
    frame: {text: "Mateo tiene un colega con {item} trabaja todos los días.", language_code: es, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo tiene un colega con {item} trabaja todos los días.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Quien refers back to the colleague.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit44.lesson03.order.002
    lesson_content_key: es.b1.unit44.lesson03.colega_con_quien
    type: word_order
    frame: {text: "Mateo tiene un {item} con quien trabaja todos los días.", language_code: es, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo tiene un {item} con quien trabaja todos los días.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Colega is used for both men and women.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit44.lesson02.order.002
    lesson_content_key: es.b1.unit44.lesson02.oficina_empleados
    type: word_order
    frame: {text: "Mateo trabaja en una oficina {item} hay muchos empleados.", language_code: es, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo trabaja en una oficina {item} hay muchos empleados.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Donde introduces a place description.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit44.lesson04.choose.001
    lesson_content_key: es.b1.unit44.lesson04.combinar_hechos
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
