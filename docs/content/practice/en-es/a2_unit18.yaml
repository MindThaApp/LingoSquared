schema_version: "1.0"
pack_key: practice.en-es.a2.unit18
source_language: en
target_language: es
unit_content_key: es.a2.unit18.banco
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-es A2 set) from scripts/backfill_lexemes_en_es.py lexemes (es_a2_uNN* tags, w_<token> anchors). Bank vocabulary with formal usted. "cuenta" is glossed as account at its first sight in the A2 course (A1 taught bill). NATIVE FLAG: tarjeta de débito and sucursal are standard in both Spain and Latin America; Spain also says oficina for a bank branch.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_banco, w_cuenta, w_identificación, w_tarjeta, w_débito, w_saldo, w_sucursal, w_transferencias, w_teléfono, w_gustaría, w_abrir, w_consultar, w_línea, w_puede, w_cómo, w_o, w_cuentas, w_cualquier, w_entre, w_excelente, w_abrió, w_muchas, w_gratuita, w_mismo]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_banco, w_cuenta, w_identificación, w_tarjeta, w_débito, w_saldo, w_sucursal, w_transferencias, w_teléfono]}}
  p2: &p2 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_gustaría]}}
  p3: &p3 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_abrir]}}
  p4: &p4 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_identificación]}}
  p5: &p5 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_banco, w_cuenta, w_identificación, w_tarjeta, w_saldo, w_sucursal, w_transferencias, w_teléfono]}}
  p6: &p6 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_saldo]}}
  p7: &p7 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_tarjeta]}}
  p8: &p8 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_tarjeta, w_débito, w_saldo, w_cuenta, w_banco, w_identificación]}}
  p9: &p9 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_consultar]}}
  p10: &p10 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_línea]}}
  p11: &p11 {language_code: es, part_of_speech: [adverb, noun, particle, verb], agreement_tags: {semantic: [w_consultar, w_puede, w_línea, w_cómo, w_o, w_saldo]}}
  p12: &p12 {language_code: es, part_of_speech: [adjective, noun, preposition], agreement_tags: {semantic: [w_sucursal, w_transferencias, w_cuentas, w_teléfono, w_cualquier, w_entre]}}
  p13: &p13 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_sucursal, w_transferencias, w_cuentas, w_teléfono, w_saldo, w_banco]}}
  p14: &p14 {language_code: es, part_of_speech: [adjective, verb], agreement_tags: {semantic: [w_excelente, w_abrió, w_muchas, w_gratuita, w_cualquier, w_mismo]}}
  p15: &p15 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_abrió]}}
templates:
  - content_key: practice.en-es.es.a2.unit18.lesson01.choose.001
    lesson_content_key: es.a2.unit18.lesson01.me_gustaria_abrir_cuenta
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These nouns come from opening a bank account.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson01.fill.002
    lesson_content_key: es.a2.unit18.lesson01.me_gustaria_abrir_cuenta
    type: fill_in_blank
    frame: {text: "Me {item} abrir una cuenta bancaria. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Me gustaría is the softer, polite way of saying I would like.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson01.translate.003
    lesson_content_key: es.a2.unit18.lesson01.me_gustaria_abrir_cuenta
    type: translation
    frame: {text: "I want to open a bank account.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Quiero {item} una cuenta bancaria.", language_code: es, direction: ltr}}
    feedback_frame: {text: "After quiero, the verb stays in the infinitive: quiero abrir.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson01.listen.004
    lesson_content_key: es.a2.unit18.lesson01.me_gustaria_abrir_cuenta
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard is a noun from the bank scene.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson02.order.001
    lesson_content_key: es.a2.unit18.lesson02.que_necesito_para_abrir
    type: word_order
    frame: {text: "Traigo mi {item}.", language_code: es, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Traigo mi {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Identificación is feminine, but mi does not change before singular nouns.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson02.translate.002
    lesson_content_key: es.a2.unit18.lesson02.que_necesito_para_abrir
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p5}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The bank adviser asks Mateo for these things and services.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson03.fill.001
    lesson_content_key: es.a2.unit18.lesson03.la_tarjeta_de_debito
    type: fill_in_blank
    frame: {text: "¿Cuál es mi {item} actual? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Saldo is the money available in an account; actual means current here.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson03.translate.002
    lesson_content_key: es.a2.unit18.lesson03.la_tarjeta_de_debito
    type: translation
    frame: {text: "We will give you a debit card.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Le daremos una {item} de débito.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Le means to you (formal); daremos is the future of dar.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson03.match.003
    lesson_content_key: es.a2.unit18.lesson03.la_tarjeta_de_debito
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p8, second: *p8, third: *p8, fourth: *p8, fifth: *p8, sixth: *p8}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Tarjeta de débito is a debit card; a credit card is tarjeta de crédito.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson04.fill.001
    lesson_content_key: es.a2.unit18.lesson04.consultar_el_saldo
    type: fill_in_blank
    frame: {text: "¿Cómo puedo {item} mi saldo? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Consultar means to look something up or check it, not only to consult a person.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson04.order.002
    lesson_content_key: es.a2.unit18.lesson04.consultar_el_saldo
    type: word_order
    frame: {text: "Puede consultar su saldo en {item}.", language_code: es, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Puede consultar su saldo en {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "En línea means online.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson04.choose.003
    lesson_content_key: es.a2.unit18.lesson04.consultar_el_saldo
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The adviser explains how Mateo can check his balance.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson05.match.001
    lesson_content_key: es.a2.unit18.lesson05.leer_el_folleto
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p12, second: *p12, third: *p12, fourth: *p12, fifth: *p12, sixth: *p12}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Entre means between or among; cualquier means any.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson05.translate.002
    lesson_content_key: es.a2.unit18.lesson05.leer_el_folleto
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The leaflet uses these words about services and branches.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson06.choose.001
    lesson_content_key: es.a2.unit18.lesson06.mateo_abre_la_cuenta
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mateo and the adviser close the appointment with these words.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit18.lesson06.fill.002
    lesson_content_key: es.a2.unit18.lesson06.mateo_abre_la_cuenta
    type: fill_in_blank
    frame: {text: "Mateo {item} una cuenta bancaria. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p15, hint: *p15}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Abrió is the past tense of abrir for he or she.", language_code: en, direction: ltr}
