schema_version: "1.0"
pack_key: practice.en-es.a1.unit08
source_language: en
target_language: es
unit_content_key: es.a1.unit08.places
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-es reference set) from
    scripts/backfill_lexemes_en_es.py lexemes (es_a1_u08* tags, w_<token>
    anchors). Lesson03 introduces no new tokens and has no template.
    Place frames split masculine (el banco, el parque) and feminine (la
    farmacia, la biblioteca) pools.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [es_a1_u08, w_banco, w_parque, w_farmacia, w_biblioteca, w_enfrente, w_lejos, w_entre, w_bastante, w_compramos]
slot_presets:
  nouns: &nouns {language_code: es, part_of_speech: noun, agreement_tags: {semantic: es_a1_u08}}
  content: &content {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: es_a1_u08}}
  words: &words {language_code: es, part_of_speech: [noun, adjective, adverb], agreement_tags: {semantic: es_a1_u08}}
  verbs_adv: &verbs_adv {language_code: es, part_of_speech: [verb, adverb, adjective], agreement_tags: {semantic: es_a1_u08}}
  place_m: &place_m {language_code: es, part_of_speech: noun, agreement_tags: {semantic: [w_banco, w_parque]}}
  place_f: &place_f {language_code: es, part_of_speech: noun, agreement_tags: {semantic: [w_farmacia, w_biblioteca]}}
  enfrente: &enfrente {language_code: es, part_of_speech: adverb, agreement_tags: {semantic: w_enfrente}}
  lejos: &lejos {language_code: es, part_of_speech: adverb, agreement_tags: {semantic: w_lejos}}
  entre: &entre {language_code: es, part_of_speech: preposition, agreement_tags: {semantic: w_entre}}
  bastante: &bastante {language_code: es, part_of_speech: adverb, agreement_tags: {semantic: w_bastante}}
  compramos: &compramos {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_compramos}}
templates:
  - content_key: practice.en-es.es.a1.unit08.lesson01.choose.001
    lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *nouns}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Biblioteca is a library; a bookshop is a librería, a common false friend.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit08.lesson01.listen.002
    lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *nouns}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Banco also means bench; in this unit it is the bank on the street.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit08.lesson01.order.003
    lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
    type: word_order
    frame: {text: "La {item} está cerca de aquí.", language_code: es, direction: ltr}
    slots: {item: *place_f}
    answer_derivation: {kind: render_frame, frame: {text: "La {item} está cerca de aquí.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Use estar for where something is: la farmacia está cerca.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit08.lesson01.translate.004
    lesson_content_key: es.a1.unit08.lesson01.lugares_comunes
    type: translation
    frame: {text: "The {item} is next to the market.", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *place_m}
    answer_derivation: {kind: render_frame, frame: {text: "El {item} está al lado del mercado.", language_code: es, direction: ltr}}
    feedback_frame: {text: "De + el contracts to del: al lado del mercado, next to the market.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit08.lesson02.fill.001
    lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
    type: fill_in_blank
    frame: {text: "La farmacia está {item} del mercado. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *enfrente, hint: *enfrente}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Enfrente de, al lado de, lejos de and cerca de all need de before the place.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit08.lesson02.order.002
    lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
    type: word_order
    frame: {text: "El parque está {item} del mercado.", language_code: es, direction: ltr}
    slots: {item: *lejos}
    answer_derivation: {kind: render_frame, frame: {text: "El parque está {item} del mercado.", language_code: es, direction: ltr}}
    feedback_frame: {text: "The park is far from the market. The opposite is cerca de, near.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit08.lesson02.translate.003
    lesson_content_key: es.a1.unit08.lesson02.preposiciones_de_lugar
    type: translation
    frame: {text: "The library is between the bank and the park.", language_code: en, direction: ltr}
    slots: {item: *entre}
    answer_derivation: {kind: render_frame, frame: {text: "La biblioteca está {item} el banco y el parque.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Entre takes the two places joined by y, with no de after it.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit08.lesson04.fill.001
    lesson_content_key: es.a1.unit08.lesson04.preguntar_si_esta_lejos
    type: fill_in_blank
    frame: {text: "Sí, está {item} lejos. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *bastante, hint: *bastante}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Bastante softens or strengthens an adjective like quite: bastante lejos, bastante cerca.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit08.lesson05.match.001
    lesson_content_key: es.a1.unit08.lesson05.leer_sobre_el_barrio
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *content, second: *content, third: *content, fourth: *content, fifth: *content, sixth: *content}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "En este barrio hay muchos lugares útiles: hay introduces what a place has.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit08.lesson05.translate.002
    lesson_content_key: es.a1.unit08.lesson05.leer_sobre_el_barrio
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Útil becomes útiles in the plural because it ends in a consonant.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit08.lesson06.choose.001
    lesson_content_key: es.a1.unit08.lesson06.lugares_del_barrio_dialogue
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *verbs_adv}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Donde without an accent links two ideas; ¿dónde? with an accent asks a question.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit08.lesson06.translate.002
    lesson_content_key: es.a1.unit08.lesson06.lugares_del_barrio_dialogue
    type: translation
    frame: {text: "It's next to the market where we bought the eggs.", language_code: en, direction: ltr}
    slots: {item: *compramos}
    answer_derivation: {kind: render_frame, frame: {text: "Está al lado del mercado donde {item} los huevos.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Compramos is both we buy and we bought; the context gives the time.", language_code: en, direction: ltr}
