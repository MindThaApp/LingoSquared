schema_version: "1.0"
pack_key: practice.en-es.a1.unit07
source_language: en
target_language: es
unit_content_key: es.a1.unit07.shopping
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-es reference set) from
    scripts/backfill_lexemes_en_es.py lexemes (es_a1_u07* tags, w_<token>
    anchors). Price questions use one anchor each so cuesta (singular) and
    cuestan (plural) always agree with their noun.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [es_a1_u07, es_a1_u07_l01, es_a1_u07_l06, w_cuesta, w_cuestan, w_docena, w_necesita, w_todo, w_ingredientes]
slot_presets:
  market: &market {language_code: es, part_of_speech: [noun, adjective], agreement_tags: {semantic: es_a1_u07_l01}}
  nouns: &nouns {language_code: es, part_of_speech: noun, agreement_tags: {semantic: es_a1_u07}}
  content: &content {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: es_a1_u07}}
  dialogue: &dialogue {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: es_a1_u07_l06}}
  cuesta: &cuesta {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_cuesta}}
  cuestan: &cuestan {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_cuestan}}
  docena: &docena {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_docena}}
  necesita: &necesita {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_necesita}}
  todo: &todo {language_code: es, part_of_speech: pronoun, agreement_tags: {semantic: w_todo}}
  ingredientes: &ingredientes {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_ingredientes}}
templates:
  - content_key: practice.en-es.es.a1.unit07.lesson01.choose.001
    lesson_content_key: es.a1.unit07.lesson01.el_mercado
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *market}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Adjectives agree with the noun: la fruta fresca, los tomates frescos.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit07.lesson01.listen.002
    lesson_content_key: es.a1.unit07.lesson01.el_mercado
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *nouns}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Verdura is one vegetable; at the market you usually ask for verduras.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit07.lesson02.order.001
    lesson_content_key: es.a1.unit07.lesson02.preguntar_el_precio
    type: word_order
    frame: {text: "¿Cuánto {item} el kilo de tomates?", language_code: es, direction: ltr}
    slots: {item: *cuesta}
    answer_derivation: {kind: render_frame, frame: {text: "¿Cuánto {item} el kilo de tomates?", language_code: es, direction: ltr}}
    feedback_frame: {text: "How much is the kilo of tomatoes? Cuesta goes with one thing, cuestan with several.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit07.lesson02.translate.002
    lesson_content_key: es.a1.unit07.lesson02.preguntar_el_precio
    type: translation
    frame: {text: "How much do the eggs cost?", language_code: en, direction: ltr}
    slots: {item: *cuestan}
    answer_derivation: {kind: render_frame, frame: {text: "¿Cuánto {item} los huevos?", language_code: es, direction: ltr}}
    feedback_frame: {text: "Huevos is plural, so the verb is cuestan; for the bread it would be cuesta.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit07.lesson03.order.001
    lesson_content_key: es.a1.unit07.lesson03.cantidades
    type: word_order
    frame: {text: "Una {item} de huevos, por favor.", language_code: es, direction: ltr}
    slots: {item: *docena}
    answer_derivation: {kind: render_frame, frame: {text: "Una {item} de huevos, por favor.", language_code: es, direction: ltr}}
    feedback_frame: {text: "A dozen eggs, please. Quantities take de before the item: un kilo de tomates.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit07.lesson03.match.002
    lesson_content_key: es.a1.unit07.lesson03.cantidades
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *nouns, second: *nouns, third: *nouns, fourth: *nouns, fifth: *nouns, sixth: *nouns}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Medio kilo is half a kilo; medio does not take un in front of it.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit07.lesson03.translate.003
    lesson_content_key: es.a1.unit07.lesson03.cantidades
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *nouns}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Words ending in -o are usually masculine (el mercado) and in -a feminine (la fruta).", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit07.lesson04.fill.001
    lesson_content_key: es.a1.unit07.lesson04.una_compra_sencilla
    type: fill_in_blank
    frame: {text: "¿{item} algo más? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *necesita, hint: *necesita}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Market sellers use usted forms with customers: ¿Necesita algo más?", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit07.lesson04.translate.002
    lesson_content_key: es.a1.unit07.lesson04.una_compra_sencilla
    type: translation
    frame: {text: "We already have everything.", language_code: en, direction: ltr}
    slots: {item: *todo}
    answer_derivation: {kind: render_frame, frame: {text: "Ya tenemos {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Ya, already, normally comes before the verb in Spanish.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit07.lesson05.choose.001
    lesson_content_key: es.a1.unit07.lesson05.leer_las_etiquetas_de_precio
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *content}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Todos los días means every day, literally all the days.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit07.lesson06.order.001
    lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
    type: word_order
    frame: {text: "Necesitamos {item} para la próxima clase.", language_code: es, direction: ltr}
    slots: {item: *ingredientes}
    answer_derivation: {kind: render_frame, frame: {text: "Necesitamos {item} para la próxima clase.", language_code: es, direction: ltr}}
    feedback_frame: {text: "We need ingredients for the next class. Necesitamos is the we form of necesitar.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit07.lesson06.translate.002
    lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *content}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "¡Qué tomates tan frescos! is how Spanish says what fresh tomatoes!", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit07.lesson06.listen.003
    lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *dialogue}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Vamos means let's go as well as we go; context tells them apart.", language_code: en, direction: ltr}
