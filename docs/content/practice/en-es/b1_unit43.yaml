schema_version: "1.0"
pack_key: practice.en-es.b1.unit43
source_language: en
target_language: es
unit_content_key: es.b1.unit43.reuniones
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-es B1 set) from scripts/backfill_lexemes_en_es.py (en-es-b1 course; w_<token> anchors, one token per sentence slot). Meeting language: podriamos + infinitive (suggestion), podria + infinitive (formal request), si and lo enviare in short replies. Variants: para las tres, usted written out, Me podria + infinitive. NATIVE FLAG: the formal request uses podria (usted), as in the unit.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_cambiar, w_del, w_enviarme, w_enviaré, w_podríamos, w_reunión, w_sí, w_tres, w_viernes]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_cambiar, w_podríamos, w_enviarme, w_viernes, w_enviaré, w_tres]}}
  p2: &p2 {language_code: es, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_cambiar, w_podríamos, w_enviarme, w_viernes, w_enviaré, w_tres, w_reunión]}}
  p3: &p3 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_cambiar]}}
  p4: &p4 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_podríamos]}}
  p5: &p5 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_tres]}}
  p6: &p6 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_enviarme]}}
  p7: &p7 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_viernes]}}
  p8: &p8 {language_code: es, part_of_speech: [preposition], agreement_tags: {semantic: [w_del]}}
  p9: &p9 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_enviaré]}}
  p10: &p10 {language_code: es, part_of_speech: [particle], agreement_tags: {semantic: [w_sí]}}
templates:
  - content_key: practice.en-es.es.b1.unit43.lesson01.choose.001
    lesson_content_key: es.b1.unit43.lesson01.podriamos_cambiar
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on professional meetings.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson01.listen.001
    lesson_content_key: es.b1.unit43.lesson01.podriamos_cambiar
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on meetings.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson02.translate.001
    lesson_content_key: es.b1.unit43.lesson02.podria_enviarme
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson03.match.001
    lesson_content_key: es.b1.unit43.lesson03.intercambio
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p2, second: *p2, third: *p2, fourth: *p2, fifth: *p2, sixth: *p2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the vocabulary of the meeting.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson01.translate.001
    lesson_content_key: es.b1.unit43.lesson01.podriamos_cambiar
    type: translation
    frame: {text: "We could move the meeting to three o'clock.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Podríamos {item} la reunión a las tres.", language_code: es, direction: ltr}, accepted_variants: ["Podríamos {item} la reunión para las tres."]}
    feedback_frame: {text: "Podríamos plus an infinitive makes a polite suggestion.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson01.fill.001
    lesson_content_key: es.b1.unit43.lesson01.podriamos_cambiar
    type: fill_in_blank
    frame: {text: "{item} cambiar la reunión a las tres. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Podríamos is the conditional of poder for nosotros.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson01.order.001
    lesson_content_key: es.b1.unit43.lesson01.podriamos_cambiar
    type: word_order
    frame: {text: "Podríamos cambiar la reunión a las {item}.", language_code: es, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Podríamos cambiar la reunión a las {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Times take las: a las tres.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson01.fill.002
    lesson_content_key: es.b1.unit43.lesson01.podriamos_cambiar
    type: fill_in_blank
    frame: {text: "Podríamos {item} la reunión a las tres. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p3, hint: *p3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Cambiar means to change, here to move to another time.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson02.translate.002
    lesson_content_key: es.b1.unit43.lesson02.podria_enviarme
    type: translation
    frame: {text: "Could you send me the report before Friday? (formal)", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "¿Podría {item} el informe antes del viernes?", language_code: es, direction: ltr}, accepted_variants: ["¿Podría usted {item} el informe antes del viernes?", "¿Me podría enviar el informe antes del viernes?"]}
    feedback_frame: {text: "Podría is the polite form for usted.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson02.fill.001
    lesson_content_key: es.b1.unit43.lesson02.podria_enviarme
    type: fill_in_blank
    frame: {text: "¿Podría enviarme el informe antes del {item}? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Antes de plus el becomes antes del.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson02.fill.002
    lesson_content_key: es.b1.unit43.lesson02.podria_enviarme
    type: fill_in_blank
    frame: {text: "¿Podría enviarme el informe antes {item} viernes? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De plus el becomes del.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson03.translate.001
    lesson_content_key: es.b1.unit43.lesson03.intercambio
    type: translation
    frame: {text: "Yes, I will send it.", language_code: en, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Sí, lo {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "The pronoun lo comes before the conjugated verb.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson03.fill.001
    lesson_content_key: es.b1.unit43.lesson03.intercambio
    type: fill_in_blank
    frame: {text: "{item}, lo enviaré. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p10, hint: *p10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Sí with an accent means yes.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit43.lesson04.choose.001
    lesson_content_key: es.b1.unit43.lesson04.mensaje_profesional
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
