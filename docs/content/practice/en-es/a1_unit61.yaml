schema_version: '1.0'
pack_key: practice.en-es.a1.unit61
source_language: en
target_language: es
unit_content_key: es.a1.unit61.post
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_a1_u61 / w_<token>). 13 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_carta, w_compra, w_correos, w_desea, w_dirección, w_empleado, w_escribe, w_escribir, w_llegas, w_paquete, w_sello, w_tarda, w_tardar]
templates:
- content_key: practice.en-es.es.a1.unit61.lesson01.choose.001
  lesson_content_key: es.a1.unit61.lesson01.la_carta_y_el
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_carta, w_paquete, w_sello, w_dirección, w_escribir, w_llegas, w_tardar, w_tarda, w_empleado, w_desea, w_compra, w_correos, w_escribe]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the letter and the package.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit61.lesson02.listen.001
  lesson_content_key: es.a1.unit61.lesson02.el_sello_la_direccion
  type: listen_select
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the stamp, the address, and writing.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit61.lesson03.translate.001
