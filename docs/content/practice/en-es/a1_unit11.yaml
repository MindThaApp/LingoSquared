schema_version: "1.0"
pack_key: practice.en-es.a1.unit11
source_language: en
target_language: es
unit_content_key: es.a1.unit11.clothing
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-es reference set) from
    scripts/backfill_lexemes_en_es.py lexemes (es_a1_u11* tags, w_<token>
    anchors). Lesson03 introduces no new tokens and has no template.
    Opus pass 2026-10-24: fixed four feedback lines (pantalón also plural, shoe size question, attached lo, and a buscar note that contradicted para el taller). NATIVE FLAG: Spain often asks ¿Qué talla tienes? rather than usas.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [es_a1_u11, es_a1_u11_l01, w_mediana, w_talla, w_mal, w_comprarlo, w_barato, w_delantales]
slot_presets:
  clothes: &clothes {language_code: es, part_of_speech: noun, agreement_tags: {semantic: es_a1_u11_l01}}
  nouns: &nouns {language_code: es, part_of_speech: noun, agreement_tags: {semantic: es_a1_u11}}
  content: &content {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: es_a1_u11}}
  verbs: &verbs {language_code: es, part_of_speech: [verb, adjective, adverb], agreement_tags: {semantic: es_a1_u11}}
  mediana: &mediana {language_code: es, part_of_speech: adjective, agreement_tags: {semantic: w_mediana}}
  talla: &talla {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_talla}}
  mal: &mal {language_code: es, part_of_speech: adverb, agreement_tags: {semantic: w_mal}}
  comprarlo: &comprarlo {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_comprarlo}}
  barato: &barato {language_code: es, part_of_speech: adjective, agreement_tags: {semantic: w_barato}}
  delantales: &delantales {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_delantales}}
templates:
  - content_key: practice.en-es.es.a1.unit11.lesson01.choose.001
    lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *clothes}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Spanish often uses the singular el pantalón (also los pantalones) where English always says trousers or pants.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit11.lesson01.listen.002
    lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *clothes}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Camisa and chaqueta are feminine; pantalón, delantal and zapatos are masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit11.lesson01.translate.003
    lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *nouns}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Nouns ending in -l add -es in the plural: delantal, delantales.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit11.lesson02.order.001
    lesson_content_key: es.a1.unit11.lesson02.la_talla
    type: word_order
    frame: {text: "Uso la talla {item}.", language_code: es, direction: ltr}
    slots: {item: *mediana}
    answer_derivation: {kind: render_frame, frame: {text: "Uso la talla {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "I wear a medium. Spanish uses usar, to use, for the size you wear.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit11.lesson02.fill.002
    lesson_content_key: es.a1.unit11.lesson02.la_talla
    type: fill_in_blank
    frame: {text: "¿Qué {item} usas? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *talla, hint: *talla}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Talla is the size of clothes; shoe size is el número instead: ¿Qué número tienes?", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit11.lesson02.translate.003
    lesson_content_key: es.a1.unit11.lesson02.la_talla
    type: translation
    frame: {text: "It fits me badly.", language_code: en, direction: ltr}
    slots: {item: *mal}
    answer_derivation: {kind: render_frame, frame: {text: "Me queda {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Quedar bien or mal says how clothes fit you: me queda bien, it fits me well.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit11.lesson04.order.001
    lesson_content_key: es.a1.unit11.lesson04.decidir_comprar
    type: word_order
    frame: {text: "Me queda bien. Voy a {item}.", language_code: es, direction: ltr}
    slots: {item: *comprarlo}
    answer_derivation: {kind: render_frame, frame: {text: "Me queda bien. Voy a {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Ir a + infinitive talks about a plan: voy a comprarlo, I'm going to buy it. The lo, it, attaches to the end of the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit11.lesson05.match.001
    lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *content, second: *content, third: *content, fourth: *content, fifth: *content, sixth: *content}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Uso, usas and usan all come from usar: I wear, you wear, they wear.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit11.lesson05.fill.002
    lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
    type: fill_in_blank
    frame: {text: "El delantal es más {item}: solo cuesta doce. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *barato, hint: *barato}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Más + adjective makes a comparison: más barato, cheaper.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit11.lesson06.order.001
    lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
    type: word_order
    frame: {text: "Sí, buscamos {item} para el taller.", language_code: es, direction: ltr}
    slots: {item: *delantales}
    answer_derivation: {kind: render_frame, frame: {text: "Sí, buscamos {item} para el taller.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Yes, we're looking for aprons for the workshop. Buscar already means to look for, so buscamos delantales needs no extra word.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit11.lesson06.choose.002
    lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *verbs}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The clerk offers help with ¿Los ayudo?, can I help you (all)?", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit11.lesson06.translate.003
    lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *verbs}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Voy comes from ir, to go; it is irregular: voy, vas, va.", language_code: en, direction: ltr}
