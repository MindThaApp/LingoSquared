schema_version: "1.0"
pack_key: practice.en-es.a1.unit04
source_language: en
target_language: es
unit_content_key: es.a1.unit04.dates
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-es reference set) from
    scripts/backfill_lexemes_en_es.py lexemes (es_a1_u04* tags,
    w_<token> anchors). Weekday and month frames use pools that hold only
    weekdays or only months at course scope.
    Opus pass 2026-10-24: month pool now a w_ list of this unit's months instead of the course-wide es_month tag; fixed ¿Y tuyo? to the grammatical ¿Y el tuyo? (as in the dialogue).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [es_a1_u04, es_a1_u04_l01, es_a1_u04_l02, w_enero, w_febrero, w_marzo, w_abril, w_mayo, w_junio, w_julio, w_agosto, w_septiembre, w_octubre, w_noviembre, w_diciembre, w_fecha, w_veintidós, w_veintinueve, w_tuyo]
slot_presets:
  weekday: &weekday {language_code: es, part_of_speech: noun, agreement_tags: {semantic: es_a1_u04_l01}}
  month: &month {language_code: es, part_of_speech: noun, agreement_tags: {semantic: [w_enero, w_febrero, w_marzo, w_abril, w_mayo, w_junio, w_julio, w_agosto, w_septiembre, w_octubre, w_noviembre, w_diciembre]}}
  month_words: &month_words {language_code: es, part_of_speech: noun, agreement_tags: {semantic: es_a1_u04_l02}}
  content: &content {language_code: es, part_of_speech: [noun, verb, adverb, phrase, adjective], agreement_tags: {semantic: es_a1_u04}}
  words: &words {language_code: es, part_of_speech: [noun, adverb, phrase], agreement_tags: {semantic: es_a1_u04}}
  fecha: &fecha {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_fecha}}
  veintidos: &veintidos {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_veintidós}}
  veintinueve: &veintinueve {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_veintinueve}}
  tuyo: &tuyo {language_code: es, part_of_speech: pronoun, agreement_tags: {semantic: w_tuyo}}
templates:
  - content_key: practice.en-es.es.a1.unit04.lesson01.choose.001
    lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Spanish weekdays are written with a small letter and are masculine: el lunes, los martes.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson01.listen.002
    lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Lunes to viernes end in -s and keep the same form in the plural; sábado and domingo add -s: los sábados.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson01.order.003
    lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
    type: word_order
    frame: {text: "Hoy es {day}.", language_code: es, direction: ltr}
    slots: {day: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "Hoy es {day}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "After hoy es the day needs no article; to say on Tuesdays you use los: los martes.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson01.translate.004
    lesson_content_key: es.a1.unit04.lesson01.dias_de_la_semana
    type: translation
    frame: {text: "Today is {day}.", language_code: en, direction: ltr, slot_rendering: {day: english_gloss}}
    slots: {day: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "Hoy es {day}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Remember the small letter: hoy es lunes, never Lunes.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson02.match.001
    lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *month, second: *month, third: *month, fourth: *month, fifth: *month, sixth: *month}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Months are also written with a small letter in Spanish: enero, julio, diciembre.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson02.translate.002
    lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *month_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Many months look like English ones: marzo, abril, septiembre, octubre.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson02.order.003
    lesson_content_key: es.a1.unit04.lesson02.los_meses_del_ano
    type: word_order
    frame: {text: "Mi cumpleaños es en {month}.", language_code: es, direction: ltr}
    slots: {month: *month}
    answer_derivation: {kind: render_frame, frame: {text: "Mi cumpleaños es en {month}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Use en with a month (en marzo) but el with a full date (el diez de marzo).", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson03.fill.001
    lesson_content_key: es.a1.unit04.lesson03.preguntar_y_decir_la_fecha
    type: fill_in_blank
    frame: {text: "¿Qué {item} es hoy? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fecha, hint: *fecha}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Spanish dates go day, de, month: el veintidós de julio.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson03.translate.002
    lesson_content_key: es.a1.unit04.lesson03.preguntar_y_decir_la_fecha
    type: translation
    frame: {text: "Today is the twenty-second of July.", language_code: en, direction: ltr}
    slots: {item: *veintidos}
    answer_derivation: {kind: render_frame, frame: {text: "Hoy es el {item} de julio.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish uses plain numbers for dates, not ordinals: el veintidós, the twenty-second.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson05.choose.001
    lesson_content_key: es.a1.unit04.lesson05.leer_el_horario_del_taller
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *content}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Hay means both there is and there are: hay una clase, hay dos clases.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson05.fill.002
    lesson_content_key: es.a1.unit04.lesson05.leer_el_horario_del_taller
    type: fill_in_blank
    frame: {text: "Después hay una clase el {item} de julio. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *veintinueve, hint: *veintinueve}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Twenty-one to twenty-nine are written as one word: veintiuno, veintidós, veintinueve.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson06.listen.001
    lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *content}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Por cierto, by the way, is a handy way to change the subject.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson06.translate.002
    lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Cumpleaños is one word and the same in singular and plural: el cumpleaños, los cumpleaños.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson06.translate.003
    lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
    type: translation
    frame: {text: "And yours? (informal)", language_code: en, direction: ltr}
    slots: {item: *tuyo}
    answer_derivation: {kind: render_frame, frame: {text: "¿Y el {item}?", language_code: es, direction: ltr}}
    feedback_frame: {text: "El tuyo stands for tu cumpleaños, a masculine noun; for a feminine noun it is la tuya.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit04.lesson06.match.004
    lesson_content_key: es.a1.unit04.lesson06.planear_la_proxima_clase_dialogue
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *content, second: *content, third: *content, fourth: *content, fifth: *content, sixth: *content}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "¿Cuándo es...? asks when something is; the answer starts with es el + date or es en + month.", language_code: en, direction: ltr}
