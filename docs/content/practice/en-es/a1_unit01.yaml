schema_version: "1.0"
pack_key: practice.en-es.a1.unit01
source_language: en
target_language: es
unit_content_key: es.a1.unit01.greetings
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-es reference pack) against
    PRACTICE_PACK_RECIPE.md and lexemes from scripts/backfill_lexemes_en_es.py
    (per-unit tags es_a1_u01*, single-member w_<token> anchors). Recognition
    and bare-word production pools are unit-scoped; sentence frames use
    curated w_ unions so the course-scope pool equals the unit-scope pool.
    Feedback lines carry a usage or grammar point, never the task or the
    answer.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [es_a1_u01, es_a1_u01_l02, es_a1_u01_l03, w_Lucía, w_Diego, w_Carlos, w_Ana, w_México, w_Colombia, w_España, w_Londres, w_aprendiendo, w_vez, w_cocinar, w_gusto, w_igualmente, w_luego, w_usted, w_tú]
slot_presets:
  content: &content {language_code: es, part_of_speech: [noun, verb, adjective, adverb, phrase], agreement_tags: {semantic: es_a1_u01}}
  words: &words {language_code: es, part_of_speech: [noun, adverb, phrase, adjective], agreement_tags: {semantic: es_a1_u01}}
  greeting: &greeting {language_code: es, part_of_speech: [noun, adjective, adverb, phrase, verb], agreement_tags: {semantic: es_a1_u01_l02}}
  name_m: &name_m {language_code: es, part_of_speech: proper_noun, agreement_tags: {semantic: [w_Carlos, w_Diego]}}
  name_f: &name_f {language_code: es, part_of_speech: proper_noun, agreement_tags: {semantic: [w_Ana, w_Lucía]}}
  name: &name {language_code: es, part_of_speech: proper_noun, agreement_tags: {semantic: [w_Carlos, w_Diego, w_Ana, w_Lucía]}}
  country: &country {language_code: es, part_of_speech: proper_noun, agreement_tags: {semantic: [w_México, w_Colombia, w_España]}}
  aprendiendo: &aprendiendo {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_aprendiendo}}
  vez: &vez {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_vez}}
  cocinar: &cocinar {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_cocinar}}
  gusto: &gusto {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_gusto}}
  igualmente: &igualmente {language_code: es, part_of_speech: adverb, agreement_tags: {semantic: w_igualmente}}
  luego: &luego {language_code: es, part_of_speech: adverb, agreement_tags: {semantic: w_luego}}
  usted: &usted {language_code: es, part_of_speech: pronoun, agreement_tags: {semantic: w_usted}}
templates:
  - content_key: practice.en-es.es.a1.unit01.lesson01.choose.001
    lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *content}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Spanish has two words for you: tú with friends and family, usted with strangers and to show respect.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson01.fill.002
    lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
    type: fill_in_blank
    frame: {text: "¿Cómo está {item}? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *usted, hint: *usted}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Está goes with usted; with tú the verb becomes estás: ¿Cómo estás?", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson01.translate.003
    lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Spanish greetings and small-talk words often carry accents (cómo, adiós, también); the accent shows the stressed syllable.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson02.listen.001
    lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *greeting}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Buenos días is used until about midday, buenas tardes in the afternoon, and buenas noches in the evening and at night.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson02.match.002
    lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *words, second: *words, third: *words, fourth: *words, fifth: *words, sixth: *words}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Día is masculine (buenos días), while tarde and noche are feminine (buenas tardes, buenas noches).", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson02.order.003
    lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
    type: word_order
    frame: {text: "Adiós, hasta {item}.", language_code: es, direction: ltr}
    slots: {item: *luego}
    answer_derivation: {kind: render_frame, frame: {text: "Adiós, hasta {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Goodbye, see you later.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson03.order.001
    lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
    type: word_order
    frame: {text: "Hola, me llamo {name}.", language_code: es, direction: ltr}
    slots: {name: *name}
    answer_derivation: {kind: render_frame, frame: {text: "Hola, me llamo {name}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Me llamo literally means I call myself; it is the everyday way to give your name.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson03.translate.002
    lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
    type: translation
    frame: {text: "This is {name}. (introducing a man)", language_code: en, direction: ltr, slot_rendering: {name: token}}
    slots: {name: *name_m}
    answer_derivation: {kind: render_frame, frame: {text: "Este es {name}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Use este to introduce a man and esta to introduce a woman: Esta es Ana.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson03.order.003
    lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
    type: word_order
    frame: {text: "Esta es {name}.", language_code: es, direction: ltr}
    slots: {name: *name_f}
    answer_derivation: {kind: render_frame, frame: {text: "Esta es {name}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Esta introduces a woman; for a man you say este: Este es Carlos.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson03.fill.004
    lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
    type: fill_in_blank
    frame: {text: "Mucho {item}. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *gusto, hint: *gusto}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mucho gusto means nice to meet you; the usual reply is igualmente, likewise.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson04.order.001
    lesson_content_key: es.a1.unit01.lesson04.origin_and_language
    type: word_order
    frame: {text: "Soy de {place}, pero vivo en Londres.", language_code: es, direction: ltr}
    slots: {place: *country}
    answer_derivation: {kind: render_frame, frame: {text: "Soy de {place}, pero vivo en Londres.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Ser de + place says where you are from; vivir en + place says where you live now.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson04.translate.002
    lesson_content_key: es.a1.unit01.lesson04.origin_and_language
    type: translation
    frame: {text: "I am from {place}.", language_code: en, direction: ltr, slot_rendering: {place: english_gloss}}
    slots: {place: *country}
    answer_derivation: {kind: render_frame, frame: {text: "Soy de {place}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "To ask the same question: ¿De dónde eres? (informal) or ¿De dónde es usted? (formal).", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson04.fill.003
    lesson_content_key: es.a1.unit01.lesson04.origin_and_language
    type: fill_in_blank
    frame: {text: "Todavía estoy {item}. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *aprendiendo, hint: *aprendiendo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Estoy + -ando/-iendo describes something in progress right now, like I am still learning.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson05.order.001
    lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
    type: word_order
    frame: {text: "Sí, es mi primera {item} aquí.", language_code: es, direction: ltr}
    slots: {item: *vez}
    answer_derivation: {kind: render_frame, frame: {text: "Sí, es mi primera {item} aquí.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Yes, it is my first time here.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson05.translate.002
    lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
    type: translation
    frame: {text: "Do you like cooking? (informal)", language_code: en, direction: ltr}
    slots: {item: *cocinar}
    answer_derivation: {kind: render_frame, frame: {text: "¿Te gusta {item}?", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish says what you like with gustar: the activity pleases you, so te gusta + infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson06.listen.001
    lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *content}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Elena and Mateo use tú with each other because they are peers at the same workshop.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit01.lesson06.translate.002
    lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *content}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Spanish drops subject pronouns when the verb ending already shows the person: vivo means I live.", language_code: en, direction: ltr}
