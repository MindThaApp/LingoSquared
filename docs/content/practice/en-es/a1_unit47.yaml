schema_version: '1.0'
pack_key: practice.en-es.a1.unit47
source_language: en
target_language: es
unit_content_key: es.a1.unit47.communication
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_a1_u47 / w_<token>). 17 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_contarte, w_devuelvo, w_envío, w_esperado, w_esperar, w_hables, w_hablo, w_llamada, w_llamarme, w_llamarte, w_mensaje, w_minutos, w_oigo, w_oír, w_rápido, w_significa, w_turno]
templates:
- content_key: practice.en-es.es.a1.unit47.lesson01.choose.001
  lesson_content_key: es.a1.unit47.lesson01.te_llamo
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_llamarte, w_hablo, w_hables, w_rápido, w_oigo, w_mensaje, w_envío, w_llamarme, w_contarte, w_devuelvo, w_llamada, w_minutos, w_turno, w_esperado, w_esperar, w_oír, w_significa]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i''ll call you.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson02.listen.001
  lesson_content_key: es.a1.unit47.lesson02.con_quien_hablo
  type: listen_select
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on who am i speaking with?.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson03.translate.001
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on can you repeat that?.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson04.match.001
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: es, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Spanish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson05.choose.001
  lesson_content_key: es.a1.unit47.lesson05.leer_una_conversacion_de
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a text exchange.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson06.translate.001
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a phone call after the shift.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson01.order.002
  lesson_content_key: es.a1.unit47.lesson01.te_llamo
  type: word_order
  frame: {text: 'Tengo que {item}.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_llamarte}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Tengo que {item}.', language_code: es, direction: ltr}
  feedback_frame: {text: I have to call you. llamarte means to call you., language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson02.order.002
  lesson_content_key: es.a1.unit47.lesson02.con_quien_hablo
  type: word_order
  frame: {text: '¿Con quién {item}?', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_hablo}
  answer_derivation:
    kind: render_frame
    frame: {text: '¿Con quién {item}?', language_code: es, direction: ltr}
  feedback_frame: {text: 'Who am I speaking with? ¿Con quién hablo? is the standard phrase when you do not know who is calling.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson03.order.002
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: word_order
  frame: {text: 'No {item} tan rápido, por favor.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_hables}
  answer_derivation:
    kind: render_frame
    frame: {text: 'No {item} tan rápido, por favor.', language_code: es, direction: ltr}
  feedback_frame: {text: 'Don''t speak so fast, please. No hables is the negative informal command of hablar; tan rápido (so fast) gives the degree.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson03.fill.003
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: fill_in_blank
  frame:
    text: No te {item} bien. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_oigo}
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_oigo}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I can''t hear you well. Oír (to hear) with no ... bien (not well) states a hearing problem, distinct from entender (to understand); te oigo means "I hear you".', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson04.order.002
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: word_order
  frame: {text: 'El {item} es de Elena.', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_mensaje}
  answer_derivation:
    kind: render_frame
    frame: {text: 'El {item} es de Elena.', language_code: es, direction: ltr}
  feedback_frame: {text: The text message is from Elena. mensaje means message; text message., language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson04.fill.003
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: fill_in_blank
  frame:
    text: Te {item} un mensaje. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_envío}
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_envío}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I''ll send you a text. Enviar (to send) comes after the pronoun te (to you): te envío un mensaje.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson06.order.002
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: word_order
  frame: {text: '¿Cómo ha ido tu primer {item}?', language_code: es, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags: {semantic: w_turno}
  answer_derivation:
    kind: render_frame
    frame: {text: '¿Cómo ha ido tu primer {item}?', language_code: es, direction: ltr}
  feedback_frame: {text: 'How was your first shift? Ha ido is the present perfect of ir (here "to turn out"): ha + the participle ido.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson06.fill.003
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: fill_in_blank
  frame:
    text: Ha ido muy bien, mejor de lo {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_esperado}
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_esperado}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'It went really well, better than I thought. Ha ido muy bien reuses the present perfect from the question; mejor de lo esperado (better than expected) compares with de lo.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit47.lesson06.translate.004
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame: {text: 'Thank you, that means a lot to me.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags: {semantic: w_significa}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Muchas gracias, eso {item} mucho para mí.', language_code: es, direction: ltr}
  feedback_frame: {text: 'Thank you, that means a lot to me. Significa is the third-person form of significar (to mean); para mí (for me) says who it matters to.', language_code: en, direction: ltr}
