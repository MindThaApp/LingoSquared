  lesson_content_key: es.a1.unit62.lesson01.la_cebolla_el_tomate
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_cebolla, w_tomate, w_cortar, w_sartén, w_freír, w_preparar, w_preparo, w_preparas, w_prepara, w_probar, w_prueba, w_cortamos, w_fríes, w_probando, w_cocinan, w_corta, w_fríe, w_rica, w_lista, w_preparamos]
