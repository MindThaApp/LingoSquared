schema_version: '1.0'
pack_key: practice.en-es.a1.unit62
source_language: en
target_language: es
unit_content_key: es.a1.unit62.koken
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_a1_u62 / w_<token>). 20 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_cebolla, w_cocinan, w_corta, w_cortamos, w_cortar, w_freír, w_fríe, w_fríes, w_lista, w_prepara, w_preparamos, w_preparar, w_preparas, w_preparo, w_probando, w_probar, w_prueba, w_rica, w_sartén, w_tomate]
templates:
