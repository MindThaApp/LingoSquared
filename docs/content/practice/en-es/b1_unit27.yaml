schema_version: "1.0"
pack_key: practice.en-es.b1.unit27
source_language: en
target_language: es
unit_content_key: es.b1.unit27.obligaciones
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-es B1 set) from scripts/backfill_lexemes_en_es.py (en-es-b1 course; w_<token> anchors, one token per sentence slot). Subjunctive after es necesario que / no esta permitido que / es obligatorio que, and tendria que haber + participle. Fill and order slots keep the subjunctive form as the single anchor. NATIVE FLAG: the hint gloss for entregue, entre and traiga explains the subjunctive in English; check the wording. Variants add usted and a moved adverb; debería haber is accepted as should have.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ayer, w_entre, w_entregado, w_entregar, w_entregue, w_formulario, w_hoy, w_necesario, w_obligatorio, w_original, w_permitido, w_sin, w_tendría, w_traiga]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: [w_formulario, w_entregar, w_necesario, w_permitido, w_ayer, w_entregado, w_original, w_obligatorio, w_hoy]}}
  p2: &p2 {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: [w_formulario, w_entregar, w_necesario, w_permitido, w_entregado, w_original, w_obligatorio, w_hoy]}}
  p3: &p3 {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: [w_formulario, w_entregar, w_necesario, w_permitido, w_ayer, w_entregado, w_original, w_obligatorio]}}
  p4: &p4 {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: [w_formulario, w_entregar, w_necesario, w_permitido, w_obligatorio, w_original, w_ayer, w_hoy]}}
  p5: &p5 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_entregue]}}
  p6: &p6 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_necesario]}}
  p7: &p7 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_formulario]}}
  p8: &p8 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_hoy]}}
  p9: &p9 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_permitido]}}
  p10: &p10 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_entre]}}
  p11: &p11 {language_code: es, part_of_speech: [preposition], agreement_tags: {semantic: [w_sin]}}
  p12: &p12 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_entregado]}}
  p13: &p13 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_ayer]}}
  p14: &p14 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_tendría]}}
  p15: &p15 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_obligatorio]}}
  p16: &p16 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_traiga]}}
  p17: &p17 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_original]}}
templates:
  - content_key: practice.en-es.es.b1.unit27.lesson01.choose.001
    lesson_content_key: es.b1.unit27.lesson01.formulario_hoy
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the office notice about forms and appointments.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson01.listen.001
    lesson_content_key: es.b1.unit27.lesson01.formulario_hoy
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the notice about the form.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson04.translate.001
    lesson_content_key: es.b1.unit27.lesson04.aviso_y_mensaje
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the notice.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson04.match.001
    lesson_content_key: es.b1.unit27.lesson04.aviso_y_mensaje
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p4, second: *p4, third: *p4, fourth: *p4, fifth: *p4, sixth: *p4}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the notice vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson01.translate.001
    lesson_content_key: es.b1.unit27.lesson01.formulario_hoy
    type: translation
    frame: {text: "It is necessary that you hand in the form today. (formal)", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Es necesario que {item} el formulario hoy.", language_code: es, direction: ltr}, accepted_variants: ["Es necesario que usted {item} el formulario hoy.", "Hoy es necesario que {item} el formulario."]}
    feedback_frame: {text: "After es necesario que, Spanish uses the subjunctive: entregue.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson01.fill.001
    lesson_content_key: es.b1.unit27.lesson01.formulario_hoy
    type: fill_in_blank
    frame: {text: "Es {item} que entregue el formulario hoy. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Es necesario que introduces an obligation.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson01.order.001
    lesson_content_key: es.b1.unit27.lesson01.formulario_hoy
    type: word_order
    frame: {text: "Es necesario que entregue el {item} hoy.", language_code: es, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Es necesario que entregue el {item} hoy.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Formulario is masculine: el formulario.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson01.fill.002
    lesson_content_key: es.b1.unit27.lesson01.formulario_hoy
    type: fill_in_blank
    frame: {text: "Es necesario que entregue el formulario {item}. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Hoy closes the sentence and says when.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson02.translate.001
    lesson_content_key: es.b1.unit27.lesson02.prohibicion
    type: translation
    frame: {text: "It is not allowed for you to enter without an appointment. (formal)", language_code: en, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "No está {item} que entre sin cita.", language_code: es, direction: ltr}, accepted_variants: ["No está {item} que usted entre sin cita."]}
    feedback_frame: {text: "No está permitido que is followed by the subjunctive.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson02.fill.001
    lesson_content_key: es.b1.unit27.lesson02.prohibicion
    type: fill_in_blank
    frame: {text: "No está permitido que {item} sin cita. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p10, hint: *p10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Entre is the subjunctive of entrar.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson02.fill.002
    lesson_content_key: es.b1.unit27.lesson02.prohibicion
    type: fill_in_blank
    frame: {text: "No está permitido que entre {item} cita. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Sin cita means without an appointment, with no article.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson03.translate.001
    lesson_content_key: es.b1.unit27.lesson03.regret_ayer
    type: translation
    frame: {text: "I should have handed in the form yesterday.", language_code: en, direction: ltr}
    slots: {item: *p12}
    answer_derivation: {kind: render_frame, frame: {text: "Tendría que haber {item} el formulario ayer.", language_code: es, direction: ltr}, accepted_variants: ["Debería haber {item} el formulario ayer.", "Ayer tendría que haber {item} el formulario."]}
    feedback_frame: {text: "Tendría que haber plus a participle expresses a past obligation not met.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson03.fill.001
    lesson_content_key: es.b1.unit27.lesson03.regret_ayer
    type: fill_in_blank
    frame: {text: "Tendría que haber entregado el formulario {item}. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p13, hint: *p13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ayer places the missed obligation in the past.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson03.order.001
    lesson_content_key: es.b1.unit27.lesson03.regret_ayer
    type: word_order
    frame: {text: "{item} que haber entregado el formulario ayer.", language_code: es, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "{item} que haber entregado el formulario ayer.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Tendría que is followed by haber and a participle.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson04.translate.002
    lesson_content_key: es.b1.unit27.lesson04.aviso_y_mensaje
    type: translation
    frame: {text: "It is mandatory that you bring the original document. (formal)", language_code: en, direction: ltr}
    slots: {item: *p15}
    answer_derivation: {kind: render_frame, frame: {text: "Es {item} que traiga el documento original.", language_code: es, direction: ltr}, accepted_variants: ["Es {item} que usted traiga el documento original."]}
    feedback_frame: {text: "Obligatorio works like necesario before que.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson04.fill.001
    lesson_content_key: es.b1.unit27.lesson04.aviso_y_mensaje
    type: fill_in_blank
    frame: {text: "Es obligatorio que {item} el documento original. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p16, hint: *p16}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Traiga is the subjunctive of traer.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson04.order.001
    lesson_content_key: es.b1.unit27.lesson04.aviso_y_mensaje
    type: word_order
    frame: {text: "Es obligatorio que traiga el documento {item}.", language_code: es, direction: ltr}
    slots: {item: *p17}
    answer_derivation: {kind: render_frame, frame: {text: "Es obligatorio que traiga el documento {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "The adjective follows the noun: documento original.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit27.lesson04.choose.001
    lesson_content_key: es.b1.unit27.lesson04.aviso_y_mensaje
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
