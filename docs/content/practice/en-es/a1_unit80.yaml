schema_version: '1.0'
pack_key: practice.en-es.a1.unit80
source_language: en
target_language: es
unit_content_key: es.a1.unit80.dierentuin
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_a1_u80 / w_<token>). 9 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_barco, w_dieciséis, w_elefante, w_entradas, w_jirafa, w_leones, w_león, w_mono, w_pesado]
templates:
- content_key: practice.en-es.es.a1.unit80.lesson02.choose.001
  lesson_content_key: es.a1.unit80.lesson02.el_leon_y_el
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_león, w_elefante, w_pesado, w_mono, w_jirafa, w_leones, w_entradas, w_dieciséis, w_barco]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the lion and the elephant.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit80.lesson03.listen.001
  lesson_content_key: es.a1.unit80.lesson03.el_mono_y_la
  type: listen_select
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the monkey and the giraffe.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.a1.unit80.lesson04.translate.001
