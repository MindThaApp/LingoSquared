schema_version: "1.0"
pack_key: practice.en-es.a2.unit21
source_language: en
target_language: es
unit_content_key: es.a2.unit21.entrevista
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-es A2 set) from scripts/backfill_lexemes_en_es.py lexemes (es_a2_uNN* tags, w_<token> anchors). Job-interview vocabulary with formal usted; "puesto" is glossed as position here (A1 taught market stall) and "hace" as ago. NATIVE FLAG: currículum is written with the accent in Spanish; Latin America also says CV or hoja de vida.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_entrevista, w_puesto, w_horario, w_experiencia, w_currículum, w_oportunidad, w_profesor, w_escuela, w_presentarme, w_hace, w_enseño, w_interesa, w_ocho, w_profesora, w_interesados, w_lunes, w_busca, w_enviar, w_menos, w_presentó, w_explicó, w_preguntó, w_terminar, w_alguna, w_pregunta]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_entrevista, w_puesto, w_horario, w_experiencia, w_currículum, w_oportunidad, w_profesor, w_escuela]}}
  p2: &p2 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_presentarme]}}
  p3: &p3 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_puesto]}}
  p4: &p4 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_hace]}}
  p5: &p5 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_enseño]}}
  p6: &p6 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_interesa]}}
  p7: &p7 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_escuela]}}
  p8: &p8 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_horario]}}
  p9: &p9 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_ocho]}}
  p10: &p10 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_profesor, w_profesora, w_experiencia, w_interesados, w_currículum, w_lunes]}}
  p11: &p11 {language_code: es, part_of_speech: [adverb, noun, verb], agreement_tags: {semantic: [w_busca, w_enviar, w_currículum, w_experiencia, w_interesados, w_menos]}}
  p12: &p12 {language_code: es, part_of_speech: [noun, pronoun, verb], agreement_tags: {semantic: [w_presentó, w_explicó, w_preguntó, w_terminar, w_alguna, w_oportunidad]}}
  p13: &p13 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_presentó]}}
  p14: &p14 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_pregunta, w_oportunidad, w_entrevista, w_horario, w_experiencia, w_profesor]}}
templates:
  - content_key: practice.en-es.es.a2.unit21.lesson01.choose.001
    lesson_content_key: es.a2.unit21.lesson01.me_gustaria_presentarme
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These nouns come from Elena's job interview.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson01.fill.002
    lesson_content_key: es.a2.unit21.lesson01.me_gustaria_presentarme
    type: fill_in_blank
    frame: {text: "Me gustaría {item}. Soy Elena. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Presentarse is reflexive; with me gustaría it becomes presentarme.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson01.translate.003
    lesson_content_key: es.a2.unit21.lesson01.me_gustaria_presentarme
    type: translation
    frame: {text: "This position interests me a lot.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Este {item} me interesa mucho.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Interesar works like gustar: the thing that interests you is the subject.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson01.listen.004
    lesson_content_key: es.a2.unit21.lesson01.me_gustaria_presentarme
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard is a noun from the interview.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson02.fill.001
    lesson_content_key: es.a2.unit21.lesson02.enseno_desde_hace_tres_anos
    type: fill_in_blank
    frame: {text: "Enseño desde {item} tres años. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Desde hace plus a length of time says how long something has been going on.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson02.translate.002
    lesson_content_key: es.a2.unit21.lesson02.enseno_desde_hace_tres_anos
    type: translation
    frame: {text: "I have been teaching for three years.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Yo {item} desde hace tres años.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish uses the present tense with desde hace for an activity that is still going on.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson03.fill.001
    lesson_content_key: es.a2.unit21.lesson03.por_que_le_interesa
    type: fill_in_blank
    frame: {text: "¿Por qué le {item} este puesto? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Le is the formal you; interesa agrees with the thing that interests, este puesto.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson03.order.002
    lesson_content_key: es.a2.unit21.lesson03.por_que_le_interesa
    type: word_order
    frame: {text: "Me interesa porque la {item} está más cerca de mi casa.", language_code: es, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Me interesa porque la {item} está más cerca de mi casa.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Escuela is feminine, so it takes la.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson04.translate.001
    lesson_content_key: es.a2.unit21.lesson04.cual_es_el_horario
    type: translation
    frame: {text: "What is the work schedule?", language_code: en, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "¿Cuál es el {item} de trabajo?", language_code: es, direction: ltr}}
    feedback_frame: {text: "Horario is the schedule of working or opening hours.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson04.order.002
    lesson_content_key: es.a2.unit21.lesson04.cual_es_el_horario
    type: word_order
    frame: {text: "El horario es de {item} de la mañana a tres de la tarde.", language_code: es, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "El horario es de {item} de la mañana a tres de la tarde.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish says de la mañana and de la tarde for a.m. and p.m.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson05.match.001
    lesson_content_key: es.a2.unit21.lesson05.leer_el_anuncio
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p10, second: *p10, third: *p10, fourth: *p10, fifth: *p10, sixth: *p10}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The job advert lists who is wanted and what to send.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson05.choose.002
    lesson_content_key: es.a2.unit21.lesson05.leer_el_anuncio
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The advert uses these words to describe what is needed.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson06.choose.001
    lesson_content_key: es.a2.unit21.lesson06.la_entrevista_de_elena
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p12}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The summary retells Elena's interview in the past.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson06.fill.002
    lesson_content_key: es.a2.unit21.lesson06.la_entrevista_de_elena
    type: fill_in_blank
    frame: {text: "Elena se {item} y explicó su experiencia. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p13, hint: *p13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Presentó is the past tense of presentarse for he or she.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit21.lesson06.translate.003
    lesson_content_key: es.a2.unit21.lesson06.la_entrevista_de_elena
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p14}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These nouns come from the end of the interview.", language_code: en, direction: ltr}
