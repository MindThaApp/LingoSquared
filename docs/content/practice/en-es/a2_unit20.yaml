schema_version: "1.0"
pack_key: practice.en-es.a2.unit20
source_language: en
target_language: es
unit_content_key: es.a2.unit20.mantenimiento
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-es A2 set) from scripts/backfill_lexemes_en_es.py lexemes (es_a2_uNN* tags, w_<token> anchors). Home-repair vocabulary; Mateo writes to the landlady with usted. Weekdays use one shared pool because every weekday fits the same frame. NATIVE FLAG: plomero is Latin American; Spain says fontanero. The unit text uses plomero, so the pack follows it.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_calentador, w_gotera, w_plomero, w_baño, w_problema, w_técnico, w_visita, w_casera, w_mañana, w_funciona, w_empeorando, w_pronto, w_ahí, w_estaré, w_revisemos, w_lunes, w_martes, w_jueves, w_viernes, w_hora, w_tarde, w_disponible, w_reportado, w_asignado, w_confirma, w_esté, w_esa, w_enviaré, w_enviará, w_reportó, w_rápida, w_ese]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_calentador, w_gotera, w_plomero, w_baño, w_problema, w_técnico, w_visita, w_casera]}}
  p2: &p2 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_calentador]}}
  p3: &p3 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_baño]}}
  p4: &p4 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_plomero]}}
  p5: &p5 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_mañana]}}
  p6: &p6 {language_code: es, part_of_speech: [adverb, verb], agreement_tags: {semantic: [w_funciona, w_empeorando, w_pronto, w_ahí, w_estaré]}}
  p7: &p7 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_revisemos]}}
  p8: &p8 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_pronto]}}
  p9: &p9 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_lunes, w_martes, w_jueves, w_viernes]}}
  p10: &p10 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_estaré]}}
  p11: &p11 {language_code: es, part_of_speech: [adjective, noun], agreement_tags: {semantic: [w_problema, w_técnico, w_visita, w_hora, w_tarde, w_disponible]}}
  p12: &p12 {language_code: es, part_of_speech: [adjective, pronoun, verb], agreement_tags: {semantic: [w_reportado, w_asignado, w_confirma, w_esté, w_disponible, w_esa]}}
  p13: &p13 {language_code: es, part_of_speech: [adjective, noun, pronoun, verb], agreement_tags: {semantic: [w_enviaré, w_enviará, w_reportó, w_casera, w_rápida, w_ese]}}
  p14: &p14 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_problema, w_técnico, w_visita, w_casera, w_calentador, w_gotera]}}
templates:
  - content_key: practice.en-es.es.a2.unit20.lesson01.choose.001
    lesson_content_key: es.a2.unit20.lesson01.no_funciona
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These nouns come from Mateo's report to the landlady.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson01.fill.002
    lesson_content_key: es.a2.unit20.lesson01.no_funciona
    type: fill_in_blank
    frame: {text: "El {item} no funciona. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Funcionar is the usual verb for a machine or appliance that works.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson01.translate.003
    lesson_content_key: es.a2.unit20.lesson01.no_funciona
    type: translation
    frame: {text: "There is a leak in the bathroom.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Hay una gotera en el {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Hay is used for both singular and plural: hay una gotera.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson01.order.004
    lesson_content_key: es.a2.unit20.lesson01.no_funciona
    type: word_order
    frame: {text: "Necesito llamar a un {item}.", language_code: es, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Necesito llamar a un {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Llamar a is followed by the person you call.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson01.listen.005
    lesson_content_key: es.a2.unit20.lesson01.no_funciona
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard is a noun from the repair scene.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson02.fill.001
    lesson_content_key: es.a2.unit20.lesson02.hay_una_gotera
    type: fill_in_blank
    frame: {text: "Desde esta {item}, y está empeorando. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p5, hint: *p5}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Esta mañana means this morning; the same word also means tomorrow.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson02.choose.002
    lesson_content_key: es.a2.unit20.lesson02.hay_una_gotera
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mateo describes the problem and when it started.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson03.translate.001
    lesson_content_key: es.a2.unit20.lesson03.desde_cuando_gotera
    type: translation
    frame: {text: "It is necessary that we check it soon.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Es necesario que la {item} pronto.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Es necesario que is followed by the subjunctive: revisemos.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson03.order.002
    lesson_content_key: es.a2.unit20.lesson03.desde_cuando_gotera
    type: word_order
    frame: {text: "Es necesario que la revisemos {item}.", language_code: es, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "Es necesario que la revisemos {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Pronto means soon; it can also come at the start of a sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson04.order.001
    lesson_content_key: es.a2.unit20.lesson04.podria_venir_jueves
    type: word_order
    frame: {text: "¿Podría venir el {item} a las tres?", language_code: es, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "¿Podría venir el {item} a las tres?", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish uses el before a weekday to mean on that day.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson04.translate.002
    lesson_content_key: es.a2.unit20.lesson04.podria_venir_jueves
    type: translation
    frame: {text: "Yes, I will be there on Thursday at three.", language_code: en, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Sí, ahí {item} el jueves a las tres.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Estaré is the future of estar: I will be.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson05.match.001
    lesson_content_key: es.a2.unit20.lesson05.leer_la_confirmacion
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p11, second: *p11, third: *p11, fourth: *p11, fifth: *p11, sixth: *p11}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The confirmation lists the problem, the visit and the time.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson05.choose.002
    lesson_content_key: es.a2.unit20.lesson05.leer_la_confirmacion
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p12}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The confirmation message uses these words.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson06.choose.001
    lesson_content_key: es.a2.unit20.lesson06.mateo_llama_a_la_casera
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p13}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The landlady and Mateo arrange the visit with these words.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit20.lesson06.translate.002
    lesson_content_key: es.a2.unit20.lesson06.mateo_llama_a_la_casera
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p14}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The landlady and Mateo talk about these things.", language_code: en, direction: ltr}
