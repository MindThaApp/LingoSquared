schema_version: "1.0"
pack_key: practice.en-es.a1.unit13
source_language: en
target_language: es
unit_content_key: es.a1.unit13.work
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-es reference set) from
    scripts/backfill_lexemes_en_es.py lexemes (es_a1_u13* tags, w_<token>
    anchors). Job sentences use single anchors (Mateo is the accountant,
    Elena the teacher, per the unit's reading).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [es_a1_u13, es_a1_u13_l01, w_contador, w_profesora, w_trabajas, w_esto, w_trabaja, w_enseña, w_contigo]
slot_presets:
  work: &work {language_code: es, part_of_speech: [noun, verb], agreement_tags: {semantic: es_a1_u13_l01}}
  nouns: &nouns {language_code: es, part_of_speech: noun, agreement_tags: {semantic: es_a1_u13}}
  content: &content {language_code: es, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: es_a1_u13}}
  verbs: &verbs {language_code: es, part_of_speech: [verb, adjective, adverb], agreement_tags: {semantic: es_a1_u13}}
  contador: &contador {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_contador}}
  profesora: &profesora {language_code: es, part_of_speech: noun, agreement_tags: {semantic: w_profesora}}
  trabajas: &trabajas {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_trabajas}}
  esto: &esto {language_code: es, part_of_speech: pronoun, agreement_tags: {semantic: w_esto}}
  trabaja: &trabaja {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_trabaja}}
  ensena: &ensena {language_code: es, part_of_speech: verb, agreement_tags: {semantic: w_enseña}}
  contigo: &contigo {language_code: es, part_of_speech: pronoun, agreement_tags: {semantic: w_contigo}}
templates:
  - content_key: practice.en-es.es.a1.unit13.lesson01.choose.001
    lesson_content_key: es.a1.unit13.lesson01.el_trabajo_vocabulario
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *work}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Trabajo is both the noun job and the verb form I work.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit13.lesson01.listen.002
    lesson_content_key: es.a1.unit13.lesson01.el_trabajo_vocabulario
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *nouns}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Escritorio is a desk; an office is una oficina.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit13.lesson02.translate.001
    lesson_content_key: es.a1.unit13.lesson02.las_profesiones
    type: translation
    frame: {text: "I'm an accountant.", language_code: en, direction: ltr}
    slots: {item: *contador}
    answer_derivation: {kind: render_frame, frame: {text: "Soy {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish drops the article before a job after ser: soy contador, not soy un contador.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit13.lesson02.order.002
    lesson_content_key: es.a1.unit13.lesson02.las_profesiones
    type: word_order
    frame: {text: "Yo soy {item}. Enseño en una escuela.", language_code: es, direction: ltr}
    slots: {item: *profesora}
    answer_derivation: {kind: render_frame, frame: {text: "Yo soy {item}. Enseño en una escuela.", language_code: es, direction: ltr}}
    feedback_frame: {text: "I'm a teacher. I teach at a school. A male teacher is un profesor.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit13.lesson03.fill.001
    lesson_content_key: es.a1.unit13.lesson03.en_que_trabajas
    type: fill_in_blank
    frame: {text: "¿En qué {item}? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *trabajas, hint: *trabajas}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "¿En qué trabajas? literally asks in what do you work, meaning what is your job.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit13.lesson04.translate.001
    lesson_content_key: es.a1.unit13.lesson04.prefiero_cocinar
    type: translation
    frame: {text: "We both prefer this.", language_code: en, direction: ltr}
    slots: {item: *esto}
    answer_derivation: {kind: render_frame, frame: {text: "Los dos preferimos {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Los dos means both of us here; esto refers to an idea or thing without naming it.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit13.lesson05.order.001
    lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
    type: word_order
    frame: {text: "Mateo {item} en una oficina en Londres.", language_code: es, direction: ltr}
    slots: {item: *trabaja}
    answer_derivation: {kind: render_frame, frame: {text: "Mateo {item} en una oficina en Londres.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Mateo works in an office in London. Trabajar en + place says where someone works.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit13.lesson05.order.002
    lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
    type: word_order
    frame: {text: "Elena {item} en una escuela.", language_code: es, direction: ltr}
    slots: {item: *ensena}
    answer_derivation: {kind: render_frame, frame: {text: "Elena {item} en una escuela.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Elena teaches at a school. Enseñar is to teach; aprender is to learn.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit13.lesson05.match.003
    lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *content, second: *content, third: *content, fourth: *content, fifth: *content, sixth: *content}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "A los dos les gusta su trabajo: les marks who the liking belongs to, them.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit13.lesson06.translate.001
    lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *content}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Many work words are close to English: oficina, estudiantes, interesante.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit13.lesson06.fill.002
    lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
    type: fill_in_blank
    frame: {text: "Prefiero cocinar {item} los martes. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *contigo, hint: *contigo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Con + ti becomes one word, contigo; with me is conmigo.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a1.unit13.lesson06.choose.003
    lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *verbs}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Preferir changes e to ie in most forms (prefiero, prefieren) but not in preferimos.", language_code: en, direction: ltr}
