schema_version: "1.0"
pack_key: practice.en-es.a2.unit19
source_language: en
target_language: es
unit_content_key: es.a2.unit19.medico
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-es A2 set) from scripts/backfill_lexemes_en_es.py lexemes (es_a2_uNN* tags, w_<token> anchors). Health vocabulary; the advice sentences use the subjunctive after "le recomiendo que" and "es importante que". "mal" and "mañana" keep their A1 glosses. NATIVE FLAG: pastillas is common in Spain and Mexico; some regions also say tabletas or comprimidos.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_dolor, w_cabeza, w_fiebre, w_consultorio, w_pastillas, w_agua, w_síntoma, w_duele, w_sí, w_poco, w_ayer, w_mal, w_solo, w_pasa, w_explicarme, w_descanse, w_beba, w_recomiendo, w_tome, w_mucha, w_recomendación, w_paciente, w_descansar, w_síntomas, w_doctora, w_tenía, w_recomendó, w_descansara, w_bebiera, w_otra]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_dolor, w_cabeza, w_fiebre, w_consultorio, w_pastillas, w_agua, w_síntoma]}}
  p2: &p2 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_duele]}}
  p3: &p3 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_fiebre]}}
  p4: &p4 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_cabeza]}}
  p5: &p5 {language_code: es, part_of_speech: [adverb, particle], agreement_tags: {semantic: [w_sí, w_poco, w_ayer, w_mal, w_solo]}}
  p6: &p6 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_pasa]}}
  p7: &p7 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_explicarme]}}
  p8: &p8 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_descanse]}}
  p9: &p9 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_beba]}}
  p10: &p10 {language_code: es, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_recomiendo, w_descanse, w_tome, w_beba, w_pastillas, w_mucha]}}
  p11: &p11 {language_code: es, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_pastillas, w_síntoma, w_recomendación, w_paciente, w_descansar, w_fiebre]}}
  p12: &p12 {language_code: es, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_paciente, w_síntoma, w_recomendación, w_síntomas, w_descansar, w_pastillas, w_dolor, w_fiebre]}}
  p13: &p13 {language_code: es, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_doctora, w_tenía, w_recomendó, w_descansara, w_bebiera, w_otra]}}
  p14: &p14 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_recomendó]}}
  p15: &p15 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_doctora, w_paciente, w_consultorio, w_síntoma, w_recomendación]}}
templates:
  - content_key: practice.en-es.es.a2.unit19.lesson01.choose.001
    lesson_content_key: es.a2.unit19.lesson01.me_duele_la_cabeza
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These nouns come from Elena's visit to the doctor.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson01.fill.002
    lesson_content_key: es.a2.unit19.lesson01.me_duele_la_cabeza
    type: fill_in_blank
    frame: {text: "Me {item} la cabeza desde ayer. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Doler works like gustar: la cabeza is the subject, so Spanish says me duele.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson01.translate.003
    lesson_content_key: es.a2.unit19.lesson01.me_duele_la_cabeza
    type: translation
    frame: {text: "I have a fever.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Tengo {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Spanish says tener fiebre (to have fever), with no article.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson01.order.004
    lesson_content_key: es.a2.unit19.lesson01.me_duele_la_cabeza
    type: word_order
    frame: {text: "Tengo un dolor de {item}.", language_code: es, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Tengo un dolor de {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Dolor de cabeza is a headache; dolor de is followed by the body part.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson01.listen.005
    lesson_content_key: es.a2.unit19.lesson01.me_duele_la_cabeza
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard is a noun from the doctor's visit.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson02.choose.001
    lesson_content_key: es.a2.unit19.lesson02.desde_cuando_le_duele
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Elena answers the doctor's questions with short words like these.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson02.translate.002
    lesson_content_key: es.a2.unit19.lesson02.desde_cuando_le_duele
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p5}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Elena answers the doctor's questions with short words like these.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson03.fill.001
    lesson_content_key: es.a2.unit19.lesson03.en_el_consultorio
    type: fill_in_blank
    frame: {text: "¿Qué le {item}? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "¿Qué le pasa? is the usual way to ask what is wrong with someone you address as usted.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson03.order.002
    lesson_content_key: es.a2.unit19.lesson03.en_el_consultorio
    type: word_order
    frame: {text: "Entiendo, gracias por {item}.", language_code: es, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Entiendo, gracias por {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Por is followed by an infinitive: gracias por explicarme.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson03.translate.003
    lesson_content_key: es.a2.unit19.lesson03.en_el_consultorio
    type: translation
    frame: {text: "Thank you for explaining it to me.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Gracias por {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "The pronoun me attaches to the end of the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson04.fill.001
    lesson_content_key: es.a2.unit19.lesson04.le_recomiendo_que
    type: fill_in_blank
    frame: {text: "Le recomiendo que {item} y tome estas pastillas. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Le recomiendo que is followed by the subjunctive: descanse, not descansa.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson04.translate.002
    lesson_content_key: es.a2.unit19.lesson04.le_recomiendo_que
    type: translation
    frame: {text: "It is important that you drink a lot of water.", language_code: en, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Es importante que {item} mucha agua.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Es importante que is followed by the subjunctive: beba.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson04.choose.003
    lesson_content_key: es.a2.unit19.lesson04.le_recomiendo_que
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The doctor's advice uses the subjunctive after le recomiendo que.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson05.match.001
    lesson_content_key: es.a2.unit19.lesson05.leer_el_resumen
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p11, second: *p11, third: *p11, fourth: *p11, fifth: *p11, sixth: *p11}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The doctor's summary lists symptoms and recommendations.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson05.translate.002
    lesson_content_key: es.a2.unit19.lesson05.leer_el_resumen
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The doctor's summary uses these words.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson06.choose.001
    lesson_content_key: es.a2.unit19.lesson06.la_cita_de_elena
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p13}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The grammar note retells the visit in the past.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson06.fill.002
    lesson_content_key: es.a2.unit19.lesson06.la_cita_de_elena
    type: fill_in_blank
    frame: {text: "La doctora le {item} que descansara. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p14, hint: *p14}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Recomendó is the past tense of recomendar for he or she.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.a2.unit19.lesson06.listen.003
    lesson_content_key: es.a2.unit19.lesson06.la_cita_de_elena
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p15}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard is a noun from the doctor's visit.", language_code: en, direction: ltr}
