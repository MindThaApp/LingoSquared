schema_version: "1.0"
pack_key: practice.en-es.b1.unit41
source_language: en
target_language: es
unit_content_key: es.b1.unit41.concesiones
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-es B1 set) from scripts/backfill_lexemes_en_es.py (en-es-b1 course; w_<token> anchors, one token per sentence slot). Weighing arguments: prefiero + infinitive, aunque (with the indicative here) for a concession, sin embargo for contrast. Only seven lexemes are new, so no matching template (fewer than six unit lexemes). Variants: reordered clauses and subject pronoun. NATIVE FLAG: aunque + indicative states a known fact; with the subjunctive it would mean a possibility, which this unit does not teach.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ahorra, w_aunque, w_concentrarse, w_difícil, w_embargo, w_flexible, w_prefiero, w_trabajo]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [verb, adjective, noun], agreement_tags: {semantic: [w_prefiero, w_flexible, w_ahorra, w_difícil, w_concentrarse, w_trabajo]}}
  p2: &p2 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_prefiero]}}
  p3: &p3 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_flexible]}}
  p4: &p4 {language_code: es, part_of_speech: [particle], agreement_tags: {semantic: [w_aunque]}}
  p5: &p5 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_ahorra]}}
  p6: &p6 {language_code: es, part_of_speech: [particle], agreement_tags: {semantic: [w_embargo]}}
  p7: &p7 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_difícil]}}
  p8: &p8 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_concentrarse]}}
templates:
  - content_key: practice.en-es.es.b1.unit41.lesson01.choose.001
    lesson_content_key: es.b1.unit41.lesson01.prefiero_oficina
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the debate about working from home.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson01.listen.001
    lesson_content_key: es.b1.unit41.lesson01.prefiero_oficina
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the debate.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson02.translate.001
    lesson_content_key: es.b1.unit41.lesson02.aunque_flexible
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the debate.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson01.translate.001
    lesson_content_key: es.b1.unit41.lesson01.prefiero_oficina
    type: translation
    frame: {text: "I prefer to work in the office.", language_code: en, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: render_frame, frame: {text: "{item} trabajar en la oficina.", language_code: es, direction: ltr}, accepted_variants: ["Yo {item} trabajar en la oficina."]}
    feedback_frame: {text: "Preferir is followed by the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson01.fill.001
    lesson_content_key: es.b1.unit41.lesson01.prefiero_oficina
    type: fill_in_blank
    frame: {text: "{item} trabajar en la oficina. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Prefiero plus an infinitive says what you prefer to do.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson02.translate.002
    lesson_content_key: es.b1.unit41.lesson02.aunque_flexible
    type: translation
    frame: {text: "Although working from home is more flexible, I prefer the office.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Aunque trabajar desde casa es más {item}, prefiero la oficina.", language_code: es, direction: ltr}, accepted_variants: ["Prefiero la oficina, aunque trabajar desde casa es más {item}.", "Aunque trabajar desde casa es más {item}, yo prefiero la oficina."]}
    feedback_frame: {text: "Aunque introduces a concession.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson02.fill.001
    lesson_content_key: es.b1.unit41.lesson02.aunque_flexible
    type: fill_in_blank
    frame: {text: "{item} trabajar desde casa es más flexible, prefiero la oficina. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Aunque means although.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson02.fill.002
    lesson_content_key: es.b1.unit41.lesson02.aunque_flexible
    type: fill_in_blank
    frame: {text: "Aunque trabajar desde casa es más flexible, {item} la oficina. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p2, hint: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Prefiero is the present of preferir for yo.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson02.order.001
    lesson_content_key: es.b1.unit41.lesson02.aunque_flexible
    type: word_order
    frame: {text: "Aunque trabajar desde casa es más {item}, prefiero la oficina.", language_code: es, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Aunque trabajar desde casa es más {item}, prefiero la oficina.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Flexible has the same form for masculine and feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson03.translate.001
    lesson_content_key: es.b1.unit41.lesson03.sin_embargo_concentrarse
    type: translation
    frame: {text: "Working at home saves time. However, it is harder to concentrate.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "El trabajo en casa {item} tiempo. Sin embargo, es más difícil concentrarse.", language_code: es, direction: ltr}, accepted_variants: ["Trabajar en casa {item} tiempo. Sin embargo, es más difícil concentrarse."]}
    feedback_frame: {text: "Ahorrar tiempo means to save time.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson03.fill.001
    lesson_content_key: es.b1.unit41.lesson03.sin_embargo_concentrarse
    type: fill_in_blank
    frame: {text: "El trabajo en casa ahorra tiempo. Sin {item}, es más difícil concentrarse. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Sin embargo is a fixed phrase meaning however.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson03.fill.002
    lesson_content_key: es.b1.unit41.lesson03.sin_embargo_concentrarse
    type: fill_in_blank
    frame: {text: "El trabajo en casa ahorra tiempo. Sin embargo, es más {item} concentrarse. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Difícil carries an accent.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson03.order.001
    lesson_content_key: es.b1.unit41.lesson03.sin_embargo_concentrarse
    type: word_order
    frame: {text: "El trabajo en casa ahorra tiempo. Sin embargo, es más difícil {item}.", language_code: es, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "El trabajo en casa ahorra tiempo. Sin embargo, es más difícil {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Concentrarse is reflexive: the se attaches to the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit41.lesson04.choose.001
    lesson_content_key: es.b1.unit41.lesson04.el_debate_completo
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
