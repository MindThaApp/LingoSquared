review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_a1_u60 / w_<token>). 9 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_conoce, w_conocen, w_conocer, w_conozco, w_saluda, w_saludar, w_saludarme, w_supermercado, w_vecino]
templates:
- content_key: practice.en-es.es.a1.unit60.lesson01.choose.001
  lesson_content_key: es.a1.unit60.lesson01.el_barrio
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_supermercado, w_vecino, w_conocer, w_conozco, w_saludar, w_saludarme, w_saluda, w_conoce, w_conocen]
  answer_derivation: {kind: slot_gloss, slot: item}
