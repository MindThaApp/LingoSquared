  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_móvil, w_ordenador, w_internet, w_app, w_pronóstico, w_enviar, w_envía, w_lee, w_buscar, w_busco, w_busca, w_mañanas]
