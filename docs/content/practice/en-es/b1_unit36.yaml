schema_version: "1.0"
pack_key: practice.en-es.b1.unit36
source_language: en
target_language: es
unit_content_key: es.b1.unit36.consejos
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-es B1 set) from scripts/backfill_lexemes_en_es.py (en-es-b1 course; w_<token> anchors, one token per sentence slot). Advice: deberias + infinitive, por que no + present, and accepting advice with tienes razon + future. Variants: the adverbial time phrase moved to the front, and ir a + infinitive for the promise. NATIVE FLAG: the cansada forms assume a female speaker (Elena), as in the unit.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_cansada, w_deberías, w_descansas, w_dormir, w_dormiré, w_días, w_fin, w_muy, w_más, w_qué, w_razón, w_semana, w_todos]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_cansada, w_días, w_dormir, w_descansas, w_fin, w_semana, w_razón, w_dormiré, w_deberías]}}
  p2: &p2 {language_code: es, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_cansada, w_días, w_dormir, w_descansas, w_fin, w_semana, w_razón, w_dormiré]}}
  p3: &p3 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_cansada]}}
  p4: &p4 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_muy]}}
  p5: &p5 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_todos]}}
  p6: &p6 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_días]}}
  p7: &p7 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_deberías]}}
  p8: &p8 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_dormir]}}
  p9: &p9 {language_code: es, part_of_speech: [adverb], agreement_tags: {semantic: [w_más]}}
  p10: &p10 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_descansas]}}
  p11: &p11 {language_code: es, part_of_speech: [pronoun], agreement_tags: {semantic: [w_qué]}}
  p12: &p12 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_fin]}}
  p13: &p13 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_semana]}}
  p14: &p14 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_razón]}}
  p15: &p15 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_dormiré]}}
templates:
  - content_key: practice.en-es.es.b1.unit36.lesson01.choose.001
    lesson_content_key: es.b1.unit36.lesson01.el_problema
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from Elena's advice conversation.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson02.listen.001
    lesson_content_key: es.b1.unit36.lesson02.deberias
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the advice conversation.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson03.translate.001
    lesson_content_key: es.b1.unit36.lesson03.por_que_no
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the conversation.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson04.match.001
    lesson_content_key: es.b1.unit36.lesson04.la_respuesta_de_elena
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p2, second: *p2, third: *p2, fourth: *p2, fifth: *p2, sixth: *p2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the vocabulary of the advice.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson01.translate.001
    lesson_content_key: es.b1.unit36.lesson01.el_problema
    type: translation
    frame: {text: "I am very tired every day.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Estoy muy {item} todos los días.", language_code: es, direction: ltr}, accepted_variants: ["Todos los días estoy muy {item}."]}
    feedback_frame: {text: "Cansada is feminine because Elena is speaking.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson01.fill.001
    lesson_content_key: es.b1.unit36.lesson01.el_problema
    type: fill_in_blank
    frame: {text: "Estoy {item} cansada todos los días. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Muy goes before an adjective.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson01.fill.002
    lesson_content_key: es.b1.unit36.lesson01.el_problema
    type: fill_in_blank
    frame: {text: "Estoy muy cansada {item} los días. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p5, hint: *p5}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Todos los días means every day.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson01.order.001
    lesson_content_key: es.b1.unit36.lesson01.el_problema
    type: word_order
    frame: {text: "Estoy muy cansada todos los {item}.", language_code: es, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Estoy muy cansada todos los {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Día ends in -a but is masculine: los días.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson02.translate.001
    lesson_content_key: es.b1.unit36.lesson02.deberias
    type: translation
    frame: {text: "You should sleep more.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "{item} dormir más.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Deberías plus an infinitive gives advice.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson02.fill.001
    lesson_content_key: es.b1.unit36.lesson02.deberias
    type: fill_in_blank
    frame: {text: "Deberías {item} más. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Deberías is followed by the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson02.fill.002
    lesson_content_key: es.b1.unit36.lesson02.deberias
    type: fill_in_blank
    frame: {text: "Deberías dormir {item}. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Más means more.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson03.translate.002
    lesson_content_key: es.b1.unit36.lesson03.por_que_no
    type: translation
    frame: {text: "Why don't you rest on the weekend?", language_code: en, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "¿Por qué no {item} el fin de semana?", language_code: es, direction: ltr}}
    feedback_frame: {text: "¿Por qué no...? plus the present is a friendly suggestion.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson03.fill.001
    lesson_content_key: es.b1.unit36.lesson03.por_que_no
    type: fill_in_blank
    frame: {text: "¿Por {item} no descansas el fin de semana? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Por qué means why and has an accent.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson03.order.001
    lesson_content_key: es.b1.unit36.lesson03.por_que_no
    type: word_order
    frame: {text: "¿Por qué no descansas el {item} de semana?", language_code: es, direction: ltr}
    slots: {item: *p12}
    answer_derivation: {kind: render_frame, frame: {text: "¿Por qué no descansas el {item} de semana?", language_code: es, direction: ltr}}
    feedback_frame: {text: "El fin de semana means the weekend.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson03.fill.002
    lesson_content_key: es.b1.unit36.lesson03.por_que_no
    type: fill_in_blank
    frame: {text: "¿Por qué no descansas el fin de {item}? ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p13, hint: *p13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Semana is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson04.translate.001
    lesson_content_key: es.b1.unit36.lesson04.la_respuesta_de_elena
    type: translation
    frame: {text: "You are right, I will sleep more.", language_code: en, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "Tienes {item}, dormiré más.", language_code: es, direction: ltr}, accepted_variants: ["Tienes {item}, voy a dormir más."]}
    feedback_frame: {text: "Tener razón means to be right.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson04.fill.001
    lesson_content_key: es.b1.unit36.lesson04.la_respuesta_de_elena
    type: fill_in_blank
    frame: {text: "Tienes razón, {item} más. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p15, hint: *p15}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Dormiré is the future of dormir for yo.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit36.lesson04.choose.001
    lesson_content_key: es.b1.unit36.lesson04.la_respuesta_de_elena
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
