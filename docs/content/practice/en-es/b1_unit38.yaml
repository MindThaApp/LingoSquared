schema_version: "1.0"
pack_key: practice.en-es.b1.unit38
source_language: en
target_language: es
unit_content_key: es.b1.unit38.arrepentimientos
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-es B1 set) from scripts/backfill_lexemes_en_es.py (en-es-b1 course; w_<token> anchors, one token per sentence slot). Regret: deberia haber + participle, ojala + pluperfect subjunctive, and si + pluperfect subjunctive with habria sido. Variants accept tendria que haber and the -se subjunctive hubiese, plus the clause order reversed. NATIVE FLAG: Ojala hubiese hablado is accepted; confirm.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ayuda, w_debería, w_estudiado, w_examen, w_fácil, w_hablado, w_jefe, w_mi, w_ojalá, w_pedido, w_sido]
slot_presets:
  p1: &p1 {language_code: es, part_of_speech: [verb, noun, adjective], agreement_tags: {semantic: [w_estudiado, w_examen, w_hablado, w_jefe, w_pedido, w_ayuda, w_fácil, w_debería, w_sido]}}
  p2: &p2 {language_code: es, part_of_speech: [verb, noun, adjective], agreement_tags: {semantic: [w_estudiado, w_examen, w_hablado, w_jefe, w_pedido, w_ayuda, w_fácil, w_sido]}}
  p3: &p3 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_debería]}}
  p4: &p4 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_estudiado]}}
  p5: &p5 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_examen]}}
  p6: &p6 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_hablado]}}
  p7: &p7 {language_code: es, part_of_speech: [particle], agreement_tags: {semantic: [w_ojalá]}}
  p8: &p8 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_jefe]}}
  p9: &p9 {language_code: es, part_of_speech: [pronoun], agreement_tags: {semantic: [w_mi]}}
  p10: &p10 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_pedido]}}
  p11: &p11 {language_code: es, part_of_speech: [noun], agreement_tags: {semantic: [w_ayuda]}}
  p12: &p12 {language_code: es, part_of_speech: [verb], agreement_tags: {semantic: [w_sido]}}
  p13: &p13 {language_code: es, part_of_speech: [adjective], agreement_tags: {semantic: [w_fácil]}}
templates:
  - content_key: practice.en-es.es.b1.unit38.lesson01.choose.001
    lesson_content_key: es.b1.unit38.lesson01.deberia_haber
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on regrets.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson01.listen.001
    lesson_content_key: es.b1.unit38.lesson01.deberia_haber
    type: listen_select
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on regrets.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson02.translate.001
    lesson_content_key: es.b1.unit38.lesson02.ojala_hubiera
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson03.match.001
    lesson_content_key: es.b1.unit38.lesson03.habria_sido
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: es, direction: ltr}
    slots: {first: *p2, second: *p2, third: *p2, fourth: *p2, fifth: *p2, sixth: *p2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the vocabulary of the regrets.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson01.translate.001
    lesson_content_key: es.b1.unit38.lesson01.deberia_haber
    type: translation
    frame: {text: "I should have studied more for the exam.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "{item} haber estudiado más para el examen.", language_code: es, direction: ltr}, accepted_variants: ["Tendría que haber estudiado más para el examen."]}
    feedback_frame: {text: "Debería haber plus a participle expresses a regret.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson01.fill.001
    lesson_content_key: es.b1.unit38.lesson01.deberia_haber
    type: fill_in_blank
    frame: {text: "Debería haber {item} más para el examen. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The participle of estudiar is estudiado.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson01.order.001
    lesson_content_key: es.b1.unit38.lesson01.deberia_haber
    type: word_order
    frame: {text: "Debería haber estudiado más para el {item}.", language_code: es, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Debería haber estudiado más para el {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Examen is masculine and has no accent.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson02.translate.002
    lesson_content_key: es.b1.unit38.lesson02.ojala_hubiera
    type: translation
    frame: {text: "I wish I had spoken to my boss earlier.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Ojalá hubiera {item} con mi jefe antes.", language_code: es, direction: ltr}, accepted_variants: ["Ojalá hubiese {item} con mi jefe antes."]}
    feedback_frame: {text: "Ojalá plus hubiera and a participle wishes the past were different.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson02.fill.001
    lesson_content_key: es.b1.unit38.lesson02.ojala_hubiera
    type: fill_in_blank
    frame: {text: "{item} hubiera hablado con mi jefe antes. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ojalá expresses a wish.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson02.order.001
    lesson_content_key: es.b1.unit38.lesson02.ojala_hubiera
    type: word_order
    frame: {text: "Ojalá hubiera hablado con mi {item} antes.", language_code: es, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "Ojalá hubiera hablado con mi {item} antes.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Jefe is masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson02.fill.002
    lesson_content_key: es.b1.unit38.lesson02.ojala_hubiera
    type: fill_in_blank
    frame: {text: "Ojalá hubiera hablado con {item} jefe antes. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mi is the possessive before a noun.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson03.translate.001
    lesson_content_key: es.b1.unit38.lesson03.habria_sido
    type: translation
    frame: {text: "If I had asked for help, it would have been easier.", language_code: en, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Si hubiera {item} ayuda, habría sido más fácil.", language_code: es, direction: ltr}, accepted_variants: ["Si hubiese {item} ayuda, habría sido más fácil.", "Habría sido más fácil si hubiera {item} ayuda."]}
    feedback_frame: {text: "Si plus hubiera and a participle sets the unreal past condition.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson03.fill.001
    lesson_content_key: es.b1.unit38.lesson03.habria_sido
    type: fill_in_blank
    frame: {text: "Si hubiera pedido {item}, habría sido más fácil. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pedir ayuda means to ask for help.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson03.fill.002
    lesson_content_key: es.b1.unit38.lesson03.habria_sido
    type: fill_in_blank
    frame: {text: "Si hubiera pedido ayuda, habría {item} más fácil. ({hint})", language_code: es, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p12, hint: *p12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Sido is the participle of ser.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson03.order.001
    lesson_content_key: es.b1.unit38.lesson03.habria_sido
    type: word_order
    frame: {text: "Si hubiera pedido ayuda, habría sido más {item}.", language_code: es, direction: ltr}
    slots: {item: *p13}
    answer_derivation: {kind: render_frame, frame: {text: "Si hubiera pedido ayuda, habría sido más {item}.", language_code: es, direction: ltr}}
    feedback_frame: {text: "Más fácil means easier.", language_code: en, direction: ltr}
  - content_key: practice.en-es.es.b1.unit38.lesson04.choose.001
    lesson_content_key: es.b1.unit38.lesson04.el_arrepentimiento_completo
    type: multiple_choice
    frame: {text: "{item}", language_code: es, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pick the meaning of the word.", language_code: en, direction: ltr}
