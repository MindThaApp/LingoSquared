  lesson_content_key: es.b2.unit06.lesson02.opinion_matizada
  type: listen_select
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a qualified opinion.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit06.lesson03.translate.001
  lesson_content_key: es.b2.unit06.lesson03.responder_opinion_contraria
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on responding to an opposing view.', language_code: en, direction: ltr}
- content_key: practice.en-es.es.b2.unit06.lesson04.match.001
  lesson_content_key: es.b2.unit06.lesson04.los_dos_lados
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: es, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Spanish word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
