- content_key: practice.en-es.es.b2.unit06.lesson01.choose.001
  lesson_content_key: es.b2.unit06.lesson01.que_opinas
  type: multiple_choice
  frame: {text: '{item}', language_code: es, direction: ltr}
  slots:
    item: &id001
      language_code: es
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_espacio, w_espacios, w_público, w_públicos, w_plaza, w_cámaras, w_cámara, w_vigilancia, w_deben, w_instalarse, w_instalar, w_parecer, w_ayuda, w_diría, w_idea, w_cabe, w_seguridad, w_importa, w_general, w_ayudan, w_necesariamente, w_depende, w_situación, w_muchos, w_casos, w_funciona, w_privacidad, w_también, w_resuelve, w_comprendo, w_vista, w_pienso, w_diferente, w_comparto, w_confianza, w_afectar, w_parte, w_útil, w_preocupa, w_beneficio, w_beneficios, w_riesgo, w_comunidad, w_necesita, w_existe, w_mejora, w_preocupan, w_mayor, w_reglas, w_claras, w_crecer, w_afecta, w_afectan, w_vida, w_diaria]
