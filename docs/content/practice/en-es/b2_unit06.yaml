schema_version: '1.0'
pack_key: practice.en-es.b2.unit06
source_language: en
target_language: es
unit_content_key: es.b2.unit06.abstraccion
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-es backfill lexemes (tags es_b2_u6 / w_<token>). 55 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_afecta, w_afectan, w_afectar, w_ayuda, w_ayudan, w_beneficio, w_beneficios, w_cabe, w_casos, w_claras, w_comparto, w_comprendo, w_comunidad, w_confianza, w_crecer, w_cámara, w_cámaras, w_deben, w_depende, w_diaria, w_diferente, w_diría, w_espacio, w_espacios, w_existe, w_funciona, w_general, w_idea, w_importa, w_instalar, w_instalarse, w_mayor, w_mejora, w_muchos, w_necesariamente, w_necesita, w_parecer, w_parte, w_pienso, w_plaza, w_preocupa, w_preocupan, w_privacidad, w_público, w_públicos, w_reglas, w_resuelve, w_riesgo, w_seguridad, w_situación, w_también, w_vida, w_vigilancia, w_vista, w_útil]
