  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fa by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - comparative_word
    - demonstrative_word
    - en_fa_a1_unit15_lesson01_words
    - en_fa_a1_unit15_lesson02_words
    - en_fa_a1_unit15_lesson03_words
slot_presets:
  comparative_word: &id001
    language_code: fa
    part_of_speech: verb
    agreement_tags:
      semantic: comparative_word
  reason_comparative: &id003
    language_code: fa
    part_of_speech: verb
    agreement_tags:
      semantic:
      - en_fa_a1_unit15_lesson01_words
      - en_fa_a1_unit15_lesson02_words
      - en_fa_a1_unit15_lesson03_words
  demonstrative_word: &id002
    language_code: fa
    part_of_speech: pronoun
    agreement_tags:
      semantic: demonstrative_word
templates:
- content_key: practice.ko-fa.fa.a1.unit15.lesson01.comparative_choice.001
  lesson_content_key: fa.a1.unit15.lesson01.basic_comparative
  type: multiple_choice
  frame:
    text: '{comparative_word}'
    language_code: fa
    direction: rtl
  slots:
    comparative_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: comparative_word
  feedback_frame:
    text: '{comparative_word}은(는) 비교급이에요. -تر는 ''더 ~하다''를 뜻하고, 끝의 ـه는 ''~이에요/~해요''를 뜻해요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-fa.fa.a1.unit15.lesson01.basic_comparison_order.002
  lesson_content_key: fa.a1.unit15.lesson01.basic_comparative
  type: word_order
  frame:
    text: این از اون {comparative_word}
    language_code: fa
    direction: rtl
  slots:
    comparative_word: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: این از اون {comparative_word}
      language_code: fa
      direction: rtl
  feedback_frame:
    text: 'این از اون은 비교 대상을 나타내요. 예: این از اون بزرگ‌تره.'
