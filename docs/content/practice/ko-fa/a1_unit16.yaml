schema_version: '1.0'
pack_key: practice.ko-fa.a1.unit16
source_language: ko
target_language: fa
unit_content_key: fa.a1.unit16.travel
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fa by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - travel_vocab_word
    - transport_mode
    - ticket_request_word
    - departure_detail_word
    - dialogue_role_word
    - reviewed_phrase
    - en_fa_a1_unit16_lesson04_words
    - en_fa_a1_unit16_lesson05_words
slot_presets:
  travel_vocab_word: &id001
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic: travel_vocab_word
  transport_mode: &id004
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic: transport_mode
  ticket_request_word: &id002
    language_code: fa
    part_of_speech:
    - proper_noun
    - verb
    - preposition
    agreement_tags:
      semantic: ticket_request_word
  departure_detail_word: &id003
    language_code: fa
    part_of_speech:
    - noun
    - pronoun
    agreement_tags:
      semantic: departure_detail_word
  dialogue_role_word: &id007
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic: dialogue_role_word
  schedule_dialogue_word: &id005
    language_code: fa
    part_of_speech:
    - noun
    - verb
    - phrase
    agreement_tags:
      semantic:
      - en_fa_a1_unit16_lesson04_words
      - en_fa_a1_unit16_lesson05_words
  schedule_sentence: &id006
    language_code: fa
    part_of_speech: phrase
    agreement_tags:
      semantic: en_fa_a1_unit16_lesson04_words
  travel_review_word: &id008
    language_code: fa
    part_of_speech:
    - noun
    - pronoun
    agreement_tags:
      semantic:
      - travel_vocab_word
      - departure_detail_word
      - en_fa_a1_unit16_lesson05_words
  travel_or_departure_word: &id009
    language_code: fa
    part_of_speech:
    - noun
    - pronoun
    agreement_tags:
      semantic:
      - travel_vocab_word
      - departure_detail_word
