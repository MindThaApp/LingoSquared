- content_key: practice.ro-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Cu cine vorbesc? Z kim rozmawiam? (literal „cu cine vorbesc?”) este formula obișnuită pentru un apelant necunoscut; kim este instrumentalul după z.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Poți repeta asta? Możesz (poți, de la móc) + infinitivul powtórzyć (a repeta) + to (asta).
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nu vorbi atât de repede, te rog. Nie mów este imperativul negativ (nu vorbi); tak szybko înseamnă „atât de repede”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: Nu te aud bine.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Nu te aud bine. Nie słyszę cię dobrze exprimă o problemă de auz; cię este acuzativul lui ty, iar dobrze înseamnă „bine”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Cum a fost prima ta tură? Jak ci poszła ...? (literal „cum ți-a mers ...?”) întreabă despre ceva ce s-a petrecut deja. Ci este dativul lui ty, iar poszła se acordă cu substantivul feminin zmiana.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Prima lui tură a mers foarte bine. Jego („al lui”) nu se schimbă niciodată și stă înaintea substantivului: jego pierwsza zmiana; substantivul feminin nu îl influențează.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: A mers foarte bine, mai bine decât am crezut.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: A mers foarte bine, mai bine decât am crezut. Poszło este trecutul lui iść cu terminația -o („a mers”; aici „a ieșit”); myślałem este trecutul lui myśleć (a gândi, a crede), cu forma pentru un vorbitor bărbat.
    language_code: ro
    direction: ltr
