templates:
- content_key: practice.ro-pl.pl.a1.unit01.lesson01.choose.001
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'În poloneză există două feluri de a te adresa cuiva: ty cu prietenii și familia, iar pan (unui bărbat) sau pani (unei femei) cu persoane necunoscute și din respect.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson01.fill.002
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: fill_in_blank
  frame:
    text: Jak się {item} ma? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cu pan sau pani verbul este ma, ca și cum ai spune „cum se simte domnul/doamna”; cu ty devine masz: Jak się masz?'
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson01.translate.003
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Pan și pani nu se pot înlocui între ele: pan se folosește pentru un bărbat, pani pentru o femeie, iar ty pentru persoane pe care le cunoști bine.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson01.order.004
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: word_order
  frame:
    text: Jak się {item} ma?
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item} ma?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Jak się ma? întreabă cum se simte cineva; pan sau pani se pune la mijloc, iar verbul rămâne ma.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson01.translate.005
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: Ce mai faci? (către un prieten, informal)
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Cu un prieten, întrebarea se termină în masz; forma de politețe folosește ma plus pan sau pani.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson02.listen.001
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dzień dobry este salutul de peste zi, până seara; dobry wieczór se spune seara, iar dobranoc se spune doar la despărțirea de seară, înainte de culcare.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson02.match.002
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cześć este cuvântul informal pentru „salut” și „pa”, deci se folosește cu ty, nu cu pan sau pani.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson02.order.003
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Do {item}!
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Do {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Do widzenia este formula obișnuită de rămas-bun; do zobaczenia este mai prietenoasă, ca „la revedere, pe curând”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson02.fill.004
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: fill_in_blank
  frame:
    text: Dobry {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dobry wieczór se folosește seara; ziua se spune dzień dobry.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson02.translate.005
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cześć se folosește și ca „salut”, și ca „pa”, dar doar cu persoane cărora le spui ty.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson02.translate.006
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: O zi frumoasă!
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Miłego {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Miłego dnia este o urare, așa că cuvântul pentru „zi” își schimbă terminația în dnia.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson03.choose.001
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'În poloneză pronumele se omite de obicei, pentru că terminația verbului arată persoana: jestem înseamnă „sunt”, jesteś înseamnă „ești”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson03.listen.002
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jestem z + țara spune de unde ești, iar mieszkam w + orașul spune unde locuiești.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson03.translate.003
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Terminațiile verbelor arată persoana: -m pentru „eu” (jestem, mieszkam) și -sz sau -ś pentru „tu” (masz, jesteś).'
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson03.order.004
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: word_order
  frame:
    text: Jestem z {item}, ale mieszkam w Warszawie.
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem z {item}, ale mieszkam w Warszawie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'După z („din”), numele țării primește o altă terminație: Kanady.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson03.fill.005
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: fill_in_blank
  frame:
    text: Czy pan {item} po polsku? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'O întrebare de politețe despre un bărbat folosește forma verbului de persoana a treia: Czy pan mówi po polsku?'
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson03.translate.006
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: De unde ești? (către un prieten, informal)
    language_code: ro
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Skąd {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Skąd întreabă „de unde”; cu un prieten verbul este jesteś, iar forma de politețe este Skąd pan jest?
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit01.lesson03.translate.007
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: Îmi pare foarte bine să te cunosc.
    language_code: ro
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo mi {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bardzo mi miło înseamnă literal „foarte plăcut mie” și este răspunsul obișnuit când cunoști pe cineva.
    language_code: ro
    direction: ltr
