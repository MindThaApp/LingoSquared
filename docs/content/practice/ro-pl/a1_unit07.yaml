    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Verbul se acordă cu numărul: kosztuje pentru un singur lucru, kosztują pentru mai multe.'
    language_code: ro
    direction: ltr
