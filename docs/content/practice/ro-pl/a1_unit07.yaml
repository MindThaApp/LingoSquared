    kind: render_frame
    frame:
      text: Banan kosztuje {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Polona spune literal că banana costă ieftin, în loc să folosească un adjectiv separat.
    language_code: ro
    direction: ltr
