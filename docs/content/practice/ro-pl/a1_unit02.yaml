templates:
- content_key: practice.ro-pl.pl.a1.unit02.lesson01.choose.001
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: În poloneză nu există un tipar care să lege numerele de la unu la zece, așa că fiecare cuvânt trebuie învățat separat.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson01.listen.002
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: În poloneză, sz se pronunță ca ș, iar cz ca un c din „cer”, ceva mai apăsat; de aceea sześć și cztery încep cu aceste sunete.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson01.translate.003
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ć final din pięć, sześć, dziewięć și dziesięć este un sunet moale, apropiat de un „ci” scurt; semnul diacritic contează la scriere.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson01.match.004
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Pięć, sześć, dziewięć și dziesięć se termină cu litera ć, în timp ce siedem și osiem nu, așa că fiecare ortografie cere atenție.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson01.order.005
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: word_order
  frame:
    text: Mam {item} lat.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} lat.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mam + număr + lat spune câți ani ai, ca în Mam trzydzieści lat.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson02.listen.001
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ile întreabă „cât” sau „câți”, iar kosztuje este verbul cu care se asociază când întrebi un preț.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson02.choose.002
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Numerele jedenaście, dwanaście și piętnaście se termină în -naście, terminație care le arată ca numere de la 11 la 19.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson02.translate.003
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ile înseamnă „cât” pentru prețuri și „câți” pentru lucrurile numărate.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson02.order.004
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: To kosztuje {item} złotych.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje {item} złotych.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: După numere ca pięć, dwanaście sau trzydzieści urmează złotych, în timp ce dwa, trzy și cztery cer złote.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson02.fill.005
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: To kosztuje dwadzieścia {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Złotych este forma folosită la numărare după pięć, dwadzieścia, pięćdziesiąt și numere asemănătoare; dwa, trzy și cztery cer złote.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson02.translate.006
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: Cât costă asta?
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile to kosztuje? este întrebarea obișnuită despre preț, în care to înseamnă „asta” sau „acesta”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson03.choose.001
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pana este forma politicoasă pentru un bărbat („al dumneavoastră”: pana numer), iar twój este forma familiară („al tău”: twój numer).'
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson03.translate.002
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Numer telefonu înseamnă literal „numărul telefonului”, iar al doilea cuvânt este o formă modificată a cuvântului pentru telefon.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson03.order.003
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: Jaki jest {item} numer telefonu?
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest {item} numer telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój înseamnă „al tău” (informal), iar pana „al dumneavoastră” (formal, pentru un bărbat); oricare se potrivește înaintea lui numer telefonu.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson03.fill.004
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: Ile masz {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lat urmează după numere ca pięć, dwadzieścia sau trzydzieści; lata urmează după dwa, trzy, cztery și după numerele compuse care se termină cu ele, ca în trzydzieści dwa lata.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson03.translate.005
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Am treizeci și doi de ani.
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam trzydzieści dwa {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Fiindcă numărul se termină în dwa, cuvântul pentru ani este lata, nu lat.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit02.lesson03.translate.006
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Care este numărul tău de telefon? (informal; folosește jest)
    language_code: ro
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest twój {item} telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój este forma informală; varianta formală pentru un bărbat este Jaki jest pana numer telefonu?
    language_code: ro
    direction: ltr
