    - w_ciężki
    - w_jedno
    - w_kosz
    - w_monetami
    - w_niosę
    - w_odbieram
    - w_odbierać
    - w_pralni
    - w_pralnia
    - w_prania
    - w_program
    - w_stopni
    - w_suszarka
    - w_suszarki
    - w_ubrania
    - w_wybiera
    - w_wybieram
    - w_wyprać
    - w_środy
