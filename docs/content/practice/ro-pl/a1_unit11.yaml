  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Terminația -sz marchează „tu” (informal): chcesz, możesz, masz (jesteś este excepția, cu terminația -ś).'
    language_code: ro
    direction: ltr
