templates:
- content_key: practice.ro-pl.pl.a1.unit11.lesson01.choose.001
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chcę este forma pentru „eu” a verbului chcieć, iar chcesz este forma pentru „tu”, folosită cu prietenii și cu familia.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit11.lesson01.listen.002
