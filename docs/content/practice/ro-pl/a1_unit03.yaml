templates:
- content_key: practice.ro-pl.pl.a1.unit03.lesson01.choose.001
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Zilele săptămânii și lunile se scriu în poloneză cu literă mică, ca în română.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson01.translate.002
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Środa, sobota și niedziela se termină în -a, iar celelalte patru zile se termină în consoană; această diferență de terminație contează în construcția w + zi.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson01.match.003
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Dziś înseamnă „azi”, iar tygodnia este o formă modificată a cuvântului pentru „săptămână”, ca în dzień tygodnia.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson01.order.004
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: W {item} idę do kina.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: W {item} idę do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: După w („în”, „pe”), poniedziałek, czwartek și piątek își păstrează forma, dar wtorek devine we wtorek, ca să se pronunțe mai ușor.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson01.fill.005
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: fill_in_blank
  frame:
    text: W {item} idę do kina. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Idę do kina înseamnă „merg la cinema”, iar w + ziua săptămânii indică acea zi.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson01.order.006
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: Jaki dziś jest dzień {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki dziś jest dzień {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dzień tygodnia înseamnă „ziua săptămânii”, iar al doilea cuvânt își schimbă terminația în tygodnia.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson02.choose.001
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Numele lunilor în poloneză nu se scriu cu majusculă și nu au prefix sau articol.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson02.listen.002
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Într-o dată rostită, ziua vine prima și se termină în -ego, apoi urmează luna în forma ei de dată, de obicei cu terminația -a (dziesiątego maja), dar lutego pentru februarie.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson02.translate.003
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lunile nu se scriu cu majusculă în poloneză, iar urodziny („ziua de naștere”) este mereu la plural.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson02.match.004
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Unele luni se termină în -eń (styczeń, kwiecień, sierpień, wrzesień), ceea ce te ajută să le recunoști.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson02.order.005
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: word_order
  frame:
    text: Spotkanie jest piętnastego {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Spotkanie jest piętnastego {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Într-o dată, ziua se termină în -ego, iar luna primește -a, cu excepția lui lutego pentru februarie.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson02.fill.006
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: fill_in_blank
  frame:
    text: Kiedy są twoje {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Urodziny este la plural în poloneză, deci verbul este są („sunt”), nu jest.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson02.translate.007
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
    text: Când este întâlnirea?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Kiedy jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Kiedy întreabă „când”, iar un substantiv la singular precum spotkanie cere jest.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson03.choose.001
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Panu și ci înseamnă amândouă „ție”/„dumneavoastră”; panu este formal, pentru un bărbat, iar ci este informal.
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson03.translate.002
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Możemy este forma pentru „noi” a verbului „a putea”, ca în Kiedy możemy się znowu spotkać?
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson03.order.003
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: word_order
  frame:
    text: Czy piątek {item} odpowiada?
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy piątek {item} odpowiada?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Odpowiada cere persoana întrebată la dativ: panu (formal, către un bărbat) sau ci (informal).'
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit03.lesson03.fill.004
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: fill_in_blank
  frame:
    text: Kiedy możemy się znowu {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
