        - w_poradzisz
        - w_naprawdę
        - w_pomaga
        - w_pewno
        - w_będziesz
        - w_dumny
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} este unul dintre cuvintele acestei unități, din lecția despre fericit, trist sau furios.'
