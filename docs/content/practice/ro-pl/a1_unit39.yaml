        - w_policja
        - w_karetka
        - w_straż
        - w_uwaga
        - w_idźcie
        - w_wyjścia
        - w_spokojnie
        - w_chodź
        - w_bibliotece
        - w_potrzebuje
        - w_zewnątrz
        - w_dzieje
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} este unul dintre cuvintele acestei unități, din lecția despre ajutor și incendiu.'
    language_code: ro
    direction: ltr
