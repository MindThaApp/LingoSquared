schema_version: '1.0'
pack_key: practice.ro-pl.a1.unit55
source_language: ro
target_language: pl
unit_content_key: pl.a1.unit55.mecz
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Romanian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_drużyna
    - w_dziewięćdziesiąt
    - w_gol
    - w_gospodarze
    - w_gościom
    - w_jednego
    - w_kibic
    - w_mecz
    - w_piękny
    - w_rozrywki
    - w_stadion
    - w_szybki
    - w_trwanie
    - w_wejściu
    - w_wynik
    - w_wyników
    - w_zawodnik
    - w_zwycięzca
    - w_zwycięzcy
templates:
- content_key: practice.ro-pl.pl.a1.unit55.lesson01.choose.001
  lesson_content_key: pl.a1.unit55.lesson01.pojdziemy_dzis_wieczorem_na
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_mecz
        - w_stadion
        - w_kibic
        - w_drużyna
        - w_zawodnik
        - w_szybki
        - w_gol
        - w_piękny
        - w_wynik
        - w_jednego
        - w_wyników
        - w_gospodarze
        - w_gościom
        - w_trwanie
        - w_dziewięćdziesiąt
        - w_wejściu
        - w_zwycięzca
        - w_zwycięzcy
        - w_rozrywki
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} este unul dintre cuvintele acestei unități, din lecția despre „mergem la meci în seara asta?”.'
    language_code: ro
    direction: ltr
