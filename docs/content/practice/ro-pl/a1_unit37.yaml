  feedback_frame:
    text: '{item} este unul dintre cuvintele acestei unități, din lecția despre alb și portocaliu.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit37.lesson03.translate.001
  lesson_content_key: pl.a1.unit37.lesson03.rozowy_i_fioletowy
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} este unul dintre cuvintele acestei unități, din lecția despre roz și violet.'
    language_code: ro
