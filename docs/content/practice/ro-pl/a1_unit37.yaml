schema_version: '1.0'
pack_key: practice.ro-pl.a1.unit37
source_language: ro
target_language: pl
unit_content_key: pl.a1.unit37.kolory
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Romanian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_biały
    - w_chciałaby
    - w_czerwony
    - w_fioletowy
    - w_idą
    - w_językową
    - w_kawiarnię
    - w_koloru
    - w_kończy
    - w_kupują
    - w_kwiatowy
    - w_pomarańczowy
    - w_różowy
    - w_targ
    - w_tulipany
    - w_tulipanów
    - w_tutaj
    - w_upiększają
    - w_wybierasz
    - w_ładne
    - w_żółty
templates:
- content_key: practice.ro-pl.pl.a1.unit37.lesson01.choose.001
  lesson_content_key: pl.a1.unit37.lesson01.czerwony_i_zolty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_tulipany
        - w_tutaj
        - w_czerwony
        - w_żółty
        - w_koloru
        - w_biały
        - w_pomarańczowy
        - w_różowy
        - w_wybierasz
        - w_kończy
        - w_fioletowy
        - w_tulipanów
        - w_idą
        - w_targ
        - w_kwiatowy
        - w_chciałaby
        - w_kupują
        - w_ładne
        - w_upiększają
        - w_kawiarnię
        - w_językową
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} este unul dintre cuvintele acestei unități, din lecția despre roșu și galben.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-pl.pl.a1.unit37.lesson02.listen.001
