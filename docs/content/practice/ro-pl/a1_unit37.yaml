- content_key: practice.ro-pl.pl.a1.unit37.lesson04.match.001
  lesson_content_key: pl.a1.unit37.lesson04.nina_i_ewa_na
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Potrivește fiecare cuvânt polonez cu sensul lui în română; cuvintele provin din lecțiile acestei unități.
    language_code: ro
    direction: ltr
