      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_zgubiony
        - w_zgubił
        - w_znaleziony
        - w_został
        - w_plecak
        - w_informacji
        - w_portfel
        - w_informacja
        - w_idziemy
        - w_szuka
        - w_zajrzyj
        - w_kurtki
        - w_dosyć
        - w_emocji
