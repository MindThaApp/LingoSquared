templates:
- content_key: practice.it-fr.fr.a1.unit03.lesson01.choose.001
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Frères et sœurs insieme significa «fratelli e sorelle»: il francese non ha una parola comune di uso quotidiano per indicarli.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson01.listen.002
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Frère e frères si pronunciano allo stesso modo, così come sœur e sœurs: solo l''articolo o il contesto mostrano se è singolare o plurale.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson01.match.003
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Le parole della famiglia in francese si abbinano facilmente se conosci il genere: mère e père, tante e oncle, cousine e cousin.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson01.translate.004
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Frère e sœur prendono la -s del plurale (frères, sœurs): se in italiano è plurale, in francese serve il plurale.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson02.choose.001
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ma si usa con i nomi femminili (ma mère), mon con quelli maschili (mon père) e mes con tutti i plurali (mes parents).
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson02.order.002
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: word_order
  frame:
    text: Ma {item} est petite.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma {item} est petite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ma si usa con un nome femminile singolare; anche l'aggettivo petite prende la -e del femminile.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson02.fill.003
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: fill_in_blank
  frame:
    text: '{item} famille est grande. ({hint})'
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Famille è femminile, quindi si usa ma; con un nome maschile si userebbe mon.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson02.translate.004
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: translation
  frame:
    text: La mia famiglia è piccola.
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma famille est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Petite è femminile perché famille è femminile; con un nome maschile si userebbe petit.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson03.choose.001
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cousin è maschile e cousine è femminile: la -e indica una cugina e fa sentire la n finale.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson03.order.002
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: word_order
  frame:
    text: Mon {item} habite à Paris.
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mon {item} habite à Paris.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Mon si usa davanti ai nomi maschili singolari: mon père, mon oncle.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson04.choose.001
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Al presente le desinenze di habite/habites/habitent si pronunciano allo stesso modo, quindi è il pronome a indicare di chi si parla.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson04.order.002
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: word_order
  frame:
    text: J’habite avec mes {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite avec mes {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mes è il possessivo plurale, per nomi maschili e femminili.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson04.fill.003
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: fill_in_blank
  frame:
    text: Tu habites {item} de tes parents ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Près de significa «vicino a»: près de tes parents, près d’ici.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson04.translate.004
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'La desinenza del verbo segue il soggetto: habite per il/elle, habitent per ils/elles, habites per tu.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson04.translate.005
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: Vivo con i miei nonni.
    language_code: it
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite avec mes {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Mes è il possessivo plurale, quindi mes grands-parents significa «i miei nonni».
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson05.fill.001
  lesson_content_key: fr.a1.unit03.lesson05.reading_a_family_profile
  type: fill_in_blank
  frame:
    text: Ma petite sœur {item} Camille. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'S’appelle è la forma di il/elle di s’appeler: ma sœur s’appelle..., je m’appelle...'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson06.listen.001
  lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Chaque semaine significa «ogni settimana»: chaque non cambia mai ed è seguito da un nome singolare.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit03.lesson06.match.002
  lesson_content_key: fr.a1.unit03.lesson06.family_photos_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id018
    second: *id018
    third: *id018
    fourth: *id018
    fifth: *id018
    sixth: *id018
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mais è la parola che esprime contrasto («ma») e plus serve a fare un confronto, come in Ma famille est plus petite.
    language_code: it
    direction: ltr
