templates:
- content_key: practice.it-fr.fr.a1.unit04.lesson01.choose.001
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Marché e prix sono maschili (le marché, le prix), mentre boulangerie è femminile (la boulangerie): impara ogni nome insieme al suo articolo.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson01.listen.002
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Molte parole del mercato sono nomi di alimenti che si usano con de dopo una quantità: un kilo de tomates, un litre de lait.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson01.match.003
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Pesi e misure vogliono de prima dell''alimento: un kilo de tomates, un litre de lait.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson01.order.004
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: word_order
  frame:
    text: Les {item} sont chers aujourd'hui.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Les {item} sont chers aujourd'hui.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Chers è maschile plurale perché légumes e fruits sono nomi maschili plurali.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson01.fill.005
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: fill_in_blank
  frame:
    text: La {item} est fermée aujourd'hui. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fermée termina in -ée perché boulangerie è femminile.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson01.translate.006
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'In francese ogni nome si impara con il suo articolo: le marché, le prix, la boulangerie.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson02.choose.001
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Euro prende una -s al plurale (euros), ma la s non si pronuncia: si sente il numero, non la desinenza.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson02.choose.002
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Chers è il plurale di cher: gli aggettivi aggiungono -s per concordare con i nomi plurali come les légumes.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson02.order.003
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: Je voudrais un kilo de {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je voudrais è il modo educato di chiedere qualcosa; un kilo de + nome indica la quantità.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson02.order.004
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: C'est combien le {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien? chiede il prezzo di una cosa sola; le indica che il nome è maschile.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson02.fill.005
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Combien ça {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Combien ça coûte? chiede quanto costa qualcosa; vale per qualsiasi prodotto singolo.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson02.fill.006
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Je {item} un kilo de tomates, s'il vous plaît. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Je voudrais è più educato di je veux, che suonerebbe brusco quando si ordina.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson02.translate.007
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cher concorda con il suo nome: cher (maschile singolare), chers (maschile plurale).'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson02.translate.008
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: Vorrei un chilo di {item}, per favore. (formale)
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: S'il vous plaît è il «per favore» di cortesia; con un amico potresti dire s'il te plaît.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson02.translate.009
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: Quanto costa il pane?
    language_code: it
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien le pain? chiede il prezzo di un prodotto; la risposta comincia con una somma in euro.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson03.choose.001
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Voilà si dice quando si porge qualcosa o lo si indica: ecco, tieni, ecco qui.'
    language_code: it
    direction: ltr
