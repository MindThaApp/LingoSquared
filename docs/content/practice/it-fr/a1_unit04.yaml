    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Fermée è femminile perché si riferisce a la boulangerie; un nome maschile vorrebbe fermé.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit04.lesson03.fill.003
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
  type: fill_in_blank
  frame:
    text: On peut {item} du pain ici aussi. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
