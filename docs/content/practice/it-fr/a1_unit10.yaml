templates:
- content_key: practice.it-fr.fr.a1.unit10.lesson01.choose.001
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Avant significa «prima di»; d'abord significa «per prima cosa», all'inizio di una sequenza.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson01.listen.002
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'S''habiller è riflessivo: je m''habille, tu t''habilles; s'' diventa m'' con je.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson01.match.003
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Diversi verbi della routine sono riflessivi (se réveiller, s'habiller); gli altri, come prendre e quitter, non lo sono.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson01.order.004
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: word_order
  frame:
    text: Je {item} la maison à neuf heures.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Je {item} la maison à neuf heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quitter la maison significa «uscire di casa»; con je il verbo è quitte.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson01.fill.005
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: fill_in_blank
  frame:
    text: Je prends une {item} le matin. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Prendre une douche è il modo usuale per dire «fare la doccia».
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson01.translate.007
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: translation
  frame:
    text: Mi vesto prima della colazione.
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je m'habille avant le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m'habille usa il pronome riflessivo m' davanti a un suono vocalico.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson02.choose.001
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tard significa «tardi»; puis significa «poi» e collega le azioni di una routine.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson02.listen.002
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vingt-trois è 23; in francese l'ora può essere espressa con le 24 ore, quindi vingt-trois heures sono le 23, cioè le undici di sera.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson02.match.003
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Rentrer, dîner e coucher sono all'infinito; le forme con je e nous cambiano desinenza.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson02.fill.005
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: fill_in_blank
  frame:
    text: Je {item} à la maison après le travail. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rentre è la forma con je; rentrer significa «rientrare a casa».
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson02.translate.007
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: Il sabato sera ceniamo insieme. (usa nous)
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Nous {item} ensemble le samedi soir.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Nous dînons è la forma di nous; ensemble significa insieme.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson02.translate.008
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: Vado a letto verso le 23:00.
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Je me {item} vers vingt-trois heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Vers indica un orario approssimativo; vingt-trois heures usa il formato 24 ore.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson03.choose.001
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu fais quoi ? è il modo informale per chiedere cosa si sta facendo; quoi sostituisce que dopo il verbo.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson03.listen.002
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je me repose significa «mi riposo»; repose è la forma di je di se reposer.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson03.order.004
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: word_order
  frame:
    text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je vais è la forma di je di aller; au è à più le.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson03.fill.005
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: fill_in_blank
  frame:
    text: Je me {item} avant l'atelier du soir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se reposer è riflessivo, quindi je vuole me.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson03.translate.006
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: 'Cosa fai il sabato prima del laboratorio? (informale: inizia con Tu fais)'
    language_code: it
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu fais {item} le samedi avant l'atelier ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu fais quoi ? è il modo informale per chiedere a qualcuno cosa sta facendo.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit10.lesson03.translate.007
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: 'A che ora rientri a casa? (informale: inizia con Tu)'
    language_code: it
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu {item} à quelle heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Rentres è la forma di tu; à quelle heure chiede l'ora.
    language_code: it
    direction: ltr
