templates:
- content_key: practice.it-fr.fr.a1.unit08.lesson01.choose.001
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lundi, samedi e dimanche in francese non hanno la maiuscola, e le davanti a un giorno indica ogni settimana: le samedi.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson01.listen.002
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Demain e hier sono gli avverbi per «domani» e «ieri»; nessuno dei due vuole una preposizione.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson01.match.003
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: In francese i giorni della settimana sono maschili e si scrivono con la minuscola.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson01.order.004
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: word_order
  frame:
    text: La pharmacie ouvre {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: La pharmacie ouvre {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Demain significa «domani» e si mette dopo il verbo, senza preposizione.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson01.fill.005
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: fill_in_blank
  frame:
    text: La boulangerie est fermée le {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le dimanche significa «la domenica», come abitudine regolare.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson01.translate.007
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: translation
  frame:
    text: Il laboratorio si tiene il sabato.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier a lieu le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: L'atelier a lieu le samedi significa che il laboratorio si tiene il sabato.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson02.choose.001
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Premier è l''ordinale usato solo per il primo giorno; le altre date usano i numeri cardinali: le premier mars, le quinze mars.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson02.listen.002
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mars è un mese; in francese i mesi, come i giorni, non hanno la maiuscola.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson02.order.003
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: word_order
  frame:
    text: Nous sommes le quinze {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Nous sommes le quinze {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Le date seguono lo schema le + numero + mese: le quinze mars.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson02.fill.004
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: fill_in_blank
  frame:
    text: L'atelier se {item} le vingt-deux mars. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se termine è la forma riflessiva che significa «finisce» o «termina».
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson02.translate.005
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: translation
  frame:
    text: Che data è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Quelle est la {item} aujourd'hui ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quelle est la date aujourd'hui è il modo standard per chiedere la data del calendario.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson02.translate.006
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: translation
  frame:
    text: È il quindici marzo. (comincia con c'est)
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est le quinze {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Per le date il francese usa i numeri normali, quindi «il quindici» è semplicemente quinze.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson03.choose.001
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Quand chiede «quando»; donc collega una conclusione a quanto appena detto.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson03.listen.002
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Séance è la parola per «sessione» o «incontro», per esempio di un laboratorio, o per la proiezione di un film.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson03.match.003
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Séance, idée e occasion sono nomi femminili; temps è maschile.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson03.order.004
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: word_order
  frame:
    text: Parfait, j'ai le temps de {item} un dessert pour l'occasion.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, j'ai le temps de {item} un dessert pour l'occasion.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Dopo avoir le temps de il verbo resta all''infinito: préparer.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson03.fill.005
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: fill_in_blank
  frame:
    text: C'est {item}, la dernière séance de l'atelier ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: C'est quand ... ? è un modo informale per chiedere quando succede qualcosa.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit08.lesson03.translate.006
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: translation
  frame:
    text: Bella idea!
    language_code: it
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Bonne {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Idée è femminile, quindi l'aggettivo è bonne, non bon.
    language_code: it
    direction: ltr
