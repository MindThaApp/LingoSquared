  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Au è la contrazione di à e le, quindi au carrefour significa «all'incrocio».
    language_code: it
    direction: ltr
