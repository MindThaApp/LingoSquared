  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: word_order
  frame:
    text: Tournez à {item} après la boulangerie.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tournez à {item} après la boulangerie.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Per girare a sinistra o a destra, À gauche e à droite usano à, non en.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit09.lesson01.fill.005
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
