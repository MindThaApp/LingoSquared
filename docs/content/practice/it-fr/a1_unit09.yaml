    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tournez e continuez sono imperativi di cortesia (vous), usati con sconosciuti o con più persone.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit09.lesson02.listen.002
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
