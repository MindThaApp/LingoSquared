templates:
- content_key: practice.it-fr.fr.a1.unit13.lesson01.choose.001
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Préférer, aimer e détester sono i verbi principali per esprimere ciò che piace e ciò che non piace.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson01.listen.002
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Épices è plurale; la -s finale non si pronuncia, quindi épice suonerebbe uguale.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson01.order.004
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: word_order
  frame:
    text: J'aime {item} les plats salés que les plats sucrés.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: J'aime {item} les plats salés que les plats sucrés.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Aimer mieux significa preferire; que introduce ciò che piace di meno.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson01.fill.006
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: fill_in_blank
  frame:
    text: Mathieu {item} les épices trop fortes. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Déteste è la forma di il di détester, come richiede Mathieu.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson01.translate.008
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: translation
  frame:
    text: Preferisco la torta al cioccolato.
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je préfère la {item} au chocolat.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Au è à più le; au chocolat indica il gusto della torta.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson01.translate.009
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tarte, chocolat, épices e plats sono i cibi nominati nella lezione sulle preferenze.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson02.choose.001
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ou significa «o», mentre où (con l''accento) significa «dove»: è l''accento a fare la differenza.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson02.listen.002
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pourrait è il condizionale di pouvoir, usato per fare un suggerimento educato: on pourrait.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson02.order.004
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: word_order
  frame:
    text: Tu aimes plutôt le sucré {item} le salé ?
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu aimes plutôt le sucré {item} le salé ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Ou unisce due scelte: sucré ou salé significa «dolce o salato».'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson02.fill.006
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: fill_in_blank
  frame:
    text: Ça ne me {item} pas. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ça ne me dérange pas significa «non mi dà fastidio».
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson02.translate.007
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: translation
  frame:
    text: Che cosa preferisci? (informale, con qu'est-ce que)
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce que tu {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu préfères usa la forma di tu di préférer; vous préférez sarebbe la forma di cortesia.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson03.choose.001
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sucrée e salée hanno una -e finale perché tarte e quiche sono femminili.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson03.listen.002
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sucrée e salée sono le forme femminili; terminano con una -e muta.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson03.match.003
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Sucrée e salée descrivono i nomi femminili tarte e quiche.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson03.order.004
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: word_order
  frame:
    text: Parfait, une tarte sucrée et une quiche {item} pour samedi.
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, une tarte sucrée et une quiche {item} pour samedi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Salée è femminile per concordare con quiche.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson03.fill.005
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: fill_in_blank
  frame:
    text: Je préfère la tarte, plutôt {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sucrée è femminile per concordare con tarte.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson03.translate.006
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: translation
  frame:
    text: Che cosa prepariamo sabato? (usa on)
    language_code: it
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce qu'on {item} samedi ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: On prépare è il modo parlato più comune per dire «prepariamo».
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit13.lesson03.translate.007
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: translation
  frame:
    text: Preferisco la quiche alla torta.
    language_code: it
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Je préfère la {item} à la tarte.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Préférer A à B significa preferire A a B; à la collega i due elementi.
    language_code: it
    direction: ltr
