templates:
- content_key: practice.it-fr.fr.a1.unit01.lesson01.choose.001
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'In francese ci sono due modi di rivolgersi a qualcuno: tu con amici, familiari e coetanei; vous con sconosciuti, in contesti formali e quando ci si rivolge a più persone.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson01.listen.002
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bonjour va bene a qualsiasi ora del giorno e con chiunque; salut si usa solo con le persone a cui daresti del tu.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson01.match.003
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Tu e vous si usano entrambi per rivolgersi a qualcuno: tu per un amico, un parente o un coetaneo; vous per uno sconosciuto, in un contesto formale o per più persone.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson01.order.004
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: word_order
  frame:
    text: Comment {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Sono due modi di chiedere come stai: allez-vous è formale, vas-tu è informale.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson01.translate.005
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bonjour, merci, oui e non non cambiano mai forma, mentre gli aggettivi sì: fatigué per un uomo, fatiguée per una donna.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson01.translate.006
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: Come sta? (formale)
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Allez-vous è la domanda formale; con un amico chiederesti comment vas-tu ?
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson01.translate.007
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: Come stai? (informale)
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Vas-tu è la domanda informale, per amici e familiari; con uno sconosciuto chiederesti comment allez-vous ?
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson02.choose.001
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Enchanté lo dice un uomo e enchantée una donna; moi c’est + nome è un modo informale di presentarsi.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson02.order.002
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: word_order
  frame:
    text: Bonjour, je m’appelle {name}.
    language_code: fr
    direction: ltr
  slots:
    name: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Bonjour, je m’appelle {name}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m’appelle significa letteralmente mi chiamo; è il modo quotidiano di dire il proprio nome.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson02.translate.003
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: Mi chiamo {name}.
    language_code: it
    direction: ltr
    slot_rendering:
      name: token
  slots:
    name: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je m’appelle {name}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m’appelle si usa per parlare di sé; per chiedere il nome a un’altra persona si dice tu t’appelles comment ? o comment vous appelez-vous ?
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson03.choose.001
  lesson_content_key: fr.a1.unit01.lesson03.reading_aloud
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je diventa j’ davanti a vocale (j’habite), mentre êtes è la forma di vous del verbo être, essere.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson04.choose.001
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: A Ça va ? si risponde con très bien o pas mal; aggiungere un peu attenua uno stato, come in un peu fatigué.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson04.match.002
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Fatigué è maschile e fatiguée è femminile: l’aggettivo si accorda con la persona a cui si riferisce.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson04.fill.003
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: fill_in_blank
  frame:
    text: Je suis un peu {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Un uomo dice fatigué e una donna fatiguée; si scrivono in modo diverso ma si pronunciano allo stesso modo.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson05.listen.001
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Un quartier è un intero quartiere e una rue è una sola via; un atelier è un laboratorio.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson05.order.002
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: word_order
  frame:
    text: Je suis de {place}.
    language_code: fr
    direction: ltr
  slots:
    place: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis de {place}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Être de + luogo dice di dove sei; habiter à + luogo dice dove abiti.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson05.order.003
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: word_order
  frame:
    text: J’habite à {place}.
    language_code: fr
    direction: ltr
  slots:
    place: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite à {place}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Usa à davanti al nome di una città: j’habite à Montreuil, j’habite à Saint-Ouen.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit01.lesson05.fill.004
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: fill_in_blank
  frame:
    text: Vous {item} dans le quartier ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Con vous il verbo termina in -ez: vous habitez; con tu è tu habites.'
    language_code: it
    direction: ltr
