templates:
- content_key: practice.it-fr.fr.a1.unit05.lesson01.choose.001
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le poulet, le poisson, le riz e le vin sono maschili, mentre la salade è femminile; in l'eau l'articolo perde la vocale davanti a eau.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit05.lesson01.listen.002
  lesson_content_key: fr.a1.unit05.lesson01.a_table
