templates:
- content_key: practice.it-fr.fr.a1.unit06.lesson01.choose.001
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le matin, l'après-midi e le soir indicano le parti della giornata; midi e minuit sono mezzogiorno e mezzanotte e non vogliono l'articolo.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson01.listen.002
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'L''heure è la forma elisa di la heure: heure inizia con una h muta, quindi la diventa l'' davanti ad essa.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson01.match.003
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Matin, après-midi e soir di solito hanno le o l' quando dici la mattina, il pomeriggio, la sera.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson01.order.004
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: word_order
  frame:
    text: Le marché est ouvert le {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Le marché est ouvert le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Le matin e le soir significano la mattina e la sera, senza una parola per «di» o «in».
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson01.fill.005
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: fill_in_blank
  frame:
    text: Nous mangeons à {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: À midi significa a mezzogiorno; midi è anche la parola di tutti i giorni per l'ora di pranzo.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson01.translate.006
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: translation
  frame:
    text: Il laboratorio inizia la sera, non la mattina.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier commence le {item}, pas le matin.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Le soir significa la sera; pas nega e crea il contrasto con le matin.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson02.choose.001
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Demie è femminile perché heure è femminile: dix heures et demie.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson02.listen.002
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Et quart e moins le quart sono le due espressioni del quarto d''ora: dopo l''ora e prima dell''ora.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson02.order.003
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: word_order
  frame:
    text: L'atelier commence à {item} heure ?
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier commence à {item} heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quelle heure ? chiede che ora è; quelle è femminile perché concorda con heure.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson02.fill.004
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: fill_in_blank
  frame:
    text: Il est onze heures {item} le quart. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Moins le quart toglie un quarto all'ora successiva, quindi onze heures moins le quart sono le 10:45.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson02.translate.005
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: translation
  frame:
    text: Sono le dieci e un quarto.
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Il est dix heures et {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Et quart aggiunge un quarto d'ora; in francese si dice letteralmente dieci ore e quarto.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson03.choose.001
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Alors, vers e après sono piccole parole di collegamento che nel dialogo indicano il momento o la successione.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson03.listen.002
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vers significa verso, circa, come in vers vingt heures quinze, e dà un'ora approssimativa.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson03.match.003
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Après le travail significa dopo il lavoro; vers e d'habitude indicano un orario approssimativo e abituale.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson03.order.004
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: word_order
  frame:
    text: C'est plus {item} après le travail.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est plus {item} après le travail.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Plus pratique significa più comodo; pratique ha la stessa forma al maschile e al femminile.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson03.fill.005
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: fill_in_blank
  frame:
    text: Et il {item} à quelle heure ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Finit è la forma di il del verbo finir, quindi concorda con il nella domanda.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson03.fill.006
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: fill_in_blank
  frame:
    text: Vers vingt heures quinze, comme {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Comme d'habitude significa come al solito.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit06.lesson03.translate.007
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: translation
  frame:
    text: Credo che (il laboratorio) inizi alle 18:30. (scrivi l'ora in lettere)
    language_code: it
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Il commence à dix-huit heures trente, je {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Je crois è la forma di je del verbo croire e attenua l''affermazione: credo di sì.'
    language_code: it
    direction: ltr
