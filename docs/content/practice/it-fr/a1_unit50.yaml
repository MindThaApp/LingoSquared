schema_version: '1.0'
pack_key: practice.it-fr.a1.unit50
source_language: it
target_language: fr
unit_content_key: fr.a1.unit50.communication
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Italian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_appeler
    - w_appelles
    - w_composé
    - w_compte
    - w_dire
    - w_dois
    - w_entendre
    - w_fière
    - w_parlez
    - w_pensais
    - w_pensé
    - w_rappelle
    - w_sms
    - w_truc
    - w_vite
    - w_évidemment
templates:
- content_key: practice.it-fr.fr.a1.unit50.lesson01.choose.001
  lesson_content_key: fr.a1.unit50.lesson01.je_t_appelle
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_appeler
        - w_dois
        - w_parlez
        - w_vite
        - w_sms
        - w_rappelle
        - w_dire
        - w_truc
        - w_évidemment
        - w_appelles
        - w_pensais
        - w_composé
        - w_pensé
        - w_entendre
        - w_fière
        - w_compte
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su «ti richiamo».'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit50.lesson02.listen.001
  lesson_content_key: fr.a1.unit50.lesson02.qui_est_a_l
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su «con chi parlo?».'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit50.lesson03.translate.001
  lesson_content_key: fr.a1.unit50.lesson03.tu_peux_repeter
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su «puoi ripetere?».'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit50.lesson04.match.001
  lesson_content_key: fr.a1.unit50.lesson04.envoyer_un_sms
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Abbina ogni parola francese al suo significato; le parole provengono dalle lezioni di questa unità.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit50.lesson05.choose.001
  lesson_content_key: fr.a1.unit50.lesson05.lire_une_conversation_par
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su come leggere uno scambio di messaggi.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit50.lesson06.translate.001
  lesson_content_key: fr.a1.unit50.lesson06.un_appel_apres_le
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su una telefonata dopo il turno.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit50.lesson01.order.002
  lesson_content_key: fr.a1.unit50.lesson01.je_t_appelle
  type: word_order
  frame:
    text: Je {item} t'appeler.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_dois
  answer_derivation:
    kind: render_frame
    frame:
      text: Je {item} t'appeler.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Devo chiamarti. dois significa devo; devi (informale).
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit50.lesson02.order.002
  lesson_content_key: fr.a1.unit50.lesson02.qui_est_a_l
  type: word_order
  frame:
    text: Vous {item} avec Camille.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_parlez
  answer_derivation:
    kind: render_frame
    frame:
      text: Vous {item} avec Camille.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Stai parlando con Camille. Vous parlez avec + nome è l'equivalente formale di c'est + nome.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit50.lesson03.order.002
  lesson_content_key: fr.a1.unit50.lesson03.tu_peux_repeter
  type: word_order
  frame:
    text: Ne parle pas si {item}, s'il te plaît.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_vite
  answer_derivation:
    kind: render_frame
    frame:
      text: Ne parle pas si {item}, s'il te plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Non parlare così in fretta, per favore. Ne parle pas si vite nega il verbo: ne ... pas racchiude parle, e si significa ''così''.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit50.lesson04.order.002
  lesson_content_key: fr.a1.unit50.lesson04.envoyer_un_sms
  type: word_order
  frame:
    text: Je te {item} plus tard.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_rappelle
  answer_derivation:
    kind: render_frame
    frame:
      text: Je te {item} plus tard.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ti richiamo più tardi. Rappeler (richiamare) contiene già l'idea di 'di nuovo' in re-; plus tard significa 'più tardi'.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit50.lesson06.order.002
  lesson_content_key: fr.a1.unit50.lesson06.un_appel_apres_le
  type: word_order
  frame:
    text: Ça s'est très bien passé, mieux que je {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pensais
  answer_derivation:
    kind: render_frame
    frame:
      text: Ça s'est très bien passé, mieux que je {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: È andata proprio bene, meglio di quanto pensavo. Ça s'est très bien passé e je pensais sono espressioni fisse in questo caso; je pensais è l'imperfetto di penser (pensare).
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit50.lesson06.fill.003
  lesson_content_key: fr.a1.unit50.lesson06.un_appel_apres_le
  type: fill_in_blank
  frame:
    text: Merci beaucoup, ça {item} beaucoup pour moi. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_compte
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_compte
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Grazie, per me significa molto. Compter qui significa ''contare, avere importanza'': ça compte pour moi (per me conta); pour moi indica per chi conta.'
    language_code: it
    direction: ltr
