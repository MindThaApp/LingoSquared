templates:
- content_key: practice.it-fr.fr.a1.unit12.lesson01.choose.001
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Préparé, acheté, oublié e goûté sono participi passati di verbi in -er: terminano in -é.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson01.listen.002
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tutti questi participi terminano in -é, che si pronuncia come il suono finale di café.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson01.order.004
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: word_order
  frame:
    text: Tu as {item} le gâteau ?
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu as {item} le gâteau ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Tu as aimé? è la domanda al passato: as più il participio aimé.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson01.fill.006
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: fill_in_blank
  frame:
    text: J'ai {item} des légumes au marché. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Acheté è il participio di acheter, usato dopo j'ai.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson01.translate.007
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: translation
  frame:
    text: Ho preparato una torta per il laboratorio.
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {item} un gâteau pour l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: J'ai préparé usa avoir più il participio; con avoir la terminazione del participio non cambia.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson01.translate.008
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: translation
  frame:
    text: Ho dimenticato il burro a casa.
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {item} le beurre à la maison.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: J'ai oublié è il passé composé di oublier.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson02.choose.001
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Être è l''ausiliare di verbi come arriver, aller e rester: je suis arrivé, il est resté.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson02.listen.002
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Finalement è formato dall'aggettivo final più la terminazione -ment.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson02.order.004
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: word_order
  frame:
    text: Le bus est {item} en retard.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Le bus est {item} en retard.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Arrivé concorda con le bus, quindi è maschile singolare, senza -e aggiuntiva.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson02.fill.006
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: fill_in_blank
  frame:
    text: Mathieu est {item} pour nettoyer la cuisine. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Rester vuole être, quindi resté concorda con Mathieu: maschile singolare.'
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson02.translate.007
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: translation
  frame:
    text: Sono andata al mercato prima del laboratorio. (detto da una donna)
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item} au marché avant l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Con être il participio concorda con il soggetto, quindi una donna scrive allée.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson02.translate.008
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: translation
  frame:
    text: Alla fine, la torta era deliziosa.
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Finalement, le gâteau {item} délicieux.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Était è l'imparfait di être; finalement all'inizio della frase significa «alla fine».
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson03.choose.001
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je n'ai pas pu venir significa «non sono potuto venire»; pu è il participio di pouvoir.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson03.listen.002
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Samedi dernier significa «sabato scorso»; qui dernier segue il nome.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson03.match.003
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Là-bas significa «laggiù» e rapidement significa «velocemente».
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson03.order.004
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: word_order
  frame:
    text: Je suis allé {item} à l'épicerie du coin.
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis allé {item} à l'épicerie du coin.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Rapidement è un avverbio e resta invariato.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson03.fill.005
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: fill_in_blank
  frame:
    text: Je n'ai pas {item} venir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pu è il participio di pouvoir; n'ai pas racchiude l'ausiliare.
    language_code: it
    direction: ltr
- content_key: practice.it-fr.fr.a1.unit12.lesson03.translate.006
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: translation
  frame:
    text: Hai trovato del burro laggiù? (informale, tu)
    language_code: it
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu as trouvé du beurre {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu as trouvé? è informale, e du beurre significa «del burro».
    language_code: it
    direction: ltr
