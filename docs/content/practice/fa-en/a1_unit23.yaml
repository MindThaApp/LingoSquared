schema_version: "1.0"
pack_key: practice.fa-en.a1.unit23
source_language: fa
target_language: en
unit_content_key: en.a1.unit23.work
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the Claude session extending fa-en's practice
    pool to units 21-26. Uses nl-en's a1_unit23.yaml as the structural
    reference: the shared 5-member 'occupation_noun' tag (teacher/nurse/
    engineer/cook/driver) for bare-word recognition, plus the narrower
    4-member 'occupation_a' tag (excludes 'engineer') for the generative
    "I'm a {item}." frame -- real content shows "I'm a nurse." but "I'm
    an engineer." (engineer starts with a vowel sound), so 'engineer'
    must never be offered as a candidate there or the sampler generates
    "I'm a engineer." Both tags already existed in scripts/
    _en_target_lexeme_common.py; only the Farsi gloss dict/UNIT_FILES
    needed extending.

    REAL ANCHORING BUG FOUND AND AVOIDED (same class as fa-en's own
    a1_unit08.yaml market_dialogue incident): verified via a direct
    iter_specs() dump, grouped by lesson_content_key, that
    en.a1.unit23.lesson02.what_do_you_do introduces ZERO new lexemes for
    this direction -- every one of its introduced_tokens ("What"/"do"/
    "you"/"I'm"/"a"/"Where"/"work") was already taught in an earlier
    unit (as far back as unit01/unit09). A template anchored there would
    fail practice import with "lesson key ... was not found in the
    course" on a genuinely fresh stack, exactly like the unit08 incident.
    nl-en's own a1_unit23.yaml pack anchors its lesson02 templates
    (order.001/complete.002) to this exact lesson_content_key -- it may
    carry the same latent bug there (unverified for that direction, out
    of this pass's scope, not fixed here since it's a different
    direction's file). This pack's equivalent "I'm a {item}." templates
    are instead anchored to lesson01 (occupation_words), which DOES
    introduce new lexemes (nurse/cook/driver) and is a safe anchor.

    Every slot's real candidate count was verified with
    scripts/_practice_slot_check.py (extended to cover fa-en units
    21-26) and compile_content.py practice-validate. Needs the standard
    fresh-context review before import.

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened match.003 from
    2 to 5 pairs (occupation_noun/noun, real course-wide pool=5 -- cook/
    driver/engineer/nurse/teacher), no padding with untaught words.

    Re-anchor fix 2026-07-24 (unit-scope DEAD-template pass,
    docs/content/PRACTICE_PACK_RECIPE.md §1.1/DO-NOT #2):
    scripts/_practice_unit_scope_check.py flagged match.003 DEAD --
    "teacher"/"engineer" (2 of occupation_noun's 5 course-wide members)
    were already classified in an EARLIER unit (unit01), so
    generate_checkpoint()'s unit-scoped pool for occupation_noun is only
    3 (nurse/cook/driver), below the 5 declared slots. Re-anchored
    match.003 from the occupation_noun tag to a plain `part_of_speech:
    noun` constraint (no semantic tag, recipe §3.1(c) -- matching_pairs
    has no frame-literal-text grammaticality concern, unlike
    word_order/fixed-sentence translation, so this is safe here) and
    widened to the recipe's standard 6 slots. Verified via iter_specs()
    filtered to `.a1.unit23.`: the unit's own nouns are nurse/cook/driver
    (lesson01) plus patients/reports (lesson03) and
    company/downtown/emails/clients/job (lesson04) -- 10 distinct nouns,
    all distinct Farsi glosses, no confusable/case-duplicate pairs.
    choose.001/listen.002/translate.004/order.005/lesson03.choose.001/
    lesson04.listen.001/order.002/translate.003 were all already live
    (each has exactly the 3 unit-native occupation_noun/occupation_a
    candidates, meeting the >=3 MC/listen floor) and are UNCHANGED.
    Re-verified with scripts/_practice_unit_scope_check.py (0 DEAD, 0
    below-floor for this pack) and compile_content.py practice-validate.

    Polish wave-2 2026-07-25 (PRACTICE_PACK_RECIPE.md §8/§6.3):
    production tier had only 2 live templates (lesson01.translate.004,
    lesson04.translate.003). Added lesson03.translate.002 -- bare-word
    translation over the same part_of_speech:noun pool match.003 already
    uses (10 unit-native nouns, 10 distinct Farsi glosses; bare-word
    translation is safe POS-only per recipe §3.1(c)/§6.6(a), the prompt
    varies with the answer). Production tier now 3 live. match.003 was
    also flagged POS-only-matching this wave but is left POS-only
    DELIBERATELY: the unit's own lexemes carry only occupation_noun/
    occupation_a (3 members: nurse/cook/driver) and frequency_adverb (1:
    sometimes) -- no semantic union of unit-native tags can reach the
    6-distinct-token matching floor (max 4), and tags cannot be added in
    a PACK-ONLY pass; a wrong union is worse than the status quo.

    Polish wave-3 2026-07-26 (PRACTICE_PACK_RECIPE.md §3.1, generated-tag
    re-anchor): the wave-2 "honestly unfixable" call above is RESOLVED --
    commit 05af7ace added the generated `fa_en_a1_unit23_words` tag,
    first-introduction-only across all 4 lessons (14 unit-native tokens:
    answer/clients/company/cook/downtown/driver/emails/help/interesting/
    job/nurse/patients/reports/sometimes, all distinct Farsi glosses, no
    confusables). Re-anchored match.003 from the bare `part_of_speech:
    noun` constraint to a new `unit23_match_pool` preset (`part_of_speech:
    [noun, verb, adjective, adverb]` + `semantic: fa_en_a1_unit23_words`)
    -- a separate preset from the pre-existing `unit23_noun` anchor
    (kept untouched, still feeds lesson03.translate.002, not dispatched
    this wave) so the widening only touches match.003. Unit-scope pool
    unchanged in spirit (still every unit-native content word, now all 4
    POS instead of nouns-only, 14 tokens for 6 slots) but course-scope
    EXTRA drops from 779 off-theme words (verified via pool_check.py) to
    0 -- the tag is unit-scoped by construction. Still 6 slots (already
    at the recipe floor from the 2026-07-24 pass).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [occupation_noun, occupation_a, fa_en_a1_unit23_words]
slot_presets:
  occupation_noun: &occupation_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: occupation_noun}}
  occupation_a: &occupation_a {language_code: en, part_of_speech: noun, agreement_tags: {semantic: occupation_a}}
  unit23_noun: &unit23_noun {language_code: en, part_of_speech: noun}
  unit23_match_pool: &unit23_match_pool {language_code: en, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: fa_en_a1_unit23_words}}
templates:
  - content_key: practice.fa-en.en.a1.unit23.lesson01.choose.001
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit23.lesson01.listen.002
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit23.lesson01.match.003
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots:
      first: *unit23_match_pool
      second: *unit23_match_pool
      third: *unit23_match_pool
      fourth: *unit23_match_pool
      fifth: *unit23_match_pool
      sixth: *unit23_match_pool
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit23.lesson01.translate.004
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این شغل است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit23.lesson01.order.005
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: word_order
    frame: {text: "I'm a {item}", language_code: en, direction: ltr}
    slots: {item: *occupation_a}
    answer_derivation: {kind: render_frame, frame: {text: "I'm a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} شغلی است که ذکر شد.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit23.lesson03.choose.001
    lesson_content_key: en.a1.unit23.lesson03.reading_a_work_profile
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit23.lesson03.translate.002
    lesson_content_key: en.a1.unit23.lesson03.reading_a_work_profile
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit23_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit23.lesson04.listen.001
    lesson_content_key: en.a1.unit23.lesson04.work_profile_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که در این گفتگو شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit23.lesson04.order.002
    lesson_content_key: en.a1.unit23.lesson04.work_profile_dialogue
    type: word_order
    frame: {text: "I'm a {item}", language_code: en, direction: ltr}
    slots: {item: *occupation_a}
    answer_derivation: {kind: render_frame, frame: {text: "I'm a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} شغلی است که ذکر شد.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit23.lesson04.translate.003
    lesson_content_key: en.a1.unit23.lesson04.work_profile_dialogue
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این شغل است.", language_code: fa, direction: rtl}
