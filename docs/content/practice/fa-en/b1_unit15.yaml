schema_version: '1.0'
pack_key: practice.fa-en.b1.unit15
source_language: fa
target_language: en
unit_content_key: en.b1.unit15.complaints
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: "Review 2026-10-19 (fa-en practice pass, fresh context; 5 fixes). (1-4) fill_in_blank frames 'Please remember this word: ___' had no cue at all and a single-candidate pool (unanswerable) -> added a hint slot rendering the Persian gloss ('Type the English word for “{hint}”: ___'). (5) can't: gloss held English 'can' and mixed informal 2nd person -> نمی‌توانم. NATIVE FLAGS: none beyond house style. Prior note: Authored via scripted generation against PRACTICE_PACK_RECIPE.md. Recognition (multiple_choice/listen_select) and production (translation) templates use each lessons own fa_en_b1_unit15_lessonNN_words tag, restricted to content POS (noun/verb/adjective/adverb) and deduped by gloss; widened to the unit-wide fa_en_b1_unit15_words tag only for lessons whose own tag pool was <3 distinct glosses. fill_in_blank anchors use a lesson-tag + single-POS narrowing that yields exactly one course-wide candidate (the tag itself is unique to this lesson, so unit-scope pool == course-scope pool). matching_pairs pools the unit-wide tag, anchored to the richest lesson. Capacity/coverage/course-scope numbers reported separately by the authoring agent."
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - fa_en_b1_unit15_lesson01_words
    - fa_en_b1_unit15_lesson02_words
    - fa_en_b1_unit15_lesson03_words
    - fa_en_b1_unit15_lesson04_words
    - fa_en_b1_unit15_words
