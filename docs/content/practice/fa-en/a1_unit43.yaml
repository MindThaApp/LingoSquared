review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: |-
    Review 2026-10-19 (fa-en practice pass, fresh context; 6 fixes). (1) choose.001/translate.003/volume_listen.006/volume_translate.006: untaught/silly pool -- the all-ten-POS slot reached course-scope numbers, times, proper nouns, pronouns and particles (802 candidates); narrowed to noun/verb/adjective/adverb. (2) light=روشن and bright=روشن؛ درخشان were near-identical (also-correct, underdetermined translation): UNIT_SENSE_OVERRIDES split them (کم‌رنگ؛ روشن / پررنگ؛ درخشان); fun=جالب؛ سرگرم‌کننده -> شاد؛ سرگرم‌کننده for 'a fun color'. (3) three matching feedbacks and the volume_match.006 text_block were English -> Persian. NATIVE FLAGS: کم‌رنگ؛ روشن / پررنگ؛ درخشان for light/bright (colour sense); شاد for 'fun'; choose=انتخاب کردن vs choice=انتخاب are close in the matching pool; wearing=پوشیده است is written-style. BACKFILL GLOSS FLAGS: none beyond the overrides added.

    Authored 2026-07-12 as an additive Endless Practice coverage backfill for fa-en A1 unit 43. Uses the established broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions. Polish wave-2 (2026-07-25) — all three tiers had only 2 live templates; added one per tier (multiple_choice, 6-slot matching_pairs, bare-word translation) anchored to previously template-less lessons, pooled over unit-native [noun, verb, adjective, adverb] content words. This unit's lexemes carry no semantic tags, so matching_pairs slots stay POS-only per the recipe §6.3 honest exception — no semantic union can reach 6 unit tokens. Polish wave-3 (2026-07-26) — commit 05af7ace generated fa_en_a1_unit43_* tags; the wave-2 honest-leave is resolved. Re-anchored lesson01.match.002 and its volume_match.006 sibling to a union of the lesson01/lesson03/lesson04 generated tags (17 unit tokens; lesson02's tag was left out of the union because its 'bright' (روشن؛ درخشان) and 'light' (روشن) glosses overlap enough to be confusable in a matching exercise) and raised both from 4 to 6 slots. Re-anchored lesson04.match.001 to its own generated lesson tag (7 tokens, clears the floor alone).
