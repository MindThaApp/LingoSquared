schema_version: '1.0'
pack_key: practice.fa-en.a1.unit43
source_language: fa
target_language: en
unit_content_key: en.a1.unit43.colors
review:
  status: unreviewed
  fresh_context: 'false'
  notes: Authored 2026-07-12 as an additive Endless Practice coverage backfill for fa-en A1 unit 43. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.
    Polish wave-2 (2026-07-25) — all three tiers had only 2 live templates; added one per tier (multiple_choice, 6-slot
    matching_pairs, bare-word translation) anchored to previously template-less lessons, pooled over unit-native
    [noun, verb, adjective, adverb] content words. This unit's lexemes carry no semantic tags, so matching_pairs slots
    stay POS-only per the recipe §6.3 honest exception — no semantic union can reach 6 unit tokens.
    Polish wave-3 (2026-07-26) — commit 05af7ace generated fa_en_a1_unit43_* tags; the wave-2 honest-leave is resolved.
    Re-anchored lesson01.match.002 and its volume_match.006 sibling to a union of the lesson01/lesson03/lesson04
    generated tags (17 unit tokens; lesson02's tag was left out of the union because its 'bright' (روشن؛ درخشان) and
    'light' (روشن) glosses overlap enough to be confusable in a matching exercise) and raised both from 4 to 6 slots.
    Re-anchored lesson04.match.001 to its own generated lesson tag (7 tokens, clears the floor alone).
