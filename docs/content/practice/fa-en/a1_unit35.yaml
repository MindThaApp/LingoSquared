  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: device_noun_a
  answer_derivation:
    kind: render_frame
    frame:
      text: I have a {item}
      language_code: en
      direction: ltr
  feedback_frame:
    text: I have a {item}
    language_code: en
    direction: ltr
