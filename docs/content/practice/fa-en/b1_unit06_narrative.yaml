schema_version: '1.0'
pack_key: practice.fa-en.b1.unit06
source_language: fa
target_language: en
unit_content_key: en.b1.unit06.narrative
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (fa-en practice pass, fresh context; 8 fixes). (1) answer-leak Latin removed from glosses pull, over, word, went ('pull over', 'be over', 'keep one's word', 'go'); (2) wrong-sense glosses: pull/pulled 'کنار زدن' -> 'کنار کشیدن/کنار کشید', stopped (a car stopped to help) -> 'ایستاد', when 'چه وقت' (question) -> 'وقتی که', work (to work = workplace) -> 'کار؛ محل کار'. NATIVE FLAGS: 'کنار کشید' for pulled over; 'کار؛ محل کار' for work. BACKFILL GLOSS FLAGS: got=گرفت (global; unit uses it in the sense of arrive/get) duplicates caught/took; said=گفت duplicates told in course scope.

    Grammar-unit recipe (PRACTICE_PACK_RECIPE.md sec8.1) applied: per-lesson multiple_choice + listen_select + bare-word translation for each of the 4 lessons (using the pre-existing per-lesson union tag fa_en_b1_unit06_lessonNN_words when it hosts >=3 distinct-gloss content-POS lexemes, content POS [noun,verb,adjective,adverb,phrase] only, pronoun/preposition/particle/proper_noun excluded), plus 3 matching_pairs (6 pairs each) pooling the unit-wide union tag fa_en_b1_unit06_words (one full-content-POS pool anchored to the reading lesson, one anchored to the dialogue lesson, one restricted to verb/adjective/adverb/phrase anchored to the grammar lesson). 15 templates total, 8 recognition (MC+listen) / 3 structured (matching_pairs) / 4 production (translation). Deliberately skipped word_order and fill_in_blank across this whole batch: crafting course-scope-safe hero-sentence frames for 13 units individually was judged too defect-prone for this pass's review budget; matching_pairs carries the structured tier instead (no frame-literal-text risk, so no course-scope grammaticality check needed). Flagging this gap to the coordinator -- a follow-up pass adding word_order/fill_in_blank hero sentences per unit would add pedagogical variety this pack currently lacks. Lessons lesson04 had fewer than 3 distinct-gloss lexemes actually carrying their own per-lesson union tag (checked by real tag membership, not just lesson_content_key co-location -- several lexemes in every lesson carry no semantic tag at all), so their multiple_choice/listen_select slots use the unit-wide union tag fa_en_b1_unit06_words instead (still anchored via lesson_content_key to that lesson per PRACTICE_PACK_RECIPE.md sec8.1 step2). No mis-glossed lexemes found while reading every gloss in this unit's pool (all distinct-token counts matched distinct-gloss counts, so no gloss collisions either).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - fa_en_b1_unit06_lesson01_words
    - fa_en_b1_unit06_lesson02_words
    - fa_en_b1_unit06_lesson03_words
    - fa_en_b1_unit06_lesson04_words
    - fa_en_b1_unit06_words
