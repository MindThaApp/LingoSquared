schema_version: "1.0"
pack_key: practice.fa-en.a1.unit21
source_language: fa
target_language: en
unit_content_key: en.a1.unit21.travel
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the Claude session extending fa-en's practice
    pool to units 21-26 (A1: travel/health/work/housing, A2: bureaucracy/
    opinions), alongside two parallel workers covering units 09-14 and
    15-20 (no file overlap -- this pack only touches unit21). Uses the
    nl-en direction's already-built a1_unit21.yaml as the structural
    reference (same shared English realization, same travel_noun tag
    defined in scripts/_en_target_lexeme_common.py: ticket/platform/
    train/departure/arrival, 5 members, recognition-only -- these nouns
    don't collocate uniformly in a shared sentence frame ("I need a
    ticket"/"I need a train" work but "I need a platform"/"departure"/
    "arrival" don't), same discipline nl-en's own unit21 pack documented.
    No new EN_POS/agreement_tags entries were needed (already present
    from the nl-en lane's own unit21 work); only
    scripts/backfill_lexemes_fa_en.py's Farsi gloss dict and UNIT_FILES
    tuple were extended.

    IMPORTANT anchoring finding (checked programmatically before writing
    any template, following the "real bug" precedent documented in this
    same direction's a1_unit08.yaml pack notes): a lesson_content_key is
    only a valid template anchor if at least one Lexeme row is actually
    created with that lesson as its provenance -- a lesson whose every
    introduced_token was already taught earlier creates ZERO new Lexeme
    rows and makes `_practice_lesson_id()` fail to resolve it entirely.
    Verified via a direct iter_specs() dump, grouped by
    lesson_content_key, against every lesson in this unit's own
    realization file: all four of unit21's lessons introduce at least
    one new lexeme, so all four are safe anchors (unlike unit23's
    lesson02, see that pack's notes for the one lesson in this batch
    that failed this check).

    Every slot's real candidate count was verified with
    scripts/_practice_slot_check.py (extended in this same change to
    cover fa-en units 21-26) and compile_content.py practice-validate.
    Needs the standard fresh-context review before import.

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened match.003 from
    2 to 5 pairs (travel_noun/noun, real course-wide pool=5 -- arrival/
    departure/platform/ticket/train), no padding with untaught words.

    Polish wave-2 2026-07-25 (tier-thinness, PRACTICE_PACK_RECIPE.md §8):
    structured tier had only 1 live template (match.003). Added 2
    word_order templates (lesson02.order.003 "Can you tell me about the
    {item}", lesson03.order.003 "This is the {item}"), both on the
    unit-native travel_noun slot. Grammaticality checked at COURSE scope
    (recipe §1.1/§6.4): travel_noun's course-wide a1 pool is exactly the
    5 unit members (arrival/departure/platform/ticket/train -- verified
    via pool_check), and every one is grammatical in both frames (ticket
    counter / reading-a-ticket context); no frame literal word is a slot
    candidate (defect 1.14 clear). Structured tier now 3 live.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [travel_noun]
slot_presets:
  travel_noun: &travel_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: travel_noun}}
templates:
  - content_key: practice.fa-en.en.a1.unit21.lesson01.choose.001
    lesson_content_key: en.a1.unit21.lesson01.travel_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *travel_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit21.lesson01.listen.002
    lesson_content_key: en.a1.unit21.lesson01.travel_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *travel_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit21.lesson01.match.003
    lesson_content_key: en.a1.unit21.lesson01.travel_vocabulary
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *travel_noun, second: *travel_noun, third: *travel_noun, fourth: *travel_noun, fifth: *travel_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth]}
    feedback_frame: {text: "هر واژهٔ سفر را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit21.lesson01.translate.004
    lesson_content_key: en.a1.unit21.lesson01.travel_vocabulary
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *travel_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژهٔ فارسی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit21.lesson02.listen.001
