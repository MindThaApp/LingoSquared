    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit21.lesson02.translate.002
    lesson_content_key: en.a1.unit21.lesson02.buying_a_ticket
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *travel_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژهٔ فارسی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit21.lesson02.order.003
    lesson_content_key: en.a1.unit21.lesson02.buying_a_ticket
