schema_version: "1.0"
pack_key: practice.fa-en.a2.unit31
source_language: fa
target_language: en
unit_content_key: en.a2.unit31.travel_disruption
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (fa-en practice pass, fresh context; 2 fixes, gloss overrides). way=طرف (side) -> راه
    ("another way to get home"); leaves="حرکت می‌کنه (فعل، سوم‌شخص مفرد leave)" printed the English base verb
    in the translation prompt -> حرکت می‌کنه. All 13 templates, pools and feedback checked; fill_in_blank
    (There is a problem on the {item}.) has a single candidate (tracks) and is safe. NATIVE FLAGS: none.

    24 lexemes across all 4 lessons (5/6/9/4). Recognition/production use
    each lesson's own tag narrowed to [noun, verb, adjective, adverb]
    (excludes the three bare-symbol clock times 5:15/6:00/5:30 and the
    untagged preposition "from"). Two matching_pairs (6 pairs each):
    lesson02's tag narrowed to [noun, adjective, adverb] gives exactly 6
    (why/train/delayed/another/way/tonight); lesson03's tag narrowed to
    [noun, adverb] gives exactly 6 (departure/time/bus/station/outside/
    instead) -- the three clock-time symbols are excluded by the
    part_of_speech filter itself. No confusable/duplicate glosses in either
    pool. lesson04 has only 4 lexemes and its single noun ("tracks") is
    already a single-member anchor once narrowed by part_of_speech, so
    fill_in_blank ("There is a problem on the {item}.") is safe and grounded
    in the realization's own "signal problem on the tracks" line. No
    mis-glossed lexeme found. 13 templates, all 4 lessons represented in
    recognition and production; lesson04 additionally gets the structured-tier
    fill_in_blank.
