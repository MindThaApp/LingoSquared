    type: word_order
    frame: {text: "The problem is in the {item}", language_code: en, direction: ltr}
    slots: {item: *room_noun}
    answer_derivation: {kind: render_frame, frame: {text: "The problem is in the {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} واژه‌ای است که در این جمله به کار رفته است.", language_code: fa, direction: rtl}
