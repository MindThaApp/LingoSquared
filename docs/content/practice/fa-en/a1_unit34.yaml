    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: We play {item}
      language_code: en
      direction: ltr
  feedback_frame:
    text: '{item} ورزشی توپی است که با فعل play می‌آید.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit34.lesson01.translate_sentence.006
