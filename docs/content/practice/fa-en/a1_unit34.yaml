schema_version: '1.0'
pack_key: practice.fa-en.a1.unit34
source_language: fa
target_language: en
unit_content_key: en.a1.unit34.sports
review:
  status: reviewed
  fresh_context: true
  notes: 'Authored 2026-07-11, fa-en depth-audit lane (unit 5 of the 30-42 batch, see unit30''s pack notes for the full batch
    rationale).

    Two semantic tags: ''sport_noun'' (soccer/tennis/basketball/swimming/ yoga from lesson01, all five sport/activity nouns
    this unit introduces, bare recognition only -- the real content pairs each with a DIFFERENT verb, play/go/do, per the
    overlay''s own explicit note on this) and the narrower ''ball_sport'' (soccer/tennis/ basketball, the 3-member subset
    that genuinely collocates with "play", safe in "We play {item}.").

    Anchoring check: lesson01 introduces all five sport nouns as real new lexemes, verified via iter_specs(). Slot candidate
    counts verified with scripts/_practice_slot_check.py and compile_content.py practice-validate. Needs the standard fresh-context
    review before import.

    Fresh-context review 2026-07-11 (zero access to authoring reasoning): verified every slot member is taught in this unit''s
    realization, every generative frame is grammatical for all fillings, Farsi feedback/instruction text reads as natural
    Iranian Farsi with correct RTL/ZWNJ, answer shapes (word_order list-shaped, matching_pairs covers every pair) are sound,
    listen_select distractors are distinct single vocabulary words, and no bare YAML booleans or snake_case jargon leak. compile_content.py
    practice-validate, scripts/_practice_slot_check.py, and backfill_lexemes_fa_en.py --dry-run all clean. No defects found;
    upgraded to reviewed.


    Polish wave-2 2026-07-25 (tier-thinness pass, recipe §8): recognition and production were 2 live each. Added
    choose_noun.007 (MC over a plain part_of_speech:noun constraint, anchored lesson02 which previously had no
    template -- the unit natively introduces 15 distinct nouns with distinct Farsi glosses, comfortably over the
    3-option floor; proper nouns excluded by POS, "exercise" excluded because backfill classifies it as a verb)
    and translate_sentence.008 ("خواهرم {item} بازی می‌کنه." -> "My sister plays {item}" over ball_sport, anchored
    lesson03 -- named-relative subject chosen so the typed answer is not underdetermined between He/She the way a
    bare "اون" would be; ball_sport''s course-wide pool is exactly soccer/tennis/basketball, all grammatical).
    Tiers now 3/3/3 live. NOT touched (below-floor line not dispatched): match.003 stays at 5 pairs -- sport_noun''s
    unit-native noun pool is exactly the 5 sports (the 6th tag member "exercise" is a verb, excluded by the
    preset''s part_of_speech:noun).'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - sport_noun
    - ball_sport
slot_presets:
  sport_noun: &id001
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: sport_noun
  ball_sport: &id002
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: ball_sport
templates:
- content_key: practice.fa-en.en.a1.unit34.lesson01.choose.001
  lesson_content_key: en.a1.unit34.lesson01.sports_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: معنی فارسی {item} را انتخاب کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit34.lesson01.listen.002
  lesson_content_key: en.a1.unit34.lesson01.sports_vocabulary
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: واژه‌ای که شنیدید {item} بود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit34.lesson01.match.003
  lesson_content_key: en.a1.unit34.lesson01.sports_vocabulary
  type: matching_pairs
  frame:
    text: '{first} — {second}'
    language_code: en
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
  feedback_frame:
    text: هر ورزش را به معنی فارسی خودش وصل کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit34.lesson01.translate.004
  lesson_content_key: en.a1.unit34.lesson01.sports_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: پاسخ درست، معادل انگلیسی این ورزش است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit34.lesson01.order.005
  lesson_content_key: en.a1.unit34.lesson01.sports_vocabulary
  type: word_order
  frame:
