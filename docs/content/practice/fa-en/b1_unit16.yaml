schema_version: '1.0'
pack_key: practice.fa-en.b1.unit16
source_language: fa
target_language: en
unit_content_key: en.b1.unit16.advice
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (fa-en practice pass, rest): 3 fixes -- the three fill_in_blank blanks (Please remember this word: ___) had no cue and a single-candidate pool, added the hint slot rendering the Persian gloss, as in b1_unit15. Written-register third-person verb glosses (e.g. می‌شود/می‌کند) sit in colloquial-register units; house style, left. NATIVE FLAGS: advice glossed نصیحت (preachy; توصیه/راهنمایی may be better) left to native review. BACKFILL GLOSS FLAGS: leading (رهبری کردن, unit means managing two projects) -- override proposed in the F3 log.

    Authored via scripted generation against PRACTICE_PACK_RECIPE.md. Recognition (multiple_choice/listen_select)
    and production (translation) templates use each lessons own fa_en_b1_unit16_lessonNN_words tag, restricted
    to content POS (noun/verb/adjective/adverb) and deduped by gloss; widened to the unit-wide fa_en_b1_unit16_words
    tag only for lessons whose own tag pool was <3 distinct glosses. fill_in_blank anchors use a lesson-tag
    + single-POS narrowing that yields exactly one course-wide candidate (the tag itself is unique to
    this lesson, so unit-scope pool == course-scope pool). matching_pairs pools the unit-wide tag, anchored
    to the richest lesson. Capacity/coverage/course-scope numbers reported separately by the authoring
    agent.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - fa_en_b1_unit16_lesson01_words
    - fa_en_b1_unit16_lesson02_words
    - fa_en_b1_unit16_lesson03_words
    - fa_en_b1_unit16_lesson04_words
    - fa_en_b1_unit16_words
