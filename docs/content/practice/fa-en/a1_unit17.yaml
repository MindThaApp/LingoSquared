schema_version: "1.0"
pack_key: practice.fa-en.a1.unit17
source_language: fa
target_language: en
unit_content_key: en.a1.unit17.plans
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the practice-pool-sync lane extending fa-en
    coverage to units 15-20, mirroring nl-en's already-reviewed
    a1_unit17.yaml. Same deliberate scope decision as nl-en's unit17:
    lesson01 (proposing an activity: "Do you want to see a movie...?"/
    "Would you like to go for a walk?") gets ZERO generated templates --
    neither invitation phrase mentions a specific day/time/place that could
    vary, and none of this lesson's other vocabulary (want/movie/weekend/
    would/walk) has a same-lesson synonym group. The other three lessons
    all reuse the already-established 7-member weekday tag (from unit04) --
    genuinely apt here since this whole unit is about scheduling: "I'm busy
    on {item}." (lesson02), "Do you want to have lunch on {item}?"
    (lesson03), "{item} works for me." (lesson04) are all grammatical with
    any weekday. All POS/semantic-tag classification was already present
    in scripts/_en_target_lexeme_common.py before this pass -- only
    scripts/backfill_lexemes_fa_en.py's own Farsi gloss dict needed
    extending (want/movie/weekend/would/walk/love/busy/maybe/another/lunch/
    1pm/works; "sorry"/"can't"/"about"/"me" reuse their existing Unit 14/
    10/14/9 senses unchanged). Verified with scripts/_practice_slot_check.py
    that every slot has >=1 real candidate lexeme and every multiple_choice/
    listen_select slot has >=4 distinct candidate values (weekday has 7).
    The underlying en realization unit17 is UNREVIEWED (Codex was
    usage-limited at authoring time), same as the fa-en overlay's
    realization dependency -- needs the standard fresh-context review
    before import.
tag_schema:
  part_of_speech: [noun]
  agreement_tags:
    semantic: [weekday]
slot_presets:
  weekday: &weekday {language_code: en, part_of_speech: noun, agreement_tags: {semantic: weekday}}
templates:
  - content_key: practice.fa-en.en.a1.unit17.lesson02.busy_order.001
    lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
    type: word_order
    frame: {text: "I'm busy on {item}", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "I'm busy on {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} روزی است که شلوغ است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit17.lesson02.busy_translate.003
    lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
    type: translation
    frame: {text: "روز {item} سرم شلوغه.", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "I'm busy on {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "I'm busy on {item} یعنی روز {item} سرم شلوغه.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit17.lesson02.weekday_listen.004
    lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} روزی است که شنیدید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit17.lesson03.lunch_order.001
    lesson_content_key: en.a1.unit17.lesson03.reading_an_invitation
    type: word_order
    frame: {text: "Do you want to have lunch on {item}", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "Do you want to have lunch on {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} روز پیشنهادی برای ناهار است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit17.lesson03.lunch_translate.003
    lesson_content_key: en.a1.unit17.lesson03.reading_an_invitation
    type: translation
    frame: {text: "می‌خوای {item} ناهار بخوریم؟", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "Do you want to have lunch on {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "Do you want to have lunch on {item}؟ یعنی می‌خوای {item} ناهار بخوریم؟", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit17.lesson04.works_order.001
    lesson_content_key: en.a1.unit17.lesson04.negotiating_a_plan_dialogue
    type: word_order
    frame: {text: "{item} works for me", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "{item} works for me", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} روزی است که مناسب است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit17.lesson04.works_translate.003
    lesson_content_key: en.a1.unit17.lesson04.negotiating_a_plan_dialogue
    type: translation
    frame: {text: "{item} برای من خوبه.", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "{item} works for me", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} works for me یعنی {item} برای من خوبه.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit17.lesson04.weekday_listen.004
    lesson_content_key: en.a1.unit17.lesson04.negotiating_a_plan_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} روزی است که شنیدید.", language_code: fa, direction: rtl}
