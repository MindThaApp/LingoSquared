review:
  status: unreviewed
  fresh_context: false
  notes: 'Authored 2026-07-06 by the practice-pool-sync lane extending fa-en coverage to units 15-20, mirroring nl-en''s already-reviewed
    a1_unit17.yaml. Same deliberate scope decision as nl-en''s unit17: lesson01 (proposing an activity: "Do you want to see
    a movie...?"/ "Would you like to go for a walk?") gets ZERO generated templates -- neither invitation phrase mentions
    a specific day/time/place that could vary, and none of this lesson''s other vocabulary (want/movie/weekend/ would/walk)
    has a same-lesson synonym group. The other three lessons all reuse the already-established 7-member weekday tag (from
    unit04) -- genuinely apt here since this whole unit is about scheduling: "I''m busy on {item}." (lesson02), "Do you want
    to have lunch on {item}?" (lesson03), "{item} works for me." (lesson04) are all grammatical with any weekday. All POS/semantic-tag
    classification was already present in scripts/_en_target_lexeme_common.py before this pass -- only scripts/backfill_lexemes_fa_en.py''s
    own Farsi gloss dict needed extending (want/movie/weekend/would/walk/love/busy/maybe/another/lunch/ 1pm/works; "sorry"/"can''t"/"about"/"me"
    reuse their existing Unit 14/ 10/14/9 senses unchanged). Verified with scripts/_practice_slot_check.py that every slot
    has >=1 real candidate lexeme and every multiple_choice/ listen_select slot has >=4 distinct candidate values (weekday
    has 7). The underlying en realization unit17 is UNREVIEWED (Codex was usage-limited at authoring time), same as the fa-en
    overlay''s realization dependency -- needs the standard fresh-context review before import.

    Deepened 2026-07-07 (templates-per-unit audit found this unit tied-shallowest in fa-en at 8, just authored the same night,
    alongside sibling prs-en''s identical unit17 tied at the same count and deepened the same night -- mirrored its additions
    here with fresh Farsi, not copied Dari). weekday (7 members) is the only genuinely generative tag this unit supports (confirmed
    above: none of this unit''s other single-token vocabulary -- want/movie/weekend/ would/walk/love/busy/maybe/another/lunch/1pm/works
    -- has its own semantic group). Added 3 new templates, all reusing weekday with exercise TYPES this unit hadn''t used
    yet (word_order/translation/ listen_select already existed at 2-3 lessons each; multiple_choice/ matching_pairs did not):
    a lesson03 listen_select (parity fix -- lesson02/04 already had one, lesson03 didn''t), a lesson04 multiple_choice (bare-word
    Farsi-gloss recognition), and a lesson04 matching_pairs using all 7 weekday members (AUTHORING_GUIDE.md #16 -- exactly
    the "6-12 real pairs" range, not padded). No new EN_POS/semantic-tag or Farsi-gloss additions needed -- weekday was already
    fully classified/glossed since unit04 (confirmed by re-reading scripts/_en_target_lexeme_common.py and scripts/ backfill_lexemes_fa_en.py
    fresh before this edit). Considered fill_in_blank for weekday (e.g. blanking "I''m busy on {item}") but rejected it: all
    7 weekdays are genuinely grammatical in every one of this unit''s real frames with nothing else to disambiguate -- scripts/_fill_in_blank_ambiguity_check.py
    (and compile_content.py''s hard-fail per AUTHORING_GUIDE.md #17) would correctly flag it, so zero new fill_in_blank templates,
    matching this direction''s own established "zero is fine when real vocabulary can''t safely support one" precedent. Re-verified
    scripts/_practice_slot_check.py (weekday still safely >=3 for the new multiple_choice, >=2 for matching_pairs) and scripts/_fill_in_blank_ambiguity_check.py
    (zero new AMBIGUOUS flags) before import. New count: 11 templates (8 -> 11) -- an honest ceiling given weekday is the
    unit''s only real generative tag.'
