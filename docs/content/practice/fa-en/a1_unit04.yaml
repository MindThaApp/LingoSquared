review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (fa-en practice pass, fresh context; 0 fixes). All 15 templates checked: weekday/month/ordinal pools clean, glosses distinct, frame ''It''s {weekday}, {month} {day_ordinal}'' grammatical for all combos. Minor, unfixed: lesson03 word_order can draw 9th (taught in lesson04). NATIVE FLAGS: none. Authored 2026-07-06 by a fork of the practice-pool-sync lane, picking up the en-fa/fa-en/en-prs gap this same session''s
    coordinator split off into a separate lane. This unit''s English-side POS/agreement-tag classification (weekday/month/day_ordinal)
    was already added to the shared scripts/_en_target_lexeme_common.py module by the nl-en lane for its own unit04 pack --
    only a Farsi gloss dict extension was needed in scripts/backfill_lexemes_fa_en.py, no new classification work. The 3-slot
    "It''s {weekday}, {month} {day_ordinal}." frame (lesson03) was checked for self-reference/agreement risk and is safe:
    it''s a generic date-announcement pattern where any weekday + any month + any of the 3 introduced ordinals (7th/3rd/9th)
    combine grammatically. Verified with scripts/_practice_slot_check.py (no DB needed) that every slot has >=1 candidate
    and every multiple_choice/matching_pairs slot has >=3 distinct candidate values, per this lane''s established threshold
    (mirrors build_prompt()''s real `len(options) < 3` reject).

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened both matching_pairs templates from 2 to their full real course-wide
    pools per the retrofit table -- weekday_pair.003 (weekday/noun, pool=7) and month_pair.003 (month/noun, pool=5). Neither
    pads with untaught words.'
