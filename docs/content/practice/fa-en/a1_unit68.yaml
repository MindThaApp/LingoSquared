  lesson01_verb: &lesson01_verb {language_code: en, part_of_speech: verb, agreement_tags: {semantic: fa_en_a1_unit68_lesson01_words}}
  lesson02_single: &lesson02_single {language_code: en, part_of_speech: noun, agreement_tags: {semantic: fa_en_a1_unit68_lesson02_words}}
  lesson04_pool: &lesson04_pool {language_code: en, part_of_speech: verb, agreement_tags: {semantic: fa_en_a1_unit68_lesson04_words}}
