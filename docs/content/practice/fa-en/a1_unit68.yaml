schema_version: "1.0"
pack_key: practice.fa-en.a1.unit68
source_language: fa
target_language: en
unit_content_key: en.a1.unit68.borrowing_lending
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (fa-en practice pass, rest; 4 fixes). (1) fill.004 'I need a {item}.' and (2) lesson02.fill.003 'Thank you for {item} it.' had no cue -> added hint slots rendering the Persian gloss. (3) order.005 'Can you {item} me a charger' lacked '?' (frame and answer). (4) lesson04.order.003 feedback ('simple past or simple verb') was wrong/meaningless for share/lent/remember -> 'جملهٔ درست: I {item} it.'. NATIVE FLAGS: remember=به یاد آوردن (reading means keep in mind: به یاد داشتن/یادش بمونه); lending=قرض‌دهی as a gerund noun in 'Thank you for lending it'. BACKFILL GLOSS FLAGS: share=شریک شدن is the wrong sense for 'Friends Who Share' (override proposed).

    THINNEST unit of the batch but the richest of the a1_unit62-68 group:
    backfill_lexemes_fa_en.py registers 7 lexemes (lend/charger in lesson01,
    lending in lesson02, leila's/share/lent/remember in lesson04). "leila's"
    is an untagged possessive pronoun and is excluded from every slot via
    part_of_speech: [noun, verb], leaving exactly 6 distinct content tokens
    -- enough to clear the matching_pairs 6-pair floor for the first time in
    this batch. 12 templates (meets the template-count bar; distinct-item
    volume is still thin because the underlying vocabulary is thin).
    lesson01's tag narrowed by part_of_speech gives two single-member
    anchors (noun->charger, verb->lend); lesson02's tag is already single
    (lending). lesson04's three verbs (share/lent/remember) cannot be
    narrowed to one by part_of_speech, so instead of a false single-member
    anchor its word_order frame ("I {item} it.") was checked by hand against
    all three -- "I share it.", "I lent it.", "I remember it." are all
    grammatical, so the broad pool is legitimate per the recipe's
    every-pool-member-must-be-grammatical rule (checked at course scope:
    the lesson04 tag is unique to this unit, so course-wide membership ==
    unit-scoped membership). No mis-glossed lexeme found. FLAG FOR
    COORDINATOR: distinct-item volume will likely still leave the
    checkpoint <12 generatable items given only 6 content tokens exist --
    lesson03 has zero lexemes entirely and is invisible to the checkpoint;
    routing to backfill recommended.
