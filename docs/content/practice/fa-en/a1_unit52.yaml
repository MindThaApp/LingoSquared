schema_version: '1.0'
pack_key: practice.fa-en.a1.unit52
source_language: fa
target_language: en
unit_content_key: en.a1.unit52.personal_care
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (fa-en practice pass, fresh context; 1 gloss override (trim: now clearly distinct from haircut in MC/matching pools). NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: none beyond the overrides.) Generated per PRACTICE_PACK_RECIPE.md §8 vocabulary pattern, adapted with the §8.1 union technique:
    multiple_choice/listen_select/bare-word translation slots use the unit-wide union tag `fa_en_a1_unit52_words`
    (10 distinct content tokens, part_of_speech restricted to [noun, verb, adjective, adverb, phrase]
    to exclude symbols/pronouns/prepositions/particles/proper nouns) so every lesson''s recognition/production
    templates clear the 3-option floor even though individual lessons hold as few as 1-2 content words.
    fill_in_blank/word_order anchors use per-lesson tags (`fa_en_a1_unit52_lessonNN_words`), which are
    lesson-unique strings not reused anywhere else in the corpus, so their course-scope candidate pool
    is identical to their unit-scope pool (§1.1) -- verified by construction, each anchor narrowed by
    part_of_speech to exactly 1 course-wide candidate. matching_pairs anchored to the richest lessons,
    drawn from the unit-wide tag (10 distinct tokens, well above the 6-pair floor). No mis-glossed lexemes
    found on manual gloss read (§0.1); every content-POS token''s english_gloss field matches the sense
    used in the realization file. POLISH 2026-07-25: added lesson01.translate.007 (bare-word translation,
    unit tag narrowed to [noun] -- 6 distinct tokens) to bring the production tier to 3 live templates.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - fa_en_a1_unit52_lesson01_words
    - fa_en_a1_unit52_words
templates:
- content_key: practice.fa-en.en.a1.unit52.lesson01.choose.001
  lesson_content_key: en.a1.unit52.lesson01.personal_care_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: &id001
      - noun
      - verb
      - adjective
      - adverb
      - phrase
      agreement_tags:
        semantic: fa_en_a1_unit52_words
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌هایی است که در این درس آموزش داده شده است.'
    language_code: fa
    direction: rtl
