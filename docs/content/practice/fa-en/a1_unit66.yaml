schema_version: "1.0"
pack_key: practice.fa-en.a1.unit66
source_language: fa
target_language: en
unit_content_key: en.a1.unit66.pharmacy_symptoms
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (fa-en practice pass, rest; 2 fixes). fill.005 'My throat {item}.' and lesson03.fill.003 'It is getting {item}.' had no cue (hurts/aches; worse/better) -> added hint slots rendering the Persian gloss. Checked: pool symptom/hurts/worse distinct; lesson02 phrase translations determined (apart from do you have medicine/any medicine). NATIVE FLAGS: symptom=علامت بیماری; hurts=درد می‌کند (written) beside گلوم درد می‌کنه. BACKFILL GLOSS FLAGS: none.

    THIN UNIT: backfill_lexemes_fa_en.py registers only 3 lexemes (symptom/
    hurts in lesson01, worse in lesson03; lesson02/lesson04 have zero
    lexemes and are invisible to any checkpoint). 8 templates at genuine
    capacity: MC/listen/translation pool = unit-wide tag (all 3 distinct,
    exactly at the 3-option floor). matching_pairs omitted (needs 6, only 3
    exist). lesson01's tag narrowed by part_of_speech gives two
    single-member anchors (noun->symptom, verb->hurts), framed from the
    realization's own example sentences ("This is a symptom.", "My throat
    hurts."). lesson03's tag is already single-member (worse); frame "It is
    getting {item}." reflects the pharmacy-dialogue condition_adjective
    usage. Course-scope check: all lesson-level tags are unique to this
    unit, so course-wide membership == unit-scoped membership. No
    mis-glossed lexeme found. FLAG FOR COORDINATOR: checkpoint will very
    likely stay <12 items unless lessons 02/04 get lexeme coverage --
    routing to backfill recommended.

    Polish wave 2 (2026-07-25, tier-thinness): the backfill NOW carries 17
    lexemes for this unit (the note above predates lesson02/04 phrase
    coverage -- lesson02 has 6 clean phrase lexemes under its own
    fa_en_a1_unit66_lesson02_words tag). Production tier was 2 live
    translations (<3): added lesson02.translate.001, a bare phrase
    translation over that lesson02 tag (6 candidates; tag is unique to
    this unit so unit scope == course scope; bare '{item}' frame so
    self-reference/grammaticality are moot; precedent prs-en a1_unit66
    lesson04.translate.001, here scoped to lesson02 to keep the lesson03
    narration-glossed dialogue lines and the lesson04 mega-phrase OUT of
    the typing pool). Production tier now 3 live; lesson02 gains its
    first template. Glosses of all 6 phrases checked -- clean, distinct,
    no narration prefixes.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [fa_en_a1_unit66_words, fa_en_a1_unit66_lesson01_words, fa_en_a1_unit66_lesson02_words, fa_en_a1_unit66_lesson03_words]
slot_presets:
  unit_pool: &unit_pool {language_code: en, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: fa_en_a1_unit66_words}}
  lesson01_noun: &lesson01_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: fa_en_a1_unit66_lesson01_words}}
  lesson01_verb: &lesson01_verb {language_code: en, part_of_speech: verb, agreement_tags: {semantic: fa_en_a1_unit66_lesson01_words}}
  lesson03_single: &lesson03_single {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: fa_en_a1_unit66_lesson03_words}}
  lesson02_phrase: &lesson02_phrase {language_code: en, part_of_speech: phrase, agreement_tags: {semantic: fa_en_a1_unit66_lesson02_words}}
templates:
  - content_key: practice.fa-en.en.a1.unit66.lesson01.choose.001
    lesson_content_key: en.a1.unit66.lesson01.symptom_words
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit66.lesson01.listen.002
    lesson_content_key: en.a1.unit66.lesson01.symptom_words
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit66.lesson01.translate.003
    lesson_content_key: en.a1.unit66.lesson01.symptom_words
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit_pool}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit66.lesson01.order.004
    lesson_content_key: en.a1.unit66.lesson01.symptom_words
    type: word_order
    frame: {text: "This is a {item}", language_code: en, direction: ltr}
    slots: {item: *lesson01_noun}
    answer_derivation: {kind: render_frame, frame: {text: "This is a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} یعنی «علامت بیماری».", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit66.lesson01.fill.005
    lesson_content_key: en.a1.unit66.lesson01.symptom_words
    type: fill_in_blank
    frame: {text: "My throat {item}. (“{hint}”)", language_code: en, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *lesson01_verb, hint: *lesson01_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} یعنی «درد می‌کند».", language_code: fa, direction: rtl}
