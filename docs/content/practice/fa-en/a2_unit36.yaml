      language_code: en
      part_of_speech: *id001
      agreement_tags:
        semantic: fa_en_a2_unit36_words
    second:
      language_code: en
      part_of_speech: *id001
      agreement_tags:
        semantic: fa_en_a2_unit36_words
    third:
