    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر واژه را به معنی فارسی خودش وصل کنید.
    language_code: fa
    direction: rtl
