schema_version: '1.0'
pack_key: practice.fa-en.a1.unit61
source_language: fa
target_language: en
unit_content_key: en.a1.unit61.apologies_excuses
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-22 (fa-en practice pass, rest; 0 fixes). All twelve templates checked: pool is the seven unit words (traffic, mistake, starts, waiting, note, apology, classroom) with distinct glosses; matching draws six of seven; feedback is Persian; no giveaways. NATIVE FLAGS: starts=شروع می‌شود and waiting=در حال صبر کردن (written/progressive forms next to colloquial glosses). BACKFILL GLOSS FLAGS: none.

    Generated per PRACTICE_PACK_RECIPE.md §8 vocabulary pattern, adapted with the §8.1 union technique:
    multiple_choice/listen_select/bare-word translation slots use the unit-wide union tag `fa_en_a1_unit61_words`
    (7 distinct content tokens, part_of_speech restricted to [noun, verb, adjective, adverb, phrase] to
    exclude symbols/pronouns/prepositions/particles/proper nouns) so every lesson''s recognition/production
    templates clear the 3-option floor even though individual lessons hold as few as 1-2 content words.
    fill_in_blank/word_order anchors use per-lesson tags (`fa_en_a1_unit61_lessonNN_words`), which are
    lesson-unique strings not reused anywhere else in the corpus, so their course-scope candidate pool
    is identical to their unit-scope pool (§1.1) -- verified by construction, each anchor narrowed by
    part_of_speech to exactly 1 course-wide candidate. matching_pairs anchored to the richest lessons,
    drawn from the unit-wide tag (7 distinct tokens, well above the 6-pair floor). No mis-glossed lexemes
    found on manual gloss read (§0.1); every content-POS token''s english_gloss field matches the sense
    used in the realization file.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - fa_en_a1_unit61_words
