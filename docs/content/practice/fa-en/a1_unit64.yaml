    frame: {text: "Thanks for {item} kind", language_code: en, direction: ltr}
    slots: {item: *lesson04_verb}
    answer_derivation: {kind: render_frame, frame: {text: "Thanks for {item} kind", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} صورت ing فعل be است.", language_code: fa, direction: rtl}
