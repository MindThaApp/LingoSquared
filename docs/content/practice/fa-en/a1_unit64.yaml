schema_version: "1.0"
pack_key: practice.fa-en.a1.unit64
source_language: fa
target_language: en
unit_content_key: en.a1.unit64.compliments
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (fa-en practice pass, fresh context; 1 gloss override (being: removed English sentence from gloss, it leaked the word_order answer). NATIVE FLAGS: phrase glosses (that is nice=اون خوبه etc.) are loose and the translation prompt is underdetermined (that is nice / it is nice); phrase lexemes cannot be fixed from overrides. BACKFILL GLOSS FLAGS: phrase token glosses in this unit.) 
    THIN UNIT: backfill_lexemes_fa_en.py registers only 5 lexemes (lovely/
    kind/smile in lesson01, being/compliment in lesson04; lesson02/lesson03
    have zero lexemes and are invisible to any checkpoint). 8 templates at
    genuine capacity: MC/listen/translation pool = unit-wide tag narrowed to
    [noun, adjective] (lovely, kind, smile, compliment -- 4 distinct, "being"
    excluded as a verb, matching the recipe's exclusion-by-part_of_speech
    technique). matching_pairs omitted (needs 6 distinct tokens, only 5
    exist). word_order/fill_in_blank use single-member anchors: lesson01's
    tag narrowed to noun (-> smile, the only noun) for
    "What a lovely {item}."; lesson04's tag narrowed to noun (-> compliment)
    and verb (-> being, already the sole verb) for "That is a lovely
    {item}." and "Thanks for {item} kind." (both straight from the
    realization's own example lines). Course-scope check: both lesson tags
    are unique to this unit, so course-wide membership == unit-scoped
    membership; none of the three frames' literal words is a candidate of
    its own slot. No mis-glossed lexeme found. FLAG FOR COORDINATOR:
    checkpoint will very likely stay <12 items unless lessons 02/03 get
    lexeme coverage -- routing to backfill recommended.
    POLISH 2026-07-25: the backfill extension happened -- lessons 02/03 now
    carry 6+6 phrase lexemes, so the lexeme counts above are stale. Added
    lesson02.translate.001 (bare-phrase translation over the 6-phrase
    fa_en_a1_unit64_lesson02_words pool) -- production tier now 3 live
    templates and lesson02 is checkpoint-visible.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [fa_en_a1_unit64_words, fa_en_a1_unit64_lesson01_words, fa_en_a1_unit64_lesson02_words, fa_en_a1_unit64_lesson04_words]
slot_presets:
  unit_pool: &unit_pool {language_code: en, part_of_speech: [noun, adjective], agreement_tags: {semantic: fa_en_a1_unit64_words}}
  lesson02_phrases: &lesson02_phrases {language_code: en, part_of_speech: phrase, agreement_tags: {semantic: fa_en_a1_unit64_lesson02_words}}
  lesson01_noun: &lesson01_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: fa_en_a1_unit64_lesson01_words}}
  lesson04_noun: &lesson04_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: fa_en_a1_unit64_lesson04_words}}
  lesson04_verb: &lesson04_verb {language_code: en, part_of_speech: verb, agreement_tags: {semantic: fa_en_a1_unit64_lesson04_words}}
templates:
  - content_key: practice.fa-en.en.a1.unit64.lesson01.choose.001
    lesson_content_key: en.a1.unit64.lesson01.compliment_words
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit64.lesson01.listen.002
    lesson_content_key: en.a1.unit64.lesson01.compliment_words
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit64.lesson01.translate.003
    lesson_content_key: en.a1.unit64.lesson01.compliment_words
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit_pool}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit64.lesson01.order.004
    lesson_content_key: en.a1.unit64.lesson01.compliment_words
    type: word_order
    frame: {text: "What a lovely {item}", language_code: en, direction: ltr}
    slots: {item: *lesson01_noun}
    answer_derivation: {kind: render_frame, frame: {text: "What a lovely {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} یعنی «لبخند».", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit64.lesson02.translate.001
    lesson_content_key: en.a1.unit64.lesson02.compliment_phrases
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *lesson02_phrases}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این عبارت است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit64.lesson04.choose.001
    lesson_content_key: en.a1.unit64.lesson04.a_kind_message
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_pool}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit64.lesson04.translate.002
    lesson_content_key: en.a1.unit64.lesson04.a_kind_message
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit_pool}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit64.lesson04.fill.003
    lesson_content_key: en.a1.unit64.lesson04.a_kind_message
    type: fill_in_blank
    frame: {text: "That is a lovely {item}.", language_code: en, direction: ltr}
    slots: {item: *lesson04_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} یعنی «تعریف».", language_code: fa, direction: rtl}
