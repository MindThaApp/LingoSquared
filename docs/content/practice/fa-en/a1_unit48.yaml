schema_version: '1.0'
pack_key: practice.fa-en.a1.unit48
source_language: fa
target_language: en
unit_content_key: en.a1.unit48.library
review:
  status: unreviewed
  fresh_context: 'false'
  notes: Authored 2026-07-12 as an additive Endless Practice coverage backfill for fa-en A1 unit 48. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.
    Polish wave-2 (2026-07-25) — all three tiers had only 2 live templates; added one per tier (multiple_choice, 6-slot
    matching_pairs, bare-word translation) anchored to previously template-less lessons, pooled over unit-native
    [noun, verb, adjective, adverb] content words. This unit's lexemes carry no semantic tags, so matching_pairs slots
    stay POS-only per the recipe §6.3 honest exception — no semantic union can reach 6 unit tokens.
    Polish wave-3 (2026-07-26) — commit 05af7ace generated fa_en_a1_unit48_* tags; the wave-2 honest-leave is resolved.
    Re-anchored lesson01.match.002 and its volume_match.001 sibling to the unit-wide generated tag (26 tokens;
    lesson01's own tag has only 2, below the floor) and raised both from 4 to 6 slots. Re-anchored lesson04.match.001
    to the lesson04 generated tag (20 tokens, clears the floor alone). The unit-wide pool has 'borrow' and 'borrowing'
    sharing an identical gloss (قرض گرفتن), accepted per recipe §6.3 ("duplicate RIGHT values are legal and fine").
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - fa_en_a1_unit48_words
    - fa_en_a1_unit48_lesson04_words
slot_presets:
  unit_word:
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
templates:
- content_key: practice.fa-en.en.a1.unit48.lesson01.choose.001
  lesson_content_key: en.a1.unit48.lesson01.library_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - symbol
      - noun
      - proper_noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: معنی {item} را انتخاب کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit48.lesson01.match.002
  lesson_content_key: en.a1.unit48.lesson01.library_vocabulary
  type: matching_pairs
  frame:
    text: '{first} — {second} — {third} — {fourth} — {fifth} — {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: &unit48_match_word
      language_code: en
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic: fa_en_a1_unit48_words
    second: *unit48_match_word
    third: *unit48_match_word
    fourth: *unit48_match_word
    fifth: *unit48_match_word
    sixth: *unit48_match_word
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
