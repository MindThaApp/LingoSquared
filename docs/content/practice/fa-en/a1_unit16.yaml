schema_version: "1.0"
pack_key: practice.fa-en.a1.unit16
source_language: fa
target_language: en
unit_content_key: en.a1.unit16.routines
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the practice-pool-sync lane extending fa-en
    coverage to units 15-20, mirroring nl-en's already-unreviewed
    a1_unit16.yaml structure. Same deliberate scope decision as nl-en's
    unit16 (and this lane's own unit07 for fa-en): lesson01 (wake up/get
    dressed/go to work/have dinner/go to bed) gets ZERO generated
    templates -- every one of its core routine actions is a multi-word
    phrase tokenized word-by-word with no same-lesson single-token synonym
    set to build a genuine multi-candidate slot from. The other three
    lessons reuse the already-established 12-member hour_number tag (added
    alongside nl-en's own unit16 work, narrower than the broad 22-member
    number tag specifically to keep clock-hour slots in 1-12 -- "I wake up
    at fifty every day." was a real bug the nl-en lane's fresh-context
    review caught and fixed for this exact frame shape) for every hour
    mentioned, the broad number tag for bare-word listen_select
    recognition, and a 2-member meal tag (dinner/breakfast) for "I have
    {item}." -- deliberately NOT used in lesson01 even though "dinner" is
    introduced there, since "breakfast" is only introduced in lesson03 (same
    reasoning nl-en documented: a lesson's own practice pool must be ready
    as soon as that lesson alone is completed). All POS/semantic-tag
    classification was already present in scripts/_en_target_lexeme_common.py
    before this pass -- only scripts/backfill_lexemes_fa_en.py's own Farsi
    gloss dict needed extending (wake/up/dressed/dinner/bed/every/usually/
    breakfast/after; "get"/"that" reuse their existing Unit 10/14 senses
    unchanged -- see that script's UNIT_FILES comment for why "get" is
    deliberately never used as a fillable slot here despite the sense
    mismatch between "get to" (Unit 10, reach) and "get dressed" (this
    unit, become/put on)). Verified with scripts/_practice_slot_check.py
    that every slot has >=1 real candidate lexeme and every multiple_choice/
    listen_select slot has >=4 distinct candidate values. The underlying en
    realization unit16 and the fa-en overlay's realization dependency are
    both UNREVIEWED (Codex was usage-limited at authoring time) -- needs
    the standard fresh-context review before import.

    Deepened 2026-07-07 (templates-per-unit audit found this unit
    tied-shallowest in fa-en at 8, alongside sibling prs-en's identical
    unit16 tied at the same count and deepened the same night --
    mirrored its additions here with fresh Farsi, not copied Dari).
    Added 5 new templates, all reusing already-verified tags/vocabulary
    with exercise TYPES this unit hadn't used yet: hour_number gained
    multiple_choice (lesson02) and listen_select (lesson03) -- it
    previously only had word_order/translation; number (already used
    for listen_select twice) gained multiple_choice (lesson02); meal
    (dinner/breakfast, only ever used for translation) gained a
    word_order template anchored to lesson04 ("I have {item} every
    day" -- both "I have breakfast every day." and "I have dinner
    every day." are real, grammatical sentences; anchored to lesson04
    like the file's own existing meal_translate, since breakfast isn't
    introduced until lesson03, same "ready as soon as that lesson
    alone is completed" discipline this file already documents above);
    and hour_number gained a matching_pairs (lesson04, 8 of its 12 real
    members, per AUTHORING_GUIDE.md #16). No new EN_POS/semantic-tag or
    Farsi-gloss additions needed -- every tag used here was already
    fully classified/glossed (confirmed by re-reading scripts/
    _en_target_lexeme_common.py and scripts/backfill_lexemes_fa_en.py
    fresh before this edit). Considered fill_in_blank for hour_number/
    number/meal but rejected all three: hour_number/number have 12/22
    genuinely interchangeable-in-frame candidates (e.g. "I wake up at
    {item} every day" is grammatical for any hour), and meal's 2
    members, while not literal synonyms, have no frame in this unit's
    real taught sentences that visibly disambiguates breakfast from
    dinner without also being gameable by a second independently-
    sampled slot -- scripts/_fill_in_blank_ambiguity_check.py (and
    compile_content.py's hard-fail per AUTHORING_GUIDE.md #17) would
    flag any single-slot attempt at any of the three, so zero new
    fill_in_blank templates, matching this direction's own established
    "zero is fine" precedent. Re-verified scripts/_practice_slot_check.py
    (all three tags still safely above the >=3/>=2 floors for their new
    exercise types) and scripts/_fill_in_blank_ambiguity_check.py (zero
    new AMBIGUOUS flags) before import. New count: 13 templates
    (8 -> 13).

    Re-authored 2026-07-24 (unit-scope DEAD-template pass, docs/content/
    PRACTICE_PACK_RECIPE.md): scripts/_practice_unit_scope_check.py found
    18 of the 13 slot-instances above DEAD -- every template built on
    'hour_number' or 'number' has 0 unit-scoped candidates. Neither tag
    is native to unit16 (checked via the iter_specs filter, recipe
    section 0): unit16's own 9 lexemes are wake/up/dressed/dinner/bed
    (lesson01), every/usually (lesson02), breakfast (lesson03), after
    (lesson04) -- no hour or number vocabulary at all. Both tags are
    established by an earlier unit (unit05, telling time) -- recipe
    DO-NOT #2. Only 'meal' (dinner/breakfast, 2 members) is genuinely
    native to unit16 -- both meal_translate.003 (lesson03) and
    meal_order.005 (lesson04, "I have {item} every day") passed the
    unit-scope check untouched and are kept unchanged (verified
    course-scope too: 'meal' is a1-course-exclusive to this unit --
    b1_unit08's reuse of "dinner" is a separate CEFR course and does not
    leak in). Every hour_number/number template is replaced, not
    re-anchored: with no native tag to fall back on (and fa-en's
    a1_unit16 not in backfill_lexemes_fa_en.py's AUTO_TAG_UNIT_STEMS,
    so no auto-tag exists -- PACK-ONLY, cannot add one), applied recipe
    SS3.1(c): dropped the semantic tag and constrained by part_of_speech
    only ([noun, verb, adjective, adverb], no tag) -- unit-wide this
    pool is wake/dressed/dinner/bed/every/usually/breakfast, 7 distinct
    tokens with 7 distinct glosses, safe at any scope for the
    literal-text-free shapes (bare-word multiple_choice/listen_select/
    translation, matching_pairs). None of the removed templates'
    literal-text word_order frames ("I wake up at {item} every day.",
    "Every day, I wake up at {item}.") are re-anchored to this pool --
    that would need the whole a1-course noun/verb/adjective/adverb set
    to be grammatical in an hour-of-day frame, which it plainly is not
    (e.g. "dressed"/"usually" do not fit "I wake up at {item}."); they
    are dropped in favour of matching_pairs (no literal-text
    grammaticality concern). Replaced 11 dead templates with 10 new
    ones on the untagged 7-token pool, spread across all 4 lessons.
    Read every gloss above against unit16's own realization -- no
    mis-glosses found. Net (including the 2 kept meal_ templates): 13
    templates (11 DEAD) -> 12 templates (all live): 5 recognition, 3
    structured, 4 production. Verified with
    scripts/_practice_unit_scope_check.py: 0 DEAD, 0 below-floor for
    this file.
tag_schema:
  part_of_speech: [noun, verb, adjective, adverb]
  agreement_tags:
    semantic: [meal]
slot_presets:
  meal: &meal {language_code: en, part_of_speech: noun, agreement_tags: {semantic: meal}}
  content_word: &content_word {language_code: en, part_of_speech: [noun, verb, adjective, adverb]}
templates:
  - content_key: practice.fa-en.en.a1.unit16.lesson01.routine_choose.001
    lesson_content_key: en.a1.unit16.lesson01.routine_verbs
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit16.lesson01.routine_listen.002
    lesson_content_key: en.a1.unit16.lesson01.routine_verbs
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} واژه‌ای است که شنیدید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit16.lesson01.routine_translate.003
    lesson_content_key: en.a1.unit16.lesson01.routine_verbs
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit16.lesson01.routine_match.004
    lesson_content_key: en.a1.unit16.lesson01.routine_verbs
    type: matching_pairs
    frame: {text: "{first} — {second} — {third} — {fourth} — {fifth} — {sixth}", language_code: en, direction: ltr}
    slots: {first: *content_word, second: *content_word, third: *content_word, fourth: *content_word, fifth: *content_word, sixth: *content_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit16.lesson02.routine_choose.005
    lesson_content_key: en.a1.unit16.lesson02.routine_with_times
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit16.lesson02.routine_translate.006
    lesson_content_key: en.a1.unit16.lesson02.routine_with_times
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit16.lesson03.meal_translate.003
    lesson_content_key: en.a1.unit16.lesson03.reading_a_routine
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *meal}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit16.lesson03.routine_listen.007
    lesson_content_key: en.a1.unit16.lesson03.reading_a_routine
