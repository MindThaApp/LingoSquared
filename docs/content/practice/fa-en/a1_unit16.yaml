    answer_derivation: {kind: render_frame, frame: {text: "I have {item} every day", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} وعدهٔ غذایی است که هر روز می‌خورید.", language_code: fa, direction: rtl}
