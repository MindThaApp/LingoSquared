schema_version: '1.0'
pack_key: practice.fa-en.a1.unit31
source_language: fa
target_language: en
unit_content_key: en.a1.unit31.appearance
review:
  status: reviewed
  fresh_context: true
  notes: 'Authored 2026-07-11, fa-en depth-audit lane (unit 2 of the 30-42 batch, see unit30''s pack notes for the full batch
    rationale).

    One semantic tag: ''eye_color'' (blue/brown/green from lesson02, all real, common eye colors, all safe in "Her eyes are
    {item}."). This narrower tag was added alongside the pre-existing A1 unit12 ''color'' tag rather than merged into it --
    black/red/white (unit12''s car-color members) are deliberately excluded since black/white eyes would be a strange claim
    and red isn''t a real eye color; per AUTHORING_GUIDE.md #18 this is a same-course-level (A1) reuse decision, not a new
    tag scoping risk. Only 3 members (the unit''s entire real eye-color vocabulary) -- matching_pairs was skipped as too thin
    at 3 pairs (AUTHORING_GUIDE.md #16''s "handful to a dozen" guidance), covered instead by a full-sentence translate variant
    for added depth.

    Anchoring check: lesson02 introduces all three eye-color adjectives as real new lexemes, verified via iter_specs(). Slot
    candidate count verified with scripts/_practice_slot_check.py and compile_content.py practice-validate. Needs the standard
    fresh-context review before import.

    Fresh-context review 2026-07-11 (zero access to authoring reasoning): verified every slot member is taught in this unit''s
    realization, every generative frame is grammatical for all fillings, Farsi feedback/instruction text reads as natural
    Iranian Farsi with correct RTL/ZWNJ, answer shapes (word_order list-shaped, matching_pairs covers every pair) are sound,
    listen_select distractors are distinct single vocabulary words, and no bare YAML booleans or snake_case jargon leak. compile_content.py
    practice-validate, scripts/_practice_slot_check.py, and backfill_lexemes_fa_en.py --dry-run all clean. No defects found;
    upgraded to reviewed.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - eye_color
slot_presets:
  eye_color: &id001
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: eye_color
