review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    20 lexemes across all 4 lessons (6/4/5/5). Recognition/production use
    each lesson's own tag narrowed to [noun, verb, adjective, adverb]
    (excludes the untagged particle "or" and the bare symbol "30"). One
    matching_pairs (6 pairs): lesson01's tag narrowed to [noun, verb,
    adjective] gives exactly 6 (refund/exchange/receipt/return/policy/
    defective) -- no confusable/duplicate glosses. lesson02's two verbs
    (stopped/working) are not a true single-member anchor, so instead of a
    fill_in_blank the word_order frame "The blender was {item}." was
    verified by hand for both -- "was stopped" and "was working" are both
    grammatical -- and its single noun ("blender") anchors a separate
    fill_in_blank ("Can you fix the {item}?"). lesson03's three past-
    participle verbs (returned/exchanged/refunded) were verified identically
    safe in "The blender was {item}." (all three are grammatical passives).
    lesson04's single adjective ("sorry") anchors a fill_in_blank ("I am
    {item} to hear that."). Course-scope check: every lesson tag used here
    is unique to this unit, so course-wide membership == unit-scoped
    membership. No mis-glossed lexeme found. 14 templates, all 4 lessons
    represented in recognition and production.
