    direction: ltr
  slots:
    first:
      language_code: en
      part_of_speech: &id001
      - noun
      agreement_tags:
        semantic: fa_en_a2_unit37_words
    second:
      language_code: en
      part_of_speech: *id001
      agreement_tags:
        semantic: fa_en_a2_unit37_words
    third:
      language_code: en
      part_of_speech: *id001
      agreement_tags:
        semantic: fa_en_a2_unit37_words
    fourth:
      language_code: en
      part_of_speech: *id001
      agreement_tags:
        semantic: fa_en_a2_unit37_words
    fifth:
