      language_code: en
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: fa_en_a1_unit47_words
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: معنی {item} را انتخاب کنید.
    language_code: fa
    direction: rtl
