schema_version: '1.0'
pack_key: practice.fa-en.a1.unit47
source_language: fa
target_language: en
unit_content_key: en.a1.unit47.appointments
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: |-
    Review 2026-10-19 (fa-en practice pass, fresh context; 5 fixes). (1) choose.001/translate.003/volume_listen.002/volume_translate.002: untaught/silly pool -- all-ten-POS slot over the unit tag reached pronoun and symbol lexemes (dog's, max's, you'd=تو/شما ... می‌کردی with informal تو, 3pm); narrowed to noun/verb/adjective/adverb. (2) three English matching feedbacks and the volume_match.002 text_block -> Persian. Checked: remaining glosses match the senses taught (appointment=قرار ملاقات, due=موعدش رسیده, reschedule). NATIVE FLAGS: confirmed=تأیید شده (است) and due=موعدش رسیده (written/colloquial mix); service=خدمات ('customer service'); nervous=عصبی؛ مضطرب (عصبی can mean 'angry'; نگران/دلشوره more natural). BACKFILL GLOSS FLAGS: you'd=تو/شما ... می‌کردی (informal تو; now unreachable from this pack).

    Authored 2026-07-12 as an additive Endless Practice coverage backfill for fa-en A1 unit 47. Uses the established broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions. Polish wave-2 (2026-07-25) — all three tiers had only 2 live templates; added one per tier (multiple_choice, 6-slot matching_pairs, bare-word translation) anchored to previously template-less lessons, pooled over unit-native [noun, verb, adjective, adverb] content words. This unit's lexemes carry no semantic tags, so matching_pairs slots stay POS-only per the recipe §6.3 honest exception — no semantic union can reach 6 unit tokens. Polish wave-3 (2026-07-26) — commit 05af7ace generated fa_en_a1_unit47_* tags; the wave-2 honest-leave is resolved. Re-anchored lesson01.match.002 and its volume_match.002 sibling to the unit-wide generated tag (16 tokens; lesson01's own tag has only 4, below the floor) and raised both from 4 to 6 slots. Re-anchored lesson03.match.001 to the lesson03 generated tag (6 tokens, exactly the floor).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - fa_en_a1_unit47_words
    - fa_en_a1_unit47_lesson03_words
slot_presets:
  unit_word:
    language_code: en
    part_of_speech: [noun, verb, adjective, adverb]
