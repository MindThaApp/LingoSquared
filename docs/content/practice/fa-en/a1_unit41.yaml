unit_content_key: en.a1.unit41.cooking
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-22 (fa-en practice pass, rest; 5 fixes). (1) order.005: ''Can you {item} it'' lacked ''?''; feedback was a garbled sentence with the English verb inside Persian -> ''جملهٔ درست: Can you {item} it?''. (2) volume_fill.004: cue-less blank over a single-candidate pool (unanswerable) -> added a hint slot rendering the Persian gloss; English-only feedback -> Persian. (3) volume_match.008: English meta text_block (''Second review matching set for this unit.'') -> Persian. (4)/(5) translate.006 and lesson02.translate.001: written-register prompts (می‌توانی/را/بجوشان) -> colloquial to match the overlay (می‌تونی ... رو ... برام، بجوشون); answers now end in ''?'' / feedback rewritten as ''جملهٔ درست: ...''. NATIVE FLAGS: boil=جوشاندن (overlay uses جوشوندن); written-register glosses (needs=نیاز دارد, makes=درست می‌کند) beside colloquial prompts. BACKFILL GLOSS FLAGS: ingredient=مواد اولیه is plural for a singular noun (override proposed).

    Authored 2026-07-11, fa-en depth-audit lane (unit 12 of the 30-42 batch, see unit30''s pack notes for the full batch
    rationale).

    One semantic tag: ''cooking_verb'' (chop/boil/taste from lesson01, three real cooking actions with identical syntax, all
    safe as the bare infinitive in "Can you {item} it?" -- the real content uses exactly this pattern for "chop"/"taste":
    "Can you chop the onions for me?"/"Can you taste the sauce...?"). "cook"/"bake" excluded (cook is the category verb itself
    and pairs with a direct object like "dinner", not "it"; bake isn''t collocated with "it" in the real content either).

    Anchoring check: lesson01 introduces chop/boil/taste as real new lexemes, verified via iter_specs(). Slot candidate count
    verified with scripts/_practice_slot_check.py and compile_content.py practice-validate. Needs the standard fresh-context
    review before import.

    Fresh-context review 2026-07-11 (zero access to authoring reasoning): verified every slot member is taught in this unit''s
    realization, every generative frame is grammatical for all fillings, Farsi feedback/instruction text reads as natural
    Iranian Farsi with correct RTL/ZWNJ, answer shapes (word_order list-shaped, matching_pairs covers every pair) are sound,
    listen_select distractors are distinct single vocabulary words, and no bare YAML booleans or snake_case jargon leak. compile_content.py
    practice-validate, scripts/_practice_slot_check.py, and backfill_lexemes_fa_en.py --dry-run all clean. No defects found;
    upgraded to reviewed.


    Polish wave 2 (2026-07-25, tier-thinness, PRACTICE_PACK_RECIPE.md SS8): added lesson03.choose.001 (3rd
    recognition, bare-POS noun pool per SS3.1(c) -- 11 unit nouns / 11 distinct Farsi glosses; includes the
    possessive tokens "grandmother''s"/"mother''s", real taught lexemes with clean distinct glosses) and two
    production templates: lesson01.translate.006 (fixed sentence on the course-singleton chop_word,
    echoing the taught "Can you chop the onions for me?") and lesson02.translate.001 (fixed sentence on the
    course-singleton volume_fa_en_a1_unit41_item_04_single = "boil"), both deterministic per SS6.6(b).
    Structured tier untouched (already 4 live). Bare-POS verb pools deliberately avoided everywhere: the
    unit-scope verb pool contains "follow" whose Farsi gloss embeds the English "follow-up", which would
    leak the answer in a typed-production prompt.'
tag_schema:
