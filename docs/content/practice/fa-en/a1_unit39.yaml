    language_code: fa
    direction: rtl
  slots:
    item: *noisy_single
  answer_derivation:
    kind: render_frame
    frame:
      text: Our building is a little {item}
      language_code: en
      direction: ltr
  feedback_frame:
    text: Our building is a little {item} یعنی ساختمان ما کمی پرسروصداست.
