schema_version: '1.0'
pack_key: practice.fa-en.b2.unit08
source_language: fa
target_language: en
unit_content_key: en.b2.unit08.synthesis
review:
  status: unreviewed
  fresh_context: 'false'
  notes: Authored via scripted generation against PRACTICE_PACK_RECIPE.md. Recognition (multiple_choice/listen_select)
    and production (translation) templates use each lessons own fa_en_b2_unit08_lessonNN_words tag, restricted
    to content POS (noun/verb/adjective/adverb) and deduped by gloss; widened to the unit-wide fa_en_b2_unit08_words
    tag only for lessons whose own tag pool was <3 distinct glosses. fill_in_blank anchors use a lesson-tag
    + single-POS narrowing that yields exactly one course-wide candidate (the tag itself is unique to
    this lesson, so unit-scope pool == course-scope pool). matching_pairs pools the unit-wide tag, anchored
    to the richest lesson. Capacity/coverage/course-scope numbers reported separately by the authoring
    agent.
