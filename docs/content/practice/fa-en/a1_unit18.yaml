schema_version: "1.0"
pack_key: practice.fa-en.a1.unit18
source_language: fa
target_language: en
unit_content_key: en.a1.unit18.past_events
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (fa-en practice pass, fresh context; 1 fix). verb_pair
    feedback said two verbs while five are matched. NATIVE FLAGS: past-verb
    glosses use the 3sg citation form (رفت) for frames with I; consider
    رفتم-style (backfill, out of scope).

    Authored 2026-07-06 by the practice-pool-sync lane extending fa-en
    coverage to units 15-20, mirroring nl-en's already-reviewed
    a1_unit18.yaml. Reuses the already-established narrower
    past_verb_intransitive tag (went/ate/worked, 3 members) separate from
    the 5-member past_verb (went/saw/ate/visited/worked) for the "I {item}
    yesterday." frame -- "saw"/"visited" are transitive and would leave
    that frame feeling incomplete ("I saw yesterday."/"I visited
    yesterday."), so the full 5-member set is used only for bare-word
    recognition (multiple_choice/listen_select/matching_pairs), never
    embedded in a sentence. All POS/semantic-tag classification was already
    present in scripts/_en_target_lexeme_common.py before this pass -- only
    scripts/backfill_lexemes_fa_en.py's own Farsi gloss dict needed
    extending (went/saw/ate/visited/worked/did/yesterday/week/together/
    watched/writer's/writer/s/was; "last"/"we" reuse their existing Unit
    13/12 senses unchanged). Verified with scripts/_practice_slot_check.py
    that every slot has >=1 real candidate lexeme and every multiple_choice/
    listen_select slot has >=4 distinct candidate values (past_verb has 5).
    The underlying en realization unit18 is UNREVIEWED (Codex was
    usage-limited at authoring time), same as the fa-en overlay's
    realization dependency -- needs the standard fresh-context review
    before import.

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened verb_pair.003
    from 2 to 5 pairs (past_verb/verb, real course-wide pool=5 -- ate/
    saw/visited/went/worked), no padding with untaught words.
tag_schema:
  part_of_speech: [verb]
  agreement_tags:
    semantic: [past_verb, past_verb_intransitive]
slot_presets:
  past_verb: &past_verb {language_code: en, part_of_speech: verb, agreement_tags: {semantic: past_verb}}
  past_verb_intransitive: &past_verb_intransitive {language_code: en, part_of_speech: verb, agreement_tags: {semantic: past_verb_intransitive}}
templates:
  - content_key: practice.fa-en.en.a1.unit18.lesson01.verb_meaning.001
    lesson_content_key: en.a1.unit18.lesson01.past_tense_verbs
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *past_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} فعل گذشتهٔ این درس است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit18.lesson01.verb_listen.002
    lesson_content_key: en.a1.unit18.lesson01.past_tense_verbs
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *past_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} فعلی است که شنیدید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit18.lesson01.verb_pair.003
    lesson_content_key: en.a1.unit18.lesson01.past_tense_verbs
    type: matching_pairs
    frame: {text: "{first_verb} — {second_verb}", language_code: en, direction: ltr}
    slots: {first_verb: *past_verb, second_verb: *past_verb, third_verb: *past_verb, fourth_verb: *past_verb, fifth_verb: *past_verb}
    slot_relations: [{kind: distinct, slots: [first_verb, second_verb, third_verb, fourth_verb, fifth_verb]}]
    answer_derivation: {kind: matching_pairs, slots: [first_verb, second_verb, third_verb, fourth_verb, fifth_verb]}
    feedback_frame: {text: "فعل‌های گذشته را به معنی فارسی‌شان وصل کردید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit18.lesson01.verb_translate.004
    lesson_content_key: en.a1.unit18.lesson01.past_tense_verbs
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *past_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit18.lesson02.yesterday_order.001
    lesson_content_key: en.a1.unit18.lesson02.talking_about_yesterday
    type: word_order
    frame: {text: "I {item} yesterday", language_code: en, direction: ltr}
    slots: {item: *past_verb_intransitive}
    answer_derivation: {kind: render_frame, frame: {text: "I {item} yesterday", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} اتفاقی است که دیروز افتاد.", language_code: fa, direction: rtl}
