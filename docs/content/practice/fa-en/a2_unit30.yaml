schema_version: "1.0"
pack_key: practice.fa-en.a2.unit30
source_language: fa
target_language: en
unit_content_key: en.a2.unit30.job_interview
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    43 lexemes across all 4 lessons (5/13/17/8) -- a healthy vocabulary unit.
    Recognition/production use each lesson's OWN tag (unit-scoped, per the
    checkpoint-scoped bar) narrowed to [noun, verb, adjective, adverb]
    (excludes bare pronouns like "i'm" that have no semantic tag). Two
    matching_pairs (6 pairs each) drawn from lesson02's and lesson03's own
    tags narrowed to [noun, adjective] -- lesson02 yields 9 candidates
    (years/media/marketing/strengths/monday/social/organized/available/
    next), lesson03 yields 12 (resume/deadline/bright/path/coordinator/
    requirements/strong/writing/skills/interview/deadlines/team); no
    confusable/duplicate glosses in either pool. One word_order uses the
    course-wide `weekday` tag (only "monday" is taught in this unit, but the
    tag pools every weekday taught anywhere in the corpus) for "I can start
    on {item}." -- verified grammatical for every weekday, per the recipe's
    course-scope rule for this specific safe pattern. No single-member
    lesson-level tag existed for a safe fill_in_blank (every lesson mixes
    several nouns of the same part_of_speech with no finer sub-tag), so
    fill_in_blank was not forced -- structured tier is covered by the two
    matching_pairs plus the word_order. No mis-glossed lexeme found; every
    gloss matches this unit's own teaching. 14 templates, all 4 lessons
    represented in recognition and production.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [fa_en_a2_unit30_lesson01_words, fa_en_a2_unit30_lesson02_words, fa_en_a2_unit30_lesson03_words, fa_en_a2_unit30_lesson04_words, weekday]
slot_presets:
  l1: &l1 {language_code: en, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: fa_en_a2_unit30_lesson01_words}}
  l2: &l2 {language_code: en, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: fa_en_a2_unit30_lesson02_words}}
  l2np: &l2np {language_code: en, part_of_speech: [noun, adjective], agreement_tags: {semantic: fa_en_a2_unit30_lesson02_words}}
  l3: &l3 {language_code: en, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: fa_en_a2_unit30_lesson03_words}}
  l3np: &l3np {language_code: en, part_of_speech: [noun, adjective], agreement_tags: {semantic: fa_en_a2_unit30_lesson03_words}}
  l4: &l4 {language_code: en, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: fa_en_a2_unit30_lesson04_words}}
  weekday: &weekday {language_code: en, part_of_speech: noun, agreement_tags: {semantic: weekday}}
