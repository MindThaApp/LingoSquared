schema_version: "1.0"
pack_key: practice.fa-en.a1.unit08
source_language: fa
target_language: en
unit_content_key: en.a1.unit08.shopping
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by a fork of the practice-pool-sync lane
    (en-fa/fa-en/en-prs gap). quantity_unit (pound/dozen/bottle/bag/
    kilo, 5 members) and food_plural (apples/eggs/tomatoes, 3 members)
    tags already exist in scripts/_en_target_lexeme_common.py from the
    nl-en lane's own unit08 work -- only Farsi glosses were added to
    scripts/backfill_lexemes_fa_en.py. food_plural is kept out of
    multiple_choice/matching_pairs (only 3 distinct candidates, below
    this lane's >=3 threshold... note this is exactly 3, the minimum
    allowed, so it IS included in multiple_choice below after
    double-checking against the harness). The "a {item} of X" frame
    (lesson01) pairs quantity_unit with its own real fixed noun from
    the taught phrase, not a second free slot, avoiding any redundant-
    unit mismatch (e.g. "a bottle of apples"). Verified with
    scripts/_practice_slot_check.py that every slot has >=1 candidate
    and every multiple_choice/matching_pairs slot has >=3 distinct
    candidate values.

    **Real bug found and fixed, live-QA pass on fa, 2026-07-06**: the
    two lesson04 templates (quantity_listen.001, price_fill.002)
    originally anchored `lesson_content_key` to
    `en.a1.unit08.lesson04.market_dialogue` (the unit's closing review
    dialogue). That lesson introduces zero new vocabulary of its own
    (every token in its `introduced_tokens` -- "That's"/"eight"/
    "dollars"/"OK"/"Sure"/"Anything"/"else"/"Yes"/"too" -- was already
    first taught earlier), so no `Lexeme` row is ever created with that
    lesson as `provenance_lesson_content_key`, and
    `_practice_lesson_id()`'s lookup (backend/app/content/service.py)
    can never resolve it -- confirmed live: `POST /admin/courses/{id}/
    practice/import` rejected the whole 8-unit fa-en pack with
    "lesson key 'en.a1.unit08.lesson04.market_dialogue' was not found
    in the course" on a genuinely fresh isolated stack (backfill run
    before import, per the correct dependency order -- CLAUDE.md's
    documented "practice-template import + lexeme backfill, in that
    order" is backwards from what the code actually requires; flagging
    separately). Fixed by repointing both templates to
    `en.a1.unit08.lesson01.quantities`, the actual first-taught anchor
    for every token their `quantity_unit`/`food_plural` slots draw from
    (verified directly against the isolated DB's `lexemes.
    provenance_lesson_content_key`: bag/bottle/dozen/eggs/kilo/pound/
    tomatoes all anchor at unit08.lesson01; "apples" anchors even
    earlier, at unit03.lesson04 -- so lesson01 is a safe, no-forward-
    reference anchor for both). Re-verified: `compile_content.py
    practice-validate` still 0/0, and the full 8-unit fa-en practice
    import now succeeds end-to-end against a fresh isolated stack.
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun, verb, particle, symbol]
  agreement_tags:
    semantic: [quantity_unit, food_plural]
slot_presets:
  quantity_unit: &quantity_unit {language_code: en, part_of_speech: noun, agreement_tags: {semantic: quantity_unit}}
  food_plural: &food_plural {language_code: en, part_of_speech: noun, agreement_tags: {semantic: food_plural}}
templates:
  - content_key: practice.fa-en.en.a1.unit08.lesson01.quantity_gloss.001
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: multiple_choice
    frame: {text: "{quantity_unit}", language_code: en, direction: ltr}
    slots: {quantity_unit: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: quantity_unit}
    feedback_frame: {text: "معنی فارسی {quantity_unit} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson01.quantity_listen.002
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: listen_select
    frame: {text: "{quantity_unit}", language_code: en, direction: ltr}
    slots: {quantity_unit: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: quantity_unit}
    feedback_frame: {text: "واژه‌ای که شنیدید {quantity_unit} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson01.quantity_pair.003
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: matching_pairs
    frame: {text: "{quantity_one} — {quantity_two}", language_code: en, direction: ltr}
    slots: {quantity_one: *quantity_unit, quantity_two: *quantity_unit}
    slot_relations: [{kind: distinct, slots: [quantity_one, quantity_two]}]
    answer_derivation: {kind: matching_pairs, slots: [quantity_one, quantity_two]}
    feedback_frame: {text: "هر واحد اندازه‌گیری را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson01.quantity_translate.004
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: translation
    frame: {text: "{quantity_unit}", language_code: fa, direction: rtl, slot_rendering: {quantity_unit: english_gloss}}
    slots: {quantity_unit: *quantity_unit}
    answer_derivation: {kind: slot_text, slot: quantity_unit}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژهٔ فارسی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson02.price_fill.001
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: fill_in_blank
    frame: {text: "How much are the {food_plural}?", language_code: en, direction: ltr}
    slots: {food_plural: *food_plural}
    answer_derivation: {kind: slot_text, slot: food_plural}
    feedback_frame: {text: "{food_plural} این پرسش دربارهٔ قیمت را کامل می‌کند.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson02.food_gloss.002
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: multiple_choice
    frame: {text: "{food_plural}", language_code: en, direction: ltr}
    slots: {food_plural: *food_plural}
    answer_derivation: {kind: slot_gloss, slot: food_plural}
    feedback_frame: {text: "معنی فارسی {food_plural} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson03.quantity_gloss.001
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: multiple_choice
    frame: {text: "{quantity_unit}", language_code: en, direction: ltr}
    slots: {quantity_unit: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: quantity_unit}
    feedback_frame: {text: "معنی فارسی {quantity_unit} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson03.food_translate.002
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: translation
    frame: {text: "{food_plural}", language_code: fa, direction: rtl, slot_rendering: {food_plural: english_gloss}}
    slots: {food_plural: *food_plural}
    answer_derivation: {kind: slot_text, slot: food_plural}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این غذای فارسی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson04.quantity_listen.001
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: listen_select
    frame: {text: "{quantity_unit}", language_code: en, direction: ltr}
    slots: {quantity_unit: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: quantity_unit}
    feedback_frame: {text: "واژه‌ای که در این گفتگو شنیدید {quantity_unit} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson04.price_fill.002
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: fill_in_blank
    frame: {text: "How much are the {food_plural}?", language_code: en, direction: ltr}
    slots: {food_plural: *food_plural}
    answer_derivation: {kind: slot_text, slot: food_plural}
    feedback_frame: {text: "{food_plural} این پرسش دربارهٔ قیمت را کامل می‌کند.", language_code: fa, direction: rtl}
