schema_version: "1.0"
pack_key: practice.fa-en.a1.unit08
source_language: fa
target_language: en
unit_content_key: en.a1.unit08.shopping
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by a fork of the practice-pool-sync lane
    (en-fa/fa-en/en-prs gap). quantity_unit (pound/dozen/bottle/bag/
    kilo, 5 members) and food_plural (apples/eggs/tomatoes, 3 members)
    tags already exist in scripts/_en_target_lexeme_common.py from the
    nl-en lane's own unit08 work -- only Farsi glosses were added to
    scripts/backfill_lexemes_fa_en.py. food_plural is kept out of
    multiple_choice/matching_pairs (only 3 distinct candidates, below
    this lane's >=3 threshold... note this is exactly 3, the minimum
    allowed, so it IS included in multiple_choice below after
    double-checking against the harness). The "a {item} of X" frame
    (lesson01) pairs quantity_unit with its own real fixed noun from
    the taught phrase, not a second free slot, avoiding any redundant-
    unit mismatch (e.g. "a bottle of apples"). Verified with
    scripts/_practice_slot_check.py that every slot has >=1 candidate
    and every multiple_choice/matching_pairs slot has >=3 distinct
    candidate values.

    **Real bug found and fixed, live-QA pass on fa, 2026-07-06**: the
    two lesson04 templates (quantity_listen.001, price_fill.002)
    originally anchored `lesson_content_key` to
    `en.a1.unit08.lesson04.market_dialogue` (the unit's closing review
    dialogue). That lesson introduces zero new vocabulary of its own
    (every token in its `introduced_tokens` -- "That's"/"eight"/
    "dollars"/"OK"/"Sure"/"Anything"/"else"/"Yes"/"too" -- was already
    first taught earlier), so no `Lexeme` row is ever created with that
    lesson as `provenance_lesson_content_key`, and
    `_practice_lesson_id()`'s lookup (backend/app/content/service.py)
    can never resolve it -- confirmed live: `POST /admin/courses/{id}/
    practice/import` rejected the whole 8-unit fa-en pack with
    "lesson key 'en.a1.unit08.lesson04.market_dialogue' was not found
    in the course" on a genuinely fresh isolated stack (backfill run
    before import, per the correct dependency order -- CLAUDE.md's
    documented "practice-template import + lexeme backfill, in that
    order" is backwards from what the code actually requires; flagging
    separately). Fixed by repointing both templates to
    `en.a1.unit08.lesson01.quantities`, the actual first-taught anchor
    for every token their `quantity_unit`/`food_plural` slots draw from
    (verified directly against the isolated DB's `lexemes.
    provenance_lesson_content_key`: bag/bottle/dozen/eggs/kilo/pound/
    tomatoes all anchor at unit08.lesson01; "apples" anchors even
    earlier, at unit03.lesson04 -- so lesson01 is a safe, no-forward-
    reference anchor for both). Re-verified: `compile_content.py
    practice-validate` still 0/0, and the full 8-unit fa-en practice
    import now succeeds end-to-end against a fresh isolated stack.

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened quantity_pair.003
    from 2 to 5 pairs (quantity_unit/noun, real course-wide pool=5 -- bag/
    bottle/dozen/kilo/pound), no padding with untaught words.

    Depth pass, 2026-07-07 (templates-per-unit density audit: fa-en unit08
    had 8 templates, with lesson02/lesson03/lesson04 each carrying only
    1-2 -- mirrors the sibling prs-en unit08 pack just deepened the same
    night). Added 8 new templates, all real vocabulary. lesson02
    (asking_prices) gained count_order (word_order, "Can I have {item}
    pounds, please?"), count_gloss (multiple_choice), and count_translate
    (translation) on the already-established count_plural_no_hundred tag
    from scripts/_en_target_lexeme_common.py (two through fifty plus
    twenty-five, excluding "one" and "hundred" -- this unit's own real
    lesson02 content teaches "Can I have two pounds, please?", so this is
    a direct, intended reuse of a tag from the numbers unit against this
    unit's own real sentence, not an A1/A2 boundary crossing -- see
    AUTHORING_GUIDE.md §18); also gained food_plural_listen
    (listen_select) on food_plural, anchored here since "apples" is first
    used in this lesson's own "How much are the apples?" line. lesson03
    (reading_price_labels) gained food_plural_pair (matching_pairs, all 3
    real food_plural members -- apples/eggs/tomatoes is the FULL
    course-wide pool, an honest ceiling per AUTHORING_GUIDE.md §16, not
    padded) and quantity_listen (listen_select) on quantity_unit, reusing
    the same tag+type combination lesson01 already established, anchored
    to this lesson's own real price-label text instead. lesson04
    (market_dialogue) gained quantity_translate (translation) on
    quantity_unit and food_plural_gloss (multiple_choice) on food_plural,
    both reusing already-established tag+type combinations -- anchored to
    lesson_content_key: en.a1.unit08.lesson01.quantities, NOT
    lesson04.market_dialogue, matching this pack's own pre-existing
    lesson04 template (quantity_listen.001) and its already-documented
    real-bug fix above (market_dialogue introduces zero new tokens of its
    own, so no Lexeme row is ever created with it as
    provenance_lesson_content_key, and a template anchored there would
    fail practice-template import). No new Farsi glosses needed --
    count_plural_no_hundred/quantity_unit/food_plural were all already
    glossed in scripts/backfill_lexemes_fa_en.py from this pack's and
    unit03's original authoring. Only this pack's own tag_schema/
    slot_presets needed a new count_plural_no_hundred alias (the semantic
    tag itself already existed course-wide). Verified with
    scripts/_practice_slot_check.py (count_plural_no_hundred: 20 distinct
    A1 candidates, food_plural: 3, quantity_unit: 5, all above the
    relevant floors) and compile_content.py practice-validate, 0 errors/0
    warnings. No fill_in_blank templates added -- quantity_unit's members
    each pair with a different fixed noun (bag of rice, bottle of water,
    kilo of tomatoes, etc.) so a single generic "a {item} of X" frame
    would either be ungrammatical or genuinely ambiguous depending on X,
    and food_plural's 3 members are similarly not safely distinguishable
    in a bare frame -- scripts/_fill_in_blank_ambiguity_check.py has
    nothing new to flag in this pack. Review status left as
    unreviewed/not-fresh-context, matching this pack's own pre-existing
    status -- a fresh-context review of the whole pack (including these 8
    new templates) has not happened yet.

    Unit-scope DEAD/FLOOR fix pass (2026-07-24, PACK-ONLY re-authoring
    lane): scripts/_practice_unit_scope_check.py found 4 DEAD template-
    slots + 4 below-floor. count_order.003/count_gloss.004/
    count_translate.005 (semantic count_plural_no_hundred) were DEAD --
    iter_specs() shows count_plural_no_hundred is introduced entirely by
    unit03 (numbers unit), never by unit08 itself (unit08's own lesson02
    has no number lexemes of its own beyond the untagged symbol '4'),
    another DO-NOT #2 cross-unit reuse. Re-anchored all three to
    quantity_unit instead (this unit's own, 100% native tag -- confirmed
    course-wide via iter_specs that quantity_unit is used ONLY by
    unit08): count_order.003's frame changed from "Can I have {item}
    pounds, please?" (which needed a taught number) to "Can I have a
    {item}, please?", grammatical for all 5 quantity_unit members
    (pound/dozen/bottle/bag/kilo); count_gloss.004/count_translate.005
    (bare '{item}' frames, zero grammaticality risk) widened to the
    union [quantity_unit, food_plural] via a new shopping_union preset
    for extra variety. food_plural_pair.003 was DEAD (needed 3, unit-
    scoped pool was 2: apples turns out to belong to unit03 too --
    course-wide food_plural is only 3 total and only eggs/tomatoes are
    unit08's own) -- fixed by widening the food_plural preset itself to
    the same [food_plural, quantity_unit] union (7 distinct: eggs/
    tomatoes/pound/dozen/bottle/bag/kilo, no confusable glosses) and
    bumping the declared slots from 3 to the standard 6 (also fixes the
    same-cause below-floor). quantity_pair.003 (FLOOR: 5 slots <6)
    widened the same way via the new shopping_union preset, bumped 5->6
    slots. food_gloss.002/food_plural_listen.006/food_plural_gloss.003
    (FLOOR: 2 distinct glosses <3) all consume the now-widened
    food_plural preset and pass at 7 distinct with no template-body
    changes needed. tag_schema's count_plural_no_hundred entry removed
    (no longer referenced). Net effect: 0 templates dropped, 16 total
    (unchanged), all now live; structured tier is thinner than ideal
    (2 matching_pairs, no word_order survives untouched besides the
    repurposed count_order.003) since this unit has no native taught
    number beyond the untagged symbol '4' -- logged as a genuine
    thinness/backfill-follow-up rather than padded. Verified: scripts/
    _practice_unit_scope_check.py now reports 0 DEAD, 0 FLOOR for
    a1_unit08.yaml; compile_content.py practice-validate 0 errors (see
    coordinator report for the exact fa-en batch invocation).
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun, verb, particle, symbol]
  agreement_tags:
    semantic: [quantity_unit, food_plural]
slot_presets:
  quantity_unit: &quantity_unit {language_code: en, part_of_speech: noun, agreement_tags: {semantic: quantity_unit}}
  food_plural: &food_plural {language_code: en, part_of_speech: noun, agreement_tags: {semantic: [food_plural, quantity_unit]}}
  shopping_union: &shopping_union {language_code: en, part_of_speech: noun, agreement_tags: {semantic: [quantity_unit, food_plural]}}
templates:
  - content_key: practice.fa-en.en.a1.unit08.lesson01.quantity_gloss.001
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: multiple_choice
    frame: {text: "{quantity_unit}", language_code: en, direction: ltr}
    slots: {quantity_unit: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: quantity_unit}
    feedback_frame: {text: "معنی فارسی {quantity_unit} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson01.quantity_listen.002
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: listen_select
    frame: {text: "{quantity_unit}", language_code: en, direction: ltr}
    slots: {quantity_unit: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: quantity_unit}
    feedback_frame: {text: "واژه‌ای که شنیدید {quantity_unit} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson01.quantity_pair.003
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: matching_pairs
    frame: {text: "{quantity_one} — {quantity_two} — {quantity_three} — {quantity_four} — {quantity_five} — {quantity_six}", language_code: en, direction: ltr}
    slots: {quantity_one: *shopping_union, quantity_two: *shopping_union, quantity_three: *shopping_union, quantity_four: *shopping_union, quantity_five: *shopping_union, quantity_six: *shopping_union}
    slot_relations: [{kind: distinct, slots: [quantity_one, quantity_two, quantity_three, quantity_four, quantity_five, quantity_six]}]
    answer_derivation: {kind: matching_pairs, slots: [quantity_one, quantity_two, quantity_three, quantity_four, quantity_five, quantity_six]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson01.quantity_translate.004
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: translation
    frame: {text: "{quantity_unit}", language_code: fa, direction: rtl, slot_rendering: {quantity_unit: english_gloss}}
    slots: {quantity_unit: *quantity_unit}
    answer_derivation: {kind: slot_text, slot: quantity_unit}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژهٔ فارسی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson02.food_gloss.002
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: multiple_choice
    frame: {text: "{food_plural}", language_code: en, direction: ltr}
    slots: {food_plural: *food_plural}
    answer_derivation: {kind: slot_gloss, slot: food_plural}
    feedback_frame: {text: "معنی فارسی {food_plural} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson02.count_order.003
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: word_order
    frame: {text: "Can I have a {item}, please?", language_code: en, direction: ltr}
    slots: {item: *quantity_unit}
    answer_derivation: {kind: render_frame, frame: {text: "Can I have a {item}, please?", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} واحد اندازه‌گیری درخواستی در این جمله است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson02.count_gloss.004
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *shopping_union}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson02.count_translate.005
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *shopping_union}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson02.food_plural_listen.006
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: listen_select
    frame: {text: "{food_plural}", language_code: en, direction: ltr}
    slots: {food_plural: *food_plural}
    answer_derivation: {kind: slot_gloss, slot: food_plural}
    feedback_frame: {text: "واژه‌ای که شنیدید {food_plural} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson03.quantity_gloss.001
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: multiple_choice
    frame: {text: "{quantity_unit}", language_code: en, direction: ltr}
    slots: {quantity_unit: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: quantity_unit}
    feedback_frame: {text: "معنی فارسی {quantity_unit} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson03.food_translate.002
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: translation
    frame: {text: "{food_plural}", language_code: fa, direction: rtl, slot_rendering: {food_plural: english_gloss}}
    slots: {food_plural: *food_plural}
    answer_derivation: {kind: slot_text, slot: food_plural}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این غذای فارسی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson03.food_plural_pair.003
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: matching_pairs
    frame: {text: "{food_plural_one} — {food_plural_two} — {food_plural_three} — {food_plural_four} — {food_plural_five} — {food_plural_six}", language_code: en, direction: ltr}
    slots: {food_plural_one: *food_plural, food_plural_two: *food_plural, food_plural_three: *food_plural, food_plural_four: *food_plural, food_plural_five: *food_plural, food_plural_six: *food_plural}
    slot_relations: [{kind: distinct, slots: [food_plural_one, food_plural_two, food_plural_three, food_plural_four, food_plural_five, food_plural_six]}]
    answer_derivation: {kind: matching_pairs, slots: [food_plural_one, food_plural_two, food_plural_three, food_plural_four, food_plural_five, food_plural_six]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson03.quantity_listen.004
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: listen_select
    frame: {text: "{quantity_unit}", language_code: en, direction: ltr}
    slots: {quantity_unit: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: quantity_unit}
    feedback_frame: {text: "واژه‌ای که شنیدید {quantity_unit} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson04.quantity_listen.001
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: listen_select
    frame: {text: "{quantity_unit}", language_code: en, direction: ltr}
    slots: {quantity_unit: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: quantity_unit}
    feedback_frame: {text: "واژه‌ای که در این گفتگو شنیدید {quantity_unit} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson04.quantity_translate.002
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: translation
    frame: {text: "{quantity_unit}", language_code: fa, direction: rtl, slot_rendering: {quantity_unit: english_gloss}}
    slots: {quantity_unit: *quantity_unit}
    answer_derivation: {kind: slot_text, slot: quantity_unit}
    feedback_frame: {text: "{quantity_unit} معادل انگلیسی این واژهٔ فارسی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit08.lesson04.food_plural_gloss.003
