schema_version: "1.0"
pack_key: practice.fa-en.a2.unit27
source_language: fa
target_language: en
unit_content_key: en.a2.unit27.banking
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-07 by the Claude session extending fa-en's practice
    pool to unit27 (opening a bank account), the third A2 unit for this
    direction. Follows the same discipline as a2_unit25.yaml/a2_unit26.yaml:
    most of this unit's real content is multi-word banking compounds
    ("checking account", "monthly fee", "minimum balance", "direct
    deposit") that don't reduce to a single fillable slot, so two new
    bare-word-recognition-only semantic tags were added to
    scripts/_en_target_lexeme_common.py -- "banking_noun" (account, fee,
    balance, deposit, business, days, documents, teller -- all POS noun)
    and "banking_adjective" (checking, monthly, minimum, direct -- all POS
    adjective) -- deliberately not used in any shared generative frame,
    same reasoning as unit25's bureaucracy_noun/unit26's dogpark_noun (these
    nouns/adjectives don't collocate uniformly: "keep a minimum {item}"
    only works for "balance", not "fee"/"deposit"/"teller", etc.). Only
    scripts/backfill_lexemes_fa_en.py's Farsi gloss dict and UNIT_FILES_A2
    tuple needed extending beyond that (18 new tokens, cross-checked
    against docs/content/overlays/fa-en/a2_unit27.yaml's own real text).

    ZERO fill_in_blank templates in this pack, a deliberate choice per
    AUTHORING_GUIDE.md #17 and this session's own live-caught ambiguity
    bug: this unit's real single-token vocabulary doesn't support a safe
    single-slot fill_in_blank (every noun/adjective candidate pool here is
    bare-recognition-only by design, and the one genuinely generative
    frame this unit supports -- the possessive slot below -- is authored
    as word_order instead, which doesn't share fill_in_blank's
    ambiguity risk). Ran scripts/_fill_in_blank_ambiguity_check.py after
    writing this pack to confirm zero AMBIGUOUS flags (there are no
    fill_in_blank templates to flag in the first place).

    One genuine generative frame identified: lesson03's real reading text
    is "Your debit card will arrive in five to seven business days." --
    the already-established 4-member 'possessive' tag (my/your/his/her,
    defined for unit06's family lessons, reused identically here per this
    session's own unit26 precedent) generalizes this exact real sentence
    with zero grammar loss ("My/His/Her debit card will arrive in five to
    seven business days." all hold) -- a word_order template anchored to
    lesson03, plus a bare listen_select recognition item for the same tag.

    Also reused: the already-established 'identity' tag (i/i'm/am/is/are/
    what/what's/my/your, defined for unit01/02), anchored to lesson04
    (real dialogue line "I have both with me. Is there a monthly fee?"),
    bare-word recognition only, same pattern as unit26's own "I think"
    reuse. No new EN_POS/agreement_tags entries needed for either reused
    tag; no new Farsi glosses needed for their members (all already
    present).

    Anchoring check (same discipline as every other pack in this batch):
    verified via iter_specs() that every one of this unit's four lessons
    introduces at least one new lexeme (lesson01: checking/account/
    monthly/fee/minimum/balance/direct/deposit; lesson02: documents/
    you'll/dmv; lesson03: business/days/keep/500/sounds is lesson04 not
    lesson03 -- see below; lesson04: teller/both/sounds), so all four are
    safe lesson_content_key anchors. banking_noun/banking_adjective are
    used across all four lessons as course-wide recognition tags (matching
    unit25/unit26's own established discipline of anchoring a shared
    course-wide tag to any lesson that itself introduces new lexemes,
    not requiring every tag member individually to already be introduced
    by that specific lesson).

    16 templates: 5 lesson01 (banking_noun x3 + banking_adjective x2),
    3 lesson02 (banking_noun x2 + banking_adjective x1), 4 lesson03
    (possessive word_order + possessive listen_select + banking_noun +
    banking_adjective), 4 lesson04 (banking_noun matching_pairs [8 pairs,
    the full course-wide pool, per AUTHORING_GUIDE.md #16] + identity x2 +
    banking_adjective). An honest, real-vocabulary-supported count for a
    newer, smaller A2 unit -- no padding with untaught words.

    Verified with scripts/_practice_slot_check.py (added this pack to the
    fa-en pack-path list; banking_noun has 8 distinct course-wide
    candidates, banking_adjective 4, possessive 4, identity well above the
    >=3 multiple_choice/listen_select floor and >=2 matching_pairs floor)
    and compile_content.py practice-validate, 0 errors/0 warnings. Still
    needs the standard fresh-context review before import.

    A2-scoping correctness fix (2026-07-07): scripts/_practice_slot_check.py
    pools ALL specs from iter_specs() (both A1 and A2) together when
    counting a tag's real distinct-candidate count, but
    backend/app/practice/service.py's _material() actually scopes both
    PracticeTemplate and Lexeme queries by course_id, and 'A1'/'A2' are
    separate Course rows -- a real A2 enrollee only ever sees A2-scoped
    lexemes. A standalone A2-only-scoped check (filtering iter_specs() to
    level=='a2') found lesson03.possessive_listen.002 -- the
    'possessive' tag (my/your/his/her, 4 members pooled with A1) has only
    2 REAL A2-scoped candidates (my/your -- his/her are never
    reintroduced in any A2 unit 25-28), invalidating the pooled "possessive
    4" note above. Fixed by converting to type: translation (bare
    single-word production, slot_text derivation instead of slot_gloss --
    no minimum-candidate floor), renamed possessive_translate_bare.002 --
    a genuinely new exercise, not a duplicate of the existing
    possessive_order.001 (full-sentence word_order). No candidates
    invented, no A1 vocabulary pooled in as if A2-scoped.


    Unit-scope reauth (2026-07-24, PACK-ONLY, per docs/content/PRACTICE_PACK_RECIPE.md): scripts/_practice_unit_scope_check.py
    found 4 more DEAD templates the A2-scoping fix above missed, because that fix still measured "reused across A2
    units" (COURSE scope), not the stricter UNIT scope generate_checkpoint() actually uses (recipe SS1.1).
    lesson03.possessive_order.001 and lesson03.possessive_translate_bare.002: `possessive` (my/your/his/her) has zero
    a2.unit27-introduced members (its only A2 members belong to unit25). lesson04.identity_choose.002 and
    lesson04.identity_listen.003: `identity` likewise has zero a2.unit27 members. Neither tag has a unit-native
    substitute that fits its frame, so both pairs were DROPPED. Dropping alone would have left the structured tier at
    0 templates (possessive_order.001 was this pack's only word_order) and the production tier at 2 (below the
    recipe's >=3-per-tier bar), so three genuinely unit-native replacements were added instead: (1)
    lesson01.payment_order.006 (word_order, "I'll pay with my {item}") over a NEW `payment_method` tag reference --
    debit/card are tagged `payment_method` in the shared backfill and, checked via iter_specs(), that tag's entire
    A2-course-wide pool (2 members) is exclusive to this unit's own lesson01, so unit-scope and course-scope are
    identical; "I'll pay with my debit"/"card" both hold (structured tier). (2) lesson02.preference_order.004
    (word_order, "I'd {item} to open a checking account") over the existing `preference_verb` tag -- first drafted as
    a fill_in_blank, but SS6.5's compiler check pools the WHOLE DIRECTION (every CEFR level), not just this course, and
    `preference_verb` turns out to have 5 distinct whole-direction members (don't/hate/like/love/prefer, mostly from
    A1 units) -- `practice-validate` correctly hard-failed it ("5 distinct candidates ... no other visible text to
    disambiguate"). Switched to word_order instead, which only needs COURSE-scope (A2-only) grammaticality, not a
    whole-direction candidate-count floor: A2-course-wide `preference_verb` is exactly 1 ("like", this unit's own
    lesson02), so the frame is trivially safe (structured tier, now 2 with payment_order -- still needed a 3rd:
    match.001, the pack's existing 8-pair banking_noun matching_pairs, was already live and brings structured to 3). (3) lesson03.politeness_translate_bare.005 (translation) over the existing `politeness`
    tag's "no" -- verified via iter_specs() that "no" IS a genuine a2.unit27 lesson03 introduction (unlike unit26's
    same tag, which had zero native members), so this one is a real re-anchor, not a stretch (production tier back to
    3: translate.003, adj_translate.003, this new one). Rejected a `banking_adjective` word_order (checking/monthly/
    minimum/direct don't collocate under one frame -- "I have a checking/monthly/minimum/direct account" is
    ungrammatical for 3 of the 4 -- matching this pack's own original judgment call not to force one) and a `number`
    (five/seven) word_order over "It will take {item} business days" (A2-course-wide `number` also includes "one",
    which breaks singular/plural agreement with "days" -- SS1.1/SS6.4 course-scope grammaticality trap, caught before
    authoring it). tag_schema's semantic list updated: `possessive`/`identity` removed (no longer referenced),
    `payment_method`/`preference_verb`/`politeness` added. Net: 16 -> 15 templates (4 dropped, 3 added). Before:
    4 DEAD. After: scripts/_practice_unit_scope_check.py reports 0 DEAD, 0 FLOOR. Re-validated with
    compile_content.py practice-validate (0 errors). review.status left as unreviewed pending a fresh-context pass
    over this reauth.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [banking_noun, banking_adjective, payment_method, preference_verb, politeness]
slot_presets:
  banking_noun: &banking_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: banking_noun}}
  banking_adjective: &banking_adjective {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: banking_adjective}}
  payment_method: &payment_method {language_code: en, part_of_speech: noun, agreement_tags: {semantic: payment_method}}
  preference_verb: &preference_verb {language_code: en, part_of_speech: verb, agreement_tags: {semantic: preference_verb}}
  politeness: &politeness {language_code: en, part_of_speech: particle, agreement_tags: {semantic: politeness}}
templates:
  - content_key: practice.fa-en.en.a2.unit27.lesson01.choose.001
    lesson_content_key: en.a2.unit27.lesson01.banking_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *banking_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a2.unit27.lesson01.listen.002
    lesson_content_key: en.a2.unit27.lesson01.banking_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *banking_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
