schema_version: "1.0"
pack_key: practice.fa-en.a1.unit01
source_language: fa
target_language: en
unit_content_key: en.a1.unit01.greetings
review:
  status: reviewed
  fresh_context: true
  notes: "Fresh-context Codex review (2026-07-05, dispatched by Session 3): removed ungrammatical filler frames (e.g. 'How are you? bad, thanks.', 'I am a engineer.'), narrowed overly broad greeting/farewell/role slots, fixed a matching template referencing not-yet-taught vocabulary, fixed a multiple_choice template with fewer than 3 unique options, replaced misleading Farsi feedback, added a safe word-order exercise. Independently re-verified by Session 3: compiler 0/0, no jargon leaks, no forbidden Arabic-range codepoints, no self-referential English glosses. Second fresh-context review (2026-07-06, separate session, zero access to the above authoring reasoning): confirmed lesson_content_key values against docs/content/realizations/en/a1_unit01_greetings.yaml (all 3 lessons match); standalone harness (importing scripts/backfill_lexemes_fa_en.py's real iter_specs(), replicating backend/app/practice/service.py's lexeme_matches() exactly) confirms every multiple_choice/matching_pairs slot has >=3 distinct candidates and every other slot has >=1 (greeting=4, farewell=5/4, wellbeing_answer=3, politeness=6, taught_adjective=12 -- all bare-word recognition/gloss/translate/matching frames with zero sentence-embedding risk). farewell_order.003's word_order frame ('you later {farewell_verb}' -> 'see you later') double-checked: farewell_verb (POS=verb + semantic=farewell) resolves to exactly 'see', matching the real taught phrase. No self-reference, unbounded-number, non-interchangeable-synonym, or article-agreement issues found. Upgraded to reviewed. Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened both matching_pairs templates from 2 to 4 pairs each (greeting_pair.004: greeting/noun, real course-wide pool=4; farewell_pair: farewell semantic tag restricted to [noun, adverb] part_of_speech, real course-wide pool=4, verified directly against _en_target_lexeme_common.py since not in the precomputed retrofit table) -- both now use their full real distinct-token pool, no padding with untaught words. **Real bug found and fixed, live-QA pass on fa, 2026-07-06/07**: both reviews above verified farewell_order.003's ANSWER derivation but missed that `template.frame` itself ('you later {farewell_verb}') is independently rendered verbatim as the learner-visible hint by build_prompt()'s word_order branch (backend/app/practice/service.py) -- a real generated item showed the hint 'you later *see*', actively teaching the WRONG English word order for a word-ordering exercise (word_bank is separately shuffled regardless of template.frame's own order, so there was never a reason for template.frame to differ from the correct order). Confirmed live against a genuinely fresh isolated stack. Fixed by making template.frame match answer_derivation.frame exactly ('{farewell_verb} you later'), the same pattern every other correctly-behaving word_order template in this corpus already follows. The identical bug (template.frame deliberately pre-scrambled, differing from answer_derivation.frame) was also found in this same pass in fa-en/a1_unit02.yaml (name_order.001, fixed alongside this one) and, out of this pass's own scope, in nl-en/a1_unit01.yaml (1 instance: farewell_order.001), nl-en/a1_unit02.yaml (3 instances: name_order.001, member_order.003, library_order.001), and prs-en/a1_unit02.yaml (1 instance: name_order.001) -- 5 instances total across those two directions, flagged for whoever owns those directions' packs with exact locations, not fixed here. Depth pass, 2026-07-07 (templates-per-unit density audit: fa-en unit01 was tied for shallowest in the direction at 8 templates, mirroring the sibling prs-en unit01 pack just deepened the same night). Added 9 new templates, all real vocabulary already glossed in scripts/backfill_lexemes_fa_en.py's EN_TARGET_TO_FA_GLOSS -- no new Farsi glosses needed. lesson01 gained greeting_listen (listen_select on greeting, previously only multiple_choice/translation/matching_pairs) and time_period_gloss (multiple_choice on time_period, previously untested by any template despite time_period already being declared in this pack's own tag_schema -- only a new slot_preset alias was needed). lesson03 gained wellbeing_translate (translation) on wellbeing_answer; politeness_gloss (multiple_choice) and politeness_listen (listen_select) on politeness (previously only translation); identity_choose (multiple_choice) on the identity preset (already declared, never used); and wellbeing_question_fill (fill_in_blank, '{item} are you?'), this pack's first fill_in_blank -- wellbeing_question has exactly ONE real A1 candidate ('how'), so the blank is unambiguous by construction (verified with scripts/_fill_in_blank_ambiguity_check.py: 0 AMBIGUOUS flags). lesson05 gained farewell_translate (translation) and farewell_listen (listen_select) on farewell (previously only multiple_choice/word_order/matching_pairs). **Checked for the exact fine/okay Dari-gloss-collision bug class prs-en's own depth pass caught**: this pack's own EN_TARGET_TO_FA_GLOSS gives wellbeing_answer members fine/okay the IDENTICAL Farsi gloss خوب (bad is distinct, بد) -- confirmed a wellbeing_choose (multiple_choice, slot_gloss) template was never added here for exactly this reason (only 2 distinct gloss values, below multiple_choice's >=3 floor); wellbeing_translate/wellbeing_listen were added instead, both deriving from slot_text (the specific generated English word), not slot_gloss, so they carry no such collision risk. No new semantic tags needed in scripts/_en_target_lexeme_common.py -- every tag used here already existed and every gloss it needs already existed in EN_TARGET_TO_FA_GLOSS; only two new slot_preset aliases (time_period, wellbeing_question) were added to this pack's own tag_schema, both semantic tags already declared there. Verified with scripts/_practice_slot_check.py (all touched slots have real candidates at or above the relevant floor) and compile_content.py practice-validate, 0 errors/0 warnings. Still carries this pack's own fresh-context review status from before this pass -- a fresh re-review of specifically these 9 new templates has not happened yet."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [greeting, time_period, farewell, wellbeing_question, wellbeing_answer, politeness, identity, person_name, dialogue_word, extended_family]
    person: [first, second, third]
slot_presets:
  greeting: &greeting {language_code: en, part_of_speech: noun, agreement_tags: {semantic: greeting}}
  time_period: &time_period {language_code: en, part_of_speech: noun, agreement_tags: {semantic: time_period}}
  farewell: &farewell {language_code: en, part_of_speech: [noun, verb, adverb], agreement_tags: {semantic: farewell}}
  farewell_word: &farewell_word {language_code: en, part_of_speech: [noun, adverb], agreement_tags: {semantic: farewell}}
  farewell_verb: &farewell_verb {language_code: en, part_of_speech: verb, agreement_tags: {semantic: farewell}}
  wellbeing_answer: &wellbeing_answer {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: wellbeing_answer}}
  wellbeing_question: &wellbeing_question {language_code: en, part_of_speech: adverb, agreement_tags: {semantic: wellbeing_question}}
  taught_adjective: &taught_adjective {language_code: en, part_of_speech: adjective, agreement_tags: {}}
  politeness: &politeness {language_code: en, part_of_speech: [noun, verb, adjective, particle], agreement_tags: {semantic: politeness}}
  identity: &identity {language_code: en, part_of_speech: [pronoun, verb], agreement_tags: {semantic: identity}}
  dialogue_noun: &dialogue_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: dialogue_word}}
  extended_family: &extended_family {language_code: en, part_of_speech: noun, agreement_tags: {semantic: extended_family}}
  practice_word: &practice_word {language_code: en, part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase], agreement_tags: {}}
templates:
  # Lesson 1: everyday greetings.
  - content_key: practice.fa-en.en.a1.unit01.lesson01.greeting_meaning.001
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: multiple_choice
    frame: {text: "{greeting}", language_code: en, direction: ltr}
    slots: {greeting: *greeting}
    answer_derivation: {kind: slot_gloss, slot: greeting}
    feedback_frame: {text: "{greeting} برای سلام یا خداحافظی روزمره به‌کار می‌رود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson01.greeting_translate.003
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: translation
    frame: {text: "{greeting}", language_code: fa, direction: rtl, slot_rendering: {greeting: english_gloss}}
    slots: {greeting: *greeting}
    answer_derivation: {kind: slot_text, slot: greeting}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی عبارت فارسی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson01.greeting_pair.004
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: matching_pairs
    frame: {text: "{greeting_one} — {greeting_two}", language_code: en, direction: ltr}
    slots: {greeting_one: *greeting, greeting_two: *greeting, greeting_three: *greeting, greeting_four: *greeting}
    slot_relations: [{kind: distinct, slots: [greeting_one, greeting_two, greeting_three, greeting_four]}]
    answer_derivation: {kind: matching_pairs, slots: [greeting_one, greeting_two, greeting_three, greeting_four]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson01.greeting_listen.002
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: listen_select
    frame: {text: "{greeting}", language_code: en, direction: ltr}
    slots: {greeting: *greeting}
    answer_derivation: {kind: slot_text, slot: greeting}
    feedback_frame: {text: "واژه‌ای که شنیدید {greeting} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson01.time_period_gloss.005
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: multiple_choice
    frame: {text: "{time_period}", language_code: en, direction: ltr}
    slots: {time_period: *time_period}
    answer_derivation: {kind: slot_gloss, slot: time_period}
    feedback_frame: {text: "معنی فارسی {time_period} را انتخاب کنید.", language_code: fa, direction: rtl}

  # Lesson 3: wellbeing exchange.
  - content_key: practice.fa-en.en.a1.unit01.lesson03.adjective_meaning.001
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: multiple_choice
    frame: {text: "{adjective}", language_code: en, direction: ltr}
    slots: {adjective: *taught_adjective}
    answer_derivation: {kind: slot_gloss, slot: adjective}
    feedback_frame: {text: "معنی فارسی {adjective} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson03.politeness_translate.003
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: translation
    frame: {text: "{politeness}", language_code: fa, direction: rtl, slot_rendering: {politeness: english_gloss}}
    slots: {politeness: *politeness}
    answer_derivation: {kind: slot_text, slot: politeness}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی واژهٔ فارسی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson03.wellbeing_translate.004
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: translation
    frame: {text: "{wellbeing_answer}", language_code: fa, direction: rtl, slot_rendering: {wellbeing_answer: english_gloss}}
    slots: {wellbeing_answer: *wellbeing_answer}
    answer_derivation: {kind: slot_text, slot: wellbeing_answer}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این احساس است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson03.politeness_gloss.005
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: multiple_choice
    frame: {text: "{politeness}", language_code: en, direction: ltr}
    slots: {politeness: *politeness}
    answer_derivation: {kind: slot_gloss, slot: politeness}
    feedback_frame: {text: "معنی فارسی {politeness} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson03.politeness_listen.006
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: listen_select
    frame: {text: "{politeness}", language_code: en, direction: ltr}
    slots: {politeness: *politeness}
    answer_derivation: {kind: slot_text, slot: politeness}
    feedback_frame: {text: "واژه‌ای که شنیدید {politeness} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson03.identity_choose.007
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: multiple_choice
    frame: {text: "{identity}", language_code: en, direction: ltr}
    slots: {identity: *identity}
    answer_derivation: {kind: slot_gloss, slot: identity}
    feedback_frame: {text: "معنی فارسی {identity} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson03.wellbeing_question_fill.008
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: fill_in_blank
    frame:
      text: "{item} are you?"
      language_code: en
      direction: ltr
      text_blocks:
        - {text: "جملهٔ انگلیسی را کامل کنید.", language_code: fa, direction: rtl}
    slots: {item: *wellbeing_question}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} واژهٔ پرسشی این جمله است.", language_code: fa, direction: rtl}

  # Lesson 5: friendly closings.
  - content_key: practice.fa-en.en.a1.unit01.lesson05.farewell_meaning.001
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: multiple_choice
    frame: {text: "{farewell}", language_code: en, direction: ltr}
    slots: {farewell: *farewell}
    answer_derivation: {kind: slot_gloss, slot: farewell}
    feedback_frame: {text: "{farewell} واژه‌ای از عبارت‌های خداحافظی درس‌های این بسته است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson05.farewell_order.003
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: word_order
    frame: {text: "{farewell_verb} you later", language_code: en, direction: ltr}
    slots: {farewell_verb: *farewell_verb}
    answer_derivation: {kind: render_frame, frame: {text: "{farewell_verb} you later", language_code: en, direction: ltr}}
    feedback_frame: {text: "ترتیب درست {farewell_verb} you later است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson05.farewell_pair.004
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: matching_pairs
    frame: {text: "{farewell_one} — {farewell_two}", language_code: en, direction: ltr}
    slots: {farewell_one: *farewell_word, farewell_two: *farewell_word, farewell_three: *farewell_word, farewell_four: *farewell_word}
    slot_relations: [{kind: distinct, slots: [farewell_one, farewell_two, farewell_three, farewell_four]}]
    answer_derivation: {kind: matching_pairs, slots: [farewell_one, farewell_two, farewell_three, farewell_four]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson05.farewell_translate.002
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: translation
    frame: {text: "{farewell}", language_code: fa, direction: rtl, slot_rendering: {farewell: english_gloss}}
    slots: {farewell: *farewell}
    answer_derivation: {kind: slot_text, slot: farewell}
    feedback_frame: {text: "{farewell} معادل انگلیسی این عبارت خداحافظی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson05.farewell_listen.005
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: listen_select
    frame: {text: "{farewell}", language_code: en, direction: ltr}
    slots: {farewell: *farewell}
    answer_derivation: {kind: slot_text, slot: farewell}
    feedback_frame: {text: "واژه‌ای که شنیدید {farewell} بود.", language_code: fa, direction: rtl}

  # Cross-lesson fallback: keeps low-mastery practice from collapsing into
  # bare single-word recognition when a later lexeme lacks a narrower frame.
  - content_key: practice.fa-en.en.a1.unit01.lesson01.variety_time_order.900
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: word_order
    frame: {text: "Good {item}", language_code: en, direction: ltr}
    slots: {item: *time_period}
    answer_derivation: {kind: render_frame, frame: {text: "Good {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "ترتیب درست Good {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson03.variety_wellbeing_order.901
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: word_order
    frame: {text: "I'm {item}", language_code: en, direction: ltr}
    slots: {item: *wellbeing_answer}
    answer_derivation: {kind: render_frame, frame: {text: "I'm {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "ترتیب درست I'm {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson03.variety_politeness_pair.902
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: matching_pairs
    frame: {text: "واژه‌های مؤدبانهٔ انگلیسی را به معنی فارسی‌شان وصل کنید.", language_code: fa, direction: rtl}
    slots: {word_one: *politeness, word_two: *politeness, word_three: *politeness, word_four: *politeness, word_five: *politeness, word_six: *politeness}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "هر واژهٔ مؤدبانه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson01.variety_dialogue_pair.903
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: matching_pairs
    frame: {text: "واژه‌های انگلیسی گفت‌وگو را به معنی فارسی‌شان وصل کنید.", language_code: fa, direction: rtl}
    slots: {word_one: *dialogue_noun, word_two: *dialogue_noun, word_three: *dialogue_noun, word_four: *dialogue_noun, word_five: *dialogue_noun, word_six: *dialogue_noun}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five, word_six]}
    feedback_frame: {text: "هر واژهٔ گفت‌وگو را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson01.variety_family_pair.904
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: matching_pairs
    frame: {text: "واژه‌های خانواده را به معنی فارسی‌شان وصل کنید.", language_code: fa, direction: rtl}
    slots: {word_one: *extended_family, word_two: *extended_family, word_three: *extended_family, word_four: *extended_family, word_five: *extended_family}
    slot_relations: [{kind: distinct, slots: [word_one, word_two, word_three, word_four, word_five]}]
    answer_derivation: {kind: matching_pairs, slots: [word_one, word_two, word_three, word_four, word_five]}
    feedback_frame: {text: "هر واژهٔ خانواده را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson01.practice_translate.905
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *practice_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی واژهٔ فارسی است.", language_code: fa, direction: rtl}
