review:
  status: reviewed
  fresh_context: true
  notes: 'Fresh-context Codex review (2026-07-05, dispatched by Session 3): removed ungrammatical filler frames (e.g. ''How
    are you? bad, thanks.'', ''I am a engineer.''), narrowed overly broad greeting/farewell/role slots, fixed a matching template
    referencing not-yet-taught vocabulary, fixed a multiple_choice template with fewer than 3 unique options, replaced misleading
    Farsi feedback, added a safe word-order exercise. Independently re-verified by Session 3: compiler 0/0, no jargon leaks,
    no forbidden Arabic-range codepoints, no self-referential English glosses. Second fresh-context review (2026-07-06, separate
    session, zero access to the above authoring reasoning): confirmed lesson_content_key values against docs/content/realizations/en/a1_unit01_greetings.yaml
    (all 3 lessons match); standalone harness (importing scripts/backfill_lexemes_fa_en.py''s real iter_specs(), replicating
    backend/app/practice/service.py''s lexeme_matches() exactly) confirms every multiple_choice/matching_pairs slot has >=3
    distinct candidates and every other slot has >=1 (greeting=4, farewell=5/4, wellbeing_answer=3, politeness=6, taught_adjective=12
    -- all bare-word recognition/gloss/translate/matching frames with zero sentence-embedding risk). farewell_order.003''s
    word_order frame (''you later {farewell_verb}'' -> ''see you later'') double-checked: farewell_verb (POS=verb + semantic=farewell)
    resolves to exactly ''see'', matching the real taught phrase. No self-reference, unbounded-number, non-interchangeable-synonym,
    or article-agreement issues found. Upgraded to reviewed. Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened both matching_pairs
    templates from 2 to 4 pairs each (greeting_pair.004: greeting/noun, real course-wide pool=4; farewell_pair: farewell semantic
    tag restricted to [noun, adverb] part_of_speech, real course-wide pool=4, verified directly against _en_target_lexeme_common.py
    since not in the precomputed retrofit table) -- both now use their full real distinct-token pool, no padding with untaught
    words. **Real bug found and fixed, live-QA pass on fa, 2026-07-06/07**: both reviews above verified farewell_order.003''s
    ANSWER derivation but missed that `template.frame` itself (''you later {farewell_verb}'') is independently rendered verbatim
    as the learner-visible hint by build_prompt()''s word_order branch (backend/app/practice/service.py) -- a real generated
    item showed the hint ''you later *see*'', actively teaching the WRONG English word order for a word-ordering exercise
    (word_bank is separately shuffled regardless of template.frame''s own order, so there was never a reason for template.frame
    to differ from the correct order). Confirmed live against a genuinely fresh isolated stack. Fixed by making template.frame
    match answer_derivation.frame exactly (''{farewell_verb} you later''), the same pattern every other correctly-behaving
    word_order template in this corpus already follows. The identical bug (template.frame deliberately pre-scrambled, differing
    from answer_derivation.frame) was also found in this same pass in fa-en/a1_unit02.yaml (name_order.001, fixed alongside
    this one) and, out of this pass''s own scope, in nl-en/a1_unit01.yaml (1 instance: farewell_order.001), nl-en/a1_unit02.yaml
    (3 instances: name_order.001, member_order.003, library_order.001), and prs-en/a1_unit02.yaml (1 instance: name_order.001)
    -- 5 instances total across those two directions, flagged for whoever owns those directions'' packs with exact locations,
    not fixed here. Depth pass, 2026-07-07 (templates-per-unit density audit: fa-en unit01 was tied for shallowest in the
    direction at 8 templates, mirroring the sibling prs-en unit01 pack just deepened the same night). Added 9 new templates,
    all real vocabulary already glossed in scripts/backfill_lexemes_fa_en.py''s EN_TARGET_TO_FA_GLOSS -- no new Farsi glosses
    needed. lesson01 gained greeting_listen (listen_select on greeting, previously only multiple_choice/translation/matching_pairs)
    and time_period_gloss (multiple_choice on time_period, previously untested by any template despite time_period already
    being declared in this pack''s own tag_schema -- only a new slot_preset alias was needed). lesson03 gained wellbeing_translate
    (translation) on wellbeing_answer; politeness_gloss (multiple_choice) and politeness_listen (listen_select) on politeness
    (previously only translation); identity_choose (multiple_choice) on the identity preset (already declared, never used);
    and wellbeing_question_fill (fill_in_blank, ''{item} are you?''), this pack''s first fill_in_blank -- wellbeing_question
    has exactly ONE real A1 candidate (''how''), so the blank is unambiguous by construction (verified with scripts/_fill_in_blank_ambiguity_check.py:
    0 AMBIGUOUS flags). lesson05 gained farewell_translate (translation) and farewell_listen (listen_select) on farewell (previously
    only multiple_choice/word_order/matching_pairs). **Checked for the exact fine/okay Dari-gloss-collision bug class prs-en''s
    own depth pass caught**: this pack''s own EN_TARGET_TO_FA_GLOSS gives wellbeing_answer members fine/okay the IDENTICAL
    Farsi gloss خوب (bad is distinct, بد) -- confirmed a wellbeing_choose (multiple_choice, slot_gloss) template was never
    added here for exactly this reason (only 2 distinct gloss values, below multiple_choice''s >=3 floor); wellbeing_translate/wellbeing_listen
    were added instead, both deriving from slot_text (the specific generated English word), not slot_gloss, so they carry
    no such collision risk. No new semantic tags needed in scripts/_en_target_lexeme_common.py -- every tag used here already
    existed and every gloss it needs already existed in EN_TARGET_TO_FA_GLOSS; only two new slot_preset aliases (time_period,
    wellbeing_question) were added to this pack''s own tag_schema, both semantic tags already declared there. Verified with
    scripts/_practice_slot_check.py (all touched slots have real candidates at or above the relevant floor) and compile_content.py
    practice-validate, 0 errors/0 warnings. Still carries this pack''s own fresh-context review status from before this pass
    -- a fresh re-review of specifically these 9 new templates has not happened yet.

    Unit-scope DEAD/FLOOR fix pass (2026-07-24, PACK-ONLY re-authoring lane):
    scripts/_practice_unit_scope_check.py found 13 DEAD template-slots + 4
    below-floor in this pack, all matching_pairs/MC/listen slots that were
    satisfiable at whole-direction scope but not at generate_checkpoint()''s
    unit-only scope. Fixed via re-anchoring to unit01''s own real vocab
    (§3.1a unions), no backfill/gloss changes: farewell_word (id010) widened
    to POS [noun,verb,adverb] + semantic [farewell, greeting] -- ''see'' (verb)
    was excluded before, dropping the pool to 3/4 needed; now 4 distinct
    (goodbye/bye/see/later), also reused to widen farewell_pair.004 from 4->6
    slots. greeting_pair.004 widened 4->6 slots via a new inline union
    [greeting, time_period] (hello/hi/goodbye/bye/morning/afternoon/evening/day,
    8 distinct, POS noun only -- deliberately NOT touching the shared id001
    preset since 3 other live templates (greeting_meaning/translate/listen)
    already pass at 4 and didn''t need touching. politeness (id004) widened to
    semantic [politeness, wellbeing_answer] -- fixes politeness_gloss.005 and
    politeness_listen.006 (both were 2 distinct glosses, now 4 after the
    fine/okay gloss collapse the pack''s own notes already flagged; safe
    since only politeness_translate.003 and politeness_gloss/listen consume
    this preset, all bare-word/bare-frame with zero grammaticality risk).
    identity (id006) widened to semantic [identity, wellbeing_question,
    wellbeing_answer] -- fixes identity_choose.007 (was 2 distinct: are/i''m;
    now 5, all from this pack''s own lesson03). variety_politeness_pair.902
    was DEAD (needed 6, politeness alone had only 2 in-unit: thanks/nice) --
    re-anchored to a new 4-tag union [politeness, wellbeing_answer, identity,
    wellbeing_question] (8 distinct tokens: thanks/nice/fine/bad/okay/are/i''m/
    how), kept at 6 slots. variety_dialogue_pair.903 (semantic dialogue_word)
    and variety_family_pair.904 (semantic extended_family) were BOTH
    DO-NOT-#2 violations with 0 unit-scoped candidates -- verified via
    iter_specs() that dialogue_word is introduced by unit02
    (exchange_roles: student/teacher/new/member/engineer/...) and
    extended_family by unit06 (extended_family_possessives:
    grandmother/grandfather/aunt/uncle/cousin), neither taught anywhere in
    unit01. DROPPED both rather than re-anchor: unit01''s own vocab, once
    unioned as above, is entirely already consumed by greeting_pair (8),
    farewell_pair (6), and variety_politeness_pair (8) -- there is no
    remaining distinctly-flavored 6-token pool to build a 4th/5th
    matching_pairs from without pure duplication, and this pack has 25
    templates left after the drop (was 27), still far above the 12-item
    floor and covering all 3 tiers in every lesson, so dropping (recipe
    fix option 3) is the honest choice over padding. Removed the now-unused
    dialogue_noun/extended_family slot_presets and their tag_schema entries
    (dialogue_word, extended_family) since no template references them
    anymore. Verified: scripts/_practice_unit_scope_check.py now reports 0
    DEAD, 0 FLOOR for a1_unit01.yaml; compile_content.py practice-validate
    0 errors (see coordinator report for the exact fa-en batch invocation).'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - greeting
    - time_period
    - farewell
    - wellbeing_question
    - wellbeing_answer
    - politeness
    - identity
    - person_name
    - volume_fa_en_a1_unit01_farewell_verb_02_single
    - volume_fa_en_a1_unit01_item_03_single
    - volume_fa_en_a1_unit01_item_05_single
    person:
    - first
    - second
    - third
slot_presets:
  greeting: &id001
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: greeting
  time_period: &id002
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: time_period
  farewell: &id008
    language_code: en
    part_of_speech:
    - noun
    - verb
    - adverb
    agreement_tags:
      semantic: farewell
  farewell_word: &id010
    language_code: en
    part_of_speech:
    - noun
    - verb
    - adverb
    agreement_tags:
      semantic: [farewell, greeting]
  farewell_verb: &id009
    language_code: en
    part_of_speech: verb
    agreement_tags:
      semantic: farewell
  wellbeing_answer: &id005
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: wellbeing_answer
  wellbeing_question: &id007
    language_code: en
    part_of_speech: adverb
    agreement_tags:
      semantic: wellbeing_question
  taught_adjective: &id003
    language_code: en
    part_of_speech: adjective
    agreement_tags: {}
  politeness: &id004
    language_code: en
    part_of_speech:
    - noun
    - verb
    - adjective
    - particle
    agreement_tags:
      semantic: [politeness, wellbeing_answer]
  identity: &id006
    language_code: en
    part_of_speech:
    - pronoun
    - verb
    - adverb
    - adjective
    agreement_tags:
      semantic: [identity, wellbeing_question, wellbeing_answer]
  practice_word: &id013
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
    agreement_tags: {}
