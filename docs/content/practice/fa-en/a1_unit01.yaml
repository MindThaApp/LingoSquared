schema_version: "1.0"
pack_key: practice.fa-en.a1.unit01
source_language: fa
target_language: en
unit_content_key: en.a1.unit01.greetings
review:
  status: unreviewed
  fresh_context: false
  notes: "Authored directly (Codex rate-limited at authoring time), mirroring the en-fa pilot pack's schema and rigor. Needs a fresh-context review before shipping, same as any other content."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [greeting, time_period, farewell, wellbeing_question, wellbeing_answer, politeness, identity, person_name, dialogue_word]
    person: [first, second, third]
slot_presets:
  greeting: &greeting {language_code: en, part_of_speech: noun, agreement_tags: {semantic: greeting}}
  time_period: &time_period {language_code: en, part_of_speech: noun, agreement_tags: {semantic: time_period}}
  farewell: &farewell {language_code: en, part_of_speech: [noun, verb, adverb], agreement_tags: {semantic: farewell}}
  farewell_word: &farewell_word {language_code: en, part_of_speech: [noun, adverb], agreement_tags: {semantic: farewell}}
  farewell_verb: &farewell_verb {language_code: en, part_of_speech: verb, agreement_tags: {semantic: farewell}}
  wellbeing_answer: &wellbeing_answer {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: wellbeing_answer}}
  taught_adjective: &taught_adjective {language_code: en, part_of_speech: adjective, agreement_tags: {}}
  politeness: &politeness {language_code: en, part_of_speech: [noun, verb, adjective, particle], agreement_tags: {semantic: politeness}}
  identity: &identity {language_code: en, part_of_speech: [pronoun, verb], agreement_tags: {semantic: identity}}
templates:
  # Lesson 1: everyday greetings.
  - content_key: practice.fa-en.en.a1.unit01.lesson01.greeting_meaning.001
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: multiple_choice
    frame: {text: "{greeting}", language_code: en, direction: ltr}
    slots: {greeting: *greeting}
    answer_derivation: {kind: slot_gloss, slot: greeting}
    feedback_frame: {text: "{greeting} برای سلام یا خداحافظی روزمره به‌کار می‌رود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson01.greeting_fill.002
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: fill_in_blank
    frame: {text: "{greeting}", language_code: en, direction: ltr}
    slots: {greeting: *greeting}
    answer_derivation: {kind: slot_text, slot: greeting}
    feedback_frame: {text: "املای درست این واژه {greeting} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson01.greeting_translate.003
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: translation
    frame: {text: "{greeting}", language_code: fa, direction: rtl, slot_rendering: {greeting: english_gloss}}
    slots: {greeting: *greeting}
    answer_derivation: {kind: slot_text, slot: greeting}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی عبارت فارسی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson01.greeting_pair.004
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: matching_pairs
    frame: {text: "{greeting_one} — {greeting_two}", language_code: en, direction: ltr}
    slots: {greeting_one: *greeting, greeting_two: *greeting}
    slot_relations: [{kind: distinct, slots: [greeting_one, greeting_two]}]
    answer_derivation: {kind: matching_pairs, slots: [greeting_one, greeting_two]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}

  # Lesson 3: wellbeing exchange.
  - content_key: practice.fa-en.en.a1.unit01.lesson03.adjective_meaning.001
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: multiple_choice
    frame: {text: "{adjective}", language_code: en, direction: ltr}
    slots: {adjective: *taught_adjective}
    answer_derivation: {kind: slot_gloss, slot: adjective}
    feedback_frame: {text: "معنی فارسی {adjective} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson03.wellbeing_fill.002
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: fill_in_blank
    frame: {text: "{wellbeing_answer}", language_code: en, direction: ltr}
    slots: {wellbeing_answer: *wellbeing_answer}
    answer_derivation: {kind: slot_text, slot: wellbeing_answer}
    feedback_frame: {text: "املای درست این واژه {wellbeing_answer} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson03.politeness_translate.003
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: translation
    frame: {text: "{politeness}", language_code: fa, direction: rtl, slot_rendering: {politeness: english_gloss}}
    slots: {politeness: *politeness}
    answer_derivation: {kind: slot_text, slot: politeness}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی واژهٔ فارسی است.", language_code: fa, direction: rtl}

  # Lesson 5: friendly closings.
  - content_key: practice.fa-en.en.a1.unit01.lesson05.farewell_meaning.001
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: multiple_choice
    frame: {text: "{farewell}", language_code: en, direction: ltr}
    slots: {farewell: *farewell}
    answer_derivation: {kind: slot_gloss, slot: farewell}
    feedback_frame: {text: "{farewell} واژه‌ای از عبارت‌های خداحافظی درس‌های این بسته است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson05.farewell_fill.002
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: fill_in_blank
    frame: {text: "{farewell}", language_code: en, direction: ltr}
    slots: {farewell: *farewell}
    answer_derivation: {kind: slot_text, slot: farewell}
    feedback_frame: {text: "املای درست این واژه {farewell} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson05.farewell_order.003
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: word_order
    frame: {text: "you later {farewell_verb}", language_code: en, direction: ltr}
    slots: {farewell_verb: *farewell_verb}
    answer_derivation: {kind: render_frame, frame: {text: "{farewell_verb} you later", language_code: en, direction: ltr}}
    feedback_frame: {text: "ترتیب درست {farewell_verb} you later است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit01.lesson05.farewell_pair.004
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: matching_pairs
    frame: {text: "{farewell_one} — {farewell_two}", language_code: en, direction: ltr}
    slots: {farewell_one: *farewell_word, farewell_two: *farewell_word}
    slot_relations: [{kind: distinct, slots: [farewell_one, farewell_two]}]
    answer_derivation: {kind: matching_pairs, slots: [farewell_one, farewell_two]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
