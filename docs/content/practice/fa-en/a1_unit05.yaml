schema_version: "1.0"
pack_key: practice.fa-en.a1.unit05
source_language: fa
target_language: en
unit_content_key: en.a1.unit05.time
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by a fork of the practice-pool-sync lane
    (en-fa/fa-en/en-prs gap). This unit's actual clock-time vocabulary
    (o'clock/half/quarter/past/to) is deliberately NOT used as a slot
    value anywhere in this pack -- these are fixed time-telling function
    words, not an interchangeable pool (mirrors the nl-en lane's own
    documented caution against exactly this). Instead this pack reuses
    the existing day_part (4-member: morning/afternoon/evening/night,
    bare-word recognition only) and day_part_in (narrower 3-member:
    morning/afternoon/evening, safe for an "at nine in the {item}" frame
    since natives never say "in the night") tags already established in
    scripts/_en_target_lexeme_common.py by the nl-en lane's own unit01/
    unit05 work -- no new POS/tag classification needed, only Farsi
    glosses (already added for this pack's needed tokens: time/o'clock/
    half/past/quarter/night/store/in/closes/does/close, tracked in
    scripts/backfill_lexemes_fa_en.py). No numeric hour-telling slot was
    attempted since no "hour_number" tag exists yet and forcing one
    wasn't in scope for this pass -- flagging as a follow-up rather than
    forcing something unsafe. Verified with
    scripts/_practice_slot_check.py that every slot has >=1 candidate
    and every multiple_choice/matching_pairs slot has >=3 distinct
    candidate values.

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened daypart_pair.003
    from 2 to 4 pairs (day_part/noun, real course-wide pool=4 -- the full
    morning/afternoon/evening/night set), no padding with untaught words.

    Depth pass, 2026-07-07 (templates-per-unit density audit: fa-en unit05
    was the single thinnest unit in the whole direction at only 5 templates
    -- lessons01/02, oclock_and_half and quarter_times, had ZERO templates
    at all, deliberately, since this pack's own original reasoning treats
    o'clock/half/quarter/past/to as fixed function words, not an
    interchangeable pool; mirrors the sibling prs-en unit05 pack just
    deepened the same night). Added 9 new templates, all real vocabulary,
    none of it invented: the real, already-taught NUMBERS inside these
    clock phrases (three/five in lesson01; four/ten in lesson02) are
    genuinely fillable via the already-established hour_number tag in
    scripts/_en_target_lexeme_common.py (one through twelve, POS noun,
    explicitly documented there as safe for exactly this "It's {item}
    o'clock." use case). lesson01 gained hour_gloss (multiple_choice),
    hour_listen (listen_select), hour_translate (translation), hour_order
    (word_order, "It's {item} o'clock" -- verified grammatical for all 12
    hour_number members), and hour_pair (matching_pairs, all 12 hour_number
    members, per AUTHORING_GUIDE.md §16). lesson02 gained ten_past_order
    and quarter_to_order (word_order, "It's ten past {item}"/"It's a
    quarter to {item}" -- both hand-verified grammatical for all 12
    hour_number members). Separately, this pack's own tag_schema/
    slot_presets already defined day_part_in (afternoon/evening/morning,
    deliberately excluding night) specifically for the store/library
    open-close sentences, per this pack's own original authoring note --
    but no template ever actually used it until now. lesson03 gained
    store_open_order (word_order, "The store opens at nine in the
    {item}.") and lesson04 gained library_close_order (word_order, "It
    closes at six in the {item}.") -- word_order deliberately chosen over
    fill_in_blank here, since a bare fill_in_blank slot on day_part_in
    would be genuinely ambiguous (afternoon/evening/morning are all
    grammatically valid in that frame but not interchangeable -- only one
    is the real taught fact); word_order has no such ambiguity risk since
    the learner reorders one concretely-generated instance. Farsi glosses
    for every token needed (one-twelve, morning/afternoon/evening) already
    existed in scripts/backfill_lexemes_fa_en.py -- no new gloss entries
    added. Only this pack's own tag_schema/slot_presets needed a new
    hour_number alias (the semantic tag itself already existed course-wide
    in _en_target_lexeme_common.py). Verified with
    scripts/_practice_slot_check.py (hour_number: 12 distinct A1
    candidates, day_part_in: 3, both well above the relevant floors) and
    compile_content.py practice-validate, 0 errors/0 warnings. No
    fill_in_blank templates added, so scripts/_fill_in_blank_ambiguity_
    check.py has nothing new to flag in this pack. Review status left as
    unreviewed/not-fresh-context, matching this pack's own pre-existing
    status -- a fresh-context review of the whole pack (including these 9
    new templates) has not happened yet.

    Unit-scope DEAD/FLOOR fix pass (2026-07-24, PACK-ONLY re-authoring
    lane): scripts/_practice_unit_scope_check.py found 21 DEAD template-
    slots + 3 below-floor -- the depth pass above reused hour_number
    (12 members) believing it was already-established course-wide vocab,
    but iter_specs() shows hour_number is introduced entirely by unit03
    (numbers), never by unit05 -- 0 unit-scoped candidates, a textbook
    DO-NOT #2 (a tag whose real lexemes were first introduced by an
    earlier unit). Same defect for day_part_in (0 in-unit05: its 3
    members morning/afternoon/evening all belong to unit01; only
    'night' is unit05's own, and night was never day_part_in-tagged in
    the first place, by original design, since "in the night" is not
    natural English). unit05's OWN vocabulary (measured via iter_specs
    filtered to '.a1.unit05.') is just 11 lexemes, mostly untagged
    function words: time/o'clock/half/past (lesson01), quarter
    (lesson02), night/store/in/closes (lesson03), does/close (lesson04)
    -- only 'night' (day_part) and 'store' carry any semantic tag at
    all. Fixed by dropping the semantic constraint on every bare-frame
    recognition/production slot ('{item}' with no other literal text,
    §3.1(c) -- safe regardless of pool) and constraining by
    part_of_speech only: hour_gloss/hour_listen/hour_translate (lesson01)
    and daypart_gloss/daypart_listen (lesson03) and daypart_listen
    (lesson04) now draw on the unit's own 6 real nouns (time/o'clock/
    half/quarter/night/store, all distinct glosses, well above the
    3-distinct floor). hour_pair.005 (matching_pairs) reduced from a
    dead 12-slot hour_number pool to 6 slots over that same 6-noun pool
    (exact 6-pair floor, no padding). daypart_pair.003 widened from a
    dead 4-slot day_part pool (1 in-unit member) to 6 slots over
    part_of_speech:[noun,verb] with no semantic tag (adds
    closes/does/close -- 9 distinct in-unit, still zero risk since
    matching_pairs has no frame-grammaticality exposure). hour_order.004,
    ten_past_order.001, and quarter_to_order.002 (word_order frames
    literally requiring a taught NUMBER -- "It's {item} o'clock" / "It's
    ten past {item}" / "It's a quarter to {item}") were DROPPED: unit05
    teaches no numbers of its own (that is unit03's job) and forcing any
    of the unit's real nouns into those frames is ungrammatical ("It's
    store o'clock"), so re-anchoring was not possible without a new
    backfill tag, which is out of PACK-ONLY scope -- logging this as a
    genuine follow-up for whoever owns unit05's backfill (a dedicated
    single-member "o'clock" anchor, if ever wanted, would need a new
    semantic tag). Dropping those 2 lesson02 templates would have left
    lesson02 with ZERO live templates, so added a replacement bare-word
    translation (vocab_translate.003) anchored to lesson02.quarter_times
    over the same unit-noun pool, keeping every lesson represented per
    recipe §8. store_open_order.004 and library_close_order.004
    (word_order, day_part_in, both DEAD at 0 in-unit candidates) were
    NOT dropped -- re-anchored instead to day_part (course-wide:
    morning/afternoon/evening/night, all 4 members hand-checked
    grammatical) with brand-new frames that avoid the "in the {item}"
    preposition trap day_part_in existed to route around: "It's {item}
    now." (lesson03) and "I love the {item}." (lesson04), both correct
    English for every one of the 4 course-scope day_part members.
    tag_schema/slot_presets cleaned up to match: hour_number and
    day_part_in removed (no longer referenced by any template); two new
    untagged presets (unit_noun, unit_noun_verb) added for the
    part_of_speech-only slots. Net template count: 12 (was 14; -3 for the
    genuinely-unsupportable number frames, +1 replacement), tier balance
    recognition=5 / structured=4 / production=3, every lesson still
    carries at least one live template. Verified: scripts/
    _practice_unit_scope_check.py now reports 0 DEAD, 0 FLOOR for
    a1_unit05.yaml; compile_content.py practice-validate 0 errors (see
    coordinator report for the exact fa-en batch invocation).

    POS-only-matching audit (2026-07-25, wave-2 PACK-ONLY lane):
    daypart_pair.003 and hour_pair.005 were dispatched for
    semantic-union conversion (POS-only matching_pairs pull the whole
    level's vocab at Endless-Practice course scope). DELIBERATELY LEFT
    POS-only: re-measured via iter_specs() -- unit05's own 11 lexemes
    carry only 3 semantic taggings total (night: time_period+day_part;
    store: neighborhood_noun), i.e. the widest possible in-unit
    semantic union covers 2 distinct tokens, far below the 6-pair
    floor; every other unit05 lexeme (time/o'clock/half/past/quarter/
    in/closes/does/close) is untagged, exactly as the 2026-07-24 pass
    above documented. Adding tags is a backfill change, out of
    PACK-ONLY scope; a wrong union is worse than the status quo. The
    off-theme-pairs exposure at course scope stands until unit05's
    backfill gains native tags (already logged above as a follow-up).
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun, verb, particle, symbol]
  agreement_tags:
    semantic: [day_part]
slot_presets:
  day_part: &day_part {language_code: en, part_of_speech: noun, agreement_tags: {semantic: day_part}}
  unit_noun: &unit_noun {language_code: en, part_of_speech: noun}
  unit_noun_verb: &unit_noun_verb {language_code: en, part_of_speech: [noun, verb]}
templates:
  - content_key: practice.fa-en.en.a1.unit05.lesson01.hour_gloss.001
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit05.lesson01.hour_listen.002
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit05.lesson01.hour_translate.003
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit05.lesson01.hour_pair.005
    lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
    type: matching_pairs
    frame: {text: "{hour_one} — {hour_two} — {hour_three} — {hour_four} — {hour_five} — {hour_six}", language_code: en, direction: ltr}
    slots: {hour_one: *unit_noun, hour_two: *unit_noun, hour_three: *unit_noun, hour_four: *unit_noun, hour_five: *unit_noun, hour_six: *unit_noun}
    slot_relations: [{kind: distinct, slots: [hour_one, hour_two, hour_three, hour_four, hour_five, hour_six]}]
    answer_derivation: {kind: matching_pairs, slots: [hour_one, hour_two, hour_three, hour_four, hour_five, hour_six]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit05.lesson02.vocab_translate.003
    lesson_content_key: en.a1.unit05.lesson02.quarter_times
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit05.lesson03.daypart_gloss.001
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit05.lesson03.daypart_listen.002
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit05.lesson03.daypart_pair.003
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: matching_pairs
    frame: {text: "{day_part_one} — {day_part_two} — {day_part_three} — {day_part_four} — {day_part_five} — {day_part_six}", language_code: en, direction: ltr}
    slots: {day_part_one: *unit_noun_verb, day_part_two: *unit_noun_verb, day_part_three: *unit_noun_verb, day_part_four: *unit_noun_verb, day_part_five: *unit_noun_verb, day_part_six: *unit_noun_verb}
    slot_relations: [{kind: distinct, slots: [day_part_one, day_part_two, day_part_three, day_part_four, day_part_five, day_part_six]}]
    answer_derivation: {kind: matching_pairs, slots: [day_part_one, day_part_two, day_part_three, day_part_four, day_part_five, day_part_six]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit05.lesson03.store_open_order.004
    lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
    type: word_order
    frame: {text: "It's {item} now.", language_code: en, direction: ltr}
    slots: {item: *day_part}
    answer_derivation: {kind: render_frame, frame: {text: "It's {item} now.", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} بخشی از روز در این جمله است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit05.lesson04.daypart_listen.001
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که در این گفتگو شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit05.lesson04.daypart_translate.003
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: translation
    frame: {text: "{day_part}", language_code: fa, direction: rtl, slot_rendering: {day_part: english_gloss}}
    slots: {day_part: *day_part}
    answer_derivation: {kind: slot_text, slot: day_part}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این بخش از روز است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit05.lesson04.library_close_order.004
    lesson_content_key: en.a1.unit05.lesson04.schedule_dialogue
    type: word_order
    frame: {text: "I love the {item}.", language_code: en, direction: ltr}
    slots: {item: *day_part}
    answer_derivation: {kind: render_frame, frame: {text: "I love the {item}.", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} بخشی از روز در این جمله است.", language_code: fa, direction: rtl}
