    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a2.unit25.lesson03.listen.001
    lesson_content_key: en.a2.unit25.lesson03.reading_a_registration_notice
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *bureaucracy_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a2.unit25.lesson04.choose.001
    lesson_content_key: en.a2.unit25.lesson04.dmv_appointment_dialogue
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *bureaucracy_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a2.unit25.lesson04.translate.002
    lesson_content_key: en.a2.unit25.lesson04.dmv_appointment_dialogue
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *bureaucracy_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
