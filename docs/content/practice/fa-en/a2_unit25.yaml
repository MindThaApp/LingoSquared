schema_version: '1.0'
pack_key: practice.fa-en.a2.unit25
source_language: fa
target_language: en
unit_content_key: en.a2.unit25.bureaucracy
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-22 (fa-en practice pass, rest): 6 fixes -- weekday_order feedback (lesson02 and lesson04) wrongly said the weekday was the one Daniel suggested / the confirmed one although the slot draws any weekday, now neutral; weekday_translate.006 feedback used Persian question mark after English; lesson04 weekday_translate Persian prompt and feedback moved to colloquial خوبه; the two volume_order feedback strings were English only, now Persian. NATIVE FLAGS: lesson04 Persian prompt خوبه does not fully determine works vs is good (no accepted-answers list); colloquial/formal imperative boilerplate (انتخاب کنید) kept as house style. BACKFILL GLOSS FLAGS: none.

    Authored 2026-07-06 by the Claude session extending fa-en''s practice pool to units 21-26 -- this is the first A2-level
    unit for this direction (registering with local authorities: appointments, documents, formal requests). Uses nl-en''s
    a2_unit25.yaml as the structural reference: the shared 4-member ''bureaucracy_noun'' tag (appointment/document/form/confirmation)
    is used ONLY for bare-word recognition, deliberately not attempting a generative frame -- this unit''s A2-register content
    is dominated by multi-word formal phrases ("I was wondering whether...", "Could you tell me...") that don''t reduce to
    a safe single-token slot, same discipline nl-en''s own unit25 pack documented. No new EN_POS/agreement_tags entries were
    needed; only scripts/backfill_lexemes_fa_en.py''s Farsi gloss dict and UNIT_FILES tuple were extended (28 new tokens for
    this unit alone, the largest single-unit addition in this batch given its A2 formal-register vocabulary).

    Anchoring check (same discipline as every other pack in this batch): verified via iter_specs() that every one of this
    unit''s four lessons introduces at least one new lexeme, so all four are safe lesson_content_key anchors.

    Every slot''s real candidate count was verified with scripts/_practice_slot_check.py (extended to cover fa-en units 21-26)
    and compile_content.py practice-validate. Needs the standard fresh-context review before import.

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened match.003 from 2 to 4 pairs (bureaucracy_noun/noun, real course-wide
    pool=4 -- appointment/confirmation/document/form), no padding with untaught words.

    Depth pass 2026-07-06 (practice-pool-sync, templates-per-unit audit): 8 -> 13 templates. This unit''s real taught vocabulary
    is genuinely thin for Endless Practice slot-filling -- only the 4-member bureaucracy_noun tag is safe for bare-word recognition;
    every other introduced_token is either a function word or part of a multi-word A2 formal phrase ("I was wondering whether...",
    "Could you tell me what I need to bring?") that doesn''t reduce to a single fillable slot without producing ungrammatical
    output, same discipline this pack''s own notes already documented above and nl-en''s a2_unit25.yaml established as the
    reference. No new EN_POS/agreement_tags entries or Farsi glosses were added (none needed/allowed for this pass) -- every
    new template reuses the EXISTING bureaucracy_noun tag (multiple_choice/listen_select/translation), filling the remaining
    empty (lesson x exercise-type) cells of the natural 4-lesson x 3-recognition-type grid (12 slots) + the existing 1 matching_pairs
    = 13, which is the genuine ceiling for this unit as currently taught -- verified there is no untapped cell left (lesson02/03
    now have choose+listen+translate all present; lesson04 now has choose+listen+translate all present; lesson01 was already
    complete). Anchoring re-verified via a fresh iter_specs() dump grouped by lesson_content_key: all four lessons still introduce
    real new lexemes (registration_vocabulary: 6, making_a_formal_appointment: 9, reading_a_registration_notice: 8, dmv_appointment_dialogue:
    3), so no anchor changed. Re-ran compile_content.py practice-validate (0 errors/0 warnings across the whole fa-en pack)
    and scripts/_practice_slot_check.py (fa-en direction: OK, no new problems -- the 5 pre-existing problems reported by that
    script are all in en-fa unit01/unit02 matching_pairs templates, unrelated to this unit or this direction).

    Cross-direction technique backport (2026-07-06): the parallel prs-en session working the same unit25/26 depth pass discovered
    a better technique than the bare bureaucracy_noun-only reuse above -- this unit''s own real taught sentences also generalize
    an already-classified COURSE-WIDE tag from an earlier unit, not just bureaucracy_noun. lesson02''s real taught phrase
    "Would it be possible to come this Friday?" and lesson04''s real dialogue line "Friday at 10am works." both generalize
    to any of the 7 weekdays (course-wide ''weekday'' tag, 7 members, defined in unit04) with zero grammar loss -- "Would
    it be possible to come this Monday?"/"Monday at 10am works." are equally grammatical. Backported prs-en''s exact 8-template
    pattern (practice.prs-en.a2.unit25.yaml, reviewed as the reference for this pass): word_order + fill_in_blank + translation
    + bare listen_select for each of lesson02 and lesson04, anchored to their own real lesson (lesson02.making_a_formal_appointment,
    lesson04.dmv_appointment_dialogue respectively). No invented English tokens or Farsi glosses -- every gloss/POS/tag (weekday''s
    7 members, "my"/"your"/"his"/"her" n/a here) already existed in scripts/_en_target_lexeme_common.py and scripts/backfill_lexemes_fa_en.py''s
    EN_TARGET_TO_FA_GLOSS dict (monday/tuesday/wednesday/thursday/friday/saturday/sunday all present) before this pass, so
    neither shared file needed a change (both out of scope for this pass anyway). 13 -> 21 templates. Re-verified with scripts/_practice_slot_check.py
    (weekday has 7 distinct course-wide candidates, well above the >=3 multiple_choice/listen_select floor) and compile_content.py
    practice-validate, 0 errors/0 warnings. Still needs the standard fresh-context review before import.

    A2-scoping correctness fix (2026-07-07): scripts/_practice_slot_check.py pools ALL specs from iter_specs() (both A1 and
    A2) together when counting a tag''s real distinct-candidate count, but backend/app/practice/service.py''s _material()
    actually scopes both PracticeTemplate and Lexeme queries by course_id, and ''A1''/''A2'' are separate Course rows -- a
    real A2 enrollee only ever sees A2-scoped lexemes. A standalone A2-only-scoped check (filtering iter_specs() to level==''a2'')
    found the ''weekday'' course-wide tag (7 members pooled with A1) has only 1 REAL A2-scoped candidate (''friday'' -- the
    only weekday ever introduced across all four A2 units 25-28), invalidating the "7 distinct course-wide candidates" note
    above (a pooled-with-A1 count, not a real A2-only count). Both lesson02.weekday_listen.007 and lesson04.weekday_listen.007
    (listen_select, needs >=3 distinct) could never actually generate for a real A2-course user. Fixed by converting both
    to type: translation (bare single-word production, slot_text derivation instead of slot_gloss -- no minimum-candidate
    floor, and genuinely distinct from the existing full-sentence weekday_translate templates in the same lessons, not a duplicate)
    -- renamed weekday_translate_bare.007 (both). No candidates invented, no A1 vocabulary pooled in as if A2-scoped.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - bureaucracy_noun
    - weekday
slot_presets:
  bureaucracy_noun: &id001
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: bureaucracy_noun
  weekday: &id002
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: weekday
