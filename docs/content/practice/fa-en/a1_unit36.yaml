schema_version: '1.0'
pack_key: practice.fa-en.a1.unit36
source_language: fa
target_language: en
unit_content_key: en.a1.unit36.education
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-07-11, fa-en depth-audit lane (unit 7 of the 30-42 batch, see unit30''s pack notes for the full batch
    rationale).

    One semantic tag: ''class_noun'' (class/course/test from lesson01, the 3-member subset of this unit''s education nouns
    genuinely safe in "I have a {item}." -- "homework"/"subject" are deliberately excluded: homework is uncountable ("I have
    a homework" is ungrammatical) and "I have a subject" isn''t a natural claim either). Only 3 members -- matching_pairs
    skipped as too thin (same call as unit31''s eye_color), covered instead by a full-sentence translate variant for added
    depth.

    Anchoring check: lesson01 introduces class/course/test as real new lexemes, verified via iter_specs(). Slot candidate
    count verified with scripts/_practice_slot_check.py and compile_content.py practice-validate. Needs the standard fresh-context
    review before import.

    Fresh-context review 2026-07-11 (zero access to authoring reasoning): verified every slot member is taught in this unit''s
    realization, every generative frame is grammatical for all fillings, Farsi feedback/instruction text reads as natural
    Iranian Farsi with correct RTL/ZWNJ, answer shapes (word_order list-shaped, matching_pairs covers every pair) are sound,
    listen_select distractors are distinct single vocabulary words, and no bare YAML booleans or snake_case jargon leak. compile_content.py
    practice-validate, scripts/_practice_slot_check.py, and backfill_lexemes_fa_en.py --dry-run all clean. No defects found;
    upgraded to reviewed.


    Re-anchor fix 2026-07-24 (unit-scope DEAD-template pass, docs/content/PRACTICE_PACK_RECIPE.md
    §1.1/DO-NOT #2): BOTH prior passes'' "class/course/test" claim for class_noun was wrong at CHECKPOINT
    (unit) scope. scripts/_practice_unit_scope_check.py confirmed: "class" and "test" (2 of class_noun''s 3
    course-wide members) were already classified in an EARLIER unit (unit13), so this unit''s own lesson01
    only introduces "course" as a real new lexeme. That left choose.001/listen.002 at 1 (!) distinct
    unit-scoped answer -- nowhere near the 3-option floor, silently 0 items forever -- and
    translate_sentence.005.volume_fill.008''s fill_in_blank (volume_fa_en_a1_unit36_item_08_single, keyed on
    "test" in scripts/_en_target_lexeme_common.py''s VOLUME_PRACTICE_SINGLETON_TAGS table) at 0 unit-scoped
    candidates -- DEAD, since "test" also belongs to unit13.

    order.004, translate_sentence.005, and volume_order.002 were UNCHANGED -- they correctly rely on
    class_noun''s single unit-native member ("course") for a deterministic frame/fixed-sentence-translation
    (recipe §3.1(d)/§6.6(b)) and were not flagged by the validator.

    Re-anchored choose.001 and listen.002 (only) from class_noun to a plain `part_of_speech: noun` constraint
    (no semantic tag, recipe §3.1(c) -- bare-word MC/listen has no frame-literal-text grammaticality concern).
    Also widened translate.003 the same way for consistency/variety (translation has no floor either way).
    Verified via iter_specs() filtered to `.a1.unit36.`: this unit natively introduces 8 distinct nouns across
    its 4 lessons -- course/community/college/math (lesson01), photography (lesson03), nights/skills/classes
    (lesson04) -- all distinct Farsi glosses, no confusable pairs. This also let me ADD match.006
    (matching_pairs, 6 slots over the same noun pool) -- the original 2026-07-11 notes explicitly said
    "matching_pairs skipped as too thin" over the narrow class_noun tag alone, but the same part_of_speech-only
    widening that fixes choose/listen makes a full 6-pair matching_pairs viable, strengthening what was
    previously a 1-template structured tier (order.004/volume_order.002 are both the same "I have a course."
    frame) to include a real vocabulary-matching exercise.

    Dropped translate_sentence.005.volume_fill.008 (fill_in_blank): no unit-native single-course-wide-candidate
    tag exists to re-anchor it onto (fill_in_blank needs <=1 course-wide candidate per slot, recipe §6.5), and
    the pack is clearly viable without it (order.004/volume_order.002/translate_sentence.005 keep the
    structured/production tiers alive). LOG for the coordinator: a genuinely unit36-native single-member tag
    (e.g. on "math" or "college") would let a future pass re-add a working fill_in_blank here -- needs a
    backfill change, out of this pass''s pack-only scope.


    Polish wave-2 2026-07-25 (tier-thinness + POS-only-matching pass, recipe §8/§6.3): recognition and production
    were 2 live each. Added choose_verb.007 (MC over a plain part_of_speech:verb constraint, anchored lesson02
    which previously had no template -- the unit natively introduces 11 distinct verbs with 11 distinct Farsi
    glosses (study/studies/studying carry distinct discriminable glosses), clearing the 3-option floor; same
    POS-only bare-word MC pattern as this pack''s choose.001) and translate_verb.008 (bare-word production over
    the same verb constraint, anchored lesson04 which previously had no template; POS-only is sanctioned for
    bare-word translation). Tiers now 3/3/3 live. match.006 (dispatched POS-ONLY-MATCHING) is left POS-only
    DELIBERATELY: the unit''s only tag_schema semantic tag is class_noun with exactly 1 unit-native member
    ("course" -- class/test belong to unit13), and even adding the shared education_noun tag would reach only 3
    unit tokens (course/homework/subject), far under the 6 distinct unit tokens the 6-slot template needs; a
    wrong union is worse than the status quo. This confirms the pack''s own 2026-07-24 re-anchor rationale.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - class_noun
slot_presets:
  class_noun: &id001
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: class_noun
templates:
- content_key: practice.fa-en.en.a1.unit36.lesson01.choose.001
  lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: &unit36_noun {language_code: en, part_of_speech: noun}
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: معنی فارسی {item} را انتخاب کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit36.lesson01.listen.002
  lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *unit36_noun
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: واژه‌ای که شنیدید {item} بود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit36.lesson01.match.006
  lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
  type: matching_pairs
  frame:
    text: '{first} — {second}'
    language_code: en
    direction: ltr
  slots:
    first: *unit36_noun
    second: *unit36_noun
    third: *unit36_noun
    fourth: *unit36_noun
    fifth: *unit36_noun
    sixth: *unit36_noun
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: هر واژه را به معنی فارسی خودش وصل کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit36.lesson01.translate.003
  lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *unit36_noun
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: پاسخ درست، معادل انگلیسی این واژه است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit36.lesson01.order.004
  lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
  type: word_order
  frame:
    text: I have a {item}
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: I have a {item}
      language_code: en
      direction: ltr
  feedback_frame:
    text: '{item} چیزی است که ذکر شد.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit36.lesson01.translate_sentence.005
  lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
  type: translation
  frame:
    text: من یه {item} دارم.
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: I have a {item}
      language_code: en
      direction: ltr
  feedback_frame:
    text: I have a {item}. یعنی من یه {item} دارم.
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit36.lesson01.translate_sentence.005.volume_order.002
  lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
  type: word_order
  frame:
    text: I have a {item}
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: class_noun
  answer_derivation:
    kind: render_frame
    frame:
      text: I have a {item}
      language_code: en
