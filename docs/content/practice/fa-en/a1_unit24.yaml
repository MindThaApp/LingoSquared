schema_version: "1.0"
pack_key: practice.fa-en.a1.unit24
source_language: fa
target_language: en
unit_content_key: en.a1.unit24.housing
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the Claude session extending fa-en's practice
    pool to units 21-26 -- unit24 is the 24th and final A1 spine outcome
    for the shared English realization, so this completes fa-en's full
    A1 practice-pool coverage (units 1-24). Uses nl-en's a1_unit24.yaml
    as the structural reference: the shared 4-member 'room_noun' tag
    (bedroom/kitchen/bathroom/garden) is verified safe for a generative
    "There's a {item}." frame (the real content uses this exact shape
    for kitchen: "There's a small kitchen."). "living room" (a two-word
    compound) is deliberately excluded from the tag, same as nl-en's own
    reasoning. No new EN_POS/agreement_tags entries were needed; only
    scripts/backfill_lexemes_fa_en.py's Farsi gloss dict and UNIT_FILES
    tuple were extended.

    Anchoring check (same discipline as every other pack in this batch):
    verified via iter_specs() that every one of this unit's four lessons
    introduces at least one new lexeme, so all four are safe
    lesson_content_key anchors.

    Every slot's real candidate count was verified with
    scripts/_practice_slot_check.py (extended to cover fa-en units
    21-26) and compile_content.py practice-validate. Needs the standard
    fresh-context review before import.

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened match.003 from
    2 to 4 pairs (room_noun/noun, real course-wide pool=4 -- bathroom/
    bedroom/garden/kitchen), no padding with untaught words.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [room_noun]
slot_presets:
  room_noun: &room_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: room_noun}}
templates:
  - content_key: practice.fa-en.en.a1.unit24.lesson01.choose.001
    lesson_content_key: en.a1.unit24.lesson01.rooms_of_a_home
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *room_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit24.lesson01.listen.002
    lesson_content_key: en.a1.unit24.lesson01.rooms_of_a_home
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *room_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit24.lesson01.match.003
    lesson_content_key: en.a1.unit24.lesson01.rooms_of_a_home
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *room_noun, second: *room_noun, third: *room_noun, fourth: *room_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "هر اتاق را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit24.lesson01.translate.004
    lesson_content_key: en.a1.unit24.lesson01.rooms_of_a_home
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *room_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این اتاق است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit24.lesson02.order.001
    lesson_content_key: en.a1.unit24.lesson02.describing_your_home
    type: word_order
    frame: {text: "There's a {item}", language_code: en, direction: ltr}
    slots: {item: *room_noun}
    answer_derivation: {kind: render_frame, frame: {text: "There's a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} اتاقی است که ذکر شد.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit24.lesson02.translate.003
    lesson_content_key: en.a1.unit24.lesson02.describing_your_home
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *room_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این اتاق است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit24.lesson03.choose.001
    lesson_content_key: en.a1.unit24.lesson03.reading_a_home_description
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *room_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit24.lesson04.listen.001
    lesson_content_key: en.a1.unit24.lesson04.home_description_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *room_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که در این گفتگو شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit24.lesson04.order.002
    lesson_content_key: en.a1.unit24.lesson04.home_description_dialogue
    type: word_order
    frame: {text: "There's a {item}", language_code: en, direction: ltr}
    slots: {item: *room_noun}
    answer_derivation: {kind: render_frame, frame: {text: "There's a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} اتاقی است که ذکر شد.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit24.lesson04.translate.003
