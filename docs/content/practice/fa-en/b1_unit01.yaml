schema_version: "1.0"
pack_key: practice.fa-en.b1.unit01
source_language: fa
target_language: en
unit_content_key: en.b1.unit01.necessity
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (fa-en practice pass, fresh context; 10 fixes). (1) wrong-sense glosses fixed via UNIT_SENSE_OVERRIDES: must/should/have no longer share the bare gloss 'باید' (translation was underdetermined; now 'باید (الزام قوی)' / 'بهتر است (توصیه)' / 'مجبور بودن؛ داشتن'), make 'گرفتن' -> 'ترتیب دادن', go, fee 'کارمزد' -> 'هزینه'. (2) answer-leak Latin removed from glosses (more, done, don't). (3) l4 slot narrowed to noun/verb/adjective: drops also/too/more (also=همچنین vs too=هم were also-correct distractors). NATIVE FLAGS: 'هزینه' for fee, 'ترتیب دادن' for make (an appointment), 'بهتر است (توصیه)' for should. BACKFILL GLOSS FLAGS (global tables, not edited): 'by' gloss contains Latin 'pay by card'; i'd/you'll/it's/that's glosses contain Latin (pronouns, outside pools).

    GRAMMAR UNIT (must/have to/should necessity + past regret "should have").
    76 lexemes across all 4 lessons (7/19/28/22), but per the recipe's §8.1
    grammar-unit pattern, most tokens are function words (pronouns,
    articles, prepositions, auxiliaries with no semantic tag). Recognition/
    production use each lesson's own tag narrowed to [noun, verb, adjective,
    adverb], which mechanically strips the pronouns/particles/prepositions
    (i/this/the/by/she/an/you/and/we/they/not/if/a/his/he/on/your/oh/no/
    that/them/or/you'll/everything/but) without hand-curation. This yields
    6/9/20/13 content candidates per lesson -- comfortably clearing the MC
    3-option floor everywhere.

    The unit's three modal verbs (must/have/should, lesson01) have
    INCOMPATIBLE complementation ("must pay" vs "have to pay" vs "should
    pay") and cannot be safely unioned into one word_order/fill_in_blank
    frame -- verified by hand and deliberately NOT forced into a false
    single-member anchor (this is exactly the trap AUTHORING_GUIDE/the
    recipe warns about). They are tested via bare-word translation instead,
    which is frame-free and therefore safe regardless of complementation.

    Structured tier: two matching_pairs (6 pairs each) -- lesson03's tag
    narrowed to noun-only gives 7 (yesterday/gym/membership/reminder/phone/
    fee/month), 6 selected; a second pairs lesson01+lesson02+lesson04 nouns
    unioned (task/rent/appointment/today/friday/week/right/dentist -- 8
    distinct, no confusable glosses) anchored to lesson04, the richest
    dialogue lesson, per the recipe's "anchor the union to the richest
    lesson" guidance. One word_order uses lesson04's two adjectives
    (last/organized) in "This was my {item} class." -- verified by hand
    that both are grammatical in that frame (not a single-member anchor,
    but a genuinely dual-safe broad pool, checked at course scope: this
    lesson tag is unique to the unit). No mis-glossed lexeme found (five
    en-nl-style mis-glosses were the trigger for the recipe's §0.1 rule;
    checked every fa-en gloss here against this unit's own teaching and
    found none). 15 templates, all 4 lessons represented in recognition and
    production.
