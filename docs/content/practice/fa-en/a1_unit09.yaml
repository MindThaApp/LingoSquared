schema_version: "1.0"
pack_key: practice.fa-en.a1.unit09
source_language: fa
target_language: en
unit_content_key: en.a1.unit09.places
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (fa-en practice pass, fresh context; 3 fixes). (1) where_is_order.001 and excuse_me_order.002: english-target -- questions lacked the final question mark; added '?'. (2) place_pair.003 feedback said 'two places' for a 5-pair exercise; fixed. place_non_hospital exclusion in next_to_order is correct. NATIVE FLAGS: none.
    Authored 2026-07-06 by the practice-pool-sync lane extending fa-en's
    Endless Practice pool from units 01-08 to also cover units 09-14 (fa-en
    previously stopped at unit08 while nl-en already had full 26-unit
    coverage). The 'place' (bank/hospital/pharmacy/park/restaurant, 5
    members) and 'place_non_hospital' (bank/pharmacy/park/restaurant, 4
    members, excludes hospital to avoid the self-reference "The hospital
    is next to the hospital" bug since hospital is the fixed anchor in
    lesson02's next_to/behind frames) tags already existed in scripts/
    _en_target_lexeme_common.py from the nl-en lane's own unit09 work --
    verified no EN_POS/agreement-tag additions were needed for any of
    units 09-14's vocabulary by diffing every introduced_token against
    EN_POS. Only Farsi glosses for the new tokens were added to scripts/
    backfill_lexemes_fa_en.py (this pair's own gloss dict). Template
    shapes mirror the already-reviewed nl-en/a1_unit09.yaml pack 1:1
    (same tags, same frames, same lesson targeting), swapping Dutch
    feedback text for Farsi and Dutch/English translation frames for
    Farsi/English ones. Verified with scripts/_practice_slot_check.py
    that every slot has >=1 real candidate lexeme and every multiple_
    choice/listen_select slot has >=3 distinct candidate values (place=5,
    place_non_hospital=4, both well above the floor). Also confirmed 0
    errors/0 warnings from compile_content.py practice-validate. Left
    unreviewed (not self-certified) per standing project policy --
    needs a separate fresh-context review pass before import, same as
    every other pack from this lane.

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened place_pair.003
    from 2 to 5 pairs (place/noun, real course-wide pool=5 -- bank/
    hospital/park/pharmacy/restaurant), no padding with untaught words.
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun, verb, particle, symbol]
  agreement_tags:
    semantic: [place, place_non_hospital]
slot_presets:
  place: &place {language_code: en, part_of_speech: noun, agreement_tags: {semantic: place}}
  place_non_hospital: &place_non_hospital {language_code: en, part_of_speech: noun, agreement_tags: {semantic: place_non_hospital}}
templates:
  - content_key: practice.fa-en.en.a1.unit09.lesson01.place_meaning.001
    lesson_content_key: en.a1.unit09.lesson01.common_places
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *place}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit09.lesson01.place_listen.002
    lesson_content_key: en.a1.unit09.lesson01.common_places
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *place}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit09.lesson01.place_pair.003
    lesson_content_key: en.a1.unit09.lesson01.common_places
    type: matching_pairs
    frame: {text: "هر مکان انگلیسی را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
    slots: {first_place: *place, second_place: *place, third_place: *place, fourth_place: *place, fifth_place: *place}
    slot_relations: [{kind: distinct, slots: [first_place, second_place, third_place, fourth_place, fifth_place]}]
    answer_derivation: {kind: matching_pairs, slots: [first_place, second_place, third_place, fourth_place, fifth_place]}
    feedback_frame: {text: "مکان‌ها را به معنی فارسی درست وصل کردید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit09.lesson01.place_translate.004
    lesson_content_key: en.a1.unit09.lesson01.common_places
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *place}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی این مکان {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit09.lesson02.next_to_order.001
    lesson_content_key: en.a1.unit09.lesson02.location_prepositions
    type: word_order
    frame: {text: "The {item} is next to the hospital", language_code: en, direction: ltr}
    slots: {item: *place_non_hospital}
    answer_derivation: {kind: render_frame, frame: {text: "The {item} is next to the hospital", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} مکانی است که کنار بیمارستان قرار دارد.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit09.lesson02.place_translate.003
    lesson_content_key: en.a1.unit09.lesson02.location_prepositions
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *place_non_hospital}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی این مکان {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit09.lesson03.where_is_order.001
    lesson_content_key: en.a1.unit09.lesson03.asking_where
    type: word_order
    frame: {text: "Where is the {item}?", language_code: en, direction: ltr}
    slots: {item: *place}
    answer_derivation: {kind: render_frame, frame: {text: "Where is the {item}?", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} مکانی است که پرسیده می‌شود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit09.lesson03.place_translate.003
    lesson_content_key: en.a1.unit09.lesson03.asking_where
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *place}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی این مکان {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit09.lesson04.place_listen.001
    lesson_content_key: en.a1.unit09.lesson04.asking_directions_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *place}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit09.lesson04.excuse_me_order.002
    lesson_content_key: en.a1.unit09.lesson04.asking_directions_dialogue
    type: word_order
    frame: {text: "Excuse me, where is the {item}?", language_code: en, direction: ltr}
    slots: {item: *place}
    answer_derivation: {kind: render_frame, frame: {text: "Excuse me, where is the {item}?", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} مکانی است که با ادب پرسیده می‌شود.", language_code: fa, direction: rtl}
