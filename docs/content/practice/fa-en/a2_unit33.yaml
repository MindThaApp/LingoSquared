schema_version: "1.0"
pack_key: practice.fa-en.a2.unit33
source_language: fa
target_language: en
unit_content_key: en.a2.unit33.weekly_schedule
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    37 lexemes across all 4 lessons (5/8/11/13). Recognition/production use
    each lesson's own tag narrowed to [noun, verb, adjective, adverb]
    (excludes untagged prepositions "after"/"before"). Two matching_pairs (6
    pairs each): lesson03's tag narrowed to noun-only gives 8 (class/mondays/
    wednesdays/classes/library/fridays/coffee/parents); lesson04's tag
    narrowed to noun-only gives 8 (mornings/tuesday/thursday/running/
    saturdays/soccer/coworkers/sundays). No confusable/duplicate glosses in
    either pool. lesson04 also carries the course-wide `weekday` tag on
    tuesday/thursday, used for a word_order template ("I play soccer on
    {item}.") -- verified grammatical for every weekday taught anywhere in
    the corpus, per the same safe pattern used in a2_unit30. No mis-glossed
    lexeme found. 14 templates, all 4 lessons represented in recognition and
    production.
