schema_version: "1.0"
pack_key: practice.fa-en.a1.unit07
source_language: fa
target_language: en
unit_content_key: en.a1.unit07.food
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (fa-en practice pass, fresh context; 5 fixes). (1) id_like_order.003, can_i_have_order.004, order_non_sandwich.005: english-target -- article 'a' produced 'a bread' (uncountable); dropped the article ('I'd like bread, please.') and narrowed 003/004 to the non-sandwich pool since sandwich needs the article. (2) Feedback 'غذا' (food) was wrong for water/tea; replaced with neutral 'چیزی'/'واژه' in 7 feedback strings. NATIVE FLAGS: none. Unfixed: unit teaches 'a water' but no tag lever exists to exclude only bread.
    Authored 2026-07-06 by a fork of the practice-pool-sync lane
    (en-fa/fa-en/en-prs gap). The food_item tag (coffee/tea/water/bread/
    soup/salad/sandwich, 7 members) already exists in scripts/
    _en_target_lexeme_common.py from the nl-en lane's own unit07 work --
    only Farsi glosses were added to scripts/backfill_lexemes_fa_en.py.
    This unit's ordering phrases/menu-reading/dialogue content is mostly
    fixed multi-word phrases and specific prices, not further
    slot-fillable vocabulary beyond food_item itself, so every lesson's
    templates reuse that one tag for bare-word recognition -- consistent
    with this lane's standing "don't force an unsafe or fake generative
    frame" discipline when the vocabulary doesn't support one. Verified
    with scripts/_practice_slot_check.py that every slot has >=1
    candidate and every multiple_choice/matching_pairs slot has >=3
    distinct candidate values.

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened food_pair.003
    from 2 to 7 pairs (food_item/noun, real course-wide pool=7 -- bread/
    coffee/salad/sandwich/soup/tea/water), no padding with untaught words.

    Depth pass, 2026-07-07 (templates-per-unit density audit: fa-en unit07
    had 7 templates, with lesson02/lesson03/lesson04 each carrying only 1
    -- mirrors the sibling prs-en unit07 pack just deepened the same
    night). Added 7 new templates, all real vocabulary. lesson02
    (ordering_phrases) gained id_like_order and can_i_have_order
    (word_order, "I'd like a {item}, please."/"Can I have a {item},
    please?" -- both real taught frames from this lesson's own content,
    hand-verified grammatical for all 7 food_item members; the frame has
    no fixed second item, so no self-reference risk). lesson03
    (reading_a_menu) gained food_listen (listen_select) and food_translate
    (translation) on food_item, reusing the same tag+type combinations
    lesson01 already established for bare-word recognition, anchored to
    this lesson's own real menu text instead. lesson04 (cafe_dialogue)
    gained food_gloss (multiple_choice) and food_listen (listen_select) on
    food_item (same reuse pattern), plus order_non_sandwich (word_order,
    "I'd like a {item} and a sandwich, please.") using the
    food_item_non_sandwich tag -- this narrower 6-member tag (excludes
    "sandwich" itself) already existed in
    scripts/_en_target_lexeme_common.py, purpose-built and documented
    there for exactly this self-reference risk (this unit's own real
    dialogue line is "Hi, I'd like a coffee and a sandwich, please.") but
    was never actually used by any template in this pack until now --
    only this pack's own tag_schema/slot_presets needed the new
    food_item_non_sandwich alias, no new classifier entries and no new
    Farsi glosses (coffee/tea/water/bread/soup/salad were already glossed
    in scripts/backfill_lexemes_fa_en.py from lesson01's original
    authoring). Verified with scripts/_practice_slot_check.py (food_item:
    7 distinct A1 candidates, food_item_non_sandwich: 6, both above the
    relevant floors) and compile_content.py practice-validate, 0 errors/0
    warnings. No fill_in_blank templates added (food_item's full 7-member
    pool is genuinely ambiguous in any bare frame without a disambiguating
    anchor, so none were attempted) -- scripts/_fill_in_blank_ambiguity_
    check.py has nothing new to flag in this pack. Review status left as
    unreviewed/not-fresh-context, matching this pack's own pre-existing
    status -- a fresh-context review of the whole pack (including these 7
    new templates) has not happened yet.
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun, verb, particle, symbol]
  agreement_tags:
    semantic: [food_item, food_item_non_sandwich]
slot_presets:
  food_item: &food_item {language_code: en, part_of_speech: noun, agreement_tags: {semantic: food_item}}
  food_item_non_sandwich: &food_item_non_sandwich {language_code: en, part_of_speech: noun, agreement_tags: {semantic: food_item_non_sandwich}}
templates:
  - content_key: practice.fa-en.en.a1.unit07.lesson01.food_gloss.001
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: multiple_choice
    frame: {text: "{food_item}", language_code: en, direction: ltr}
    slots: {food_item: *food_item}
    answer_derivation: {kind: slot_gloss, slot: food_item}
    feedback_frame: {text: "معنی فارسی {food_item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit07.lesson01.food_listen.002
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: listen_select
    frame: {text: "{food_item}", language_code: en, direction: ltr}
    slots: {food_item: *food_item}
    answer_derivation: {kind: slot_gloss, slot: food_item}
    feedback_frame: {text: "واژه‌ای که شنیدید {food_item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit07.lesson01.food_pair.003
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: matching_pairs
    frame: {text: "{food_one} — {food_two}", language_code: en, direction: ltr}
    slots: {food_one: *food_item, food_two: *food_item, food_three: *food_item, food_four: *food_item, food_five: *food_item, food_six: *food_item, food_seven: *food_item}
    slot_relations: [{kind: distinct, slots: [food_one, food_two, food_three, food_four, food_five, food_six, food_seven]}]
    answer_derivation: {kind: matching_pairs, slots: [food_one, food_two, food_three, food_four, food_five, food_six, food_seven]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit07.lesson01.food_translate.004
    lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
    type: translation
    frame: {text: "{food_item}", language_code: fa, direction: rtl, slot_rendering: {food_item: english_gloss}}
    slots: {food_item: *food_item}
    answer_derivation: {kind: slot_text, slot: food_item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژهٔ فارسی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit07.lesson02.order_listen.002
