    lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *dogpark_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a2.unit26.lesson03.match.001
    lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
    type: matching_pairs
    frame: {text: "{first} — {second} — {third} — {fourth} — {fifth} — {sixth}", language_code: en, direction: ltr}
    slots: {first: *unit26_noun, second: *unit26_noun, third: *unit26_noun, fourth: *unit26_noun, fifth: *unit26_noun, sixth: *unit26_noun}
