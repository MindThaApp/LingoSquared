schema_version: "1.0"
pack_key: practice.fa-en.a2.unit26
source_language: fa
target_language: en
unit_content_key: en.a2.unit26.opinions
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the Claude session extending fa-en's practice
    pool to units 21-26 -- this is the second and final A2 unit for this
    direction so far (giving opinions with reasons: a dog park scenario),
    completing fa-en's practice-pool coverage through unit26. Uses
    nl-en's a2_unit26.yaml as the structural reference: the shared
    4-member 'dogpark_noun' tag (dog/park/playground/space) is used ONLY
    for bare-word recognition -- most of this unit's content is
    multi-word discourse-connector phrases ("I think", "in my opinion",
    "on the other hand") that don't reduce to a safe single-token slot,
    same discipline as unit25. No new EN_POS/agreement_tags entries were
    needed; only scripts/backfill_lexemes_fa_en.py's Farsi gloss dict and
    UNIT_FILES tuple were extended.

    HOMOGRAPH LIMITATION DELIBERATELY RESPECTED, not worked around: this
    unit's lesson03 reintroduces "close" as an ADJECTIVE ("very close to
    the playground"), but scripts/_en_target_lexeme_common.py's EN_POS
    already classifies "close" as a VERB (unit05's "the store closes"
    sense) and its own inline comment explicitly instructs future
    authors not to force a second, conflicting entry onto that bare
    token. Grepped every practice pack across en-fa/en-nl/en-prs/fa-en/
    nl-en/prs-en for any existing use of "close" as a slot value before
    writing this pack's templates -- none found, so no live template
    depends on either sense being changed. No template in this pack (or
    anywhere in this batch) uses "close" as a fillable slot; the
    dogpark_noun tag itself never included it.

    Anchoring check (same discipline as every other pack in this batch):
    verified via iter_specs() that every one of this unit's four lessons
    introduces at least one new lexeme, so all four are safe
    lesson_content_key anchors.

    Every slot's real candidate count was verified with
    scripts/_practice_slot_check.py (extended to cover fa-en units
    21-26) and compile_content.py practice-validate. Needs the standard
    fresh-context review before import.

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened match.001 from
    2 to 4 pairs (dogpark_noun/noun, real course-wide pool=4 -- dog/park/
    playground/space), no padding with untaught words.

    Depth pass 2026-07-06 (practice-pool-sync, templates-per-unit audit):
    6 -> 13 templates. Same discipline as this unit's own notes above
    and unit25's own depth-pass note: the only single-token vocabulary
    safe for a shared slot is the 4-member dogpark_noun tag; the rest of
    this unit's content is discourse-connector phrases ("I think", "in
    my opinion", "on the other hand") that stay recognition-only, no
    generative frame attempted. No new EN_POS/agreement_tags entries or
    Farsi glosses were added -- every new template reuses the EXISTING
    dogpark_noun tag (multiple_choice/listen_select/translation),
    filling the remaining empty (lesson x exercise-type) cells of the
    natural 4-lesson x 3-recognition-type grid (12 slots) + the existing
    1 matching_pairs = 13, the genuine ceiling for this unit as currently
    taught. This includes lesson01 (opinion_phrases), which previously
    had ZERO dogpark_noun templates even though it's a perfectly valid
    anchor (introduces 4 new lexemes of its own -- opinion/other/hand/
    agree -- confirmed via a fresh iter_specs() dump) -- the same
    reuse-across-lessons pattern already used for lesson02/03/04 in this
    same pack (and for bureaucracy_noun across unit25's lessons) applies
    equally to lesson01. Anchoring re-verified for all four lessons
    (opinion_phrases: 4 new lexemes, giving_an_opinion_with_a_reason: 4,
    reading_a_written_opinion: 1, opinion_dialogue: 6). Re-ran
    compile_content.py practice-validate (0 errors/0 warnings across the
    whole fa-en pack) and scripts/_practice_slot_check.py (fa-en
    direction: OK, no new problems -- the 5 pre-existing problems that
    script reports are all in en-fa unit01/unit02, unrelated to this
    unit or direction).

    Cross-direction technique backport (2026-07-06): the parallel
    prs-en session working the same unit25/26 depth pass discovered a
    better technique than the bare dogpark_noun-only reuse above -- this
    unit's own real taught sentences also generalize already-classified
    COURSE-WIDE tags from earlier units, not just dogpark_noun.
    Backported prs-en's exact 7-template pattern
    (practice.prs-en.a2.unit26.yaml, reviewed as the reference for this
    pass), all anchored to real lessons, no new vocabulary or semantic
    categories invented:
    (1) lesson01 teaches "in my opinion" verbatim, and lesson03's real
    reading text opens "In my opinion, the new dog park is a good
    idea." -- the already-established 4-member 'possessive' tag (my/
    your/his/her, defined for unit06's family lessons) generalizes that
    exact real sentence with zero grammar loss ("In your/his/her
    opinion, the dog park is a good idea." all hold), giving a
    word_order + fill_in_blank pair anchored to lesson01, plus a bare
    listen_select recognition item.
    (2) lesson01's "I think" is real content for the already-
    established 'identity' tag (the token "i", defined for unit01/02)
    -- a multiple_choice + a listen_select, bare-word only.
    (3) lesson04's real dialogue line "Yes, I think that would be
    better." is real content for the already-established 'politeness'
    tag (thanks/thank/nice/welcome/yes/no, defined for unit01, via the
    token "yes") -- a multiple_choice + a listen_select, again
    bare-word only (this pack's local politeness preset broadens the
    part_of_speech list to [noun, verb, adjective, particle] instead of
    unit01's noun-only version, same as prs-en's own politeness preset,
    since politeness members actually span all four POS course-wide).
    No invented English tokens or Farsi glosses -- every gloss/POS/tag
    already existed in scripts/_en_target_lexeme_common.py and
    scripts/backfill_lexemes_fa_en.py's EN_TARGET_TO_FA_GLOSS dict
    ("my"/"your"/"his"/"her"/"i"/"yes" all already present) before this
    pass, so neither shared file needed a change (both out of scope for
    this pass anyway). 13 -> 20 templates. Re-verified with
    scripts/_practice_slot_check.py (possessive has 4 distinct
    course-wide candidates, identity and politeness both well above the
    >=3 multiple_choice/listen_select floor) and compile_content.py
    practice-validate, 0 errors/0 warnings. Still needs the standard
    fresh-context review before import.

    A2-scoping correctness fix (2026-07-07): scripts/_practice_slot_check.py
    pools ALL specs from iter_specs() (both A1 and A2) together when
    counting a tag's real distinct-candidate count, but
    backend/app/practice/service.py's _material() actually scopes both
    PracticeTemplate and Lexeme queries by course_id, and 'A1'/'A2' are
    separate Course rows -- a real A2 enrollee only ever sees A2-scoped
    lexemes. A standalone A2-only-scoped check (filtering iter_specs() to
    level=='a2') found two real violations in this file, invalidating the
    pooled-with-A1 "possessive has 4 distinct... politeness well above
    the floor" note above: (1) lesson01.possessive_listen.006 -- the
    'possessive' tag (my/your/his/her, 4 members pooled with A1) has only
    2 REAL A2-scoped candidates (my/your -- his/her are never
    reintroduced in any A2 unit 25-28). Fixed by converting to type:
    translation (bare single-word production, slot_text derivation
    instead of slot_gloss -- no minimum-candidate floor), renamed
    possessive_translate_bare.006 -- a genuinely new exercise, not a
    duplicate of the existing possessive_order.004 (full-sentence
    word_order). (2) lesson04.politeness_choose.004 AND
    lesson04.politeness_listen.005 -- the 'politeness' tag
    (thanks/thank/nice/welcome/yes/no, 6 members pooled with A1) has only
    2 REAL A2-scoped candidates (yes from this unit, no from unit27's
    real banking dialogue -- both still within the same A2 course). BOTH
    templates were broken (multiple_choice and listen_select each need
    >=3), and converting both to translation would have produced two
    duplicate bare-word production templates against the identical
    2-candidate pool -- no honest additional candidate exists, so
    politeness_choose.004 was converted to type: translation (renamed
    politeness_translate_bare.004) and politeness_listen.005 was removed
    outright rather than kept as dead duplicate content. No candidates
    invented, no A1 vocabulary pooled in as if A2-scoped.


    Unit-scope reauth (2026-07-24, PACK-ONLY, per docs/content/PRACTICE_PACK_RECIPE.md): scripts/_practice_unit_scope_check.py
    found the A2-scoping fix above still left 5 DEAD templates + 1 below-floor matching_pairs, because "REAL A2-scoped"
    in the note above still meant "reused across A2 units", which is COURSE scope (Endless Practice), not the stricter
    UNIT scope generate_checkpoint() actually uses (recipe SS1.1 -- this pack's own prior fixes hadn't drawn that
    distinction yet). Re-checked every tag against `.a2.unit26.` specifically via iter_specs(): `possessive` (my/your/
    his/her) has zero a2.unit26-introduced members (all its A2 members belong to unit25 alone); `identity` likewise has
    zero a2.unit26 members; `politeness` likewise zero (the prior note's "yes from this unit" was itself wrong -- "yes"
    is an a2.unit25 introduction, never reintroduced in unit26). So lesson01.possessive_order.004,
    lesson01.possessive_translate_bare.006, lesson01.identity_choose.007, lesson01.identity_listen.008, and
    lesson04.politeness_translate_bare.004 were DEAD at checkpoint scope from the day this pack was written. None of
    the three tags has any unit-native alternative token that fits their frames (the "In {item} opinion" /
    possessive-pronoun shape has no substitute in this unit's own vocabulary), so per the recipe's fix ranking these
    were DROPPED rather than re-anchored -- but dropping alone would have taken the structured tier from 1 (matching_pairs
    only) to 0, well under the recipe's >=3-templates-per-tier bar, so two REPLACEMENT structured templates were
    added, both anchored to lessons with genuine native vocabulary and both verified grammatical for their FULL
    A2-course-wide pool (not just unit26's own), per SS1.1/SS6.4: (1) lesson02.dogpark_order.004 (word_order,
    "I really like the {item}") over `dogpark_noun` -- unit26 IS the only A2 unit using this tag, so unit-scope and
    A2-course-scope are identical here (dog/park/playground/space, 4 members); "I really like the dog/park/playground/
    space" all hold. (2) lesson04.condition_order.004 (word_order, "I think that's a {item} idea") over
    `condition_adjective` -- native member is only "better" at unit26, but the A2-course-wide pool also includes
    "worse" (a2.unit28) since Endless Practice draws course-wide; "I think that's a better/worse idea" both hold, so
    the frame is safe at both scopes. `condition_adjective` was added to this pack's own tag_schema (it already existed
    in the shared backfill; only referencing it here is new). Also fixed the pre-existing FLOOR issue
    (lesson03.match.001 had only 4 dogpark_noun pairs, under the 6-pair floor): re-anchored from the `dogpark_noun` tag
    to a bare `part_of_speech: noun` slot (no semantic constraint, recipe SS3.1(c)) -- unit26's own lessons introduce 9
    distinct untagged/tagged nouns total (opinion, hand, dog, park, idea, dogs, space, playground, point), comfortably
    clearing 6; safe because matching_pairs' frame (`{first} -- {second} -- ...`) has no literal text, so the
    course-scope-grammaticality risk that bare POS slots carry for sentence frames (SS3.1(c)) does not apply here --
    the only residual risk is confusable-gloss collisions, checked by hand for these 9 and none found. Net effect:
    18 -> 15 templates (5 dropped, 2 added), recognition 8 / structured 3 (matching_pairs widened to 6 pairs +
    2 new word_order) / production 4 -- all three tiers clear the recipe's >=3-template bar. Before:
    5 DEAD + 1 FLOOR. After: scripts/_practice_unit_scope_check.py reports 0 DEAD, 0 FLOOR. Re-validated with
    compile_content.py practice-validate (0 errors). review.status left as unreviewed pending a fresh-context pass over
    this reauth.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [dogpark_noun, condition_adjective]
slot_presets:
  dogpark_noun: &dogpark_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: dogpark_noun}}
  unit26_noun: &unit26_noun {language_code: en, part_of_speech: noun}
  condition_adjective: &condition_adjective {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: condition_adjective}}
templates:
  - content_key: practice.fa-en.en.a2.unit26.lesson01.choose.001
    lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *dogpark_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a2.unit26.lesson01.listen.002
    lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *dogpark_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a2.unit26.lesson01.translate.003
    lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *dogpark_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a2.unit26.lesson02.choose.001
