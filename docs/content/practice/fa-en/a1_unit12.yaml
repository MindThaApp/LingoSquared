schema_version: "1.0"
pack_key: practice.fa-en.a1.unit12
source_language: fa
target_language: en
unit_content_key: en.a1.unit12.clothing
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the practice-pool-sync lane extending fa-en's
    Endless Practice pool from units 01-08 to also cover units 09-14. A
    number-agreement trap avoided (same bug class as unit09's hospital
    self-reference): the obvious 5-member 'clothing_item' tag includes
    'pants'/'shoes' (always plural in English), which would make 'Do you
    have this {item} in a medium?' ungrammatical ('this pants'/'this
    shoes'). A narrower 'clothing_singular' tag (shirt/jacket/dress only,
    3 members) is used for that specific frame instead; 'clothing_item'
    stays safe everywhere else (bare-word recognition). All four tags
    (clothing_item, clothing_singular, clothing_size, clothing_color)
    already existed in scripts/_en_target_lexeme_common.py from the
    nl-en lane's own unit12 work; no EN_POS/agreement-tag additions were
    needed (verified by diffing every introduced_token against EN_POS).
    Only Farsi glosses for the new tokens were added to scripts/
    backfill_lexemes_fa_en.py. NOTE: the underlying en realization
    unit12 itself is UNREVIEWED (same as unit11, Codex was
    usage-limited at authoring time). Verified with scripts/
    _practice_slot_check.py that every slot has >=1 real candidate
    lexeme and every multiple_choice/listen_select slot has >=3 distinct
    candidate values (clothing_item=5, clothing_singular=3,
    clothing_size=3, clothing_color=2 -- clothing_color is only used in
    fill_in_blank/translation, never multiple_choice/listen_select, so
    its 2-member count is fine). Confirmed 0 errors/0 warnings from
    compile_content.py practice-validate. Left unreviewed pending a
    separate fresh-context review pass, per standing project policy.
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun, verb, particle, symbol]
  agreement_tags:
    semantic: [clothing_item, clothing_singular, clothing_size, clothing_color]
slot_presets:
  clothing_item: &clothing_item {language_code: en, part_of_speech: noun, agreement_tags: {semantic: clothing_item}}
  clothing_singular: &clothing_singular {language_code: en, part_of_speech: noun, agreement_tags: {semantic: clothing_singular}}
  clothing_size: &clothing_size {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: clothing_size}}
  clothing_color: &clothing_color {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: clothing_color}}
templates:
  - content_key: practice.fa-en.en.a1.unit12.lesson01.clothing_meaning.001
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *clothing_item}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson01.clothing_listen.002
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *clothing_item}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson01.clothing_pair.003
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: matching_pairs
    frame: {text: "هر واژهٔ لباس را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
    slots: {first_item: *clothing_item, second_item: *clothing_item}
    slot_relations: [{kind: distinct, slots: [first_item, second_item]}]
    answer_derivation: {kind: matching_pairs, slots: [first_item, second_item]}
    feedback_frame: {text: "دو واژهٔ لباس را به معنی فارسی درست وصل کردید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson01.clothing_translate.004
    lesson_content_key: en.a1.unit12.lesson01.clothing_items
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *clothing_item}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی این لباس {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson02.size_order.001
    lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
    type: word_order
    frame: {text: "Do you have this in a {item}", language_code: en, direction: ltr}
    slots: {item: *clothing_size}
    answer_derivation: {kind: render_frame, frame: {text: "Do you have this in a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} سایزی است که پرسیده می‌شود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson02.color_fill.002
    lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
    type: fill_in_blank
    frame: {text: "Do you have it in {item}?", language_code: en, direction: ltr}
    slots: {item: *clothing_color}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} رنگی است که پرسیده می‌شود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson02.size_translate.003
    lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *clothing_size}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی این سایز {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson02.clothing_listen.004
    lesson_content_key: en.a1.unit12.lesson02.sizes_and_colors
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *clothing_item}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژهٔ لباسی که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson03.label_size_order.001
    lesson_content_key: en.a1.unit12.lesson03.reading_a_label
    type: word_order
    frame: {text: "The shirt is a {item}", language_code: en, direction: ltr}
    slots: {item: *clothing_size}
    answer_derivation: {kind: render_frame, frame: {text: "The shirt is a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} سایز روی این برچسب است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson03.label_color_fill.002
    lesson_content_key: en.a1.unit12.lesson03.reading_a_label
    type: fill_in_blank
    frame: {text: "It's {item}.", language_code: en, direction: ltr}
    slots: {item: *clothing_color}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} رنگ روی این برچسب است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson03.color_translate.003
    lesson_content_key: en.a1.unit12.lesson03.reading_a_label
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *clothing_color}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی این رنگ {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson03.clothing_meaning.004
    lesson_content_key: en.a1.unit12.lesson03.reading_a_label
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *clothing_item}
