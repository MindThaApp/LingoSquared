    feedback_frame: {text: "{item} لباسی است که روی این برچسب است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson04.clothing_listen.001
    lesson_content_key: en.a1.unit12.lesson04.clothing_store_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *clothing_item}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژهٔ لباسی که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit12.lesson04.item_size_order.002
