- content_key: practice.fa-en.en.a1.unit46.lesson01.choose.001
  lesson_content_key: en.a1.unit46.lesson01.lost_items_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic: fa_en_a1_unit46_words
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: معنی {item} را انتخاب کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit46.lesson01.match.002
