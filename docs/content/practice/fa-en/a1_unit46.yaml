schema_version: '1.0'
pack_key: practice.fa-en.a1.unit46
source_language: fa
target_language: en
unit_content_key: en.a1.unit46.lost_items
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (fa-en practice pass, rest; 3 fixes). (1) choose.001/translate.003/volume_listen.003/volume_translate.003: untaught-distractor -- all-ten-POS slot over the unit tag reached pronouns/prepositions (you're=تو/شما هستی with informal تو, where's, anyone, its, inside); narrowed to noun/verb/adjective/adverb. (2) three English-only matching feedbacks ('Match each word with its meaning.') and the volume_match.003 English text_block -> Persian. (3) volume_listen.003 feedback was the bare Persian gloss -> 'واژه‌ای که شنیدید {item} بود.'. NATIVE FLAGS: gate=دروازه (airport/venue gate; گیت/ورودی?), back=برگشتن (adverb glossed as an infinitive), called=زنگ زد؛ صدا کرد and track=رد؛ پیگیری (two-sense glosses), desk=میز پذیرش. BACKFILL GLOSS FLAGS: you're has informal تو and is now unreachable from this pack.

    Authored 2026-07-12 as an additive Endless Practice coverage backfill for fa-en A1 unit 46. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.
    Polish wave-2 (2026-07-25) — all three tiers had only 2 live templates; added one per tier (multiple_choice, 6-slot
    matching_pairs, bare-word translation) anchored to previously template-less lessons, pooled over unit-native
    [noun, verb, adjective, adverb] content words. This unit's lexemes carry no semantic tags, so matching_pairs slots
    stay POS-only per the recipe §6.3 honest exception — no semantic union can reach 6 unit tokens.
    Polish wave-3 (2026-07-26) — commit 05af7ace generated fa_en_a1_unit46_* tags; the wave-2 honest-leave is resolved.
    Re-anchored lesson01.match.002 and its volume_match.003 sibling to the unit-wide generated tag (26 tokens;
    lesson01's own tag has only 4, below the floor) and raised both from 4 to 6 slots. Re-anchored lesson04.match.001
    to the lesson04 generated tag (16 tokens, clears the floor alone).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - fa_en_a1_unit46_words
    - fa_en_a1_unit46_lesson04_words
slot_presets:
  unit_word:
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
