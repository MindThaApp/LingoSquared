      part_of_speech:
      - adjective
      - adverb
      - noun
      - phrase
      - verb
      agreement_tags:
        semantic: fa_en_b1_unit05_lesson01_words
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: 'معنی فارسی {item} را انتخاب کنید.'
