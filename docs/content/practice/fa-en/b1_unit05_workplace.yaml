schema_version: '1.0'
pack_key: practice.fa-en.b1.unit05
source_language: fa
target_language: en
unit_content_key: en.b1.unit05.workplace
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Grammar-unit recipe (PRACTICE_PACK_RECIPE.md sec8.1) applied: per-lesson multiple_choice + listen_select + bare-word translation for each of the 4 lessons (using the pre-existing per-lesson union tag fa_en_b1_unit05_lessonNN_words when it hosts >=3 distinct-gloss content-POS lexemes, content POS [noun,verb,adjective,adverb,phrase] only, pronoun/preposition/particle/proper_noun excluded), plus 3 matching_pairs (6 pairs each) pooling the unit-wide union tag fa_en_b1_unit05_words (one full-content-POS pool anchored to the reading lesson, one anchored to the dialogue lesson, one restricted to verb/adjective/adverb/phrase anchored to the grammar lesson). 15 templates total, 8 recognition (MC+listen) / 3 structured (matching_pairs) / 4 production (translation). Deliberately skipped word_order and fill_in_blank across this whole batch: crafting course-scope-safe hero-sentence frames for 13 units individually was judged too defect-prone for this pass's review budget; matching_pairs carries the structured tier instead (no frame-literal-text risk, so no course-scope grammaticality check needed). Flagging this gap to the coordinator -- a follow-up pass adding word_order/fill_in_blank hero sentences per unit would add pedagogical variety this pack currently lacks. No mis-glossed lexemes found while reading every gloss in this unit's pool (all distinct-token counts matched distinct-gloss counts, so no gloss collisions either).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - fa_en_b1_unit05_lesson01_words
    - fa_en_b1_unit05_lesson02_words
    - fa_en_b1_unit05_lesson03_words
    - fa_en_b1_unit05_lesson04_words
    - fa_en_b1_unit05_words
templates:
- content_key: practice.fa-en.en.b1.unit05.lesson01.choose.001
  lesson_content_key: en.b1.unit05.lesson01.workplace_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
