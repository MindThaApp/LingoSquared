review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-19 (fa-en practice pass, fresh context; 11 fixes, all via UNIT_SENSE_OVERRIDES in backfill_lexemes_fa_en.py, no template edits needed): 11 gloss overrides (Latin leaks had/moved/went/setting; checking banking sense; tell/working collisions; walk through; got there; back; guests spelling). Templates are uniform lexeme-gloss drills, no literal Persian or English frames beyond the fill prompt. NATIVE FLAGS: gloss register of colloquial vs written verbs; near-synonym option sets (may/might/possible, seems/sounds/sound). Prior note: Authored via scripted generation against PRACTICE_PACK_RECIPE.md. Recognition (multiple_choice/listen_select)
    and production (translation) templates use each lessons own fa_en_b2_unit04_lessonNN_words tag, restricted
    to content POS (noun/verb/adjective/adverb) and deduped by gloss; widened to the unit-wide fa_en_b2_unit04_words
    tag only for lessons whose own tag pool was <3 distinct glosses. fill_in_blank anchors use a lesson-tag
    + single-POS narrowing that yields exactly one course-wide candidate (the tag itself is unique to
    this lesson, so unit-scope pool == course-scope pool). matching_pairs pools the unit-wide tag, anchored
    to the richest lesson. Capacity/coverage/course-scope numbers reported separately by the authoring
    agent.'
