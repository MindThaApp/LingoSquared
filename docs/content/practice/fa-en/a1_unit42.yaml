review:
  status: reviewed
  fresh_context: true
  notes: 'Authored 2026-07-11, fa-en depth-audit lane (unit 13, final unit of the 30-42 batch, see unit30''s pack notes for
    the full batch rationale).

    One semantic tag: ''personality_adjective'' (friendly/funny/ hardworking/shy/calm/talkative from lesson01, six genuine
    personality adjectives, all gradable with "very" and all safe in "My neighbor is very {item}.").

    Anchoring check: lesson01 introduces all six personality adjectives as real new lexemes, verified via iter_specs(). Slot
    candidate count verified with scripts/_practice_slot_check.py and compile_content.py practice-validate. Needs the standard
    fresh-context review before import.

    This closes out the 13-unit fa-en depth-audit batch (units 30-42) -- scripts/practice_manifest.txt''s fa-en line extended
    with all 13 new pack paths, and only that line.

    Fresh-context review 2026-07-11 (zero access to authoring reasoning): found and fixed an inaccurate Farsi gloss in the
    shared backfill (scripts/backfill_lexemes_fa_en.py) -- ''friendly'' was glossed "دوست‌داشتنی (حیوان اهلی)" ("lovable (pet
    animal)"), the wrong sense with an irrelevant pet parenthetical that leaked into this unit''s personality_adjective exercises;
    corrected to "مهربان". All slot members taught, the generative "My neighbor is very {item}" frame grammatical for all
    six adjectives, answer shapes and feedback sound. compile_content.py practice-validate, scripts/_practice_slot_check.py,
    and backfill_lexemes_fa_en.py --dry-run all clean. Upgraded to reviewed.'
