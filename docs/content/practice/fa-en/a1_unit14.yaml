schema_version: "1.0"
pack_key: practice.fa-en.a1.unit14
source_language: fa
target_language: en
unit_content_key: en.a1.unit14.communication
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the practice-pool-sync lane extending fa-en's
    Endless Practice pool from units 01-08 to also cover units 09-14.
    Deliberate scope decision, same as the reference nl-en/a1_unit14.yaml
    pack: lesson02 (asking someone to repeat/speak slowly) gets ZERO
    generated templates. Its vocabulary (sorry/repeat/speak/slowly/hear/
    well) has no multi-member synonym group at all -- every word is a
    single, non-interchangeable concept, so any "slot" would necessarily
    have exactly one candidate, meaning the "generated" exercise would be
    byte-identical every time and add no practice value beyond the
    lesson's own hand-authored exercises. The other three lessons DO have
    genuine swappable content: lesson01 reuses the 2-member 'person_name'
    tag (Daniel/Leila, already established since unit01/02) for 'Hello,
    this is {item}.'/'Hi, it's {item}.'; lessons 03 and 04 reuse the
    already-verified 5-member 'place' tag (unit09) for 'Let's meet at the
    {item}.'/'How about 6pm at the {item}?' -- both grammatical with any
    of the 5 places. Both tags already existed in scripts/
    _en_target_lexeme_common.py; no EN_POS/agreement-tag additions were
    needed (verified by diffing every introduced_token against EN_POS).
    Only Farsi glosses for the new tokens were added to scripts/
    backfill_lexemes_fa_en.py. Verified with scripts/_practice_slot_check.py
    that every slot has >=1 real candidate lexeme and every multiple_
    choice/listen_select slot has >=3 distinct candidate values
    (person_name=2 -- used only in word_order/fill_in_blank/translation,
    never multiple_choice/listen_select, so its 2-member count is fine;
    place=5). Confirmed 0 errors/0 warnings from compile_content.py
    practice-validate. Left unreviewed pending a separate fresh-context
    review pass, per standing project policy.

    Deepened 2026-07-07 (templates-per-unit audit found this unit the
    shallowest in fa-en at 7, alongside sibling prs-en's identical
    unit14 tied at the same count and deepened the same night --
    mirrored its additions here with fresh Farsi, not copied Dari).
    person_name stays at its original 2 templates -- only 2 real
    members, already its honest ceiling per this file's own original
    reasoning. Added 3 new templates, all reusing the already-verified
    5-member 'place' tag with exercise TYPES this unit hadn't used yet
    (word_order/translation/listen_select already existed;
    multiple_choice/matching_pairs did not): a lesson03 listen_select
    (parity with lesson04's), a lesson04 multiple_choice (bare-word
    Farsi-gloss recognition), and a lesson04 matching_pairs using all
    5 place members (AUTHORING_GUIDE.md #16 -- 5 is the unit's honest
    ceiling, not padded). No new EN_POS/semantic-tag or Farsi-gloss
    additions needed -- 'place' was already fully classified/glossed
    since unit09/this unit's original pass (confirmed by re-reading
    scripts/_en_target_lexeme_common.py and scripts/
    backfill_lexemes_fa_en.py fresh before this edit). Considered a
    fill_in_blank for 'place' (e.g. blanking "Let's meet at the
    {item}") but rejected it: all 5 place members are genuinely
    grammatical in that exact frame with nothing else to disambiguate
    -- scripts/_fill_in_blank_ambiguity_check.py (and
    compile_content.py's hard-fail per AUTHORING_GUIDE.md #17) would
    correctly flag it, so zero new fill_in_blank templates, matching
    this direction's own established "zero is fine when real
    vocabulary can't safely support one" precedent. Re-verified
    scripts/_practice_slot_check.py (place still safely >=3 for the
    new multiple_choice, >=2 for matching_pairs) and
    scripts/_fill_in_blank_ambiguity_check.py (zero new AMBIGUOUS
    flags) before import. New count: 10 templates (7 -> 10).

    Re-authored 2026-07-24 (unit-scope DEAD-template pass, docs/content/
    PRACTICE_PACK_RECIPE.md): scripts/_practice_unit_scope_check.py found
    ALL 10 templates above DEAD at checkpoint scope. Both 'person_name'
    (established unit01/02) and 'place' (established unit09) are
    EARLIER-unit tags with ZERO unit14-scoped candidates -- recipe
    DO-NOT #2; generate_checkpoint() only loads THIS unit's own lexemes,
    so a slot anchored to an earlier unit's tag can never fill even
    though it looked fine at course scope in Endless Practice. Checked
    unit14's own 16 lexemes via the iter_specs filter
    (docs/content/PRACTICE_PACK_RECIPE.md section 0): every one of them
    -- free/tonight (lesson01), sorry/repeat/that/speak/more/slowly/hear/
    well (lesson02), 6pm/message/suggest/meeting/place (lesson03), about
    (lesson04) -- carries agreement_tags == {}. unit14 has NO native
    semantic tag at all, and fa-en's a1_unit14 is not in
    backfill_lexemes_fa_en.py's AUTO_TAG_UNIT_STEMS, so no per-lesson
    auto-tag exists either (PACK-ONLY: cannot add one). Re-anchoring to a
    native tag (recipe fix option 1a) is therefore unavailable; applied
    recipe SS3.1(c) instead -- dropped the semantic tag on every slot and
    constrained by part_of_speech only: [noun, verb, adjective, adverb]
    unioned across the WHOLE unit (unit-scoped, not per-lesson) yields 14
    distinct tokens with 14 distinct glosses (tonight/6pm/message/
    meeting/place/free/sorry/repeat/speak/hear/suggest/more/slowly/well)
    -- comfortably clears the multiple_choice/listen_select 3-option
    floor and the matching_pairs 6-pair floor from every lesson anchor.
    The 3 original word_order templates (hello_order, lets_meet_order,
    how_about_order) are DROPPED, not re-anchored, rather than kept at
    the same type: an untagged POS-only pool is course-scope-safe only
    for literal-text-free frame shapes (bare '{item}' multiple_choice/
    listen_select/translation, or matching_pairs) per recipe SS3.1(c)/
    SS1.1 -- at COURSE scope (the whole en a1 direction) this pool would
    match every noun/verb/adjective/adverb the course has taught so far,
    and none of the three original literal-text sentence frames ("Hello,
    this is {item}", "Let's meet at the {item}", "How about 6pm at the
    {item}") is grammatical for that whole pool (e.g. "repeat"/"slowly"/
    "free" plainly do not fit "Let's meet at the {item}"). Unlike
    unit19's preference_verb_full (a native, narrow, already-vetted tag
    genuinely safe in "I {item} tea"), unit14 has no native tag to make a
    literal-text frame safe, so word_order is left out entirely rather
    than risk a course-scope-ungrammatical sentence. Replaced with 12 new
    templates spread across all 4 lessons so every lesson keeps a
    checkpoint anchor: 5 recognition (3 multiple_choice + 2
    listen_select), 3 structured (3 matching_pairs, each declaring 6 of
    the pool's 14 distinct tokens), 4 production (4 bare-word
    translations) -- all four safe, literal-text-free shapes. Read every
    gloss above against the realization's own teaching (recipe SS0.1) --
    no mis-glosses found. Net: 10 templates (all DEAD, 0 working) -> 12
    templates (all live). Verified with
    scripts/_practice_unit_scope_check.py: 0 DEAD, 0 below-floor for this
    file.

    POS-only-matching audit (2026-07-25, wave-2 PACK-ONLY lane):
    phone_match.001/.003/.004 were dispatched for semantic-union
    conversion (POS-only matching_pairs pull the whole level's vocab at
    Endless-Practice course scope). DELIBERATELY LEFT POS-only:
    re-measured via iter_specs() -- every one of unit14's own 16
    lexemes carries agreement_tags == {} (zero semantic tags in the
    whole unit, as the 2026-07-24 re-authoring above already
    established), so NO semantic union of unit-native tags exists at
    all, let alone one covering >= 6 distinct tokens. Adding tags is a
    backfill change, out of PACK-ONLY scope. The off-theme-pairs
    exposure at course scope stands until unit14's backfill gains
    native tags. [RESOLVED 2026-07-26 -- see wave-3 note below.]

    WAVE-3 RE-ANCHOR 2026-07-26: commit 05af7ace generated unit-scoped
    semantic tags (fa_en_a1_unit14_words + per-lesson variants) for
    every unit's own content lexemes, resolving the wave-2 blocker
    above. Re-anchored all three dispatched POS-only matchers:
    phone_match.001 (lesson02) to fa_en_a1_unit14_lesson02_words --
    the template is lesson-anchored and that lesson tag alone clears
    the floor (sorry/repeat/speak/more/slowly/hear/well = 7 distinct
    tokens/glosses); phone_match.003 (lesson03) and phone_match.004
    (lesson04) to the unit-wide fa_en_a1_unit14_words (13 distinct
    tokens/glosses -- their own lesson tags cover only 4 and 0 members
    respectively, below the 6-pair floor, so unit-wide per rubric).
    All pools identical at unit and course scope by construction, so
    the Endless-Practice off-theme pull is gone; eyeballed all 13
    glosses -- no confusable or duplicate-gloss members. Bare-word
    MC/listen/translation templates keep their untagged preset per
    dispatch scope. Verified via pool_check.py (7/13/13 unit tokens, 0
    course extras), practice-validate 0 errors, unit-scope check 0
    DEAD/0 FLOOR.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [fa_en_a1_unit14_words, fa_en_a1_unit14_lesson02_words]
slot_presets:
  content_word: &content_word {language_code: en, part_of_speech: [noun, verb, adjective, adverb]}
  # wave 3: generated unit/lesson-scoped tags (commit 05af7ace) -- course pool
  # == unit pool by construction, so the matchers below no longer pull the
  # whole level's vocab at Endless-Practice course scope.
  unit_words: &unit_words {language_code: en, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: fa_en_a1_unit14_words}}
  lesson02_words: &lesson02_words {language_code: en, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: fa_en_a1_unit14_lesson02_words}}
templates:
  - content_key: practice.fa-en.en.a1.unit14.lesson01.phone_choose.001
    lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit14.lesson01.phone_translate.002
    lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit14.lesson02.phone_match.001
    lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
    type: matching_pairs
    frame: {text: "{first} — {second} — {third} — {fourth} — {fifth} — {sixth}", language_code: en, direction: ltr}
    slots: {first: *lesson02_words, second: *lesson02_words, third: *lesson02_words, fourth: *lesson02_words, fifth: *lesson02_words, sixth: *lesson02_words}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit14.lesson02.phone_listen.002
    lesson_content_key: en.a1.unit14.lesson02.asking_to_repeat
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
