schema_version: "1.0"
pack_key: practice.fa-en.a1.unit38
source_language: fa
target_language: en
unit_content_key: en.a1.unit38.household
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-11, fa-en depth-audit lane (unit 9 of the 30-42
    batch, see unit30's pack notes for the full batch rationale).

    One semantic tag: 'chore_noun' (dishes/laundry/trash from lesson01).
    Deliberately NOT used in any shared generative frame -- each pairs
    with its own fixed verb in the real content ("do the dishes"/"do the
    laundry"/"take out the trash"), so kept recognition-only. Only 3
    members (the unit's entire single-token chore vocabulary --
    "chore"/"clean"/"vacuum" are excluded: "chore" is the category word
    itself, not a chore, and "clean"/"vacuum" are verbs, a different POS
    from this noun tag).

    Anchoring check: lesson01 introduces dishes/laundry/trash as real
    new lexemes, verified via iter_specs(). Slot candidate count
    verified with scripts/_practice_slot_check.py and compile_content.py
    practice-validate. Needs the standard fresh-context review before
    import.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [chore_noun]
slot_presets:
  chore_noun: &chore_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: chore_noun}}
templates:
  - content_key: practice.fa-en.en.a1.unit38.lesson01.choose.001
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *chore_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit38.lesson01.listen.002
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *chore_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit38.lesson01.match.003
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *chore_noun, second: *chore_noun, third: *chore_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit38.lesson01.translate.004
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *chore_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
