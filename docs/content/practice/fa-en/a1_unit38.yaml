schema_version: "1.0"
pack_key: practice.fa-en.a1.unit38
source_language: fa
target_language: en
unit_content_key: en.a1.unit38.household
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (fa-en practice pass, rest; 2 fixes). (1) lesson03.choose.001 and
    lesson04.translate.001: unit38_noun was a bare part_of_speech:noun slot with no tag (841 course
    nouns) -> unit tag fa_en_a1_unit38_words (9 nouns, 9 distinct glosses). (2) lesson01.fill.005:
    Please take out the ___ had no cue (trash/garbage/laundry all fit) -> Persian cue sentence.
    Checked: He takes out the trash every day and I take out the trash are grammatical; chore_noun
    pool equal at unit and course scope. Not fixable: lesson02.translate.002 (من زباله را بیرون
    می‌برم) could also be I-m taking out the trash / I take the trash out; the prompt cannot pin the
    form. NATIVE FLAGS: fur=پشم (حیوان) is closer to wool (کرک / موی حیوان?); guests=میهمان‌ها
    (مهمان‌ها is the usual spelling); chore=کار خانه (کار خانگی?); laundry=لباسشویی
    (رختشویی/لباس‌ها?); sundays=یکشنبه‌ها lowercase token. BACKFILL GLOSS FLAGS: fur, guests, chore,
    laundry.

    Authored 2026-07-11, fa-en depth-audit lane (unit 9 of the 30-42
    batch, see unit30's pack notes for the full batch rationale).

    One semantic tag: 'chore_noun' (dishes/laundry/trash from lesson01).
    Deliberately NOT used in any shared generative frame -- each pairs
    with its own fixed verb in the real content ("do the dishes"/"do the
    laundry"/"take out the trash"), so kept recognition-only. Only 3
    members (the unit's entire single-token chore vocabulary --
    "chore"/"clean"/"vacuum" are excluded: "chore" is the category word
    itself, not a chore, and "clean"/"vacuum" are verbs, a different POS
    from this noun tag).

    Anchoring check: lesson01 introduces dishes/laundry/trash as real
    new lexemes, verified via iter_specs(). Slot candidate count
    verified with scripts/_practice_slot_check.py and compile_content.py
    practice-validate. Needs the standard fresh-context review before
    import.

    Fresh-context review 2026-07-11 (zero access to authoring reasoning): verified every slot member is taught in this unit's realization, every generative frame is grammatical for all fillings, Farsi feedback/instruction text reads as natural Iranian Farsi with correct RTL/ZWNJ, answer shapes (word_order list-shaped, matching_pairs covers every pair) are sound, listen_select distractors are distinct single vocabulary words, and no bare YAML booleans or snake_case jargon leak. compile_content.py practice-validate, scripts/_practice_slot_check.py, and backfill_lexemes_fa_en.py --dry-run all clean. No defects found; upgraded to reviewed.

    Polish wave 2 (2026-07-25, tier-thinness, PRACTICE_PACK_RECIPE.md §8): added lesson03.choose.001
    (3rd recognition, bare-POS noun pool per §3.1(c), 9 unit nouns / 9 distinct clean Farsi glosses),
    lesson01.fill.005 + lesson02.order.001 (2nd/3rd structured, both on the course-singleton
    trash_word tag, deterministic frames echoing the taught "take out the trash" collocation),
    lesson04.translate.001 (bare-noun production over the same §3.1(c) pool) and
    lesson02.translate.002 (fixed-sentence production on trash_word, single-member per §6.6(b)).
    chore_noun deliberately kept out of sentence frames: its members pair with different verbs
    ("do the dishes/laundry" vs "take out the trash"), so no shared frame is grammatical for the
    whole pool. match.003 stays at 3 pairs — the unit's only semantically-tagged noun pool has 4
    unit-scoped members, below the 6-slot standard, and the untagged remainder would need a
    bare-POS matching constraint (the exact off-theme course-scope defect this wave removes
    elsewhere), so left as-is.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [chore_noun, trash_word, fa_en_a1_unit38_words]
slot_presets:
  chore_noun: &chore_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: chore_noun}}
  trash_single: &trash_single {language_code: en, part_of_speech: noun, agreement_tags: {semantic: trash_word}}
  unit38_noun: &unit38_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: fa_en_a1_unit38_words}}
templates:
  - content_key: practice.fa-en.en.a1.unit38.lesson01.choose.001
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *chore_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit38.lesson01.listen.002
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *chore_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "واژه‌ای که شنیدید {item} بود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit38.lesson01.match.003
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *chore_noun, second: *chore_noun, third: *chore_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit38.lesson01.translate.004
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *chore_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit38.lesson01.fill.005
    lesson_content_key: en.a1.unit38.lesson01.household_vocabulary
    type: fill_in_blank
    frame:
      text: "Please take out the {item}"
      language_code: en
      direction: ltr
      text_blocks:
        - {text: "جملهٔ انگلیسی را کامل کنید: «لطفاً زباله را بیرون ببر».", language_code: fa, direction: rtl}
    slots: {item: *trash_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} یعنی زباله.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit38.lesson02.order.001
    lesson_content_key: en.a1.unit38.lesson02.doing_chores
    type: word_order
    frame: {text: "He takes out the {item} every day", language_code: en, direction: ltr}
    slots: {item: *trash_single}
    answer_derivation:
      kind: render_frame
      frame: {text: "He takes out the {item} every day", language_code: en, direction: ltr}
    feedback_frame: {text: "کلمهٔ {item} یعنی زباله.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit38.lesson02.translate.002
    lesson_content_key: en.a1.unit38.lesson02.doing_chores
    type: translation
    frame: {text: "من زباله را بیرون می‌برم.", language_code: fa, direction: rtl}
    slots: {item: *trash_single}
    answer_derivation:
      kind: render_frame
      frame: {text: "I take out the {item}", language_code: en, direction: ltr}
    feedback_frame: {text: "I take out the {item} یعنی من زباله را بیرون می‌برم.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit38.lesson03.choose.001
    lesson_content_key: en.a1.unit38.lesson03.dialogue_cleaning_help
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit38_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit38.lesson04.translate.001
    lesson_content_key: en.a1.unit38.lesson04.chores_at_home
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit38_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژه است.", language_code: fa, direction: rtl}
