schema_version: "1.0"
pack_key: practice.fa-en.a1.unit03
source_language: fa
target_language: en
unit_content_key: en.a1.unit03.numbers
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (fa-en practice pass, rest; 2 fixes). (1) age_gloss.001: age_phrase tag
    reached a second old lexeme (gloss قدیمی) at course scope, so the prompt old offered two
    defensible Persian options -> lesson03 unit tag, noun/adjective. (2) price_gloss.003:
    price_phrase reached a second much lexeme (زیاد vs چقدر) -> lesson03 unit tag, noun/adverb (the pronoun it-s, whose gloss has an ellipsis, is no longer drawn). Checked: number pool, bare-
    hundred fills already baked, market pool equal at unit and course scope. NATIVE FLAGS: old=سال
    قدمت‌داشتن (در بیان سن یا قدمت) is clunky as an MC option (ساله / قدمت‌دار?); phone_fill.005
    What-s your phone? is marked interchangeable but is unnatural for phone (What-s your phone
    number? is the taught line; no tag isolates number); ok=باشه؛ خب translation accepts only ok,
    not okay; they-re/it-s glosses carry an ellipsis. BACKFILL GLOSS FLAGS: old.

    Authored by the practice-pool-sync lane (fa/prs bundle), 2026-07-05.
    Extended scripts/backfill_lexemes_fa_en.py's UNIT_FILES to cover this
    unit (previously only units 1-2) -- the POS/agreement-tag
    classification for these English tokens was already added to the
    shared scripts/_en_target_lexeme_common.py module by the nl-en lane
    for its own nl-en unit03 pack, so only a Farsi gloss dict extension
    was needed here, not new classification work.

    Two slots ("phone_word": phone/number, 2 candidates; "age_adjective":
    just "old", 1 candidate; "price_noun": just "dollars", 1 candidate)
    are deliberately restricted to fill_in_blank/translation/word_order,
    never multiple_choice/matching_pairs, per this lane's >=3-distinct-
    candidate threshold. Every fill_in_blank frame has real surrounding
    text beyond the blanked slot (AUTHORING_GUIDE §13).

    Fresh-context review, 2026-07-06 (separate session, zero access to
    the authoring reasoning above, per this project's non-self-
    certification convention): cross-checked every lesson_content_key
    against docs/content/realizations/en/a1_unit03_numbers.yaml (all
    match); wrote a standalone harness importing
    scripts/backfill_lexemes_fa_en.py's real iter_specs() output,
    replicating backend/app/practice/service.py's lexeme_matches()
    exactly, and printed every slot's full real candidate-token list for
    every template (not just counts) -- confirmed every multiple_choice/
    listen_select/matching_pairs slot has >=3 distinct candidates and
    every other slot has >=1, matching scripts/_practice_slot_check.py's
    independent OK result for this file.

    **One real bug found and fixed**: age_fill.002 ("I'm {number} years
    {age_adjective}.") and price_fill.004 ("It's {number} {price_noun}.")
    both embedded the full 22-member "number" tag (zero..hundred) as
    unblanked context -- since "hundred" has no article in this pool, the
    sampler could generate "I'm hundred years old."/"It's hundred
    dollars.", the same bare-cardinal-number bug class the nl-en review
    flagged (unfixed) in its own unit03/07/08/15 (needs a dedicated
    shared-classifier tag split, which is out of this pack's file-edit
    scope). Fixed here by baking the number as fixed literal text
    matching this lesson's own real taught examples ("twenty-five" for
    age, "ten" for price, per a1_unit03_numbers.yaml's own im_25/
    its_ten_dollars teaching cards) instead of drawing it from the pool --
    the slot actually under test in each template (age_adjective/
    price_noun) is unaffected, and the risk is fully eliminated. Re-
    verified after the fix: `compile_content.py practice-validate`
    (0 errors/0 warnings) and the standalone harness (all slots still
    clear their candidate-count bar; "hundred" no longer reachable in any
    embedded-sentence frame in this file).

    No self-reference, unbounded-number-elsewhere, non-interchangeable-
    synonym, or article-agreement issues found in any other template:
    number/age_word/price_word/phone_word/market_word are all used as
    bare, isolated recognition/gloss/translate forms (no embedding risk
    regardless of pool breadth); place_fill.002's place_singular
    (market/shop) correctly excludes the plural "apples" per the shared
    classifier's own documented rationale. phone_fill.005 ("What's your
    {phone_word}?") shifts meaning slightly between "phone"/"number" but
    both render a grammatical, sensible English question -- not a bug
    under this review's bug-class bar.

    Not yet DB-verified against a real backfill run (standing blocker
    across every pack in this bundle, unrelated to this review).

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened both
    matching_pairs templates from 2 to their full real course-wide pools --
    number_pair.004 (number/noun, real pool=22, capped at the guide's
    12-pair max) and the lesson02 market_word matching template
    (market_dialogue semantic tag restricted to [pronoun, noun, adjective]
    part_of_speech, real pool=6, verified directly against
    _en_target_lexeme_common.py since this tag isn't in the retrofit
    table). Neither pads with untaught words.

    Tier-thinness polish (2026-07-25, wave-2 PACK-ONLY lane): the
    production tier had only 2 live templates (number_translate.003
    lesson01, market_translate.004 lesson04 -- below the recipe §8
    >=3-per-tier floor). Added vocab_translate.006, a bare-word
    translation anchored to lesson03 (ages_prices_phones, the one lesson
    with real vocab and no production template) over the union
    [age_phrase, price_phrase, phone_phrase] restricted to
    part_of_speech [noun, adjective, adverb] -- 7 distinct unit-scope
    tokens/glosses (old/twenty-five/years/much/dollars/phone/number);
    pronoun deliberately excluded so the contraction "it's" never
    becomes a bare typed-translation answer. Bare '{item}' frame, so
    safe at course scope regardless of pool width (recipe §3.1/§6.6a).
    NOT re-fresh-context-reviewed since the 2026-07-06 review above --
    that review predates this one added template.

    Narrowed lesson3_word to part_of_speech: noun (2026-07-28, batch-3
    native review). SUPERSEDES the "[noun, adjective, adverb] -- 7 tokens
    incl. much/old" line above. The union's adverb 'much' rendered its
    gloss «چقدر (در how much)» -- which embeds the English answer
    "how much" -- as the bare prompt while grading only the exact string
    "much" (a learner who types "how much" is marked wrong): a CRITICAL
    prompt-shows-answer + underdetermined-answer defect. The adjective
    'old' rendered a verbose author-note gloss «سال قدمت‌داشتن (در بیان سن
    یا قدمت)». Dropping both leaves 5 clean noun members (dollars, years,
    number, phone, twenty-five); the residual «(جمع)» on dollars/years is
    a Farsi plural signal for the -s form, not an English-answer leak.
    lesson3_word is used only by vocab_translate.006, so this is scoped to
    that one template; 5 >= the §8 3-per-tier floor.
tag_schema:
  part_of_speech: [noun, adjective, adverb, pronoun]
  agreement_tags:
    semantic: [number, age_phrase, price_phrase, phone_phrase, market_dialogue, place_singular, fa_en_a1_unit03_lesson03_words]
slot_presets:
  number: &number {language_code: en, part_of_speech: noun, agreement_tags: {semantic: number}}
  age_word: &age_word {language_code: en, part_of_speech: [noun, adjective], agreement_tags: {semantic: fa_en_a1_unit03_lesson03_words}}
  age_adjective: &age_adjective {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: age_phrase}}
  price_word: &price_word {language_code: en, part_of_speech: [noun, adverb], agreement_tags: {semantic: fa_en_a1_unit03_lesson03_words}}
  price_noun: &price_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: price_phrase}}
  phone_word: &phone_word {language_code: en, part_of_speech: noun, agreement_tags: {semantic: phone_phrase}}
  market_word: &market_word {language_code: en, part_of_speech: [pronoun, noun, adjective], agreement_tags: {semantic: market_dialogue}}
  lesson3_word: &lesson3_word {language_code: en, part_of_speech: noun, agreement_tags: {semantic: [age_phrase, price_phrase, phone_phrase]}}
  place_singular: &place_singular {language_code: en, part_of_speech: noun, agreement_tags: {semantic: place_singular}}
templates:
  # Lesson 1: zero to ten.
  - content_key: practice.fa-en.en.a1.unit03.lesson01.number_gloss.001
    lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
    type: multiple_choice
    frame: {text: "{number}", language_code: en, direction: ltr}
    slots: {number: *number}
    answer_derivation: {kind: slot_gloss, slot: number}
    feedback_frame: {text: "معنی فارسی {number} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit03.lesson01.number_translate.003
    lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
    type: translation
    frame: {text: "{number}", language_code: fa, direction: rtl, slot_rendering: {number: english_gloss}}
    slots: {number: *number}
    answer_derivation: {kind: slot_text, slot: number}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این عدد فارسی است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit03.lesson01.number_pair.004
    lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
    type: matching_pairs
    frame: {text: "{number_one} — {number_two}", language_code: en, direction: ltr}
    slots: {number_one: *number, number_two: *number, number_three: *number, number_four: *number, number_five: *number, number_six: *number, number_seven: *number, number_eight: *number, number_nine: *number, number_ten: *number, number_eleven: *number, number_twelve: *number}
    slot_relations: [{kind: distinct, slots: [number_one, number_two, number_three, number_four, number_five, number_six, number_seven, number_eight, number_nine, number_ten, number_eleven, number_twelve]}]
    answer_derivation: {kind: matching_pairs, slots: [number_one, number_two, number_three, number_four, number_five, number_six, number_seven, number_eight, number_nine, number_ten, number_eleven, number_twelve]}
    feedback_frame: {text: "هر عدد را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}

  # Lesson 2: eleven to one hundred (reuses the same number pool).
  - content_key: practice.fa-en.en.a1.unit03.lesson02.number_order.001
    lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
    type: word_order
    frame: {text: "{number_one} {number_two}", language_code: en, direction: ltr}
    slots: {number_one: *number, number_two: *number}
    slot_relations: [{kind: distinct, slots: [number_one, number_two]}]
    answer_derivation: {kind: ordered_slot_texts, slots: [number_one, number_two]}
    feedback_frame: {text: "ترتیب واژه‌ها را حفظ کنید: {number_one} قبل از {number_two}.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit03.lesson02.number_gloss.002
    lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
    type: multiple_choice
    frame: {text: "{number}", language_code: en, direction: ltr}
    slots: {number: *number}
    answer_derivation: {kind: slot_gloss, slot: number}
    feedback_frame: {text: "معنی فارسی {number} را انتخاب کنید.", language_code: fa, direction: rtl}

  # Lesson 3: ages, prices, and phone numbers.
  - content_key: practice.fa-en.en.a1.unit03.lesson03.age_gloss.001
    lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
    type: multiple_choice
    frame: {text: "{age_word}", language_code: en, direction: ltr}
    slots: {age_word: *age_word}
    answer_derivation: {kind: slot_gloss, slot: age_word}
    feedback_frame: {text: "معنی فارسی {age_word} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit03.lesson03.age_fill.002
    lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
    type: fill_in_blank
    # Fresh-context review, 2026-07-06: number was previously a live slot
    # here ("I'm {number} years {age_adjective}."), but the full 22-member
    # "number" tag includes bare "hundred" with no article alongside zero/
    # twenty-five/etc -- "I'm hundred years old." is ungrammatical (needs
    # "one hundred"/"a hundred"), and no narrower tag excluding just
    # "hundred" exists yet in the shared classifier (the same bare-
    # "hundred" bug class the nl-en review flagged, unfixed, in its own
    # unit03/07/08/15 -- needs a shared-classifier change out of this
    # pack's file-edit scope). Fixed here instead by baking the number as
    # fixed literal text matching this lesson's own real taught example
    # ("I'm twenty-five years old.") -- the slot actually under test
    # (age_adjective) is unaffected, and the risk is fully removed since
    # no number is drawn from a pool in this template anymore.
    frame: {text: "I'm twenty-five years {age_adjective}.", language_code: en, direction: ltr}
    slots: {age_adjective: *age_adjective}
    answer_derivation: {kind: slot_text, slot: age_adjective}
    feedback_frame: {text: "برای گفتن سن، از years {age_adjective} استفاده می‌شود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit03.lesson03.price_gloss.003
    lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
    type: multiple_choice
    frame: {text: "{price_word}", language_code: en, direction: ltr}
    slots: {price_word: *price_word}
    answer_derivation: {kind: slot_gloss, slot: price_word}
    feedback_frame: {text: "معنی فارسی {price_word} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit03.lesson03.price_fill.004
    lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
    type: fill_in_blank
    # Same bare-"hundred" risk as age_fill.002 above ("It's hundred
    # dollars." is ungrammatical) -- fixed the same way, baking the number
    # as fixed literal text matching this lesson's own real taught example
    # ("It's ten dollars."). price_noun, the slot actually under test, is
    # unaffected.
    frame: {text: "It's ten {price_noun}.", language_code: en, direction: ltr}
    slots: {price_noun: *price_noun}
    answer_derivation: {kind: slot_text, slot: price_noun}
    feedback_frame: {text: "برای بیان قیمت، عدد را قبل از {price_noun} می‌گویند.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit03.lesson03.phone_fill.005
    lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
    type: fill_in_blank
    frame: {text: "What's your {phone_word}?", language_code: en, direction: ltr}
    slots: {phone_word: *phone_word}
    # AUTHORING_GUIDE.md #17: phone_word's 2-member pool ("number"/"phone")
    # are true register/colloquial synonyms in this exact question --
    # "What's your number?" and "What's your phone?" are both real,
    # equally-correct ways to ask for a phone number, with nothing else in
    # the frame able to prefer one over the other. Confirmed by the
    # corpus-wide ambiguity audit (2026-07-06/07): no sibling template in
    # this file exposes both tokens together, so marked interchangeable
    # rather than removed.
    answer_derivation: {kind: slot_text, slot: phone_word, interchangeable: true}
    feedback_frame: {text: "{phone_word} این پرسش رایج دربارهٔ تلفن را کامل می‌کند.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit03.lesson03.vocab_translate.006
    lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *lesson3_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژهٔ فارسی است.", language_code: fa, direction: rtl}

  # Lesson 4: at the market (dialogue).
  - content_key: practice.fa-en.en.a1.unit03.lesson04.market_gloss.001
    lesson_content_key: en.a1.unit03.lesson04.market_dialogue
    type: multiple_choice
    frame: {text: "{market_word}", language_code: en, direction: ltr}
    slots: {market_word: *market_word}
    answer_derivation: {kind: slot_gloss, slot: market_word}
    feedback_frame: {text: "معنی فارسی {market_word} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit03.lesson04.market_pair.003
    lesson_content_key: en.a1.unit03.lesson04.market_dialogue
    type: matching_pairs
    frame: {text: "{market_word_one} — {market_word_two}", language_code: en, direction: ltr}
    slots: {market_word_one: *market_word, market_word_two: *market_word, market_word_three: *market_word, market_word_four: *market_word, market_word_five: *market_word, market_word_six: *market_word}
    slot_relations: [{kind: distinct, slots: [market_word_one, market_word_two, market_word_three, market_word_four, market_word_five, market_word_six]}]
    answer_derivation: {kind: matching_pairs, slots: [market_word_one, market_word_two, market_word_three, market_word_four, market_word_five, market_word_six]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit03.lesson04.market_translate.004
    lesson_content_key: en.a1.unit03.lesson04.market_dialogue
    type: translation
    frame: {text: "{market_word}", language_code: fa, direction: rtl, slot_rendering: {market_word: english_gloss}}
    slots: {market_word: *market_word}
    answer_derivation: {kind: slot_text, slot: market_word}
    feedback_frame: {text: "پاسخ درست، معادل انگلیسی این واژهٔ فارسی است.", language_code: fa, direction: rtl}
