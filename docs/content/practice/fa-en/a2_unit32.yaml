schema_version: "1.0"
pack_key: practice.fa-en.a2.unit32
source_language: fa
target_language: en
unit_content_key: en.a2.unit32.online_habits
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (fa-en practice pass, fresh context; 4 fixes, gloss overrides). Answer leak: staying /
    touch / lot / many glosses carried the English phrases ("staying in touch", "in touch", "a lot", "how
    many") into the Persian translation prompt and options; English removed, Persian meaning kept. Templates,
    frames (How do you spend your free time; That is a useful thing.) and feedback checked, single-candidate
    word_order/fill_in_blank are safe. NATIVE FLAGS: hi="سلام (خودمانی)", mostly="بیشترِ اوقات".

    35 lexemes across all 4 lessons (5/15/12/3). Recognition/production use
    each lesson's own tag narrowed to [noun, verb, adjective, adverb]. Two
    matching_pairs (6 pairs each): lesson02's tag narrowed to noun-only gives
    exactly 6 (evening/apps/family/cooking/touch/lot); lesson03's tag
    narrowed to noun-only gives 8 (hi/phone/post/photos/notifications/times/
    sharing/friends), 6 selected. No confusable/duplicate glosses in either
    pool. lesson04 has only 3 lexemes; its verb ("spend") and noun ("thing")
    are each already single-member once narrowed by part_of_speech, giving
    two safe structured templates: word_order "How do you {item} your free
    time?" (grounded in the realization's own dialogue topic) and
    fill_in_blank "That is a useful {item}." No mis-glossed lexeme found.
    14 templates, all 4 lessons represented in recognition and production.
