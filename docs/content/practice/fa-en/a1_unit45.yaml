schema_version: '1.0'
pack_key: practice.fa-en.a1.unit45
source_language: fa
target_language: en
unit_content_key: en.a1.unit45.emergencies
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: |-
    Review 2026-10-19 (fa-en practice pass, fresh context; 6 fixes). (1) choose.001/translate.003/volume_listen.004/volume_translate.004: untaught-distractor -- all-ten-POS slot reached course-scope numbers, proper nouns, pronouns, particles; narrowed to noun/verb/adjective/adverb (also drops 911, friend's, off, until from the pools). (2) caught=گرفت (در catch fire): English inside the gloss (answer leak/odd option) and same gloss as got/took -> آتش گرفت via UNIT_SENSE_OVERRIDES. (3) three English matching feedbacks and the volume_match.004 text_block -> Persian. NATIVE FLAGS: goodness=خوبی؛ وای ('Oh my goodness'); case=مورد ('in case of'); department=اداره؛ بخش (fire department = آتش‌نشانی); hurt=آسیب‌دیده. BACKFILL GLOSS FLAGS: third=سوم vs 3rd=سوم identical (underdetermined translation, other unit); goodness/case glosses.

    Authored 2026-07-12 as an additive Endless Practice coverage backfill for fa-en A1 unit 45. Uses the established broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions. Polish wave-2 (2026-07-25) — all three tiers had only 2 live templates; added one per tier (multiple_choice, 6-slot matching_pairs, bare-word translation) anchored to previously template-less lessons, pooled over unit-native [noun, verb, adjective, adverb] content words. This unit's lexemes carry no semantic tags, so matching_pairs slots stay POS-only per the recipe §6.3 honest exception — no semantic union can reach 6 unit tokens. Polish wave-3 (2026-07-26) — commit 05af7ace generated fa_en_a1_unit45_* tags; the wave-2 honest-leave is resolved. Re-anchored lesson01.match.002 and its volume_match.004 sibling to the unit-wide generated tag (28 tokens; lesson01's own tag has only 5, below the floor) and raised both from 4 to 6 slots. Re-anchored lesson03.match.001 to the lesson03 generated tag (11 tokens, clears the floor alone).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - fa_en_a1_unit45_words
    - fa_en_a1_unit45_lesson03_words
slot_presets:
  unit_word:
    language_code: en
    part_of_speech: [noun, verb, adjective, adverb]
templates:
- content_key: practice.fa-en.en.a1.unit45.lesson01.choose.001
  lesson_content_key: en.a1.unit45.lesson01.emergency_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: [noun, verb, adjective, adverb]
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: معنی {item} را انتخاب کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-en.en.a1.unit45.lesson01.match.002
  lesson_content_key: en.a1.unit45.lesson01.emergency_vocabulary
  type: matching_pairs
  frame:
    text: '{first} — {second} — {third} — {fourth} — {fifth} — {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: &unit45_match_word
      language_code: en
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic: fa_en_a1_unit45_words
    second: *unit45_match_word
    third: *unit45_match_word
    fourth: *unit45_match_word
    fifth: *unit45_match_word
    sixth: *unit45_match_word
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: هر واژه را به معنی فارسی خودش وصل کنید.
    language_code: fa
    direction: rtl
