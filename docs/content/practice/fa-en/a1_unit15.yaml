schema_version: "1.0"
pack_key: practice.fa-en.a1.unit15
source_language: fa
target_language: en
unit_content_key: en.a1.unit15.money
review:
  status: unreviewed
  fresh_context: false
  notes: >-
    Authored 2026-07-06 by the practice-pool-sync lane extending fa-en
    coverage to units 15-20, mirroring nl-en's already-reviewed a1_unit15.yaml
    (payment_method 4 members: cash/card/credit/debit; a narrower card_type
    2-member tag for credit/debit specifically, since "Do you take {item}
    cards?" is only grammatical with credit/debit, not cash/card -- "Do you
    take cash cards?" is not a real phrase; and the already-established
    21-member number_no_hundred tag from unit03, reused here for both
    receipt/dialogue total-amount frames, deliberately excluding bare
    "hundred" per the same real-content constraint nl-en's unit15 fix
    documented). All POS/semantic-tag classification for this unit's
    vocabulary was already present in scripts/_en_target_lexeme_common.py
    before this pass (added earlier this session alongside nl-en's own
    unit15 work) -- only scripts/backfill_lexemes_fa_en.py's own Farsi
    gloss dict needed extending (cash/card/credit/debit/total/cards/pay/by/
    tax/1/10; "take"/"sorry"/"i'll"/"we" reuse their existing Unit 10/14/12/
    12 senses unchanged). Verified with scripts/_practice_slot_check.py
    (adapted invocation, see docs/BUILD_LOG.md's matching entry) that every
    slot has >=1 real candidate lexeme and every multiple_choice/
    listen_select slot has >=4 distinct candidate values. The underlying en
    realization unit15 and the fa-en overlay are both already reviewed
    (overlay status: reviewed) except the realization itself, which is
    UNREVIEWED (Codex was usage-limited at authoring time) -- needs the
    standard fresh-context review before import.

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened payment_pair.003
    from 2 to 4 pairs (payment_method/noun, real course-wide pool=4 --
    cash/card/credit/debit), no padding with untaught words.

    **Real bug found and fixed, live-QA pass on fa, 2026-07-06/07**: the
    three lesson04 templates (payment_listen.001, its_order.002,
    its_translate.004) originally anchored `lesson_content_key` to
    `en.a1.unit15.lesson04.paying_dialogue`, the unit's closing review
    dialogue -- every one of its `introduced_tokens` ("How"/"much"/"is"/
    "the"/"total"/"It's"/"fifteen"/"dollars"/"Yes"/"we"/"do"/"Great") was
    already first taught earlier in the unit, so no `Lexeme` row is ever
    created with that lesson as `provenance_lesson_content_key` and
    `_practice_lesson_id()` can never resolve it (same bug class as
    a1_unit10.yaml/a1_unit20.yaml, all three found and fixed together;
    confirmed live -- `POST /admin/courses/{id}/practice/import` rejected
    the whole 24-unit fa-en A1 pack). Fixed by repointing
    payment_listen.001 (payment_method slot) to
    `en.a1.unit15.lesson01.payment_words`, where cash/card/credit/debit
    are actually introduced, and its_order.002/its_translate.004
    (number_no_hundred slot, the "It's {item} dollars" frame) to
    `en.a1.unit15.lesson03.reading_a_receipt` -- already the correct,
    proven-working anchor for this exact same slot on
    total_order.002/total_translate.004 above. Re-verified:
    `compile_content.py practice-validate` still 0/0, full 24-unit fa-en
    A1 practice import now succeeds end-to-end against a fresh isolated
    stack.

    Re-authored 2026-07-24 (unit-scope DEAD-template pass, docs/content/
    PRACTICE_PACK_RECIPE.md): scripts/_practice_unit_scope_check.py found
    total_order.002/total_translate.004/its_order.002/its_translate.004
    DEAD (0 unit-scoped candidates) and payment_pair.003 below the
    6-pair matching_pairs floor (only 4 unit-scoped payment_method
    members). "number_no_hundred" is established by unit03, an EARLIER
    unit -- recipe DO-NOT #2; generate_checkpoint() only loads unit15's
    own lexemes, so this slot has always had zero candidates at
    checkpoint scope despite passing the whole-direction slot check
    referenced in the notes above. unit15's OWN numeric lexemes are the
    literal digit tokens "1"/"10" (introduced fresh by this unit's own
    lesson03, no semantic tag at all -- unlike the spelled-out
    number words unit03 tags "number"/"number_no_hundred", digit-form
    tokens never get a semantic tag from en_agreement_tags()), so
    re-anchoring the SAME sentence frame to a native tag is not possible
    without a backfill change (out of scope, PACK-ONLY). Checked
    part_of_speech: symbol course-wide as an alternative: it also
    contains times ("11:30"), prices ("$10"), phone/reference numbers
    ("4471", "911") and a bare letter ("b") -- nowhere near safe for a
    literal "The total is {item} dollars"/"It's {item} dollars" frame at
    course scope, so word_order is DROPPED for this slot rather than
    re-anchored (recipe SS3.1(c)/SS1.1). payment_method/card_type
    (native, unchanged: cash/card/credit/debit and credit/debit
    respectively) and their existing templates (payment_meaning.001,
    payment_listen.002, payment_translate.004, take_cards_order.001,
    card_type_translate.003, payment_meaning.004, payment_meaning.001
    lesson03, payment_listen.001) are untouched -- none were DEAD or
    below floor. Fixes applied: (1) payment_pair.003 widened by dropping
    the payment_method tag and constraining by part_of_speech only
    ([noun, verb, symbol], no semantic tag) -- unit-wide this pool is
    cash/card/credit/debit/total/cards/pay/tax/1/10, 10 distinct tokens
    with 10 distinct glosses, safe at any scope because matching_pairs
    has no literal frame text; widened from 4 to 6 pairs. (2) The 4 dead
    templates are replaced, not re-anchored, by 3 new templates on the
    same untagged 10-token pool, anchored to lesson03 (the real-vocab
    lesson the 4 dead ones already delegated to): a matching_pairs, a
    bare-word translation, and (anchored lesson02, for tier depth) a
    multiple_choice. Read every gloss in the pool against unit15's own
    realization -- no mis-glosses found. Net: 13 templates (4 DEAD, 1
    below-floor) -> 12 templates (all live, all floors clear): 6
    recognition, 3 structured, 3 production. Verified with
    scripts/_practice_unit_scope_check.py: 0 DEAD, 0 below-floor for
    this file.

    POS-only-matching audit (2026-07-25, wave-2 PACK-ONLY lane):
    payment_pair.003 and content_match.005 were dispatched for
    semantic-union conversion (POS-only matching_pairs pull the whole
    level's vocab at Endless-Practice course scope). DELIBERATELY LEFT
    POS-only: re-measured via iter_specs() -- unit15's only in-unit
    semantic tags are payment_method (cash/card/credit/debit) and
    card_type (credit/debit, a strict subset), so the widest possible
    in-unit semantic union covers 4 distinct tokens, below the 6-pair
    matching_pairs floor; the unit's other 7 lexemes (total/cards/pay/
    by/tax/1/10) are untagged. Shrinking to a 4-pair template is
    forbidden (defect 1.19, 6-12 range), and adding tags is a backfill
    change, out of PACK-ONLY scope. The off-theme-pairs exposure at
    course scope stands until unit15's backfill gains native tags.
    [RESOLVED 2026-07-26 -- see wave-3 note below.]

    WAVE-3 RE-ANCHOR 2026-07-26: commit 05af7ace generated the
    unit-scoped semantic tag fa_en_a1_unit15_words (+ per-lesson
    variants) for every unit's own content lexemes, resolving the
    wave-2 blocker above. Neither dispatched template's own lesson tag
    clears the floor (lesson01 covers only 5, lesson03 only 1), so both
    payment_pair.003 and content_match.005 are re-anchored to the
    unit-wide fa_en_a1_unit15_words tag, narrowed to [noun, verb] (the
    tag never applies to the untagged symbol tokens "1"/"10" or the
    untagged preposition "by", so the POS filter is just documentation
    here): cash/card/credit/debit/total/cards/pay/tax -- 8 distinct
    tokens, 8 distinct Farsi glosses, identical pool at unit AND course
    scope, so the Endless-Practice off-theme pull is gone. Eyeballed
    all 8 glosses -- no confusable pairs; card/cards is a singular/
    plural pair with clearly distinct Farsi (کارت vs کارت‌ها), same
    precedent as unit05's close/closes. Verified via pool_check.py (8
    unit tokens, 0 course extras), practice-validate 0 errors,
    unit-scope check 0 DEAD/0 FLOOR.
tag_schema:
  part_of_speech: [noun, verb]
  agreement_tags:
    semantic: [payment_method, card_type, fa_en_a1_unit15_words]
slot_presets:
  payment_method: &payment_method {language_code: en, part_of_speech: noun, agreement_tags: {semantic: payment_method}}
  card_type: &card_type {language_code: en, part_of_speech: noun, agreement_tags: {semantic: card_type}}
  # wave 3: generated unit-scoped tag (commit 05af7ace) -- course pool ==
  # unit pool by construction, so the matchers below no longer pull the
  # whole level's vocab at Endless-Practice course scope.
  unit_words: &unit_words {language_code: en, part_of_speech: [noun, verb], agreement_tags: {semantic: fa_en_a1_unit15_words}}
templates:
  - content_key: practice.fa-en.en.a1.unit15.lesson01.payment_meaning.001
    lesson_content_key: en.a1.unit15.lesson01.payment_words
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} یکی از واژه‌های پرداخت این درس است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit15.lesson01.payment_listen.002
    lesson_content_key: en.a1.unit15.lesson01.payment_words
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} واژه‌ای است که شنیدید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit15.lesson01.payment_pair.003
    lesson_content_key: en.a1.unit15.lesson01.payment_words
    type: matching_pairs
    frame: {text: "{first_word} — {second_word} — {third_word} — {fourth_word} — {fifth_word} — {sixth_word}", language_code: en, direction: ltr}
    slots: {first_word: *unit_words, second_word: *unit_words, third_word: *unit_words, fourth_word: *unit_words, fifth_word: *unit_words, sixth_word: *unit_words}
    slot_relations: [{kind: distinct, slots: [first_word, second_word, third_word, fourth_word, fifth_word, sixth_word]}]
    answer_derivation: {kind: matching_pairs, slots: [first_word, second_word, third_word, fourth_word, fifth_word, sixth_word]}
    feedback_frame: {text: "دو واژهٔ پرداخت را به معنای فارسی آن‌ها وصل کردید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit15.lesson01.payment_translate.004
    lesson_content_key: en.a1.unit15.lesson01.payment_words
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit15.lesson02.take_cards_order.001
    lesson_content_key: en.a1.unit15.lesson02.asking_about_payment
    type: word_order
    frame: {text: "Do you take {item} cards", language_code: en, direction: ltr}
    slots: {item: *card_type}
    answer_derivation: {kind: render_frame, frame: {text: "Do you take {item} cards", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} نوع کارتی است که پرسیده می‌شود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit15.lesson02.card_type_translate.003
    lesson_content_key: en.a1.unit15.lesson02.asking_about_payment
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *card_type}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit15.lesson02.payment_meaning.004
    lesson_content_key: en.a1.unit15.lesson02.asking_about_payment
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} یکی از واژه‌های پرداخت است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit15.lesson02.content_choose.005
    lesson_content_key: en.a1.unit15.lesson02.asking_about_payment
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit_words}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "معنی فارسی {item} را انتخاب کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit15.lesson03.payment_meaning.001
    lesson_content_key: en.a1.unit15.lesson03.reading_a_receipt
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} یکی از واژه‌های پرداخت است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit15.lesson03.content_match.005
    lesson_content_key: en.a1.unit15.lesson03.reading_a_receipt
    type: matching_pairs
    frame: {text: "{first} — {second} — {third} — {fourth} — {fifth} — {sixth}", language_code: en, direction: ltr}
    slots: {first: *unit_words, second: *unit_words, third: *unit_words, fourth: *unit_words, fifth: *unit_words, sixth: *unit_words}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "هر واژه را به معنی فارسی خودش وصل کنید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit15.lesson03.content_translate.006
    lesson_content_key: en.a1.unit15.lesson03.reading_a_receipt
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit15.lesson04.payment_listen.001
    lesson_content_key: en.a1.unit15.lesson01.payment_words
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} واژه‌ای است که شنیدید.", language_code: fa, direction: rtl}
