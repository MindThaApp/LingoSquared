schema_version: '1.0'
pack_key: practice.fa-en.a2.unit39
source_language: fa
target_language: en
unit_content_key: en.a2.unit39.after_the_interview
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Mirrors the nl-en sibling pack (a2_unit39.yaml, same shared English realization a2_unit39_after_the_interview)
    exactly. Target pool: 19 lexemes, 17 content-POS (noun/verb/adjective/adverb) after excluding "Mia"
    (proper_noun) and "we" (pronoun), which would otherwise be self-gloss/pronoun noise in MC/matching
    pools. Every gloss was read against docs/content/realizations/en/a2_unit39_after_the_interview.yaml
    (SS0.1): all 17 are correct for what the unit teaches -- "full" is the "full time" schedule sense
    and "date" is the calendar start-date sense (both confirmed against the unit''s own dialogue text),
    no misglosses found, nothing routed to the backfill lane.


    Broad unit-wide tag (fa_en_a2_unit39_words) unions all 17 content tokens and drives every recognition
    (MC/listen) and the one matching_pairs template so they clear the 3-distinct/6-distinct floors; lessons
    02 and 03 have only 2 content words each and cannot host their own lesson-tag MC/matching, so their
    per-lesson representation comes from the floor-free word_order + translation templates anchored via
    each lesson''s own tag. word_order uses the generic "Please say {item}." frame (grammatical for any
    POS, no candidate floor, zero self-reference -- neither "Please" nor "say" is ever taught in this
    unit).


    13 templates (same count/layout as nl-en): 4 recognition (MC x3 + listen x1) + 1 matching_pairs +
    4 word_order + 4 translation. THIN UNIT (17 content lexemes total): each tier hosts ~17 distinct items
    so the per-tier distinct-item bar is borderline-met with low per-template variant depth; authored
    honestly per the no-padding rule, flagged checkpoint-thin to the coordinator (same posture as the
    nl-en sibling). PENDING fresh-context review before import.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - fa_en_a2_unit39_words
    - fa_en_a2_unit39_lesson01_words
    - fa_en_a2_unit39_lesson02_words
    - fa_en_a2_unit39_lesson03_words
    - fa_en_a2_unit39_lesson04_words
