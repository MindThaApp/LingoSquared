- content_key: practice.fa-en.en.a2.unit39.lesson01.choose.001
  lesson_content_key: en.a2.unit39.lesson01.offer_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: &id001
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic: fa_en_a2_unit39_words
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: معنی فارسی {item} را انتخاب کنید.
