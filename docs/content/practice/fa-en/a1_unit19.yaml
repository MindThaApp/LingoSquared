schema_version: "1.0"
pack_key: practice.fa-en.a1.unit19
source_language: fa
target_language: en
unit_content_key: en.a1.unit19.preferences
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-19 (fa-en practice pass, fresh context; 4 fixes). (1)
    verb_translate.004 narrowed to the unit tag. (2) two feedback lines
    wrongly called every pool member a preference verb (pool includes very,
    why, strong...); pair feedback said two words for six. NATIVE FLAGS:
    none.

    Authored 2026-07-06 by the practice-pool-sync lane extending fa-en
    coverage to units 15-20, mirroring nl-en's already-reviewed
    a1_unit19.yaml. Reuses the already-established narrower
    preference_verb_full tag (like/prefer/love/hate, 4 members) separate
    from the 5-member preference_verb (like/don't/prefer/love/hate) for the
    "I {item} tea/coffee." frames -- "don't" is an auxiliary needing a
    following verb ("I don't tea." is not a sentence), so the full
    5-member set (including the bare "don't" lexeme, whose introduced_tokens
    entry really represents "don't like" as taught) is used only for
    bare-word recognition, never embedded in a sentence. All POS/semantic-
    tag classification was already present in scripts/
    _en_target_lexeme_common.py before this pass -- only scripts/
    backfill_lexemes_fa_en.py's own Farsi gloss dict needed extending
    (prefer/hate/milder/very/strong/why/think/prefers/thinks; "love"
    (added for unit17)/"because"/"but" reuse their existing senses
    unchanged). Verified with scripts/_practice_slot_check.py that every
    slot has >=1 real candidate lexeme and every multiple_choice/
    listen_select slot has >=4 distinct candidate values (preference_verb
    has 5). The underlying en realization unit19 is UNREVIEWED (Codex was
    usage-limited at authoring time), same as the fa-en overlay's
    realization dependency -- needs the standard fresh-context review
    before import.

    Retrofit 2026-07-06 (AUTHORING_GUIDE.md §16): widened verb_pair.003
    from 2 to 5 pairs (preference_verb/verb, real course-wide pool=5 --
    don't/hate/like/love/prefer), no padding with untaught words.

    Re-authored 2026-07-24 (unit-scope DEAD-template pass, docs/content/
    PRACTICE_PACK_RECIPE.md): scripts/_practice_unit_scope_check.py found
    verb_pair.003 DEAD (needs 5 distinct fills, unit-scoped pool has only
    2) and verb_meaning.001/verb_listen.002/verb_listen.004(lesson02)/
    verb_meaning.004(lesson03)/verb_listen.001(lesson04) below the
    3-distinct multiple_choice/listen_select floor -- all six built on
    "preference_verb", whose course-wide 5 members (don't/hate/like/love/
    prefer) include 3 (don't/like/love) introduced by EARLIER units
    (unit17 for love, an earlier unit for don't/like); unit19 itself only
    contributes 2 (prefer/hate) -- recipe DO-NOT #2, generate_checkpoint()
    only sees this unit's own lexemes. preference_verb_full (used by the
    kept tea_order/coffee_order/verb_full_translate templates below) is
    NOT affected -- it is native here too (only prefer/hate at this
    unit's scope) but those templates are word_order/translation, which
    have no distinct-candidate floor, and both course-wide members of
    that narrower tag (love/prefer/hate at a1; "don't" is deliberately
    excluded from it, see above) are already verified grammatical in "I
    {item} tea/coffee" -- untouched. Applied recipe SS3.1(c) to the six
    broken templates: dropped "preference_verb" and constrained by
    part_of_speech only ([verb, adjective, adverb], no tag) -- unit-wide
    this pool is prefer/hate/think/prefers/thinks/milder/strong/very/why,
    9 distinct tokens with 9 distinct glosses (prefer vs. prefers and
    think vs. thinks are base/third-person conjugation pairs, a
    legitimate discrimination the recipe's own singular/plural-pair
    precedent covers, not a paraphrase collision) -- clears the
    multiple_choice/listen_select 3-option floor and the matching_pairs
    6-pair floor (widened verb_pair.003 from 5 declared slots to 6, all
    within the 9-token pool). Widened verb_translate.004 (l1) to the same
    pool too for consistency, even though it was not itself flagged
    (translation has no floor) -- it used the same now-abandoned
    preference_verb tag. Read every gloss above against unit19's own
    realization -- no mis-glosses found. Net: 13 templates (1 DEAD, 5
    below-floor) -> 13 templates (all live, all floors clear): 5
    recognition, 4 structured, 4 production. Verified with
    scripts/_practice_unit_scope_check.py: 0 DEAD, 0 below-floor for
    this file.

    WAVE-3 RE-ANCHOR 2026-07-26: commit 05af7ace generated the
    unit-scoped semantic tag fa_en_a1_unit19_words (+ per-lesson
    variants) for every unit's own content lexemes. verb_pair.003's own
    lesson01 tag covers only 2 members (prefer/hate), below the 6-pair
    floor, so it is re-anchored to the unit-wide fa_en_a1_unit19_words
    tag instead: prefer/hate/milder/very/strong/why/think/prefers/
    thinks -- the same 9 tokens the 2026-07-24 pass already vetted
    (prefer/prefers and think/thinks are base/3rd-person conjugation
    pairs with distinct Farsi glosses, already documented above), now
    identical at unit AND course scope by construction, so the
    Endless-Practice off-theme pull is gone with zero pool-composition
    change. Verified via pool_check.py (9 unit tokens, 0 course
    extras), practice-validate 0 errors, unit-scope check 0 DEAD/0
    FLOOR.
tag_schema:
  part_of_speech: [verb, adjective, adverb]
  agreement_tags:
    semantic: [preference_verb_full, fa_en_a1_unit19_words]
slot_presets:
  preference_verb_full: &preference_verb_full {language_code: en, part_of_speech: verb, agreement_tags: {semantic: preference_verb_full}}
  content_word: &content_word {language_code: en, part_of_speech: [verb, adjective, adverb]}
  # wave 3: generated unit-scoped tag (commit 05af7ace) -- course pool ==
  # unit pool by construction, so the matcher below no longer pulls the
  # whole level's vocab at Endless-Practice course scope.
  unit_words: &unit_words {language_code: en, part_of_speech: [verb, adjective, adverb], agreement_tags: {semantic: fa_en_a1_unit19_words}}
templates:
  - content_key: practice.fa-en.en.a1.unit19.lesson01.verb_meaning.001
    lesson_content_key: en.a1.unit19.lesson01.like_and_dislike_verbs
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} یکی از واژه‌های این درس است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit19.lesson01.verb_listen.002
    lesson_content_key: en.a1.unit19.lesson01.like_and_dislike_verbs
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} واژه‌ای است که شنیدید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit19.lesson01.verb_pair.003
    lesson_content_key: en.a1.unit19.lesson01.like_and_dislike_verbs
    type: matching_pairs
    frame: {text: "{first_verb} — {second_verb} — {third_verb} — {fourth_verb} — {fifth_verb} — {sixth_verb}", language_code: en, direction: ltr}
    slots: {first_verb: *unit_words, second_verb: *unit_words, third_verb: *unit_words, fourth_verb: *unit_words, fifth_verb: *unit_words, sixth_verb: *unit_words}
    slot_relations: [{kind: distinct, slots: [first_verb, second_verb, third_verb, fourth_verb, fifth_verb, sixth_verb]}]
    answer_derivation: {kind: matching_pairs, slots: [first_verb, second_verb, third_verb, fourth_verb, fifth_verb, sixth_verb]}
    feedback_frame: {text: "واژه‌ها را به معنی فارسی‌شان وصل کردید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit19.lesson01.verb_translate.004
    lesson_content_key: en.a1.unit19.lesson01.like_and_dislike_verbs
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *unit_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit19.lesson02.tea_order.001
    lesson_content_key: en.a1.unit19.lesson02.asking_about_preferences
    type: word_order
    frame: {text: "I {item} tea", language_code: en, direction: ltr}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: render_frame, frame: {text: "I {item} tea", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} ترجیحی است که بیان می‌شود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit19.lesson02.verb_full_translate.003
    lesson_content_key: en.a1.unit19.lesson02.asking_about_preferences
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit19.lesson02.verb_listen.004
    lesson_content_key: en.a1.unit19.lesson02.asking_about_preferences
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} واژه‌ای است که شنیدید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit19.lesson03.coffee_order.001
    lesson_content_key: en.a1.unit19.lesson03.reading_a_preference_message
    type: word_order
    frame: {text: "I {item} coffee", language_code: en, direction: ltr}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: render_frame, frame: {text: "I {item} coffee", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} ترجیحی است که در این متن بیان می‌شود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit19.lesson03.verb_full_translate.003
    lesson_content_key: en.a1.unit19.lesson03.reading_a_preference_message
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "معادل انگلیسی {item} است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit19.lesson03.verb_meaning.004
    lesson_content_key: en.a1.unit19.lesson03.reading_a_preference_message
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} یکی از واژه‌های این درس است.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit19.lesson04.verb_listen.001
    lesson_content_key: en.a1.unit19.lesson04.preference_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *content_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} واژه‌ای است که شنیدید.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit19.lesson04.tea_order.002
    lesson_content_key: en.a1.unit19.lesson04.preference_dialogue
    type: word_order
    frame: {text: "I {item} tea", language_code: en, direction: ltr}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: render_frame, frame: {text: "I {item} tea", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} ترجیحی است که در این گفتگو بیان می‌شود.", language_code: fa, direction: rtl}
  - content_key: practice.fa-en.en.a1.unit19.lesson04.verb_full_translate.004
    lesson_content_key: en.a1.unit19.lesson04.preference_dialogue
    type: translation
    frame: {text: "{item}", language_code: fa, direction: rtl, slot_rendering: {item: english_gloss}}
    slots: {item: *preference_verb_full}
