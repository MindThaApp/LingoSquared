templates:
- content_key: practice.de-ru.ru.a1.unit12.lesson01.choose.001
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Давай ist die informelle ты-Form, um etwas vorzuschlagen; mit вы heißt es давайте.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson01.order.002
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: word_order
  frame:
    text: Давай пойдём в {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай пойдём в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кино verändert seine Endung nie, deshalb bleibt es auch nach в кино.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson01.fill.003
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: fill_in_blank
  frame:
    text: Давай {item} в кино. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Давай plus пойдём schlägt einen Plan vor: Lass uns gehen.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson01.translate.004
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: Lass uns morgen ins Kino gehen. (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай {item} в кино завтра.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Давай пойдём ist die freundliche ты-Einladung: Lass uns gehen.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson01.translate.005
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: Lass uns am Samstag ins Kino gehen. (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай пойдём в кино в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Für „am“ mit einem Wochentag verwendet das Russische в plus Akkusativ: суббота wird zu субботу.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson01.translate.006
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Кино verändert sich nie, und давай bedeutet informell „lass uns“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson02.choose.001
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Согласен endet auf einen Konsonanten, weil der Sprecher ein Mann ist; eine Frau sagt согласна.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson02.fill.002
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: fill_in_blank
  frame:
    text: К {item}, я не могу. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: К сожалению ist die Standardwendung für „leider“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson02.fill.003
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: fill_in_blank
  frame:
    text: Во сколько мы {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Встретимся ist die мы-Form, deshalb steht es mit мы: мы встретимся.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson02.order.004
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: word_order
  frame:
    text: К сожалению, я не {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: К сожалению, я не {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не verneint das Verb, und могу ist die я-Form und bedeutet „ich kann“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson02.translate.005
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: translation
  frame:
    text: Okay, ich bin einverstanden. (von einem Mann gesagt)
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Хорошо, я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Согласен ist die männliche Form; eine Frau würde согласна sagen.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson02.translate.006
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: translation
  frame:
    text: Um wie viel Uhr treffen wir uns?
    language_code: de
    direction: ltr
  slots:
    a: *id011
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Во сколько {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Во сколько fragt wörtlich „zu wie viel“, gemeint ist „um wie viel Uhr“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson03.listen.001
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Russische Vornamen haben kurze, freundliche Formen wie Настя und Дима, die unter Freunden verwendet werden.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson03.order.002
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: word_order
  frame:
    text: Давай в семь часов, у {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай в семь часов, у {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'У bedeutet „bei“ oder „an“ und steht mit dem Genitiv: кинотеатр wird zu кинотеатра.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson03.fill.003
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: fill_in_blank
  frame:
    text: Отлично, до {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: До bedeutet „bis“ und steht mit dem Genitiv, deshalb wird суббота zu субботы.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson03.translate.004
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: Super, bis Samstag.
    language_code: de
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Отлично, до {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До субботы bedeutet wörtlich „bis Samstag“ und ist die freundliche Art zu sagen „bis dann“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson03.translate.005
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: Sagen wir um sieben Uhr, am Kino. (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай в семь часов, у {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Давай в семь часов schlägt eine Uhrzeit vor; у кинотеатра ergänzt den Ort.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit12.lesson03.translate.006
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Отлично ist ein Adverb mit der Bedeutung „großartig“ und verändert sich nicht nach Geschlecht oder Zahl.
    language_code: de
    direction: ltr
