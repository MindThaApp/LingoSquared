schema_version: '1.0'
pack_key: practice.de-ru.a1.unit40
source_language: de
target_language: ru
unit_content_key: ru.a1.unit40.emergencies
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to German). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_библиотеке
    - w_внимание
    - w_выход
    - w_выходу
    - w_запасной
    - w_запасному
    - w_звоню
    - w_иди
    - w_номер
    - w_номеру
    - w_пожар
    - w_пожарные
    - w_пожарным
    - w_позвони
    - w_полиция
    - w_помощь
    - w_скорая
    - w_скорую
    - w_случилось
    - w_экстренному
    - w_экстренный
templates:
- content_key: practice.de-ru.ru.a1.unit40.lesson01.choose.001
  lesson_content_key: ru.a1.unit40.lesson01.pomoshch_i_pozhar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_помощь
        - w_пожар
        - w_экстренный
        - w_номер
        - w_позвони
        - w_экстренному
        - w_номеру
        - w_запасной
        - w_выход
        - w_полиция
        - w_звоню
        - w_скорая
        - w_скорую
        - w_пожарные
        - w_пожарным
        - w_внимание
        - w_запасному
        - w_выходу
        - w_иди
        - w_библиотеке
        - w_случилось
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} gehört zu den Wörtern dieser Lektion, aus der Lektion zu Hilfe und Feuer.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit40.lesson02.listen.001
  lesson_content_key: ru.a1.unit40.lesson02.ekstrennyy_nomer_i_zapasnoy
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} gehört zu den Wörtern dieser Lektion, aus der Lektion zu Notrufnummer und Notausgang.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit40.lesson03.translate.001
  lesson_content_key: ru.a1.unit40.lesson03.politsiya_skoraya_pomoshch_ili
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} gehört zu den Wörtern dieser Lektion, aus der Lektion zu Polizei, Krankenwagen und Feuerwehr.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit40.lesson04.match.001
  lesson_content_key: ru.a1.unit40.lesson04.pozhar_v_yazykovom_kafe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Ordnen Sie jedem russischen Wort die passende deutsche Bedeutung zu; die Wörter stammen aus den Lektionen dieser Einheit.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit40.lesson05.choose.001
  lesson_content_key: ru.a1.unit40.lesson05.chitaem_tekst_o_pozhare
