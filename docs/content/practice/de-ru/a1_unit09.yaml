    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Банк und ресторан sind dem deutschen „Bank“ und „Restaurant“ sehr ähnlich, und аптека ist mit dem Wort „Apotheke“ verwandt.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit09.lesson02.order.004
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: word_order
  frame:
    text: Где находится {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Где находится ...? funktioniert mit jedem Ortsnomen im Singular.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit09.lesson02.fill.005
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: fill_in_blank
  frame:
    text: Банк на улице {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ist eine Straße nach einer Person benannt, steht der Name im Genitiv: улица Пушкина bedeutet „Puschkin-Straße“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit09.lesson02.translate.006
  lesson_content_key: ru.a1.unit09.lesson02.mesta_v_gorode
  type: translation
  frame:
    text: Wo befindet sich das Hotel?
    language_code: de
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Где находится {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Гостиница ist ein feminines Nomen und bedeutet „Hotel“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit09.lesson03.choose.001
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Вашей und моей sind feminine Formen von ваш und мой nach на: на вашей улице, на моей улице.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit09.lesson03.order.002
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: word_order
  frame:
    text: Что есть на {item} улице?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вашей passt zu улице (feminin); das ist die höfliche Frage mit вы.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit09.lesson03.fill.003
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: fill_in_blank
  frame:
    text: На {item} улице есть банк. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Моей ist die Form von моя nach на, weil улица feminin ist und im Präpositiv steht.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit09.lesson03.fill.004
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: fill_in_blank
  frame:
    text: Спасибо {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Спасибо большое ist eine herzliche Art, „Vielen Dank“ zu sagen.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit09.lesson03.translate.005
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: Was gibt es in Ihrer Straße?
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Что есть на {item} улице?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что есть на вашей улице? fragt, was es in der Straße gibt; die вы-Form вашей bleibt höflich.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit09.lesson03.translate.006
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: Vielen Dank.
    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Спасибо {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Большое richtet sich nach dem Neutrum спасибо und endet deshalb auf -ое.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit09.lesson03.translate.007
  lesson_content_key: ru.a1.unit09.lesson03.moya_ulitsa
  type: translation
  frame:
    text: In meiner Straße gibt es eine Bank.
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} улице есть банк.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня есть dient dem Besitzen; für etwas, das sich in einer Straße befindet, sagt man auf Russisch На моей улице есть.
    language_code: de
    direction: ltr
