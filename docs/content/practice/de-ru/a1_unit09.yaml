- content_key: practice.de-ru.ru.a1.unit09.lesson01.choose.001
  lesson_content_key: ru.a1.unit09.lesson01.gde_nakhoditsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
