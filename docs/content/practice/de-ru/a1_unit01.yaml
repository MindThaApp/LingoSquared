templates:
- content_key: practice.de-ru.ru.a1.unit01.lesson01.choose.001
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Kyrillische Buchstaben sehen oft aus wie lateinische, klingen aber anders: р ist ein R, в ist ein W, у ist das u wie in „Mut“ und й ist ein kurzes i.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson01.match.002
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
