    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Manche kyrillischen Buchstaben sind falsche Freunde: р sieht aus wie ein P, ist aber ein R, und е sieht aus wie ein E, wird aber am Wortanfang je gesprochen; здравствуйте enthält beide.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson01.translate.003
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Russisch wird kyrillisch geschrieben; das erste Wort, das Sie lernen, здравствуйте, verwendet з, д, р, а, в, с, т, у, й und е.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson01.translate.004
  lesson_content_key: ru.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: Guten Tag! (formell, ein Wort)
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item}!'
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Здравствуйте ist die förmliche Begrüßung für Fremde und für mehrere Personen zugleich; das erste в wird nicht gesprochen, es klingt also wie zdrAstwujte.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson02.choose.001
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Russische Begrüßungen richten sich nach der Tageszeit: доброе утро (Morgen), добрый день (Tag), добрый вечер (Abend). Утро ist sächlich, день und вечер sind männlich, deshalb ändert sich die Endung des Adjektivs.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson02.listen.002
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Привет ist das lockere „Hallo“ für Freunde und Familie; bei Fremden verwendet man здравствуйте oder eine Begrüßung nach der Tageszeit.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson02.order.003
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: word_order
  frame:
    text: Добрый {item}!
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Добрый {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Добрый steht bei männlichen Nomen wie день und вечер, während das sächliche утро доброе verlangt.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson02.fill.004
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: fill_in_blank
  frame:
    text: Доброе {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Утро ist ein sächliches Nomen, deshalb heißt die Begrüßung доброе, nicht добрый.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson02.translate.005
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Im Russischen gibt es keine Artikel, deshalb besteht eine Ein-Wort-Antwort nur aus dem bloßen Wort, etwa утро oder завтра.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson02.match.006
  lesson_content_key: ru.a1.unit01.lesson02.vremya_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Привет ist locker, während здравствуйте die förmliche Begrüßung für Fremde ist.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson03.choose.001
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Как дела? ist die alltägliche Frage, typisch unter Freunden (ты), während Как поживаете? auf die вы-Form endet und förmlicher klingt.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson03.listen.002
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Пока ist ein lockeres „Tschüss“, während до свидания der neutrale oder förmliche Abschied ist.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson03.order.003
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Привет! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Привет! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дела? fragt wörtlich, wie die Angelegenheiten laufen; nach Привет ist es die lockere Frage unter Freunden.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson03.order.004
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: word_order
  frame:
    text: Здравствуйте! Как {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Здравствуйте! Как {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Поживаете endet auf -ете, die вы-Form, und passt daher zum förmlichen здравствуйте.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson03.fill.005
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: fill_in_blank
  frame:
    text: Хорошо, {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хорошо, спасибо ist die Standardantwort auf Как дела? und bedeutet, dass es einem gut geht.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson03.fill.006
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: fill_in_blank
  frame:
    text: До {item}! ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: До bedeutet „bis“, deshalb ist До завтра! die alltägliche Art, „bis morgen“ zu sagen.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson03.translate.007
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: translation
  frame:
    text: Gut, danke.
    language_code: de
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Хорошо, {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хорошо, спасибо ist die höfliche Standardantwort auf Как дела? und passt sowohl zu ты als auch zu вы.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit01.lesson03.translate.008
  lesson_content_key: ru.a1.unit01.lesson03.kak_dela_i_proshchanie
  type: translation
  frame:
    text: Bis morgen.
    language_code: de
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: До {item}!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До завтра! verwendet до („bis“) mit завтра („morgen“).
    language_code: de
    direction: ltr
