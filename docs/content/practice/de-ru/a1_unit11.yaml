templates:
- content_key: practice.de-ru.ru.a1.unit11.lesson01.choose.001
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Verben auf -ю gehören zu я (ich stehe auf: я встаю), -ете gehört zu вы (вы встаёте).'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson01.order.002
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: word_order
  frame:
    text: Я {item} в семь часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Jedes Verb endet auf -ю, weil das Subjekt я ist.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson01.fill.003
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Я {item} в восемь часов. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Завтракаю ist die я-Form des Verbs für „frühstücken“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson01.fill.004
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: fill_in_blank
  frame:
    text: Когда вы {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Встаёте endet auf -ёте, der вы-Form; die я-Form lautet встаю.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson01.translate.005
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: Ich stehe um sieben Uhr auf.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в семь часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Bei einer Uhrzeit verwendet das Russische в plus Zahl: в семь часов, um sieben Uhr.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson01.translate.006
  lesson_content_key: ru.a1.unit11.lesson01.vstavat_zavtrakat
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Diese Verben sind я-Formen, daher bedeuten sie jeweils: ich tue etwas.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson02.choose.001
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ложусь спать heißt wörtlich „ich lege mich zum Schlafen hin“ und ist die übliche Wendung für „ich gehe schlafen“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson02.match.002
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Спать ist der Infinitiv „schlafen“, und ложусь ist die я-Form eines anderen Verbs.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson02.order.003
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: word_order
  frame:
    text: Я ложусь {item} в одиннадцать часов.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь {item} в одиннадцать часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Ложусь спать ist eine feste Verbindung: das Verb ложусь plus der Infinitiv спать.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson02.fill.004
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: fill_in_blank
  frame:
    text: Я работаю с девяти до {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nach С und до steht der Genitiv, daher werden девять und пять zu девяти und пяти.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson02.translate.005
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: Ich arbeite von neun bis fünf.
    language_code: de
    direction: ltr
  slots:
    a: *id011
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я работаю с {a} до {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: С ... до ... bedeutet „von ... bis ...“ und setzt beide Zahlen in den Genitiv.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson02.translate.006
  lesson_content_key: ru.a1.unit11.lesson02.rabotat_uzhinat
  type: translation
  frame:
    text: Ich gehe um elf Uhr schlafen.
    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ложусь спать в {item} часов.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Nach der Zahl одиннадцать steht das Nomen im Genitiv Plural: часов.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson03.choose.001
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Делаете und работаете enden auf -ете, die вы-Formen, und passen daher zu вы.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson03.order.002
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: Что вы {item} утром?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что вы делаете? fragt „Was machen Sie?“; утром bedeutet „morgens“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson03.order.003
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: word_order
  frame:
    text: А когда вы {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: А когда вы {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А verbindet die Frage mit der vorherigen, und работаете ist die вы-Form.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson03.fill.004
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: fill_in_blank
  frame:
    text: Что вы {item} вечером? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Делаете ist die вы-Form von делать, „tun, machen“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson03.translate.005
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: Was machen Sie morgens? (formell)
    language_code: de
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Что вы {item} утром?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что вы делаете утром? verbindet ein Fragewort, die вы-Verbform und eine Zeitangabe.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit11.lesson03.translate.006
  lesson_content_key: ru.a1.unit11.lesson03.moy_den
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Понятно heißt wörtlich „es ist klar“ und ist die übliche Wendung für „Ich verstehe“ oder „Alles klar“.
    language_code: de
    direction: ltr
