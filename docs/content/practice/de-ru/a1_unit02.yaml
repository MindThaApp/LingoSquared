templates:
- content_key: practice.de-ru.ru.a1.unit02.lesson01.choose.001
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Im Russischen gibt es zwei Wörter für „du/Sie": ты für Freunde, Familie, Kinder und Gleichaltrige und вы für Fremde, Personen, denen man Respekt schuldet, oder mehrere Personen.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson01.order.002
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Как {item} зовут?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как вас зовут? ist das förmliche „Wie heißen Sie?"; wörtlich fragt es, wie man Sie nennt.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson01.order.003
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: word_order
  frame:
    text: Меня зовут {name}.
    language_code: ru
    direction: ltr
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меня зовут bedeutet wörtlich „man nennt mich"; der folgende Name bleibt deshalb in seiner Grundform.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson01.fill.004
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: fill_in_blank
  frame:
    text: Меня {item} Виктор. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Зовут kommt in der Frage und in der Antwort vor: Как вас зовут? und Меня зовут Виктор.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson01.translate.005
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: Ich heiße {name}.
    language_code: de
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Меня зовут {name}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Russen stellen sich mit Меня зовут und dem Vornamen vor; mit Vatersnamen, wie in Ирина Петровна, klingt es förmlicher.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson01.translate.006
  lesson_content_key: ru.a1.unit02.lesson01.kak_vas_zovut
  type: translation
  frame:
    text: Wie heißen Sie?
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как {item} зовут?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вас ist die Form von вы, die in dieser Frage steht; bei einem Freund fragen Sie Как тебя зовут?
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson02.choose.001
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Откуда вы? fragt, woher Sie kommen, und die Antwort greift es mit из und dem Ort auf: Я из Канады, Я из Москвы.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson02.listen.002
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Можно на ты? fragt höflich, ob man von вы zu ты wechseln kann; üblicherweise bietet die ältere oder ranghöhere Person das ты an.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson02.match.003
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Ты verwendet man für Menschen, die man gut kennt, und вы für den förmlichen Kontakt; die Wahl zwischen beiden gehört also zu jedem Gespräch.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson02.order.004
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: word_order
  frame:
    text: Я из {place}.
    language_code: ru
    direction: ltr
  slots:
    place: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Я из {place}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Nach из steht der Genitiv, deshalb wird aus Канада das Wort Канады und aus Москва das Wort Москвы.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson02.fill.005
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: fill_in_blank
  frame:
    text: Давайте перейдём на {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Давайте перейдём на ты schlägt vor, die Förmlichkeit abzulegen; der Vorschlag selbst ist mit давайте trotzdem höflich formuliert.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson02.translate.006
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Меня ist die Akkusativform von я, deshalb heißt es in der Antwort auf die Frage nach dem Namen Меня зовут, wörtlich „man nennt mich".
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson02.translate.007
  lesson_content_key: ru.a1.unit02.lesson02.vy_i_ty
  type: translation
  frame:
    text: Woher kommen Sie? (formell)
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Откуда {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Откуда bedeutet „woher"; die förmliche Frage verwendet вы, und die Antwort verwendet из mit dem Ort.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson03.fill.001
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: fill_in_blank
  frame:
    text: Очень {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Очень приятно bedeutet wörtlich „sehr angenehm" und ist die übliche Antwort, nachdem man jemandes Namen gehört hat.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson03.order.002
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: word_order
  frame:
    text: Давайте {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Давайте {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Давайте plus eine Wir-Form des Verbs ergibt einen höflichen Vorschlag: Давайте познакомимся bedeutet „Lassen Sie uns einander kennenlernen."'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson03.listen.003
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Давайте познакомимся ist eine höfliche Art, ein Kennenlernen mit jemandem zu beginnen, den man mit вы anspricht.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit02.lesson03.translate.004
  lesson_content_key: ru.a1.unit02.lesson03.davayte_poznakomimsya
  type: translation
  frame:
    text: Freut mich.
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Очень приятно passt sowohl zu ты als auch zu вы, weil es die Person nicht direkt anspricht.
    language_code: de
    direction: ltr
