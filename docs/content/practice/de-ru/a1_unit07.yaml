templates:
- content_key: practice.de-ru.ru.a1.unit07.lesson01.choose.001
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Официант ist der Kellner und официантка die Kellnerin; die weibliche Form entsteht mit -ка.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson01.order.002
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: word_order
  frame:
    text: Этот {item} свободен?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Этот {item} свободен?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Этот ist das maskuline „dieser“ und passt zu maskulinen Nomen wie столик und стол; auch свободен ist maskulin.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson01.fill.003
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: fill_in_blank
  frame:
    text: Да, {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Садитесь endet auf -тесь und ist der höfliche Imperativ für вы, den das Personal gegenüber Gästen verwendet.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson01.match.004
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Свободен ist ein maskulines Adjektiv, das sich nach столик richtet; Этот столик свободен? fragt, ob ein Tisch frei ist.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson01.translate.005
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: translation
  frame:
    text: Hier ist die Speisekarte.
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Вот {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Меню ändert seine Endung nie, und Вот bedeutet „hier ist“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson01.translate.006
  lesson_content_key: ru.a1.unit07.lesson01.v_restorane
  type: translation
  frame:
    text: Was möchten Sie bestellen? (formell)
    language_code: de
    direction: ltr
  slots:
    aux: *id005
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Что {aux} {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Что будете заказывать? besteht aus der вы-Form будете und einem Infinitiv und fragt einen Gast, was er bestellen möchte.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson02.choose.001
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Я хочу plus Nomen bedeutet „Ich möchte …“; einen Artikel gibt es im Russischen nicht.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson02.order.002
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: word_order
  frame:
    text: Я хочу {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу bedeutet „ich möchte“, und чай, кофе, борщ und салат behalten danach dieselbe Form.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson02.fill.003
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: fill_in_blank
  frame:
    text: Я хочу борщ и {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Das Wort и verbindet zwei Dinge in einer Bestellung: борщ и салат.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson02.match.004
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id010
    second: *id010
    third: *id010
    fourth: *id010
    fifth: *id010
    sixth: *id010
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Кофе ist ein maskulines Nomen, dessen Endung sich nie ändert.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson02.translate.005
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: Ich möchte Tee.
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу ist eine direkte Aussage; im Restaurant fügt man daher пожалуйста hinzu, um sie abzumildern.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson02.translate.006
  lesson_content_key: ru.a1.unit07.lesson02.zakaz_edy
  type: translation
  frame:
    text: Ich möchte Borschtsch und Salat.
    language_code: de
    direction: ltr
  slots:
    a: *id012
    b: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {a} и {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу борщ и салат ist die Bestellung aus dem Dialog; einen Artikel gibt es im Russischen nicht.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson03.listen.001
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мороженое endet auf -ое, weil es ein Neutrum ist, das aus einem Adjektiv gebildet wurde, wie сладкое.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson03.order.002
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: word_order
  frame:
    text: На сладкое принесите {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: На сладкое принесите {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На сладкое bedeutet „zum Nachtisch“, und принесите ist der höfliche вы-Imperativ für „bringen Sie“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson03.order.003
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: word_order
  frame:
    text: Что будете {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Что будете {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Что будете пить? ist die Frage des Kellners: будете plus Infinitiv.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson03.fill.004
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: fill_in_blank
  frame:
    text: На сладкое {item} мороженое, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Принесите ist der höfliche вы-Imperativ für „bringen Sie“; mit ты wäre es принеси.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson03.translate.005
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: translation
  frame:
    text: Bringen Sie uns bitte zum Nachtisch Eis. (formell)
    language_code: de
    direction: ltr
  slots:
    a: *id016
    b: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: На сладкое {a} {b}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: На сладкое принесите мороженое ist eine natürliche Art, beim Kellner einen Nachtisch zu bestellen.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit07.lesson03.translate.006
  lesson_content_key: ru.a1.unit07.lesson03.zakaz_dialog
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Сладкое ist ein als Nomen gebrauchtes Adjektiv und bedeutet „Nachtisch“.
    language_code: de
    direction: ltr
