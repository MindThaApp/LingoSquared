  frame:
    text: В {item} кровать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nach в steht das Nomen im Präpositiv mit der Endung -е.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson01.translate.006
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: translation
  frame:
    text: Das ist meine Wohnung.
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Это моя {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Моя passt zum femininen Nomen квартира.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson01.translate.007
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: translation
  frame:
    text: In der Küche steht ein Tisch.
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} есть стол.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '„Es gibt …“ heißt есть, und im Russischen steht der Ort zuerst und das Neue zuletzt; кухня steht mit на, nicht mit в: на кухне.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson02.choose.001
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Гостиная und ванная sind feminine Adjektive, die als Nomen gebraucht werden, und enden daher auf -ая.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson02.order.002
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: word_order
  frame:
    text: Диван в {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Диван в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Гостиная wird nach в zu гостиной: im Wohnzimmer.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson02.fill.003
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: fill_in_blank
  frame:
    text: Это {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ванная ist ein feminines Adjektiv, das als Nomen gebraucht wird, und endet daher in der Grundform auf -ая.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson02.translate.004
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: translation
  frame:
    text: Das Sofa ist im Wohnzimmer.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Диван в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: В plus гостиной heißt „im Wohnzimmer“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson02.translate.005
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: translation
  frame:
    text: Das ist das Badezimmer.
    language_code: de
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Это führt einen Gegenstand ein: Это ванная.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson03.choose.001
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Живу ist die я-Form und живёшь die ты-Form von жить, „wohnen, leben“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson03.order.002
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: word_order
  frame:
    text: Я {item} в квартире.
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в квартире.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Живу ist die Ich-Form von жить.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson03.fill.003
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: fill_in_blank
  frame:
