    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nach в wird квартира zu квартире.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson03.translate.004
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: Wo wohnst du?
    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Где ты {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ты zeigt eine vertraute Frage (Duzen) an.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson03.translate.005
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: Ich wohne in einer Wohnung.
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в квартире.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я живу ist die Ich-Form von жить.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson03.translate.006
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: Ich habe zwei Zimmer.
    language_code: de
    direction: ltr
  slots:
    a: *id013
    b: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Nach две, „zwei“, steht das Nomen in der Form комнаты.
    language_code: de
    direction: ltr
