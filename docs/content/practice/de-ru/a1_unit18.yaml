  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Квартира ist feminin, darum steht моя.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit18.lesson01.fill.005
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
