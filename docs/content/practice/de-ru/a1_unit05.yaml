templates:
- content_key: practice.de-ru.ru.a1.unit05.lesson01.choose.001
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Который час? fragt wörtlich „welche Stunde?“, und Сейчас heißt „jetzt“; zusammen bilden sie das übliche Frage-Antwort-Paar für die Uhrzeit.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson01.listen.002
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Welche Form des Nomens nach einer Zahl steht, hängt von ihr ab: час nach 1, часа nach 2–4, часов ab 5.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson01.order.003
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: word_order
  frame:
    text: Сейчас три {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Сейчас три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Nach 2, 3 und 4 steht das Nomen in der Form часа, wie in два часа und три часа.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson01.fill.004
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: fill_in_blank
  frame:
    text: Сейчас десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ab fünf steht das Nomen im Genitiv Plural часов: пять часов, десять часов.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson01.translate.005
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: translation
  frame:
    text: Wie spät ist es?
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Который {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Который час? bedeutet wörtlich „welche Stunde?“; so fragt man üblicherweise nach der Uhrzeit.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson03.translate.001
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Im Russischen steht in Fragen oft zuerst das Fragewort und dann das Verb: Когда отходит поезд?'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson02.choose.001
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Утром, днём, вечером und ночью sind Adverbien auf -ом, -ём oder -ью und stehen ohne Präposition.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson02.match.002
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Tageszeiten sind im Russischen Adverbien: утром, днём, вечером, ночью.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson02.order.003
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: word_order
  frame:
    text: В два часа {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Nach einer Uhrzeit bedeutet дня „nachmittags“, so wie утра „morgens“ und вечера „abends“ bedeutet.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson02.fill.004
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: fill_in_blank
  frame:
    text: В котором {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В котором часу? ist die Frage danach, um wie viel Uhr etwas stattfindet, nicht danach, wie spät es jetzt ist.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson02.translate.005
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Russische Zeitwörter wie утром und вечером stehen allein, ohne Präposition.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson02.translate.006
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: Um sieben Uhr abends.
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: В семь часов {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Nach einer Uhrzeit steht die Tageszeit im Genitiv: семь часов вечера.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson03.listen.002
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Скажите, пожалуйста ist eine höfliche Einleitung für eine Frage an einen Fremden.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson03.order.003
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Скажите, {item}, который час?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Скажите, {item}, который час?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Скажите ist der höfliche Imperativ in der вы-Form („sagen Sie mir“), und пожалуйста macht die Bitte weicher.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson03.order.004
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Когда {item} поезд?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда {item} поезд?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отходит ist die Form der 3. Person Singular des Verbs und stimmt daher mit dem Singular поезд überein.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson03.fill.005
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: fill_in_blank
  frame:
    text: Поезд отходит в восемь часов {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nach einer Uhrzeit bedeutet утра „morgens“, also ist восемь часов утра acht Uhr morgens.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson03.translate.006
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: Wann fährt der Zug ab?
    language_code: de
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда отходит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Когда fragt nach dem Zeitpunkt, und das Verb отходит steht im Singular, passend zu поезд.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit05.lesson03.translate.007
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: Um zwei Uhr nachmittags.
    language_code: de
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дня steht bei Uhrzeiten am Nachmittag, утра und вечера bei Uhrzeiten am Morgen und am Abend.
    language_code: de
    direction: ltr
