templates:
- content_key: practice.de-ru.ru.a1.unit10.lesson01.choose.001
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Идите ist der höfliche Imperativ der вы-Form und bedeutet „gehen Sie“; zu ты gehört иди.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson01.listen.002
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Wegbeschreibungen werden mit потом („dann“) verbunden: Идите прямо, потом направо.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson01.order.003
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: word_order
  frame:
    text: Как дойти до {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До bedeutet „bis (zu)“ und steht mit dem Genitiv, daher wird музей zu музея.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson01.fill.004
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: fill_in_blank
  frame:
    text: Идите {item}, потом направо. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прямо bedeutet „geradeaus“ und verändert seine Endung nicht.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson01.translate.005
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: Wie komme ich zum Museum?
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дойти до ...? fragt, wie man zu Fuß irgendwohin kommt; der Ort nach до steht im Genitiv.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson01.translate.006
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: Gehen Sie geradeaus, dann nach rechts. (formell)
    language_code: de
    direction: ltr
  slots:
    a: *id003
    b: *id004
    c: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Идите {a}, {b} {c}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Идите прямо, потом направо ist die typische Form einer kurzen Wegbeschreibung.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson02.choose.001
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Поверните ist der höfliche Imperativ der вы-Form und bedeutet „biegen Sie ab“; налево und направо geben die Richtung an.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson02.order.002
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: word_order
  frame:
    text: Поверните {item} за углом.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Поверните {item} за углом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Налево und направо passen beide nach поверните.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson02.fill.003
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Поверните налево за {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'За steht hier mit dem Instrumental, daher wird угол zu углом: за углом bedeutet „um die Ecke“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson02.fill.004
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Идите два {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Nach 2, 3 und 4 steht das Substantiv in einer besonderen Form: два квартала, aber пять кварталов.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson02.translate.005
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: Ist es weit von hier?
    language_code: de
    direction: ltr
  slots:
    a: *id010
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Далеко bedeutet „weit“ und отсюда „von hier“; Это далеко отсюда? ist eine häufige Frage.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson02.translate.006
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Квартал ist der Häuserblock, und далеко bedeutet „weit“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson03.choose.001
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Простите ist die höfliche вы-Form, um einen Fremden anzusprechen, wie „Entschuldigen Sie“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson03.order.002
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: word_order
  frame:
    text: Это очень {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Это очень просто bedeutet „Das ist sehr einfach“; ein Verb für „sein“ ist nicht nötig.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson03.fill.003
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: fill_in_blank
  frame:
    text: Нет, пять {item} пешком. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Nach пять steht das Substantiv im Genitiv Plural: пять минут.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson03.translate.004
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: Es ist sehr einfach.
    language_code: de
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Nach это dient просто als Prädikat („es ist einfach“); ein Verb für „sein“ ist nicht nötig.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson03.translate.005
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: Fünf Minuten zu Fuß.
    language_code: de
    direction: ltr
  slots:
    a: *id015
    b: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Пять {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Пешком bedeutet „zu Fuß“, und минут steht nach пять im Genitiv Plural.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit10.lesson03.translate.006
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прохожий ist ein maskulines Substantiv, das von einem Adjektiv stammt und „Passant“ bedeutet.
    language_code: de
    direction: ltr
