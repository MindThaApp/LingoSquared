templates:
- content_key: practice.de-ru.ru.a1.unit15.lesson01.choose.001
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Лучше heißt „besser“ und хуже „schlechter“; чем bedeutet „als“ und steht nach dem Komparativ hinter einem Komma.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson01.order.002
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: word_order
  frame:
    text: Кофе {item}, чем чай.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Кофе {item}, чем чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Im Russischen steht in einem Vergleich vor чем („als“) ein Komma.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson01.fill.003
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: fill_in_blank
  frame:
    text: Чай {item}, чем кофе. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хуже ist das Gegenteil von лучше; чем leitet dann das Verglichene ein.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson01.translate.004
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: Kaffee ist besser als Tee.
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Кофе {item}, чем чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Das Russische lässt „ist“ weg: Кофе лучше stellt die beiden Dinge einfach nebeneinander.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson01.translate.005
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: Tee ist schlechter als Kaffee.
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Чай {item}, чем кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Чем steht immer nach dem Komparativ und einem Komma.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson01.translate.006
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Mit diesen drei Wörtern bilden Sie jeden einfachen Vergleich: лучше, хуже und чем.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson02.choose.001
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: То ist das neutrale „jenes“ und passt zu кафе, тот ist das maskuline „jener“ und passt zu дом.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson02.match.002
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Больше bedeutet „größer“ oder „mehr“, меньше „kleiner“ oder „weniger“; то und тот bedeuten beide „jenes/jener“, richten sich aber nach unterschiedlichen Geschlechtern.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson02.order.003
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: word_order
  frame:
    text: Это кафе {item}, чем то.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Это кафе {item}, чем то.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кафе ist neutral und ändert sich nie, deshalb steht es mit это und то.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson02.order.004
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: word_order
  frame:
    text: Тот дом {item}, чем этот.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Тот дом {item}, чем этот.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дом ist maskulin, deshalb steht es mit тот und этот.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson02.fill.005
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: fill_in_blank
  frame:
    text: То кафе {item}, чем это. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Меньше ist das Gegenteil von больше.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson02.fill.006
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: fill_in_blank
  frame:
    text: Этот дом больше, чем {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Тот ist das maskuline „jener“ und passt zu дом; das neutrale то würde zu кафе passen.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson02.translate.007
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: translation
  frame:
    text: Dieses Café ist größer als jenes.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Это кафе {item}, чем то.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Больше kann je nach Zusammenhang „größer“ oder „mehr“ bedeuten.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson02.translate.008
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: translation
  frame:
    text: Jenes Haus ist kleiner als dieses.
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Тот дом {item}, чем этот.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Тот und этот sind maskulin und richten sich nach дом.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson02.translate.009
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Кафе ist neutral und ändert sich nicht; дом ist maskulin.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit15.lesson02.listen.010
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Больше und меньше sind Gegensätze und können beide auch „mehr“ oder „weniger“ bedeuten.
    language_code: de
    direction: ltr
