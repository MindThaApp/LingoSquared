templates:
- content_key: practice.de-ru.ru.a1.unit03.lesson01.choose.001
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ein russisches Nomen verändert sich nach Zahlen: один рубль, два рубля, пять рублей.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson01.listen.002
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Nach 2, 3 und 4 steht eine besondere Form des Nomens (два брата, три рубля), ab 5 der Genitiv Plural (пять рублей).
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson01.match.003
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Nach den Zahlen 2–4 verändert sich das Nomen auf eine Weise (брат wird zu брата), ab 5 auf eine andere (книга wird zu книг).
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson01.order.004
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: word_order
  frame:
    text: У меня {item} брата.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Два, три und четыре verlangen alle dieselbe Form des Nomens, брата, daher passt hier jede von ihnen.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson01.fill.005
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: fill_in_blank
  frame:
    text: Пять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Nach пять und allen höheren Zahlen steht das Nomen im Genitiv Plural: рублей, nicht рубль.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson01.translate.006
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: Ich habe zwei Brüder.
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня два брата heißt wörtlich „bei mir (sind) zwei Brüder“; брата ist die Form nach 2, 3 und 4.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson01.translate.007
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lernen Sie zuerst die Zählformen (один, два, три, четыре, пять); das Nomen danach verändert sich, wie in один рубль, два рубля, пять рублей.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson02.listen.001
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Die Zahlen von 5 bis 10 verlangen alle das Nomen im Genitiv Plural: пять книг, девять книг, десять книг.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson02.order.002
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: У меня {item} книг.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} книг.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Nach den Zahlen 5–10 steht das Nomen im Genitiv Plural, daher wird книга zu книг.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson02.order.003
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: Мне {item} лет.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Das Alter sagt man auf Russisch mit мне, wörtlich „mir“, und nach 5 und höher heißt das Nomen лет.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson02.fill.004
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: fill_in_blank
  frame:
    text: Мне десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nach Zahlen ab fünf steht beim Alter лет im Genitiv Plural.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson02.translate.005
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: Ich bin zehn Jahre alt.
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Das Alter wird mit мне, „mir“, plus Zahl und лет ausgedrückt; ein Verb gibt es nicht.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson02.translate.006
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: Wie alt sind Sie? (formell)
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько {item} лет?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько вам лет? verwendet das förmliche вам, wörtlich „Ihnen“; gefragt wird also „wie viele Jahre Ihnen?“.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson03.choose.001
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Man sagt Сколько стоит? für eine Ware und Сколько стоят? für mehrere; das Verb richtet sich also nach dem, was man kauft.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson03.order.002
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: word_order
  frame:
    text: Сколько это {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько это {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько это стоит? ist die universelle Frage „Wie viel kostet das?“; стоит ist die Form für eine einzelne Sache.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson03.fill.003
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько {item} яблоки? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Яблоки steht im Plural, daher heißt das Verb стоят; bei einer einzelnen Ware (хлеб) wäre es стоит.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson03.translate.004
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: Wie viel kostet das Brot?
    language_code: de
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хлеб ist eine einzelne Ware, daher heißt das Verb стоит; bei яблоки im Plural wäre es стоят.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit03.lesson03.translate.005
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: Drei Rubel.
    language_code: de
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Nach три steht das Nomen in der Form für 2–4, рубля, die sich von рублей nach 5 und höher unterscheidet.
    language_code: de
    direction: ltr
