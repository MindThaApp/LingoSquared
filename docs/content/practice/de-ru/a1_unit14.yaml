  type: word_order
  frame:
    text: Мне {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: In Мне нравится кофе ist das Gemochte das grammatische Subjekt, und мне ist die Person, der es gefällt.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit14.lesson01.fill.003
