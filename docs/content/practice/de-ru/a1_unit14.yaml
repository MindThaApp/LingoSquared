  feedback_frame:
    text: 'Нравится ist das Verb für „mögen“: Мне нравится кофе heißt wörtlich: Kaffee ist mir angenehm.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit14.lesson01.order.002
