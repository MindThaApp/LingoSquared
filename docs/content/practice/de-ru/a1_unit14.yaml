      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Нравится steht mit мне, „mir“, um zu sagen, dass einem etwas gefällt.
    language_code: de
    direction: ltr
