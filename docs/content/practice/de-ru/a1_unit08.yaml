    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько стоит? fragt nach dem Preis eines einzelnen Gegenstands; молоко ist ein Nomen im Singular.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit08.lesson01.fill.003
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: fill_in_blank
  frame:
    text: Хлеб стоит {item} рублей. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Nach сто – wie nach allen Zahlen ab fünf – steht das Nomen im Genitiv Plural: рублей.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit08.lesson01.match.004
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: matching_pairs
