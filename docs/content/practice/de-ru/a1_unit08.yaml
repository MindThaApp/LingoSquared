templates:
- content_key: practice.de-ru.ru.a1.unit08.lesson01.choose.001
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Сто und двести sind die Zahlen 100 und 200; das Nomen danach steht im Genitiv Plural: сто рублей, двести рублей.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit08.lesson01.order.002
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: word_order
  frame:
