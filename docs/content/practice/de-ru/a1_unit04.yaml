templates:
- content_key: practice.de-ru.ru.a1.unit04.lesson01.choose.001
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Russische Wochentage werden kleingeschrieben, und im Präsens braucht man kein Verb: Сегодня суббота bedeutet „Heute ist Samstag“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson01.listen.002
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Среда, пятница und суббота sind weiblich, die übrigen Wochentage sind männlich oder sächlich.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson01.match.003
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Wochentage werden im Russischen nicht großgeschrieben: понедельник, вторник, среда.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson01.order.004
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: word_order
  frame:
    text: Сегодня {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Im Präsens lässt das Russische das Verb „sein“ weg; Сегодня суббота besteht also nur aus „heute“ und dem Wochentag.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson01.fill.005
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: fill_in_blank
  frame:
    text: Какой {item} день? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Какой richtet sich nach dem männlichen день; deshalb steht in der Frage nach dem Datum später какое beim sächlichen число.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson01.translate.006
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Russische Wochentage werden nicht großgeschrieben.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson01.translate.007
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: Welcher Tag ist heute?
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Какой {item} день?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Какой сегодня день? fragt nach dem Wochentag; nach dem Datum fragt man Какое сегодня число?
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson02.choose.001
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ein Datum besteht aus einer Ordnungszahl im Neutrum und dem Monat im Genitiv: десятое апреля bedeutet „der zehnte April“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson02.order.002
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Die Ordnungszahl steht im Neutrum (первое, третье), weil sie sich auf das mitgedachte Wort число, das Datum, bezieht.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson02.order.003
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня десятое {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня десятое {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Nach dem Tag steht der Monat im Genitiv: десятое января, десятое апреля, десятое октября.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson02.fill.004
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: fill_in_blank
  frame:
    text: Какое сегодня {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Число ist sächlich, deshalb heißt es in der Frage какое; день ist männlich und verlangt какой.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson02.translate.005
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ordnungszahlen in Datumsangaben enden auf -ое oder -ье, weil sie sich auf das sächliche число beziehen.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson02.translate.006
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: Welches Datum ist heute?
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Какое сегодня {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Какое сегодня число? fragt wörtlich: „Welche Zahl ist heute?“'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson02.translate.007
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: Heute ist der dritte Januar.
    language_code: de
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Der dritte Januar heißt im Russischen третье января: Die Ordnungszahl kommt zuerst, und der Monat steht im Genitiv.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson03.fill.001
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: fill_in_blank
  frame:
    text: Встреча {item} вторник. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vor вторник wird die Präposition zu во (во вторник); vor den meisten anderen Wochentagen heißt sie einfach в.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson03.choose.002
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Встреча во вторник, девятого января nennt zuerst den Wochentag und dann das Datum, mit dem Monat im Genitiv.
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson03.order.003
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: word_order
  frame:
    text: Встреча во вторник, {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча во вторник, {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'In einer Datumsangabe steht auch die Ordnungszahl девятого im Genitiv: девятого января bedeutet „am neunten Januar“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ru.ru.a1.unit04.lesson03.translate.004
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: translation
  frame:
    text: Das Treffen ist am Dienstag.
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча {item} вторник.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Во вторник bedeutet „am Dienstag“; во ist die erweiterte Form von в, die hier verwendet wird.
    language_code: de
    direction: ltr
