  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Нравится è il verbo per dire che qualcosa piace: Мне нравится кофе significa letteralmente «a me il caffè piace».'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson01.order.002
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: word_order
  frame:
    text: Мне {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: In Мне нравится кофе la cosa che piace è il soggetto grammaticale e мне indica la persona a cui piace.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson01.fill.003
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: fill_in_blank
  frame:
    text: Мне {item} чай. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Нравится si usa con мне, «a me», per dire che qualcosa ti piace.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson01.translate.004
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: Mi piace il caffè.
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Il russo dice «a me il caffè piace», in modo simile all''italiano «mi piace il caffè»: la persona è al dativo e la cosa che piace è il soggetto.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson01.translate.005
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: Non mi piace il tè.
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне не {item} чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Metti не prima di нравится per dire che qualcosa non ti piace.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson02.listen.001
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Не хочу significa «non voglio»; не va subito prima del verbo.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson02.order.002
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
    text: Я {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не хочу è la negazione di я хочу, «voglio».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson02.order.003
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
    text: Я хочу {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сок è un sostantivo maschile e non cambia dopo хочу.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson02.fill.004
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: fill_in_blank
  frame:
    text: Я хочу {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dopo хочу viene direttamente la cosa che si vuole.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson02.translate.005
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: translation
  frame:
    text: Voglio il succo.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу più un sostantivo è una richiesta semplice e diretta.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson02.translate.006
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: translation
  frame:
    text: Non voglio il caffè.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не sta prima di хочу per negarlo.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson03.choose.001
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Тебе è la forma informale con ты e significa «a te»; la forma di cortesia con вы è вам.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson03.order.002
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: word_order
  frame:
    text: Да, мне нравится кофе. А {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А тебе? rimanda la domanda all'altra persona usando la forma informale con ты.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson03.fill.003
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: fill_in_blank
  frame:
    text: А {item} нравится кофе? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Тебе è il «a te» informale, che si usa con gli amici.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson03.translate.004
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: Sì, mi piace il caffè. E a te? (informale)
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Тебе significa «a te», in forma informale; a uno sconosciuto diresti вам.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit14.lesson03.translate.005
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Questi sono i mattoni per parlare di ciò che piace e che si vuole: нравится, не хочу, сок e тебе.'
    language_code: it
    direction: ltr
