templates:
- content_key: practice.it-ru.ru.a1.unit04.lesson01.choose.001
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'In russo i giorni della settimana si scrivono con la minuscola e al presente non serve il verbo: Сегодня суббота significa «Oggi è sabato».'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson01.listen.002
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Среда, пятница e суббота sono femminili, mentre gli altri giorni sono maschili o neutri.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson01.match.003
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'In russo i giorni della settimana non hanno la maiuscola: понедельник, вторник, среда.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson01.order.004
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: word_order
  frame:
    text: Сегодня {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'In russo al presente il verbo «essere» si omette: Сегодня суббота è semplicemente «oggi» + il giorno.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson01.fill.005
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: fill_in_blank
  frame:
    text: Какой {item} день? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Какой concorda con il maschile день; per questo la domanda sulla data userà più avanti какое con il neutro число.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson01.translate.006
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: In russo i giorni della settimana non vogliono la lettera maiuscola.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson01.translate.007
  lesson_content_key: ru.a1.unit04.lesson01.dni_nedeli
  type: translation
  frame:
    text: Che giorno è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Какой {item} день?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Какой сегодня день? chiede il giorno della settimana; per la data si chiede Какое сегодня число?
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson02.choose.001
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le date usano un ordinale neutro più il mese al genitivo: десятое апреля significa «il dieci aprile».'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson02.order.002
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: L'ordinale è neutro (первое, третье) perché concorda con la parola sottintesa число, la data.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson02.order.003
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: word_order
  frame:
    text: Сегодня десятое {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня десятое {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Dopo il giorno il mese va al genitivo: десятое января, десятое апреля, десятое октября.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson02.fill.004
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: fill_in_blank
  frame:
    text: Какое сегодня {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Число è neutro, quindi la domanda usa какое, mentre день è maschile e usa какой.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson02.translate.005
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gli ordinali nelle date finiscono in -ое o -ье perché concordano con il neutro число.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson02.translate.006
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: Che data è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Какое сегодня {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Какое сегодня число? chiede letteralmente «che numero è oggi?»
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson02.translate.007
  lesson_content_key: ru.a1.unit04.lesson02.mesyatsy_i_chisla
  type: translation
  frame:
    text: Oggi è il tre gennaio.
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '«Il tre gennaio» in russo si dice letteralmente «terzo gennaio», con il mese al genitivo: третье января.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson03.fill.001
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: fill_in_blank
  frame:
    text: Встреча {item} вторник. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Davanti a вторник la preposizione diventa во (во вторник); davanti alla maggior parte degli altri giorni resta semplicemente в.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson03.choose.002
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Встреча во вторник, девятого января mette prima il giorno della settimana e poi la data, con il mese al genitivo.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson03.order.003
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: word_order
  frame:
    text: Встреча во вторник, {item} января.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча во вторник, {item} января.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Nella data anche l''ordinale девятого è al genitivo: девятого января significa «il nove gennaio».'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit04.lesson03.translate.004
  lesson_content_key: ru.a1.unit04.lesson03.naznachaem_vstrechu
  type: translation
  frame:
    text: La riunione è martedì.
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Встреча {item} вторник.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Во вторник significa «martedì»; во è la forma estesa di в usata qui.
    language_code: it
    direction: ltr
