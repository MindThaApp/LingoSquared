templates:
- content_key: practice.it-ru.ru.a1.unit08.lesson01.choose.001
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Сто e двести sono i numeri 100 e 200; il sostantivo che li segue è al genitivo plurale: сто рублей, двести рублей.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson01.order.002
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: word_order
  frame:
    text: Сколько стоит {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько стоит? chiede il prezzo di un solo articolo; молоко è un sostantivo singolare.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson01.fill.003
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: fill_in_blank
  frame:
    text: Хлеб стоит {item} рублей. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Dopo сто, come dopo ogni numero da cinque in su, il sostantivo è al genitivo plurale: рублей.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson01.match.004
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Полкило significa mezzo chilo e si scrive in una sola parola.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson01.translate.005
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: translation
  frame:
    text: Quanto costa il latte?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Стоит concorda con un solo articolo, молоко; per più articoli il russo usa стоят.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson01.translate.006
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: translation
  frame:
    text: Il pane costa cento rubli.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Хлеб стоит {item} рублей.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сто non ha bisogno di nessun articolo o numerale indeterminativo; il sostantivo che segue è рублей.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson02.choose.001
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Дайте è l'imperativo cortese di вы e significa «mi dia»; con ты sarebbe дай.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson02.order.002
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: word_order
  frame:
    text: Дайте {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Килограмм e полкило indicano entrambi una quantità di merce e seguono direttamente дайте.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson02.fill.003
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: fill_in_blank
  frame:
    text: Дайте одну {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dopo дайте il femminile штука diventa штуку, la forma di ciò che si chiede.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson02.fill.004
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: fill_in_blank
  frame:
    text: Дайте пять {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Dopo пять e i numeri superiori il sostantivo è al genitivo plurale: пять штук.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson02.translate.005
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: Mi dia mezzo chilo, per favore. (formale)
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дайте полкило, пожалуйста è un modo cortese di chiedere mezzo chilo a un venditore.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson02.translate.006
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: Mi dia cinque pezzi, per favore. (formale)
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте пять {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Штука diventa штук dopo il numero cinque.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson02.translate.007
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Штука conta gli articoli uno per uno, mentre килограмм e полкило li contano a peso.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson03.listen.001
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Помидоры, огурцы e апельсины sono plurali; картофель e капуста sono parole singolari che significano «patate» e «cavolo».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson03.order.002
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: word_order
  frame:
    text: У вас есть {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У вас есть ...? funziona con qualsiasi sostantivo ed è il modo abituale di chiedere a un venditore se ha qualcosa.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson03.fill.003
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько стоит кило {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dopo una parola di quantità come кило il prodotto è al genitivo plurale, quindi яблоки diventa яблок.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson03.translate.004
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: Mi dia un chilogrammo di pomodori, per favore. (formale)
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте килограмм {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Dopo килограмм il prodotto è al genitivo plurale: помидоры diventa помидоров.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit08.lesson03.translate.005
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: Avete il cavolo? (formale)
    language_code: it
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Капуста è singolare in russo e non richiede articoli.
    language_code: it
    direction: ltr
