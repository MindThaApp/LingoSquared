templates:
- content_key: practice.it-ru.ru.a1.unit15.lesson01.choose.001
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Лучше significa «meglio» e хуже «peggio»; чем significa «di / che» e segue il comparativo dopo una virgola.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson01.order.002
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: word_order
  frame:
    text: Кофе {item}, чем чай.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Кофе {item}, чем чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: In russo, in un confronto si mette una virgola prima di чем, «di / che».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson01.fill.003
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: fill_in_blank
  frame:
    text: Чай {item}, чем кофе. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хуже è il contrario di лучше; чем introduce poi il termine di paragone.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson01.translate.004
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: Il caffè è meglio del tè.
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Кофе {item}, чем чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Il russo omette il verbo «essere»: Кофе лучше accosta semplicemente le due cose.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson01.translate.005
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: Il tè è peggio del caffè.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Чай {item}, чем кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Чем segue sempre il comparativo e una virgola.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson01.translate.006
  lesson_content_key: ru.a1.unit15.lesson01.luchshe_huzhe
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Queste tre parole formano ogni confronto semplice: лучше, хуже e чем.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson02.choose.001
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: То è il neutro «quello» e concorda con кафе; тот è il maschile «quello» e concorda con дом.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson02.match.002
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Больше significa «più grande» o «di più» e меньше significa «più piccolo» o «di meno»; то e тот significano entrambi «quello», ma concordano con generi diversi.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson02.order.003
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: word_order
  frame:
    text: Это кафе {item}, чем то.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Это кафе {item}, чем то.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кафе è neutro e non cambia mai, quindi si usa con это e то.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson02.order.004
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: word_order
  frame:
    text: Тот дом {item}, чем этот.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Тот дом {item}, чем этот.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дом è maschile, quindi va con тот e этот.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson02.fill.005
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: fill_in_blank
  frame:
    text: То кафе {item}, чем это. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Меньше è il contrario di больше.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson02.fill.006
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: fill_in_blank
  frame:
    text: Этот дом больше, чем {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Тот è il maschile «quello» e concorda con дом; il neutro то concorderebbe con кафе.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson02.translate.007
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: translation
  frame:
    text: Questo caffè è più grande di quello.
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Это кафе {item}, чем то.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Больше può significare «più grande» o «di più», a seconda del contesto.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson02.translate.008
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: translation
  frame:
    text: Quella casa è più piccola di questa.
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Тот дом {item}, чем этот.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Тот и этот sono maschili e concordano con дом.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson02.translate.009
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Кафе è neutro e non cambia; дом è maschile.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit15.lesson02.listen.010
  lesson_content_key: ru.a1.unit15.lesson02.bolshe_menshe
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Больше e меньше sono opposti, e entrambi possono significare anche «di più» o «di meno».
    language_code: it
    direction: ltr
