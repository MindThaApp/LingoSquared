    - w_звонит
    - w_знаешь
    - w_интернет
    - w_искать
    - w_ищет
    - w_ищу
    - w_каждое
    - w_компьютер
    - w_компьютером
    - w_назвать
    - w_отправлю
    - w_отправляет
    - w_отправлять
    - w_парк
    - w_побегаю
    - w_погоды
    - w_поиграю
    - w_поищу
    - w_пользоваться
    - w_пользуется
    - w_пользуешься
    - w_пользуюсь
    - w_поплаваю
    - w_приду
    - w_приложение
    - w_прогноза
    - w_солнечно
    - w_телефоном
    - w_уже
    - w_читает
