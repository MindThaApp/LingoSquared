  lesson_content_key: ru.a1.unit38.lesson01.krasnyy_i_zhyoltyy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_тюльпаны
        - w_здесь
        - w_красный
        - w_жёлтый
        - w_белый
        - w_оранжевый
        - w_цвет
        - w_розовый
        - w_хотеть
        - w_хочет
        - w_фиолетовый
        - w_цветочный
        - w_рынок
        - w_покупают
        - w_красивые
        - w_языкового
        - w_красиво
        - w_делают
        - w_красивым
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione sul rosso e sul giallo.'
    language_code: it
    direction: ltr
