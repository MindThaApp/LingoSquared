    - w_делают
    - w_жёлтый
    - w_здесь
    - w_красиво
    - w_красивые
    - w_красивым
    - w_красный
    - w_оранжевый
    - w_покупают
    - w_розовый
    - w_рынок
    - w_тюльпаны
    - w_фиолетовый
    - w_хотеть
    - w_хочет
    - w_цвет
    - w_цветочный
    - w_языкового
templates:
