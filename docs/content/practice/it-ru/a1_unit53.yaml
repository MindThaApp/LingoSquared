- content_key: practice.it-ru.ru.a1.unit53.lesson01.order.002
  lesson_content_key: ru.a1.unit53.lesson01.poydyom_v_sportzal
  type: word_order
  frame:
    text: Рынок был хороший, а теперь я хочу пойти в {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_спортзал
  answer_derivation:
    kind: render_frame
    frame:
      text: Рынок был хороший, а теперь я хочу пойти в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Il mercato era bello, e ora voglio andare in palestra. спортзал significa «palestra».
    language_code: it
    direction: ltr
