      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'На più la desinenza del prepositivo -е indica dove si trova qualcosa: на кухне, in cucina.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson01.fill.004
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
