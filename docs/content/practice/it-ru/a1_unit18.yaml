    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Квартира è femminile, quindi richiede моя.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson01.fill.005
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: fill_in_blank
  frame:
    text: В {item} кровать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dopo в il nome prende la desinenza del prepositivo -е.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson01.translate.006
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: translation
  frame:
    text: Questo è il mio appartamento.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Это моя {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Моя concorda con il nome femminile квартира.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson01.translate.007
  lesson_content_key: ru.a1.unit18.lesson01.eto_moya_kvartira
  type: translation
  frame:
    text: In cucina c'è un tavolo.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: На {item} есть стол.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: '«C''è» si dice есть, e il russo mette prima il luogo e per ultima la cosa nuova; кухня vuole на, non в: на кухне.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson02.choose.001
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: multiple_choice
  frame:
