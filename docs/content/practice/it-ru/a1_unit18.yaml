    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Гостиная e ванная sono aggettivi femminili usati come nomi, quindi terminano in -ая.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson02.order.002
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: word_order
  frame:
    text: Диван в {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Диван в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Гостиная diventa гостиной dopo в: in soggiorno.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson02.fill.003
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: fill_in_blank
  frame:
    text: Это {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ванная è un aggettivo femminile usato come nome, quindi nella forma base termina in -ая.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson02.translate.004
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: translation
  frame:
    text: Il divano è in soggiorno.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Диван в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: В più гостиной significa in soggiorno.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson02.translate.005
  lesson_content_key: ru.a1.unit18.lesson02.divan_v_gostinoy
  type: translation
  frame:
    text: Questo è il bagno.
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Это introduce una cosa: Это ванная.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson03.choose.001
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Живу è la forma di я e живёшь è la forma di ты del verbo жить, «vivere, abitare».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson03.order.002
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: word_order
  frame:
    text: Я {item} в квартире.
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в квартире.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Живу è la forma per «io» del verbo жить.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson03.fill.003
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: fill_in_blank
  frame:
    text: Сколько комнат в {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dopo в, квартира diventa квартире.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson03.translate.004
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: Dove abiti? (informale)
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Где ты {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ты indica una domanda informale.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson03.translate.005
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: Abito in un appartamento.
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} в квартире.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я живу è la forma per «io» del verbo жить.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit18.lesson03.translate.006
  lesson_content_key: ru.a1.unit18.lesson03.moya_kvartira_dialogue
  type: translation
  frame:
    text: Ho due stanze.
    language_code: it
    direction: ltr
  slots:
    a: *id013
    b: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Dopo две, «due», il nome prende la forma комнаты.
    language_code: it
    direction: ltr
