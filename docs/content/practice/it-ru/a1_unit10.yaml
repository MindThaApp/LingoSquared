templates:
- content_key: practice.it-ru.ru.a1.unit10.lesson01.choose.001
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Идите è l'imperativo di cortesia (вы) che significa «vada»; con ты si usa иди.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson01.listen.002
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le indicazioni si collegano con потом, «poi»: Идите прямо, потом направо.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson01.order.003
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: word_order
  frame:
    text: Как дойти до {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До significa «fino a» e richiede il genitivo, quindi музей diventa музея.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson01.fill.004
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: fill_in_blank
  frame:
    text: Идите {item}, потом направо. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прямо significa «dritto» e non cambia la desinenza.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson01.translate.005
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: Come si arriva al museo?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Как дойти до {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как дойти до ...? chiede come arrivare a piedi in un posto; il luogo dopo до va al genitivo.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson01.translate.006
  lesson_content_key: ru.a1.unit10.lesson01.kak_doyti
  type: translation
  frame:
    text: Vada dritto, poi a destra. (formale)
    language_code: it
    direction: ltr
  slots:
    a: *id003
    b: *id004
    c: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Идите {a}, {b} {c}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Идите прямо, потом направо è la forma tipica di una breve indicazione stradale.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson02.choose.001
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Поверните è l'imperativo di cortesia (вы) che significa «giri»; налево e направо indicano la direzione.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson02.order.002
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: word_order
  frame:
    text: Поверните {item} за углом.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Поверните {item} за углом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Налево e направо vanno entrambi bene dopo поверните.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson02.fill.003
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Поверните налево за {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Qui за vuole lo strumentale, quindi угол diventa углом: за углом significa «dietro l''angolo».'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson02.fill.004
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: fill_in_blank
  frame:
    text: Идите два {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Dopo 2, 3 e 4 il sostantivo assume una forma speciale: два квартала, ma пять кварталов.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson02.translate.005
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: È lontano da qui?
    language_code: it
    direction: ltr
  slots:
    a: *id010
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Это {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Далеко significa «lontano» e отсюда «da qui»; Это далеко отсюда? è una domanda frequente.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson02.translate.006
  lesson_content_key: ru.a1.unit10.lesson02.povorachivayte
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Квартал è l'isolato e далеко significa «lontano».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson03.choose.001
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Простите è il modo cortese (вы) per attirare l'attenzione di uno sconosciuto, come «scusi».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson03.order.002
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: word_order
  frame:
    text: Это очень {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Это очень просто significa «è molto semplice»; non serve il verbo «essere».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson03.fill.003
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: fill_in_blank
  frame:
    text: Нет, пять {item} пешком. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Dopo пять il sostantivo va al genitivo plurale: пять минут.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson03.translate.004
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: È molto semplice.
    language_code: it
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Это очень {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Dopo это, просто funziona da predicato, «è semplice», quindi non serve il verbo «essere».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson03.translate.005
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: Cinque minuti a piedi.
    language_code: it
    direction: ltr
  slots:
    a: *id015
    b: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Пять {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Пешком significa «a piedi», e минут segue пять al genitivo plurale.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit10.lesson03.translate.006
  lesson_content_key: ru.a1.unit10.lesson03.dialog_k_muzeyu
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Прохожий è un sostantivo maschile derivato da un aggettivo e significa «passante».
    language_code: it
    direction: ltr
