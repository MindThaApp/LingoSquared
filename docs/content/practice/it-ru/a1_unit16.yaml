templates:
- content_key: practice.it-ru.ru.a1.unit16.lesson01.choose.001
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: У меня болит più una parte del corpo dice che quella parte fa male; ciò che fa male è il soggetto di болит.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson01.order.002
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: word_order
  frame:
    text: У меня болит {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Болит non cambia, sia che la parte del corpo sia femminile, maschile o neutra.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson01.fill.003
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: fill_in_blank
  frame:
    text: У меня болит {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: In russo si dice letteralmente «presso di me fa male la testa», non «ho mal di testa».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson01.translate.004
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: translation
  frame:
    text: Mi fa male lo stomaco.
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Живот è maschile, ma болит non cambia.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson01.translate.005
  lesson_content_key: ru.a1.unit16.lesson01.u_menya_bolit_golova
  type: translation
  frame:
    text: Mi fa male la gola.
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня болит {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня più болит è il modo quotidiano per descrivere un sintomo.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson02.choose.001
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Мне плохо significa in generale «sto male», con мне che vuol dire «a me».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson02.order.002
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: word_order
  frame:
    text: Мне {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне плохо dice come ti senti, usando «a me» invece di «io».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson02.fill.003
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: fill_in_blank
  frame:
    text: У меня {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: У меня più температура significa «ho la febbre».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson02.translate.004
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: Ho il raffreddore.
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня più un sostantivo funziona anche per le malattie, come in У меня простуда.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson02.translate.005
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: Sto male. (due parole)
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне плохо descrive come ti senti, non un dolore specifico.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson02.translate.006
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Температура può significare «temperatura» o «febbre», a seconda del contesto.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson02.match.007
  lesson_content_key: ru.a1.unit16.lesson02.u_menya_temperatura
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Болит è un verbo che significa «fa male»; le parti del corpo голова, живот e горло sono ciò che fa male.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson03.choose.001
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Много воды usa воды, una forma di вода dopo много, e significa «molta acqua».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson03.order.002
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: word_order
  frame:
    text: Вам нужно {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам нужно {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вам нужно più un infinito dice che devi fare qualcosa; вам è il «Lei» di cortesia.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson03.fill.003
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: fill_in_blank
  frame:
    text: Да, и {item} температура. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ещё aggiunge qualcosa in più a quanto detto prima.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson03.fill.004
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: fill_in_blank
  frame:
    text: Вам {item} отдыхать. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Вам нужно più un infinito, «Lei deve», è il consiglio cortese di un medico.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson03.translate.005
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: translation
  frame:
    text: Lei deve riposare. (formale)
    language_code: it
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам {item} отдыхать.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Вам è il «Lei» di cortesia, usato dal medico con il paziente.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit16.lesson03.translate.006
  lesson_content_key: ru.a1.unit16.lesson03.u_vracha
  type: translation
  frame:
    text: Lei deve bere molta acqua. (formale)
    language_code: it
    direction: ltr
  slots:
    a: *id016
    b: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Вам нужно пить {a} {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Dopo много il sostantivo prende la forma воды: «molta acqua».'
    language_code: it
    direction: ltr
