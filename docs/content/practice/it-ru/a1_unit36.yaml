        - w_еды
        - w_сковорода
        - w_жарить
        - w_жарю
        - w_готовит
        - w_пробовать
        - w_пробует
        - w_заходи
        - w_порежем
        - w_жаришь
        - w_пробуешь
        - w_готовят
        - w_режет
        - w_жарит
        - w_еда
        - w_вкусная
        - w_готова
        - w_готовим
        - w_попробуй
        - w_вкусно
        - w_приятного
        - w_аппетита
  answer_derivation:
