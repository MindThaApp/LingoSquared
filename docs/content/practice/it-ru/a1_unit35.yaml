      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_отправляю
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Spedisco un pacco a Samara. отправляю significa «spedisco».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit35.lesson01.translate.004
