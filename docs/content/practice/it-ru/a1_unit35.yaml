- content_key: practice.it-ru.ru.a1.unit35.lesson01.order.002
  lesson_content_key: ru.a1.unit35.lesson01.pismo_i_posylka
  type: word_order
  frame:
    text: У меня есть {item} для дедушки.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_письмо
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня есть {item} для дедушки.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Ho una lettera per il nonno. письмо significa lettera; e-mail.
    language_code: it
    direction: ltr
