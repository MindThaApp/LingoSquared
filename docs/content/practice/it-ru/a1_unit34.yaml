    slot: item
  feedback_frame:
    text: Il mio vicino si chiama Pavel. соседа significa vicino di casa (masch., accusativo), come in «il mio vicino si chiama».
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit34.lesson03.order.002
