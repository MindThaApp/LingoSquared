schema_version: '1.0'
pack_key: practice.it-ru.a1.unit34
source_language: it
target_language: ru
unit_content_key: ru.a1.unit34.neighbourhood
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Italian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_давно
    - w_дружелюбный
    - w_здоровается
    - w_здороваться
    - w_здороваюсь
    - w_знает
    - w_знать
    - w_знают
    - w_район
    - w_сосед
    - w_соседа
    - w_супермаркет
    - w_хорошем
templates:
- content_key: practice.it-ru.ru.a1.unit34.lesson01.choose.001
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_район
        - w_хорошем
        - w_супермаркет
        - w_сосед
        - w_соседа
        - w_знать
        - w_дружелюбный
        - w_здороваться
        - w_здороваюсь
        - w_давно
        - w_здоровается
        - w_знает
        - w_знают
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione sul quartiere.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit34.lesson02.listen.001
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione sul mio vicino e sulla mia vicina.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit34.lesson03.translate.001
  lesson_content_key: ru.a1.unit34.lesson03.druzhelyubie_i_privetstvie
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione su gentile e salutare.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit34.lesson04.match.001
  lesson_content_key: ru.a1.unit34.lesson04.nastya_znakomitsya_s_pavlom
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Abbina ogni parola russa al suo significato in italiano; le parole provengono dalle lezioni di questa unità.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit34.lesson05.choose.001
  lesson_content_key: ru.a1.unit34.lesson05.kto_est_kto_v
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, tratta dalla lezione su chi è chi nel quartiere.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit34.lesson01.translate.002
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: translation
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} è una delle parole di questa unità, dalla lezione sul quartiere.'
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit34.lesson01.order.003
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: word_order
  frame:
    text: Мой {item} рядом с супермаркетом.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_район
  answer_derivation:
    kind: render_frame
    frame:
      text: Мой {item} рядом с супермаркетом.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Il mio quartiere è vicino al supermercato. район significa quartiere.
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit34.lesson01.fill.004
  lesson_content_key: ru.a1.unit34.lesson01.rayon
  type: fill_in_blank
  frame:
    text: Я живу в {item} районе в Казани. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_хорошем
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_хорошем
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vivo in un bel quartiere di Kazan. хорошем significa buono, bello (masch., dopo la parola per «in»).
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit34.lesson02.order.002
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: word_order
  frame:
    text: Павел {item} Димы.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_сосед
  answer_derivation:
    kind: render_frame
    frame:
      text: Павел {item} Димы.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Pavel è il vicino (maschio) di Dima. сосед significa vicino di casa (masch.).
    language_code: it
    direction: ltr
- content_key: practice.it-ru.ru.a1.unit34.lesson02.fill.003
  lesson_content_key: ru.a1.unit34.lesson02.moy_sosed_i_moya
  type: fill_in_blank
  frame:
    text: Моего {item} зовут Павел. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_соседа
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_соседа
  answer_derivation:
