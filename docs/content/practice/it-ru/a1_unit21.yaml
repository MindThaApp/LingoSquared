  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} куртка.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне нужна + un nome femminile significa «mi serve…»; il nome è il soggetto.
    language_code: it
    direction: ltr
