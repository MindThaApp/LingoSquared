    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Sie, Ihnen и Ihr пишутся с заглавной буквы в вежливой форме; du и dir — со строчной.
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson04.match.002
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: de
    direction: ltr
  slots:
    first: *id004
    second: *id004
