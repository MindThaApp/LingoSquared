templates:
- content_key: practice.ru-de.de.a1.unit01.lesson01.choose.001
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Guten Morgen говорят утром, Guten Tag — в течение дня, а Guten Abend — с наступлением вечера.
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson02.listen.001
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tschüss — непринуждённое прощание; Auf Wiedersehen — вежливое, для незнакомых людей и официальных ситуаций.
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson03.choose.001
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'В немецком два слова для «ты/вы»: Sie — вежливая форма (незнакомые люди, официальные лица), du — неформальная (друзья, семья, дети).'
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson04.listen.001
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bitte означает и «пожалуйста», и «не за что», а Entschuldigung помогает привлечь внимание или извиниться.
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson03.order.002
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: word_order
  frame:
    text: Wie geht es {item}?
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Wie geht es Ihnen? — вежливый вопрос «как у вас дела?»; другу задают вопрос Wie geht's?
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson02.order.002
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: word_order
  frame:
    text: Bis {item}!
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Bis {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bis значит «до», поэтому Bis bald — это «до скорого», а Bis später — «до скорой встречи, увидимся позже».
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson01.order.002
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: word_order
  frame:
    text: Guten {item}!
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Guten {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Guten оканчивается на -n, потому что Morgen, Tag и Abend — мужского рода; у слова Nacht женский род, поэтому говорят Gute Nacht.
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson02.match.003
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: de
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Tschüss — неформальное прощание; Auf Wiedersehen — вежливое прощание для людей, которых ты знаешь не очень хорошо.
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson03.match.003
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: matching_pairs
