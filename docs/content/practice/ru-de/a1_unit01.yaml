    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Danke и bitte — два повседневных слова вежливости; bitte может также значить «не за что».
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson03.fill.004
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: fill_in_blank
  frame:
    text: Und {item}? ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Неформальная форма здесь — dir, пишется со строчной буквы; вежливый вопрос — Und Ihnen?
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson04.fill.003
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: fill_in_blank
  frame:
    text: '{item} geschehen. ({hint})'
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gern geschehen — стандартный ответ на danke, буквально что-то вроде «охотно случилось».
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson01.translate.003
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Все немецкие существительные пишутся с заглавной буквы, поэтому Morgen, Tag, Abend и Nacht начинаются с заглавной.
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson03.translate.005
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sie и du — формы подлежащего («вы» и «ты»); Ihnen и dir — формы со значением «вам» и «тебе».
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson04.translate.004
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kein Problem — обычный ответ на благодарность или небольшое извинение.
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson01.translate.004
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: translation
  frame:
    text: 'Приветствие: {item}!'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Guten {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Guten Tag подходит со второй половины утра и служит универсальным приветствием.
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson02.translate.004
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: translation
  frame:
    text: Увидимся {item}!
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Bis {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bis bald и Bis später — оба непринуждённые; Auf Wiedersehen — формальное прощание.
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit01.lesson03.translate.006
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: translation
  frame:
    text: Как у вас дела?
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Sie и Ihnen пишутся с заглавной буквы в вежливой форме, поэтому заглавная I в слове Ihnen — часть правописания.
    language_code: ru
    direction: ltr
