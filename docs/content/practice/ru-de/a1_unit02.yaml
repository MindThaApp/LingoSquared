templates:
- content_key: practice.ru-de.de.a1.unit02.lesson01.choose.001
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Слово Ich пишется с заглавной буквы только в начале предложения, а в середине — со строчной.
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit02.lesson02.listen.001
  lesson_content_key: de.a1.unit02.lesson02.ich_bin_du_bist
