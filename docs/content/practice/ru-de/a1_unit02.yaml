  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Окончание глагола меняется в зависимости от лица: ich komme, du kommst.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-de.de.a1.unit02.lesson04.choose.001
  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
