    - es_a1_u15
    - w_viejo
    - w_equipo
    - w_espacio
    - w_mudarme
    - w_cocinas
    - w_sentido
slot_presets:
  content: &id002
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u15
  viejo: &id001
    language_code: es
    part_of_speech: adjective
    agreement_tags:
      semantic: w_viejo
  equipo: &id003
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_equipo
  espacio: &id004
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_espacio
  mudarme: &id005
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_mudarme
  cocinas: &id006
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_cocinas
  sentido: &id007
    language_code: es
    part_of_speech: noun
    agreement_tags:
