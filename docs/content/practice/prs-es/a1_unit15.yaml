templates:
- content_key: practice.prs-es.es.a1.unit15.lesson02.order.001
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: word_order
  frame:
    text: El apartamento nuevo es más grande que el {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: El apartamento nuevo es más grande que el {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: آپارتمان نو از آپارتمان کهنه بزرگ‌تر است. الگوی Más + صفت + que دو چیز را مقایسه می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit15.lesson02.choose.002
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: هسپانوی با más ... que (بیشتر از)، menos ... que (کمتر از) و tan ... como (به اندازهٔ / مثل) مقایسه می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit15.lesson04.translate.001
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: translation
  frame:
    text: ما یک تیم خوب استیم.
    language_code: prs
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Somos un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Bueno پیش از اسم مذکر مفرد به buen کوتاه می‌شود: un buen equipo.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit15.lesson04.listen.002
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Tan bien como یعنی مثل / به خوبی‌ی: cocinas tan bien como yo.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit15.lesson05.fill.001
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: fill_in_blank
  frame:
    text: El apartamento nuevo tiene más {item} para cocinar. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Más پیش از اسم یعنی بیشتر از آن چیز: más espacio، یعنی جای بیشتر.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit15.lesson05.match.002
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mudarse یعنی خانه عوض کردن؛ ماتیو quiero mudarme می‌گوید چون خودش خانه عوض می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit15.lesson06.order.001
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: word_order
  frame:
    text: El viejo es más pequeño. Por eso quiero {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: El viejo es más pequeño. Por eso quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: کهنه کوچک‌تر است. به همین خاطر می‌خواهم خانه عوض کنم. Por eso یعنی به همین خاطر.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit15.lesson06.translate.002
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Viejo برای چیزها و آدم‌ها یعنی کهنه / پیر؛ nuevo ضد آن است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit15.lesson06.fill.003
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: fill_in_blank
  frame:
    text: Tú {item} tan bien como yo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tan + قید + como دو نفر را که یک کار را به یک اندازه خوب انجام می‌دهند مقایسه می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit15.lesson06.translate.004
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: خیلی معقول است.
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Tiene mucho {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'در هسپانوی می‌گویند «خیلی معنی دارد»: tiene mucho sentido.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit15.lesson06.choose.005
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '¡Exacto! یک راه تند برای موافقت است: دقیقاً.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit15.lesson05.translate.003
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Espacio یعنی جا یا فضا؛ más espacio para cocinar، یعنی جای بیشتر برای آشپزی.
    language_code: prs
    direction: rtl
