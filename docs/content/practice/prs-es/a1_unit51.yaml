  feedback_frame:
    text: بلیط یک‌طرفه می‌خواهین یا رفت و برگشت؟ Quiere شکل رسمی usted از فعل querer است و اینجا برای کارمند ناآشنای ایستگاه به کار رفته.
    language_code: prs
    direction: rtl
