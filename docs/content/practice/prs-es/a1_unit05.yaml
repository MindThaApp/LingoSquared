templates:
- content_key: practice.prs-es.es.a1.unit05.lesson01.order.001
  lesson_content_key: es.a1.unit05.lesson01.decir_la_hora_en_punto
  type: word_order
  frame:
    text: ¿Qué {item} es?
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Qué {item} es?
      language_code: es
      direction: ltr
  feedback_frame:
    text: ساعت چند است؟ با son las + ساعت جواب بتین (son las dos)، اما برای ساعت یک es la una می‌گویند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson01.choose.002
  lesson_content_key: es.a1.unit05.lesson01.decir_la_hora_en_punto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'ساعت‌ها مؤنث اند چون به horas اشاره دارند: las dos، las cuatro.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson02.order.001
  lesson_content_key: es.a1.unit05.lesson02.cuarto_y_media
  type: word_order
  frame:
    text: Son las cuatro y {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las cuatro y {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'ساعت چهار و پانزده دقیقه است. «نیم» y media است: son las cuatro y media.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson02.translate.002
  lesson_content_key: es.a1.unit05.lesson02.cuarto_y_media
  type: translation
  frame:
    text: ساعت یک ربع کم پنج است.
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las cinco {item} cuarto.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'اسپانوی از ساعت بعدی به عقب می‌شمارد: پنج منفی یک ربع.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson03.order.001
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: word_order
  frame:
    text: Son las ocho de la {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las ocho de la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De la mañana، de la tarde و de la noche مثل صبح و بعد از ظهر کار می‌کنند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson03.translate.002
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: translation
  frame:
    text: کارگاه ساعت چهار بعد از چاشت شروع می‌شود.
    language_code: prs
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: El taller empieza a las cuatro de la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'برای گفتن وقت از a las + ساعت کار می‌گیریم: a las cuatro؛ و برای ساعت یک a la una.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson03.match.003
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mañana یعنی صبح (la mañana) و همچنین فردا؛ معمولاً حرف تعریف فرق‌شان را نشان می‌دهد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson04.fill.001
  lesson_content_key: es.a1.unit05.lesson04.proponer_una_hora_para_verse
  type: fill_in_blank
  frame:
    text: De {item}, a las tres y media. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De acuerdo روش معمول برای موافقت با یک نقشه است: باشد، قبول.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson04.translate.002
  lesson_content_key: es.a1.unit05.lesson04.proponer_una_hora_para_verse
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Antes de یعنی پیش از: antes del taller، پیش از کارگاه.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson05.listen.001
  lesson_content_key: es.a1.unit05.lesson05.leer_el_horario_del_dia
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Almorzar یعنی چاشت خوردن؛ اسپانوی‌ها معمولاً بین ساعت دو و سه چاشت می‌خورند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson05.fill.002
  lesson_content_key: es.a1.unit05.lesson05.leer_el_horario_del_dia
  type: fill_in_blank
  frame:
    text: Al día {item}, Elena y Mateo almuerzan juntos. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al día siguiente یعنی روز بعد؛ siguiente بعد از اسم می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson06.order.001
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: word_order
  frame:
    text: ¡Buena {item}! Comemos mañana.
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buena {item}! Comemos mañana.
      language_code: es
      direction: ltr
  feedback_frame:
    text: فکر خوب! فردا غذا می‌خوریم. Idea مؤنث است، پس «خوب» buena می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson06.translate.002
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: translation
  frame:
    text: نزدیک اینجا یک رستورانت است.
    language_code: prs
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Hay un {item} cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Hay چیز تازه‌ای را معرفی می‌کند: hay un restaurante. برای جای معلوم از está کار می‌گیریم: el restaurante está cerca.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit05.lesson06.choose.003
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¿Tienes hambre? در اسپانوی «گرسنگی داشتن» می‌گویند، نه «گرسنه بودن».
    language_code: prs
    direction: rtl
