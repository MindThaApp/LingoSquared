templates:
- content_key: practice.prs-es.es.a1.unit12.lesson01.choose.001
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'صفت‌های احساس برای مرد به -o و برای زن به -a ختم می‌شوند: nervioso, nerviosa.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson01.listen.002
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: آخرین حرف صدادار نشان می‌دهد که گوینده مرد است (-o) یا زن (-a).
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson01.match.003
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Contento یعنی خوشحال یا راضی از یک چیز؛ با estar به کار می‌رود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson01.order.004
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: word_order
  frame:
    text: Hoy Mateo está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy Mateo está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'برای احساسات از estar کار گرفته می‌شود، چون تغییر می‌کنند: Mateo está nervioso hoy.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson01.order.005
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: word_order
  frame:
    text: Hoy Elena está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy Elena está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Elena یک زن است، پس صفت به -a ختم می‌شود: Elena está cansada.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson03.order.001
  lesson_content_key: es.a1.unit12.lesson03.como_te_sientes
  type: word_order
  frame:
    text: Me {item} un poco nervioso.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Me {item} un poco nervioso.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'کمی عصبی استم. Sentirse با me, te, se می‌آید: me siento, te sientes.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson03.translate.002
  lesson_content_key: es.a1.unit12.lesson03.como_te_sientes
  type: translation
  frame:
    text: چه احساسی داری؟ (غیررسمی)
    language_code: prs
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo te {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'با usted سوال چنین می‌شود: ¿Cómo se siente?'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson04.fill.001
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: fill_in_blank
  frame:
    text: No te {item}, podemos empezar de nuevo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: No te preocupes شکل ثابتِ گفتن «غم نخور» به یک دوست است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson04.translate.002
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: translation
  frame:
    text: یک چیز می‌سوزد!
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Algo se {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'اسپانوی برای آنچه همین حالا اتفاق می‌افتد از زمان حال ساده کار می‌گیرد: algo se quema.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson04.order.003
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: word_order
  frame:
    text: Podemos {item} de nuevo.
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Podemos {item} de nuevo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: می‌توانیم دوباره شروع کنیم. De nuevo یعنی دوباره، مثل otra vez.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson05.choose.001
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'متن خواندنی در طول زمان پیش می‌رود: antes (قبل)، durante (در جریان)، al final (در آخر)، ahora (حالا).'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson05.translate.002
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'برای گروهی که یک مرد در آن است، صفت -os می‌گیرد: nerviosos, contentos.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson06.order.001
  lesson_content_key: es.a1.unit12.lesson06.el_pastel_se_quema_dialogue
  type: word_order
  frame:
    text: Lo logramos {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Lo logramos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: ما آن را باهم کردیم. Lograr یعنی در انجام چیزی موفق شدن.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson06.listen.002
  lesson_content_key: es.a1.unit12.lesson06.el_pastel_se_quema_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¡Ay, no! واکنش طبیعی وقتی است که یک چیز خراب می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit12.lesson05.match.003
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Estaban و están هر دو از estar استند: بودند، استند.'
    language_code: prs
    direction: rtl
