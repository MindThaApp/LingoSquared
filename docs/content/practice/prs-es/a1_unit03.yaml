templates:
- content_key: practice.prs-es.es.a1.unit03.lesson01.choose.001
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'کلمه‌های خانواده اکثراً به اساس جنسیت جفت می‌شوند: hermano و hermana، hijo و hija.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson01.listen.002
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'جمع مذکر گروه‌های مخلوط را هم در بر می‌گیرد: padres یعنی پدر و مادر، hermanos می‌تواند برادران و خواهران باشد.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson01.translate.003
  lesson_content_key: es.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mamá و papá کلمه‌های روزمرهٔ خانه استند؛ madre و padre کلمه‌های بی‌طرف استند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson02.order.001
  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: word_order
  frame:
    text: Mi familia es {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi familia es {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Familia مؤنث است، پس «کوچک» pequeña می‌شود؛ grande برای هر دو جنس یکسان می‌ماند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson02.translate.002
  lesson_content_key: es.a1.unit03.lesson02.possessives_and_asking
  type: translation
  frame:
    text: من دو خواهر دارم.
    language_code: prs
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo dos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'برای پرسیدن: ¿Tienes hermanos? جمع مذکر را به کار می‌برد که برادران و خواهران را در بر می‌گیرد.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson03.choose.001
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Primo کاکازاده یا مامازادهٔ پسر و prima دختر است؛ primos گروه مخلوط را هم می‌گیرد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson03.match.002
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Abuelo و abuela در جمع abuelos می‌شود، یعنی پدرکلان و مادرکلان.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson03.order.003
  lesson_content_key: es.a1.unit03.lesson03.extended_family
  type: word_order
  frame:
    text: Vivo con mis {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vivo con mis {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Mis جمعِ mi است: mi abuelo، mis abuelos.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson04.translate.001
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: translation
  frame:
    text: من با {item} خودم زندگی می‌کنم.
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vivo con mis {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Vivo خودش یعنی «زندگی می‌کنم»، پس yo ضرور نیست.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson04.fill.002
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: fill_in_blank
  frame:
    text: Somos cinco en {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Somos cinco به معنی لفظی «ما پنج استیم» است: یعنی پنج نفر استیم.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson04.order.003
  lesson_content_key: es.a1.unit03.lesson04.describing_family_size
  type: word_order
  frame:
    text: ¿Vives cerca de tus {item}?
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Vives cerca de tus {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Cerca de یعنی «نزدیک»؛ tus جمعِ tu است، یعنی «ات/تان».
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson05.fill.001
  lesson_content_key: es.a1.unit03.lesson05.reading_a_family_profile
  type: fill_in_blank
  frame:
    text: Mi hermana {item} se llama Sofía. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Menor بعد از اسم می‌آید و برای جنسیت تغییر نمی‌کند: mi hermano menor، mi hermana menor.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson05.choose.002
  lesson_content_key: es.a1.unit03.lesson05.reading_a_family_profile
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vive یعنی «او زندگی می‌کند»؛ viven یعنی «آن‌ها زندگی می‌کنند».
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson06.listen.001
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¡Qué bonito! واکنش گرم به یک عکس است، یعنی «چه قشنگ!».
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson06.translate.002
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: translation
  frame:
    text: ما هر هفته تلفونی صحبت می‌کنیم.
    language_code: prs
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Hablamos por teléfono cada {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'در هسپانوی «تلفونی» به شکل por teléfono گفته می‌شود و cada هیچ‌وقت تغییر نمی‌کند: cada día، cada semana.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson06.match.003
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Somos و son هر دو از ser می‌آیند: «ما استیم»، «آن‌ها استند».'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit03.lesson06.translate.004
  lesson_content_key: es.a1.unit03.lesson06.family_photos_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'آخر فعل‌ها در هسپانوی شخص را نشان می‌دهد: vivo، vives، vive، viven.'
    language_code: prs
    direction: rtl
