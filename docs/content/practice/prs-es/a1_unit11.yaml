templates:
- content_key: practice.prs-es.es.a1.unit11.lesson01.choose.001
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: در هسپانوی اغلب el pantalón به شکل مفرد گفته می‌شود (los pantalones هم درست است).
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit11.lesson01.listen.002
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Camisa و chaqueta مؤنث‌اند؛ pantalón، delantal و zapatos مذکرند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit11.lesson01.translate.003
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'اسم‌هایی که به -l ختم می‌شوند، در جمع -es می‌گیرند: delantal، delantales.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit11.lesson02.order.001
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: word_order
  frame:
    text: Uso la talla {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Uso la talla {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: من اندازه متوسط می‌پوشم. در هسپانوی برای اندازه‌ای که می‌پوشید از usar (به کار بردن) استفاده می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit11.lesson02.fill.002
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: fill_in_blank
  frame:
    text: ¿Qué {item} usas? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Talla اندازه لباس است؛ اندازه کفش به جای آن el número نام دارد: ¿Qué número tienes?'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit11.lesson02.translate.003
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: translation
  frame:
    text: به من بد جور میشه.
    language_code: prs
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Quedar با bien یا mal نشان میدهد که لباس به تن تو چطور جور میشه: me queda bien، یعنی به من خوب جور میشه.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit11.lesson04.order.001
  lesson_content_key: es.a1.unit11.lesson04.decidir_comprar
  type: word_order
  frame:
    text: Me queda bien. Voy a {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda bien. Voy a {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Ir a + مصدر از یک پلان خبر میدهد: voy a comprarlo، یعنی میخواهم آن را بخرم. ضمیر lo (آن) به آخر مصدر وصل میشود.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit11.lesson05.match.001
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Uso، usas و usan همه از usar میآیند: میپوشم، میپوشی، میپوشند.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit11.lesson05.fill.002
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: fill_in_blank
  frame:
    text: 'El delantal es más {item}: solo cuesta doce. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Más + صفت مقایسه میسازد: más barato، یعنی ارزانتر.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit11.lesson06.order.001
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: word_order
  frame:
    text: Sí, buscamos {item} para el taller.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, buscamos {item} para el taller.
      language_code: es
      direction: ltr
  feedback_frame:
    text: بلی، ما برای کارگاه پیشبند میجوییم. Buscar خودش به معنی جستجو کردن است، پس buscamos delantales به کلمهٔ اضافی ضرورت ندارد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit11.lesson06.choose.002
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: کارمند با ¿Los ayudo? کمک پیشنهاد میکند، یعنی «آیا به شما (همهٔ شما) کمک کنم؟»
    language_code: prs
    direction: rtl
- content_key: practice.prs-es.es.a1.unit11.lesson06.translate.003
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Voy از ir (رفتن) است و بیقاعده است: voy، vas، va.'
    language_code: prs
    direction: rtl
