templates:
- content_key: practice.hi-ro.ro.a1.unit07.lesson01.choose.001
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Leu मुद्रा की एक इकाई है और lei उसका बहुवचन; costă दाम पूछता या बताता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson01.listen.002
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scump का अर्थ महँगा और ieftin का अर्थ सस्ता है; दोनों दाम का वर्णन करते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson02.match.001
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Costă दाम की क्रिया है, और kilogram, piață तथा खाने की चीज़ें वे हैं जिनकी आप खरीदारी करते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson01.translate.003
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Costă ''इसकी कीमत है'' का रूप है: Cât costă? दाम पूछता है और Costă opt lei उसका जवाब देता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson01.order.004
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: word_order
  frame:
    text: Costă cinci {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'दो से उन्नीस तक बहुवचन lei के साथ de नहीं आता: opt lei। बीस से ऊपर यह आता है: treizeci de lei।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson01.fill.005
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: fill_in_blank
  frame:
    text: Cât {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cât costă? दाम पूछने का बुनियादी सवाल है; costă क्रिया का 'यह' वाला रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson01.translate.006
  lesson_content_key: ro.a1.unit07.lesson01.cat_costa
  type: translation
  frame:
    text: इसकी कीमत आठ lei है।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costă cinci {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Lei, leu का बहुवचन है और संख्याओं के साथ आता है: opt lei.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson02.choose.002
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vreau का अर्थ है 'मैं चाहता हूँ'; unde का अर्थ है 'कहाँ', और Unde pot...? में pot का अर्थ है 'मैं सकता हूँ'।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson02.listen.003
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Cumpăr का अर्थ है ''मैं खरीदता हूँ''; pot के साथ să जुड़ता है: pot să cumpăr, ''मैं खरीद सकता हूँ''।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson02.translate.004
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vreau सीधा-सा है, जैसे 'मुझे चाहिए'; aș dori कुछ माँगने का नरम तरीका है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson02.order.005
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: word_order
  frame:
    text: Cât costă un {item} de roșii?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un {item} de roșii?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'माप और जिस चीज़ को मापा जा रहा है, उनके बीच रोमानियाई में de आता है: un kilogram de roșii.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson02.order.006
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: word_order
  frame:
    text: Unde pot să {item} roșii?
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să {item} roșii?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'pot के बाद रोमानियाई में să और दूसरी क्रिया आती है: pot să cumpăr, ''मैं खरीद सकता हूँ''।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson02.fill.007
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: fill_in_blank
  frame:
    text: Vreau un kilogram de {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cartofi बहुवचन है; un kilogram de के बाद मापी जाने वाली चीज़ बहुवचन में ही रहती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson02.translate.008
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: मैं टमाटर कहाँ से खरीद सकता हूँ?
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Unde pot să cumpăr {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Roșii बहुवचन है, इसलिए इसके पहले un या o नहीं आता; pot să cumpăr का अर्थ है 'मैं खरीद सकता हूँ'।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson02.translate.009
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: मुझे एक किलो आलू चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Vreau un kilogram de {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un kilogram de और बहुवचन cartofi मिलकर मात्रा और चीज़ दोनों बताते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit07.lesson02.translate.010
  lesson_content_key: ro.a1.unit07.lesson02.rosii_si_cartofi
  type: translation
  frame:
    text: एक किलो टमाटर कितने के हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât costă un kilogram de {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât costă कीमत पूछता है; एकवचन costă एक किलो के साथ ठीक बैठता है।
    language_code: hi
    direction: ltr
