  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'दहाइयाँ -zeci पर समाप्त होती हैं: douăzeci, treizeci, patruzeci और इसी तरह nouăzeci तक।'
    language_code: hi
    direction: ltr
