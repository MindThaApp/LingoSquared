templates:
- content_key: practice.hi-ro.ro.a1.unit02.lesson01.choose.001
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '"दो" के दो रूप हैं: पुल्लिंग संज्ञाओं के साथ doi और स्त्रीलिंग व नपुंसकलिंग संज्ञाओं के साथ două।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit02.lesson01.listen.002
  lesson_content_key: ro.a1.unit02.lesson01.zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'शून्य से दस तक की संख्याएँ आधार हैं: ग्यारह से उन्नीस तक की संख्याओं में -sprezece जुड़ता है (unsprezece, doisprezece) और दहाइयों में -zeci।'
    language_code: hi
    direction: ltr
