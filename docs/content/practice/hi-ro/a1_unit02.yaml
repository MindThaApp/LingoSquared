      language_code: ro
      direction: ltr
  feedback_frame:
    text: Numărul नपुंसकलिंग है, और नपुंसकलिंग एकवचन संज्ञा के साथ पुल्लिंग रूप tău आता है; आदरसूचक रूप है Care este numărul dumneavoastră de telefon?
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit02.lesson03.translate.007
