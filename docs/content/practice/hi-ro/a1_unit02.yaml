    slot: item
  feedback_frame:
    text: 'ग्यारह से उन्नीस तक की संख्याएँ अंक के साथ -sprezece जोड़कर बनती हैं: doisprezece यानी दो और दस।'
    language_code: hi
    direction: ltr
