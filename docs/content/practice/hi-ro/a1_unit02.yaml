  feedback_frame:
    text: संज्ञा से पहले "एक" और "दो" लिंग के अनुसार बदलते हैं (un या o, doi या două); केवल गिनती करते समय unu, doi कहा जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit02.lesson02.choose.001
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
