    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit02.lesson03.order.001
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: word_order
  frame:
    text: Am {item} ani.
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'दो से उन्नीस तक de नहीं आता: am nouăsprezece ani। बीस से ऊपर वह आता है: am treizeci de ani।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit02.lesson02.translate.005
  lesson_content_key: ro.a1.unit02.lesson02.eleven_to_hundred
  type: translation
  frame:
    text: मेरी उम्र तीस साल है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Am {item} de ani.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'बीस से ऊपर संख्या के बाद संज्ञा से पहले de आता है: treizeci de ani।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit02.lesson03.choose.002
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ai, "रखना" क्रिया का tu वाला रूप है और aveți dumneavoastră वाला रूप: Câți ani ai? या Câți ani aveți?'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit02.lesson03.fill.003
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: fill_in_blank
  frame:
    text: Am treizeci {item} ani. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'De बीस से ऊपर की संख्याओं के बाद आता है: treizeci de ani, पर nouăsprezece ani।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit02.lesson03.translate.004
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: तुम्हारी उम्र कितनी है? (अनौपचारिक, दोस्त से)
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Câți ani ai? का शाब्दिक अर्थ है "तुम्हारे कितने साल हैं": रोमानियाई में उम्र के लिए "रखना" क्रिया आती है, "होना" नहीं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit02.lesson03.translate.005
  lesson_content_key: ro.a1.unit02.lesson03.age_and_phone
  type: translation
  frame:
    text: आपकी उम्र कितनी है? (औपचारिक, ऐसे व्यक्ति से जिसे आप dumneavoastră कहते हैं)
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți ani {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți "रखना" क्रिया का आदरसूचक रूप है, जो dumneavoastră के साथ आता है।
    language_code: hi
    direction: ltr
