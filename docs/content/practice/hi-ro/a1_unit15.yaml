  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pleacă "रवाना होता है" की क्रिया है, जो La ce oră pleacă trenul? में trenul के साथ आती है।
    language_code: hi
    direction: ltr
