      direction: ltr
  feedback_frame:
    text: Pleacă "वह" (पुल्लिंग या स्त्रीलिंग या निर्जीव) के लिए चलता है, इसलिए trenul के साथ ठीक बैठता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit15.lesson01.order.004
  lesson_content_key: ro.a1.unit15.lesson01.trenul_pleaca
