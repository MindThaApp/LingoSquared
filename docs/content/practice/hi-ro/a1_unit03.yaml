    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: luni से sâmbătă तक सप्ताह के सात में से छह दिन हैं; duminică, यानी रविवार, सप्ताह पूरा करता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit03.lesson01.translate.004
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Astăzi का अर्थ आज है, mâine का अर्थ कल (आने वाला) है और ieri का अर्थ कल (बीता हुआ) है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit03.lesson01.order.005
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: word_order
  frame:
    text: Ce {item} este astăzi?
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} este astăzi?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Ce zi este astăzi? सप्ताह का दिन पूछता है; उत्तर Astăzi este + दिन से दीजिए: Astăzi este vineri.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit03.lesson01.translate.006
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: translation
  frame:
    text: आज शुक्रवार है।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'रोमानियाई में सप्ताह के दिन छोटे अक्षर से शुरू होते हैं: vineri, Vineri नहीं।'
    language_code: hi
    direction: ltr
