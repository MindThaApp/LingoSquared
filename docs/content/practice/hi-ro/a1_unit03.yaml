templates:
- content_key: practice.hi-ro.ro.a1.unit03.lesson01.choose.001
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'रोमानियाई में दिनों और महीनों के नाम छोटे अक्षर से लिखे जाते हैं: luni, vineri, Luni या Vineri नहीं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit03.lesson01.listen.002
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sâmbătă शनिवार है और duminică रविवार। हर दिन एक ही शब्द है और किसी में बड़ा अक्षर नहीं लगता।
    language_code: hi
    direction: ltr
