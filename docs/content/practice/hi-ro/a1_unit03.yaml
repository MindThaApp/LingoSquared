    kind: render_frame
    frame:
      text: Astăzi este trei {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'तारीख़ संख्या + महीना होती है: trei aprilie. महीने की पहली तारीख़ के लिए întâi आता है, unu नहीं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit03.lesson02.translate.005
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: आज अगस्त की पहली तारीख़ है।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este întâi {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'महीने की पहली तारीख़ întâi है, unu नहीं: întâi august; दूसरी तारीख़ से साधारण संख्या का प्रयोग कीजिए।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit03.lesson02.fill.006
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: fill_in_blank
  frame:
