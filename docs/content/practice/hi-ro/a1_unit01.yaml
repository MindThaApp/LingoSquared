    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Bună ziua dumneavoastră के साथ जुड़ता है और salut tu के साथ: आप जो अभिवादन चुनते हैं, वही पूरी बातचीत का स्तर तय कर देता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit01.lesson01.translate.004
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mulțumesc रोज़मर्रा का "धन्यवाद" है और tu तथा dumneavoastră, दोनों के साथ चलता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit01.lesson01.order.005
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: word_order
  frame:
    text: Bună {item}!
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Bună {item}!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Bună ziua अनजान लोगों के लिए दिन का शिष्ट अभिवादन है; दोस्तों से आप salut कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit01.lesson01.fill.006
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
