  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: आप कैसे हैं? (अनौपचारिक, दोस्त से)
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faci? दोस्त (tu) के लिए है; अनजान व्यक्ति से आप Ce mai faceți? कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit01.lesson01.translate.008
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: आप कैसे हैं? (औपचारिक, ऐसे व्यक्ति से जिसे आप dumneavoastră कहते हैं)
