  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: तुम्हें क्या कहकर बुलाते हैं? (अनौपचारिक, दोस्त से)
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum te {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cum te cheamă? में दोस्त के लिए te आता है; अनजान व्यक्ति से आप Cum vă numiți? कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit01.lesson02.choose.004
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: multiple_choice
  frame:
