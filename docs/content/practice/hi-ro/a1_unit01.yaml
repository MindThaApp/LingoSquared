  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Și का अर्थ "और" है, और यह लौटाए जाने वाले प्रश्न की शुरुआत भी करता है: Și dumneavoastră? या Și tu?'
    language_code: hi
    direction: ltr
