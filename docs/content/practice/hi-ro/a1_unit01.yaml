templates:
- content_key: practice.hi-ro.ro.a1.unit01.lesson01.choose.001
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'रोमानियाई में "आप/तुम" के लिए दो शब्द हैं: दोस्तों और परिवार के लिए tu, और अनजान लोगों के लिए तथा आदर दिखाने के लिए dumneavoastră।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit01.lesson01.listen.002
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Faceți dumneavoastră के साथ आता है और faci tu के साथ, इसलिए क्रिया का अंत ही बता देता है कि संबोधन का रूप क्या है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit01.lesson01.match.003
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: matching_pairs
