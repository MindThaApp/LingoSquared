    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Și dumneavoastră? शिष्ट प्रश्न को लौटाता है; दोस्त से आप Și tu? कहते हैं।
    language_code: hi
    direction: ltr
