    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cum vă numiți? नाम के बारे में शिष्ट प्रश्न है और इसमें vă आता है; दोस्त से यह Cum te cheamă? बन जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit01.lesson02.listen.005
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Numesc "मैं" वाला रूप है (mă numesc) और numiți dumneavoastră वाला रूप है (cum vă numiți)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit01.lesson02.translate.006
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
