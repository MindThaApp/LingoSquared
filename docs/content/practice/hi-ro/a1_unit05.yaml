templates:
- content_key: practice.hi-ro.ro.a1.unit05.lesson01.choose.001
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Meu और mea दोनों का मतलब "मेरा/मेरी" है: meu पुल्लिंग और नपुंसक संज्ञाओं के साथ आता है (tatăl meu) और mea स्त्रीलिंग के साथ (mama mea)।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson01.listen.002
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Părinți का मतलब माता-पिता है और यह बहुवचन है; दो माता-पिता हैं mamă और tată।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson01.match.003
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mamă और tată सादी संज्ञाएँ हैं; mama और tatăl के अंत में निश्चित आर्टिकल जुड़ा होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson01.translate.004
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'रोमानियाई में निश्चित आर्टिकल संज्ञा के अंत में जुड़ता है: mamă से mama और tată से tatăl बनता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson01.order.005
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: word_order
  frame:
    text: Mama {item} și tatăl meu.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item} și tatăl meu.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'अधिकार-सूचक शब्द संज्ञा के लिंग के अनुसार बदलता है: mama mea (स्त्रीलिंग) पर tatăl meu (पुल्लिंग)।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson01.fill.006
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: fill_in_blank
  frame:
    text: Mama mea și tatăl {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tatăl पुल्लिंग है, इसलिए उसके साथ meu आता है; mama स्त्रीलिंग है और उसके साथ mea आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson01.translate.007
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: मेरी माँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Mama {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'रोमानियाई में अधिकार-सूचक शब्द संज्ञा के बाद आता है: mama mea, mea mama नहीं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson02.choose.001
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'रोमानियाई बहुवचन में अंत बदलता है: frate से frați, soră से surori, copil से copii।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson02.listen.002
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fiu का अर्थ बेटा और fiică का अर्थ बेटी है; विवाहित पुरुष को căsătorit कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson02.match.003
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Frate, fiu और copil पुल्लिंग हैं और un के साथ आते हैं; soră और fiică स्त्रीलिंग हैं और o के साथ आते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson02.translate.004
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Frați, frate का बहुवचन है और surori, soră का बहुवचन है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson02.order.005
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: word_order
  frame:
    text: Ai {item}?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ai frați? दोस्त से पूछा जाने वाला सवाल है; dumneavoastră के साथ यह Aveți frați? हो जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson02.fill.006
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: fill_in_blank
  frame:
    text: Am un {item} și o soră. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Un पुल्लिंग संज्ञाओं के साथ आता है (un frate) और o स्त्रीलिंग के साथ (o soră)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson02.translate.007
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: मेरी एक बेटी है।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Am o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fiică स्त्रीलिंग है, इसलिए उसके साथ o आता है; बेटे के लिए un fiu कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson02.translate.008
  lesson_content_key: ro.a1.unit05.lesson02.frati_si_copii
  type: translation
  frame:
    text: तुम्हारे कितने बच्चे हैं? (अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Câți {item} ai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Câți "कितने" का पुल्लिंग बहुवचन रूप है और copii के साथ आता है, जो copil का बहुवचन है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson03.translate.001
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: translation
  frame:
    text: Mihai, क्या आपके भाई हैं? (औपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aveți {item}, Mihai?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aveți "है" का विनम्र रूप है; दोस्त से आप Ai frați? पूछेंगे।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit05.lesson03.order.002
  lesson_content_key: ro.a1.unit05.lesson03.o_discutie_despre_familie
  type: word_order
  frame:
    text: Da, am un frate și o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Da, am un frate și o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Un frate पुल्लिंग है और o soră स्त्रीलिंग; यह वाक्य Aveți frați? का जवाब है।
    language_code: hi
    direction: ltr
