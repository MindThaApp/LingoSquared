templates:
- content_key: practice.hi-ro.ro.a1.unit06.lesson01.choose.001
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Aș dori का अर्थ है "मैं लेना चाहूँगा"; यह कुछ माँगने का शिष्ट तरीका है और हर पेय के लिए एक जैसा रहता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson01.listen.002
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Apă, cafea, ceai, suc और lapte बुनियादी पेय हैं; sete (प्यास) Mi-e sete में mi-e के साथ आता है।
    language_code: hi
    direction: ltr
