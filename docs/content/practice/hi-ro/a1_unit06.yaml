    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cafea और apă स्त्रीलिंग हैं और o लेते हैं (o cafea); ceai और suc नपुंसक हैं और un लेते हैं (un ceai)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson01.translate.004
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aș dori का अर्थ है "मैं लेना चाहूँगा"; पेय इसके बाद आता है, और एक कप या गिलास माँगने पर उसके आगे o या un लगता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson01.order.005
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: word_order
  frame:
    text: Aș dori o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Cafea स्त्रीलिंग है, इसलिए o लेता है: o cafea। एक चाय है un ceai।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson01.fill.006
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: fill_in_blank
  frame:
    text: Aș dori un {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ceai के साथ un आता है, o नहीं: un ceai। o cafea से तुलना कीजिए।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson01.translate.007
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: मैं एक कॉफ़ी लेना चाहूँगा।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aș dori शिष्ट रूप है और tu तथा dumneavoastră दोनों के साथ चलता है; cafea के साथ o आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson01.translate.008
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: मुझे प्यास लगी है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi-e {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mi-e sete शाब्दिक रूप से कहता है "मेरे लिए प्यास है"; Mi-e foame भी इसी तरह बनता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson02.choose.001
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Foame का अर्थ है भूख; "मुझे भूख लगी है" के लिए आप Mi-e foame कहते हैं, जैसे Mi-e sete।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson02.listen.002
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
