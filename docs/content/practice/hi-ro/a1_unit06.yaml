  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mâncare सामान्य रूप से खाना है; pâine, carne, pui और fructe खाने की खास चीज़ें हैं।
    language_code: hi
    direction: ltr
