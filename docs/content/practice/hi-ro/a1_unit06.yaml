    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Fructe बहुवचन है और सामान्य रूप से "फल" का अर्थ देता है; pâine, carne और mâncare एकवचन और स्त्रीलिंग हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson02.translate.004
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mâncare का अर्थ सामान्य रूप से खाना है और carne का अर्थ मांस; pui का अर्थ चिकन है और fructe का अर्थ फल।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson02.order.005
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: word_order
  frame:
    text: Aș dori {item} și pui.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item} și pui.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'ब्रेड के साथ यहाँ o या un नहीं लगता: Aș dori pâine și pui, ठीक वैसे ही जैसे Aș dori apă।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson02.fill.006
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Mi-e foame (मुझे भूख लगी है) एक तय वाक्यांश है: भावना mi-e के बाद आती है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson02.fill.007
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e foame. Aș dori {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pui का अर्थ चिकन है, और मेन्यू या दुकान में यही शब्द इस्तेमाल होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson02.translate.008
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: मुझे एक चाय चाहिए, कृपया। (औपचारिक, जिसे आप dumneavoastră कहकर संबोधित करते हैं)
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori un ceai, vă {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă rog, dumneavoastră के लिए विनम्र 'कृपया' है; दोस्त से आप te rog कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit06.lesson02.translate.009
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: मुझे फल चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fructe बहुवचन है, इसलिए इसके पहले o या un नहीं आता।
    language_code: hi
    direction: ltr
