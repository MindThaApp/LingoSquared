  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dimineața, seara और noaptea दिन के भाग हैं और निश्चित उपपद के कारण -a पर समाप्त होते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit04.lesson03.listen.002
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cursul का अर्थ कक्षा है; 'शुरू होता है' के लिए începe आता है, जो कक्षाओं और आयोजनों दोनों के लिए प्रयुक्त होता है।
    language_code: hi
    direction: ltr
