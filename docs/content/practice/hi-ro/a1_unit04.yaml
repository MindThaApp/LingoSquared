  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: word_order
  frame:
    text: Cursul {item} la ora nouă.
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul {item} la ora nouă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Începe 'शुरू होना' क्रिया का वह/यह वाला रूप है, जो एकवचन कर्ता cursul से मेल खाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-ro.ro.a1.unit04.lesson03.translate.004
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: translation
  frame:
    text: कक्षा सुबह नौ बजे शुरू होती है।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul începe la ora nouă, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'समय के बाद दिन का भाग जोड़ें: la ora nouă, dimineața या la ora nouă, seara।'
    language_code: hi
    direction: ltr
