    text: Trezesc، mănânc و beau صورت‌های اول‌شخص مفرد هستند؛ در رومانیایی شخص در پایان فعل مشخص می‌شود، برای همین هر صورت را همان‌طور که می‌آید یاد می‌گیریم.
