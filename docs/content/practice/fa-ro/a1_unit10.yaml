  type: translation
  frame:
    text: عصر کار می‌کنم و شب به خانه می‌روم.
    language_code: fa
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Lucrez seara și {item} acasă noaptea.
