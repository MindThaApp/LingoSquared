    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Mănânc pâine și {item} cafea dimineața.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Beau یعنی «می‌نوشم»؛ در رومانیایی eu نمی‌آید چون پایان mănânc و beau خودش «من» را نشان می‌دهد.
    language_code: fa
    direction: rtl
