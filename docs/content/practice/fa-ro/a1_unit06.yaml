templates:
- content_key: practice.fa-ro.ro.a1.unit06.lesson01.choose.001
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Aș dori یعنی «می‌خواستم» و روش مؤدبانه برای درخواست چیزی است؛ برای همهٔ نوشیدنی‌ها یکسان می‌ماند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson01.listen.002
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Apă، cafea، ceai، suc و lapte نوشیدنی‌های پایه‌اند؛ sete (تشنگی) با mi-e در Mi-e sete به کار می‌رود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson01.match.003
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cafea و apă مؤنث‌اند و o می‌گیرند (o cafea)؛ ceai و suc خنثی‌اند و un می‌گیرند (un ceai).
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson01.translate.004
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aș dori یعنی «می‌خواستم»؛ نوشیدنی بعد از آن می‌آید و وقتی یک فنجان یا یک لیوان می‌خواهید، o یا un جلویش می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson01.order.005
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: word_order
  frame:
    text: Aș dori o {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Cafea مؤنث است، پس o می‌گیرد: o cafea. «یک چای» می‌شود un ceai.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson01.fill.006
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: fill_in_blank
  frame:
    text: Aș dori un {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ceai با un می‌آید، نه o: un ceai. با o cafea مقایسه کنید.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson01.translate.007
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: یک قهوه می‌خواستم.
    language_code: fa
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori o {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Aș dori مؤدبانه است و هم با tu و هم با dumneavoastră به کار می‌رود؛ cafea با o می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson01.translate.008
  lesson_content_key: ro.a1.unit06.lesson01.bauturi
  type: translation
  frame:
    text: تشنه‌ام است.
    language_code: fa
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi-e {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mi-e sete تحت‌اللفظی یعنی «تشنگی برای من است»؛ Mi-e foame هم همین‌طور است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson02.choose.001
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Foame یعنی گرسنگی؛ برای «گرسنه‌ام است» می‌گویید Mi-e foame، مثل Mi-e sete.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson02.listen.002
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mâncare یعنی غذا به‌طور کلی؛ pâine، carne، pui و fructe چیزهای مشخصی برای خوردن‌اند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson02.match.003
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Fructe جمع است و یعنی میوه به‌طور کلی؛ pâine، carne و mâncare مفرد و مؤنث‌اند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson02.translate.004
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mâncare واژه‌ی کلی برای غذاست و carne یعنی گوشت؛ pui یعنی مرغ و fructe یعنی میوه.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson02.order.005
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: word_order
  frame:
    text: Aș dori {item} și pui.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item} și pui.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'نان اینجا به o یا un نیازی ندارد: Aș dori pâine și pui، درست مثل Aș dori apă.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson02.fill.006
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Mi-e foame (گرسنه‌ام است) یک عبارت ثابت است: احساس بعد از mi-e می‌آید.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson02.fill.007
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: fill_in_blank
  frame:
    text: Mi-e foame. Aș dori {item}. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pui یعنی مرغ و واژه‌ای است که در منو یا مغازه به کار می‌برید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson02.translate.008
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: یک چای می‌خواستم، لطفاً. (رسمی، برای کسی که با dumneavoastră خطابش می‌کنید)
    language_code: fa
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori un ceai, vă {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Vă rog «لطفاً»ی محترمانه برای dumneavoastră است؛ با دوست می‌گویید te rog.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit06.lesson02.translate.009
  lesson_content_key: ro.a1.unit06.lesson02.va_rog_si_mancare
  type: translation
  frame:
    text: میوه می‌خواستم.
    language_code: fa
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Aș dori {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Fructe جمع است، برای همین قبل از آن o یا un نمی‌آید.
    language_code: fa
    direction: rtl
