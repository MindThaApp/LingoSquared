templates:
- content_key: practice.fa-ro.ro.a1.unit03.lesson01.choose.001
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'روزها و ماه‌ها در رومانیایی با حرف کوچک نوشته می‌شوند: luni، vineri، نه Luni و Vineri.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson01.listen.002
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sâmbătă یعنی شنبه و duminică یعنی یکشنبه؛ هر روز یک کلمه است و هیچ‌کدام حرف بزرگ نمی‌گیرند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson01.match.003
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: از luni تا sâmbătă شش روز از هفت روز هفته است؛ duminică، یعنی یکشنبه، هفته را کامل می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson01.translate.004
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Astăzi یعنی امروز و mâine یعنی فردا؛ ieri هم یعنی دیروز.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson01.order.005
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: word_order
  frame:
    text: Ce {item} este astăzi?
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} este astăzi?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Ce zi este astăzi? روز هفته را می‌پرسد؛ جوابش Astăzi este + روز است: Astăzi este vineri.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson01.translate.006
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: translation
  frame:
    text: امروز جمعه است.
    language_code: fa
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'نام روزهای هفته در رومانیایی با حرف کوچک شروع می‌شود: vineri، نه Vineri.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson01.fill.007
  lesson_content_key: ro.a1.unit03.lesson01.zilele_saptamanii
  type: fill_in_blank
  frame:
    text: Zilele nu se scriu cu {item} mare. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Literă mare یعنی حرف بزرگ؛ رومانیایی روزها و ماه‌ها را با حرف کوچک می‌نویسد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson02.choose.001
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'نام ماه‌ها شبیه نام‌های بین‌المللی‌شان است، ولی با حرف کوچک نوشته می‌شود: aprilie، iulie.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson02.match.002
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'نام ماه‌ها در رومانیایی هیچ‌وقت حرف بزرگ نمی‌گیرد: ianuarie، februarie، martie.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson02.translate.003
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: چند ماه شبیه نام بین‌المللی‌شان هستند (februarie، septembrie)، اما با حرف کوچک نوشته می‌شوند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson02.order.004
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: word_order
  frame:
    text: Astăzi este trei {item}.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este trei {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'تاریخ یعنی عدد + ماه: trei aprilie. اول ماه از întâi استفاده می‌کند، نه unu.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson02.translate.005
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: امروز اول اوت است.
    language_code: fa
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Astăzi este întâi {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'اول ماه întâi است، نه unu: întâi august؛ از دوم به بعد همان عدد ساده را بگویید.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson02.fill.006
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: fill_in_blank
  frame:
    text: La {item} ani! ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La mulți ani! تحت‌اللفظی یعنی «برای سال‌های بسیار»؛ برای تبریک تولد یا سال نو به کار می‌رود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson02.translate.007
  lesson_content_key: ro.a1.unit03.lesson02.lunile_si_datele
  type: translation
  frame:
    text: تاریخ امروز چنده؟
    language_code: fa
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce {item} este astăzi?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce dată este astăzi? تاریخ را می‌پرسد؛ Ce zi este astăzi? روز هفته را می‌پرسد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson03.order.001
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: word_order
  frame:
    text: Mihai, {item} este întâlnirea?
    language_code: ro
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mihai, {item} este întâlnirea?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'Când? یعنی کی؛ جواب روز هفته و تاریخ را بدون هیچ حرف اضافه‌ای می‌گوید: vineri, întâi august.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson03.translate.002
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: translation
  frame:
    text: جلسه کِی است؟
    language_code: fa
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Când este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'روزها و تاریخ‌ها حرف اضافه‌ای لازم ندارند: Întâlnirea este vineri, întâi august.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit03.lesson03.choose.003
  lesson_content_key: ro.a1.unit03.lesson03.cand_ne_intalnim
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lunile یعنی ماه‌ها: luni جمع lună است و نشانه‌ی معرفه‌ی -le به آن اضافه شده؛ luni به‌تنهایی یعنی دوشنبه هم هست.'
    language_code: fa
    direction: rtl
