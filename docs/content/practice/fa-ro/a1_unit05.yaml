    kind: slot_text
    slot: item
  feedback_frame:
    text: Tatăl مذکر است، پس meu می‌گیرد؛ mama مؤنث است و mea می‌گیرد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit05.lesson01.translate.007
