    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mamă و tată شکل ساده‌ی اسم‌ها هستند؛ mama و tatăl در انتها نشانه‌ی شناسایی می‌گیرند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit05.lesson01.translate.004
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: translation
  frame:
    text: '{item}'
    language_code: fa
