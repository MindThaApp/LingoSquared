templates:
- content_key: practice.fa-ro.ro.a1.unit05.lesson01.choose.001
  lesson_content_key: ro.a1.unit05.lesson01.familia_mea
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'meu و mea هر دو یعنی «مال من»: meu با اسم‌های مذکر و خنثی می‌آید (tatăl meu) و mea با اسم‌های مؤنث (mama mea).'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit05.lesson01.listen.002
