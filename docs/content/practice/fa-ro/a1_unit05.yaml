  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'در رومانیایی نشانه‌ی شناسایی در انتهای اسم می‌آید: mamă می‌شود mama و tată می‌شود tatăl.'
    language_code: fa
    direction: rtl
