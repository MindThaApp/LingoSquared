  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Părinți یعنی پدر و مادر و جمع است؛ این دو والد mamă و tată هستند.
    language_code: fa
    direction: rtl
