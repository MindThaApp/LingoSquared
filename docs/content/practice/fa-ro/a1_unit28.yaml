  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ro by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Farsi (Iran)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_atât
    - w_aud
    - w_bucur
    - w_crede
    - w_credeam
    - w_merge
    - w_mers
    - w_mesaj
    - w_mesajul
    - w_minute
    - w_mult
    - w_mândră
    - w_poți
    - w_repede
    - w_repeți
    - w_spun
    - w_sun
    - w_suna
    - w_suni
    - w_trebuie
    - w_trimit
    - w_vorbesc
    - w_vorbi
    - w_vorbiți
    - w_înapoi
    - w_înseamnă
templates:
- content_key: practice.fa-ro.ro.a1.unit28.lesson01.choose.001
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: &id001
      language_code: ro
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_suna
        - w_trebuie
        - w_sun
        - w_vorbesc
        - w_vorbiți
        - w_poți
        - w_repeți
        - w_vorbi
        - w_atât
        - w_repede
        - w_aud
        - w_mesajul
        - w_trimit
        - w_mesaj
        - w_înapoi
        - w_spun
        - w_minute
        - w_suni
        - w_mers
        - w_credeam
        - w_merge
        - w_crede
        - w_bucur
        - w_mândră
        - w_înseamnă
        - w_mult
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های این واحد است، از درس «بهت زنگ می‌زنم».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson02.listen.001
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های این واحد است، از درس «با کی صحبت می‌کنم؟».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson03.translate.001
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های این واحد است، از درس «می‌شه تکرار کنید؟».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson04.match.001
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر کلمهٔ رومانیایی را به معنی فارسی‌اش وصل کنید؛ کلمات از درس‌های همین واحد هستند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson05.choose.001
  lesson_content_key: ro.a1.unit28.lesson05.citim_o_conversatie_prin
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های این واحد است، از درس «خواندن گفتگوی پیامکی».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson06.translate.001
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از واژه‌های این واحد است، از درس «تماس تلفنی بعد از شیفت».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson01.order.002
  lesson_content_key: ro.a1.unit28.lesson01.te_sun
  type: word_order
  frame:
    text: Trebuie să te {item}.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_sun
  answer_derivation:
    kind: render_frame
    frame:
      text: Trebuie să te {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: باید به شما زنگ بزنم. sun یعنی «زنگ می‌زنم».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson02.order.002
  lesson_content_key: ro.a1.unit28.lesson02.cu_cine_vorbesc
  type: word_order
  frame:
    text: Cu cine {item}?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbesc
  answer_derivation:
    kind: render_frame
    frame:
      text: Cu cine {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: با کی صحبت می‌کنم؟ Cu cine vorbesc? (تحت‌اللفظی «با چه کسی صحبت می‌کنم؟») روش معمول پرسیدن هویت تماس‌گیرندهٔ ناشناس است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson03.order.002
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: word_order
  frame:
    text: Poți să {item} asta?
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_repeți
  answer_derivation:
    kind: render_frame
    frame:
      text: Poți să {item} asta?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: می‌شود این را تکرار کنید؟ Poți să ... (می‌توانی ...؟) به‌علاوهٔ repeți (تکرار کنی) و asta (این).
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson03.fill.003
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: fill_in_blank
  frame:
    text: Nu {item} atât de repede, te rog. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_vorbi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: لطفاً این‌قدر تند حرف نزنید. Nu vorbi («حرف نزن») از nu به‌علاوهٔ شکل «تو» ساخته می‌شود؛ atât de repede یعنی «این‌قدر تند».
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson03.translate.004
  lesson_content_key: ro.a1.unit28.lesson03.poti_sa_repeti_asta
  type: translation
  frame:
    text: صدات رو خوب نمی‌شنوم.
    language_code: fa
    direction: rtl
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_aud
  answer_derivation:
    kind: render_frame
    frame:
      text: Nu te {item} bine.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'صدایتان را خوب نمی‌شنوم. Nu te aud bine: aud یعنی «می‌شنوم»، te («تو را») قبل از فعل می‌آید و bine یعنی «خوب».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson04.order.002
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: word_order
  frame:
    text: Îți {item} un mesaj.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_trimit
  answer_derivation:
    kind: render_frame
    frame:
      text: Îți {item} un mesaj.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'برایتان یک پیامک می‌فرستم. Îți («به تو») ضمیر مفعول غیرمستقیم است و قبل از فعل می‌آید: Îți trimit un mesaj.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson04.fill.003
  lesson_content_key: ro.a1.unit28.lesson04.trimiterea_unui_mesaj
  type: fill_in_blank
  frame:
    text: Te sun {item} mai târziu. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
    hint:
      language_code: ro
      part_of_speech: adverb
      agreement_tags:
        semantic: w_înapoi
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'بعداً دوباره بهتان زنگ می‌زنم. Înapoi («دوباره، برگشت») بعد از فعل می‌آید: te sun înapoi یعنی «دوباره بهت زنگ می‌زنم» و mai târziu یعنی «بعداً».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson06.order.002
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: word_order
  frame:
    text: A {item} foarte bine, mai bine decât credeam.
    language_code: ro
    direction: ltr
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_mers
  answer_derivation:
    kind: render_frame
    frame:
      text: A {item} foarte bine, mai bine decât credeam.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: خیلی خوب پیش رفت، بهتر از آنچه فکر می‌کردم. A mers گذشتهٔ a merge (رفتن، اینجا «پیش رفتن») است؛ credeam یعنی «فکر می‌کردم» (شکلی گذشته از a crede).
    language_code: fa
    direction: rtl
- content_key: practice.fa-ro.ro.a1.unit28.lesson06.fill.003
  lesson_content_key: ro.a1.unit28.lesson06.un_apel_dupa_tura
  type: fill_in_blank
  frame:
    text: Îți mulțumesc, {item} mult pentru mine. ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
    hint:
      language_code: ro
      part_of_speech: verb
      agreement_tags:
        semantic: w_înseamnă
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ممنون، این برای من خیلی ارزش دارد. Înseamnă شکل او از a însemna (معنا دادن) است؛ pentru mine («برای من») می‌گوید برای چه کسی مهم است.
    language_code: fa
    direction: rtl
