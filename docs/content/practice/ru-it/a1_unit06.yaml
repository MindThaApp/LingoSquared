templates:
- content_key: practice.ru-it.it.a1.unit06.lesson01.choose.001
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'С притяжательным местоимением существительные, обозначающие родство, в единственном числе употребляются без артикля: mio padre, mia madre.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson01.listen.002
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Padre и madre оба оканчиваются на -e, но разного рода, поэтому запоминай каждое слово вместе с родом; nonno и nonna оканчиваются на -o и -a.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson01.order.003
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: word_order
  frame:
    text: Questo è mio {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Questo è mio {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Questo и mio — мужского рода, поэтому они стоят с существительным мужского рода: questo è mio padre.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson01.fill.004
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: fill_in_blank
  frame:
    text: Questa è mia {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Questa и mia — женского рода и согласуются со словом madre: это моя мама.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson01.translate.005
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: Это моя мама.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Questa è mia {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Questa и mia употребляются с существительным женского рода, questo и mio — с существительным мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson01.translate.006
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Madre и padre, fratello и sorella, nonno и nonna — пары слов о семье: мужской и женский род.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson02.choose.001
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Fratelli — множественное число от fratello, и оно может также означать «братья и сёстры».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson02.listen.002
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marito и moglie — муж и жена; moglie оканчивается на -e, но это слово женского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson02.order.003
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: word_order
  frame:
    text: Ho un fratello e una {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Un стоит с существительным мужского рода, а una — с существительным женского рода: un fratello, una sorella.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson02.fill.004
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: fill_in_blank
  frame:
    text: Hai fratelli o {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Множественное число от sorella — sorelle: окончание -a меняется на -e.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson02.translate.005
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: У меня один брат и одна сестра.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ho означает «у меня есть»; un ставится перед существительным мужского рода, а una — перед существительным женского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson02.translate.006
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: У тебя есть братья или сёстры? (неформально, на «ты»)
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai fratelli o {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai — форма глагола «иметь» для «ты», поэтому такой вопрос задают другу или коллеге.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson03.match.001
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Слова о семье образуют пары мужского и женского рода: marito и moglie, figlio и figlia.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson03.choose.002
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Figli означает «дети» вообще; figlio и figlia — это сын и дочь.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson03.listen.003
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Maschio и femmina используются для обозначения мальчика и девочки в семье.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson03.fill.004
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: fill_in_blank
  frame:
    text: Sì, ho due {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Figli — множественное число от figlio, оно обозначает детей любого пола.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson03.translate.005
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: translation
  frame:
    text: У тебя есть дети? (неформально, на «ты»)
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai figli? — неформальный способ спросить, есть ли у кого-то дети.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit06.lesson03.translate.006
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Figlio и figlia означают «сын» и «дочь»; maschio и femmina обозначают мальчика и девочку среди твоих детей.
    language_code: ru
    direction: ltr
