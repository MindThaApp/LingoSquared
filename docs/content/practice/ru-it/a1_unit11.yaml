    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Faccio {item} alle sette e poi vado al lavoro.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Faccio colazione — устойчивое выражение, означает «завтракать».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson01.fill.004
  lesson_content_key: it.a1.unit11.lesson01.faccio_colazione_vado_al_lavoro
  type: fill_in_blank
  frame:
    text: Vado al lavoro e poi torno a {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A casa значит «дома» или «домой», без артикля.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson01.fill.005
  lesson_content_key: it.a1.unit11.lesson01.faccio_colazione_vado_al_lavoro
