  frame:
    text: Alle dieci vado a {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A letto значит «в постель» или «в постели», без артикля.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson01.translate.006
  lesson_content_key: it.a1.unit11.lesson01.faccio_colazione_vado_al_lavoro
  type: translation
  frame:
    text: Я завтракаю в семь.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Faccio {item} alle sette.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Faccio colazione буквально значит «я делаю завтрак».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson01.translate.007
  lesson_content_key: it.a1.unit11.lesson01.faccio_colazione_vado_al_lavoro
  type: translation
  frame:
    text: Во сколько ты обычно завтракаешь? (неформально, на «ты»)
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: A che ora fai colazione di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di solito значит «обычно»; fai — форма на «ты».
    language_code: ru
    direction: ltr
