- content_key: practice.ru-it.it.a1.unit11.lesson01.choose.001
  lesson_content_key: it.a1.unit11.lesson01.faccio_colazione_vado_al_lavoro
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
