    slot: item
  feedback_frame:
    text: 'Vado и torno — формы «я»: «я иду» и «я возвращаюсь».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson01.order.003
  lesson_content_key: it.a1.unit11.lesson01.faccio_colazione_vado_al_lavoro
