    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Vado и torno — формы «я»; faccio значит «я делаю».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson02.choose.002
  lesson_content_key: it.a1.unit11.lesson02.a_che_ora_torni_a_casa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Torni — форма «ты», а torno — форма «я» глагола tornare.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson02.listen.003
  lesson_content_key: it.a1.unit11.lesson02.a_che_ora_torni_a_casa
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В этом уроке presto значит «рано», как в vado a letto presto.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson02.fill.004
  lesson_content_key: it.a1.unit11.lesson02.a_che_ora_torni_a_casa
  type: fill_in_blank
  frame:
    text: Torno a casa alle sei e {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'E trenta добавляет тридцать минут: alle sei e trenta — это 6:30.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson02.order.005
  lesson_content_key: it.a1.unit11.lesson02.a_che_ora_torni_a_casa
  type: word_order
  frame:
    text: A che ora {item} a casa la sera?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: A che ora {item} a casa la sera?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Torni — неформальная форма на «ты», её используют с друзьями и коллегами.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson02.order.006
  lesson_content_key: it.a1.unit11.lesson02.a_che_ora_torni_a_casa
  type: word_order
  frame:
    text: Vado a letto {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Vado a letto {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Здесь presto значит «рано»; в a presto, «до скорого», оно значит «скоро».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson02.translate.008
  lesson_content_key: it.a1.unit11.lesson02.a_che_ora_torni_a_casa
