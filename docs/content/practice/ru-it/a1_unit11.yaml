    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Vado a letto {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Presto может значить «рано» или «скоро».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson03.choose.001
  lesson_content_key: it.a1.unit11.lesson03.la_mia_giornata
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Anch'io значит «я тоже» и начинает ответ другу.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson03.fill.002
  lesson_content_key: it.a1.unit11.lesson03.la_mia_giornata
  type: fill_in_blank
  frame:
    text: Sì, {item} faccio colazione alle sette. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Anch''io пишется как одно слово с апострофом: «я тоже».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit11.lesson03.translate.003
  lesson_content_key: it.a1.unit11.lesson03.la_mia_giornata
  type: translation
  frame:
    text: Да, я тоже завтракаю в семь.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, {item} faccio colazione alle sette.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Anch'io выражает согласие с собеседником и значит «я тоже».
    language_code: ru
    direction: ltr
