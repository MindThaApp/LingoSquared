    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Читаем программу».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit65.lesson06.translate.001
  lesson_content_key: it.a1.unit65.lesson06.marco_al_cinema
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
