schema_version: '1.0'
pack_key: practice.ru-it.a1.unit65
source_language: ru
target_language: it
unit_content_key: it.a1.unit65.cinema
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_avvincente
    - w_bambini
    - w_guardare
    - w_iniziare
    - w_nuovo
    - w_popcorn
    - w_spettacolo
    - w_vedere
templates:
- content_key: practice.ru-it.it.a1.unit65.lesson01.choose.001
  lesson_content_key: it.a1.unit65.lesson01.voglio_guardare_un_film
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_guardare
        - w_vedere
        - w_spettacolo
        - w_iniziare
        - w_nuovo
        - w_popcorn
        - w_bambini
        - w_avvincente
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Я хочу посмотреть фильм».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit65.lesson02.listen.001
  lesson_content_key: it.a1.unit65.lesson02.quale_film_vuole_vedere
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Какой фильм вы хотите посмотреть?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit65.lesson03.translate.001
  lesson_content_key: it.a1.unit65.lesson03.a_che_ora_inizia
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Во сколько начинается сеанс?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit65.lesson04.match.001
  lesson_content_key: it.a1.unit65.lesson04.al_cinema
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое итальянское слово с его русским значением; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit65.lesson05.choose.001
  lesson_content_key: it.a1.unit65.lesson05.leggere_il_programma
  type: multiple_choice
