  lesson_content_key: it.a1.unit65.lesson01.voglio_guardare_un_film
  type: word_order
  frame:
    text: Voglio {item} un film.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags:
        semantic: w_guardare
  answer_derivation:
    kind: render_frame
    frame:
      text: Voglio {item} un film.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Я хочу посмотреть фильм. guardare означает «смотреть».
    language_code: ru
    direction: ltr
