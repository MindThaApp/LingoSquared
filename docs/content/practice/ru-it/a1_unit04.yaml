    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quando arrivi? — вопрос другу, когда он приезжает; вежливая форма — Quando arriva?
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson03.match.004
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Dopodomani образовано от dopo («после») и domani («завтра»): послезавтра.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson03.translate.005
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Arrivo — «я приезжаю», arrivi — «ты приезжаешь»; меняется только конечная гласная.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson03.translate.006
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: translation
  frame:
    text: Я приезжаю в четверг днём.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Arrivo giovedì {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'В итальянском перед днём недели нет слова, соответствующего русскому «в»: arrivo giovedì — «я приезжаю в четверг».'
    language_code: ru
    direction: ltr
