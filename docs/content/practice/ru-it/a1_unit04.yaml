    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'В словах martedì и mercoledì на конце пишется акцент: последний слог ударный.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson01.order.003
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: word_order
  frame:
    text: Che {item} è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} è oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che giorno è oggi? — вопрос о дне недели; чтобы спросить о числе, говорят Che data è oggi?
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson01.fill.004
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: fill_in_blank
  frame:
    text: Che giorno è {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Oggi — «сегодня», domani — «завтра»; один и тот же вопрос подходит для обоих слов.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson01.match.005
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
