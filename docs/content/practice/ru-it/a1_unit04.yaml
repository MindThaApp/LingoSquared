    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Arrivo — «я приезжаю», arrivi — «ты приезжаешь»; окончание -i указывает на tu.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson03.order.002
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: word_order
  frame:
    text: Quando arrivi a {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Quando arrivi a {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Roma — это Рим; перед названием города ставится предлог a, который передаёт значение «в».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson03.fill.003
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: fill_in_blank
  frame:
