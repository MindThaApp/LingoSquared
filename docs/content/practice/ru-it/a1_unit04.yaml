    slot: item
  feedback_frame:
    text: Итальянские названия дней недели пишутся со строчной буквы.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson01.listen.002
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
