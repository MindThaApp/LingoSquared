  feedback_frame:
    text: 'Итальянские названия месяцев пишутся со строчной буквы: gennaio, febbraio, marzo.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson02.listen.002
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В слове febbraio двойное b; прислушайся к долгому согласному.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson02.order.003
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: word_order
  frame:
    text: Che {item} è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} è oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Data — «дата»; вопрос Che data è oggi? спрашивает о числе и месяце, а не о дне недели.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson02.fill.004
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: fill_in_blank
  frame:
    text: Oggi è il {item} marzo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'В датах используются il и количественное число: il quindici marzo — «пятнадцатое марта».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson02.translate.005
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gennaio, febbraio, marzo и aprile идут в том же порядке, что и месяцы в году.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson02.translate.006
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: translation
  frame:
    text: Сегодня пятое число, месяц — {month}.
    language_code: ru
    direction: ltr
    slot_rendering:
      month: english_gloss
  slots:
    month: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi è il cinque {month}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Сначала называется число, затем месяц: il cinque gennaio — «пятое января».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson03.choose.001
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
