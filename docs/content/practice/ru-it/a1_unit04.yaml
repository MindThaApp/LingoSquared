    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Названия с понедельника по пятницу оканчиваются на -dì (от dies — «день»); sabato и domenica — нет.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson01.translate.006
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: translation
  frame:
    text: Сегодня {day}.
    language_code: ru
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi è {day}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'С днями недели в таком употреблении артикль не нужен: Oggi è lunedì, а не Oggi è il lunedì.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit04.lesson02.choose.001
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
