- content_key: practice.ru-it.it.a1.unit13.lesson01.choose.001
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Andato и andata — это мужская и женская формы прошедшего времени глагола «идти, ехать».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit13.lesson01.listen.002
