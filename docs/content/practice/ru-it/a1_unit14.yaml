templates:
- content_key: practice.ru-it.it.a1.unit14.lesson01.choose.001
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Preferisco — форма для «я», а preferisci — неформальная форма для «ты» глагола preferire.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson01.listen.002
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Preferisco и preferisci различаются только последней гласной.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson01.order.003
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: word_order
  frame:
    text: Preferisci il caffè o il {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Preferisci il caffè o il {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: В слове tè ставится accento, чтобы отличить его от te — «тебя, тебе».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson01.fill.004
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: fill_in_blank
  frame:
    text: Io {item} il caffè. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Preferisco оканчивается на -o, потому что подлежащее — «я».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson01.translate.005
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: translation
  frame:
    text: Ты предпочитаешь кофе или чай? (неформально, tu)
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Preferisci il caffè o il {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Preferisci — неформальная форма глагола для «ты» (tu).
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson03.translate.001
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: translation
  frame:
    text: Я тоже предпочитаю кофе!
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Anch'io {item} il caffè!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Anch'io значит «я тоже», а preferisco — форма для «я».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson03.match.002
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Tè — это «чай»; te — местоимение, которое употребляется после предлога.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson03.choose.003
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Piace используется в mi piace, что значит «мне нравится».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson02.listen.001
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mi piace molto значит «мне очень нравится».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson02.order.002
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: word_order
  frame:
    text: Mi {item} molto il cornetto.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi {item} molto il cornetto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Piace согласуется с тем, что нравится; здесь это единственное число.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson02.fill.003
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: fill_in_blank
  frame:
    text: E a {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A te значит «тебе» и является неформальным способом задать тот же вопрос в ответ.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson02.translate.004
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: translation
  frame:
    text: Мне очень нравится круассан.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi {item} molto il cornetto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Mi piace molto значит «мне очень нравится»; буквально: «очень нравится мне».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson02.translate.005
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: translation
  frame:
    text: А тебе? (неформально, вопрос в ответ после того, как ты сказал, что тебе что-то нравится)
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: E a {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'После предлога, например a, вместо tu используется te: a te — «тебе».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson03.fill.004
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: fill_in_blank
  frame:
    text: A {item} no, preferisco il tè. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A me значит «мне»; после предлога io превращается в me.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson03.translate.005
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: translation
  frame:
    text: Не я, я предпочитаю чай.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: A {item} no, preferisco il tè.
      language_code: it
      direction: ltr
  feedback_frame:
    text: A me no значит «не мне».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit14.lesson01.translate.006
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Preferire — «предпочитать»; preferisco — «я предпочитаю».
    language_code: ru
    direction: ltr
