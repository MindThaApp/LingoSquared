templates:
- content_key: practice.ru-it.it.a1.unit03.lesson01.choose.001
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Uno — число для счёта; перед существительным мужского рода оно сокращается до un, а перед существительным женского рода становится una.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson01.listen.002
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В словах sette и otto есть двойное t; произноси его чуть дольше.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson01.order.003
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: word_order
  frame:
    text: Ho {age} anni.
    language_code: it
    direction: ltr
  slots:
    age: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho {age} anni.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Возраст по-итальянски выражается через avere, «иметь»: ho cinque anni буквально значит «я имею пять лет».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson01.fill.004
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: fill_in_blank
  frame:
    text: Quanti anni {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hai — форма ty глагола avere; при обращении на Lei вопрос звучит Quanti anni ha?
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson01.match.005
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Числа от нуля до десяти — основа; числа от одиннадцати и десятки образуются из них позже.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson01.translate.006
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: translation
  frame:
    text: Мне {age} лет.
    language_code: ru
    direction: ltr
    slot_rendering:
      age: english_gloss
  slots:
    age: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho {age} anni.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Никогда не используй sono для возраста: Ho dieci anni, а не Sono dieci anni.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson02.choose.001
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ne значит «из него» или «из них»: Ne vorrei tre — «я бы взял три из них».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson02.listen.002
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В слове caffè ударение падает на последний слог, и его показывает знак ударения.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson02.order.003
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: word_order
  frame:
    text: Quanto costa un {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costa un {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Costa стоит в единственном числе, поэтому употребляется с одним предметом: Quanto costa un cornetto? Для нескольких предметов говорят costano.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson02.fill.004
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: fill_in_blank
  frame:
    text: Ne {item} tre, grazie. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vorrei — вежливый способ заказать или попросить что-то, мягче, чем «хочу».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson02.translate.005
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cinquanta — пятьдесят; итальянские десятки, начиная с сорока, оканчиваются на -anta.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson02.translate.006
  lesson_content_key: it.a1.unit03.lesson02.quanto_costa_al_bar
  type: translation
  frame:
    text: Сколько стоит {item}?
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costa un {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'В Quanto costa? не нужно вспомогательного слова: quanto, «сколько», плюс costa, «стоит».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson03.choose.001
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tuo и mio меняются по роду; здесь оба мужского рода, потому что numero мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson03.order.002
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: word_order
  frame:
    text: Qual è il tuo numero di {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Qual è il tuo numero di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Qual — сокращение от quale; оно теряет конечное e перед формой глагола essere.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson03.fill.003
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: fill_in_blank
  frame:
    text: Qual è il {item} numero di telefono? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il tuo numero спрашивает о номере собеседника; il mio numero — ответ с твоим собственным номером.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson03.match.004
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Il — определённый артикль мужского рода в единственном числе; numero и telefono оба мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson03.translate.005
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Perfetto согласуется с тем, что описывает: с существительным женского рода оно превращается в perfetta.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit03.lesson03.translate.006
  lesson_content_key: it.a1.unit03.lesson03.il_numero_di_telefono
  type: translation
  frame:
    text: Какой у тебя номер телефона?
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Qual è il tuo numero di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Tuo — неформальное «твой»; при обращении на Lei скажешь il Suo numero.
    language_code: ru
    direction: ltr
