    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mi fa male la testa значит «у меня болит голова».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson01.order.003
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
  type: word_order
  frame:
    text: Mi fa male la {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi fa male la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mi fa male плюс la и название части тела говорят о том, что эта часть тела болит.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson01.fill.004
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
  type: fill_in_blank
  frame:
    text: Mi fa {item} la testa. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mi fa male буквально значит «мне делает больно».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson01.translate.005
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
  type: translation
  frame:
    text: У меня болит голова.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi fa male la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Название части тела стоит после mi fa male и употребляется с la.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson01.translate.006
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
  type: translation
  frame:
    text: У меня болит горло.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi fa male la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Gola — женского рода, поэтому с ним употребляется la.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson02.choose.001
  lesson_content_key: it.a1.unit16.lesson02.non_mi_sento_bene
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В ho la febbre и ho la tosse используется ho («у меня есть») вместе с la.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson02.order.002
  lesson_content_key: it.a1.unit16.lesson02.non_mi_sento_bene
  type: word_order
  frame:
    text: Ho la {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ho la febbre значит «у меня температура»; ho la tosse значит «у меня кашель».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson02.fill.003
  lesson_content_key: it.a1.unit16.lesson02.non_mi_sento_bene
  type: fill_in_blank
  frame:
    text: Oggi non mi {item} bene. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Mi sento — форма для «я»: я чувствую себя.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson02.translate.004
  lesson_content_key: it.a1.unit16.lesson02.non_mi_sento_bene
  type: translation
  frame:
    text: У меня температура.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'По-итальянски говорят ho la febbre, с артиклем la, а в русском артикля нет: «у меня температура».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson02.translate.005
  lesson_content_key: it.a1.unit16.lesson02.non_mi_sento_bene
  type: translation
  frame:
    text: Сегодня я плохо себя чувствую.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi non mi {item} bene.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Non mi sento bene значит «я плохо себя чувствую».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson03.choose.001
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dottore — врач-мужчина, а dottoressa — врач-женщина.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson03.listen.002
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Devo значит «я должен», и после него стоит инфинитив, например andare.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson03.order.003
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: word_order
  frame:
    text: Devo {item} dal dottore.
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Devo {item} dal dottore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Devo плюс инфинитив значит «мне нужно что-то сделать».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson03.fill.004
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: fill_in_blank
  frame:
    text: Prendi questa medicina e {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Riposa — повелительная форма на «ты»: отдыхай.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson03.translate.005
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: translation
  frame:
    text: Мне нужно идти к врачу (мужчине).
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Devo andare dal {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Dal — это da плюс il: так говорят, когда идут к человеку, поэтому dal dottore значит «к врачу».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson03.translate.006
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: translation
  frame:
    text: Прими это лекарство и отдыхай. (на «ты»)
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Prendi questa {item} e riposa.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Prendi и riposa — это неформальные формы повелительного наклонения, для того, к кому ты обращаешься на ty.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson03.match.007
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
