templates:
- content_key: practice.ru-it.it.a1.unit16.lesson01.choose.001
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La testa, la pancia и la gola — все женского рода, поэтому с ними употребляется la.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit16.lesson01.listen.002
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
  type: listen_select
