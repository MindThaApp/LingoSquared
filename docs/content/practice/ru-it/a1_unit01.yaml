templates:
- content_key: practice.ru-it.it.a1.unit01.lesson01.choose.001
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu говорят друзьям, родным и ровесникам; Lei с заглавной L — вежливая форма для незнакомых, людей старшего возраста и в деловой обстановке.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson01.listen.002
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ciao подходит и для «привет», и для «пока», а buongiorno — вежливое приветствие в дневное время.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson01.order.003
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: word_order
  frame:
    text: Ciao, come {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Come stai? — так спрашивают у друга, как дела; незнакомому человеку скажут Come sta?
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson01.match.004
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Многие итальянские прилагательные на -ale похожи на русские слова: informale — неформальный, formale — формальный.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson01.translate.005
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Rispettoso сочетается с формальным Lei: оно выражает уважение к людям, которых ты плохо знаешь.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson01.translate.006
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: Привет, как дела? (неформально, другу)
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Stai — форма для tu; вежливая форма Lei того же вопроса — Buongiorno, come sta?
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson02.choose.001
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Arrivederla — формальное прощание; окончание -la относится к Lei. С друзьями итальянцы говорят ciao.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson02.listen.002
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buonasera — вечернее приветствие; buonanotte говорят только тому, кто идёт спать.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson02.order.003
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: word_order
  frame:
    text: Ciao, ci {item} domani!
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, ci {item} domani!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo буквально значит «мы видим друг друга»; это повседневный способ сказать «увидимся».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson02.fill.004
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: fill_in_blank
  frame:
    text: Arrivederla, a {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A domani значит «до завтра»; a входит в устойчивое выражение.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson02.translate.005
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bene отвечает на Come stai? и может использоваться отдельно в значении «хорошо».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson03.choose.001
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scusi — вежливый способ привлечь внимание незнакомого человека; это формальная форма (Lei).
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson03.listen.002
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Benvenuto — мужской род; когда приветствуют женщину, говорят benvenuta.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson03.order.003
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: word_order
  frame:
    text: Mi chiamo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mi chiamo буквально значит «я называю себя»; имя просто стоит в конце.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson03.fill.004
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: fill_in_blank
  frame:
    text: Come ti {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ti — форма для «ты»; с Lei вопрос звучит Come si chiama?
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson03.match.005
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Piacere — это и существительное «удовольствие», и фраза, которую говорят при знакомстве: «приятно познакомиться».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson03.translate.006
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mille значит «тысяча», поэтому grazie mille — тёплое «большое спасибо».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit01.lesson03.translate.007
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: Меня зовут Элена.
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Как и по-русски «меня зовут», итальянцы говорят mi chiamo — «я называюсь», а не «моё имя».
    language_code: ru
    direction: ltr
