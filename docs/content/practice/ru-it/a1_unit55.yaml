  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_stagione
        - w_adesso
        - w_primavera
        - w_estate
        - w_autunno
        - w_inverno
        - w_trovi
        - w_bella
