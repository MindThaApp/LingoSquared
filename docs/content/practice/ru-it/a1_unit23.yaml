    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Pronto, {item} parla?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Pronto — ответ на звонок, а chi значит «кто».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit23.lesson01.translate.007
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: translation
  frame:
    text: Я отправляю тебе сообщение.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Ti {item} un messaggio.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ti значит «тебе» и стоит перед глаголом.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit23.lesson01.translate.008
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Как приветствие pronto используется только по телефону; в других случаях оно значит «готов».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit23.lesson02.choose.001
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Puoi — неформальная форма глагола potere на «ты»: ты можешь.'
    language_code: ru
    direction: ltr
