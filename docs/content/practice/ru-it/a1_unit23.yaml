  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: word_order
  frame:
    text: Sam, puoi {item}, per favore?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sam, puoi {item}, per favore?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Puoi + инфинитив — так просят кого-то что-то сделать.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit23.lesson02.order.003
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: word_order
  frame:
    text: Parla più {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parla più {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Più piano значит «помедленнее».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit23.lesson02.fill.004
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: fill_in_blank
  frame:
    text: Sam, {item} ripetere, per favore? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Puoi оканчивается на -i, потому что это форма на «ты».
    language_code: ru
    direction: ltr
