  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: translation
  frame:
    text: Сэм, ты можешь повторить, пожалуйста? (неформально, на «ты»)
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Sam, {item} ripetere, per favore?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Puoi — неформальная форма, её используют с другом.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit23.lesson02.translate.006
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: translation
  frame:
    text: Говори помедленнее, пожалуйста. (неформально, на «ты»)
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parla più {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Piano может значить «медленный» или «медленно».
    language_code: ru
    direction: ltr
