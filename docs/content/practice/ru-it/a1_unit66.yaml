review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_chiudere
    - w_concerto
    - w_guida
    - w_mostra
    - w_quadri
    - w_quadro
    - w_sala
    - w_serve
    - w_visitare
    - w_visito
templates:
- content_key: practice.ru-it.it.a1.unit66.lesson01.choose.001
  lesson_content_key: it.a1.unit66.lesson01.voglio_andare_al_museo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_visitare
        - w_mostra
        - w_visito
        - w_chiudere
        - w_guida
        - w_serve
        - w_sala
        - w_quadro
        - w_quadri
        - w_concerto
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Я хочу пойти в музей».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit66.lesson02.listen.001
