  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_belle
    - w_fiore
    - w_libreria
    - w_mazzo
    - w_nastro
    - w_rose
    - w_rossa
    - w_tulipano
templates:
- content_key: practice.ru-it.it.a1.unit78.lesson01.choose.001
  lesson_content_key: it.a1.unit78.lesson01.andiamo_in_fioreria
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_fiore
        - w_mazzo
        - w_rossa
        - w_tulipano
        - w_rose
        - w_nastro
        - w_belle
        - w_libreria
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Сходим в цветочный магазин?».'
    language_code: ru
    direction: ltr
