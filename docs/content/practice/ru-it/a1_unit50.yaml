schema_version: '1.0'
pack_key: practice.ru-it.a1.unit50
source_language: ru
target_language: it
unit_content_key: it.a1.unit50.quartiere
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_abito
    - w_conosce
    - w_conoscere
    - w_conosco
    - w_conoscono
    - w_cordiale
    - w_passi
    - w_quartiere
    - w_saluta
    - w_salutare
    - w_saluto
    - w_supermercato
    - w_vicina
templates:
- content_key: practice.ru-it.it.a1.unit50.lesson01.choose.001
  lesson_content_key: it.a1.unit50.lesson01.il_quartiere
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_quartiere
        - w_abito
        - w_supermercato
        - w_conoscere
        - w_conosco
        - w_vicina
        - w_cordiale
        - w_salutare
        - w_saluto
        - w_saluta
        - w_passi
        - w_conosce
        - w_conoscono
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о районе.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit50.lesson02.listen.001
  lesson_content_key: it.a1.unit50.lesson02.il_mio_vicino_e
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о соседе и соседке.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit50.lesson03.translate.001
  lesson_content_key: it.a1.unit50.lesson03.cordiale_e_salutare
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о приветливости и приветствиях.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit50.lesson05.match.001
  lesson_content_key: it.a1.unit50.lesson05.chi_e_chi_nel
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Соедини каждое итальянское слово с его русским значением; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
