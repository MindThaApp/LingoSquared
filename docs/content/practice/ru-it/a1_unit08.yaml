templates:
- content_key: practice.ru-it.it.a1.unit08.lesson01.choose.001
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mele — множественное число от mela: существительные женского рода на -a образуют множественное число на -e.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson01.listen.002
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mele, banane и patate — женский род, множественное число, и берут le; pomodori — мужской род, множественное число, и берёт i.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson01.order.003
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: word_order
  frame:
    text: Quanto costano le {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costano le {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Le употребляется с существительными женского рода во множественном числе, а costano — глагол во множественном числе, потому что речь о цене нескольких предметов.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson01.order.004
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: word_order
  frame:
    text: Quanto costano i {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costano i {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Pomodori — мужской род, множественное число, поэтому берёт i, а не le.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson01.fill.005
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: fill_in_blank
  frame:
    text: Costano tre euro al {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al chilo значит «за килограмм» — обычный способ указывать цену овощей и фруктов.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson01.fill.006
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: fill_in_blank
  frame:
    text: Quanto {item} le mele? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mele — множественное число, поэтому глагол costano, а не costa.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson03.match.001
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: В Италии цену на фрукты и овощи обычно указывают за килограмм.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson01.translate.007
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: Сколько стоят яблоки?
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto {item} le mele?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'С существительными во множественном числе используется costano: quanto costano le mele.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson01.translate.008
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: Они стоят три евро за килограмм.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costano tre euro al {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'После числительного euro в итальянском не меняется: tre euro.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson01.translate.009
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: Я бы хотел килограмм яблок, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un {item} di mele, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Di связывает количество с товаром: un chilo di mele.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson01.translate.010
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mele, banane, pomodori и patate здесь стоят во множественном числе, потому что их покупают килограммами.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson03.choose.002
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lo prendo значит «я беру это»; lo относится к предмету мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson03.listen.003
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Va bene — очень распространённый способ сказать «хорошо».
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson03.fill.004
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: fill_in_blank
  frame:
    text: Va bene, {item} prendo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Lo значит «его/это» и стоит перед глаголом: lo prendo.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson03.order.005
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: word_order
  frame:
    text: Va bene, lo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Prendo — форма «я» глагола prendere, «брать»; так соглашаются на цену.
    language_code: ru
    direction: ltr
- content_key: practice.ru-it.it.a1.unit08.lesson03.translate.006
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: translation
  frame:
    text: Хорошо, я его беру.
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Va bene, lo prendo — стандартная фраза, которой завершают покупку.
    language_code: ru
    direction: ltr
