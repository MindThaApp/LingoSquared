schema_version: '1.0'
pack_key: practice.ko-pl.a1.unit42
source_language: ko
target_language: pl
unit_content_key: pl.a1.unit42.nocleg
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_hasło
    - w_jedenastej
    - w_karcie
    - w_klucz
    - w_mieliśmy
    - w_minął
    - w_noc
    - w_recepcjonista
    - w_rezerwację
    - w_wifi
    - w_wliczone
    - w_wymeldowanie
    - w_wymeldować
    - w_zaczyna
    - w_zameldować
    - w_zameldujemy
    - w_zarezerwowany
    - w_zarezerwować
    - w_ósmej
    - w_ładny
templates:
- content_key: practice.ko-pl.pl.a1.unit42.lesson01.choose.001
  lesson_content_key: pl.a1.unit42.lesson01.rezerwacja_pokoju
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_zarezerwować
        - w_zameldować
        - w_zameldujemy
        - w_zarezerwowany
        - w_zaczyna
        - w_ósmej
        - w_wliczone
        - w_klucz
        - w_hasło
        - w_wifi
        - w_karcie
        - w_recepcjonista
        - w_rezerwację
        - w_noc
        - w_wymeldowanie
        - w_jedenastej
        - w_wymeldować
        - w_minął
        - w_mieliśmy
        - w_ładny
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 객실 예약하기 수업에 나와요.'
    language_code: ko
    direction: ltr
