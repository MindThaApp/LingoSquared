schema_version: '1.0'
pack_key: practice.ko-pl.a1.unit34
source_language: ko
target_language: pl
unit_content_key: pl.a1.unit34.poczta
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_adres
    - w_babci
    - w_czasownikiem
    - w_dni
    - w_dokonanym
    - w_dostawy
    - w_dotrze
    - w_dotrzeć
    - w_dziadka
    - w_kupuje
    - w_list
    - w_listu
    - w_oznacza
    - w_paczce
    - w_paczka
    - w_pisać
    - w_pisze
    - w_piszę
    - w_poczcie
    - w_pracownik
    - w_przyszłość
    - w_znaczek
templates:
- content_key: practice.ko-pl.pl.a1.unit34.lesson01.choose.001
  lesson_content_key: pl.a1.unit34.lesson01.list_i_paczka
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_list
        - w_dziadka
        - w_paczka
        - w_babci
        - w_znaczek
        - w_listu
        - w_adres
        - w_pisać
        - w_piszę
        - w_paczce
        - w_dotrzeć
        - w_dotrze
        - w_czasownikiem
        - w_dokonanym
        - w_oznacza
        - w_przyszłość
        - w_dostawy
        - w_dni
        - w_pracownik
        - w_kupuje
        - w_poczcie
        - w_pisze
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 편지와 소포 수업에 나오는 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit34.lesson02.listen.001
  lesson_content_key: pl.a1.unit34.lesson02.znaczek_adres_i_pisanie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 우표와 주소와 쓰기 수업에 나오는 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit34.lesson03.translate.001
  lesson_content_key: pl.a1.unit34.lesson03.dotarcie_i_czas_przesylki
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 도착하다와 시간이 걸리다 수업에 나오는 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit34.lesson04.match.001
  lesson_content_key: pl.a1.unit34.lesson04.na_poczcie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 폴란드어 단어를 그 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit34.lesson05.choose.001
  lesson_content_key: pl.a1.unit34.lesson05.ewa_wysyla_paczke
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어로, Ewa가 소포를 보내는 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit34.lesson01.translate.002
  lesson_content_key: pl.a1.unit34.lesson01.list_i_paczka
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 편지와 소포 수업에 나오는 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit34.lesson01.order.003
  lesson_content_key: pl.a1.unit34.lesson01.list_i_paczka
  type: word_order
  frame:
    text: Mam {item} dla dziadka.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_list
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} dla dziadka.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 할아버지께 드릴 편지가 있어요. list는 '편지'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit34.lesson01.fill.004
  lesson_content_key: pl.a1.unit34.lesson01.list_i_paczka
  type: fill_in_blank
  frame:
    text: Wysyłam list i paczkę do {item} i babci w Gdańsku. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_dziadka
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_dziadka
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 저는 Gdańsk에 계신 할아버지와 할머니께 편지와 소포를 보내요. dziadka는 '할아버지'라는 뜻이에요('~을 위한' 뒤의 형태).
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit34.lesson01.translate.005
  lesson_content_key: pl.a1.unit34.lesson01.list_i_paczka
  type: translation
  frame:
    text: Ewa는 할아버지와 할머니께 소포를 보내요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_babci
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa wysyła paczkę do dziadka i {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa는 할아버지와 할머니께 소포를 보내요. babci는 '할머니'라는 뜻이에요('~을 위한' 뒤의 형태).
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit34.lesson02.order.002
  lesson_content_key: pl.a1.unit34.lesson02.znaczek_adres_i_pisanie
  type: word_order
  frame:
    text: Kupuję {item} do listu.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_znaczek
  answer_derivation:
