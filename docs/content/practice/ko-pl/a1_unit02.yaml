templates:
- content_key: practice.ko-pl.pl.a1.unit02.lesson01.choose.001
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 폴란드어에는 1부터 10까지의 숫자를 이어 주는 규칙이 없어서 단어를 하나씩 따로 외워야 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson01.listen.002
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 폴란드어 sz는 '시'에 가까운 소리, cz는 '치'에 가까운 소리라서 sześć와 cztery는 그 소리로 시작해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson01.translate.003
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: pięć, sześć, dziewięć, dziesięć 끝의 ć는 부드러운 '치'에 가까운 소리예요. 철자에서는 악센트 부호가 중요해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson01.match.004
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Pięć, sześć, dziewięć, dziesięć는 ć로 끝나지만 siedem과 osiem은 그렇지 않아서 철자마다 주의해야 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson01.order.005
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: word_order
  frame:
    text: Mam {item} lat.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} lat.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Mam + 숫자 + lat은 나이를 말하는 표현이에요. 예: Mam trzydzieści lat.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson02.listen.001
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ile는 '얼마' 또는 '몇'을 묻는 말이고, kosztuje는 가격을 물을 때 함께 쓰는 동사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson02.choose.002
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 11~15에 해당하는 jedenaście, dwanaście, piętnaście는 -naście로 끝나서 십몇 숫자임을 알 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson02.translate.003
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ile는 가격을 물을 때는 '얼마', 셀 수 있는 것을 물을 때는 '몇'을 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson02.order.004
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: To kosztuje {item} złotych.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje {item} złotych.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: pięć, dwanaście, trzydzieści 같은 숫자 뒤에는 złotych가 오고, dwa, trzy, cztery 뒤에는 złote가 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson02.fill.005
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: To kosztuje dwadzieścia {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Złotych는 pięć, dwadzieścia, pięćdziesiąt 등의 숫자 뒤에 쓰는 형태이고, dwa, trzy, cztery 뒤에는 złote를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson02.translate.006
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: 이건 얼마예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile to kosztuje?는 가격을 묻는 기본 질문이고, to는 '이것' 또는 '그것'을 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson03.choose.001
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pana는 남성에게 쓰는 격식 있는 '당신의'(pana numer)이고, twój는 편한 '너의'(twój numer)예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson03.translate.002
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Numer telefonu는 문자 그대로 '전화의 번호'라는 뜻이고, 두 번째 단어는 '전화'를 뜻하는 단어가 변한 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson03.order.003
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: Jaki jest {item} numer telefonu?
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest {item} numer telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój는 편한 '너의', pana는 남성에게 쓰는 격식 있는 '당신의'예요. numer telefonu 앞에는 둘 다 쓸 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson03.fill.004
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: Ile masz {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Lat은 pięć, dwadzieścia, trzydzieści 같은 숫자 뒤에 오고, lata는 dwa, trzy, cztery와 이것으로 끝나는 숫자 뒤에 와요. 예: trzydzieści dwa lata.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson03.translate.005
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: 저는 서른두 살이에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam trzydzieści dwa {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 숫자가 dwa로 끝나기 때문에 '살, 해'를 뜻하는 단어는 lat이 아니라 lata예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit02.lesson03.translate.006
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: 네 전화번호는 뭐니? (친한 사이, jest 사용)
    language_code: ko
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest twój {item} telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój는 편한 '너의'이고, 남성에게 쓰는 격식 있는 표현은 Jaki jest pana numer telefonu?예요.
    language_code: ko
    direction: ltr
