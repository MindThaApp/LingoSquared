schema_version: '1.0'
pack_key: practice.ko-pl.a1.unit23
source_language: ko
target_language: pl
unit_content_key: pl.a1.unit23.pieniadze
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_dania
    - w_dwie
    - w_dzisiaj
    - w_gotówką
    - w_główne
    - w_kartą
    - w_kawy
    - w_osobno
    - w_podzielimy
    - w_podzielić
    - w_pomogłaś
    - w_pomysł
    - w_poprosimy
    - w_potrzebuję
    - w_płaci
    - w_płacić
    - w_płacę
    - w_reszta
    - w_reszty
    - w_strony
    - w_sumie
    - w_zapłacono
templates:
- content_key: practice.ko-pl.pl.a1.unit23.lesson01.choose.001
  lesson_content_key: pl.a1.unit23.lesson01.ile_to_kosztuje_w
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_sumie
        - w_płacić
        - w_kartą
        - w_gotówką
        - w_płacę
        - w_podzielimy
        - w_osobno
        - w_podzielić
        - w_reszta
        - w_potrzebuję
        - w_reszty
        - w_dania
        - w_główne
        - w_dwie
        - w_kawy
        - w_zapłacono
        - w_poprosimy
        - w_pomysł
        - w_dzisiaj
        - w_pomogłaś
        - w_strony
        - w_płaci
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어로, ''총 얼마예요?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson02.listen.001
  lesson_content_key: pl.a1.unit23.lesson02.karta_czy_gotowka
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어로, ''카드 또는 현금?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson03.translate.001
  lesson_content_key: pl.a1.unit23.lesson03.dzielenie_rachunku
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어로, ''계산 나누기'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson04.match.001
  lesson_content_key: pl.a1.unit23.lesson04.reszta
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 폴란드어 단어를 그 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson05.choose.001
  lesson_content_key: pl.a1.unit23.lesson05.czytanie_rachunku_z_restauracji
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어로, ''식당 영수증 읽기'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson06.translate.001
  lesson_content_key: pl.a1.unit23.lesson06.ewa_i_marek_placa
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — Ewa와 Marek이 계산서를 내는 수업에 나온 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson01.order.002
  lesson_content_key: pl.a1.unit23.lesson01.ile_to_kosztuje_w
  type: word_order
  frame:
    text: Ile to kosztuje w {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_sumie
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to kosztuje w {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 총 얼마예요? W sumie(총, 합쳐서)는 물건 하나의 가격이 아니라 전체를 합친 가격을 알고 싶다는 뜻을 분명히 해 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson02.order.002
  lesson_content_key: pl.a1.unit23.lesson02.karta_czy_gotowka
  type: word_order
  frame:
    text: Czy mogę tu zapłacić {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_kartą
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy mogę tu zapłacić {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 여기서 카드로 결제할 수 있나요? kartą는 카드로라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson02.fill.003
  lesson_content_key: pl.a1.unit23.lesson02.karta_czy_gotowka
  type: fill_in_blank
  frame:
    text: Czy chce pan zapłacić {item}, czy kartą? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_gotówką
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_gotówką
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 현금으로 내시겠어요, 카드로 내시겠어요? Czy chce pan ...?는 Czy chcesz ...?의 격식 있는 형태로, 여기서는 낯선 계산원이 써요(남성에게는 pan, 여성에게는 pani).
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson03.order.002
  lesson_content_key: pl.a1.unit23.lesson03.dzielenie_rachunku
  type: word_order
  frame:
    text: Może {item} rachunek?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_podzielimy
  answer_derivation:
    kind: render_frame
    frame:
      text: Może {item} rachunek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 우리 계산서를 나눠 낼까요? podzielimy는 '우리가 나눌 것이다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson03.fill.003
  lesson_content_key: pl.a1.unit23.lesson03.dzielenie_rachunku
  type: fill_in_blank
  frame:
    text: Czy mogę zapłacić {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_osobno
    hint:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_osobno
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '따로 계산해도 될까요? Osobno(따로)는 zapłacić(지불하다, 완료상: 한 번의 끝나는 결제)와 함께 써요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson04.order.002
  lesson_content_key: pl.a1.unit23.lesson04.reszta
  type: word_order
  frame:
    text: Oto pana {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_reszta
  answer_derivation:
    kind: render_frame
    frame:
      text: Oto pana {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 거스름돈 여기 있습니다. reszta는 거스름돈(돌려받는 돈)이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson04.fill.003
  lesson_content_key: pl.a1.unit23.lesson04.reszta
  type: fill_in_blank
  frame:
    text: Nie {item} reszty. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_potrzebuję
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_potrzebuję
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '거스름돈은 필요 없어요. Nie potrzebuję + 생격: 부정문에서는 목적어가 생격이 되므로 reszty가 돼요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson06.order.002
  lesson_content_key: pl.a1.unit23.lesson06.ewa_i_marek_placa
  type: word_order
  frame:
    text: Może {item} o rachunek?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poprosimy
  answer_derivation:
    kind: render_frame
    frame:
      text: Może {item} o rachunek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: '계산서를 부탁할까요? Poprosić o(~을 요청하다) 뒤에는 대격이 와요: o rachunek. Poprosimy는 완료상 미래형이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit23.lesson06.fill.003
  lesson_content_key: pl.a1.unit23.lesson06.ewa_i_marek_placa
  type: fill_in_blank
  frame:
    text: Marek {item} rachunek. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_płaci
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_płaci
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Marek이 계산서를 계산해요. Płaci는 płacić(지불하다)의 on/ona/ono 형태예요.
    language_code: ko
    direction: ltr
