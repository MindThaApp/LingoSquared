schema_version: '1.0'
pack_key: practice.ko-pl.a1.unit40
source_language: ko
target_language: pl
unit_content_key: pl.a1.unit40.zguba
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_dosyć
    - w_emocji
    - w_idziemy
    - w_informacja
    - w_informacji
    - w_kurtki
    - w_plecak
    - w_portfel
    - w_szuka
    - w_zajrzyj
    - w_zgubiony
    - w_zgubił
    - w_znaleziony
    - w_został
templates:
- content_key: practice.ko-pl.pl.a1.unit40.lesson01.choose.001
  lesson_content_key: pl.a1.unit40.lesson01.zgubione_i_znalezione
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_zgubiony
        - w_zgubił
        - w_znaleziony
        - w_został
        - w_plecak
        - w_informacji
        - w_portfel
        - w_informacja
        - w_idziemy
        - w_szuka
        - w_zajrzyj
        - w_kurtki
        - w_dosyć
        - w_emocji
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. 분실과 습득에 관한 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit40.lesson02.listen.001
  lesson_content_key: pl.a1.unit40.lesson02.telefon_plecak_i_portfel
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. 휴대폰, 배낭, 지갑에 관한 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
