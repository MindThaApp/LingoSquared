  frame:
    text: Ewa {item} komputera. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_używa
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_używa
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ewa는 컴퓨터를 사용해요. używa는 '그/그녀가 사용해요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit29.lesson01.translate.004
  lesson_content_key: pl.a1.unit29.lesson01.telefon_komputer_i_internet
  type: translation
  frame:
    text: 집에 인터넷 있어요?
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_internet
  answer_derivation:
    kind: render_frame
    frame:
      text: Masz {item} w domu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 집에 인터넷이 있어요? internet은 인터넷이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit29.lesson02.order.002
  lesson_content_key: pl.a1.unit29.lesson02.aplikacja_i_wysylanie_wiadomosci
