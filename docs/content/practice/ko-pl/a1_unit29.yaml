    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit29.lesson01.order.002
  lesson_content_key: pl.a1.unit29.lesson01.telefon_komputer_i_internet
  type: word_order
  frame:
    text: Marek ma {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_telefon
  answer_derivation:
    kind: render_frame
    frame:
      text: Marek ma {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Marek은 휴대폰이 있어요. telefon은 '전화기, 휴대폰'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit29.lesson01.fill.003
  lesson_content_key: pl.a1.unit29.lesson01.telefon_komputer_i_internet
