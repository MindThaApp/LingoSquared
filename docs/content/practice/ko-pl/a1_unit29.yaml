      agreement_tags:
        semantic: w_pogody
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_pogody
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 저는 일기 예보를 확인해요. pogody는 '날씨의'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit29.lesson02.translate.004
  lesson_content_key: pl.a1.unit29.lesson02.aplikacja_i_wysylanie_wiadomosci
  type: translation
  frame:
    text: 앱으로 메시지를 보낼게요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_wiadomość
  answer_derivation:
    kind: render_frame
    frame:
      text: Wysyłam {item} przez aplikację.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 앱으로 메시지를 보낼게요. wiadomość는 '메시지'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit29.lesson03.order.002
  lesson_content_key: pl.a1.unit29.lesson03.sprawdzanie_czegos
  type: word_order
  frame:
    text: Tomek {item} prognozę pogody.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_sprawdza
  answer_derivation:
    kind: render_frame
    frame:
      text: Tomek {item} prognozę pogody.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Tomek은 일기 예보를 확인해요. sprawdza는 '그/그녀가 확인해요, 찾아봐요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit29.lesson04.order.002
  lesson_content_key: pl.a1.unit29.lesson04.ewa_wysyla_wiadomosc
  type: word_order
  frame:
    text: W sobotę jest {item}!
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_słonecznie
  answer_derivation:
    kind: render_frame
    frame:
      text: W sobotę jest {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 토요일은 날씨가 화창해요! Słonecznie는 부사예요. jest słonecznie는 '날씨가 화창해요'라는 뜻이고, 주어가 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit29.lesson05.order.002
  lesson_content_key: pl.a1.unit29.lesson05.kto_czego_uzywa
  type: word_order
  frame:
    text: Tomek {item} ranka sprawdza prognozę pogody.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_każdego
  answer_derivation:
    kind: render_frame
    frame:
      text: Tomek {item} ranka sprawdza prognozę pogody.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Tomek은 매일 아침 일기 예보를 확인해요. każdego는 '매, 각(하루하루의)'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit29.lesson06.order.002
  lesson_content_key: pl.a1.unit29.lesson06.do_soboty_w_parku
  type: word_order
  frame:
    text: Wolę pływać, ale też {item} do parku.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_przyjdę
  answer_derivation:
    kind: render_frame
    frame:
      text: Wolę pływać, ale też {item} do parku.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: '저는 수영하는 게 더 좋지만, 공원에도 갈 거예요. Wolę는 ''저는 ~을 더 좋아해요''라는 뜻이고 부정사가 뒤따라요: wolę pływać.'
    language_code: ko
    direction: ltr
