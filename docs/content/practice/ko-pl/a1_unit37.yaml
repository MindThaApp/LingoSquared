schema_version: '1.0'
pack_key: practice.ko-pl.a1.unit37
source_language: ko
target_language: pl
unit_content_key: pl.a1.unit37.kolory
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_biały
    - w_chciałaby
    - w_czerwony
    - w_fioletowy
    - w_idą
    - w_językową
    - w_kawiarnię
    - w_koloru
    - w_kończy
    - w_kupują
    - w_kwiatowy
    - w_pomarańczowy
    - w_różowy
    - w_targ
    - w_tulipany
    - w_tulipanów
    - w_tutaj
    - w_upiększają
    - w_wybierasz
    - w_ładne
    - w_żółty
templates:
- content_key: practice.ko-pl.pl.a1.unit37.lesson01.choose.001
  lesson_content_key: pl.a1.unit37.lesson01.czerwony_i_zolty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_tulipany
        - w_tutaj
        - w_czerwony
        - w_żółty
        - w_koloru
        - w_biały
        - w_pomarańczowy
        - w_różowy
        - w_wybierasz
        - w_kończy
        - w_fioletowy
        - w_tulipanów
        - w_idą
        - w_targ
        - w_kwiatowy
        - w_chciałaby
        - w_kupują
        - w_ładne
        - w_upiększają
        - w_kawiarnię
        - w_językową
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 빨강과 노랑 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit37.lesson02.listen.001
  lesson_content_key: pl.a1.unit37.lesson02.bialy_i_pomaranczowy
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 하양과 주황 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit37.lesson03.translate.001
  lesson_content_key: pl.a1.unit37.lesson03.rozowy_i_fioletowy
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 분홍과 보라 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit37.lesson04.match.001
  lesson_content_key: pl.a1.unit37.lesson04.nina_i_ewa_na
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 폴란드어 단어를 그 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit37.lesson05.choose.001
  lesson_content_key: pl.a1.unit37.lesson05.nina_i_ewa_kupuja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 니나와 에바가 튤립을 사는 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit37.lesson06.translate.001
  lesson_content_key: pl.a1.unit37.lesson06.tulipany_dla_kawiarni_jezykowej
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 언어 카페를 위한 튤립 수업에서 나왔어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit37.lesson01.order.002
  lesson_content_key: pl.a1.unit37.lesson01.czerwony_i_zolty
  type: word_order
  frame:
    text: Tulipany są {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_tutaj
  answer_derivation:
    kind: render_frame
    frame:
      text: Tulipany są {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 튤립이 여기 있어요. tutaj는 '여기'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit37.lesson03.order.002
  lesson_content_key: pl.a1.unit37.lesson03.rozowy_i_fioletowy
  type: word_order
  frame:
    text: To jest {item}, a to jest fioletowy.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_różowy
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest {item}, a to jest fioletowy.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 이건 분홍색이고 저건 보라색이에요. różowy는 '분홍색'(남성형)이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit37.lesson04.order.002
  lesson_content_key: pl.a1.unit37.lesson04.nina_i_ewa_na
  type: word_order
  frame:
    text: To kosztuje dwadzieścia pięć złotych za pięć {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_tulipanów
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje dwadzieścia pięć złotych za pięć {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 튤립 다섯 송이에 25즐로티예요. tulipanów는 '튤립들의'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit37.lesson05.order.002
  lesson_content_key: pl.a1.unit37.lesson05.nina_i_ewa_kupuja
  type: word_order
  frame:
    text: Nina i Ewa lubią {item} kwiatowy.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_targ
  answer_derivation:
    kind: render_frame
    frame:
      text: Nina i Ewa lubią {item} kwiatowy.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 니나와 에바는 꽃시장이 재미있다고 생각해요. targ는 '시장'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit37.lesson06.order.002
  lesson_content_key: pl.a1.unit37.lesson06.tulipany_dla_kawiarni_jezykowej
  type: word_order
  frame:
    text: Tulipany {item} kawiarnię językową!
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_upiększają
  answer_derivation:
    kind: render_frame
    frame:
      text: Tulipany {item} kawiarnię językową!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 튤립이 언어 카페를 예쁘게 꾸며 줘요! upiększają는 '그들이 아름답게 만든다'라는 뜻이에요.
    language_code: ko
    direction: ltr
