    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이번 단원의 단어예요. ''같이 자전거 탈까요?'' 수업에 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit28.lesson01.order.002
  lesson_content_key: pl.a1.unit28.lesson01.pociag_rower_samochod_i
  type: word_order
  frame:
    text: Ewa {item} pociągiem.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_podróżuje
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa {item} pociągiem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa는 기차로 이동해요. podróżuje는 '이동하다, 여행하다(그, 그녀)'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit28.lesson01.fill.003
  lesson_content_key: pl.a1.unit28.lesson01.pociag_rower_samochod_i
  type: fill_in_blank
  frame:
    text: Wtedy jadę {item}, razem z Ewą. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_pociągiem
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_pociągiem
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 그럼 저는 Ewa와 함께 기차를 타요. pociągiem은 '기차'라는 뜻이에요('~로' 뒤에 오는 형태).
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit28.lesson01.translate.004
  lesson_content_key: pl.a1.unit28.lesson01.pociag_rower_samochod_i
  type: translation
  frame:
    text: Marek은 자전거로 출근해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_jeździ
  answer_derivation:
    kind: render_frame
    frame:
      text: Marek {item} rowerem do pracy.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Marek은 자전거로 출근해요. jeździ는 '가다, 타고 가다, 운전하다(그, 그녀, 습관적으로)'라는 뜻이에요.
    language_code: ko
    direction: ltr
