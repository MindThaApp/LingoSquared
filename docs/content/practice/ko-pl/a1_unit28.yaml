    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit28.lesson06.translate.001
  lesson_content_key: pl.a1.unit28.lesson06.moze_pojedziemy_razem_rowerami
  type: translation
  frame:
    text: '{item}'
    language_code: ko
