templates:
- content_key: practice.ko-pl.pl.a1.unit05.lesson01.choose.001
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 폴란드어 가족 단어는 ojciec과 matka, brat와 siostra처럼 남성과 여성이 짝을 이루는 경우가 많아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson01.listen.002
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rodzice(부모님)는 항상 복수라서 mój나 moja가 아니라 moi를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson01.match.003
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '가족 단어는 성별로 짝을 이뤄요: dziadek과 babcia, wujek과 ciotka, syn과 córka.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson01.order.004
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest mój {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest mój {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mój는 ojciec, brat, dziadek 같은 남성 명사와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson01.order.005
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest moja {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest moja {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja는 여성 명사와 함께 쓰는데, 대부분 -a로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson01.fill.006
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: fill_in_blank
  frame:
    text: To jest {item} ojciec. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '소유 표현은 명사에 일치해요: mój ojciec, 하지만 moja matka.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson01.translate.007
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: 이분은 제 어머니예요.
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest {item} matka.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja는 여성형 '나의'이고, 남성형 '나의'는 mój예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson01.translate.008
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: 이분들은 제 부모님이에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To są {item} rodzice.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rodzice는 복수이고 사람을 가리키므로 소유 형용사는 moi예요. 동사는 jest 대신 są를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson02.choose.001
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mieć는 ''가지다''라는 뜻이고, 가진 사람에 따라 동사 형태가 정해져요: mam, masz, ma.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson02.translate.002
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieć('가지다')는 사전에 실린 형태이고, 문장에서는 mam, masz, ma로 나타나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson02.order.003
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: word_order
  frame:
    text: Mam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'mam 뒤에서는 가진 대상이 대격 형태를 취해요: brat는 brata, siostra는 siostrę가 돼요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson02.fill.004
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: fill_in_blank
  frame:
    text: Tak, mam brata {item} siostrę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: i는 brata i siostrę처럼 두 대상을 이어 주며, 형태가 절대 변하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson02.translate.005
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: 저는 아들과 딸이 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam syna i {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: '-a로 끝나는 여성 명사는 목적어가 되면 -ę로 바뀌어요: córka는 córkę가 돼요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson03.choose.001
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 폴란드어에서는 '그'를 on, '그녀'를 ona라고 하고, 동사 mieszka는 둘 다에 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson03.translate.002
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tylko는 '오직'이라는 뜻이고, lub는 선택을 나타내는 '또는'이에요. brata lub siostrę처럼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson03.order.003
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: word_order
  frame:
    text: Mój brat mieszka w {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mój brat mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: w 뒤에서 도시 이름은 특별한 어미를 취해요. w Gdańsku, w Krakowie처럼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson03.fill.004
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: fill_in_blank
  frame:
    text: Ona {item} w Krakowie. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieszka는 동사의 '그/그녀' 형태이고, 첫 번째 단원에서 배운 mieszkam은 '나' 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit05.lesson03.translate.005
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: 그는 그단스크에 살아요. (대명사를 포함하세요)
    language_code: ko
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: On mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'w 뒤의 어미 -u는 어떤 사람이 사는 곳을 나타내요: w Gdańsku.'
    language_code: ko
    direction: ltr
