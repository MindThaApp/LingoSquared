      part_of_speech: verb
      agreement_tags:
        semantic: w_pomogę
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 네, 기꺼이 도와줄게요. pomogę는 '도울 거예요'라는 뜻이에요.
    language_code: ko
    direction: ltr
