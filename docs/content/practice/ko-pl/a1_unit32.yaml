    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit32.lesson02.listen.001
  lesson_content_key: pl.a1.unit32.lesson02.balagan_i_odkurzanie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이번 단원의 단어예요. 어지름과 청소기 돌리기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit32.lesson03.translate.001
  lesson_content_key: pl.a1.unit32.lesson03.mozesz_pomoc
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이번 단원의 단어예요. 도와줄 수 있어요? 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit32.lesson04.match.001
  lesson_content_key: pl.a1.unit32.lesson04.ewa_pomaga_markowi_w
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 폴란드어 단어를 그 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit32.lesson05.choose.001
  lesson_content_key: pl.a1.unit32.lesson05.kto_co_robi_w
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이번 단원의 단어예요. 집안일은 누가 뭘 해요? 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit32.lesson06.translate.001
  lesson_content_key: pl.a1.unit32.lesson06.mieszkanie_jest_gotowe
  type: translation
  frame:
