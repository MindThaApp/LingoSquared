    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit32.lesson01.order.002
  lesson_content_key: pl.a1.unit32.lesson01.sprzatanie
  type: word_order
  frame:
    text: Kto {item} mieszkanie?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_sprząta
  answer_derivation:
    kind: render_frame
    frame:
      text: Kto {item} mieszkanie?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 누가 집을 청소하고 있나요? sprząta는 '(그/그녀가) 치워요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit32.lesson02.order.002
  lesson_content_key: pl.a1.unit32.lesson02.balagan_i_odkurzanie
  type: word_order
  frame:
    text: Po imprezie jest dużo {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_bałaganu
  answer_derivation:
    kind: render_frame
    frame:
      text: Po imprezie jest dużo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 파티 후에 어질러진 것이 많아요. bałaganu는 '어질러진 상태의'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit32.lesson03.order.002
  lesson_content_key: pl.a1.unit32.lesson03.mozesz_pomoc
  type: word_order
  frame:
    text: Możesz mi pomóc ze {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmywaniem
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz mi pomóc ze {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 설거지하는 것 좀 도와줄래요? zmywaniem은 '설거지로, 설거지에 대해'라는 뜻이에요.
    language_code: ko
    direction: ltr
