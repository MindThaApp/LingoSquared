templates:
- content_key: practice.ko-pl.pl.a1.unit01.lesson01.choose.001
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 폴란드어에는 '당신'을 뜻하는 말이 두 가지 있어요. 친구나 가족에게는 ty를 쓰고, 낯선 사람에게나 존중을 나타낼 때는 pan(남자에게) 또는 pani(여자에게)를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson01.fill.002
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: fill_in_blank
  frame:
    text: Jak się {item} ma? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'pan이나 pani와 함께 쓸 때 동사는 ma예요. ''그분은 어떻게 지내세요?''라고 말하는 것과 같아요. ty와 함께 쓰면 masz가 돼요: Jak się masz?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson01.translate.003
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pan과 pani는 서로 바꿔 쓸 수 없어요. pan은 남자에게, pani는 여자에게 쓰고, ty는 잘 아는 사람에게 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson01.order.004
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: word_order
  frame:
    text: Jak się {item} ma?
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item} ma?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Jak się ma?는 상대가 어떻게 지내는지 묻는 말이에요. pan이나 pani가 가운데에 들어가고, 동사는 ma 그대로예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson01.translate.005
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: 잘 지내요? (친구에게, 편한 말투)
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 친구에게 묻는 질문은 masz로 끝나고, 공손한 표현은 ma에 pan이나 pani를 붙여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson02.listen.001
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dzień dobry는 저녁이 되기 전까지 하루 종일 쓰는 인사이고, dobry wieczór는 저녁에 쓰며, dobranoc은 밤에 헤어질 때만 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson02.match.002
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cześć는 '안녕'과 '잘 가'를 모두 뜻하는 편한 인사말이라서, pan이나 pani가 아니라 ty와 어울려요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson02.order.003
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Do {item}!
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Do {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Do widzenia는 표준적인 작별 인사이고, do zobaczenia는 더 친근한 '또 봐요'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson02.fill.004
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: fill_in_blank
  frame:
    text: Dobry {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dobry wieczór는 저녁에 쓰고, 낮에는 dzień dobry라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson02.translate.005
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cześć는 '안녕'과 '잘 가'로 모두 쓸 수 있지만, ty라고 부르는 사람에게만 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson02.translate.006
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: 좋은 하루 보내세요!
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Miłego {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Miłego dnia는 바라는 말이라서 '하루'를 뜻하는 단어의 어미가 dnia로 바뀌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson03.choose.001
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 폴란드어는 동사 어미가 사람을 나타내기 때문에 보통 대명사를 생략해요. jestem은 '나는 ~이에요', jesteś는 '너는 ~이에요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson03.listen.002
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jestem z + 나라 이름은 어디 출신인지 말하고, mieszkam w + 도시 이름은 어디에 사는지 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson03.translate.003
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 동사 어미가 사람을 나타내요. '나'는 -m(jestem, mieszkam)이고, 편한 '너'는 -sz 또는 -ś(masz, jesteś)예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson03.order.004
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: word_order
  frame:
    text: Jestem z {item}, ale mieszkam w Warszawie.
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem z {item}, ale mieszkam w Warszawie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'z(~에서) 뒤에서는 나라 이름의 어미가 달라져요: Kanady.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson03.fill.005
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: fill_in_blank
  frame:
    text: Czy pan {item} po polsku? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '남자에게 하는 공손한 질문은 3인칭 동사형을 써요: Czy pan mówi po polsku?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson03.translate.006
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: 어디에서 왔어요? (친구에게, 편한 말투)
    language_code: ko
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Skąd {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Skąd는 '어디에서'를 묻는 말이에요. 친구에게는 동사가 jesteś이고, 공손한 표현은 Skąd pan jest?예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit01.lesson03.translate.007
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: 만나서 정말 반가워요.
    language_code: ko
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo mi {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bardzo mi miło는 직역하면 '저에게 매우 기쁘다'라는 뜻이고, 처음 만난 사람에게 흔히 하는 대답이에요.
    language_code: ko
    direction: ltr
