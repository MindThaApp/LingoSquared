schema_version: '1.0'
pack_key: practice.ko-pl.a1.unit41
source_language: ko
target_language: pl
unit_content_key: pl.a1.unit41.wizyta
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_chciałabym
    - w_komputerowa
    - w_komputerowej
    - w_pasuje
    - w_potwierdzenie
    - w_potwierdzona
    - w_przypomnieć
    - w_przypomnę
    - w_sprawie
    - w_termin
    - w_umówić
    - w_wizyta
    - w_wizytę
    - w_ładnie
    - w_środę
templates:
- content_key: practice.ko-pl.pl.a1.unit41.lesson01.choose.001
  lesson_content_key: pl.a1.unit41.lesson01.umowienie_wizyty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_wizyta
        - w_chciałabym
        - w_umówić
        - w_wizytę
        - w_środę
        - w_termin
        - w_pasuje
        - w_komputerowa
        - w_sprawie
        - w_komputerowej
        - w_potwierdzona
        - w_potwierdzenie
        - w_ładnie
        - w_przypomnę
        - w_przypomnieć
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 예약하기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit41.lesson02.listen.001
  lesson_content_key: pl.a1.unit41.lesson02.wolny_termin
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어로, 가능한 시간에 관한 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit41.lesson03.translate.001
  lesson_content_key: pl.a1.unit41.lesson03.w_jakiej_sprawie_jest
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어로, 예약이 무엇을 위한 것인지 묻는 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit41.lesson05.match.001
  lesson_content_key: pl.a1.unit41.lesson05.czytanie_potwierdzenia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 폴란드어 단어를 그 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
