schema_version: '1.0'
pack_key: practice.ko-pl.a1.unit22
source_language: ko
target_language: pl
unit_content_key: pl.a1.unit22.komunikacja
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_być
    - w_czas
    - w_dumna
    - w_dużo
    - w_dzwoni
    - w_dzwonisz
    - w_dzwonić
    - w_fajnie
    - w_lepiej
    - w_minut
    - w_muszę
    - w_myślałem
    - w_myśleć
    - w_mów
    - w_oczywiście
    - w_oddzwonię
    - w_poszła
    - w_powiedzieć
    - w_powtórzyć
    - w_przeszły
    - w_później
    - w_rozmawia
    - w_rozmawiam
    - w_sms
    - w_szybko
    - w_słyszeć
    - w_słyszę
    - w_wyślę
    - w_zadzwonię
    - w_zmiana
    - w_znaczy
templates:
- content_key: practice.ko-pl.pl.a1.unit22.lesson01.choose.001
  lesson_content_key: pl.a1.unit22.lesson01.zadzwonie_do_ciebie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_dzwonić
        - w_muszę
        - w_zadzwonię
        - w_rozmawiam
        - w_rozmawia
        - w_powtórzyć
        - w_mów
        - w_szybko
        - w_słyszę
        - w_sms
        - w_wyślę
        - w_oddzwonię
        - w_później
        - w_powiedzieć
        - w_oczywiście
        - w_minut
        - w_fajnie
        - w_dzwonisz
        - w_poszła
        - w_zmiana
        - w_lepiej
        - w_myślałem
        - w_czas
        - w_przeszły
        - w_być
        - w_myśleć
        - w_słyszeć
        - w_dumna
        - w_dużo
        - w_znaczy
        - w_dzwoni
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''전화할게요'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit22.lesson02.listen.001
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''누구세요?'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit22.lesson03.translate.001
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''다시 말씀해 주시겠어요?'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit22.lesson04.match.001
  lesson_content_key: pl.a1.unit22.lesson04.wysylanie_sms_a
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 폴란드어 단어를 그 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit22.lesson05.choose.001
  lesson_content_key: pl.a1.unit22.lesson05.czytanie_rozmowy_sms_owej
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''문자 메시지 읽기'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit22.lesson06.translate.001
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''근무 후 전화 통화'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: '누구세요? Z kim rozmawiam?(직역: ''나는 누구와 이야기하고 있나요?'')은 모르는 사람이 전화했을 때 쓰는 표준 표현이에요. kim은 z 뒤에 오는 조격이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 그것 좀 다시 말해 줄래요? Możesz(~할 수 있어요?, móc에서) + 부정사 powtórzyć(반복하다) + to(그것).
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 너무 빨리 말하지 마세요. Nie mów는 부정 명령형(말하지 마세요)이고, tak szybko는 '그렇게 빨리'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: 잘 안 들려요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 잘 안 들려요. Nie słyszę cię dobrze는 잘 들리지 않는다는 말이에요. cię는 ty의 대격이고, dobrze는 '잘'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: '첫 근무는 어땠어요? Jak ci poszła ...?(직역: ''...은 너에게 어떻게 갔어?'')는 이미 지나간 일을 묻는 표현이에요. Ci는 ty의 여격이고, poszła는 여성 명사 zmiana에 맞춘 형태예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '그의 첫 근무는 아주 잘 되었어요. Jego(그의)는 형태가 변하지 않고 명사 앞에 와요: jego pierwsza zmiana. 여성 명사라도 jego에는 영향을 주지 않아요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: 생각보다 아주 잘 됐어요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 생각보다 아주 잘 됐어요. Poszło는 iść의 과거형에 어미 -o가 붙은 것이에요('그것'; 여기서는 '잘 풀리다'). myślałem은 myśleć(생각하다)의 과거형으로 남성 화자가 쓰는 형태예요.
    language_code: ko
    direction: ltr
