- content_key: practice.ko-pl.pl.a1.unit11.lesson01.choose.001
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chcę는 chcieć의 '나' 형태이고, chcesz는 친구나 가족에게 쓰는 '너' 형태예요.
    language_code: ko
    direction: ltr
