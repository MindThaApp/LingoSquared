  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '어미 -sz는 친근한 ''너''를 나타내요: chcesz, możesz, masz (jesteś는 -ś로 끝나는 예외예요).'
    language_code: ko
    direction: ltr
