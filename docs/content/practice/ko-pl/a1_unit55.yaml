schema_version: '1.0'
pack_key: practice.ko-pl.a1.unit55
source_language: ko
target_language: pl
unit_content_key: pl.a1.unit55.mecz
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_drużyna
    - w_dziewięćdziesiąt
    - w_gol
    - w_gospodarze
    - w_gościom
    - w_jednego
    - w_kibic
    - w_mecz
    - w_piękny
    - w_rozrywki
    - w_stadion
    - w_szybki
    - w_trwanie
    - w_wejściu
    - w_wynik
    - w_wyników
    - w_zawodnik
    - w_zwycięzca
    - w_zwycięzcy
templates:
- content_key: practice.ko-pl.pl.a1.unit55.lesson01.choose.001
  lesson_content_key: pl.a1.unit55.lesson01.pojdziemy_dzis_wieczorem_na
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_mecz
        - w_stadion
        - w_kibic
        - w_drużyna
        - w_zawodnik
        - w_szybki
        - w_gol
        - w_piękny
        - w_wynik
        - w_jednego
        - w_wyników
        - w_gospodarze
        - w_gościom
        - w_trwanie
        - w_dziewięćdziesiąt
        - w_wejściu
        - w_zwycięzca
        - w_zwycięzcy
        - w_rozrywki
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어예요. ''오늘 밤 경기에 갈까요?'' 수업에서 나온 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit55.lesson02.listen.001
  lesson_content_key: pl.a1.unit55.lesson02.druzyna_i_zawodnik
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어예요. ''팀과 선수'' 수업에서 나온 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit55.lesson03.translate.001
  lesson_content_key: pl.a1.unit55.lesson03.gol_i_wynik
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '이 단원의 단어예요. ''골과 점수'' 수업에서 나온 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit55.lesson04.match.001
  lesson_content_key: pl.a1.unit55.lesson04.tablica_przy_wejsciu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 폴란드어 단어를 그 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit55.lesson05.choose.001
  lesson_content_key: pl.a1.unit55.lesson05.przy_kasie_na_stadionie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어로, ''경기장 매표소에서'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit55.lesson06.translate.001
  lesson_content_key: pl.a1.unit55.lesson06.marek_i_nina_po
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 경기 후의 Marek과 Nina 수업에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit55.lesson01.order.002
  lesson_content_key: pl.a1.unit55.lesson01.pojdziemy_dzis_wieczorem_na
  type: word_order
  frame:
    text: Rejs był fajny, a teraz idę na {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_mecz
  answer_derivation:
