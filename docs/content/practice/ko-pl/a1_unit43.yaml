schema_version: '1.0'
pack_key: practice.ko-pl.a1.unit43
source_language: ko
target_language: pl
unit_content_key: pl.a1.unit43.apteka
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aptekarz
    - w_biorę
    - w_ból
    - w_dawkowanie
    - w_dobre
    - w_dziennie
    - w_etykieta
    - w_głowy
    - w_lek
    - w_leki
    - w_musi
    - w_odpocznij
    - w_paracetamol
    - w_porządku
    - w_przeciwbólowy
    - w_przeczytaj
    - w_pudełku
    - w_tabletka
    - w_tabletki
    - w_wodą
    - w_wziąć
    - w_wzięłam
templates:
- content_key: practice.ko-pl.pl.a1.unit43.lesson01.choose.001
  lesson_content_key: pl.a1.unit43.lesson01.mam_bol_glowy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_ból
        - w_głowy
        - w_lek
        - w_przeciwbólowy
        - w_tabletka
        - w_wziąć
        - w_wodą
        - w_musi
        - w_dawkowanie
        - w_przeczytaj
        - w_pudełku
        - w_dziennie
        - w_tabletki
        - w_aptekarz
        - w_leki
        - w_dobre
        - w_etykieta
        - w_paracetamol
        - w_biorę
        - w_odpocznij
        - w_porządku
        - w_wzięłam
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item} (''머리가 아파요'' 수업)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit43.lesson02.listen.001
