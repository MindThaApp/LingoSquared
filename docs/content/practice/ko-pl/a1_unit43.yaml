    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item} (''알약 먹기'' 수업)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit43.lesson03.translate.001
  lesson_content_key: pl.a1.unit43.lesson03.czytanie_dawkowania
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item} (''복용량 읽기'' 수업)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit43.lesson04.match.001
  lesson_content_key: pl.a1.unit43.lesson04.w_aptece
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 폴란드어 단어를 그 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
