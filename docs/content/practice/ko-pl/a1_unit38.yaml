    kind: slot_text
    slot: item
  feedback_frame:
    text: 어느 계절이 예쁘다고 생각해요? roku는 '해, 연'이라는 뜻이에요('내년'에 쓰인 형태).
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit38.lesson01.translate.005
  lesson_content_key: pl.a1.unit38.lesson01.wiosna_i_lato
  type: translation
  frame:
    text: 봄에는 화창하고 여름에는 따뜻해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_latem
  answer_derivation:
