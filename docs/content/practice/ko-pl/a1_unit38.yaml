  lesson_content_key: pl.a1.unit38.lesson01.wiosna_i_lato
  type: word_order
  frame:
    text: Jaka jest teraz {item} roku?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_pora
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaka jest teraz {item} roku?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 지금은 어느 계절이에요? pora는 '때, 계절'이라는 뜻이에요.
    language_code: ko
    direction: ltr
