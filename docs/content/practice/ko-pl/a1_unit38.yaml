    - w_jesienią
    - w_jesień
    - w_jeździmy
    - w_latem
    - w_lato
    - w_pora
    - w_porach
    - w_pory
    - w_porę
    - w_pływamy
    - w_roku
    - w_rozmowa
    - w_spokojna
    - w_ulubione
    - w_uważasz
    - w_wiosna
    - w_wiosną
    - w_zima
    - w_zimą
    - w_ładną
    - w_łyżwach
templates:
- content_key: practice.ko-pl.pl.a1.unit38.lesson01.choose.001
  lesson_content_key: pl.a1.unit38.lesson01.wiosna_i_lato
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_pora
        - w_roku
        - w_wiosna
        - w_wiosną
        - w_lato
        - w_latem
        - w_ciepło
        - w_jesień
        - w_jesienią
        - w_zima
        - w_zimą
        - w_porę
        - w_uważasz
        - w_ładną
        - w_pływamy
        - w_łyżwach
        - w_jeździmy
        - w_rozmowa
        - w_porach
        - w_spokojna
        - w_pory
        - w_ulubione
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 봄과 여름 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit38.lesson02.listen.001
  lesson_content_key: pl.a1.unit38.lesson02.jesien_i_zima
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 가을과 겨울 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit38.lesson03.translate.001
  lesson_content_key: pl.a1.unit38.lesson03.aktywnosci_w_roznych_porach
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — 계절별 활동 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit38.lesson05.match.001
  lesson_content_key: pl.a1.unit38.lesson05.czytanie_tekstu_o_porach
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 폴란드어 단어를 그 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit38.lesson06.choose.001
  lesson_content_key: pl.a1.unit38.lesson06.tomek_dolacza
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
