schema_version: '1.0'
pack_key: practice.ko-pl.a1.unit57
source_language: ko
target_language: pl
unit_content_key: pl.a1.unit57.teatr
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aktorzy
    - w_byli
    - w_dobrzy
    - w_dwudziesta
    - w_gwiazda
    - w_kurtyna
    - w_miejsca
    - w_otwarta
    - w_podróż
    - w_popularne
    - w_przedstawienie
    - w_przerwą
    - w_scenę
    - w_sztuka
    - w_teatr
    - w_zadowolony
    - w_świetni
templates:
- content_key: practice.ko-pl.pl.a1.unit57.lesson01.choose.001
  lesson_content_key: pl.a1.unit57.lesson01.pojdziemy_dzis_do_teatru
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_teatr
        - w_przedstawienie
        - w_popularne
        - w_kurtyna
        - w_scenę
        - w_aktorzy
        - w_dobrzy
        - w_otwarta
        - w_gwiazda
        - w_sztuka
        - w_podróż
        - w_dwudziesta
        - w_przerwą
        - w_miejsca
        - w_zadowolony
        - w_byli
        - w_świetni
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 단어는 이 단원의 단어예요. ''오늘 극장에 갈까요?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit57.lesson02.listen.001
  lesson_content_key: pl.a1.unit57.lesson02.scena_i_kurtyna
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 단어는 이 단원의 단어예요. ''무대와 막'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit57.lesson03.translate.001
