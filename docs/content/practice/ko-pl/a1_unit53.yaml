schema_version: '1.0'
pack_key: practice.ko-pl.a1.unit53
source_language: ko
target_language: pl
unit_content_key: pl.a1.unit53.plaza
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_była
    - w_ciepły
    - w_fala
    - w_morze
    - w_morzu
    - w_parasol
    - w_parasole
    - w_parasolem
    - w_piasek
    - w_piasku
    - w_piękne
    - w_plaży
    - w_popływamy
    - w_siedzę
    - w_wydmowa
    - w_zamykają
    - w_zoo
templates:
- content_key: practice.ko-pl.pl.a1.unit53.lesson01.choose.001
  lesson_content_key: pl.a1.unit53.lesson01.pojdziemy_na_plaze
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_była
        - w_morze
        - w_piasek
        - w_ciepły
        - w_fala
        - w_morzu
        - w_parasol
        - w_siedzę
        - w_parasolem
        - w_wydmowa
        - w_parasole
        - w_zamykają
        - w_piękne
        - w_popływamy
        - w_piasku
        - w_zoo
        - w_plaży
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어예요: {item}. ''해변에 갈까요?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
