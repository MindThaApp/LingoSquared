  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kosztować는 사전에 나오는 기본형이고, 문장에서는 kosztuje나 kosztują로 바뀌어요.
    language_code: ko
    direction: ltr
