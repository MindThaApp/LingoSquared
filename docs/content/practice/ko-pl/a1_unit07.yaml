templates:
- content_key: practice.ko-pl.pl.a1.unit07.lesson01.choose.001
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: kosztować 동사와 함께 폴란드어는 부사를 써요. kosztuje tanio(싸다), kosztuje drogo(비싸다)처럼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit07.lesson01.listen.002
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cebula는 -a로 끝나서 여성이고, banan, pomidor, ogórek, ziemniak은 남성이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit07.lesson01.order.003
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: word_order
  frame:
    text: Ile kosztuje {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile kosztuje는 물건 하나의 가격을 묻기 때문에 명사는 기본 단수형 그대로 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit07.lesson01.fill.004
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: fill_in_blank
  frame:
    text: Banany {item} tanio. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 동사는 수에 맞춰 달라져요. 하나일 때는 kosztuje, 둘 이상일 때는 kosztują를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit07.lesson01.translate.005
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: 바나나는 싸요. (kosztować 동사를 쓰세요)
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Banan kosztuje {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 폴란드어는 별도의 형용사를 쓰지 않고 "바나나가 싸게 값이 나간다"고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit07.lesson01.translate.006
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
