  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_restauracji
        - w_zjeść
        - w_menu
        - w_zamówić
        - w_smaczny
        - w_wybrała
        - w_picia
        - w_napoje
        - w_kanapka
        - w_serem
