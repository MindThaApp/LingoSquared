schema_version: '1.0'
pack_key: practice.ko-pl.a1.unit21
source_language: ko
target_language: pl
unit_content_key: pl.a1.unit21.emocje
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_będziesz
    - w_czuje
    - w_deszcz
    - w_dumny
    - w_martw
    - w_myślę
    - w_mówiąc
    - w_naprawdę
    - w_nowe
    - w_pewno
    - w_pierwszą
    - w_pomaga
    - w_poradzisz
    - w_pracę
    - w_samodzielną
    - w_smutny
    - w_szczerze
    - w_szczęśliwy
    - w_zdenerwowany
    - w_zmianą
templates:
- content_key: practice.ko-pl.pl.a1.unit21.lesson01.choose.001
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_szczęśliwy
        - w_smutny
        - w_nowe
        - w_deszcz
        - w_zdenerwowany
        - w_pierwszą
        - w_zmianą
        - w_martw
        - w_czuje
        - w_samodzielną
        - w_pracę
        - w_myślę
        - w_szczerze
        - w_mówiąc
        - w_poradzisz
        - w_naprawdę
        - w_pomaga
        - w_pewno
        - w_będziesz
        - w_dumny
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, '기쁨, 슬픔, 화남' 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson02.listen.001
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, '왜 기뻐요?' 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson03.translate.001
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, '무언가 때문에 긴장돼요' 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson04.match.001
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 폴란드어 단어를 그 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson05.choose.001
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, '감정에 관한 메시지 읽기' 수업에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson06.translate.001
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 이 단원의 단어로, Ewa가 Marek을 안심시키는 레슨에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson01.order.002
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: word_order
  frame:
    text: Dlaczego jesteś {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_szczęśliwy
  answer_derivation:
    kind: render_frame
    frame:
      text: Dlaczego jesteś {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 왜 행복해요? Dlaczego(왜)는 이유를 묻는 기본 의문사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson01.fill.003
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: fill_in_blank
  frame:
    text: Nie jestem zły, jestem {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smutny
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smutny
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '저는 화나지 않았어요, 슬퍼요. Nie는 동사 바로 앞에 와요: Nie jestem zły. 그다음 절에서 실제 감정을 말해요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson02.order.002
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: word_order
  frame:
    text: Jestem szczęśliwy, bo mam {item} mieszkanie.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nowe
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem szczęśliwy, bo mam {item} mieszkanie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: '저는 새 아파트가 생겨서 행복해요. Bo(왜냐하면)는 이유를 이끌고, mam(나는 가지고 있다) 뒤에서 명사는 대격이에요: nowe mieszkanie.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson02.fill.003
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: fill_in_blank
  frame:
    text: Jestem smutny, bo pada {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_deszcz
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_deszcz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 저는 비가 와서 슬퍼요. Pada deszcz(비가 와요, 직역하면 '비가 떨어진다')는 날씨를 말하는 일반적인 표현이고, 여기서는 이유로 쓰였어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson03.order.002
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: word_order
  frame:
    text: Jestem {item} przed pierwszą zmianą.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_zdenerwowany
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem {item} przed pierwszą zmianą.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 저는 첫 근무 때문에 긴장돼요. zdenerwowany는 '긴장한'(남성형)이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson03.fill.003
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: fill_in_blank
  frame:
    text: Cześć, Marku, jak się czujesz przed {item} zmianą? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 안녕 Marek, 첫 근무 앞두고 기분이 어때? Przed pierwszą zmianą(첫 근무를 앞두고)는 3과의 przed + 조격 패턴을 다시 쓴 거예요. Czujesz się는 ty 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson03.translate.004
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
    text: 걱정하지 마세요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_martw
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} się.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 걱정하지 마세요. Nie martw się(직역하면 '너 자신을 걱정하게 하지 마')는 안심시킬 때 쓰는 표준 표현이고, się는 재귀 대명사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson04.order.002
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: word_order
  frame:
    text: Jak {item} się Marek?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_czuje
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak {item} się Marek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Marek은 기분이 어때요? Czuć się(느끼다, 재귀)는 감정 상태를 묻거나 말하는 표준적인 방법이에요: Jak czuje się Marek?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson05.order.002
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: word_order
  frame:
    text: Tak, ja też tak {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_myślę
  answer_derivation:
    kind: render_frame
    frame:
      text: Tak, ja też tak {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 네, 저도 그렇게 생각해요. Ja też tak myślę(직역하면 '나도 그렇게 생각해')는 동의할 때 쓰는 자연스러운 표현이에요. ja는 강조를 위해 덧붙였어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson06.order.002
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: word_order
  frame:
    text: Szczerze {item}, jestem trochę zdenerwowany.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mówiąc
  answer_derivation:
    kind: render_frame
    frame:
      text: Szczerze {item}, jestem trochę zdenerwowany.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 솔직히 조금 긴장돼요. Szczerze mówiąc(솔직히, 직역하면 '진심으로 말하자면')는 속마음을 인정하는 말을 부드럽게 해 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson06.fill.003
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: fill_in_blank
  frame:
    text: Nie martw się, dobrze sobie {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 걱정하지 마, 잘 해낼 수 있어! Dobrze sobie poradzisz(직역하면 '너는 잘 대처할 거야')는 격려하는 고정 표현이고, poradzisz는 poradzić sobie의 ty 미래형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-pl.pl.a1.unit21.lesson06.translate.004
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame:
    text: 고마워요, 정말 도움이 돼요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_naprawdę
  answer_derivation:
    kind: render_frame
    frame:
      text: Dzięki, to {item} pomaga.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 고마워요, 정말 도움이 돼요. Pomaga는 pomagać(돕다)의 on/ona/ono 형태이고, dzięki는 격식 없는 '고마워'예요.
    language_code: ko
    direction: ltr
