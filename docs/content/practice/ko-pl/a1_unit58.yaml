  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) ''사과와 시장 상인'' 수업에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
