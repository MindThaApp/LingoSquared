templates:
- content_key: practice.ja-hi.hi.a1.unit02.lesson01.choose.001
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ヒンディー語の数の単語は不規則で、一つずつ覚える必要があります。たとえば छह は6、सात は7です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit02.lesson01.listen.002
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ヒンディー語の11から99までの数の単語は不規則なので、पंद्रह(15)や पचास(50)のように、一つずつ別々に覚える必要があります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit02.lesson02.match.001
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ヒンディー語の名詞 नंबर、फ़ोन、कीमत などは、日本語の「ある」や「その」に当たる語を付けずに使います。値段を指すのか特定の値段を指すのかは文脈で決まります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit02.lesson02.fill.002
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: इसकी {item} पचास रुपये है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इसकी は「その〜」という意味で、女性名詞の कीमत に合わせて語尾が -ा ではなく -ी になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit02.lesson02.order.003
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: इसकी कीमत {item} रुपये है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी कीमत {item} रुपये है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ヒンディー語では数が数えるものの前に来て、動詞 है は文末に置きます。例：इसकी कीमत पचास रुपये है.
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit02.lesson02.translate.004
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: その値段はいくらですか?
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी {item} क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ヒンディー語の疑問文は平叙文と同じ語順です。इसकी कीमत पचास रुपये है は इसकी कीमत क्या है? の答えになります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit02.lesson03.choose.001
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 所有を表す語は持ち物の性に合わせて変わります。आपका फ़ोन नंबर では男性形の आपका を使いますが、आपकी उम्र では女性形の आपकी を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit02.lesson03.order.002
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: मेरी उम्र {item} साल है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {item} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 年齢は数＋साल（年）に है を付けて言います。直訳すると「私の年齢は30年です」となります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit02.lesson03.order.003
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: आपका {item} नंबर क्या है?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: आपका は丁寧な「あなたの」で、नंबर が男性名詞なのでここでは男性形です。तुम を使う場合は तुम्हारा と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit02.lesson03.fill.004
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: मेरी उम्र तीस {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: साल（年）は数の後ろでも複数形で形が変わりません。तीस साल で「30年（30歳）」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit02.lesson03.translate.005
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: 私の年齢は{n}歳です。
    language_code: ja
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {n} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: उम्र は女性名詞なので、所有を表す語は मेरा ではなく मेरी になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit02.lesson03.translate.006
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: お電話番号は何番ですか?(丁寧)
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ヒンディー語では電話番号を一桁ずつ読みます。例：छह दो आठ तीन पाँच。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit02.lesson03.translate.007
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 1より大きい数の後ろでは、お金は複数形の रुपये で数えます。単数形は रुपया です。
    language_code: ja
    direction: ltr
