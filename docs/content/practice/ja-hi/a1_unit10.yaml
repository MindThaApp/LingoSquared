templates:
- content_key: practice.ja-hi.hi.a1.unit10.lesson01.choose.001
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '習慣を表す動詞は、男性なら -ता、女性なら -ती で終わります： मैं उठता हूँ、मैं उठती हूँ。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson01.listen.002
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: वह は「彼」も「彼女」も表し、どちらかは動詞の語尾でわかります。वे は「彼ら」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson01.order.003
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ सात बजे {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ सात बजे {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 動詞の語尾は話し手の性別に合わせます。男性は उठता、女性は उठती で、हूँ は मैं と一緒に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson01.order.004
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ काम पर {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: काम पर जाना(仕事に行く)には पर が必要ですが、動詞の語尾はやはり話し手の性別に合わせます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson01.fill.005
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: fill_in_blank
  frame:
    text: मैं रोज़ नाश्ता {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ヒンディー語の動作には「名詞+करना」の形が多くあります： नाश्ता करना は「朝食を食べる」です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson01.translate.006
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: 毎日仕事に行きます。(女性が話す場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '女性は -ती の語尾を使います： जाती हूँ。男性なら जाता हूँ と言います。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson01.translate.007
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: 毎日朝食を食べます。(男性が話す場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ नाश्ता {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ヒンディー語では नाश्ता करना と言います。直訳すると「朝食をする」で、日本語の「朝食をとる」にあたります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson02.choose.001
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'तुम のときは、動詞は男性なら -ते、女性なら -ती で終わり、हो を伴います： तुम उठते हो、तुम उठती हो。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson02.match.002
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 習慣を表す動詞には、男性形の -ता と女性形の -ती があり、どちらを使うかは話し手によって決まります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson02.order.003
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: word_order
  frame:
    text: तुम कब {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: तुम のときは、男性に尋ねるなら動詞は -ते हो になります。語尾は話しかける相手に合わせます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson02.fill.004
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: fill_in_blank
  frame:
    text: मैं रात को ग्यारह बजे {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ここでは話し手が女性なので、動詞は -ती になります。語尾は寝る人に合わせます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson02.translate.005
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: いつ寝ますか？(くだけた言い方、男性に尋ねる場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'तुम のときは、語尾は尋ねる人ではなく尋ねられる人に合わせます： 男性なら सोते、女性なら सोती。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson02.translate.006
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: いつ起きますか？(くだけた言い方、女性に尋ねる場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '女性に尋ねるときは、動詞は -ती で終わります： तुम उठती हो。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson03.choose.001
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: तुम कब वापस आते हो? の आते は、男性に尋ねるときに तुम と一緒に使う -ते の形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson03.fill.002
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: fill_in_blank
  frame:
    text: मैं शाम को छह बजे वापस {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: आता は男性形なので、話しているのは男性です。女性なら आती と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson03.translate.003
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: 夕方に帰ってきます。(男性が話す場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं शाम को वापस {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: शाम の後の को は「夕方に」という意味で、वापस आना は「帰ってくる」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson03.translate.004
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: 私は夕食を食べます。(女性が話す場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रात का खाना {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रात का खाना は直訳すると「夜の食事」で、「夕食」を表します。-ती の語尾から、話しているのが女性だとわかります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit10.lesson03.translate.005
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'वापस は「戻って」という意味で、आना などの動詞と組み合わせます： वापस आता हूँ は「帰ってきます」です。'
    language_code: ja
    direction: ltr
