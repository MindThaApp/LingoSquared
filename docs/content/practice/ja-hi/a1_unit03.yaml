templates:
- content_key: practice.ja-hi.hi.a1.unit03.lesson01.choose.001
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ヒンディー語の曜日は -वार（「〜曜日」の意味）で終わるので、सोमवार、मंगलवार、रविवार はどれも同じ語尾です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson02.listen.001
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 月の名前は英語から取り入れられた言葉なので、जनवरी、मार्च、दिसंबर などは見分けやすいです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson03.choose.001
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अगली は「次の」という意味で、女性名詞に合わせて形が変わります。अगली क्लास は「次のクラス」で、男性名詞なら अगला になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson03.match.002
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: आज（今日）には何も付けませんが、曜日には को（सोमवार को＝月曜日に）、月には में（जनवरी में＝1月に）が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson01.order.002
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 曜日は文の主語なので、आज सोमवार है は直訳すると「今日 月曜日 です」となります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson01.order.003
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: योग क्लास {item} को है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {item} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 曜日のあとの को は「〜に」の意味です。सोमवार को は「月曜日に」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson02.fill.002
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: fill_in_blank
  frame:
    text: आज कितनी {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कितनी は女性名詞 तारीख़ に合わせるので、語末が -ी になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson02.order.003
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: word_order
  frame:
    text: मेरा जन्मदिन {item} में है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {item} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 月のあとの में は「〜に」の意味です。जनवरी में は「1月に」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson03.fill.003
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: अगली क्लास {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कब は「いつ」という意味で、答えが入る位置に置きます：अगली क्लास मंगलवार को है.
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson03.fill.004
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: कोई {item} नहीं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कोई बात नहीं は、お礼やおわびへの日常的な返事で、「どういたしまして」「気にしないで」にあたります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson01.translate.004
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: 今日は何曜日ですか。
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} सा दिन है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कौन सा は「どの」という意味です。आज कौन सा दिन है? では、何曜日かをたずねています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson02.translate.004
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: 私の誕生日は{month}です。
    language_code: ja
    direction: ltr
    slot_rendering:
      month: english_gloss
  slots:
    month: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {month} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 月には में（に）、曜日には को（に）を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson01.translate.005
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: ヨガのクラスは{day}です。
    language_code: ja
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {day} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 曜日は男性名詞で、को は何かが行われる日を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson03.translate.005
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: translation
  frame:
    text: 誕生日はいつ？（親しい相手に）
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा जन्मदिन {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 丁寧な आप を使うときは、आपका जन्मदिन कब है? と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit03.lesson02.translate.005
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: デーヴァナーガリー文字には大文字がないので、曜日や月の名前も大文字を使わずに書きます。
    language_code: ja
    direction: ltr
