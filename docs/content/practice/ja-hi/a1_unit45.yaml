    text: '{item}は、このユニットの単語です。火事についての文章を読むレッスンで出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit45.lesson06.translate.001
  lesson_content_key: hi.a1.unit45.lesson06.vikram_ata_hai
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}は、「ヴィクラムが到着する」のレッスンで学ぶこのユニットの単語の一つです。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit45.lesson01.order.002
  lesson_content_key: hi.a1.unit45.lesson01.madad_aur_ag
  type: word_order
  frame:
    text: आग {item} है!
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: hi
      part_of_speech: verb
      agreement_tags:
        semantic: w_लगी
  answer_derivation:
    kind: render_frame
    frame:
      text: आग {item} है!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 火事です!लगी は「起きた、始まった」という意味です(火事のように女性名詞の主語の場合)。
    language_code: ja
    direction: ltr
