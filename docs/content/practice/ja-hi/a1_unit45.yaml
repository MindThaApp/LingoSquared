    - w_एग्ज़िट
    - w_एम्बुलेंस
    - w_घबराओ
    - w_जाइए
    - w_तरफ़
    - w_दीजिए
    - w_ध्यान
    - w_पता
    - w_पुलिस
    - w_फ़ायर
    - w_ब्रिगेड
    - w_लगी
    - w_लाइब्रेरी
    - w_हुआ
templates:
- content_key: practice.ja-hi.hi.a1.unit45.lesson01.choose.001
  lesson_content_key: hi.a1.unit45.lesson01.madad_aur_ag
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: &id001
      language_code: hi
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_लगी
        - w_इमरजेंसी
        - w_एग्ज़िट
        - w_पुलिस
        - w_एम्बुलेंस
        - w_फ़ायर
        - w_ब्रिगेड
        - w_ध्यान
        - w_दीजिए
        - w_तरफ़
        - w_जाइए
        - w_घबराओ
        - w_लाइब्रेरी
        - w_हुआ
        - w_पता
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、助けと火事のレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit45.lesson02.listen.001
  lesson_content_key: hi.a1.unit45.lesson02.imarjensee_nanbar_aur_imarjensee
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、緊急番号と非常口のレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit45.lesson03.translate.001
  lesson_content_key: hi.a1.unit45.lesson03.pulis_embulens_ya_fayar
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} は、警察・救急車・消防のレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit45.lesson04.match.001
  lesson_content_key: hi.a1.unit45.lesson04.laingvej_kaife_men_ag
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: それぞれのヒンディー語の単語を日本語の意味と組み合わせましょう。単語はこのユニットのレッスンに出てきたものです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit45.lesson05.choose.001
  lesson_content_key: hi.a1.unit45.lesson05.ag_ke_bare_men
  type: multiple_choice
  frame:
