templates:
- content_key: practice.ja-hi.hi.a1.unit12.lesson01.choose.001
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: था と थी は過去を表し、है の代わりに使われて主語に合わせて形が変わります:दिन अच्छा था, फ़िल्म अच्छी थी。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson01.order.002
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: कल का दिन {item} था?
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: कल का दिन {item} था?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा は男性名詞 दिन に合わせた形で、女性名詞なら कैसी になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson01.order.003
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: चाय की दुकान बहुत {item} थी।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: दुकान が女性名詞なので अच्छी は女性形になり、थी もそれに合わせます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson01.fill.004
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: fill_in_blank
  frame:
    text: फ़िल्म अच्छी {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थी は「ある・である」の女性形の過去形で、女性名詞 फ़िल्म に合わせた形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson01.translate.005
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: その映画は良かったです。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फ़िल्म अच्छी {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म は女性名詞なので、形容詞も「~だった」も女性形になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson01.translate.006
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: そのチャイ屋さんはとても良かったです。
    language_code: ja
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की は चाय と女性名詞 दुकान をつなぎ、अच्छी と थी は दुकान に合わせた形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson02.choose.001
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाना と मिलना の過去形は、男性なら -आ、女性なら -ई で終わります:गया か गई、मिला か मिली。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson02.order.002
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: word_order
  frame:
    text: मैं वहाँ प्रिया से {item}।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं वहाँ प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ここでの से は「~と」の意味です。प्रिया से मिला は「プリヤに会った」で、語尾は話し手に合わせます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson02.fill.003
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं कल बाज़ार {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 語尾の -ई は、話し手が女性であることを表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson02.fill.004
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं वहाँ अर्जुन से {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: मिलना の過去形は話し手に合わせるので、女性は मिली と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson02.translate.005
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: 私は家に帰りました。(女性が言う場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं घर {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 女性は गई を使い、男性なら गया と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson02.translate.006
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: 私はプリヤに会いました。(女性が言う場合)
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 会った相手の後ろの से は「~と」の意味で、動詞の語尾は話し手に合わせます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson02.translate.007
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 動詞の過去形は動作をする人に合わせます:男性は मिला、女性は मिली と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson03.choose.001
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: मिले は हम、तुम、वे と一緒に使います:हम मिले は「私たちは会った」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson03.fill.002
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: fill_in_blank
  frame:
    text: वहाँ हम {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: हम の過去形は -ए で終わり、男性複数形と同じです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit12.lesson03.translate.003
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: translation
  frame:
    text: 私たちは会いました。
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: हम {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: グループにだれがいても、हम には複数形の मिले を使います。
    language_code: ja
    direction: ltr
