    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: टिकट、ट्रेン、प्लेटफ़ॉर्म は、英語から入った言葉で、日常のヒンディー語でよく使われます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit15.lesson01.order.003
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: word_order
  frame:
    text: मुझे स्टेशन {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे स्टेशन {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... जाना है は「～しなければならない」という必要を表し、चाहिए と同じく、話し手の性別によって形が変わりません。
    language_code: ja
    direction: ltr
