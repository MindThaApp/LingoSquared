templates:
- content_key: practice.ja-hi.hi.a1.unit15.lesson01.choose.001
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाना は「行く」の辞書形で、मुझे ... जाना है は「私は…に行かなければなりません」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit15.lesson01.listen.002
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
