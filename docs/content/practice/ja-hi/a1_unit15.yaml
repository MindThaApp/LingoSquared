  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे दिल्ली का {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: का は दिल्ली と男性名詞の टिकट をつなぎ、「デリーの切符」という意味になります。
    language_code: ja
    direction: ltr
