  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी बहन {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहन は女性なので、形容詞は -ी の形の लंबी になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson01.fill.005
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: fill_in_blank
  frame:
    text: अर्जुन प्रिया से {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 比べる相手の後ろに付く से は「〜より」の意味で、形容詞は背が高いほうの人に合わせます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson01.fill.006
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ここでは話し手が女性なので、形容詞は -ी で終わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson01.translate.007
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: translation
  frame:
    text: アルジュンはプリヤより背が高いです。(単純な比較で、「もっと」にあたる語は使いません)
    language_code: ja
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: अर्जुन प्रिया से {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 比べる対象には से を付け、形容詞は主語のアルジュンに合わせます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson01.translate.008
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: translation
  frame:
    text: 姉は背が高いです。
    language_code: ja
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी बहन {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहन は女性なので、मेरी も形容詞も、どちらも -ी で終わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson01.translate.009
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 主語が女性のとき、男性形の -ा は -ी に変わります:लंबा は लंबी になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson02.choose.001
  lesson_content_key: hi.a1.unit14.lesson02.vastu_tulna
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: नया と नई は「新しい」の男性形と女性形です。女性形の語尾は -ी ではなく -ई なので注意してください。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson02.order.002
  lesson_content_key: hi.a1.unit14.lesson02.vastu_tulna
