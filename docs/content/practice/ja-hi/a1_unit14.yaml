    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 形容詞は、説明する人に合わせて形が変わります:मेरा भाई लंबा है, मेरी बहन लंबी है.
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson01.order.003
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: word_order
  frame:
    text: मेरा भाई {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा भाई {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: भाई は男性なので、形容詞は -ा の形の लंबा になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson01.order.004
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
