  feedback_frame:
    text: बैग の後ろの से は「〜より」の意味で、形容詞は女性名詞の टोपी に合わせます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson02.fill.005
  lesson_content_key: hi.a1.unit14.lesson02.vastu_tulna
  type: fill_in_blank
  frame:
    text: बैग टोपी से {item} है। ({hint})
