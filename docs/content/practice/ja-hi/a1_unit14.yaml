    kind: slot_text
    slot: item
  feedback_frame:
    text: 形容詞は、से の後ろの語ではなく、主語の बैग に合わせます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson02.translate.006
  lesson_content_key: hi.a1.unit14.lesson02.vastu_tulna
  type: translation
  frame:
    text: 帽子はかばんより新しいです。(単純な比較で、「もっと」にあたる語は使いません)
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: टोपी बैग से {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 比較の文でも、形容詞は主語に合わせます:टोपी は女性なので नई になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson02.translate.007
  lesson_content_key: hi.a1.unit14.lesson02.vastu_tulna
  type: translation
  frame:
    text: このかばんは新しいです。
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह बैग {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नया が नई に変わるのは、टोपी のような女性名詞のときだけです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson02.translate.008
  lesson_content_key: hi.a1.unit14.lesson02.vastu_tulna
  type: translation
