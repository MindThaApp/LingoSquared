templates:
- content_key: practice.ja-hi.hi.a1.unit14.lesson01.choose.001
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: लंबा と लंबी は同じ形容詞の男性形と女性形で、बड़ा と बड़ी の関係と同じです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit14.lesson01.listen.002
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: listen_select
  frame:
