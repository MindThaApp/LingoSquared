templates:
- content_key: practice.ja-hi.hi.a1.unit16.lesson01.choose.001
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दर्द は男性名詞で「痛み」を表し、मुझे सिर दर्द है は「頭が痛い」と言うときの普通の言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson01.listen.002
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ヒンディー語では「私に熱がある」という形で、मुझे बुखार है と言います。「持つ」にあたる動詞ではなく है を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson01.order.003
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: word_order
  frame:
    text: मुझे {item} दर्द है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} दर्द है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ヒンディー語では頭痛を「頭の痛み」のように言い、सिर が दर्द の前に来ます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson01.order.004
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: word_order
  frame:
    text: मुझे सिर {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे सिर {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: सिर दर्द है のように、दर्द は सिर の後、है の前に置きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson01.fill.005
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: fill_in_blank
  frame:
    text: मुझे {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 病気には मुझे ... है を使います。直訳すると「私に熱がある」です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson01.fill.006
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: fill_in_blank
  frame:
    text: मुझे सिर {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: सिर दर्द は「頭」と「痛み」を合わせた複合語です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson01.translate.007
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: translation
  frame:
    text: 熱があります。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ヒンディー語ではここで「持つ」にあたる動詞は使わず、मुझे と है だけで表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson01.translate.008
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: translation
  frame:
    text: 頭が痛いです。(直訳：私に頭の痛みがある)
    language_code: ja
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे सिर {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: सिर दर्द は複合語で、「一つの」にあたる語は付けずに使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson02.choose.001
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: आराम करो は「休んで！」というくだけた命令の形で、名詞 आराम に करो を付けて作ります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson02.order.002
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
    text: मुझे {item} के पास जाना है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} के पास जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 人の後の के पास は「その人のところへ」という意味なので、डॉक्टर के पास जाना は「医者のところへ行く」ことです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson02.order.003
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
    text: तुम्हें {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चाहिए は必要なものの後に来て、通常その後に है は付きません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson02.order.004
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
    text: आराम {item} और डॉक्टर के पास जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आराम {item} और डॉक्टर के पास जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: どちらの命令も、तुम で呼びかける相手に向けた形なので -ो で終わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson02.fill.005
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: fill_in_blank
  frame:
    text: मुझे {item} चाहिए। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 必要なものは मुझे と चाहिए の間に入ります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson02.fill.006
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: fill_in_blank
  frame:
    text: आराम {item}! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: करो は करना のくだけた命令形で、आराम करो は「休んで」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson02.translate.007
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: 私は薬が必要です。
    language_code: ja
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए は、誰が話していても「必要」と「ほしい」の両方に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson02.translate.008
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: 医者に行かなければなりません。
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} के पास जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के पास は医者の後に置き、「医者のところへ」という意味になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson02.translate.009
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: 休んで！(くだけた言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आराम {item}!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: くだけた命令形は -ो で終わります。これは तुम に使う音です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit16.lesson02.translate.010
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: あなたは休みが必要です。(くだけた言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: तुम で呼ぶ相手には、मुझे の代わりに तुम्हें を使います。
    language_code: ja
    direction: ltr
