templates:
- content_key: practice.ja-hi.hi.a1.unit01.lesson01.choose.001
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ヒンディー語には「あなた」を表す言葉が二つあります。आप は丁寧で敬意のある言い方、तुम はくだけた言い方で、友人や同年代・年下の人に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson01.fill.002
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 「be」にあたる動詞は主語によって変わります。मैं には हूँ、तुम には हो、आप には हैं が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson01.order.003
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: word_order
  frame:
    text: आप {item} हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 疑問詞は尋ねる相手に合わせて変わります。男性には कैसे、女性には कैसी を使い、आप には常に हैं が付きます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson01.translate.004
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: お元気ですか?(くだけた・男性に)
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: तुम には動詞 हो が付きます。女性に尋ねるときは कैसे が कैसी に変わります:तुम कैसी हो?
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson01.translate.005
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: お元気ですか?(丁寧・女性に)
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 丁寧な आप は、相手が一人でも複数形に見える हैं を取ります。कैसी は「どう」の女性形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson02.listen.001
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अलविदा は別れのあいさつです。日常会話では नमस्ते が「こんにちは」にも「さようなら」にも使えます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson02.order.002
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: word_order
  frame:
    text: आपका {item} अच्छा रहे।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} अच्छा रहे।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रहे は願いの形(良い状態が続きますように)にし、आपका は丁寧な आप に対して使います。तुम の場合は तुम्हारा になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson02.match.003
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ヒンディー語には日本語と同じように冠詞がなく、नाम は文によって「名前」「ある名前」「その名前」のいずれの意味にもなります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson03.choose.001
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ヒンディー語の疑問文は平叙文と同じ語順です。答えにあたる部分に疑問詞 कहाँ が入ります(आप कहाँ से हैं? と मैं भारत से हूँ)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson03.order.002
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मेरा नाम {name} है।
    language_code: hi
    direction: ltr
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ヒンディー語は動詞が文末に来るので、मेरा नाम ... है は直訳すると「私の名前は…です」の語順になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson03.order.003
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मैं {place} से हूँ।
    language_code: hi
    direction: ltr
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से は場所の後ろに置いて「〜から」を表します。前置詞ではなく後置詞です。日本語の助詞と同じ位置に来ます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson03.fill.004
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: fill_in_blank
  frame:
    text: आपसे मिलकर {item} हुई। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: これは丁寧な「はじめまして/お会いできてうれしいです」で、直訳すると「あなたに会って喜びが生まれた」です。くだけた言い方は तुमसे मिलकर अच्छा लगा です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson03.translate.005
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: 私の名前は{name}です。
    language_code: ja
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नाम は男性名詞なので、男性も女性も मेरा नाम と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson03.translate.006
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: 私は{place}出身です。
    language_code: ja
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 女性も मैं भारत से हूँ と言います。動詞 हूँ は話し手の性別によって変わりません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson03.translate.007
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: どこの出身？（くだけた表現）
    language_code: ja
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} से हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 同じ質問を丁寧に言うには、आप と हैं を使います:आप कहाँ से हैं?
    language_code: ja
    direction: ltr
- content_key: practice.ja-hi.hi.a1.unit01.lesson03.translate.008
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ヒンディー語の名詞には男性と女性があります。दिन、नाम、योग は男性名詞、खुशी は女性名詞です。
    language_code: ja
    direction: ltr
