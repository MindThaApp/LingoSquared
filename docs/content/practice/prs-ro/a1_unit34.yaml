  lesson_content_key: ro.a1.unit34.lesson04.elena_il_intreaba_pe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: هر کلمهٔ رومانیایی را با معنای دری‌اش جور کنید؛ کلمات از درس‌های همین بخش اند.
    language_code: prs
    direction: rtl
