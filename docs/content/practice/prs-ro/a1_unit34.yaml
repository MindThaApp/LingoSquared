    - w_forma
    - w_ghișeu
    - w_iau
    - w_jos
    - w_locuiește
    - w_mașina
    - w_mergi
    - w_mijloc
    - w_necunoscut
    - w_obicei
    - w_politețe
    - w_preferă
    - w_serviciul
    - w_transport
    - w_învățat
templates:
