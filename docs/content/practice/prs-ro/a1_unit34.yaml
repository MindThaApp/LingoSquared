    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} یکی از کلمه‌های این بخش است، از درس خریدن تکت.'
    language_code: prs
    direction: rtl
