templates:
- content_key: practice.prs-ro.ro.a1.unit01.lesson01.choose.001
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'رومانیایی برای «تو/شما» دو کلمه دارد: tu با دوستان و خانواده، و dumneavoastră با ناآشنایان و برای نشان دادن احترام.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson01.listen.002
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Faceți با dumneavoastră می‌آید و faci با tu، پس آخر فعل خودش سطح احترام را نشان می‌دهد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson01.match.003
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
