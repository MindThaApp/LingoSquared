    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Bună ziua با dumneavoastră جور می‌آید و salut با tu: سلامی که انتخاب می‌کنین سطح احترام کل گفتگو را تعیین می‌کند.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson01.translate.004
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mulțumesc تشکر روزمره است و هم با tu و هم با dumneavoastră کار می‌دهد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson01.order.005
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: word_order
  frame:
    text: Bună {item}!
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Bună {item}!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Bună ziua سلام مودبانهٔ روز برای ناآشنایان است؛ با دوستان salut می‌گویید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson01.fill.006
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: fill_in_blank
  frame:
    text: Bine, mulțumesc. Și {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Și dumneavoastră? پرسش مودبانه را برمی‌گرداند؛ با یک دوست Și tu? می‌گویید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson01.translate.007
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: چطور استی؟ (غیررسمی، به یک دوست)
    language_code: prs
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faci? برای دوست است (tu)؛ با ناآشنا Ce mai faceți? می‌گویید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson01.translate.008
  lesson_content_key: ro.a1.unit01.lesson01.tu_dumneavoastra_greetings
  type: translation
  frame:
    text: حال شما چطور است؟ (رسمی، به کسی که با dumneavoastră مخاطبش می‌سازید)
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce mai {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Ce mai faceți? پرسش مودبانه است؛ جواب مودبانه Bine, mulțumesc. Și dumneavoastră? است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson02.order.001
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: word_order
  frame:
    text: Mă numesc {name}.
    language_code: ro
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Mă numesc {name}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Mă numesc معنی لفظی «خود را نام می‌دهم» است؛ Mă cheamă یعنی «مرا صدا می‌کنند».
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson02.fill.002
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: fill_in_blank
  frame:
    text: Îmi {item} bine! ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Îmi pare bine معنی لفظی «برایم خوب معلوم می‌شود» است؛ جواب آن Și mie îmi pare bine است.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson02.translate.003
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: نامت چیست؟ (غیررسمی، به یک دوست)
    language_code: prs
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cum te {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cum te cheamă? برای دوست te دارد؛ به ناآشنا Cum vă numiți? می‌گویید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson02.choose.004
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cum vă numiți? پرسش مودبانه دربارهٔ نام است و vă دارد؛ با دوست به Cum te cheamă? تبدیل می‌شود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson02.listen.005
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Numesc شکل «من» است (mă numesc) و numiți شکل dumneavoastră است (cum vă numiți).
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson02.translate.006
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Și یعنی «و»، و پرسش برگشتی را هم آغاز می‌کند: Și dumneavoastră? یا Și tu?'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson02.match.007
  lesson_content_key: ro.a1.unit01.lesson02.names_introductions
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ro
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'در این عبارت‌های نام، رومانیایی ضمیر را پیش از فعل می‌آورد: mă numesc, vă numiți, te cheamă.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson03.translate.001
  lesson_content_key: ro.a1.unit01.lesson03.street_meeting
  type: translation
  frame:
    text: خوب، تشکر.
    language_code: prs
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Bine, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'بعد از Bine, mulțumesc پرسش را برمی‌گردانید: Și dumneavoastră? (رسمی) یا Și tu? (غیررسمی).'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit01.lesson03.order.002
  lesson_content_key: ro.a1.unit01.lesson03.street_meeting
  type: word_order
  frame:
    text: Și {item} îmi pare bine!
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Și {item} îmi pare bine!
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Și mie îmi pare bine یعنی «من هم خوشحال شدم»؛ mie بر «برای من» تأکید می‌کند و به طرف مقابل جواب می‌دهد.
    language_code: prs
    direction: rtl
