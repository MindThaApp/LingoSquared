    language_code: ro
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Este ora trei fără un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Sfert اسمِ جنس خنثی است و در مفرد un می‌گیرد؛ عبارت وقت از ساعتِ بعدی به عقب می‌شمارد.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit04.lesson03.choose.001
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dimineața، seara و noaptea بخش‌های روز اند و چون حرف تعریف دارند به -a ختم می‌شوند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit04.lesson03.listen.002
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: listen_select
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cursul یعنی صنف؛ «شروع می‌شود» می‌شود începe که هم برای صنف و هم برای رویدادها به کار می‌رود.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit04.lesson03.order.003
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: word_order
  frame:
    text: Cursul {item} la ora nouă.
    language_code: ro
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul {item} la ora nouă.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Începe شکل «او» برای فعل «شروع شدن» است و با فاعل مفرد cursul جور می‌آید.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit04.lesson03.translate.004
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: translation
  frame:
    text: صنف ساعت نه صبح شروع می‌شود.
    language_code: prs
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Cursul începe la ora nouă, {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'بخش روز را بعد از وقت اضافه کنید: la ora nouă, dimineața یا la ora nouă, seara.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit04.lesson03.fill.005
  lesson_content_key: ro.a1.unit04.lesson03.cand_incepe_cursul
  type: fill_in_blank
  frame:
    text: Când începe {item}? ({hint})
    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Când începe cursul? می‌پرسد صنف کی شروع می‌شود؛ جواب آن Cursul începe la ora nouă است.
    language_code: prs
    direction: rtl
