    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Și jumătate سی دقیقه اضافه می‌کند: ora unu și jumătate یعنی یک و نیم.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit04.lesson01.translate.006
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: translation
  frame:
    text: ساعت چند است؟
    language_code: prs
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Cât este {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Cât este ora? در اصل می‌پرسد «ساعت چقدر است»؛ با Este ora + عدد جواب بتین.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit04.lesson01.translate.007
  lesson_content_key: ro.a1.unit04.lesson01.ora_fixa_si_jumatate
  type: translation
  frame:
    text: '{item}'
    language_code: prs
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fără معمولاً یعنی بدون؛ ولی در گفتن وقت، fără un sfert یعنی ربع کم.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit04.lesson02.translate.001
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: translation
  frame:
    text: ساعت دو و ربع است.
    language_code: prs
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Este ora două și un {item}.
      language_code: ro
      direction: ltr
  feedback_frame:
    text: Și un sfert پانزده دقیقه اضافه می‌کند؛ fără un sfert پانزده دقیقه کم می‌کند.
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit04.lesson02.fill.002
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: fill_in_blank
  frame:
