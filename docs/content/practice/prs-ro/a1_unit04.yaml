    language_code: ro
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Fără un sfert پانزده دقیقه کم می‌کند: ora trei fără un sfert یعنی 2:45.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit04.lesson02.translate.003
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: translation
  frame:
    text: ساعت چند؟
    language_code: prs
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: La ce {item}?
      language_code: ro
      direction: ltr
  feedback_frame:
    text: 'La ce oră? می‌پرسد چیزی کی اتفاق می‌افتد؛ جواب با la ora + عدد است: la ora nouă.'
    language_code: prs
    direction: rtl
- content_key: practice.prs-ro.ro.a1.unit04.lesson02.order.004
  lesson_content_key: ro.a1.unit04.lesson02.sferturi_si_intrebari
  type: word_order
  frame:
