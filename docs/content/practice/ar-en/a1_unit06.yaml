    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تحتوي mother وfather وbrother على الصوت th، وهو قريب من «ذ» و«ث» في العربية، وينطق بوضع طرف اللسان بين الأسنان.
    language_code: ar
    direction: rtl
- content_key: practice.ar-en.en.a1.unit06.lesson02.choose.003
