    slot: item
  feedback_frame:
    text: تأتي Parents وsiblings في الإنجليزية بصيغة الجمع؛ وبدل المفرد sibling يقول الناس عادةً brother أو sister.
    language_code: ar
    direction: rtl
- content_key: practice.ar-en.en.a1.unit06.lesson01.listen.002
