  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Grandmother وgrandfather مكوّنتان من grand- مع mother أو father؛ أما في العربية فللجدة وللجد كلمتان مستقلتان.
    language_code: ar
    direction: rtl
