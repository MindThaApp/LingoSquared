    - w_back
    - w_call
    - w_called
    - w_leave
    - w_message
    - w_phone
    - w_repeat
    - w_said
    - w_slowly
    - w_voicemail
    - w_wrote
templates:
- content_key: practice.ar-en.en.a1.unit62.lesson01.choose.001
  lesson_content_key: en.a1.unit62.lesson01.phone_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_call
        - w_voicemail
        - w_message
        - w_phone
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: phone وcall وmessage وvoicemail كلمات أساسية للهاتف؛ وcall اسم وفعل.
    language_code: ar
    direction: rtl
- content_key: practice.ar-en.en.a1.unit62.lesson04.choose.002
