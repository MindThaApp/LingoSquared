  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - hobby_activity
    - frequency_adverb
    - en_a1_u30
slot_presets:
  hobby_activity: &id001
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: hobby_activity
  frequency_adverb: &id002
    language_code: en
    part_of_speech: adverb
    agreement_tags:
      semantic: frequency_adverb
