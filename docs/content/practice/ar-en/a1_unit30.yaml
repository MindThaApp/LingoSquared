  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived 2026-11-15 from practice.nl-en a1 unit30 by remapping the nl-en unit semantic tags to
    the ar-en lexeme tags (en_a1_u30, en_a1_u30_lNN) and translating the Arabic frame/feedback strings.
    Slot pools, templates and answer derivations unchanged (a Dutch-grammar verb-conjugation frame was
    dropped). Needs native Arabic review of the feedback strings.
