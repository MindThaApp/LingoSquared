  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'في الإنجليزية يأتي عادةً أداة تنكير قبل المهنة: a student وa teacher، لكن an engineer لأن الكلمة التالية تبدأ بحرف علة.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-en.en.a1.unit02.lesson02.listen.004
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: listen_select
  frame:
