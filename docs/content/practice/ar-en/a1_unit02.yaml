templates:
- content_key: practice.ar-en.en.a1.unit02.lesson01.choose.001
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Your وmy كلمتان للدلالة على الملكية: my name تعني «اسمي»، و your name تعني «اسمك» للمذكر والمؤنث وللمفرد بلا فرق، فالإنجليزية لا تفرّق في المخاطَب.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-en.en.a1.unit02.lesson01.listen.002
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: listen_select
