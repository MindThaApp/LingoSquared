  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'What''s صيغة مختصرة من what is، وتفتتح السؤال عن الاسم: What''s your name?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-en.en.a1.unit02.lesson02.choose.003
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: multiple_choice
