  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تدل He على الرجل وshe على المرأة؛ وتستعملان مع is: he is وshe is.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-en.en.a1.unit02.lesson03.choose.005
