    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'انتبه إلى عدد المقاطع عند الاستماع: seven وzero فيهما مقطعان، وبقية الأعداد حتى عشرة فيها مقطع واحد.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-en.en.a1.unit03.lesson02.choose.003
  lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'في الأعداد من ثلاثة عشر إلى تسعة عشر تنتهي الكلمة الإنجليزية بـ -teen، وفي العشرات بـ -ty: thirteen مقابل thirty.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-en.en.a1.unit03.lesson02.listen.004
  lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
