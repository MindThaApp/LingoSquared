  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تتشابه fifteen وfifty في النطق لكنهما تختلفان في موضع النبر: في fifteen يقع على المقطع الثاني، وفي fifty على الأول.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-en.en.a1.unit03.lesson03.choose.005
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
