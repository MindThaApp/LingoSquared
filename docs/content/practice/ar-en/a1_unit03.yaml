    slot: item
  feedback_frame:
    text: بالأعداد من صفر إلى عشرة تذكر العمر والأسعار وأرقام الهاتف؛ وتنطق أرقام الهاتف رقمًا رقمًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-en.en.a1.unit03.lesson01.listen.002
  lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
  type: listen_select
  frame:
