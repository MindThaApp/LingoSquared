schema_version: "1.0"
pack_key: practice.en-it.a2.unit30
source_language: en
target_language: it
unit_content_key: it.a2.unit30.colloquio
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-it A2) from scripts/backfill_lexemes_en_it.py lexemes (it_a2_u30* lesson tags, w_<token> anchors).
    Interview frames are the unit's own sentences; formal Lei (parli, sua). L'esperienza and l'ingegnere are kept out of pools next to esperienza and ingegnere so no two glosses collide. Parli is glossed as the formal command here, not as the A1 informal you-speak.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_bene", "w_cinque", "w_colloquio", "w_confermo", "w_dalle", "w_della", "w_disponibile", "w_esperienza", "w_gruppo", "w_ingegnere", "w_l'orario", "w_lunedì", "w_parli", "w_qual", "w_sua"]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: [adjective, adverb, noun], agreement_tags: {semantic: ["w_esperienza", "w_ingegnere", "w_gruppo", "w_disponibile", "w_lunedì", "w_bene"]}}
  pool2: &pool2 {language_code: it, part_of_speech: [adjective, noun], agreement_tags: {semantic: ["w_esperienza", "w_ingegnere", "w_gruppo", "w_disponibile"]}}
  t_esperienza: &t_esperienza {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_esperienza"}}
  t_gruppo: &t_gruppo {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_gruppo"}}
  t_disponibile: &t_disponibile {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: "w_disponibile"}}
  t_ingegnere: &t_ingegnere {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_ingegnere"}}
  t_lunedi_: &t_lunedi_ {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_lunedì"}}
  t_bene: &t_bene {language_code: it, part_of_speech: adverb, agreement_tags: {semantic: "w_bene"}}
  pool9: &pool9 {language_code: it, part_of_speech: [pronoun, verb, noun], agreement_tags: {semantic: ["w_parli", "w_sua", "w_l'orario", "w_cinque", "w_confermo", "w_colloquio"]}}
  pool10: &pool10 {language_code: it, part_of_speech: [verb, noun], agreement_tags: {semantic: ["w_l'orario", "w_cinque", "w_confermo", "w_colloquio"]}}
  t_parli: &t_parli {language_code: it, part_of_speech: verb, agreement_tags: {semantic: "w_parli"}}
  t_della: &t_della {language_code: it, part_of_speech: preposition, agreement_tags: {semantic: "w_della"}}
  t_qual: &t_qual {language_code: it, part_of_speech: pronoun, agreement_tags: {semantic: "w_qual"}}
  t_dalle: &t_dalle {language_code: it, part_of_speech: preposition, agreement_tags: {semantic: "w_dalle"}}
  t_confermo: &t_confermo {language_code: it, part_of_speech: verb, agreement_tags: {semantic: "w_confermo"}}
  t_cinque: &t_cinque {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_cinque"}}
  t_colloquio: &t_colloquio {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_colloquio"}}
  t_l_orario: &t_l_orario {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_l'orario"}}
templates:
  - content_key: practice.en-it.it.a2.unit30.lesson01.choose.001
    lesson_content_key: it.a2.unit30.lesson01.esperienza
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Esperienza is experience.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit30.lesson01.listen.002
    lesson_content_key: it.a2.unit30.lesson01.esperienza
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Disponibile means available.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit30.lesson01.order.003
    lesson_content_key: it.a2.unit30.lesson01.esperienza
    type: word_order
    frame: {text: "Ho {item} come ingegnere a Milano.", language_code: it, direction: ltr}
    slots: {item: *t_esperienza}
    answer_derivation: {kind: render_frame, frame: {text: "Ho {item} come ingegnere a Milano.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Ho esperienza means I have experience.", language_code: en, direction: ltr}
