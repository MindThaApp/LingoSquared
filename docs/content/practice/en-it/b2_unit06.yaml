schema_version: '1.0'
pack_key: practice.en-it.b2.unit06
source_language: en
target_language: it
unit_content_key: it.b2.unit06.astrazione
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-it backfill lexemes (tags it_b2_u6 / w_<token>). 47 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ambiente, w_anche, w_basta, w_bastare, w_buona, w_cambiare, w_capire, w_casi, w_città, w_conta, w_contare, w_convinto, w_costoso, w_cultura, w_dipende, w_dipendere, w_dovrebbero, w_economia, w_facile, w_funzionare, w_funzioni, w_generale, w_giusto, w_grande, w_idea, w_importante, w_limitare, w_massa, w_meno, w_migliore, w_molti, w_necessariamente, w_negativo, w_penso, w_positivo, w_responsabilità, w_sano, w_società, w_svantaggio, w_troppo, w_turismo, w_turisti, w_valere, w_valga, w_vantaggio, w_vivere, w_vivo]
templates:
- content_key: practice.en-it.it.b2.unit06.lesson01.choose.001
  lesson_content_key: it.b2.unit06.lesson01.cosa_ne_pensi
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: &id001
      language_code: it
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_città, w_vivo, w_vivere, w_turismo, w_massa, w_dovrebbero, w_limitare, w_cultura, w_importante, w_economia, w_conta, w_contare, w_anche, w_penso, w_cambiare, w_convinto, w_funzioni, w_funzionare, w_buona, w_idea, w_generale, w_molti, w_casi, w_giusto, w_necessariamente, w_negativo, w_dipende, w_dipendere, w_responsabilità, w_basta, w_bastare, w_capire, w_costoso, w_troppo, w_ambiente, w_positivo, w_vantaggio, w_grande, w_svantaggio, w_società, w_sano, w_meno, w_turisti, w_migliore, w_facile, w_valere, w_valga]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on what do you think?.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit06.lesson02.listen.001
  lesson_content_key: it.b2.unit06.lesson02.unopinione_sfumata
  type: listen_select
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a nuanced opinion.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit06.lesson03.translate.001
  lesson_content_key: it.b2.unit06.lesson03.rispondere_a_unobiezione
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on responding to an objection.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit06.lesson04.match.001
  lesson_content_key: it.b2.unit06.lesson04.pro_e_contro
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: it, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Italian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
