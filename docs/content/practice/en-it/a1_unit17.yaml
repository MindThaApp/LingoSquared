schema_version: "1.0"
pack_key: practice.en-it.a1.unit17
source_language: en
target_language: it
unit_content_key: it.a1.unit17.work
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u17* lesson tags, w_<token> anchors).
    Insegnante is the same for a man and a woman; commesso is masculine, so its prompt says 'said by a man'. Questions say informal (tu). Pools span lessons because lessons 1 and 2 have only two lexemes each.
    Reviewer check: none beyond register.
    Opus pass: softened an absolute no-article claim (sono un insegnante is also heard).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_commesso, w_finisco, w_inizi, w_inizio, w_insegnante, w_lavori, w_scuola]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_insegnante, w_commesso, w_scuola]}}
  pool2: &pool2 {language_code: it, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_insegnante, w_commesso, w_scuola, w_lavori]}}
  pool3: &pool3 {language_code: it, part_of_speech: verb, agreement_tags: {semantic: [w_inizio, w_finisco, w_inizi, w_lavori]}}
  t_insegnante: &t_insegnante {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_insegnante}}
  t_lavori: &t_lavori {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_lavori}}
  t_scuola: &t_scuola {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_scuola}}
  t_finisco: &t_finisco {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_finisco}}
  t_inizi: &t_inizi {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_inizi}}
  t_commesso: &t_commesso {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_commesso}}
  pool10: &pool10 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_insegnante, w_scuola, w_commesso]}}
  pool11: &pool11 {language_code: it, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_insegnante, w_commesso, w_scuola, w_lavori, w_inizio, w_finisco, w_inizi]}}
templates:
  - content_key: practice.en-it.it.a1.unit17.lesson02.choose.001
    lesson_content_key: it.a1.unit17.lesson02.dove_lavori
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Insegnante names a teacher; commesso is a male shop assistant.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson02.listen.002
    lesson_content_key: it.a1.unit17.lesson02.dove_lavori
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Lavori is the informal tu form of the verb: you work.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson03.choose.001
    lesson_content_key: it.a1.unit17.lesson03.a_che_ora_inizi
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Inizio and finisco are I forms; inizi is the informal you form.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson01.order.001
    lesson_content_key: it.a1.unit17.lesson01.che_lavoro_fai
    type: word_order
    frame: {text: "Sono {item}, non sono commesso.", language_code: it, direction: ltr}
    slots: {item: *t_insegnante}
    answer_derivation: {kind: render_frame, frame: {text: "Sono {item}, non sono commesso.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Insegnante has one form for men and women.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson02.order.003
    lesson_content_key: it.a1.unit17.lesson02.dove_lavori
    type: word_order
    frame: {text: "Dove {item}?", language_code: it, direction: ltr}
    slots: {item: *t_lavori}
    answer_derivation: {kind: render_frame, frame: {text: "Dove {item}?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Lavori is the informal tu form: where do you work?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson02.fill.004
    lesson_content_key: it.a1.unit17.lesson02.dove_lavori
    type: fill_in_blank
    frame: {text: "Lavoro in una {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_scuola, hint: *t_scuola}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Scuola is feminine, so it takes una.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson03.fill.002
    lesson_content_key: it.a1.unit17.lesson03.a_che_ora_inizi
    type: fill_in_blank
    frame: {text: "Inizio alle nove e {item} alle cinque. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_finisco, hint: *t_finisco}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Finisco is the I form of finire: I finish.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson03.fill.003
    lesson_content_key: it.a1.unit17.lesson03.a_che_ora_inizi
    type: fill_in_blank
    frame: {text: "A che ora {item}? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_inizi, hint: *t_inizi}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Inizi is the informal tu form: what time do you start?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson01.translate.002
    lesson_content_key: it.a1.unit17.lesson01.che_lavoro_fai
    type: translation
    frame: {text: "I am a teacher.", language_code: en, direction: ltr}
    slots: {item: *t_insegnante}
    answer_derivation: {kind: render_frame, frame: {text: "Sono {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Italian usually drops the article with a job after sono: sono insegnante.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson01.translate.003
    lesson_content_key: it.a1.unit17.lesson01.che_lavoro_fai
    type: translation
    frame: {text: "I am a shop assistant. (said by a man)", language_code: en, direction: ltr}
    slots: {item: *t_commesso}
    answer_derivation: {kind: render_frame, frame: {text: "Sono {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Commesso is the masculine form of the word.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson02.translate.005
    lesson_content_key: it.a1.unit17.lesson02.dove_lavori
    type: translation
    frame: {text: "Where do you work? (informal, tu)", language_code: en, direction: ltr}
    slots: {item: *t_lavori}
    answer_derivation: {kind: render_frame, frame: {text: "Dove {item}?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Lavori ends in -i for the informal tu form.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson03.translate.004
    lesson_content_key: it.a1.unit17.lesson03.a_che_ora_inizi
    type: translation
    frame: {text: "I start at nine and finish at five.", language_code: en, direction: ltr}
    slots: {item: *t_finisco}
    answer_derivation: {kind: render_frame, frame: {text: "Inizio alle nove e {item} alle cinque.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Alle plus a number gives the time.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson03.translate.005
    lesson_content_key: it.a1.unit17.lesson03.a_che_ora_inizi
    type: translation
    frame: {text: "What time do you start? (informal, tu)", language_code: en, direction: ltr}
    slots: {item: *t_inizi}
    answer_derivation: {kind: render_frame, frame: {text: "A che ora {item}?", language_code: it, direction: ltr}}
    feedback_frame: {text: "A che ora asks at what time.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson02.translate.006
    lesson_content_key: it.a1.unit17.lesson02.dove_lavori
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Insegnante and commesso are jobs; scuola is a place.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit17.lesson03.match.006
    lesson_content_key: it.a1.unit17.lesson03.a_che_ora_inizi
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *pool11, second: *pool11, third: *pool11, fourth: *pool11, fifth: *pool11, sixth: *pool11}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Inizio and finisco are I forms, inizi and lavori are informal you forms.", language_code: en, direction: ltr}
