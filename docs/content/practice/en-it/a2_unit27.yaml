  pool9: &pool9 {language_code: it, part_of_speech: [verb, noun], agreement_tags: {semantic: ["w_aiutarla", "w_servono", "w_informazioni", "w_posso"]}}
  t_posso: &t_posso {language_code: it, part_of_speech: verb, agreement_tags: {semantic: "w_posso"}}
  t_servono: &t_servono {language_code: it, part_of_speech: verb, agreement_tags: {semantic: "w_servono"}}
  t_informazioni: &t_informazioni {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_informazioni"}}
  t_aiutarla: &t_aiutarla {language_code: it, part_of_speech: verb, agreement_tags: {semantic: "w_aiutarla"}}
  pool14: &pool14 {language_code: it, part_of_speech: [proper_noun, verb, noun], agreement_tags: {semantic: ["w_aiutarla", "w_servono", "w_informazioni", "w_posso", "w_Italia"]}}
