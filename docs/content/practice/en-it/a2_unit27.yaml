  t_carta: &t_carta {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_carta"}}
  t_corrente: &t_corrente {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: "w_corrente"}}
  t_inclusa: &t_inclusa {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: "w_inclusa"}}
  t_conto: &t_conto {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_conto"}}
