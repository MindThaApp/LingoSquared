templates:
  - content_key: practice.en-it.it.a2.unit27.lesson01.choose.001
    lesson_content_key: it.a2.unit27.lesson01.conto_corrente
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Conto corrente is a checking account.", language_code: en, direction: ltr}
