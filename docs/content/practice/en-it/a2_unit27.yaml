schema_version: "1.0"
pack_key: practice.en-it.a2.unit27
source_language: en
target_language: it
unit_content_key: it.a2.unit27.banca
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-it A2) from scripts/backfill_lexemes_en_it.py lexemes (it_a2_u27* lesson tags, w_<token> anchors).
    Bank frames are the unit's own sentences. Conto is glossed 'bank account; bill' here because the A1 gloss only covered the restaurant bill. AiutarLa is written aiutarla (case folds).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
