schema_version: "1.0"
pack_key: practice.en-it.a1.unit10
source_language: en
target_language: it
unit_content_key: it.a1.unit10.directions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u10* lesson tags, w_<token> anchors).
    Direction prompts for the commands vada, giri, continui say formal (Lei). The destra/sinistra frame lists both words; either gives a correct sentence. Frames use earlier-unit words (cinque, scusi, grazie mille) as literal text.
    Reviewer check: 'Poi continui sempre dritto' stays close to the unit but is not a verbatim sentence from it.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_all'incrocio", w_continui, w_destra, w_dritto, w_gentile, w_giri, w_lontano, w_minuti, w_molto, w_museo, w_no, w_piedi, w_poi, w_sempre, w_sinistra, w_solo, w_vada]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: [noun, adverb, adjective, verb], agreement_tags: {semantic: [w_destra, w_sinistra, w_sempre, w_dritto, "w_all'incrocio", w_museo, w_vada, w_poi, w_giri]}}
  pool2: &pool2 {language_code: it, part_of_speech: [noun, adjective, verb, adverb], agreement_tags: {semantic: [w_destra, w_sinistra, w_dritto, w_museo, w_vada, w_giri, w_sempre]}}
  pool3: &pool3 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_destra, w_sinistra]}}
  t_museo: &t_museo {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_museo}}
  pool5: &pool5 {language_code: it, part_of_speech: [noun, adjective], agreement_tags: {semantic: [w_destra, w_sinistra, w_museo, w_lontano, w_minuti, w_piedi, w_gentile]}}
  t_all_incrocio: &t_all_incrocio {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_all'incrocio"}}
  pool7: &pool7 {language_code: it, part_of_speech: [adjective, adverb, noun], agreement_tags: {semantic: [w_lontano, w_no, w_solo, w_minuti, w_piedi, w_molto, w_gentile]}}
  pool8: &pool8 {language_code: it, part_of_speech: [adjective, adverb, noun], agreement_tags: {semantic: [w_lontano, w_solo, w_minuti, w_piedi, w_molto, w_gentile]}}
  t_solo: &t_solo {language_code: it, part_of_speech: adverb, agreement_tags: {semantic: w_solo}}
  t_lontano: &t_lontano {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: w_lontano}}
  t_molto: &t_molto {language_code: it, part_of_speech: adverb, agreement_tags: {semantic: w_molto}}
  pool12: &pool12 {language_code: it, part_of_speech: verb, agreement_tags: {semantic: [w_continui, w_vada, w_giri]}}
  t_continui: &t_continui {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_continui}}
  pool14: &pool14 {language_code: it, part_of_speech: [noun, adjective], agreement_tags: {semantic: [w_destra, w_sinistra, w_museo, w_minuti, w_piedi, w_lontano, w_gentile]}}
templates:
  - content_key: practice.en-it.it.a1.unit10.lesson01.choose.001
    lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Vada and giri are formal commands, used with strangers.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson01.listen.002
    lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Sempre dritto means straight ahead.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson01.order.003
    lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
    type: word_order
    frame: {text: "Vada sempre dritto, poi giri a {item} all'incrocio.", language_code: it, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: render_frame, frame: {text: "Vada sempre dritto, poi giri a {item} all'incrocio.", language_code: it, direction: ltr}}
    feedback_frame: {text: "A destra and a sinistra are the two turning directions.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson01.fill.004
    lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
    type: fill_in_blank
    frame: {text: "Scusi, come arrivo al {item}? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_museo, hint: *t_museo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Al museo is a plus il: al is the contraction for masculine places.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson02.match.001
    lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *pool5, second: *pool5, third: *pool5, fourth: *pool5, fifth: *pool5, sixth: *pool5}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Destra is right and sinistra is left.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson01.translate.005
    lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
    type: translation
    frame: {text: "Excuse me, how do I get to the museum? (formal)", language_code: en, direction: ltr}
    slots: {item: *t_museo}
    answer_derivation: {kind: render_frame, frame: {text: "Scusi, come arrivo al {item}?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Scusi addresses a stranger formally.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson01.translate.006
    lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
    type: translation
    frame: {text: "Go straight ahead, then turn right at the intersection. (formal)", language_code: en, direction: ltr}
    slots: {item: *t_all_incrocio}
    answer_derivation: {kind: render_frame, frame: {text: "Vada sempre dritto, poi giri a destra {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "All'incrocio means at the intersection.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson02.choose.002
    lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool7}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "A piedi means on foot, literally on feet.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson02.listen.003
    lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool8}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Solo means only and goes before the quantity: solo cinque minuti.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson02.fill.004
    lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
    type: fill_in_blank
    frame: {text: "Sono {item} cinque minuti a piedi. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_solo, hint: *t_solo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Solo is placed before cinque minuti to mean only five minutes.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson02.order.005
    lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
    type: word_order
    frame: {text: "È {item} da qui?", language_code: it, direction: ltr}
    slots: {item: *t_lontano}
    answer_derivation: {kind: render_frame, frame: {text: "È {item} da qui?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Lontano da qui means far from here.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson02.translate.006
    lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
    type: translation
    frame: {text: "Is it far from here?", language_code: en, direction: ltr}
    slots: {item: *t_lontano}
    answer_derivation: {kind: render_frame, frame: {text: "È {item} da qui?", language_code: it, direction: ltr}}
    feedback_frame: {text: "È lontano da qui? is the everyday way to ask the distance.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson02.translate.007
    lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
    type: translation
    frame: {text: "No, it's only five minutes on foot.", language_code: en, direction: ltr}
    slots: {item: *t_solo}
    answer_derivation: {kind: render_frame, frame: {text: "No, sono {item} cinque minuti a piedi.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Sono cinque minuti is used because minuti is plural.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson02.translate.008
    lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
    type: translation
    frame: {text: "Thanks a lot, very kind. (formal)", language_code: en, direction: ltr}
    slots: {item: *t_molto}
    answer_derivation: {kind: render_frame, frame: {text: "Grazie mille, {item} gentile.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Molto gentile is a polite way to thank someone formally.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson03.choose.001
    lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool12}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Continui, vada and giri are all formal commands.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson03.order.002
    lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
    type: word_order
    frame: {text: "Poi {item} sempre dritto.", language_code: it, direction: ltr}
    slots: {item: *t_continui}
    answer_derivation: {kind: render_frame, frame: {text: "Poi {item} sempre dritto.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Continui is the formal command: continue.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson03.translate.003
    lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
    type: translation
    frame: {text: "Then continue straight ahead. (formal)", language_code: en, direction: ltr}
    slots: {item: *t_continui}
    answer_derivation: {kind: render_frame, frame: {text: "Poi {item} sempre dritto.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Continui is the Lei command form of continuare.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit10.lesson02.translate.009
    lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool14}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Destra and sinistra are right and left; lontano is far.", language_code: en, direction: ltr}
