schema_version: '1.0'
pack_key: practice.en-it.a1.unit53
source_language: en
target_language: it
unit_content_key: it.a1.unit53.personalita
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-it backfill lexemes (tags it_a1_u53 / w_<token>). 15 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_benvenuta, w_calmo, w_chiede, w_conoscete, w_curioso, w_divertente, w_infermiera, w_nostro, w_paziente, w_racconta, w_stesso, w_tanto, w_timido, w_trovo, w_vedi]
templates:
- content_key: practice.en-it.it.a1.unit53.lesson01.choose.001
  lesson_content_key: it.a1.unit53.lesson01.gentile_e_divertente
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: &id001
      language_code: it
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_divertente, w_calmo, w_paziente, w_curioso, w_trovo, w_vedi, w_timido, w_conoscete, w_tanto, w_infermiera, w_chiede, w_racconta, w_stesso, w_benvenuta, w_nostro]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on kind and funny.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit53.lesson02.listen.001
  lesson_content_key: it.a1.unit53.lesson02.calmo_e_paziente
  type: listen_select
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on calm and patient.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit53.lesson03.translate.001
  lesson_content_key: it.a1.unit53.lesson03.curioso_e_timido
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on curious and shy.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit53.lesson04.match.001
  lesson_content_key: it.a1.unit53.lesson04.nina_chiede_al_caffe
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: it, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Italian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit53.lesson05.choose.001
  lesson_content_key: it.a1.unit53.lesson05.nina_sente_parlare_di
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on nina hears about everyone.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit53.lesson06.translate.001
  lesson_content_key: it.a1.unit53.lesson06.nina_si_descrive
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on nina describes herself.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit53.lesson01.order.002
  lesson_content_key: it.a1.unit53.lesson01.gentile_e_divertente
  type: word_order
  frame: {text: 'Luca è {item}.', language_code: it, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags: {semantic: w_divertente}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Luca è {item}.', language_code: it, direction: ltr}
  feedback_frame: {text: Luca is funny. divertente means funny; fun., language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit53.lesson02.order.002
  lesson_content_key: it.a1.unit53.lesson02.calmo_e_paziente
  type: word_order
  frame: {text: 'Marco è {item}.', language_code: it, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags: {semantic: w_calmo}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Marco è {item}.', language_code: it, direction: ltr}
  feedback_frame: {text: Marco is calm. calmo means calm (masc.)., language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit53.lesson02.fill.003
  lesson_content_key: it.a1.unit53.lesson02.calmo_e_paziente
  type: fill_in_blank
  frame:
    text: Giulia è {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags: {semantic: w_paziente}
    hint:
      language_code: it
      part_of_speech: adjective
      agreement_tags: {semantic: w_paziente}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Giulia is patient. paziente means patient., language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit53.lesson06.order.002
  lesson_content_key: it.a1.unit53.lesson06.nina_si_descrive
  type: word_order
  frame: {text: 'Benvenuta al {item} caffè linguistico!', language_code: it, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags: {semantic: w_nostro}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Benvenuta al {item} caffè linguistico!', language_code: it, direction: ltr}
  feedback_frame: {text: Welcome to our language café! nostro means our., language_code: en, direction: ltr}
