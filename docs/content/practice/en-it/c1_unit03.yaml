      language_code: it
      part_of_speech: noun
      agreement_tags: {semantic: w_tono}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: Perhaps we could soften the tone. tono means tone., language_code: en, direction: ltr}
