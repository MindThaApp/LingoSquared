schema_version: '1.0'
pack_key: practice.en-it.c1.unit03
source_language: en
target_language: it
unit_content_key: it.c1.unit03.registro
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-it backfill lexemes (tags it_c1_u3 / w_<token>). 40 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ammorbidire, w_ancora, w_assolutamente, w_certo, w_chiedo, w_concederci, w_consegniamola, w_controllo, w_cortesemente, w_cura, w_destinatario, w_diplomatico, w_direttrice, w_diversi, w_dobbiamo, w_due, w_enfatico, w_evita, w_formale, w_forse, w_fraintendimenti, w_ironico, w_mai, w_messaggio, w_obiezione, w_potrebbe, w_potremmo, w_preciso, w_prenderci, w_pubblici, w_pure, w_registro, w_relazione, w_rivedere, w_rivista, w_spostare, w_stesso, w_storto, w_tempo, w_tono]
templates:
- content_key: practice.en-it.it.c1.unit03.lesson01.choose.001
  lesson_content_key: it.c1.unit03.lesson01.distinguere_toni
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: &id001
      language_code: it
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_registro, w_tono, w_formale, w_diplomatico, w_enfatico, w_ironico, w_destinatario, w_chiedo, w_cortesemente, w_concederci, w_rivedere, w_relazione, w_tempo, w_forse, w_potremmo, w_prenderci, w_ancora, w_ammorbidire, w_obiezione, w_dobbiamo, w_assolutamente, w_rivista, w_cura, w_consegniamola, w_pure, w_storto, w_certo, w_potrebbe, w_mai, w_stesso, w_messaggio, w_due, w_pubblici, w_diversi, w_direttrice, w_spostare, w_controllo, w_preciso, w_evita, w_fraintendimenti]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on distinguish tones.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.c1.unit03.lesson02.listen.001
  lesson_content_key: it.c1.unit03.lesson02.formale_lei
  type: listen_select
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on use formal lei.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.c1.unit03.lesson03.translate.001
  lesson_content_key: it.c1.unit03.lesson03.diplomazia
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on soften diplomatically.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.c1.unit03.lesson04.match.001
  lesson_content_key: it.c1.unit03.lesson04.enfasi_ironia
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: it, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Italian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-it.it.c1.unit03.lesson05.choose.001
  lesson_content_key: it.c1.unit03.lesson05.stesso_messaggio
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on same message, two audiences.', language_code: en, direction: ltr}
