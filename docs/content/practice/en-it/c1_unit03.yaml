  lesson_content_key: it.c1.unit03.lesson01.distinguere_toni
  type: word_order
  frame: {text: 'Il {item} cambia in base al destinatario.', language_code: it, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags: {semantic: w_registro}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Il {item} cambia in base al destinatario.', language_code: it, direction: ltr}
  feedback_frame: {text: Register changes according to the audience. registro means register; level of formality., language_code: en, direction: ltr}
