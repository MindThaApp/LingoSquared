schema_version: "1.0"
pack_key: practice.en-it.b1.unit40
source_language: en
target_language: it
unit_content_key: it.b1.unit40.racconto
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Past narrative: passato prossimo for completed actions (sono arrivato, ho consegnato, ha chiamato, ha detto) against imperfetto for the background (preparavo, aspettava). Variants accept a reordered time word, poi for dopo and stava aspettando. NATIVE FLAG: sono arrivato / ha chiamato use the unit's auxiliaries; a female speaker would write arrivata.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_arrivato", "w_aspettava", "w_chiamato", "w_consegnato", "w_detto", "w_dopo", "w_e", "w_ha", "w_mentre", "w_preparavo", "w_ufficio"]
slot_presets:
  p1: &p1 {language_code: it, part_of_speech: ["verb", "noun", "adverb", "particle"], agreement_tags: {semantic: ["w_arrivato", "w_ufficio", "w_dopo", "w_consegnato", "w_mentre", "w_preparavo", "w_chiamato", "w_detto", "w_aspettava"]}}
  p2: &p2 {language_code: it, part_of_speech: ["particle", "verb"], agreement_tags: {semantic: ["w_mentre", "w_preparavo", "w_chiamato", "w_detto", "w_aspettava"]}}
  p3: &p3 {language_code: it, part_of_speech: ["verb", "noun", "adverb", "particle"], agreement_tags: {semantic: ["w_arrivato", "w_ufficio", "w_dopo", "w_consegnato", "w_mentre", "w_preparavo", "w_chiamato", "w_aspettava"]}}
  p4: &p4 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_arrivato"]}}
  p5: &p5 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_ufficio"]}}
  p6: &p6 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_consegnato"]}}
  p7: &p7 {language_code: it, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_dopo"]}}
  p8: &p8 {language_code: it, part_of_speech: ["particle"], agreement_tags: {semantic: ["w_mentre"]}}
  p9: &p9 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_preparavo"]}}
  p10: &p10 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_ha"]}}
  p11: &p11 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_chiamato"]}}
  p12: &p12 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_detto"]}}
  p13: &p13 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_aspettava"]}}
  p14: &p14 {language_code: it, part_of_speech: ["particle"], agreement_tags: {semantic: ["w_e"]}}
templates:
  - content_key: practice.en-it.it.b1.unit40.lesson01.choose.001
    lesson_content_key: it.b1.unit40.lesson01.sequenza_passata
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on telling a story in the past.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson01.listen.001
    lesson_content_key: it.b1.unit40.lesson01.sequenza_passata
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the story unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson02.choose.001
    lesson_content_key: it.b1.unit40.lesson02.mentre_disse
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the second lesson of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson01.translate.001
    lesson_content_key: it.b1.unit40.lesson01.sequenza_passata
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p3}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson01.match.001
    lesson_content_key: it.b1.unit40.lesson01.sequenza_passata
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p3, second: *p3, third: *p3, fourth: *p3, fifth: *p3, sixth: *p3}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the story vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson01.translate.002
    lesson_content_key: it.b1.unit40.lesson01.sequenza_passata
    type: translation
    frame: {text: "Yesterday I arrived at the office.", language_code: en, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Ieri sono {item} in ufficio.", language_code: it, direction: ltr}, accepted_variants: ["Ieri io sono {item} in ufficio.", "Sono {item} in ufficio ieri."]}
    feedback_frame: {text: "Arrivare takes essere, so the participle is arrivato.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson01.order.001
    lesson_content_key: it.b1.unit40.lesson01.sequenza_passata
    type: word_order
    frame: {text: "Ieri sono arrivato in {item}.", language_code: it, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Ieri sono arrivato in {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "In ufficio means at the office.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson01.translate.003
    lesson_content_key: it.b1.unit40.lesson01.sequenza_passata
    type: translation
    frame: {text: "Then I handed in the form.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Dopo ho {item} il modulo.", language_code: it, direction: ltr}, accepted_variants: ["Poi ho {item} il modulo.", "Io dopo ho {item} il modulo."]}
    feedback_frame: {text: "Consegnare takes avere: ho consegnato.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson01.fill.001
    lesson_content_key: it.b1.unit40.lesson01.sequenza_passata
    type: fill_in_blank
    frame: {text: "{item} ho consegnato il modulo. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Dopo marks the next step in the story.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson02.translate.001
    lesson_content_key: it.b1.unit40.lesson02.mentre_disse
    type: translation
    frame: {text: "While I was preparing the report, Elena called.", language_code: en, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "{item} preparavo il rapporto, Elena ha chiamato.", language_code: it, direction: ltr}, accepted_variants: ["Elena ha chiamato {item} preparavo il rapporto."]}
    feedback_frame: {text: "Mentre introduces the action in progress.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson02.fill.001
    lesson_content_key: it.b1.unit40.lesson02.mentre_disse
    type: fill_in_blank
    frame: {text: "Mentre {item} il rapporto, Elena ha chiamato. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The imperfect describes what was going on: preparavo.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson02.fill.002
    lesson_content_key: it.b1.unit40.lesson02.mentre_disse
    type: fill_in_blank
    frame: {text: "Mentre preparavo il rapporto, Elena {item} chiamato. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p10, hint: *p10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Chiamare takes avere: ha chiamato.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson02.order.001
    lesson_content_key: it.b1.unit40.lesson02.mentre_disse
    type: word_order
    frame: {text: "Mentre preparavo il rapporto, Elena ha {item}.", language_code: it, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: render_frame, frame: {text: "Mentre preparavo il rapporto, Elena ha {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "The participle comes after ha.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson02.translate.002
    lesson_content_key: it.b1.unit40.lesson02.mentre_disse
    type: translation
    frame: {text: "Elena said that Sam was waiting for the confirmation.", language_code: en, direction: ltr}
    slots: {item: *p12}
    answer_derivation: {kind: render_frame, frame: {text: "Elena ha {item} che Sam aspettava la conferma.", language_code: it, direction: ltr}, accepted_variants: ["Elena ha {item} che Sam stava aspettando la conferma."]}
    feedback_frame: {text: "Detto is the irregular participle of dire.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson02.fill.003
    lesson_content_key: it.b1.unit40.lesson02.mentre_disse
    type: fill_in_blank
    frame: {text: "Elena ha detto che Sam {item} la conferma. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p13, hint: *p13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The imperfect gives the background: aspettava.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit40.lesson02.order.002
    lesson_content_key: it.b1.unit40.lesson02.mentre_disse
    type: word_order
    frame: {text: "Mentre preparavo il rapporto, Elena ha chiamato {item} ha detto che Sam aspettava la conferma.", language_code: it, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "Mentre preparavo il rapporto, Elena ha chiamato {item} ha detto che Sam aspettava la conferma.", language_code: it, direction: ltr}}
    feedback_frame: {text: "E joins the two actions.", language_code: en, direction: ltr}
