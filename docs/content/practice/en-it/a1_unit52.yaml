        semantic: [w_cipolla, w_pomodoro, w_tagliare, w_taglio, w_cena, w_padella, w_friggere, w_friggo, w_preparare, w_preparo, w_assaggiare, w_assaggia, w_entra, w_tagliamo, w_friggi, w_assaggi, w_cucinano, w_frigge, w_prepara, w_pronta, w_prepari, w_prepariamo, w_buonissima, w_appetito]
