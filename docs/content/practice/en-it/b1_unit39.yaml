    lesson_content_key: it.b1.unit39.lesson01.responsabilita
    type: translation
    frame: {text: "I take care of the report.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Mi {item} del rapporto.", language_code: it, direction: ltr}, accepted_variants: ["Io mi {item} del rapporto."]}
    feedback_frame: {text: "Occuparsi di takes the pronoun mi: mi occupo di.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit39.lesson01.translate.003
    lesson_content_key: it.b1.unit39.lesson01.responsabilita
    type: translation
    frame: {text: "I take care of the report every week.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Mi occupo del {item} ogni settimana.", language_code: it, direction: ltr}, accepted_variants: ["Ogni settimana mi occupo del {item}.", "Mi occupo del {item} tutte le settimane."]}
    feedback_frame: {text: "Del is di + il.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit39.lesson01.fill.001
    lesson_content_key: it.b1.unit39.lesson01.responsabilita
    type: fill_in_blank
    frame: {text: "Mi occupo {item} rapporto ogni settimana. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mi occupo del introduces what you handle.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit39.lesson01.order.001
    lesson_content_key: it.b1.unit39.lesson01.responsabilita
    type: word_order
    frame: {text: "Mi occupo del rapporto ogni {item}.", language_code: it, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Mi occupo del rapporto ogni {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Ogni is followed by a singular noun.", language_code: en, direction: ltr}
