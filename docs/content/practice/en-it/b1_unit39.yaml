    lesson_content_key: it.b1.unit39.lesson01.responsabilita
    type: translation
    frame: {text: "Today I am responsible for the report.", language_code: en, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Oggi sono {item} del rapporto.", language_code: it, direction: ltr}, accepted_variants: ["Io oggi sono {item} del rapporto.", "Sono {item} del rapporto oggi."]}
    feedback_frame: {text: "Responsabile is followed by di.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit39.lesson02.translate.001
    lesson_content_key: it.b1.unit39.lesson02.aggiornamento_aiuto
    type: translation
    frame: {text: "Today the report is almost ready.", language_code: en, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: render_frame, frame: {text: "Oggi il rapporto è {item} pronto.", language_code: it, direction: ltr}, accepted_variants: ["Il rapporto è {item} pronto oggi."]}
    feedback_frame: {text: "Quasi comes before the adjective.", language_code: en, direction: ltr}
