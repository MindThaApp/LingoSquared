schema_version: "1.0"
pack_key: practice.en-it.b1.unit45
source_language: en
target_language: it
unit_content_key: it.b1.unit45.consigli
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Advice: se fossi in te + conditional, dovresti + infinitive, perche non chiedi, ci penso. Variants accept al posto tuo, col for con il, and clause reorderings. NATIVE FLAG: the unit uses tu throughout; formal advice (se fossi in Lei) is not covered.
tag_schema:
