templates:
  - content_key: practice.en-it.it.b1.unit45.lesson01.choose.001
    lesson_content_key: it.b1.unit45.lesson01.se_fossi_in_te
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on giving advice.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit45.lesson01.listen.001
    lesson_content_key: it.b1.unit45.lesson01.se_fossi_in_te
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on advice.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit45.lesson02.choose.001
    lesson_content_key: it.b1.unit45.lesson02.perche_non_e_risposta
