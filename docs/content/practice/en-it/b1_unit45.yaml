    lesson_content_key: it.b1.unit45.lesson01.se_fossi_in_te
    type: fill_in_blank
    frame: {text: "Se fossi in {item}, parlerei con il capo domani. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: slot_text, slot: item}
