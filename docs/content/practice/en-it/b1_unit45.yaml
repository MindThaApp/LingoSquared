    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Dovresti {item} il problema con calma.", language_code: it, direction: ltr}, accepted_variants: ["Tu dovresti {item} il problema con calma.", "Dovresti {item} con calma il problema."]}
    feedback_frame: {text: "Dovresti is followed by the infinitive.", language_code: en, direction: ltr}
