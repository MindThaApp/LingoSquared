    lesson_content_key: it.b1.unit45.lesson01.se_fossi_in_te
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit45.lesson01.match.001
    lesson_content_key: it.b1.unit45.lesson01.se_fossi_in_te
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the advice vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit45.lesson01.translate.002
    lesson_content_key: it.b1.unit45.lesson01.se_fossi_in_te
    type: translation
    frame: {text: "If I were you, I would talk to the boss tomorrow.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Se {item} in te, parlerei con il capo domani.", language_code: it, direction: ltr}, accepted_variants: ["Se {item} al posto tuo, parlerei con il capo domani.", "Io, se {item} in te, parlerei con il capo domani."]}
    feedback_frame: {text: "Se fossi in te introduces advice.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit45.lesson01.translate.003
    lesson_content_key: it.b1.unit45.lesson01.se_fossi_in_te
    type: translation
    frame: {text: "If I were you, I would talk to the boss tomorrow.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Se fossi in te, {item} con il capo domani.", language_code: it, direction: ltr}, accepted_variants: ["Se fossi in te, io {item} con il capo domani."]}
    feedback_frame: {text: "The advice uses the conditional: parlerei.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit45.lesson01.translate.004
    lesson_content_key: it.b1.unit45.lesson01.se_fossi_in_te
    type: translation
    frame: {text: "If I were you, I would talk to the boss tomorrow.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Se fossi in te, parlerei con il {item} domani.", language_code: it, direction: ltr}, accepted_variants: ["Se fossi in te, parlerei col {item} domani."]}
    feedback_frame: {text: "Con il can contract to col.", language_code: en, direction: ltr}
