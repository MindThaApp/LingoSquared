    frame: {text: "Dovresti spiegare il {item} con calma.", language_code: it, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Dovresti spiegare il {item} con calma.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Problema is masculine despite the -a ending.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit45.lesson01.fill.002
    lesson_content_key: it.b1.unit45.lesson01.se_fossi_in_te
