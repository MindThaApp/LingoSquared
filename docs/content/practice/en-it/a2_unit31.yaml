templates:
  - content_key: practice.en-it.it.a2.unit31.lesson01.choose.001
    lesson_content_key: it.a2.unit31.lesson01.ritardo
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Il ritardo is the delay.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit31.lesson01.listen.002
    lesson_content_key: it.a2.unit31.lesson01.ritardo
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "La coincidenza is the connection.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit31.lesson01.order.003
    lesson_content_key: it.a2.unit31.lesson01.ritardo
    type: word_order
    frame: {text: "Il {item} per Bologna è in ritardo.", language_code: it, direction: ltr}
