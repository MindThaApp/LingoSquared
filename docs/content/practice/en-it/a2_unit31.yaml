schema_version: "1.0"
pack_key: practice.en-it.a2.unit31
source_language: en
target_language: it
unit_content_key: it.a2.unit31.viaggio_interrotto
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-it A2) from scripts/backfill_lexemes_en_it.py lexemes (it_a2_u31* lesson tags, w_<token> anchors).
    Travel-disruption frames are the unit's own sentences. Dal is glossed 'from the' here, as the A1 gloss covered a different sense; dal stays out of the pools. Prendo l'autobus and arrivo tardi use the I form.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_alternativa", "w_arrivo", "w_autobus", "w_binario", "w_cancellato", "w_coincidenza", "w_minuti", "w_parte", "w_perso", "w_prendo", "w_quaranta", "w_ritardo", "w_sostitutivo", "w_tardi", "w_treno", "w_venti"]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: [adjective, verb, noun], agreement_tags: {semantic: ["w_treno", "w_ritardo", "w_cancellato", "w_binario", "w_coincidenza", "w_venti", "w_minuti", "w_parte"]}}
  pool2: &pool2 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: ["w_treno", "w_ritardo", "w_binario", "w_coincidenza"]}}
  t_treno: &t_treno {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_treno"}}
  t_ritardo: &t_ritardo {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_ritardo"}}
  t_cancellato: &t_cancellato {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: "w_cancellato"}}
  t_binario: &t_binario {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_binario"}}
  t_coincidenza: &t_coincidenza {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_coincidenza"}}
  t_venti: &t_venti {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_venti"}}
  t_parte: &t_parte {language_code: it, part_of_speech: verb, agreement_tags: {semantic: "w_parte"}}
  pool10: &pool10 {language_code: it, part_of_speech: [adjective, verb, adverb, noun], agreement_tags: {semantic: ["w_perso", "w_alternativa", "w_autobus", "w_sostitutivo", "w_quaranta", "w_tardi", "w_arrivo", "w_prendo"]}}
  pool11: &pool11 {language_code: it, part_of_speech: [adverb, noun], agreement_tags: {semantic: ["w_alternativa", "w_autobus", "w_quaranta", "w_tardi"]}}
  t_perso: &t_perso {language_code: it, part_of_speech: verb, agreement_tags: {semantic: "w_perso"}}
  t_alternativa: &t_alternativa {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_alternativa"}}
  t_autobus: &t_autobus {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_autobus"}}
