schema_version: "1.0"
pack_key: practice.en-it.b1.unit50
source_language: en
target_language: it
unit_content_key: it.b1.unit50.riunioni
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Professional register: Le proporrei di + infinitive, potremmo + infinitive, Le manderò un'email. Variants accept e-mail and mail for email and cominciare for iniziare. NATIVE FLAG: Le is the formal indirect pronoun; un'email is one token and the grader folds the typographic apostrophe.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_dettagli", "w_dieci", "w_domani", "w_finito", "w_i", "w_manderò", "w_potremmo", "w_procede", "w_progetto", "w_proporrei", "w_rimandare", "w_un'email"]
slot_presets:
  p1: &p1 {language_code: it, part_of_speech: ["verb", "adverb", "noun"], agreement_tags: {semantic: ["w_proporrei", "w_rimandare", "w_domani", "w_potremmo", "w_dieci", "w_procede"]}}
  p2: &p2 {language_code: it, part_of_speech: ["noun", "adjective", "verb", "particle"], agreement_tags: {semantic: ["w_progetto", "w_finito", "w_manderò", "w_un'email", "w_dettagli", "w_i"]}}
  p3: &p3 {language_code: it, part_of_speech: ["verb", "adverb", "noun"], agreement_tags: {semantic: ["w_proporrei", "w_rimandare", "w_domani", "w_potremmo", "w_dieci", "w_procede", "w_progetto", "w_dettagli"]}}
  p4: &p4 {language_code: it, part_of_speech: ["verb", "noun", "adjective"], agreement_tags: {semantic: ["w_proporrei", "w_rimandare", "w_potremmo", "w_procede", "w_progetto", "w_finito", "w_dettagli", "w_un'email"]}}
  p5: &p5 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_proporrei"]}}
  p6: &p6 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_rimandare"]}}
  p7: &p7 {language_code: it, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_domani"]}}
  p8: &p8 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_potremmo"]}}
  p9: &p9 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_dieci"]}}
  p10: &p10 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_procede"]}}
  p11: &p11 {language_code: it, part_of_speech: ["particle"], agreement_tags: {semantic: ["w_i"]}}
  p12: &p12 {language_code: it, part_of_speech: ["adjective"], agreement_tags: {semantic: ["w_finito"]}}
  p13: &p13 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_progetto"]}}
  p14: &p14 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_manderò"]}}
  p15: &p15 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_un'email"]}}
  p16: &p16 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_dettagli"]}}
templates:
  - content_key: practice.en-it.it.b1.unit50.lesson01.choose.001
    lesson_content_key: it.b1.unit50.lesson01.proposta_formale
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on professional communication.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson02.choose.001
    lesson_content_key: it.b1.unit50.lesson02.messaggio_professionale
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on professional messages.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson01.listen.001
    lesson_content_key: it.b1.unit50.lesson01.proposta_formale
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on meetings.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson01.translate.001
    lesson_content_key: it.b1.unit50.lesson01.proposta_formale
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson01.match.001
    lesson_content_key: it.b1.unit50.lesson01.proposta_formale
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the meeting vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson02.match.001
    lesson_content_key: it.b1.unit50.lesson02.messaggio_professionale
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p2, second: *p2, third: *p2, fourth: *p2, fifth: *p2, sixth: *p2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the message vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson01.translate.002
    lesson_content_key: it.b1.unit50.lesson01.proposta_formale
    type: translation
    frame: {text: "I would suggest postponing the meeting until tomorrow. (formal)", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Le {item} di rimandare la riunione a domani.", language_code: it, direction: ltr}, accepted_variants: ["Io Le {item} di rimandare la riunione a domani."]}
    feedback_frame: {text: "Proporrei is the polite conditional of proporre.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson01.translate.003
    lesson_content_key: it.b1.unit50.lesson01.proposta_formale
    type: translation
    frame: {text: "I would suggest postponing the meeting until tomorrow. (formal)", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Le proporrei di {item} la riunione a domani.", language_code: it, direction: ltr}, accepted_variants: ["Io Le proporrei di {item} la riunione a domani."]}
    feedback_frame: {text: "Proporre di is followed by the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson01.fill.001
    lesson_content_key: it.b1.unit50.lesson01.proposta_formale
    type: fill_in_blank
    frame: {text: "Le proporrei di rimandare la riunione a {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Domani means tomorrow.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson01.translate.004
    lesson_content_key: it.b1.unit50.lesson01.proposta_formale
    type: translation
    frame: {text: "We could start at ten.", language_code: en, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "{item} iniziare alle dieci.", language_code: it, direction: ltr}, accepted_variants: ["Noi {item} iniziare alle dieci.", "{item} cominciare alle dieci."]}
    feedback_frame: {text: "Potremmo makes a suggestion.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson01.translate.005
    lesson_content_key: it.b1.unit50.lesson01.proposta_formale
    type: translation
    frame: {text: "We could start at ten.", language_code: en, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Potremmo iniziare alle {item}.", language_code: it, direction: ltr}, accepted_variants: ["Potremmo cominciare alle {item}."]}
    feedback_frame: {text: "Clock times use alle.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson02.fill.001
    lesson_content_key: it.b1.unit50.lesson02.messaggio_professionale
    type: fill_in_blank
    frame: {text: "Buongiorno Sam, come {item} il progetto con i colleghi? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p10, hint: *p10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Procedere here means to go along.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson02.fill.002
    lesson_content_key: it.b1.unit50.lesson02.messaggio_professionale
    type: fill_in_blank
    frame: {text: "Buongiorno Sam, come procede il progetto con {item} colleghi? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "I is the masculine plural article.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson02.translate.001
    lesson_content_key: it.b1.unit50.lesson02.messaggio_professionale
    type: translation
    frame: {text: "The project is almost finished, only one detail is missing.", language_code: en, direction: ltr}
    slots: {item: *p12}
    answer_derivation: {kind: render_frame, frame: {text: "Il progetto è quasi {item}, manca solo un dettaglio.", language_code: it, direction: ltr}, accepted_variants: ["Il progetto è quasi {item}: manca solo un particolare."]}
    feedback_frame: {text: "Finito agrees with il progetto.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson02.order.001
    lesson_content_key: it.b1.unit50.lesson02.messaggio_professionale
    type: word_order
    frame: {text: "Il {item} è quasi finito, manca solo un dettaglio.", language_code: it, direction: ltr}
    slots: {item: *p13}
    answer_derivation: {kind: render_frame, frame: {text: "Il {item} è quasi finito, manca solo un dettaglio.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Progetto is masculine: il progetto.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson02.translate.002
    lesson_content_key: it.b1.unit50.lesson02.messaggio_professionale
    type: translation
    frame: {text: "I will send you an email with the details today. (formal)", language_code: en, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "Le {item} un'email con i dettagli entro oggi.", language_code: it, direction: ltr}, accepted_variants: ["Le {item} una e-mail con i dettagli entro oggi.", "Le {item} un'e-mail con i dettagli entro oggi."]}
    feedback_frame: {text: "The future of mandare is manderò.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson02.translate.003
    lesson_content_key: it.b1.unit50.lesson02.messaggio_professionale
    type: translation
    frame: {text: "I will send you an email with the details today. (formal)", language_code: en, direction: ltr}
    slots: {item: *p15}
    answer_derivation: {kind: render_frame, frame: {text: "Le manderò {item} con i dettagli entro oggi.", language_code: it, direction: ltr}, accepted_variants: ["Le manderò una e-mail con i dettagli entro oggi.", "Le manderò un'e-mail con i dettagli entro oggi.", "Le manderò una mail con i dettagli entro oggi."]}
    feedback_frame: {text: "Email is feminine but takes un' before a vowel.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit50.lesson02.translate.004
    lesson_content_key: it.b1.unit50.lesson02.messaggio_professionale
    type: translation
    frame: {text: "I will send you an email with the details today. (formal)", language_code: en, direction: ltr}
    slots: {item: *p16}
    answer_derivation: {kind: render_frame, frame: {text: "Le manderò un'email con i {item} entro oggi.", language_code: it, direction: ltr}, accepted_variants: ["Le manderò una e-mail con i {item} entro oggi."]}
    feedback_frame: {text: "Dettagli is the plural of dettaglio.", language_code: en, direction: ltr}
