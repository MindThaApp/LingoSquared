schema_version: "1.0"
pack_key: practice.en-it.b1.unit49
source_language: en
target_language: it
unit_content_key: it.b1.unit49.ipotesi_condizionale
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Unreal conditions and politeness with the conditional: se avessi + conditional, se potessi + andrei, potresti + infinitive, preferirei. Variants accept the subject pronoun, a fronted condition and puoi for potresti. NATIVE FLAG: potresti is informal; the unit has no Lei version.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_Roma", "w_andrei", "w_chiudere", "w_finestra", "w_potessi", "w_potresti", "w_preferirei", "w_stasera", "w_viaggerei", "w_viaggiare"]
slot_presets:
  p1: &p1 {language_code: it, part_of_speech: ["verb", "proper_noun"], agreement_tags: {semantic: ["w_viaggerei", "w_viaggiare", "w_potessi", "w_andrei", "w_Roma"]}}
  p2: &p2 {language_code: it, part_of_speech: ["verb", "noun", "adverb"], agreement_tags: {semantic: ["w_potresti", "w_chiudere", "w_finestra", "w_preferirei", "w_stasera"]}}
  p3: &p3 {language_code: it, part_of_speech: ["verb", "proper_noun", "noun"], agreement_tags: {semantic: ["w_viaggerei", "w_viaggiare", "w_potessi", "w_andrei", "w_Roma", "w_potresti", "w_chiudere", "w_finestra"]}}
  p4: &p4 {language_code: it, part_of_speech: ["verb", "noun"], agreement_tags: {semantic: ["w_viaggerei", "w_viaggiare", "w_potessi", "w_andrei", "w_potresti", "w_chiudere", "w_finestra", "w_preferirei"]}}
  p5: &p5 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_viaggerei"]}}
  p6: &p6 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_viaggiare"]}}
  p7: &p7 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_potessi"]}}
  p8: &p8 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_andrei"]}}
  p9: &p9 {language_code: it, part_of_speech: ["proper_noun"], agreement_tags: {semantic: ["w_Roma"]}}
  p10: &p10 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_potresti"]}}
  p11: &p11 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_chiudere"]}}
  p12: &p12 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_finestra"]}}
  p13: &p13 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_preferirei"]}}
  p14: &p14 {language_code: it, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_stasera"]}}
templates:
  - content_key: practice.en-it.it.b1.unit49.lesson01.choose.001
    lesson_content_key: it.b1.unit49.lesson01.ipotesi_irreale
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on conditions.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson02.choose.001
    lesson_content_key: it.b1.unit49.lesson02.condizionale_per_attenuare
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on polite requests.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson01.listen.001
    lesson_content_key: it.b1.unit49.lesson01.ipotesi_irreale
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on conditionals.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson01.translate.001
    lesson_content_key: it.b1.unit49.lesson01.ipotesi_irreale
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson01.match.001
    lesson_content_key: it.b1.unit49.lesson01.ipotesi_irreale
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p4, second: *p4, third: *p4, fourth: *p4, fifth: *p4, sixth: *p4}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the conditional vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson01.translate.002
    lesson_content_key: it.b1.unit49.lesson01.ipotesi_irreale
    type: translation
    frame: {text: "If I had more time, I would travel more.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Se avessi più tempo, {item} di più.", language_code: it, direction: ltr}, accepted_variants: ["{item} di più se avessi più tempo.", "Se avessi più tempo, io {item} di più."]}
    feedback_frame: {text: "The result of an unreal condition uses the conditional.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson01.fill.001
    lesson_content_key: it.b1.unit49.lesson01.ipotesi_irreale
    type: fill_in_blank
    frame: {text: "Voglio {item} di più. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Voglio is followed by the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson01.translate.003
    lesson_content_key: it.b1.unit49.lesson01.ipotesi_irreale
    type: translation
    frame: {text: "If I could, I would go to Rome with Sam.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Se {item}, andrei a Roma con Sam.", language_code: it, direction: ltr}, accepted_variants: ["Se {item}, andrei con Sam a Roma.", "Andrei a Roma con Sam se {item}."]}
    feedback_frame: {text: "Se potessi is the imperfect subjunctive of potere.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson01.translate.004
    lesson_content_key: it.b1.unit49.lesson01.ipotesi_irreale
    type: translation
    frame: {text: "If I could, I would go to Rome with Sam.", language_code: en, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "Se potessi, {item} a Roma con Sam.", language_code: it, direction: ltr}, accepted_variants: ["Se potessi, io {item} a Roma con Sam."]}
    feedback_frame: {text: "Andrei is the conditional of andare.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson01.order.001
    lesson_content_key: it.b1.unit49.lesson01.ipotesi_irreale
    type: word_order
    frame: {text: "Se potessi, andrei a {item} con Sam.", language_code: it, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Se potessi, andrei a {item} con Sam.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Roma is a proper noun and keeps its capital.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson02.translate.001
    lesson_content_key: it.b1.unit49.lesson02.condizionale_per_attenuare
    type: translation
    frame: {text: "Could you close the window, please?", language_code: en, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "{item} chiudere la finestra, per favore?", language_code: it, direction: ltr}, accepted_variants: ["Per favore, {item} chiudere la finestra?", "Puoi chiudere la finestra, per favore?"]}
    feedback_frame: {text: "Potresti is a softer way to ask than puoi.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson02.translate.002
    lesson_content_key: it.b1.unit49.lesson02.condizionale_per_attenuare
    type: translation
    frame: {text: "Could you close the window, please?", language_code: en, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: render_frame, frame: {text: "Potresti {item} la finestra, per favore?", language_code: it, direction: ltr}, accepted_variants: ["Per favore, potresti {item} la finestra?"]}
    feedback_frame: {text: "Potresti is followed by the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson02.fill.001
    lesson_content_key: it.b1.unit49.lesson02.condizionale_per_attenuare
    type: fill_in_blank
    frame: {text: "Potresti chiudere la {item}, per favore? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p12, hint: *p12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Finestra is feminine: la finestra.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson02.translate.003
    lesson_content_key: it.b1.unit49.lesson02.condizionale_per_attenuare
    type: translation
    frame: {text: "I would prefer to stay at home tonight, I am tired.", language_code: en, direction: ltr}
    slots: {item: *p13}
    answer_derivation: {kind: render_frame, frame: {text: "{item} restare a casa stasera, sono stanco.", language_code: it, direction: ltr}, accepted_variants: ["Io {item} restare a casa stasera, sono stanco."]}
    feedback_frame: {text: "Preferirei is the conditional and sounds gentler than preferisco.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit49.lesson02.translate.004
    lesson_content_key: it.b1.unit49.lesson02.condizionale_per_attenuare
    type: translation
    frame: {text: "I would prefer to stay at home tonight, I am tired.", language_code: en, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "Preferirei restare a casa {item}, sono stanco.", language_code: it, direction: ltr}, accepted_variants: ["Preferirei restare a casa {item}, perché sono stanco."]}
    feedback_frame: {text: "Stasera means this evening.", language_code: en, direction: ltr}
