  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Relative clauses with che and cui. The passato prossimo with abbiamo visitato, present lavora, abito. Variants accept con la quale for con cui, dove for in cui, vive for abito, and a different word order. NATIVE FLAG: a casa and alla stazione are both used in the unit; the pack uses alla stazione.
