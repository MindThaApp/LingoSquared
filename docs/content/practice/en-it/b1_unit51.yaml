    answer_derivation: {kind: render_frame, frame: {text: "Il {item} che abbiamo visitato ieri è vicino alla stazione.", language_code: it, direction: ltr}, accepted_variants: ["Il {item} che abbiamo visitato ieri si trova vicino alla stazione."]}
    feedback_frame: {text: "Che links the noun to the clause about it.", language_code: en, direction: ltr}
