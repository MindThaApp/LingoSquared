schema_version: "1.0"
pack_key: practice.en-it.b1.unit44
source_language: en
target_language: it
unit_content_key: it.b1.unit44.scopi
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Purpose clauses with per + infinitive and per non + infinitive. Variants accept the subject pronoun and a fronted purpose clause. NATIVE FLAG: l'italiano is one token (elided article); the unit writes it without a capital.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_Italia", "w_l'italiano", "w_lavorare", "w_partire", "w_parto", "w_perdere", "w_presto", "w_studiare", "w_studio", "w_treno"]
slot_presets:
  p1: &p1 {language_code: it, part_of_speech: ["verb", "noun", "proper_noun", "adverb"], agreement_tags: {semantic: ["w_studio", "w_studiare", "w_l'italiano", "w_lavorare", "w_Italia", "w_parto", "w_partire", "w_presto"]}}
  p2: &p2 {language_code: it, part_of_speech: ["verb", "noun", "proper_noun", "adverb"], agreement_tags: {semantic: ["w_studio", "w_studiare", "w_l'italiano", "w_lavorare", "w_Italia", "w_parto", "w_partire", "w_presto", "w_treno"]}}
  p3: &p3 {language_code: it, part_of_speech: ["verb", "adverb", "noun"], agreement_tags: {semantic: ["w_parto", "w_partire", "w_presto", "w_perdere", "w_treno"]}}
  p4: &p4 {language_code: it, part_of_speech: ["verb", "noun"], agreement_tags: {semantic: ["w_studio", "w_studiare", "w_l'italiano", "w_lavorare", "w_parto", "w_partire", "w_perdere", "w_treno"]}}
  p5: &p5 {language_code: it, part_of_speech: ["verb", "noun", "proper_noun"], agreement_tags: {semantic: ["w_studio", "w_studiare", "w_l'italiano", "w_lavorare", "w_Italia", "w_parto", "w_partire", "w_perdere"]}}
  p6: &p6 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_lavorare"]}}
  p7: &p7 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_l'italiano"]}}
  p8: &p8 {language_code: it, part_of_speech: ["proper_noun"], agreement_tags: {semantic: ["w_Italia"]}}
  p9: &p9 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_studio"]}}
  p10: &p10 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_studiare"]}}
  p11: &p11 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_perdere"]}}
  p12: &p12 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_treno"]}}
  p13: &p13 {language_code: it, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_presto"]}}
  p14: &p14 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_parto"]}}
  p15: &p15 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_partire"]}}
templates:
  - content_key: practice.en-it.it.b1.unit44.lesson01.choose.001
    lesson_content_key: it.b1.unit44.lesson01.scopo_positivo
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on purposes and goals.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson01.listen.001
    lesson_content_key: it.b1.unit44.lesson01.scopo_positivo
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on purposes.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson02.choose.001
    lesson_content_key: it.b1.unit44.lesson02.scopo_negativo
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the second lesson of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson01.translate.001
    lesson_content_key: it.b1.unit44.lesson01.scopo_positivo
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson01.match.001
    lesson_content_key: it.b1.unit44.lesson01.scopo_positivo
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p5, second: *p5, third: *p5, fourth: *p5, fifth: *p5, sixth: *p5}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the vocabulary of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson01.translate.002
    lesson_content_key: it.b1.unit44.lesson01.scopo_positivo
    type: translation
    frame: {text: "I study Italian to work in Italy.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Studio l'italiano per {item} in Italia.", language_code: it, direction: ltr}, accepted_variants: ["Io studio l'italiano per {item} in Italia.", "Per {item} in Italia, studio l'italiano."]}
    feedback_frame: {text: "Per plus an infinitive gives the purpose.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson01.translate.003
    lesson_content_key: it.b1.unit44.lesson01.scopo_positivo
    type: translation
    frame: {text: "I study Italian to work in Italy.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Studio {item} per lavorare in Italia.", language_code: it, direction: ltr}, accepted_variants: ["Studio {item} per poter lavorare in Italia."]}
    feedback_frame: {text: "L'italiano takes the elided article l'.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson01.order.001
    lesson_content_key: it.b1.unit44.lesson01.scopo_positivo
    type: word_order
    frame: {text: "Studio l'italiano per lavorare in {item}.", language_code: it, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "Studio l'italiano per lavorare in {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Italia is a proper noun and keeps its capital.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson01.fill.001
    lesson_content_key: it.b1.unit44.lesson01.scopo_positivo
    type: fill_in_blank
    frame: {text: "Ogni giorno {item} l'italiano. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p9, hint: *p9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Studio is the io form of studiare.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson01.fill.002
    lesson_content_key: it.b1.unit44.lesson01.scopo_positivo
    type: fill_in_blank
    frame: {text: "Voglio {item} l'italiano. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p10, hint: *p10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Voglio is followed by the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson02.translate.001
    lesson_content_key: it.b1.unit44.lesson02.scopo_negativo
    type: translation
    frame: {text: "I leave early so as not to miss the train.", language_code: en, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: render_frame, frame: {text: "Parto presto per non {item} il treno.", language_code: it, direction: ltr}, accepted_variants: ["Io parto presto per non {item} il treno.", "Per non {item} il treno, parto presto."]}
    feedback_frame: {text: "Per non plus an infinitive gives a negative purpose.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson02.translate.002
    lesson_content_key: it.b1.unit44.lesson02.scopo_negativo
    type: translation
    frame: {text: "I leave early so as not to miss the train.", language_code: en, direction: ltr}
    slots: {item: *p12}
    answer_derivation: {kind: render_frame, frame: {text: "Parto presto per non perdere il {item}.", language_code: it, direction: ltr}, accepted_variants: ["Per non perdere il {item}, parto presto."]}
    feedback_frame: {text: "Treno is masculine: il treno.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson02.order.001
    lesson_content_key: it.b1.unit44.lesson02.scopo_negativo
    type: word_order
    frame: {text: "Parto {item} per non perdere il treno.", language_code: it, direction: ltr}
    slots: {item: *p13}
    answer_derivation: {kind: render_frame, frame: {text: "Parto {item} per non perdere il treno.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Presto means early here.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson02.fill.001
    lesson_content_key: it.b1.unit44.lesson02.scopo_negativo
    type: fill_in_blank
    frame: {text: "{item} presto per non perdere il treno. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p14, hint: *p14}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Parto is the io form of partire.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit44.lesson02.fill.002
    lesson_content_key: it.b1.unit44.lesson02.scopo_negativo
    type: fill_in_blank
    frame: {text: "Voglio {item} domani. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p15, hint: *p15}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Voglio is followed by the infinitive.", language_code: en, direction: ltr}
