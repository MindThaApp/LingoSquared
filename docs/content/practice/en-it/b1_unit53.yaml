    answer_derivation: {kind: render_frame, frame: {text: "{item} se hai ragione, preferisco restare a casa.", language_code: it, direction: ltr}, accepted_variants: ["Preferisco restare a casa, {item} se hai ragione."]}
    feedback_frame: {text: "Anche se is followed by the indicative here.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit53.lesson01.translate.003
    lesson_content_key: it.b1.unit53.lesson01.anche_se
    type: translation
    frame: {text: "Even if you are right, I prefer to stay at home.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Anche se {item} ragione, preferisco restare a casa.", language_code: it, direction: ltr}, accepted_variants: ["Anche se tu {item} ragione, preferisco restare a casa."]}
    feedback_frame: {text: "Avere ragione means to be right.", language_code: en, direction: ltr}
