schema_version: "1.0"
pack_key: practice.en-it.b1.unit53
source_language: en
target_language: it
unit_content_key: it.b1.unit53.concessioni
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Concessions: anche se + indicative, nonostante + noun, tuttavia, credo che + subjunctive. Variants accept pero for tuttavia, penso for credo and reordered clauses. NATIVE FLAG: the unit writes primo punto and il secondo; secondo is glossed as the ordinal here, since the A2 gloss (according to) is a different sense.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_anche", "w_cambiare", "w_chiaro", "w_continua", "w_credo", "w_hai", "w_necessario", "w_nonostante", "w_opinione", "w_primo", "w_qualcosa", "w_ragione", "w_secondo", "w_tuttavia"]
slot_presets:
  p1: &p1 {language_code: it, part_of_speech: ["adverb", "verb", "noun", "preposition"], agreement_tags: {semantic: ["w_anche", "w_hai", "w_ragione", "w_nonostante", "w_continua", "w_opinione"]}}
  p2: &p2 {language_code: it, part_of_speech: ["adverb", "verb", "adjective", "pronoun"], agreement_tags: {semantic: ["w_tuttavia", "w_credo", "w_necessario", "w_cambiare", "w_qualcosa", "w_primo", "w_chiaro", "w_secondo"]}}
  p3: &p3 {language_code: it, part_of_speech: ["adverb", "verb", "adjective", "pronoun"], agreement_tags: {semantic: ["w_tuttavia", "w_credo", "w_necessario", "w_cambiare", "w_qualcosa", "w_chiaro"]}}
  p4: &p4 {language_code: it, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_anche"]}}
  p5: &p5 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_hai"]}}
  p6: &p6 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_ragione"]}}
  p7: &p7 {language_code: it, part_of_speech: ["preposition"], agreement_tags: {semantic: ["w_nonostante"]}}
  p8: &p8 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_continua"]}}
  p9: &p9 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_opinione"]}}
  p10: &p10 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_credo"]}}
  p11: &p11 {language_code: it, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_tuttavia"]}}
  p12: &p12 {language_code: it, part_of_speech: ["adjective"], agreement_tags: {semantic: ["w_necessario"]}}
  p13: &p13 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_cambiare"]}}
  p14: &p14 {language_code: it, part_of_speech: ["pronoun"], agreement_tags: {semantic: ["w_qualcosa"]}}
  p15: &p15 {language_code: it, part_of_speech: ["adjective"], agreement_tags: {semantic: ["w_primo"]}}
  p16: &p16 {language_code: it, part_of_speech: ["adjective"], agreement_tags: {semantic: ["w_chiaro"]}}
  p17: &p17 {language_code: it, part_of_speech: ["adjective"], agreement_tags: {semantic: ["w_secondo"]}}
templates:
  - content_key: practice.en-it.it.b1.unit53.lesson01.choose.001
    lesson_content_key: it.b1.unit53.lesson01.anche_se
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on conceding a point.", language_code: en, direction: ltr}
