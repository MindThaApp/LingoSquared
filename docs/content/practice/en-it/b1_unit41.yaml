schema_version: "1.0"
pack_key: practice.en-it.b1.unit41
source_language: en
target_language: it
unit_content_key: it.b1.unit41.condizioni
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Real conditions with se + present. Variants accept rimango for resto and a fronted condition. NATIVE FLAG: none.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_casa", "w_chiamo", "w_con", "w_piove", "w_piovere", "w_restare", "w_resto", "w_usciamo", "w_uscire"]
slot_presets:
  p1: &p1 {language_code: it, part_of_speech: ["verb", "noun", "preposition"], agreement_tags: {semantic: ["w_piove", "w_piovere", "w_resto", "w_restare", "w_casa", "w_chiamo", "w_usciamo", "w_uscire", "w_con"]}}
  p2: &p2 {language_code: it, part_of_speech: ["verb", "noun"], agreement_tags: {semantic: ["w_piove", "w_piovere", "w_resto", "w_restare", "w_casa", "w_chiamo", "w_usciamo", "w_uscire"]}}
  p3: &p3 {language_code: it, part_of_speech: ["verb", "preposition"], agreement_tags: {semantic: ["w_usciamo", "w_uscire", "w_con", "w_piove"]}}
  p4: &p4 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_piove"]}}
  p5: &p5 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_resto"]}}
  p6: &p6 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_casa"]}}
  p7: &p7 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_piovere"]}}
  p8: &p8 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_restare"]}}
  p9: &p9 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_chiamo"]}}
  p10: &p10 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_usciamo"]}}
  p11: &p11 {language_code: it, part_of_speech: ["preposition"], agreement_tags: {semantic: ["w_con"]}}
  p12: &p12 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_uscire"]}}
templates:
  - content_key: practice.en-it.it.b1.unit41.lesson01.choose.001
    lesson_content_key: it.b1.unit41.lesson01.condizione_conseguenza
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on real conditions.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson01.listen.001
    lesson_content_key: it.b1.unit41.lesson01.condizione_conseguenza
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on conditions.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson02.choose.001
    lesson_content_key: it.b1.unit41.lesson02.condizione_negata
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the second lesson of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson01.translate.001
    lesson_content_key: it.b1.unit41.lesson01.condizione_conseguenza
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson01.match.001
    lesson_content_key: it.b1.unit41.lesson01.condizione_conseguenza
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p2, second: *p2, third: *p2, fourth: *p2, fifth: *p2, sixth: *p2}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the condition vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson01.translate.002
    lesson_content_key: it.b1.unit41.lesson01.condizione_conseguenza
    type: translation
    frame: {text: "If it rains today, I stay at home all day.", language_code: en, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Se {item} oggi, resto a casa tutto il giorno.", language_code: it, direction: ltr}, accepted_variants: ["Se {item} oggi, rimango a casa tutto il giorno.", "Oggi, se {item}, resto a casa tutto il giorno."]}
    feedback_frame: {text: "After se, Italian uses the present for a real condition.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson01.translate.003
    lesson_content_key: it.b1.unit41.lesson01.condizione_conseguenza
    type: translation
    frame: {text: "If it rains today, I stay at home all day.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Se piove oggi, {item} a casa tutto il giorno.", language_code: it, direction: ltr}, accepted_variants: ["Se piove oggi, io {item} a casa tutto il giorno."]}
    feedback_frame: {text: "Restare in the io form is resto.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson01.order.001
    lesson_content_key: it.b1.unit41.lesson01.condizione_conseguenza
    type: word_order
    frame: {text: "Se piove oggi, resto a {item} tutto il giorno.", language_code: it, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Se piove oggi, resto a {item} tutto il giorno.", language_code: it, direction: ltr}}
    feedback_frame: {text: "A casa means at home.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson01.fill.001
    lesson_content_key: it.b1.unit41.lesson01.condizione_conseguenza
    type: fill_in_blank
    frame: {text: "Domani può {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Piovere is the infinitive: to rain.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson01.fill.002
    lesson_content_key: it.b1.unit41.lesson01.condizione_conseguenza
    type: fill_in_blank
    frame: {text: "Voglio {item} a casa oggi. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Voglio is followed by the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson01.translate.004
    lesson_content_key: it.b1.unit41.lesson01.condizione_conseguenza
    type: translation
    frame: {text: "If it rains tomorrow, I call Sam.", language_code: en, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Se piove domani, {item} Sam.", language_code: it, direction: ltr}, accepted_variants: ["Domani, se piove, {item} Sam."]}
    feedback_frame: {text: "The result of a real condition can stay in the present.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson02.translate.001
    lesson_content_key: it.b1.unit41.lesson02.condizione_negata
    type: translation
    frame: {text: "If it does not rain, we go out with Sam.", language_code: en, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Se non piove, {item} con Sam.", language_code: it, direction: ltr}, accepted_variants: ["Se non piove, noi {item} con Sam."]}
    feedback_frame: {text: "Uscire in the noi form is usciamo.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson02.fill.001
    lesson_content_key: it.b1.unit41.lesson02.condizione_negata
    type: fill_in_blank
    frame: {text: "Se non piove, usciamo {item} Sam. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Con means with.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson02.fill.002
    lesson_content_key: it.b1.unit41.lesson02.condizione_negata
    type: fill_in_blank
    frame: {text: "Se non {item}, usciamo con Sam. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p4, hint: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Non goes before the verb.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit41.lesson02.fill.003
    lesson_content_key: it.b1.unit41.lesson02.condizione_negata
    type: fill_in_blank
    frame: {text: "Stasera non voglio {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p12, hint: *p12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Uscire is the infinitive: to go out.", language_code: en, direction: ltr}
