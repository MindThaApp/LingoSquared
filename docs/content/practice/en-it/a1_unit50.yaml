  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on my male and female neighbor.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit50.lesson01.order.003
  lesson_content_key: it.a1.unit50.lesson01.il_quartiere
  type: word_order
  frame: {text: 'Abito in un bel {item} a Bologna.', language_code: it, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags: {semantic: w_quartiere}
