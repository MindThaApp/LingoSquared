review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-it backfill lexemes (tags it_a1_u56 / w_<token>). 12 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ambulanza, w_andate, w_attenzione, w_biblioteca, w_bisogno, w_dipendente, w_emergenza, w_fuori, w_incendio, w_polizia, w_succede, w_vigili]
templates:
- content_key: practice.en-it.it.a1.unit56.lesson01.choose.001
  lesson_content_key: it.a1.unit56.lesson01.aiuto_e_incendio
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: &id001
      language_code: it
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_bisogno, w_incendio, w_emergenza, w_polizia, w_vigili, w_ambulanza, w_dipendente, w_attenzione, w_andate, w_biblioteca, w_fuori, w_succede]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on help and fire.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit56.lesson02.listen.001
  lesson_content_key: it.a1.unit56.lesson02.il_numero_di_emergenza
  type: listen_select
