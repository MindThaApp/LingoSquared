schema_version: "1.0"
pack_key: practice.en-it.b1.unit38
source_language: en
target_language: it
unit_content_key: it.b1.unit38.dibattito
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Agreement and disagreement with reasons: sono d'accordo sul fatto che + subjunctive, perche, manca. Variants accept crede for pensa and permette di for fa. NATIVE FLAG: d'accordo is one token (elided d'); the typographic apostrophe is folded by the grader.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_d'accordo", "w_fa", "w_manca", "w_pensa", "w_perché", "w_piano", "w_pronto", "w_risparmiare", "w_sia", "w_sono", "w_sul", "w_tempo", "w_utile"]
slot_presets:
  p1: &p1 {language_code: it, part_of_speech: ["verb", "phrase", "preposition", "noun", "adjective", "particle"], agreement_tags: {semantic: ["w_sono", "w_d'accordo", "w_sul", "w_piano", "w_sia", "w_utile", "w_perché", "w_fa"]}}
  p2: &p2 {language_code: it, part_of_speech: ["verb", "phrase", "preposition", "noun", "adjective"], agreement_tags: {semantic: ["w_sono", "w_d'accordo", "w_sul", "w_piano", "w_sia", "w_utile", "w_risparmiare", "w_tempo"]}}
  p3: &p3 {language_code: it, part_of_speech: ["verb", "adjective", "noun"], agreement_tags: {semantic: ["w_pensa", "w_pronto", "w_manca", "w_utile", "w_tempo"]}}
  p4: &p4 {language_code: it, part_of_speech: ["verb", "phrase", "noun", "adjective"], agreement_tags: {semantic: ["w_sono", "w_d'accordo", "w_piano", "w_utile", "w_risparmiare", "w_tempo", "w_pensa", "w_manca"]}}
  p5: &p5 {language_code: it, part_of_speech: ["phrase"], agreement_tags: {semantic: ["w_d'accordo"]}}
  p6: &p6 {language_code: it, part_of_speech: ["preposition"], agreement_tags: {semantic: ["w_sul"]}}
  p7: &p7 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_sia"]}}
  p8: &p8 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_piano"]}}
  p9: &p9 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_tempo"]}}
  p10: &p10 {language_code: it, part_of_speech: ["adjective"], agreement_tags: {semantic: ["w_utile"]}}
  p11: &p11 {language_code: it, part_of_speech: ["particle"], agreement_tags: {semantic: ["w_perché"]}}
  p12: &p12 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_risparmiare"]}}
  p13: &p13 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_pensa"]}}
  p14: &p14 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_manca"]}}
  p15: &p15 {language_code: it, part_of_speech: ["adjective"], agreement_tags: {semantic: ["w_pronto"]}}
templates:
  - content_key: practice.en-it.it.b1.unit38.lesson01.choose.001
    lesson_content_key: it.b1.unit38.lesson01.accordo_motivo
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on agreeing and giving reasons.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson01.listen.001
    lesson_content_key: it.b1.unit38.lesson01.accordo_motivo
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the debate unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson02.choose.001
    lesson_content_key: it.b1.unit38.lesson02.disaccordo_motivo
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the second lesson of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson01.translate.001
    lesson_content_key: it.b1.unit38.lesson01.accordo_motivo
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson01.match.001
    lesson_content_key: it.b1.unit38.lesson01.accordo_motivo
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the debate vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson01.translate.002
    lesson_content_key: it.b1.unit38.lesson01.accordo_motivo
    type: translation
    frame: {text: "I agree that the plan is useful.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Sono {item} sul fatto che il piano sia utile.", language_code: it, direction: ltr}, accepted_variants: ["Io sono {item} sul fatto che il piano sia utile.", "Sono {item} che il piano sia utile."]}
    feedback_frame: {text: "D'accordo is written with an apostrophe: sono d'accordo.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson01.fill.001
    lesson_content_key: it.b1.unit38.lesson01.accordo_motivo
    type: fill_in_blank
    frame: {text: "Sono d'accordo {item} fatto che il piano sia utile. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Sul is su + il: sul fatto che.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson01.fill.002
    lesson_content_key: it.b1.unit38.lesson01.accordo_motivo
    type: fill_in_blank
    frame: {text: "Sono d'accordo sul fatto che il piano {item} utile. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After sul fatto che, Italian uses the subjunctive: sia.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson01.order.001
    lesson_content_key: it.b1.unit38.lesson01.accordo_motivo
    type: word_order
    frame: {text: "Sono d'accordo sul fatto che il {item} sia utile.", language_code: it, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "Sono d'accordo sul fatto che il {item} sia utile.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Piano is masculine: il piano.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson01.translate.003
    lesson_content_key: it.b1.unit38.lesson01.accordo_motivo
    type: translation
    frame: {text: "The plan is useful because it saves time.", language_code: en, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Il piano è utile perché fa risparmiare {item}.", language_code: it, direction: ltr}, accepted_variants: ["Il piano è utile perché permette di risparmiare {item}.", "Il piano è utile perché ci fa risparmiare {item}."]}
    feedback_frame: {text: "Fare risparmiare tempo means to save time.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson01.fill.003
    lesson_content_key: it.b1.unit38.lesson01.accordo_motivo
    type: fill_in_blank
    frame: {text: "Il piano è {item} perché fa risparmiare tempo. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p10, hint: *p10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Utile is invariable in the singular.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson01.fill.004
    lesson_content_key: it.b1.unit38.lesson01.accordo_motivo
    type: fill_in_blank
    frame: {text: "Il piano è utile {item} fa risparmiare tempo. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p11, hint: *p11}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Perché introduces the reason.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson01.order.002
    lesson_content_key: it.b1.unit38.lesson01.accordo_motivo
    type: word_order
    frame: {text: "Il piano è utile perché fa {item} tempo.", language_code: it, direction: ltr}
    slots: {item: *p12}
    answer_derivation: {kind: render_frame, frame: {text: "Il piano è utile perché fa {item} tempo.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Fa is followed by the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson02.translate.001
    lesson_content_key: it.b1.unit38.lesson02.disaccordo_motivo
    type: translation
    frame: {text: "Sam thinks the plan is ready.", language_code: en, direction: ltr}
    slots: {item: *p13}
    answer_derivation: {kind: render_frame, frame: {text: "Sam {item} che il piano sia pronto.", language_code: it, direction: ltr}, accepted_variants: ["Sam crede che il piano sia pronto."]}
    feedback_frame: {text: "Pensare che is followed by the subjunctive.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson02.translate.002
    lesson_content_key: it.b1.unit38.lesson02.disaccordo_motivo
    type: translation
    frame: {text: "The plan is not ready because the confirmation is missing.", language_code: en, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "Il piano non è pronto perché {item} la conferma.", language_code: it, direction: ltr}, accepted_variants: ["Il piano non è pronto perché la conferma {item}."]}
    feedback_frame: {text: "Manca agrees with the thing that is missing: la conferma.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson02.fill.001
    lesson_content_key: it.b1.unit38.lesson02.disaccordo_motivo
    type: fill_in_blank
    frame: {text: "Il piano non è {item} perché manca la conferma. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p15, hint: *p15}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Pronto describes the plan.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit38.lesson02.order.001
    lesson_content_key: it.b1.unit38.lesson02.disaccordo_motivo
    type: word_order
    frame: {text: "Il piano non è pronto perché {item} la conferma.", language_code: it, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "Il piano non è pronto perché {item} la conferma.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Manca is third person singular.", language_code: en, direction: ltr}
