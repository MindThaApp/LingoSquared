schema_version: "1.0"
pack_key: practice.en-it.b1.unit47
source_language: en
target_language: it
unit_content_key: it.b1.unit47.rimpianti
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Regret: avrei dovuto + infinitive and se avessi saputo + non avrei + participle. Only five unit lexemes, so no matching template. Variants accept the subject pronoun and the reversed clause order. NATIVE FLAG: se avessi saputo, ti avrei chiamato prima is in the unit but not used as a frame because chiamato is not a lexeme of this unit.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_avessi", "w_dovuto", "w_l'orario", "w_perso", "w_saputo"]
slot_presets:
  p1: &p1 {language_code: it, part_of_speech: ["verb", "noun"], agreement_tags: {semantic: ["w_dovuto", "w_l'orario", "w_perso", "w_avessi", "w_saputo"]}}
  p2: &p2 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_avessi", "w_saputo", "w_perso", "w_dovuto"]}}
  p3: &p3 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_dovuto"]}}
  p4: &p4 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_l'orario"]}}
  p5: &p5 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_perso"]}}
  p6: &p6 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_avessi"]}}
  p7: &p7 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_saputo"]}}
templates:
  - content_key: practice.en-it.it.b1.unit47.lesson01.choose.001
    lesson_content_key: it.b1.unit47.lesson01.avrei_dovuto
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on regrets.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit47.lesson01.listen.001
    lesson_content_key: it.b1.unit47.lesson01.avrei_dovuto
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on regrets.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit47.lesson02.choose.001
    lesson_content_key: it.b1.unit47.lesson02.se_avessi_saputo
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the second lesson of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit47.lesson01.translate.001
    lesson_content_key: it.b1.unit47.lesson01.avrei_dovuto
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit47.lesson01.translate.002
    lesson_content_key: it.b1.unit47.lesson01.avrei_dovuto
    type: translation
    frame: {text: "I should have checked the train schedule.", language_code: en, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Avrei {item} controllare l'orario del treno.", language_code: it, direction: ltr}, accepted_variants: ["Io avrei {item} controllare l'orario del treno."]}
    feedback_frame: {text: "Avrei dovuto expresses a regret about the past.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit47.lesson01.translate.003
    lesson_content_key: it.b1.unit47.lesson01.avrei_dovuto
    type: translation
    frame: {text: "I should have checked the train schedule.", language_code: en, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Avrei dovuto controllare {item} del treno.", language_code: it, direction: ltr}, accepted_variants: ["Io avrei dovuto controllare {item} del treno."]}
    feedback_frame: {text: "L'orario takes the elided article.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit47.lesson01.order.001
    lesson_content_key: it.b1.unit47.lesson01.avrei_dovuto
    type: word_order
    frame: {text: "Avrei {item} controllare l'orario del treno.", language_code: it, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: render_frame, frame: {text: "Avrei {item} controllare l'orario del treno.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Dovuto is the participle of dovere.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit47.lesson01.translate.004
    lesson_content_key: it.b1.unit47.lesson01.avrei_dovuto
    type: translation
    frame: {text: "This morning I missed the train.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Stamattina ho {item} il treno.", language_code: it, direction: ltr}, accepted_variants: ["Questa mattina ho {item} il treno.", "Ho {item} il treno stamattina."]}
    feedback_frame: {text: "Perso is the participle of perdere.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit47.lesson02.translate.001
    lesson_content_key: it.b1.unit47.lesson02.se_avessi_saputo
    type: translation
    frame: {text: "If I had known, I would not have missed the train.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Se {item} saputo, non avrei perso il treno.", language_code: it, direction: ltr}, accepted_variants: ["Non avrei perso il treno se {item} saputo."]}
    feedback_frame: {text: "Se avessi saputo is the unreal past condition.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit47.lesson02.translate.002
    lesson_content_key: it.b1.unit47.lesson02.se_avessi_saputo
    type: translation
    frame: {text: "If I had known, I would not have missed the train.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Se avessi {item}, non avrei perso il treno.", language_code: it, direction: ltr}, accepted_variants: ["Non avrei perso il treno se avessi {item}."]}
    feedback_frame: {text: "Saputo is the participle of sapere.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit47.lesson02.fill.001
    lesson_content_key: it.b1.unit47.lesson02.se_avessi_saputo
    type: fill_in_blank
    frame: {text: "Se avessi saputo, non avrei {item} il treno. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p5, hint: *p5}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Avrei perso is the conditional perfect.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit47.lesson02.fill.002
    lesson_content_key: it.b1.unit47.lesson02.se_avessi_saputo
    type: fill_in_blank
    frame: {text: "Se avessi {item}, non avrei perso il treno. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Saputo follows avessi.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit47.lesson02.order.001
    lesson_content_key: it.b1.unit47.lesson02.se_avessi_saputo
    type: word_order
    frame: {text: "Se {item} saputo, non avrei perso il treno.", language_code: it, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Se {item} saputo, non avrei perso il treno.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Avessi is the imperfect subjunctive of avere.", language_code: en, direction: ltr}
