      agreement_tags:
        semantic: [w_usare, w_uso, w_computer, w_internet, w_previsioni, w_può, w_mandare, w_manda, w_legge, w_cercare, w_cerco, w_cerchi, w_usi, w_cerca, w_vedo, w_nessuna, w_app]
