schema_version: "1.0"
pack_key: practice.en-it.a2.unit26
source_language: en
target_language: it
unit_content_key: it.a2.unit26.opinioni
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-it A2) from scripts/backfill_lexemes_en_it.py lexemes (it_a2_u26* lesson tags, w_<token> anchors).
    Opinion frames are the unit's own sentences. Comodo and rumoroso are masculine forms, used with il quartiere. Utile and utili are both kept as singular and plural of one word.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_capisco", "w_comodo", "w_d'accordo", "w_metropolitana", "w_negozi", "w_perché", "w_però", "w_quartiere", "w_rumoroso", "w_secondo", "w_troppo", "w_utile", "w_utili", "w_vero"]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: [preposition, phrase, adjective, noun], agreement_tags: {semantic: ["w_quartiere", "w_comodo", "w_rumoroso", "w_metropolitana", "w_secondo", "w_d'accordo"]}}
  pool2: &pool2 {language_code: it, part_of_speech: [adjective, noun], agreement_tags: {semantic: ["w_quartiere", "w_comodo", "w_rumoroso", "w_metropolitana"]}}
  pool3: &pool3 {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: ["w_comodo", "w_rumoroso"]}}
  t_metropolitana: &t_metropolitana {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_metropolitana"}}
  t_rumoroso: &t_rumoroso {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: "w_rumoroso"}}
  t_perche_: &t_perche_ {language_code: it, part_of_speech: particle, agreement_tags: {semantic: "w_perché"}}
  t_d_accordo: &t_d_accordo {language_code: it, part_of_speech: phrase, agreement_tags: {semantic: "w_d'accordo"}}
  t_comodo: &t_comodo {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: "w_comodo"}}
  pool9: &pool9 {language_code: it, part_of_speech: [preposition, adjective, noun], agreement_tags: {semantic: ["w_quartiere", "w_comodo", "w_rumoroso", "w_metropolitana", "w_secondo"]}}
  pool10: &pool10 {language_code: it, part_of_speech: [noun, particle, adjective, verb, adverb], agreement_tags: {semantic: ["w_capisco", "w_vero", "w_negozi", "w_troppo", "w_utile", "w_però"]}}
  pool11: &pool11 {language_code: it, part_of_speech: [verb, adverb, noun], agreement_tags: {semantic: ["w_capisco", "w_vero", "w_negozi", "w_troppo"]}}
  t_capisco: &t_capisco {language_code: it, part_of_speech: verb, agreement_tags: {semantic: "w_capisco"}}
  t_vero: &t_vero {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_vero"}}
  t_troppo: &t_troppo {language_code: it, part_of_speech: adverb, agreement_tags: {semantic: "w_troppo"}}
  t_utile: &t_utile {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: "w_utile"}}
  t_pero_: &t_pero_ {language_code: it, part_of_speech: particle, agreement_tags: {semantic: "w_però"}}
  t_negozi: &t_negozi {language_code: it, part_of_speech: noun, agreement_tags: {semantic: "w_negozi"}}
  pool18: &pool18 {language_code: it, part_of_speech: [adjective, verb, adverb, noun], agreement_tags: {semantic: ["w_capisco", "w_vero", "w_negozi", "w_troppo", "w_utile", "w_utili"]}}
templates:
  - content_key: practice.en-it.it.a2.unit26.lesson01.choose.001
    lesson_content_key: it.a2.unit26.lesson01.secondo_me
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Secondo me introduces an opinion.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson01.listen.002
    lesson_content_key: it.a2.unit26.lesson01.secondo_me
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Rumoroso means noisy.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson01.order.003
    lesson_content_key: it.a2.unit26.lesson01.secondo_me
    type: word_order
    frame: {text: "Secondo me il quartiere è {item}.", language_code: it, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: render_frame, frame: {text: "Secondo me il quartiere è {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Comodo and rumoroso both agree with the masculine il quartiere.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson01.order.004
    lesson_content_key: it.a2.unit26.lesson01.secondo_me
    type: word_order
    frame: {text: "C'è la {item} nel quartiere.", language_code: it, direction: ltr}
    slots: {item: *t_metropolitana}
    answer_derivation: {kind: render_frame, frame: {text: "C'è la {item} nel quartiere.", language_code: it, direction: ltr}}
    feedback_frame: {text: "La metropolitana is the subway.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson01.fill.005
    lesson_content_key: it.a2.unit26.lesson01.secondo_me
    type: fill_in_blank
    frame: {text: "Il bar è {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_rumoroso, hint: *t_rumoroso}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Rumoroso describes a noisy place.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson01.fill.006
    lesson_content_key: it.a2.unit26.lesson01.secondo_me
    type: fill_in_blank
    frame: {text: "Mi piace {item} è vicino. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_perche_, hint: *t_perche_}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Perché here means because.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson01.translate.007
    lesson_content_key: it.a2.unit26.lesson01.secondo_me
    type: translation
    frame: {text: "I agree with you.", language_code: en, direction: ltr}
    slots: {item: *t_d_accordo}
    answer_derivation: {kind: render_frame, frame: {text: "Sono {item} con te.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Sono d'accordo is the set phrase for I agree.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson01.translate.008
    lesson_content_key: it.a2.unit26.lesson01.secondo_me
    type: translation
    frame: {text: "In my opinion, the neighborhood is convenient.", language_code: en, direction: ltr}
    slots: {item: *t_comodo}
    answer_derivation: {kind: render_frame, frame: {text: "Secondo me il quartiere è {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Secondo me means in my opinion.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson01.translate.009
    lesson_content_key: it.a2.unit26.lesson01.secondo_me
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool9}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Secondo, followed by me, gives an opinion.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson01.match.010
    lesson_content_key: it.a2.unit26.lesson01.secondo_me
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *pool1, second: *pool1, third: *pool1, fourth: *pool1, fifth: *pool1, sixth: *pool1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "These are the words for describing a neighborhood.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson02.choose.001
    lesson_content_key: it.a2.unit26.lesson02.rispondere
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool10}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Capisco means I understand.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson02.listen.002
    lesson_content_key: it.a2.unit26.lesson02.rispondere
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool11}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Troppo means too or too much.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson02.order.003
    lesson_content_key: it.a2.unit26.lesson02.rispondere
    type: word_order
    frame: {text: "{item}, ma secondo me è caro.", language_code: it, direction: ltr}
    slots: {item: *t_capisco}
    answer_derivation: {kind: render_frame, frame: {text: "{item}, ma secondo me è caro.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Capisco, ma... politely softens a disagreement.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson02.order.004
    lesson_content_key: it.a2.unit26.lesson02.rispondere
    type: word_order
    frame: {text: "È {item}, però i negozi sono utili.", language_code: it, direction: ltr}
    slots: {item: *t_vero}
    answer_derivation: {kind: render_frame, frame: {text: "È {item}, però i negozi sono utili.", language_code: it, direction: ltr}}
    feedback_frame: {text: "È vero, però... concedes a point before adding a contrast.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson02.order.005
    lesson_content_key: it.a2.unit26.lesson02.rispondere
    type: word_order
    frame: {text: "È {item} rumoroso.", language_code: it, direction: ltr}
    slots: {item: *t_troppo}
    answer_derivation: {kind: render_frame, frame: {text: "È {item} rumoroso.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Troppo goes before the adjective: too noisy.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson02.fill.006
    lesson_content_key: it.a2.unit26.lesson02.rispondere
    type: fill_in_blank
    frame: {text: "La banca è {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_utile, hint: *t_utile}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Utile means useful.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson02.fill.007
    lesson_content_key: it.a2.unit26.lesson02.rispondere
    type: fill_in_blank
    frame: {text: "È vero, {item} i negozi sono utili. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_pero_, hint: *t_pero_}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Però means however.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson02.translate.008
    lesson_content_key: it.a2.unit26.lesson02.rispondere
    type: translation
    frame: {text: "The shops are useful.", language_code: en, direction: ltr}
    slots: {item: *t_negozi}
    answer_derivation: {kind: render_frame, frame: {text: "I {item} sono utili.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Negozi is the plural of negozio, shop.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson02.translate.009
    lesson_content_key: it.a2.unit26.lesson02.rispondere
    type: translation
    frame: {text: "It is too noisy.", language_code: en, direction: ltr}
    slots: {item: *t_troppo}
    answer_derivation: {kind: render_frame, frame: {text: "È {item} rumoroso.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Troppo means too.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson02.translate.010
    lesson_content_key: it.a2.unit26.lesson02.rispondere
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Utile has the plural utili.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a2.unit26.lesson02.match.011
    lesson_content_key: it.a2.unit26.lesson02.rispondere
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *pool18, second: *pool18, third: *pool18, fourth: *pool18, fifth: *pool18, sixth: *pool18}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Utile is singular and utili is plural.", language_code: en, direction: ltr}
