schema_version: "1.0"
pack_key: practice.en-it.a1.unit02
source_language: en
target_language: it
unit_content_key: it.a1.unit02.origin_nationality_language
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u02* lesson tags, w_<token> anchors).
    The elided tokens dov, d and po are left out of pools because their glosses would duplicate dove / of. Character canon (Sam American engineer from Chicago, Elena Italian) is not asserted in any frame.
    Reviewer check: sei is glossed 'you are (informal); six' (the six sense is taught in unit03) and appears only in the L1 recognition pool.
    Opus pass: fixed a wrong stress claim for ingegnere (penultimate, not antepenultimate), softened an overstrict 'not parlo l'inglese' claim, reworded one feedback line.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Milano, w_americana, w_americano, w_anni, w_anno, w_bello, w_che, w_dove, w_due, w_fa, w_fai, w_ingegnere, w_inglese, w_italiana, w_italiano, w_lavoro, w_parla, w_parli, w_parlo, w_per, w_quanto, w_qui, w_sei, w_studi, w_studio, w_è]
slot_presets:
  l1_core: &l1_core {language_code: it, part_of_speech: [proper_noun, verb, adjective, adverb], agreement_tags: {semantic: [w_dove, w_sei, w_è, w_americano, w_americana, w_italiana, w_italiano, w_Milano]}}
  l1_hear: &l1_hear {language_code: it, part_of_speech: [proper_noun, verb, adjective, adverb], agreement_tags: {semantic: [w_dove, w_sei, w_è, w_americano, w_italiana, w_Milano]}}
  dove: &dove {language_code: it, part_of_speech: adverb, agreement_tags: {semantic: w_dove}}
  milano: &milano {language_code: it, part_of_speech: proper_noun, agreement_tags: {semantic: w_Milano}}
  l1_words: &l1_words {language_code: it, part_of_speech: [proper_noun, verb, adjective, adverb], agreement_tags: {semantic: [w_dove, w_è, w_americano, w_americana, w_italiana, w_italiano, w_Milano]}}
  l2_core: &l2_core {language_code: it, part_of_speech: [noun, pronoun, verb], agreement_tags: {semantic: [w_parli, w_parla, w_parlo, w_inglese, w_studio, w_anno, w_studi, w_quanto]}}
  l2_hear: &l2_hear {language_code: it, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_parli, w_parla, w_parlo, w_studio, w_studi, w_anno]}}
  langs: &langs {language_code: it, part_of_speech: [noun, adjective], agreement_tags: {semantic: [w_inglese, w_italiano]}}
  quanto: &quanto {language_code: it, part_of_speech: pronoun, agreement_tags: {semantic: w_quanto}}
  inglese: &inglese {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_inglese}}
  l3_core: &l3_core {language_code: it, part_of_speech: [noun, verb, adjective, adverb, preposition], agreement_tags: {semantic: [w_lavoro, w_fai, w_fa, w_ingegnere, w_qui, w_per, w_due, w_anni, w_bello]}}
  l3_hear: &l3_hear {language_code: it, part_of_speech: [noun, verb, adverb], agreement_tags: {semantic: [w_ingegnere, w_lavoro, w_fai, w_fa, w_qui, w_due, w_anni]}}
  l3_pairs: &l3_pairs {language_code: it, part_of_speech: [noun, pronoun, verb, adjective, adverb, preposition], agreement_tags: {semantic: [w_lavoro, w_fai, w_fa, w_ingegnere, w_qui, w_per, w_due, w_anni, w_bello, w_che]}}
  l3_words: &l3_words {language_code: it, part_of_speech: [noun, adjective, adverb, preposition], agreement_tags: {semantic: [w_lavoro, w_ingegnere, w_qui, w_per, w_due, w_anni, w_bello]}}
  lavoro: &lavoro {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_lavoro}}
  fai: &fai {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_fai}}
templates:
  - content_key: practice.en-it.it.a1.unit02.lesson01.choose.001
    lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l1_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Nationalities change with the speaker: americano for a man, americana for a woman; italiano and italiana work the same way.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson01.order.002
    lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
    type: word_order
    frame: {text: "Di {item} sei?", language_code: it, direction: ltr}
    slots: {item: *dove}
    answer_derivation: {kind: render_frame, frame: {text: "Di {item} sei?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Di dove sei? asks a friend where they are from; to a stranger you say Di dov'è, Lei?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson01.fill.003
    lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
    type: fill_in_blank
    frame: {text: "Sono italiana, di {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *milano, hint: *milano}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Italian city names often differ from English: Milano is Milan.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson01.match.004
    lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *l1_core, second: *l1_core, third: *l1_core, fourth: *l1_core, fifth: *l1_core, sixth: *l1_core}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "The ending shows gender: -o for a man (americano), -a for a woman (americana).", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson01.translate.005
    lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l1_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Italian does not capitalise nationalities or languages: italiano, inglese.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson01.translate.006
    lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
    type: translation
    frame: {text: "Where are you from? (informal)", language_code: en, direction: ltr}
    slots: {item: *dove}
    answer_derivation: {kind: render_frame, frame: {text: "Di {item} sei?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Di dove sei? is the tu question; the polite Lei version is Di dov'è, Lei?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson02.choose.001
    lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l2_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The verb ending shows who does the action: parlo is I speak, parli is you (informal) speak, parla is you (formal) or he/she speaks.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson02.listen.002
    lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l2_hear}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Parli and parla sound alike: the last vowel tells you whether it is tu (-i) or Lei (-a).", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson02.order.003
    lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
    type: word_order
    frame: {text: "Parlo {item}.", language_code: it, direction: ltr}
    slots: {item: *langs}
    answer_derivation: {kind: render_frame, frame: {text: "Parlo {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "After parlare the language usually needs no article: parlo inglese, parlo italiano.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson02.fill.004
    lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
    type: fill_in_blank
    frame: {text: "Da {item} studi? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *quanto, hint: *quanto}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Da quanto studi? asks how long you have been studying; Italian uses the present tense with da, for.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson02.translate.005
    lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
    type: translation
    frame: {text: "Do you speak English? (informal)", language_code: en, direction: ltr}
    slots: {item: *inglese}
    answer_derivation: {kind: render_frame, frame: {text: "Parli {item}?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Parli is the tu form; for a stranger you would use the Lei form, Parla inglese?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson03.choose.001
    lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l3_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Fai and fa are both forms of fare: fai is for tu, fa is for Lei or he/she.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson03.listen.002
    lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l3_hear}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ingegnere is stressed on the next-to-last syllable: in-ge-GNE-re.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson03.order.003
    lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
    type: word_order
    frame: {text: "Che {item} fai?", language_code: it, direction: ltr}
    slots: {item: *lavoro}
    answer_derivation: {kind: render_frame, frame: {text: "Che {item} fai?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Che lavoro fai? literally asks what work you do; the polite version is Che lavoro fa, Lei?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson03.fill.004
    lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
    type: fill_in_blank
    frame: {text: "Che lavoro {item}? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *fai, hint: *fai}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Fai is the tu form of fare; with Lei it becomes fa.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson03.match.005
    lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *l3_pairs, second: *l3_pairs, third: *l3_pairs, fourth: *l3_pairs, fifth: *l3_pairs, sixth: *l3_pairs}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Che is a flexible word: here it means what in Che lavoro fai? and also what a ... in Che bello!", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson03.translate.006
    lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l3_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Per means for: per lavoro is for work, per due anni is for two years.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit02.lesson03.translate.007
    lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
    type: translation
    frame: {text: "I'm here for work.", language_code: en, direction: ltr}
    slots: {item: *lavoro}
    answer_derivation: {kind: render_frame, frame: {text: "Sono qui per {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Italian uses per with no article here: per lavoro, for work.", language_code: en, direction: ltr}
