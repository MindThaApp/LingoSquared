    semantic: [w_afferma, w_affermare, w_aspettare, w_aspetto, w_bottega, w_capisce, w_contraddicono, w_contraddirsi, w_contrario, w_convincente, w_costa, w_costare, w_differenza, w_due, w_dunque, w_economico, w_eppure, w_euro, w_fantastica, w_fonte, w_fonti, w_motivato, w_opinione, w_piace, w_piacere, w_pizza, w_positiva, w_prezzo, w_quel, w_ragione, w_recensione, w_recensioni, w_sedici, w_sommato, w_sostenere, w_sostiene, w_stesso, w_tornare, w_torno, w_trova, w_trovare, w_trovo, w_tutto]
templates:
- content_key: practice.en-it.it.b2.unit08.lesson01.choose.001
  lesson_content_key: it.b2.unit08.lesson01.chi_dice_cosa
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: &id001
      language_code: it
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_bottega, w_recensione, w_recensioni, w_fonte, w_fonti, w_prezzo, w_sostiene, w_sostenere, w_afferma, w_affermare, w_capisce, w_due, w_economico, w_contrario, w_positiva, w_differenza, w_trova, w_opinione, w_stesso, w_contraddicono, w_contraddirsi, w_eppure, w_fantastica, w_torno, w_tornare, w_trovo, w_trovare, w_costa, w_costare, w_pizza, w_sedici, w_euro, w_quel, w_aspetto, w_aspettare, w_ragione, w_motivato, w_piace, w_piacere, w_dunque, w_convincente, w_tutto, w_sommato]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on who says what?.', language_code: en, direction: ltr}
