  p2: &p2 {language_code: it, part_of_speech: ["verb", "adverb"], agreement_tags: {semantic: ["w_bisogna", "w_consegni", "w_consegnare", "w_firmi", "w_firmare", "w_prima"]}}
  p3: &p3 {language_code: it, part_of_speech: ["verb", "particle", "pronoun"], agreement_tags: {semantic: ["w_bisognava", "w_chiamassi", "w_chiamare", "w_ma", "w_fatto", "w_io"]}}
  p4: &p4 {language_code: it, part_of_speech: ["verb", "adverb", "particle"], agreement_tags: {semantic: ["w_bisogna", "w_consegni", "w_consegnare", "w_firmi", "w_firmare", "w_prima", "w_non"]}}
  p5: &p5 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_bisogna", "w_consegni", "w_firmi", "w_firmare", "w_bisognava", "w_chiamassi", "w_chiamare", "w_fatto"]}}
  p6: &p6 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_consegni"]}}
  p7: &p7 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_bisogna"]}}
  p8: &p8 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_consegnare"]}}
  p9: &p9 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_firmi"]}}
  p10: &p10 {language_code: it, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_prima"]}}
  p11: &p11 {language_code: it, part_of_speech: ["particle"], agreement_tags: {semantic: ["w_non"]}}
