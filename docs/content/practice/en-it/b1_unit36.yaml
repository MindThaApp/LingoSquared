templates:
  - content_key: practice.en-it.it.b1.unit36.lesson01.choose.001
    lesson_content_key: it.b1.unit36.lesson01.bisogna_che
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on obligations.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson01.listen.001
    lesson_content_key: it.b1.unit36.lesson01.bisogna_che
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on obligations.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson02.choose.001
    lesson_content_key: it.b1.unit36.lesson02.divieto_rimpianto
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the second lesson of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson01.translate.001
    lesson_content_key: it.b1.unit36.lesson01.bisogna_che
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson01.match.001
    lesson_content_key: it.b1.unit36.lesson01.bisogna_che
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p5, second: *p5, third: *p5, fourth: *p5, fifth: *p5, sixth: *p5}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the obligation vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson01.translate.002
    lesson_content_key: it.b1.unit36.lesson01.bisogna_che
    type: translation
    frame: {text: "It is necessary that Sam hands in the form today.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Bisogna che Sam {item} il modulo oggi.", language_code: it, direction: ltr}, accepted_variants: ["È necessario che Sam {item} il modulo oggi.", "Oggi bisogna che Sam {item} il modulo."]}
    feedback_frame: {text: "After bisogna che, Italian uses the subjunctive: consegni.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson01.fill.001
    lesson_content_key: it.b1.unit36.lesson01.bisogna_che
    type: fill_in_blank
    frame: {text: "Oggi {item} che Sam consegni il modulo. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Bisogna che introduces something that must happen.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson01.fill.002
    lesson_content_key: it.b1.unit36.lesson01.bisogna_che
    type: fill_in_blank
    frame: {text: "Bisogna che Sam {item} il modulo oggi. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p6, hint: *p6}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Consegni is the subjunctive of consegnare.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson01.order.001
    lesson_content_key: it.b1.unit36.lesson01.bisogna_che
    type: word_order
    frame: {text: "Sam deve {item} il modulo oggi.", language_code: it, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "Sam deve {item} il modulo oggi.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Dovere is followed by the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson01.translate.003
    lesson_content_key: it.b1.unit36.lesson01.bisogna_che
    type: translation
    frame: {text: "It is necessary that Elena does not sign before the confirmation.", language_code: en, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Bisogna che Elena non {item} prima della conferma.", language_code: it, direction: ltr}, accepted_variants: ["È necessario che Elena non {item} prima della conferma."]}
    feedback_frame: {text: "The negation non goes before the subjunctive: non firmi.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson02.fill.001
    lesson_content_key: it.b1.unit36.lesson02.divieto_rimpianto
    type: fill_in_blank
    frame: {text: "Bisogna che Elena non firmi {item} della conferma. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p10, hint: *p10}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Prima della means before the.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson02.order.001
    lesson_content_key: it.b1.unit36.lesson02.divieto_rimpianto
    type: word_order
    frame: {text: "Bisogna che Elena {item} firmi prima della conferma.", language_code: it, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: render_frame, frame: {text: "Bisogna che Elena {item} firmi prima della conferma.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Non comes right before the verb.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson02.fill.002
    lesson_content_key: it.b1.unit36.lesson02.divieto_rimpianto
    type: fill_in_blank
    frame: {text: "Non voglio {item} il modulo. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p12, hint: *p12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Voglio is followed by the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson02.translate.001
    lesson_content_key: it.b1.unit36.lesson02.divieto_rimpianto
    type: translation
    frame: {text: "I had to call earlier, but I did not do it.", language_code: en, direction: ltr}
    slots: {item: *p13}
    answer_derivation: {kind: render_frame, frame: {text: "Bisognava che io chiamassi prima, ma non l'{item} fatto.", language_code: it, direction: ltr}, accepted_variants: ["Bisognava che chiamassi prima, ma non l'{item} fatto.", "Avrei dovuto chiamare prima, ma non l'{item} fatto."]}
    feedback_frame: {text: "L' stands for lo and elides before ho.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson02.fill.003
    lesson_content_key: it.b1.unit36.lesson02.divieto_rimpianto
    type: fill_in_blank
    frame: {text: "Bisognava che io {item} prima, ma non l'ho fatto. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p14, hint: *p14}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After bisognava che, the imperfect subjunctive follows: chiamassi.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson02.fill.004
    lesson_content_key: it.b1.unit36.lesson02.divieto_rimpianto
    type: fill_in_blank
    frame: {text: "Bisognava che io chiamassi prima, {item} non l'ho fatto. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p15, hint: *p15}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ma means but.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson02.order.002
    lesson_content_key: it.b1.unit36.lesson02.divieto_rimpianto
    type: word_order
    frame: {text: "Bisognava che {item} chiamassi prima, ma non l'ho fatto.", language_code: it, direction: ltr}
    slots: {item: *p16}
    answer_derivation: {kind: render_frame, frame: {text: "Bisognava che {item} chiamassi prima, ma non l'ho fatto.", language_code: it, direction: ltr}}
    feedback_frame: {text: "In the subjunctive the subject pronoun io avoids confusion with tu.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit36.lesson02.fill.005
    lesson_content_key: it.b1.unit36.lesson02.divieto_rimpianto
    type: fill_in_blank
    frame: {text: "Bisognava che io chiamassi prima, ma non l'ho {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p17, hint: *p17}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Fatto is the participle of fare.", language_code: en, direction: ltr}
