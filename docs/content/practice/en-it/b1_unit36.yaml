schema_version: "1.0"
pack_key: practice.en-it.b1.unit36
source_language: en
target_language: it
unit_content_key: it.b1.unit36.obblighi
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Obligation with bisogna che + present subjunctive, a negated subjunctive, and bisognava che + imperfect subjunctive. Variants accept e necessario che and a fronted time word. NATIVE FLAG: non l'ho fatto uses the elided object pronoun l' (one token l in the unit); the pack anchors on ho and keeps l' in the frame.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_bisogna", "w_bisognava", "w_chiamare", "w_chiamassi", "w_consegnare", "w_consegni", "w_della", "w_fatto", "w_firmare", "w_firmi", "w_ho", "w_io", "w_ma", "w_non", "w_prima"]
slot_presets:
