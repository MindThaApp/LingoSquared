schema_version: "1.0"
pack_key: practice.en-it.a1.unit08
source_language: en
target_language: it
unit_content_key: it.a1.unit08.shopping
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u08* lesson tags, w_<token> anchors).
    Lesson 2 (quanto_costa) has no first-sight tokens, so nothing is anchored there. Fruit/vegetable frames use curated lists by article: 'le' takes mele, banane, patate; 'i' takes only pomodori. Prices use earlier-unit numbers as literal text.
    Reviewer check: the gloss of lo ('it (object); the (masc., ...)') is long because both senses are taught; only the object sense is used in frames.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_banane, w_chilo, w_costano, w_lo, w_mele, w_patate, w_pomodori, w_prendo, w_va]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_mele, w_banane, w_pomodori, w_patate, w_costano, w_chilo]}}
  pool2: &pool2 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_mele, w_banane, w_patate]}}
  t_pomodori: &t_pomodori {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_pomodori}}
  t_chilo: &t_chilo {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_chilo}}
  t_costano: &t_costano {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_costano}}
  pool6: &pool6 {language_code: it, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_mele, w_banane, w_pomodori, w_patate, w_chilo, w_costano, w_prendo]}}
  pool7: &pool7 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_mele, w_banane, w_pomodori, w_patate, w_chilo]}}
  pool8: &pool8 {language_code: it, part_of_speech: [verb, pronoun, noun], agreement_tags: {semantic: [w_va, w_lo, w_prendo, w_costano, w_chilo]}}
  pool9: &pool9 {language_code: it, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_va, w_prendo, w_costano, w_chilo]}}
  t_lo: &t_lo {language_code: it, part_of_speech: pronoun, agreement_tags: {semantic: w_lo}}
  t_prendo: &t_prendo {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_prendo}}
templates:
  - content_key: practice.en-it.it.a1.unit08.lesson01.choose.001
    lesson_content_key: it.a1.unit08.lesson01.al_mercato
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mele is the plural of mela: feminine nouns in -a form their plural in -e.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson01.listen.002
    lesson_content_key: it.a1.unit08.lesson01.al_mercato
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mele, banane and patate are feminine plural and take le; pomodori is masculine plural and takes i.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson01.order.003
    lesson_content_key: it.a1.unit08.lesson01.al_mercato
    type: word_order
    frame: {text: "Quanto costano le {item}?", language_code: it, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: render_frame, frame: {text: "Quanto costano le {item}?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Le goes with feminine plural nouns, and costano is the plural verb because several things are priced.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson01.order.004
    lesson_content_key: it.a1.unit08.lesson01.al_mercato
    type: word_order
    frame: {text: "Quanto costano i {item}?", language_code: it, direction: ltr}
    slots: {item: *t_pomodori}
    answer_derivation: {kind: render_frame, frame: {text: "Quanto costano i {item}?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Pomodori is masculine plural, so it takes i, not le.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson01.fill.005
    lesson_content_key: it.a1.unit08.lesson01.al_mercato
    type: fill_in_blank
    frame: {text: "Costano tre euro al {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_chilo, hint: *t_chilo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Al chilo means per kilo, the usual way of pricing produce.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson01.fill.006
    lesson_content_key: it.a1.unit08.lesson01.al_mercato
    type: fill_in_blank
    frame: {text: "Quanto {item} le mele? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_costano, hint: *t_costano}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mele is plural, so the verb is costano, not costa.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson03.match.001
    lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *pool6, second: *pool6, third: *pool6, fourth: *pool6, fifth: *pool6, sixth: *pool6}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Italian shops price fruit and vegetables by the kilo.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson01.translate.007
    lesson_content_key: it.a1.unit08.lesson01.al_mercato
    type: translation
    frame: {text: "How much do the apples cost?", language_code: en, direction: ltr}
    slots: {item: *t_costano}
    answer_derivation: {kind: render_frame, frame: {text: "Quanto {item} le mele?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Plural nouns take costano: quanto costano le mele.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson01.translate.008
    lesson_content_key: it.a1.unit08.lesson01.al_mercato
    type: translation
    frame: {text: "They cost three euros a kilo.", language_code: en, direction: ltr}
    slots: {item: *t_chilo}
    answer_derivation: {kind: render_frame, frame: {text: "Costano tre euro al {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "After a number, euro stays the same in Italian: tre euro.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson01.translate.009
    lesson_content_key: it.a1.unit08.lesson01.al_mercato
    type: translation
    frame: {text: "I would like a kilo of apples, please.", language_code: en, direction: ltr}
    slots: {item: *t_chilo}
    answer_derivation: {kind: render_frame, frame: {text: "Vorrei un {item} di mele, per favore.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Di links a quantity to the thing: un chilo di mele.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson01.translate.010
    lesson_content_key: it.a1.unit08.lesson01.al_mercato
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mele, banane, pomodori and patate are plural here, as shoppers buy them by the kilo.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson03.choose.002
    lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool8}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Lo prendo means I will take it; lo refers to a masculine item.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson03.listen.003
    lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool9}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Va bene is a very common way to say okay.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson03.fill.004
    lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
    type: fill_in_blank
    frame: {text: "Va bene, {item} prendo. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_lo, hint: *t_lo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Lo means it and sits before the verb: lo prendo.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson03.order.005
    lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
    type: word_order
    frame: {text: "Va bene, lo {item}.", language_code: it, direction: ltr}
    slots: {item: *t_prendo}
    answer_derivation: {kind: render_frame, frame: {text: "Va bene, lo {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Prendo is the I form of prendere, to take, used to accept a price.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit08.lesson03.translate.006
    lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
    type: translation
    frame: {text: "Okay, I'll take it.", language_code: en, direction: ltr}
    slots: {item: *t_prendo}
    answer_derivation: {kind: render_frame, frame: {text: "Va bene, lo {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Va bene, lo prendo is the standard way to close a purchase.", language_code: en, direction: ltr}
