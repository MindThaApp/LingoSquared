schema_version: "1.0"
pack_key: practice.en-it.a1.unit04
source_language: en
target_language: it
unit_content_key: it.a1.unit04.calendar_dates
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u04* lesson tags, w_<token> anchors).
    Weekday and month pools are curated w_ lists of this unit's own tokens. The date frame uses cinque (unit03) and 'Today is {month} fifth.' reads naturally for every month.
    Reviewer check: dates use a plain cardinal (il cinque gennaio) as taught; il primo for the first of the month is not taught and not used.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Roma, w_aprile, w_arrivi, w_arrivo, w_data, w_domenica, w_dopodomani, w_febbraio, w_gennaio, w_giorno, w_giovedì, w_lunedì, w_martedì, w_marzo, w_mercoledì, w_oggi, w_pomeriggio, w_quando, w_quindici, w_sabato, w_venerdì]
slot_presets:
  l1_core: &l1_core {language_code: it, part_of_speech: [noun, adverb], agreement_tags: {semantic: [w_lunedì, w_martedì, w_mercoledì, w_giovedì, w_venerdì, w_sabato, w_domenica, w_giorno, w_oggi]}}
  days: &days {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_lunedì, w_martedì, w_mercoledì, w_giovedì, w_venerdì, w_sabato, w_domenica]}}
  giorno: &giorno {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_giorno}}
  oggi: &oggi {language_code: it, part_of_speech: adverb, agreement_tags: {semantic: w_oggi}}
  l2_core: &l2_core {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_data, w_gennaio, w_febbraio, w_marzo, w_aprile, w_quindici]}}
  months: &months {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_gennaio, w_febbraio, w_marzo, w_aprile]}}
  data: &data {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_data}}
  quindici: &quindici {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_quindici}}
  l3_core: &l3_core {language_code: it, part_of_speech: [noun, proper_noun, verb, adverb], agreement_tags: {semantic: [w_quando, w_arrivi, w_Roma, w_arrivo, w_pomeriggio, w_dopodomani]}}
  roma: &roma {language_code: it, part_of_speech: proper_noun, agreement_tags: {semantic: w_Roma}}
  arrivi: &arrivi {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_arrivi}}
  pomeriggio: &pomeriggio {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_pomeriggio}}
templates:
  - content_key: practice.en-it.it.a1.unit04.lesson01.choose.001
    lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l1_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Italian weekdays are written in lowercase, unlike English ones.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson01.listen.002
    lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l1_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Martedì and mercoledì carry a written accent on the last syllable, which is stressed.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson01.order.003
    lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
    type: word_order
    frame: {text: "Che {item} è oggi?", language_code: it, direction: ltr}
    slots: {item: *giorno}
    answer_derivation: {kind: render_frame, frame: {text: "Che {item} è oggi?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Che giorno è oggi? asks for the day of the week; for the date you ask Che data è oggi?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson01.fill.004
    lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
    type: fill_in_blank
    frame: {text: "Che giorno è {item}? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *oggi, hint: *oggi}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Oggi is today; domani is tomorrow, and the same question works for both.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson01.match.005
    lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *days, second: *days, third: *days, fourth: *days, fifth: *days, sixth: *days}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Monday to Friday end in -dì, from dies, day; sabato and domenica do not.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson01.translate.006
    lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
    type: translation
    frame: {text: "Today is {day}.", language_code: en, direction: ltr, slot_rendering: {day: english_gloss}}
    slots: {day: *days}
    answer_derivation: {kind: render_frame, frame: {text: "Oggi è {day}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Italian drops the article with weekdays used this way: Oggi è lunedì, not Oggi è il lunedì.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson02.choose.001
    lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l2_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Italian months are not capitalised: gennaio, febbraio, marzo.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson02.listen.002
    lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l2_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Febbraio has a double b; listen for the held consonant.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson02.order.003
    lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
    type: word_order
    frame: {text: "Che {item} è oggi?", language_code: it, direction: ltr}
    slots: {item: *data}
    answer_derivation: {kind: render_frame, frame: {text: "Che {item} è oggi?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Data means date; Che data è oggi? asks for the day and month, not the weekday.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson02.fill.004
    lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
    type: fill_in_blank
    frame: {text: "Oggi è il {item} marzo. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *quindici, hint: *quindici}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Dates use il plus a cardinal number: il quindici marzo, March fifteenth.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson02.translate.005
    lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l2_core}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Gennaio, febbraio, marzo and aprile follow the English order of the year.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson02.translate.006
    lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
    type: translation
    frame: {text: "Today is {month} fifth.", language_code: en, direction: ltr, slot_rendering: {month: english_gloss}}
    slots: {month: *months}
    answer_derivation: {kind: render_frame, frame: {text: "Oggi è il cinque {month}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Italian puts the day first: il cinque gennaio, literally the five January.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson03.choose.001
    lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l3_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Arrivo is I arrive and arrivi is you (informal) arrive; the ending -i marks tu.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson03.order.002
    lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
    type: word_order
    frame: {text: "Quando arrivi a {item}?", language_code: it, direction: ltr}
    slots: {item: *roma}
    answer_derivation: {kind: render_frame, frame: {text: "Quando arrivi a {item}?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Roma is Rome; Italian city names often differ from English, and a is the word for to and in with a city.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson03.fill.003
    lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
    type: fill_in_blank
    frame: {text: "Quando {item} a Roma? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *arrivi, hint: *arrivi}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Quando arrivi? asks a friend when they arrive; the polite form is Quando arriva?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson03.match.004
    lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *l3_core, second: *l3_core, third: *l3_core, fourth: *l3_core, fifth: *l3_core, sixth: *l3_core}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Dopodomani is built from dopo, after, and domani, tomorrow: the day after tomorrow.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson03.translate.005
    lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l3_core}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Arrivo is I arrive and arrivi is you arrive; only the final vowel changes.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit04.lesson03.translate.006
    lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
    type: translation
    frame: {text: "I arrive Thursday afternoon.", language_code: en, direction: ltr}
    slots: {item: *pomeriggio}
    answer_derivation: {kind: render_frame, frame: {text: "Arrivo giovedì {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Italian needs no word for on before a weekday: arrivo giovedì, I arrive Thursday.", language_code: en, direction: ltr}
