schema_version: "1.0"
pack_key: practice.en-it.a1.unit18
source_language: en
target_language: it
unit_content_key: it.a1.unit18.housing
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u18* lesson tags, w_<token> anchors).
    Room and furniture frames use the unit's own sentences. nel goes with masculine nouns (il soggiorno) and nella with feminine ones (la camera da letto); both are single-member slots. 'Questa è la mia {cucina/camera}' lists only feminine singular rooms. dov'è appears only in recognition pools because it would be sentence-initial.
    Reviewer check: camera is glossed 'room; bedroom' and is used as 'my camera' in one frame.
    Opus pass: dietro feedback no longer claims 'a' is impossible (dietro al tavolo is also correct). NATIVE FLAG: 'The bed is in the bedroom' grades only 'nella camera da letto'; consider accepting the very common 'in camera da letto', especially since order.002 teaches 'in cucina' without an article.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_bagno, w_camera, w_cucina, w_dietro, w_divano, "w_dov'è", w_finestra, w_nel, w_nella, w_sedia, w_soggiorno, w_sopra, w_sotto, w_stanze, w_tavolo]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_cucina, w_soggiorno, w_bagno, w_stanze]}}
  pool2: &pool2 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_cucina, w_soggiorno, w_camera, w_bagno]}}
  pool3: &pool3 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_cucina, w_camera]}}
  t_stanze: &t_stanze {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_stanze}}
  t_cucina: &t_cucina {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_cucina}}
  pool6: &pool6 {language_code: it, part_of_speech: [noun, preposition], agreement_tags: {semantic: [w_tavolo, w_sedia, w_divano, w_nella, w_nel]}}
  t_tavolo: &t_tavolo {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_tavolo}}
  t_nel: &t_nel {language_code: it, part_of_speech: preposition, agreement_tags: {semantic: w_nel}}
  t_nella: &t_nella {language_code: it, part_of_speech: preposition, agreement_tags: {semantic: w_nella}}
  t_sedia: &t_sedia {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_sedia}}
  pool11: &pool11 {language_code: it, part_of_speech: [preposition, noun, verb], agreement_tags: {semantic: [w_dietro, w_sopra, w_sotto, w_finestra, "w_dov'è"]}}
  pool12: &pool12 {language_code: it, part_of_speech: [preposition, noun], agreement_tags: {semantic: [w_dietro, w_sopra, w_sotto, w_finestra]}}
  t_dietro: &t_dietro {language_code: it, part_of_speech: preposition, agreement_tags: {semantic: w_dietro}}
  t_sotto: &t_sotto {language_code: it, part_of_speech: preposition, agreement_tags: {semantic: w_sotto}}
  t_finestra: &t_finestra {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_finestra}}
  pool16: &pool16 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_cucina, w_soggiorno, w_bagno, w_tavolo, w_sedia, w_divano, w_finestra]}}
templates:
  - content_key: practice.en-it.it.a1.unit18.lesson01.choose.001
    lesson_content_key: it.a1.unit18.lesson01.le_stanze_della_casa
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Il soggiorno and il bagno are masculine; la cucina is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson01.listen.002
    lesson_content_key: it.a1.unit18.lesson01.le_stanze_della_casa
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Camera da letto means bedroom.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson01.order.003
    lesson_content_key: it.a1.unit18.lesson01.le_stanze_della_casa
    type: word_order
    frame: {text: "Questa è la mia {item}.", language_code: it, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: render_frame, frame: {text: "Questa è la mia {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Questa and mia are feminine and agree with a feminine room.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson01.fill.004
    lesson_content_key: it.a1.unit18.lesson01.le_stanze_della_casa
    type: fill_in_blank
    frame: {text: "Ci sono quattro {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_stanze, hint: *t_stanze}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Stanze is the plural of stanza, so it follows quattro.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson01.translate.005
    lesson_content_key: it.a1.unit18.lesson01.le_stanze_della_casa
    type: translation
    frame: {text: "This is my kitchen.", language_code: en, direction: ltr}
    slots: {item: *t_cucina}
    answer_derivation: {kind: render_frame, frame: {text: "Questa è la mia {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Cucina is feminine, so use questa and mia.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson02.choose.001
    lesson_content_key: it.a1.unit18.lesson02.i_mobili
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool6}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Nel goes with masculine nouns and nella with feminine ones.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson02.order.002
    lesson_content_key: it.a1.unit18.lesson02.i_mobili
    type: word_order
    frame: {text: "Il {item} è in cucina.", language_code: it, direction: ltr}
    slots: {item: *t_tavolo}
    answer_derivation: {kind: render_frame, frame: {text: "Il {item} è in cucina.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Il tavolo is masculine and in cucina has no article.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson02.fill.003
    lesson_content_key: it.a1.unit18.lesson02.i_mobili
    type: fill_in_blank
    frame: {text: "Il divano è {item} soggiorno. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_nel, hint: *t_nel}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Nel is in plus il, for the masculine soggiorno.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson02.translate.004
    lesson_content_key: it.a1.unit18.lesson02.i_mobili
    type: translation
    frame: {text: "The bed is in the bedroom.", language_code: en, direction: ltr}
    slots: {item: *t_nella}
    answer_derivation: {kind: render_frame, frame: {text: "Il letto è {item} camera da letto.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Nella is in plus la, for the feminine camera.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson02.translate.005
    lesson_content_key: it.a1.unit18.lesson02.i_mobili
    type: translation
    frame: {text: "The chair is near the table.", language_code: en, direction: ltr}
    slots: {item: *t_sedia}
    answer_derivation: {kind: render_frame, frame: {text: "La {item} è vicino al tavolo.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Sedia is feminine and takes la.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson03.choose.001
    lesson_content_key: it.a1.unit18.lesson03.dove_il_letto
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool11}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Dietro, sopra and sotto say where something is.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson03.listen.002
    lesson_content_key: it.a1.unit18.lesson03.dove_il_letto
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool12}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Sopra means above or on, and sotto means under.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson03.order.003
    lesson_content_key: it.a1.unit18.lesson03.dove_il_letto
    type: word_order
    frame: {text: "Il divano è {item} il tavolo.", language_code: it, direction: ltr}
    slots: {item: *t_dietro}
    answer_derivation: {kind: render_frame, frame: {text: "Il divano è {item} il tavolo.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Dietro can go straight before the noun: dietro il tavolo, behind the table.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson03.fill.004
    lesson_content_key: it.a1.unit18.lesson03.dove_il_letto
    type: fill_in_blank
    frame: {text: "La sedia è {item} il tavolo. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_sotto, hint: *t_sotto}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Sotto il tavolo means under the table.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson03.translate.005
    lesson_content_key: it.a1.unit18.lesson03.dove_il_letto
    type: translation
    frame: {text: "The bed is near the window.", language_code: en, direction: ltr}
    slots: {item: *t_finestra}
    answer_derivation: {kind: render_frame, frame: {text: "Il letto è vicino alla {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Alla is a plus la, for the feminine finestra.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit18.lesson03.match.006
    lesson_content_key: it.a1.unit18.lesson03.dove_il_letto
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *pool16, second: *pool16, third: *pool16, fourth: *pool16, fifth: *pool16, sixth: *pool16}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Cucina, soggiorno and bagno are rooms; tavolo, sedia and divano are furniture.", language_code: en, direction: ltr}
