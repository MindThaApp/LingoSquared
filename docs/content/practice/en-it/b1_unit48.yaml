schema_version: "1.0"
pack_key: practice.en-it.b1.unit48
source_language: en
target_language: it
unit_content_key: it.b1.unit48.progetti
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Plans and predictions: present for fixed plans (parto martedi), ho intenzione di, ho gia comprato, future for uncertain predictions (probabilmente tornero, forse restero). Variants accept the clitic order, rimarro for restero and a fronted time word. NATIVE FLAG: none.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_Chicago", "w_agosto", "w_biglietto", "w_comprato", "w_forse", "w_intenzione", "w_martedì", "w_mese", "w_più", "w_probabilmente", "w_resterò", "w_settimane", "w_tornerò"]
slot_presets:
  p1: &p1 {language_code: it, part_of_speech: ["noun", "proper_noun", "verb"], agreement_tags: {semantic: ["w_martedì", "w_Chicago", "w_intenzione", "w_settimane", "w_biglietto", "w_comprato"]}}
  p2: &p2 {language_code: it, part_of_speech: ["adverb", "verb", "noun"], agreement_tags: {semantic: ["w_probabilmente", "w_tornerò", "w_agosto", "w_forse", "w_resterò", "w_mese"]}}
  p3: &p3 {language_code: it, part_of_speech: ["adverb", "verb", "noun"], agreement_tags: {semantic: ["w_probabilmente", "w_tornerò", "w_agosto", "w_forse", "w_resterò", "w_mese", "w_più"]}}
  p4: &p4 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_martedì"]}}
  p5: &p5 {language_code: it, part_of_speech: ["proper_noun"], agreement_tags: {semantic: ["w_Chicago"]}}
  p6: &p6 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_intenzione"]}}
  p7: &p7 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_settimane"]}}
  p8: &p8 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_comprato"]}}
  p9: &p9 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_biglietto"]}}
  p10: &p10 {language_code: it, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_probabilmente"]}}
  p11: &p11 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_tornerò"]}}
  p12: &p12 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_agosto"]}}
  p13: &p13 {language_code: it, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_forse"]}}
  p14: &p14 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_resterò"]}}
  p15: &p15 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_mese"]}}
  p16: &p16 {language_code: it, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_più"]}}
templates:
  - content_key: practice.en-it.it.b1.unit48.lesson01.choose.001
    lesson_content_key: it.b1.unit48.lesson01.programma_fisso
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on plans.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson01.listen.001
    lesson_content_key: it.b1.unit48.lesson01.programma_fisso
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the unit on plans.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson02.choose.001
    lesson_content_key: it.b1.unit48.lesson02.previsione_incerta
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the second lesson of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson01.translate.001
    lesson_content_key: it.b1.unit48.lesson01.programma_fisso
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson01.match.001
    lesson_content_key: it.b1.unit48.lesson01.programma_fisso
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the vocabulary of the plans.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson02.match.001
    lesson_content_key: it.b1.unit48.lesson02.previsione_incerta
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p3, second: *p3, third: *p3, fourth: *p3, fifth: *p3, sixth: *p3}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the vocabulary of the predictions.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson01.translate.002
    lesson_content_key: it.b1.unit48.lesson01.programma_fisso
    type: translation
    frame: {text: "I leave on Tuesday for Chicago with Sam.", language_code: en, direction: ltr}
    slots: {item: *p4}
    answer_derivation: {kind: render_frame, frame: {text: "Parto {item} per Chicago con Sam.", language_code: it, direction: ltr}, accepted_variants: ["Io parto {item} per Chicago con Sam.", "Parto per Chicago con Sam {item}."]}
    feedback_frame: {text: "Italian uses the present for a fixed plan.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson01.translate.003
    lesson_content_key: it.b1.unit48.lesson01.programma_fisso
    type: translation
    frame: {text: "I leave on Tuesday for Chicago with Sam.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Parto martedì per {item} con Sam.", language_code: it, direction: ltr}, accepted_variants: ["Martedì parto per {item} con Sam."]}
    feedback_frame: {text: "Partire per plus a place gives the destination.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson01.translate.004
    lesson_content_key: it.b1.unit48.lesson01.programma_fisso
    type: translation
    frame: {text: "I intend to stay two weeks in Chicago.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Ho {item} di restare due settimane a Chicago.", language_code: it, direction: ltr}, accepted_variants: ["Ho {item} di rimanere due settimane a Chicago."]}
    feedback_frame: {text: "Avere intenzione di is followed by the infinitive.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson01.translate.005
    lesson_content_key: it.b1.unit48.lesson01.programma_fisso
    type: translation
    frame: {text: "I intend to stay two weeks in Chicago.", language_code: en, direction: ltr}
    slots: {item: *p7}
    answer_derivation: {kind: render_frame, frame: {text: "Ho intenzione di restare due {item} a Chicago.", language_code: it, direction: ltr}, accepted_variants: ["Ho intenzione di rimanere due {item} a Chicago."]}
    feedback_frame: {text: "Settimane is the plural of settimana.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson01.translate.006
    lesson_content_key: it.b1.unit48.lesson01.programma_fisso
    type: translation
    frame: {text: "I have already bought the ticket for Chicago.", language_code: en, direction: ltr}
    slots: {item: *p8}
    answer_derivation: {kind: render_frame, frame: {text: "Ho già {item} il biglietto per Chicago.", language_code: it, direction: ltr}, accepted_variants: ["Il biglietto per Chicago l'ho già {item}."]}
    feedback_frame: {text: "Comprare takes avere: ho comprato.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson01.order.001
    lesson_content_key: it.b1.unit48.lesson01.programma_fisso
    type: word_order
    frame: {text: "Ho già comprato il {item} per Chicago.", language_code: it, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Ho già comprato il {item} per Chicago.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Biglietto is masculine: il biglietto.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson02.translate.001
    lesson_content_key: it.b1.unit48.lesson02.previsione_incerta
    type: translation
    frame: {text: "It is not certain, but I will probably return before August.", language_code: en, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Non è sicuro, ma {item} tornerò prima di agosto.", language_code: it, direction: ltr}, accepted_variants: ["Non è sicuro, ma tornerò {item} prima di agosto."]}
    feedback_frame: {text: "Probabilmente goes before the verb.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson02.translate.002
    lesson_content_key: it.b1.unit48.lesson02.previsione_incerta
    type: translation
    frame: {text: "It is not certain, but I will probably return before August.", language_code: en, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: render_frame, frame: {text: "Non è sicuro, ma probabilmente {item} prima di agosto.", language_code: it, direction: ltr}, accepted_variants: ["Non è sicuro, ma probabilmente io {item} prima di agosto."]}
    feedback_frame: {text: "The future expresses a prediction.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson02.fill.001
    lesson_content_key: it.b1.unit48.lesson02.previsione_incerta
    type: fill_in_blank
    frame: {text: "Non è sicuro, ma probabilmente tornerò prima di {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p12, hint: *p12}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Months are written without a capital.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson02.translate.003
    lesson_content_key: it.b1.unit48.lesson02.previsione_incerta
    type: translation
    frame: {text: "It is not certain, but maybe I will stay a month longer.", language_code: en, direction: ltr}
    slots: {item: *p13}
    answer_derivation: {kind: render_frame, frame: {text: "Non è sicuro, ma {item} resterò un mese in più.", language_code: it, direction: ltr}, accepted_variants: ["Non è sicuro, ma resterò {item} un mese in più."]}
    feedback_frame: {text: "Forse introduces a possibility.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson02.translate.004
    lesson_content_key: it.b1.unit48.lesson02.previsione_incerta
    type: translation
    frame: {text: "It is not certain, but maybe I will stay a month longer.", language_code: en, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "Non è sicuro, ma forse {item} un mese in più.", language_code: it, direction: ltr}, accepted_variants: ["Non è sicuro, ma forse rimarrò un mese in più."]}
    feedback_frame: {text: "Restare in the future io form is resterò.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson02.fill.002
    lesson_content_key: it.b1.unit48.lesson02.previsione_incerta
    type: fill_in_blank
    frame: {text: "Non è sicuro, ma forse resterò un {item} in più. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p15, hint: *p15}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mese is masculine: un mese.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit48.lesson02.order.001
    lesson_content_key: it.b1.unit48.lesson02.previsione_incerta
    type: word_order
    frame: {text: "Non è sicuro, ma forse resterò un mese in {item}.", language_code: it, direction: ltr}
    slots: {item: *p16}
    answer_derivation: {kind: render_frame, frame: {text: "Non è sicuro, ma forse resterò un mese in {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "In più means longer.", language_code: en, direction: ltr}
