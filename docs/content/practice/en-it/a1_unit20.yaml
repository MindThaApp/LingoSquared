schema_version: "1.0"
pack_key: practice.en-it.a1.unit20
source_language: en
target_language: it
unit_content_key: it.a1.unit20.weather
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u20* lesson tags, w_<token> anchors).
    Weather frames are the unit's own sentences. Caldo and freddo take 'fa' (oggi fa caldo); sole takes c'è il. Lesson 2 has one lexeme (restiamo), so its recognition pools borrow lesson 1 tokens.
    Reviewer check: tempo is glossed 'weather; time' and is used only in 'Che tempo fa oggi?'.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_caldo, w_freddo, w_piove, w_restiamo, w_sole, w_tempo]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: [adjective, verb, noun], agreement_tags: {semantic: [w_caldo, w_freddo, w_piove, w_sole, w_tempo]}}
  pool2: &pool2 {language_code: it, part_of_speech: [adjective, verb, noun], agreement_tags: {semantic: [w_caldo, w_freddo, w_piove, w_sole]}}
  pool3: &pool3 {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: [w_caldo, w_freddo]}}
  t_tempo: &t_tempo {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_tempo}}
  t_sole: &t_sole {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_sole}}
  t_piove: &t_piove {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_piove}}
  t_caldo: &t_caldo {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: w_caldo}}
  pool8: &pool8 {language_code: it, part_of_speech: [adjective, noun, verb], agreement_tags: {semantic: [w_caldo, w_freddo, w_sole, w_piove]}}
  pool9: &pool9 {language_code: it, part_of_speech: [verb, adjective], agreement_tags: {semantic: [w_restiamo, w_caldo, w_freddo, w_piove]}}
  pool10: &pool10 {language_code: it, part_of_speech: [verb, noun, adjective], agreement_tags: {semantic: [w_restiamo, w_piove, w_sole, w_freddo]}}
  t_restiamo: &t_restiamo {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_restiamo}}
templates:
  - content_key: practice.en-it.it.a1.unit20.lesson01.choose.001
    lesson_content_key: it.a1.unit20.lesson01.il_tempo_oggi
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Fa caldo and fa freddo describe the weather with fa.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson01.listen.002
    lesson_content_key: it.a1.unit20.lesson01.il_tempo_oggi
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Piove means it is raining and needs no subject.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson01.order.003
    lesson_content_key: it.a1.unit20.lesson01.il_tempo_oggi
    type: word_order
    frame: {text: "Oggi fa {item}.", language_code: it, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: render_frame, frame: {text: "Oggi fa {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Fa caldo means it is hot, and fa freddo means it is cold.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson01.order.004
    lesson_content_key: it.a1.unit20.lesson01.il_tempo_oggi
    type: word_order
    frame: {text: "Che {item} fa oggi?", language_code: it, direction: ltr}
    slots: {item: *t_tempo}
    answer_derivation: {kind: render_frame, frame: {text: "Che {item} fa oggi?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Che tempo fa? is the standard question about the weather.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson01.fill.005
    lesson_content_key: it.a1.unit20.lesson01.il_tempo_oggi
    type: fill_in_blank
    frame: {text: "Oggi c'è il {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_sole, hint: *t_sole}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "C'è il sole means it is sunny, literally there is the sun.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson01.fill.006
    lesson_content_key: it.a1.unit20.lesson01.il_tempo_oggi
    type: fill_in_blank
    frame: {text: "Oggi {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_piove, hint: *t_piove}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Piove is a verb with no subject: it rains.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson01.translate.007
    lesson_content_key: it.a1.unit20.lesson01.il_tempo_oggi
    type: translation
    frame: {text: "It is hot today.", language_code: en, direction: ltr}
    slots: {item: *t_caldo}
    answer_derivation: {kind: render_frame, frame: {text: "Oggi fa {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Italian uses fa for weather: oggi fa caldo.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson01.translate.008
    lesson_content_key: it.a1.unit20.lesson01.il_tempo_oggi
    type: translation
    frame: {text: "It is raining today.", language_code: en, direction: ltr}
    slots: {item: *t_piove}
    answer_derivation: {kind: render_frame, frame: {text: "Oggi {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Piove means it rains and has no subject.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson01.translate.009
    lesson_content_key: it.a1.unit20.lesson01.il_tempo_oggi
    type: translation
    frame: {text: "It is sunny today.", language_code: en, direction: ltr}
    slots: {item: *t_sole}
    answer_derivation: {kind: render_frame, frame: {text: "Oggi c'è il {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "C'è il sole is the usual way to say it is sunny.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson01.translate.010
    lesson_content_key: it.a1.unit20.lesson01.il_tempo_oggi
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Caldo and freddo are opposites.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson02.choose.001
    lesson_content_key: it.a1.unit20.lesson02.restiamo_a_casa
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool9}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Restiamo is the we form of restare: we stay.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson02.listen.002
    lesson_content_key: it.a1.unit20.lesson02.restiamo_a_casa
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool10}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Restiamo a casa means let's stay home.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson02.order.003
    lesson_content_key: it.a1.unit20.lesson02.restiamo_a_casa
    type: word_order
    frame: {text: "Oggi piove, {item} a casa.", language_code: it, direction: ltr}
    slots: {item: *t_restiamo}
    answer_derivation: {kind: render_frame, frame: {text: "Oggi piove, {item} a casa.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Restiamo is the we form, used to suggest staying in.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson02.fill.004
    lesson_content_key: it.a1.unit20.lesson02.restiamo_a_casa
    type: fill_in_blank
    frame: {text: "Piove, allora {item} a casa? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_restiamo, hint: *t_restiamo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Allora links the weather to the plan.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit20.lesson02.translate.005
    lesson_content_key: it.a1.unit20.lesson02.restiamo_a_casa
    type: translation
    frame: {text: "It's raining today, let's stay at home.", language_code: en, direction: ltr}
    slots: {item: *t_restiamo}
    answer_derivation: {kind: render_frame, frame: {text: "Oggi piove, {item} a casa.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Restiamo a casa means let's stay at home.", language_code: en, direction: ltr}
