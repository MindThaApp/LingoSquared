schema_version: "1.0"
pack_key: practice.en-it.b1.unit46
source_language: en
target_language: it
unit_content_key: it.b1.unit46.reclamo_serio
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-it B1 set) from scripts/backfill_lexemes_en_it.py (en-it-b1 course; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Serious complaint: da + duration with the present, gia + passato prossimo, vorrei che Lei + imperfect subjunctive. Variants accept a fronted duration and the formal pronoun in either case. NATIVE FLAG: Lei is glossed as the formal you; the pack never shows lei as an answer inside a sentence.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_da", "w_due", "w_funziona", "w_giorni", "w_già", "w_lei", "w_mandasse", "w_possibile", "w_riscaldamento", "w_stesso", "w_tecnico", "w_volte", "w_vorrei"]
slot_presets:
  p1: &p1 {language_code: it, part_of_speech: ["noun", "verb", "preposition", "adverb"], agreement_tags: {semantic: ["w_riscaldamento", "w_funziona", "w_da", "w_giorni", "w_già", "w_due", "w_volte"]}}
  p2: &p2 {language_code: it, part_of_speech: ["noun", "verb", "preposition", "adverb"], agreement_tags: {semantic: ["w_riscaldamento", "w_funziona", "w_da", "w_giorni", "w_già", "w_volte"]}}
  p3: &p3 {language_code: it, part_of_speech: ["verb", "pronoun", "noun", "adjective"], agreement_tags: {semantic: ["w_vorrei", "w_lei", "w_mandasse", "w_tecnico", "w_stesso", "w_possibile"]}}
  p4: &p4 {language_code: it, part_of_speech: ["noun", "verb", "adverb", "adjective"], agreement_tags: {semantic: ["w_riscaldamento", "w_funziona", "w_giorni", "w_già", "w_volte", "w_tecnico", "w_possibile"]}}
  p5: &p5 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_riscaldamento"]}}
  p6: &p6 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_giorni"]}}
  p7: &p7 {language_code: it, part_of_speech: ["preposition"], agreement_tags: {semantic: ["w_da"]}}
  p8: &p8 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_funziona"]}}
  p9: &p9 {language_code: it, part_of_speech: ["adverb"], agreement_tags: {semantic: ["w_già"]}}
  p10: &p10 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_volte"]}}
  p11: &p11 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_due"]}}
  p12: &p12 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_mandasse"]}}
  p13: &p13 {language_code: it, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_vorrei"]}}
  p14: &p14 {language_code: it, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_tecnico"]}}
  p15: &p15 {language_code: it, part_of_speech: ["adjective"], agreement_tags: {semantic: ["w_stesso"]}}
  p16: &p16 {language_code: it, part_of_speech: ["adjective"], agreement_tags: {semantic: ["w_possibile"]}}
templates:
  - content_key: practice.en-it.it.b1.unit46.lesson01.choose.001
    lesson_content_key: it.b1.unit46.lesson01.problema_riscaldamento
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the unit on making a complaint.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson01.listen.001
    lesson_content_key: it.b1.unit46.lesson01.problema_riscaldamento
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "The word you heard comes from the complaint unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson02.choose.001
    lesson_content_key: it.b1.unit46.lesson02.chiedere_soluzione
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *p3}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "These words come from the second lesson of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson01.translate.001
    lesson_content_key: it.b1.unit46.lesson01.problema_riscaldamento
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *p4}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "These are the key words of the unit.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson01.match.001
    lesson_content_key: it.b1.unit46.lesson01.problema_riscaldamento
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p1, second: *p1, third: *p1, fourth: *p1, fifth: *p1, sixth: *p1}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the complaint vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson02.match.001
    lesson_content_key: it.b1.unit46.lesson02.chiedere_soluzione
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *p3, second: *p3, third: *p3, fourth: *p3, fifth: *p3, sixth: *p3}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match the vocabulary of the request.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson01.translate.002
    lesson_content_key: it.b1.unit46.lesson01.problema_riscaldamento
    type: translation
    frame: {text: "The heating has not worked for three days.", language_code: en, direction: ltr}
    slots: {item: *p5}
    answer_derivation: {kind: render_frame, frame: {text: "Il {item} non funziona da tre giorni.", language_code: it, direction: ltr}, accepted_variants: ["Da tre giorni il {item} non funziona."]}
    feedback_frame: {text: "Italian uses the present with da for something that is still true.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson01.translate.003
    lesson_content_key: it.b1.unit46.lesson01.problema_riscaldamento
    type: translation
    frame: {text: "The heating has not worked for three days.", language_code: en, direction: ltr}
    slots: {item: *p6}
    answer_derivation: {kind: render_frame, frame: {text: "Il riscaldamento non funziona da tre {item}.", language_code: it, direction: ltr}, accepted_variants: ["Da tre {item} il riscaldamento non funziona."]}
    feedback_frame: {text: "Giorni is the plural of giorno.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson01.fill.001
    lesson_content_key: it.b1.unit46.lesson01.problema_riscaldamento
    type: fill_in_blank
    frame: {text: "Il riscaldamento non funziona {item} tre giorni. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p7, hint: *p7}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Da plus a duration means for.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson01.fill.002
    lesson_content_key: it.b1.unit46.lesson01.problema_riscaldamento
    type: fill_in_blank
    frame: {text: "Il riscaldamento non {item} da tre giorni. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p8, hint: *p8}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Funziona agrees with il riscaldamento.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson01.translate.004
    lesson_content_key: it.b1.unit46.lesson01.problema_riscaldamento
    type: translation
    frame: {text: "I have already called twice this week.", language_code: en, direction: ltr}
    slots: {item: *p9}
    answer_derivation: {kind: render_frame, frame: {text: "Ho {item} chiamato due volte questa settimana.", language_code: it, direction: ltr}, accepted_variants: ["Ho chiamato {item} due volte questa settimana."]}
    feedback_frame: {text: "Già comes between ho and the participle.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson01.translate.005
    lesson_content_key: it.b1.unit46.lesson01.problema_riscaldamento
    type: translation
    frame: {text: "I have already called twice this week.", language_code: en, direction: ltr}
    slots: {item: *p10}
    answer_derivation: {kind: render_frame, frame: {text: "Ho già chiamato due {item} questa settimana.", language_code: it, direction: ltr}, accepted_variants: ["Questa settimana ho già chiamato due {item}."]}
    feedback_frame: {text: "Volte is the plural of volta.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson01.order.001
    lesson_content_key: it.b1.unit46.lesson01.problema_riscaldamento
    type: word_order
    frame: {text: "Ho già chiamato {item} volte questa settimana.", language_code: it, direction: ltr}
    slots: {item: *p11}
    answer_derivation: {kind: render_frame, frame: {text: "Ho già chiamato {item} volte questa settimana.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Due is the number two.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson02.translate.001
    lesson_content_key: it.b1.unit46.lesson02.chiedere_soluzione
    type: translation
    frame: {text: "I would like you to send a technician today. (formal)", language_code: en, direction: ltr}
    slots: {item: *p12}
    answer_derivation: {kind: render_frame, frame: {text: "Vorrei che Lei {item} un tecnico oggi.", language_code: it, direction: ltr}, accepted_variants: ["Vorrei che lei {item} un tecnico oggi.", "Oggi vorrei che Lei {item} un tecnico."]}
    feedback_frame: {text: "After vorrei che, the imperfect subjunctive follows: mandasse.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson02.fill.001
    lesson_content_key: it.b1.unit46.lesson02.chiedere_soluzione
    type: fill_in_blank
    frame: {text: "{item} che Lei mandasse un tecnico oggi. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p13, hint: *p13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Vorrei is the polite way to ask.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson02.order.001
    lesson_content_key: it.b1.unit46.lesson02.chiedere_soluzione
    type: word_order
    frame: {text: "Vorrei che Lei mandasse un {item} oggi.", language_code: it, direction: ltr}
    slots: {item: *p14}
    answer_derivation: {kind: render_frame, frame: {text: "Vorrei che Lei mandasse un {item} oggi.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Tecnico is masculine: un tecnico.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson02.translate.002
    lesson_content_key: it.b1.unit46.lesson02.chiedere_soluzione
    type: translation
    frame: {text: "I need a solution today, if possible.", language_code: en, direction: ltr}
    slots: {item: *p15}
    answer_derivation: {kind: render_frame, frame: {text: "Ho bisogno di una soluzione oggi {item}, se possibile.", language_code: it, direction: ltr}, accepted_variants: ["Se possibile, ho bisogno di una soluzione oggi {item}."]}
    feedback_frame: {text: "Oggi stesso means today itself.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.b1.unit46.lesson02.fill.002
    lesson_content_key: it.b1.unit46.lesson02.chiedere_soluzione
    type: fill_in_blank
    frame: {text: "Ho bisogno di una soluzione oggi stesso, se {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *p16, hint: *p16}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Se possibile means if possible.", language_code: en, direction: ltr}
