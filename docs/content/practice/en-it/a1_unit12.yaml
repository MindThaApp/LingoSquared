schema_version: "1.0"
pack_key: practice.en-it.a1.unit12
source_language: en
target_language: it
unit_content_key: it.a1.unit12.plans
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u12* lesson tags, w_<token> anchors).
    Plans use earlier-unit time words (alle otto, domani) as literal text. se (if) and non (not) are glossed as single words; the se-frame starts with 'Allora,' so no slot is sentence-initial.
    Reviewer check: allora and poi are separate units; allora is glossed 'then; so'.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_allora, w_andiamo, w_cinema, w_davanti, w_non, w_se, w_stasera]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: [adverb, verb, noun], agreement_tags: {semantic: [w_stasera, w_andiamo, w_cinema]}}
  t_cinema: &t_cinema {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_cinema}}
  t_stasera: &t_stasera {language_code: it, part_of_speech: adverb, agreement_tags: {semantic: w_stasera}}
  t_andiamo: &t_andiamo {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_andiamo}}
  pool5: &pool5 {language_code: it, part_of_speech: [preposition, adverb, noun], agreement_tags: {semantic: [w_davanti, w_allora, w_stasera, w_cinema]}}
  pool6: &pool6 {language_code: it, part_of_speech: [preposition, adverb, particle], agreement_tags: {semantic: [w_davanti, w_allora, w_se, w_non, w_stasera]}}
  t_davanti: &t_davanti {language_code: it, part_of_speech: preposition, agreement_tags: {semantic: w_davanti}}
  t_allora: &t_allora {language_code: it, part_of_speech: adverb, agreement_tags: {semantic: w_allora}}
  pool9: &pool9 {language_code: it, part_of_speech: [particle, verb, adverb], agreement_tags: {semantic: [w_se, w_non, w_andiamo, w_allora]}}
  t_se: &t_se {language_code: it, part_of_speech: particle, agreement_tags: {semantic: w_se}}
  t_non: &t_non {language_code: it, part_of_speech: particle, agreement_tags: {semantic: w_non}}
  pool12: &pool12 {language_code: it, part_of_speech: [adverb, verb, noun, preposition, particle], agreement_tags: {semantic: [w_stasera, w_andiamo, w_cinema, w_davanti, w_allora, w_se, w_non]}}
  pool13: &pool13 {language_code: it, part_of_speech: [adverb, noun, preposition, particle], agreement_tags: {semantic: [w_stasera, w_cinema, w_davanti, w_allora, w_se, w_non]}}
templates:
  - content_key: practice.en-it.it.a1.unit12.lesson01.choose.001
    lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Stasera means this evening; it comes from questa sera.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson01.listen.002
    lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Andiamo is the we form of andare, used for suggestions: let's go.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson01.order.003
    lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
    type: word_order
    frame: {text: "Andiamo al {item} stasera?", language_code: it, direction: ltr}
    slots: {item: *t_cinema}
    answer_derivation: {kind: render_frame, frame: {text: "Andiamo al {item} stasera?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Al is a plus il: al cinema means to the cinema.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson01.fill.004
    lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
    type: fill_in_blank
    frame: {text: "Andiamo al cinema {item}? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_stasera, hint: *t_stasera}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Stasera means tonight and goes at the end of the question.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson01.fill.005
    lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
    type: fill_in_blank
    frame: {text: "Va bene, {item}! ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_andiamo, hint: *t_andiamo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Andiamo replies to a suggestion: let's go.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson01.translate.006
    lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
    type: translation
    frame: {text: "Shall we go to the cinema tonight?", language_code: en, direction: ltr}
    slots: {item: *t_cinema}
    answer_derivation: {kind: render_frame, frame: {text: "Andiamo al {item} stasera?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Andiamo with a rising tone makes a suggestion.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson01.translate.007
    lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
    type: translation
    frame: {text: "Okay, let's go!", language_code: en, direction: ltr}
    slots: {item: *t_andiamo}
    answer_derivation: {kind: render_frame, frame: {text: "Va bene, {item}!", language_code: it, direction: ltr}}
    feedback_frame: {text: "Va bene, andiamo! accepts a proposal.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson02.choose.001
    lesson_content_key: it.a1.unit12.lesson02.a_che_ora_ci_vediamo
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool5}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Davanti al cinema means in front of the cinema.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson03.listen.001
    lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool6}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Allora can mean then or so.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson02.order.002
    lesson_content_key: it.a1.unit12.lesson02.a_che_ora_ci_vediamo
    type: word_order
    frame: {text: "Ci vediamo alle otto, {item} al cinema.", language_code: it, direction: ltr}
    slots: {item: *t_davanti}
    answer_derivation: {kind: render_frame, frame: {text: "Ci vediamo alle otto, {item} al cinema.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Davanti al plus a place means in front of it.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson02.fill.003
    lesson_content_key: it.a1.unit12.lesson02.a_che_ora_ci_vediamo
    type: fill_in_blank
    frame: {text: "Perfetto, a stasera {item}! ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_allora, hint: *t_allora}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "A stasera allora means see you tonight, then.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson02.translate.004
    lesson_content_key: it.a1.unit12.lesson02.a_che_ora_ci_vediamo
    type: translation
    frame: {text: "Let's meet at eight, in front of the cinema.", language_code: en, direction: ltr}
    slots: {item: *t_davanti}
    answer_derivation: {kind: render_frame, frame: {text: "Ci vediamo alle otto, {item} al cinema.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Ci vediamo alle plus a time fixes a meeting.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson03.choose.002
    lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool9}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Se means if and non means not.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson03.fill.003
    lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
    type: fill_in_blank
    frame: {text: "Allora, {item} stasera non va bene, andiamo domani. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_se, hint: *t_se}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Se starts a condition: if tonight does not work.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson03.fill.004
    lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
    type: fill_in_blank
    frame: {text: "Se stasera {item} va bene, andiamo domani. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_non, hint: *t_non}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Non goes before the verb to make it negative.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson03.translate.005
    lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
    type: translation
    frame: {text: "If tonight doesn't work, let's go tomorrow.", language_code: en, direction: ltr}
    slots: {item: *t_non}
    answer_derivation: {kind: render_frame, frame: {text: "Se stasera {item} va bene, andiamo domani.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Non va bene means it doesn't work, literally it isn't okay.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson03.match.006
    lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *pool12, second: *pool12, third: *pool12, fourth: *pool12, fifth: *pool12, sixth: *pool12}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Se is if, non is not, allora is then.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit12.lesson03.translate.007
    lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Se, non and allora are small words used in plans.", language_code: en, direction: ltr}
