schema_version: "1.0"
pack_key: practice.en-it.a1.unit05
source_language: en
target_language: it
unit_content_key: it.a1.unit05.ask_tell_time
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u05* lesson tags, w_<token> anchors).
    Hour frames use a curated list of earlier-unit numerals (no uno/zero/sei so the frame is always grammatical: 'Sono le tre'); l'una takes è and is covered in recognition only.
    Reviewer check: 'Che ore sono?' is the only question form taught; 'Che ora è?' (also correct Italian) is not used as an accepted translation prompt.
    Opus pass: no changes. NATIVE FLAG: 'It's three thirty' / 'We'll meet at three thirty' grade only 'e mezzo'; the common 'e mezza' should probably be accepted too.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_alle, w_cinque, w_dieci, w_dodici, w_due, w_l'una, w_le, w_mattina, w_meno, w_mezzo, w_nove, w_ora, w_ore, w_otto, w_quarto, w_quattro, w_sera, w_sette, w_tre]
slot_presets:
  l1_core: &l1_core {language_code: it, part_of_speech: [noun, particle], agreement_tags: {semantic: [w_ore, w_le, w_l'una, w_dodici]}}
  hours: &hours {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_due, w_tre, w_quattro, w_cinque, w_sette, w_otto, w_nove, w_dieci, w_dodici]}}
  ore: &ore {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_ore}}
  le: &le {language_code: it, part_of_speech: particle, agreement_tags: {semantic: w_le}}
  l2_core: &l2_core {language_code: it, part_of_speech: [noun, adverb], agreement_tags: {semantic: [w_mezzo, w_quarto, w_meno]}}
  quarto: &quarto {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_quarto}}
  mezzo: &mezzo {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_mezzo}}
  l3_core: &l3_core {language_code: it, part_of_speech: [noun, preposition], agreement_tags: {semantic: [w_ora, w_alle, w_mattina, w_sera]}}
  ora: &ora {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_ora}}
  alle: &alle {language_code: it, part_of_speech: preposition, agreement_tags: {semantic: w_alle}}
  pairs: &pairs {language_code: it, part_of_speech: [noun, adverb], agreement_tags: {semantic: [w_l'una, w_dodici, w_mezzo, w_quarto, w_ora, w_mattina, w_sera, w_meno]}}
  words: &words {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_l'una, w_dodici, w_mezzo, w_quarto, w_ora, w_mattina, w_sera]}}
templates:
  - content_key: practice.en-it.it.a1.unit05.lesson01.choose.001
    lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l1_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Time uses the feminine plural le because ore, hours, is feminine plural: sono le tre.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson01.listen.002
    lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l1_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "One o'clock is the exception: l'una is singular, so it takes è, not sono.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson01.order.003
    lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
    type: word_order
    frame: {text: "Che {item} sono?", language_code: it, direction: ltr}
    slots: {item: *ore}
    answer_derivation: {kind: render_frame, frame: {text: "Che {item} sono?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Che ore sono? literally asks what hours are they, which is why the answer starts with sono le.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson01.fill.004
    lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
    type: fill_in_blank
    frame: {text: "Sono {item} tre. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *le, hint: *le}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Le agrees with ore, which is understood: sono le tre means it is three o'clock.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson01.translate.005
    lesson_content_key: it.a1.unit05.lesson01.chiedere_lora
    type: translation
    frame: {text: "It's {n} o'clock.", language_code: en, direction: ltr, slot_rendering: {n: english_gloss}}
    slots: {n: *hours}
    answer_derivation: {kind: render_frame, frame: {text: "Sono le {n}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Sono le is used for every hour except one o'clock, which is l'una.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson02.choose.001
    lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l2_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "E adds minutes and meno subtracts them: le tre e mezzo is 3:30, le quattro meno un quarto is 3:45.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson02.listen.002
    lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l2_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Mezzo has a double z; hold the sound slightly longer.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson02.order.003
    lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
    type: word_order
    frame: {text: "Sono le tre e un {item}.", language_code: it, direction: ltr}
    slots: {item: *quarto}
    answer_derivation: {kind: render_frame, frame: {text: "Sono le tre e un {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "E un quarto adds fifteen minutes: le tre e un quarto is 3:15.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson02.fill.004
    lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
    type: fill_in_blank
    frame: {text: "Sono le tre e {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *mezzo, hint: *mezzo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mezzo means half, so e mezzo adds thirty minutes.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson02.match.005
    lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *pairs, second: *pairs, third: *pairs, fourth: *pairs, fifth: *pairs, sixth: *pairs}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Mezzo is half and quarto is quarter; the hour comes first, then e or meno.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson02.translate.006
    lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
    type: translation
    frame: {text: "It's a quarter to four.", language_code: en, direction: ltr}
    slots: {item: *quarto}
    answer_derivation: {kind: render_frame, frame: {text: "Sono le quattro meno un {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Meno subtracts from the next hour: le quattro meno un quarto is 3:45.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson02.translate.007
    lesson_content_key: it.a1.unit05.lesson02.i_quarti_dora
    type: translation
    frame: {text: "It's three thirty.", language_code: en, direction: ltr}
    slots: {item: *mezzo}
    answer_derivation: {kind: render_frame, frame: {text: "Sono le tre e {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "E mezzo, and half, is the everyday way to say half past the hour.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson03.choose.001
    lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l3_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Alle means at the (feminine plural) and is used for clock times: alle tre, at three.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson03.listen.002
    lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l3_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ora is hour or time; ore is its plural, which is why the question is Che ore sono?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson03.order.003
    lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
    type: word_order
    frame: {text: "A che {item} ci vediamo?", language_code: it, direction: ltr}
    slots: {item: *ora}
    answer_derivation: {kind: render_frame, frame: {text: "A che {item} ci vediamo?", language_code: it, direction: ltr}}
    feedback_frame: {text: "A che ora asks at what time; ora is singular here because it asks for one moment.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson03.fill.004
    lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
    type: fill_in_blank
    frame: {text: "Ci vediamo {item} tre e mezzo. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *alle, hint: *alle}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Alle is used with every hour except one o'clock, where you say all'una.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson03.translate.005
    lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
    type: translation
    frame: {text: "We'll meet at three thirty.", language_code: en, direction: ltr}
    slots: {item: *alle}
    answer_derivation: {kind: render_frame, frame: {text: "Ci vediamo {item} tre e mezzo.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Ci vediamo alle plus a time is the standard way to fix a meeting.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit05.lesson03.translate.006
    lesson_content_key: it.a1.unit05.lesson03.fissare_un_orario
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mattina and sera are the morning and the evening; Italian puts di before them: di mattina, di sera.", language_code: en, direction: ltr}
