schema_version: '1.0'
pack_key: practice.en-it.c1.unit02
source_language: en
target_language: it
unit_content_key: it.c1.unit02.ironia
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-it backfill lexemes (tags it_c1_u2 / w_<token>). 17 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_abbiamo, w_contesto, w_corretta, w_così, w_davvero, w_facile, w_indizio, w_intenzione, w_ironia, w_male, w_naturalmente, w_osservazione, w_progetto, w_rilassante, w_rispondere, w_sottinteso, w_vita]
templates:
- content_key: practice.en-it.it.c1.unit02.lesson01.choose.001
  lesson_content_key: it.c1.unit02.lesson01.riconoscere_sottinteso
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: &id001
      language_code: it
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_male, w_sottinteso, w_ironia, w_contesto, w_intenzione, w_indizio, w_naturalmente, w_abbiamo, w_vita, w_così, w_rilassante, w_rispondere, w_osservazione, w_corretta, w_progetto, w_davvero, w_facile]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on recognizing understatement.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.c1.unit02.lesson02.listen.001
  lesson_content_key: it.c1.unit02.lesson02.contesto_ironia
  type: listen_select
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on irony and context.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.c1.unit02.lesson03.translate.001
  lesson_content_key: it.c1.unit02.lesson03.intenzione_letterale
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on intention beyond the literal.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.c1.unit02.lesson04.match.001
  lesson_content_key: it.c1.unit02.lesson04.ascolto_implicito
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: it, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Italian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-it.it.c1.unit02.lesson05.choose.001
