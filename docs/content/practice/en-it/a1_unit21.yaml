schema_version: "1.0"
pack_key: practice.en-it.a1.unit21
source_language: en
target_language: it
unit_content_key: it.a1.unit21.clothing
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u21* lesson tags, w_<token> anchors).
    Clothes frames agree in gender and number: la takes maglietta and giacca, i takes pantaloni, le takes scarpe; each is its own single or curated slot. Size words (piccola, media, grande) are feminine because taglia is feminine. Blu is invariable.
    Reviewer check: none; 'per Elena' asserts no character fact.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_blu, w_giacca, w_grande, w_maglietta, w_media, w_pantaloni, w_piccola, w_scarpe, w_taglia]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: [noun, adjective], agreement_tags: {semantic: [w_maglietta, w_pantaloni, w_scarpe, w_giacca, w_blu]}}
  pool2: &pool2 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_maglietta, w_pantaloni, w_scarpe, w_giacca]}}
  pool3: &pool3 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_maglietta, w_giacca]}}
  t_pantaloni: &t_pantaloni {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_pantaloni}}
  t_blu: &t_blu {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: w_blu}}
  t_scarpe: &t_scarpe {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_scarpe}}
  pool7: &pool7 {language_code: it, part_of_speech: [noun, adjective], agreement_tags: {semantic: [w_taglia, w_piccola, w_media, w_grande]}}
  pool8: &pool8 {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: [w_piccola, w_media, w_grande]}}
  t_media: &t_media {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: w_media}}
  t_taglia: &t_taglia {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_taglia}}
  t_piccola: &t_piccola {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: w_piccola}}
  pool12: &pool12 {language_code: it, part_of_speech: [noun, adjective], agreement_tags: {semantic: [w_maglietta, w_pantaloni, w_scarpe, w_giacca, w_taglia, w_piccola, w_media]}}
templates:
  - content_key: practice.en-it.it.a1.unit21.lesson01.choose.001
    lesson_content_key: it.a1.unit21.lesson01.i_vestiti
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pantaloni and scarpe are plural; maglietta and giacca are singular.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson01.listen.002
    lesson_content_key: it.a1.unit21.lesson01.i_vestiti
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "I pantaloni and le scarpe are plural clothes.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson01.order.003
    lesson_content_key: it.a1.unit21.lesson01.i_vestiti
    type: word_order
    frame: {text: "La {item} è blu.", language_code: it, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: render_frame, frame: {text: "La {item} è blu.", language_code: it, direction: ltr}}
    feedback_frame: {text: "La goes with feminine singular nouns such as maglietta and giacca.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson01.order.004
    lesson_content_key: it.a1.unit21.lesson01.i_vestiti
    type: word_order
    frame: {text: "I {item} sono per Elena.", language_code: it, direction: ltr}
    slots: {item: *t_pantaloni}
    answer_derivation: {kind: render_frame, frame: {text: "I {item} sono per Elena.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Pantaloni is plural and masculine, so use i and sono.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson01.fill.005
    lesson_content_key: it.a1.unit21.lesson01.i_vestiti
    type: fill_in_blank
    frame: {text: "La maglietta è {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_blu, hint: *t_blu}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Blu does not change for gender or number.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson01.translate.006
    lesson_content_key: it.a1.unit21.lesson01.i_vestiti
    type: translation
    frame: {text: "The T-shirt is blue.", language_code: en, direction: ltr}
    slots: {item: *t_blu}
    answer_derivation: {kind: render_frame, frame: {text: "La maglietta è {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Blu stays the same with masculine, feminine and plural nouns.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson01.translate.007
    lesson_content_key: it.a1.unit21.lesson01.i_vestiti
    type: translation
    frame: {text: "The shoes are blue.", language_code: en, direction: ltr}
    slots: {item: *t_scarpe}
    answer_derivation: {kind: render_frame, frame: {text: "Le {item} sono blu.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Scarpe is feminine plural, so it takes le and sono.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson01.translate.008
    lesson_content_key: it.a1.unit21.lesson01.i_vestiti
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "La maglietta and la giacca are singular; i pantaloni and le scarpe are plural.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson02.choose.001
    lesson_content_key: it.a1.unit21.lesson02.taglia_media
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool7}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Piccola, media and grande describe the size of a taglia.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson02.order.002
    lesson_content_key: it.a1.unit21.lesson02.taglia_media
    type: word_order
    frame: {text: "Vorrei una taglia {item}.", language_code: it, direction: ltr}
    slots: {item: *pool8}
    answer_derivation: {kind: render_frame, frame: {text: "Vorrei una taglia {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Taglia is feminine, so the size word ends in -a or -e.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson02.fill.003
    lesson_content_key: it.a1.unit21.lesson02.taglia_media
    type: fill_in_blank
    frame: {text: "Vorrei una taglia {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_media, hint: *t_media}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Media is the feminine form of medio, matching taglia.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson02.translate.004
    lesson_content_key: it.a1.unit21.lesson02.taglia_media
    type: translation
    frame: {text: "I would like a blue T-shirt, size medium.", language_code: en, direction: ltr}
    slots: {item: *t_taglia}
    answer_derivation: {kind: render_frame, frame: {text: "Vorrei una maglietta blu, {item} media.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Taglia names the size and is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson02.translate.005
    lesson_content_key: it.a1.unit21.lesson02.taglia_media
    type: translation
    frame: {text: "I would like a small size.", language_code: en, direction: ltr}
    slots: {item: *t_piccola}
    answer_derivation: {kind: render_frame, frame: {text: "Vorrei una taglia {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Piccola agrees with the feminine taglia.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit21.lesson02.match.006
    lesson_content_key: it.a1.unit21.lesson02.taglia_media
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *pool12, second: *pool12, third: *pool12, fourth: *pool12, fifth: *pool12, sixth: *pool12}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Piccola and media are sizes; the other words are clothes.", language_code: en, direction: ltr}
