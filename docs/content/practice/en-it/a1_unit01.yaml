schema_version: "1.0"
pack_key: practice.en-it.a1.unit01
source_language: en
target_language: it
unit_content_key: it.a1.unit01.greetings_and_introductions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u01* lesson tags, w_<token> anchors).
    Informal tu questions use stai/ti chiami; formal Lei forms appear only in glosses and feedback and are labelled (formal). Names Elena and Sam used only in the self-introduction frame (canon-neutral).
    Reviewer check: lei is the folded lexeme for formal Lei (translation answer is lowercase 'lei'); ciao is glossed hi; bye.
    Opus pass: corrected the -ale/-ivo cognate claim in a matching feedback line.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_Elena, w_Sam, w_arrivederla, w_bene, w_benvenuto, w_buonanotte, w_buonasera, w_buongiorno, w_chiami, w_chiamo, w_ciao, w_come, w_conoscerla, w_domani, w_formale, w_grazie, w_informale, w_lei, w_mille, w_piacere, w_rispettoso, w_scusi, w_sta, w_stai, w_tu, w_ufficio, w_vediamo]
slot_presets:
  l1_core: &l1_core {language_code: it, part_of_speech: [pronoun, adjective, phrase], agreement_tags: {semantic: [w_ciao, w_buongiorno, w_tu, w_lei, w_informale, w_formale]}}
  l1_hear: &l1_hear {language_code: it, part_of_speech: [pronoun, verb, phrase], agreement_tags: {semantic: [w_ciao, w_buongiorno, w_stai, w_sta, w_tu, w_lei]}}
  l1_pairs: &l1_pairs {language_code: it, part_of_speech: [pronoun, adjective, particle, phrase], agreement_tags: {semantic: [w_ciao, w_buongiorno, w_tu, w_lei, w_informale, w_formale, w_rispettoso, w_come]}}
  l1_words: &l1_words {language_code: it, part_of_speech: [pronoun, adjective, phrase], agreement_tags: {semantic: [w_ciao, w_buongiorno, w_tu, w_lei, w_informale, w_formale, w_rispettoso]}}
  stai: &stai {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_stai}}
  l2_core: &l2_core {language_code: it, part_of_speech: [adverb, phrase], agreement_tags: {semantic: [w_bene, w_grazie, w_buonasera, w_buonanotte, w_arrivederla, w_domani]}}
  vediamo: &vediamo {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_vediamo}}
  domani: &domani {language_code: it, part_of_speech: adverb, agreement_tags: {semantic: w_domani}}
  l3_core: &l3_core {language_code: it, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [w_scusi, w_benvenuto, w_ufficio, w_mille, w_chiamo, w_chiami]}}
  l3_hear: &l3_hear {language_code: it, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [w_scusi, w_benvenuto, w_ufficio, w_chiamo, w_chiami, w_conoscerla]}}
  l3_pairs: &l3_pairs {language_code: it, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [w_scusi, w_benvenuto, w_ufficio, w_mille, w_chiamo, w_chiami, w_conoscerla, w_piacere]}}
  l3_words: &l3_words {language_code: it, part_of_speech: [noun, verb, adjective], agreement_tags: {semantic: [w_scusi, w_benvenuto, w_ufficio, w_mille, w_chiamo, w_chiami, w_conoscerla, w_piacere]}}
  names: &names {language_code: it, part_of_speech: proper_noun, agreement_tags: {semantic: [w_Elena, w_Sam]}}
  chiami: &chiami {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_chiami}}
  elena: &elena {language_code: it, part_of_speech: proper_noun, agreement_tags: {semantic: w_Elena}}
templates:
  - content_key: practice.en-it.it.a1.unit01.lesson01.choose.001
    lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l1_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Tu is for friends, family and peers; Lei, with a capital L, is the polite form for strangers, older people and professional settings.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson01.listen.002
    lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l1_hear}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ciao works for both hello and goodbye, while buongiorno is a polite daytime hello.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson01.order.003
    lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
    type: word_order
    frame: {text: "Ciao, come {item}?", language_code: it, direction: ltr}
    slots: {item: *stai}
    answer_derivation: {kind: render_frame, frame: {text: "Ciao, come {item}?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Come stai? asks a friend how they are; to a stranger you would say Come sta?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson01.match.004
    lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *l1_pairs, second: *l1_pairs, third: *l1_pairs, fourth: *l1_pairs, fifth: *l1_pairs, sixth: *l1_pairs}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Many Italian adjectives in -ale match English ones in -al: informale is informal, formale is formal.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson01.translate.005
    lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l1_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Rispettoso goes with the formal Lei: it shows respect to people you do not know well.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson01.translate.006
    lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
    type: translation
    frame: {text: "Hi, how are you? (informal, to a friend)", language_code: en, direction: ltr}
    slots: {item: *stai}
    answer_derivation: {kind: render_frame, frame: {text: "Ciao, come {item}?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Stai is the tu form; the polite Lei form of the same question is Buongiorno, come sta?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson02.choose.001
    lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l2_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Arrivederla is the formal goodbye; the -la at the end refers to Lei. With friends, Italians say ciao.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson02.listen.002
    lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l2_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Buonasera is the evening greeting; buonanotte is only said when someone is going to bed.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson02.order.003
    lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
    type: word_order
    frame: {text: "Ciao, ci {item} domani!", language_code: it, direction: ltr}
    slots: {item: *vediamo}
    answer_derivation: {kind: render_frame, frame: {text: "Ciao, ci {item} domani!", language_code: it, direction: ltr}}
    feedback_frame: {text: "Ci vediamo literally means we see each other; it is the everyday way to say see you.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson02.fill.004
    lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
    type: fill_in_blank
    frame: {text: "Arrivederla, a {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *domani, hint: *domani}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "A domani means see you tomorrow; the a is part of the set phrase.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson02.translate.005
    lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l2_core}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Bene answers Come stai? and can also stand alone to mean fine or good.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson03.choose.001
    lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l3_core}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Scusi is the polite way to get a stranger's attention; it is the formal (Lei) form.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson03.listen.002
    lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *l3_hear}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Benvenuto is masculine; it becomes benvenuta when you welcome a woman.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson03.order.003
    lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
    type: word_order
    frame: {text: "Mi chiamo {item}.", language_code: it, direction: ltr}
    slots: {item: *names}
    answer_derivation: {kind: render_frame, frame: {text: "Mi chiamo {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Mi chiamo literally means I call myself; the name simply comes last.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson03.fill.004
    lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
    type: fill_in_blank
    frame: {text: "Come ti {item}? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *chiami, hint: *chiami}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ti is the informal you; with Lei the question becomes Come si chiama?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson03.match.005
    lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *l3_pairs, second: *l3_pairs, third: *l3_pairs, fourth: *l3_pairs, fifth: *l3_pairs, sixth: *l3_pairs}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Piacere is both the noun pleasure and the reply you give when meeting someone: nice to meet you.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson03.translate.006
    lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l3_words}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mille means thousand, so grazie mille is a warm thank you very much.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit01.lesson03.translate.007
    lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
    type: translation
    frame: {text: "My name is Elena.", language_code: en, direction: ltr}
    slots: {item: *elena}
    answer_derivation: {kind: render_frame, frame: {text: "Mi chiamo {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Italian says mi chiamo, I call myself, where English says my name is.", language_code: en, direction: ltr}
