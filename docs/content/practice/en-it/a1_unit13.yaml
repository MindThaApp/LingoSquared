schema_version: "1.0"
pack_key: practice.en-it.a1.unit13
source_language: en
target_language: it
unit_content_key: it.a1.unit13.past_events
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u13* lesson tags, w_<token> anchors).
    Lesson 3 (dialogo) has no first-sight tokens, so nothing is anchored there. andato/andata: prompts name the speaker's gender in English ('said by a man/woman'); the word_order pool lists both because both are natural in 'Sono ___ al cinema ieri'. Ho/hai/sono come from earlier units and stay literal.
    Reviewer check: 'bel' is glossed as before a masculine noun and only used with film.
    Opus pass: removed film (gloss identical to token) from the bare-word translation pool; matching feedback now notes that andare takes sono, not ho.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_andata, w_andato, w_bel, w_fatto, w_film, w_ieri, w_mangiato, w_pranzo, w_stamattina, w_visto]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: [adverb, verb, adjective, noun], agreement_tags: {semantic: [w_ieri, w_stamattina, w_andato, w_andata, w_visto, w_bel, w_film]}}
  pool2: &pool2 {language_code: it, part_of_speech: [adverb, verb, noun], agreement_tags: {semantic: [w_ieri, w_stamattina, w_andato, w_andata, w_visto, w_film]}}
  pool3: &pool3 {language_code: it, part_of_speech: verb, agreement_tags: {semantic: [w_andato, w_andata]}}
  t_visto: &t_visto {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_visto}}
  t_bel: &t_bel {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: w_bel}}
  t_film: &t_film {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_film}}
  t_andato: &t_andato {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_andato}}
  t_andata: &t_andata {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_andata}}
  pool9: &pool9 {language_code: it, part_of_speech: [adverb, verb, noun, adjective], agreement_tags: {semantic: [w_ieri, w_stamattina, w_visto, w_film, w_mangiato, w_pranzo, w_fatto, w_bel]}}
  pool10: &pool10 {language_code: it, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_mangiato, w_pranzo, w_fatto, w_visto, w_film]}}
  pool11: &pool11 {language_code: it, part_of_speech: [verb, noun], agreement_tags: {semantic: [w_mangiato, w_pranzo, w_fatto, w_film]}}
  t_mangiato: &t_mangiato {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_mangiato}}
  t_pranzo: &t_pranzo {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_pranzo}}
  t_fatto: &t_fatto {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_fatto}}
  pool15: &pool15 {language_code: it, part_of_speech: [adverb, noun], agreement_tags: {semantic: [w_ieri, w_stamattina, w_pranzo]}}
templates:
  - content_key: practice.en-it.it.a1.unit13.lesson01.choose.001
    lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Andato and andata are the masculine and feminine past forms of go.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson01.listen.002
    lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Andata is used by a woman, andato by a man.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson01.order.003
    lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
    type: word_order
    frame: {text: "Sono {item} al cinema ieri.", language_code: it, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: render_frame, frame: {text: "Sono {item} al cinema ieri.", language_code: it, direction: ltr}}
    feedback_frame: {text: "With sono, the past form agrees with the speaker: andato for a man, andata for a woman.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson01.fill.004
    lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
    type: fill_in_blank
    frame: {text: "Ho {item} un bel film! ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_visto, hint: *t_visto}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Visto is used with ho: ho visto, I saw.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson01.fill.005
    lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
    type: fill_in_blank
    frame: {text: "Ho visto un {item} film! ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_bel, hint: *t_bel}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Bel is the short form of bello before a masculine noun.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson01.order.006
    lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
    type: word_order
    frame: {text: "Ho visto un bel {item}!", language_code: it, direction: ltr}
    slots: {item: *t_film}
    answer_derivation: {kind: render_frame, frame: {text: "Ho visto un bel {item}!", language_code: it, direction: ltr}}
    feedback_frame: {text: "Film is masculine, so it takes un and bel.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson01.translate.007
    lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
    type: translation
    frame: {text: "I went to the cinema yesterday. (said by a man)", language_code: en, direction: ltr}
    slots: {item: *t_andato}
    answer_derivation: {kind: render_frame, frame: {text: "Sono {item} al cinema ieri.", language_code: it, direction: ltr}}
    feedback_frame: {text: "A man says sono andato, a woman sono andata.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson01.translate.008
    lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
    type: translation
    frame: {text: "I went to the cinema yesterday. (said by a woman)", language_code: en, direction: ltr}
    slots: {item: *t_andata}
    answer_derivation: {kind: render_frame, frame: {text: "Sono {item} al cinema ieri.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Andare uses sono, so the ending agrees with the speaker.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson01.translate.009
    lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
    type: translation
    frame: {text: "I saw a nice film!", language_code: en, direction: ltr}
    slots: {item: *t_film}
    answer_derivation: {kind: render_frame, frame: {text: "Ho visto un bel {item}!", language_code: it, direction: ltr}}
    feedback_frame: {text: "Vedere uses ho: ho visto, I saw.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson02.match.001
    lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *pool9, second: *pool9, third: *pool9, fourth: *pool9, fifth: *pool9, sixth: *pool9}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Many past forms use ho plus a participle: ho visto, ho mangiato, ho fatto; andare uses sono instead.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson02.choose.002
    lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool10}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Pranzo means lunch and is used with a: a pranzo.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson02.listen.003
    lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool11}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Ho mangiato means I ate; hai fatto means you did.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson02.fill.004
    lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
    type: fill_in_blank
    frame: {text: "Ho {item} un panino a pranzo. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_mangiato, hint: *t_mangiato}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Mangiato is the past form used after ho.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson02.fill.005
    lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
    type: fill_in_blank
    frame: {text: "Ho mangiato un panino a {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_pranzo, hint: *t_pranzo}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "A pranzo means for lunch, at lunchtime.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson02.order.006
    lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
    type: word_order
    frame: {text: "Cosa hai {item} ieri?", language_code: it, direction: ltr}
    slots: {item: *t_fatto}
    answer_derivation: {kind: render_frame, frame: {text: "Cosa hai {item} ieri?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Hai fatto means you did or you made.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson02.translate.007
    lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
    type: translation
    frame: {text: "I ate a sandwich for lunch.", language_code: en, direction: ltr}
    slots: {item: *t_pranzo}
    answer_derivation: {kind: render_frame, frame: {text: "Ho mangiato un panino a {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "A pranzo means at lunch.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson02.translate.008
    lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
    type: translation
    frame: {text: "What did you do yesterday? (informal, tu)", language_code: en, direction: ltr}
    slots: {item: *t_fatto}
    answer_derivation: {kind: render_frame, frame: {text: "Cosa hai {item} ieri?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Hai fatto is the informal tu form.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit13.lesson02.translate.009
    lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool15}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Ieri is yesterday and stamattina is this morning.", language_code: en, direction: ltr}
