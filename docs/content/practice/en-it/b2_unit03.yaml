    semantic: [w_abbastanza, w_alto, w_assolutamente, w_caro, w_cibo, w_conto, w_credere, w_davvero, w_delizioso, w_direi, w_eccome, w_estremamente, w_inizio, w_lento, w_nuovo, w_ottimo, w_parere, w_pena, w_pensare, w_piuttosto, w_problema, w_realtà, w_rende, w_rendere, w_ristorante, w_salva, w_sembra, w_sembrare, w_senso, w_servizio, w_speciale, w_vale]
templates:
- content_key: practice.en-it.it.b2.unit03.lesson01.choose.001
  lesson_content_key: it.b2.unit03.lesson01.attenuare
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: &id001
      language_code: it
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_ristorante, w_realtà, w_abbastanza, w_piuttosto, w_parere, w_senso, w_sembra, w_sembrare, w_direi, w_credere, w_lento, w_servizio, w_davvero, w_estremamente, w_assolutamente, w_delizioso, w_cibo, w_vale, w_pena, w_rende, w_rendere, w_speciale, w_ottimo, w_problema, w_eccome, w_nuovo, w_caro, w_inizio, w_salva, w_pensare, w_conto, w_alto]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on softening.', language_code: en, direction: ltr}
