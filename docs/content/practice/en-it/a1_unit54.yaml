schema_version: '1.0'
pack_key: practice.en-it.a1.unit54
source_language: en
target_language: it
unit_content_key: it.a1.unit54.colori
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-it backfill lexemes (tags it_a1_u54 / w_<token>). 17 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_arancione, w_belli, w_bellissimi, w_bianco, w_colore, w_comprano, w_fiori, w_giallo, w_mercato, w_rendono, w_rosa, w_rosso, w_scegli, w_tulipani, w_viola, w_vorrebbe, w_vuoi]
templates:
- content_key: practice.en-it.it.a1.unit54.lesson01.choose.001
  lesson_content_key: it.a1.unit54.lesson01.rosso_e_giallo
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: &id001
      language_code: it
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_tulipani, w_rosso, w_giallo, w_bianco, w_arancione, w_colore, w_rosa, w_scegli, w_vuoi, w_viola, w_mercato, w_fiori, w_vorrebbe, w_comprano, w_bellissimi, w_belli, w_rendono]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on red and yellow.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit54.lesson02.listen.001
  lesson_content_key: it.a1.unit54.lesson02.bianco_e_arancione
  type: listen_select
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on white and orange.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit54.lesson03.translate.001
  lesson_content_key: it.a1.unit54.lesson03.rosa_e_viola
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on pink and purple.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit54.lesson05.match.001
  lesson_content_key: it.a1.unit54.lesson05.nina_e_giulia_comprano
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: it, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Italian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
