schema_version: '1.0'
pack_key: practice.en-it.a1.unit45
source_language: en
target_language: it
unit_content_key: it.a1.unit45.trasporti
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-it backfill lexemes (tags it_a1_u45 / w_<token>). 15 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_abita, w_bicicletta, w_centro, w_compro, w_macchina, w_mezzi, w_preferisce, w_prenda, w_sportello, w_trasporti, w_vai, w_vanno, w_vengo, w_viaggia, w_viaggiare]
templates:
- content_key: practice.en-it.it.a1.unit45.lesson01.choose.001
  lesson_content_key: it.a1.unit45.lesson01.il_treno_la_bicicletta
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: &id001
      language_code: it
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_bicicletta, w_viaggia, w_macchina, w_viaggiare, w_vai, w_trasporti, w_compro, w_sportello, w_prenda, w_centro, w_mezzi, w_vanno, w_preferisce, w_abita, w_vengo]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the train, the bike, the car, and walking.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit45.lesson02.listen.001
  lesson_content_key: it.a1.unit45.lesson02.ognuno_viaggia_in_modo
  type: listen_select
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on everyone travels differently.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit45.lesson03.translate.001
  lesson_content_key: it.a1.unit45.lesson03.comprare_un_biglietto
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on buying a ticket.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit45.lesson04.match.001
  lesson_content_key: it.a1.unit45.lesson04.chiara_chiede_a_marco
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: it, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Italian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit45.lesson05.choose.001
  lesson_content_key: it.a1.unit45.lesson05.chi_viaggia_come
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on who travels how?.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit45.lesson06.translate.001
  lesson_content_key: it.a1.unit45.lesson06.andiamo_insieme_in_bicicletta
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on shall we cycle together?.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.a1.unit45.lesson01.order.002
  lesson_content_key: it.a1.unit45.lesson01.il_treno_la_bicicletta
  type: word_order
  frame: {text: 'Marco va al lavoro in {item}.', language_code: it, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags: {semantic: w_bicicletta}
