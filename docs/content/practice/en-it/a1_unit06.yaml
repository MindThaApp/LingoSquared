schema_version: "1.0"
pack_key: practice.en-it.a1.unit06
source_language: en
target_language: it
unit_content_key: it.a1.unit06.family_relationships
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u06* lesson tags, w_<token> anchors).
    Family-noun pools are curated w_ lists of this unit's own tokens. 'Questo è mio {padre/fratello/nonno}' lists only masculine nouns so mio agrees. 'Hai fratelli o sorelle?' prompts say informal (tu). Character facts are not asserted.
    Reviewer check: 'siblings' in the gloss of fratelli is a secondary sense; no frame depends on it.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_femmina, w_figli, w_figlia, w_figlio, w_fratelli, w_fratello, w_madre, w_marito, w_maschio, w_mia, w_moglie, w_nonna, w_nonno, w_padre, w_questa, w_questo, w_sorella, w_sorelle, "w_sì", w_una]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: [noun, pronoun], agreement_tags: {semantic: [w_madre, w_padre, w_fratello, w_sorella, w_nonno, w_nonna, w_questo, w_questa, w_mia]}}
  pool2: &pool2 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_madre, w_padre, w_fratello, w_sorella, w_nonno, w_nonna]}}
  pool3: &pool3 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_padre, w_fratello, w_nonno]}}
  t_madre: &t_madre {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_madre}}
  pool5: &pool5 {language_code: it, part_of_speech: [noun, particle], agreement_tags: {semantic: [w_fratelli, w_sorelle, w_una, w_marito, w_moglie]}}
  pool6: &pool6 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_fratelli, w_sorelle, w_marito, w_moglie]}}
  t_sorella: &t_sorella {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_sorella}}
  t_sorelle: &t_sorelle {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_sorelle}}
  pool9: &pool9 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_marito, w_moglie, w_fratelli, w_sorelle, w_figlio, w_figlia, w_figli]}}
  pool10: &pool10 {language_code: it, part_of_speech: [noun, adverb], agreement_tags: {semantic: [w_figli, "w_sì", w_maschio, w_femmina, w_figlio, w_figlia]}}
  pool11: &pool11 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_figli, w_maschio, w_femmina, w_figlio, w_figlia]}}
  t_figli: &t_figli {language_code: it, part_of_speech: noun, agreement_tags: {semantic: w_figli}}
  pool13: &pool13 {language_code: it, part_of_speech: noun, agreement_tags: {semantic: [w_figlio, w_figlia, w_maschio, w_femmina]}}
templates:
  - content_key: practice.en-it.it.a1.unit06.lesson01.choose.001
    lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "With a possessive, singular family nouns drop the article: mio padre, mia madre.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson01.listen.002
    lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Padre and madre both end in -e but differ in gender, so learn each with its gender; nonno and nonna end in -o and -a.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson01.order.003
    lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
    type: word_order
    frame: {text: "Questo è mio {item}.", language_code: it, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: render_frame, frame: {text: "Questo è mio {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Questo and mio are masculine, so they go with a masculine noun: questo è mio padre.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson01.fill.004
    lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
    type: fill_in_blank
    frame: {text: "Questa è mia {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_madre, hint: *t_madre}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Questa and mia are feminine and agree with madre: this is my mother.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson01.translate.005
    lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
    type: translation
    frame: {text: "This is my mother.", language_code: en, direction: ltr}
    slots: {item: *t_madre}
    answer_derivation: {kind: render_frame, frame: {text: "Questa è mia {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Use questa and mia with a feminine noun, questo and mio with a masculine one.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson01.translate.006
    lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Madre and padre, fratello and sorella, nonno and nonna are masculine and feminine pairs of family words.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson02.choose.001
    lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool5}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Fratelli is the plural of fratello, and it can also mean siblings.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson02.listen.002
    lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool6}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Marito and moglie are husband and wife; moglie ends in -e but is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson02.order.003
    lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
    type: word_order
    frame: {text: "Ho un fratello e una {item}.", language_code: it, direction: ltr}
    slots: {item: *t_sorella}
    answer_derivation: {kind: render_frame, frame: {text: "Ho un fratello e una {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Un goes with a masculine noun and una with a feminine one: un fratello, una sorella.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson02.fill.004
    lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
    type: fill_in_blank
    frame: {text: "Hai fratelli o {item}? ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_sorelle, hint: *t_sorelle}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The plural of sorella is sorelle: the -a ending becomes -e.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson02.translate.005
    lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
    type: translation
    frame: {text: "I have one brother and one sister.", language_code: en, direction: ltr}
    slots: {item: *t_sorella}
    answer_derivation: {kind: render_frame, frame: {text: "Ho un fratello e una {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Ho means I have; use un before a masculine noun and una before a feminine one.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson02.translate.006
    lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
    type: translation
    frame: {text: "Do you have brothers or sisters? (informal, tu)", language_code: en, direction: ltr}
    slots: {item: *t_sorelle}
    answer_derivation: {kind: render_frame, frame: {text: "Hai fratelli o {item}?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Hai is the informal tu form of have, so this question is for a friend or colleague.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson03.match.001
    lesson_content_key: it.a1.unit06.lesson03.hai_figli
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *pool9, second: *pool9, third: *pool9, fourth: *pool9, fifth: *pool9, sixth: *pool9}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Family words come in masculine and feminine pairs: marito and moglie, figlio and figlia.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson03.choose.002
    lesson_content_key: it.a1.unit06.lesson03.hai_figli
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool10}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Figli means children in general; figlio and figlia name a son or daughter.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson03.listen.003
    lesson_content_key: it.a1.unit06.lesson03.hai_figli
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool11}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Maschio and femmina are used for a boy and a girl in a family.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson03.fill.004
    lesson_content_key: it.a1.unit06.lesson03.hai_figli
    type: fill_in_blank
    frame: {text: "Sì, ho due {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_figli, hint: *t_figli}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Figli is the plural of figlio and covers children of either sex.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson03.translate.005
    lesson_content_key: it.a1.unit06.lesson03.hai_figli
    type: translation
    frame: {text: "Do you have children? (informal, tu)", language_code: en, direction: ltr}
    slots: {item: *t_figli}
    answer_derivation: {kind: render_frame, frame: {text: "Hai {item}?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Hai figli? is the informal way to ask whether someone has children.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit06.lesson03.translate.006
    lesson_content_key: it.a1.unit06.lesson03.hai_figli
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool13}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Figlio and figlia mean son and daughter; maschio and femmina describe a boy and a girl among your children.", language_code: en, direction: ltr}
