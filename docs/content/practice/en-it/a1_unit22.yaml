schema_version: "1.0"
pack_key: practice.en-it.a1.unit22
source_language: en
target_language: it
unit_content_key: it.a1.unit22.emotions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-it) from scripts/backfill_lexemes_en_it.py lexemes (it_a1_u22* lesson tags, w_<token> anchors).
    Felice and triste are invariable; stanco and nervoso are masculine and stanca is feminine, so prompts say 'said by a man/woman' where the speaker's gender matters. po' is a real token (un po' = a bit) but is kept out of pools; it appears only as literal frame text. Questions say informal.
    Reviewer check: 'Sam è stanco' follows the realization and asserts only a momentary state.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_felice, w_ma, w_nervoso, "w_perché", w_senti, w_stanca, w_stanco, w_sto, w_triste]
slot_presets:
  pool1: &pool1 {language_code: it, part_of_speech: [adjective, verb], agreement_tags: {semantic: [w_felice, w_triste, w_stanco, w_nervoso, w_senti]}}
  pool2: &pool2 {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: [w_felice, w_triste, w_stanco, w_nervoso]}}
  pool3: &pool3 {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: [w_felice, w_triste]}}
  t_senti: &t_senti {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_senti}}
  t_stanco: &t_stanco {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: w_stanco}}
  t_felice: &t_felice {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: w_felice}}
  t_nervoso: &t_nervoso {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: w_nervoso}}
  pool8: &pool8 {language_code: it, part_of_speech: [particle, adjective, verb], agreement_tags: {semantic: ["w_perché", w_ma, w_stanca, w_sto]}}
  t_ma: &t_ma {language_code: it, part_of_speech: particle, agreement_tags: {semantic: w_ma}}
  t_stanca: &t_stanca {language_code: it, part_of_speech: adjective, agreement_tags: {semantic: w_stanca}}
  t_perche: &t_perche {language_code: it, part_of_speech: particle, agreement_tags: {semantic: "w_perché"}}
  t_sto: &t_sto {language_code: it, part_of_speech: verb, agreement_tags: {semantic: w_sto}}
  pool13: &pool13 {language_code: it, part_of_speech: [adjective, verb], agreement_tags: {semantic: [w_felice, w_triste, w_stanco, w_nervoso, w_senti, w_stanca, w_sto]}}
templates:
  - content_key: practice.en-it.it.a1.unit22.lesson01.choose.001
    lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Stanco and nervoso end in -o for a man; felice and triste end in -e.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson01.listen.002
    lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
    type: listen_select
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Felice and triste do not change for a man or a woman.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson01.order.003
    lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
    type: word_order
    frame: {text: "Sono {item} oggi.", language_code: it, direction: ltr}
    slots: {item: *pool3}
    answer_derivation: {kind: render_frame, frame: {text: "Sono {item} oggi.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Felice and triste end in -e and do not change for gender.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson01.order.004
    lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
    type: word_order
    frame: {text: "Come ti {item} oggi?", language_code: it, direction: ltr}
    slots: {item: *t_senti}
    answer_derivation: {kind: render_frame, frame: {text: "Come ti {item} oggi?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Senti is the informal tu form: how do you feel?", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson01.fill.005
    lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
    type: fill_in_blank
    frame: {text: "Sam è {item}. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_stanco, hint: *t_stanco}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Stanco ends in -o because Sam is a man.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson01.translate.006
    lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
    type: translation
    frame: {text: "I am happy today.", language_code: en, direction: ltr}
    slots: {item: *t_felice}
    answer_derivation: {kind: render_frame, frame: {text: "Sono {item} oggi.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Felice is the same for a man and a woman.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson01.translate.007
    lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
    type: translation
    frame: {text: "How do you feel today? (informal, tu)", language_code: en, direction: ltr}
    slots: {item: *t_senti}
    answer_derivation: {kind: render_frame, frame: {text: "Come ti {item} oggi?", language_code: it, direction: ltr}}
    feedback_frame: {text: "Come ti senti? is the informal question.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson01.translate.008
    lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
    type: translation
    frame: {text: "I am nervous today. (said by a man)", language_code: en, direction: ltr}
    slots: {item: *t_nervoso}
    answer_derivation: {kind: render_frame, frame: {text: "Sono {item} oggi.", language_code: it, direction: ltr}}
    feedback_frame: {text: "A woman would say nervosa; a man says nervoso.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson01.translate.009
    lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *pool2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Felice and triste are feelings; stanco and nervoso are masculine forms.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson02.choose.001
    lesson_content_key: it.a1.unit22.lesson02.perche_vedo_elena
    type: multiple_choice
    frame: {text: "{item}", language_code: it, direction: ltr}
    slots: {item: *pool8}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Perché can mean both because and why.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson02.order.002
    lesson_content_key: it.a1.unit22.lesson02.perche_vedo_elena
    type: word_order
    frame: {text: "Sono stanca, {item} sto bene.", language_code: it, direction: ltr}
    slots: {item: *t_ma}
    answer_derivation: {kind: render_frame, frame: {text: "Sono stanca, {item} sto bene.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Ma means but and joins two contrasting ideas.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson02.order.003
    lesson_content_key: it.a1.unit22.lesson02.perche_vedo_elena
    type: word_order
    frame: {text: "Sono un po' {item}.", language_code: it, direction: ltr}
    slots: {item: *t_stanca}
    answer_derivation: {kind: render_frame, frame: {text: "Sono un po' {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Stanca is the feminine form, used by a woman.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson02.fill.004
    lesson_content_key: it.a1.unit22.lesson02.perche_vedo_elena
    type: fill_in_blank
    frame: {text: "Sono felice {item} oggi c'è il sole. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_perche, hint: *t_perche}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Perché introduces a reason: because.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson02.fill.005
    lesson_content_key: it.a1.unit22.lesson02.perche_vedo_elena
    type: fill_in_blank
    frame: {text: "Sono stanca, ma {item} bene. ({hint})", language_code: it, direction: ltr, slot_rendering: {hint: english_gloss}}
    slots: {item: *t_sto, hint: *t_sto}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Sto bene is how you say I am fine.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson02.translate.006
    lesson_content_key: it.a1.unit22.lesson02.perche_vedo_elena
    type: translation
    frame: {text: "I am a little tired. (said by a woman)", language_code: en, direction: ltr}
    slots: {item: *t_stanca}
    answer_derivation: {kind: render_frame, frame: {text: "Sono un po' {item}.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Stanca is feminine, for a woman speaking.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson02.translate.007
    lesson_content_key: it.a1.unit22.lesson02.perche_vedo_elena
    type: translation
    frame: {text: "I am happy because it is sunny today.", language_code: en, direction: ltr}
    slots: {item: *t_perche}
    answer_derivation: {kind: render_frame, frame: {text: "Sono felice {item} oggi c'è il sole.", language_code: it, direction: ltr}}
    feedback_frame: {text: "Perché gives the reason, as in because.", language_code: en, direction: ltr}
  - content_key: practice.en-it.it.a1.unit22.lesson02.match.008
    lesson_content_key: it.a1.unit22.lesson02.perche_vedo_elena
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: it, direction: ltr}
    slots: {first: *pool13, second: *pool13, third: *pool13, fourth: *pool13, fifth: *pool13, sixth: *pool13}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Stanco is masculine and stanca is feminine.", language_code: en, direction: ltr}
