schema_version: '1.0'
pack_key: practice.en-it.b2.unit02
source_language: en
target_language: it
unit_content_key: it.b2.unit02.speculazione
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-it backfill lexemes (tags it_b2_u2 / w_<token>). 48 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_allora, w_appuntamento, w_auto, w_aver, w_bloccato, w_casa, w_così, w_deve, w_dimenticare, w_dimenticato, w_dovere, w_dubbio, w_essere, w_essersi, w_forse, w_immaginare, w_immagino, w_magari, w_malato, w_ora, w_perdere, w_perso, w_poco, w_potrebbe, w_probabilmente, w_punta, w_può, w_qui, w_quindi, w_ritardo, w_sarà, w_scommettere, w_scommetto, w_sicuramente, w_sicuro, w_spento, w_stamattina, w_stasera, w_succedere, w_successo, w_svegliarsi, w_svegliato, w_tardi, w_telefono, w_traffico, w_treno, w_vedere, w_visto]
templates:
- content_key: practice.en-it.it.b2.unit02.lesson01.choose.001
  lesson_content_key: it.b2.unit02.lesson01.quanto_sei_sicuro
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: &id001
      language_code: it
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_qui, w_così, w_ritardo, w_forse, w_probabilmente, w_sarà, w_sicuro, w_dubbio, w_sicuramente, w_dovere, w_deve, w_essere, w_bloccato, w_traffico, w_può, w_malato, w_visto, w_vedere, w_poco, w_quindi, w_auto, w_potrebbe, w_magari, w_casa, w_immaginare, w_immagino, w_scommettere, w_scommetto, w_perdere, w_treno, w_aver, w_perso, w_succedere, w_successo, w_svegliarsi, w_svegliato, w_tardi, w_essersi, w_dimenticare, w_dimenticato, w_appuntamento, w_stasera, w_telefono, w_spento, w_ora, w_punta, w_allora, w_stamattina]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on how certain are you?.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson02.listen.001
  lesson_content_key: it.b2.unit02.lesson02.deduzione
  type: listen_select
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on deduction: it must be so.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson03.translate.001
  lesson_content_key: it.b2.unit02.lesson03.supposizione_o_deduzione
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a guess or a deduction?.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson04.match.001
  lesson_content_key: it.b2.unit02.lesson04.il_passato
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: it, direction: ltr}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Italian word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson05.choose.001
  lesson_content_key: it.b2.unit02.lesson05.fatto_o_supposizione
  type: multiple_choice
  frame: {text: '{item}', language_code: it, direction: ltr}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on fact or speculation?.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson06.translate.001
  lesson_content_key: it.b2.unit02.lesson06.speculare_in_conversazione
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on speculating in conversation.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson01.order.002
  lesson_content_key: it.b2.unit02.lesson01.quanto_sei_sicuro
  type: word_order
  frame: {text: 'Sam non è ancora {item}.', language_code: it, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: adverb
      agreement_tags: {semantic: w_qui}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Sam non è ancora {item}.', language_code: it, direction: ltr}
  feedback_frame: {text: Sam isn't here yet. qui means here., language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson01.fill.003
  lesson_content_key: it.b2.unit02.lesson01.quanto_sei_sicuro
  type: fill_in_blank
  frame:
    text: Perché è {item} in ritardo? ({hint})
    language_code: it
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: it
      part_of_speech: adverb
      agreement_tags: {semantic: w_così}
    hint:
      language_code: it
      part_of_speech: adverb
      agreement_tags: {semantic: w_così}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Why is he so late? così means like this; so.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson01.translate.004
  lesson_content_key: it.b2.unit02.lesson01.quanto_sei_sicuro
  type: translation
  frame: {text: Maybe he is late., language_code: en, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags: {semantic: w_ritardo}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Forse è in {item}.', language_code: it, direction: ltr}
  feedback_frame: {text: Maybe he is late. ritardo means delay., language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson02.order.002
  lesson_content_key: it.b2.unit02.lesson02.deduzione
  type: word_order
  frame: {text: 'Quindi {item} essere in ufficio.', language_code: it, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags: {semantic: w_deve}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Quindi {item} essere in ufficio.', language_code: it, direction: ltr}
  feedback_frame: {text: So he must be at the office. deve means you must (formal)., language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson02.fill.003
  lesson_content_key: it.b2.unit02.lesson02.deduzione
  type: fill_in_blank
  frame:
    text: Deve {item} in ufficio. ({hint})
    language_code: it
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags: {semantic: w_essere}
    hint:
      language_code: it
      part_of_speech: verb
      agreement_tags: {semantic: w_essere}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: He must be at the office. essere means to be., language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson02.translate.004
  lesson_content_key: it.b2.unit02.lesson02.deduzione
  type: translation
  frame: {text: He must be stuck in traffic., language_code: en, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags: {semantic: w_bloccato}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Deve essere {item} nel traffico.', language_code: it, direction: ltr}
  feedback_frame: {text: He must be stuck in traffic. bloccato means stuck (masc.)., language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson03.order.002
  lesson_content_key: it.b2.unit02.lesson03.supposizione_o_deduzione
  type: word_order
  frame: {text: 'Magari è a {item}.', language_code: it, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags: {semantic: w_casa}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Magari è a {item}.', language_code: it, direction: ltr}
  feedback_frame: {text: Maybe he's at home. casa means home; house., language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson04.order.002
  lesson_content_key: it.b2.unit02.lesson04.il_passato
  type: word_order
  frame: {text: 'Deve aver perso il {item}.', language_code: it, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags: {semantic: w_treno}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Deve aver perso il {item}.', language_code: it, direction: ltr}
  feedback_frame: {text: 'He must have missed the train. Past deduction is built with dovere + avere (shortened to aver before a participle) + the past participle: deve aver perso = ''must have missed''.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson04.fill.003
  lesson_content_key: it.b2.unit02.lesson04.il_passato
  type: fill_in_blank
  frame:
    text: Deve {item} dimenticato l'appuntamento. ({hint})
    language_code: it
    direction: ltr
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags: {semantic: w_aver}
    hint:
      language_code: it
      part_of_speech: verb
      agreement_tags: {semantic: w_aver}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: He must have forgotten the appointment. aver means to have (shortened infinitive)., language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson04.translate.004
  lesson_content_key: it.b2.unit02.lesson04.il_passato
  type: translation
  frame: {text: He might have missed the train., language_code: en, direction: ltr}
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags: {semantic: w_perso}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Potrebbe aver {item} il treno.', language_code: it, direction: ltr}
  feedback_frame: {text: 'He might have missed the train. Potrebbe (might) also combines with aver/essersi + participle for a tentative PAST guess: potrebbe aver perso = ''might have missed''.', language_code: en, direction: ltr}
- content_key: practice.en-it.it.b2.unit02.lesson06.order.002
  lesson_content_key: it.b2.unit02.lesson06.speculare_in_conversazione
  type: word_order
  frame: {text: 'L''ho visto {item}.', language_code: it, direction: ltr}
