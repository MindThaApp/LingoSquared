    frame:
      text: Bis {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bis înseamnă „până”, așa că Bis bald corespunde cu „pe curând”, iar Bis später cu „ne vedem mai târziu”.
    language_code: ro
    direction: ltr
