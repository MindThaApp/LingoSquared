    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bitte acoperă atât „te rog”, cât și „cu plăcere”, iar Entschuldigung atrage atenția cuiva sau înseamnă „scuze”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-de.de.a1.unit01.lesson03.order.002
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: word_order
