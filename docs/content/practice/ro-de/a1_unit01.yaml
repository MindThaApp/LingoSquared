    frame:
      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Wie geht es Ihnen? este „ce mai faceți?” în registru formal; cu un prieten întrebi Wie geht's?
    language_code: ro
    direction: ltr
- content_key: practice.ro-de.de.a1.unit01.lesson02.order.002
