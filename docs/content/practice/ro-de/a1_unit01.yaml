  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tschüss este formula de rămas-bun relaxată; Auf Wiedersehen este cea politicoasă, pentru necunoscuți și situații formale.
    language_code: ro
    direction: ltr
- content_key: practice.ro-de.de.a1.unit01.lesson03.choose.001
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Germana are două cuvinte pentru „tu/dumneavoastră”: Sie este formal (necunoscuți, autorități), du este informal (prieteni, familie, copii).'
    language_code: ro
    direction: ltr
- content_key: practice.ro-de.de.a1.unit01.lesson04.listen.001
