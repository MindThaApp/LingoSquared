    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_simple
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_simple
  answer_derivation:
