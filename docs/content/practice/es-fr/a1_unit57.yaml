  lesson_content_key: fr.a1.unit57.lesson01.telephone_ordinateur_et_internet
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_utiliser
        - w_ordinateur
        - w_internet
        - w_appli
        - w_message
        - w_envoies
        - w_envoie
        - w_lit
        - w_cherches
        - w_soleil
        - w_nommer
        - w_appelle
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre teléfono, ordenador e internet.'
    language_code: es
    direction: ltr
