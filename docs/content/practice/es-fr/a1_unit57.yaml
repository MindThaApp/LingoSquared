  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_appelle
    - w_appli
    - w_cherches
    - w_envoie
    - w_envoies
    - w_internet
    - w_lit
    - w_message
    - w_nommer
    - w_ordinateur
    - w_soleil
    - w_utiliser
templates:
