templates:
- content_key: practice.es-fr.fr.a1.unit10.lesson01.choose.001
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Avant significa antes; d'abord significa primero, al comienzo de una secuencia.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson01.listen.002
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'S''habiller es reflexivo: je m''habille, tu t''habilles; s'' se convierte en m'' con je.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson01.match.003
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Varios verbos de la rutina son reflexivos (se réveiller, s'habiller); los demás, como prendre y quitter, no lo son.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson01.order.004
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: word_order
  frame:
    text: Je {item} la maison à neuf heures.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Je {item} la maison à neuf heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quitter la maison significa salir de casa; con je el verbo es quitte.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson01.fill.005
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: fill_in_blank
  frame:
    text: Je prends une {item} le matin. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Prendre une douche es la forma habitual de decir ducharse.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson01.translate.007
  lesson_content_key: fr.a1.unit10.lesson01.vocabulaire_routine
  type: translation
  frame:
    text: Me visto antes del desayuno.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je m'habille avant le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m'habille usa el reflexivo m' ante un sonido vocálico.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson02.choose.001
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tard significa tarde; puis significa luego y sirve para enlazar los pasos de una rutina.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson02.listen.002
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vingt-trois es 23; en francés las horas pueden darse en formato de 24 horas, así que vingt-trois heures son las 11 de la noche.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson02.match.003
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Rentrer, dîner y coucher son los infinitivos; las formas de je y nous cambian sus terminaciones.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson02.fill.005
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: fill_in_blank
  frame:
    text: Je {item} à la maison après le travail. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rentre es la forma de je; rentrer significa volver a casa.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson02.translate.007
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: Cenamos juntos los sábados por la noche. (usa nous)
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Nous {item} ensemble le samedi soir.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Nous dînons es la forma de nous; ensemble significa juntos.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson02.translate.008
  lesson_content_key: fr.a1.unit10.lesson02.la_journee_complete
  type: translation
  frame:
    text: Me acuesto hacia las 11 de la noche (23:00).
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Je me {item} vers vingt-trois heures.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Vers indica una hora aproximada; vingt-trois heures usa el formato de 24 horas.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson03.choose.001
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu fais quoi ? es la forma coloquial de preguntar qué estás haciendo; quoi sustituye a que después del verbo.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson03.listen.002
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je me repose significa descanso; repose es la forma de je de se reposer.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson03.order.004
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: word_order
  frame:
    text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Ensuite, je prends le petit-déjeuner et je {item} au marché.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je vais es la forma de je de aller; au es à más le.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson03.fill.005
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: fill_in_blank
  frame:
    text: Je me {item} avant l'atelier du soir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se reposer es reflexivo, así que je lleva me.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson03.translate.006
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: '¿Qué haces los sábados antes del taller? (informal: empieza con Tu fais)'
    language_code: es
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu fais {item} le samedi avant l'atelier ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu fais quoi ? es la forma informal de preguntar qué hace alguien.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit10.lesson03.translate.007
  lesson_content_key: fr.a1.unit10.lesson03.dialogue_routine_samedi
  type: translation
  frame:
    text: '¿A qué hora llegas a casa? (informal: empieza con Tu)'
    language_code: es
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu {item} à quelle heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Rentres es la forma de tu; à quelle heure pregunta por la hora.
    language_code: es
    direction: ltr
