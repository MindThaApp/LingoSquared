templates:
- content_key: practice.es-fr.fr.a1.unit08.lesson01.choose.001
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lundi, samedi y dimanche no llevan mayúscula en francés, y le ante un día significa «todas las semanas»: le samedi.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson01.listen.002
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Demain y hier son los adverbios de «mañana» y «ayer»; ninguno lleva preposición.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson01.match.003
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Los días de la semana en francés son masculinos y se escriben con minúscula.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson01.order.004
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: word_order
  frame:
    text: La pharmacie ouvre {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: La pharmacie ouvre {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Demain significa «mañana» y se coloca después del verbo, sin preposición.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson01.fill.005
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: fill_in_blank
  frame:
    text: La boulangerie est fermée le {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le dimanche significa «los domingos» como costumbre regular.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson01.translate.007
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: translation
  frame:
    text: El taller tiene lugar los sábados.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier a lieu le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: L'atelier a lieu le samedi significa que el taller se celebra los sábados.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson02.choose.001
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Premier es el ordinal solo para el primer día; las demás fechas usan números cardinales: le premier mars, le quinze mars.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson02.listen.002
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mars es un mes; los meses franceses, como los días, no llevan mayúscula.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson02.order.003
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: word_order
  frame:
    text: Nous sommes le quinze {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Nous sommes le quinze {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Las fechas siguen el patrón le + número + mes: le quinze mars.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson02.fill.004
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: fill_in_blank
  frame:
    text: L'atelier se {item} le vingt-deux mars. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se termine es la forma reflexiva que significa «termina» o «acaba».
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson02.translate.005
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: translation
  frame:
    text: ¿Qué fecha es hoy?
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Quelle est la {item} aujourd'hui ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quelle est la date aujourd'hui es la forma estándar de preguntar la fecha del calendario.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson02.translate.006
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: translation
  frame:
    text: Es el quince de marzo. (empieza con c'est)
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est le quinze {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: El francés usa números cardinales para las fechas, así que «el quince» es simplemente quinze.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson03.choose.001
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Quand pregunta «cuándo»; donc une una conclusión con lo que se acaba de decir.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson03.listen.002
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Séance es la palabra para una sesión, como una sesión de taller o una función de cine.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson03.match.003
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Séance, idée y occasion son sustantivos femeninos; temps es masculino.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson03.order.004
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: word_order
  frame:
    text: Parfait, j'ai le temps de {item} un dessert pour l'occasion.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, j'ai le temps de {item} un dessert pour l'occasion.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Tras avoir le temps de el verbo se queda en infinitivo: préparer.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson03.fill.005
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: fill_in_blank
  frame:
    text: C'est {item}, la dernière séance de l'atelier ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: C'est quand ... ? es una forma informal de preguntar cuándo ocurre algo.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit08.lesson03.translate.006
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: translation
  frame:
    text: ¡Buena idea!
    language_code: es
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Bonne {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Idée es femenino, así que el adjetivo es bonne y no bon.
    language_code: es
    direction: ltr
