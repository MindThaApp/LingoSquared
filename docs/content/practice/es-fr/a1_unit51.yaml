        - w_cafés
        - w_total
        - w_payé
        - w_demande
        - w_tellement
        - w_aidé
        - w_gentil
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Tarjeta o efectivo?».'
    language_code: es
    direction: ltr
