  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: word_order
  frame:
    text: Je peux {item} par carte ici ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_payer
  answer_derivation:
    kind: render_frame
    frame:
      text: Je peux {item} par carte ici ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: ¿Puedo pagar con tarjeta aquí? payer significa pagar.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit51.lesson02.fill.004
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: fill_in_blank
  frame:
    text: Vous voulez payer en espèces ou par {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_carte
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_carte
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¿Quiere pagar en efectivo o con tarjeta? Vous voulez ... ? es la forma formal de preguntar, la que usa un cajero que no conoces; entre amigos se diría tu veux ... ?.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit51.lesson02.translate.005
  lesson_content_key: fr.a1.unit51.lesson02.carte_ou_especes
  type: translation
  frame:
    text: Pago en efectivo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_espèces
  answer_derivation:
    kind: render_frame
    frame:
      text: Je paie en {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Pago en efectivo. espèces significa efectivo.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit51.lesson03.order.002
  lesson_content_key: fr.a1.unit51.lesson03.partager_l_addition
  type: word_order
  frame:
    text: On {item} l'addition ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_partage
  answer_derivation:
    kind: render_frame
    frame:
      text: On {item} l'addition ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: ¿Dividimos la cuenta? partage significa dividir; compartir (con je, il/elle o on).
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit51.lesson03.fill.003
  lesson_content_key: fr.a1.unit51.lesson03.partager_l_addition
  type: fill_in_blank
  frame:
    text: Je peux payer {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_séparément
    hint:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_séparément
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¿Puedo pagar por separado? Séparément (por separado) va justo después de payer; es la forma educada de pedir pagar solo tu parte de la cuenta.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit51.lesson04.order.002
  lesson_content_key: fr.a1.unit51.lesson04.la_monnaie
  type: word_order
  frame:
    text: Voici votre {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_monnaie
  answer_derivation:
    kind: render_frame
    frame:
      text: Voici votre {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Aquí tiene su cambio. monnaie significa cambio (monedas); suelto.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit51.lesson06.order.002
  lesson_content_key: fr.a1.unit51.lesson06.camille_et_mathieu_paient
  type: word_order
