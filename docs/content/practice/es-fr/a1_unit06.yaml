templates:
- content_key: practice.es-fr.fr.a1.unit06.lesson01.choose.001
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le matin, l'après-midi y le soir nombran partes del día; midi y minuit son mediodía y medianoche y no llevan artículo.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson01.listen.002
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'L''heure es la heure abreviado: heure empieza con una h muda, así que la se convierte en l'' ante ella.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson01.match.003
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Matin, après-midi y soir suelen ir con le o l' cuando dices por la mañana, por la tarde o por la noche.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson01.order.004
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: word_order
  frame:
    text: Le marché est ouvert le {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Le marché est ouvert le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Le matin y le soir significan «por la mañana» y «por la noche»; en francés no se usa ninguna preposición.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson01.fill.005
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: fill_in_blank
  frame:
    text: Nous mangeons à {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: À midi significa «a mediodía»; midi es también la palabra cotidiana para la hora de comer.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson01.translate.006
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: translation
  frame:
    text: El taller empieza por la noche, no por la mañana.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier commence le {item}, pas le matin.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Le soir significa «por la noche»; pas niega y marca el contraste con le matin.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson02.choose.001
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Demie es la forma femenina aquí porque heure es femenino: dix heures et demie.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson02.listen.002
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Et quart y moins le quart son las dos expresiones del cuarto de hora: y cuarto y menos cuarto.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson02.order.003
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: word_order
  frame:
    text: L'atelier commence à {item} heure ?
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier commence à {item} heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quelle heure? pregunta qué hora es; quelle es femenino para concordar con heure.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson02.fill.004
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: fill_in_blank
  frame:
    text: Il est onze heures {item} le quart. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Moins le quart resta un cuarto a la hora siguiente, así que onze heures moins le quart son las 10:45.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson02.translate.005
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: translation
  frame:
    text: Son las diez y cuarto.
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Il est dix heures et {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Et quart suma un cuarto de hora; en francés se dice literalmente «diez horas y cuarto».
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson03.choose.001
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Alors, vers y après son palabras pequeñas de enlace que marcan el momento o la secuencia en el diálogo.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson03.listen.002
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vers significa «hacia» o «alrededor de», como en vers vingt heures quinze, y da una hora aproximada.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson03.match.003
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Après le travail significa «después del trabajo»; vers y d'habitude dan un horario aproximado y habitual.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson03.order.004
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: word_order
  frame:
    text: C'est plus {item} après le travail.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est plus {item} après le travail.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Plus pratique significa «más cómodo»; pratique tiene la misma forma en masculino y en femenino.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson03.fill.005
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: fill_in_blank
  frame:
    text: Et il {item} à quelle heure ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Finit es la forma de il de finir, así que concuerda con il en la pregunta.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson03.fill.006
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: fill_in_blank
  frame:
    text: Vers vingt heures quinze, comme {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Comme d'habitude significa «como siempre».
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit06.lesson03.translate.007
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: translation
  frame:
    text: Empieza a las 18:30, creo. (escribe la hora con letras)
    language_code: es
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Il commence à dix-huit heures trente, je {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Je crois es la forma de je de croire y suaviza una afirmación: creo que sí.'
    language_code: es
    direction: ltr
