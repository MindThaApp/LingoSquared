schema_version: '1.0'
pack_key: practice.es-fr.a1.unit49
source_language: es
target_language: fr
unit_content_key: fr.a1.unit49.emotions
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_arriver
    - w_colère
    - w_content
    - w_fier
    - w_honnêtement
    - w_nerveux
    - w_nouveau
    - w_pense
    - w_pourquoi
    - w_remplace
    - w_sent
    - w_seras
    - w_service
    - w_seul
    - w_sûrement
    - w_triste
    - w_vas
    - w_vraiment
templates:
- content_key: practice.es-fr.fr.a1.unit49.lesson01.choose.001
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: &id001
      language_code: fr
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_content
        - w_triste
        - w_colère
        - w_pourquoi
        - w_nerveux
        - w_service
        - w_sent
        - w_seul
        - w_nouveau
        - w_pense
        - w_honnêtement
        - w_vas
        - w_arriver
        - w_vraiment
        - w_seras
        - w_sûrement
        - w_fier
        - w_remplace
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Contento, triste o enfadado?».'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson02.listen.001
  lesson_content_key: fr.a1.unit49.lesson02.pourquoi_es_tu_content
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Por qué estás contento?».'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson03.translate.001
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Nervioso por algo».'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson04.match.001
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra en francés con su significado; las palabras salen de las lecciones de esta unidad.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson05.choose.001
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Leer un mensaje sobre sentimientos».'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson06.translate.001
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Camille tranquiliza a Mathieu».'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson01.order.002
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: word_order
  frame:
    text: Je suis {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_content
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Estoy contento. content significa contento, alegre (masc.).
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson01.fill.003
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: fill_in_blank
  frame:
    text: Je suis {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_triste
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_triste
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Estoy triste. triste significa triste.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson01.translate.004
  lesson_content_key: fr.a1.unit49.lesson01.content_triste_ou_en
  type: translation
  frame:
    text: Estoy enfadado.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_colère
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis en {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Estoy enfadado. colère significa ira.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson03.order.002
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: word_order
  frame:
    text: Je suis {item} avant mon premier service.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nerveux
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item} avant mon premier service.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Estoy nervioso por mi primer turno. nerveux significa nervioso (masc.).
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson03.fill.003
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: fill_in_blank
  frame:
    text: Salut Mathieu, tu te sens comment avant ton premier {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hola, Mathieu, ¿cómo te sientes ante tu primer turno? Avant ton premier service (antes de tu primer turno) reutiliza el patrón avant + sustantivo de la lección 3.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson04.order.002
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: word_order
  frame:
    text: Comment se {item} Mathieu ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sent
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment se {item} Mathieu ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: ¿Cómo se siente Mathieu? Se sentir (sentirse, reflexivo) es la forma habitual de preguntar por un estado de ánimo o de describirlo; también aparece en la unidad de salud.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson05.order.002
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: word_order
  frame:
    text: Oui, je {item} aussi.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pense
  answer_derivation:
    kind: render_frame
    frame:
      text: Oui, je {item} aussi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Sí, yo también lo creo. Je pense aussi es la forma natural de coincidir con la opinión de alguien.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson06.order.002
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: word_order
  frame:
    text: Je suis un peu nerveux, {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_honnêtement
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis un peu nerveux, {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Estoy un poco nervioso, la verdad. Honnêtement (honestamente) suaviza la confesión.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson06.fill.003
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: fill_in_blank
  frame:
    text: Ne t'inquiète pas, tu {item} y arriver ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: No te preocupes, ¡lo conseguirás! Tu vas y arriver (literalmente «llegarás allí») es una expresión fija de ánimo; aller + infinitivo forma el futuro cercano.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit49.lesson06.translate.004
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: Gracias, me ayuda mucho.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_vraiment
  answer_derivation:
    kind: render_frame
    frame:
      text: Merci, ça m'aide {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Gracias, me ayuda mucho. Aide es la forma de il/elle del verbo aider (ayudar); m' significa me.
    language_code: es
    direction: ltr
