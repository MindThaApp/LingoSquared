  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vous avez choisi? es como un camarero pregunta si ya han decidido; avez choisi es una forma de pasado, literalmente «han elegido».
    language_code: es
    direction: ltr
