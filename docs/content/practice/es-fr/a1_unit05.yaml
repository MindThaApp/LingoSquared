    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Un va ante sustantivos masculinos como café, dessert y verre.
    language_code: es
    direction: ltr
