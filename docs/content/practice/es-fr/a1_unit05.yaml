templates:
- content_key: practice.es-fr.fr.a1.unit05.lesson01.choose.001
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le poulet, le poisson, le riz y le vin son masculinos, mientras que la salade es femenino; l'eau pierde la vocal del artículo ante eau.
    language_code: es
    direction: ltr
