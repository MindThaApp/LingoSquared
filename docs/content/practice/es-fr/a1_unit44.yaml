- content_key: practice.es-fr.fr.a1.unit44.lesson04.order.002
  lesson_content_key: fr.a1.unit44.lesson04.a_la_pharmacie
  type: word_order
  frame:
    text: Je peux vous {item} ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_aider
  answer_derivation:
    kind: render_frame
    frame:
      text: Je peux vous {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: ¿En qué puedo ayudarle? Je peux vous aider ? es un saludo formal habitual en el servicio al cliente; vous es la forma de cortesía.
    language_code: es
    direction: ltr
