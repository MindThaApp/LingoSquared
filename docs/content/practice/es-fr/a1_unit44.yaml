      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tomo una pastilla. comprimé significa pastilla.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit44.lesson06.order.002
  lesson_content_key: fr.a1.unit44.lesson06.camille_prend_des_nouvelles
