- content_key: practice.es-fr.fr.a1.unit44.lesson01.order.002
  lesson_content_key: fr.a1.unit44.lesson01.je_ne_me_sens
  type: word_order
  frame:
    text: Je ne me {item} pas bien.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sens
  answer_derivation:
    kind: render_frame
    frame:
      text: Je ne me {item} pas bien.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: No me siento bien. Se sentir es reflexivo (je me sens); ne ... pas bien es la forma general y suave de decir que algo no va bien.
    language_code: es
    direction: ltr
