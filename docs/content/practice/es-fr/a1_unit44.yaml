      part_of_speech: adjective
      agreement_tags:
        semantic: w_malade
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Estoy enfermo. malade significa enfermo; indispuesto.
    language_code: es
    direction: ltr
