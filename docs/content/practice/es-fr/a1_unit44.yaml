    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_quelque
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_quelque
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¿Tiene algo para el dolor de cabeza? Quelque chose contre + síntoma es la forma natural de pedir un remedio.
    language_code: es
    direction: ltr
