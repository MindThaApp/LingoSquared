    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra en francés con su significado; las palabras salen de las lecciones de esta unidad.
    language_code: es
    direction: ltr
