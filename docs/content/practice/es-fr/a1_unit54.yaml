        - w_poissons
        - w_oiseaux
        - w_poil
        - w_brun
        - w_seulement
        - w_aucun
        - w_aimons
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre perro, gato, pez y pájaro.'
