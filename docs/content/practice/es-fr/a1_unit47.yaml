      language_code: fr
      direction: ltr
  feedback_frame:
    text: ¿Cuál es el pronóstico del tiempo? météo significa pronóstico del tiempo.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit47.lesson04.order.002
