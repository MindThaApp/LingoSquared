- content_key: practice.es-fr.fr.a1.unit47.lesson01.order.003
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: word_order
  frame:
    text: Le temps est {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_ensoleillé
  answer_derivation:
    kind: render_frame
    frame:
      text: Le temps est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Hace sol. Le temps est + adjetivo es un patrón habitual; el adjetivo concuerda con el sustantivo masculino temps.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit47.lesson01.fill.004
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: fill_in_blank
  frame:
    text: S'il {item}, on reste à l'intérieur. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pleut
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pleut
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Si llueve, nos quedamos dentro. S''il pleut (si llueve): si + il se convierte en s''il; después on reste à l''intérieur dice lo que se hace.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit47.lesson01.translate.005
  lesson_content_key: fr.a1.unit47.lesson01.quel_temps_fait_il
  type: translation
  frame:
    text: Está nublado.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nuageux
  answer_derivation:
    kind: render_frame
    frame:
      text: Le temps est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Está nublado. Sigue el mismo patrón le temps est + adjetivo que ensoleillé.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit47.lesson02.order.002
  lesson_content_key: fr.a1.unit47.lesson02.froid_ou_chaud
  type: word_order
  frame:
    text: Il fait {item} aujourd'hui.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_froid
  answer_derivation:
    kind: render_frame
    frame:
      text: Il fait {item} aujourd'hui.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Hoy hace frío. Aujourd'hui (hoy) sitúa el tiempo en el día presente; il fait froid usa faire (hacer), como en español, y no être.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit47.lesson02.fill.003
  lesson_content_key: fr.a1.unit47.lesson02.froid_ou_chaud
  type: fill_in_blank
  frame:
    text: Il fait {item} aujourd'hui. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_chaud
    hint:
      language_code: fr
      part_of_speech: adjective
      agreement_tags:
        semantic: w_chaud
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hoy hace calor. Il fait chaud sirve para decir tanto «hace calor» como «hace mucho calor» al hablar del tiempo a diario.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit47.lesson03.order.002
  lesson_content_key: fr.a1.unit47.lesson03.la_meteo
  type: word_order
  frame:
