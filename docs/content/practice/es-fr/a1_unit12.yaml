templates:
- content_key: practice.es-fr.fr.a1.unit12.lesson01.choose.001
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Préparé, acheté, oublié y goûté son participios pasados de verbos en -er: terminan en -é.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson01.listen.002
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Todos estos participios terminan en -é, que suena como el final de café.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson01.order.004
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: word_order
  frame:
    text: Tu as {item} le gâteau ?
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu as {item} le gâteau ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Tu as aimé? es la pregunta en pasado: as más el participio aimé.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson01.fill.006
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: fill_in_blank
  frame:
    text: J'ai {item} des légumes au marché. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Acheté es el participio de acheter y se usa después de j'ai.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson01.translate.007
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: translation
  frame:
    text: Preparé un pastel para el taller.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {item} un gâteau pour l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: J'ai préparé usa avoir más el participio; después de avoir el participio no cambia de terminación.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson01.translate.008
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: translation
  frame:
    text: Olvidé la mantequilla en casa.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {item} le beurre à la maison.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: J'ai oublié es el passé composé de oublier.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson02.choose.001
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Être es el auxiliar de verbos como arriver, aller y rester: je suis arrivé, il est resté.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson02.listen.002
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Finalement se forma con el adjetivo final más la terminación -ment.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson02.order.004
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: word_order
  frame:
    text: Le bus est {item} en retard.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Le bus est {item} en retard.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Arrivé concuerda con le bus, así que es masculino singular y no lleva una -e extra.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson02.fill.006
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: fill_in_blank
  frame:
    text: Mathieu est {item} pour nettoyer la cuisine. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Rester lleva être, así que resté concuerda con Mathieu: masculino singular.'
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson02.translate.007
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: translation
  frame:
    text: Fui al mercado antes del taller. (lo dice una mujer)
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item} au marché avant l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Con être el participio concuerda con el sujeto, así que una mujer escribe allée.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson02.translate.008
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: translation
  frame:
    text: Finalmente, el pastel estaba delicioso.
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Finalement, le gâteau {item} délicieux.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Était es el imperfecto de être; finalement abre la frase con el sentido de al final.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson03.choose.001
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je n'ai pas pu venir significa no pude venir; pu es el participio de pouvoir.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson03.listen.002
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Samedi dernier significa el sábado pasado; dernier va detrás del sustantivo aquí.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson03.match.003
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Là-bas significa allí, y rapidement significa rápidamente.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson03.order.004
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: word_order
  frame:
    text: Je suis allé {item} à l'épicerie du coin.
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis allé {item} à l'épicerie du coin.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Rapidement es un adverbio y no cambia.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson03.fill.005
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: fill_in_blank
  frame:
    text: Je n'ai pas {item} venir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pu es el participio de pouvoir; n'ai pas rodea al auxiliar.
    language_code: es
    direction: ltr
- content_key: practice.es-fr.fr.a1.unit12.lesson03.translate.006
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: translation
  frame:
    text: ¿Encontraste mantequilla allí? (informal, tu)
    language_code: es
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu as trouvé du beurre {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu as trouvé? es informal, y du beurre significa algo de mantequilla.
    language_code: es
    direction: ltr
