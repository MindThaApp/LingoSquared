  notes: Derived from practice.en-fr by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_avait
    - w_cet
    - w_clé
    - w_compris
    - w_mot
    - w_nuit
    - w_nuits
    - w_réceptionniste
    - w_réservation
    - w_réserver
    - w_réservé
    - w_wifi
