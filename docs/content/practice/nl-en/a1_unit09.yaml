schema_version: "1.0"
pack_key: practice.nl-en.a1.unit09
source_language: nl
target_language: en
unit_content_key: en.a1.unit09.places
review:
  status: reviewed
  fresh_context: true
  notes: "Authored 2026-07-05 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en direction, per the
    coordinator's scope split). Keyed to English target lexemes extended into
    the shared scripts/_en_target_lexeme_common.py plus this pair's own Dutch
    glosses added to scripts/backfill_lexemes_nl_en.py. A self-reference bug
    caught while designing this pack: lesson02's frames anchor on 'the
    hospital' ('The {item} is next to/behind the hospital.'), and the
    obvious 5-member 'place' tag includes hospital itself -- if slotted
    directly, the sampler could generate 'The hospital is next to the
    hospital.' Fixed with a narrower 'place_non_hospital' tag (bank/pharmacy/
    park/restaurant, 4 members) used only in those two frames; the full
    'place' tag (5 members) is safe and used everywhere else (bare-word
    recognition, and lesson03/04's 'Where is the {item}?' frames, which have
    no second place to conflict with). Deliberately did not build any slot
    from the preposition phrases themselves (next to/across from/between/
    behind/in front of) -- each has different surrounding words and isn't a
    simple single-word swap, so every preposition in this pack's frames is
    baked as fixed text, only the place noun is slotted. Also avoided
    guessing Dutch de/het gender articles for the 'Where is the {item}?'
    translation direction (same risk class caught in an earlier en-nl pack
    this session) by using bare-word translation instead of embedding the
    place noun in a Dutch 'Waar is de/het ...?' frame. Every slot's real
    candidate count was verified with the same standalone
    lexeme_matches()-replicating harness used for every other pack this pass.
    The underlying en realization unit09 IS fresh-context reviewed already;
    the nl-en overlay itself is still unreviewed. Needs the standard
    fresh-context review before import. Same blocking DB-level gap as every
    other pack from this pass: no backfill_lexemes_nl_en.py run has actually
    happened against a real database yet.
    FRESH-CONTEXT REVIEW ADDENDUM (2026-07-06, zero access to any authoring
    reasoning): confirmed every lesson_content_key matches the correct lesson
    in en/a1_unit09_places.yaml; re-ran the standalone lexeme_matches()-
    replicating harness against the real iter_specs() output (0 count
    failures: place=5, place_non_hospital=4) and compiler practice-validate
    (0/0). Independently verified the place_non_hospital fix actually
    prevents the self-reference case (hospital is genuinely excluded from
    that tag's real candidate list) and that the full 'place' tag is only
    ever used where no second place could collide. No other self-reference,
    agreement, or homograph issues found; does not reuse the broad
    'number'/'count_plural' tags flagged as an open defect elsewhere.
    Upgrading to reviewed. 2026-07-06 matching_pairs widening (AUTHORING_GUIDE.md #16): expanded the place (noun) matching_pairs template from 2 to 5 pairs.
    Depth pass, 2026-07-07 (density audit, same night as the nl-en/fa-en/prs-en unit01 depth passes): unit09 was tied for shallowest in the nl-en direction at 10 templates. Added 5 new templates (10->15), all reusing the two tags this pack already established and verified (place, 5 members: bank/hospital/pharmacy/park/restaurant; place_non_hospital, 4 members: bank/pharmacy/park/restaurant) -- zero new tags, zero new Dutch glosses needed (all already in scripts/backfill_lexemes_nl_en.py's EN_TARGET_TO_NL_GLOSS since this unit's original authoring). lesson02 (location_prepositions) previously had only word_order + translation on place_non_hospital -- gained place_non_hospital_meaning (multiple_choice) and place_non_hospital_listen (listen_select), both safe at 4 candidates (meets the >=4 recognition-type floor), plus place_non_hospital_pair (matching_pairs, 4 pairs, per AUTHORING_GUIDE.md#16 -- the same 4-member pool lesson01's own place_pair already draws from a superset of, so this is a legitimate different-lesson-anchor variant, not a forced duplicate). lesson03 (asking_where) gained place_listen (listen_select) on the full place tag (5 members) -- lesson01 already established this exact tag/type combination elsewhere in the pack, reused here under a different lesson anchor the same way this pack's own lesson04 already reuses place_listen. lesson04 (asking_directions_dialogue) gained place_meaning (multiple_choice) on the full place tag, giving lesson04 a recognition-type alongside its existing listen_select/word_order. No self-reference risk in any addition (place_non_hospital already excludes 'hospital' from this pack's original design, reused unchanged; the full place tag was never anchored to a fixed place in any of these new frames -- each is a bare-word recognition frame, not a sentence embedding). Verified with scripts/_practice_slot_check.py (all touched slots at or above the relevant floor) and compile_content.py practice-validate, 0 errors/0 warnings. No fill_in_blank templates added (none of this unit's tags have a safe single-candidate or well-anchored multi-candidate fill_in_blank opportunity beyond the existing word_order templates, which stay as-is). Still carries this pack's own prior fresh-context review status -- a fresh re-review of specifically these 5 new templates has not happened yet."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [place, place_non_hospital]
slot_presets:
  place: &place {language_code: en, part_of_speech: noun, agreement_tags: {semantic: place}}
  place_non_hospital: &place_non_hospital {language_code: en, part_of_speech: noun, agreement_tags: {semantic: place_non_hospital}}
templates:
  - content_key: practice.nl-en.en.a1.unit09.lesson01.place_meaning.001
    lesson_content_key: en.a1.unit09.lesson01.common_places
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *place}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een plaats uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit09.lesson01.place_listen.002
    lesson_content_key: en.a1.unit09.lesson01.common_places
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *place}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is de plaats die je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit09.lesson01.place_pair.003
    lesson_content_key: en.a1.unit09.lesson01.common_places
    type: matching_pairs
    frame: {text: "Koppel de Engelse plaatsen aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
    slots: {first_place: *place, second_place: *place, third_place: *place, fourth_place: *place, fifth_place: *place}
    slot_relations: [{kind: distinct, slots: [first_place, second_place, third_place, fourth_place, fifth_place]}]
    answer_derivation: {kind: matching_pairs, slots: [first_place, second_place, third_place, fourth_place, fifth_place]}
    feedback_frame: {text: "Je hebt twee plaatsen gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit09.lesson01.place_translate.004
    lesson_content_key: en.a1.unit09.lesson01.common_places
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *place}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit09.lesson02.next_to_order.001
    lesson_content_key: en.a1.unit09.lesson02.location_prepositions
    type: word_order
    frame: {text: "The {item} is next to the hospital", language_code: en, direction: ltr}
    slots: {item: *place_non_hospital}
    answer_derivation: {kind: render_frame, frame: {text: "The {item} is next to the hospital", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de plaats naast het ziekenhuis in deze zin.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit09.lesson02.place_translate.003
    lesson_content_key: en.a1.unit09.lesson02.location_prepositions
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *place_non_hospital}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit09.lesson02.place_non_hospital_meaning.004
    lesson_content_key: en.a1.unit09.lesson02.location_prepositions
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *place_non_hospital}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een plaats uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit09.lesson02.place_non_hospital_listen.005
    lesson_content_key: en.a1.unit09.lesson02.location_prepositions
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *place_non_hospital}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is de plaats die je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit09.lesson02.place_non_hospital_pair.006
    lesson_content_key: en.a1.unit09.lesson02.location_prepositions
    type: matching_pairs
    frame: {text: "Koppel de Engelse plaatsen aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
    slots: {first_np_place: *place_non_hospital, second_np_place: *place_non_hospital, third_np_place: *place_non_hospital, fourth_np_place: *place_non_hospital}
    slot_relations: [{kind: distinct, slots: [first_np_place, second_np_place, third_np_place, fourth_np_place]}]
    answer_derivation: {kind: matching_pairs, slots: [first_np_place, second_np_place, third_np_place, fourth_np_place]}
    feedback_frame: {text: "Je hebt vier plaatsen gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit09.lesson03.where_is_order.001
    lesson_content_key: en.a1.unit09.lesson03.asking_where
    type: word_order
    frame: {text: "Where is the {item}", language_code: en, direction: ltr}
    slots: {item: *place}
    answer_derivation: {kind: render_frame, frame: {text: "Where is the {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de plaats waarnaar gevraagd wordt.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit09.lesson03.place_translate.003
    lesson_content_key: en.a1.unit09.lesson03.asking_where
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *place}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit09.lesson03.place_listen.004
    lesson_content_key: en.a1.unit09.lesson03.asking_where
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *place}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is de plaats die je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit09.lesson04.place_listen.001
    lesson_content_key: en.a1.unit09.lesson04.asking_directions_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *place}
