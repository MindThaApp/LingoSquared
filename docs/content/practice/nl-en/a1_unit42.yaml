schema_version: '1.0'
pack_key: practice.nl-en.a1.unit42
source_language: nl
target_language: en
unit_content_key: en.a1.unit42.personality
review:
  status: unreviewed
  fresh_context: false
  notes: 'Authored 2026-07-11, nl-en depth-completion sprint (see a1_unit30.yaml''s notes for the sprint context). 6-member
    ''personality_adj'' tag (all 6 lesson01 vocabulary items -- friendly/funny/hardworking/shy/calm/talkative, all adjectives)
    used both for bare-word recognition/matching AND a real generative frame, ''She is {item}.'' -- verified grammatical for
    every member as a predicate adjective (the unit''s own examples already use each one this way: ''My neighbor is very friendly.''/''My
    brother is really funny.''/''She is a hardworking employee.''/''He''s a little shy at first.''/''My mother is very calm.''/''My
    sister is very talkative.''). Extended scripts/_en_target_lexeme_common.py/scripts/backfill_lexemes_nl_en.py with every
    introduced_token this unit''s realization uses -- including a real cross-unit homograph: ''friendly'' was already classified
    adjective for unit32 (pets) and unit39 (neighborhood); reused unchanged here (same POS, same word), not redeclared. Every
    slot''s real candidate count verified with scripts/_practice_slot_check.py (6 distinct, above the >=3 floor). Needs the
    standard fresh-context review before import. FRESH-CONTEXT REVIEW ADDENDUM (2026-07-11, zero access to authoring reasoning):
    lesson_content_keys (lesson01.personality_vocabulary, lesson02.talking_about_someones_character) resolve to real lessons
    in en/a1_unit42_personality.yaml. personality_adj (6 members = vriendelijk/grappig/hardwerkend/verlegen/kalm/praatgraag,
    all distinct) drives frame ''She is {item}'', grammatical for every predicate adjective and matching the unit''s own examples;
    the cross-unit ''friendly'' homograph is reused unchanged (same adjective POS across units 32/39/42). No bare YAML booleans,
    no snake_case learner-facing leaks. Validation: compiler practice-validate 0/0 across the full 42-pack nl-en set, scripts/_practice_slot_check.py
    OK, backfill_lexemes_nl_en.py --dry-run clean. Upgrading to reviewed.

    DEAD-template re-authoring pass (2026-07-24, unit-scope satisfiability
    fix): scripts/_practice_unit_scope_check.py found BOTH matching_pairs
    templates DEAD -- personality_adj''s course-wide member list is 6
    (friendly/funny/hardworking/shy/calm/talkative), matching the original
    authoring note''s count, but "friendly" is introduced by unit32, not
    unit42, so it does not count at generate_checkpoint()''s unit-scoped
    pool -- leaving only 5 native members, one short of the 6-pair floor
    (same DO-NOT #2 pattern as the cross-unit reuse this file''s own notes
    describe). Fixed lesson01.match.003 by widening its slots to drop the
    semantic tag and constrain by part_of_speech: adjective only (recipe
    SS3.1c) -- unit42 natively introduces 12 distinct adjectives (the 5
    personality_adj members plus comfortable/relaxed from lesson03 and
    creative/upset/outgoing/organized/patient from lesson04), all clean
    non-confusable Dutch glosses, comfortably above the 6-pair floor.
    lesson01.match.003.volume_match.007 declared the IDENTICAL constraint
    (personality_adj, same 6 slots, same lesson anchor) -- widening it too
    would have produced a second matching_pairs sampling the exact same
    now-enlarged pool as match.003, which is the near-duplicate-content
    anti-pattern the recipe and a2_unit26''s own notes explicitly avoid, so
    it was DROPPED rather than duplicated (match.003 alone now covers
    lesson01''s structured-tier matching_pairs; no tier or lesson coverage is
    lost, since both templates anchored to the same lesson). Net effect: 2
    DEAD templates -> 1 fixed, 1 dropped as a genuine duplicate, viable
    checkpoint content increases (0 live matching_pairs -> 1 live
    matching_pairs). Re-verified 0 DEAD, 0 below-floor with
    scripts/_practice_unit_scope_check.py and 0 errors with
    compile_content.py practice-validate.


    POLISH 2026-07-25 (wave 2, tier-thinness + POS-only matching_pairs
    pass): (1) POS-ONLY MATCHING match.003 is LEFT POS-only, honestly: the
    only unit-native semantic tag, personality_adj, covers just 5 unit-scope
    tokens (friendly belongs to unit32) and the volume single on shy adds
    nothing new, so no semantic union of unit-native tags reaches the 6-pair
    floor -- exactly the situation the 2026-07-24 pass above already
    documented when it widened this template to part_of_speech adjective.
    (2) Tier-thinness: recognition had 2 live templates and production 2.
    Recognition += lesson04.choose.001 (multiple_choice over the 12
    adjectives the unit itself introduces, part_of_speech adjective only --
    12 distinct unit glosses, well above the 3-option floor; differs from
    choose.001 in pool). Production += lesson04.translate.001 (bare-word
    translation over the same 12 adjectives; POS-only is safe for bare
    translation because the prompt varies with the answer; all glosses
    distinct). Tiers now 3 recognition / 4 structured / 3 production live.

    POLISH 2026-07-26 (wave 3, generated-tag re-anchor pass): commit
    05af7ace added a generated unit-wide semantic tag (a1_unit42_personality,
    31 unit-scoped members across all 4 lessons) that resolves the wave-2
    honest-leave on lesson01.match.003 -- it was POS-only (part_of_speech:
    adjective, 12 unit tokens / 230 course-scope extras) because the only
    hand-authored tag (personality_adj) fell one short of the 6-pair floor.
    Re-anchored match.003 to semantic: a1_unit42_personality with
    part_of_speech narrowed to [noun, adjective] (drops verb to exclude the
    "relax"/"relaxed" duplicate-gloss pair, both glossing "ontspannen") --
    21 unit-scoped tokens, all distinct glosses, 0 course-scope extras
    (the generated tag is unit-scoped by construction). Verified with
    pool_check.py: unit 21/21 distinct, no course-scope EXTRA line.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - personality_adj
    - volume_nl_en_a1_unit42_item_01_single
    - a1_unit42_personality
slot_presets:
  personality_adj: &id001
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: personality_adj
  unit_adjective: &u42_adj
    language_code: en
    part_of_speech: adjective
templates:
- content_key: practice.nl-en.en.a1.unit42.lesson01.choose.001
  lesson_content_key: en.a1.unit42.lesson01.personality_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een woord uit deze les.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit42.lesson01.listen.002
  lesson_content_key: en.a1.unit42.lesson01.personality_vocabulary
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is het woord dat je hoorde.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit42.lesson01.match.003
  lesson_content_key: en.a1.unit42.lesson01.personality_vocabulary
  type: matching_pairs
  frame:
    text: '{first} · {second}'
    language_code: en
    direction: ltr
  slots:
    first: &id003 {language_code: en, part_of_speech: [noun, adjective], agreement_tags: {semantic: a1_unit42_personality}}
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Verbind elk woord met de Nederlandse betekenis.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit42.lesson01.translate.004
  lesson_content_key: en.a1.unit42.lesson01.personality_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De Engelse vertaling is {item}.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit42.lesson01.order.005
  lesson_content_key: en.a1.unit42.lesson01.personality_vocabulary
  type: word_order
  frame:
    text: She is {item}
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: She is {item}
      language_code: en
      direction: ltr
  feedback_frame:
    text: '{item} is de genoemde eigenschap.'
    language_code: nl
    direction: ltr
