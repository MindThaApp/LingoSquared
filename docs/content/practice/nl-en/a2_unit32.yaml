    language_code: en
    direction: ltr
  slots:
    first:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
    second:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
    third:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
    fourth:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
    fifth:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
    sixth:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
  slot_relations:
  - kind: distinct
    slots: &id003
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id003
  feedback_frame:
    text: Verbind elk woord met de juiste Nederlandse betekenis.
    language_code: nl
    direction: ltr
