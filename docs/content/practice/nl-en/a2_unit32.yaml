schema_version: '1.0'
pack_key: practice.nl-en.a2.unit32
source_language: nl
target_language: en
unit_content_key: en.a2.unit32.online_habits
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-07-23 (nl-en batch B). English target pool: 35 content-POS (noun/verb/adjective/adverb)
    lexemes across 4/4 lessons that carry any EN lexeme at all (this direction tests English; language_code=nl
    lexemes in the backfill are unrelated pollution from quoted-English-inside-Dutch-gloss parsing and
    were NOT used). Broad tag a2_unit32_online_habits unions the unit; each word_order/translation pair
    is additionally anchored per-lesson via that lessons own auto-tag for lesson stratification. word_order
    uses a single generic frame (Please say {item}.) deliberately: it is grammatical for any part of speech,
    has no candidate floor, and has zero self-reference risk (neither please nor say is ever a taught
    token in this unit). multiple_choice/listen_select clear the 3-distinct-value floor. matching_pairs
    clears the 6-distinct-token floor. Capacity is ample; see the coordinators report for the measured
    coverage numbers.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a2_unit32_online_habits
    - a2_unit32_online_habits_lesson01
    - a2_unit32_online_habits_lesson02
    - a2_unit32_online_habits_lesson03
templates:
- content_key: practice.nl-en.en.a2.unit32.lesson01.choose.001
  lesson_content_key: en.a2.unit32.lesson01.online_habits_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: &id001
      - adjective
      - adverb
      - noun
      - verb
      agreement_tags: &id002
        semantic: a2_unit32_online_habits
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een woord uit deze les.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a2.unit32.lesson04.listen.001
  lesson_content_key: en.a2.unit32.lesson04.online_habits_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is het woord dat je hoorde.'
    language_code: nl
