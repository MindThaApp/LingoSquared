    answer_derivation: {kind: render_frame, frame: {text: "It opens at {item} in the morning", language_code: en, direction: ltr}}
    feedback_frame: {text: "It opens at {item} in the morning betekent Het gaat om {item} uur 's ochtends open.", language_code: nl, direction: ltr}
