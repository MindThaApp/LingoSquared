schema_version: '1.0'
pack_key: practice.nl-en.a1.unit46
source_language: nl
target_language: en
unit_content_key: en.a1.unit46.lost_items
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-07-12 as an additive Endless Practice coverage backfill for nl-en A1 unit 46. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.

    POLISH 2026-07-26 (wave 3, generated-tag re-anchor pass): commit
    05af7ace added generated unit/lesson semantic tags. Re-anchored all 3
    POS-only matching_pairs and raised the two lesson01-anchored ones from
    4 to 6 slots: lesson01.match.002 -> semantic a1_unit46_lost_items
    (unit-wide, part_of_speech [noun, verb, adjective, adverb], 26 unit
    tokens, all distinct glosses). lesson01.match.002.volume_match.003 ->
    same unit-wide tag narrowed to part_of_speech: verb (8 tokens: ask/
    called/describe/holding/keep/lose/seen/told) -- distinct pool from
    match.002 (verb-only subset). lesson04.match.005 -> semantic
    a1_unit46_lost_items_lesson04 (16 tokens, its own lesson's content
    words, clears the floor alone) in place of the unit-wide tag to keep
    it distinct from the other two pools. Verified with pool_check.py: all
    three pools clear their floor with 0 course-scope extras (tags are
    unit-scoped by construction).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a1_unit46_lost_items
    - a1_unit46_lost_items_lesson04
slot_presets:
  unit_word:
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
templates:
- content_key: practice.nl-en.en.a1.unit46.lesson01.choose.001
  lesson_content_key: en.a1.unit46.lesson01.lost_items_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - symbol
      - noun
      - proper_noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
      agreement_tags:
        semantic: a1_unit46_lost_items
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Kies de betekenis van {item}.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit46.lesson01.match.002
  lesson_content_key: en.a1.unit46.lesson01.lost_items_vocabulary
  type: matching_pairs
  frame:
    text: '{first} — {second} — {third} — {fourth} — {fifth} — {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: &u46_unit {language_code: en, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: a1_unit46_lost_items}}
    second: *u46_unit
    third: *u46_unit
    fourth: *u46_unit
    fifth: *u46_unit
    sixth: *u46_unit
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each word with its meaning.
    language_code: en
    direction: ltr
