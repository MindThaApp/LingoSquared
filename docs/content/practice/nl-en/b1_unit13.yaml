schema_version: '1.0'
pack_key: practice.nl-en.b1.unit13
source_language: nl
target_language: en
unit_content_key: en.b1.unit13.relative_clauses
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-22 (nl-en practice pass, fresh context; 0 fixes). All frames, answers, pools, POS filters and Dutch feedback checked; no pack change needed. NATIVE FLAGS: see log. BACKFILL GLOSS FLAGS: works=komt uit (werkt), desk=balie (bureau), used=gebruikte (used to sense); coworker and colleague both plain collega, never in the same pool. Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md as part of the nl-en B1 unit02-unit14
    practice-pack wave (batch C) that unblocks these units'' checkpoints (units already had lexemes from
    scripts/backfill_lexemes_nl_en.py but no pack, so generate_checkpoint() returned checkpoint_unavailable).
    12 templates across all 4 lessons: 1xfill_in_blank, 1xlisten_select, 2xmatching_pairs, 4xmultiple_choice,
    3xtranslation, 1xword_order. This is a grammar unit (AUTHORING recipe §8.1): recognition (multiple_choice/listen_select)
    and production (translation) slots use the unit-wide union tag ''b1_unit13_relative_clauses'' (OR-matched
    across all 4 lessons'' own per-lesson tags) narrowed by part_of_speech to [noun, verb, adjective,
    adverb] so no function word or proper noun becomes an answer/option; matching_pairs (x2, anchored
    lesson03 reading and lesson04 dialogue) pools the same union tag, always >=18 distinct content tokens
    so the 6-pair floor is comfortably cleared. word_order and fill_in_blank each use a single-member
    anchor (narrow per-lesson tag + part_of_speech, verified to have exactly 1 course-wide candidate,
    confirmed unique to this unit''s own lesson -- not reused at any other CEFR level) so each hero sentence
    renders deterministically; both hero sentences were re-read against their slot''s course-wide (whole
    nl-en B1 course) candidate pool and confirmed to have exactly 1 member, and neither frame''s literal
    text contains that slot''s own candidate word (defect 1.14). Every gloss in every pool was read against
    this unit''s own realization content (recipe §0.1); no mis-glossed lexeme was found for this unit.
    Needs the standard fresh-context review before import. Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 12 templates against the real unit pools (practice_dump) and the en b1_unit13 realization. 3 defects fixed. (1) Mis-glossed lexeme `works` -> ''komt uit'' (lesson03 verb; the unit teaches ''works with several people'' = werkt) was in every union pool and would be shown/accepted as the correct meaning. (2) `coworker` -> ''collega'' (lesson01) and `colleague` -> ''de collega'' (lesson02) shared one union pool, so an MC could offer both ''collega'' and ''de collega'' (distractor also correct) and a matching_pairs could pair both (interchangeable rights). Fix for (1)+(2): the single union tag was replaced by three narrower slot pools -- lesson01.choose/translate use the lesson01 tag with [noun, verb] (approved, downtown, coworker, studies); lesson03.choose/match/translate use [lesson02, lesson03] with [noun, adjective, adverb] (20 tokens, excludes works); lesson01.listen, lesson02.choose and lesson04.choose/match/translate use [lesson02, lesson04] with all content POS (30 tokens); lesson01/lesson03 tags added to tag_schema. Cost: lesson03 verbs meets/approve/eats/finishing/has already lose pack coverage until `works` is re-glossed in the backfill (then the union can be restored). (3) lesson04.fill.001 frame ''Our new office is ___ than the old one.'' accepted any comparative (bigger/nicer...) but graded only ''smaller'' -- reworded to ''Her old office was not as big as ours. It was much ___ than ours.'' (dialogue fact: her old office was much smaller than ours), feedback updated with Dutch ''Haar oude kantoor was niet zo groot als het onze. Het was veel kleiner dan het onze.'' DEFERRED (backfill lane): `works` gloss should be ''werkt''; `desk` -> ''balie'' (counter) while the unit means an office desk = ''het bureau'' (kept in pool: not false, but wrong sense); `march` citation form is lowercase (should display ''March''); coworker/colleague both translate to ''collega'', so the bare-word translation of either can mark the synonym wrong (engine one-answer limit). No native-judgment flags.'
