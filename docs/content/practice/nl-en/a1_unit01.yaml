schema_version: '1.0'
pack_key: practice.nl-en.a1.unit01
source_language: nl
target_language: en
unit_content_key: en.a1.unit01.greetings
review:
  status: reviewed
  fresh_context: true
  notes: 'Fresh-context review (2026-07-06, zero access to any authoring reasoning for this pack). Verified: every lesson_content_key
    matches the correct lesson in en/a1_unit01_greetings.yaml (not just any key anywhere in content root); ran a standalone
    harness importing scripts/backfill_lexemes_nl_en.py''s iter_specs() and replicating app/practice/service.py''s exact lexeme_matches()/_requested_matches()
    logic against every slot in every template -- all pools now meet or knowingly fall short of the >=4 (multiple_choice/listen_select)
    / >=1 (other types) bar; read every template''s frame text against its full candidate list by hand for self-reference,
    agreement, and non-interchangeable-synonym risks (the bug classes this project has repeatedly caught). Found and fixed
    two real bugs the compiler''s practice-validate cannot catch (it never touches real lexeme data or frame-text shape):
    (1) lesson01''s greeting_fill.002 and lesson03''s wellbeing_fill.002 both authored frame.text as nothing but the slot
    placeholder itself (''{greeting}''/''{wellbeing_answer}'') with zero surrounding text -- per AUTHORING_GUIDE.md#13, masking
    a bare-slot frame leaves only ''___'', and build_prompt()''s fill_in_blank branch explicitly rejects any instance where
    the blanked text has nothing left, so both templates could never generate a single real exercise, 100% of the time. Fixed
    by converting greeting_fill.002 to listen_select (renamed greeting_listen.002; greeting_word pool has exactly the required
    4 candidates: bye/goodbye/hello/hi) and wellbeing_fill.002 to translation (renamed wellbeing_translate.002, mirroring
    the existing greeting_translate/farewell_translate pattern; needs only >=1 candidate). One known, verified, accepted limitation
    left as-is rather than force-fixed: lesson03''s wellbeing_meaning.001 (multiple_choice) has only 3 real candidates (bad/fine/okay)
    against this project''s usual >=4 convention for recognition types -- this is A1 unit01''s genuine full vocabulary for
    this semantic category (the only other candidate, ''good'' from ''I''m good, thanks.'', carries no wellbeing_answer tag
    in the shared scripts/_en_target_lexeme_common.py classifier, and broadening the pack-side tag request to compensate would
    pull in semantically wrong distractors like ''nice'' with false feedback text) -- confirmed via the harness that all 3
    glosses are distinct so the real engine''s actual >=3 minimum (options dedup check in build_prompt) is met and the exercise
    generates correctly every time, just with less distractor variety than the norm; fixing the root cause needs a classifier-level
    tag change outside this review''s scope (docs/content/practice/nl-en/, docs/BUILD_LOG.md, scripts/practice_manifest.txt
    only). No self-reference, capitalization-leak, homograph, or agreement issues found elsewhere in this pack. Re-ran compile_content.py
    practice-validate (0/0) and the standalone harness after both fixes to confirm. 2026-07-06 matching_pairs widening (AUTHORING_GUIDE.md
    #16): expanded the greeting (noun) matching_pairs template from 2 to 4 pairs. Depth pass, 2026-07-07 (density audit: nl-en
    unit01 was the shallowest pack in the direction at 9 templates, mirroring the same-night fa-en/prs-en unit01 depth passes
    which used the identical shared English-target realization/classifier -- fa-en unit01 went 8->17). Added 8 new templates
    (9->17), all real vocabulary already present in scripts/_en_target_lexeme_common.py''s shared classifier, glossed for
    Dutch in scripts/backfill_lexemes_nl_en.py''s existing EN_TARGET_TO_NL_GLOSS (every token needed -- morning/afternoon/evening/day/night,
    thanks/thank/nice/welcome/yes/no, my/your/what/what''s/i''m/i/am/is/are, goodbye/bye/see/later/then -- was already present;
    zero new Dutch glosses needed). New slot_presets added, mirroring fa-en''s a1_unit01.yaml exactly (same underlying English
    realization/tag_schema, only the gloss/feedback language differs): time_period ({morning,afternoon,evening,day,night},
    POS noun, 5 candidates, glosses ochtend/middag/avond/dag/nacht -- all distinct), politeness ({thanks,thank,nice,welcome,yes,no},
    POS [noun,verb,adjective,particle], 6 candidates, glosses bedankt/danken/leuk/welkom/ja/nee -- all distinct), identity
    ({my,your,what,what''s,i''m,i,am,is,are}, POS [pronoun,verb] -- deliberately excludes ''name'' (noun), 9 candidates, glosses
    mijn/jouw-of-uw/wat/wat is/ik ben/ik/ben/is/bent -- all distinct), wellbeing_question (POS adverb, exactly 1 real A1 candidate
    ''how'' -- the blank in wellbeing_question_fill is unambiguous by construction, confirmed with scripts/_fill_in_blank_ambiguity_check.py:
    0 AMBIGUOUS flags), farewell ({goodbye,bye,see,later,then}, POS [noun,verb,adverb], 5 candidates) and farewell_word (same
    set minus verb ''see'', POS [noun,adverb], 4 candidates -- used only in the new matching_pairs template, mirroring fa-en''s
    farewell/farewell_word split exactly). lesson01 gained time_period_gloss (multiple_choice, previously declared in this
    pack''s own tag_schema but never used by any template). lesson03 gained politeness_gloss (multiple_choice) and politeness_listen
    (listen_select) on the broader politeness preset (the pre-existing politeness_translate.003, scoped only to the narrower
    ''thanks'' preset, was left untouched); identity_choose (multiple_choice, new preset); and wellbeing_question_fill (fill_in_blank,
    ''{item} are you?'', this pack''s first fill_in_blank). Checked for the exact fine/okay Dutch-gloss-collision bug class
    the fa-en/prs-en depth passes explicitly flagged: unlike Farsi/Dari, Dutch does NOT collapse fine/okay/bad to the same
    gloss (goed/oke/slecht -- all three distinct), so no rework was needed on this pack''s existing wellbeing_meaning.001
    (3 candidates, already reviewed and accepted) for that reason. lesson05 gained farewell_meaning (multiple_choice), farewell_pair
    (matching_pairs, 4 pairs on farewell_word, per AUTHORING_GUIDE.md#16), and farewell_listen (listen_select) on the broader
    farewell preset -- the pre-existing farewell_order.001 (word_order on ''see'' alone) and farewell_translate.003 (translation
    on ''later'' alone) were left untouched since they''re already narrowly and correctly scoped. Verified with scripts/_practice_slot_check.py
    (all touched slots at or above the relevant floor), scripts/_fill_in_blank_ambiguity_check.py (0 new AMBIGUOUS flags),
    and compile_content.py practice-validate, 0 errors/0 warnings. Still carries this pack''s own prior fresh-context review
    status -- a fresh re-review of specifically these 8 new templates has not happened yet.

    UNIT-SCOPE DEAD-TEMPLATE FIX (2026-07-24, per docs/content/PRACTICE_PACK_RECIPE.md): scripts/_practice_unit_scope_check.py
    flagged 13 DEAD template-slots + 4 below-floor. Verified against a standalone iter_specs() dump of this unit''s real
    lexemes (27 tokens) that ''dialogue_word'' and ''extended_family'' -- both declared in this pack''s own tag_schema and
    used by lesson01.variety_dialogue_pair.903 / variety_family_pair.904 -- have ZERO unit01-scoped members (dialogue_word is
    only ever classified starting at unit02; extended_family only at unit06), so both templates had 0 candidates on every
    slot and could never generate at checkpoint time. Not pack-fixable (would need a new backfill classification for unit01
    itself, which this pack cannot author) -- DROPPED both and removed their now-dead presets (dialogue_noun/extended_family)
    from slot_presets and their tags from tag_schema. LOGGED for the coordinator: if a checkpoint-visible dialogue-vocabulary
    or family-vocabulary exercise is ever wanted for unit01 specifically, backfill_lexemes_nl_en.py needs new unit01-native
    lexeme tagging.

    Also DEAD: lesson05.farewell_pair.005 (farewell_word preset excluded verb POS, so its unit-scoped pool was only 3 --
    goodbye/bye/later -- against 4 declared slots) and lesson03.variety_politeness_pair.902 (politeness preset had only 2
    unit-scoped members -- thanks/nice -- against 6 declared slots). Fix for both, per the recipe''s union technique (SS3.1a):
    lesson03''s politeness/wellbeing_answer/identity tags are ALL taught in the same lesson03 (wellbeing) and none of their
    real English glosses overlap (bedankt/leuk/goed/slecht/oke/bent/ik ben -- 7 distinct), so I widened the shared
    ''politeness'' preset (id005) to the union of those three tags (also adding pronoun to part_of_speech for i''m) --
    this single change brought lesson03.politeness_gloss.004 and politeness_listen.005 up from 2 to 7 distinct candidates
    (fixing their below-floor MC/listen_select flags) and variety_politeness_pair.902 up from 2 to 7 (fixing its DEAD
    matching_pairs, now 6 declared slots against a 7-member pool) in one edit. Softened variety_politeness_pair.902''s frame
    text from ''beleefde Engelse woorden'' (polite English words) to ''de Engelse woorden uit deze les'' (the English words
    from this lesson) since the widened pool includes fine/bad/okay/are/i''m alongside the two genuinely polite words --
    the narrower claim would have been misleading now that the pool is broader. Also repointed lesson03.identity_choose.006
    (was 2 unit-scoped candidates -- are/i''m -- below the MC floor) onto the same widened id005 preset rather than
    maintaining a separate narrow ''identity'' preset (id006, now unused but left defined in case a future author wants
    the narrower pool back).

    For lesson01/lesson05''s greeting+farewell matching_pairs: rather than independently widening BOTH greeting_pair.004
    and the now-DEAD farewell_pair.005 to the same union (which would have made them literal duplicates -- unit01''s entire
    greeting/farewell vocabulary is only 6 words total: hello/hi/goodbye/bye/see/later, all distinct glosses hallo/hoi/tot
    ziens/doei/zien/later), I widened ONLY greeting_pair.004 to a new union preset (greeting_farewell, id015: semantic
    [greeting, farewell], POS [noun, verb, adverb]) at the full 6 pairs (was 4, below the recipe''s 6-pair standard) and
    DROPPED farewell_pair.005 outright rather than ship a second matching_pairs template presenting the identical 6-word
    pool under a different label. lesson05 stays fully viable in the structured tier via farewell_order.001 (word_order)
    and its volume_fill.002 (fill_in_blank), both untouched and already live.

    Net template count: 26 -> 23 (dropped variety_dialogue_pair.903, variety_family_pair.904, farewell_pair.005; no
    replacements needed since the pack was comfortably above every tier floor even before the DEAD fixes -- recognition 9,
    structured 9, production 5 after all changes). Re-verified 0 DEAD via scripts/_practice_unit_scope_check.py and 0 errors
    via compile_content.py practice-validate.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - greeting
    - time_period
    - farewell
    - wellbeing_question
    - wellbeing_answer
    - politeness
    - identity
    - person_name
    - volume_nl_en_a1_unit01_see_02_single
    - volume_nl_en_a1_unit01_item_03_single
    - volume_nl_en_a1_unit01_item_05_single
    person:
    - first
    - second
    - third
    register:
    - formal
    - informal
slot_presets:
  greeting_word: &id001
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: greeting
  wellbeing_answer: &id003
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: wellbeing_answer
  thanks: &id004
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: politeness
  see: &id008
    language_code: en
    part_of_speech: verb
    agreement_tags:
      semantic: farewell
  later: &id009
    language_code: en
    part_of_speech: adverb
    agreement_tags:
      semantic: farewell
  time_period: &id002
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: time_period
  politeness: &id005
    language_code: en
    part_of_speech:
    - noun
    - verb
    - adjective
    - particle
    - pronoun
    agreement_tags:
      semantic:
      - politeness
      - wellbeing_answer
      - identity
  identity: &id006
    language_code: en
    part_of_speech:
    - pronoun
    - verb
    agreement_tags:
      semantic: identity
  wellbeing_question: &id007
    language_code: en
    part_of_speech: adverb
    agreement_tags:
      semantic: wellbeing_question
  farewell: &id010
    language_code: en
    part_of_speech:
    - noun
    - verb
    - adverb
    agreement_tags:
      semantic: farewell
  farewell_word: &id011
    language_code: en
    part_of_speech:
    - noun
    - adverb
    agreement_tags:
      semantic: farewell
  greeting_farewell: &id015
    language_code: en
    part_of_speech:
    - noun
    - verb
    - adverb
    agreement_tags:
      semantic:
      - greeting
      - farewell
  practice_word: &id014
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
    agreement_tags: {}
