schema_version: "1.0"
pack_key: practice.nl-en.a1.unit01
source_language: nl
target_language: en
unit_content_key: en.a1.unit01.greetings
review:
  status: unreviewed
  fresh_context: true
  notes: "Fresh-context Codex review (2026-07-05, dispatched by Session 3): replaced English feedback mislabeled as Dutch with natural Dutch, removed overly broad slot constraints producing invalid outputs (e.g. 'Hello morning', 'I am a library'), reworked matching pairs into genuine same-category pairs, removed a non-generating multiple_choice template and a pointless name-to-identical-name match. Independently re-verified by Session 3: compiler 0/0, no jargon leaks, no self-referential English glosses. Status left unreviewed pending human sign-off, per project convention -- Session 3 does not self-certify review status."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [greeting, time_period, farewell, wellbeing_question, wellbeing_answer, politeness, identity, person_name, dialogue_word]
    person: [first, second, third]
    register: [formal, informal]
slot_presets:
  greeting_word: &greeting_word {language_code: en, part_of_speech: noun, agreement_tags: {semantic: greeting}}
  wellbeing_answer: &wellbeing_answer {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: wellbeing_answer}}
  thanks: &thanks {language_code: en, part_of_speech: noun, agreement_tags: {semantic: politeness}}
  see: &see {language_code: en, part_of_speech: verb, agreement_tags: {semantic: farewell}}
  later: &later {language_code: en, part_of_speech: adverb, agreement_tags: {semantic: farewell}}
templates:
  # Lesson 1: everyday greetings and farewells.
  - content_key: practice.nl-en.en.a1.unit01.lesson01.greeting_meaning.001
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: multiple_choice
    frame: {text: "{greeting}", language_code: en, direction: ltr}
    slots: {greeting: *greeting_word}
    answer_derivation: {kind: slot_gloss, slot: greeting}
    feedback_frame: {text: "{greeting} is een begroeting of een afscheid.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit01.lesson01.greeting_fill.002
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: fill_in_blank
    frame: {text: "{greeting}", language_code: en, direction: ltr}
    slots: {greeting: *greeting_word}
    answer_derivation: {kind: slot_text, slot: greeting}
    feedback_frame: {text: "Zo spel je {greeting} in het Engels.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit01.lesson01.greeting_translate.003
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: translation
    frame: {text: "{greeting}", language_code: nl, direction: ltr, slot_rendering: {greeting: english_gloss}}
    slots: {greeting: *greeting_word}
    answer_derivation: {kind: slot_text, slot: greeting}
    feedback_frame: {text: "De Engelse vertaling is {greeting}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit01.lesson01.greeting_pair.004
    lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
    type: matching_pairs
    frame: {text: "Koppel de Engelse woorden aan de Nederlandse betekenissen.", language_code: nl, direction: ltr}
    slots: {first_greeting: *greeting_word, second_greeting: *greeting_word}
    slot_relations: [{kind: distinct, slots: [first_greeting, second_greeting]}]
    answer_derivation: {kind: matching_pairs, slots: [first_greeting, second_greeting]}
    feedback_frame: {text: "Je hebt twee begroetingen of afscheidswoorden gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}

  # Lesson 3: wellbeing exchange.
  - content_key: practice.nl-en.en.a1.unit01.lesson03.wellbeing_meaning.001
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: multiple_choice
    frame: {text: "{wellbeing_answer}", language_code: en, direction: ltr}
    slots: {wellbeing_answer: *wellbeing_answer}
    answer_derivation: {kind: slot_gloss, slot: wellbeing_answer}
    feedback_frame: {text: "{wellbeing_answer} komt voor in een antwoord op de vraag hoe het gaat.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit01.lesson03.wellbeing_fill.002
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: fill_in_blank
    frame: {text: "{wellbeing_answer}", language_code: en, direction: ltr}
    slots: {wellbeing_answer: *wellbeing_answer}
    answer_derivation: {kind: slot_text, slot: wellbeing_answer}
    feedback_frame: {text: "Zo spel je {wellbeing_answer} in het Engels.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit01.lesson03.politeness_translate.003
    lesson_content_key: en.a1.unit01.lesson03.wellbeing
    type: translation
    frame: {text: "{thanks}", language_code: nl, direction: ltr, slot_rendering: {thanks: english_gloss}}
    slots: {thanks: *thanks}
    answer_derivation: {kind: slot_text, slot: thanks}
    feedback_frame: {text: "Met {thanks} bedank je iemand.", language_code: nl, direction: ltr}

  # Lesson 5: friendly closings.
  - content_key: practice.nl-en.en.a1.unit01.lesson05.farewell_order.001
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: word_order
    frame: {text: "later you {see}", language_code: en, direction: ltr}
    slots: {see: *see}
    answer_derivation: {kind: render_frame, frame: {text: "{see} you later", language_code: en, direction: ltr}}
    feedback_frame: {text: "De juiste volgorde is {see} you later.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit01.lesson05.farewell_fill.002
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: fill_in_blank
    frame: {text: "See you {later}.", language_code: en, direction: ltr}
    slots: {later: *later}
    answer_derivation: {kind: slot_text, slot: later}
    feedback_frame: {text: "De volledige zin is See you {later}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit01.lesson05.farewell_translate.003
    lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
    type: translation
    frame: {text: "{later}", language_code: nl, direction: ltr, slot_rendering: {later: english_gloss}}
    slots: {later: *later}
    answer_derivation: {kind: slot_text, slot: later}
    feedback_frame: {text: "De Engelse vertaling is {later}.", language_code: nl, direction: ltr}
