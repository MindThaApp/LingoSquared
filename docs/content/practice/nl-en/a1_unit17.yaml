schema_version: "1.0"
pack_key: practice.nl-en.a1.unit17
source_language: nl
target_language: en
unit_content_key: en.a1.unit17.plans
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-05 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en direction, continuing past
    the coordinator's requested 11-16 range into 17+ as content kept
    growing). Keyed to English target lexemes extended into the shared
    scripts/_en_target_lexeme_common.py plus this pair's own Dutch glosses
    added to scripts/backfill_lexemes_nl_en.py. Same deliberate scope
    decision as unit14 lesson02/unit16 lesson01: lesson01 (proposing an
    activity: 'Do you want to see a movie...?'/'Would you like to go for a
    walk?') gets ZERO generated templates -- neither invitation phrase
    mentions a specific day/time/place that could vary, and none of this
    lesson's other vocabulary (want/movie/weekend/would/walk) has a
    same-lesson synonym group. The other three lessons all reuse the
    already-established 7-member 'weekday' tag (unit04) -- genuinely apt
    here since this whole unit is about scheduling: 'I'm busy on {item}.'
    (lesson02), 'Do you want to have lunch on {item}?' (lesson03), '{item}
    works for me.' (lesson04) are all grammatical with any weekday. Every
    slot's real candidate count was verified with the same standalone
    lexeme_matches()-replicating harness used for every other pack this
    pass. The underlying en realization unit17 is itself UNREVIEWED (Codex
    was usage-limited at authoring time), same as the nl-en overlay. Needs
    the standard fresh-context review before import (both realization and
    this practice pack). Same blocking DB-level gap as every other pack from
    this pass: no backfill_lexemes_nl_en.py run has actually happened
    against a real database yet."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [weekday]
slot_presets:
  weekday: &weekday {language_code: en, part_of_speech: noun, agreement_tags: {semantic: weekday}}
templates:
  - content_key: practice.nl-en.en.a1.unit17.lesson02.busy_order.001
    lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
    type: word_order
    frame: {text: "I'm busy on {item}", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "I'm busy on {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de dag waarop het druk is.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit17.lesson02.busy_fill.002
    lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
    type: fill_in_blank
    frame: {text: "I'm busy on {item}.", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} is de dag waarop het druk is.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit17.lesson02.busy_translate.003
    lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
    type: translation
    frame: {text: "Ik heb het druk op {item}.", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "I'm busy on {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "I'm busy on {item} betekent Ik heb het druk op {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit17.lesson02.weekday_listen.004
    lesson_content_key: en.a1.unit17.lesson02.accepting_and_declining
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is de dag die je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit17.lesson03.lunch_order.001
    lesson_content_key: en.a1.unit17.lesson03.reading_an_invitation
    type: word_order
    frame: {text: "Do you want to have lunch on {item}", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "Do you want to have lunch on {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de voorgestelde dag voor de lunch.", language_code: nl, direction: ltr}
