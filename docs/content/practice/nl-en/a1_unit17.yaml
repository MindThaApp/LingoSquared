review:
  status: reviewed
  fresh_context: true
  notes: 'Authored 2026-07-05 by the Claude session syncing Endless Practice template pools to lesson content growth (nl-en
    direction, continuing past the coordinator''s requested 11-16 range into 17+ as content kept growing). Keyed to English
    target lexemes extended into the shared scripts/_en_target_lexeme_common.py plus this pair''s own Dutch glosses added
    to scripts/backfill_lexemes_nl_en.py. Same deliberate scope decision as unit14 lesson02/unit16 lesson01: lesson01 (proposing
    an activity: ''Do you want to see a movie...?''/''Would you like to go for a walk?'') gets ZERO generated templates --
    neither invitation phrase mentions a specific day/time/place that could vary, and none of this lesson''s other vocabulary
    (want/movie/weekend/would/walk) has a same-lesson synonym group. The other three lessons all reuse the already-established
    7-member ''weekday'' tag (unit04) -- genuinely apt here since this whole unit is about scheduling: ''I''m busy on {item}.''
    (lesson02), ''Do you want to have lunch on {item}?'' (lesson03), ''{item} works for me.'' (lesson04) are all grammatical
    with any weekday. Every slot''s real candidate count was verified with the same standalone lexeme_matches()-replicating
    harness used for every other pack this pass. The underlying en realization unit17 is itself UNREVIEWED (Codex was usage-limited
    at authoring time), same as the nl-en overlay. Needs the standard fresh-context review before import (both realization
    and this practice pack). Same blocking DB-level gap as every other pack from this pass: no backfill_lexemes_nl_en.py run
    has actually happened against a real database yet. FRESH-CONTEXT REVIEW ADDENDUM (2026-07-06, zero access to any authoring
    reasoning): confirmed every lesson_content_key matches the correct lesson in en/a1_unit17_plans.yaml; re-ran the standalone
    lexeme_matches()-replicating harness against the real iter_specs() output (0 count failures, weekday=7 for all templates)
    and compiler practice-validate (0/0). Read every frame against its full candidate list -- all grammatical for every weekday.
    The lesson01 zero-templates decision is sound. No self-reference, agreement, or homograph issues found; does not reuse
    the broad ''number''/''count_plural'' tags flagged as an open defect elsewhere. Upgrading this pack to reviewed (the underlying
    realization being unreviewed is a separate, unresolved dependency noted above, not something this review can resolve).

    Deepened 2026-07-07 (templates-per-unit audit found this unit tied-shallowest in nl-en at 8, alongside sibling fa-en/prs-en''s
    identical unit17 tied at the same count and deepened the same night -- mirrored their additions here with fresh Dutch,
    not copied Farsi/Dari). weekday (7 members) is the only genuinely generative tag this unit supports (confirmed above:
    none of this unit''s other single-token vocabulary -- want/movie/weekend/would/walk/love/busy/maybe/another/ lunch/1pm/works
    -- has its own semantic group). Added 3 new templates, all reusing weekday with exercise TYPES this unit hadn''t used
    yet (word_order/translation/listen_select already existed at 2-3 lessons each; multiple_choice/matching_pairs did not):
    a lesson03 listen_select (parity fix -- lesson02/04 already had one, lesson03 didn''t), a lesson04 multiple_choice (bare-word
    Dutch-gloss recognition), and a lesson04 matching_pairs using all 7 weekday members (AUTHORING_GUIDE.md #16 -- exactly
    the ''6-12 real pairs'' range, not padded). No new EN_POS/semantic-tag or Dutch-gloss additions needed -- weekday was
    already fully classified/glossed since unit04 (confirmed by re-reading scripts/_en_target_lexeme_common.py and scripts/backfill_lexemes_nl_en.py
    fresh before this edit). Considered fill_in_blank for weekday (e.g. blanking ''I''m busy on {item}'') but rejected it:
    all 7 weekdays are genuinely grammatical in every one of this unit''s real frames with nothing else to disambiguate --
    scripts/_fill_in_blank_ambiguity_check.py (and compile_content.py''s hard-fail per AUTHORING_GUIDE.md #17) would correctly
    flag it, so zero new fill_in_blank templates, matching this direction''s own established ''zero is fine when real vocabulary
    can''t safely support one'' precedent. Re-verified scripts/_practice_slot_check.py (weekday still safely >=3 for the new
    multiple_choice, >=2 for matching_pairs) and scripts/_fill_in_blank_ambiguity_check.py (zero new AMBIGUOUS flags) before
    import. New count: 11 templates (8 -> 11) -- an honest ceiling given weekday is the unit''s only real generative tag.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - weekday
slot_presets:
  weekday: &id001
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: weekday
