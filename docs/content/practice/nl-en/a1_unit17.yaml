schema_version: '1.0'
pack_key: practice.nl-en.a1.unit17
source_language: nl
target_language: en
unit_content_key: en.a1.unit17.plans
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (nl-en practice pass, fresh context; fixes below). (1) all bare-word choose/listen/translate: pool -- untagged unit_word preset narrowed to the unit tag a1_unit17_plans (was whole-A1 vocabulary). (2) lesson02 order.002/003: feedback -- Dutch reworded (drukt hier de voorkeur uit). NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: love glossed graag willen (unit19 overlay says dol zijn op); see log. Previous notes follow.

    REBUILT 2026-07-24 (DEAD-template remediation pass, PACK-ONLY). Every one
    of the previous 12 templates was constrained to the 'weekday' semantic
    tag (established in unit04), and unit17 itself introduces ZERO
    weekday-tagged lexemes -- scripts/_practice_unit_scope_check.py confirmed
    all 12 templates (18 slot-level DEAD lines, counting matching_pairs'
    7 slots individually) had 0 unit-scoped candidates, so the checkpoint
    could never generate a single item from this pack. This is recipe
    DO-NOT #2 (slot constrained to vocabulary taught in an EARLIER unit).

    Verified unit17's own lexeme pool via iter_specs filtered on
    '.a1.unit17.': 12 lexemes across 4 lessons (lesson01
    proposing_an_activity: want/movie/weekend/would/walk; lesson02
    accepting_and_declining: love/busy/maybe/another; lesson03
    reading_an_invitation: lunch/1pm; lesson04
    negotiating_a_plan_dialogue: works). None of these share a
    pre-existing semantic tag with each other (this unit is a grab-bag of
    scheduling/invitation phrases, not a vocabulary-cluster unit), so no
    RE-ANCHOR to an existing narrow tag was possible without a backfill
    change. Per recipe SS3.1(c)/SS8.1, dropped the semantic constraint
    entirely for all bare-word (no-literal-frame-text) templates and used
    part_of_speech: [noun, verb, adjective, adverb] over the unit's own
    12-lexeme pool instead -- safe because multiple_choice/listen_select/
    bare-word translation/matching_pairs carry no course-scope
    grammaticality requirement (the prompt is either a single word or
    varies with the answer). Read every gloss in this pool (SS0.1): want
    -> willen, movie -> film, weekend -> weekend, would -> zou, walk ->
    wandeling, love -> graag willen, busy -> druk, maybe -> misschien,
    another -> een andere, lunch -> lunch, 1pm -> "1 uur 's middags",
    works -> komt uit. All 12 distinct, none mis-glossed against
    en/a1_unit17_plans.yaml's actual taught content (confirmed against the
    realization file directly).

    For the structured tier, reused the pre-existing course-wide
    'preference_verb_full' tag (like/love/prefer/hate, verified via
    iter_specs at course scope '.a1.') for two new word_order templates in
    lesson02 -- legal because 'love' is unit17's OWN lesson02 lexeme, so
    the unit-scoped pool is non-empty (word_order has no candidate floor).
    Checked COURSE-SCOPE grammaticality by hand for all 4 members in both
    new frames: "I'd {item} to see a movie." -> I'd like/love/prefer/hate
    to see a movie (all grammatical); "I'd {item} to go for a walk." ->
    same check, all grammatical. Both frames also directly extend the
    unit's own taught phrase ("Sure, I'd love to!"), so they stay
    pedagogically anchored to lesson02 even though the pool's other 3
    members are introduced elsewhere.

    New template count: 12 (was 12, all dead; now 12, all live) -- 5
    recognition (multiple_choice x3, listen_select x2), 3 structured
    (matching_pairs x1, word_order x2), 4 production (bare-word
    translation x4). All 4 lessons represented in at least one template.
    Verified with scripts/_practice_unit_scope_check.py: 0 DEAD, 0
    below-floor for this pack (multiple_choice/listen_select pool = 12
    distinct unit-scoped tokens, well above the 3-floor; matching_pairs
    pool = 12 distinct tokens for 6 declared slots). Verified compiler
    practice-validate 0 errors. Honestly thin unit (12 lexemes, no shared
    semantic cluster) -- did not pad with untaught or other-unit
    vocabulary; the two word_order templates are the only place this pack
    reaches outside its own 12 lexemes, and only for the semantic TAG
    (not the actual candidate, which stays unit-scoped to 'love').

    WAVE-3 RE-ANCHOR 2026-07-26: commit 05af7ace generated the unit-scoped semantic tag
    a1_unit17_plans, resolving the earlier blocker (this pack's own 2026-07-24 note) that
    unit17's 12 lexemes shared no pre-existing semantic tag. Re-anchored match.003's
    untagged POS-only unit_word pool (which pulled 1574 off-theme words at Endless-Practice
    course scope) to the new pair_word preset (same [noun, verb, adjective, adverb] filter
    + semantic: a1_unit17_plans) -- token set is unchanged (all 12 of unit17's own lexemes,
    all pairwise-distinct glosses), pool now identical at unit and course scope. Already at
    the 6-pair floor with 12 candidates available, no widening needed. The bare-word
    multiple_choice/listen_select/translation templates keep the untagged unit_word preset
    per dispatch scope. Verified via pool_check.py (12/12, 0 course extras), practice-
    validate 0 errors, unit-scope check 0 DEAD.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 12 templates against unit and course pools (frame grammar for like/love/prefer/hate in the two I'd {item} to ... word_order frames, slot_gloss answers, MC/listen distinct options, matching_pairs glosses, translation single-answer fit, self-reference, jargon, booleans, feedback truth). 1 fixed: lesson01/02/04 choose.001 feedback said {item} is een woord uit deze les although the untagged unit_word pool draws the whole A1 course in Endless Practice; now {item} is een woord dat je hebt geleerd. Deferred (lexeme-level): 1pm (gloss 1 uur 's middags) as a bare-word translation answer rejects 1 p.m. / one pm; maybe and might (unit39) share gloss misschien, ambiguous course-scope translation prompt (systemic).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - preference_verb_full
    - a1_unit17_plans
slot_presets:
  unit_word: &unit_word
    language_code: en
    part_of_speech: [noun, verb, adjective, adverb]
    agreement_tags:
      semantic: a1_unit17_plans
  preference_verb_full: &preference_verb_full
    language_code: en
    part_of_speech: verb
    agreement_tags:
      semantic: preference_verb_full
  # pair_word (wave 3): the generated unit-scoped tag a1_unit17_plans (commit
  # 05af7ace) narrowed to the same content POS as unit_word -- exactly the
  # same 12 tokens unit_word already produced (want/movie/weekend/would/walk/
  # love/busy/maybe/another/lunch/1pm/works) at BOTH unit and course scope,
  # so match.003 below no longer pulls the whole level's vocabulary (1574
  # off-theme extras) at Endless-Practice course scope. Used ONLY for
  # match.003; the other unit_word-anchored bare-word templates are out of
  # wave-3 scope.
  pair_word: &pair_word
    language_code: en
    part_of_speech: [noun, verb, adjective, adverb]
    agreement_tags:
      semantic: a1_unit17_plans
templates:
- content_key: practice.nl-en.en.a1.unit17.lesson01.choose.001
  lesson_content_key: en.a1.unit17.lesson01.proposing_an_activity
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *unit_word
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een woord dat je hebt geleerd.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit17.lesson01.listen.002
  lesson_content_key: en.a1.unit17.lesson01.proposing_an_activity
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *unit_word
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is het woord dat je hoorde.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit17.lesson01.match.003
  lesson_content_key: en.a1.unit17.lesson01.proposing_an_activity
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *pair_word
    second: *pair_word
    third: *pair_word
    fourth: *pair_word
    fifth: *pair_word
    sixth: *pair_word
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Verbind elk woord met de Nederlandse betekenis.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit17.lesson01.translate.004
  lesson_content_key: en.a1.unit17.lesson01.proposing_an_activity
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *unit_word
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De Engelse vertaling is {item}.
    language_code: nl
    direction: ltr
