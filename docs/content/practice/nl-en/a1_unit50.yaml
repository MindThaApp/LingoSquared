unit_content_key: en.a1.unit50.accommodation
review:
  status: reviewed
  fresh_context: "true"
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md for the nl-en a1_unit50 vocabulary unit. Recognition (multiple_choice, listen_select) and production (translation bare-word) templates use the unit-wide semantic tag `a1_unit50_accommodation` (all lessons unioned, POS-restricted to noun/verb/adjective/adverb, language_code en) anchored per lesson -- the recipe SS8.1 pattern -- so every recognition/production slot clears the >=3-distinct-value floor even where an individual lesson is thin; measured 21 distinct unit-wide content lexemes with zero duplicate english_gloss values (checked by hand against the real backfill_lexemes_nl_en.py output before writing). matching_pairs also draws on the unit-wide tag (6 pairs). Structured tier is carried primarily by matching_pairs (bare frame, no literal text, so no course-scope grammaticality risk per recipe SS1.1) plus one fill_in_blank single-member anchor per SS6.5 where the real lexeme dump yielded exactly one course-wide candidate for its lesson+part_of_speech combination (verified before writing the frame). word_order was used only where lesson01s own verb pool is uniformly a bare infinitive form (this units per-lesson tags cannot exclude a single mixed-conjugation member, recipe SS3.1b) and skipped elsewhere in this batch for that reason; the structured-tier floor is still met via matching_pairs alone. Lessons with zero en-language lexemes in the real backfill output are not anchored (recipe SS0: a lesson with no lexemes cannot be represented in the checkpoint regardless of pack content).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 15 templates (4 multiple_choice, 4 listen_select, 4 translation, 2 matching_pairs, 1 fill_in_blank) against the real unit/course lexeme pools; the content-POS pool (17 lexemes) has distinct, non-confusable Dutch glosses, the fill_in_blank (The receptionist gives you a key.) renders grammatically with one candidate and only taught words, no jargon or boolean issues. 0 pack defects fixed. DEFERRED (lexeme-gloss, backfill_lexemes_nl_en.py): loved 'vond prachtig' -- as a translation prompt a learner naturally answers found beautiful / liked, graded wrong (suggest 'hield van; vond prachtig'); view 'het uitzicht; de visie' carries an off-context second sense. No native-judgment flags.
