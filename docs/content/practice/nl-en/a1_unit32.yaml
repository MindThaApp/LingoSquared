review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-22 (nl-en practice pass, fresh context; (1) lesson04.choose.001: pool -- verb slot was untagged (85 course verbs at endless scope), now lesson04 tag (named/watch/swim). 1 fix. NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: still=toch should be nog steeds. Authored 2026-07-11, nl-en depth-completion sprint (see a1_unit30.yaml''s notes for the sprint context). 4-member
    ''pet_animal'' tag (dog/cat/fish/bird, all nouns) -- deliberately excludes the lesson''s 5th vocabulary item, ''pet''
    itself (the generic hypernym), since including it in the same recognition set would let matching pairs/multiple_choice
    offer the category word alongside its own members. Frame ''I have a {item}.'' verified grammatical for all 4 (each is
    a singular countable noun with a consonant-initial sound, safe with ''a''; also directly matches the unit''s own taught
    sentence, lesson01.exercise04.order_dog_sentence''s tested_text ''I have a dog.''). Extended scripts/_en_target_lexeme_common.py/scripts/backfill_lexemes_nl_en.py
    with every introduced_token this unit''s realization uses. Every slot''s real candidate count verified with scripts/_practice_slot_check.py
    (4 distinct, above the >=3 floor). Needs the standard fresh-context review before import. FRESH-CONTEXT REVIEW ADDENDUM
    (2026-07-11, zero access to authoring reasoning): lesson_content_keys (lesson01.pet_vocabulary, lesson02.describing_pets)
    resolve to real lessons in en/a1_unit32_animals.yaml. pet_animal (dog/cat/fish/bird = hond/kat/vis/vogel) correctly excludes
    the hypernym ''pet''. Frame ''I have a {item}'' is grammatical for all 4 consonant-initial nouns and matches lesson01''s
    ''I have a dog.''. All glosses accurate and mutually distinct. No bare YAML booleans, no snake_case learner-facing leaks.
    Validation: compiler practice-validate 0/0 across the full 42-pack nl-en set, scripts/_practice_slot_check.py OK, backfill_lexemes_nl_en.py
    --dry-run clean. Upgrading to reviewed.


    Polish wave 2 (2026-07-25, tier-thinness): recognition and production tiers each had only 2 live templates (<3 floor,
    recipe SS8). Added lesson04.choose.001 (multiple_choice over the unit''s own verb pool, part_of_speech: verb with no
    semantic tag -- unit32''s verbs (likes/loves/named/watch/swim) carry no semantic tags in the backfill, so a semantic
    union is not available; unit-scoped pool is 5 tokens / 4 distinct glosses, above the 3-option floor; bare {item}
    frame so POS-only is safe) and lesson04.translate.002 (NL sentence prompt ''Wij kijken naar de {item}.'' with gloss
    rendering over pet_animal, EN render_frame answer ''We watch the {item}'' -- ''watch'' is lesson04''s own vocab;
    pet_animal is exactly dog/cat/fish/bird course-wide, all grammatical and sensible in the frame, all de-words in the
    NL prompt). Both tiers now at 3 live.'
