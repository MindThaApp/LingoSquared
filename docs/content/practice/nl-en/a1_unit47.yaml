schema_version: '1.0'
pack_key: practice.nl-en.a1.unit47
source_language: nl
target_language: en
unit_content_key: en.a1.unit47.appointments
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-12 as an additive Endless Practice coverage backfill for nl-en A1 unit 47. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.

    POLISH 2026-07-26 (wave 3, generated-tag re-anchor pass): commit
    05af7ace added a generated unit-wide semantic tag (a1_unit47_appointments,
    16 unit-scoped members; no lesson alone clears the 6-pair floor, so all
    three matching_pairs use it, differentiated by part_of_speech
    narrowing). Re-anchored all 3 POS-only matching_pairs and raised the
    two lesson01-anchored ones from 4 to 6 slots: lesson01.match.002 ->
    part_of_speech [noun, verb, adjective, adverb] (16 unit tokens, all
    distinct glosses). lesson01.match.002.volume_match.002 -> narrowed to
    part_of_speech: noun (7 tokens: appointment/changes/checkup/dentist/
    receptionist/service/vet) -- distinct pool from match.002.
    lesson04.match.005 -> narrowed to part_of_speech: [verb, adjective] (8
    tokens: available/confirm/reschedule/confirmed/seems/due/yearly/
    nervous) -- distinct pool from both siblings (verb/adjective-only
    subset, no overlap with the noun-only volume set). Verified with
    pool_check.py: all three pools clear their floor with 0 course-scope
    extras (tag is unit-scoped by construction) and no duplicate glosses.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a1_unit47_appointments
slot_presets:
  unit_word:
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
templates:
- content_key: practice.nl-en.en.a1.unit47.lesson01.choose.001
  lesson_content_key: en.a1.unit47.lesson01.appointments_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - symbol
      - noun
      - proper_noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
      agreement_tags:
        semantic: a1_unit47_appointments
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Kies de betekenis van {item}.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit47.lesson01.match.002
  lesson_content_key: en.a1.unit47.lesson01.appointments_vocabulary
  type: matching_pairs
  frame:
    text: '{first} — {second} — {third} — {fourth} — {fifth} — {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: &u47_unit {language_code: en, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: a1_unit47_appointments}}
    second: *u47_unit
    third: *u47_unit
    fourth: *u47_unit
    fifth: *u47_unit
    sixth: *u47_unit
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each word with its meaning.
    language_code: en
    direction: ltr
- content_key: practice.nl-en.en.a1.unit47.lesson01.translate.003
