schema_version: '1.0'
pack_key: practice.nl-en.a1.unit47
source_language: nl
target_language: en
unit_content_key: en.a1.unit47.appointments
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: true
  notes: >-
    Review 2026-10-22 (nl-en practice pass, fresh context; (7 fixes). translate.003, volume_translate.002, lesson02.translate.006: pool -- narrowed to nouns and adjectives (confirmed, seems, lately are not unique translations). match.002, volume_match.002, lesson04.match.005: Dutch -- English feedback now Dutch. volume_match.002 text block Dutch. NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: none beyond cognates (service, receptionist) which make bare translation prompts trivial. 

    Authored 2026-07-12 as an additive Endless Practice coverage backfill for nl-en A1 unit 47. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.

    POLISH 2026-07-26 (wave 3, generated-tag re-anchor pass): commit
    05af7ace added a generated unit-wide semantic tag (a1_unit47_appointments,
    16 unit-scoped members; no lesson alone clears the 6-pair floor, so all
    three matching_pairs use it, differentiated by part_of_speech
    narrowing). Re-anchored all 3 POS-only matching_pairs and raised the
    two lesson01-anchored ones from 4 to 6 slots: lesson01.match.002 ->
    part_of_speech [noun, verb, adjective, adverb] (16 unit tokens, all
    distinct glosses). lesson01.match.002.volume_match.002 -> narrowed to
    part_of_speech: noun (7 tokens: appointment/changes/checkup/dentist/
    receptionist/service/vet) -- distinct pool from match.002.
    lesson04.match.005 -> narrowed to part_of_speech: [verb, adjective] (8
    tokens: available/confirm/reschedule/confirmed/seems/due/yearly/
    nervous) -- distinct pool from both siblings (verb/adjective-only
    subset, no overlap with the noun-only volume set). Verified with
    pool_check.py: all three pools clear their floor with 0 course-scope
    extras (tag is unit-scoped by construction) and no duplicate glosses.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 9 templates against the real pools (the generated a1_unit47_appointments tag is unit-only, so course scope equals unit scope), every gloss against the unit47 realization, all three matching_pairs pools for confusable glosses, YAML booleans and jargon. 2 defects fixed: lesson01.translate.003 and lesson01.translate.003.volume_translate.002 (bare-word translation) used the all-POS preset list, so their pool included you'd (prompt je zou), dog's (van de hond), max's (van Max) and 3pm (15.00 uur). Those prompts are underdetermined against the single graded answer: you would, the dog's / of the dog, 3 p.m. / 3 o'clock are all correct and would be marked wrong. Narrowed both to part_of_speech [noun, verb, adjective, adverb] (same pool as lesson02.translate.006: 16 unit content words, all distinct glosses). Recognition templates (choose.001, volume_listen.002) keep the full pool -- options there remain unambiguous. Deferred (backfill lane): the token max's is stored lowercase, so multiple_choice displays max's instead of Max's. No native-judgment flags.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a1_unit47_appointments
slot_presets:
  unit_word:
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
