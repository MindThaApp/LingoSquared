- content_key: practice.nl-en.en.a1.unit47.lesson01.choose.001
  lesson_content_key: en.a1.unit47.lesson01.appointments_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - symbol
      - noun
      - proper_noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
      agreement_tags:
        semantic: a1_unit47_appointments
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Kies de betekenis van {item}.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit47.lesson01.match.002
  lesson_content_key: en.a1.unit47.lesson01.appointments_vocabulary
  type: matching_pairs
