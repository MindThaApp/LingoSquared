schema_version: "1.0"
pack_key: practice.nl-en.a1.unit19
source_language: nl
target_language: en
unit_content_key: en.a1.unit19.preferences
review:
  status: reviewed
  fresh_context: 'true'
  notes: "Authored 2026-07-05 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en direction, continuing
    past the coordinator's requested 11-16 range). Keyed to English target
    lexemes extended into the shared scripts/_en_target_lexeme_common.py
    plus this pair's own Dutch glosses added to scripts/backfill_lexemes_nl_en.py.
    Added a narrower 'preference_verb_full' tag (like/prefer/love/hate, 4
    members) separate from the 5-member 'preference_verb' (like/don't/
    prefer/love/hate) for the 'I {item} tea/coffee.' frames -- 'don't' is an
    auxiliary needing a following verb ('I don't tea.' is not a sentence),
    so the full 5-member set (including the bare 'don't' lexeme, whose
    introduced_tokens entry really represents 'don't like' as taught) is
    used only for bare-word recognition, never embedded in a sentence.
    Every slot's real candidate count was verified with the same standalone
    lexeme_matches()-replicating harness used for every other pack this
    pass. The underlying en realization unit19 is itself UNREVIEWED (Codex
    was usage-limited at authoring time), same as the nl-en overlay. Needs
    the standard fresh-context review before import. Same blocking DB-level
    gap as every other pack from this pass: no backfill_lexemes_nl_en.py
    run has actually happened against a real database yet.
    FRESH-CONTEXT REVIEW ADDENDUM (2026-07-06, zero access to any authoring
    reasoning): confirmed every lesson_content_key matches the correct
    lesson in en/a1_unit19_preferences.yaml; re-ran the standalone
    lexeme_matches()-replicating harness against the real iter_specs()
    output (0 count failures: preference_verb=5, preference_verb_full=4)
    and compiler practice-validate (0/0). Confirmed 'don't' is genuinely
    excluded from preference_verb_full's real candidate list, so 'I {item}
    tea/coffee.' is grammatical for all four of like/prefer/love/hate. No
    self-reference, agreement, or homograph issues found; does not reuse
    the broad 'number'/'count_plural' tags flagged as an open defect
    elsewhere. Upgrading this pack to reviewed (the underlying realization
    being unreviewed is a separate, unresolved dependency noted above, not
    something this review can resolve). 2026-07-06 matching_pairs widening (AUTHORING_GUIDE.md #16): expanded the preference_verb (verb) matching_pairs template from 2 to 5 pairs.

    DEAD-template remediation 2026-07-24 (PACK-ONLY, scripts/_practice_unit_scope_check.py):
    'preference_verb' has only 2 unit-scoped members at unit19 (prefer,
    hate -- 'like'/'don't'/'love' all belong to OTHER units, unit07/unit06/
    unit17), below the 3-floor for multiple_choice/listen_select and below
    the declared 5 for matching_pairs (which had only 2 -> DEAD). Recipe
    fix SS3.1(c)/DO-NOT#2: dropped the semantic constraint on the
    recognition-tier item slot to plain part_of_speech: verb
    (unit19_verb preset) for verb_meaning.001, verb_listen.002,
    lesson02.verb_listen.004, lesson03.verb_meaning.004,
    lesson04.verb_listen.001 -- unit19's own verb pool is
    prefer/hate/think/prefers/thinks (5 distinct glosses: de voorkeur
    geven aan/haten/denken/geeft de voorkeur aan/denkt), clearing the
    3-floor. Widened verb_pair.003's pool to part_of_speech:
    [verb, adjective, adverb] (unit19_content_word preset, no semantic
    tag) and bumped 5 declared slots to 6 to reach the AUTHORING_GUIDE #16
    6-pair floor -- unit19's own pool for this widened constraint is 9
    distinct tokens (prefer, hate, think, prefers, thinks, calmer, strong,
    very, why), all distinct glosses, no confusable pairs. Left the
    lesson01.verb_translate.004 (translation, no floor) and the four
    word_order/translation templates using preference_verb_full alone --
    those were never flagged (translation/word_order have no candidate
    floor and 'prefer'/'hate' already satisfy them at unit scope).
    Verified 0 DEAD / 0 below-floor via
    scripts/_practice_unit_scope_check.py and compiler practice-validate
    0 errors after the fix.

    POLISH wave 3 2026-07-25 (re-anchor POS-only matcher to the generated
    unit tag from commit 05af7ace): verb_pair.003's unit19_content_word
    preset gained agreement_tags semantic: a1_unit19_preferences (the
    generated unit-scoped tag), keeping the part_of_speech
    [verb, adjective, adverb] content filter. Unit pool unchanged at 9
    distinct tokens/9 distinct glosses (prefer, hate, think, prefers,
    thinks, calmer, strong, very, why), but the course-scope pool now
    equals the unit pool -- the Endless-Practice off-theme pull wave 2
    could not fix (no usable semantic tags then) is eliminated, 0
    course-scope extras per pool_check.py. Gloss guard eyeballed:
    prefer/prefers and think/thinks glosses differ by inflection
    (de voorkeur geven aan / geeft de voorkeur aan, denken/denkt),
    tellable apart; no duplicate glosses.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 13 templates against unit and course pools. 2 fixed: (1) lesson01.verb_translate.004 used the preference_verb pool, which at course scope contains don't (gloss niet leuk vinden), so the prompt niet leuk vinden demanded the bare answer don't and rejected don't like / dislike; slot switched to preference_verb_full (like/love/prefer/hate; unit pool unchanged prefer/hate). (2) verb_meaning.001/.004 feedback called every candidate a voorkeurswerkwoord although the untagged verb pool includes think/thinks and the whole A1 verb list; now {item} is een woord dat je hebt geleerd. Deferred (lexeme-level, not worked around): love carries gloss graag willen (unit17 I'd love to sense) while unit19 teaches love as houden van (I love my family), so the course-scope I {item} tea/coffee word_order hint reads I graag willen tea for love; don't carries gloss niet leuk vinden (still shown as the MC/listen answer for don't via the untagged verb pool at course scope)."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [preference_verb, preference_verb_full, a1_unit19_preferences]
slot_presets:
  preference_verb: &preference_verb {language_code: en, part_of_speech: verb, agreement_tags: {semantic: preference_verb}}
  preference_verb_full: &preference_verb_full {language_code: en, part_of_speech: verb, agreement_tags: {semantic: preference_verb_full}}
  unit19_verb: &unit19_verb {language_code: en, part_of_speech: verb}
  unit19_content_word: &unit19_content_word {language_code: en, part_of_speech: [verb, adjective, adverb], agreement_tags: {semantic: a1_unit19_preferences}}
templates:
  - content_key: practice.nl-en.en.a1.unit19.lesson01.verb_meaning.001
    lesson_content_key: en.a1.unit19.lesson01.like_and_dislike_verbs
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit19_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord dat je hebt geleerd.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson01.verb_listen.002
    lesson_content_key: en.a1.unit19.lesson01.like_and_dislike_verbs
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit19_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson01.verb_pair.003
    lesson_content_key: en.a1.unit19.lesson01.like_and_dislike_verbs
    type: matching_pairs
    frame: {text: "Koppel de Engelse woorden aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
    slots: {first_verb: *unit19_content_word, second_verb: *unit19_content_word, third_verb: *unit19_content_word, fourth_verb: *unit19_content_word, fifth_verb: *unit19_content_word, sixth_verb: *unit19_content_word}
    slot_relations: [{kind: distinct, slots: [first_verb, second_verb, third_verb, fourth_verb, fifth_verb, sixth_verb]}]
    answer_derivation: {kind: matching_pairs, slots: [first_verb, second_verb, third_verb, fourth_verb, fifth_verb, sixth_verb]}
    feedback_frame: {text: "Je hebt de woorden gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson01.verb_translate.004
    lesson_content_key: en.a1.unit19.lesson01.like_and_dislike_verbs
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson02.tea_order.001
    lesson_content_key: en.a1.unit19.lesson02.asking_about_preferences
    type: word_order
    frame: {text: "I {item} tea", language_code: en, direction: ltr}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: render_frame, frame: {text: "I {item} tea", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de voorkeur die wordt uitgedrukt.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson02.verb_full_translate.003
    lesson_content_key: en.a1.unit19.lesson02.asking_about_preferences
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson02.verb_listen.004
    lesson_content_key: en.a1.unit19.lesson02.asking_about_preferences
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit19_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson03.coffee_order.001
    lesson_content_key: en.a1.unit19.lesson03.reading_a_preference_message
    type: word_order
    frame: {text: "I {item} coffee", language_code: en, direction: ltr}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: render_frame, frame: {text: "I {item} coffee", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de voorkeur die in deze tekst wordt uitgedrukt.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson03.verb_full_translate.003
    lesson_content_key: en.a1.unit19.lesson03.reading_a_preference_message
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson03.verb_meaning.004
    lesson_content_key: en.a1.unit19.lesson03.reading_a_preference_message
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit19_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord dat je hebt geleerd.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson04.verb_listen.001
    lesson_content_key: en.a1.unit19.lesson04.preference_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit19_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson04.tea_order.002
    lesson_content_key: en.a1.unit19.lesson04.preference_dialogue
    type: word_order
    frame: {text: "I {item} tea", language_code: en, direction: ltr}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: render_frame, frame: {text: "I {item} tea", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de voorkeur in dit gesprek.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson04.verb_full_translate.004
    lesson_content_key: en.a1.unit19.lesson04.preference_dialogue
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
