schema_version: "1.0"
pack_key: practice.nl-en.a1.unit19
source_language: nl
target_language: en
unit_content_key: en.a1.unit19.preferences
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-05 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en direction, continuing
    past the coordinator's requested 11-16 range). Keyed to English target
    lexemes extended into the shared scripts/_en_target_lexeme_common.py
    plus this pair's own Dutch glosses added to scripts/backfill_lexemes_nl_en.py.
    Added a narrower 'preference_verb_full' tag (like/prefer/love/hate, 4
    members) separate from the 5-member 'preference_verb' (like/don't/
    prefer/love/hate) for the 'I {item} tea/coffee.' frames -- 'don't' is an
    auxiliary needing a following verb ('I don't tea.' is not a sentence),
    so the full 5-member set (including the bare 'don't' lexeme, whose
    introduced_tokens entry really represents 'don't like' as taught) is
    used only for bare-word recognition, never embedded in a sentence.
    Every slot's real candidate count was verified with the same standalone
    lexeme_matches()-replicating harness used for every other pack this
    pass. The underlying en realization unit19 is itself UNREVIEWED (Codex
    was usage-limited at authoring time), same as the nl-en overlay. Needs
    the standard fresh-context review before import. Same blocking DB-level
    gap as every other pack from this pass: no backfill_lexemes_nl_en.py
    run has actually happened against a real database yet."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [preference_verb, preference_verb_full]
slot_presets:
  preference_verb: &preference_verb {language_code: en, part_of_speech: verb, agreement_tags: {semantic: preference_verb}}
  preference_verb_full: &preference_verb_full {language_code: en, part_of_speech: verb, agreement_tags: {semantic: preference_verb_full}}
templates:
  - content_key: practice.nl-en.en.a1.unit19.lesson01.verb_meaning.001
    lesson_content_key: en.a1.unit19.lesson01.like_and_dislike_verbs
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *preference_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een voorkeurswerkwoord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson01.verb_listen.002
    lesson_content_key: en.a1.unit19.lesson01.like_and_dislike_verbs
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *preference_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson01.verb_pair.003
    lesson_content_key: en.a1.unit19.lesson01.like_and_dislike_verbs
    type: matching_pairs
    frame: {text: "Koppel de Engelse woorden aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
    slots: {first_verb: *preference_verb, second_verb: *preference_verb}
    slot_relations: [{kind: distinct, slots: [first_verb, second_verb]}]
    answer_derivation: {kind: matching_pairs, slots: [first_verb, second_verb]}
    feedback_frame: {text: "Je hebt twee voorkeurswoorden gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson01.verb_translate.004
    lesson_content_key: en.a1.unit19.lesson01.like_and_dislike_verbs
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *preference_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit19.lesson02.tea_order.001
    lesson_content_key: en.a1.unit19.lesson02.asking_about_preferences
    type: word_order
    frame: {text: "I {item} tea", language_code: en, direction: ltr}
    slots: {item: *preference_verb_full}
    answer_derivation: {kind: render_frame, frame: {text: "I {item} tea", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de voorkeur die wordt uitgedrukt.", language_code: nl, direction: ltr}
