schema_version: '1.0'
pack_key: practice.nl-en.a1.unit35
source_language: nl
target_language: en
unit_content_key: en.a1.unit35.technology
review:
  status: unreviewed
  fresh_context: false
  notes: 'Authored 2026-07-11, nl-en depth-completion sprint (see a1_unit30.yaml''s notes for the sprint context). Two tags:
    ''device_noun'' (all 6 lesson01 vocabulary items -- phone/laptop/ tablet/computer/app/camera, all nouns) for bare-word
    recognition/ matching, and a narrower 5-member ''device_noun_a'' (excludes ''app'') for the generative frame ''I have
    a {item}.'' -- ''app'' needs the vowel-initial article ''an'' (''an app''), which would make the shared frame ungrammatical
    for that one member (''I have a app.''), same article-agreement discipline as unit23''s existing occupation_a/ occupation_noun
    split. Extended scripts/_en_target_lexeme_common.py/scripts/backfill_lexemes_nl_en.py with every introduced_token this
    unit''s realization uses. Every slot''s real candidate count verified with scripts/_practice_slot_check.py (device_noun:
    6, device_noun_a: 5, both above the >=3 floor). Needs the standard fresh-context review before import. FRESH-CONTEXT REVIEW
    ADDENDUM (2026-07-11, zero access to authoring reasoning): lesson_content_keys (lesson01.device_vocabulary, lesson02.using_your_phone)
    resolve to real lessons in en/a1_unit35_technology.yaml. device_noun (6 members) and device_noun_a (excludes vowel-initial
    ''app'') have distinct glosses. Frame ''I have a {item}'' is grammatical for every device_noun_a member -- the a/an article
    discipline (dropping ''app'') is correct. No bare YAML booleans, no snake_case learner-facing leaks. Validation: compiler
    practice-validate 0/0 across the full 42-pack nl-en set, scripts/_practice_slot_check.py OK, backfill_lexemes_nl_en.py
    --dry-run clean. Upgrading to reviewed.

    DEAD-template re-authoring pass (2026-07-24, unit-scope satisfiability fix):
    scripts/_practice_unit_scope_check.py found 2 DEAD templates -- both were
    fine in Endless Practice (course-scoped) but had 0 candidates at
    generate_checkpoint()''s unit-scoped pool. (1) lesson01.match.003
    (matching_pairs) needed 6 distinct fills but device_noun''s unit-scoped
    pool is only 5 (laptop/tablet/computer/app/camera) -- widened the slot to
    drop the semantic tag and constrain by part_of_speech: noun only (recipe
    SS3.1c), pulling from unit35''s own 20-noun pool; updated the feedback text
    from "elk apparaat" (each device) to the generic "elk woord" since the
    pool is no longer device-only. (2) lesson02''s
    translate.001.volume_fill.004 (fill_in_blank) was anchored to
    volume_nl_en_a1_unit35_item_04_single, a single-member tag whose ONLY
    course-wide member is "phone" -- but "phone" is introduced by unit03 (and
    reused in unit32/b1unit01), never reintroduced as a new token in unit35
    itself, so the unit-scoped pool was 0 -- textbook DO-NOT #2. No other
    existing tag anchors a unit35-native single-candidate token (device_noun_a
    has 5 members, too many for fill_in_blank without interchangeable:true,
    and these devices are not synonyms), so pack-only re-anchoring is not
    possible; DROPPED the template (lesson02 keeps its structured-tier
    coverage via the existing volume_order.002 word_order template, so no
    tier is lost). Re-verified 0 DEAD, 0 below-floor with
    scripts/_practice_unit_scope_check.py and 0 errors with
    compile_content.py practice-validate.


    Polish wave 2 (2026-07-25, tier-thinness + POS-only matching audit): recognition and production tiers each had only
    2 live templates (<3 floor, recipe SS8). Added lesson02.choose.002 (multiple_choice over unit35''s own verb pool,
    part_of_speech: verb with no semantic tag -- the unit''s 12 verbs (call/uses/reads/make/send/text/sends/download/
    downloads/use/tries/chat) carry no semantic tags in the backfill, so no semantic union is available; 12 unit-scoped
    tokens / 12 distinct glosses, well above the 3-option floor; bare {item} frame so POS-only is safe) and
    lesson04.translate.001 (bare-word translation over the same POS-only verb pool -- recipe SS3.1(c) explicitly blesses
    POS-only for bare-word translation; all 12 unit-scoped glosses distinct, no ambiguous typed prompts at unit scope).
    Both tiers now at 3 live. match.003 POS-only audit: left POS-only DELIBERATELY -- the only semantic tags unit35''s
    lexemes carry are device_noun/device_noun_a, whose unit-scoped union is 5 distinct tokens
    (laptop/tablet/computer/app/camera), below the 6 declared matching slots, so no unit-native semantic union can
    satisfy the template; per the polish rubric the bare part_of_speech: noun constraint stays.
    [wave-3 amendment: that blocker is RESOLVED -- commit 05af7ace''s generated tags now cover every content word;
    see below.]


    POLISH wave 3 2026-07-26 (re-anchor POS-only matcher to the generated tags from commit 05af7ace): match.003''s
    six slots gained agreement_tags semantic: a1_unit35_technology_lesson01 (the generated LESSON tag -- the template
    is anchored to lesson01.device_vocabulary, and the lesson tag alone clears the floor), keeping part_of_speech:
    noun. Lesson tag chosen over the unit-wide a1_unit35_technology deliberately per the wave-3 gloss guard: the
    unit-wide noun pool contains the near-duplicate singular/plural pairs app/apps, laptop/laptops, map/maps
    (glosses app/apps, laptop/laptops, kaart/kaarten -- confusable right-hand sides, and ''app''/''laptop'' are baked
    into ''apps''/''laptops''). The lesson01 noun pool has none of those: app, books, camera, computer, home, laptop,
    mom, photos, tablet -- 9 distinct tokens, 9 distinct glosses, on-theme (device vocabulary). Course scope now
    equals unit scope (0 course-scope extras per pool_check.py), ending the Endless-Practice off-theme noun pull.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - device_noun
    - device_noun_a
    - a1_unit35_technology_lesson01
slot_presets:
  device_noun: &id001
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: device_noun
  device_noun_a: &id002
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: device_noun_a
templates:
- content_key: practice.nl-en.en.a1.unit35.lesson01.choose.001
  lesson_content_key: en.a1.unit35.lesson01.device_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een apparaat uit deze les.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit35.lesson01.listen.002
  lesson_content_key: en.a1.unit35.lesson01.device_vocabulary
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is het woord dat je hoorde.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit35.lesson01.match.003
  lesson_content_key: en.a1.unit35.lesson01.device_vocabulary
  type: matching_pairs
  frame:
    text: '{first} · {second}'
    language_code: en
    direction: ltr
  slots:
    first: &id003 {language_code: en, part_of_speech: noun, agreement_tags: {semantic: a1_unit35_technology_lesson01}}
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Verbind elk woord met de Nederlandse betekenis.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit35.lesson01.translate.004
  lesson_content_key: en.a1.unit35.lesson01.device_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De Engelse vertaling is {item}.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit35.lesson01.order.005
  lesson_content_key: en.a1.unit35.lesson01.device_vocabulary
  type: word_order
  frame:
