  answer_derivation:
    kind: render_frame
    frame:
      text: I have a {item}
      language_code: en
      direction: ltr
  feedback_frame:
    text: '{item} is het genoemde apparaat.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit35.lesson02.translate.001
