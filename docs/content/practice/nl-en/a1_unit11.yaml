schema_version: "1.0"
pack_key: practice.nl-en.a1.unit11
source_language: nl
target_language: en
unit_content_key: en.a1.unit11.weather
review:
  status: reviewed
  fresh_context: true
  notes: "Authored 2026-07-05 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en direction, per the
    coordinator's scope split). Keyed to English target lexemes extended into
    the shared scripts/_en_target_lexeme_common.py plus this pair's own Dutch
    glosses added to scripts/backfill_lexemes_nl_en.py. The 6-member
    'weather_condition' tag (sunny/rainy/cloudy/cold/hot/windy, all
    adjectives) is safely swappable into every frame it's used in
    ('It's {item}', 'It will be {item} tomorrow') since English weather
    adjectives don't inflect for number/gender -- no agreement trap here,
    unlike several earlier units. Reused two already-verified tags from
    earlier units for cross-lesson recognition variety: 'weekday' (unit04,
    7 members) for 'It will rain on {item}.', and 'place' (unit09, 5
    members) for 'Let's go to the {item}.' -- both grammatically safe with
    every member, no self-reference or agreement risk (unlike unit09's own
    hospital-anchored frames). Every slot's real candidate count was
    verified with the same standalone lexeme_matches()-replicating harness
    used for every other pack this pass. Unlike every other unit synced so
    far this pass, the underlying en realization unit11 itself is
    UNREVIEWED (Codex was usage-limited at authoring time) -- flagging this
    explicitly since it's a step lower in stability than units 3-10, which
    all had a reviewed realization underneath an unreviewed overlay. Needs
    the standard fresh-context review before import (both the underlying
    realization and this practice pack). Same blocking DB-level gap as
    every other pack from this pass: no backfill_lexemes_nl_en.py run has
    actually happened against a real database yet.
    FRESH-CONTEXT REVIEW ADDENDUM (2026-07-06, zero access to any authoring
    reasoning): confirmed every lesson_content_key matches the correct
    lesson in en/a1_unit11_weather.yaml; re-ran the standalone
    lexeme_matches()-replicating harness against the real iter_specs()
    output (0 count failures: weather_condition=6, weekday=7, place=5) and
    compiler practice-validate (0/0). Read every frame against its full
    candidate list -- It's {item}. / It will be {item} tomorrow. / It will
    rain on {item}. / Let's go to the {item}. are all grammatical for every
    member of their respective pools, no agreement or self-reference risk.
    This PRACTICE PACK's own content is clean; note (preserved from the
    original authoring note, not resolved by this review since it concerns
    the underlying realization, not this pack) that
    en/a1_unit11_weather.yaml itself is still unreviewed -- worth a repeat
    check of this practice pack if that realization is later revised. Does
    not reuse the broad 'number'/'count_plural' tags flagged as an open
    defect elsewhere. Upgrading this pack to reviewed. 2026-07-06 matching_pairs widening (AUTHORING_GUIDE.md #16): expanded the weather_condition (adjective) matching_pairs template from 2 to 6 pairs.

    REAUTH FIX 2026-07-24 (unit-scope DEAD-template pass): scripts/_practice_unit_scope_check.py
    flagged 3 DEAD templates -- all 3 reused an EARLIER unit's own tag
    (lesson03.weekday_listen.004 used unit04's 'weekday'; lesson04.suggest_order.001
    and lesson04.place_translate.003 used unit09's 'place') -- recipe DO-NOT #2:
    generate_checkpoint() only loads unit11's own lexemes, and unit11 never itself
    introduces weekday or place vocabulary. Fixed by RE-ANCHORING all 3 to this
    unit's OWN already-verified 6-member 'weather_condition' tag (sunny/rainy/
    cloudy/cold/hot/windy) instead of inventing a new tag -- reusing a tag WITHIN
    the same unit across lessons is fully legal (only cross-UNIT reuse is the
    defect). weekday_listen.004 kept its bare '{item}' listen_select shape (just
    retagged). suggest_order.001's frame changed from 'Let's go to the {item}'
    (ungrammatical with weather adjectives) to 'It could be {item} later', checked
    grammatical for all 6 members by hand (sunny/rainy/cloudy/cold/hot/windy).
    place_translate.003 kept its bare-word translation shape (just retagged).
    Course-scope re-check: iter_specs() confirms weather_condition has exactly 6
    members course-wide (a1 level) -- identical to the unit-scope pool, since no
    other a1 unit reuses this tag -- so the frame's grammaticality holds at both
    scopes. Removed the now-unused 'weekday'/'place' tags from tag_schema.
    Re-verified: scripts/_practice_unit_scope_check.py shows 0 DEAD/0 FLOOR for
    this file; compile_content.py practice-validate 0 errors."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [weather_condition]
slot_presets:
  weather_condition: &weather_condition {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: weather_condition}}
templates:
  - content_key: practice.nl-en.en.a1.unit11.lesson01.weather_meaning.001
    lesson_content_key: en.a1.unit11.lesson01.weather_words
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *weather_condition}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een weerwoord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit11.lesson01.weather_listen.002
    lesson_content_key: en.a1.unit11.lesson01.weather_words
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *weather_condition}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit11.lesson01.weather_pair.003
    lesson_content_key: en.a1.unit11.lesson01.weather_words
    type: matching_pairs
    frame: {text: "Koppel de Engelse weerwoorden aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
    slots: {first_word: *weather_condition, second_word: *weather_condition, third_word: *weather_condition, fourth_word: *weather_condition, fifth_word: *weather_condition, sixth_word: *weather_condition}
    slot_relations: [{kind: distinct, slots: [first_word, second_word, third_word, fourth_word, fifth_word, sixth_word]}]
    answer_derivation: {kind: matching_pairs, slots: [first_word, second_word, third_word, fourth_word, fifth_word, sixth_word]}
    feedback_frame: {text: "Je hebt zes weerwoorden gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit11.lesson01.weather_translate.004
    lesson_content_key: en.a1.unit11.lesson01.weather_words
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *weather_condition}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit11.lesson02.today_order.001
    lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
    type: word_order
    frame: {text: "It's {item}", language_code: en, direction: ltr}
    slots: {item: *weather_condition}
    answer_derivation: {kind: render_frame, frame: {text: "It's {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} beschrijft het weer van vandaag.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit11.lesson02.today_translate.003
    lesson_content_key: en.a1.unit11.lesson02.describing_todays_weather
    type: translation
    frame: {text: "Het is {item}.", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *weather_condition}
    answer_derivation: {kind: render_frame, frame: {text: "It's {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "It's {item} betekent Het is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit11.lesson03.tomorrow_order.001
    lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
    type: word_order
    frame: {text: "It will be {item} tomorrow", language_code: en, direction: ltr}
    slots: {item: *weather_condition}
    answer_derivation: {kind: render_frame, frame: {text: "It will be {item} tomorrow", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is een mogelijk weer voor morgen.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit11.lesson03.tomorrow_translate.003
    lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
    type: translation
    frame: {text: "Het wordt morgen {item}.", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *weather_condition}
    answer_derivation: {kind: render_frame, frame: {text: "It will be {item} tomorrow", language_code: en, direction: ltr}}
    feedback_frame: {text: "It will be {item} tomorrow betekent Het wordt morgen {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit11.lesson03.weekday_listen.004
    lesson_content_key: en.a1.unit11.lesson03.reading_a_forecast
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *weather_condition}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit11.lesson04.suggest_order.001
    lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
    type: word_order
    frame: {text: "It could be {item} later", language_code: en, direction: ltr}
    slots: {item: *weather_condition}
    answer_derivation: {kind: render_frame, frame: {text: "It could be {item} later", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is het mogelijke weer later vandaag.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit11.lesson04.place_translate.003
    lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *weather_condition}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit11.lesson04.weather_meaning.004
    lesson_content_key: en.a1.unit11.lesson04.weather_plan_dialogue
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *weather_condition}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een weerwoord.", language_code: nl, direction: ltr}
