schema_version: "1.0"
pack_key: practice.nl-en.a1.unit36
source_language: nl
target_language: en
unit_content_key: en.a1.unit36.education
review:
  status: unreviewed
  fresh_context: false
  notes: "Authored 2026-07-11, nl-en depth-completion sprint (see
    a1_unit30.yaml's notes for the sprint context). 6-member
    'education_noun' tag (class/course/student/homework/subject/test,
    all nouns) for bare-word recognition only -- no shared generative
    frame attempted, since these nouns don't collocate uniformly ('I
    have a {item}' reads fine for class/course/test but is odd for
    student, and outright wrong for the mass noun homework without an
    article), same 'don't force it' discipline as unit25/unit27's
    bureaucracy_noun/banking_noun. Repeated the tag's bare-word
    recognition across lesson02 and lesson04 for depth, following
    a2_unit25's established pattern. Extended
    scripts/_en_target_lexeme_common.py/scripts/backfill_lexemes_nl_en.py
    with every introduced_token this unit's realization uses. Every
    slot's real candidate count verified with
    scripts/_practice_slot_check.py (6 distinct, above the >=3 floor).
    Needs the standard fresh-context review before import.
    FRESH-CONTEXT REVIEW ADDENDUM (2026-07-11, zero access to authoring
    reasoning): lesson_content_keys (lesson01.education_vocabulary, lesson02.taking_a_class, lesson04.learning_something_new) resolve to real lessons in en/a1_unit36_education.yaml. education_noun (class/course/student/homework/subject/test, all noun) is recognition-only -- correct given the mass noun 'homework' and non-uniform collocation. All 6 Dutch glosses accurate and distinct. No bare YAML booleans, no snake_case learner-facing
    leaks. Validation: compiler practice-validate 0/0 across the full
    42-pack nl-en set, scripts/_practice_slot_check.py OK,
    backfill_lexemes_nl_en.py --dry-run clean. Upgrading to reviewed.

    DEAD-template re-authoring pass (2026-07-24, unit-scope satisfiability
    fix): scripts/_practice_unit_scope_check.py found lesson01.match.003
    (matching_pairs) DEAD -- it needs 6 distinct fills but education_noun's
    real unit-scoped pool is only 3 (course/homework/subject; the other
    education_noun members belong to other units). Re-anchored just this
    template's 6 slots to drop the semantic tag and constrain by
    part_of_speech: noun only (recipe SS3.1c), which pulls from unit36's own
    10-noun pool (course/community/college/homework/subject/math/photography/
    nights/skills/classes -- all distinct, non-confusable Dutch glosses).
    Left choose.001/listen.002/translate.004/choose.002/translate.003
    untouched since education_noun's 3 members already clear their floors.
    Re-verified 0 DEAD, 0 below-floor with
    scripts/_practice_unit_scope_check.py and 0 errors with
    compile_content.py practice-validate.

    Polish wave 2 (2026-07-25, tier-thinness + POS-only matching audit):
    structured tier had only 1 live template and production only 2 (<3
    floor, recipe SS8). Added two word_order templates over
    education_noun (course-wide pool is exactly
    class/course/homework/student/subject/test): lesson02.order.001
    'My {item} is difficult' and lesson04.order.002 'We like our {item}'
    -- both frames verified grammatical and sensible for all six
    course-scope members. Added lesson03.translate.001 (NL prompt
    'Ik vind mijn {item} leuk.' with gloss rendering, EN render_frame
    'I like my {item}'; 'mijn'/'my' works for every course-scope member,
    no article-agreement hazard). Tiers now 3/3/3, and lesson03
    (previously template-less) is now represented. match.003 POS-only
    audit: left POS-only DELIBERATELY -- the only semantic tags
    unit36's lexemes carry are education_noun/class_noun/
    recurring_class_noun, whose unit-scoped union is just 3 distinct
    tokens (course/homework/subject), below the 6 declared matching
    slots, so no unit-native semantic union can satisfy the template;
    per the polish rubric the bare part_of_speech: noun constraint
    stays.
    [wave-3 amendment: that blocker is RESOLVED -- commit 05af7ace's
    generated tags now cover every content word; see below.]

    POLISH wave 3 2026-07-26 (re-anchor POS-only matcher to the
    generated unit tag from commit 05af7ace): match.003's six slots
    gained agreement_tags semantic: a1_unit36_education (the generated
    unit-scoped tag), keeping part_of_speech: noun. Unit pool unchanged
    at 10 distinct nouns/10 distinct glosses (course, community,
    college, homework, subject, math, photography, nights, skills,
    classes -- lessen/college/gemeenschap/cursus/huiswerk/wiskunde/
    avonden/fotografie/vaardigheden/vak, eyeballed per the gloss guard:
    no duplicates, no confusable pair, no gloss baked into another
    member's token), but course scope now equals unit scope -- 0
    course-scope extras per pool_check.py, ending the level-wide
    off-theme noun pull at Endless-Practice scope. All other templates
    untouched (not dispatched)."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [education_noun, a1_unit36_education]
slot_presets:
  education_noun: &education_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: education_noun}}
templates:
  - content_key: practice.nl-en.en.a1.unit36.lesson01.choose.001
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *education_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit36.lesson01.listen.002
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *education_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit36.lesson01.match.003
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: matching_pairs
    frame: {text: "{first} · {second}", language_code: en, direction: ltr}
    slots: {first: &education_noun_broad {language_code: en, part_of_speech: noun, agreement_tags: {semantic: a1_unit36_education}}, second: *education_noun_broad, third: *education_noun_broad, fourth: *education_noun_broad, fifth: *education_noun_broad, sixth: *education_noun_broad}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Verbind elk woord met de Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit36.lesson01.translate.004
    lesson_content_key: en.a1.unit36.lesson01.education_vocabulary
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *education_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit36.lesson02.choose.002
    lesson_content_key: en.a1.unit36.lesson02.taking_a_class
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *education_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit36.lesson04.translate.003
    lesson_content_key: en.a1.unit36.lesson04.learning_something_new
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *education_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit36.lesson02.order.001
    lesson_content_key: en.a1.unit36.lesson02.taking_a_class
    type: word_order
    frame: {text: "My {item} is difficult", language_code: en, direction: ltr}
    slots: {item: *education_noun}
    answer_derivation:
      kind: render_frame
      frame: {text: "My {item} is difficult", language_code: en, direction: ltr}
    feedback_frame: {text: "Zo zeg je dat een onderdeel van je studie moeilijk is.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit36.lesson04.order.002
    lesson_content_key: en.a1.unit36.lesson04.learning_something_new
    type: word_order
    frame: {text: "We like our {item}", language_code: en, direction: ltr}
    slots: {item: *education_noun}
    answer_derivation:
      kind: render_frame
      frame: {text: "We like our {item}", language_code: en, direction: ltr}
    feedback_frame: {text: "Zo zeg je dat jullie iets van de studie leuk vinden.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit36.lesson03.translate.001
    lesson_content_key: en.a1.unit36.lesson03.dialogue_photography_class
    type: translation
    frame: {text: "Ik vind mijn {item} leuk.", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *education_noun}
    answer_derivation:
      kind: render_frame
      frame: {text: "I like my {item}", language_code: en, direction: ltr}
    feedback_frame: {text: "I like my {item} betekent Ik vind mijn {item} leuk.", language_code: nl, direction: ltr}
