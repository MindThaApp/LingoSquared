schema_version: '1.0'
pack_key: practice.nl-en.b1.unit07
source_language: nl
target_language: en
unit_content_key: en.b1.unit07.conditions
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md as part of the nl-en B1 unit02-unit14
    practice-pack wave (batch C) that unblocks these units'' checkpoints (units already had lexemes from
    scripts/backfill_lexemes_nl_en.py but no pack, so generate_checkpoint() returned checkpoint_unavailable).
    12 templates across all 4 lessons: 1xfill_in_blank, 1xlisten_select, 2xmatching_pairs, 4xmultiple_choice,
    3xtranslation, 1xword_order. This is a grammar unit (AUTHORING recipe §8.1): recognition (multiple_choice/listen_select)
    and production (translation) slots use the unit-wide union tag ''b1_unit07_conditions'' (OR-matched
    across all 4 lessons'' own per-lesson tags) narrowed by part_of_speech to [noun, verb, adjective,
    adverb] so no function word or proper noun becomes an answer/option; matching_pairs (x2, anchored
    lesson03 reading and lesson04 dialogue) pools the same union tag, always >=18 distinct content tokens
    so the 6-pair floor is comfortably cleared. word_order and fill_in_blank each use a single-member
    anchor (narrow per-lesson tag + part_of_speech, verified to have exactly 1 course-wide candidate,
    confirmed unique to this unit''s own lesson -- not reused at any other CEFR level) so each hero sentence
    renders deterministically; both hero sentences were re-read against their slot''s course-wide (whole
    nl-en B1 course) candidate pool and confirmed to have exactly 1 member, and neither frame''s literal
    text contains that slot''s own candidate word (defect 1.14). Every gloss in every pool was read against
    this unit''s own realization content (recipe §0.1); no mis-glossed lexeme was found for this unit.
    Needs the standard fresh-context review before import.'
