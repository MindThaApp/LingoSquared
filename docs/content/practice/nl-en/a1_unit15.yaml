schema_version: "1.0"
pack_key: practice.nl-en.a1.unit15
source_language: nl
target_language: en
unit_content_key: en.a1.unit15.money
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-05 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en direction, per the
    coordinator's scope split). Keyed to English target lexemes extended into
    the shared scripts/_en_target_lexeme_common.py plus this pair's own Dutch
    glosses added to scripts/backfill_lexemes_nl_en.py. Added a narrower
    'card_type' tag (credit/debit, 2 members) separate from the broader
    4-member 'payment_method' (cash/card/credit/debit) for the 'Do you take
    {item} cards?' frame -- 'cash'/'card' alone there would be semantically
    odd ('Do you take cash cards?' is not a real phrase), matching the same
    narrowing discipline used throughout this pass (unit08's quantity_unit,
    unit09's place_non_hospital, unit12's clothing_singular, etc.). Reused
    the already-established 22-member 'number' tag (from unit03) for both
    receipt/dialogue total-amount frames ('The total is {item} dollars.'/
    'It's {item} dollars.'), safe with any number. Every slot's real
    candidate count was verified with the same standalone
    lexeme_matches()-replicating harness used for every other pack this pass.
    The underlying en realization unit15 is itself UNREVIEWED (Codex was
    usage-limited at authoring time) but the nl-en OVERLAY is already
    fresh-context reviewed (status: reviewed) -- same pattern as units 3-10/13/14.
    Needs the standard fresh-context review before import (both realization
    and this practice pack). Same blocking DB-level gap as every other pack
    from this pass: no backfill_lexemes_nl_en.py run has actually happened
    against a real database yet.
    FOLLOW-UP FIX 2026-07-06: a fresh-context reviewer flagged that the
    'safe with any number' claim above was wrong -- bare 'hundred' (no
    article; real content only teaches 'one hundred') was reachable in
    lesson03/lesson04's total/price frames, producing 'The total is hundred
    dollars.'/'It's hundred dollars.' Fixed by adding 'number_no_hundred' (21
    members) to scripts/_en_target_lexeme_common.py and re-pointing all 6
    affected templates (lesson03.total_order/total_fill/total_translate,
    lesson04.its_order/its_fill/its_translate) to it. Re-verified with
    compile_content.py practice-validate (0/0) and a standalone harness
    confirming 'hundred' is no longer reachable in any of the fixed slots. 2026-07-06 matching_pairs widening (AUTHORING_GUIDE.md #16): expanded the payment_method (noun) matching_pairs template from 2 to 4 pairs.

    REAUTH FIX 2026-07-24 (unit-scope DEAD-template pass): scripts/_practice_unit_scope_check.py
    flagged 4 DEAD templates (lesson03.total_order.002/total_translate.004,
    lesson04.its_order.002/its_translate.004) plus 1 below-floor matching_pairs
    (lesson01.payment_pair.003, 4 slots < the SS16 6-pair floor). All 4 DEAD
    templates used 'number_no_hundred' -- despite the distinct tag name, its
    members are still the SAME lexemes tagged to unit03's own lesson_content_key
    (this pack's earlier note candidly says 'reused the already-established
    22-member number tag from unit03'), so generate_checkpoint()'s unit-scoped
    pool has 0 unit15 candidates for it (recipe DO-NOT #2). unit15's own numeric
    vocabulary is only the 2 bare digit symbols '1'/'10' from lesson03 (too
    thin, and '1'/'10' being symbols not words would make 'The total is {item}
    dollars' produce a singular/plural agreement error for '1' anyway), so
    RE-ANCHORED all 4 to this unit's OWN already-verified 4-member
    'payment_method' tag (cash/card/credit/debit) instead, with new frames
    checked grammatical for all 4 members by hand: 'This receipt shows a {item}
    payment' (lesson03) and 'Can I pay with {item}' (lesson04). payment_method
    is confirmed course-wide (a1 level) to have exactly these same 4 members --
    no other a1 unit reuses this tag -- so the frames hold at both scopes.
    Widened payment_pair.003 from 4 to 7 slots using a new untagged 'noun_word'
    preset (language_code: en, part_of_speech: noun, no semantic tag) pooling
    ALL of unit15's own nouns (cash/card/credit/debit/total/cards/tax, 7
    distinct) -- safe per SS3.1(c) since matching_pairs uses a static
    instruction frame, never a literal sentence. Generalized that template's
    Dutch instruction/feedback text from 'betaalwoorden' (payment words) to
    'woorden' (words) since the pool is no longer payment-only. Removed the
    now-unused 'number'/'number_no_hundred' tags from tag_schema. Re-verified:
    scripts/_practice_unit_scope_check.py shows 0 DEAD/0 FLOOR for this file;
    compile_content.py practice-validate 0 errors.

    WAVE-3 RE-ANCHOR 2026-07-26: commit 05af7ace generated the unit-scoped semantic tag
    a1_unit15_money. Re-anchored payment_pair.003's untagged noun_word pool (POS-only,
    pulling 773 off-theme nouns at Endless-Practice course scope) to the new pair_noun
    preset (noun + semantic: a1_unit15_money) -- the token set is unchanged
    (cash/card/credit/debit/total/cards/tax, 7 distinct, 7 distinct Dutch glosses) but the
    pool is now identical at unit and course scope, so the course-scope pull is gone.
    Verified via pool_check.py (7/7, 0 course extras), practice-validate 0 errors,
    unit-scope check 0 DEAD."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [payment_method, card_type, a1_unit15_money]
slot_presets:
  payment_method: &payment_method {language_code: en, part_of_speech: noun, agreement_tags: {semantic: payment_method}}
  card_type: &card_type {language_code: en, part_of_speech: noun, agreement_tags: {semantic: card_type}}
  # pair_noun (wave 3): the generated unit-scoped tag a1_unit15_money (commit
  # 05af7ace) narrowed to nouns -- exactly cash/card/credit/debit/total/cards/tax
  # at BOTH unit and course scope (same 7 tokens the old untagged noun_word pool
  # produced, minus the 773 off-theme course-scope extras it used to pull at
  # Endless-Practice course scope).
  pair_noun: &pair_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: a1_unit15_money}}
templates:
  - content_key: practice.nl-en.en.a1.unit15.lesson01.payment_meaning.001
    lesson_content_key: en.a1.unit15.lesson01.payment_words
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een betaalwoord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit15.lesson01.payment_listen.002
    lesson_content_key: en.a1.unit15.lesson01.payment_words
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit15.lesson01.payment_pair.003
    lesson_content_key: en.a1.unit15.lesson01.payment_words
    type: matching_pairs
    frame: {text: "Koppel de Engelse woorden aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
    slots: {first_word: *pair_noun, second_word: *pair_noun, third_word: *pair_noun, fourth_word: *pair_noun, fifth_word: *pair_noun, sixth_word: *pair_noun, seventh_word: *pair_noun}
    slot_relations: [{kind: distinct, slots: [first_word, second_word, third_word, fourth_word, fifth_word, sixth_word, seventh_word]}]
    answer_derivation: {kind: matching_pairs, slots: [first_word, second_word, third_word, fourth_word, fifth_word, sixth_word, seventh_word]}
    feedback_frame: {text: "Je hebt zeven woorden gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit15.lesson01.payment_translate.004
    lesson_content_key: en.a1.unit15.lesson01.payment_words
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit15.lesson02.take_cards_order.001
    lesson_content_key: en.a1.unit15.lesson02.asking_about_payment
    type: word_order
    frame: {text: "Do you take {item} cards", language_code: en, direction: ltr}
    slots: {item: *card_type}
    answer_derivation: {kind: render_frame, frame: {text: "Do you take {item} cards", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is het soort kaart waarnaar gevraagd wordt.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit15.lesson02.card_type_translate.003
    lesson_content_key: en.a1.unit15.lesson02.asking_about_payment
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *card_type}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit15.lesson02.payment_meaning.004
    lesson_content_key: en.a1.unit15.lesson02.asking_about_payment
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een betaalwoord.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit15.lesson03.payment_meaning.001
    lesson_content_key: en.a1.unit15.lesson03.reading_a_receipt
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een betaalwoord.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit15.lesson03.total_order.002
    lesson_content_key: en.a1.unit15.lesson03.reading_a_receipt
    type: word_order
    frame: {text: "This receipt shows a {item} payment", language_code: en, direction: ltr}
    slots: {item: *payment_method}
    answer_derivation: {kind: render_frame, frame: {text: "This receipt shows a {item} payment", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de betaalmethode op deze kassabon.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit15.lesson03.total_translate.004
    lesson_content_key: en.a1.unit15.lesson03.reading_a_receipt
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit15.lesson04.payment_listen.001
    lesson_content_key: en.a1.unit15.lesson04.paying_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit15.lesson04.its_order.002
    lesson_content_key: en.a1.unit15.lesson04.paying_dialogue
    type: word_order
    frame: {text: "Can I pay with {item}", language_code: en, direction: ltr}
    slots: {item: *payment_method}
    answer_derivation: {kind: render_frame, frame: {text: "Can I pay with {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de betaalmethode in deze vraag.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit15.lesson04.its_translate.004
    lesson_content_key: en.a1.unit15.lesson04.paying_dialogue
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *payment_method}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
