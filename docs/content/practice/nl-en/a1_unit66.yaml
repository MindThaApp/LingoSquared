schema_version: '1.0'
pack_key: practice.nl-en.a1.unit66
source_language: nl
target_language: en
unit_content_key: en.a1.unit66.pharmacy_symptoms
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-23 (nl-en batch B). English target pool: 3 content-POS (noun/verb/adjective/adverb)
    lexemes across 2/2 lessons that carry any EN lexeme at all (this direction tests English; language_code=nl
    lexemes in the backfill are unrelated pollution from quoted-English-inside-Dutch-gloss parsing and
    were NOT used). Broad tag a1_unit66_pharmacy_symptoms unions the unit; each word_order/translation
    pair is additionally anchored per-lesson via that lessons own auto-tag for lesson stratification.
    word_order uses a single generic frame (Please say {item}.) deliberately: it is grammatical for any
    part of speech, has no candidate floor, and has zero self-reference risk (neither please nor say is
    ever a taught token in this unit). multiple_choice/listen_select clear the 3-distinct-value floor.
    matching_pairs OMITTED: fewer than 6 distinct content-POS tokens in the unit. THIN UNIT: only 3 EN
    content lexemes total -- this pack cannot reach the 12-item checkpoint floor or the recipes per-tier
    bars; authored honestly per the no-padding rule, flagged to the coordinator as checkpoint-thin.
    Polish 2026-07-25: the 3-token content-POS union is byte-identical to both existing recognition
    pools, so a third content-word recognition template would be a duplicate; added lesson02-anchored
    phrase multiple_choice choose.001 instead (lesson02 auto-tag, part_of_speech phrase, 6 distinct
    clean Dutch phrase glosses -- lesson03 dialogue phrases were NOT used because their glosses carry
    speaker prefixes). Recognition tier now 3 live templates; also gives lesson02 its first template.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a1_unit66_pharmacy_symptoms
    - a1_unit66_pharmacy_symptoms_lesson01
    - a1_unit66_pharmacy_symptoms_lesson02
