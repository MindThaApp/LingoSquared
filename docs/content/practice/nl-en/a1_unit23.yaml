schema_version: "1.0"
pack_key: practice.nl-en.a1.unit23
source_language: nl
target_language: en
unit_content_key: en.a1.unit23.work
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-06 by a parallel Claude fork continuing the nl-en
    lane of the Endless Practice template-pool sync (see a1_unit22.yaml's
    notes for the parallel-worker split context). This unit (unit23,
    reviewed/stable overlay) covers describing a job. Extended
    scripts/_en_target_lexeme_common.py with 15 new English tokens
    (nurse/cook/driver/patients/help/reports/interesting/company/
    downtown/answer/emails/sometimes/with/clients/job) and
    scripts/backfill_lexemes_nl_en.py with matching Dutch glosses plus
    17 Dutch source-side tokens from the overlay's gloss text. Added a
    5-member 'occupation_noun' tag (teacher/nurse/engineer/cook/driver
    -- 'teacher'/'engineer' were already classified since unit01,
    tagged additively here) for bare-word recognition, PLUS a narrower
    4-member 'occupation_a' tag that EXCLUDES 'engineer'. This is a
    real article-agreement bug: the real content shows 'I'm a nurse.'
    but 'I'm an engineer.' (engineer starts with a vowel sound), so a
    shared 'I'm a {item}.' frame must never offer engineer as a
    candidate -- doing so would generate the ungrammatical 'I'm a
    engineer.' Same bug class as several earlier catches this session
    (turn_direction, card_type, place_non_station, symptom_noun),
    just the a/an flavor of it this time. Every slot's real candidate
    count was verified with a standalone lexeme_matches()-replicating
    harness against this script's actual output. Needs the standard
    fresh-context review before import. Same blocking dependency as
    every earlier nl-en pack: backfill_lexemes_nl_en.py has not
    actually been run against a real database yet. 2026-07-06 matching_pairs widening (AUTHORING_GUIDE.md #16): expanded the occupation_noun (noun) matching_pairs template from 2 to 5 pairs.

    Fixed 2026-07-07 (Dutch live-QA pass): both lesson02 templates
    anchored lesson_content_key to en.a1.unit23.lesson02.what_do_you_do,
    which introduces zero new lexemes (What/do/you were all already
    taught earlier in the course) -- so no Lexeme row is ever created
    with that lesson as provenance and _practice_lesson_id() could never
    resolve it, confirmed via scripts/backfill_lexemes_nl_en.py's own
    classification (the key never appears as any spec's
    lesson_content_key). Same root cause already found and fixed for this
    exact shared English realization in the fa-en/prs-en unit23 packs
    earlier this session (both repointed to lesson01.occupation_words,
    where occupation_a/occupation_noun's real tokens anchor). Applied the
    identical fix here: repointed both order.001 and listen.003 to
    en.a1.unit23.lesson01.occupation_words, a safe, no-forward-reference
    anchor already used successfully above.

    DEAD-template remediation 2026-07-24 (PACK-ONLY,
    scripts/_practice_unit_scope_check.py): lesson01.match.003 declared 5
    matching_pairs slots against 'occupation_noun', but that tag's
    course-wide 5 members include teacher/engineer (introduced in
    unit01/unit02) -- unit23 itself only carries 3 (nurse/cook/driver),
    below the declared 5 -> DEAD. Recipe fix SS3.1(c): dropped the
    semantic constraint to plain part_of_speech: noun (unit23_noun
    preset) over unit23's OWN full noun pool -- nurse, cook, driver
    (lesson01), patients, reports (lesson03), company, downtown, emails,
    clients, job (lesson04) -- 10 distinct unit-scoped nouns, all
    distinct glosses (verpleegkundige/kok/chauffeur/patienten/
    rapporten/bedrijf/in het centrum/e-mails/klanten/baan, checked by
    hand for confusability, none found). Bumped the template from 5 to 8
    declared slots (comfortably under the 10-token pool, above the
    AUTHORING_GUIDE #16 6-pair floor). Left every other template
    (choose/listen/translate on occupation_noun, word_order on
    occupation_a) untouched -- none of those were flagged; their 3-member
    unit-scoped pools already clear the MC/listen 3-floor and word_order
    has no floor. Verified 0 DEAD / 0 below-floor via
    scripts/_practice_unit_scope_check.py and compiler practice-validate
    0 errors after the fix.

    POLISH wave-2 2026-07-25 (TIER-SHORT: production tier had only 2 live
    templates): added lesson03.translate.002, a bare-word translation over
    the unit23_noun pos-only preset (bare-word translation is safe POS-only
    per recipe SS3.1(c) -- the prompt varies with the answer, no course-scope
    grammaticality requirement). Unit-scoped pool: 10 distinct nouns
    including lesson03's own patients/reports; production tier now 3 live.
    match.003 stays POS-only DELIBERATELY: unit23's lexemes carry only
    occupation_noun/occupation_a (3 unit members) and frequency_adverb
    (1 member, 'sometimes'), so no semantic union of unit tags can reach
    the 6 distinct unit tokens matching_pairs needs -- a wrong union would
    kill the template at checkpoint scope. Noted for the backfill lane:
    unit23's lesson03/lesson04 content nouns (patients/reports/company/
    downtown/emails/clients/job) have no semantic tag at all."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [occupation_noun, occupation_a]
slot_presets:
  occupation_noun: &occupation_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: occupation_noun}}
  occupation_a: &occupation_a {language_code: en, part_of_speech: noun, agreement_tags: {semantic: occupation_a}}
  unit23_noun: &unit23_noun {language_code: en, part_of_speech: noun}
templates:
  - content_key: practice.nl-en.en.a1.unit23.lesson01.choose.001
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een beroep uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit23.lesson01.listen.002
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit23.lesson01.match.003
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth} · {seventh} · {eighth}", language_code: en, direction: ltr}
    slots: {first: *unit23_noun, second: *unit23_noun, third: *unit23_noun, fourth: *unit23_noun, fifth: *unit23_noun, sixth: *unit23_noun, seventh: *unit23_noun, eighth: *unit23_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth]}
    feedback_frame: {text: "Verbind elk woord met de Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit23.lesson01.translate.004
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit23.lesson02.order.001
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: word_order
    frame: {text: "I'm a {item}", language_code: en, direction: ltr}
    slots: {item: *occupation_a}
    answer_derivation: {kind: render_frame, frame: {text: "I'm a {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is het genoemde beroep.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit23.lesson02.listen.003
    lesson_content_key: en.a1.unit23.lesson01.occupation_words
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit23.lesson03.choose.001
    lesson_content_key: en.a1.unit23.lesson03.reading_a_work_profile
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *occupation_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een beroep uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit23.lesson03.translate.002
    lesson_content_key: en.a1.unit23.lesson03.reading_a_work_profile
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *unit23_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit23.lesson04.listen.001
    lesson_content_key: en.a1.unit23.lesson04.work_profile_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
