source_language: nl
target_language: en
unit_content_key: en.a1.unit20.comparisons
review:
  status: reviewed
  fresh_context: true
  notes: 'Authored 2026-07-06 by the Claude session syncing Endless Practice template pools to lesson content growth (nl-en
    lane, resuming after the units 17-19 stretch -- see docs/BUILD_LOG.md''s matching entry for why this lane paused at 19
    to redirect to en-nl, and the coordinator''s ''keep going on both directions'' instruction for why it resumed here). This
    unit (unit20, reviewed/stable overlay) covers basic comparisons. Extended scripts/_en_target_lexeme_common.py with 11
    new English tokens (bigger/smaller/cheaper/expensive/faster/than/nicer/cheapest/ red/car/white) and scripts/backfill_lexemes_nl_en.py
    with the matching Dutch glosses plus 14 Dutch source-side tokens found in this unit''s overlay gloss text (auto/blauwe/duurder/goedkoopst/goedkoopste/
    goedkoper/groter/kleiner/mooier/rode/sneller/tas/vind/witte). Added a 5-member ''comparative_adj'' tag (bigger/smaller/cheaper/faster/nicer)
    -- verified all five are genuinely interchangeable one-word ''-er'' comparatives that take ''than'' in a ''This X is {item}
    than that X.'' frame. Deliberately did NOT fold in ''more expensive'' (a two-word phrase that doesn''t fit a single token
    slot) or ''cheapest'' (a superlative that does NOT take ''than'' -- mixing degrees would let the sampler generate ''This
    bag is cheapest than that bag.''). ''cheapest'' instead got its own single-member ''superlative_adj'' tag, used only in
    word_order/fill_in_blank/translation templates (which don''t need the >=4 candidates multiple_choice/listen_select require).
    A 2-member ''color'' tag (red/white) is likewise only used in non-recognition slot types for the same reason. Every slot''s
    real candidate count was verified with a standalone lexeme_matches()-replicating harness against this script''s actual
    output. Needs the standard fresh-context review before import. Same blocking dependency as every earlier nl-en pack: backfill_lexemes_nl_en.py
    has not actually been run against a real database yet. FRESH-CONTEXT REVIEW ADDENDUM (2026-07-06, zero access to any authoring
    reasoning): confirmed every lesson_content_key matches the correct lesson in en/a1_unit20_comparisons.yaml; re-ran the
    standalone lexeme_matches()-replicating harness against the real iter_specs() output (0 count failures: comparative_adj=5,
    superlative_adj=1, color=2) and compiler practice-validate (0/0). Cross-checked lesson03''s ''The white car is the {item}
    of the three.'' (superlative_adj, always ''cheapest'') against the lesson''s own reading passage (''The red car is faster
    than the blue car, but the blue car is cheaper. The white car is the cheapest of the three.'') -- consistent, not a fabricated
    fact. ''The {item} car is faster'' (color: red/white) is a generic sentence-structure drill, not a claim about which specific
    car in the reading is fastest, so it does not conflict with the passage either. No self-reference, agreement, or homograph
    issues found; does not reuse the broad ''number''/''count_plural'' tags flagged as an open defect elsewhere. Upgrading
    to reviewed. 2026-07-06 matching_pairs widening (AUTHORING_GUIDE.md #16): expanded the comparative_adj (adjective) matching_pairs
    template from 2 to 5 pairs.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - comparative_adj
    - superlative_adj
    - color
slot_presets:
  comparative_adj: &id001
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: comparative_adj
  superlative_adj: &id002
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: superlative_adj
  color: &id003
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: color
