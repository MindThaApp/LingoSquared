schema_version: "1.0"
pack_key: practice.nl-en.a1.unit39
source_language: nl
target_language: en
unit_content_key: en.a1.unit39.neighborhood
review:
  status: reviewed
  fresh_context: true
  notes: "Authored 2026-07-11, nl-en depth-completion sprint (see
    a1_unit30.yaml's notes for the sprint context). 3-member
    'neighborhood_adj' tag (quiet/noisy/friendly, all adjectives) for
    bare-word recognition only -- deliberately excludes the lesson's
    other two vocabulary items ('neighborhood'/'neighbor', nouns) to
    keep part_of_speech uniform, and excludes 'nearby' (functions as an
    adverb in this unit's own examples, not a predicate adjective). No
    shared generative frame attempted -- 'My street is {item}.' works
    for quiet/noisy but reads oddly for friendly (streets aren't
    friendly, neighbors are, per the unit's own example sentence 'My
    neighbors are very friendly.'), so kept recognition-only, same
    'don't force it' discipline as unit25/unit27's bureaucracy_noun/
    banking_noun. Exactly 3 members -- at the >=3 floor for
    multiple_choice/listen_select, smaller than usual but the unit's
    real single-token adjective vocabulary doesn't support more without
    mixing part_of_speech. Repeated the tag's bare-word recognition
    against lesson02 for depth. Extended
    scripts/_en_target_lexeme_common.py/scripts/backfill_lexemes_nl_en.py
    with every introduced_token this unit's realization uses. Every
    slot's real candidate count verified with
    scripts/_practice_slot_check.py (3 distinct, at the >=3 floor).
    Needs the standard fresh-context review before import.
    FRESH-CONTEXT REVIEW ADDENDUM (2026-07-11, zero access to authoring
    reasoning): lesson_content_keys (lesson01.neighborhood_vocabulary, lesson02.describing_your_area) resolve to real lessons in en/a1_unit39_neighborhood.yaml. neighborhood_adj (quiet/noisy/friendly = rustig/lawaaierig/vriendelijk) sits at the >=3 floor and is recognition-only; correctly excludes the nouns neighborhood/neighbor and the adverb 'nearby'. No bare YAML booleans, no snake_case learner-facing
    leaks. Validation: compiler practice-validate 0/0 across the full
    42-pack nl-en set, scripts/_practice_slot_check.py OK,
    backfill_lexemes_nl_en.py --dry-run clean. Upgrading to reviewed.

    DEAD-template re-authoring pass (2026-07-24, unit-scope satisfiability
    fix): scripts/_practice_unit_scope_check.py found neighborhood_adj's real
    unit-scoped pool is only 2 (quiet/noisy) -- the original notes' assumed
    3rd member 'friendly' is actually introduced by unit32 (pets), not
    unit39, so it never counts at generate_checkpoint()'s unit-scoped pool
    (textbook DO-NOT #2). This broke 1 template outright (lesson01.match.003,
    which needs 3 distinct fills but had only 2) and put 3 more below the
    MC/listen_select 3-option floor (lesson01.choose.001, lesson01.listen.002,
    lesson02.choose.002 -- all had only 2 distinct answer values). Fixed by
    widening the SHARED neighborhood_adj preset (used by every template in
    this pack) to drop the semantic tag and constrain by part_of_speech:
    [noun, adjective] only (recipe SS3.1c) -- pulls from unit39's own 15-token
    native pool (10 nouns: neighborhood/neighbors/grocery/building/mr/plants/
    neighborhoods/restaurants/shops/hallway, plus the original 5 adjectives:
    quiet/noisy/helpful/five-minute/several), all distinct non-confusable
    Dutch glosses. Also widened lesson01.match.003 from 3 to the recipe's
    6-pair floor (SS16) now that the pool supports it. Updated
    feedback_frame text was already generic ('elk woord', not 'elk bijvoeglijk
    naamwoord') so no wording change was needed there. Re-verified 0 DEAD,
    0 below-floor with scripts/_practice_unit_scope_check.py and 0 errors
    with compile_content.py practice-validate.

    POLISH 2026-07-25 (wave 2, tier-thinness + POS-only matching_pairs pass):
    (1) POS-ONLY MATCHING match.003 is LEFT POS-only, honestly: unit39's
    specs carry only one semantic tag family at unit scope --
    neighborhood_adj (quiet/noisy = 2 unit tokens) plus a single-member
    volume tag on noisy -- so no semantic union of unit-native tags can
    reach the 6 distinct tokens the 6-slot template needs; a wrong union
    would be worse than the status quo. (2) Tier-thinness: structured and
    production each had only 1 live template. Structured += lesson02.order.001
    (word_order 'Our neighborhood is {item}.' over neighborhood_adj
    adjectives -- course-wide pool is exactly quiet/noisy/friendly, each
    grammatical as a predicate of neighborhood, no frame word is a
    candidate) and lesson01.fill.005 (fill 'Our street is very {item} at
    night.' on the single-member volume_prs_en_a1_unit39_item_07_single tag
    = noisy). Production += lesson03.translate.001 (sentence translation
    'Onze buurt is {item}.' -> 'Our neighborhood is {item}.' over
    neighborhood_adj; the prompt varies with the answer via slot_rendering
    so it stays determinate; course extra friendly/vriendelijk is
    grammatical in both frames) and lesson04.translate.001 (bare-word
    translation over the unit's 10 plain nouns, POS-only -- safe for bare
    translation because the prompt varies with the answer; all glosses
    distinct). Tiers now 3/3/3 live. tag_schema gained the two referenced
    semantic tags.
    [wave-3 amendment: the POS-only blocker on match.003 noted above is
    RESOLVED -- commit 05af7ace's generated tags now cover every content
    word; see below.]

    POLISH wave 3 2026-07-26 (re-anchor POS-only matcher to the generated
    unit tag from commit 05af7ace): match.003's six slots moved off the
    shared neighborhood_adj preset onto a new unit39_match_word preset
    (agreement_tags semantic: a1_unit39_neighborhood, the generated
    unit-scoped tag), keeping part_of_speech: [noun, adjective] unchanged.
    Unit pool unchanged at 15 distinct tokens/15 distinct glosses
    (building, five-minute, grocery, hallway, helpful, mr, neighborhood,
    neighborhoods, neighbors, noisy, plants, quiet, restaurants, several,
    shops), but course scope now equals unit scope -- 0 course-scope
    extras per pool_check.py, down from 1006, ending the level-wide
    off-theme noun/adjective pull at Endless-Practice scope. Gloss guard
    eyeballed: neighborhood/buurt vs neighborhoods/buurten and
    neighbor(s) singular/plural pairs are the closest pair but remain
    distinct and tellable apart (no gloss identical to or substring-baked
    into another member's token beyond the ordinary singular/plural
    relationship the source lesson itself teaches); no other duplicate or
    confusable glosses. choose.001/listen.002/translate.004/choose.002
    deliberately kept on the shared neighborhood_adj preset (not
    dispatched)."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [neighborhood_adj, volume_prs_en_a1_unit39_item_07_single, a1_unit39_neighborhood]
slot_presets:
  neighborhood_adj: &neighborhood_adj {language_code: en, part_of_speech: [noun, adjective]}
  area_adj: &area_adj {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: neighborhood_adj}}
  noisy_single: &noisy_single {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: volume_prs_en_a1_unit39_item_07_single}}
  unit39_noun: &unit39_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: a1_unit39_neighborhood}}
  unit39_match_word: &unit39_match_word {language_code: en, part_of_speech: [noun, adjective], agreement_tags: {semantic: a1_unit39_neighborhood}}
templates:
  - content_key: practice.nl-en.en.a1.unit39.lesson01.choose.001
    lesson_content_key: en.a1.unit39.lesson01.neighborhood_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit39_match_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit39.lesson01.listen.002
    lesson_content_key: en.a1.unit39.lesson01.neighborhood_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit39_match_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit39.lesson01.match.003
    lesson_content_key: en.a1.unit39.lesson01.neighborhood_vocabulary
    type: matching_pairs
    frame: {text: "{first} · {second}", language_code: en, direction: ltr}
    slots: {first: *unit39_match_word, second: *unit39_match_word, third: *unit39_match_word, fourth: *unit39_match_word, fifth: *unit39_match_word, sixth: *unit39_match_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Verbind elk woord met de Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit39.lesson01.translate.004
    lesson_content_key: en.a1.unit39.lesson01.neighborhood_vocabulary
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *unit39_match_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit39.lesson02.choose.002
    lesson_content_key: en.a1.unit39.lesson02.describing_your_area
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit39_match_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit39.lesson02.order.001
    lesson_content_key: en.a1.unit39.lesson02.describing_your_area
    type: word_order
    frame: {text: "Our neighborhood is {item}.", language_code: en, direction: ltr}
    slots: {item: *area_adj}
    answer_derivation:
      kind: render_frame
      frame: {text: "Our neighborhood is {item}.", language_code: en, direction: ltr}
    feedback_frame: {text: "De juiste volgorde is: Our neighborhood is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit39.lesson01.fill.005
    lesson_content_key: en.a1.unit39.lesson01.neighborhood_vocabulary
    type: fill_in_blank
    frame: {text: "Our street is very {item} at night.", language_code: en, direction: ltr}
    slots: {item: *noisy_single}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Het ontbrekende woord is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit39.lesson03.translate.001
    lesson_content_key: en.a1.unit39.lesson03.dialogue_asking_about_the_neighborhood
    type: translation
    frame: {text: "Onze buurt is {item}.", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *area_adj}
    answer_derivation:
      kind: render_frame
      frame: {text: "Our neighborhood is {item}.", language_code: en, direction: ltr}
    feedback_frame: {text: "De Engelse zin is: Our neighborhood is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit39.lesson04.translate.001
    lesson_content_key: en.a1.unit39.lesson04.three_neighborhoods
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *unit39_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
