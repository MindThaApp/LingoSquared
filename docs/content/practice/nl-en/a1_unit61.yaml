review:
  status: reviewed
  fresh_context: "true"
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md for the nl-en a1_unit61 vocabulary unit. Recognition (multiple_choice, listen_select) and production (translation bare-word) templates use the unit-wide semantic tag `a1_unit61_apologies_excuses` (all lessons unioned, POS-restricted to noun/verb/adjective/adverb, language_code en) anchored per lesson -- the recipe SS8.1 pattern -- so every recognition/production slot clears the >=3-distinct-value floor even where an individual lesson is thin; measured 8 distinct unit-wide content lexemes with zero duplicate english_gloss values (checked by hand against the real backfill_lexemes_nl_en.py output before writing). matching_pairs also draws on the unit-wide tag (6 pairs). Structured tier is carried primarily by matching_pairs (bare frame, no literal text, so no course-scope grammaticality risk per recipe SS1.1) plus one fill_in_blank single-member anchor per SS6.5 where the real lexeme dump yielded exactly one course-wide candidate for its lesson+part_of_speech combination (verified before writing the frame). word_order was used only where lesson01s own verb pool is uniformly a bare infinitive form (this units per-lesson tags cannot exclude a single mixed-conjugation member, recipe SS3.1b) and skipped elsewhere in this batch for that reason; the structured-tier floor is still met via matching_pairs alone. Lessons with zero en-language lexemes in the real backfill output are not anchored (recipe SS0: a lesson with no lexemes cannot be represented in the checkpoint regardless of pack content). THIN UNIT: only 8 distinct en content lexemes exist in the real backfill output for this unit, below the recipe SS8 breadth target -- matching_pairs was scaled down accordingly (1 template instead of 2) and the coordinator should expect this units checkpoint distinct-item count to sit below the 40-item bar; flagging per SS0/rubric rule 3 rather than padding with untaught vocabulary.
    POLISH 2026-07-25 (tier-thinness wave 2): added lesson01.order.001 (word_order, pool = lesson01 nouns traffic/mistake, both grammatical in the frame) and lesson04.order.001 (word_order, single-member symbol slot 3:00, deterministic hero sentence from the lesson04 reading) to bring the structured tier from 1 to 3 live templates. Both lesson tags are unit-specific with zero course-scope extras; verified with pool_check.py. Note the frame word starts in lesson04.order.001 is a unit lexeme but is NOT a candidate of that template's symbol-POS slot, so it is not self-reference under defect 1.14.
