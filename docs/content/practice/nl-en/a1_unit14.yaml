schema_version: "1.0"
pack_key: practice.nl-en.a1.unit14
source_language: nl
target_language: en
unit_content_key: en.a1.unit14.communication
review:
  status: reviewed
  fresh_context: true
  notes: "Authored 2026-07-05 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en direction, per the
    coordinator's scope split). Keyed to English target lexemes extended into
    the shared scripts/_en_target_lexeme_common.py plus this pair's own Dutch
    glosses added to scripts/backfill_lexemes_nl_en.py. Deliberate scope
    decision, different from every other unit this pass: lesson02 (asking
    someone to repeat/speak slowly) gets ZERO generated templates. Its
    vocabulary (sorry/repeat/speak/slowly/hear/well) has no multi-member
    synonym group at all -- every word is a single, non-interchangeable
    concept, so any 'slot' would necessarily have exactly one candidate,
    meaning the 'generated' exercise would be byte-identical every time.
    That provides no more practice value than the lesson's own existing
    hand-authored exercises already give, so it was skipped rather than
    padding the pack with fake-generative deterministic templates. The other
    three lessons DO have genuine swappable content: lesson01 reuses the
    2-member 'person_name' tag (Daniel/Leila, already established since
    unit01/02) for 'Hello, this is {item}.'/'Hi, it's {item}.'; lessons 03
    and 04 reuse the already-verified 5-member 'place' tag (unit09) for
    'Let's meet at the {item}.'/'How about 6pm at the {item}?' -- both
    grammatical with any of the 5 places, giving this unit real recognition
    variety despite its own vocabulary being mostly fixed phone-etiquette
    phrases. Every slot's real candidate count was verified with the same
    standalone lexeme_matches()-replicating harness used for every other
    pack this pass. The underlying en realization unit14 IS fresh-context
    reviewed already (status: reviewed), matching the more usual pattern
    from units 3-10/13. Needs the standard fresh-context review before
    import. Same blocking DB-level gap as every other pack from this pass:
    no backfill_lexemes_nl_en.py run has actually happened against a real
    database yet.
    FRESH-CONTEXT REVIEW ADDENDUM (2026-07-06, zero access to any authoring
    reasoning): confirmed every lesson_content_key matches the correct lesson
    in en/a1_unit14_communication.yaml; re-ran the standalone
    lexeme_matches()-replicating harness against the real iter_specs()
    output (0 count failures: person_name=2, place=5) and compiler
    practice-validate (0/0). Read every frame against its full candidate
    list -- Hello, this is {item}. / Hi, it's {item}. / Let's meet at the
    {item}. / How about 6pm at the {item}? are all grammatical for every
    candidate, no agreement or self-reference risk. The lesson02
    zero-templates decision is sound (genuinely no swappable vocabulary
    there). No self-reference, agreement, or homograph issues found; does
    not reuse the broad 'number'/'count_plural' tags flagged as an open
    defect elsewhere. Upgrading to reviewed.

    Deepened 2026-07-07 (templates-per-unit audit found this the shallowest
    unit in nl-en at 7, alongside sibling fa-en/prs-en's identical unit14
    tied at the same count and deepened the same night -- mirrored their
    additions here with fresh Dutch, not copied Farsi/Dari). person_name
    stays at its original 2 templates -- only 2 real members, already its
    honest ceiling per this file's own original reasoning. Added 3 new
    templates, all reusing the already-verified 5-member 'place' tag with
    exercise TYPES this unit hadn't used yet (word_order/translation/
    listen_select already existed; multiple_choice/matching_pairs did not):
    a lesson03 listen_select (parity with lesson04's), a lesson04
    multiple_choice (bare-word Dutch-gloss recognition), and a lesson04
    matching_pairs using all 5 place members (AUTHORING_GUIDE.md #16 -- 5
    is the unit's honest ceiling, not padded). No new EN_POS/semantic-tag
    or Dutch-gloss additions needed -- 'place' was already fully
    classified/glossed since unit09/this unit's original pass (confirmed
    by re-reading scripts/_en_target_lexeme_common.py and scripts/
    backfill_lexemes_nl_en.py fresh before this edit). Considered a
    fill_in_blank for 'place' (e.g. blanking 'Let's meet at the {item}')
    but rejected it: all 5 place members are genuinely grammatical in that
    exact frame with nothing else to disambiguate --
    scripts/_fill_in_blank_ambiguity_check.py (and compile_content.py's
    hard-fail per AUTHORING_GUIDE.md #17) would correctly flag it, so zero
    new fill_in_blank templates, matching this direction's own established
    'zero is fine when real vocabulary can't safely support one' precedent.
    Re-verified scripts/_practice_slot_check.py (place still safely >=3 for
    the new multiple_choice, >=2 for matching_pairs) and
    scripts/_fill_in_blank_ambiguity_check.py (zero new AMBIGUOUS flags)
    before import. New count: 10 templates (7 -> 10).

    REAUTH FIX 2026-07-24 (unit-scope DEAD-template pass): scripts/_practice_unit_scope_check.py
    flagged ALL 10 of this file's templates as DEAD -- every one used either
    person_name (unit01/02's own tag) or place (unit09's own tag), both EARLIER
    units' vocabulary reused here (recipe DO-NOT #2). generate_checkpoint() only
    loads unit14's own lexemes, and a fresh iter_specs() dump filtered to
    '.a1.unit14.' confirms unit14 does not itself carry person_name or place
    (or ANY multi-member semantic tag) -- its own vocabulary is 16 single-instance
    content words spread across 4 lessons (free/tonight; sorry/repeat/that/
    speak/more/slowly/hear/well; 6pm/message/suggest/meeting/place-the-word;
    about), none sharing an existing tag. This was a whole-pack rewrite, not a
    per-slot patch: kept the SAME 4 tiers-x-lessons shape and grew from 10 to 13
    templates, but every slot now constrains ONLY language_code + part_of_speech
    (no semantic tag, per SS3.1(c)) pooled from unit14's OWN lexemes -- noun
    (tonight/6pm/message/meeting/place, 5 distinct), verb (repeat/speak/hear/
    suggest, 4), adverb (more/slowly/well, 3), adjective (free/sorry, 2),
    preposition (about, 1), and unions of these for matching_pairs (6-8 distinct
    each, all >= the SS16 floor). No new backfill tag needed (PACK-ONLY): every
    template renders a bare '{item}' frame (multiple_choice/listen_select/
    translation) or a matching_pairs instruction frame -- the slot is never
    embedded in literal sentence text, so the SS1.1 course-scope
    grammatical-in-frame risk that applies to word_order/fixed-sentence
    translation does not apply, and no word_order template was authored here for
    that reason (matching_pairs alone clears the >=3-structured-templates bar).
    Recognition floor (>=3 distinct) is met by every MC/listen_select slot (3,
    4, or 5 distinct); the 2-member adjective and 1-member preposition pools are
    used ONLY for bare-word translation, which has no candidate floor. Honestly
    thin: unit14 has no real per-lesson synonym sets, so several templates share
    a pool wider than their own anchor lesson's own words (deliberate, per
    SS8.1's 'anchor per lesson, pool across the unit' pattern) -- this is
    disclosed here for the coordinator, not hidden. Re-verified:
    scripts/_practice_unit_scope_check.py shows 0 DEAD/0 FLOOR for this file;
    compile_content.py practice-validate 0 errors. Still carries the file's own
    prior 'reviewed' status from before this fix -- needs a fresh review pass
    given how much of the pack changed."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
slot_presets:
  # REAUTH FIX 2026-07-24: person_name (unit01/02's own tag) and place (unit09's
  # own tag) are removed -- both were EARLIER-unit vocabulary reused here
  # (recipe DO-NOT #2), so every template that used them had 0 unit-scoped
  # candidates at checkpoint time. unit14 does not itself carry ANY multi-member
  # semantic tag (its own vocabulary -- free/tonight/sorry/repeat/that/speak/
  # more/slowly/hear/well/6pm/message/suggest/meeting/place(the word)/about -- is
  # 16 single-instance content words spread thin across 4 lessons, no shared
  # synonym group). Per SS3.1(c) every slot below constrains ONLY language_code +
  # part_of_speech (no semantic tag), pooled from unit14's own lexemes only
  # (verified against a fresh iter_specs() dump filtered to '.a1.unit14.'). This
  # is safe here specifically because every frame that uses these presets is a
  # bare '{item}' (multiple_choice/listen_select/translation) or a
  # matching_pairs instruction frame -- the slot is never embedded in literal
  # sentence text, so the SS1.1 course-scope grammatical-in-frame risk that
  # applies to word_order/fixed-sentence translation does not apply. No
  # word_order template uses an untagged pool in this file for that reason.
  noun_word: &noun_word {language_code: en, part_of_speech: noun}
  verb_word: &verb_word {language_code: en, part_of_speech: verb}
  adverb_word: &adverb_word {language_code: en, part_of_speech: adverb}
  adj_word: &adj_word {language_code: en, part_of_speech: adjective}
  prep_word: &prep_word {language_code: en, part_of_speech: preposition}
  verb_adverb_word: &verb_adverb_word {language_code: en, part_of_speech: [verb, adverb]}
  noun_adj_word: &noun_adj_word {language_code: en, part_of_speech: [noun, adjective]}
  all_word: &all_word {language_code: en, part_of_speech: [noun, verb, adjective, adverb, pronoun, preposition]}
templates:
  - content_key: practice.nl-en.en.a1.unit14.lesson01.word_choose.001
    lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *noun_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit14.lesson01.word_pair.002
    lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
    type: matching_pairs
    frame: {text: "Koppel de Engelse woorden aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
    slots: {first: *all_word, second: *all_word, third: *all_word, fourth: *all_word, fifth: *all_word, sixth: *all_word, seventh: *all_word, eighth: *all_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth]}
    feedback_frame: {text: "Je hebt acht woorden gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit14.lesson01.adj_translate.003
    lesson_content_key: en.a1.unit14.lesson01.answering_the_phone
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *adj_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit14.lesson02.verb_listen.001
