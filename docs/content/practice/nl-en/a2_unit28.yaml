schema_version: "1.0"
pack_key: practice.nl-en.a2.unit28
source_language: nl
target_language: en
unit_content_key: en.a2.unit28.doctor
review:
  status: unreviewed
  fresh_context: "false"
  notes: >-
    Authored 2026-07-07 by the Claude session extending nl-en's practice
    pool to unit28 (attending a doctor's appointment), the fourth A2 unit
    for this direction, alongside unit27 (banking) in the same pass. Both
    units previously had zero practice templates at all. Follows the same
    discipline as a2_unit25.yaml/a2_unit26.yaml/a2_unit27.yaml (and mirrors
    fa-en's already-authored a2_unit27.yaml pack as the structural
    reference for this session's approach): most of this unit's genuinely
    new vocabulary is either multi-word compounds that don't reduce to a
    single fillable slot ("follow-up appointment", "insurance card",
    "getting worse") or function words with no semantic role, so a new
    3-member "health_followup_noun" bare-word-recognition tag (medicine/
    prescription/insurance -- added to the shared scripts/
    _en_target_lexeme_common.py) covers this unit's own genuinely
    standalone single-token nouns, deliberately not used in any shared
    generative frame (same "don't force it" reasoning as banking_noun/
    bureaucracy_noun: "I need a {item}" doesn't hold uniformly across
    medicine/prescription/insurance).

    Real reuse opportunities found by reading this unit's own actual
    taught sentences (same technique as fa-en's unit27 pack and this
    pack's own unit25/26 "backport of prs-en's better technique" passes):
    (1) "bureaucracy_noun" (appointment/document/form/confirmation,
    defined for unit25, same A2 course) is genuinely retaught here --
    unit28 lesson02 teaches "I'd like to make an appointment..." and
    lesson03's real reading text is built entirely around a confirmed
    appointment/confirmation number, both reintroducing "appointment"/
    "confirmation" as this unit's own introduced_tokens -- so this
    4-member course-wide tag is reused for recognition variety across
    lesson02/lesson03, verified via the standalone lexeme_matches()
    harness to still have all 4 members in the real A2-course-scoped pool.
    (2) "possessive" (my/your/his/her, defined for unit06/reused by
    unit26): lesson03's real reading text is "Your appointment is
    confirmed for 3pm today." -- generalizes with zero grammar loss ("My/
    His/Her appointment is confirmed for 3pm today." all hold) -- BUT the
    real A2-course-scoped candidate pool for this direction only has 2
    members (my, your -- his/her were never reintroduced in any A2 unit
    so far), confirmed via the harness, so this is used ONLY for
    word_order (no floor requirement), never multiple_choice/
    listen_select (which would fail the >=3-distinct floor). (3)
    "identity" (i/i'm/am/is/are/what/what's/my/your, defined for
    unit01/02): lesson04's real dialogue reintroduces "I" (the "I see."
    teach card) and "what's" (the "What's wrong?" teach card) as this
    unit's own tokens -- real A2-scoped pool has 6 members (i, is, my,
    what, what's, your), comfortably above the multiple_choice/
    listen_select floor, confirmed via the harness.

    One new adjective tag: "condition_adjective" (worse/better, added to
    the shared classifier) -- lesson04's real dialogue reintroduces
    "worse" (the "it's getting worse" symptom line) and "better" (the "if
    it doesn't get better" follow-up-condition line) as this unit's own
    tokens. Both are genuine, grammatical alternatives in "It's getting
    {item}." (a symptom getting better is just as real and thematically
    apt as it getting worse), so this is a real 2-member generative frame,
    not bare-word-only -- but kept to word_order/translation only (2
    members is below the multiple_choice/listen_select floor), same
    discipline as this shared module's existing small tags (e.g. the
    1-member "superlative_adj").

    Also reused, translation-only (no shared frame, no MC/listen_select --
    the real A2-scoped candidate pool is only 2 members): "symptom_noun"
    (headache/stomachache/fever/cough, defined for unit22) -- unit28
    lesson01 explicitly re-teaches headache/fever via its own
    "reused_symptoms" teaching card (this unit's own introduced_tokens),
    giving a real, legitimate 2-member A2-scoped pool (headache, fever;
    stomachache/cough were never reintroduced in any A2 unit).

    A combined 7-member pool ("health_followup_noun" UNION
    "bureaucracy_noun", expressed as a slot constraint with a 2-item
    semantic list rather than inventing a new shared tag) backs one
    7-pair matching_pairs template, within AUTHORING_GUIDE.md #16's 6-12
    target, pooling this unit's own 3 nouns with unit25's already-taught
    4 nouns (both real course-wide vocabulary, same course "Engels A2" --
    explicitly endorsed by #16 for review/practice-pool templates).

    ZERO fill_in_blank templates, same deliberate choice as fa-en's
    unit27 pack and this realization's own authoring note (unit28's
    realization file states it has zero fill_in_blank exercises at all):
    every single-token noun pool here (health_followup_noun,
    bureaucracy_noun, symptom_noun) is bare-recognition-only by design
    (no safe shared frame), and the one genuine generative frame
    (condition_adjective) is authored as word_order instead, which
    doesn't share fill_in_blank's ambiguity risk. Ran
    scripts/_fill_in_blank_ambiguity_check.py after writing this pack to
    confirm zero AMBIGUOUS flags (there are no fill_in_blank templates to
    flag in the first place).

    16 templates: 5 lesson01 (health_followup_noun x3 [choose/listen/
    translate] + symptom_noun translate + a 7-pair matching_pairs pooling
    health_followup_noun+bureaucracy_noun), 3 lesson02 (bureaucracy_noun
    choose + health_followup_noun listen + bureaucracy_noun translate), 4
    lesson03 (possessive word_order + bureaucracy_noun choose + listen +
    health_followup_noun translate), 4 lesson04 (identity choose + listen
    + condition_adjective word_order + translate). An honest,
    real-vocabulary-supported count for a newer A2 unit, matching fa-en's
    own unit27 density -- no padding with untaught words.

    Every real candidate count verified empirically with a standalone
    iter_specs()-driven harness against this session's own
    backfill_lexemes_nl_en.py changes (not just eyeballed): health_
    followup_noun=3, bureaucracy_noun=4, possessive=2 (word_order only),
    identity=6, condition_adjective=2 (word_order/translation only),
    symptom_noun=2 (translation only), combined health_followup_noun+
    bureaucracy_noun pool=7 (backs the 7-slot matching_pairs). Also
    verified with scripts/_practice_slot_check.py (added both unit27 and
    unit28 to scripts/practice_manifest.txt's nl-en line) and
    compile_content.py practice-validate, 0 errors/0 warnings. Still
    needs the standard fresh-context review before import.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [health_followup_noun, bureaucracy_noun, symptom_noun, possessive, identity, condition_adjective]
slot_presets:
  health_followup_noun: &health_followup_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: health_followup_noun}}
  bureaucracy_noun: &bureaucracy_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: bureaucracy_noun}}
  clinic_noun_combined: &clinic_noun_combined {language_code: en, part_of_speech: noun, agreement_tags: {semantic: [health_followup_noun, bureaucracy_noun]}}
  symptom_noun: &symptom_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: symptom_noun}}
  possessive: &possessive {language_code: en, part_of_speech: pronoun, agreement_tags: {semantic: possessive}}
  identity: &identity {language_code: en, part_of_speech: [pronoun, verb], agreement_tags: {semantic: identity}}
  condition_adjective: &condition_adjective {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: condition_adjective}}
templates:
  - content_key: practice.nl-en.en.a2.unit28.lesson01.choose.001
    lesson_content_key: en.a2.unit28.lesson01.health_followup_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *health_followup_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit28.lesson01.listen.002
    lesson_content_key: en.a2.unit28.lesson01.health_followup_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *health_followup_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit28.lesson01.translate.003
    lesson_content_key: en.a2.unit28.lesson01.health_followup_vocabulary
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *health_followup_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit28.lesson01.symptom_translate.004
    lesson_content_key: en.a2.unit28.lesson01.health_followup_vocabulary
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *symptom_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}. Dit heb je al in eenheid 22 geleerd.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit28.lesson01.match.005
    lesson_content_key: en.a2.unit28.lesson01.health_followup_vocabulary
    type: matching_pairs
    frame: {text: "{first} · {second}", language_code: en, direction: ltr}
    slots: {first: *clinic_noun_combined, second: *clinic_noun_combined, third: *clinic_noun_combined, fourth: *clinic_noun_combined, fifth: *clinic_noun_combined, sixth: *clinic_noun_combined, seventh: *clinic_noun_combined}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth, seventh]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth, seventh]}
    feedback_frame: {text: "Verbind elk woord met de Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit28.lesson02.choose.001
    lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *bureaucracy_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit28.lesson02.listen.002
    lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *health_followup_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit28.lesson02.translate.003
    lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *bureaucracy_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit28.lesson03.possessive_order.001
    lesson_content_key: en.a2.unit28.lesson03.reading_an_appointment_confirmation
    type: word_order
    frame: {text: "{item} appointment is confirmed for 3pm today", language_code: en, direction: ltr}
    slots: {item: *possessive}
    answer_derivation: {kind: render_frame, frame: {text: "{item} appointment is confirmed for 3pm today", language_code: en, direction: ltr}}
