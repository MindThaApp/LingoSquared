schema_version: '1.0'
pack_key: practice.nl-en.a2.unit35
source_language: nl
target_language: en
unit_content_key: en.a2.unit35.prescription
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-22 (nl-en practice pass, fresh context; 0 fixes). no template issues; lesson pools small but valid; gloss flags for once/food/taking/course in backfill proposals. NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: once, food, taking, course.
    Authored 2026-08-01 against docs/content/PRACTICE_PACK_RECIPE.md for nl-en
    (Dutch speakers learning English), a2_unit35_prescription (pharmacy counter).
    Target pool: 27 EN lexemes across 4/4 lessons (all language_code=en).


    §0.1 GLOSS AUDIT -- four lexemes carry an out-of-context gloss and are
    DELIBERATELY excluded from every slot (they can never be sampled, so their
    wrong gloss is never shown as a correct answer): "food" glossed
    "voedsel- (in gft-afval)" (organic-waste sense, not the unit's "with food");
    "taking" glossed "volgend" (=next/following, not innemen/nemen); "course"
    glossed "cursus" (the class sense, but the unit only teaches "of course" =
    natuurlijk); "once" glossed "zodra" (the conjunction sense, not the unit's
    "once a day" = een keer). The first three are excluded via POS narrowing on
    their own lesson tag; "once" is a particle and drops out of every content-POS
    slot automatically. All four routed to the backfill lane in the report.


    NO unit-wide tag: the broad a2_unit35_prescription tag is UNUSABLE for clean
    pools because every POS narrowing of it still drags in a misgloss (noun ->
    food/course, verb -> taking, particle -> once), so every slot uses a
    per-lesson tag (or a lesson02+lesson04 union) with POS filtering. Because
    these semantic tags are unit-unique, UNIT scope == COURSE scope for every
    slot (no Endless-Practice widening risk -- §1.1).


    14 templates, all 4 lessons in all 3 tiers: recognition 5 (multiple_choice x4,
    listen_select x1), structured 5 (matching_pairs x1, word_order x4),
    production 4 (bare-word translation). lesson04 is thin after excluding "course"
    (name is collateral -- shares the lesson04 noun tag with course, so it is left
    uncovered to keep course out) and is represented in every tier via "gave",
    pooled through the lesson02+lesson04 verb union. lesson03 verbs may/feel are
    likewise collateral to the "taking" exclusion (shared lesson03 verb tag) and
    left uncovered.


    Measured (recipe §9 step 4, filter '.a2.unit35.'): 18/27 lexemes hostable
    (67% >= 60%), each tier 67%, every lesson hosted in every tier. The 9
    uncovered are exactly the 4 misglosses + name/may/feel (collateral) +
    not (particle) + all (pronoun) -- authored honestly, no padding. matching_pairs
    pools lesson01 nouns only (9, all distinct glosses); refill/refills (identical
    gloss "de herhaalmedicatie") are never unioned into one pool, so no
    unanswerable card. multiple_choice/listen_select clear the 3-distinct-value
    floor. word_order uses the generic "Please say {item}." frame (grammatical for
    any token, no candidate floor, "please"/"say" are not taught tokens ->
    no self-reference). Minor quality note for the reviewer: the lesson02 verb
    pool includes pick="ophalen (in pick up)" and stop="stop", whose translation
    PROMPT (the gloss) partially telegraphs the English answer -- accurate, not a
    grading defect, and unavoidable without a token-level exclusion operator.
    PENDING fresh-context review before import.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): read
    all 14 templates against the real unit pool (27 lexemes) and every gloss
    against the en a2_unit35 realization; confirmed food/taking/course/once
    are unsampleable. 1 fixed: lesson04.choose.001 pools lesson02+lesson04
    verbs, so its feedback (een woord uit deze les) was false for the
    lesson02 verbs; now uit dit onderdeel. Deferred (lexeme glosses; no pack
    workaround without dropping the lesson's whole production tier): effects
    is glossed de bijwerkingen, so lesson01.translate.005 shows de
    bijwerkingen and requires effects while a learner correctly types side
    effects (backfill should gloss effects as part of side effects, e.g.
    effecten (in side effects)); pick is glossed ophalen (in pick up), so
    lesson02/lesson04 translate show a prompt containing pick up but accept
    only pick; shouldn't is glossed zou niet moeten and lesson02/lesson04
    translate accept only the contraction (should not graded wrong). No
    native-judgment flags.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a2_unit35_prescription_lesson01
    - a2_unit35_prescription_lesson02
    - a2_unit35_prescription_lesson03
    - a2_unit35_prescription_lesson04
templates:

# ---------------------------------------------------------------------------
# lesson01 -- Tabletten, doseringen en bijwerkingen (9 clean nouns)
# ---------------------------------------------------------------------------
- content_key: practice.nl-en.en.a2.unit35.lesson01.choose.001
  lesson_content_key: en.a2.unit35.lesson01.pharmacy_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: a2_unit35_prescription_lesson01
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een woord uit deze les.'
    language_code: nl
    direction: ltr

- content_key: practice.nl-en.en.a2.unit35.lesson01.listen.002
  lesson_content_key: en.a2.unit35.lesson01.pharmacy_vocabulary
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: a2_unit35_prescription_lesson01
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is het woord dat je hoorde.'
    language_code: nl
    direction: ltr

- content_key: practice.nl-en.en.a2.unit35.lesson01.match.003
  lesson_content_key: en.a2.unit35.lesson01.pharmacy_vocabulary
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: &l01_noun
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: a2_unit35_prescription_lesson01
    second: *l01_noun
    third: *l01_noun
    fourth: *l01_noun
    fifth: *l01_noun
    sixth: *l01_noun
  slot_relations:
  - kind: distinct
    slots: &l01_match_slots
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *l01_match_slots
  feedback_frame:
    text: Verbind elk woord met de juiste Nederlandse betekenis.
    language_code: nl
    direction: ltr

- content_key: practice.nl-en.en.a2.unit35.lesson01.order.004
  lesson_content_key: en.a2.unit35.lesson01.pharmacy_vocabulary
  type: word_order
  frame:
    text: Please say {item}.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: a2_unit35_prescription_lesson01
  answer_derivation:
    kind: render_frame
    frame:
      text: Please say {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '{item} is het gevraagde woord.'
    language_code: nl
    direction: ltr

- content_key: practice.nl-en.en.a2.unit35.lesson01.translate.005
  lesson_content_key: en.a2.unit35.lesson01.pharmacy_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: a2_unit35_prescription_lesson01
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De Engelse vertaling is {item}.
    language_code: nl
    direction: ltr

