schema_version: '1.0'
pack_key: practice.nl-en.a2.unit38
source_language: nl
target_language: en
unit_content_key: en.a2.unit38.repair_visit
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-08-01 (nl-en, a2 unit38 repair_visit, Dutch speakers learning
    English -- target=en). Unit lexeme pool measured with the '.a2.unit38.' filter:
    18 lexemes across all 4 lessons, of which 13 are content-POS (noun/verb):
    lesson01 8 (reschedule/neighbor/key/leak/fixed/afternoon/can't/won't),
    lesson02 1 (leave), lesson03 4 (message/rescheduled/door/confirm),
    lesson04 0 content -- only which (pronoun) + under (preposition).
    Non-content lexemes: 9am/11am (symbol, lesson03), by (preposition, lesson03),
    which (pronoun, lesson04), under (preposition, lesson04).

    Broad unit tag a2_unit38_repair_visit ([noun, verb]) unions all 13 content
    lexemes and clears the multiple_choice 3-distinct-value floor (13 distinct
    Dutch glosses) and the matching_pairs 6-distinct-token floor (13 tokens).
    Recognition/structured/production each carry >=3 templates (3/5/4). lesson04's
    function words (which/under) are hosted via a word_order + translation pair
    anchored to lesson04 with the lesson04 tag + [pronoun, preposition], which by
    construction EXCLUDES the mis-glossed lesson03 preposition `by` (see below).

    THIN UNIT (like the nl-en sibling a2_unit34): only 13 EN content lexemes and
    18 total. Recognition cannot cover lesson04 -- its only lexemes are 2 function
    words, below the 3-distinct multiple_choice floor -- so recognition covers
    lessons 1-3; structured and production cover all 4 lessons. Authored honestly
    per the no-padding rule; flagged checkpoint-thin to the coordinator.

    MIS-GLOSS FOUND (§0.1), routed to backfill lane: `by` (lesson03, preposition)
    carries gloss "met" (=with) but the unit teaches "by message"=per bericht --
    "met" would be shown as the correct meaning. Excluded from all pools (never in
    a [noun,verb] pool; lesson04 templates use the lesson04 tag so `by`'s lesson03
    tag is not matched). Minor: `fixed` gloss "repareerde; vast" is an awkward
    past-tense+"tight" gloss for the past-participle "not broken anymore" sense;
    kept (it is a real content word and the answer is deterministic) but noted.

    word_order uses the generic frame "Please say {item}." (proven in a2_unit34):
    grammatical for any part of speech, no candidate floor, zero self-reference
    (neither "Please" nor "say" is ever a taught token in this unit, at unit or
    course scope -- all slot pools are constrained by unit38-specific tags).
    Needs the standard fresh-context review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a2_unit38_repair_visit
    - a2_unit38_repair_visit_lesson01
    - a2_unit38_repair_visit_lesson02
    - a2_unit38_repair_visit_lesson03
    - a2_unit38_repair_visit_lesson04
templates:

# ---------------------------------------------------------------------------
# lesson01 -- Rescheduling, keys, and neighbors (8 content lexemes)
# ---------------------------------------------------------------------------
- content_key: practice.nl-en.en.a2.unit38.lesson01.choose.001
  lesson_content_key: en.a2.unit38.lesson01.repair_visit_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: &content_pos
      - noun
      - verb
      agreement_tags: &unit_tag
        semantic: a2_unit38_repair_visit
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een woord uit deze unit.'
    language_code: nl
    direction: ltr

- content_key: practice.nl-en.en.a2.unit38.lesson01.match.002
  lesson_content_key: en.a2.unit38.lesson01.repair_visit_vocabulary
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: &match_word
      language_code: en
      part_of_speech: *content_pos
      agreement_tags: *unit_tag
    second: *match_word
    third: *match_word
    fourth: *match_word
    fifth: *match_word
    sixth: *match_word
  slot_relations:
  - kind: distinct
    slots: &match_slots
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *match_slots
  feedback_frame:
    text: Verbind elk Engels woord met de juiste Nederlandse betekenis.
    language_code: nl
    direction: ltr

- content_key: practice.nl-en.en.a2.unit38.lesson01.order.003
  lesson_content_key: en.a2.unit38.lesson01.repair_visit_vocabulary
  type: word_order
  frame:
    text: Please say {item}.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: *content_pos
      agreement_tags: &l01_tag
        semantic: a2_unit38_repair_visit_lesson01
  answer_derivation:
    kind: render_frame
    frame:
      text: Please say {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '{item} is het gevraagde woord.'
    language_code: nl
    direction: ltr

- content_key: practice.nl-en.en.a2.unit38.lesson01.translate.004
  lesson_content_key: en.a2.unit38.lesson01.repair_visit_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: *content_pos
      agreement_tags: *l01_tag
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De Engelse vertaling is {item}.
    language_code: nl
    direction: ltr

