schema_version: '1.0'
pack_key: practice.nl-en.a1.unit02
source_language: nl
target_language: en
unit_content_key: en.a1.unit02.introductions
review:
  status: reviewed
  fresh_context: true
  notes: 'Fresh-context Codex review (2026-07-05, dispatched by Session 3): replaced English feedback mislabeled as Dutch
    with natural Dutch, removed overly broad slot constraints producing invalid outputs (e.g. ''Hello morning'', ''I am a
    library''), reworked matching pairs into genuine same-category pairs, removed a non-generating multiple_choice template
    and a pointless name-to-identical-name match. Independently re-verified by Session 3: compiler 0/0, no jargon leaks, no
    self-referential English glosses. FRESH-CONTEXT REVIEW ADDENDUM (2026-07-06, zero access to any authoring reasoning):
    confirmed lesson_content_key matches the correct lesson in en/a1_unit02_introductions.yaml for all 11 templates; ran a
    standalone harness replicating app/practice/service.py''s lexeme_matches() against scripts/backfill_lexemes_nl_en.py''s
    real iter_specs() output -- identity (6 candidates) and person_name (2) meet the >=4/>=1 bars, am/are/new/work (each single-candidate,
    deterministic slots) meet >=1. Read every frame against its full candidate list by hand: ''I {am} a student.''/''{are}
    you a teacher?''/''Are you a {new} member''/''I {work} at the library.'' are all grammatically sound for their one fixed
    slot value; the bare-word identity/person_name recognition and translation templates carry no sentence-context risk. No
    self-reference, agreement, or homograph issues found. Compiler practice-validate re-confirmed 0/0. Upgrading to reviewed.

    UNIT-SCOPE DEAD-TEMPLATE FIX (2026-07-24, per docs/content/PRACTICE_PACK_RECIPE.md): scripts/_practice_unit_scope_check.py
    flagged lesson02.are_fill.002 as DEAD -- its slot (second_identity_verb: identity + person=second) had 0 unit02-scoped
    candidates. Root cause verified via iter_specs(): the token ''are'' is only ever classified under
    en.a1.unit01.lesson03.wellbeing (taught first in unit01''s ''How are you?''); unit02''s own lesson02 realization reuses
    ''are'' in a new sentence (''Are you a teacher?'') but backfill_lexemes_nl_en.py dedups lexemes by bare token, so no
    unit02-scoped ''are'' spec exists and generate_checkpoint() (which loads only the pack''s own unit) could never fill this
    slot -- 100% dead at checkpoint time despite working fine in Endless Practice. Could not re-anchor in place: no other
    unit02 token is grammatical in ''{item} you a teacher?'' (am/is both ungrammatical there), so widening the slot would only
    trade a DEAD template for an ungrammatical one. Per the recipe''s option 2, dropped are_fill.002 and replaced it with
    lesson02.dialogue_choose.002 (multiple_choice) on the ''dialogue_word'' tag (POS noun) -- already declared in this pack''s
    tag_schema but never used by any template. Verified via iter_specs(): 6 distinct unit02-scoped candidates
    (student/student, teacher/leraar, member/lid, engineer/ingenieur, library/bibliotheek, assistant/medewerker, all
    distinct glosses) -- comfortably clears the >=3 MC floor and, as a bonus, gives lesson02 its first recognition-tier
    template (previously 0: am_fill/are_fill were both
    fill_in_blank/structured, member_order word_order/structured, new_translate production). LOGGED for the coordinator:
    ''are'' needs a backfill_lexemes_nl_en.py change to emit a unit02-scoped spec (or a shared cross-unit reuse mechanism)
    if a checkpoint-visible ''Are you a teacher?'' exercise is ever wanted for this unit; not fixable from the pack alone.
    Re-verified 0 DEAD via scripts/_practice_unit_scope_check.py and 0 errors via compile_content.py practice-validate.

    POLISH WAVE 2 (2026-07-25, tier-thinness): recognition tier had only 2 live templates (identity_meaning.004,
    dialogue_choose.002) -- below the recipe SS8 >=3-per-tier floor. Added lesson03.dialogue_listen.004 (listen_select,
    target en has working TTS) on the pack''s own already-declared ''dialogue_word'' noun tag: 6 distinct unit02-scoped
    tokens/glosses (student/teacher/member/engineer/library/assistant), verified via iter_specs(). Bare ''{item}'' audio
    frame, so no course-scope grammaticality or distractor-substring risk; also gives lesson03 its first recognition-tier
    template. Re-verified 0 DEAD / 0 tier-short via scripts/_practice_unit_scope_check.py and 0 errors via
    compile_content.py practice-validate.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - identity
    - person_name
    - dialogue_word
    - volume_nl_en_a1_unit02_person_name_06_single
    - volume_nl_en_a1_unit02_new_08_single
    - volume_nl_en_a1_unit02_work_09_single
    person:
    - first
    - second
    - third
slot_presets:
  person_name: &id001
    language_code: en
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  identity_pronoun: &id002
    language_code: en
    part_of_speech: pronoun
    agreement_tags:
      semantic: identity
  first_identity_verb: &id003
    language_code: en
    part_of_speech: verb
    agreement_tags:
      semantic: identity
      person: first
  second_identity_verb: &id004
    language_code: en
    part_of_speech: verb
    agreement_tags:
      semantic: identity
      person: second
  new: &id005
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: dialogue_word
  work: &id006
    language_code: en
    part_of_speech: verb
    agreement_tags:
      semantic: dialogue_word
templates:
- content_key: practice.nl-en.en.a1.unit02.lesson01.name_order.001
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: word_order
  frame:
    text: My name is {person_name}
    language_code: en
    direction: ltr
  slots:
    person_name: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: My name is {person_name}
      language_code: en
      direction: ltr
  feedback_frame:
    text: De volledige zin is My name is {person_name}.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit02.lesson01.identity_translate.003
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: '{identity}'
    language_code: nl
    direction: ltr
    slot_rendering:
      identity: english_gloss
  slots:
    identity: *id002
  answer_derivation:
    kind: slot_text
    slot: identity
  feedback_frame:
    text: De Engelse vertaling is {identity}.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit02.lesson01.identity_meaning.004
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: multiple_choice
  frame:
    text: '{identity}'
    language_code: en
    direction: ltr
  slots:
    identity: *id002
  answer_derivation:
    kind: slot_gloss
    slot: identity
