schema_version: '1.0'
pack_key: practice.nl-en.b2.unit04
source_language: nl
target_language: en
unit_content_key: en.b2.unit04.narrative_time
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored against docs/content/PRACTICE_PACK_RECIPE.md for the nl-en batch D dispatch. Capacity:
    71 unit lexemes across 4 lessons (all with lexemes). This unit relies entirely on the auto-generated
    unit-wide semantic tag "b2_unit04_narrative_time" (and its per-lesson "_lessonNN" siblings, unused
    here) that scripts/backfill_lexemes_nl_en.py assigns to every b1_/b2_ unit -- there is NO hand-authored
    per-lesson semantic classification for B1/B2 content words yet in scripts/_en_target_lexeme_common.py
    (unlike A1/A2), so every slot in this pack uses ONLY the broad unit-wide tag plus part_of_speech narrowing,
    never a lesson-scoped or single-member anchor tag. Content-word pool (noun/verb/adjective/adverb,
    excludes function words, proper nouns, pronouns): 61 distinct tokens, 61 distinct Dutch glosses --
    comfortably clears the multiple_choice/listen_select >=3-distinct-value floor (22 of those are nouns,
    34 are verb/adjective). matching_pairs uses the SAME broad content-word pool as recognition/production
    (not noun-only -- a noun-only pool left several sibling units in this batch under the 40% structured-tier
    coverage bar and one lesson short of 4/4 lesson coverage in that tier; widening to the full noun/verb/adjective/adverb
    pool fixed both, measured via the recipe''s own capacity/coverage harness). DELIBERATE DESIGN CHOICE:
    this pack authors ZERO word_order and ZERO fill_in_blank templates. Both types need either a single-member
    anchor tag (fill_in_blank hard-requires a course-wide 1-candidate pool per AUTHORING_GUIDE #17) or
    a literal frame whose COURSE-SCOPE candidate pool is entirely grammatical (word_order, recipe #1.1/#6.4)
    -- neither is buildable from the only tags this classifier currently provides (a broad unit-wide union
    tag), so attempting either type here would mean either a guaranteed compiler hard-fail or an unverifiable
    grammaticality claim across the whole B1/B2 course. Structured tier is instead covered entirely by
    3 matching_pairs templates (bare left/right pairs have no sentence-grammaticality risk at any scope),
    comfortably clearing the >=3-structured-template / >=12-distinct-item / >=40%-tier-coverage bars.
    All recognition (multiple_choice, listen_select) and production (translation, bare-word) templates
    use frame.text == "{item}" only (no literal surrounding text), which per recipe #3.1(c) is explicitly
    safe with an untagged-scope-style broad pool at any scope (unit or course). Recommend routing a follow-up
    backfill task to add per-lesson-specific single-member anchor tags for B1/B2 (mirroring the A1/A2
    pattern in _en_target_lexeme_common.py) so a future pass can add word_order/fill_in_blank precision
    templates here.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - b2_unit04_narrative_time
