schema_version: "1.0"
pack_key: practice.nl-en.a2.unit25
source_language: nl
target_language: en
unit_content_key: en.a2.unit25.bureaucracy
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-06 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en lane). This is the
    first A2-level unit for this direction (registering with local
    authorities: appointments, documents, formal requests). Extended
    scripts/backfill_lexemes_nl_en.py's UNIT_FILES to include units 25-26
    and added Dutch glosses for the English tokens plus classification
    for the Dutch source-side tokens found in this unit's overlay gloss
    text. Added a 4-member 'bureaucracy_noun' tag (appointment/document/
    form/confirmation, defined in the shared scripts/
    _en_target_lexeme_common.py) used ONLY for bare-word recognition --
    deliberately did not attempt a generative frame, since this unit's
    A2-register content is dominated by multi-word formal phrases ('I
    was wondering whether...', 'Could you tell me...') that don't reduce
    to a safe single-token slot, consistent with this session's standing
    'don't force it' discipline for vocabulary that doesn't support a
    safe shared frame. Every slot's real candidate count was verified
    with a standalone lexeme_matches()-replicating harness against this
    script's actual output. Needs the standard fresh-context review
    before import. Same blocking dependency as every earlier nl-en pack:
    backfill_lexemes_nl_en.py has not actually been run against a real
    database yet. 2026-07-06 matching_pairs widening (AUTHORING_GUIDE.md #16): expanded the bureaucracy_noun (noun) matching_pairs template from 2 to 4 pairs.
    2026-07-06 depth pass (templates-per-unit audit): added 7 new templates
    (multiple_choice/listen_select/translation against the same 4-member
    bureaucracy_noun tag) spread across lesson02/lesson03/lesson04 so every
    one of this unit's 4 lessons now gets bare-word recognition + translation
    repetition, mirroring the established pattern already reviewed in
    a1_unit21.yaml (travel_noun, also a no-generative-frame recognition-only
    tag) and a1_unit23.yaml (occupation_noun). Did NOT add a second
    matching_pairs template -- bureaucracy_noun's real course-wide candidate
    pool is capped at exactly 4 tokens, so a second matching_pairs against
    the same 4 tokens would be a near-duplicate of the existing one, not new
    content. Did NOT attempt word_order/fill_in_blank -- this unit's A2
    content is dominated by multi-word formal phrases that don't reduce to
    a single fillable slot, same 'don't force it' reasoning as the original
    authoring note above, re-confirmed not re-litigated. 6 -> 13 templates.
    Every new template's real candidate count re-verified with the
    standalone lexeme_matches()-replicating harness
    (scripts/_practice_slot_check.py)."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [bureaucracy_noun]
slot_presets:
  bureaucracy_noun: &bureaucracy_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: bureaucracy_noun}}
templates:
  - content_key: practice.nl-en.en.a2.unit25.lesson01.choose.001
    lesson_content_key: en.a2.unit25.lesson01.registration_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *bureaucracy_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit25.lesson01.listen.002
