schema_version: "1.0"
pack_key: practice.nl-en.a1.unit34
source_language: nl
target_language: en
unit_content_key: en.a1.unit34.sports
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-11, nl-en depth-completion sprint (see
    a1_unit30.yaml's notes for the sprint context). Two tags: 'sport_noun'
    (all 6 lesson01 vocabulary items -- soccer/tennis/basketball/
    swimming/yoga/exercise, all classified noun) for bare-word
    recognition/matching, and a narrower 3-member 'play_sport'
    (soccer/tennis/basketball only) for a real generative frame, 'We
    play {item}.' -- the unit's own overlay notes explicitly flag that
    English uses a DIFFERENT verb per sport category (play for ball
    sports, go for swimming/running, do for yoga), so a single shared
    frame can only safely use the 3 members that genuinely take 'play'
    (swimming needs 'go swimming', yoga needs 'do yoga' -- including
    either in a 'play {item}' frame would generate real ungrammatical
    output, 'play swimming'/'play yoga'). Extended
    scripts/_en_target_lexeme_common.py/scripts/backfill_lexemes_nl_en.py
    with every introduced_token this unit's realization uses. Every
    slot's real candidate count verified with
    scripts/_practice_slot_check.py (sport_noun: 6, play_sport: 3, both
    above the >=3 floor). Needs the standard fresh-context review before
    import."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [sport_noun, play_sport]
slot_presets:
  sport_noun: &sport_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: sport_noun}}
  play_sport: &play_sport {language_code: en, part_of_speech: noun, agreement_tags: {semantic: play_sport}}
templates:
  - content_key: practice.nl-en.en.a1.unit34.lesson01.choose.001
    lesson_content_key: en.a1.unit34.lesson01.sports_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *sport_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een sport uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit34.lesson01.listen.002
    lesson_content_key: en.a1.unit34.lesson01.sports_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *sport_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit34.lesson01.match.003
    lesson_content_key: en.a1.unit34.lesson01.sports_vocabulary
    type: matching_pairs
    frame: {text: "{first} · {second}", language_code: en, direction: ltr}
    slots: {first: *sport_noun, second: *sport_noun, third: *sport_noun, fourth: *sport_noun, fifth: *sport_noun, sixth: *sport_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Verbind elke sport met de Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit34.lesson01.translate.004
    lesson_content_key: en.a1.unit34.lesson01.sports_vocabulary
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *sport_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit34.lesson01.order.005
    lesson_content_key: en.a1.unit34.lesson01.sports_vocabulary
    type: word_order
    frame: {text: "We play {item}", language_code: en, direction: ltr}
    slots: {item: *play_sport}
    answer_derivation: {kind: render_frame, frame: {text: "We play {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de genoemde sport.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit34.lesson03.translate.001
    lesson_content_key: en.a1.unit34.lesson03.dialogue_weekend_plans
    type: translation
    frame: {text: "We spelen {item}.", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *play_sport}
    answer_derivation: {kind: render_frame, frame: {text: "We play {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "We play {item}. betekent We spelen {item}.", language_code: nl, direction: ltr}
