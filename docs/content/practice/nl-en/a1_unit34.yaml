unit_content_key: en.a1.unit34.sports
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-22 (nl-en practice pass, fresh context; 0 fixes; frames and pools checked (We play {item} limited to ball sports). NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: none. Authored 2026-07-11, nl-en depth-completion sprint (see a1_unit30.yaml''s notes for the sprint context). Two tags:
    ''sport_noun'' (all 6 lesson01 vocabulary items -- soccer/tennis/basketball/ swimming/yoga/exercise, all classified noun)
    for bare-word recognition/matching, and a narrower 3-member ''play_sport'' (soccer/tennis/basketball only) for a real
    generative frame, ''We play {item}.'' -- the unit''s own overlay notes explicitly flag that English uses a DIFFERENT verb
    per sport category (play for ball sports, go for swimming/running, do for yoga), so a single shared frame can only safely
    use the 3 members that genuinely take ''play'' (swimming needs ''go swimming'', yoga needs ''do yoga'' -- including either
    in a ''play {item}'' frame would generate real ungrammatical output, ''play swimming''/''play yoga''). Extended scripts/_en_target_lexeme_common.py/scripts/backfill_lexemes_nl_en.py
    with every introduced_token this unit''s realization uses. Every slot''s real candidate count verified with scripts/_practice_slot_check.py
    (sport_noun: 6, play_sport: 3, both above the >=3 floor). Needs the standard fresh-context review before import. FRESH-CONTEXT
    REVIEW ADDENDUM (2026-07-11, zero access to authoring reasoning): lesson_content_keys (lesson01.sports_vocabulary, lesson03.dialogue_weekend_plans)
    resolve to real lessons in en/a1_unit34_sports.yaml. sport_noun (6 members) and the narrower play_sport (soccer/tennis/basketball)
    both have distinct Dutch glosses. Frame ''We play {item}'' is grammatical only for the 3 play_sport members and matches
    ''We play soccer.''; swimming/yoga are correctly kept out of the ''play'' frame (they need go/do). No bare YAML booleans,
    no snake_case learner-facing leaks. Validation: compiler practice-validate 0/0 across the full 42-pack nl-en set, scripts/_practice_slot_check.py
    OK, backfill_lexemes_nl_en.py --dry-run clean. Upgrading to reviewed.


    DEAD-template remediation 2026-07-24 (PACK-ONLY, scripts/_practice_unit_scope_check.py): lesson01.match.003 declared 6 matching_pairs
    slots against sport_noun constrained to part_of_speech: noun, but ''exercise'' -- the 6th sport_noun member -- is itself
    classified part_of_speech: verb, so the noun-only constraint silently excluded it, leaving only 5 unit-scoped candidates
    (soccer/tennis/basketball/swimming/yoga) against a declared need of 6 -> DEAD. Minimal fix (recipe SS3.1(a), widen POS
    rather than change the semantic tag): added a sport_word preset identical to sport_noun but with part_of_speech: [noun,
    verb], used ONLY on match.003''s six slots -- this pulls ''exercise'' (gloss ''sporten / bewegen'') back in, reaching exactly
    6 distinct unit-scoped tokens, matching the declared 6 slots. Left choose.001/listen.002/translate.004 on the original
    noun-only sport_noun preset (id001) untouched -- their 5-distinct pool already clears the 3-floor and was never flagged.
    Verified 0 DEAD / 0 below-floor via scripts/_practice_unit_scope_check.py and compiler practice-validate 0 errors after
    the fix.


    Polish wave 2 (2026-07-25, tier-thinness): recognition and production tiers each had only 2 live templates (<3 floor,
    recipe SS8). Added lesson02.choose.001 (multiple_choice over the existing sport_word preset -- semantic sport_noun
    with part_of_speech [noun, verb], 6 unit-scoped tokens / 6 distinct glosses, differs from lesson01.choose.001''s
    noun-only 5-token pool by including ''exercise'') and lesson02.translate.002 (NL prompt ''Zij speelt {item} in het
    weekend.'' with gloss rendering over play_sport, EN render_frame ''She plays {item} on the weekend'' -- play_sport
    is exactly soccer/tennis/basketball course-wide, all three take ''plays''/''speelt''; ''weekends'' is lesson02''s own
    vocab). Both tiers now at 3 live.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - sport_noun
    - play_sport
    - volume_nl_en_a1_unit34_item_07_single
slot_presets:
  sport_noun: &id001
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: sport_noun
  play_sport: &id002
    language_code: en
    part_of_speech: noun
    agreement_tags:
      semantic: play_sport
  sport_word: &id003
    language_code: en
    part_of_speech: [noun, verb]
    agreement_tags:
      semantic: sport_noun
