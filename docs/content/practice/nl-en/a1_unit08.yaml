schema_version: "1.0"
pack_key: practice.nl-en.a1.unit08
source_language: nl
target_language: en
unit_content_key: en.a1.unit08.shopping
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: "Review 2026-10-22 (nl-en practice pass, fresh context; 2 fixes). (1) label_pair.002: matching_pairs below the 6-pair floor (5 pairs) -- widened to the quantity_unit plus food_plural union with 6 slots; frame and feedback now speak of words on the price label instead of only units. (2) price_question_order.001: question frame lacked the question mark -- added. NATIVE FLAGS: pounds_translate.003 and total_translate.002 translate a bare digit 4 to 4 (identity exercise). BACKFILL GLOSS FLAGS: none. Authored 2026-07-05 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en direction, per the
    coordinator's scope split). Keyed to English target lexemes extended into
    the shared scripts/_en_target_lexeme_common.py plus this pair's own Dutch
    glosses added to scripts/backfill_lexemes_nl_en.py. Two grammar-agreement
    traps deliberately avoided (same bug class caught in earlier packs this
    pass): (1) added a new, generally-reusable 'count_plural' tag (the
    established 'number' tag minus 'one', 21 members) for any '{item}
    things' plural-count frame ('Can I have {item} pounds/dozen eggs,
    please?') -- 'one' would need the singular 'pound' instead and silently
    produce a real grammar error if included; (2) added a narrow
    'food_plural' tag (apples/eggs/tomatoes only, 3 members) for 'How much
    are the {item}?', deliberately excluding unit07's food_item set
    (coffee/tea/water/bread/soup/salad/sandwich), which are mass/singular
    nouns that would need 'is' not 'are' -- 'quantity_unit' (pound/dozen/
    bottle/bag/kilo, 5 members) is used only for bare-word recognition and
    translation, never slotted into a '{count} {item}' frame, since most of
    those units need an explicit plural '-s' form that isn't taught/glossed
    separately from the singular. Every slot's real candidate count was
    verified with the same standalone lexeme_matches()-replicating harness
    used for every other pack this pass. The underlying en realization
    unit08 IS fresh-context reviewed already (and itself documents a real
    content bug the review caught and fixed: a cheapest-item exercise keyed
    to the wrong item); the nl-en overlay itself is still unreviewed. Needs
    the standard fresh-context review before import. Same blocking DB-level
    gap as every other pack from this pass: no backfill_lexemes_nl_en.py run
    has actually happened against a real database yet.
    FOLLOW-UP FIX 2026-07-06: a fresh-context reviewer flagged that bare
    'hundred' (no article, real content only ever teaches 'one hundred') was
    reachable in lesson02/lesson04's price/quantity frames, producing
    'Can I have hundred pounds, please?'/'That's hundred dollars.' Fixed by
    adding 'count_plural_no_hundred' (20 members) and 'number_no_hundred' (21
    members) to scripts/_en_target_lexeme_common.py and re-pointing
    lesson02.pounds_fill/pounds_translate, lesson04.dozen_eggs_order (all
    count_plural -> count_plural_no_hundred) and lesson04.total_fill/
    total_translate (number -> number_no_hundred) to the narrower tags.
    Re-verified with compile_content.py practice-validate (0/0) and a
    standalone harness confirming 'hundred' is no longer reachable in any of
    the fixed slots. 2026-07-06 matching_pairs widening (AUTHORING_GUIDE.md #16): expanded the quantity_unit (noun) matching_pairs template from 2 to 5 pairs.

    UNIT-SCOPE DEAD-TEMPLATE FIX (2026-07-24, per docs/content/PRACTICE_PACK_RECIPE.md): scripts/_practice_unit_scope_check.py
    flagged 3 DEAD (lesson02.pounds_translate.003, lesson04.dozen_eggs_order.002, lesson04.total_translate.004) + 2
    below-floor matching_pairs. Root cause: 'count_plural_no_hundred' and 'number_no_hundred' are (like plain 'number')
    only ever classified starting at a1.unit03 and never reintroduced with a unit08-scoped lesson_content_key -- the
    same systemic gap already logged against nl-en a1_unit05/a1_unit07 -- so all 3 slots had 0 unit08-scoped candidates
    at checkpoint time despite working in Endless Practice. Also confirmed: lesson04 (market_dialogue) introduces ZERO
    of its own lexemes at all (verified via iter_specs()) -- every one of its templates necessarily draws on lesson01/02/03
    vocabulary, which is fine for checkpoint satisfiability (unit-scoped, not lesson-scoped) but explains why no genuinely
    lesson04-native number/count word was ever an option here.

    Fixed lesson02.pounds_translate.003 and lesson04.total_translate.004 (originally: fixed-sentence 'Can I have {item}
    pounds, please'/'That's {item} dollars' render_frame translations) by re-anchoring to unit08's own price-symbol
    tokens (just '4', from lesson03.reading_price_labels) and converting both to bare-word translations (frame '{item}',
    no other literal text) -- removes the DEAD unit-scope issue AND sidesteps the course-scope grammaticality risk a
    fixed-sentence render would carry (a1-course-wide 'symbol' POS also covers ordinals/dates/dollar-amounts that would
    NOT make sense substituted into 'pounds'/'dollars' sentences at Endless-Practice course scope; a bare-word translate
    has no such risk, SS6.6a). DROPPED lesson04.dozen_eggs_order.002 (word_order) outright rather than force the same
    single-symbol fix onto a word_order frame: 'Can I have 4 dozen eggs, please' is fine for the digit '4', but course-wide
    'symbol' also includes date/time/price tokens (12th, 3:00, $10, 911, ...) that are NOT sensible as a bare dozen-count,
    and word_order's grammaticality-in-frame rule is COURSE-scoped (SS1.1/SS6.4) -- unlike bare-word translation this
    type has no escape hatch from that risk. lesson04 stays structurally fine without it (structured tier: quantity_pair.003
    + price_question_order.001 + label_pair.002 = 3, still clears the floor) -- replaced the lost template one-for-one
    with lesson02.fresh_translate.004 (bare-word translation on the unit's only adjective, 'fresh', single unit08-scoped
    candidate, safe) to keep the pack at its original 12-template count net of the drop, and to give lesson02 a second
    production-tier item.

    Also widened lesson01.quantity_pair.003 (matching_pairs) from the 'quantity_unit'-only pool (5 pairs, below the
    recipe's 6-pair standard) to the union of quantity_unit + food_plural (both unit08-native: pound/dozen/bottle/bag/
    kilo/eggs/tomatoes, 7 distinct glosses -- pond/dozijn/fles/zak/kilo/eieren/tomaten, no duplicates), now declaring the
    full 6 pairs. Softened its frame text from a units-specific claim to a generic 'de Engelse woorden uit deze les'
    since the widened pool mixes measurement units with food nouns. Left lesson03.label_pair.002 at its original 5 pairs
    (still fully generatable, just below the 6-pair standard) rather than union it with the identical food_plural set too
    -- that would have made it a near-duplicate of the newly-widened lesson01 template over the same closed 7-word pool;
    the structured tier does not need a third 6-pair matching_pairs to clear its floor.

    Removed the now-unused count_plural/count_plural_no_hundred/number/number_no_hundred tags from tag_schema (no slot
    references them after this fix). LOGGED for the coordinator: en-target number words need a backfill_lexemes_nl_en.py
    change to emit unit-scoped specs wherever a later unit's own realization actually uses a number, if checkpoint-visible
    price/quantity sentences are ever wanted for unit08 (and unit05/unit07, same gap). Re-verified 0 DEAD via
    scripts/_practice_unit_scope_check.py and 0 errors via compile_content.py practice-validate.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): read every template against its unit- and course-scoped pools. Fixed:
    (1) lesson02.fresh_translate.004 used an untagged adjective slot (145 adjectives at
    course scope with gloss collisions, e.g. 'goed' -> good/fine, 'oké' -> okay/ok, so a
    correct answer could be graded wrong); narrowed to a1_unit08_shopping_lesson02 (fresh,
    same as unit scope). (2) price_symbol (pounds_translate.003, total_translate.002) was
    untagged and widened at course scope to times/ordinals/dollar amounts with one fixed
    answer each; narrowed to a1_unit08_shopping_lesson03 (the unit's own '4'). (3)
    label_pair.002 feedback said 'twee' for a 5-pair exercise -- reworded. (4)
    price_question_order.001 feedback 'waarnaar geprijsd wordt gevraagd' was not
    idiomatic Dutch -- reworded. Not changed: label_pair.002 has 5 pairs (unit has only 5
    quantity_unit lexemes)."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [quantity_unit, food_plural, a1_unit08_shopping_lesson02, a1_unit08_shopping_lesson03]
slot_presets:
  quantity_unit: &quantity_unit {language_code: en, part_of_speech: noun, agreement_tags: {semantic: quantity_unit}}
  food_plural: &food_plural {language_code: en, part_of_speech: noun, agreement_tags: {semantic: food_plural}}
  quantity_food_union: &quantity_food_union {language_code: en, part_of_speech: noun, agreement_tags: {semantic: [quantity_unit, food_plural]}}
  price_symbol: &price_symbol {language_code: en, part_of_speech: symbol, agreement_tags: {semantic: a1_unit08_shopping_lesson03}}
templates:
  - content_key: practice.nl-en.en.a1.unit08.lesson01.quantity_meaning.001
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een hoeveelheidswoord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit08.lesson01.quantity_listen.002
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit08.lesson01.quantity_pair.003
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: matching_pairs
    frame: {text: "Koppel de Engelse woorden aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
    slots: {first_unit: *quantity_food_union, second_unit: *quantity_food_union, third_unit: *quantity_food_union, fourth_unit: *quantity_food_union, fifth_unit: *quantity_food_union, sixth_unit: *quantity_food_union}
    slot_relations: [{kind: distinct, slots: [first_unit, second_unit, third_unit, fourth_unit, fifth_unit, sixth_unit]}]
    answer_derivation: {kind: matching_pairs, slots: [first_unit, second_unit, third_unit, fourth_unit, fifth_unit, sixth_unit]}
    feedback_frame: {text: "Je hebt de Engelse woorden uit deze les gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit08.lesson01.quantity_translate.004
    lesson_content_key: en.a1.unit08.lesson01.quantities
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *quantity_unit}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit08.lesson02.price_question_order.001
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: word_order
    frame: {text: "How much are the {item}?", language_code: en, direction: ltr}
    slots: {item: *food_plural}
    answer_derivation: {kind: render_frame, frame: {text: "How much are the {item}?", language_code: en, direction: ltr}}
    feedback_frame: {text: "Je vraagt naar de prijs van: {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit08.lesson02.pounds_translate.003
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *price_symbol}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit08.lesson02.fresh_translate.004
    lesson_content_key: en.a1.unit08.lesson02.asking_prices
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: a1_unit08_shopping_lesson02}}}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit08.lesson03.label_meaning.001
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is de eenheid op dit prijslabel.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit08.lesson03.label_pair.002
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: matching_pairs
    frame: {text: "Koppel de Engelse woorden van het prijslabel aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
    slots: {first_unit: *quantity_food_union, second_unit: *quantity_food_union, third_unit: *quantity_food_union, fourth_unit: *quantity_food_union, fifth_unit: *quantity_food_union, sixth_unit: *quantity_food_union}
    slot_relations: [{kind: distinct, slots: [first_unit, second_unit, third_unit, fourth_unit, fifth_unit, sixth_unit]}]
    answer_derivation: {kind: matching_pairs, slots: [first_unit, second_unit, third_unit, fourth_unit, fifth_unit, sixth_unit]}
    feedback_frame: {text: "Je hebt de woorden van het prijslabel gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit08.lesson03.label_translate.003
    lesson_content_key: en.a1.unit08.lesson03.reading_price_labels
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *quantity_unit}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit08.lesson04.quantity_listen.001
    lesson_content_key: en.a1.unit08.lesson04.market_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *quantity_unit}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit08.lesson04.total_translate.002
    lesson_content_key: en.a1.unit08.lesson04.market_dialogue
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *price_symbol}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
