schema_version: '1.0'
pack_key: practice.nl-en.a1.unit43
source_language: nl
target_language: en
unit_content_key: en.a1.unit43.colors
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-07-12 as an additive Endless Practice coverage backfill for nl-en A1 unit 43. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.

    POLISH 2026-07-25 (wave 2, tier-thinness + POS-only matching_pairs pass):
    (1) POS-ONLY MATCHING match.002 and volume_match.006 are LEFT POS-only,
    honestly: unit43's lexeme specs carry ZERO semantic tags (recombination-style
    colors unit), so no semantic union of unit-native tags is possible and a
    wrong union would be worse than the status quo. (2) Tier-thinness:
    recognition, structured and production each had 2 live templates.
    Recognition += lesson02.choose.001 (multiple_choice over the unit's 8
    adjectives, part_of_speech adjective only -- 8 distinct unit glosses, above
    the 3-option floor and a narrower pool than the all-POS choose.001).
    Production += lesson04.translate.001 (bare-word translation over the same 8
    adjectives; POS-only is safe for bare translation because the prompt varies
    with the answer; all glosses distinct). Structured stays honestly THIN at 2
    live: with zero semantic tags there is no single-member anchor for
    fill_in_blank, any POS-only word_order frame must be grammatical for every
    course-scope a1 adjective/noun (including five-minute, own, several, and
    possessives classified as nouns) and no frame survives that, and adding a
    third POS-only matching_pairs would add a new instance of the very defect
    class this wave retires.

    POLISH 2026-07-26 (wave 3, generated-tag re-anchor pass): commit
    05af7ace added generated unit/lesson semantic tags (a1_unit43_colors,
    23 unit-scoped members; a1_unit43_colors_lesson01) that resolve both
    wave-2 honest-leaves above. (1) Re-anchored match.002 to semantic:
    a1_unit43_colors with part_of_speech [noun, verb, adjective, adverb] --
    23 unit-scoped tokens, all distinct glosses, 0 course-scope extras --
    and raised it from 4 to 6 slots now that the pool supports it.
    Re-anchored volume_match.006 to the same tag narrowed to
    part_of_speech: adjective (8 unit-scoped tokens: beautiful/bright/dark/
    everyday/fun/light/professional/yellow), also raised 4 -> 6 slots;
    distinct pool from match.002 (adjective-only subset vs the full
    content-POS union), no duplicate glosses in either. (2) Structured
    tier-thinness fixed: added lesson01.fill.004, a fill_in_blank anchored
    to a1_unit43_colors_lesson01 narrowed to adjective -- exactly one
    course-wide candidate (yellow), the single-member anchor wave 2 could
    not build with zero semantic tags. Frame "The sun is {item}." has
    visible text besides the blank and is grammatical for its one
    candidate. Structured now 3 live (match.002, volume_match.006,
    fill.004). Verified with pool_check.py: both matching_pairs pools
    clear 6 distinct/6 glosses with 0 course-scope extras; fill.004's slot
    is a single course-wide candidate.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a1_unit43_colors
    - a1_unit43_colors_lesson01
slot_presets:
  unit_word:
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
  unit_adjective: &u43_adj
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: a1_unit43_colors
templates:
- content_key: practice.nl-en.en.a1.unit43.lesson01.choose.001
  lesson_content_key: en.a1.unit43.lesson01.colors_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - symbol
      - noun
      - proper_noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
      agreement_tags:
        semantic: a1_unit43_colors
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Kies de betekenis van {item}.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit43.lesson01.match.002
  lesson_content_key: en.a1.unit43.lesson01.colors_vocabulary
  type: matching_pairs
  frame:
    text: '{first} — {second} — {third} — {fourth} — {fifth} — {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: &u43_union {language_code: en, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: a1_unit43_colors}}
    second: *u43_union
    third: *u43_union
    fourth: *u43_union
    fifth: *u43_union
    sixth: *u43_union
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each word with its meaning.
    language_code: en
    direction: ltr
- content_key: practice.nl-en.en.a1.unit43.lesson01.translate.003
  lesson_content_key: en.a1.unit43.lesson01.colors_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech:
      - symbol
      - noun
      - proper_noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
      agreement_tags:
        semantic: a1_unit43_colors
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Geef het Engelse woord.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit43.lesson01.fill.004
  lesson_content_key: en.a1.unit43.lesson01.colors_vocabulary
  type: fill_in_blank
  frame:
