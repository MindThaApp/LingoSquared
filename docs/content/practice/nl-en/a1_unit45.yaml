schema_version: '1.0'
pack_key: practice.nl-en.a1.unit45
source_language: nl
target_language: en
unit_content_key: en.a1.unit45.emergencies
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: true
  notes: >-
    Review 2026-10-22 (nl-en practice pass, fresh context; (7 fixes). translate.003, volume_translate.004, lesson03.translate.006: pool -- narrowed to nouns and adjectives (inflected verb prompts such as brandt and vatte were underdetermined). match.002, volume_match.004, lesson04.match.005: Dutch -- English feedback now Dutch. volume_match.004 text block Dutch. NATIVE FLAGS: goodness=goedheid and notice=bericht gloss quality. BACKFILL GLOSS FLAGS: department=dienst, burning=brandt, goodness=goedheid, notice=bericht. 

    Authored 2026-07-12 as an additive Endless Practice coverage backfill for nl-en A1 unit 45. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.

    POLISH 2026-07-26 (wave 3, generated-tag re-anchor pass): commit
    05af7ace added generated unit/lesson semantic tags. Re-anchored all 3
    POS-only matching_pairs and raised the two lesson01-anchored ones from
    4 to 6 slots: lesson01.match.002 -> semantic a1_unit45_emergencies
    (unit-wide, part_of_speech [noun, verb, adjective, adverb], 28 unit
    tokens, all distinct glosses). lesson01.match.002.volume_match.004 ->
    same unit-wide tag narrowed to part_of_speech: [adjective, adverb] (6
    tokens: finally/hurt/relieved/safe/safer/third) -- distinct pool from
    match.002 (adj/adv-only subset), exactly at the floor.
    lesson04.match.005 -> semantic a1_unit45_emergencies_lesson04 (12
    tokens, its own lesson's content words, clears the floor alone) in
    place of the unit-wide tag to keep it distinct from the other two
    pools. Verified with pool_check.py: all three pools clear their floor
    with 0 course-scope extras (tags are unit-scoped by construction).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a1_unit45_emergencies
    - a1_unit45_emergencies_lesson03
    - a1_unit45_emergencies_lesson04
slot_presets:
  unit_word:
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
templates:
- content_key: practice.nl-en.en.a1.unit45.lesson01.choose.001
  lesson_content_key: en.a1.unit45.lesson01.emergency_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - symbol
      - noun
      - proper_noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
      agreement_tags:
        semantic: a1_unit45_emergencies
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Kies de betekenis van {item}.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit45.lesson01.match.002
  lesson_content_key: en.a1.unit45.lesson01.emergency_vocabulary
  type: matching_pairs
  frame:
    text: '{first} — {second} — {third} — {fourth} — {fifth} — {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: &u45_unit {language_code: en, part_of_speech: [noun, verb, adjective, adverb], agreement_tags: {semantic: a1_unit45_emergencies}}
    second: *u45_unit
    third: *u45_unit
    fourth: *u45_unit
    fifth: *u45_unit
    sixth: *u45_unit
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Verbind elk woord met de Nederlandse betekenis.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit45.lesson01.translate.003
  lesson_content_key: en.a1.unit45.lesson01.emergency_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
