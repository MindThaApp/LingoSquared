schema_version: '1.0'
pack_key: practice.nl-en.a1.unit41
source_language: nl
target_language: en
unit_content_key: en.a1.unit41.cooking
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-07-11, nl-en depth-completion sprint (see a1_unit30.yaml''s notes for the sprint context). 3-member
    ''cooking_verb'' tag (chop/boil/taste, all verbs) for bare-word recognition only -- deliberately excludes the lesson''s
    other two vocabulary items (''recipe''/''ingredient'', nouns) to keep part_of_speech uniform within the tag, AND excludes
    the lesson''s own ''cook'' -- a real homograph collision found while extending scripts/_en_target_lexeme_common.py: ''cook''
    is already classified ''noun'' (unit23''s occupation sense, ''She is a cook''), so declaring it ''verb'' here for this
    tag would silently find zero real candidates at runtime (part_of_speech must be uniform per lexeme across the whole course).
    Exactly 3 members -- at the >=3 floor for multiple_choice/ listen_select, one fewer than the original 4-member draft.
    No shared generative frame attempted (each verb needs its own object -- chop the onions, boil the water/pasta, taste the
    sauce -- that doesn''t reduce to one single-object shared frame), same ''don''t force it'' discipline as unit25/unit27''s
    bureaucracy_noun/banking_noun. Repeated the tag''s bare-word recognition against lesson02 for depth. Extended scripts/_en_target_lexeme_common.py/scripts/backfill_lexemes_nl_en.py
    with every introduced_token this unit''s realization uses. Every slot''s real candidate count verified with scripts/_practice_slot_check.py
    (3 distinct, at the >=3 floor). Needs the standard fresh-context review before import. FRESH-CONTEXT REVIEW ADDENDUM (2026-07-11,
    zero access to authoring reasoning): lesson_content_keys (lesson01.cooking_vocabulary, lesson02.preparing_a_meal) resolve
    to real lessons in en/a1_unit41_cooking.yaml. cooking_verb (chop/boil/taste = fijnsnijden/koken/proeven) sits at the >=3
    floor and is recognition-only; the homograph ''cook'' is correctly excluded (already classified noun in unit23), and noun
    items recipe/ingredient excluded for POS uniformity. No bare YAML booleans, no snake_case learner-facing leaks. Validation:
    compiler practice-validate 0/0 across the full 42-pack nl-en set, scripts/_practice_slot_check.py OK, backfill_lexemes_nl_en.py
    --dry-run clean. Upgrading to reviewed.


    POLISH 2026-07-25 (wave 2, tier-thinness pass): structured had 2 live templates (both 3-slot matching_pairs) and production
    only 1 (translate.004). Structured += lesson01.fill.005 (fill Please {item} the onions into small pieces. on the
    single-member chop_word tag) and lesson02.fill.001 (fill You need to {item} the water for the pasta first. on the
    single-member volume_fa_en_a1_unit41_item_04_single tag = boil). Production += lesson02.translate.005 (sentence
    translation Wil je alles {item}? -> Do you want to {item} everything? over cooking_verb -- course-wide pool is exactly
    chop/boil/taste, each grammatical in both frames, and the prompt varies with the answer via slot_rendering so it stays
    determinate) and lesson04.translate.001 (deterministic sentence translation Kun je de uien {item}? -> Can you {item}
    the onions? on the single-member chop_word slot; the Dutch gloss fijnsnijden is an infinitive and fits the Kun je ...
    {item}? frame). Tiers now 3 recognition / 4 structured / 3 production live. No shared word_order frame was added
    because chop/boil/taste each need their own object (per the original authoring note above). tag_schema gained the two
    referenced single-member tags. Reset status reviewed -> unreviewed since this adds unreviewed content to a previously
    reviewed pack.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - cooking_verb
    - chop_word
    - volume_fa_en_a1_unit41_item_04_single
slot_presets:
  cooking_verb: &id001
    language_code: en
    part_of_speech: verb
    agreement_tags:
      semantic: cooking_verb
  chop_single: &u41_chop
    language_code: en
    part_of_speech: verb
    agreement_tags:
      semantic: chop_word
  boil_single: &u41_boil
    language_code: en
    part_of_speech: verb
    agreement_tags:
      semantic: volume_fa_en_a1_unit41_item_04_single
