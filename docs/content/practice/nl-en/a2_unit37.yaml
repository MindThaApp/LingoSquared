schema_version: '1.0'
pack_key: practice.nl-en.a2.unit37
source_language: nl
target_language: en
unit_content_key: en.a2.unit37.video_calls
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-08-01 for nl-en (Dutch speakers learning English), unit
    a2_unit37_video_calls. Direction tests English. REVISED 2026-08-01 to make
    the mis-glossed verb "turn" provably UNSAMPLEABLE in every slot. "turn"
    carries the backfill english_gloss "sla af" (= turn OFF), the OPPOSITE of
    what this unit teaches ("turn on your camera" = aanzetten); the backfill
    gloss cannot be changed here (it is correct "sla af" for the directions
    turn-left/turn-off units) and there is no pack-level gloss override, so the
    only fix is exclusion. "turn" is a VERB and appears ONLY in lesson02,
    carrying just two semantic tags: a2_unit37_video_calls (broad, unit-wide)
    and a2_unit37_video_calls_lesson02. Exclusion strategy (§3.1b/§3.1d):
    (1) NO content-POS slot uses the broad a2_unit37_video_calls union any
    more — every recognition/word_order/translation slot is narrowed to its
    OWN lesson tag, so lesson01/03/04 content slots exclude "turn" by SEMANTIC
    TAG (turn does not carry their lesson tags). (2) lesson02's three slots
    (choose/order/translate) cannot exclude "turn" semantically — it shares
    lesson02's only tags with were/prefer — so they are narrowed to
    part_of_speech [noun], excluding the verb "turn" (and, unavoidably, the
    verbs were/prefer, which become unhostable in this pack; no way to keep
    them without also admitting turn). lesson02 recognition (choose.001) is
    floated over the 3-distinct MC floor by unioning the lesson02 + lesson01
    NOUN pools (8 distinct nouns) while staying lesson_content_key-anchored to
    lesson02, so lesson02 keeps a recognition anchor. lesson02 order/translate
    pool the 2 lesson02 nouns (calls, people); word_order/translation are
    floor-free. (3) The two matching_pairs keep the broad a2_unit37_video_calls
    union but are POS [noun]-only, so the verb "turn" is excluded there too.
    Result: "turn" is excluded from EVERY slot — by semantic tag in
    lesson01/03/04 content slots and both matching_pairs' verb-free POS, and by
    POS [noun] in all three lesson02 slots.
    MEETING DECISION: token "meeting" (noun, gloss "afspraak" = appointment;
    the unit's own overlay glosses it "vergadering" = work meeting) is a
    defensible near-sense and per the task is NOT required to be excluded. It
    is also NOT trivially excludable without cost: it shares the lesson01 tag
    with five needed nouns (video/camera/microphone/connection/face) and
    carries no isolating sub-tag, so dropping it means dropping the whole
    lesson01 noun pool. KEPT in lesson01 choose/order/translate and both
    matching_pairs; flagged here for the backfill lane.
    Capacity (unit scope, turn excluded): 14 live templates, R4/S6/P4, every
    one of the 4 lessons represented in all three tiers. Unhostable by design:
    turn (excluded), were/prefer (lesson02 verbs dropped as turn-collateral),
    and the function words than/until/them (particle/preposition/pronoun,
    outside the content-POS set).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): read
    all 14 templates against the real unit pool and every gloss against the
    en a2_unit37 realization; confirmed turn (sla af) is unsampleable in
    every slot. meeting now carries the gloss vergadering upstream (the
    afspraak concern above is resolved). 1 fixed: lesson02.choose.001 pools
    lesson01+lesson02 nouns, so its feedback (een woord uit deze les) was
    false for lesson01 nouns; now uit dit onderdeel. No deferrals, no
    native-judgment flags.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a2_unit37_video_calls
    - a2_unit37_video_calls_lesson01
    - a2_unit37_video_calls_lesson02
    - a2_unit37_video_calls_lesson03
    - a2_unit37_video_calls_lesson04
templates:
# ---------------- lesson01 ----------------
- content_key: practice.nl-en.en.a2.unit37.lesson01.choose.001
  lesson_content_key: en.a2.unit37.lesson01.video_call_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: &content
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic: a2_unit37_video_calls_lesson01
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een woord uit deze les.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a2.unit37.lesson01.match.002
  lesson_content_key: en.a2.unit37.lesson01.video_call_vocabulary
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: &noun
      language_code: en
      part_of_speech: [noun]
      agreement_tags:
        semantic: a2_unit37_video_calls
    second: *noun
    third: *noun
    fourth: *noun
    fifth: *noun
    sixth: *noun
  slot_relations:
  - kind: distinct
    slots: &sixslots
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *sixslots
  feedback_frame:
    text: Verbind elk Engels woord met de juiste Nederlandse betekenis.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a2.unit37.lesson01.order.003
  lesson_content_key: en.a2.unit37.lesson01.video_call_vocabulary
  type: word_order
  frame:
    text: Please say {item}.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: *content
      agreement_tags:
        semantic: a2_unit37_video_calls_lesson01
  answer_derivation:
    kind: render_frame
    frame:
      text: Please say {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '{item} is het gevraagde woord.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a2.unit37.lesson01.translate.004
  lesson_content_key: en.a2.unit37.lesson01.video_call_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: *content
      agreement_tags:
        semantic: a2_unit37_video_calls_lesson01
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De Engelse vertaling is {item}.
    language_code: nl
    direction: ltr
