schema_version: "1.0"
pack_key: practice.nl-en.a2.unit26
source_language: nl
target_language: en
unit_content_key: en.a2.unit26.opinions
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-06 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en lane, continuing after
    unit25 -- the second and final A2 unit for this direction so far).
    This unit covers giving opinions with reasons (a dog park scenario).
    Added a 4-member 'dogpark_noun' tag (dog/park/playground/space,
    defined in the shared scripts/_en_target_lexeme_common.py) used ONLY
    for bare-word recognition -- most of this unit's content is
    multi-word discourse-connector phrases ('I think', 'in my opinion',
    'on the other hand') that don't reduce to a safe single-token slot,
    same discipline as unit25. Every slot's real candidate count was
    verified with a standalone lexeme_matches()-replicating harness
    against this script's actual output. Needs the standard
    fresh-context review before import. Same blocking dependency as
    every earlier nl-en pack: backfill_lexemes_nl_en.py has not
    actually been run against a real database yet. 2026-07-06 matching_pairs widening (AUTHORING_GUIDE.md #16): expanded the dogpark_noun (noun) matching_pairs template from 2 to 4 pairs.
    2026-07-06 depth pass (templates-per-unit audit): added 8 new templates
    (multiple_choice/listen_select/translation against the same 4-member
    dogpark_noun tag) so every one of this unit's 4 lessons -- including
    lesson01, which had zero practice templates before this pass -- now
    gets bare-word recognition + translation repetition, mirroring the
    established pattern already reviewed in a1_unit21.yaml (travel_noun)
    and a1_unit23.yaml (occupation_noun): reuse the same recognition-only
    tag across every lesson for spaced repetition, not new per-lesson
    vocabulary. Did NOT add a second matching_pairs template -- dogpark_noun's
    real course-wide candidate pool is capped at exactly 4 tokens, so a
    second matching_pairs against the same 4 tokens would be a
    near-duplicate of the existing one, not new content. Did NOT attempt
    word_order/fill_in_blank -- this unit's content is dominated by
    multi-word discourse-connector phrases ('I think', 'on the other
    hand') that don't reduce to a single fillable slot, same 'don't force
    it' reasoning as the original authoring note above, re-confirmed not
    re-litigated. 5 -> 13 templates. Every new template's real candidate
    count re-verified with the standalone lexeme_matches()-replicating
    harness (scripts/_practice_slot_check.py).

    Backport of prs-en's better technique (2026-07-06, same depth-pass
    program, following prs-en's a2_unit26.yaml as the structural reference
    instead of re-deriving independently): rather than only reusing this
    unit's own capped-at-4 dogpark_noun tag, prs-en noticed this unit's
    own REAL taught sentences also generalize already-classified
    COURSE-WIDE tags from earlier units: (1) lesson01 teaches 'in my
    opinion' verbatim, and lesson03's real reading text opens 'In my
    opinion, the new dog park is a good idea.' -- the already-established
    4-member 'possessive' tag (my/your/his/her, defined for unit06's
    family lessons, already used identically in this pack's own
    a1_unit06.yaml) generalizes that exact real sentence with zero grammar
    loss ('In your/his/her opinion, the dog park is a good idea.' all
    hold), giving a word_order + fill_in_blank pair anchored to lesson01,
    plus a bare listen_select recognition item. (2) lesson01's 'I think'
    is real content for the already-established 'identity' tag (defined
    for unit01/02, reused as bare-word recognition variety the same way
    unit11/unit17 already reuse 'weekday' in unrelated later units) -- a
    multiple_choice + a listen_select, bare-word only. (3) lesson04's real
    dialogue line 'Yes, I think that would be better.' is real content for
    the already-established 'politeness' tag (thanks/thank/nice/welcome/
    yes/no, defined for unit01) -- a multiple_choice + a listen_select,
    again bare-word only (this pack's local politeness preset broadens the
    part_of_speech list to [noun, verb, adjective, particle] instead of
    unit01's noun-only 'thanks' preset, since politeness members actually
    span all four POS course-wide and bare-word recognition doesn't depend
    on POS uniformity, mirroring prs-en's identical local preset). No
    invented English tokens or Dutch glosses -- every gloss/POS/tag
    (my/your/his/her, i/i'm/am/is/are/what/what's/name, thanks/thank/
    nice/welcome/yes/no) already exists in scripts/
    backfill_lexemes_nl_en.py's EN_TARGET_TO_NL_GLOSS and scripts/
    _en_target_lexeme_common.py's shared classification, so neither shared
    file needed a change (both out of scope for this pass anyway, shared
    with the parallel fa-en worker doing the identical task on its own
    files). 13 -> 20 templates. Re-verified with scripts/
    _practice_slot_check.py (possessive has 4, identity and politeness
    each well above the >=3 multiple_choice/listen_select floor) and
    compile_content.py practice-validate, 0 errors/0 warnings. Still needs
    the standard fresh-context review before import.

    A2-scoping correctness fix (2026-07-07): scripts/_practice_slot_check.py
    pools ALL specs from iter_specs() (both A1 and A2) together when
    counting a tag's real distinct-candidate count, but
    backend/app/practice/service.py's _material() actually scopes both
    PracticeTemplate and Lexeme queries by course_id, and 'Engels
    A1'/'Engels A2' are separate Course rows -- a real A2 enrollee only
    ever sees A2-scoped lexemes. A standalone A2-only-scoped check
    (filtering iter_specs() to level=='a2') found two real violations in
    this file, both below the earlier-claimed 'possessive has 4 distinct
    course-wide candidates' and 'politeness... well above the >=3 floor'
    notes above, which were pooled-with-A1 counts, not real A2-only
    counts: (1) lesson01.possessive_listen.006 -- the 'possessive' tag
    (my/your/his/her, 4 members pooled with A1) has only 2 REAL
    A2-scoped candidates (my/your -- his/her are never reintroduced in
    any A2 unit 25-28). Fixed by converting to type: translation (bare
    single-word production, slot_text derivation instead of slot_gloss --
    no minimum-candidate floor), renamed possessive_translate_bare.006 --
    a genuinely new exercise, not a duplicate of the existing
    possessive_order.004 (full-sentence word_order). (2)
    lesson04.politeness_choose.004 AND lesson04.politeness_listen.005 --
    the 'politeness' tag (thanks/thank/nice/welcome/yes/no, 6 members
    pooled with A1) has only 2 REAL A2-scoped candidates (yes from this
    unit, no from unit27's real banking dialogue -- both still within the
    same A2 course). BOTH templates were broken (multiple_choice and
    listen_select each need >=3), and converting both to translation
    would have produced two duplicate bare-word production templates
    against the identical 2-candidate pool -- no honest additional
    candidate exists, so politeness_choose.004 was converted to type:
    translation (renamed politeness_translate_bare.004) and
    politeness_listen.005 was removed outright rather than kept as dead
    duplicate content. No candidates invented, no A1 vocabulary pooled in
    as if A2-scoped."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [dogpark_noun, possessive, identity, politeness]
slot_presets:
  dogpark_noun: &dogpark_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: dogpark_noun}}
  possessive: &possessive {language_code: en, part_of_speech: pronoun, agreement_tags: {semantic: possessive}}
  identity: &identity {language_code: en, part_of_speech: [pronoun, verb], agreement_tags: {semantic: identity}}
  politeness: &politeness {language_code: en, part_of_speech: [noun, verb, adjective, particle], agreement_tags: {semantic: politeness}}
templates:
  - content_key: practice.nl-en.en.a2.unit26.lesson02.choose.001
    lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *dogpark_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit26.lesson02.listen.002
    lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
