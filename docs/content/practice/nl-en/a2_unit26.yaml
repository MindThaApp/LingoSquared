schema_version: "1.0"
pack_key: practice.nl-en.a2.unit26
source_language: nl
target_language: en
unit_content_key: en.a2.unit26.opinions
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-06 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en lane, continuing after
    unit25 -- the second and final A2 unit for this direction so far).
    This unit covers giving opinions with reasons (a dog park scenario).
    Added a 4-member 'dogpark_noun' tag (dog/park/playground/space,
    defined in the shared scripts/_en_target_lexeme_common.py) used ONLY
    for bare-word recognition -- most of this unit's content is
    multi-word discourse-connector phrases ('I think', 'in my opinion',
    'on the other hand') that don't reduce to a safe single-token slot,
    same discipline as unit25. Every slot's real candidate count was
    verified with a standalone lexeme_matches()-replicating harness
    against this script's actual output. Needs the standard
    fresh-context review before import. Same blocking dependency as
    every earlier nl-en pack: backfill_lexemes_nl_en.py has not
    actually been run against a real database yet. 2026-07-06 matching_pairs widening (AUTHORING_GUIDE.md #16): expanded the dogpark_noun (noun) matching_pairs template from 2 to 4 pairs.
    2026-07-06 depth pass (templates-per-unit audit): added 8 new templates
    (multiple_choice/listen_select/translation against the same 4-member
    dogpark_noun tag) so every one of this unit's 4 lessons -- including
    lesson01, which had zero practice templates before this pass -- now
    gets bare-word recognition + translation repetition, mirroring the
    established pattern already reviewed in a1_unit21.yaml (travel_noun)
    and a1_unit23.yaml (occupation_noun): reuse the same recognition-only
    tag across every lesson for spaced repetition, not new per-lesson
    vocabulary. Did NOT add a second matching_pairs template -- dogpark_noun's
    real course-wide candidate pool is capped at exactly 4 tokens, so a
    second matching_pairs against the same 4 tokens would be a
    near-duplicate of the existing one, not new content. Did NOT attempt
    word_order/fill_in_blank -- this unit's content is dominated by
    multi-word discourse-connector phrases ('I think', 'on the other
    hand') that don't reduce to a single fillable slot, same 'don't force
    it' reasoning as the original authoring note above, re-confirmed not
    re-litigated. 5 -> 13 templates. Every new template's real candidate
    count re-verified with the standalone lexeme_matches()-replicating
    harness (scripts/_practice_slot_check.py)."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [dogpark_noun]
slot_presets:
  dogpark_noun: &dogpark_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: dogpark_noun}}
templates:
  - content_key: practice.nl-en.en.a2.unit26.lesson02.choose.001
    lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *dogpark_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit26.lesson02.listen.002
    lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
