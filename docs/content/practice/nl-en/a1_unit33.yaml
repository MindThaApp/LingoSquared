schema_version: "1.0"
pack_key: practice.nl-en.a1.unit33
source_language: nl
target_language: en
unit_content_key: en.a1.unit33.transportation
review:
  status: unreviewed
  fresh_context: 'false'
  notes: "Authored 2026-07-11, nl-en depth-completion sprint (see
    a1_unit30.yaml's notes for the sprint context). 4-member
    'vehicle_noun' tag (bus/train/car/bike, all nouns) -- deliberately
    excludes the lesson's 5th vocabulary item, 'walk', since it's used
    as a verb here ('walk to work'), not a noun alongside the others.
    No shared generative frame attempted -- the unit's own overlay notes
    explicitly flag that each vehicle takes its OWN verb (take the
    bus/train, drive the car, ride the bike), so a single '{verb} the
    {item}.' frame would be ungrammatical for at least two of the four
    members regardless of which verb is chosen; same 'don't force it'
    discipline as unit25/unit27's bureaucracy_noun/banking_noun.
    Repeated the same tag's bare-word recognition across lesson03
    (dialogue) and lesson04 (reading) for depth, following a2_unit25's
    established pattern of spreading recognition across a unit's later
    lessons rather than only its vocabulary-teaching lesson. Extended
    scripts/_en_target_lexeme_common.py/scripts/backfill_lexemes_nl_en.py
    with every introduced_token this unit's realization uses. Every
    slot's real candidate count verified with
    scripts/_practice_slot_check.py (4 distinct, above the >=3 floor).
    Needs the standard fresh-context review before import.
    FRESH-CONTEXT REVIEW ADDENDUM (2026-07-11, zero access to authoring
    reasoning): lesson_content_keys (lesson01.transport_vocabulary, lesson03.dialogue_commute_talk, lesson04.two_commuters) resolve to real lessons in en/a1_unit33_transportation.yaml. vehicle_noun (bus/train/car/bike = bus/trein/auto/fiets) is recognition-only -- correct, since each vehicle takes its own verb and no single shared frame is grammatical. All glosses accurate and mutually distinct. No bare YAML booleans, no snake_case learner-facing
    leaks. Validation: compiler practice-validate 0/0 across the full
    42-pack nl-en set, scripts/_practice_slot_check.py OK,
    backfill_lexemes_nl_en.py --dry-run clean. Upgrading to reviewed.

    DEAD-template remediation 2026-07-24 (PACK-ONLY,
    scripts/_practice_unit_scope_check.py): 'vehicle_noun' is a 4-member
    course-wide tag (bus/train/car/bike) but unit33 itself only introduces
    2 of those (bus, bike -- train/car were introduced in unit21/unit20),
    below the MC/listen 3-floor and below the matching_pairs' declared
    4 slots -> DEAD/FLOOR on choose.001, listen.002, match.003,
    lesson03.choose.002. Recipe fix SS3.1(c): re-anchored these four
    recognition/structured templates to plain part_of_speech: verb
    (unit33_verb preset, no semantic tag) over unit33's OWN full verb
    pool: drive, ride, takes, drives, worry -- 5 distinct unit-scoped
    verbs (glosses rijden/rijden/neemt/rijdt/zorgen maken; note drive and
    ride share the literal gloss 'rijden' -- recipe SS6.3 explicitly
    permits duplicate right-hand matching_pairs values as valid pedagogy,
    and for multiple_choice the pool still clears the 3-floor with 4
    distinct display strings after dedup). Bumped match.003 from 4 to 5
    declared slots to use the full clean pool (still below the 6-pair
    ideal -- documented as genuine thinness below). Left translate.004/
    translate.003 (both translation, no floor) on vehicle_noun unchanged
    -- unit33's own 2-member pool (bus/bike) already satisfies them.

    IMPORTANT DATA-QUALITY FINDING for the coordinator (LOG-not-fix, out
    of PACK-ONLY scope): unit33's own lexeme pool has SIX tokens with
    stray sentence-final punctuation baked into the token string itself
    -- 'work?' (lesson02), 'daniel?', 'it?', 'okay,', 'difficult.'
    (lesson03), 'office.' (lesson04) -- a backfill extraction defect
    (adjacent punctuation not stripped). These would display broken text
    ('work?', 'okay,') if used as MC/listen/matching answer values, so
    they were deliberately excluded from every pool above by restricting
    to part_of_speech: verb (none of the six contaminated tokens are
    classified verb). This also explains why unit33's own noun pool looks
    thin in isolation: 'work?'/'office.' are unusable nouns and 'parking'
    is the only clean noun lesson03/04 contribute. Routing to the
    backfill lane: scripts/backfill_lexemes_nl_en.py should re-strip
    trailing punctuation from these six tokens (and re-check the rest of
    the corpus for the same class of defect).

    Polish wave 2 (2026-07-25, tier-thinness + POS-only matching audit):
    structured tier had only 1 live template and production only 2 (<3
    floor, recipe SS8). Added two word_order templates over vehicle_noun
    (course-wide pool is exactly bus/train/car/bike): lesson02.order.001
    'We go to work by {item}' and lesson04.order.002 'He takes the {item}
    to the office' -- both frames verified idiomatic for all four
    course-scope members ('by bus/train/car/bike' and 'take the
    bus/train/car/bike' are all standard English). Added
    lesson03.translate.001 (NL prompt 'Ik neem de {item} naar het werk.'
    with gloss rendering, EN render_frame 'I take the {item} to work';
    all four vehicles are de-words in the NL prompt). Tiers now 3/3/3.
    match.003 POS-only audit: left POS-only DELIBERATELY -- the only
    semantic tag unit33's lexemes carry is vehicle_noun/transport_noun
    (2 unit-scoped tokens: bus, bike); no semantic union of unit-native
    tags can reach the 5 declared slots, let alone 6, so per the polish
    rubric the bare part_of_speech: verb constraint stays (a wrong union
    is worse than the status quo)."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [vehicle_noun]
slot_presets:
  vehicle_noun: &vehicle_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: vehicle_noun}}
  unit33_verb: &unit33_verb {language_code: en, part_of_speech: verb}
templates:
  - content_key: practice.nl-en.en.a1.unit33.lesson01.choose.001
    lesson_content_key: en.a1.unit33.lesson01.transport_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit33_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit33.lesson01.listen.002
    lesson_content_key: en.a1.unit33.lesson01.transport_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit33_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit33.lesson01.match.003
    lesson_content_key: en.a1.unit33.lesson01.transport_vocabulary
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth}", language_code: en, direction: ltr}
    slots: {first: *unit33_verb, second: *unit33_verb, third: *unit33_verb, fourth: *unit33_verb, fifth: *unit33_verb}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth]}
    feedback_frame: {text: "Verbind elk woord met de Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit33.lesson01.translate.004
    lesson_content_key: en.a1.unit33.lesson01.transport_vocabulary
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *vehicle_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit33.lesson03.choose.002
    lesson_content_key: en.a1.unit33.lesson03.dialogue_commute_talk
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *unit33_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit dit gesprek.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit33.lesson04.translate.003
    lesson_content_key: en.a1.unit33.lesson04.two_commuters
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *vehicle_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit33.lesson02.order.001
    lesson_content_key: en.a1.unit33.lesson02.describing_commutes
    type: word_order
    frame: {text: "We go to work by {item}", language_code: en, direction: ltr}
    slots: {item: *vehicle_noun}
    answer_derivation:
      kind: render_frame
      frame: {text: "We go to work by {item}", language_code: en, direction: ltr}
    feedback_frame: {text: "Met by {item} zeg je hoe je naar je werk reist.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit33.lesson04.order.002
    lesson_content_key: en.a1.unit33.lesson04.two_commuters
    type: word_order
    frame: {text: "He takes the {item} to the office", language_code: en, direction: ltr}
    slots: {item: *vehicle_noun}
    answer_derivation:
      kind: render_frame
      frame: {text: "He takes the {item} to the office", language_code: en, direction: ltr}
    feedback_frame: {text: "Zo zeg je met welk vervoer hij naar kantoor gaat.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit33.lesson03.translate.001
    lesson_content_key: en.a1.unit33.lesson03.dialogue_commute_talk
    type: translation
    frame: {text: "Ik neem de {item} naar het werk.", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *vehicle_noun}
    answer_derivation:
      kind: render_frame
      frame: {text: "I take the {item} to work", language_code: en, direction: ltr}
    feedback_frame: {text: "I take the {item} to work betekent Ik neem de {item} naar het werk.", language_code: nl, direction: ltr}
