schema_version: "1.0"
pack_key: practice.nl-en.a1.unit40
source_language: nl
target_language: en
unit_content_key: en.a1.unit40.post
review:
  status: reviewed
  fresh_context: true
  notes: "Authored 2026-07-11, nl-en depth-completion sprint (see
    a1_unit30.yaml's notes for the sprint context). 5-member 'post_noun'
    tag (letter/package/stamp/envelope/mailbox, all nouns) for bare-word
    recognition only -- deliberately excludes the lesson's 6th
    vocabulary item, 'post office', a two-word compound that doesn't fit
    a single-token slot (same discipline as unit24's exclusion of
    'living room'). No shared generative frame attempted -- 'I need a
    {item}.' reads fine for stamp/envelope but oddly for letter (you
    write one, you don't 'need' one) and package, same 'don't force it'
    discipline as unit25/unit27's bureaucracy_noun/banking_noun.
    Repeated the tag's bare-word recognition against lesson02 for
    depth. Extended
    scripts/_en_target_lexeme_common.py/scripts/backfill_lexemes_nl_en.py
    with every introduced_token this unit's realization uses. Every
    slot's real candidate count verified with
    scripts/_practice_slot_check.py (5 distinct, above the >=3 floor).
    Needs the standard fresh-context review before import.
    FRESH-CONTEXT REVIEW ADDENDUM (2026-07-11, zero access to authoring
    reasoning): lesson_content_keys (lesson01.post_office_vocabulary, lesson02.sending_mail) resolve to real lessons in en/a1_unit40_post.yaml. post_noun (letter/package/stamp/envelope/mailbox = brief/pakketje/postzegel/envelop/brievenbus) is recognition-only and correctly excludes the two-word compound 'post office'. All 5 glosses distinct. No bare YAML booleans, no snake_case learner-facing
    leaks. Validation: compiler practice-validate 0/0 across the full
    42-pack nl-en set, scripts/_practice_slot_check.py OK,
    backfill_lexemes_nl_en.py --dry-run clean. Upgrading to reviewed."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [post_noun]
slot_presets:
  post_noun: &post_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: post_noun}}
templates:
  - content_key: practice.nl-en.en.a1.unit40.lesson01.choose.001
    lesson_content_key: en.a1.unit40.lesson01.post_office_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *post_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit40.lesson01.listen.002
    lesson_content_key: en.a1.unit40.lesson01.post_office_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *post_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit40.lesson01.match.003
    lesson_content_key: en.a1.unit40.lesson01.post_office_vocabulary
    type: matching_pairs
    frame: {text: "{first} · {second}", language_code: en, direction: ltr}
    slots: {first: *post_noun, second: *post_noun, third: *post_noun, fourth: *post_noun, fifth: *post_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth]}
    feedback_frame: {text: "Verbind elk woord met de Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit40.lesson01.translate.004
    lesson_content_key: en.a1.unit40.lesson01.post_office_vocabulary
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *post_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit40.lesson02.choose.002
    lesson_content_key: en.a1.unit40.lesson02.sending_mail
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *post_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
