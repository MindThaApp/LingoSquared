    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit10.lesson02.place_meaning.005
    lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
    type: multiple_choice
