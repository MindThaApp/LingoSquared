schema_version: "1.0"
pack_key: practice.nl-en.a1.unit10
source_language: nl
target_language: en
unit_content_key: en.a1.unit10.directions
review:
  status: unreviewed
  fresh_context: true
  notes: "Authored 2026-07-05 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en direction, per the
    coordinator's scope split). Keyed to English target lexemes extended
    into the shared scripts/_en_target_lexeme_common.py plus this pair's own
    Dutch glosses added to scripts/backfill_lexemes_nl_en.py. This unit's
    core direction vocabulary only yields 2-member tags (turn_direction:
    left/right, deliberately excluding 'straight' since it pairs with 'go'
    not 'turn' -- 'Turn straight' is not English; street_ordinal: first/
    second), neither large enough for multiple_choice/listen_select's
    >=4-distractor rule -- both are used only in word_order/fill_in_blank/
    translation. To still give this pack the same recognition-type variety
    as every other pack this pass, lessons 02 and 04 reuse unit09's
    already-verified 5-member 'place' tag (bank/hospital/pharmacy/park/
    restaurant) for a listen_select and a multiple_choice respectively,
    thematically apt since this unit's dialogues ask directions TO those
    same places. Every slot's real candidate count was verified with the
    same standalone lexeme_matches()-replicating harness used for every
    other pack this pass. The underlying en realization unit10 IS
    fresh-context reviewed already; the nl-en overlay itself is still
    unreviewed. Needs the standard fresh-context review before import. Same
    blocking DB-level gap as every other pack from this pass: no
    backfill_lexemes_nl_en.py run has actually happened against a real
    database yet.
    FRESH-CONTEXT REVIEW ADDENDUM (2026-07-06, zero access to any authoring
    reasoning): confirmed every lesson_content_key matches the correct lesson
    in en/a1_unit10_directions.yaml; re-ran the standalone lexeme_matches()-
    replicating harness against the real iter_specs() output (0 count
    failures: turn_direction=2, street_ordinal=2, place=5 -- both reused via
    the >=4-eligible place tag for MC/listen_select) and compiler
    practice-validate (0/0). 'Turn {item}.'/'Take the {item} street on the
    left/right.' are grammatical for every candidate; the deliberate
    exclusion of 'straight' from turn_direction is correct English usage.
    No self-reference, agreement, or homograph issues found; does not reuse
    the broad 'number'/'count_plural' tags flagged as an open defect
    elsewhere. Upgrading to reviewed.
    Depth pass, 2026-07-07 (density audit, same night as the nl-en/fa-en/prs-en
    unit01 depth passes): unit10 was tied for shallowest in the nl-en
    direction at 10 templates. This unit's own turn_direction/street_ordinal
    tags remain too small (2 members each) for any new multiple_choice/
    listen_select or safe fill_in_blank (a single-slot fill_in_blank on a
    2-member, genuinely-non-synonymous tag like left/right would fail
    scripts/_fill_in_blank_ambiguity_check.py's distinguishability check per
    AUTHORING_GUIDE.md#17, and marking it interchangeable would be wrong --
    left and right are not synonyms -- so no new fill_in_blank was added
    anywhere in this pack). Instead, added 5 new templates (10->15) all
    reusing this pack's own already-established, already-verified 5-member
    place tag (bank/hospital/pharmacy/park/restaurant, thematically apt
    since every dialogue in this unit gives directions TO one of these
    places), zero new tags or Dutch glosses needed. lesson02
    (asking_how_to_get) gained place_meaning (multiple_choice) and
    place_pair (matching_pairs, 5 pairs, per AUTHORING_GUIDE.md#16) --
    lesson02 previously had place_listen but no recognition or matching
    variety. lesson03 (reading_a_route) gained place_listen (listen_select)
    -- lesson03's own real content explicitly names 'the pharmacy' in its
    route text, and previously had zero place-tag coverage at all (only
    street_ordinal word_order/translation). lesson04
    (giving_directions_dialogue) gained place_translate (translation) and
    place_listen (listen_select) alongside its existing place_meaning
    (multiple_choice), giving it the same 3-type recognition variety as
    lesson01/lesson02 of the sibling unit09 pack. Verified with
    scripts/_practice_slot_check.py (all touched slots at or above the
    relevant floor) and compile_content.py practice-validate, 0 errors/0
    warnings. Still carries this pack's own prior fresh-context review
    status -- a fresh re-review of specifically these 5 new templates has
    not happened yet.

    REAUTH FIX 2026-07-24 (unit-scope DEAD-template pass): scripts/_practice_unit_scope_check.py
    flagged 11 DEAD template-slots, all 7 templates that reused unit09's 'place'
    semantic tag (bank/hospital/pharmacy/park/restaurant) -- vocabulary unit10 never
    itself introduces, so generate_checkpoint()'s unit-scoped lexeme pool had 0
    candidates for every one of them (recipe DO-NOT #2): lesson02.place_listen.004,
    place_meaning.005, place_pair.006 (all 5 slots), lesson03.place_listen.004,
    lesson04.place_meaning.004, place_translate.005, place_listen.006. Fixed by
    RE-ANCHORING every one to a new untagged 'direction_word' preset
    (language_code: en, part_of_speech: noun, no semantic tag) built purely from
    unit10's OWN lesson01-03 vocabulary: corner/minutes/street/directions plus the
    turn_direction nouns left/right -- 6 distinct tokens, 6 distinct glosses,
    verified against a fresh iter_specs() dump filtered to '.a1.unit10.'. No new
    backfill tag needed (PACK-ONLY): every template using this preset renders a
    bare '{item}' frame (multiple_choice/listen_select/translation) or a
    matching_pairs instruction frame, so the SS1.1 course-scope
    grammatical-in-frame risk that applies to word_order/fixed-sentence
    translation does not apply here -- the slot is never embedded in literal
    sentence text. Also widened place_pair.006 from 5 to 6 slots (was already
    below the SS16 6-pair floor even before being DEAD) using all 6 direction_word
    members. turn_direction/street_ordinal-based templates (word_order/translation)
    were untouched -- they were never dead. Removed the now-unused 'place' tag
    from tag_schema. Re-verified: scripts/_practice_unit_scope_check.py shows 0
    DEAD/0 FLOOR for this file; compile_content.py practice-validate 0 errors.

    WAVE-3 RE-ANCHOR 2026-07-25: commit 05af7ace generated unit-scoped semantic tags, resolving the earlier
    blocker that unit10's own vocabulary carried no usable multi-member tag. Re-anchored the POS-only
    place_pair.006 matcher to 'a1_unit10_directions' + noun (corner/directions/left/minutes/right/street --
    6 distinct tokens, 6 distinct Dutch glosses, identical pool at unit AND course scope, killing the
    Endless-Practice course-scope off-theme pull). Bare-word MC/listen/translation templates keep the untagged
    direction_word preset per dispatch scope. Flipped status reviewed -> unreviewed since the pack changed.
    Verified via pool_check.py (6/6, 0 course extras), practice-validate 0 errors, unit-scope check 0 DEAD."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [turn_direction, street_ordinal, a1_unit10_directions]
slot_presets:
  turn_direction: &turn_direction {language_code: en, part_of_speech: noun, agreement_tags: {semantic: turn_direction}}
  street_ordinal: &street_ordinal {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: street_ordinal}}
  # direction_word: untagged noun pool built ONLY from this unit's OWN lesson01-03
  # vocabulary (corner/minutes/street/directions plus the turn_direction nouns
  # left/right) -- replaces the old *place preset, which pointed at unit09's
  # 'place' semantic tag (bank/hospital/pharmacy/park/restaurant), a lesson
  # that unit10 does not itself teach. generate_checkpoint() scopes candidates
  # to THIS unit's own lexemes, so every *place-based template here had 0
  # unit-scoped candidates (recipe DO-NOT #2). No semantic tag is declared
  # (SS3.1c): safe here because every frame that uses this preset is a bare
  # '{item}' (multiple_choice/listen_select/translation) or a matching_pairs
  # instruction frame -- neither embeds the slot in literal sentence text, so
  # the widen-at-course-scope grammaticality risk (SS1.1) does not apply.
  direction_word: &direction_word {language_code: en, part_of_speech: noun}
  # pair_word (wave 3): the generated unit-scoped tag a1_unit10_directions
  # (commit 05af7ace) narrowed to nouns -- exactly corner/directions/left/
  # minutes/right/street at BOTH unit and course scope, so place_pair.006 no
  # longer pulls the whole level's nouns at Endless-Practice course scope.
  pair_word: &pair_word {language_code: en, part_of_speech: noun, agreement_tags: {semantic: a1_unit10_directions}}
templates:
  - content_key: practice.nl-en.en.a1.unit10.lesson01.turn_order.001
    lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
    type: word_order
    frame: {text: "Turn {item}", language_code: en, direction: ltr}
    slots: {item: *turn_direction}
    answer_derivation: {kind: render_frame, frame: {text: "Turn {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de richting in deze instructie.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit10.lesson01.turn_translate.003
    lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *turn_direction}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit10.lesson02.route_order.001
    lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
    type: word_order
    frame: {text: "Go straight, then turn {item} at the corner", language_code: en, direction: ltr}
    slots: {item: *turn_direction}
    answer_derivation: {kind: render_frame, frame: {text: "Go straight, then turn {item} at the corner", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de richting bij de hoek.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit10.lesson02.turn_translate.003
    lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
    type: translation
