schema_version: "1.0"
pack_key: practice.nl-en.a1.unit18
source_language: nl
target_language: en
unit_content_key: en.a1.unit18.past_events
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-05 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en direction, continuing
    past the coordinator's requested 11-16 range). Keyed to English target
    lexemes extended into the shared scripts/_en_target_lexeme_common.py
    plus this pair's own Dutch glosses added to scripts/backfill_lexemes_nl_en.py.
    Added a narrower 'past_verb_intransitive' tag (went/ate/worked, 3
    members) separate from the 5-member 'past_verb' (went/saw/ate/visited/
    worked) for the 'I {item} yesterday.' frame -- 'saw'/'visited' are
    transitive and would leave that frame feeling incomplete ('I saw
    yesterday.'/'I visited yesterday.' are grammatical but communicatively
    odd without an object), so the full 5-member set is used only for
    bare-word recognition (multiple_choice/listen_select/matching_pairs),
    never embedded in a sentence. Real content-authoring quirk discovered
    while extending the Dutch gloss dict: several 'Dutch' tokens extracted
    from this unit's overlay were actually ENGLISH infinitives embedded
    parenthetically inside the Dutch gloss text itself (e.g. gloss 'ging
    (verleden tijd van go)' -- Dutch 'ging' plus the English reference
    infinitive 'go' in parentheses) -- classified them by their real
    grammatical role (verb) rather than skipping them, since the tokenizer
    correctly picked them up from the actual file content. Every slot's
    real candidate count was verified with the same standalone
    lexeme_matches()-replicating harness used for every other pack this
    pass. The underlying en realization unit18 is itself UNREVIEWED (Codex
    was usage-limited at authoring time), same as the nl-en overlay. Needs
    the standard fresh-context review before import. Same blocking DB-level
    gap as every other pack from this pass: no backfill_lexemes_nl_en.py
    run has actually happened against a real database yet."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [past_verb, past_verb_intransitive]
slot_presets:
  past_verb: &past_verb {language_code: en, part_of_speech: verb, agreement_tags: {semantic: past_verb}}
  past_verb_intransitive: &past_verb_intransitive {language_code: en, part_of_speech: verb, agreement_tags: {semantic: past_verb_intransitive}}
templates:
  - content_key: practice.nl-en.en.a1.unit18.lesson01.verb_meaning.001
    lesson_content_key: en.a1.unit18.lesson01.past_tense_verbs
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *past_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een werkwoord in de verleden tijd uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit18.lesson01.verb_listen.002
    lesson_content_key: en.a1.unit18.lesson01.past_tense_verbs
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *past_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit18.lesson01.verb_pair.003
    lesson_content_key: en.a1.unit18.lesson01.past_tense_verbs
    type: matching_pairs
    frame: {text: "Koppel de Engelse werkwoorden aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
    slots: {first_verb: *past_verb, second_verb: *past_verb}
    slot_relations: [{kind: distinct, slots: [first_verb, second_verb]}]
    answer_derivation: {kind: matching_pairs, slots: [first_verb, second_verb]}
    feedback_frame: {text: "Je hebt twee werkwoorden gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit18.lesson01.verb_translate.004
    lesson_content_key: en.a1.unit18.lesson01.past_tense_verbs
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *past_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit18.lesson02.yesterday_order.001
    lesson_content_key: en.a1.unit18.lesson02.talking_about_yesterday
    type: word_order
    frame: {text: "I {item} yesterday", language_code: en, direction: ltr}
    slots: {item: *past_verb_intransitive}
    answer_derivation: {kind: render_frame, frame: {text: "I {item} yesterday", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is wat er gisteren gebeurde.", language_code: nl, direction: ltr}
