schema_version: '1.0'
pack_key: practice.nl-en.a1.unit64
source_language: nl
target_language: en
unit_content_key: en.a1.unit64.compliments
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-23 (nl-en batch B). English target pool: 5 content-POS (noun/verb/adjective/adverb)
    lexemes across 2/2 lessons that carry any EN lexeme at all (this direction tests English; language_code=nl
    lexemes in the backfill are unrelated pollution from quoted-English-inside-Dutch-gloss parsing and
    were NOT used). Broad tag a1_unit64_compliments unions the unit; each word_order/translation pair
    is additionally anchored per-lesson via that lessons own auto-tag for lesson stratification. word_order
    uses a single generic frame (Please say {item}.) deliberately: it is grammatical for any part of speech,
    has no candidate floor, and has zero self-reference risk (neither please nor say is ever a taught
    token in this unit). multiple_choice/listen_select clear the 3-distinct-value floor. matching_pairs
    OMITTED: fewer than 6 distinct content-POS tokens in the unit. THIN UNIT: only 5 EN content lexemes
    total -- this pack cannot reach the 12-item checkpoint floor or the recipes per-tier bars; authored
    honestly per the no-padding rule, flagged to the coordinator as checkpoint-thin.
    POLISH 2026-07-25 (tier-thinness wave 2): added lesson02.choose.001 (multiple_choice over the
    lesson02 phrase pool -- 6 distinct en phrases with 6 distinct, non-confusable Dutch glosses,
    clearing the 3-option floor) to bring the recognition tier from 2 to 3 live templates and give
    the previously unanchored lesson02 checkpoint representation. Pool verified with pool_check.py.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 9 templates (2 multiple_choice, 1 listen_select, 3 word_order, 3 translation) against the real unit/course lexeme pools; lesson02 phrase glosses distinct, content-word glosses distinct, Please say {item}. renders grammatically for every candidate, no jargon or boolean issues. 0 pack defects fixed. DEFERRED (lexeme-gloss, backfill_lexemes_nl_en.py): being ''het zijn (in being kind)'' prints the English answer inside the Dutch translation prompt and word_order hint. No native-judgment flags.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a1_unit64_compliments
    - a1_unit64_compliments_lesson01
    - a1_unit64_compliments_lesson02
    - a1_unit64_compliments_lesson04
templates:
- content_key: practice.nl-en.en.a1.unit64.lesson01.choose.001
  lesson_content_key: en.a1.unit64.lesson01.compliment_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: &id001
      - adjective
      - adverb
      - noun
      - verb
      agreement_tags: &id002
        semantic: a1_unit64_compliments
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een woord uit deze les.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit64.lesson02.choose.001
