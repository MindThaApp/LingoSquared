schema_version: "1.0"
pack_key: practice.nl-en.a1.unit31
source_language: nl
target_language: en
unit_content_key: en.a1.unit31.appearance
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-11, nl-en depth-completion sprint (see
    a1_unit30.yaml's notes for the sprint context). Two tags: 'trait_adj'
    (4 members -- tall/short/blond/curly, all adjectives) for bare-word
    recognition only -- deliberately EXCLUDES 'hair' from this tag despite
    it appearing alongside the others in the lesson's own matching
    exercise, since 'hair' is a noun (part_of_speech must be uniform
    within one slot preset for scripts/backfill_lexemes_nl_en.py's
    lexeme_matches() filter to work -- mixing adjective+noun in one tag
    would silently exclude half the members from every generated item).
    'eye_color' (3 members -- blue/brown/green, adjectives) IS used in a
    real generative frame, 'Her eyes are {item}.', verified grammatical
    for all three and directly matching the unit's own taught sentence
    (lesson02.exercise04.order_eyes_sentence's tested_text is literally
    'Her eyes are blue.'). Extended
    scripts/_en_target_lexeme_common.py/scripts/backfill_lexemes_nl_en.py
    with every introduced_token this unit's realization uses. Every
    slot's real candidate count verified with
    scripts/_practice_slot_check.py (trait_adj: 4, eye_color: 3, both
    above the >=3 floor). Needs the standard fresh-context review before
    import."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [trait_adj, eye_color]
slot_presets:
  trait_adj: &trait_adj {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: trait_adj}}
  eye_color: &eye_color {language_code: en, part_of_speech: adjective, agreement_tags: {semantic: eye_color}}
templates:
  - content_key: practice.nl-en.en.a1.unit31.lesson01.choose.001
    lesson_content_key: en.a1.unit31.lesson01.height_and_hair
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *trait_adj}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een kenmerk uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit31.lesson01.listen.002
    lesson_content_key: en.a1.unit31.lesson01.height_and_hair
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *trait_adj}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit31.lesson01.match.003
    lesson_content_key: en.a1.unit31.lesson01.height_and_hair
    type: matching_pairs
    frame: {text: "{first} · {second}", language_code: en, direction: ltr}
    slots: {first: *trait_adj, second: *trait_adj, third: *trait_adj, fourth: *trait_adj}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "Verbind elk kenmerk met de Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit31.lesson01.translate.004
    lesson_content_key: en.a1.unit31.lesson01.height_and_hair
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *trait_adj}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit31.lesson02.order.001
    lesson_content_key: en.a1.unit31.lesson02.eyes_and_description
    type: word_order
    frame: {text: "Her eyes are {item}", language_code: en, direction: ltr}
    slots: {item: *eye_color}
    answer_derivation: {kind: render_frame, frame: {text: "Her eyes are {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de genoemde oogkleur.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit31.lesson02.translate.002
    lesson_content_key: en.a1.unit31.lesson02.eyes_and_description
    type: translation
    frame: {text: "Haar ogen zijn {item}.", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *eye_color}
    answer_derivation: {kind: render_frame, frame: {text: "Her eyes are {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "Her eyes are {item}. betekent Haar ogen zijn {item}.", language_code: nl, direction: ltr}
