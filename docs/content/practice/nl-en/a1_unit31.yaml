schema_version: '1.0'
pack_key: practice.nl-en.a1.unit31
source_language: nl
target_language: en
unit_content_key: en.a1.unit31.appearance
review:
  status: reviewed
  fresh_context: true
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-22 (nl-en practice pass, fresh context; 0 fixes; all frames and pools checked (Her eyes are {item} fine for brown/green/blue). NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: short=kort should be klein (overlay). Authored 2026-07-11, nl-en depth-completion sprint (see a1_unit30.yaml''s notes for the sprint context). Two tags:
    ''trait_adj'' (4 members -- tall/short/blond/curly, all adjectives) for bare-word recognition only -- deliberately EXCLUDES
    ''hair'' from this tag despite it appearing alongside the others in the lesson''s own matching exercise, since ''hair''
    is a noun (part_of_speech must be uniform within one slot preset for scripts/backfill_lexemes_nl_en.py''s lexeme_matches()
    filter to work -- mixing adjective+noun in one tag would silently exclude half the members from every generated item).
    ''eye_color'' (3 members -- blue/brown/green, adjectives) IS used in a real generative frame, ''Her eyes are {item}.'',
    verified grammatical for all three and directly matching the unit''s own taught sentence (lesson02.exercise04.order_eyes_sentence''s
    tested_text is literally ''Her eyes are blue.''). Extended scripts/_en_target_lexeme_common.py/scripts/backfill_lexemes_nl_en.py
    with every introduced_token this unit''s realization uses. Every slot''s real candidate count verified with scripts/_practice_slot_check.py
    (trait_adj: 4, eye_color: 3, both above the >=3 floor). Needs the standard fresh-context review before import. FRESH-CONTEXT
    REVIEW ADDENDUM (2026-07-11, zero access to authoring reasoning): lesson_content_keys (lesson01.height_and_hair, lesson02.eyes_and_description)
    resolve to real lessons in en/a1_unit31_appearance.yaml. trait_adj (tall/short/blond/curly = lang/kort/blond/krullend)
    is recognition-only and correctly excludes the noun ''hair''; eye_color (blue/brown/green = blauw/bruin/groen) drives
    frame ''Her eyes are {item}'', grammatical for all 3 and matching the unit''s own ''Her eyes are blue.''. All glosses
    accurate and mutually distinct. No bare YAML booleans, no snake_case learner-facing leaks. Validation: compiler practice-validate
    0/0 across the full 42-pack nl-en set, scripts/_practice_slot_check.py OK, backfill_lexemes_nl_en.py --dry-run clean.
    Upgrading to reviewed.

    POLISH wave-2 2026-07-25 (TIER-SHORT: recognition and production tiers each had only
    2 live templates): added lesson02.choose.003 (multiple_choice) and lesson02.translate.004
    (bare-word translation) over a new appearance_adj slot preset that unions the pack
    existing tags [trait_adj, eye_color] (recipe SS3.1a OR-match). Unit-scoped pool: 6
    distinct adjectives / 6 distinct glosses (tall/short/blond/curly/brown/green =
    lang/kort/blond/krullend/bruin/groen), clearing the MC 3-gloss floor; A1 course scope
    adds only unit12 blue/blauw, coherent and gloss-distinct (7 total). eye_color alone has
    just 2 unit members, below the MC floor, hence the union. Both tiers now 3 live. Bare
    word frames only, so no course-scope grammaticality exposure.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - trait_adj
    - eye_color
slot_presets:
  trait_adj: &id001
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: trait_adj
  eye_color: &id002
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: eye_color
  appearance_adj: &id003
    language_code: en
    part_of_speech: adjective
    agreement_tags:
      semantic: [trait_adj, eye_color]
