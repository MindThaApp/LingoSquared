schema_version: "1.0"
pack_key: practice.nl-en.a1.unit16
source_language: nl
target_language: en
unit_content_key: en.a1.unit16.routines
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-05 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en direction, per the
    coordinator's scope split -- this completes the coordinator's requested
    units 11-16 range). Keyed to English target lexemes extended into the
    shared scripts/_en_target_lexeme_common.py plus this pair's own Dutch
    glosses added to scripts/backfill_lexemes_nl_en.py. Same deliberate scope
    decision as unit14's lesson02: lesson01 (wake up/get dressed/go to work/
    have dinner/go to bed) gets ZERO generated templates. Every one of its
    core routine actions is a multi-word phrase tokenized word-by-word with
    no other same-lesson synonym set -- there is no single-token vocabulary
    item to build a genuine multi-candidate slot from without forcing
    irrelevant content. The other three lessons DO have real swappable
    content: the already-established 22-member 'number' tag (unit03) reused
    for every hour mentioned ('I wake up at {item} every day.'/'I usually go
    to bed at {item}.'), and a new 2-member 'meal' tag (dinner/breakfast) for
    'I have {item}.' -- deliberately NOT used in lesson01's own templates
    even though 'dinner' is introduced there, since 'breakfast' is only
    introduced in lesson03: mixing them into an earlier lesson's slot would
    require a later lesson's vocabulary to already be available, breaking
    the assumption that a lesson's own practice pool is ready as soon as
    that lesson is completed. Every slot's real candidate count was verified
    with the same standalone lexeme_matches()-replicating harness used for
    every other pack this pass. The underlying en realization unit16 is
    itself UNREVIEWED (Codex was usage-limited at authoring time) but the
    nl-en OVERLAY is already fresh-context reviewed (status: reviewed) --
    same pattern as units 3-10/13/14/15. Needs the standard fresh-context
    review before import (both realization and this practice pack). Same
    blocking DB-level gap as every other pack from this pass: no
    backfill_lexemes_nl_en.py run has actually happened against a real
    database yet.
    FOLLOW-UP FIX 2026-07-06: a fresh-context reviewer flagged that 7 of
    this unit's templates reused the broad 22-member 'number' tag for
    wake/bedtime hour-telling, letting the sampler draw values like 'fifty'
    and generate real nonsense like 'I wake up at fifty every day.' Fixed by
    adding a new 'hour_number' tag (12 members, one-twelve only) to
    scripts/_en_target_lexeme_common.py and re-pointing every hour-telling
    template (lesson02.wake_order/bed_fill/wake_translate,
    lesson03.every_day_order, lesson04.wake_order/bed_fill/bed_translate) to
    it -- the two bare-word number_listen recognition templates correctly
    kept the broad 'number' tag. Re-verified with compile_content.py
    practice-validate (0/0) and a standalone harness confirming every fixed
    slot now draws only 1-12.

    Deepened 2026-07-07 (templates-per-unit audit found this unit
    tied-shallowest in nl-en at 8, alongside sibling fa-en/prs-en's
    identical unit16 tied at the same count and deepened the same night --
    mirrored their additions here with fresh Dutch, not copied Farsi/Dari).
    Added 5 new templates, all reusing already-verified tags/vocabulary
    with exercise TYPES this unit hadn't used yet: hour_number gained
    multiple_choice (lesson02) and listen_select (lesson03) -- it
    previously only had word_order/translation; number (already used for
    listen_select twice) gained multiple_choice (lesson02); meal (dinner/
    breakfast, only ever used for translation) gained a word_order
    template anchored to lesson04 ('I have {item} every day' -- both 'I
    have breakfast every day.' and 'I have dinner every day.' are real,
    grammatical sentences; anchored to lesson04 like the file's own
    existing meal_translate, since breakfast isn't introduced until
    lesson03, same 'ready as soon as that lesson alone is completed'
    discipline this file already documents above); and hour_number gained
    a matching_pairs (lesson04, 8 of its 12 real members, per
    AUTHORING_GUIDE.md #16). No new EN_POS/semantic-tag or Dutch-gloss
    additions needed -- every tag used here was already fully classified/
    glossed (confirmed by re-reading scripts/_en_target_lexeme_common.py
    and scripts/backfill_lexemes_nl_en.py fresh before this edit).
    Considered fill_in_blank for hour_number/number/meal but rejected all
    three: hour_number/number have 12/22 genuinely interchangeable-in-frame
    candidates (e.g. 'I wake up at {item} every day' is grammatical for
    any hour), and meal's 2 members, while not literal synonyms, have no
    frame in this unit's real taught sentences that visibly disambiguates
    breakfast from dinner without also being gameable by a second
    independently-sampled slot -- scripts/_fill_in_blank_ambiguity_check.py
    (and compile_content.py's hard-fail per AUTHORING_GUIDE.md #17) would
    flag any single-slot attempt at any of the three, so zero new
    fill_in_blank templates, matching this direction's own established
    'zero is fine' precedent. Re-verified scripts/_practice_slot_check.py
    (all three tags still safely above the >=3/>=2 floors for their new
    exercise types) and scripts/_fill_in_blank_ambiguity_check.py (zero new
    AMBIGUOUS flags) before import. New count: 13 templates (8 -> 13)."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [number, hour_number, meal]
slot_presets:
  number: &number {language_code: en, part_of_speech: noun, agreement_tags: {semantic: number}}
  hour_number: &hour_number {language_code: en, part_of_speech: noun, agreement_tags: {semantic: hour_number}}
  meal: &meal {language_code: en, part_of_speech: noun, agreement_tags: {semantic: meal}}
templates:
  - content_key: practice.nl-en.en.a1.unit16.lesson02.wake_order.001
    lesson_content_key: en.a1.unit16.lesson02.routine_with_times
    type: word_order
    frame: {text: "I wake up at {item} every day", language_code: en, direction: ltr}
    slots: {item: *hour_number}
    answer_derivation: {kind: render_frame, frame: {text: "I wake up at {item} every day", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is het uur waarop wordt wakker geworden.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson02.wake_translate.003
    lesson_content_key: en.a1.unit16.lesson02.routine_with_times
    type: translation
    frame: {text: "Ik word om {item} uur wakker.", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *hour_number}
    answer_derivation: {kind: render_frame, frame: {text: "I wake up at {item} every day", language_code: en, direction: ltr}}
    feedback_frame: {text: "I wake up at {item} every day betekent Ik word om {item} uur wakker.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson02.number_listen.004
    lesson_content_key: en.a1.unit16.lesson02.routine_with_times
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *number}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het getal dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson03.every_day_order.001
    lesson_content_key: en.a1.unit16.lesson03.reading_a_routine
    type: word_order
    frame: {text: "Every day, I wake up at {item}", language_code: en, direction: ltr}
    slots: {item: *hour_number}
    answer_derivation: {kind: render_frame, frame: {text: "Every day, I wake up at {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is het uur in deze routinebeschrijving.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson03.meal_translate.003
    lesson_content_key: en.a1.unit16.lesson03.reading_a_routine
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *meal}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson04.number_listen.001
    lesson_content_key: en.a1.unit16.lesson04.routine_dialogue
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *number}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het getal dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson04.wake_order.002
    lesson_content_key: en.a1.unit16.lesson04.routine_dialogue
    type: word_order
    frame: {text: "I wake up at {item} every day", language_code: en, direction: ltr}
    slots: {item: *hour_number}
    answer_derivation: {kind: render_frame, frame: {text: "I wake up at {item} every day", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is het uur waarop Daniel wakker wordt.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson04.bed_translate.004
    lesson_content_key: en.a1.unit16.lesson04.routine_dialogue
    type: translation
    frame: {text: "Ik ga meestal om {item} uur naar bed.", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *hour_number}
    answer_derivation: {kind: render_frame, frame: {text: "I usually go to bed at {item}", language_code: en, direction: ltr}}
    feedback_frame: {text: "I usually go to bed at {item} betekent Ik ga meestal om {item} uur naar bed.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson02.hour_choose.005
    lesson_content_key: en.a1.unit16.lesson02.routine_with_times
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *hour_number}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Kies de Nederlandse betekenis van {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson02.number_choose.006
    lesson_content_key: en.a1.unit16.lesson02.routine_with_times
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *number}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Kies de Nederlandse betekenis van {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson03.hour_listen.004
    lesson_content_key: en.a1.unit16.lesson03.reading_a_routine
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *hour_number}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het uur dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson04.meal_order.005
    lesson_content_key: en.a1.unit16.lesson04.routine_dialogue
    type: word_order
    frame: {text: "I have {item} every day", language_code: en, direction: ltr}
    slots: {item: *meal}
    answer_derivation: {kind: render_frame, frame: {text: "I have {item} every day", language_code: en, direction: ltr}}
    feedback_frame: {text: "{item} is de maaltijd die je elke dag eet.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson04.hour_match.006
    lesson_content_key: en.a1.unit16.lesson04.routine_dialogue
    type: matching_pairs
    frame: {text: "{first} — {second}", language_code: en, direction: ltr}
    slots: {first: *hour_number, second: *hour_number, third: *hour_number, fourth: *hour_number, fifth: *hour_number, sixth: *hour_number, seventh: *hour_number, eighth: *hour_number}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth]}
    feedback_frame: {text: "Verbind elk uur met de juiste Nederlandse betekenis.", language_code: nl, direction: ltr}
