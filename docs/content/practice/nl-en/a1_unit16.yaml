schema_version: "1.0"
pack_key: practice.nl-en.a1.unit16
source_language: nl
target_language: en
unit_content_key: en.a1.unit16.routines
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "true"
  notes: "Review 2026-10-22 (nl-en practice pass, fresh context; 2 fixes). (1) noun_word and all_word presets (word_choose, word_translate, word_listen in lessons 1-4): scope -- slots had no semantic tag so Endless Practice pulled 147-275 level-wide words (with SAMEGLOSS clashes such as op<-on/up, goed<-fine/good/well); now tagged a1_unit16_routines (unit words only). (2) lesson04.meal_order.005: punctuation -- final period added. NATIVE FLAGS: none. BACKFILL GLOSS FLAGS: none. Authored 2026-07-05 by the Claude session syncing Endless Practice
    template pools to lesson content growth (nl-en direction, per the
    coordinator's scope split -- this completes the coordinator's requested
    units 11-16 range). Keyed to English target lexemes extended into the
    shared scripts/_en_target_lexeme_common.py plus this pair's own Dutch
    glosses added to scripts/backfill_lexemes_nl_en.py. Same deliberate scope
    decision as unit14's lesson02: lesson01 (wake up/get dressed/go to work/
    have dinner/go to bed) gets ZERO generated templates. Every one of its
    core routine actions is a multi-word phrase tokenized word-by-word with
    no other same-lesson synonym set -- there is no single-token vocabulary
    item to build a genuine multi-candidate slot from without forcing
    irrelevant content. The other three lessons DO have real swappable
    content: the already-established 22-member 'number' tag (unit03) reused
    for every hour mentioned ('I wake up at {item} every day.'/'I usually go
    to bed at {item}.'), and a new 2-member 'meal' tag (dinner/breakfast) for
    'I have {item}.' -- deliberately NOT used in lesson01's own templates
    even though 'dinner' is introduced there, since 'breakfast' is only
    introduced in lesson03: mixing them into an earlier lesson's slot would
    require a later lesson's vocabulary to already be available, breaking
    the assumption that a lesson's own practice pool is ready as soon as
    that lesson is completed. Every slot's real candidate count was verified
    with the same standalone lexeme_matches()-replicating harness used for
    every other pack this pass. The underlying en realization unit16 is
    itself UNREVIEWED (Codex was usage-limited at authoring time) but the
    nl-en OVERLAY is already fresh-context reviewed (status: reviewed) --
    same pattern as units 3-10/13/14/15. Needs the standard fresh-context
    review before import (both realization and this practice pack). Same
    blocking DB-level gap as every other pack from this pass: no
    backfill_lexemes_nl_en.py run has actually happened against a real
    database yet.
    FOLLOW-UP FIX 2026-07-06: a fresh-context reviewer flagged that 7 of
    this unit's templates reused the broad 22-member 'number' tag for
    wake/bedtime hour-telling, letting the sampler draw values like 'fifty'
    and generate real nonsense like 'I wake up at fifty every day.' Fixed by
    adding a new 'hour_number' tag (12 members, one-twelve only) to
    scripts/_en_target_lexeme_common.py and re-pointing every hour-telling
    template (lesson02.wake_order/bed_fill/wake_translate,
    lesson03.every_day_order, lesson04.wake_order/bed_fill/bed_translate) to
    it -- the two bare-word number_listen recognition templates correctly
    kept the broad 'number' tag. Re-verified with compile_content.py
    practice-validate (0/0) and a standalone harness confirming every fixed
    slot now draws only 1-12.

    Deepened 2026-07-07 (templates-per-unit audit found this unit
    tied-shallowest in nl-en at 8, alongside sibling fa-en/prs-en's
    identical unit16 tied at the same count and deepened the same night --
    mirrored their additions here with fresh Dutch, not copied Farsi/Dari).
    Added 5 new templates, all reusing already-verified tags/vocabulary
    with exercise TYPES this unit hadn't used yet: hour_number gained
    multiple_choice (lesson02) and listen_select (lesson03) -- it
    previously only had word_order/translation; number (already used for
    listen_select twice) gained multiple_choice (lesson02); meal (dinner/
    breakfast, only ever used for translation) gained a word_order
    template anchored to lesson04 ('I have {item} every day' -- both 'I
    have breakfast every day.' and 'I have dinner every day.' are real,
    grammatical sentences; anchored to lesson04 like the file's own
    existing meal_translate, since breakfast isn't introduced until
    lesson03, same 'ready as soon as that lesson alone is completed'
    discipline this file already documents above); and hour_number gained
    a matching_pairs (lesson04, 8 of its 12 real members, per
    AUTHORING_GUIDE.md #16). No new EN_POS/semantic-tag or Dutch-gloss
    additions needed -- every tag used here was already fully classified/
    glossed (confirmed by re-reading scripts/_en_target_lexeme_common.py
    and scripts/backfill_lexemes_nl_en.py fresh before this edit).
    Considered fill_in_blank for hour_number/number/meal but rejected all
    three: hour_number/number have 12/22 genuinely interchangeable-in-frame
    candidates (e.g. 'I wake up at {item} every day' is grammatical for
    any hour), and meal's 2 members, while not literal synonyms, have no
    frame in this unit's real taught sentences that visibly disambiguates
    breakfast from dinner without also being gameable by a second
    independently-sampled slot -- scripts/_fill_in_blank_ambiguity_check.py
    (and compile_content.py's hard-fail per AUTHORING_GUIDE.md #17) would
    flag any single-slot attempt at any of the three, so zero new
    fill_in_blank templates, matching this direction's own established
    'zero is fine' precedent. Re-verified scripts/_practice_slot_check.py
    (all three tags still safely above the >=3/>=2 floors for their new
    exercise types) and scripts/_fill_in_blank_ambiguity_check.py (zero new
    AMBIGUOUS flags) before import. New count: 13 templates (8 -> 13).

    REAUTH FIX 2026-07-24 (unit-scope DEAD-template pass): scripts/_practice_unit_scope_check.py
    flagged 11 of this file's 13 templates as DEAD -- all reused 'number' or
    'hour_number', both pointing at unit03's own lexemes (hour_number was a
    narrowed FILTER over the same unit03-anchored tokens, per this file's own
    2026-07-06 note, not new unit16 vocabulary) -- recipe DO-NOT #2. Only the
    2 templates using this unit's OWN 'meal' tag (dinner/breakfast) survived:
    lesson03.meal_translate.003 and lesson04.meal_order.005 -- both left
    untouched. A fresh iter_specs() dump filtered to '.a1.unit16.' confirms
    unit16 introduces only 9 lexemes total across its 4 lessons, and besides
    'meal' none share a tag: wake(verb), up(particle), dressed/every
    (adjective), dinner/bed/breakfast(noun), usually(adverb), after
    (preposition). Rebuilt the 11 DEAD templates (and added 2 more, since
    lesson01 -- routine_verbs, the unit's richest lesson -- had never had a
    single template anchored to it despite carrying dinner/bed) using two new
    untagged presets (SS3.1c, no new backfill tag / PACK-ONLY): 'noun_word'
    (dinner/bed/breakfast, 3 distinct) for multiple_choice/bare-word
    translation, and 'all_word' (all 9 lexemes, POS in
    [noun,verb,adjective,adverb,preposition,particle]) for
    listen_select/bare-word translation/matching_pairs. No new word_order
    template uses an untagged pool -- every frame using these presets is a bare
    '{item}' or a matching_pairs instruction frame, never a literal sentence, so
    the SS1.1 course-scope grammatical-in-frame risk (which DOES apply to
    word_order) never arises; structured tier is carried entirely by
    matching_pairs (4 of them, each >= the SS16 6-pair floor) plus the
    untouched meal_order.005. New count: 13 templates, now with real anchors in
    all 4 lessons and all 3 tiers per lesson (was previously 0 templates
    anchored to lesson01 at all). Honestly thin: unit16 has almost no
    per-lesson synonym sets of its own, so most pools are unit-wide unions
    (SS8.1's 'anchor per lesson, pool across the unit' pattern), disclosed here
    for the coordinator. Re-verified: scripts/_practice_unit_scope_check.py
    shows 0 DEAD/0 FLOOR for this file; compile_content.py practice-validate 0
    errors.

    WAVE-3 RE-ANCHOR 2026-07-26: commit 05af7ace generated the unit-scoped semantic tag
    a1_unit16_routines, resolving the earlier blocker (this pack's own 2026-07-24 note)
    that unit16 carried no tag of its own besides 'meal'. Re-anchored all 4 word_pair.002
    instances (lesson01/02/03/04, 9/6/6/7 slots) from the untagged POS-only all_word pool
    (which pulled 777 off-theme words at Endless-Practice course scope) to the new
    pair_word preset (same content-POS filter + semantic: a1_unit16_routines) -- token set
    is unchanged (all 9 of unit16's own lexemes: wake/up/dressed/dinner/bed/every/usually/
    breakfast/after, all pairwise-distinct glosses), pool now identical at unit and course
    scope. The bare-word multiple_choice/listen_select/translation templates keep the
    untagged all_word/noun_word presets per dispatch scope. Verified via pool_check.py
    (9/6/6/7 pools, 0 course extras), practice-validate 0 errors, unit-scope check 0 DEAD.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 13 templates against unit and course pools (frame grammar per candidate, slot_gloss answers, MC/listen distinct options, matching_pairs distinct glosses and pair floor, translation single-answer fit, self-reference, jargon, booleans, feedback truth). 0 pack defects found, no edits to templates. Deferred (lexeme-level, scripts/backfill_lexemes_nl_en.py, not worked around): wake carries gloss wakker worden, so the bare-word translation prompt wakker worden expects wake while a Dutch learner will naturally type wake up (graded wrong); up and on (unit04) share gloss op and usually and mostly (unit35) share gloss meestal, so the broad all_word bare-word translation prompt is ambiguous at Endless-Practice course scope (systemic to every broad bare-word translation template)."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [meal, a1_unit16_routines]
slot_presets:
  meal: &meal {language_code: en, part_of_speech: noun, agreement_tags: {semantic: meal}}
  # REAUTH FIX 2026-07-24: 'number' and 'hour_number' both pointed at unit03's
  # OWN lexemes (hour_number was a narrowed filter over the same unit03-anchored
  # tokens, not new unit16 vocabulary) -- recipe DO-NOT #2. unit16 itself only
  # introduces 9 lexemes across its 4 lessons, none sharing any tag except
  # 'meal' (dinner/breakfast). Every slot below therefore constrains ONLY
  # language_code + part_of_speech (SS3.1c), pooled from unit16's own lexemes:
  # wake(verb), up(particle), dressed/every(adjective), dinner/bed/breakfast
  # (noun), usually(adverb), after(preposition). Safe here because every frame
  # using these presets is a bare '{item}' (multiple_choice/listen_select/
  # translation) or a matching_pairs instruction frame -- never a literal
  # sentence -- so the SS1.1 course-scope grammatical-in-frame risk does not
  # apply. The pack's one word_order template (meal_order.005) is untouched and
  # keeps the unit's own narrow, already-verified 'meal' tag.
  noun_word: &noun_word {language_code: en, part_of_speech: noun, agreement_tags: {semantic: a1_unit16_routines}}
  all_word: &all_word {language_code: en, part_of_speech: [noun, verb, adjective, adverb, preposition, particle], agreement_tags: {semantic: a1_unit16_routines}}
  # pair_word (wave 3): the generated unit-scoped tag a1_unit16_routines
  # (commit 05af7ace) narrowed to the same content POS as all_word -- exactly
  # unit16's own 9 lexemes (wake/up/dressed/dinner/bed/every/usually/breakfast/
  # after) at BOTH unit and course scope, so the matching_pairs below no
  # longer pulls the whole level's vocabulary at Endless-Practice course scope.
  # Used ONLY for word_pair.002 (all 4 lessons); the other all_word-anchored
  # templates (bare-word recognition/translation) are out of wave-3 scope.
  pair_word: &pair_word {language_code: en, part_of_speech: [noun, verb, adjective, adverb, preposition, particle], agreement_tags: {semantic: a1_unit16_routines}}
templates:
  - content_key: practice.nl-en.en.a1.unit16.lesson01.word_choose.001
    lesson_content_key: en.a1.unit16.lesson01.routine_verbs
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *noun_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord dat je hebt geleerd.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson01.word_pair.002
    lesson_content_key: en.a1.unit16.lesson01.routine_verbs
    type: matching_pairs
    frame: {text: "Koppel de Engelse woorden aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
    slots: {first: *pair_word, second: *pair_word, third: *pair_word, fourth: *pair_word, fifth: *pair_word, sixth: *pair_word, seventh: *pair_word, eighth: *pair_word, ninth: *pair_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth, ninth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth, ninth]}
    feedback_frame: {text: "Je hebt negen woorden gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson01.word_translate.003
    lesson_content_key: en.a1.unit16.lesson01.routine_verbs
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *noun_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson02.word_listen.001
    lesson_content_key: en.a1.unit16.lesson02.routine_with_times
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *all_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson02.word_pair.002
    lesson_content_key: en.a1.unit16.lesson02.routine_with_times
    type: matching_pairs
    frame: {text: "Koppel de Engelse woorden aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
    slots: {first: *pair_word, second: *pair_word, third: *pair_word, fourth: *pair_word, fifth: *pair_word, sixth: *pair_word}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Je hebt zes woorden gekoppeld aan hun Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit16.lesson02.word_translate.003
    lesson_content_key: en.a1.unit16.lesson02.routine_with_times
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *all_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
