schema_version: '1.0'
pack_key: practice.nl-en.a1.unit48
source_language: nl
target_language: en
unit_content_key: en.a1.unit48.library
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: true
  notes: >-
    Review 2026-10-22 (nl-en practice pass, fresh context; (7 fixes). translate.003, lesson04.translate.006 and volume_translate.001: pool -- narrowed to nouns, adjectives, adverbs (inflected verb prompts removed). match.002, volume_match.001, lesson04.match.005: Dutch -- English feedback now Dutch. volume_match.001 text block Dutch. NATIVE FLAGS: few=paar. BACKFILL GLOSS FLAGS: borrowing=lenen duplicates borrow=lenen (identical MC options), teaching=lesgeven noun glossed as infinitive, few=paar. 

    Authored 2026-07-12 as an additive Endless Practice coverage backfill for nl-en A1 unit 48. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.

    POLISH 2026-07-26 (wave 3, generated-tag re-anchor pass): commit
    05af7ace added generated unit/lesson semantic tags. Gloss check found a
    duplicate-gloss pair in the unit-wide pool: "borrow" (verb) and
    "borrowing" (noun) both gloss "lenen" -- excluded by POS narrowing
    (never both in the same pool). Re-anchored all 3 POS-only
    matching_pairs and raised the two lesson01-anchored ones from 4 to 6
    slots: lesson01.match.002 -> semantic a1_unit48_library narrowed to
    part_of_speech: [noun, adjective, adverb] (11 unit tokens, drops verb
    entirely so "borrow" is excluded and "borrowing" stays -- all 11
    glosses distinct). lesson01.match.002.volume_match.001 -> same
    unit-wide tag narrowed to part_of_speech: verb (16 tokens, includes
    "borrow" but not "borrowing" since that one is POS noun -- no
    collision, all 16 glosses distinct) -- POS-disjoint from match.002, no
    overlap at all. lesson04.match.005 -> semantic
    a1_unit48_library_lesson04 (20 tokens, its own lesson's content words,
    clears the floor alone) in place of the unit-wide tag; contains
    "borrowing" but not "borrow" so still collision-free. Verified with
    pool_check.py: all three pools clear their floor with 0 course-scope
    extras (tags are unit-scoped by construction) and no duplicate
    glosses.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a1_unit48_library
    - a1_unit48_library_lesson04
slot_presets:
  unit_word:
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
templates:
- content_key: practice.nl-en.en.a1.unit48.lesson01.choose.001
  lesson_content_key: en.a1.unit48.lesson01.library_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: {language_code: en, part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase], agreement_tags: {semantic: a1_unit48_library}}
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Kies de betekenis van {item}.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit48.lesson01.match.002
  lesson_content_key: en.a1.unit48.lesson01.library_vocabulary
  type: matching_pairs
  frame:
    text: '{first} — {second} — {third} — {fourth} — {fifth} — {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: &u48_noun_adj_adv {language_code: en, part_of_speech: [noun, adjective, adverb], agreement_tags: {semantic: a1_unit48_library}}
    second: *u48_noun_adj_adv
    third: *u48_noun_adj_adv
    fourth: *u48_noun_adj_adv
    fifth: *u48_noun_adj_adv
    sixth: *u48_noun_adj_adv
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Verbind elk woord met de Nederlandse betekenis.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a1.unit48.lesson01.translate.003
  lesson_content_key: en.a1.unit48.lesson01.library_vocabulary
  type: translation
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: {language_code: en, part_of_speech: [noun, adjective, adverb], agreement_tags: {semantic: a1_unit48_library}}
