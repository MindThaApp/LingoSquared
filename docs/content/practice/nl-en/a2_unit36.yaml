    language_code: nl
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: *content_pos
      agreement_tags: *unit_tag
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De Engelse vertaling is {item}.
