schema_version: '1.0'
pack_key: practice.nl-en.a2.unit30
source_language: nl
target_language: en
unit_content_key: en.a2.unit30.job_interview
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-23 (nl-en batch B). English target pool: 41 content-POS (noun/verb/adjective/adverb)
    lexemes across 4/4 lessons that carry any EN lexeme at all (this direction tests English; language_code=nl
    lexemes in the backfill are unrelated pollution from quoted-English-inside-Dutch-gloss parsing and
    were NOT used). Broad tag a2_unit30_job_interview unions the unit; each word_order/translation pair
    is additionally anchored per-lesson via that lessons own auto-tag for lesson stratification. word_order
    uses a single generic frame (Please say {item}.) deliberately: it is grammatical for any part of speech,
    has no candidate floor, and has zero self-reference risk (neither please nor say is ever a taught
    token in this unit). multiple_choice/listen_select clear the 3-distinct-value floor. matching_pairs
    clears the 6-distinct-token floor. Capacity is ample; see the coordinators report for the measured
    coverage numbers.
    Polish 2026-07-25: added lesson01-anchored multiple_choice choose.006 (lesson01 auto-tag, 5 distinct
    non-confusable unit glosses; deliberately avoids pooling position with lesson04 role, whose glosses
    both contain de functie) to lift the recognition tier to 3 live templates.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 14 templates (2 multiple_choice, 1 listen_select, 1 matching_pairs, 5 word_order, 5 translation) against the real unit/course lexeme pools; recognition/matching glosses answerable (position/role both carry de functie but the second sense disambiguates), Please say {item}. grammatical for every candidate, number slot course pool clean, no jargon or boolean issues. FIXED (frame-pool): lesson01.translate.003, lesson03.translate.003 and lesson04.translate.003 included next ''naast (next to)'', small ''kleine maat'' and well ''goed'', where the natural learner answer (next to, small size, good) is graded wrong; narrowed those three translation slots to part_of_speech noun/verb (30/12/5 unit candidates). DEFERRED (lexeme-gloss, backfill_lexemes_nl_en.py): next is glossed ''naast (next to)'' but the unit teaches next Monday = volgende; small is glossed ''kleine maat'' but the unit teaches a small team = klein; looking ''zoekend (in looking for)'' invites the answer looking for in translation. No native-judgment flags.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - a2_unit30_job_interview
    - a2_unit30_job_interview_lesson01
    - a2_unit30_job_interview_lesson03
    - a2_unit30_job_interview_lesson04
    - number_no_hundred
templates:
- content_key: practice.nl-en.en.a2.unit30.lesson01.choose.001
  lesson_content_key: en.a2.unit30.lesson01.interview_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: &id001
      - adjective
      - adverb
      - noun
      - verb
      agreement_tags: &id002
        semantic: a2_unit30_job_interview
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is een woord uit deze les.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a2.unit30.lesson04.listen.001
  lesson_content_key: en.a2.unit30.lesson04.interview_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is het woord dat je hoorde.'
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a2.unit30.lesson03.match.001
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
    second:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
    third:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
    fourth:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
    fifth:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
    sixth:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
  slot_relations:
  - kind: distinct
    slots: &id003
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id003
  feedback_frame:
    text: Verbind elk woord met de juiste Nederlandse betekenis.
    language_code: nl
    direction: ltr
- content_key: practice.nl-en.en.a2.unit30.lesson01.order.002
  lesson_content_key: en.a2.unit30.lesson01.interview_vocabulary
  type: word_order
  frame:
    text: Please say {item}.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: *id001
      agreement_tags: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Please say {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '{item} is het gevraagde woord.'
    language_code: nl
    direction: ltr
