    type: fill_in_blank
    frame: {text: "Yesterday I {item} the invitation.", language_code: en, direction: ltr}
    slots: {item: {language_code: en, part_of_speech: verb, agreement_tags: {semantic: a1_unit60_invitations_lesson04}}}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} past in deze zin.", language_code: nl, direction: ltr}
