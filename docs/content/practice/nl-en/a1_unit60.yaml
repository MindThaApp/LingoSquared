    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: en, direction: ltr}
    slots: {first: *lesson02_phrases, second: *lesson02_phrases, third: *lesson02_phrases, fourth: *lesson02_phrases, fifth: *lesson02_phrases, sixth: *lesson02_phrases}
