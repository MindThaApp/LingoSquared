    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Verbind elke Engelse zin met de Nederlandse betekenis.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit60.lesson01.order.001
    lesson_content_key: en.a1.unit60.lesson01.invitation_words
    type: word_order
    frame: {text: "Thank you for the {item}.", language_code: en, direction: ltr}
    slots: {item: {language_code: en, part_of_speech: noun, agreement_tags: {semantic: a1_unit60_invitations_lesson01}}}
    answer_derivation: {kind: render_frame, frame: {text: "Thank you for the {item}.", language_code: en, direction: ltr}}
    feedback_frame: {text: "Zet de Engelse woorden in de juiste volgorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a1.unit60.lesson04.translate.002
    lesson_content_key: en.a1.unit60.lesson04.dinner_invitation
    type: translation
    frame: {text: "Zij {item} een uitnodiging.", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: {language_code: en, part_of_speech: verb, agreement_tags: {semantic: a1_unit60_invitations_lesson04}}}
    answer_derivation: {kind: render_frame, frame: {text: "She {item} an invitation.", language_code: en, direction: ltr}}
    feedback_frame: {text: "In het Engels: She {item} an invitation.", language_code: nl, direction: ltr}
