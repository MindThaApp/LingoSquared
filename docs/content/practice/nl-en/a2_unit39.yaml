# ---------------------------------------------------------------------------
# STRUCTURED -- matching_pairs over the unit union (6 slots) + one floor-free
# word_order per lesson (anchored via that lesson's own tag)
# ---------------------------------------------------------------------------
- content_key: practice.nl-en.en.a2.unit39.lesson04.match.001
  lesson_content_key: en.a2.unit39.lesson04.offer_call_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: &match_word
      language_code: en
      part_of_speech: *content_pos
      agreement_tags: *unit_tag
    second: *match_word
    third: *match_word
    fourth: *match_word
    fifth: *match_word
    sixth: *match_word
  slot_relations:
  - kind: distinct
    slots: &match_slots
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *match_slots
  feedback_frame:
    text: Verbind elk Engels woord met de juiste Nederlandse betekenis.
    language_code: nl
    direction: ltr

