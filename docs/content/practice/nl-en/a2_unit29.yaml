schema_version: "1.0"
pack_key: practice.nl-en.a2.unit29
source_language: nl
target_language: en
unit_content_key: en.a2.unit29.maintenance
review:
  status: reviewed
  fresh_context: "true"
  notes: >-
    Authored 2026-07-07, closing a real visible gap: units 25-28 (the
    four earlier A2 units in this same en-target realization) already had
    fa-en/nl-en/prs-en practice packs, but unit29 (reporting a leaking
    kitchen sink to a building manager) had none in any direction. This
    is nl-en's pack, part of the same three-direction pass as fa-en's and
    prs-en's own a2_unit29.yaml.

    One new tag: "maintenance_noun" (sink, plumber, repair -- 3 members,
    added to scripts/_en_target_lexeme_common.py this pass). Each is a
    genuinely standalone single-token noun with its own independent
    meaning, unlike "building manager" -- a true two-word compound whose
    components ("building"/"manager") are deliberately left OUT of every
    semantic tag (same discipline as unit22's "sore"/"throat", components
    of "sore throat", staying untagged with zero practice templates).
    Real A2-scoped candidate count: exactly 3 (sink/plumber/repair are
    exclusive to this unit -- no other A2 unit reintroduces them), which
    meets but does not exceed the >=3 floor for multiple_choice/
    listen_select -- verified by hand against the A2-only-scoped
    iter_specs() output, not the pooled-with-A1 count
    scripts/_practice_slot_check.py itself computes (that script still
    pools A1+A2 together; the documented gap from unit28's pack notes).
    Deliberately NOT used in any shared generative frame ("I need a
    {item}" reads naturally for plumber/repair but oddly for the fixture
    noun sink), same "don't force it" reasoning as health_followup_noun/
    bureaucracy_noun.

    Reused, with real A2-scoped candidate-count math done by hand (not
    trusted to the pooled-with-A1 check): (1) "bureaucracy_noun"
    (appointment/document/form/confirmation, defined unit25, same A2
    course) -- real A2-scoped count is 4 (all introduced by unit25 alone,
    unaffected by unit29), safely above the floor, so used for both
    multiple_choice and listen_select here, matching unit25-28's own
    reuse discipline. (2) "possessive" (my/your/his/her, defined unit06)
    -- lesson02's own reading text reintroduces "my" ("...with my kitchen
    sink") and lesson03/04 reintroduce "your" ("Your report...", "Here's
    your repair number") -- both generalize with zero grammar loss ("I'd
    like to report a problem with your kitchen sink" / "My report of a
    leaking kitchen sink has been received" are both real, grammatical,
    plausible sentences, e.g. a manager relaying a tenant's problem). BUT
    the real A2-scoped candidate pool is only 2 (my, your -- his/her have
    never been reintroduced in any A2 unit through unit29), so kept to
    word_order/translation only, never multiple_choice/listen_select --
    same fix already applied to unit28's own possessive reuse. (3)
    "room_noun" (bedroom/kitchen/bathroom/garden, defined unit24, an A1
    tag) -- lesson01's own "reused_home_words" card explicitly recaps
    kitchen/apartment/bathroom as this unit's own introduced_tokens. Only
    kitchen and bathroom actually carry the room_noun tag ("apartment" is
    the whole home, not a room, and was never given a semantic tag by
    the shared module) -- real A2-scoped count for room_noun via this
    unit's recap is exactly 2, below the multiple_choice/listen_select
    floor, so restricted to translation only (no floor requirement for
    that type). No new tag was invented for "apartment" alone (a single
    untagged noun with no in-unit synonym would be scope creep beyond
    what this unit's real vocabulary supports).

    A combined 7-member matching_pairs pool ("maintenance_noun" UNION
    "bureaucracy_noun", via a slot_preset with a 2-item semantic list --
    same technique this direction's own unit28 "clinic_noun_combined"
    used) sits within AUTHORING_GUIDE.md #16's 6-12 target without
    padding: 3 (this unit's own maintenance nouns) + 4 (unit25's
    already-taught bureaucracy nouns, genuine review-pool reuse,
    explicitly endorsed by #16).

    ZERO fill_in_blank templates, matching this realization's own
    authoring note (unit29's realization file states zero fill_in_blank
    exercises) and every earlier A2 pack in this direction: the unit's
    single-token vocabulary is either a true two-word compound (building
    manager) that can't reduce to one blankable slot, or a tag too small
    (room_noun=2, possessive=2) to trust for an unforgiving single-slot
    fill_in_blank with no other disambiguating context. Ran
    scripts/_fill_in_blank_ambiguity_check.py after writing this pack;
    trivially 0 AMBIGUOUS/0 REVIEW since there are no fill_in_blank
    templates to flag.

    15 templates: 4 lesson01 (maintenance_noun choose/listen/translate +
    room_noun translate, recapping kitchen/apartment/bathroom), 3
    lesson02 (maintenance_noun choose + a possessive word_order against
    lesson02's own re-taught "my" + maintenance_noun listen), 4 lesson03
    (maintenance_noun choose + a second, differently-framed possessive
    word_order against lesson03's own re-taught "your"/"report"/"has"/
    "been"/"received" + possessive translate (bare) + maintenance_noun
    listen), 4 lesson04 (the 7-pair maintenance_noun+bureaucracy_noun
    matching_pairs + bureaucracy_noun listen + bureaucracy_noun translate
    (bare) + maintenance_noun translate (bare)). An honest,
    real-vocabulary-supported count for this unit's actual depth -- a bit
    below unit28's 16 since unit29 has slightly less single-token
    generative material (more of its new vocabulary is multi-word
    compounds/fixed phrases), not padded to hit a round number.

    Verified with scripts/_practice_slot_check.py (glob-discovered
    automatically for nl-en) and compile_content.py practice-validate, 0
    errors/0 warnings -- see the commit message for the exact run output.
    Still needs the standard fresh-context review before import.

    RE-AUTHORED 2026-07-24 (unit-scope DEAD-template pass): same root
    problem this pack's own notes above almost caught ("real A2-scoped
    candidate-count math done by hand") but didn't go far enough --
    "A2-scoped" here still meant A2-COURSE-pooled, not unit29-scoped, and
    generate_checkpoint() only ever sees the latter. scripts/
    _practice_unit_scope_check.py (the real per-unit model) found 6 DEAD
    templates: lesson02.possessive_order.002 and lesson03.possessive_order.002
    (possessive's real A2 pool is 'my'@unit25/'your'@unit25 -- BOTH pinned to
    unit25's own lesson_content_key, 0 in unit29), lesson03.
    possessive_translate_bare.003 (same reason), lesson04.match.001
    (bureaucracy_noun contributes 0 within-unit -- all 4 tokens pinned to
    unit25 -- so the declared 7-slot matching_pairs only had 3 real
    (maintenance_noun) candidates), and lesson04.bureaucracy_listen.002 /
    bureaucracy_translate_bare.003 (bureaucracy_noun, 0 unit-scoped
    candidates). Also fixed the bare `false` YAML boolean on
    review.fresh_context (DO-NOT #14 -- PyYAML coerces it, the field must be
    the quoted string "false").

    Before this fix, EVERY structured-tier template in this pack was dead
    (both possessive_order instances and the matching_pairs) -- structured
    tier was 0/15 live.

    FIXES applied, PACK-ONLY (no backfill/realization/overlay edits), all
    re-anchored to unit29's own genuinely live tags -- maintenance_noun (3:
    sink/plumber/repair, unit29's own per _en_target_lexeme_common.py's
    "Unit 29" block) and room_noun (2: kitchen/bathroom -- unit29's own
    lesson01 "reused_home_words" recap card is what actually pins these to
    unit29 in the A2 course dict, NOT unit24 which is a separate A1 course
    row and therefore a fresh, unrelated dict). Also newly drew on
    'day_part_in' (morning/afternoon/evening, minus night): unit29's own
    lesson02 genuinely reintroduces "morning" ("...come by tomorrow
    morning"), and it is the only A2-course-wide day_part_in token besides
    unit32's "evening" -- both checked grammatical in the new frame below.
    (1) lesson02.possessive_order.002 -> RENAMED daypart_order.002,
    RE-ANCHORED to 'day_part_in', new frame "Can someone come fix it in the
    {item}" -- grammatical for both real A2 course-wide members ("in the
    morning"/"in the evening" both hold), no self-reference (no frame word
    matches morning/evening).
    (2) lesson03.possessive_order.002 -> RENAMED room_order.002,
    RE-ANCHORED to 'room_noun', new frame "The plumber checked the {item}
    today" -- grammatical for both real A2 course-wide members ("checked
    the kitchen"/"checked the bathroom" both hold; room_noun's A1 members
    bedroom/garden do NOT exist in the A2 course dict at all, confirmed via
    the harness, so they can never leak into this frame).
    (3) lesson03.possessive_translate_bare.003 -> RENAMED
    maintenance_translate_bare.003, RE-ANCHORED to 'maintenance_noun'
    (bare-word translation, no floor requirement, adds a 3rd maintenance_noun
    production-tier instance).
    (4) lesson04.match.001 -> RE-ANCHORED from 'maintenance_bureaucracy_
    combined' to a new 'unit_recap_combined' preset (maintenance_noun UNION
    room_noun UNION day_part_in = sink/plumber/repair/kitchen/bathroom/
    morning, all noun POS, all genuinely unit29's own), slot count reduced
    from 7 to 6 to match the real pool exactly (was declaring 1 more slot
    than any real vocabulary supports).
    (5) lesson04.bureaucracy_listen.002 -> RENAMED maintenance_listen.002,
    RE-ANCHORED to 'maintenance_noun'. lesson04.bureaucracy_translate_bare.003
    -> RENAMED room_translate_bare2.003, RE-ANCHORED to 'room_noun'.

    Net result: 15 templates before -> 15 templates after (all renamed/
    re-anchored in place, none dropped, none added). Tier counts after the
    fix: recognition 7 (maintenance_noun MC/listen across lessons 01-04),
    structured 3 (daypart_order, room_order, the fixed 6-pair
    unit_recap_combined matching_pairs -- was 0 before), production 5
    (maintenance_noun x3, room_noun x2). All three tiers now clear the
    >=3-templates bar. Verified 0 DEAD/0 FLOOR for this pack with scripts/
    _practice_unit_scope_check.py and 0 errors with compile_content.py
    practice-validate. tag_schema/slot_presets updated: dropped the now-unused
    'bureaucracy_noun'/'possessive' tags and presets, added 'day_part_in' and
    the 'unit_recap_combined' union preset. Still needs the standard
    fresh-context review before import.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [maintenance_noun, room_noun, day_part_in]
slot_presets:
  maintenance_noun: &maintenance_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: maintenance_noun}}
  room_noun: &room_noun {language_code: en, part_of_speech: noun, agreement_tags: {semantic: room_noun}}
  day_part_in: &day_part_in {language_code: en, part_of_speech: noun, agreement_tags: {semantic: day_part_in}}
  unit_recap_combined: &unit_recap_combined {language_code: en, part_of_speech: noun, agreement_tags: {semantic: [maintenance_noun, room_noun, day_part_in]}}
templates:
  - content_key: practice.nl-en.en.a2.unit29.lesson01.choose.001
    lesson_content_key: en.a2.unit29.lesson01.repair_vocabulary
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *maintenance_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit29.lesson01.listen.002
    lesson_content_key: en.a2.unit29.lesson01.repair_vocabulary
    type: listen_select
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *maintenance_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is het woord dat je hoorde.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit29.lesson01.translate.003
    lesson_content_key: en.a2.unit29.lesson01.repair_vocabulary
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *maintenance_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit29.lesson01.room_translate_bare.004
    lesson_content_key: en.a2.unit29.lesson01.repair_vocabulary
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *room_noun}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}. Dit heb je al in eenheid 24 geleerd.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit29.lesson02.choose.001
    lesson_content_key: en.a2.unit29.lesson02.calling_to_report_a_problem
    type: multiple_choice
    frame: {text: "{item}", language_code: en, direction: ltr}
    slots: {item: *maintenance_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is een woord uit deze les.", language_code: nl, direction: ltr}
  - content_key: practice.nl-en.en.a2.unit29.lesson02.daypart_order.002
