  - content_key: practice.nl-en.en.a2.unit29.lesson04.match.001
    lesson_content_key: en.a2.unit29.lesson04.maintenance_dialogue
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: en, direction: ltr}
    slots: {first: *unit_recap_combined, second: *unit_recap_combined, third: *unit_recap_combined, fourth: *unit_recap_combined, fifth: *unit_recap_combined, sixth: *unit_recap_combined}
