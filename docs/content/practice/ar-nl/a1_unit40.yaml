  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech:
      - noun
      - verb
      agreement_tags:
        semantic: ingredient_cutting
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تذكّر المعنى العربي لـ {item}.
    language_code: ar
    direction: rtl
