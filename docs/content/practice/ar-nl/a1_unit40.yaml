- content_key: practice.ar-nl.nl.a1.unit40.lesson01.match.006
  lesson_content_key: nl.a1.unit40.lesson01.de_ui_de_tomaat_snijden
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &id001
      language_code: nl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic: koken_vocab
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
