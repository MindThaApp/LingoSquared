      semantic: possessive_flexible
  person_name: &id005
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  place_name: &id006
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: place_name
  city_name: &id007
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: city_name
