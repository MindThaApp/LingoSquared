    - sibling
    - extended_only
    - extended_family_member
    - possessive_pronoun
    - possessive_flexible
    - family_profile
    - family_dialogue
    - person_name
    - place_name
    - city_name
    - country
    register:
    - informal
    - polite
slot_presets:
