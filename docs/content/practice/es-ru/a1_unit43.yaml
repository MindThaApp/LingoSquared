- content_key: practice.es-ru.ru.a1.unit43.lesson04.match.001
  lesson_content_key: ru.a1.unit43.lesson04.zaselenie_u_stoyki
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra en ruso con su significado en español; las palabras proceden de las lecciones de esta unidad.
    language_code: es
    direction: ltr
