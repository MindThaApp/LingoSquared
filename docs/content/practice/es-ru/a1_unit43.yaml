schema_version: '1.0'
pack_key: practice.es-ru.a1.unit43
source_language: es
target_language: ru
unit_content_key: ru.a1.unit43.accommodation
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_администратор
    - w_бронь
    - w_были
    - w_включён
    - w_вкусный
    - w_выезд
    - w_двенадцать
    - w_забронирован
    - w_забронировать
    - w_завтрак
    - w_заселиться
    - w_заселяемся
    - w_карточке
    - w_ключ
    - w_красивый
    - w_начинается
    - w_ночей
    - w_ночь
    - w_одна
    - w_одну
    - w_пароль
    - w_прекрасные
    - w_прошли
    - w_следующий
    - w_цену
templates:
- content_key: practice.es-ru.ru.a1.unit43.lesson01.choose.001
  lesson_content_key: ru.a1.unit43.lesson01.zabronirovat_nomer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_забронировать
        - w_заселиться
        - w_заселяемся
        - w_забронирован
        - w_завтрак
        - w_начинается
        - w_включён
        - w_цену
        - w_ключ
        - w_пароль
        - w_карточке
        - w_администратор
        - w_бронь
        - w_ночей
        - w_одну
        - w_ночь
        - w_двенадцать
        - w_одна
        - w_выезд
        - w_прошли
        - w_красивый
        - w_вкусный
        - w_следующий
        - w_были
        - w_прекрасные
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Reservar una habitación».'
    language_code: es
    direction: ltr
