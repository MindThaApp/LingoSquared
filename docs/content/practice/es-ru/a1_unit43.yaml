    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Está incluido el desayuno?».'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit43.lesson03.translate.001
  lesson_content_key: ru.a1.unit43.lesson03.klyuch_i_parol_ot
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
