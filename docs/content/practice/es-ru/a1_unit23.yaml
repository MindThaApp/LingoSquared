  answer_derivation:
    kind: render_frame
    frame:
      text: Пожалуйста, {item} медленно.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Говори es el imperativo informal; la forma de cortesía sería говорите.
    language_code: es
    direction: ltr
