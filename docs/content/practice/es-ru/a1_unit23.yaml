- content_key: practice.es-ru.ru.a1.unit23.lesson01.choose.001
  lesson_content_key: ru.a1.unit23.lesson01.allo_eto_dima
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Алло es como los rusos contestan o inician una llamada telefónica.
