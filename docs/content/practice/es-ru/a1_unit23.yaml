    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Говори {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Медленно significa «despacio» y tiene una sola forma.
    language_code: es
    direction: ltr
