  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_пропал
        - w_нашёлся
        - w_рюкзак
        - w_стойки
        - w_кошелёк
        - w_стойка
        - w_стойке
        - w_подойди
        - w_потерян
        - w_посмотри
        - w_куртке
        - w_хватает
        - w_волнений
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre perdido y encontrado.'
    language_code: es
    direction: ltr
