templates:
- content_key: practice.es-ru.ru.a1.unit05.lesson01.choose.001
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Который час? pregunta literalmente «¿cuál hora?» y Сейчас significa «ahora»; juntas forman el par habitual de pregunta y respuesta para la hora.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson01.listen.002
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'La forma del sustantivo tras un número depende de este: час tras 1, часа tras 2-4, часов desde 5.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson01.order.003
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: word_order
  frame:
    text: Сейчас три {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Сейчас три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Tras 2, 3 y 4 el sustantivo toma la forma часа, como en два часа y три часа.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson01.fill.004
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: fill_in_blank
  frame:
    text: Сейчас десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Desde cinco en adelante el sustantivo toma el genitivo plural часов: пять часов, десять часов.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson01.translate.005
  lesson_content_key: ru.a1.unit05.lesson01.skolko_seychas_vremeni
  type: translation
  frame:
    text: ¿Qué hora es?
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Который {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Который час? significa literalmente «¿cuál hora?»; es la forma estándar de preguntar la hora.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson03.translate.001
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'En ruso, una pregunta suele llevar primero la palabra interrogativa y después el verbo: Когда отходит поезд?'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson02.choose.001
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Утром, днём, вечером y ночью son adverbios que terminan en -ом, -ём o -ью y se usan sin preposición.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson02.match.002
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'En ruso, las partes del día son adverbios: утром, днём, вечером, ночью.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson02.order.003
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: word_order
  frame:
    text: В два часа {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Después de una hora, дня significa «de la tarde», igual que утра significa «de la mañana» y вечера «de la tarde-noche».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson02.fill.004
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: fill_in_blank
  frame:
    text: В котором {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: В котором часу? es la pregunta para saber a qué hora ocurre algo, no qué hora es ahora.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson02.translate.005
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Las palabras rusas de tiempo como утром y вечером se usan solas, sin preposición.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson02.translate.006
  lesson_content_key: ru.a1.unit05.lesson02.chasti_dnya
  type: translation
  frame:
    text: A las siete de la tarde.
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: В семь часов {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Después de una hora, la parte del día va en genitivo: семь часов вечера.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson03.listen.002
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Скажите, пожалуйста es una forma cortés de empezar una pregunta a un desconocido.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson03.order.003
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Скажите, {item}, который час?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Скажите, {item}, который час?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Скажите es el imperativo de cortesía (вы) que significa «dígame», y пожалуйста suaviza la petición.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson03.order.004
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: word_order
  frame:
    text: Когда {item} поезд?
    language_code: ru
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда {item} поезд?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Отходит es la forma de él/ella/ello del verbo, por eso concuerda con поезд en singular.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson03.fill.005
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: fill_in_blank
  frame:
    text: Поезд отходит в восемь часов {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Después de una hora, утра equivale a a. m., así que восемь часов утра son las ocho de la mañana.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson03.translate.006
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: ¿Cuándo sale el tren?
    language_code: es
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Когда отходит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Когда pregunta por el momento, y el verbo отходит concuerda con поезд en singular.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit05.lesson03.translate.007
  lesson_content_key: ru.a1.unit05.lesson03.na_vokzale
  type: translation
  frame:
    text: A las dos de la tarde.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: В два часа {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дня se usa para las horas de la tarde, mientras que утра y вечера se usan para la mañana y la noche.
    language_code: es
    direction: ltr
