  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Los nombres de profesiones en ruso, como врач o инженер, no llevan artículo.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson01.match.002
