- content_key: practice.es-ru.ru.a1.unit17.lesson01.choose.001
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
