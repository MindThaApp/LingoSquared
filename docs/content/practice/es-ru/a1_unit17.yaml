    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Una profesión se expresa con un sustantivo solo: Я врач significa «Soy médico».'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson01.order.003
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: word_order
  frame:
    text: Он {item} в офисе.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Он {item} в офисе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Работает es la forma de «él» o «ella» de работать, «trabajar».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson01.fill.004
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: fill_in_blank
  frame:
    text: Я работаю в {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Después de в, que significa «en», el sustantivo toma la terminación preposicional -е: больница pasa a больнице.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson01.fill.005
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: fill_in_blank
  frame:
    text: Он инженер. Он работает в {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Офис toma la terminación preposicional -е después de в: в офисе.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson01.translate.006
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: translation
  frame:
    text: Soy médico.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Delante del nombre de una profesión no se necesita artículo.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson01.translate.007
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: translation
  frame:
    text: Él trabaja en la oficina.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Он работает в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: В más la terminación preposicional -е responde a la pregunta «¿dónde?».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson01.translate.008
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: translation
  frame:
    text: Ella es profesora. Trabaja en la escuela.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Она учитель. Она работает в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Школа pasa a школе después de в: «en la escuela».'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson01.translate.009
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Los nombres de profesiones como врач e инженер tienen la misma forma para hombres y mujeres: Она врач.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson02.choose.001
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Кем ты работаешь? significa literalmente «¿como quién trabajas?», y así preguntan los rusos por tu profesión.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson02.order.002
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: word_order
  frame:
    text: Кем ты {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Кем ты {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Работаешь es la forma informal de ты de работать.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson02.fill.003
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: fill_in_blank
  frame:
    text: Кем ты {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: La terminación -ешь de ты indica que trabajas tú, de manera informal.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson02.fill.004
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: fill_in_blank
  frame:
    text: Он повар. Он работает в {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ресторан toma la terminación preposicional -е después de в: в ресторане.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson02.translate.005
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: translation
  frame:
    text: ¿En qué trabajas? (informal)
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Кем ты {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кем pregunta por la profesión de alguien, y ты indica una pregunta informal.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson02.translate.006
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: translation
  frame:
    text: Trabajo en una tienda.
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Я работаю в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Магазин pasa a магазине después de в: «en una tienda».'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson02.translate.007
  lesson_content_key: ru.a1.unit17.lesson02.kem_ty_rabotayesh
  type: translation
  frame:
    text: Ella es cocinera. Trabaja en un restaurante.
    language_code: es
    direction: ltr
  slots:
    a: *id012
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Она {a}. Она работает в {b}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Повар mantiene la forma masculina incluso cuando se refiere a una mujer.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit17.lesson01.listen.010
  lesson_content_key: ru.a1.unit17.lesson01.ya_vrach
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Estos sustantivos de profesiones y lugares de trabajo no necesitan artículo.
    language_code: es
    direction: ltr
