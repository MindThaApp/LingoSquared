- content_key: practice.es-ru.ru.a1.unit26.lesson05.order.002
  lesson_content_key: ru.a1.unit26.lesson05.sravnivaem_igorya_i_lenu
  type: word_order
  frame:
    text: У Лены волосы {item}, чем у Игоря.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_длиннее
  answer_derivation:
    kind: render_frame
    frame:
      text: У Лены волосы {item}, чем у Игоря.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Lena tiene el pelo más largo que Igor. У Лены волосы длиннее, чем у Игоря: длиннее nunca cambia, y чем («que») introduce la segunda parte.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit26.lesson06.order.002
  lesson_content_key: ru.a1.unit26.lesson06.dima_uznayot_ninu
  type: word_order
  frame:
    text: Мне тоже приятно {item}!
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_познакомиться
  answer_derivation:
