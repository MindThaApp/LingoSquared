- content_key: practice.es-ru.ru.a1.unit26.lesson01.order.002
  lesson_content_key: ru.a1.unit26.lesson01.vysokiy_nevysokiy_staryy_i
  type: word_order
  frame:
    text: Лена высокая, а Игорь {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_невысокий
  answer_derivation:
    kind: render_frame
    frame:
      text: Лена высокая, а Игорь {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Lena es alta e Igor es bajo. Dos afirmaciones se colocan una junto a otra con а (mientras que, y): Лена высокая, а Игорь невысокий.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit26.lesson02.order.002
  lesson_content_key: ru.a1.unit26.lesson02.opisyvaem_volosy
