    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_волосы
  answer_derivation:
    kind: render_frame
    frame:
      text: У Димы короткие чёрные {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Dima tiene el pelo negro y corto. волосы significa «pelo».
    language_code: es
    direction: ltr
