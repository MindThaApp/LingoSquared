templates:
- content_key: practice.es-ru.ru.a1.unit08.lesson01.choose.001
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Сто y двести son los números 100 y 200; el sustantivo que los sigue va en genitivo plural: сто рублей, двести рублей.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson01.order.002
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: word_order
  frame:
    text: Сколько стоит {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько стоит? pregunta el precio de un solo artículo; молоко es un sustantivo singular.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson01.fill.003
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: fill_in_blank
  frame:
    text: Хлеб стоит {item} рублей. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Después de сто, como después de todo número a partir de cinco, el sustantivo va en genitivo plural: рублей.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson01.match.004
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Полкило es «medio kilo» y se escribe en una sola palabra.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson01.translate.005
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: translation
  frame:
    text: ¿Cuánto cuesta la leche?
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Стоит concuerda con un solo artículo, молоко; para varios artículos el ruso usa стоят.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson01.translate.006
  lesson_content_key: ru.a1.unit08.lesson01.skolko_stoit
  type: translation
  frame:
    text: El pan cuesta cien rublos.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Хлеб стоит {item} рублей.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сто no lleva artículo ni otra palabra delante; el sustantivo que le sigue es рублей.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson02.choose.001
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Дайте es el imperativo cortés de вы y significa «deme»; con ты sería дай.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson02.order.002
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: word_order
  frame:
    text: Дайте {item}, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Килограмм y полкило nombran una cantidad de mercancía y van justo después de дайте.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson02.fill.003
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: fill_in_blank
  frame:
    text: Дайте одну {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Después de дайте, el femenino штука pasa a штуку, la forma de lo que se pide.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson02.fill.004
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: fill_in_blank
  frame:
    text: Дайте пять {item}, пожалуйста. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Después de пять y de los números mayores, el sustantivo va en genitivo plural: пять штук.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson02.translate.005
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: Deme medio kilo, por favor. (formal)
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Дайте полкило, пожалуйста es una forma cortés de pedirle medio kilo a un vendedor.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson02.translate.006
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: Deme cinco piezas, por favor. (formal)
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте пять {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Штука cambia a штук después del número cinco.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson02.translate.007
  lesson_content_key: ru.a1.unit08.lesson02.kolichestvo
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Штука cuenta los artículos de uno en uno, mientras que килограмм y полкило cuentan por peso.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson03.listen.001
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Помидоры, огурцы y апельсины están en plural; картофель y капуста son palabras en singular que significan «patatas» y «col».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson03.order.002
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: word_order
  frame:
    text: У вас есть {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У вас есть ...? funciona con cualquier sustantivo y es la forma habitual de preguntar a un vendedor si tiene algo.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson03.fill.003
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько стоит кило {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Después de una palabra de cantidad como кило, el producto va en genitivo plural, así que яблоки pasa a яблок.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson03.translate.004
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: Deme un kilogramo de tomates, por favor. (formal)
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Дайте килограмм {item}, пожалуйста.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Después de килограмм, el producto va en genitivo plural: помидоры pasa a помидоров.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit08.lesson03.translate.005
  lesson_content_key: ru.a1.unit08.lesson03.na_rynke
  type: translation
  frame:
    text: ¿Tiene col? (formal)
    language_code: es
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: У вас есть {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Капуста va en singular en ruso y no lleva artículo.
    language_code: es
    direction: ltr
