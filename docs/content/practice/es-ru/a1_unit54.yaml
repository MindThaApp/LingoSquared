  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_море
        - w_песок
        - w_тёплый
        - w_волна
        - w_пляжный
        - w_зонт
        - w_плаваю
        - w_сижу
        - w_дюны
        - w_зонты
        - w_красивое
        - w_поплаваем
        - w_зоопарк
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿Vamos a la playa?».'
    language_code: es
    direction: ltr
