    text: '{item} es una de las palabras de esta unidad, de la lección sobre la novela y el título.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit63.lesson02.order.003
  lesson_content_key: ru.a1.unit63.lesson02.roman_i_nazvanie
  type: word_order
  frame:
    text: Я ищу {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_роман
  answer_derivation:
    kind: render_frame
    frame:
      text: Я ищу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Busco una novela. роман significa «novela».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit63.lesson02.fill.004
  lesson_content_key: ru.a1.unit63.lesson02.roman_i_nazvanie
  type: fill_in_blank
  frame:
    text: Я ищу роман с {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_названием
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_названием
