  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_писателя
  answer_derivation:
    kind: render_frame
    frame:
      text: Я вижу {item} и сотрудника.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Veo al escritor y al empleado. писателя significa «el escritor», como complemento directo.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit63.lesson04.order.002
  lesson_content_key: ru.a1.unit63.lesson04.tseny_v_knizhnom_magazine
  type: word_order
  frame:
