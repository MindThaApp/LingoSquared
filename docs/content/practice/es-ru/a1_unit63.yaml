schema_version: '1.0'
pack_key: practice.es-ru.a1.unit63
source_language: es
target_language: ru
unit_content_key: ru.a1.unit63.bookstore
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_детская
    - w_закладка
    - w_закладкой
    - w_зоомагазин
    - w_известный
    - w_интересной
    - w_ищете
    - w_короткое
    - w_название
    - w_названием
    - w_писатель
    - w_писателя
    - w_популярная
    - w_роман
templates:
- content_key: practice.es-ru.ru.a1.unit63.lesson02.choose.001
  lesson_content_key: ru.a1.unit63.lesson02.roman_i_nazvanie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_роман
        - w_название
        - w_короткое
        - w_названием
        - w_писатель
        - w_известный
        - w_писателя
        - w_детская
        - w_ищете
        - w_популярная
        - w_закладка
        - w_закладкой
        - w_интересной
        - w_зоомагазин
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre la novela y el título.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit63.lesson03.listen.001
  lesson_content_key: ru.a1.unit63.lesson03.pisatel_i_sotrudnik
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre el autor y el empleado.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit63.lesson04.translate.001
  lesson_content_key: ru.a1.unit63.lesson04.tseny_v_knizhnom_magazine
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre los precios de la librería.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit63.lesson05.match.001
  lesson_content_key: ru.a1.unit63.lesson05.u_prilavka_v_knizhnom
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra en ruso con su significado en español; las palabras proceden de las lecciones de esta unidad.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit63.lesson06.choose.001
  lesson_content_key: ru.a1.unit63.lesson06.nastya_slyshit_o_knizhnom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Nastya se entera de lo de la librería».'
    language_code: es
    direction: ltr
