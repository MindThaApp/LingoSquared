        - w_лук
        - w_помидор
        - w_резать
        - w_режу
        - w_еды
        - w_сковорода
        - w_жарить
        - w_жарю
        - w_готовит
        - w_пробовать
        - w_пробует
        - w_заходи
        - w_порежем
        - w_жаришь
        - w_пробуешь
        - w_готовят
        - w_режет
        - w_жарит
        - w_еда
        - w_вкусная
        - w_готова
        - w_готовим
        - w_попробуй
        - w_вкусно
        - w_приятного
        - w_аппетита
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre la cebolla, el tomate y cortar.'
