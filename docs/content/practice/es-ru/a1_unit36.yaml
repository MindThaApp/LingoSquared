schema_version: '1.0'
pack_key: practice.es-ru.a1.unit36
source_language: es
target_language: ru
unit_content_key: ru.a1.unit36.cooking
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_аппетита
    - w_вкусная
    - w_вкусно
    - w_готова
    - w_готовим
    - w_готовит
    - w_готовят
    - w_еда
    - w_еды
    - w_жарит
    - w_жарить
    - w_жаришь
    - w_жарю
    - w_заходи
    - w_лук
    - w_помидор
    - w_попробуй
    - w_порежем
    - w_приятного
    - w_пробовать
    - w_пробует
    - w_пробуешь
    - w_режет
    - w_режу
    - w_резать
    - w_сковорода
