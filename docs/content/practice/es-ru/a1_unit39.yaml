schema_version: '1.0'
pack_key: practice.es-ru.a1.unit39
source_language: es
target_language: ru
unit_content_key: ru.a1.unit39.seasons
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_весна
    - w_весной
    - w_временах
    - w_говорит
    - w_года
    - w_зима
    - w_зимой
    - w_катаемся
    - w_кататься
    - w_коньках
    - w_красивая
    - w_лето
    - w_летом
    - w_любимых
    - w_осень
    - w_осенью
    - w_плаваем
    - w_приятный
    - w_разговор
    - w_спокойная
    - w_считаешь
templates:
- content_key: practice.es-ru.ru.a1.unit39.lesson01.choose.001
  lesson_content_key: ru.a1.unit39.lesson01.vesna_i_leto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_года
        - w_весна
        - w_весной
        - w_лето
        - w_летом
        - w_осень
        - w_осенью
        - w_зима
        - w_зимой
        - w_считаешь
        - w_плаваем
        - w_кататься
        - w_коньках
        - w_катаемся
        - w_говорит
        - w_разговор
        - w_временах
        - w_приятный
        - w_красивая
        - w_спокойная
        - w_любимых
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre primavera y verano.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit39.lesson02.listen.001
  lesson_content_key: ru.a1.unit39.lesson02.osen_i_zima
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre otoño e invierno.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit39.lesson03.translate.001
  lesson_content_key: ru.a1.unit39.lesson03.zanyatiya_v_kazhdoe_vremya
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre actividades de cada estación.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit39.lesson05.match.001
  lesson_content_key: ru.a1.unit39.lesson05.chitaem_tekst_o_vremenakh
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra en ruso con su significado en español; las palabras proceden de las lecciones de esta unidad.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit39.lesson06.choose.001
  lesson_content_key: ru.a1.unit39.lesson06.igor_prisoedinyaetsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Igor se une».'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit39.lesson01.translate.002
  lesson_content_key: ru.a1.unit39.lesson01.vesna_i_leto
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre primavera y verano.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit39.lesson01.order.003
  lesson_content_key: ru.a1.unit39.lesson01.vesna_i_leto
  type: word_order
  frame:
    text: Какое сейчас время {item}?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_года
  answer_derivation:
    kind: render_frame
    frame:
      text: Какое сейчас время {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: ¿Qué estación del año es ahora? года significa «año» (genitivo), como en «estación» («época del año»).
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit39.lesson01.fill.004
  lesson_content_key: ru.a1.unit39.lesson01.vesna_i_leto
  type: fill_in_blank
  frame:
    text: Мне нравится {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_лето
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_лето
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Me gusta el verano. лето significa verano.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit39.lesson01.translate.005
  lesson_content_key: ru.a1.unit39.lesson01.vesna_i_leto
  type: translation
  frame:
    text: En primavera hace sol y en verano hace calor.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: adverb
      agreement_tags:
        semantic: w_летом
  answer_derivation:
    kind: render_frame
    frame:
      text: Весной солнечно, а {item} тепло.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: En primavera hace sol y en verano hace calor. летом significa «en verano».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit39.lesson02.order.002
  lesson_content_key: ru.a1.unit39.lesson02.osen_i_zima
  type: word_order
  frame:
    text: Какое время года ты {item} красивым?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_считаешь
  answer_derivation:
    kind: render_frame
    frame:
      text: Какое время года ты {item} красивым?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: ¿Qué estación te parece bonita? считаешь significa «te parece, consideras» (informal).
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit39.lesson03.order.002
  lesson_content_key: ru.a1.unit39.lesson03.zanyatiya_v_kazhdoe_vremya
  type: word_order
  frame:
    text: Летом мы {item}.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_плаваем
  answer_derivation:
    kind: render_frame
    frame:
      text: Летом мы {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: En verano nadamos. плаваем significa «nadamos».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit39.lesson03.fill.003
  lesson_content_key: ru.a1.unit39.lesson03.zanyatiya_v_kazhdoe_vremya
  type: fill_in_blank
  frame:
    text: Зимой мы катаемся на {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_коньках
    hint:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_коньках
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: En invierno patinamos sobre hielo. коньках significa «patines de hielo» (tras la palabra para «sobre»), como en «patinar sobre hielo».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit39.lesson05.order.002
  lesson_content_key: ru.a1.unit39.lesson05.chitaem_tekst_o_vremenakh
  type: word_order
  frame:
    text: Разговор о {item} года приятный.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_временах
  answer_derivation:
    kind: render_frame
    frame:
      text: Разговор о {item} года приятный.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: La conversación sobre las estaciones es divertida. временах significa «épocas, estaciones» (tras la palabra para «sobre»), como en «sobre las estaciones».
    language_code: es
    direction: ltr
