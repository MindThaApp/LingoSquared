schema_version: '1.0'
pack_key: practice.es-ru.a1.unit50
source_language: es
target_language: ru
unit_content_key: ru.a1.unit50.museum
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_большой
    - w_выставка
    - w_гид
    - w_закрываться
    - w_зал
    - w_картина
    - w_картины
    - w_концерт
    - w_осматриваю
    - w_открыто
    - w_посетить
templates:
- content_key: practice.es-ru.ru.a1.unit50.lesson01.choose.001
  lesson_content_key: ru.a1.unit50.lesson01.ya_khochu_poyti_v
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_посетить
        - w_выставка
        - w_осматриваю
        - w_закрываться
        - w_гид
        - w_зал
        - w_большой
        - w_картина
        - w_открыто
        - w_картины
        - w_концерт
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Quiero ir al museo».'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit50.lesson02.listen.001
  lesson_content_key: ru.a1.unit50.lesson02.ya_khochu_kupit_bilet
  type: listen_select
