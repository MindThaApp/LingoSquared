    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre leer el programa.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit51.lesson06.translate.001
  lesson_content_key: ru.a1.unit51.lesson06.dima_nina_i_nastya
  type: translation
  frame:
