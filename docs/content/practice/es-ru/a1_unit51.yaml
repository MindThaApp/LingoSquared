    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre quiero comprar un billete.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit51.lesson03.translate.001
  lesson_content_key: ru.a1.unit51.lesson03.vo_skolko_nachinaetsya_kontsert
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «¿A qué hora empieza el concierto?».'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit51.lesson04.match.001
  lesson_content_key: ru.a1.unit51.lesson04.v_kasse
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra en ruso con su significado en español; las palabras proceden de las lecciones de esta unidad.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit51.lesson05.choose.001
  lesson_content_key: ru.a1.unit51.lesson05.chitaem_programmu
  type: multiple_choice
  frame:
