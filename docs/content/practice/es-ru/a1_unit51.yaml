schema_version: '1.0'
pack_key: practice.es-ru.a1.unit51
source_language: es
target_language: ru
unit_content_key: ru.a1.unit51.concert
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_большая
    - w_группа
    - w_группу
    - w_группы
    - w_длится
    - w_длиться
    - w_довольна
    - w_место
    - w_начало
    - w_потрясающий
    - w_публика
    - w_странники
    - w_сцена
    - w_хорошее
templates:
- content_key: practice.es-ru.ru.a1.unit51.lesson01.choose.001
  lesson_content_key: ru.a1.unit51.lesson01.ya_khochu_poyti_na
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_группа
        - w_группы
        - w_место
        - w_хорошее
        - w_длиться
        - w_длится
        - w_группу
        - w_сцена
        - w_большая
        - w_публика
        - w_довольна
        - w_странники
        - w_начало
        - w_потрясающий
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Quiero ir al concierto».'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit51.lesson02.listen.001
  lesson_content_key: ru.a1.unit51.lesson02.ya_khochu_kupit_bilet
  type: listen_select
  frame:
