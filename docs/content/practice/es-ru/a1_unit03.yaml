templates:
- content_key: practice.es-ru.ru.a1.unit03.lesson01.choose.001
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En ruso, el sustantivo cambia después de los números: один рубль, два рубля, пять рублей.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson01.listen.002
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Después de 2, 3 y 4 el sustantivo toma una forma especial (два брата, три рубля), y a partir de 5 va en genitivo plural (пять рублей).
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson01.match.003
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Con los números del 2 al 4 el sustantivo cambia de una manera (брат pasa a брата) y con el 5 en adelante, de otra (книга pasa a книг).
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson01.order.004
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: word_order
  frame:
    text: У меня {item} брата.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Два, три y четыре llevan la misma forma del sustantivo, брата, así que cualquiera encaja aquí.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson01.fill.005
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: fill_in_blank
  frame:
    text: Пять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Después de пять y de todos los números mayores, el sustantivo va en genitivo plural: рублей, no рубль.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson01.translate.006
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: Tengo dos hermanos.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} брата.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: У меня два брата dice literalmente «en mí hay dos hermanos»; брата es la forma que se usa después de 2, 3 y 4.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson01.translate.007
  lesson_content_key: ru.a1.unit03.lesson01.chisla_1_5
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Aprende primero las formas para contar (один, два, три, четыре, пять); el sustantivo que las sigue cambia, como en один рубль, два рубля, пять рублей.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson02.listen.001
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Los números del 5 al 10 llevan el sustantivo en genitivo plural: пять книг, девять книг, десять книг.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson02.order.002
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: У меня {item} книг.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: У меня {item} книг.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Después de los números del 5 al 10 el sustantivo va en genitivo plural, por eso книга pasa a книг.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson02.order.003
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: word_order
  frame:
    text: Мне {item} лет.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Los rusos dicen su edad con мне, literalmente «a mí», y a partir de 5 el sustantivo es лет.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson02.fill.004
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: fill_in_blank
  frame:
    text: Мне десять {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Después de los números de cinco en adelante, la edad usa лет, en genitivo plural.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson02.translate.005
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: Tengo diez años.
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} лет.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: La edad se expresa con мне, «a mí», más el número y лет; no hay verbo.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson02.translate.006
  lesson_content_key: ru.a1.unit03.lesson02.chisla_6_10
  type: translation
  frame:
    text: ¿Qué edad tiene usted?
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько {item} лет?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько вам лет? usa el вам formal, literalmente «a usted»; pregunta cuántos años «a usted».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson03.choose.001
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: El ruso dice Сколько стоит? para un solo artículo y Сколько стоят? para varios, así que el verbo concuerda con lo que se compra.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson03.order.002
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: word_order
  frame:
    text: Сколько это {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько это {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сколько это стоит? es la pregunta de «cuánto cuesta» válida para todo; стоит es la forma para una sola cosa.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson03.fill.003
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: fill_in_blank
  frame:
    text: Сколько {item} яблоки? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Яблоки está en plural, así que el verbo es стоят; para un solo artículo (хлеб) sería стоит.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson03.translate.004
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: ¿Cuánto cuesta el pan?
    language_code: es
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Сколько стоит {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Хлеб es un solo artículo, por eso el verbo es стоит; con яблоки en plural sería стоят.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit03.lesson03.translate.005
  lesson_content_key: ru.a1.unit03.lesson03.na_rynke
  type: translation
  frame:
    text: Tres rublos.
    language_code: es
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Три {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Después de три el sustantivo toma la forma de 2-4, рубля, distinta de рублей, que se usa a partir de 5.
    language_code: es
    direction: ltr
