templates:
- content_key: practice.es-ru.ru.a1.unit12.lesson01.choose.001
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Давай es la forma informal (ты) para proponer una actividad; con вы sería давайте.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson01.order.002
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: word_order
  frame:
    text: Давай пойдём в {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай пойдём в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Кино nunca cambia su terminación, por eso sigue siendo кино después de в.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson01.fill.003
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: fill_in_blank
  frame:
    text: Давай {item} в кино. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Давай junto con пойдём sugiere un plan: «Vamos a ir».'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson01.translate.004
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: Vamos al cine mañana. (informal)
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай {item} в кино завтра.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Давай пойдём es la invitación amistosa con ты: «Vamos».'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson01.translate.005
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: Vamos al cine el sábado. (informal)
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай пойдём в кино в {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Para decir «el» con un día de la semana, el ruso usa в + acusativo: суббота pasa a ser субботу.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson01.translate.006
  lesson_content_key: ru.a1.unit12.lesson01.davay_poydyom
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Кино no cambia nunca, y давай es el «vamos a…» informal.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson02.choose.001
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Согласен termina en consonante porque quien habla es un hombre; una mujer dice согласна.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson02.fill.002
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: fill_in_blank
  frame:
    text: К {item}, я не могу. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: К сожалению es la forma estándar de decir «lamentablemente».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson02.fill.003
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: fill_in_blank
  frame:
    text: Во сколько мы {item}? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Встретимся es la forma de «nosotros», por eso va con мы: мы встретимся.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson02.order.004
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: word_order
  frame:
    text: К сожалению, я не {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: К сожалению, я не {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не niega el verbo, y могу es la forma de «yo» que significa «puedo».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson02.translate.005
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: translation
  frame:
    text: Vale, estoy de acuerdo. (dicho por un hombre)
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Хорошо, я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Согласен es la forma masculina; una mujer diría согласна.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson02.translate.006
  lesson_content_key: ru.a1.unit12.lesson02.soglasen_ne_mogu
  type: translation
  frame:
    text: ¿A qué hora quedamos?
    language_code: es
    direction: ltr
  slots:
    a: *id011
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Во сколько {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Во сколько pregunta literalmente «¿a cuánto?», es decir, «¿a qué hora?».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson03.listen.001
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Los nombres rusos tienen formas cortas y cariñosas, como Настя y Дима, que se usan entre amigos.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson03.order.002
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: word_order
  frame:
    text: Давай в семь часов, у {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай в семь часов, у {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'У significa «junto a» o «cerca de» y lleva genitivo: кинотеатр pasa a ser кинотеатра.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson03.fill.003
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: fill_in_blank
  frame:
    text: Отлично, до {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: До significa «hasta» y lleva genitivo, así que суббота pasa a ser субботы.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson03.translate.004
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: Genial, nos vemos el sábado.
    language_code: es
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Отлично, до {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: До субботы significa literalmente «hasta el sábado» y es la forma amistosa de decir «nos vemos entonces».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson03.translate.005
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: Digamos que a las siete, en el cine. (informal)
    language_code: es
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Давай в семь часов, у {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Давай в семь часов propone una hora; у кинотеатра añade el lugar.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit12.lesson03.translate.006
  lesson_content_key: ru.a1.unit12.lesson03.plany_na_subbotu
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Отлично es un adverbio que significa «genial» y no cambia según el género ni el número.
    language_code: es
    direction: ltr
