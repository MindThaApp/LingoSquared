    language_code: es
    direction: ltr
  slots:
    a: *id010
    b: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Как ты {a} {b}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Как ты себя чувствуешь? es la forma informal de preguntar cómo se siente alguien.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit22.lesson03.translate.006
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: translation
  frame:
