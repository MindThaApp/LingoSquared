templates:
- content_key: practice.es-ru.ru.a1.unit22.lesson01.choose.001
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Рад lo dice un hombre y рада una mujer; грустно es impersonal y se usa con мне.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit22.lesson01.order.002
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: word_order
  frame:
    text: Сегодня я {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Сегодня я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Рада termina en -а porque quien habla es una mujer.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit22.lesson01.fill.003
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: fill_in_blank
  frame:
    text: Мне {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Мне грустно usa мне («a mí») y no lleva sujeto, como en «me da tristeza».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit22.lesson01.translate.004
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: translation
  frame:
    text: Estoy contento. (lo dice un hombre)
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Un hombre dice рад sin terminación.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit22.lesson01.translate.005
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: translation
  frame:
    text: Estoy contenta. (lo dice una mujer)
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'Una mujer añade -а: рада.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit22.lesson01.translate.006
  lesson_content_key: ru.a1.unit22.lesson01.ya_rad
  type: translation
  frame:
    text: Me siento triste.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Мне грустно es la forma habitual de decir que estás triste.
    language_code: es
    direction: ltr
