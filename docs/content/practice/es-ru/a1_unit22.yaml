  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item}, потому что много работы.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Устала termina en -а para una mujer; потому что introduce la causa.
    language_code: es
    direction: ltr
