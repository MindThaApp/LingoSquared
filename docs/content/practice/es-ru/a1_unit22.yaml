    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Как ты себя чувствуешь? pregunta cómo te sientes; себя es el reflexivo «a ti mismo».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit22.lesson03.order.002
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
  type: word_order
  frame:
