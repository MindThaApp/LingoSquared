    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Завтра {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: 'No hace falta ningún verbo «ser»: Завтра выходной.'
    language_code: es
    direction: ltr
