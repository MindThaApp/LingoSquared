      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Чувствуешь es la forma informal de ты de чувствовать.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit22.lesson03.fill.004
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
