    language_code: ru
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Как ты {item} чувствуешь?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Себя es un pronombre reflexivo que no cambia con ninguna persona.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit22.lesson03.fill.003
  lesson_content_key: ru.a1.unit22.lesson03.posle_raboty
