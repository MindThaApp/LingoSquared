    slot: item
  feedback_frame:
    text: ¿Vienes a la fiesta? придёшь significa vendrás (informal).
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit32.lesson03.translate.004
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: translation
  frame:
    text: ¡Sí, con mucho gusto voy!
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_удовольствием
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, я с {item} приду!
      language_code: ru
      direction: ltr
  feedback_frame:
    text: ¡Sí, con mucho gusto voy! удовольствием significa placer, en «con gusto», después de la palabra para «con».
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit32.lesson04.order.002
  lesson_content_key: ru.a1.unit32.lesson04.igor_i_dima_planiruyut
