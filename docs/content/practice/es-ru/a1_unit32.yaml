schema_version: '1.0'
pack_key: practice.es-ru.a1.unit32
source_language: es
target_language: ru
unit_content_key: ru.a1.unit32.birthday
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_вечеринка
    - w_восемнадцатого
    - w_мило
    - w_начнём
    - w_отметим
    - w_отмечаем
    - w_отмечать
    - w_подарок
    - w_поздравляю
    - w_пригласишь
    - w_приглашает
    - w_приглашать
    - w_приглашаю
    - w_приглашают
    - w_приглашу
    - w_придёшь
    - w_рады
    - w_рождения
    - w_удовольствием
    - w_устраиваем
templates:
- content_key: practice.es-ru.ru.a1.unit32.lesson01.choose.001
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_рождения
        - w_восемнадцатого
        - w_отмечать
        - w_отмечаем
        - w_вечеринка
        - w_приглашать
        - w_приглашаю
        - w_приглашают
        - w_придёшь
        - w_удовольствием
        - w_отметим
        - w_устраиваем
        - w_пригласишь
        - w_приглашу
        - w_приглашает
        - w_рады
        - w_поздравляю
        - w_подарок
        - w_мило
        - w_начнём
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre el cumpleaños.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit32.lesson02.listen.001
  lesson_content_key: ru.a1.unit32.lesson02.otmechat_i_vecherinka
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre celebrar y la fiesta.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit32.lesson03.translate.001
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre invitar a la fiesta.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit32.lesson04.match.001
  lesson_content_key: ru.a1.unit32.lesson04.igor_i_dima_planiruyut
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ru
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Relaciona cada palabra en ruso con su significado en español; las palabras proceden de las lecciones de esta unidad.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit32.lesson05.choose.001
  lesson_content_key: ru.a1.unit32.lesson05.kto_chto_delaet_dlya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre quién hace qué para la fiesta.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit32.lesson06.translate.001
  lesson_content_key: ru.a1.unit32.lesson06.vecherinka_v_yazykovom_kafe
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección sobre la fiesta en el café de idiomas.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit32.lesson01.order.002
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: word_order
  frame:
    text: Мой день {item} восемнадцатого апреля.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: noun
      agreement_tags:
        semantic: w_рождения
  answer_derivation:
    kind: render_frame
    frame:
      text: Мой день {item} восемнадцатого апреля.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Mi cumpleaños es el dieciocho de abril. рождения significa nacimiento (genitivo, en «cumpleaños»).
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit32.lesson01.fill.003
  lesson_content_key: ru.a1.unit32.lesson01.den_rozhdeniya
  type: fill_in_blank
  frame:
    text: День рождения Лены в субботу, {item} апреля. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_восемнадцатого
    hint:
      language_code: ru
      part_of_speech: adjective
      agreement_tags:
        semantic: w_восемнадцатого
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'El cumpleaños de Lena es el sábado dieciocho de abril. Лены es el genitivo de Лена e indica posesión: день рождения Лены, sin palabra para «de».'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit32.lesson02.order.002
  lesson_content_key: ru.a1.unit32.lesson02.otmechat_i_vecherinka
  type: word_order
  frame:
    text: Мы {item} день рождения Лены.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_отмечаем
  answer_derivation:
    kind: render_frame
    frame:
      text: Мы {item} день рождения Лены.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Celebramos el cumpleaños de Lena. отмечаем significa celebramos.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit32.lesson03.order.002
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: word_order
  frame:
    text: Я {item} тебя.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_приглашаю
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} тебя.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Te invito. приглашаю significa invito.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit32.lesson03.fill.003
  lesson_content_key: ru.a1.unit32.lesson03.priglashaem_na_vecherinku
  type: fill_in_blank
  frame:
    text: Ты {item} на вечеринку? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_придёшь
    hint:
      language_code: ru
      part_of_speech: verb
      agreement_tags:
        semantic: w_придёшь
  answer_derivation:
