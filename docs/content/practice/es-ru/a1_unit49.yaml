schema_version: '1.0'
pack_key: practice.es-ru.a1.unit49
source_language: es
target_language: ru
unit_content_key: ru.a1.unit49.cinema
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ru by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_детский
    - w_захватывающий
    - w_начинаться
    - w_новый
    - w_попкорн
    - w_посмотреть
    - w_сеанс
    - w_скоро
    - w_смотреть
templates:
- content_key: practice.es-ru.ru.a1.unit49.lesson01.choose.001
  lesson_content_key: ru.a1.unit49.lesson01.ya_khochu_posmotret_film
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: &id001
      language_code: ru
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_смотреть
        - w_посмотреть
        - w_сеанс
        - w_начинаться
        - w_скоро
        - w_новый
        - w_попкорн
        - w_детский
        - w_захватывающий
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} es una de las palabras de esta unidad, de la lección «Quiero ver una película».'
    language_code: es
    direction: ltr
