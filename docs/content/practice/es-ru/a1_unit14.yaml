templates:
- content_key: practice.es-ru.ru.a1.unit14.lesson01.choose.001
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Нравится es el verbo para expresar gusto: Мне нравится кофе dice literalmente que el café me agrada.'
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson01.order.002
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: word_order
  frame:
    text: Мне {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: En Мне нравится кофе, lo que gusta es el sujeto gramatical y мне es la persona a quien le gusta.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson01.fill.003
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: fill_in_blank
  frame:
    text: Мне {item} чай. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Нравится se usa con мне, "a mí", para decir que algo te gusta.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson01.translate.004
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: Me gusta el café.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: El ruso dice "a mí me agrada el café", con una estructura parecida a la del español "me gusta el café".
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson01.translate.005
  lesson_content_key: ru.a1.unit14.lesson01.mne_nravitsya
  type: translation
  frame:
    text: No me gusta el té.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Мне не {item} чай.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Pon не antes de нравится para decir que algo no te gusta.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson02.listen.001
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: listen_select
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Не хочу es "no quiero"; не va justo antes del verbo.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson02.order.002
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
    text: Я {item} кофе.
    language_code: ru
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не хочу niega я хочу, "quiero".
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson02.order.003
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: word_order
  frame:
    text: Я хочу {item}.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Сок es un sustantivo masculino y no cambia después de хочу.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson02.fill.004
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: fill_in_blank
  frame:
    text: Я хочу {item}. ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Хочу va seguido directamente de lo que se quiere.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson02.translate.005
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: translation
  frame:
    text: Quiero jugo.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Я хочу {item}.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Я хочу más un sustantivo es una petición simple y directa.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson02.translate.006
  lesson_content_key: ru.a1.unit14.lesson02.ya_hochu
  type: translation
  frame:
    text: No quiero café.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Я {item} кофе.
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Не va delante de хочу para negarlo.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson03.choose.001
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Тебе es la forma informal de ты y significa «a ti»; la forma de cortesía de вы es вам.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson03.order.002
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: word_order
  frame:
    text: Да, мне нравится кофе. А {item}?
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: А тебе? devuelve la pregunta usando el ты informal.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson03.fill.003
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: fill_in_blank
  frame:
    text: А {item} нравится кофе? ({hint})
    language_code: ru
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Тебе es el «a ti» informal, que se usa con amigos.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson03.translate.004
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: Sí, me gusta el café. ¿Y a ti? (informal)
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Да, мне нравится кофе. А {item}?
      language_code: ru
      direction: ltr
  feedback_frame:
    text: Тебе es «a ti», informal; a un desconocido le dirías вам.
    language_code: es
    direction: ltr
- content_key: practice.es-ru.ru.a1.unit14.lesson03.translate.005
  lesson_content_key: ru.a1.unit14.lesson03.tebe_nravitsya_kofe
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Estas son las piezas básicas para hablar de gustos y deseos: нравится, не хочу, сок y тебе.'
    language_code: es
    direction: ltr
