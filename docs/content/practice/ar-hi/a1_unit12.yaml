    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit12.lesson02.translate.005
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: ذهبتُ إلى البيت. (تقولها امرأة)
    language_code: ar
    direction: rtl
  slots:
