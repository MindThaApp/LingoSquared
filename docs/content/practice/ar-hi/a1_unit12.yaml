templates:
- content_key: practice.ar-hi.hi.a1.unit12.lesson01.choose.001
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تحل था وथी محل है في الماضي وتتوافقان مع المبتدأ: दिन अच्छा था، फ़िल्म अच्छी थी.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit12.lesson01.order.002
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: कल का दिन {item} था?
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: कल का दिन {item} था?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा تتوافق مع الاسم المذكر दिन؛ ومع الاسم المؤنث تصبح कैसी.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit12.lesson01.order.003
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: चाय की दुकान बहुत {item} थी।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अच्छी مؤنثة لأن दुकान مؤنثة، وथी تتوافق معها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit12.lesson01.fill.004
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: fill_in_blank
  frame:
    text: फ़िल्म अच्छी {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थी هي صيغة الماضي المؤنثة للفعل «يكون»، وتتوافق مع الاسم المؤنث फ़िल्म.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit12.lesson01.translate.005
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: كان الفيلم جيدًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फ़िल्म अच्छी {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म مؤنثة، لذا تأخذ الصفة وصيغة الماضي للفعل «يكون» الصيغة المؤنثة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit12.lesson01.translate.006
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: كان محل الشاي جيدًا جدًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की تربط चाय بالاسم المؤنث दुकान، وअच्छी وथी تتوافقان معه.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit12.lesson02.choose.001
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تنتهي صيغتا الماضي للفعلين जाना وमिलना بـ -आ للرجل وبـ -ई للمرأة: गया أو गई، मिला أو मिली.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit12.lesson02.order.002
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: word_order
  frame:
    text: मैं वहाँ प्रिया से {item}।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं वहाँ प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'से هنا تعني «مع»: प्रिया से मिला أي «التقى ببريا»، وتتبع النهاية المتكلم.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit12.lesson02.fill.003
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
