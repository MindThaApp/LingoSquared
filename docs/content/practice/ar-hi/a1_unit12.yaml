      direction: ltr
  feedback_frame:
    text: से بعد الشخص الذي جرى لقاؤه تعني «مع»؛ ونهاية الفعل تتبع المتكلم.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit12.lesson02.translate.007
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
