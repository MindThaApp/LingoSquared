    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ماضي الفعل يتوافق مع الفاعل: يقول الرجل मिला وتقول المرأة मिली.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit12.lesson03.choose.001
