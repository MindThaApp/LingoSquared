    slot: item
  feedback_frame:
    text: تعني बाहर «الخارج»، وجملة चलो, बाहर जाते हैं! اقتراح بالخروج.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit19.lesson03.fill.002
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
