templates:
- content_key: practice.ar-hi.hi.a1.unit19.lesson01.choose.001
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: كلمة मौसम اسم مذكر، لذلك يكون السؤال आज मौसम कैसा है؟ بـ कैसा وليس कैसी.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit19.lesson01.listen.002
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تأتي كلمات الطقس مثل धूप وبारिश وहवा مع है مباشرة: आज धूप है تعني «اليوم مشمس».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit19.lesson01.order.003
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'تذكر الهندية اسم حالة الطقس ثم تضيف है، دون كلمة تقابل «يوجد»: आज धूप है.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit19.lesson01.order.004
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} कैसा है?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} कैसा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تتوافق कैसा مع الاسم المذكر मौसम.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit19.lesson01.fill.005
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: fill_in_blank
  frame:
    text: आज {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كلمة धूप مؤنثة، لكن है لا تتغير مع الشيء الواحد.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit19.lesson01.translate.006
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: الجو مشمس اليوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تستخدم الهندية الاسم धूप مع है بدل صفة تعني «مشمس».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit19.lesson01.translate.007
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تسمّي الهندية الطقس بالأسماء: धूप هي أشعة الشمس، وबारिश هي المطر، وहवा هي الريح.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit19.lesson02.choose.001
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
