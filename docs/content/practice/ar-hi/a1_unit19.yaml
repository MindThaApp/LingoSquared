    text: كلمة मौसम مذكرة، لذلك تأخذ ठंडा وबुरा صيغة -ा، أما गर्म فلا تتغير أبدًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit19.lesson02.order.004
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: word_order
  frame:
    text: आज हवा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आज हवा {item} है।
