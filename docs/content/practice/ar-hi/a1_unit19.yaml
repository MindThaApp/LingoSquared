  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: الطقس بارد جدًا اليوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम बहुत {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تأتي बहुत قبل الصفة، وتتوافق ठंडा مع मौसम.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit19.lesson03.choose.001
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
