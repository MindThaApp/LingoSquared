  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: الطقس حارّ اليوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تبقى गर्म كما هي مهما كان الاسم الذي تصفه.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit19.lesson02.translate.007
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: توجد غيوم اليوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تُستعمل كلمة बादल هنا بصيغة الجمع، لذلك يكون الفعل हैं.
    language_code: ar
    direction: rtl
