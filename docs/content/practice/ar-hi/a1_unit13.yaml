templates:
- content_key: practice.ar-hi.hi.a1.unit13.lesson01.choose.001
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पसंद है تعني «محبَّب إليّ»: मुझे चाय पसंद है تعني «أحب الشاي»، وتُبنى بـ मुझे لا بـ मैं.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson01.listen.002
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'है تُستعمل مع شيء واحد وहैं مع أكثر من شيء: किताब पसंद है، किताबें पसंद हैं.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson01.order.003
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ليس في الهندية أداة تعريف ولا تنكير، ويقع الشيء المحبَّب بين मुझे و पसंद.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson01.order.004
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'الفعل هنا हैं لأن किताबें جمع: पसंद है تصبح पसंद हैं.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson01.fill.005
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पसंद ليست فعلًا في الهندية، بل كلمة تُستعمل مع है، فتُبنى الجملة كأنها «الشاي محبَّب إليّ».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson01.fill.006
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे {item} पसंद हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: الشيء المحبَّب إذا كان جمعًا يأخذ हैं بعد पसंद.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson01.translate.007
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: أحب الموسيقى.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: الشخص الذي يحب يوضع في خانة मुझे، والموسيقى هي الشيء المحبَّب.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson01.translate.008
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: أحب الكتب.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: किताबें جمع، لذا الفعل हैं لا है.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson01.translate.009
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: الفرق بين المفرد किताब والجمع किताबें هو النهاية -ें فقط، وهي علامة الجمع لهذا الاسم المؤنث.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson02.choose.001
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'खेल تعني «رياضة» و«لعبة» معًا، و ज़्यादा تعني «أكثر»: मुझे चाय ज़्यादा पसंद है تعني «أحب الشاي أكثر».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson02.order.002
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: word_order
  frame:
    text: मुझे यह {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: यह (هذا) يأتي مباشرة قبل الاسم الذي يشير إليه، كما في यह खेल.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson02.fill.003
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} पसंद है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ज़्यादा تأتي قبل पसंद لبيان أيّ الشيئين يُحَبّ أكثر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson02.translate.004
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: أحب هذه الرياضة.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: है تتوافق مع الشيء المحبَّب (رياضة واحدة) لا مع الشخص الذي يحبها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson02.translate.005
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: أحب الشاي أكثر.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे चाय {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تقول الهندية حرفيًا «الشاي أحبّ إليّ أكثر»، وتأتي ज़्यादा قبل पसंद مباشرة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit13.lesson02.translate.006
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खेल (رياضة أو لعبة) اسم مذكر، أما ज़्यादा (أكثر) فلا يتغير شكلها.
    language_code: ar
    direction: rtl
