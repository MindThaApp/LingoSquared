templates:
- content_key: practice.ar-hi.hi.a1.unit03.lesson01.choose.001
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تنتهي أسماء أيام الأسبوع في الهندية بـ -वार (يوم من أيام الأسبوع)، فلـ सोमवार وमंगलवार وरविवार النهاية نفسها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson02.listen.001
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أسماء الأشهر مقتبسة من الإنجليزية، ولهذا يسهل التعرف على जनवरी وमार्च وदिसंबर.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson03.choose.001
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'अगली تعني «القادمة» وتأتي مع الاسم المؤنث: अगली क्लास هي «الحصة القادمة»، أما مع الاسم المذكر فتُستخدم अगला.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson03.match.002
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: آج (اليوم) لا يحتاج إلى كلمة إضافية، أما اليوم من أيام الأسبوع فيأخذ को (सोमवार को، أي يوم الاثنين)، والشهر يأخذ में (जनवरी में، أي في يناير).
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson01.order.002
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: اليوم من أيام الأسبوع هو المبتدأ في الجملة، ولذلك تعني आज सोमवार है حرفيًا «اليوم الاثنين».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson01.order.003
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: योग क्लास {item} को है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {item} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'को بعد اسم اليوم تعني «يوم»: सोमवार को أي يوم الاثنين.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson02.fill.002
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: fill_in_blank
  frame:
    text: आज कितनी {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कितनी تتبع الاسم المؤنث तारीख़، ولذلك تنتهي بـ -ी.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson02.order.003
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: word_order
  frame:
    text: मेरा जन्मदिन {item} में है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {item} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'में بعد اسم الشهر تعني «في»: जनवरी में أي في يناير.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson03.fill.003
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: अगली क्लास {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'कब تعني «متى» وتقع في مكان الجواب: अगली क्लास मंगलवार को है.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson03.fill.004
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: कोई {item} नहीं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कोई बात नहीं هو الرد المعتاد على الشكر أو الاعتذار، مثل «لا شكر على واجب» أو «لا بأس».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson01.translate.004
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: أي يوم هو اليوم؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} सा दिन है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कौन सा تعني «أيّ»؛ وفي आज कौन सा दिन है? تسأل عن يوم الأسبوع.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson02.translate.004
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: عيد ميلادي في {month}.
    language_code: ar
    direction: rtl
    slot_rendering:
      month: english_gloss
  slots:
    month: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {month} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: الأشهر تأخذ में (في)، أما أيام الأسبوع فتأخذ को (يوم).
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson01.translate.005
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: حصة اليوغا يوم {day}.
    language_code: ar
    direction: rtl
    slot_rendering:
      day: english_gloss
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {day} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: أيام الأسبوع أسماء مذكرة، وتدل को على اليوم الذي يحدث فيه الشيء.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson03.translate.005
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: translation
  frame:
    text: متى عيد ميلادك؟ (بصيغة غير رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा जन्मदिन {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'مع आप الرسمية تقول: आपका जन्मदिन कब है؟'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit03.lesson02.translate.005
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تُكتب أسماء أيام الأسبوع والأشهر في الديفاناغري دون أحرف كبيرة، لأن هذه الكتابة لا تعرف الأحرف الكبيرة.
    language_code: ar
    direction: rtl
