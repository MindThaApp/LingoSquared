templates:
- content_key: practice.ar-hi.hi.a1.unit11.lesson01.choose.001
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'चलो مع فعل بصيغة -ते ثم हैं تفيد اقتراح فعل شيء معًا: चलो, फ़िल्म देखते हैं!'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson01.listen.002
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'साथ تعني «معًا» أو «مع»، وكثيرًا ما يتضمنها الاقتراح: चलो, साथ चाय पीते हैं!'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson01.order.003
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, {item} देखते हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, {item} देखते हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म مؤنث، لكن صيغة الاقتراح -ते हैं لا تتغير معه.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson01.order.004
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, साथ चाय {item} हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, साथ चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: صيغة الاقتراح هي الفعل بصيغة -ते مع हैं، وتعني «هيا نفعل ...».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson01.fill.005
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: अच्छा {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: अच्छा विचार है عبارة شائعة لقبول اقتراح.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson01.fill.006
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: चलो, फ़िल्म {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: देखते هي صيغة -ते، وهي مع हैं تعني «نشاهد»، وبعد चलो تعني «هيا نشاهد».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson01.translate.007
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: هيا نشرب الشاي!
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: «هيا» في الهندية تُقال चलो مع صيغة -ते हैं من الفعل.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson01.translate.008
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: 'فكرة جيدة! (جملة كاملة: الفكرة جيدة)'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अच्छा {item} है!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: विचार مذكر، ولهذا جاءت الصفة अच्छा.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson02.choose.001
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: माफ़ करना طريقة غير رسمية لقول «آسف» أو «عذرًا»، تُستخدم مع من تخاطبه بـ तुम.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson02.match.002
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: matching_pairs
