    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'من الكلمات الهندية للاعتذار المهذب: माफ़ करना بمعنى «آسف» وव्यस्त بمعنى «مشغول».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson02.fill.003
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: fill_in_blank
  frame:
    text: माफ़ करना, मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بعد माफ़ करना تذكر وضعك، مثل كونك مشغولًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson02.translate.004
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: آسف، أنا مشغول. (غير رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: माफ़ करना, मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: माफ़ करना هي الطريقة غير الرسمية للاعتذار؛ وتبقى व्यस्त كما هي للرجل والمرأة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson02.translate.005
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: إذًا متى نلتقي؟
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तो {item} कब मिलते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'يأتي हम مع صيغة الجمع -ते हैं: हम मिलते हैं أي «نلتقي».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson03.choose.001
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'संदेश تعني رسالة، مثل رسالة نصية لوضع خطة: प्रिया, चलो शनिवार को फ़िल्म देखते हैं?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson03.order.002
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: word_order
  frame:
    text: प्रिया, चलो शनिवार को {item} देखते हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया, चलो शनिवार को {item} देखते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: البدء بالاسم يعني مخاطبة الشخص مباشرة، وको بعد शनिवार تعني «يوم السبت».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit11.lesson03.translate.003
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'सुझाव هو اقتراح تقدّمه لشخص ما، أما विचार فهي فكرة أو رأي: अच्छा विचार है! تعني «فكرة جيدة!»'
    language_code: ar
    direction: rtl
