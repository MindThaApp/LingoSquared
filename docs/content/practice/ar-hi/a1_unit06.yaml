templates:
- content_key: practice.ar-hi.hi.a1.unit06.lesson01.choose.001
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: खाना اسم مذكر يعني الطعام أو الوجبة؛ أما चाय وكॉफ़ी فمؤنثان، بينما पानी وجूस مذكران.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson01.listen.002
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'للأسماء في الهندية جنس حتى في المشروبات: पानी وجूस مذكران، وचाय وकॉफ़ी مؤنثان.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson01.fill.003
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: fill_in_blank
  frame:
    text: आपको क्या {item}? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: لا تتغير चाहिए بحسب جنس المتكلم (بخلاف चाहता وचाहती)، ولا يأتي بعدها है.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson01.translate.004
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: ماذا تريد؟ (غير رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें क्या {item}?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: مع आप يصبح السؤال نفسه आपको क्या चाहिए؟؛ ولا تتغير سوى كلمة «أنت».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson01.translate.005
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: أريد شايًا، شكرًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} चाहिए, शुक्रिया।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'معنى मुझे ... चाहिए حرفيًا: «لي ... مطلوب»، لذا يأتي الشيء المطلوب بين الكلمتين.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson01.translate.006
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ليس في الهندية أداة تعريف ولا تنكير، لذا قد تعني खाना: الطعام أو وجبة أو الوجبة بحسب الموقف.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson02.choose.001
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: रोटी وदाल وसब्ज़ी أسماء مؤنثة، بينما चावल (الأرز) مذكر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson02.match.002
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'تضع الهندية وعاء القياس أولًا دون حرف الإضافة: एक गिलास पानी حرفيًا «كأس ماء واحد».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson02.order.003
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: word_order
  frame:
    text: मुझे एक प्लेट {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे एक प्लेट {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'لا توجد في الهندية كلمة تقابل الإضافة في «طبق أرز»: يأتي الوعاء قبل الطعام.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson02.order.004
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: word_order
  frame:
    text: यह {item} बहुत स्वादिष्ट है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बहुत स्वादिष्ट है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: لا تتغير स्वादिष्ट بين المذكر والمؤنث، بخلاف अच्छा وअच्छी.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson02.fill.005
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: fill_in_blank
  frame:
    text: नहीं, {item}, शुक्रिया। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'نهاية «नहीं, बस» ترفض بلطف المزيد من الطعام أو الشراب: لا، يكفي هذا.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson02.fill.006
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: fill_in_blank
  frame:
    text: मुझे कॉफ़ी चाहिए, {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कृपया هي كلمة «من فضلك» المهذبة، ويمكن أن تأتي في آخر الطلب.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson02.translate.007
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: translation
  frame:
    text: أريد كأس ماء.
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे एक {item} पानी चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تأتي كلمة القياس مثل गिलास مباشرة قبل الشيء المقيس، دون كلمة تقابل الإضافة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson02.translate.008
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: translation
  frame:
    text: هذا العدس لذيذ جدًا.
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बहुत स्वादिष्ट है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: दाल مؤنثة، لكن स्वादिष्ट تبقى كما هي مع المؤنث والمذكر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson03.choose.001
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تربط या بين خيارين كما في तुम्हें चाय चाहिए या कॉफ़ी؟، وتفيد खाते हैं بعد चलो الاقتراح.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson03.fill.002
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: fill_in_blank
  frame:
    text: तुम्हें चाय चाहिए {item} कॉफ़ी? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: في السؤال تعرض या الاختيار بين شيئين، مثل «أم» في العربية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit06.lesson03.translate.003
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: translation
  frame:
    text: هيا نأكل شيئًا!
    language_code: ar
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تُستخدم كلمة चलो مع فعل جمع بصيغة -ते مع हैं عادةً لتقديم اقتراح.
    language_code: ar
    direction: rtl
