templates:
- content_key: practice.ar-hi.hi.a1.unit05.lesson01.choose.001
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: माता-पिता (الوالدان) تجمع माता، وهي كلمة رسمية بمعنى «أم»، مع पिता (الأب)، تمامًا كما تجمع दादा-दादी الجدّ والجدّة معًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson02.listen.001
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تميّز الهندية بين أجداد الأب (दादा، दादी) وأجداد الأم (नाना، नानी).
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson03.choose.001
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تُستعمل बड़ा وछोटा مع الأسماء المذكّرة، وبड़ी وछोटी مع الأسماء المؤنثة، وكلتاهما تصف العمر أيضًا: أكبر أو أصغر.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson02.match.002
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'كلمات العائلة في الهندية مذكّرة ومؤنثة في أزواج: भाई وبहन، दादा وदादी، नाना وनानी.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson01.order.002
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरा {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: भाई مذكّر، لذلك يأتي معه मेरा؛ أما الكلمة المؤنثة مثل बहन فيأتي معها मेरी.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson01.order.003
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहन مؤنثة، لذلك يكون ضمير الملكية मेरी وليس मेरा.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson01.order.004
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरे {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: احترامًا لمن هو أكبر سنًا، يصبح मेरा هو मेरे ويصبح है هو हैं، حتى لو كان المقصود شخصًا واحدًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson02.order.003
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: word_order
  frame:
    text: मेरे माता-पिता {city} में रहते हैं।
    language_code: hi
    direction: ltr
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تعني में بعد اسم المدينة «في»، والفعل مع الفاعل الجمع المحترَم هو रहते हैं.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson03.order.002
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: word_order
  frame:
    text: मेरा एक {item} भाई भी है।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा एक {item} भाई भी है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تتطابق बड़ा وछोटा مع الاسم المذكّر भाई، وتعني एक هنا «أحد/أخ» بمعنى التنكير لا العدد «واحد».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson01.fill.005
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: fill_in_blank
  frame:
    text: तुम्हारा {item} कहाँ रहता है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: يُعامَل परिवार على أنه مفرد ومذكّر، لذلك يكون الفعل रहता है.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson02.fill.004
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: fill_in_blank
  frame:
    text: मेरे दादा-दादी दिल्ली में {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مع الأجداد، وهم محترَمون ويُعامَلون معاملة الجمع، يكون الفعل रहते हैं وليس रहता है.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson03.fill.003
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: fill_in_blank
  frame:
    text: मेरी भी एक {item} बहन है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: छोटी هي صيغة المؤنث لأن बहन مؤنثة؛ ومع الأخ تكون छोटा.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson02.translate.005
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: translation
  frame:
    text: يعيش والداي في {city}.
    language_code: ar
    direction: rtl
    slot_rendering:
      city: english_gloss
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: الوالدان من الكبار الذين يُحتَرمون، لذلك يُستعمل मेरे والفعل الجمع रहते हैं.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson01.translate.006
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: أين تعيش عائلتك؟ (بصيغة غير رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा {item} कहाँ रहता है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'مع آप الرسمية تقول: आपका परिवार कहाँ रहता है?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson01.translate.007
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: هذا والدي. (بصيغة احترام)
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'يظهر الاحترام مرتين: मेरे بدل मेरा وहैं بدل है.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit05.lesson01.translate.008
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: في الهندية كلمتان للجدّ وكلمتان للجدّة، بحسب كونهما من جهة الأب أو من جهة الأم.
    language_code: ar
    direction: rtl
