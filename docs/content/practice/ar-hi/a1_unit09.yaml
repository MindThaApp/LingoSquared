templates:
- content_key: practice.ar-hi.hi.a1.unit09.lesson01.choose.001
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'جاؤ ومُڑو وگنو أفعال أمر غير رسمية: تنتهي بـ -ो وتُستعمل مع तुम.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson01.listen.002
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बाएँ و दाएँ ظرفان للاتجاه، لذلك لا يتغيران بحسب الجنس أو العدد.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson01.match.003
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'تُعطى الاتجاهات في الهندية بظرف ثم فعل: सीधे जाओ تعني حرفيًا «اذهب مباشرة»، و बाएँ मुड़ो «انعطف يسارًا».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson01.order.004
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: word_order
  frame:
    text: यहाँ से {item} जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'من بعد यहाँ تعني «من»: यहाँ से أي «من هنا».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson01.order.005
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: word_order
  frame:
    text: फिर {item} मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर {item} मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'تضع الهندية الاتجاه قبل الفعل: बाएँ मुड़ो تعني حرفيًا «يسارًا انعطف».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson01.fill.006
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: fill_in_blank
  frame:
    text: यहाँ से सीधे {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जाओ هي صيغة الأمر غير الرسمية من जाना؛ أما في الكلام الرسمي فتُستعمل نهاية مختلفة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson01.translate.007
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: translation
  frame:
    text: اذهب مباشرة من هنا. (بصيغة غير رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: जाओ أمر بمستوى तुम؛ ويأتي الفعل في آخر الجملة بعد الاتجاه.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson01.translate.008
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: translation
  frame:
    text: ثم انعطف يمينًا. (بصيغة غير رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर {item} मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुड़ो هي صيغة الأمر غير الرسمية من मुड़ना أي «انعطف».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson02.choose.001
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تعني तक «حتى» أو «إلى»، كما في बैंक तक सीधे जाओ أي «اذهب مباشرة حتى البنك».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson02.order.002
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: word_order
  frame:
    text: बैंक {item} सीधे जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} सीधे जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تحدد तक نهاية الحركة، وتأتي مباشرة بعد المكان.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson02.order.003
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: word_order
  frame:
    text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تدل पहले و फिर على «أولًا» و«ثم»، فيتطابق ترتيب الخطوات مع ترتيب الكلمات.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson02.fill.004
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: fill_in_blank
  frame:
    text: स्कूल कैसे {item}? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जाऊँ صيغة «هل أذهب؟» من जाना، لذلك فإن स्कूल कैसे जाऊँ? تعني «كيف أذهب إلى المدرسة؟».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson02.translate.005
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: translation
  frame:
    text: كيف أصل إلى البنك؟
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक कैसे {item}?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'जाऊँ هي الصيغة المستعملة عند طلب النصيحة بشأن فعل يخصك: كيف أذهب؟'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson02.translate.006
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: translation
  frame:
    text: من هنا، اذهب أولًا مباشرة، ثم انعطف يسارًا. (بصيغة غير رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: पहले تعني «أولًا» و फिर تعني «ثم»؛ وكلا الأمرين ينتهي بـ -ो لأنهما مع तुम.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson03.choose.001
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تعني पर بعد المكان «عند» أو «على»: नुक्कड़ पर أي «عند الزاوية».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson03.order.002
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: word_order
  frame:
    text: फिर बैंक के {item} पर बाएँ मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर बैंक के {item} पर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: يربط के كلمة बैंक بالزاوية، ثم تحدد पर موضع الانعطاف عند تلك الزاوية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit09.lesson03.translate.003
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: translation
  frame:
    text: ثم انعطف يسارًا عند ناصية البنك.
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर बैंक के {item} पर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: في الهندية يُذكر المكان المرجعي أولًا (बैंक के नुक्कड़ पर)، ثم الاتجاه، ثم الفعل.
    language_code: ar
    direction: rtl
