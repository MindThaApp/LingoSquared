templates:
- content_key: practice.ar-hi.hi.a1.unit16.lesson01.choose.001
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दर्द اسم مذكر بمعنى «ألم»، وجملة मुझे सिर दर्द है هي الطريقة المعتادة لقول «عندي صداع».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson01.listen.002
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تقول الهندية حرفيًا «لي حمّى هي»: मुझे बुखार है، باستخدام है وليس فعلًا مثل «يملك».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson01.order.003
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: word_order
  frame:
    text: मुझे {item} दर्द है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} दर्द है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تقول الهندية «ألم الرأس» للصداع، مع تقديم सिर على दर्द.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson01.order.004
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: word_order
  frame:
    text: मुझे सिर {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे सिर {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: يأتي दर्द بعد सिर وقبل है، كما في सिर दर्द है.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson01.fill.005
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: fill_in_blank
  frame:
    text: मुझे {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تُستخدم مع الأمراض صيغة मुझे ... है: حرفيًا «لي حمّى هي».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson01.fill.006
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: fill_in_blank
  frame:
    text: मुझे सिर {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: सिर दर्द كلمة مركّبة من «رأس» و«ألم».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson01.translate.007
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: translation
  frame:
    text: عندي حمى.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ليس في الهندية فعل بمعنى «يملك» هنا؛ يكفي मुझे وهو है.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson01.translate.008
  lesson_content_key: hi.a1.unit16.lesson01.sir_dard_bukhar
  type: translation
  frame:
    text: 'عندي صداع. (حرفيًا: لي ألم رأس موجود)'
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे सिर {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'لا تستخدم الهندية أداة تنكير هنا: सिर दर्द كلمة مركّبة تُستعمل بدونها.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson02.choose.001
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: आराम करो هو أمر غير رسمي بمعنى «استرح!»، ويتكوّن من الاسم आराम والفعل करो.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson02.order.002
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
    text: मुझे {item} के पास जाना है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} के पास जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: عندما تأتي के पास بعد شخص فهي تعني «إلى ذلك الشخص»، فـ डॉक्टर के पास जाना تعني «الذهاب إلى الطبيب».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson02.order.003
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
    text: तुम्हें {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: يأتي चाहिए بعد الشيء المطلوب، ولا يأتي بعده है عادةً.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson02.order.004
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: word_order
  frame:
    text: आराम {item} और डॉक्टर के पास जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आराम {item} और डॉक्टर के पास जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ينتهي الأمران بـ -ो لأنهما موجّهان إلى شخص تخاطبه بـ तुम.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson02.fill.005
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: fill_in_blank
  frame:
    text: मुझे {item} चाहिए। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: يأتي الشيء المطلوب بين मुझे وchahiye، أي بين मुझे و चाहिए.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson02.fill.006
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: fill_in_blank
  frame:
    text: आराम {item}! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: करो هو صيغة الأمر غير الرسمية من करना، وتعني आराम करो «استرح».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson02.translate.007
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: أحتاج إلى دواء.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تُستخدم मुझे ... चाहिए للتعبير عن الحاجة وعن الرغبة، أيًّا كان المتكلم.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson02.translate.008
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: عليّ أن أذهب إلى الطبيب.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} के पास जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: يأتي के पास بعد كلمة الطبيب، ويعني «إلى مكان الطبيب».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson02.translate.009
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: استرح! (بصيغة غير رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आराम {item}!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: ينتهي الأمر غير الرسمي بـ -ो، وهو الصوت المستخدم مع तुम.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit16.lesson02.translate.010
  lesson_content_key: hi.a1.unit16.lesson02.doctor_dawa
  type: translation
  frame:
    text: أنت تحتاج إلى الراحة. (بصيغة غير رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تؤدي तुम्हें دور मुझे مع الشخص الذي تخاطبه بـ तुम.
    language_code: ar
    direction: rtl
