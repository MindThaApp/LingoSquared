    text: कमरा غرفة واحدة، وكمरे أكثر من غرفة؛ أما बाथरूम وبेडरूम فكلمتان مستعارتان من الإنجليزية، بينما रसोई هي الكلمة الهندية للمطبخ.
    language_code: ar
    direction: rtl
