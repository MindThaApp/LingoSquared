templates:
- content_key: practice.ar-hi.hi.a1.unit07.lesson01.choose.001
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تتكوّن كلمة दुकानदार من दुकान (متجر) مع -दार، وهي لاحقة شائعة تدل على من يملك شيئًا أو يتولى أمره.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson01.listen.002
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: كلمتا कमीज़ و टोपी مؤنثتان، أما बैग فمذكّرة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson01.order.003
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: word_order
  frame:
    text: मुझे यह {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'تأتي यह (هذا) مباشرة قبل الاسم الذي تشير إليه: मुझे यह कमीज़ चाहिए.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson01.fill.004
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: fill_in_blank
  frame:
    text: जी नहीं, {item} यह। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जी नहीं تعني «لا» بأدب، وكلمة सिर्फ़ تحصر الطلب في هذا وحده.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson01.match.005
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: لا توجد في الهندية أداة تعريف أو تنكير مع كلمات المتجر، لذا قد تعني बाज़ार «سوقًا» أو «السوق».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson01.translate.006
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: أريد هذا القميص.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تبقى मुझे ... चाहिए كما هي مع كل المتحدثين، وتشير यह إلى الاسم الذي يليها مباشرة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson01.translate.007
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: في المتجر الهندي البائع هو दुकानदार والمكان هو दुकान؛ أما السوق نفسه فهو बाज़ार.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson02.choose.001
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تتغير सस्ता و महंगा مثل मेरा و मेरी: الأسماء المؤنثة تأخذ सस्ती و महंगी.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson02.order.002
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: word_order
  frame:
    text: यह टोपी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह टोपी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'टोपी مؤنثة، لذا تنتهي الصفة بـ -ी: सस्ती أو महंगी.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson02.fill.003
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह कमीज़ बहुत {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कमीज़ مؤنثة، لذا الصفة هي महंगी وليست महंगा.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson02.fill.004
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह बैग {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बैग مذكّرة، لذا الصفة هي सस्ता وليست सस्ती.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson02.translate.005
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 'بكم هذا القميص؟ (حرفيًا: هذا القميص هو من كم؟)'
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: यह कमीज़ कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'تتفق का أو की في سؤال السعر مع الشيء المسعَّر لا مع कितने: कमीज़ مؤنثة، لذا تُستعمل की.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson02.translate.006
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 'بكم هذه الحقيبة؟ (حرفيًا: هذه الحقيبة هي من كم؟)'
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह बैग कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'تتفق का أو की في سؤال السعر مع الشيء المسعَّر: बैग مذكّر، لذا تُستعمل का.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson03.listen.001
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تفيد खरीदते हैं بعد चलो الاقتراح، أما खरीदना فهي صيغة المصدر في القاموس بمعنى «يشتري».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson03.order.002
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: word_order
  frame:
    text: ठीक है! {item} या टोपी?
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: ठीक है! {item} या टोपी?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تربط या بين الخيارين، ويُعبَّر عن السؤال بارتفاع الصوت وعلامة الاستفهام فقط.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson03.fill.003
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: चलो, कुछ {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खरीदते مع हैं بعد चलो تعني «لنشترِ»؛ وصيغة -ते لا تتغير بحسب جنس المجموعة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson03.fill.004
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: यह टोपी पाँच सौ रुपये {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: في यह टोपी पाँच सौ रुपये की है تتفق की مع الاسم المؤنث टोपी.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit07.lesson03.translate.005
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: translation
  frame:
    text: لنشترِ شيئًا!
    language_code: ar
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تُستخدم كلمة चलो مع فعل جمع بصيغة -ते مع हैं عادةً لتقديم اقتراح.
    language_code: ar
    direction: rtl
