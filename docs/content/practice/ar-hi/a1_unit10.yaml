templates:
- content_key: practice.ar-hi.hi.a1.unit10.lesson01.choose.001
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تنتهي الأفعال المعتادة بـ -ता للرجل وبـ -ती للمرأة: मैं उठता हूँ، मैं उठती हूँ.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson01.listen.002
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: وह تعني «هو» أو «هي»، وتحدد نهاية الفعل أيهما المقصود؛ أما वे فتعني «هم».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson01.order.003
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ सात बजे {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ सात बजे {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'تتبع نهاية الفعل جنس المتكلم: उठता للرجل وउठती للمرأة، ويأتي हूँ مع मैं.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson01.order.004
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ काम पर {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: काम पर जाना، أي الذهاب إلى العمل، تحتاج إلى पर، لكن نهاية الفعل تظل تتبع جنس المتكلم.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson01.fill.005
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: fill_in_blank
  frame:
    text: मैं रोज़ नाश्ता {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'كثير من الأفعال الهندية تتكوّن من اسم + करना: नाश्ता करना تعني تناول الإفطار.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson01.translate.006
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: أذهب إلى العمل كل يوم. (تقولها امرأة)
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'تستخدم المرأة النهاية -ती: जाती हूँ؛ أما الرجل فيقول जाता हूँ.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson01.translate.007
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: أتناول الإفطار كل يوم. (يقولها رجل)
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ नाश्ता {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تقول الهندية नाश्ता करना، أي حرفيًا «يفعل الفطور»، للتعبير عن تناول الإفطار.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson02.choose.001
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'مع तुम ينتهي الفعل بـ -ते للرجل وبـ -ती للمرأة، ويأتي معه हो: तुम उठते हो، तुम उठती हो.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson02.match.002
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: لكل فعل معتاد صيغة مذكرة بـ -ता وصيغة مؤنثة بـ -ती، وتتبع الصيغة جنس المتكلم.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson02.order.003
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: word_order
  frame:
    text: तुम कब {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: مع तुम يكون الفعل -ते हो عند سؤال رجل، وتتبع النهاية الشخص المخاطَب.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson02.fill.004
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: fill_in_blank
  frame:
    text: मैं रात को ग्यारह बजे {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: المتكلمة هنا امرأة، لذا يأخذ الفعل -ती؛ فالنهاية تتبع من ينام.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson02.translate.005
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: متى تنام؟ (بصيغة غير رسمية، تسأل رجلًا)
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'مع तुम تتبع النهاية الشخص المسؤول لا السائل: सोते للرجل وसोती للمرأة.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson02.translate.006
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: متى تستيقظين؟ (بصيغة غير رسمية، تسأل امرأة)
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'عند سؤال امرأة ينتهي الفعل بـ -ती: तुम उठती हो.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson03.choose.001
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: आते في तुम कब वापस आते हो؟ هي صيغة -ते التي تُستخدم مع तुम عند سؤال رجل.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson03.fill.002
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: fill_in_blank
  frame:
    text: मैं शाम को छह बजे वापस {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: आता صيغة المذكر، فالمتكلم رجل؛ أما المرأة فتقول आती.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson03.translate.003
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: أعود في المساء. (يقولها رجل)
    language_code: ar
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं शाम को वापस {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: को بعد शाम تعني «في المساء»، وवापस आना تعني العودة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson03.translate.004
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: أتناول العشاء. (تقولها امرأة)
    language_code: ar
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रात का खाना {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रात का खाना، حرفيًا «وجبة الليل»، تعني العشاء؛ ونهاية -ती تدل على أن المتكلمة امرأة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit10.lesson03.translate.005
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'वापस تعني «عائدًا» وتأتي مع أفعال مثل आना: वापस आता हूँ، أي أعود.'
    language_code: ar
    direction: rtl
