templates:
- content_key: practice.ar-hi.hi.a1.unit01.lesson01.choose.001
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'في الهندية كلمتان لمخاطبة الشخص: आप رسمية ومحترمة، أما तुम فغير رسمية وتُستخدم مع الأصدقاء ومن هم في مثل سنك أو أصغر.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson01.fill.002
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'يتغير فعل الكينونة بحسب الفاعل: हूँ مع मैं، وho مع तुम، وहैं مع आप.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson01.order.003
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: word_order
  frame:
    text: आप {item} हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'تتطابق أداة الاستفهام مع الشخص المسؤول: कैसे للرجل وकैसी للمرأة، بينما يأخذ आप دائمًا हैं.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson01.translate.004
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: كيف حالك؟ (غير رسمي، لرجل)
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'مع तुम يكون الفعل हो، وعند سؤال امرأة تتغير कैसे إلى कैसी: तुम कैसी हो?'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson01.translate.005
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: كيف حالك؟ (بصيغة رسمية، لمخاطبة امرأة)
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: الضمير الرسمي आप يأخذ الفعل हैं الذي يبدو جمعًا حتى مع شخص واحد، وكلمة कैसी هي صيغة المؤنث من «كيف».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson02.listen.001
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अलविदा كلمة وداع؛ وفي الكلام اليومي تُستعمل नमस्ते للتحية وللوداع معًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson02.order.002
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: word_order
  frame:
    text: आपका {item} अच्छा रहे।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} अच्छा रहे।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: الفعل रहे يجعل الجملة دعاءً أو أمنية (أن يبقى بخير)، وكلمة आपका تدل على أنها تُقال مع आप الرسمي؛ ومع तुम تصبح तुम्हारा.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson02.match.003
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'ليس في الهندية أداة تعريف ولا تنكير: فكلمة नाम قد تعني «اسم» أو «الاسم» بحسب الجملة.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson03.choose.001
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'يحافظ السؤال في الهندية على ترتيب الجملة الخبرية: تحل أداة الاستفهام कहाँ محل الجواب (आप कहाँ से हैं? وَ मैं भारत से हूँ).'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson03.order.002
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मेरा नाम {name} है।
    language_code: hi
    direction: ltr
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: يأتي الفعل في الهندية في آخر الجملة، فعبارة मेरा नाम ... है تعني حرفيًا «اسمي ... هو».
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson03.order.003
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मैं {place} से हूँ।
    language_code: hi
    direction: ltr
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: تأتي से بعد اسم المكان وتعني «من»؛ وهي حرف جر متأخر (postposition) يلي الاسم لا يسبقه.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson03.fill.004
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: fill_in_blank
  frame:
    text: आपसे मिलकर {item} हुई। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: هذه عبارة «تشرفنا» الرسمية، وحرفيًا «حدثت السعادة بلقائك»؛ أما الصيغة غير الرسمية فهي तुमसे मिलकर अच्छा लगा.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson03.translate.005
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: اسمي {name}.
    language_code: ar
    direction: rtl
    slot_rendering:
      name: english_gloss
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: كلمة नाम اسم مذكر، لذلك يقول الجميع، رجالًا ونساءً، मेरा नाम.
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson03.translate.006
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: أنا من {place}.
    language_code: ar
    direction: rtl
    slot_rendering:
      place: english_gloss
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'تقول المرأة أيضًا मैं भारत से हूँ: فالفعل हूँ لا يتغير بحسب جنس المتكلم.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson03.translate.007
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: من أين أنت؟ (بصيغة غير رسمية)
    language_code: ar
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} से हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'لطرح السؤال نفسه بصيغة رسمية استعمل आप مع हैं: आप कहाँ से हैं؟'
    language_code: ar
    direction: rtl
- content_key: practice.ar-hi.hi.a1.unit01.lesson03.translate.008
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'الأسماء في الهندية مذكرة أو مؤنثة: दिन وनाम وयोग مذكرة، وखुशी مؤنثة.'
    language_code: ar
    direction: rtl
