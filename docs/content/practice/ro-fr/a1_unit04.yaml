  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Combien ça coûte? întreabă cât costă ceva; se potrivește pentru orice produs luat separat.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit04.lesson02.fill.006
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Je {item} un kilo de tomates, s'il vous plaît. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Je voudrais este mai politicos decât je veux, care ar suna prea direct când comanzi.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit04.lesson02.translate.007
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
