    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cher se acordă cu substantivul său: cher (masculin singular), chers (masculin plural).'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit04.lesson02.translate.008
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: Aș dori un kilogram de {item}, vă rog. (formal)
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: S'il vous plaît este „vă rog” politicos; cu un prieten poți spune s'il te plaît.
    language_code: ro
    direction: ltr
