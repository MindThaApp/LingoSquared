templates:
- content_key: practice.ro-fr.fr.a1.unit01.lesson01.choose.001
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Franceza are două cuvinte pentru „tu/dumneavoastră”: tu cu prietenii, familia și persoanele de aceeași vârstă, și vous cu necunoscuții, în contexte formale și pentru mai multe persoane.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson01.listen.002
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bonjour merge în orice moment al zilei cu oricine; salut se folosește doar cu persoanele cu care ai spune tu.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson01.match.003
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Tu și vous înseamnă amândouă „tu/dumneavoastră”: tu este pentru un prieten, o rudă sau o persoană de aceeași vârstă; vous este pentru un necunoscut, într-un context formal sau pentru mai multe persoane.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson01.order.004
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: word_order
  frame:
    text: Comment {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Amândouă sunt moduri de a întreba „Ce mai faci?”: allez-vous este formal, vas-tu este informal.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson01.translate.005
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bonjour, merci, oui și non nu își schimbă forma, dar adjectivele da: fatigué pentru un bărbat, fatiguée pentru o femeie.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson01.translate.006
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: Ce mai faceți? (formal)
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Allez-vous este întrebarea formală; cu un prieten ai întreba comment vas-tu ?
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson01.translate.007
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: Ce mai faci? (informal)
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Vas-tu este întrebarea informală, pentru prieteni și familie; cu un necunoscut ai întreba comment allez-vous ?
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson02.choose.001
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Enchanté este spus de un bărbat și enchantée de o femeie; moi c’est + nume este un mod informal de a te prezenta.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson02.order.002
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: word_order
  frame:
    text: Bonjour, je m’appelle {name}.
    language_code: fr
    direction: ltr
  slots:
    name: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Bonjour, je m’appelle {name}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m’appelle înseamnă literal „mă numesc”; este modul obișnuit de a-ți spune numele.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson02.translate.003
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: Numele meu este {name}.
    language_code: ro
    direction: ltr
    slot_rendering:
      name: token
  slots:
    name: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je m’appelle {name}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m’appelle se folosește pentru tine; ca să întrebi pe altcineva spui tu t’appelles comment ? sau comment vous appelez-vous ?
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson03.choose.001
  lesson_content_key: fr.a1.unit01.lesson03.reading_aloud
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je se scurtează în j’ înaintea unei vocale (j’habite), iar êtes este forma de vous a verbului être, „a fi”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson04.choose.001
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La Ça va ? se răspunde cu très bien sau pas mal; un peu atenuează o stare, ca în un peu fatigué.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson04.match.002
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Fatigué este masculin și fatiguée este feminin: adjectivul se acordă cu persoana pe care o descrie.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson04.fill.003
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: fill_in_blank
  frame:
    text: Je suis un peu {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Un bărbat spune fatigué și o femeie spune fatiguée; cele două se scriu diferit, dar se pronunță la fel.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson05.listen.001
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Un quartier este un cartier întreg, iar o rue este o singură stradă; un atelier este un atelier de lucru.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson05.order.002
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: word_order
  frame:
    text: Je suis de {place}.
    language_code: fr
    direction: ltr
  slots:
    place: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis de {place}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Être de + loc spune de unde ești; habiter à + loc spune unde locuiești.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson05.order.003
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: word_order
  frame:
    text: J’habite à {place}.
    language_code: fr
    direction: ltr
  slots:
    place: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite à {place}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Folosește à înaintea numelui unui oraș: j’habite à Montreuil, j’habite à Saint-Ouen.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit01.lesson05.fill.004
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: fill_in_blank
  frame:
    text: Vous {item} dans le quartier ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cu vous verbul se termină în -ez: vous habitez; cu tu este tu habites.'
    language_code: ro
    direction: ltr
