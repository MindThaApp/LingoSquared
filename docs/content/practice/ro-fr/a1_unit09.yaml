    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Droit înseamnă „drept” în tout droit, iar gauche și droite sunt stânga și dreapta.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit09.lesson01.order.004
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: word_order
  frame:
    text: Tournez à {item} après la boulangerie.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tournez à {item} après la boulangerie.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Pentru a vira la stânga sau la dreapta se folosește à, nu en: à gauche, à droite.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit09.lesson01.fill.005
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: fill_in_blank
  frame:
    text: Tournez à gauche au {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Au este forma contrasă din à și le, deci au carrefour înseamnă „la intersecție”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit09.lesson01.translate.006
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: translation
  frame:
    text: Magazinul este la colțul străzii, în dreapta.
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La boutique est au {item} de la rue, à droite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Au coin de la rue înseamnă „la colțul străzii”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit09.lesson02.choose.001
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tournez și continuez sunt imperative cu vous, folosite cu necunoscuți sau cu mai multe persoane.
    language_code: ro
    direction: ltr
