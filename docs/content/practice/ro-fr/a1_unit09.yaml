      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pour aller à este modul obișnuit de a întreba cum ajungi într-un loc; s'il vous plaît este formula de politețe.
    language_code: ro
    direction: ltr
