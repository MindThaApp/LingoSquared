templates:
- content_key: practice.ro-fr.fr.a1.unit09.lesson01.choose.001
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: À gauche și à droite înseamnă „la stânga” și „la dreapta”; substantivele gauche și droite sunt feminine.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit09.lesson01.listen.002
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
