    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit08.lesson03.order.004
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: word_order
  frame:
    text: Parfait, j'ai le temps de {item} un dessert pour l'occasion.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, j'ai le temps de {item} un dessert pour l'occasion.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'După avoir le temps de, verbul rămâne la infinitiv: préparer.'
    language_code: ro
    direction: ltr
