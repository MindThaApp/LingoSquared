    frame:
      text: La pharmacie ouvre {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Demain înseamnă „mâine” și se pune după verb, fără prepoziție.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit08.lesson01.fill.005
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
