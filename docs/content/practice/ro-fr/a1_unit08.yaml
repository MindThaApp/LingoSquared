    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit08.lesson01.translate.007
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: translation
  frame:
    text: Atelierul are loc sâmbăta.
    language_code: ro
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier a lieu le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: L'atelier a lieu le samedi înseamnă că atelierul se ține sâmbăta.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit08.lesson02.choose.001
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Premier este ordinalul doar pentru prima zi; celelalte date folosesc numere cardinale: le premier mars, le quinze mars.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit08.lesson02.listen.002
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mars este o lună; lunile franceze, ca și zilele, nu se scriu cu majusculă.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit08.lesson02.order.003
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: word_order
