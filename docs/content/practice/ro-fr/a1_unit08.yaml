    text: L'atelier se {item} le vingt-deux mars. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se termine este forma reflexivă care înseamnă „se termină” sau „se încheie”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit08.lesson02.translate.005
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: translation
  frame:
    text: Care este data de astăzi?
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Quelle est la {item} aujourd'hui ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quelle est la date aujourd'hui este modul standard de a întreba data calendaristică.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit08.lesson02.translate.006
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: translation
  frame:
    text: Este cincisprezece martie. (începe cu c'est)
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est le quinze {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Franceza folosește numere obișnuite pentru date, deci „cincisprezece” este pur și simplu quinze.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit08.lesson03.choose.001
