templates:
- content_key: practice.ro-fr.fr.a1.unit08.lesson01.choose.001
  lesson_content_key: fr.a1.unit08.lesson01.jours_de_la_semaine
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lundi, samedi și dimanche nu se scriu cu majusculă în franceză, iar le înaintea unei zile înseamnă în fiecare săptămână: le samedi.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit08.lesson01.listen.002
