templates:
- content_key: practice.ro-fr.fr.a1.unit14.lesson01.choose.001
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Meilleur este comparativul neregulat al lui bon: se spune meilleur, niciodată plus bon.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson01.listen.002
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Difficile și facile au aceeași formă la masculin și la feminin.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson01.order.004
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: word_order
  frame:
    text: Moi, je trouve {item} aussi bon.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Moi, je trouve {item} aussi bon.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: L'autre înseamnă „celălalt/cealaltă”; aussi bon înseamnă „la fel de bun”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson01.fill.006
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: fill_in_blank
  frame:
    text: Cette recette est moins {item} que l'autre. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Difficile nu se schimbă la feminin, deci se potrivește cu recette.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson01.fill.007
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: fill_in_blank
  frame:
    text: Ce gâteau est {item} que le premier. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Meilleur que înseamnă „mai bun decât”; înlocuiește plus bon.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson01.translate.008
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: translation
  frame:
    text: Această brânză este mai scumpă decât cealaltă.
    language_code: ro
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce fromage est plus cher que {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Que introduce al doilea termen al comparației; l'autre ține locul celeilalte brânze.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson02.choose.001
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Irrégulier înseamnă că forma nu urmează tiparul obișnuit, ca în cazul lui meilleur.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson02.listen.002
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Adjectif și irrégulier seamănă mult cu cuvintele românești „adjectiv” și „neregulat”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson02.order.003
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: word_order
  frame:
    text: Comparons les prix avant {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Comparons les prix avant {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avant de urmat de un verb la infinitiv înseamnă „înainte de a face ceva”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson02.fill.004
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: fill_in_blank
  frame:
    text: La quiche est moins {item} que la tarte. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Chère primește -e de feminin pentru a se acorda cu quiche; cu un substantiv masculin se folosește cher: le fromage est moins cher.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson02.translate.005
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: translation
  frame:
    text: Este cea mai ieftină rețetă.
    language_code: ro
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est la recette la moins {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: La moins chère se formează din la moins urmat de un adjectiv la feminin.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson03.choose.001
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Celui-ci înseamnă „acesta” și celui-là înseamnă „acela”, ambele la masculin.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson03.listen.002
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Celui-ci și celui-là diferă doar prin -ci și -là, adică „aici” și „acolo”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson03.order.004
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: word_order
  frame:
    text: Lequel on {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Lequel on {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Lequel on prend? este informal: lequel întreabă „care” și on înseamnă „noi”.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson03.fill.006
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: fill_in_blank
  frame:
    text: Il y a deux {item} de fromage. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sortes este la plural după deux și este urmat de de.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson03.fill.007
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: fill_in_blank
  frame:
    text: Il nous {item} plus d'argent pour le dessert. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il nous reste înseamnă „ne-a rămas”; reste este impersonal aici.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson03.translate.008
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: translation
  frame:
    text: Deci îl luăm pe acela; este cea mai bună opțiune pentru atelier. (folosește on)
    language_code: ro
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Alors on prend {item}, c'est la meilleure option pour l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Celui-là înseamnă „acela”; meilleure este la feminin pentru că option este feminin.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit14.lesson03.translate.009
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: translation
  frame:
    text: Este adevărat.
    language_code: ro
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est vrai este o formulă frecventă pentru a fi de acord.
    language_code: ro
    direction: ltr
