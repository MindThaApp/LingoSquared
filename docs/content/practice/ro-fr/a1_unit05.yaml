templates:
- content_key: practice.ro-fr.fr.a1.unit05.lesson01.choose.001
  lesson_content_key: fr.a1.unit05.lesson01.a_table
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le poulet, le poisson, le riz și le vin sunt de genul masculin, iar la salade este de genul feminin; în l'eau, articolul își pierde vocala înaintea lui eau.
    language_code: ro
    direction: ltr
