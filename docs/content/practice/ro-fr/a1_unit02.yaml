  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Multe dintre aceste cuvinte se folosesc cu de după o cantitate, ca în tasses de farine.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit02.lesson06.fill.001
  lesson_content_key: fr.a1.unit02.lesson06.recipe_count_dialogue
