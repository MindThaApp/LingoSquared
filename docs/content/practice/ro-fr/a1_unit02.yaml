    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Cantitățile în franceză se leagă cu de: deux tasses de farine, une demi-tasse de sucre.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit02.lesson05.order.003
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: word_order
  frame:
    text: J'ai besoin de {n} œufs.
    language_code: fr
    direction: ltr
  slots:
    n: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai besoin de {n} œufs.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avoir besoin de + substantiv înseamnă „a avea nevoie de”; numărul stă între de și substantiv.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit02.lesson05.translate.004
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: translation
