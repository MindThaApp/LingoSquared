    kind: slot_text
    slot: item
  feedback_frame:
    text: Occupé este la masculin; o femeie ar scrie occupée.
    language_code: ro
    direction: ltr
- content_key: practice.ro-fr.fr.a1.unit11.lesson01.fill.007
