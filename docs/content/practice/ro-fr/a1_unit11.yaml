  answer_derivation:
    kind: render_frame
    frame:
      text: Tu es {item} samedi ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu es libre ? este o întrebare prin care un prieten se interesează de disponibilitatea ta; samedi nu cere nicio prepoziție.
    language_code: ro
    direction: ltr
