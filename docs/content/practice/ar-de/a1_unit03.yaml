  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'في العددين ستة عشر وسبعة عشر تسقط بعض الحروف من العددين الأساسيين: sechzehn وsiebzehn.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit03.lesson03.choose.001
  lesson_content_key: de.a1.unit03.lesson03.die_zehnerzahlen
