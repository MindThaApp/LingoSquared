templates:
- content_key: practice.ar-de.de.a1.unit03.lesson01.choose.001
  lesson_content_key: de.a1.unit03.lesson01.null_bis_zehn
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تصبح Eins هي ein قبل الاسم (ein Jahr)، أمّا صيغة العدّ فهي eins.
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit03.lesson02.listen.001
  lesson_content_key: de.a1.unit03.lesson02.elf_bis_zwanzig
