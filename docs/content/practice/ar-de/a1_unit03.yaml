    slot: item
  feedback_frame:
    text: 'في الأعداد التي تزيد على العشرين تأتي الآحاد أولًا: einundzwanzig تعني حرفيًّا «واحد وعشرون».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit03.lesson05.listen.001
  lesson_content_key: de.a1.unit03.lesson05.im_gespraech_ueber_das_alter
  type: listen_select
