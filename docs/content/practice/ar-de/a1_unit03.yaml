      direction: ltr
  feedback_frame:
    text: 'يعبّر الألمانية عن العمر بالفعل sein: Ich bin zwanzig Jahre alt، أي حرفيًّا «أنا عشرون سنةً من العمر».'
    language_code: ar
    direction: rtl
