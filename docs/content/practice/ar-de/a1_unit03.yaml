  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Wenn ich fragen darf عبارة لطيفة تخفّف حدّة السؤال، ومعناها حرفيًّا «إن سمحتَ لي بالسؤال».
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit03.lesson04.order.001
  lesson_content_key: de.a1.unit03.lesson04.wie_alt_sind_sie
