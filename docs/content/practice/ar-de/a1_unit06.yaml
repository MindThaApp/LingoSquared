    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit06.lesson03.translate.014
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: لدي أختان.
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich habe zwei {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 'جمع Schwester بإضافة -n: zwei Schwestern.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit06.lesson02.translate.015
  lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
  type: translation
  frame:
    text: من هو والدكم؟ (رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Wer ist {item} Vater?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Vater مذكر، لذلك تكون صيغة «والدكم» الرسمية Ihr لا Ihre.
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit06.lesson03.translate.016
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: هذه أمي.
    language_code: ar
    direction: rtl
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Das ist {item} Mutter.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Mutter مؤنثة، لذلك تصبح «my» هنا meine.
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit06.lesson04.translate.017
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: translation
  frame:
    text: هل لديكم إخوة؟ (رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Haben Sie {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Brüder جمع Bruder، مع تغيير حرف العلة بالأوملاوت.
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit06.lesson03.translate.018
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: لا، ليس لدي إخوة ولا أخوات.
    language_code: ar
    direction: rtl
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Nein, ich habe {item} Geschwister.
      language_code: de
      direction: ltr
  feedback_frame:
    text: تُستعمل Keine قبل الأسماء الجمع والأسماء المؤنثة للدلالة على النفي، أي «لا / ليس أي».
    language_code: ar
    direction: rtl
