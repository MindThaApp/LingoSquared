      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Familie مؤنثة، لذلك تكون صيغة «عائلتكم» الرسمية Ihre، بحرف أول كبير.
    language_code: ar
    direction: rtl
