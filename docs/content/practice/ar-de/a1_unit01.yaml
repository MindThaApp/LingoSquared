    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gern geschehen هو الرد المعتاد على danke، وتعني حرفيًا شيئًا مثل «حدث بكل سرور».
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit01.lesson01.translate.003
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: translation
  frame:
