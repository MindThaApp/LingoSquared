  frame:
    text: كيف حالك؟ (رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: تُكتب Sie وIhnen بحرف كبير في صيغة الاحترام، لذا فإن حرف I الكبير في Ihnen جزء من الإملاء.
