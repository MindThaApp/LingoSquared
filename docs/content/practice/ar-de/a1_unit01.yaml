templates:
- content_key: practice.ar-de.de.a1.unit01.lesson01.choose.001
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تُستخدم Guten Morgen في الصباح، وGuten Tag خلال النهار، وGuten Abend من المساء فصاعدًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit01.lesson02.listen.001
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tschüss وداع غير رسمي، أما Auf Wiedersehen فهو الوداع المهذب مع الغرباء وفي المواقف الرسمية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit01.lesson03.choose.001
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'في الألمانية كلمتان للمخاطب: Sie للاحترام (الغرباء، الموظفون الرسميون)، وdu لغير الرسمي (الأصدقاء، العائلة، الأطفال).'
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit01.lesson04.listen.001
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تشمل Bitte معنيي «من فضلك» و«عفوًا»، أما Entschuldigung فتلفت انتباه شخص ما أو تعني «آسف».
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit01.lesson03.order.002
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: word_order
  frame:
    text: Wie geht es {item}?
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Wie geht es Ihnen? هو السؤال الرسمي عن الحال؛ ومع الصديق تسأل Wie geht's?
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit01.lesson02.order.002
  lesson_content_key: de.a1.unit01.lesson02.abschied
