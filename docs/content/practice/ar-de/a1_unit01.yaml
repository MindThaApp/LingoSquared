    frame:
      text: Bis {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bis تعني «حتى»، فـ Bis bald تشبه «إلى اللقاء قريبًا» وBis später تعني «إلى اللقاء لاحقًا».
    language_code: ar
    direction: rtl
