    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تُكتب جميع الأسماء الألمانية بحرف كبير في أولها، لذلك تبدأ Morgen وTag وAbend وNacht بحرف كبير.
    language_code: ar
    direction: rtl
- content_key: practice.ar-de.de.a1.unit01.lesson03.translate.005
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: translation
