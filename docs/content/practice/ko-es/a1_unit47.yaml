schema_version: '1.0'
pack_key: practice.ko-es.a1.unit47
source_language: ko
target_language: es
unit_content_key: es.a1.unit47.communication
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_contarte
    - w_devuelvo
    - w_envío
    - w_esperado
    - w_esperar
    - w_hables
    - w_hablo
    - w_llamada
    - w_llamarme
    - w_llamarte
    - w_mensaje
    - w_minutos
    - w_oigo
    - w_oír
    - w_rápido
    - w_significa
    - w_turno
templates:
- content_key: practice.ko-es.es.a1.unit47.lesson01.choose.001
  lesson_content_key: es.a1.unit47.lesson01.te_llamo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_llamarte
        - w_hablo
        - w_hables
        - w_rápido
        - w_oigo
        - w_mensaje
        - w_envío
        - w_llamarme
        - w_contarte
        - w_devuelvo
        - w_llamada
        - w_minutos
        - w_turno
        - w_esperado
        - w_esperar
        - w_oír
        - w_significa
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''전화할게요'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson02.listen.001
  lesson_content_key: es.a1.unit47.lesson02.con_quien_hablo
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''누구세요?'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson03.translate.001
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''다시 말씀해 주시겠어요?'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson04.match.001
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 스페인어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson05.choose.001
  lesson_content_key: es.a1.unit47.lesson05.leer_una_conversacion_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''문자 메시지 읽기'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson06.translate.001
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''근무 후 전화 통화'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson01.order.002
  lesson_content_key: es.a1.unit47.lesson01.te_llamo
  type: word_order
  frame:
    text: Tengo que {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_llamarte
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo que {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 당신에게 전화해야 해요. llamarte는 '당신에게 전화하다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson02.order.002
  lesson_content_key: es.a1.unit47.lesson02.con_quien_hablo
  type: word_order
  frame:
    text: ¿Con quién {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hablo
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Con quién {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 누구세요? ¿Con quién hablo?는 누가 전화했는지 모를 때 쓰는 기본 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson03.order.002
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: word_order
  frame:
    text: No {item} tan rápido, por favor.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_hables
  answer_derivation:
    kind: render_frame
    frame:
      text: No {item} tan rápido, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 너무 빠르게 말하지 마세요. No hables는 hablar의 부정 비격식 명령형이고, tan rápido(그렇게 빠르게)는 정도를 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson03.fill.003
  lesson_content_key: es.a1.unit47.lesson03.puedes_repetir_eso
  type: fill_in_blank
  frame:
    text: No te {item} bien. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_oigo
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 잘 안 들려요. Oír(듣다)와 no ... bien(잘 ~않다)은 소리가 잘 들리지 않는다는 뜻이며, entender(이해하다)와는 달라요. te oigo는 '당신 말이 들려요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson04.order.002
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: word_order
  frame:
    text: El {item} es de Elena.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_mensaje
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} es de Elena.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 문자 메시지는 Elena가 보낸 거예요. mensaje는 메시지, 문자 메시지라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson04.fill.003
  lesson_content_key: es.a1.unit47.lesson04.enviar_un_mensaje
  type: fill_in_blank
  frame:
    text: Te {item} un mensaje. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_envío
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '문자 보낼게요. Enviar(보내다)는 대명사 te(당신에게) 뒤에 와요: te envío un mensaje.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson06.order.002
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: word_order
  frame:
    text: ¿Cómo ha ido tu primer {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_turno
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo ha ido tu primer {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: '첫 근무는 어땠어요? Ha ido는 ir의 현재완료예요(여기서는 ''~하게 되다''): ha + 과거분사 ido.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson06.fill.003
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: fill_in_blank
  frame:
    text: Ha ido muy bien, mejor de lo {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_esperado
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 아주 잘 됐어요, 생각보다 더 좋았어요. Ha ido muy bien은 질문의 현재완료를 다시 쓴 거예요. mejor de lo esperado(기대보다 더 좋게)는 de lo로 비교해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit47.lesson06.translate.004
  lesson_content_key: es.a1.unit47.lesson06.una_llamada_despues_del
  type: translation
  frame:
    text: 고마워요, 저한테 큰 의미가 있어요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_significa
  answer_derivation:
    kind: render_frame
    frame:
      text: Muchas gracias, eso {item} mucho para mí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 고마워요, 저한테 큰 의미가 있어요. Significa는 significar(의미하다)의 3인칭 형태이고, para mí(나에게)는 누구에게 중요한지를 나타내요.
    language_code: ko
    direction: ltr
