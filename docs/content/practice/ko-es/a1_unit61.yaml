    frame:
      text: Tengo una {item} para mi abuelo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 할아버지께 드릴 편지가 있어요. carta는 '편지'라는 뜻이에요.
    language_code: ko
    direction: ltr
