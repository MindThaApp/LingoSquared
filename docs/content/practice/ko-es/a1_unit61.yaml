  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 이 단원의 단어 {item}, 편지와 소포 수업에 나오는 단어예요.
    language_code: ko
    direction: ltr
