templates:
- content_key: practice.ko-es.es.a1.unit12.lesson01.choose.001
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '감정을 나타내는 형용사는 남자일 때 -o, 여자일 때 -a로 끝나요: nervioso, nerviosa.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson01.listen.002
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 마지막 모음을 보면 말하는 사람이 남자(-o)인지 여자(-a)인지 알 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson01.match.003
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Contento는 어떤 일에 기뻐하거나 만족한다는 뜻이고, estar와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson01.order.004
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: word_order
  frame:
    text: Hoy Mateo está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy Mateo está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: '감정은 변할 수 있어서 estar를 써요: Mateo está nervioso hoy.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson01.order.005
  lesson_content_key: es.a1.unit12.lesson01.sentimientos_vocabulario
  type: word_order
  frame:
    text: Hoy Elena está {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Hoy Elena está {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: '엘레나는 여자라서 형용사가 -a로 끝나요: Elena está cansada.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson03.order.001
  lesson_content_key: es.a1.unit12.lesson03.como_te_sientes
  type: word_order
  frame:
    text: Me {item} un poco nervioso.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Me {item} un poco nervioso.
      language_code: es
      direction: ltr
  feedback_frame:
    text: '저는 조금 긴장돼요. Sentirse는 me, te, se와 함께 쓰여요: me siento, te sientes.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson03.translate.002
  lesson_content_key: es.a1.unit12.lesson03.como_te_sientes
  type: translation
  frame:
    text: 기분이 어때? (친한 사이)
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo te {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: usted를 쓰면 질문은 ¿Cómo se siente?가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson04.fill.001
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: fill_in_blank
  frame:
    text: No te {item}, podemos empezar de nuevo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: No te preocupes는 친구에게 "걱정하지 마"라고 말할 때 쓰는 정해진 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson04.translate.002
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: translation
  frame:
    text: 뭔가 타고 있어요!
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Algo se {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: '스페인어는 지금 일어나고 있는 일에 단순 현재형을 써요: algo se quema.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson04.order.003
  lesson_content_key: es.a1.unit12.lesson04.algo_se_quema
  type: word_order
  frame:
    text: Podemos {item} de nuevo.
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Podemos {item} de nuevo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 우리 다시 시작할 수 있어요. De nuevo는 otra vez처럼 '다시'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson05.choose.001
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '글이 시간 순서대로 흘러가요: antes(전), durante(중), al final(마지막에), ahora(지금).'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson05.translate.002
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '남자가 포함된 그룹이면 형용사는 -os로 끝나요: nerviosos, contentos.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson06.order.001
  lesson_content_key: es.a1.unit12.lesson06.el_pastel_se_quema_dialogue
  type: word_order
  frame:
    text: Lo logramos {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Lo logramos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 우리는 함께 해냈어요. Lograr는 무언가를 해내다, 이루다라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson06.listen.002
  lesson_content_key: es.a1.unit12.lesson06.el_pastel_se_quema_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¡Ay, no!는 일이 잘못될 때 자연스럽게 나오는 반응이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit12.lesson05.match.003
  lesson_content_key: es.a1.unit12.lesson05.leer_la_reflexion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Estaban과 están은 둘 다 estar의 형태예요: 그들은 ~였어요, 그들은 ~예요.'
    language_code: ko
    direction: ltr
