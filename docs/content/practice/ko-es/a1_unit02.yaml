templates:
- content_key: practice.ko-es.es.a1.unit02.lesson01.choose.001
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Uno는 남성 명사 앞에서 un으로 줄고(un huevo), 여성 명사 앞에서는 una가 돼요(una taza).
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson01.listen.002
  lesson_content_key: es.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Seis는 한 음절이고, siete는 두 음절(sie-te)이에요. t 소리를 잘 들어 보세요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson02.match.001
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '11부터 15까지는 고유한 단어(once, doce, trece, catorce, quince)가 있고, 16부터는 diez를 바탕으로 만들어요: dieciséis.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson02.translate.002
  lesson_content_key: es.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cien은 딱 100이에요. 100을 넘으면 ciento라고 해요: ciento uno.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson03.order.001
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: Tengo {age} años.
    language_code: es
    direction: ltr
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 스페인어에서는 나이를 tener(가지다)로 말해요. 나이를 '이다'가 아니라 '가지고 있다'고 표현해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson03.translate.002
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: 저는 {age}살이에요.
    language_code: ko
    direction: ltr
    slot_rendering:
      age: english_gloss
  slots:
    age: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tengo {age} años.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 나이를 말할 때 soy는 쓰지 않아요. Tengo veinte años라고 하고, Soy veinte라고 하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson03.fill.003
  lesson_content_key: es.a1.unit02.lesson03.asking_age
  type: fill_in_blank
  frame:
    text: ¿Cuántos años {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: usted에게 물을 때는 ¿Cuántos años tiene usted?라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson04.choose.001
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '스페인어에서는 전화번호를 두 자리씩 끊어 읽는 경우가 많아요: 62 41 ...은 sesenta y dos, cuarenta y uno로 읽어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson04.order.002
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: word_order
  frame:
    text: ¿Puedes {item}, por favor?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedes {item}, por favor?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Puedes + 동사원형은 친구에게 부탁할 때 쓰고, usted에게는 ¿Puede repetir, por favor?라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson04.translate.003
  lesson_content_key: es.a1.unit02.lesson04.phone_numbers
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Por favor(제발, 부탁드려요)와 claro(물론이죠)는 어떤 대화에서든 아주 유용한 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson05.choose.001
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '수량은 de로 재료와 이어요: dos tazas de harina.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson05.translate.002
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 스페인어 복수형은 모음 뒤에 -s를 붙이고(taza, tazas), 자음 뒤에는 -es를 붙여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson05.translate.003
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: 저는 {item} 세 개가 필요해요.
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Necesito tres {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Necesito(저는 필요해요)는 necesitar에서 온 말이에요. 다른 사람에게 물을 때는 ¿Cuántos necesitas?라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson05.fill.004
  lesson_content_key: es.a1.unit02.lesson05.recipe_quantities
  type: fill_in_blank
  frame:
    text: Media taza de {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Taza는 여성 명사라서 반 컵은 media taza예요. 남성 명사 앞에서는 medio를 써요: medio kilo.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson06.listen.001
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Oye는 다른 사람의 주의를 끌 때 쓰는 친근한 표현이에요. '저기', '이봐' 같은 느낌이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson06.translate.002
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: translation
  frame:
    text: 질문 하나 더 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Una {item} más.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Más는 보통 명사 뒤에 와요: una pregunta más(질문 하나 더).'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit02.lesson06.match.003
  lesson_content_key: es.a1.unit02.lesson06.recipe_count_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Tengo, tienes, tiene는 모두 tener의 형태예요: 나는 가지고 있다, 너는 가지고 있다, 그/그녀는 가지고 있다.'
    language_code: ko
    direction: ltr
