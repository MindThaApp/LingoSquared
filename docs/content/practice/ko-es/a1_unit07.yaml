schema_version: '1.0'
pack_key: practice.ko-es.a1.unit07
source_language: ko
target_language: es
unit_content_key: es.a1.unit07.shopping
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - es_a1_u07
    - es_a1_u07_l01
    - es_a1_u07_l06
    - w_cuesta
    - w_cuestan
    - w_docena
    - w_necesita
    - w_todo
    - w_ingredientes
slot_presets:
  market: &id001
    language_code: es
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: es_a1_u07_l01
  nouns: &id002
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: es_a1_u07
  content: &id008
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u07
  dialogue: &id010
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u07_l06
  cuesta: &id003
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_cuesta
  cuestan: &id004
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_cuestan
  docena: &id005
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_docena
  necesita: &id006
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_necesita
  todo: &id007
    language_code: es
    part_of_speech: pronoun
    agreement_tags:
      semantic: w_todo
  ingredientes: &id009
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_ingredientes
templates:
- content_key: practice.ko-es.es.a1.unit07.lesson01.choose.001
  lesson_content_key: es.a1.unit07.lesson01.el_mercado
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '형용사는 명사에 맞춰 형태가 바뀌어요: la fruta fresca, los tomates frescos.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit07.lesson01.listen.002
  lesson_content_key: es.a1.unit07.lesson01.el_mercado
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Verdura는 채소 한 가지예요. 시장에서는 보통 verduras라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit07.lesson02.order.001
  lesson_content_key: es.a1.unit07.lesson02.preguntar_el_precio
  type: word_order
  frame:
    text: ¿Cuánto {item} el kilo de tomates?
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto {item} el kilo de tomates?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 토마토 1킬로는 얼마예요? Cuesta는 한 가지에, cuestan은 여러 가지에 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit07.lesson02.translate.002
  lesson_content_key: es.a1.unit07.lesson02.preguntar_el_precio
  type: translation
  frame:
    text: 달걀은 얼마예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto {item} los huevos?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Huevos는 복수라서 동사는 cuestan이에요. 빵이라면 cuesta를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit07.lesson03.order.001
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: word_order
  frame:
    text: Una {item} de huevos, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Una {item} de huevos, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: '달걀 한 판 주세요. 수량 뒤에는 물건 앞에 de를 써요: un kilo de tomates.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit07.lesson03.match.002
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Medio kilo는 반 킬로예요. medio 앞에는 un을 쓰지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit07.lesson03.translate.003
  lesson_content_key: es.a1.unit07.lesson03.cantidades
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: -o로 끝나는 단어는 보통 남성(el mercado), -a로 끝나는 단어는 여성(la fruta)이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit07.lesson04.fill.001
  lesson_content_key: es.a1.unit07.lesson04.una_compra_sencilla
  type: fill_in_blank
  frame:
    text: ¿{item} algo más? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '시장 상인들은 손님에게 usted 형태를 써요: ¿Necesita algo más?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit07.lesson04.translate.002
  lesson_content_key: es.a1.unit07.lesson04.una_compra_sencilla
  type: translation
  frame:
    text: 우리는 이미 다 가지고 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ya tenemos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: '''이미''라는 뜻의 Ya는 스페인어에서 보통 동사 앞에 와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit07.lesson05.choose.001
  lesson_content_key: es.a1.unit07.lesson05.leer_las_etiquetas_de_precio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Todos los días는 '매일'이라는 뜻이고, 직역하면 '모든 날들'이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit07.lesson06.order.001
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: word_order
  frame:
    text: Necesitamos {item} para la próxima clase.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Necesitamos {item} para la próxima clase.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 우리는 다음 수업에 쓸 재료가 필요해요. Necesitamos는 necesitar의 '우리' 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit07.lesson06.translate.002
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¡Qué tomates tan frescos!는 '토마토가 정말 신선하네요!'를 스페인어로 말하는 방식이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit07.lesson06.listen.003
  lesson_content_key: es.a1.unit07.lesson06.de_compras_en_el_mercado_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vamos는 '가자'와 '우리는 가요'를 모두 뜻해요. 상황으로 구별해요.
    language_code: ko
    direction: ltr
