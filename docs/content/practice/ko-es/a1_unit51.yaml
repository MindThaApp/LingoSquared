schema_version: '1.0'
pack_key: practice.ko-es.a1.unit51
source_language: ko
target_language: es
unit_content_key: es.a1.unit51.travel
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_ahí
    - w_allá
    - w_andén
    - w_atención
    - w_billete
    - w_cuarenta
    - w_entrada
    - w_espera
    - w_ida
    - w_justo
    - w_llega
    - w_llegada
    - w_lleva
    - w_lugar
    - w_panel
    - w_precio
    - w_problema
    - w_quisiera
    - w_recto
    - w_retraso
    - w_sale
    - w_salida
    - w_suben
    - w_taquilla
    - w_tren
    - w_vuelta
templates:
- content_key: practice.ko-es.es.a1.unit51.lesson01.choose.001
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_billete
        - w_quisiera
        - w_ida
        - w_vuelta
        - w_taquilla
        - w_andén
        - w_sale
        - w_tren
        - w_llega
        - w_retraso
        - w_atención
        - w_lleva
        - w_lugar
        - w_entrada
        - w_salida
        - w_espera
        - w_recto
        - w_llegada
        - w_precio
        - w_cuarenta
        - w_ahí
        - w_panel
        - w_problema
        - w_justo
        - w_suben
        - w_allá
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 표 사기 수업에 나온 이 단원의 단어 중 하나예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson02.listen.001
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. ''기차는 몇 시에 출발해요?'' 수업에서 배워요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson03.translate.001
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. ''지연'' 수업에서 배워요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson04.match.001
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 스페인어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson05.choose.001
  lesson_content_key: es.a1.unit51.lesson05.leer_un_billete_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. ''기차표 읽기'' 수업에서 배워요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson06.translate.001
  lesson_content_key: es.a1.unit51.lesson06.elena_y_mateo_de
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. ''엘레나와 마테오의 여행'' 수업에서 배워요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson01.order.002
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: word_order
  frame:
    text: Quisiera un {item} a Toledo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_billete
  answer_derivation:
    kind: render_frame
    frame:
      text: Quisiera un {item} a Toledo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 톨레도행 표를 한 장 사고 싶어요. billete는 표라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson01.fill.003
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: fill_in_blank
  frame:
    text: ¿Quiere un billete de ida o de ida y {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_vuelta
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_vuelta
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 편도로 하시겠어요, 왕복으로 하시겠어요? Quiere는 querer의 격식을 갖춘 usted 형태로, 처음 만나는 역 직원에게 쓰는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson01.translate.004
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: translation
  frame:
    text: 창구에서는 보통 공손한 표현인 usted를 써요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_taquilla
  answer_derivation:
    kind: render_frame
    frame:
      text: En la {item} se suele usar la forma de cortesía usted.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 창구에서는 보통 정중한 형태인 usted를 써요. 서비스를 제공하는 낯선 사람에게는 tú가 아니라 usted로 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson02.order.002
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: word_order
  frame:
    text: ¿De qué {item} sale el tren a Toledo?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_andén
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿De qué {item} sale el tren a Toledo?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 톨레도행 기차는 몇 번 승강장에서 출발해요? andén은 승강장이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson02.fill.003
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: fill_in_blank
  frame:
    text: El tren {item} a las diez menos cuarto del andén cinco. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_sale
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_sale
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 기차는 9시 45분에 5번 승강장에서 출발해요. Las diez menos cuarto는 시간 수업에서 배운 "~분 전" 시각 표현을 다시 쓴 거예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson02.translate.004
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: translation
  frame:
    text: 기차는 몇 시에 도착해요?
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tren
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿A qué hora llega el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 기차는 몇 시에 도착해요? ¿A qué hora llega ...?는 도착 시각을 묻는 표현이에요. llegar는 규칙 동사이고, 시각 앞에는 a las를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson03.order.002
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: word_order
  frame:
    text: Atención, el tren a Toledo lleva {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_retraso
  answer_derivation:
    kind: render_frame
    frame:
      text: Atención, el tren a Toledo lleva {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 안내 말씀드립니다. 톨레도행 기차가 지연되고 있어요. retraso는 지연이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson03.fill.003
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: fill_in_blank
  frame:
    text: El tren {item} diez minutos de retraso. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_lleva
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_lleva
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 기차가 10분 지연되고 있어요. Lleva retraso(직역하면 "지연을 지니고 있다")는 지연됐다고 말할 때 쓰는 자연스러운 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson03.translate.004
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: translation
  frame:
    text: 기차는 5번 승강장이 아니라 3번 승강장에서 출발해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_lugar
  answer_derivation:
    kind: render_frame
    frame:
      text: El tren sale del andén tres en {item} del andén cinco.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 기차는 5번 승강장 대신 3번 승강장에서 출발해요. En lugar de는 "~ 대신"이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson04.order.002
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
  type: word_order
  frame:
    text: ¿Dónde está la {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_entrada
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Dónde está la {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 입구는 어디예요? entrada는 입구라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson04.fill.003
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
  type: fill_in_blank
  frame:
    text: ¿Dónde está la {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_salida
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_salida
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 출구는 어디예요? salida는 '출구'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson04.translate.004
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
  type: translation
  frame:
    text: 대합실이 어디예요?
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_espera
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Dónde está la sala de {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 대기실은 어디예요? espera는 '기다림'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit51.lesson06.order.002
  lesson_content_key: es.a1.unit51.lesson06.elena_y_mateo_de
  type: word_order
  frame:
    text: No hay {item}, todavía tenemos tiempo para un café.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_problema
  answer_derivation:
    kind: render_frame
    frame:
      text: No hay {item}, todavía tenemos tiempo para un café.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 괜찮아요, 커피 한 잔 마실 시간은 아직 있어요. No hay problema는 가볍게 안심시킬 때 흔히 쓰는 말이에요.
    language_code: ko
    direction: ltr
