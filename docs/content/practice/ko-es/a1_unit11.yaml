templates:
- content_key: practice.ko-es.es.a1.unit11.lesson01.choose.001
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 스페인어에서는 바지를 el pantalón처럼 단수로 말하기도 하고, los pantalones처럼 복수로 말하기도 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit11.lesson01.listen.002
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Camisa와 chaqueta는 여성 명사이고, pantalón, delantal, zapatos는 남성 명사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit11.lesson01.translate.003
  lesson_content_key: es.a1.unit11.lesson01.la_ropa_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '-l로 끝나는 명사는 복수형에서 -es를 붙여요: delantal, delantales.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit11.lesson02.order.001
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: word_order
  frame:
    text: Uso la talla {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Uso la talla {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 저는 중간 사이즈를 입어요. 스페인어에서는 입는 사이즈를 말할 때 '사용하다'라는 뜻의 usar를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit11.lesson02.fill.002
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: fill_in_blank
  frame:
    text: ¿Qué {item} usas? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Talla는 옷 사이즈예요. 신발 사이즈는 대신 el número라고 해요: ¿Qué número tienes?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit11.lesson02.translate.003
  lesson_content_key: es.a1.unit11.lesson02.la_talla
  type: translation
  frame:
    text: 저한테 잘 안 맞아요.
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Quedar에 bien이나 mal을 붙여 옷이 몸에 맞는 정도를 말해요: me queda bien은 ''저한테 잘 맞아요''라는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit11.lesson04.order.001
  lesson_content_key: es.a1.unit11.lesson04.decidir_comprar
  type: word_order
  frame:
    text: Me queda bien. Voy a {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Me queda bien. Voy a {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 'Ir a + 동사원형은 계획을 나타내요: voy a comprarlo는 ''그것을 살 거예요''라는 뜻이에요. ''그것''을 뜻하는 lo는 동사원형 끝에 붙어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit11.lesson05.match.001
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Uso, usas, usan은 모두 usar에서 온 형태예요: 저는 입어요, 너는 입어요, 그들은 입어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit11.lesson05.fill.002
  lesson_content_key: es.a1.unit11.lesson05.leer_la_lista_de_precios
  type: fill_in_blank
  frame:
    text: 'El delantal es más {item}: solo cuesta doce. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Más + 형용사로 비교를 나타내요: más barato는 ''더 싸다''라는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit11.lesson06.order.001
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: word_order
  frame:
    text: Sí, buscamos {item} para el taller.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, buscamos {item} para el taller.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 네, 우리는 워크숍에 쓸 앞치마를 찾고 있어요. Buscar에 이미 '찾다'라는 뜻이 있어서 buscamos delantales에는 다른 말이 더 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit11.lesson06.choose.002
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 점원은 ¿Los ayudo?로 도움을 제안해요. '(여러분) 도와 드릴까요?'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit11.lesson06.translate.003
  lesson_content_key: es.a1.unit11.lesson06.comprar_delantales_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Voy는 ''가다''라는 뜻의 ir에서 온 불규칙 형태예요: voy, vas, va.'
    language_code: ko
    direction: ltr
