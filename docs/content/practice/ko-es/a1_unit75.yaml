schema_version: '1.0'
pack_key: practice.ko-es.a1.unit75
source_language: ko
target_language: es
unit_content_key: es.a1.unit75.museum
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cerrar
    - w_concierto
    - w_cuadro
    - w_cuadros
    - w_exposición
    - w_falta
    - w_guía
    - w_visitar
    - w_visito
templates:
- content_key: practice.ko-es.es.a1.unit75.lesson01.choose.001
  lesson_content_key: es.a1.unit75.lesson01.quiero_ir_al_museo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_visitar
        - w_exposición
        - w_visito
        - w_cerrar
        - w_guía
        - w_falta
        - w_cuadro
        - w_cuadros
        - w_concierto
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. ''박물관에 가고 싶어요'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit75.lesson02.listen.001
  lesson_content_key: es.a1.unit75.lesson02.quiero_comprar_una_entrada
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 표를 사고 싶어요 수업에 나온 이 단원의 단어 중 하나예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit75.lesson03.translate.001
  lesson_content_key: es.a1.unit75.lesson03.a_que_hora_cierra
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. ''박물관은 몇 시에 문을 닫아요?'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit75.lesson04.match.001
  lesson_content_key: es.a1.unit75.lesson04.en_el_museo
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 스페인어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit75.lesson05.choose.001
  lesson_content_key: es.a1.unit75.lesson05.leer_el_panel_de
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. ''안내판 읽기'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit75.lesson06.translate.001
  lesson_content_key: es.a1.unit75.lesson06.mateo_nina_y_elena
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. ''Mateo, Nina, Elena의 박물관 나들이'' 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit75.lesson01.order.002
  lesson_content_key: es.a1.unit75.lesson01.quiero_ir_al_museo
  type: word_order
  frame:
    text: Quiero {item} el museo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_visitar
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero {item} el museo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 박물관을 방문하고 싶어요. visitar는 '방문하다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit75.lesson02.order.002
  lesson_content_key: es.a1.unit75.lesson02.quiero_comprar_una_entrada
  type: word_order
  frame:
    text: Visito la {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_exposición
  answer_derivation:
    kind: render_frame
    frame:
      text: Visito la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 전시회를 보고 있어요. exposición은 '전시회'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit75.lesson04.order.002
  lesson_content_key: es.a1.unit75.lesson04.en_el_museo
  type: word_order
  frame:
    text: Muy bien, ¿y quiere también una {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_guía
  answer_derivation:
    kind: render_frame
    frame:
      text: Muy bien, ¿y quiere también una {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 좋아요, 안내서도 필요하세요? guía는 '안내서'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit75.lesson04.fill.003
  lesson_content_key: es.a1.unit75.lesson04.en_el_museo
  type: fill_in_blank
  frame:
    text: No, gracias, no hace {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_falta
