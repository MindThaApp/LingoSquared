      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_falta
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 아니요, 괜찮아요. 필요 없어요. falta는 '부족하다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit75.lesson05.order.002
  lesson_content_key: es.a1.unit75.lesson05.leer_el_panel_de
