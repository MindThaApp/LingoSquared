      semantic: es_a1_u04_l02
  content: &id006
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adverb
    - phrase
    - adjective
    agreement_tags:
      semantic: es_a1_u04
  words: &id008
    language_code: es
    part_of_speech:
    - noun
    - adverb
    - phrase
    agreement_tags:
      semantic: es_a1_u04
  fecha: &id004
    language_code: es
