    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit14.lesson02.order.001
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: word_order
  frame:
    text: Quiero {item} un apartamento cerca del parque.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero {item} un apartamento cerca del parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 공원 근처의 아파트를 임대하고 싶어요. Querer + 동사원형은 하고 싶은 일을 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit14.lesson02.fill.002
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: fill_in_blank
  frame:
    text: Hay un apartamento {item} en este edificio. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Desocupado는 지금 아무도 살고 있지 않은 집을 가리키며, 명사 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit14.lesson03.translate.001
  lesson_content_key: es.a1.unit14.lesson03.cuantos_dormitorios_tiene
  type: translation
  frame:
    text: 침실이 몇 개 있어요?
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuántos {item} tiene?
      language_code: es
      direction: ltr
  feedback_frame:
    text: Cuántos는 남성 복수 명사와 함께 쓰고, 여성 명사와는 cuántas를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit14.lesson05.fill.001
  lesson_content_key: es.a1.unit14.lesson05.leer_el_anuncio
  type: fill_in_blank
  frame:
    text: ¿Hay {item} en casa? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alguien은 '누군가'라는 뜻이고, 반대말은 nadie, 즉 '아무도'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit14.lesson06.order.001
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: word_order
  frame:
    text: Voy a llamar a la {item} hoy mismo.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Voy a llamar a la {item} hoy mismo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 오늘 바로 중개업체에 전화할 거예요. Hoy mismo는 바로 오늘이라는 뜻을 더해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit14.lesson06.translate.002
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Pequeño는 여성 명사와 함께 쓰면 pequeña가 돼요: una cocina pequeña.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit14.lesson06.choose.003
  lesson_content_key: es.a1.unit14.lesson06.buscar_apartamento_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Alquilar는 '임대하다'라는 뜻이고, 매달 내는 월세는 el alquiler예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit14.lesson02.translate.003
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Edificio는 아파트 건물을 포함한 모든 건물을 가리키고, casa는 주택 또는 집을 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit14.lesson02.order.004
  lesson_content_key: es.a1.unit14.lesson02.buscar_apartamento_vocabulario
  type: word_order
  frame:
    text: El {item} está cerca del parque.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: El {item} está cerca del parque.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 그 건물은 공원 근처에 있어요. Cerca de + el는 cerca del로 줄어들어요.
    language_code: ko
    direction: ltr
