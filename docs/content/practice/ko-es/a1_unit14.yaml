- content_key: practice.ko-es.es.a1.unit14.lesson01.choose.001
  lesson_content_key: es.a1.unit14.lesson01.el_apartamento_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
