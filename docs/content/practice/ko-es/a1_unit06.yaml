templates:
- content_key: practice.ko-es.es.a1.unit06.lesson01.choose.001
  lesson_content_key: es.a1.unit06.lesson01.comida_y_bebida
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Agua는 여성 명사지만, 강세가 있는 a로 시작하기 때문에 단수에서는 el을 써요: el agua fría.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit06.lesson01.listen.002
  lesson_content_key: es.a1.unit06.lesson01.comida_y_bebida
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Café, menú, sándwich에는 악센트 부호가 있어요. 이 부호는 강세가 오는 음절을 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit06.lesson02.order.001
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: word_order
  frame:
    text: Quiero un {item}, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Un은 남성 명사와 함께 써요(un café). 여성 명사에는 una를 써요(una ensalada).
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit06.lesson02.translate.002
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: translation
  frame:
    text: '{item} 하나 주세요.'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: '주문하는 또 다른 흔한 방법은 para mí + 음식이에요: para mí, un café.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit06.lesson02.fill.003
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: fill_in_blank
  frame:
    text: ¿Qué {item} comer? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Querer는 어간이 바뀌어요: quiero, quieres, quiere, 하지만 queremos.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit06.lesson03.order.001
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: word_order
  frame:
    text: ¿Podemos ver el {item}?
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Podemos ver el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 메뉴판을 볼 수 있을까요? ¿Podemos + 동사원형?은 무언가를 정중하게 부탁하는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit06.lesson03.translate.002
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: translation
  frame:
    text: 맛있게 드세요!
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buen {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: Buen provecho는 막 식사하려는 사람에게 하는 말이에요. 옆 테이블의 모르는 사람에게도 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit06.lesson04.fill.001
  lesson_content_key: es.a1.unit06.lesson04.postre_y_la_cuenta
  type: fill_in_blank
  frame:
    text: La {item}, por favor. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 스페인에서는 웨이터가 보통 손님이 계산서를 요청할 때까지 기다려요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit06.lesson04.translate.002
  lesson_content_key: es.a1.unit06.lesson04.postre_y_la_cuenta
  type: translation
  frame:
    text: 디저트로 케이크를 먹고 싶어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: De postre quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De postre는 "디저트로"라는 뜻이에요. 여기서는 pastel 앞에 관사가 필요 없어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit06.lesson05.match.001
  lesson_content_key: es.a1.unit06.lesson05.leer_el_menu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 스페인의 menú del día는 정해진 점심 세트예요. 전채, 메인 요리, postre, 그리고 보통 빵과 음료가 하나의 가격에 나와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit06.lesson06.translate.001
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Comida는 음식과 점심 식사를 모두 뜻해요. 스페인에서 점심은 하루 중 가장 중요한 식사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit06.lesson06.choose.002
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 웨이터가 ¿Qué quieren comer?라고 말하는 건 quieren이 두 분 모두에게 하는 말이기 때문이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit06.lesson06.match.003
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Quiero, quieres, quieren은 모두 "원하다"를 뜻하는 querer의 형태예요.
    language_code: ko
    direction: ltr
