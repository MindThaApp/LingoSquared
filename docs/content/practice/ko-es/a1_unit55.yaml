schema_version: '1.0'
pack_key: practice.ko-es.a1.unit55
source_language: ko
target_language: es
unit_content_key: es.a1.unit55.vervoer
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_andando
    - w_bici
    - w_camina
    - w_caminar
    - w_centro
    - w_coche
    - w_compro
    - w_conduce
    - w_conducir
    - w_estación
    - w_normalmente
    - w_prefiere
    - w_transporte
    - w_vas
    - w_viaja
    - w_viajar
    - w_viajas
    - w_viajo
templates:
- content_key: practice.ko-es.es.a1.unit55.lesson01.choose.001
  lesson_content_key: es.a1.unit55.lesson01.el_tren_la_bici
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_bici
        - w_viaja
        - w_coche
        - w_caminar
        - w_conduce
        - w_camina
        - w_viajar
        - w_viajas
        - w_viajo
        - w_transporte
        - w_estación
        - w_compro
        - w_centro
        - w_vas
        - w_normalmente
        - w_prefiere
        - w_conducir
        - w_andando
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '기차, 자전거, 자동차, 걷기를 다룬 수업에 나오는 이 단원의 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit55.lesson02.listen.001
  lesson_content_key: es.a1.unit55.lesson02.cada_persona_viaja_de
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '사람마다 다르게 이동한다는 수업에 나오는 이 단원의 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit55.lesson03.translate.001
  lesson_content_key: es.a1.unit55.lesson03.comprar_un_billete
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 표 사기 수업에 나온 이 단원의 단어 중 하나예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit55.lesson04.match.001
  lesson_content_key: es.a1.unit55.lesson04.lucia_le_pregunta_a
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 스페인어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit55.lesson05.choose.001
  lesson_content_key: es.a1.unit55.lesson05.quien_viaja_como
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '누가 어떻게 이동할까요? 수업에 나오는 이 단원의 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit55.lesson06.translate.001
  lesson_content_key: es.a1.unit55.lesson06.vamos_juntos_en_bici
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이번 단원의 단어예요. ''같이 자전거 탈까요?'' 수업에 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit55.lesson01.order.002
  lesson_content_key: es.a1.unit55.lesson01.el_tren_la_bici
  type: word_order
  frame:
    text: Mateo va en {item} al trabajo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_bici
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo va en {item} al trabajo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Mateo는 자전거로 출근해요. bici의 뜻은 '자전거'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit55.lesson01.fill.003
  lesson_content_key: es.a1.unit55.lesson01.el_tren_la_bici
  type: fill_in_blank
  frame:
    text: Elena {item} en tren. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_viaja
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_viaja
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Elena는 기차로 여행해요. viaja의 뜻은 '여행하다'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit55.lesson01.translate.004
  lesson_content_key: es.a1.unit55.lesson01.el_tren_la_bici
  type: translation
  frame:
    text: 디에고는 차를 운전해요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_coche
  answer_derivation:
    kind: render_frame
    frame:
      text: Diego conduce el {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Diego는 차를 운전해요. coche의 뜻은 '차'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit55.lesson02.order.002
  lesson_content_key: es.a1.unit55.lesson02.cada_persona_viaja_de
  type: word_order
  frame:
    text: ¿Qué {item} tomo para ir al centro?
