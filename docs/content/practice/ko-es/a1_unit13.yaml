templates:
- content_key: practice.ko-es.es.a1.unit13.lesson01.choose.001
  lesson_content_key: es.a1.unit13.lesson01.el_trabajo_vocabulario
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Trabajo는 명사 '일, 직업'도 되고 동사 '저는 일해요'도 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit13.lesson01.listen.002
  lesson_content_key: es.a1.unit13.lesson01.el_trabajo_vocabulario
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Escritorio는 책상이에요. 사무실은 una oficina예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit13.lesson02.translate.001
  lesson_content_key: es.a1.unit13.lesson02.las_profesiones
  type: translation
  frame:
    text: 저는 회계사예요. (남성이 말함)
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 스페인어는 ser 뒤에 직업이 올 때 관사를 쓰지 않아요. soy contador라고 하고 soy un contador라고 하지 않아요. 여성은 soy contadora라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit13.lesson02.order.002
  lesson_content_key: es.a1.unit13.lesson02.las_profesiones
  type: word_order
  frame:
    text: Yo soy {item}. Enseño en una escuela.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Yo soy {item}. Enseño en una escuela.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 저는 교사예요. 저는 학교에서 가르쳐요. 남성 교사는 un profesor예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit13.lesson03.fill.001
  lesson_content_key: es.a1.unit13.lesson03.en_que_trabajas
  type: fill_in_blank
  frame:
    text: ¿En qué {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ¿En qué trabajas?는 직역하면 '무엇 안에서 일하나요?'이고, 뜻은 '직업이 무엇인가요?'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit13.lesson04.translate.001
  lesson_content_key: es.a1.unit13.lesson04.prefiero_cocinar
  type: translation
  frame:
    text: 우리 둘 다 이걸 더 좋아해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Los dos preferimos {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 여기서 los dos는 '우리 둘 다'라는 뜻이에요. esto는 이름을 말하지 않고 어떤 생각이나 사물을 가리킬 때 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit13.lesson05.order.001
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: word_order
  frame:
    text: Mateo {item} en una oficina en Londres.
    language_code: es
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo {item} en una oficina en Londres.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 마테오는 런던의 사무실에서 일해요. Trabajar en + 장소는 어디에서 일하는지를 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit13.lesson05.order.002
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: word_order
  frame:
    text: Elena {item} en una escuela.
    language_code: es
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Elena {item} en una escuela.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 엘레나는 학교에서 가르쳐요. Enseñar는 '가르치다'이고 aprender는 '배우다'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit13.lesson05.match.003
  lesson_content_key: es.a1.unit13.lesson05.leer_sobre_sus_trabajos
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'A los dos les gusta su trabajo: les는 좋아하는 사람이 ''그들''임을 나타내요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit13.lesson06.translate.001
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '일과 관련된 단어 중에는 한국어 외래어와 비슷한 것이 많아요: oficina, estudiantes, interesante.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit13.lesson06.fill.002
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: fill_in_blank
  frame:
    text: Prefiero cocinar {item} los martes. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Con + ti는 한 단어 contigo가 돼요. '나와 함께'는 conmigo예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit13.lesson06.choose.003
  lesson_content_key: es.a1.unit13.lesson06.el_descanso_del_taller_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Preferir는 대부분의 형태에서 e가 ie로 바뀌지만(prefiero, prefieren), preferimos에서는 바뀌지 않아요.
    language_code: ko
    direction: ltr
