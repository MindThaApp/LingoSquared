  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: word_order
  frame:
    text: ¿Cuánto cuesta en {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_total
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto cuesta en {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 총 얼마예요? En total은 물건 하나의 가격이 아니라 전체 합계 가격을 묻는다는 뜻을 분명하게 해 줘요.
