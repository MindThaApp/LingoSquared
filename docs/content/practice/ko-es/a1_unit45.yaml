  frame:
    text: Cuesta veinticinco {item} en total. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_euros
    hint:
