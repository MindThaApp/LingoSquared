    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tarjeta
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tarjeta
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 현금으로 내시겠어요, 카드로 내시겠어요? Quiere는 querer의 격식체 usted 형태로, 모르는 계산원이 쓰는 말이에요. 친구에게는 ¿quieres pagar...?라고 말해요.
    language_code: ko
    direction: ltr
