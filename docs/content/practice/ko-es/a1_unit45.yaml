      part_of_speech: verb
      agreement_tags:
        semantic: w_pagar
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedo {item} con tarjeta aquí?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 여기서 카드로 결제할 수 있나요? pagar는 '지불하다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit45.lesson02.fill.003
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
