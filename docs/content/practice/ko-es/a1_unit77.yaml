  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cartel
    - w_correa
    - w_hierba
    - w_nadan
    - w_paseo
    - w_pato
