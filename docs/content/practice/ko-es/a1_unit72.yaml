  lesson_content_key: es.a1.unit72.lesson01.quiero_ir_a_la
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_piscina
        - w_costar
        - w_abierto
        - w_horario
        - w_euro
        - w_cierra
        - w_norma
        - w_ducharse
        - w_ducho
        - w_horas
        - w_bolsa
        - w_natación
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — 이 단원의 단어예요. ''수영장에 가고 싶어요'' 수업에 나와요.'
    language_code: ko
    direction: ltr
