schema_version: '1.0'
pack_key: practice.ko-es.a1.unit50
source_language: ko
target_language: es
unit_content_key: es.a1.unit50.plans
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_actividad
    - w_breve
    - w_cine
    - w_cita
    - w_ganas
    - w_idiomas
    - w_invitación
    - w_plan
    - w_proponer
    - w_puede
    - w_quedamos
    - w_quedar
    - w_rechazo
    - w_saludo
    - w_tomamos
    - w_tomar
    - w_viene
templates:
- content_key: practice.ko-es.es.a1.unit50.lesson01.choose.001
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_tomamos
        - w_tomar
        - w_cine
        - w_proponer
        - w_actividad
        - w_ganas
        - w_plan
        - w_breve
        - w_rechazo
        - w_quedar
        - w_quedamos
        - w_cita
        - w_viene
        - w_invitación
        - w_idiomas
        - w_saludo
        - w_puede
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 활동을 제안하는 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit50.lesson02.listen.001
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 약속을 수락하거나 거절하는 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit50.lesson03.translate.001
  lesson_content_key: es.a1.unit50.lesson03.quedar_un_dia_y
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 요일과 시간을 정하는 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit50.lesson04.match.001
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 스페인어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit50.lesson06.choose.001
  lesson_content_key: es.a1.unit50.lesson06.elena_y_mateo_hacen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 엘레나와 마테오가 계획을 세우는 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit50.lesson01.translate.002
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 활동을 제안하는 수업에 나오는 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit50.lesson01.order.003
  lesson_content_key: es.a1.unit50.lesson01.proponer_una_actividad
  type: word_order
  frame:
    text: ¿Tienes ganas de ir al {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_cine
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Tienes ganas de ir al {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 영화 보러 갈 마음 있어요? ¿Tienes ganas de ...?는 어떤 일을 하고 싶은지 편하게 물을 때 써요. de 뒤에는 동사원형이 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit50.lesson02.order.002
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: word_order
  frame:
    text: Es un buen {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_plan
  answer_derivation:
    kind: render_frame
    frame:
      text: Es un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 좋은 계획이네요. 조금 더 풀어서 긍정적으로 답하는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit50.lesson02.fill.003
  lesson_content_key: es.a1.unit50.lesson02.aceptar_o_rechazar_un
  type: fill_in_blank
  frame:
    text: Lo siento + no puedo + una razón {item} hace amable un rechazo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_breve
    hint:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_breve
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lo siento + no puedo + 짧은 이유를 말하면 친절한 거절이 돼요. 대화에서 이유는 꼭 필요하지는 않지만, 말하면 더 공손하고 자연스러워요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit50.lesson03.order.002
  lesson_content_key: es.a1.unit50.lesson03.quedar_un_dia_y
  type: word_order
  frame:
    text: Sí, el viernes a las dos y media me {item} bien.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_viene
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, el viernes a las dos y media me {item} bien.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 네, 금요일 2시 30분 좋아요. Me viene bien("나한테 맞아요")은 제안된 시간이 괜찮다고 확인하는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit50.lesson04.order.002
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: word_order
  frame:
    text: Esta es una {item} al café de idiomas.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_invitación
  answer_derivation:
    kind: render_frame
    frame:
      text: Esta es una {item} al café de idiomas.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 언어 카페로의 초대예요. invitación은 초대라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit50.lesson04.fill.003
  lesson_content_key: es.a1.unit50.lesson04.leer_una_invitacion
  type: fill_in_blank
  frame:
    text: Tomamos un café en el café de {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_idiomas
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_idiomas
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 우리는 언어 카페에서 커피를 마셔요. idiomas는 언어들이라는 뜻이에요.
    language_code: ko
    direction: ltr
