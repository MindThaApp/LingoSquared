schema_version: '1.0'
pack_key: practice.ko-es.a1.unit62
source_language: ko
target_language: es
unit_content_key: es.a1.unit62.koken
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cebolla
    - w_cocinan
    - w_corta
    - w_cortamos
    - w_cortar
    - w_freír
    - w_fríe
    - w_fríes
    - w_lista
    - w_prepara
    - w_preparamos
    - w_preparar
    - w_preparas
    - w_preparo
    - w_probando
    - w_probar
    - w_prueba
    - w_rica
    - w_sartén
    - w_tomate
templates:
- content_key: practice.ko-es.es.a1.unit62.lesson01.choose.001
  lesson_content_key: es.a1.unit62.lesson01.la_cebolla_el_tomate
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_cebolla
        - w_tomate
        - w_cortar
        - w_sartén
        - w_freír
        - w_preparar
        - w_preparo
        - w_preparas
        - w_prepara
        - w_probar
        - w_prueba
        - w_cortamos
        - w_fríes
        - w_probando
        - w_cocinan
        - w_corta
        - w_fríe
        - w_rica
        - w_lista
        - w_preparamos
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 양파, 토마토, 썰기 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit62.lesson02.listen.001
  lesson_content_key: es.a1.unit62.lesson02.la_sarten_y_freir
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 프라이팬과 볶기 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit62.lesson03.translate.001
  lesson_content_key: es.a1.unit62.lesson03.preparar_y_probar
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 준비하기와 맛보기 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit62.lesson04.match.001
  lesson_content_key: es.a1.unit62.lesson04.en_la_cocina_de
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 스페인어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-es.es.a1.unit62.lesson05.choose.001
