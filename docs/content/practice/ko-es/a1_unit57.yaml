schema_version: '1.0'
pack_key: practice.ko-es.a1.unit57
source_language: ko
target_language: es
unit_content_key: es.a1.unit57.opleiding
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aprende
    - w_aprender
    - w_aprendes
    - w_aprendo
    - w_ciencias
    - w_estudia
    - w_estudiar
    - w_estudias
    - w_estudio
    - w_formación
    - w_gustaría
    - w_nuevas
    - w_practicamos
    - w_próximo
    - w_sabes
    - w_salud
    - w_seguir
    - w_superior
    - w_universidad
templates:
