  lesson_content_key: es.a1.unit57.lesson01.estudiar_y_una_formacion
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_estudiar
        - w_estudia
        - w_formación
        - w_estudias
        - w_estudio
        - w_seguir
        - w_aprender
        - w_nuevas
        - w_aprendo
        - w_universidad
        - w_superior
        - w_aprendes
        - w_aprende
        - w_ciencias
        - w_salud
        - w_gustaría
        - w_sabes
        - w_practicamos
        - w_próximo
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어 {item}: 공부와 교육 과정에 관한 수업에 나와요.'
    language_code: ko
    direction: ltr
