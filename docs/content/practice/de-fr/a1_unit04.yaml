    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Gewichts- und Maßangaben stehen mit de vor dem Lebensmittel: un kilo de tomates, un litre de lait.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson01.order.004
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: word_order
  frame:
    text: Les {item} sont chers aujourd'hui.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Les {item} sont chers aujourd'hui.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Chers steht im maskulinen Plural, weil légumes und fruits maskuline Pluralnomen sind.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson01.fill.005
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: fill_in_blank
  frame:
    text: La {item} est fermée aujourd'hui. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fermée endet auf -ée, weil boulangerie feminin ist.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson01.translate.006
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Im Französischen lernt man jedes Nomen mit seinem Artikel: le marché, le prix, la boulangerie.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson02.choose.001
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Euro erhält im Plural ein -s (euros), das aber stumm ist; man hört also die Zahl und nicht die Endung.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson02.choose.002
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chers ist der Plural von cher; Adjektive erhalten ein -s, wenn sie sich auf Pluralnomen wie les légumes beziehen.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson02.order.003
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: Je voudrais un kilo de {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je voudrais ist die höfliche Art, um etwas zu bitten; un kilo de + Nomen nennt die Menge.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson02.order.004
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: word_order
  frame:
    text: C'est combien le {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien? fragt nach dem Preis einer einzelnen Sache; le zeigt, dass das Nomen maskulin ist.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson02.fill.005
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Combien ça {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Combien ça coûte? fragt, wie viel etwas kostet; das funktioniert für jeden einzelnen Artikel.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson02.fill.006
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: fill_in_blank
  frame:
    text: Je {item} un kilo de tomates, s'il vous plaît. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Je voudrais ist höflicher als je veux, das beim Bestellen schroff klingen würde.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson02.translate.007
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Cher richtet sich nach seinem Nomen: cher (maskulin Singular), chers (maskulin Plural).'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson02.translate.008
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: Ich hätte gern ein Kilo {item}, bitte. (formell)
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je voudrais un kilo de {item}, s'il vous plaît.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: S'il vous plaît ist das höfliche „bitte“; zu einem Freund könnten Sie s'il te plaît sagen.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson02.translate.009
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
  type: translation
  frame:
    text: Was kostet das Brot?
    language_code: de
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est combien le {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est combien le pain? fragt nach dem Preis eines Artikels; die Antwort beginnt mit einem Betrag in Euro.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson03.choose.001
  lesson_content_key: fr.a1.unit04.lesson03.dialogue_marche
