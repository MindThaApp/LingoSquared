templates:
- content_key: practice.de-fr.fr.a1.unit04.lesson01.choose.001
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Marché und prix sind maskulin (le marché, le prix), boulangerie ist feminin (la boulangerie); lernen Sie jedes Nomen mit seinem Artikel.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson01.listen.002
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Viele Wörter vom Markt sind Lebensmittel, die nach einer Mengenangabe mit de stehen: un kilo de tomates, un litre de lait.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit04.lesson01.match.003
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: matching_pairs
