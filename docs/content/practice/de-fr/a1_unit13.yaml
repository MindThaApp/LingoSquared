templates:
- content_key: practice.de-fr.fr.a1.unit13.lesson01.choose.001
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Préférer, aimer und détester sind die wichtigsten Verben, um Vorlieben und Abneigungen auszudrücken.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson01.listen.002
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Épices steht im Plural; das End-s ist stumm, épice klingt also genauso.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson01.order.004
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: word_order
  frame:
    text: J'aime {item} les plats salés que les plats sucrés.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: J'aime {item} les plats salés que les plats sucrés.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Aimer mieux bedeutet „lieber mögen“; que leitet ein, was man weniger mag.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson01.fill.006
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: fill_in_blank
  frame:
    text: Mathieu {item} les épices trop fortes. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Déteste ist die il-Form von détester und passt zu Mathieu.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson01.translate.008
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: translation
  frame:
    text: Ich mag die Schokoladentarte lieber.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je préfère la {item} au chocolat.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Au ist à plus le; au chocolat beschreibt den Geschmack der Tarte.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson01.translate.009
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tarte, chocolat, épices und plats sind die Speisen, die in der Lektion über Vorlieben vorkommen.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson02.choose.001
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ou bedeutet „oder“, où (mit Akzent) bedeutet „wo“; der Akzent macht den Unterschied.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson02.listen.002
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pourrait ist der Konditional von pouvoir und dient für einen höflichen Vorschlag: on pourrait.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson02.order.004
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: word_order
  frame:
    text: Tu aimes plutôt le sucré {item} le salé ?
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu aimes plutôt le sucré {item} le salé ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Ou verbindet zwei Möglichkeiten: sucré ou salé bedeutet „süß oder herzhaft“.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson02.fill.006
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: fill_in_blank
  frame:
    text: Ça ne me {item} pas. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ça ne me dérange pas bedeutet „Das stört mich nicht“.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson02.translate.007
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: translation
  frame:
    text: Was magst du lieber? (informell, mit qu'est-ce que)
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce que tu {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu préfères ist die tu-Form von préférer; vous préférez wäre die höfliche Form.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson03.choose.001
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sucrée und salée haben ein End-e, weil tarte und quiche feminin sind.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson03.listen.002
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sucrée und salée sind die femininen Formen; sie enden auf ein stummes -e.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson03.match.003
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Sucrée und salée beschreiben die femininen Nomen tarte und quiche.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson03.order.004
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: word_order
  frame:
    text: Parfait, une tarte sucrée et une quiche {item} pour samedi.
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, une tarte sucrée et une quiche {item} pour samedi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Salée ist feminin, weil es sich auf quiche bezieht.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson03.fill.005
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: fill_in_blank
  frame:
    text: Je préfère la tarte, plutôt {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sucrée ist feminin, weil es sich auf tarte bezieht.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson03.translate.006
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: translation
  frame:
    text: Was machen wir am Samstag? (mit on)
    language_code: de
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce qu'on {item} samedi ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: On prépare ist die übliche gesprochene Form für „wir machen / wir bereiten zu“.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit13.lesson03.translate.007
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
  type: translation
  frame:
    text: Ich mag die Quiche lieber als die Tarte.
    language_code: de
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Je préfère la {item} à la tarte.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Préférer A à B bedeutet „A lieber mögen als B“; à la verbindet die beiden.
    language_code: de
    direction: ltr
