templates:
- content_key: practice.de-fr.fr.a1.unit01.lesson01.choose.001
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Das Französische hat zwei Anredeformen: tu für Freunde, Familie und Gleichaltrige, vous für Fremde, in formellen Situationen und für mehrere Personen.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson01.listen.002
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bonjour passt zu jeder Tageszeit und bei jedem; salut sagt man nur zu Menschen, die man duzt.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson01.match.003
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Tu entspricht dem deutschen du, vous dem Sie – oder ihr, wenn man mehrere Personen anspricht: tu für einen Freund, Verwandten oder Gleichaltrigen; vous für Fremde, in formellen Situationen oder für mehrere Personen.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson01.order.004
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: word_order
  frame:
    text: Comment {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Beides sind Arten zu fragen, wie es einem geht: allez-vous ist formell, vas-tu ist informell.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson01.translate.005
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bonjour, merci, oui und non ändern nie ihre Form, Adjektive dagegen schon: fatigué für einen Mann, fatiguée für eine Frau.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson01.translate.006
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: Wie geht es Ihnen?
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Allez-vous ist die formelle Frage; mit einem Freund würden Sie comment vas-tu? fragen.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson01.translate.007
  lesson_content_key: fr.a1.unit01.lesson01.tu_vous_greetings
  type: translation
  frame:
    text: Wie geht es dir?
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Vas-tu ist die informelle Frage, für Freunde und Familie; mit einem Fremden würden Sie comment allez-vous? fragen.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson02.choose.001
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Enchanté sagt ein Mann, enchantée eine Frau; moi c’est + Name ist eine lockere Art, sich vorzustellen.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson02.order.002
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: word_order
  frame:
    text: Bonjour, je m’appelle {name}.
    language_code: fr
    direction: ltr
  slots:
    name: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Bonjour, je m’appelle {name}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m’appelle bedeutet wörtlich „ich nenne mich“; so nennt man im Alltag seinen Namen.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson02.translate.003
  lesson_content_key: fr.a1.unit01.lesson02.names_introductions
  type: translation
  frame:
    text: Ich heiße {name}.
    language_code: de
    direction: ltr
    slot_rendering:
      name: token
  slots:
    name: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Je m’appelle {name}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Je m’appelle verwendet man für sich selbst; um eine andere Person zu fragen, sagt man tu t’appelles comment? oder comment vous appelez-vous?
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson03.choose.001
  lesson_content_key: fr.a1.unit01.lesson03.reading_aloud
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je wird vor einem Vokal zu j’ verkürzt (j’habite), und êtes ist die vous-Form von être, „sein“.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson04.choose.001
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Auf Ça va? antwortet man mit très bien oder pas mal; un peu schwächt einen Zustand ab, wie in un peu fatigué.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson04.match.002
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Fatigué ist männlich und fatiguée weiblich: Das Adjektiv richtet sich nach der Person, die es beschreibt.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson04.fill.003
  lesson_content_key: fr.a1.unit01.lesson04.wellbeing
  type: fill_in_blank
  frame:
    text: Je suis un peu {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ein Mann sagt fatigué, eine Frau fatiguée; beide werden unterschiedlich geschrieben, klingen aber gleich.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson05.listen.001
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ein quartier ist ein ganzes Viertel, eine rue nur eine einzelne Straße; ein atelier ist eine Werkstatt oder ein Workshop.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson05.order.002
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: word_order
  frame:
    text: Je suis de {place}.
    language_code: fr
    direction: ltr
  slots:
    place: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis de {place}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Être de + Ort sagt, woher man kommt; habiter à + Ort sagt, wo man wohnt.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson05.order.003
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: word_order
  frame:
    text: J’habite à {place}.
    language_code: fr
    direction: ltr
  slots:
    place: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: J’habite à {place}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Vor einem Städtenamen steht à: j’habite à Montreuil, j’habite à Saint-Ouen.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit01.lesson05.fill.004
  lesson_content_key: fr.a1.unit01.lesson05.first_meeting_small_talk
  type: fill_in_blank
  frame:
    text: Vous {item} dans le quartier ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bei vous endet das Verb auf -ez: vous habitez; bei tu heißt es tu habites.'
    language_code: de
    direction: ltr
