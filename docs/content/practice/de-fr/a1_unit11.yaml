    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu es {item} samedi ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu es libre ? fragt einen Freund, ob er Zeit hat; samedi braucht keine Präposition.
    language_code: de
    direction: ltr
