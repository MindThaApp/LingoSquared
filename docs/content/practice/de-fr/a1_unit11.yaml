    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Occupé ist maskulin; eine Frau würde occupée schreiben.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit11.lesson01.fill.007
