      direction: ltr
  feedback_frame:
    text: Venir chercher quelqu'un bedeutet „jemanden abholen kommen“; chercher bleibt im Infinitiv.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit11.lesson01.order.005
