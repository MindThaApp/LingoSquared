    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Vendredi soir bedeutet „Freitagabend“; der Wochentag braucht weder Artikel noch Präposition.
    language_code: de
    direction: ltr
