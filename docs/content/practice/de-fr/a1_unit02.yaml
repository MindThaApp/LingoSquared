templates:
- content_key: practice.de-fr.fr.a1.unit02.lesson01.choose.001
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Null bis sechzehn sind einzelne Wörter; siebzehn bis neunzehn werden aus Teilen gebildet, z. B. dix-sept, „zehn-sieben“.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson01.translate.002
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Achten Sie auf die Schreibung: zéro hat einen Akzent, und zusammengesetzte Zahlen wie trente-quatre werden mit Bindestrich geschrieben.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson02.choose.001
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ab siebzig ändert sich das System: soixante-dix ist „sechzig-zehn“ und quatre-vingts ist „vier-zwanzig“.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson02.listen.002
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Null bis sechzehn sind einzelne Wörter, dann bilden vingt, trente und soixante die Zehner; der Rest entsteht durch Kombination.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson02.match.003
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Quatre-vingts hat ein End-s, das aber wegfällt, wenn eine weitere Zahl folgt: quatre-vingt-dix.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson03.choose.001
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Quel âge as-tu? fragt nach dem Alter: Das Französische sagt, man habe so viele Jahre, nicht man sei so viele Jahre alt.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson03.order.002
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: J'ai {n} ans.
    language_code: fr
    direction: ltr
  slots:
    n: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {n} ans.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Das Französische sagt „ich habe so viele Jahre“ (j'ai ... ans), nicht „ich bin so viele“.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson03.fill.003
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: fill_in_blank
  frame:
    text: Quel âge {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quel âge as-tu? ist informell; einen Fremden würden Sie mit quel âge avez-vous? fragen.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson03.translate.004
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: Ich bin {n} Jahre alt.
    language_code: de
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {n} ans.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Für das Alter verwendet das Französische avoir (haben): j''ai vingt-huit ans, wörtlich „ich habe achtundzwanzig Jahre“.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson03.translate.005
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: Wie alt bist du? (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Quel âge as-tu? verwendet tu: nur für Freunde, Familie und Gleichaltrige.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson03.translate.006
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: Wie alt sind Sie? (formell)
    language_code: de
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Quel âge avez-vous? verwendet vous: für Fremde und in höflichen Situationen.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson04.choose.001
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: S'il te plaît ist das informelle „bitte“ und s'il vous plaît das formelle; das Muster entspricht tu und vous.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson04.fill.002
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
  type: fill_in_blank
  frame:
    text: Quel est ton {item} de téléphone ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Ton ist das informelle „dein“; einen Fremden würden Sie fragen: quel est votre numéro de téléphone?'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson05.listen.001
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Œufs ist Plural: Das f von œuf bleibt im Plural stumm, daher klingt œufs anders als der Singular.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson05.match.002
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
