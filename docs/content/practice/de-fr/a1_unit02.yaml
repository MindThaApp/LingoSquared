    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Mengenangaben stehen im Französischen mit de: deux tasses de farine, une demi-tasse de sucre.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson05.order.003
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: word_order
  frame:
    text: J'ai besoin de {n} œufs.
    language_code: fr
    direction: ltr
  slots:
    n: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai besoin de {n} œufs.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avoir besoin de + Nomen bedeutet „brauchen“; die Zahl steht zwischen de und dem Nomen.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson05.translate.004
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Viele dieser Wörter werden nach einer Mengenangabe mit de verwendet, wie in tasses de farine.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit02.lesson06.fill.001
  lesson_content_key: fr.a1.unit02.lesson06.recipe_count_dialogue
