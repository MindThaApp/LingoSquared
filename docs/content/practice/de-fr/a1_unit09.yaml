    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Die tu-Formen tournes, continues und traverses enden auf -es, eine für jeden Schritt der Route.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit09.lesson03.order.004
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: word_order
  frame:
    text: Ensuite, tu continues tout droit et tu {item} la rue.
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Ensuite, tu continues tout droit et tu {item} la rue.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu traverses hat die Endung -es, die zu tu gehört.
    language_code: de
    direction: ltr
