    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Connais ist die tu-Form von connaître und wird verwendet, wenn man einen Ort oder eine Person kennt.
    language_code: de
    direction: ltr
