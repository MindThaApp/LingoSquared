templates:
- content_key: practice.de-fr.fr.a1.unit09.lesson01.choose.001
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: À gauche und à droite bedeuten „links“ und „rechts“ (auch „nach links“ und „nach rechts“); die Nomen gauche und droite sind feminin.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit09.lesson01.listen.002
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Au carrefour: à und le verschmelzen zu au, also „an der Kreuzung“.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit09.lesson01.match.003
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: matching_pairs
