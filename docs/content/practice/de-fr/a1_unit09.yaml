    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Droit bedeutet in tout droit „geradeaus“; gauche und droite stehen für „links“ und „rechts“.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit09.lesson01.order.004
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: word_order
  frame:
    text: Tournez à {item} après la boulangerie.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Tournez à {item} après la boulangerie.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: À gauche und à droite werden mit à gebildet, nicht mit en, wenn man links oder rechts abbiegt.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit09.lesson01.fill.005
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: fill_in_blank
  frame:
    text: Tournez à gauche au {item}. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Au ist die Verschmelzung von à und le, au carrefour heißt also „an der Kreuzung“.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit09.lesson01.translate.006
  lesson_content_key: fr.a1.unit09.lesson01.vocabulaire_directions
  type: translation
  frame:
    text: Der Laden ist an der Straßenecke, rechts.
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: La boutique est au {item} de la rue, à droite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Au coin de la rue bedeutet „an der Straßenecke“.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit09.lesson02.choose.001
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tournez und continuez sind Befehlsformen mit vous, die man Fremden oder mehreren Personen gegenüber verwendet.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit09.lesson02.listen.002
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Jusqu''au bedeutet „bis zum“ (maskulin), zum Beispiel jusqu''au carrefour: „bis zur Kreuzung“.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit09.lesson02.order.003
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: word_order
  frame:
    text: Continuez tout droit {item} carrefour.
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Continuez tout droit {item} carrefour.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Jusqu'au ist jusqu'à plus le und steht vor einem maskulinen Ort.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit09.lesson02.fill.004
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
  type: fill_in_blank
  frame:
    text: Excusez-moi, pour {item} à la boutique, s'il vous plaît ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pour aller à ist die übliche Wendung, um nach dem Weg zu einem Ort zu fragen; s'il vous plaît ist höflich.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit09.lesson02.translate.005
  lesson_content_key: fr.a1.unit09.lesson02.donner_des_indications
