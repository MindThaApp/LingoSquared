  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tournez und continuez sind Befehlsformen mit vous, die man Fremden oder mehreren Personen gegenüber verwendet.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit09.lesson03.choose.001
  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Exactement fragt nach Genauigkeit: elle est où exactement heißt „wo genau ist sie?“.'
    language_code: de
    direction: ltr
