  lesson_content_key: fr.a1.unit09.lesson03.dialogue_chercher_la_boutique
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ensuite bedeutet „dann“ oder „danach“ und verbindet die einzelnen Schritte wegbeschreibender Anweisungen.
    language_code: de
    direction: ltr
