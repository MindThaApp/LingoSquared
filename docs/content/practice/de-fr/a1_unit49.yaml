- content_key: practice.de-fr.fr.a1.unit49.lesson03.fill.003
  lesson_content_key: fr.a1.unit49.lesson03.nerveux_avant_quelque_chose
  type: fill_in_blank
  frame:
    text: Salut Mathieu, tu te sens comment avant ton premier {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
    hint:
      language_code: fr
      part_of_speech: noun
      agreement_tags:
        semantic: w_service
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hallo Mathieu, wie fühlst du dich vor deiner ersten Schicht? Avant ton premier service (vor deiner ersten Schicht) verwendet dasselbe Muster avant + Nomen wie in Lektion 3.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit49.lesson04.order.002
  lesson_content_key: fr.a1.unit49.lesson04.demander_comment_on_se
  type: word_order
  frame:
    text: Comment se {item} Mathieu ?
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_sent
  answer_derivation:
    kind: render_frame
    frame:
      text: Comment se {item} Mathieu ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Wie fühlt sich Mathieu? Se sentir (sich fühlen, reflexiv) ist die übliche Art, nach einem Gefühlszustand zu fragen oder ihn zu beschreiben; es kommt auch in der Einheit zur Gesundheit vor.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit49.lesson05.order.002
  lesson_content_key: fr.a1.unit49.lesson05.lire_un_message_sur
  type: word_order
  frame:
    text: Oui, je {item} aussi.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_pense
  answer_derivation:
    kind: render_frame
    frame:
      text: Oui, je {item} aussi.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ja, ich denke auch. Je pense aussi ist die natürliche Art, der Meinung von jemandem zuzustimmen.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit49.lesson06.order.002
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: word_order
  frame:
    text: Je suis un peu nerveux, {item}.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_honnêtement
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis un peu nerveux, {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ich bin ehrlich gesagt ein bisschen nervös. Honnêtement (ehrlich gesagt) mildert das Eingeständnis ab.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit49.lesson06.fill.003
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: fill_in_blank
  frame:
    text: Ne t'inquiète pas, tu {item} y arriver ! ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
    hint:
      language_code: fr
      part_of_speech: verb
      agreement_tags:
        semantic: w_vas
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mach dir keine Sorgen, du schaffst das gut! Tu vas y arriver (wörtlich „du wirst dort ankommen“) ist ein ermutigender fester Ausdruck; aller + Infinitiv bildet das nahe Futur.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit49.lesson06.translate.004
  lesson_content_key: fr.a1.unit49.lesson06.camille_rassure_mathieu
  type: translation
  frame:
    text: Danke, das hilft mir wirklich.
    language_code: de
    direction: ltr
  slots:
    item:
      language_code: fr
      part_of_speech: adverb
      agreement_tags:
        semantic: w_vraiment
  answer_derivation:
    kind: render_frame
    frame:
      text: Merci, ça m'aide {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Danke, das hilft mir wirklich. Aide ist die il/elle-Form von aider (helfen); m' steht für me.
    language_code: de
    direction: ltr
