  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: translation
  frame:
    text: Gute Idee!
    language_code: de
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Bonne {item} !
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Idée ist feminin, deshalb heißt es bonne und nicht bon.
    language_code: de
    direction: ltr
