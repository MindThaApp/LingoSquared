    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Séance, idée und occasion sind feminine Nomen; temps ist maskulin.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit08.lesson03.order.004
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: word_order
  frame:
    text: Parfait, j'ai le temps de {item} un dessert pour l'occasion.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Parfait, j'ai le temps de {item} un dessert pour l'occasion.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Nach avoir le temps de bleibt das Verb im Infinitiv: préparer.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit08.lesson03.fill.005
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: fill_in_blank
  frame:
    text: C'est {item}, la dernière séance de l'atelier ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: C'est quand ... ? ist eine umgangssprachliche Art zu fragen, wann etwas stattfindet.
    language_code: de
    direction: ltr
