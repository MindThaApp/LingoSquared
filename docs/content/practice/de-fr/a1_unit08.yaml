  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Séance bezeichnet eine Sitzung oder Veranstaltung, etwa eine Workshop-Sitzung oder eine Filmvorführung.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit08.lesson03.match.003
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
