    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Demain und hier sind die Adverbien für „morgen“ und „gestern“; keines von beiden steht mit einer Präposition.
    language_code: de
    direction: ltr
