    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier a lieu le {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'L''atelier a lieu le samedi bedeutet: Der Workshop findet samstags statt.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit08.lesson02.choose.001
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Premier ist die Ordnungszahl nur für den ersten Tag; alle anderen Daten verwenden Grundzahlen: le premier mars, le quinze mars.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit08.lesson02.listen.002
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mars ist ein Monat; französische Monatsnamen werden wie die Wochentage kleingeschrieben.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit08.lesson02.order.003
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: word_order
  frame:
    text: Nous sommes le quinze {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Nous sommes le quinze {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Daten folgen dem Muster le + Zahl + Monat: le quinze mars.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit08.lesson02.fill.004
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: fill_in_blank
  frame:
    text: L'atelier se {item} le vingt-deux mars. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se termine ist die reflexive Form und bedeutet „endet“.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit08.lesson02.translate.005
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: translation
  frame:
    text: Welches Datum ist heute?
    language_code: de
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Quelle est la {item} aujourd'hui ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quelle est la date aujourd'hui ist die übliche Frage nach dem Kalenderdatum.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit08.lesson02.translate.006
  lesson_content_key: fr.a1.unit08.lesson02.donner_la_date
  type: translation
  frame:
    text: Es ist der fünfzehnte März. (Beginnen Sie mit c'est)
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est le quinze {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Im Französischen stehen bei Daten Grundzahlen; der Fünfzehnte heißt also einfach quinze.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit08.lesson03.choose.001
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Quand fragt nach dem Zeitpunkt („wann“); donc („also, deshalb“) knüpft eine Schlussfolgerung an das eben Gesagte an.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit08.lesson03.listen.002
  lesson_content_key: fr.a1.unit08.lesson03.dialogue_derniere_seance
