templates:
- content_key: practice.de-fr.fr.a1.unit14.lesson01.choose.001
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Meilleur ist der unregelmäßige Komparativ von bon: Man sagt meilleur, niemals plus bon.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson01.listen.002
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Difficile und facile haben für Maskulinum und Femininum dieselbe Form.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson01.order.004
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: word_order
  frame:
    text: Moi, je trouve {item} aussi bon.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Moi, je trouve {item} aussi bon.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: L'autre bedeutet „der/die/das andere“; aussi bon bedeutet „genauso gut“.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson01.fill.006
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: fill_in_blank
  frame:
    text: Cette recette est moins {item} que l'autre. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Difficile verändert sich im Femininum nicht, deshalb passt es zu recette.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson01.fill.007
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: fill_in_blank
  frame:
    text: Ce gâteau est {item} que le premier. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Meilleur que bedeutet „besser als“; es ersetzt plus bon.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson01.translate.008
  lesson_content_key: fr.a1.unit14.lesson01.vocabulaire_comparaisons
  type: translation
  frame:
    text: Dieser Käse ist teurer als der andere.
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ce fromage est plus cher que {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Que leitet den zweiten Teil eines Vergleichs ein; l'autre steht für den anderen Käse.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson02.choose.001
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Irrégulier bedeutet, dass die Form nicht dem normalen Muster folgt, wie bei meilleur.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson02.listen.002
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Adjectif und irrégulier ähneln den deutschen Wörtern Adjektiv und irregulär.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson02.order.003
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: word_order
  frame:
    text: Comparons les prix avant {item}.
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Comparons les prix avant {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avant de plus Infinitiv bedeutet „bevor man etwas tut“.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson02.fill.004
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: fill_in_blank
  frame:
    text: La quiche est moins {item} que la tarte. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Chère erhält das weibliche -e, um sich an quiche anzugleichen; bei einem maskulinen Nomen heißt es cher: le fromage est moins cher.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson02.translate.005
  lesson_content_key: fr.a1.unit14.lesson02.superlatifs
  type: translation
  frame:
    text: Es ist das günstigste Rezept.
    language_code: de
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est la recette la moins {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: La moins chère besteht aus la moins plus einem femininen Adjektiv.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson03.choose.001
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Celui-ci bedeutet „dieser hier“ und celui-là „der da“, beide maskulin.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson03.listen.002
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Celui-ci und celui-là unterscheiden sich nur durch -ci und -là, „hier“ und „da“.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson03.order.004
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: word_order
  frame:
    text: Lequel on {item} ?
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Lequel on {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Lequel on prend ? ist umgangssprachlich: lequel fragt „welcher“ und on bedeutet „wir“.'
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson03.fill.006
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: fill_in_blank
  frame:
    text: Il y a deux {item} de fromage. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sortes steht nach deux im Plural und wird von de gefolgt.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson03.fill.007
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: fill_in_blank
  frame:
    text: Il nous {item} plus d'argent pour le dessert. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Il nous reste bedeutet „uns bleibt/wir haben noch übrig“; reste ist hier unpersönlich.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson03.translate.008
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: translation
  frame:
    text: Dann nehmen wir den da; er ist die beste Option für den Workshop. (on verwenden)
    language_code: de
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Alors on prend {item}, c'est la meilleure option pour l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Celui-là bedeutet „der da“; meilleure ist feminin, weil option feminin ist.
    language_code: de
    direction: ltr
- content_key: practice.de-fr.fr.a1.unit14.lesson03.translate.009
  lesson_content_key: fr.a1.unit14.lesson03.dialogue_comparer_fromages
  type: translation
  frame:
    text: Das stimmt.
    language_code: de
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: C'est vrai ist eine gängige Art zuzustimmen.
    language_code: de
    direction: ltr
