    part_of_speech:
    - noun
    - verb
    agreement_tags:
      semantic:
      - hotel_word
      - stay_verb
  dialogue_word: &id002
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: dialogue_word
