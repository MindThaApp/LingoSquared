  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: En la conversación sobre el parque para perros aparecen dog, park, space y el verbo run.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit26.lesson02.listen.008
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
