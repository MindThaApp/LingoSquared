        - w_other
        - w_hand
        - w_agree
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Opinion se escribe con una sola n en medio y termina en -ion; agree se escribe con dos e.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit26.lesson01.translate.006
  lesson_content_key: en.a2.unit26.lesson01.opinion_phrases
  type: translation
  frame:
    text: En mi opinión, el nuevo parque para perros es una buena idea porque los perros necesitan espacio para correr.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_opinion
  answer_derivation:
    kind: render_frame
    frame:
      text: In my {item}, the new dog park is a good idea because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: In my opinion va al principio de la frase y se separa del resto con una coma.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit26.lesson02.choose.007
