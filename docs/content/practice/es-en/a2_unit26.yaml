        - w_idea
        - w_good
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Escucha las vocales: en dog la vocal es corta, en park es larga, y allí la r se oye claramente.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit26.lesson02.order.009
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: word_order
  frame:
    text: What do you think {item} the new dog park?
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_about
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you think {item} the new dog park?
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Después de think se indica el tema con about: What do you think about …? Equivale a «¿Qué opinas de …?»'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit26.lesson02.fill.010
