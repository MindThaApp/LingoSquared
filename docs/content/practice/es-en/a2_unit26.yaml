- content_key: practice.es-en.en.a2.unit26.lesson03.translate.017
  lesson_content_key: en.a2.unit26.lesson03.reading_a_written_opinion
  type: translation
  frame:
    text: Por otro lado, está muy cerca del área de juegos. (usa la contracción it's)
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_playground
  answer_derivation:
