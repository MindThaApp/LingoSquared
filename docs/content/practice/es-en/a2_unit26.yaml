    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_good
    hint:
      language_code: en
      part_of_speech: adjective
      agreement_tags:
        semantic: w_good
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A good idea lleva el artículo a delante del sustantivo; good pasa a better, no a gooder.
    language_code: es
    direction: ltr
