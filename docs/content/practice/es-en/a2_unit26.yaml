    text: El plural dogs se forma simplemente con -s; space significa aquí «espacio» en el sentido de lugar libre.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit26.lesson02.translate.012
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: ¿Qué opinas del nuevo parque para perros? (con «think»)
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_park
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you think about the new dog {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: «¿Qué opinas de …?» se dice en inglés What do you think about …?
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit26.lesson02.translate.013
  lesson_content_key: en.a2.unit26.lesson02.giving_an_opinion_with_a_reason
  type: translation
  frame:
    text: Creo que es una buena idea porque los perros necesitan espacio para correr.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_idea
  answer_derivation:
    kind: render_frame
    frame:
      text: I think it's a good {item} because dogs need space to run.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Para decir «creo que» usa I think; la razón se añade con because.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit26.lesson03.choose.014
