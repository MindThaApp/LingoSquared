  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Grandmother y grandfather se forman con grand- y mother o father; en español equivale a «abuela» y «abuelo» (no se forman igual).
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit06.lesson03.choose.004
  lesson_content_key: en.a1.unit06.lesson03.describing_family
