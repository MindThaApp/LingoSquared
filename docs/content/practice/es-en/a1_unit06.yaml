  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Child es el singular y children el plural; brothers es el plural de brother.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit06.lesson04.choose.005
