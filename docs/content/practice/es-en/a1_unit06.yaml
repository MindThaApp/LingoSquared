    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Who pregunta por una persona: Who is this? Para cosas se usa what.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit06.lesson02.order.006
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
  type: word_order
  frame:
    text: This is {item} sister.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: This is {item} sister.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'His se refiere a un hombre y her a una mujer: his sister es la hermana de un hombre y her sister la de una mujer.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit06.lesson03.order.007
  lesson_content_key: en.a1.unit06.lesson03.describing_family
