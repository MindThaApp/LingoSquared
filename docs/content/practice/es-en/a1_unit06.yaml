  frame:
    text: I have two {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: I have two {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Después del número two el inglés usa el plural: two brothers, no two brother.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit06.lesson04.order.008
