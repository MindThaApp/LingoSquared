templates:
- content_key: practice.es-en.en.a1.unit06.lesson01.choose.001
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Parents y siblings van en plural en inglés; en lugar del singular sibling, en el día a día se suele decir brother o sister.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit06.lesson01.listen.002
  lesson_content_key: en.a1.unit06.lesson01.immediate_family
