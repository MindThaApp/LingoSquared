    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Las palabras mother, father y brother contienen el sonido th, que se pronuncia con la punta de la lengua entre los dientes.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit06.lesson02.choose.003
  lesson_content_key: en.a1.unit06.lesson02.extended_family_possessives
