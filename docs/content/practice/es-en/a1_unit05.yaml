    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Con la parte del día night se dice at night y no in the night; con morning, afternoon y evening, en cambio, in the.
    language_code: es
    direction: ltr
