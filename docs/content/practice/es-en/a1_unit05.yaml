templates:
- content_key: practice.es-en.en.a1.unit05.lesson01.choose.001
  lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Para la hora en punto se dice It's three o'clock; para la media se usa half past, literalmente «media pasadas».
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit05.lesson01.listen.002
  lesson_content_key: en.a1.unit05.lesson01.oclock_and_half
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Half past three significa las 3:30, es decir, «las tres y media»; el inglés cuenta desde la última hora completa, igual que el español.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit05.lesson03.choose.003
  lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Delante de una hora va at y delante de una parte del día va in: at nine, in the morning.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit05.lesson03.listen.004
  lesson_content_key: en.a1.unit05.lesson03.day_parts_schedules
  type: listen_select
