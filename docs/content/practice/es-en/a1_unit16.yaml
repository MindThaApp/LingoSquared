schema_version: '1.0'
pack_key: practice.es-en.a1.unit16
source_language: es
target_language: en
unit_content_key: en.a1.unit16.routines
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.de-en by scripts/derive_direction.py (templates, slots and tags unchanged; frame/feedback text translated to Spanish). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_after
    - w_bed
    - w_breakfast
    - w_day
    - w_dinner
    - w_every
    - w_morning
    - w_time
    - w_usually
templates:
- content_key: practice.es-en.en.a1.unit16.lesson01.choose.001
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic:
        - w_dinner
        - w_bed
        - w_breakfast
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En inglés las comidas van sin artículo: have breakfast, have dinner. Con go to bed tampoco hay artículo.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit16.lesson02.choose.002
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - adjective
      - adverb
      - preposition
      agreement_tags:
        semantic:
        - w_usually
        - w_every
        - w_after
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Usually, every y after van antes del verbo o al principio de una expresión de tiempo: I usually go, every day, after that.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit16.lesson01.order.003
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: word_order
  frame:
    text: I have {item} at seven.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic:
        - w_breakfast
        - w_dinner
  answer_derivation:
    kind: render_frame
    frame:
      text: I have {item} at seven.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Delante de breakfast y dinner no hay artículo: I have breakfast, no I have a breakfast.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit16.lesson02.order.004
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: word_order
  frame:
    text: I {item} go to bed at eleven.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_usually
  answer_derivation:
    kind: render_frame
    frame:
      text: I {item} go to bed at eleven.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Usually va antes del verbo principal go; no se puede copiar el orden libre del español «Me acuesto normalmente...».
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit16.lesson02.fill.005
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: fill_in_blank
  frame:
    text: I {item} go to bed at eleven. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    hint: &id001
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_usually
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Usually (normalmente) va entre el sujeto y el verbo principal: I usually go.'
    language_code: es
    direction: ltr
