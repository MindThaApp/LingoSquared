- content_key: practice.es-en.en.a1.unit16.lesson02.translate.007
  lesson_content_key: en.a1.unit16.lesson02.routine_with_times
  type: translation
  frame:
    text: Normalmente me acuesto a las once.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_usually
  answer_derivation:
    kind: render_frame
    frame:
      text: I {item} go to bed at eleven.
      language_code: en
      direction: ltr
  feedback_frame:
