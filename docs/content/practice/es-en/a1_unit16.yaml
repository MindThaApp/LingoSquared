- content_key: practice.es-en.en.a1.unit16.lesson04.translate.008
  lesson_content_key: en.a1.unit16.lesson04.routine_dialogue
  type: translation
  frame:
    text: ¿Qué haces después?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: preposition
      agreement_tags:
        semantic: w_after
  answer_derivation:
    kind: render_frame
    frame:
      text: What do you do {item} that?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Con after that preguntas por lo que viene después de algo; la pregunta necesita do.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit16.lesson01.match.009
  lesson_content_key: en.a1.unit16.lesson01.routine_verbs
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slot_relations:
  - kind: distinct
    slots: &id004
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  slots:
    first: &id003
      language_code: en
      part_of_speech:
      - adverb
      - noun
      - preposition
      agreement_tags:
        semantic:
        - w_dinner
        - w_bed
        - w_breakfast
        - w_usually
        - w_after
        - w_morning
        - w_day
        - w_time
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  answer_derivation:
    kind: matching_pairs
    slots: *id004
  feedback_frame:
    text: 'Las palabras de este juego pertenecen a la rutina diaria: comidas (breakfast, dinner), expresiones de tiempo (morning, day, time, after) y usually.'
    language_code: es
    direction: ltr
