  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: word_order
  frame:
    text: It's just two {item} from here.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: It's just two {item} from here.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Minutes es el plural de minute; después del número two va el plural.
    language_code: es
    direction: ltr
