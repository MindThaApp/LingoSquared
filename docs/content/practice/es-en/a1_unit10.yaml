  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: At the corner significa «en la esquina»; con at indicas el punto donde giras.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit10.lesson02.fill.008
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
  type: fill_in_blank
  frame:
    text: You can't {item} it. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Miss significa aquí «no ver» o «pasar de largo»; You can't miss it es una expresión habitual cuando el lugar se ve bien.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit10.lesson02.fill.009
  lesson_content_key: en.a1.unit10.lesson02.asking_how_to_get
