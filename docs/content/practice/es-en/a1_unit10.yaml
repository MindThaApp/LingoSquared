    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Get to significa «llegar a»; How do I get to ...? es la pregunta habitual para pedir indicaciones.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit10.lesson03.fill.010
