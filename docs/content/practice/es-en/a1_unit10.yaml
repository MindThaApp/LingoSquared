templates:
- content_key: practice.es-en.en.a1.unit10.lesson01.choose.001
  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Turn left y turn right son imperativos sin you; en español equivale a «gire a la izquierda».
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit10.lesson02.choose.002
