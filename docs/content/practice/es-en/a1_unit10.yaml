  lesson_content_key: en.a1.unit10.lesson01.basic_direction_words
  type: word_order
  frame:
    text: Turn {item} at the corner.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Turn {item} at the corner.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Left y right van sin artículo después de Turn; con on the delante describen en cambio un lado: on the left.'
    language_code: es
    direction: ltr
