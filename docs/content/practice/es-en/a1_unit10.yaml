    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Can't es la forma corta de cannot; You can't miss it significa que es imposible no ver el lugar.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit10.lesson03.choose.003
