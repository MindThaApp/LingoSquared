  answer_derivation:
    kind: render_frame
    frame:
      text: Take the {item} street on the left.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Los ordinales como first y second van con the delante del sustantivo: the first street, the second street.'
    language_code: es
    direction: ltr
