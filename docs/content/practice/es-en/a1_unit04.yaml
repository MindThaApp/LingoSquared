templates:
- content_key: practice.es-en.en.a1.unit04.lesson01.choose.001
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En inglés los días de la semana siempre se escriben con mayúscula: Monday, Tuesday, Wednesday.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit04.lesson01.listen.002
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Todos los días de la semana terminan en -day: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday y Sunday.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit04.lesson02.choose.003
  lesson_content_key: en.a1.unit04.lesson02.months
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Los nombres de los meses también se escriben con mayúscula en inglés: January, March, July.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit04.lesson02.listen.004
  lesson_content_key: en.a1.unit04.lesson02.months
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Muchos nombres de meses en inglés se parecen a los españoles, pero el acento suele caer en otra sílaba; escucha con atención la sílaba tónica.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit04.lesson03.choose.005
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En las fechas, el inglés usa números ordinales: July 7th. Con when''s preguntas cuándo ocurre algo, por ejemplo When''s your birthday?'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit04.lesson04.choose.006
  lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Open puede significar «abrir» o «estar abierto», como en When's the library open again?
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit04.lesson02.order.007
  lesson_content_key: en.a1.unit04.lesson02.months
  type: word_order
  frame:
    text: Which {item} is it?
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Which {item} is it?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Which pregunta por una elección dentro de un conjunto limitado, aquí los doce meses.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit04.lesson03.order.008
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: word_order
  frame:
    text: My birthday is {item} 3rd.
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: My birthday is {item} 3rd.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'En las fechas, el inglés pone primero el mes y luego el día: March 3rd; en español, en cambio, se dice «3 de marzo».'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit04.lesson01.fill.009
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: fill_in_blank
  frame:
    text: What day is it {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Con what day preguntas por el día de la semana y con what's today's date por la fecha.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit04.lesson03.fill.010
  lesson_content_key: en.a1.unit04.lesson03.calendar_dates
  type: fill_in_blank
  frame:
    text: When's your {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: When's es la forma corta de When is; sirve para preguntar por un momento.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit04.lesson04.order.011
  lesson_content_key: en.a1.unit04.lesson04.appointment_dialogue
  type: word_order
  frame:
    text: It opens on {item}, July 9th.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: It opens on {item}, July 9th.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Delante de un día de la semana o de una fecha va on: on Thursday, on July 9th.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit04.lesson01.match.012
  lesson_content_key: en.a1.unit04.lesson01.weekdays
  type: matching_pairs
