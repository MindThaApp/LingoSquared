    slot: item
  feedback_frame:
    text: 'Coffee y tea se usan mucho con a al pedir en inglés: I''d like a coffee, please.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit07.lesson02.choose.003
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Anything else? es la pregunta habitual en una cafetería después de pedir; puedes responder, por ejemplo, No, that's all.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit07.lesson02.listen.004
  lesson_content_key: en.a1.unit07.lesson02.ordering_phrases
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Please hace la petición más educada y suele ir al final de la frase: I''d like a coffee, please.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit07.lesson04.choose.005
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sure significa aquí «claro» o «con gusto»; con Sure. Anything else? el camarero confirma el pedido amablemente y pregunta si quieres algo más.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit07.lesson03.choose.006
  lesson_content_key: en.a1.unit07.lesson03.reading_a_menu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Menu es la carta en inglés, no el «menú» como plato fijo; el importe que aparece en la carta se llama price.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit07.lesson02.order.007
