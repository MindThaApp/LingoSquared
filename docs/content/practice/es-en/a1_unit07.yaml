  answer_derivation:
    kind: render_frame
    frame:
      text: For {item} or to go?
      language_code: en
      direction: ltr
  feedback_frame:
    text: For here or to go? pregunta si comes en la cafetería o te llevas la comida; here significa «aquí».
    language_code: es
    direction: ltr
