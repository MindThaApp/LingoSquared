templates:
- content_key: practice.es-en.en.a1.unit07.lesson01.choose.001
  lesson_content_key: en.a1.unit07.lesson01.food_drink_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
