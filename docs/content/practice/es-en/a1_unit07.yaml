  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Water y bread son sustantivos no contables: en inglés se dice some water, pero a coffee o a sandwich para una ración.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit07.lesson01.listen.002
