    text: Anything {item}?
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Anything {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: Else significa «más»; Anything else? pregunta si quieres algo más.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit07.lesson04.order.008
  lesson_content_key: en.a1.unit07.lesson04.cafe_dialogue
  type: word_order
  frame:
    text: For {item} or to go?
    language_code: en
    direction: ltr
  slots:
