    text: Los días de la semana como Monday se escriben siempre con mayúscula en inglés, a diferencia del español, donde van en minúscula.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit30.lesson02.translate.010
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: translation
  frame:
    text: Tengo dos años de experiencia en marketing de redes sociales. (escribe el número con letras)
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_two
  answer_derivation:
    kind: render_frame
    frame:
      text: I have {item} years of experience in social media marketing.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Después de two, years va en plural. Con of experience in indicas el área.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit30.lesson02.translate.011
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: translation
  frame:
    text: Una de mis fortalezas es ser organizado.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_being
  answer_derivation:
    kind: render_frame
    frame:
      text: One of my strengths is {item} organized.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Después de is va being, la forma -ing de be; en español se usa el infinitivo: «es ser organizado». Ejemplo: One of my strengths is being organized.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit30.lesson03.choose.012
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
