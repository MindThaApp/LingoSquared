- content_key: practice.es-en.en.a2.unit30.lesson01.translate.005
  lesson_content_key: en.a2.unit30.lesson01.interview_vocabulary
  type: translation
  frame:
    text: El entrevistador me preguntó por mi disponibilidad.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_availability
  answer_derivation:
    kind: render_frame
    frame:
      text: The interviewer asked about my {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Availability es la «disponibilidad»: el periodo en el que puedes empezar o trabajar. Asked about significa «preguntó por».'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit30.lesson02.choose.006
  lesson_content_key: en.a2.unit30.lesson02.talking_about_experience_and_availability
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - adjective
      agreement_tags:
