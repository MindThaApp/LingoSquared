- content_key: practice.es-en.en.a2.unit30.lesson03.translate.016
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: translation
  frame:
    text: Bright Path Marketing busca un coordinador de marketing. (forma continua)
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_looking
  answer_derivation:
    kind: render_frame
    frame:
      text: Bright Path Marketing is {item} for a marketing coordinator.
      language_code: en
      direction: ltr
  feedback_frame:
    text: La forma continua is looking for corresponde al «busca» del español. La preposición for forma parte de look for.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit30.lesson03.translate.017
  lesson_content_key: en.a2.unit30.lesson03.reading_a_job_posting
  type: translation
  frame:
    text: Cumplo con mis plazos y trabajo bien en equipo. (sin contracciones)
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: adverb
      agreement_tags:
        semantic: w_well
  answer_derivation:
    kind: render_frame
    frame:
      text: I meet deadlines, and I work {item} in a team.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Well es el adverbio de good: I work well. Después de work no va un adjetivo.'
    language_code: es
    direction: ltr
