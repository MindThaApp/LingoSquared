  frame:
    text: The class is {item} over. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Almost significa «casi»; almost over quiere decir que algo terminará pronto.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson03.fill.011
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
  type: fill_in_blank
  frame:
