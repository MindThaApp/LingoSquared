templates:
- content_key: practice.es-en.en.a1.unit13.lesson01.choose.001
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Después de I''m el sentimiento va como adjetivo: I''m happy, I''m tired; no necesitas un verbo propio como «alegrarse» en español.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson02.choose.002
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Because introduce un motivo y mantiene el orden normal de la frase en inglés: I''m happy because the class is almost over.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson03.choose.003
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Last significa aquí «último»; en la frase it's the last one this year es el último examen del año.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson04.choose.004
  lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Oh, I understand muestra que has entendido y que te importa.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson01.order.005
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: word_order
  frame:
    text: I'm {item} today.
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item} today.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Después de I''m el adjetivo va sin artículo: I''m happy, I''m sad.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson03.order.006
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
  type: word_order
  frame:
    text: The {item} is worried and excited.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: The {item} is worried and excited.
      language_code: en
      direction: ltr
  feedback_frame:
    text: The writer es la persona que ha escrito el mensaje; el resumen va en tercera persona con is.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson04.order.007
  lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
  type: word_order
  frame:
    text: Oh, I {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Oh, I {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I understand significa «entiendo»; understand no se usa en forma continua.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson01.fill.008
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: fill_in_blank
  frame:
    text: I'm {item}. I have a big test tomorrow. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Worried significa preocupado; la causa viene en la frase siguiente o después de because.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson02.fill.009
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
