    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I'm es la forma corta de I am; tired describe el estado.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson02.translate.017
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
