    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Happy, sad, tired, excited y worried son sentimientos; test, class y year forman parte de los motivos en los ejemplos.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson01.translate.013
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Después de I'm los sentimientos van como adjetivo, por ejemplo I'm tired.
    language_code: es
    direction: ltr
