    language_code: es
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm a {item} worried.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'A little delante de un adjetivo suaviza el sentimiento: a little worried.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson04.translate.018
  lesson_content_key: en.a1.unit13.lesson04.feelings_check_dialogue
  type: translation
  frame:
    text: Ah, entiendo.
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Oh, I {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Oh al principio de la frase expresa comprensión o sorpresa; understand no lleva -s después de I.
    language_code: es
    direction: ltr
