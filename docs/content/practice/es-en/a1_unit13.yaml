  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Test y class significan «examen» y «clase»; almost significa «casi».
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson03.translate.015
  lesson_content_key: en.a1.unit13.lesson03.reading_a_message
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Writer es la persona que escribe; en el ejemplo es quien ha enviado el mensaje.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson01.translate.016
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: translation
  frame:
