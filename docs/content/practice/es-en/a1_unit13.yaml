      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Because introduce el motivo; en inglés el orden de la frase sigue siendo el de una oración principal.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson02.fill.010
  lesson_content_key: en.a1.unit13.lesson02.expressing_feelings_with_reasons
