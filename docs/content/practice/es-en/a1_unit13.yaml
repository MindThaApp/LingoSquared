      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Last significa aquí «último»; the last one this year es el último examen de este año.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit13.lesson01.match.012
  lesson_content_key: en.a1.unit13.lesson01.feeling_words
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
