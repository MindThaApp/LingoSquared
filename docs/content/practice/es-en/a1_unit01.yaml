templates:
- content_key: practice.es-en.en.a1.unit01.lesson01.choose.001
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En inglés no hay un saludo que valga para todo el día: eliges *good morning*, *good afternoon* o *good evening* según la hora.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson01.listen.002
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hello es el saludo neutro; good morning, good afternoon y good evening dependen de la hora del día.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson03.choose.003
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: How are you? es la pregunta habitual para saber cómo está alguien; suena igual con amigos que con desconocidos, no hay distinción entre tú y usted.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson03.listen.004
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Después de I'm fine, thanks. suele venir And you? para devolver la pregunta; not bad es una respuesta informal y reservada.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson05.choose.005
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Nice to meet you se dice la primera vez que conoces a alguien, y la respuesta es Nice to meet you too.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson05.listen.006
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: See you later se dice cuando vas a ver a la persona más tarde ese mismo día.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson01.order.007
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: word_order
  frame:
    text: Good {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Good {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'El saludo depende de la hora: morning hasta cerca del mediodía, afternoon después y evening al caer la tarde.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson01.match.008
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Thanks es la forma corta e informal de «gracias»; fine y bad describen cómo estás.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson03.fill.009
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: fill_in_blank
  frame:
    text: How are {item}? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: En inglés you significa tanto «tú» como «usted», así que la pregunta How are you? es la misma en cualquier situación.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson03.fill.010
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: fill_in_blank
  frame:
    text: Not {item}, thanks. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Not bad significa literalmente «no está mal» y es una respuesta modesta muy habitual a la pregunta sobre cómo estás.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson03.order.011
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: word_order
  frame:
    text: I'm {item}, thanks.
    language_code: en
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: I'm {item}, thanks.
      language_code: en
      direction: ltr
  feedback_frame:
    text: I'm es la forma corta de I am; con fine o good respondes a How are you?
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson05.order.012
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: word_order
  frame:
    text: See you {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: See you {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: See you later es literalmente «nos vemos más tarde» y significa hasta luego.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson05.fill.013
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: fill_in_blank
  frame:
    text: Nice to meet you {item}. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Too va al final de la frase y significa «también»; así correspondes al saludo Nice to meet you.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson01.translate.014
  lesson_content_key: en.a1.unit01.lesson01.everyday_greetings
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: El saludo y la despedida en inglés dependen de la hora del día; Goodbye es la despedida neutra.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson03.translate.015
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'La palabra not niega lo que viene después: not bad significa «no está mal», y thanks es la forma informal de «gracias».'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson03.translate.016
  lesson_content_key: en.a1.unit01.lesson03.wellbeing
  type: translation
  frame:
    text: ¿Cómo estás? (informal)
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: How are {item}?
      language_code: en
      direction: ltr
  feedback_frame:
    text: En inglés solo hay un you para «tú» y «usted», así que la frase sirve en ambos registros.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson05.translate.017
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: translation
  frame:
    text: Hasta luego.
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: See you {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Con See you, la palabra para «más tarde» se convierte en la despedida «hasta luego».
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a1.unit01.lesson05.translate.018
  lesson_content_key: en.a1.unit01.lesson05.noun_phrases_and_closings
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: El verbo meet significa conocer o encontrarse con alguien; have a good day es un deseo amable de despedida.
    language_code: es
    direction: ltr
