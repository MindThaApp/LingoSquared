  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived 2026-11-15 from practice.nl-en a1 unit45 by remapping the nl-en unit semantic tags to
    the es-en lexeme tags (en_a1_u45, en_a1_u45_lNN) and translating the Spanish frame/feedback strings.
    Slot pools, templates and answer derivations unchanged. Needs native Spanish review of the feedback
    strings.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - en_a1_u45
    - en_a1_u45_l03
    - en_a1_u45_l04
slot_presets:
  unit_word:
    language_code: en
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
