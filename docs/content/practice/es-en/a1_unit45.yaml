  lesson_content_key: en.a1.unit45.lesson01.emergency_vocabulary
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - symbol
      - noun
      - proper_noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
      agreement_tags:
        semantic: en_a1_u45
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Elige el significado de {item}.
    language_code: es
    direction: ltr
