    slot: item
  feedback_frame:
    text: '*Stop taking* significa «dejar de tomar»; después de *stop* aquí va la forma con -ing.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit35.lesson02.order.011
  lesson_content_key: en.a2.unit35.lesson02.asking_at_the_counter
  type: word_order
  frame:
