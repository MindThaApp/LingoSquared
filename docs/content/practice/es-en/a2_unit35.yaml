    text: 'En las preguntas con *there*, *are* va al principio: *Are there any side effects?*, en español «¿Tiene...?» o «¿Hay...?».'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit35.lesson02.fill.012
