    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_pick
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like to {item} up a prescription.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*Pick up* significa «recoger»; *I''d like to* es la forma educada de «quisiera».'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit35.lesson02.translate.015
  lesson_content_key: en.a2.unit35.lesson02.asking_at_the_counter
  type: translation
  frame:
    text: No deberías dejarlo antes de tiempo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: verb
      agreement_tags:
        semantic: w_shouldn't
  answer_derivation:
    kind: render_frame
    frame:
      text: You {item} stop early.
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*Shouldn''t* es la forma corta de *should not* y significa «no debería». En inglés, después va el verbo en forma base, sin *to*.'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit35.lesson02.translate.016
  lesson_content_key: en.a2.unit35.lesson02.asking_at_the_counter
  type: translation
  frame:
    text: ¿Tiene efectos secundarios?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_side
  answer_derivation:
    kind: render_frame
    frame:
      text: Are there any {item} effects?
      language_code: en
      direction: ltr
  feedback_frame:
    text: '*Side effects* son los efectos secundarios; *side* va antes de *effects*.'
    language_code: es
    direction: ltr
