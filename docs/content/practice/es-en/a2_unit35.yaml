    direction: ltr
- content_key: practice.es-en.en.a2.unit35.lesson02.choose.008
  lesson_content_key: en.a2.unit35.lesson02.asking_at_the_counter
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech:
      - noun
      - verb
      agreement_tags:
        semantic:
        - w_food
        - w_stop
        - w_pick
        - w_pharmacy
        - w_tablet
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '*Food* es la comida; *take it with food* significa «tómalo con comida». *Pick up* significa aquí «recoger».'
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit35.lesson02.order.009
  lesson_content_key: en.a2.unit35.lesson02.asking_at_the_counter
