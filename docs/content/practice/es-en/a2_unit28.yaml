- content_key: practice.es-en.en.a2.unit28.lesson02.translate.012
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: Me gustaría pedir una cita para ver a un médico, por favor. (usa la contracción I'd)
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_doctor
  answer_derivation:
    kind: render_frame
    frame:
      text: I'd like to make an appointment to see a {item}, please.
      language_code: en
      direction: ltr
  feedback_frame:
    text: Pedir una cita se dice make an appointment; I'd like to es la forma cortés de expresar un deseo.
    language_code: es
    direction: ltr
- content_key: practice.es-en.en.a2.unit28.lesson02.translate.013
  lesson_content_key: en.a2.unit28.lesson02.calling_to_make_an_appointment
  type: translation
  frame:
    text: Tengo dolor de cabeza y de garganta desde hace tres días, y está empeorando. (usa contracciones)
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: en
      part_of_speech: noun
      agreement_tags:
        semantic: w_three
  answer_derivation:
    kind: render_frame
    frame:
      text: I've had a headache and a sore throat for {item} days, and it's getting worse.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'For indica la duración («desde hace tres días»); con ella va el present perfect: I''ve had.'
    language_code: es
    direction: ltr
