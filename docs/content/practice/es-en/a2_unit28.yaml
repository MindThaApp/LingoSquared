      agreement_tags:
        semantic: w_had
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Con I''ve had describes molestias que continúan hasta ahora: el present perfect con for three days.'
    language_code: es
    direction: ltr
