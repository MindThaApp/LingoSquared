  lesson_content_key: pl.a1.unit62.lesson02.powiesc_i_tytul
  type: fill_in_blank
  frame:
    text: Szukam {item} z tytułem. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_powieści
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_powieści
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Я ищу роман с названием. powieści означает «романа».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit62.lesson03.order.002
  lesson_content_key: pl.a1.unit62.lesson03.autor_i_pracownik
  type: word_order
  frame:
    text: Autor jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_znany
  answer_derivation:
    kind: render_frame
    frame:
      text: Autor jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Автор известен. znany означает «известный» (м. р.).
    language_code: ru
    direction: ltr
