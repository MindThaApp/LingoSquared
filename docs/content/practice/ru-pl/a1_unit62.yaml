schema_version: '1.0'
pack_key: practice.ru-pl.a1.unit62
source_language: ru
target_language: pl
unit_content_key: pl.a1.unit62.ksiegarnia
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_autor
    - w_interesująca
    - w_książeczka
    - w_książeczki
    - w_książka
    - w_książki
    - w_księgarnia
    - w_popularna
    - w_powieści
    - w_powieść
    - w_sklepu
    - w_szukam
    - w_tytuł
    - w_tytułem
    - w_zakładka
    - w_zakładką
    - w_znany
    - w_zoologicznego
templates:
- content_key: practice.ru-pl.pl.a1.unit62.lesson01.choose.001
  lesson_content_key: pl.a1.unit62.lesson01.pojdziemy_do_ksiegarni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_księgarnia
        - w_książka
        - w_powieść
        - w_szukam
        - w_powieści
        - w_tytuł
        - w_tytułem
        - w_autor
        - w_znany
        - w_książeczka
        - w_książki
        - w_popularna
        - w_książeczki
        - w_zakładka
        - w_zakładką
        - w_interesująca
        - w_sklepu
        - w_zoologicznego
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — слово этого урока, из темы «Пойдём в книжный магазин?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit62.lesson02.listen.001
  lesson_content_key: pl.a1.unit62.lesson02.powiesc_i_tytul
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого модуля, из урока о романе и названии.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit62.lesson03.translate.001
  lesson_content_key: pl.a1.unit62.lesson03.autor_i_pracownik
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого модуля, из урока о писателе и сотруднике.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit62.lesson04.match.001
  lesson_content_key: pl.a1.unit62.lesson04.ceny_w_ksiegarni
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Подбери к каждому польскому слову его русское значение; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit62.lesson05.choose.001
  lesson_content_key: pl.a1.unit62.lesson05.przy_ladzie_w_ksiegarni
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — слово этого урока, из темы «У прилавка в книжном магазине».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit62.lesson06.translate.001
  lesson_content_key: pl.a1.unit62.lesson06.ewa_slyszy_o_ksiegarni
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Ева узнаёт о книжном магазине».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit62.lesson02.order.002
  lesson_content_key: pl.a1.unit62.lesson02.powiesc_i_tytul
  type: word_order
  frame:
    text: Ile kosztuje ta {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_powieść
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje ta {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Сколько стоит этот роман? powieść означает «роман».
    language_code: ru
    direction: ltr
