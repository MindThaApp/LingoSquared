templates:
- content_key: practice.ru-pl.pl.a1.unit04.lesson01.choose.001
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Часы называются порядковыми числительными женского рода (pierwsza, druga, trzecia), потому что они согласуются с подразумеваемым словом godzina.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson01.listen.002
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Для обозначения времени по часам в польском говорят pierwsza, druga, trzecia, а не pierwszy, drugi, trzeci.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson01.translate.003
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Часы — это порядковые числительные: pierwsza буквально значит «первая», то есть час дня — «первый час».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson01.order.004
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: word_order
  frame:
    text: Która jest godzina? Jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Która jest godzina? Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ответ на вопрос Która jest godzina? — просто Jest + час в порядковом числительном женского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson01.fill.005
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: fill_in_blank
  frame:
    text: Która jest {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Która jest godzina? — стандартный вопрос о времени; która стоит в женском роде, потому что godzina — женского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson01.translate.006
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: Сейчас три часа. (два слова)
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Час на часах обозначается порядковым числительным женского рода, поэтому «три часа» — trzecia, а не trzy.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson02.choose.001
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rano — утром, wieczorem — вечером, а w nocy — ночью.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson02.listen.002
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В предложении Ewa wstaje o siódmej rano сначала идёт час, а затем часть суток.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson02.translate.003
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje и odjeżdża — формы 3-го лица единственного числа (он/она/оно), которые оканчиваются на -e или -a, а не на -m.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson02.match.004
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Rano (утром) и wieczorem (вечером) не требуют предлога, а «в полдень» и «ночью» — это w południe и w nocy.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson02.order.005
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: word_order
  frame:
    text: Ewa wstaje o siódmej {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa wstaje o siódmej {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: В предложении Ewa wstaje o siódmej rano сначала называется час, затем часть суток.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson02.order.006
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: word_order
  frame:
    text: Pociąg odjeżdża o czwartej po {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg odjeżdża o czwartej po {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Po południu значит «после полудня», а «в полдень» — w południe, с другим предлогом и окончанием.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson02.fill.007
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: fill_in_blank
  frame:
    text: Ewa {item} o siódmej rano. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje — форма глагола для он/она, поэтому она подходит к Ewa.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson02.translate.008
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: В котором часу? (три слова)
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: O której {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: O której godzinie значит «в котором часу», и оба слова стоят в форме, которая нужна после o.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson02.translate.009
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: Поезд отправляется в четыре часа дня.
    language_code: ru
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg {item} o czwartej po południu.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'После o название часа меняет окончание: czwarta превращается в o czwartej.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson03.order.001
  lesson_content_key: pl.a1.unit04.lesson03.ustalamy_godzine_spotkania
  type: word_order
  frame:
    text: Dobrze, {item} o czwartej po południu?
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może значит «может быть» и смягчает предложение, как в вопросе «Может, в четыре?»
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit04.lesson03.translate.002
  lesson_content_key: pl.a1.unit04.lesson03.ustalamy_godzine_spotkania
  type: translation
  frame:
    text: Хорошо, может, в четыре часа дня?
    language_code: ru
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może превращает предложение в вежливое предположение, как в Może o czwartej?
    language_code: ru
    direction: ltr
