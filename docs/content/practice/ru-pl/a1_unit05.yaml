templates:
- content_key: practice.ru-pl.pl.a1.unit05.lesson01.choose.001
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Польские слова о семье образуют мужские и женские пары, например ojciec и matka или brat и siostra.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson01.listen.002
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rodzice («родители») всегда во множественном числе, поэтому употребляется с moi, а не с mój или moja.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson01.match.003
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Слова о семье образуют пары по роду: dziadek и babcia, wujek и ciotka, syn и córka.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson01.order.004
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest mój {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest mój {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mój употребляется с существительными мужского рода, например ojciec, brat и dziadek.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson01.order.005
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest moja {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest moja {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja употребляется с существительными женского рода, большинство из которых оканчивается на -a.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson01.fill.006
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: fill_in_blank
  frame:
    text: To jest {item} ojciec. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Притяжательное местоимение согласуется с существительным: mój ojciec, но moja matka.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson01.translate.007
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: Это моя мама.
    language_code: ru
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest {item} matka.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja — это «моя» женского рода; «мой» мужского рода — mój.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson01.translate.008
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: Это мои родители.
    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To są {item} rodzice.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rodzice — множественное число, обозначающее людей, поэтому притяжательное местоимение — moi, а глагол — są вместо jest.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson02.choose.001
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mieć означает «иметь», и форма глагола зависит от того, кто имеет: mam, masz, ma.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson02.translate.002
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieć («иметь») — словарная форма; в предложениях она выступает как mam, masz или ma.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson02.order.003
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: word_order
  frame:
    text: Mam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'После mam то, что у тебя есть, ставится в форму дополнения: brat становится brata, а siostra — siostrę.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson02.fill.004
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: fill_in_blank
  frame:
    text: Tak, mam brata {item} siostrę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Слово i соединяет два предмета, как в brata i siostrę, и никогда не изменяется.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson02.translate.005
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: У меня есть сын и дочь.
    language_code: ru
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam syna i {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Существительные женского рода на -a в роли дополнения меняют окончание на -ę: córka становится córkę.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson03.choose.001
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: По-польски «он» — on, «она» — ona, а глагол mieszka подходит для обоих.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson03.translate.002
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tylko значит «только», а lub — разделительное «или», как в brata lub siostrę.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson03.order.003
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: word_order
  frame:
    text: Mój brat mieszka w {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mój brat mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: После w названия городов принимают особое окончание, как в w Gdańsku и w Krakowie.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson03.fill.004
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: fill_in_blank
  frame:
    text: Ona {item} w Krakowie. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieszka — форма «он/она» этого глагола, а mieszkam из первого урока — форма «я».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit05.lesson03.translate.005
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: Он живёт в Гданьске. (с местоимением)
    language_code: ru
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: On mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Окончание -u после w показывает, где кто-то живёт: w Gdańsku.'
    language_code: ru
    direction: ltr
