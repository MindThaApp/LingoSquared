    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_jedzenie
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_jedzenie
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Я режу лук и помидор для еды. jedzenie значит «еда».
    language_code: ru
    direction: ltr
