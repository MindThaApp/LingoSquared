schema_version: '1.0'
pack_key: practice.ru-pl.a1.unit35
source_language: ru
target_language: pl
unit_content_key: pl.a1.unit35.gotowanie
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cebulę
    - w_dokonane
    - w_gotują
    - w_jedzenia
    - w_jedzenie
    - w_kroi
    - w_kroić
    - w_kroję
    - w_patelni
    - w_patelnia
    - w_pokroimy
    - w_pokroję
    - w_przygotowuje
    - w_przygotowujemy
    - w_przygotowujesz
    - w_przygotowuję
    - w_przygotowywać
    - w_przygotuję
    - w_przyszły
    - w_próbować
    - w_próbuje
    - w_próbujesz
    - w_pyszne
    - w_smaży
    - w_smażyć
    - w_smażę
    - w_spróbuj
    - w_usmażysz
    - w_wejdź
templates:
- content_key: practice.ru-pl.pl.a1.unit35.lesson01.choose.001
  lesson_content_key: pl.a1.unit35.lesson01.cebula_pomidor_i_krojenie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_cebulę
        - w_kroić
        - w_kroję
        - w_jedzenie
        - w_patelnia
        - w_smażyć
        - w_smażę
        - w_patelni
        - w_przygotowywać
        - w_przygotowuję
        - w_dokonane
        - w_przygotuję
        - w_przyszły
        - w_próbować
        - w_próbuje
        - w_jedzenia
        - w_wejdź
        - w_pokroimy
        - w_pokroję
        - w_usmażysz
        - w_próbujesz
        - w_gotują
        - w_kroi
        - w_smaży
        - w_przygotowuje
        - w_pyszne
        - w_przygotowujesz
        - w_przygotowujemy
        - w_spróbuj
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока про лук, помидор и нарезку.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit35.lesson02.listen.001
  lesson_content_key: pl.a1.unit35.lesson02.patelnia_i_smazenie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока про сковороду и жарку.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit35.lesson03.translate.001
  lesson_content_key: pl.a1.unit35.lesson03.przygotowywanie_i_probowanie
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока про приготовление и дегустацию.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit35.lesson04.match.001
  lesson_content_key: pl.a1.unit35.lesson04.w_kuchni_u_marka
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Подбери к каждому польскому слову его русское значение; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit35.lesson05.choose.001
  lesson_content_key: pl.a1.unit35.lesson05.ewa_i_marek_gotuja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Ева и Марек готовят вместе».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit35.lesson06.translate.001
  lesson_content_key: pl.a1.unit35.lesson06.tomek_przychodzi_na_obiad
  type: translation
  frame:
    text: '{item}'
    language_code: ru
