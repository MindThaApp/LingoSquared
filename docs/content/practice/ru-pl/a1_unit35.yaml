  lesson_content_key: pl.a1.unit35.lesson01.cebula_pomidor_i_krojenie
  type: word_order
  frame:
    text: Mam {item} i pomidor.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_cebulę
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} i pomidor.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: У меня есть лук и помидор. cebulę значит «лук» (в роли дополнения).
    language_code: ru
    direction: ltr
