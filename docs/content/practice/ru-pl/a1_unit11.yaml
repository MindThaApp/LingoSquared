templates:
- content_key: practice.ru-pl.pl.a1.unit11.lesson01.choose.001
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chcę — форма «я» глагола chcieć, а chcesz — форма «ты», её используют с друзьями и родными.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson01.listen.002
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Окончание -sz указывает на неформальное «ты»: chcesz, możesz, masz (исключение — jesteś, оно оканчивается на -ś).'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson01.match.003
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Chcieć и móc спрягаются одинаково: -ę для «я» и -sz для «ты».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson01.order.004
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: word_order
  frame:
    text: Dziś {item} iść do kina.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziś {item} iść do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: После chcę или mogę второй глагол остаётся в инфинитиве.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson01.fill.005
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: fill_in_blank
  frame:
    text: Czy {item} iść razem do kina? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Вопрос к другу строится с формой «ты» chcesz, а вопрос начинается со слова czy.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson01.translate.006
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: translation
  frame:
    text: Сегодня я хочу пойти в кино.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziś {item} iść do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: После chcę стоит инфинитив, поэтому iść остаётся в словарной форме.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson01.translate.007
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Móc означает «мочь» и употребляется так же, как chcieć.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson02.choose.001
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chętnie и niestety — наречия, поэтому они никогда не изменяются.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson02.listen.002
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Sobotę — форма, которая используется после w: женские названия дней меняют -a на -ę, поэтому sobota становится sobotę.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson02.match.003
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Przyjść значит «прийти» и стоит в инфинитиве после mogę или możesz.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson02.order.004
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: word_order
  frame:
    text: Czy możesz {item} w piątek?
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy możesz {item} w piątek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Czy możesz с инфинитивом — вежливый вопрос другу, может ли он что-то сделать.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson02.order.005
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: word_order
  frame:
    text: Czy możesz przyjść w {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy możesz przyjść w {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Дни недели мужского рода, как piątek, после w не меняются, а дни женского рода, как sobota, принимают форму sobotę.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson02.fill.006
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: fill_in_blank
  frame:
    text: Niestety, nie {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nie mogę — вежливый способ сказать, что ты не можешь прийти.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson02.fill.007
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: fill_in_blank
  frame:
    text: Tak, bardzo {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bardzo chętnie — тёплый способ принять приглашение.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson02.translate.008
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: translation
  frame:
    text: К сожалению, я не могу.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Niestety, nie {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Nie ставится перед глаголом, чтобы сделать его отрицательным.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit11.lesson02.translate.009
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Przyjść — начальная форма глагола «прийти»; здесь она стоит после mogę.
    language_code: ru
    direction: ltr
