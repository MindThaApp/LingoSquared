templates:
- content_key: practice.ru-pl.pl.a1.unit10.lesson01.choose.001
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: У каждого из этих глаголов есть словарная форма (wstawać, jeść, pić) и форма для «я» (wstaję, jem, piję).
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson01.listen.002
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Форма для «я» обычно оканчивается на -ę или -m, как в wstaję, piję и jem.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson01.match.003
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Инфинитив и форма для «я» — разные слова, поэтому учи обе: jeść и jem.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson01.order.004
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: word_order
  frame:
    text: Rano {item} o siódmej.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Rano {item} o siódmej.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rano стоит первым и показывает, когда это происходит, а o siódmej называет точное время.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson01.fill.005
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: fill_in_blank
  frame:
    text: Rano {item} śniadanie. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Jem — неправильная форма «я» от jeść, её стоит выучить наизусть.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson01.translate.006
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: translation
  frame:
    text: Я завтракаю.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jem {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Śniadanie — существительное среднего рода, поэтому его форма в роли дополнения совпадает с основной формой.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson01.translate.007
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Piję и wstaję оба оканчиваются на -ę, это типичное окончание формы «я» у таких глаголов.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson02.choose.001
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pracować значит «работать», а wracać — «возвращаться»; их формы для «я» — pracuję и wracam.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson02.listen.002
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Obiad — главный приём пищи за день, его едят около полудня, поэтому это может быть и обед, и ужин.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson02.match.003
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Wracam и pracuję — разные глаголы со сходным звучанием, поэтому следи за гласными.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson02.order.004
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: word_order
  frame:
    text: Wracam do {item} wieczorem.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Wracam do {item} wieczorem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: После do существительное ставится в родительный падеж, и dom превращается в domu, как bank в banku.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson02.fill.005
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: fill_in_blank
  frame:
    text: Po południu {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Po południu показывает, когда это происходит, а глагол остаётся в форме «я».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson02.translate.006
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: translation
  frame:
    text: Вечером я возвращаюсь домой.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Wracam do {item} wieczorem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Окончание родительного падежа -u снова встречается в domu, как в banku и parku.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson02.translate.007
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dom значит «дом» или «домой» в зависимости от контекста.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson03.choose.001
  lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Też значит «тоже» или «также» и обычно стоит после слова, к которому относится.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson03.order.002
  lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
  type: word_order
  frame:
    text: Śpię {item}, o dziesiątej wieczorem.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Śpię {item}, o dziesiątej wieczorem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Wcześnie значит «рано» и является наречием, поэтому оно не изменяется.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson03.fill.003
  lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
  type: fill_in_blank
  frame:
    text: Ja {item} jem śniadanie rano. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ja też значит «я тоже»; też обычно стоит сразу после местоимения, к которому относится.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit10.lesson03.translate.004
  lesson_content_key: pl.a1.unit10.lesson03.rozmowa_o_dniu
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Śpię — форма «я» от spać, и в ней другая гласная, чем в инфинитиве.
    language_code: ru
    direction: ltr
