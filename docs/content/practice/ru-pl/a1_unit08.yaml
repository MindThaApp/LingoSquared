  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poczta, apteka и restauracja оканчиваются на -a и относятся к женскому роду; bank, hotel и park — мужского рода.
    language_code: ru
    direction: ltr
