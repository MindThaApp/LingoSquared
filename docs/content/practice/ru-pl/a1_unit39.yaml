schema_version: '1.0'
pack_key: practice.ru-pl.a1.unit39
source_language: ru
target_language: pl
unit_content_key: pl.a1.unit39.nagle_wypadki
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_alarmowy
    - w_bibliotece
    - w_chodź
    - w_dzieje
    - w_dzwonię
    - w_ewakuacyjne
    - w_idźcie
    - w_karetka
    - w_policja
    - w_pomoc
    - w_pomocy
    - w_potrzebny
    - w_potrzebuje
    - w_pożar
    - w_spokojnie
    - w_straż
    - w_uwaga
    - w_wyjścia
    - w_wyjście
    - w_zadzwoń
    - w_zewnątrz
templates:
- content_key: practice.ru-pl.pl.a1.unit39.lesson01.choose.001
  lesson_content_key: pl.a1.unit39.lesson01.pomoc_i_pozar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_pomoc
        - w_pomocy
        - w_pożar
        - w_potrzebny
        - w_alarmowy
        - w_zadzwoń
        - w_wyjście
        - w_ewakuacyjne
        - w_dzwonię
        - w_policja
        - w_karetka
        - w_straż
        - w_uwaga
        - w_idźcie
        - w_wyjścia
        - w_spokojnie
        - w_chodź
        - w_bibliotece
        - w_potrzebuje
        - w_zewnątrz
        - w_dzieje
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о помощи и пожаре.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit39.lesson02.listen.001
  lesson_content_key: pl.a1.unit39.lesson02.numer_alarmowy_i_wyjscie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока о номере экстренных служб и аварийном выходе.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit39.lesson03.translate.001
  lesson_content_key: pl.a1.unit39.lesson03.policja_karetka_lub_straz
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы про полицию, скорую помощь и пожарную службу.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit39.lesson04.match.001
  lesson_content_key: pl.a1.unit39.lesson04.pozar_w_kawiarni_jezykowej
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Подбери к каждому польскому слову его русское значение; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit39.lesson05.choose.001
  lesson_content_key: pl.a1.unit39.lesson05.czytanie_tekstu_o_pozarze
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого модуля, из урока о чтении текста про пожар.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit39.lesson06.translate.001
  lesson_content_key: pl.a1.unit39.lesson06.tomek_przychodzi
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока «Томек приходит».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit39.lesson01.order.002
  lesson_content_key: pl.a1.unit39.lesson01.pomoc_i_pozar
  type: word_order
  frame:
    text: Ewo, potrzebuję {item}!
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_pomocy
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewo, potrzebuję {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Эва, мне нужна помощь! pomocy значит «помощи» (родительный падеж).
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit39.lesson02.order.002
  lesson_content_key: pl.a1.unit39.lesson02.numer_alarmowy_i_wyjscie
  type: word_order
  frame:
    text: Zadzwoń pod numer {item}!
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_alarmowy
  answer_derivation:
    kind: render_frame
    frame:
      text: Zadzwoń pod numer {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Позвони по номеру экстренных служб! alarmowy значит «аварийный, экстренный» (м. р.).
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit39.lesson02.fill.003
  lesson_content_key: pl.a1.unit39.lesson02.numer_alarmowy_i_wyjscie
  type: fill_in_blank
  frame:
    text: Gdzie jest {item} ewakuacyjne? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_wyjście
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_wyjście
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Где аварийный выход? wyjście значит «выход».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit39.lesson03.order.002
  lesson_content_key: pl.a1.unit39.lesson03.policja_karetka_lub_straz
  type: word_order
  frame:
    text: Policja, {item} czy straż pożarna?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_karetka
  answer_derivation:
    kind: render_frame
    frame:
      text: Policja, {item} czy straż pożarna?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Полиция, скорая или пожарные? Policja, karetka czy straż pożarna? — вопрос, который ты услышишь, позвонив по номеру 112, единому номеру экстренных служб в Польше и по всей Европе. Karetka — это скорая помощь.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit39.lesson03.fill.003
  lesson_content_key: pl.a1.unit39.lesson03.policja_karetka_lub_straz
  type: fill_in_blank
  frame:
    text: Dzwonię po {item} pożarną. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_straż
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_straż
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Я вызываю пожарных. straż значит «стража, служба».
    language_code: ru
    direction: ltr
