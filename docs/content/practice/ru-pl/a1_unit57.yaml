    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_popularne
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_popularne
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Спектакль популярен. popularne означает «популярное» (средний род).
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit57.lesson02.order.002
