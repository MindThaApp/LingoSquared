templates:
- content_key: practice.ru-pl.pl.a1.unit06.lesson01.choose.001
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'У каждого польского существительного есть род: chleb и ser — мужского рода, kawa, herbata и woda — женского, а masło и mleko — среднего.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson01.listen.002
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: В польском нет артиклей, поэтому chleb может означать и «хлеб», и «этот хлеб».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson01.order.003
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: word_order
  frame:
    text: Proszę o {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę o {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: После proszę o существительные женского рода на -a меняют окончание на -ę (kawa, kawę), а существительные мужского и среднего рода, такие как chleb и mleko, остаются без изменений.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson01.fill.004
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: fill_in_blank
  frame:
    text: Proszę o {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Proszę o и форма дополнения — вежливый способ о чём-то попросить.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson01.translate.005
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: translation
  frame:
    text: Воды, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę o {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Существительное после proszę o стоит в форме дополнения: woda становится wodę.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson01.translate.006
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Masło и mleko оканчиваются на -o — это типичное окончание среднего рода, а chleb и ser оканчиваются на согласный и относятся к мужскому роду.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson02.choose.001
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lubić — это словарная форма; lubię говорят о себе, а lubi — о другом человеке.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson02.match.002
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Окончание глагола указывает на лицо: -ę для «я» (lubię) и -i для «он» или «она» (lubi).'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson02.order.003
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: word_order
  frame:
    text: Lubię {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'После lubię то, что тебе нравится, ставится в форму прямого дополнения: zupa превращается в zupę, а sok, chleb и ser не меняются.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson02.fill.004
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: fill_in_blank
  frame:
    text: On {item} zupę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lubi — это форма «он» или «она», поэтому с ней можно использовать местоимение on.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson02.translate.005
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: translation
  frame:
    text: Я люблю суп.
    language_code: ru
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Существительные женского рода на -a в роли прямого дополнения получают окончание -ę, поэтому zupa становится zupę.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson02.translate.006
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Пара lubię и lubi показывает закономерность: для каждого лица своё окончание.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson03.listen.001
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Polecać спрягается как lubić: polecam — «я рекомендую», а poleca — «он, она рекомендует» или, с pan и pani, «вы рекомендуете».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson03.match.002
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: В Co pan poleca? используется форма poleca, как для «он» или «она», потому что с pan и pani глагол ставится в третьем лице.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson03.order.003
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: word_order
  frame:
    text: Polecam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Polecam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Polecam, как и lubię, тоже требует, чтобы существительное стояло в форме прямого дополнения.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson03.fill.004
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: fill_in_blank
  frame:
    text: Już {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Официант говорит в форме «я», podaję, потому что именно он подаёт блюда.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson03.translate.005
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: translation
  frame:
    text: Что вы рекомендуете? (мужчине, вежливо)
    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Co pan {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: С pan или pani глагол имеет форму poleca — такую же, как для «он» или «она».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit06.lesson03.translate.006
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Już может означать «уже» или, как в Już podaję, «сейчас же», «сию минуту».
    language_code: ru
    direction: ltr
