  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Proszę и инфинитив — вежливый способ указать направление, например: Proszę iść prosto.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit09.lesson01.match.003
