    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Bank jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Tam значит «там» и не меняется в любом предложении о местонахождении.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit09.lesson01.translate.007
  lesson_content_key: pl.a1.unit09.lesson01.jak_dojsc
