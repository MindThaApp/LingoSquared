templates:
- content_key: practice.ru-pl.pl.a1.unit09.lesson01.choose.001
  lesson_content_key: pl.a1.unit09.lesson01.jak_dojsc
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dojść значит «дойти до места», а iść — просто «идти пешком».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit09.lesson01.listen.002
