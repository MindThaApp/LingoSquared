    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Указания часто соединяют словом potem, которое значит «потом».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit09.lesson01.order.004
  lesson_content_key: pl.a1.unit09.lesson01.jak_dojsc
  type: word_order
  frame:
    text: Proszę iść prosto, {item} skręcić na prawo.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę iść prosto, {item} skręcić na prawo.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Potem связывает два шага в том порядке, в котором они выполняются: сначала прямо, потом поворот.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit09.lesson01.fill.005
  lesson_content_key: pl.a1.unit09.lesson01.jak_dojsc
  type: fill_in_blank
  frame:
    text: Jak {item} do banku? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Jak dojść do с родительным падежом — так спрашивают, как дойти до места.
    language_code: ru
    direction: ltr
