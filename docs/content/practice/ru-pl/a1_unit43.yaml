schema_version: '1.0'
pack_key: practice.ru-pl.a1.unit43
source_language: ru
target_language: pl
unit_content_key: pl.a1.unit43.apteka
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aptekarz
    - w_biorę
    - w_ból
    - w_dawkowanie
    - w_dobre
    - w_dziennie
    - w_etykieta
    - w_głowy
    - w_lek
    - w_leki
    - w_musi
    - w_odpocznij
    - w_paracetamol
    - w_porządku
    - w_przeciwbólowy
    - w_przeczytaj
    - w_pudełku
    - w_tabletka
    - w_tabletki
    - w_wodą
    - w_wziąć
    - w_wzięłam
templates:
- content_key: practice.ru-pl.pl.a1.unit43.lesson01.choose.001
  lesson_content_key: pl.a1.unit43.lesson01.mam_bol_glowy
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_ból
        - w_głowy
        - w_lek
        - w_przeciwbólowy
        - w_tabletka
        - w_wziąć
        - w_wodą
        - w_musi
        - w_dawkowanie
        - w_przeczytaj
        - w_pudełku
        - w_dziennie
        - w_tabletki
        - w_aptekarz
        - w_leki
        - w_dobre
        - w_etykieta
        - w_paracetamol
        - w_biorę
        - w_odpocznij
        - w_porządku
        - w_wzięłam
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого модуля, из урока «У меня болит голова».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit43.lesson02.listen.001
  lesson_content_key: pl.a1.unit43.lesson02.branie_tabletki
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого модуля, из урока «Принимать таблетку».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit43.lesson03.translate.001
  lesson_content_key: pl.a1.unit43.lesson03.czytanie_dawkowania
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого модуля, из урока «Читаем дозировку».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit43.lesson04.match.001
  lesson_content_key: pl.a1.unit43.lesson04.w_aptece
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Подбери к каждому польскому слову его русское значение; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
