    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока на тему «У рыночного прилавка».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit58.lesson06.translate.001
  lesson_content_key: pl.a1.unit58.lesson06.ewa_dowiaduje_sie_o
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
