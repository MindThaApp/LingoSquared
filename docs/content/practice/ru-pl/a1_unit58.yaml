schema_version: '1.0'
pack_key: practice.ru-pl.a1.unit58
source_language: ru
target_language: pl
unit_content_key: pl.a1.unit58.targ
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_jabłek
    - w_jabłka
    - w_każdą
    - w_owocami
    - w_piekarni
    - w_podać
    - w_sprzedawca
    - w_sprzedawcę
    - w_stragan
    - w_warzywa
    - w_zatłoczony
templates:
- content_key: practice.ru-pl.pl.a1.unit58.lesson01.choose.001
  lesson_content_key: pl.a1.unit58.lesson01.pojdziemy_na_targ
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_zatłoczony
        - w_stragan
        - w_warzywa
        - w_jabłka
        - w_sprzedawca
        - w_sprzedawcę
        - w_jabłek
        - w_każdą
        - w_podać
        - w_owocami
        - w_piekarni
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока на тему «Пойдём на рынок?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit58.lesson02.listen.001
  lesson_content_key: pl.a1.unit58.lesson02.warzywa_i_owoce
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Овощи и фрукты».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit58.lesson03.translate.001
  lesson_content_key: pl.a1.unit58.lesson03.jablka_i_sprzedawca
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока на тему «Яблоки и продавец на рынке».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit58.lesson04.match.001
  lesson_content_key: pl.a1.unit58.lesson04.ceny_na_targu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Подбери к каждому польскому слову его русское значение; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit58.lesson05.choose.001
  lesson_content_key: pl.a1.unit58.lesson05.przy_straganie_na_targu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
