schema_version: '1.0'
pack_key: practice.ru-pl.a1.unit44
source_language: ru
target_language: pl
unit_content_key: pl.a1.unit44.fryzjer
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cennik
    - w_fryzjer
    - w_fryzjera
    - w_fryzurę
    - w_krócej
    - w_krótko
    - w_mycie
    - w_ostrzyc
    - w_problemu
    - w_przyszłym
    - w_samą
    - w_strzyżenie
    - w_sześćdziesiąt
    - w_trzeciej
    - w_usiąść
    - w_właśnie
    - w_życzy
templates:
- content_key: practice.ru-pl.pl.a1.unit44.lesson01.choose.001
  lesson_content_key: pl.a1.unit44.lesson01.moje_wlosy_sa_za
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_fryzjer
        - w_fryzjera
        - w_ostrzyc
        - w_krócej
        - w_krótko
        - w_życzy
        - w_trzeciej
        - w_samą
        - w_fryzurę
        - w_problemu
        - w_usiąść
        - w_cennik
        - w_strzyżenie
        - w_sześćdziesiąt
        - w_mycie
        - w_właśnie
        - w_przyszłym
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Мои волосы слишком длинные».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson02.listen.001
  lesson_content_key: pl.a1.unit44.lesson02.czy_moze_mnie_pan
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Можете подстричь меня?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson03.translate.001
  lesson_content_key: pl.a1.unit44.lesson03.umowienie_wizyty
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Запись на приём».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson04.match.001
  lesson_content_key: pl.a1.unit44.lesson04.u_fryzjera
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Подбери к каждому польскому слову его русское значение; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson05.choose.001
  lesson_content_key: pl.a1.unit44.lesson05.czytanie_cennika
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Читаем прейскурант».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson06.translate.001
  lesson_content_key: pl.a1.unit44.lesson06.ewa_widzi_nowa_fryzure
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Эва видит новую причёску».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson01.order.002
  lesson_content_key: pl.a1.unit44.lesson01.moje_wlosy_sa_za
  type: word_order
  frame:
    text: Idę do {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_fryzjera
  answer_derivation:
    kind: render_frame
    frame:
      text: Idę do {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Я иду к парикмахеру. fryzjera — форма слова «парикмахер».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson02.order.002
  lesson_content_key: pl.a1.unit44.lesson02.czy_moze_mnie_pan
  type: word_order
  frame:
    text: Czy może mnie pan {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_ostrzyc
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy może mnie pan {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Можете меня подстричь? ostrzyc значит «стричь (волосы)».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson02.fill.003
  lesson_content_key: pl.a1.unit44.lesson02.czy_moze_mnie_pan
  type: fill_in_blank
  frame:
    text: Proszę mnie ostrzyc {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_krócej
    hint:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_krócej
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Я хочу покороче, пожалуйста. krócej значит «покороче».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson02.translate.004
  lesson_content_key: pl.a1.unit44.lesson02.czy_moze_mnie_pan
  type: translation
  frame:
    text: Насколько коротко вам подстричь?
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_krótko
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak {item} pani sobie życzy?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Насколько коротко вам подстричь? krótko значит «коротко».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson03.order.002
  lesson_content_key: pl.a1.unit44.lesson03.umowienie_wizyty
  type: word_order
  frame:
    text: Mam wizytę o {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_trzeciej
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam wizytę o {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Я записана на три часа. trzeciej значит «в три (часа)».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson04.order.002
  lesson_content_key: pl.a1.unit44.lesson04.u_fryzjera
  type: word_order
  frame:
    text: Dobrze, a czy chce pani taką {item} fryzurę?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_samą
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, a czy chce pani taką {item} fryzurę?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Отлично, а вы хотите такую же причёску? samą значит «такую же» (женский род, прямое дополнение).
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson04.fill.003
  lesson_content_key: pl.a1.unit44.lesson04.u_fryzjera
  type: fill_in_blank
  frame:
    text: Tak, taką samą {item}, ale krócej. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_fryzurę
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_fryzurę
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Да, такую же причёску, но короче. fryzurę значит «причёску» (прямое дополнение).
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit44.lesson05.order.002
  lesson_content_key: pl.a1.unit44.lesson05.czytanie_cennika
  type: word_order
  frame:
    text: Strzyżenie kosztuje {item} złotych.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_sześćdziesiąt
  answer_derivation:
    kind: render_frame
    frame:
      text: Strzyżenie kosztuje {item} złotych.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Стрижка стоит шестьдесят злотых. sześćdziesiąt значит «шестьдесят».
    language_code: ru
    direction: ltr
