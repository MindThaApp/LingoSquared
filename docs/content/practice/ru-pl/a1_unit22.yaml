schema_version: '1.0'
pack_key: practice.ru-pl.a1.unit22
source_language: ru
target_language: pl
unit_content_key: pl.a1.unit22.komunikacja
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_być
    - w_czas
    - w_dumna
    - w_dużo
    - w_dzwoni
    - w_dzwonisz
    - w_dzwonić
    - w_fajnie
    - w_lepiej
    - w_minut
    - w_muszę
    - w_myślałem
    - w_myśleć
    - w_mów
    - w_oczywiście
    - w_oddzwonię
    - w_poszła
    - w_powiedzieć
    - w_powtórzyć
    - w_przeszły
    - w_później
    - w_rozmawia
    - w_rozmawiam
    - w_sms
    - w_szybko
    - w_słyszeć
    - w_słyszę
    - w_wyślę
    - w_zadzwonię
    - w_zmiana
    - w_znaczy
templates:
- content_key: practice.ru-pl.pl.a1.unit22.lesson01.choose.001
  lesson_content_key: pl.a1.unit22.lesson01.zadzwonie_do_ciebie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_dzwonić
        - w_muszę
        - w_zadzwonię
        - w_rozmawiam
        - w_rozmawia
        - w_powtórzyć
        - w_mów
        - w_szybko
        - w_słyszę
        - w_sms
        - w_wyślę
        - w_oddzwonię
        - w_później
        - w_powiedzieć
        - w_oczywiście
        - w_minut
        - w_fajnie
        - w_dzwonisz
        - w_poszła
        - w_zmiana
        - w_lepiej
        - w_myślałem
        - w_czas
        - w_przeszły
        - w_być
        - w_myśleć
        - w_słyszeć
        - w_dumna
        - w_dużo
        - w_znaczy
        - w_dzwoni
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — слово из этого урока, из темы «Я перезвоню тебе».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit22.lesson02.listen.001
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — слово из этого урока, из темы «С кем я говорю?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit22.lesson03.translate.001
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — слово из этого урока, из темы «Можешь повторить?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit22.lesson04.match.001
  lesson_content_key: pl.a1.unit22.lesson04.wysylanie_sms_a
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Подбери к каждому польскому слову его русское значение; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit22.lesson05.choose.001
  lesson_content_key: pl.a1.unit22.lesson05.czytanie_rozmowy_sms_owej
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — слово из этого урока, из темы «Читаем переписку в сообщениях».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit22.lesson06.translate.001
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — слово из этого урока, из темы «Телефонный звонок после смены».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: С кем я разговариваю? Z kim rozmawiam? (буквально «с кем я разговариваю?») — стандартная фраза, когда звонит незнакомый человек; kim — творительный падеж после z.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Можешь повторить это? Możesz («ты можешь», от móc) + инфинитив powtórzyć («повторить») + to («это»).
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Не говори так быстро, пожалуйста. Nie mów — отрицательный императив («не говори»); tak szybko значит «так быстро».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: Я тебя плохо слышу.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Я плохо тебя слышу. Nie słyszę cię dobrze сообщает о проблеме со слухом; cię — винительный падеж от ty, а dobrze значит «хорошо».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Как прошла твоя первая смена? Jak ci poszła ...? (буквально «как тебе пошла ...?») спрашивает о том, что уже произошло. Ci — дательный падеж от ty, а poszła согласуется с существительным женского рода zmiana.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Его первая смена прошла очень хорошо. Jego («его») не изменяется и стоит перед существительным: jego pierwsza zmiana; существительное женского рода на него не влияет.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: Всё прошло очень хорошо, лучше, чем я думал.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Всё прошло очень хорошо, лучше, чем я думал. Poszło — прошедшее время от iść с окончанием -o («оно»; здесь «получилось»); myślałem — прошедшее время от myśleć («думать») в форме для говорящего-мужчины.
    language_code: ru
    direction: ltr
