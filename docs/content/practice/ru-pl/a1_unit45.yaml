schema_version: '1.0'
pack_key: practice.ru-pl.a1.unit45
source_language: ru
target_language: pl
unit_content_key: pl.a1.unit45.pralnia
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_chodźmy
    - w_ciężki
    - w_jedno
    - w_kosz
    - w_monetami
    - w_niosę
    - w_odbieram
    - w_odbierać
    - w_pralni
    - w_pralnia
    - w_prania
    - w_program
    - w_stopni
    - w_suszarka
    - w_suszarki
    - w_ubrania
    - w_wybiera
    - w_wybieram
    - w_wyprać
    - w_środy
templates:
- content_key: practice.ru-pl.pl.a1.unit45.lesson01.choose.001
  lesson_content_key: pl.a1.unit45.lesson01.chce_wyprac_ubrania
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_pralnia
        - w_pralni
        - w_wyprać
        - w_ubrania
        - w_program
        - w_prania
        - w_wybieram
        - w_jedno
        - w_odbierać
        - w_odbieram
        - w_wybiera
        - w_stopni
        - w_suszarka
        - w_suszarki
        - w_monetami
        - w_kosz
        - w_niosę
        - w_chodźmy
        - w_ciężki
        - w_środy
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Я хочу постирать одежду».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit45.lesson02.listen.001
  lesson_content_key: pl.a1.unit45.lesson02.ile_kosztuje_jedno_pranie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Сколько стоит стирка?»'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit45.lesson03.translate.001
  lesson_content_key: pl.a1.unit45.lesson03.kiedy_pranie_bedzie_gotowe
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Когда будет готово бельё?»'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit45.lesson04.match.001
  lesson_content_key: pl.a1.unit45.lesson04.w_pralni
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Подбери к каждому польскому слову его русское значение; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit45.lesson05.choose.001
  lesson_content_key: pl.a1.unit45.lesson05.czytanie_cennika
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого раздела, из урока «Читаем прейскурант».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit45.lesson06.translate.001
  lesson_content_key: pl.a1.unit45.lesson06.ewa_w_pralni
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока «Эва в прачечной».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit45.lesson01.order.002
  lesson_content_key: pl.a1.unit45.lesson01.chce_wyprac_ubrania
  type: word_order
  frame:
    text: Idę do {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_pralni
  answer_derivation:
    kind: render_frame
    frame:
      text: Idę do {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Я иду в прачечную. pralni значит «прачечной»; «в прачечную».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit45.lesson01.fill.003
  lesson_content_key: pl.a1.unit45.lesson01.chce_wyprac_ubrania
  type: fill_in_blank
  frame:
    text: Chcę {item} ubrania. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_wyprać
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_wyprać
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Я хочу постирать одежду. wyprać значит «постирать» (одежду, до конца).
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit45.lesson01.translate.004
  lesson_content_key: pl.a1.unit45.lesson01.chce_wyprac_ubrania
  type: translation
  frame:
    text: Я бы хотел(а) постирать свою одежду, пожалуйста.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_ubrania
  answer_derivation:
    kind: render_frame
    frame:
      text: Chciałabym wyprać {item}, poproszę.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Я хотела бы постирать одежду, пожалуйста. ubrania значит «одежда».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit45.lesson02.order.002
  lesson_content_key: pl.a1.unit45.lesson02.ile_kosztuje_jedno_pranie
  type: word_order
  frame:
    text: Wybieram {item} prania.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_program
  answer_derivation:
    kind: render_frame
    frame:
      text: Wybieram {item} prania.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Я выбираю программу стирки. program значит «программа».
    language_code: ru
    direction: ltr
