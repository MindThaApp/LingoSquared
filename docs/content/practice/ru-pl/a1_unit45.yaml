  lesson_content_key: pl.a1.unit45.lesson02.ile_kosztuje_jedno_pranie
  type: fill_in_blank
  frame:
    text: Ile kosztuje {item} pranie? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_jedno
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_jedno
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Сколько стоит одна стирка? jedno значит «одно» (средний род).
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit45.lesson03.order.002
  lesson_content_key: pl.a1.unit45.lesson03.kiedy_pranie_bedzie_gotowe
  type: word_order
  frame:
    text: Tak, {item} swoje pranie.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_odbieram
  answer_derivation:
    kind: render_frame
    frame:
      text: Tak, {item} swoje pranie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Да, я забираю своё бельё. odbieram значит «я забираю».
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit45.lesson04.order.002
  lesson_content_key: pl.a1.unit45.lesson04.w_pralni
  type: word_order
  frame:
    text: Sześćdziesiąt {item}, poproszę.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_stopni
  answer_derivation:
    kind: render_frame
    frame:
      text: Sześćdziesiąt {item}, poproszę.
      language_code: pl
