  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_monetami
  answer_derivation:
    kind: render_frame
    frame:
      text: Płacę {item} lub kartą.
      language_code: pl
      direction: ltr
