  lesson_content_key: pl.a1.unit45.lesson06.ewa_w_pralni
  type: word_order
  frame:
    text: Niosę {item} na pranie do pralni.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_kosz
  answer_derivation:
    kind: render_frame
    frame:
      text: Niosę {item} na pranie do pralni.
