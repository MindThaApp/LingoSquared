schema_version: '1.0'
pack_key: practice.ru-pl.a1.unit21
source_language: ru
target_language: pl
unit_content_key: pl.a1.unit21.emocje
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-pl by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Russian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_będziesz
    - w_czuje
    - w_deszcz
    - w_dumny
    - w_martw
    - w_myślę
    - w_mówiąc
    - w_naprawdę
    - w_nowe
    - w_pewno
    - w_pierwszą
    - w_pomaga
    - w_poradzisz
    - w_pracę
    - w_samodzielną
    - w_smutny
    - w_szczerze
    - w_szczęśliwy
    - w_zdenerwowany
    - w_zmianą
templates:
- content_key: practice.ru-pl.pl.a1.unit21.lesson01.choose.001
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_szczęśliwy
        - w_smutny
        - w_nowe
        - w_deszcz
        - w_zdenerwowany
        - w_pierwszą
        - w_zmianą
        - w_martw
        - w_czuje
        - w_samodzielną
        - w_pracę
        - w_myślę
        - w_szczerze
        - w_mówiąc
        - w_poradzisz
        - w_naprawdę
        - w_pomaga
        - w_pewno
        - w_będziesz
        - w_dumny
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Рад, грустен или зол?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson02.listen.001
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Почему ты рад?».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson03.translate.001
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Волноваться из-за чего-то».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson04.match.001
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Подбери к каждому польскому слову его русское значение; слова взяты из уроков этого раздела.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson05.choose.001
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, из темы «Читаем сообщение о чувствах».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson06.translate.001
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — одно из слов этого урока, в котором Эва успокаивает Марека.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson01.order.002
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: word_order
  frame:
    text: Dlaczego jesteś {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_szczęśliwy
  answer_derivation:
    kind: render_frame
    frame:
      text: Dlaczego jesteś {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Почему ты счастлив? Dlaczego (почему) — стандартное вопросительное слово для вопроса о причине.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson01.fill.003
  lesson_content_key: pl.a1.unit21.lesson01.szczesliwy_smutny_czy_zly
  type: fill_in_blank
  frame:
    text: Nie jestem zły, jestem {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smutny
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smutny
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Я не злой, я грустный. Nie ставится прямо перед глаголом: Nie jestem zły. Во второй части называется настоящее чувство.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson02.order.002
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: word_order
  frame:
    text: Jestem szczęśliwy, bo mam {item} mieszkanie.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_nowe
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem szczęśliwy, bo mam {item} mieszkanie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Я счастлив, потому что у меня новая квартира. Bo (потому что) вводит причину; после mam (у меня есть) существительное стоит в винительном падеже: nowe mieszkanie.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson02.fill.003
  lesson_content_key: pl.a1.unit21.lesson02.dlaczego_jestes_szczesliwy
  type: fill_in_blank
  frame:
    text: Jestem smutny, bo pada {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_deszcz
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_deszcz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Мне грустно, потому что идёт дождь. Pada deszcz (идёт дождь, буквально «дождь падает») — обычная фраза о погоде, здесь в роли причины.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson03.order.002
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: word_order
  frame:
    text: Jestem {item} przed pierwszą zmianą.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_zdenerwowany
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem {item} przed pierwszą zmianą.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Я волнуюсь перед первой сменой. zdenerwowany значит «взволнованный, нервничающий» (м. р.).
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson03.fill.003
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: fill_in_blank
  frame:
    text: Cześć, Marku, jak się czujesz przed {item} zmianą? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Привет, Марек, как ты себя чувствуешь перед первой сменой? Przed pierwszą zmianą (перед первой сменой) повторяет модель przed + творительный падеж из урока 3. Czujesz się — форма для ty.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson03.translate.004
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
    text: Не волнуйся.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_martw
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} się.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Не волнуйся. Nie martw się (буквально «не волнуй себя») — стандартная фраза-утешение; się — возвратное местоимение.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson04.order.002
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: word_order
  frame:
    text: Jak {item} się Marek?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_czuje
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak {item} się Marek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Как себя чувствует Марек? Czuć się (чувствовать себя, возвратный глагол) — стандартный способ спросить об эмоциональном состоянии или описать его: Jak czuje się Marek?'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson05.order.002
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: word_order
  frame:
    text: Tak, ja też tak {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_myślę
  answer_derivation:
    kind: render_frame
    frame:
      text: Tak, ja też tak {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Да, я тоже так думаю. Ja też tak myślę (буквально «я тоже так думаю») — естественный способ согласиться; ja здесь добавлено для контраста.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson06.order.002
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: word_order
  frame:
    text: Szczerze {item}, jestem trochę zdenerwowany.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mówiąc
  answer_derivation:
    kind: render_frame
    frame:
      text: Szczerze {item}, jestem trochę zdenerwowany.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Честно говоря, я немного волнуюсь. Szczerze mówiąc (честно говоря, буквально «говоря искренне») смягчает признание.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson06.fill.003
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: fill_in_blank
  frame:
    text: Nie martw się, dobrze sobie {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Не волнуйся, ты хорошо справишься! Dobrze sobie poradzisz (буквально «ты хорошо справишься») — ободряющее устойчивое выражение; poradzisz — форма будущего времени для ty от poradzić sobie.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit21.lesson06.translate.004
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame:
    text: Спасибо, это правда помогает.
    language_code: ru
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_naprawdę
  answer_derivation:
    kind: render_frame
    frame:
      text: Dzięki, to {item} pomaga.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Спасибо, это правда помогает. Pomaga — форма on/ona/ono от pomagać (помогать); dzięki — неформальное «спасибо».
    language_code: ru
    direction: ltr
