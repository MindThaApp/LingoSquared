    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'В польском говорят буквально «голова меня болит»: часть тела — подлежащее, а mnie показывает, кто чувствует боль.'
    language_code: ru
    direction: ltr
