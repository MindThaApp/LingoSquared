  answer_derivation:
    kind: render_frame
    frame:
      text: Gardło {item} boli.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Mnie означает «мне/меня»; Gardło mnie boli буквально: «горло меня болит».'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson01.fill.005
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: fill_in_blank
  frame:
    text: Co cię {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Boli — форма для он, она, оно; вопросительное слово Co обозначает то, что болит.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson01.translate.006
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: translation
  frame:
    text: У меня болит горло. (начни со слова «горло»)
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gardło mnie {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gardło — среднего рода, единственного числа, поэтому глагол стоит в форме boli.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson01.translate.007
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: translation
  frame:
    text: Что у тебя болит? (другу, на ty)
    language_code: ru
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Co {item} boli?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Cię — краткая форма от ty в винительном падеже («тебя»).
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson02.choose.001
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: multiple_choice
  frame:
