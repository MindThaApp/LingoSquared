    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Źle — наречие со значением «плохо», оно не изменяется; chory и chora изменяются по родам.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson02.order.004
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
