    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Mnie и cię — косвенные формы местоимений ja и ty: болит у меня, болит у тебя.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson01.order.004
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: word_order
  frame:
