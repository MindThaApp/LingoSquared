    language_code: ru
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'То, что у тебя есть, ставится в винительный падеж: gorączka → gorączkę.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson02.translate.008
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: translation
  frame:
    text: Марек болен.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Marek jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Марек — мужчина, поэтому прилагательное имеет форму chory.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson03.choose.001
  lesson_content_key: pl.a1.unit16.lesson03.rozmowa_o_zdrowiu
  type: multiple_choice
