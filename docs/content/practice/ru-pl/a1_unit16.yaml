  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chory — мужской род, а chora — женский, так что форма показывает, кто болен.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson02.match.003
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: matching_pairs
