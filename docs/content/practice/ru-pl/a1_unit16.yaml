  lesson_content_key: pl.a1.unit16.lesson03.rozmowa_o_zdrowiu
  type: fill_in_blank
  frame:
    text: Proszę {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: После proszę глагол стоит в начальной форме — так выражается вежливая просьба.
    language_code: ru
    direction: ltr
