  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mam плюс форма винительного падежа говорит о том, что у тебя есть.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson02.translate.007
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: translation
  frame:
