templates:
- content_key: practice.ru-pl.pl.a1.unit16.lesson01.choose.001
  lesson_content_key: pl.a1.unit16.lesson01.co_cie_boli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Boli употребляется, когда болит что-то одно, а bolą — когда несколько частей, поэтому с zęby ставится bolą.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson01.listen.002
