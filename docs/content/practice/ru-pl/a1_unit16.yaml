    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Форма винительного падежа от gorączka оканчивается на -ę, как kawa → kawę.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson02.order.005
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
  type: word_order
  frame:
    text: Ewa jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa — женщина, поэтому прилагательное получает женское окончание -a.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit16.lesson02.fill.006
  lesson_content_key: pl.a1.unit16.lesson02.zle_sie_czuje
