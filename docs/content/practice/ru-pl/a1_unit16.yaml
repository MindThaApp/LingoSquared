    language_code: ru
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: После proszę глагол остаётся в начальной форме.
    language_code: ru
    direction: ltr
