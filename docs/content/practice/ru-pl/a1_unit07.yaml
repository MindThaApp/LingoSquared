templates:
- content_key: practice.ru-pl.pl.a1.unit07.lesson01.choose.001
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'С глаголом kosztować в польском используются наречия: kosztuje tanio (стоит дёшево) и kosztuje drogo (стоит дорого).'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson01.listen.002
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cebula — женского рода, потому что оканчивается на -a; banan, pomidor, ogórek и ziemniak — мужского рода.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson01.order.003
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: word_order
  frame:
    text: Ile kosztuje {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile kosztuje спрашивает о цене одного предмета, поэтому существительное остаётся в основной форме единственного числа.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson01.fill.004
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: fill_in_blank
  frame:
    text: Banany {item} tanio. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Глагол согласуется с числом: kosztuje — для одного предмета, kosztują — для нескольких.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson01.translate.005
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: Банан дешёвый. (используй глагол «стоить»)
    language_code: ru
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Banan kosztuje {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: В польском говорят «банан стоит дёшево» — вместо отдельного прилагательного используется наречие.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson01.translate.006
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kosztować — словарная форма; в предложениях она превращается в kosztuje или kosztują.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson02.choose.001
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pół означает «половина» и стоит перед kilo: pół kilo — это полкило.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson02.listen.002
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poproszę — вежливая просьба, которую используют, когда что-то заказывают или покупают.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson02.match.003
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'После kilo и pół kilo существительное принимает окончание множественного числа -ów: banan становится bananów, а pomidor — pomidorów.'
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson02.order.004
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: word_order
  frame:
    text: Poproszę kilo {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Poproszę kilo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: После слова меры, например kilo, существительное ставится в родительный падеж множественного числа, который у этих слов оканчивается на -ów.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson02.fill.005
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: fill_in_blank
  frame:
    text: Poproszę pół {item} bananów. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pół kilo означает «полкило»; само слово kilo здесь не изменяется.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson02.translate.006
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: translation
  frame:
    text: Я хотел бы килограмм помидоров.
    language_code: ru
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Poproszę kilo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Pomidor меняется на pomidorów после kilo, потому что существительное стоит после слова меры.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson02.translate.007
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mandarynka и pomarańcza — женского рода, а grejpfrut — мужского.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson03.choose.001
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Świeże — форма множественного числа от слова «свежий», поэтому оно подходит к pomidory и banany.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson03.match.002
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Pomidory — множественное число от pomidor, поэтому прилагательное имеет форму świeże.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson03.fill.003
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: fill_in_blank
  frame:
    text: Pomidory są {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Существительным во множественном числе, например pomidory, нужно прилагательное во множественном числе, поэтому «свежий» превращается в świeże.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson03.fill.004
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: fill_in_blank
  frame:
    text: To {item} pani. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dla означает «для», и после него стоит тот, кто получает что-то, здесь — pani.
    language_code: ru
    direction: ltr
- content_key: practice.ru-pl.pl.a1.unit07.lesson03.translate.005
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: translation
  frame:
    text: '{item}'
    language_code: ru
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Razem употребляется, когда подсчитывают сумму, например итог на рынке.
    language_code: ru
    direction: ltr
