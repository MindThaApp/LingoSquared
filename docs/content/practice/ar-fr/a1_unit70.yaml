  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_avait
    - w_cet
    - w_clé
    - w_compris
    - w_mot
    - w_nuit
    - w_nuits
    - w_réceptionniste
    - w_réservation
    - w_réserver
    - w_réservé
    - w_wifi
