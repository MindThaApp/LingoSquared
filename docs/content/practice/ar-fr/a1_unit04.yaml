    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'كثير من كلمات السوق أسماء أطعمة تأتي بعد الكمّية مع de: un kilo de tomates, un litre de lait.'
    language_code: ar
    direction: rtl
