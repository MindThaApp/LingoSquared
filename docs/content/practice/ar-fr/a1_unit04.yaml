templates:
- content_key: practice.ar-fr.fr.a1.unit04.lesson01.choose.001
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: كلمتا marché وprix مذكّرتان (le marché, le prix) بينما boulangerie مؤنّثة (la boulangerie)؛ تعلّم كل اسم مع أداة تعريفه.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit04.lesson01.listen.002
  lesson_content_key: fr.a1.unit04.lesson01.au_marche
