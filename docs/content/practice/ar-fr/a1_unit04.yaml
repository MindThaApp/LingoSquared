  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تأخذ كلمة euro حرف -s في الجمع (euros)، لكن هذا الحرف لا يُنطق، فتسمع العدد لا النهاية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit04.lesson02.choose.002
  lesson_content_key: fr.a1.unit04.lesson02.combien_ca_coute
