    text: Ça te dit de {item} les courses ensemble ?
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Ça te dit de {item} les courses ensemble ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Ça te dit de متبوعة بالفعل في المصدر تقترح فعل شيء معًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit11.lesson01.fill.006
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: fill_in_blank
  frame:
    text: Je suis {item} vendredi soir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Occupé بصيغة المذكر؛ وتكتب المرأة occupée.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit11.lesson01.fill.007
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: fill_in_blank
  frame:
    text: Devant le marché, {item} soir ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني Vendredi soir مساء الجمعة؛ ولا يحتاج اليوم إلى أداة تعريف أو حرف جر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit11.lesson01.translate.008
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: translation
  frame:
    text: هل أنت متفرغ يوم السبت؟ (غير رسمي، tu)
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu es {item} samedi ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu es libre? سؤال من صديق عن توفّرك؛ و samedi لا يحتاج إلى حرف جر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit11.lesson01.translate.009
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Libre له صيغة واحدة للمذكر والمؤنث؛ أما occupé فهو مذكر، و occupée مؤنث.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit11.lesson02.choose.001
