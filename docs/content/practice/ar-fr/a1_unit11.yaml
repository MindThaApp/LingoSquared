  answer_derivation:
    kind: render_frame
    frame:
      text: On se retrouve {item} le marché.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Devant تعني «أمام»، و on se retrouve تعني «نلتقي».
    language_code: ar
    direction: rtl
