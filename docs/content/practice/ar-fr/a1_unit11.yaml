      language_code: fr
      direction: ltr
  feedback_frame:
    text: تعني Venir chercher quelqu'un المجيء لاصطحاب شخص؛ ويبقى chercher في المصدر.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit11.lesson01.order.005
  lesson_content_key: fr.a1.unit11.lesson01.vocabulaire_projets
  type: word_order
