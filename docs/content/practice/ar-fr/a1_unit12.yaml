templates:
- content_key: practice.ar-fr.fr.a1.unit12.lesson01.choose.001
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Préparé وacheté وoublié وgoûté كلها اسم مفعول لأفعال من الفئة -er، وتنتهي بـ -é.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson01.listen.002
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تنتهي كل أسماء المفعول هذه بـ -é، وتُنطق مثل الصوت الأخير في café.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson01.order.004
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: word_order
  frame:
    text: Tu as {item} le gâteau ?
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu as {item} le gâteau ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Tu as aimé? سؤال في الماضي: as مع اسم المفعول aimé.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson01.fill.006
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: fill_in_blank
  frame:
    text: J'ai {item} des légumes au marché. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Acheté هو اسم المفعول من acheter، ويُستعمل بعد j'ai.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson01.translate.007
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: translation
  frame:
    text: حضّرتُ كعكة من أجل الورشة.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {item} un gâteau pour l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: J'ai préparé يتكوّن من avoir مع اسم المفعول، ولا يتغيّر آخر الكلمة بعد avoir.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson01.translate.008
  lesson_content_key: fr.a1.unit12.lesson01.passe_compose_avoir
  type: translation
  frame:
    text: نسيتُ الزبدة في البيت.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {item} le beurre à la maison.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: J'ai oublié هو الماضي المركّب (passé composé) من الفعل oublier.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson02.choose.001
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Être هو الفعل المساعد مع أفعال مثل arriver وaller وrester: je suis arrivé, il est resté.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson02.listen.002
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تتكوّن *Finalement* من الصفة *final* مع اللاحقة *-ment*.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson02.order.004
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: word_order
  frame:
    text: Le bus est {item} en retard.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Le bus est {item} en retard.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: يتفق Arrivé مع le bus، فهو مذكّر مفرد دون -e إضافية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson02.fill.006
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: fill_in_blank
  frame:
    text: Mathieu est {item} pour nettoyer la cuisine. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'يأخذ Rester الفعل المساعد être، لذلك يتفق resté مع Mathieu: مذكّر مفرد.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson02.translate.007
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: translation
  frame:
    text: ذهبتُ إلى السوق قبل الورشة. (تقولها امرأة)
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis {item} au marché avant l'atelier.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: مع être يتفق اسم المفعول مع الفاعل، لذلك تكتب المرأة allée.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson02.translate.008
  lesson_content_key: fr.a1.unit12.lesson02.passe_compose_etre
  type: translation
  frame:
    text: في النهاية، كانت الكعكة لذيذة.
    language_code: ar
    direction: rtl
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Finalement, le gâteau {item} délicieux.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Était هو الماضي الناقص (imparfait) من être؛ وتأتي finalement في بداية الجملة بمعنى «في النهاية».
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson03.choose.001
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Je n'ai pas pu venir تعني «لم أستطع المجيء»؛ وpu هو اسم المفعول من pouvoir.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson03.listen.002
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Samedi dernier تعني «السبت الماضي»؛ وتأتي dernier هنا بعد الاسم.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson03.match.003
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Là-bas تعني «هناك»، وrapidement تعني «بسرعة».
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson03.order.004
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: word_order
  frame:
    text: Je suis allé {item} à l'épicerie du coin.
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Je suis allé {item} à l'épicerie du coin.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Rapidement ظرف، ولا يتغيّر شكله.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson03.fill.005
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: fill_in_blank
  frame:
    text: Je n'ai pas {item} venir. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pu هو اسم المفعول من pouvoir؛ وn'ai pas تحيط بالفعل المساعد.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit12.lesson03.translate.006
  lesson_content_key: fr.a1.unit12.lesson03.dialogue_atelier_dernier
  type: translation
  frame:
    text: هل وجدتَ بعض الزبدة هناك؟ (بصيغة غير رسمية، tu)
    language_code: ar
    direction: rtl
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu as trouvé du beurre {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Tu as trouvé? صيغة غير رسمية، وdu beurre تعني «بعض الزبدة».
    language_code: ar
    direction: rtl
