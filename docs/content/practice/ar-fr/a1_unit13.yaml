    direction: rtl
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce qu'on {item} samedi ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: On prépare هي الطريقة المعتادة في الكلام للتعبير عن «نحن نحضّر».
    language_code: ar
    direction: rtl
