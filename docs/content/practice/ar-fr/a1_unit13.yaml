- content_key: practice.ar-fr.fr.a1.unit13.lesson01.choose.001
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Préférer وaimer وdétester هي الأفعال الأساسية للتعبير عن الحب والكره.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit13.lesson01.listen.002
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: listen_select
