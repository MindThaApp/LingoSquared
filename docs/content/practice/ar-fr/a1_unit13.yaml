    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تعني Ça ne me dérange pas «لا يزعجني ذلك».
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit13.lesson02.translate.007
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: translation
  frame:
    text: ماذا تفضّل؟ (بصيغة غير رسمية، مع qu'est-ce que)
    language_code: ar
    direction: rtl
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Qu'est-ce que tu {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: تستعمل Tu préfères صيغة tu من الفعل préférer؛ أما vous préférez فهي صيغة المخاطبة المهذّبة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit13.lesson03.choose.001
  lesson_content_key: fr.a1.unit13.lesson03.dialogue_choisir_la_recette
