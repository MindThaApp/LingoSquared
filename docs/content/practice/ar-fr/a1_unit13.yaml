    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tarte وchocolat وépices وplats هي الأطعمة المذكورة في درس التفضيلات.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit13.lesson02.choose.001
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تعني Ou «أو»، أما où (بالإشارة فوق الحرف) فتعني «أين»؛ والإشارة هي التي تصنع الفرق.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit13.lesson02.listen.002
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pourrait هي صيغة الشرط من pouvoir، وتُستعمل لتقديم اقتراح مهذّب: on pourrait.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit13.lesson02.order.004
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: word_order
  frame:
    text: Tu aimes plutôt le sucré {item} le salé ?
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Tu aimes plutôt le sucré {item} le salé ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'تربط Ou بين خيارين: sucré ou salé تعني «حلو أو مالح».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit13.lesson02.fill.006
  lesson_content_key: fr.a1.unit13.lesson02.demander_les_preferences
  type: fill_in_blank
  frame:
