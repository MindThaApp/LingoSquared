    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: كلمة Épices جمع؛ حرف -s الأخير لا يُنطق، لذا تُسمع épice بالطريقة نفسها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit13.lesson01.order.004
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: word_order
  frame:
    text: J'aime {item} les plats salés que les plats sucrés.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: J'aime {item} les plats salés que les plats sucrés.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: تعني Aimer mieux «يفضّل»؛ وتُدخل que ما هو أقل تفضيلًا.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit13.lesson01.fill.006
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: fill_in_blank
  frame:
    text: Mathieu {item} les épices trop fortes. ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Déteste هي صيغة il من الفعل détester، وهي تناسب ماتيو.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit13.lesson01.translate.008
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: translation
  frame:
    text: أفضّل تارت الشوكولاتة.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Je préfère la {item} au chocolat.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Au هي à مع le؛ وتصف au chocolat نكهة التارت.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit13.lesson01.translate.009
  lesson_content_key: fr.a1.unit13.lesson01.vocabulaire_preferences
  type: translation
  frame:
