  lesson_content_key: fr.a1.unit85.lesson03.les_acteurs_et_le
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} من كلمات هذه الوحدة، من درس «الممثلون وشباك التذاكر».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit85.lesson04.match.001
  lesson_content_key: fr.a1.unit85.lesson04.le_programme_du_spectacle
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: طابق كل كلمة فرنسية بمعناها بالعربية؛ الكلمات مأخوذة من دروس هذه الوحدة.
    language_code: ar
    direction: rtl
