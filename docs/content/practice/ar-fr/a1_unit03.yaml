    slot: item
  feedback_frame:
    text: تُنطق نهايات المضارع في habite/habites/habitent بالطريقة نفسها، فالضمير هو الذي يبيّن المقصود.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit03.lesson04.order.002
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
