    slot: item
  feedback_frame:
    text: 'cousin مذكر وcousine مؤنث: الحرف e يدل على قريبة ويجعل حرف n الأخير مسموعاً.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit03.lesson03.order.002
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: word_order
  frame:
    text: Mon {item} habite à Paris.
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mon {item} habite à Paris.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'يُستعمل mon قبل الأسماء المذكرة المفردة: mon père، mon oncle.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit03.lesson04.choose.001
  lesson_content_key: fr.a1.unit03.lesson04.describing_family_size
