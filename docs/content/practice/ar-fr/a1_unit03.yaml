templates:
- content_key: practice.ar-fr.fr.a1.unit03.lesson01.choose.001
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تعني Frères et sœurs معاً الإخوة والأخوات: ليس في الفرنسية كلمة يومية واحدة تشمل الإخوة من الجنسين.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit03.lesson01.listen.002
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تُنطق frère وfrères بالطريقة نفسها، وكذلك sœur وsœurs، فلا يدل على المفرد أو الجمع إلا أداة التعريف أو السياق.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit03.lesson01.match.003
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'يسهل اقتران كلمات العائلة الفرنسية متى عرفت الجنس: mère وpère، وtante وoncle، وcousine وcousin.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit03.lesson01.translate.004
  lesson_content_key: fr.a1.unit03.lesson01.immediate_family
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تأخذ frère وsœur علامة الجمع -s (frères، sœurs)، فإذا كان المعنى بالعربية جمعاً وجب الجمع في الفرنسية.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit03.lesson02.choose.001
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تُستعمل ma مع الأسماء المؤنثة (ma mère)، وmon مع المذكرة (mon père)، وmes مع كل الجموع (mes parents).
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit03.lesson02.order.002
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: word_order
  frame:
    text: Ma {item} est petite.
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma {item} est petite.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: تُستعمل ma مع اسم مؤنث مفرد؛ والصفة petite أيضاً تأخذ -e المؤنثة.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit03.lesson02.fill.003
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: fill_in_blank
  frame:
    text: '{item} famille est grande. ({hint})'
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: famille مؤنثة، لذا تأخذ ma؛ أما الاسم المذكر فيأخذ mon.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit03.lesson02.translate.004
  lesson_content_key: fr.a1.unit03.lesson02.possessives_mon_ma_mes
  type: translation
  frame:
    text: عائلتي صغيرة.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Ma famille est {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: petite مؤنثة لأن famille مؤنثة؛ أما الاسم المذكر فيأخذ petit.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit03.lesson03.choose.001
  lesson_content_key: fr.a1.unit03.lesson03.extended_family
  type: multiple_choice
