    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Après le travail تعني بعد العمل؛ وvers و d'habitude تدلان على توقيت تقريبي ومعتاد.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit06.lesson03.order.004
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
  type: word_order
  frame:
    text: C'est plus {item} après le travail.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: C'est plus {item} après le travail.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Plus pratique تعني أنسب أو أكثر عملية؛ وpratique لها الصيغة نفسها للمذكر والمؤنث.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit06.lesson03.fill.005
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
