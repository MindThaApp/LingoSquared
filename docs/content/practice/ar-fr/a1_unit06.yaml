  frame:
    text: أظن أنها (الورشة) تبدأ عند الساعة 18:30. (اكتب الوقت بالحروف)
    language_code: ar
    direction: rtl
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Il commence à dix-huit heures trente, je {item}.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'Je crois هي صيغة je من الفعل croire، وتخفف حدة العبارة: أظن ذلك.'
    language_code: ar
    direction: rtl
