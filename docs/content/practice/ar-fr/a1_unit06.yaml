  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vers تعني نحو، كما في vers vingt heures quinze، وتعطي وقتًا تقريبيًا.
    language_code: ar
    direction: rtl
