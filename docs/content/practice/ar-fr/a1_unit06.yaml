  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: À midi تعني عند الظهر؛ وmidi أيضًا الكلمة اليومية لوقت الغداء.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit06.lesson01.translate.006
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: translation
  frame:
    text: تبدأ الورشة في المساء لا في الصباح.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier commence le {item}, pas le matin.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Le soir تعني في المساء؛ وتنفي pas التقابل مع le matin.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit06.lesson02.choose.001
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Demie بصيغة المؤنث هنا لأن heure مؤنثة: dix heures et demie.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit06.lesson02.listen.002
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
  type: listen_select
