    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'L''heure اختصار la heure: تبدأ heure بحرف h صامت، لذلك تتحول la إلى l'' قبلها.'
    language_code: ar
    direction: rtl
