      language_code: fr
      direction: ltr
  feedback_frame:
    text: Le matin و le soir تعنيان في الصباح وفي المساء، دون كلمة تقابل «في».
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit06.lesson01.fill.005
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
