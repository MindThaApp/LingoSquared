    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Moins le quart تطرح ربعًا من الساعة التالية، لذا onze heures moins le quart هي 10:45.
    language_code: ar
    direction: rtl
