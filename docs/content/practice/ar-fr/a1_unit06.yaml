- content_key: practice.ar-fr.fr.a1.unit06.lesson01.choose.001
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Le matin و l'après-midi و le soir أسماء لأجزاء اليوم؛ أما midi و minuit فتعنيان الظهر ومنتصف الليل ولا تأتيان مع أداة تعريف.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit06.lesson01.listen.002
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
