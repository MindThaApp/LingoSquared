      direction: ltr
  feedback_frame:
    text: 'Et quart تضيف ربع ساعة؛ وتقول الفرنسية حرفيًا: عشر ساعات وربع.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit06.lesson03.choose.001
  lesson_content_key: fr.a1.unit06.lesson03.dialogue_prochain_atelier
