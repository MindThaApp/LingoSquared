    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'تأتي matin و après-midi و soir عادةً مع le أو l'' عند قول: في الصباح، بعد الظهر، في المساء.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit06.lesson01.order.004
  lesson_content_key: fr.a1.unit06.lesson01.moments_de_la_journee
  type: word_order
