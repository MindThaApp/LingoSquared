    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: L'atelier commence à {item} heure ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Quelle heure? تسأل عن الوقت؛ وquelle مؤنثة لتطابق heure.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit06.lesson02.fill.004
  lesson_content_key: fr.a1.unit06.lesson02.dire_lheure
