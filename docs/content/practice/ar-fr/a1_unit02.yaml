    language_code: fr
    direction: ltr
  slots:
    n: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai besoin de {n} œufs.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: Avoir besoin de + اسم تعني «احتاج إلى»؛ ويقع العدد بين de والاسم.
    language_code: ar
    direction: rtl
