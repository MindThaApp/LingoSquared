    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كثير من هذه الكلمات تُستعمل مع de بعد الكمية، مثل tasses de farine.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson06.fill.001
  lesson_content_key: fr.a1.unit02.lesson06.recipe_count_dialogue
  type: fill_in_blank
  frame:
    text: Tu {item} aussi besoin de sucre ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tu as هي «عندك» غير الرسمية؛ والصيغة الرسمية هي vous avez.
    language_code: ar
    direction: rtl
