    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'تستعمل الفرنسية de مع الكميات: deux tasses de farine، une demi-tasse de sucre.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson05.order.003
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
