templates:
- content_key: practice.ar-fr.fr.a1.unit02.lesson01.choose.001
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الأعداد من صفر إلى ستة عشر كلمات مفردة، أما من سبعة عشر إلى تسعة عشر فتُبنى من أجزاء، مثل dix-sept أي «عشرة-سبعة».
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson01.translate.002
  lesson_content_key: fr.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'انتبه إلى الإملاء: تحمل zéro علامة فوق الحرف، والأعداد المركّبة مثل trente-quatre تُربط بواصلة.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson02.choose.001
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'ابتداءً من السبعين يتغيّر النظام: soixante-dix تعني «ستين وعشرة» وquatre-vingts تعني «أربع عشرينات».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson02.listen.002
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الأعداد من صفر إلى ستة عشر كلمات مستقلة، ثم تعطي vingt وtrente وsoixante العشرات؛ والباقي يُبنى بجمعها.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson02.match.003
  lesson_content_key: fr.a1.unit02.lesson02.numbers_eleven_to_hundred
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: fr
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'تأخذ quatre-vingts حرف s في آخرها، لكنها تُسقطه حين يتبعها عدد آخر: quatre-vingt-dix.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson03.choose.001
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Quel âge as-tu? سؤال عن العمر: تقول الفرنسية إنك «تملك» عددًا من السنوات، لا إنك «تكون» بهذا العدد.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson03.order.002
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: word_order
  frame:
    text: J'ai {n} ans.
    language_code: fr
    direction: ltr
  slots:
    n: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {n} ans.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: تقول الفرنسية «عندي كذا سنة» (j'ai ... ans)، لا «أنا كذا».
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson03.fill.003
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: fill_in_blank
  frame:
    text: Quel âge {item} ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quel âge as-tu? صيغة غير رسمية؛ ومع شخص غريب تسأل quel âge avez-vous?
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson03.translate.004
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: عمري {n} سنة.
    language_code: ar
    direction: rtl
    slot_rendering:
      n: english_gloss
  slots:
    n: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: J'ai {n} ans.
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'تستعمل الفرنسية avoir (يملك) للتعبير عن العمر: j''ai vingt-huit ans، أي حرفيًا «أملك ثمانيًا وعشرين سنة».'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson03.translate.005
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: كم عمرك؟ (غير رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'تستعمل Quel âge as-tu? الضمير tu: للأصدقاء والعائلة والأقران فقط.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson03.translate.006
  lesson_content_key: fr.a1.unit02.lesson03.asking_age
  type: translation
  frame:
    text: كم عمرك؟ (رسمي)
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Quel âge {item} ?
      language_code: fr
      direction: ltr
  feedback_frame:
    text: 'تستعمل Quel âge avez-vous? الضمير vous: للغرباء وفي المواقف المهذبة.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson04.choose.001
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: S'il te plaît هي «من فضلك» غير الرسمية وs'il vous plaît هي الرسمية؛ والنمط يوافق tu وvous.
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson04.fill.002
  lesson_content_key: fr.a1.unit02.lesson04.phone_numbers
  type: fill_in_blank
  frame:
    text: Quel est ton {item} de téléphone ? ({hint})
    language_code: fr
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ton هي صيغة الملكية غير الرسمية («الخاص بك»)؛ ومع شخص غريب تسأل quel est votre numéro de téléphone?
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson05.listen.001
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: listen_select
  frame:
