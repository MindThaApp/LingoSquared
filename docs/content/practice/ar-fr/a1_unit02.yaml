    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Œufs جمع: حرف f في œuf لا يُنطق في الجمع، لذا يختلف نطق œufs عن المفرد.'
    language_code: ar
    direction: rtl
- content_key: practice.ar-fr.fr.a1.unit02.lesson05.match.002
  lesson_content_key: fr.a1.unit02.lesson05.recipe_quantities
  type: matching_pairs
  frame:
