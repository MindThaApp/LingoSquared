    - verb
    agreement_tags:
      semantic: symptom_word
  symptom_noun_word: &id002
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic: symptom_noun_word
  help_word: &id003
    language_code: fa
    part_of_speech:
    - noun
    - verb
    - phrase
    agreement_tags:
      semantic: help_word
  help_phrase: &id004
    language_code: fa
    part_of_speech: phrase
    agreement_tags:
      semantic: help_word
  advice_word: &id006
    language_code: fa
    part_of_speech: noun
    agreement_tags:
      semantic: advice_word
  advice_phrase: &id007
    language_code: fa
    part_of_speech: phrase
    agreement_tags:
      semantic: advice_phrase
  health_review_word: &id008
    language_code: fa
    part_of_speech:
    - noun
    - verb
    - phrase
    agreement_tags:
      semantic:
      - symptom_word
      - help_word
      - advice_word
      - advice_phrase
  advice_or_advice_phrase: &id005
    language_code: fa
    part_of_speech:
    - noun
    - phrase
    agreement_tags:
      semantic:
      - advice_word
      - advice_phrase
templates:
- content_key: practice.zh-fa.fa.a1.unit17.lesson01.symptom_choice.001
  lesson_content_key: fa.a1.unit17.lesson01.basic_symptoms
  type: multiple_choice
  frame:
    text: '{symptom_word}'
    language_code: fa
    direction: rtl
  slots:
    symptom_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: symptom_word
  feedback_frame:
    text: '{symptom_word} 用来描述人的感觉。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-fa.fa.a1.unit17.lesson01.symptom_have_order.002
  lesson_content_key: fa.a1.unit17.lesson01.basic_symptoms
  type: word_order
  frame:
    text: '{symptom_noun_word} دارم'
    language_code: fa
    direction: rtl
  slots:
    symptom_noun_word: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: '{symptom_noun_word} دارم'
      language_code: fa
      direction: rtl
  feedback_frame:
    text: دارم 的意思是“我有”，例如 سردرد دارم（我头痛）。
    language_code: zh
    direction: ltr
