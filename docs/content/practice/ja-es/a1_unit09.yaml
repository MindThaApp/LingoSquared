templates:
- content_key: practice.ja-es.es.a1.unit09.lesson01.order.001
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: word_order
  frame:
    text: Cruza la {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: Cruza la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 「通りを渡ってください」。Cruzaはcruzarのtúに対する命令形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit09.lesson01.fill.002
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: fill_in_blank
  frame:
    text: Dobla a la izquierda en la {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: En la esquinaは「角で」という意味です。スペイン語では場所を表すのにenを使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit09.lesson02.choose.001
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Doblarとgirarはどちらも「曲がる」という意味で、doblaとgiraはそのtúに対する命令形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit09.lesson02.order.002
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: word_order
  frame:
    text: Gira a la {item} en la esquina.
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gira a la {item} en la esquina.
      language_code: es
      direction: ltr
  feedback_frame:
    text: A la izquierdaは「左に」、a la derechaは「右に」という意味です。derechoだけだと「まっすぐ」という意味になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit09.lesson02.translate.003
  lesson_content_key: es.a1.unit09.lesson02.verbos_de_movimiento
  type: translation
  frame:
    text: まっすぐ行ってください。(親しい相手への命令)
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Sigue {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Sigueは「進み続ける」という意味のseguirから来ています。「まっすぐ」のderechoは、「右」のderechaとは別の語です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit09.lesson03.order.001
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: word_order
  frame:
    text: ¿Cómo {item} a la biblioteca?
    language_code: es
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cómo {item} a la biblioteca?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 図書館へはどう行けばいいですか。男性名詞の場所の前では、a + elはalになります:¿Cómo llego al parque?
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit09.lesson03.fill.002
  lesson_content_key: es.a1.unit09.lesson03.como_llego_a
  type: fill_in_blank
  frame:
    text: 'Es muy {item}: sigue derecho. ({hint})'
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fácilは、男性名詞でも女性名詞でも同じ形です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit09.lesson04.translate.001
  lesson_content_key: es.a1.unit09.lesson04.confirmar_direcciones
  type: translation
  frame:
    text: 道に迷わないでね!(親しい相手に対して)
    language_code: ja
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡No te {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: 否定の命令では別の動詞の形を使います:pierdesではなくpierdasです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit09.lesson05.match.001
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: スペイン語の道案内では、ふつうtúに対する命令形を使います:sigue、dobla、cruza。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit09.lesson05.translate.002
  lesson_content_key: es.a1.unit09.lesson05.leer_las_direcciones
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Desde el mercadoは「市場から」という意味で、道順の出発点を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit09.lesson06.listen.001
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: マテオは、合っているか確かめるために、yoの形のsigoとdobloで道順を繰り返します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit09.lesson06.translate.002
  lesson_content_key: es.a1.unit09.lesson06.direcciones_a_la_biblioteca_dialogue
  type: translation
  frame:
    text: どういたしまして。
    language_code: ja
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: De {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De nadaは直訳すると「何でもないこと」という意味で、graciasに対する決まった返事です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit09.lesson01.listen.003
  lesson_content_key: es.a1.unit09.lesson01.la_calle_y_la_esquina
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Derecha(右)とderecho(まっすぐ)は、最後の母音だけが違います。そこに注意して聞きましょう。
    language_code: ja
    direction: ltr
