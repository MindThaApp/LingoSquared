templates:
- content_key: practice.ja-es.es.a1.unit06.lesson01.choose.001
  lesson_content_key: es.a1.unit06.lesson01.comida_y_bebida
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Agua は女性名詞ですが、アクセントのある a で始まるため、単数では el を使います:el agua fría。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit06.lesson01.listen.002
  lesson_content_key: es.a1.unit06.lesson01.comida_y_bebida
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Café、menú、sándwich にはアクセント記号があり、強く読む音節を示しています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit06.lesson02.order.001
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: word_order
  frame:
    text: Quiero un {item}, por favor.
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Un は男性名詞(un café)に、女性名詞には una(una ensalada)を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit06.lesson02.translate.002
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: translation
  frame:
    text: '{item}をひとつお願いします。'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quiero un {item}, por favor.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 注文の言い方には、para mí + 料理もよく使われます:para mí, un café。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit06.lesson02.fill.003
  lesson_content_key: es.a1.unit06.lesson02.pedir_comida
  type: fill_in_blank
  frame:
    text: ¿Qué {item} comer? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Querer は語幹が変化します:quiero、quieres、quiere、でも queremos。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit06.lesson03.order.001
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: word_order
  frame:
    text: ¿Podemos ver el {item}?
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Podemos ver el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: メニューを見てもいいですか?¿Podemos + 不定詞? は、丁寧にお願いするときの言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit06.lesson03.translate.002
  lesson_content_key: es.a1.unit06.lesson03.pedir_el_menu
  type: translation
  frame:
    text: どうぞ召し上がれ!
    language_code: ja
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buen {item}!
      language_code: es
      direction: ltr
  feedback_frame:
    text: Buen provecho は、これから食事をする人に言う言葉で、隣のテーブルの知らない人にも使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit06.lesson04.fill.001
  lesson_content_key: es.a1.unit06.lesson04.postre_y_la_cuenta
  type: fill_in_blank
  frame:
    text: La {item}, por favor. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: スペインでは、ウェイターは普通、こちらから頼むまでお会計を持ってきません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit06.lesson04.translate.002
  lesson_content_key: es.a1.unit06.lesson04.postre_y_la_cuenta
  type: translation
  frame:
    text: デザートにケーキがほしいです。
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: De postre quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De postre は「デザートに」という意味で、ここでは pastel の前に冠詞は要りません。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit06.lesson05.match.001
  lesson_content_key: es.a1.unit06.lesson05.leer_el_menu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: スペインの menú del día は定食の昼食で、前菜、メインディッシュ、postre、たいていパンと飲み物がついて、値段は一つです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit06.lesson06.translate.001
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Comida は「食べ物」と「昼食」の両方を意味し、スペインでは一日のうちでいちばんしっかりした食事です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit06.lesson06.choose.002
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ウェイターが ¿Qué quieren comer? と言うのは、quieren が二人に向けた形だからです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit06.lesson06.match.003
  lesson_content_key: es.a1.unit06.lesson06.el_almuerzo_dialogue
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Quiero、quieres、quieren はどれも「ほしい、〜したい」を意味する querer の形です。
    language_code: ja
    direction: ltr
