    - w_mediana
    - w_talla
    - w_mal
    - w_comprarlo
    - w_barato
    - w_delantales
slot_presets:
  clothes: &id001
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: es_a1_u11_l01
  nouns: &id002
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: es_a1_u11
  content: &id007
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u11
  verbs: &id010
    language_code: es
    part_of_speech:
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u11
  mediana: &id003
    language_code: es
    part_of_speech: adjective
    agreement_tags:
      semantic: w_mediana
  talla: &id004
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_talla
  mal: &id005
    language_code: es
    part_of_speech: adverb
    agreement_tags:
      semantic: w_mal
  comprarlo: &id006
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_comprarlo
  barato: &id008
    language_code: es
    part_of_speech: adjective
    agreement_tags:
      semantic: w_barato
  delantales: &id009
    language_code: es
