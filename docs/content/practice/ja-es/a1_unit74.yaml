schema_version: '1.0'
pack_key: practice.ja-es.a1.unit74
source_language: ja
target_language: es
unit_content_key: es.a1.unit74.bioscoop
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_cartelera
    - w_comprar
    - w_infantil
    - w_museo
    - w_palomitas
    - w_película
    - w_sesión
templates:
- content_key: practice.ja-es.es.a1.unit74.lesson01.choose.001
  lesson_content_key: es.a1.unit74.lesson01.quiero_ver_una_pelicula
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_película
        - w_comprar
        - w_sesión
        - w_cartelera
        - w_palomitas
        - w_infantil
        - w_museo
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「映画を見たいです」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit74.lesson02.listen.001
  lesson_content_key: es.a1.unit74.lesson02.que_pelicula_quiere_ver
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「どの映画をご覧になりますか」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit74.lesson03.translate.001
  lesson_content_key: es.a1.unit74.lesson03.a_que_hora_empieza
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「上映は何時に始まりますか」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit74.lesson05.match.001
  lesson_content_key: es.a1.unit74.lesson05.leer_la_cartelera
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: スペイン語の単語を、それぞれの日本語の意味と組み合わせてください。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit74.lesson06.choose.001
