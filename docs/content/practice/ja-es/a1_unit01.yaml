templates:
- content_key: practice.ja-es.es.a1.unit01.lesson01.choose.001
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: スペイン語には「あなた」を表す言葉が2つあります。友人や家族には tú、初対面の人や敬意を示したい相手には usted を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson01.fill.002
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: fill_in_blank
  frame:
    text: ¿Cómo está {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Está は usted に使います。tú の場合、動詞は estás になります：¿Cómo estás?
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson01.translate.003
  lesson_content_key: es.a1.unit01.lesson01.tu_and_usted
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: スペイン語のあいさつや日常会話の言葉には、アクセント記号がよくつきます(cómo, adiós, también)。アクセント記号は、強く読む音節を示します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson02.listen.001
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buenos días は昼食の時間まで(スペインでは午後2時ごろまで)、buenas tardes は午後、buenas noches は夕方から夜に使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson02.match.002
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Día は男性名詞(buenos días)で、tarde と noche は女性名詞(buenas tardes, buenas noches)です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson02.order.003
  lesson_content_key: es.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Adiós, hasta {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Adiós, hasta {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Hasta luego は直訳すると「あとでまで」で、日常的に使う「またね」にあたる表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson03.order.001
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Hola, me llamo {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Hola, me llamo {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Me llamo は直訳すると「私は自分を~と呼びます」で、名前を言うときの日常的な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson03.translate.002
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: translation
  frame:
    text: こちらは{name}です。(男性を紹介する場合)
    language_code: ja
    direction: ltr
    slot_rendering:
      name: token
  slots:
    name: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Este es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 男性を紹介するときは este、女性を紹介するときは esta を使います：Esta es Ana.
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson03.order.003
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: word_order
  frame:
    text: Esta es {name}.
    language_code: es
    direction: ltr
  slots:
    name: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Esta es {name}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Esta は女性を紹介するときに使います。男性の場合は este と言います：Este es Carlos.
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson03.fill.004
  lesson_content_key: es.a1.unit01.lesson03.names_and_introductions
  type: fill_in_blank
  frame:
    text: Mucho {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mucho gusto は「はじめまして」にあたる表現で、返事には igualmente(こちらこそ)がよく使われます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson04.order.001
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: word_order
  frame:
    text: Soy de {place}, pero vivo en Londres.
    language_code: es
    direction: ltr
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}, pero vivo en Londres.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Ser de + 場所 は出身地を、vivir en + 場所 は今住んでいる場所を表します。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson04.translate.002
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: translation
  frame:
    text: 私は{place}出身です。
    language_code: ja
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Soy de {place}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 同じ質問をするには：¿De dónde eres?(くだけた言い方)または ¿De dónde es usted?(丁寧な言い方)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson04.fill.003
  lesson_content_key: es.a1.unit01.lesson04.origin_and_language
  type: fill_in_blank
  frame:
    text: Todavía estoy {item}. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Estoy + -ando/-iendo は、今まさに進行中のことを表します。「まだ勉強中です」のような場合です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson05.order.001
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: word_order
  frame:
    text: Sí, es mi primera {item} aquí.
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sí, es mi primera {item} aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Vez は「機会」という意味の「回」です：primera vez(初めて)、otra vez(もう一度)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson05.translate.002
  lesson_content_key: es.a1.unit01.lesson05.shared_activity_small_talk
  type: translation
  frame:
    text: 料理は好きですか。(くだけた言い方)
    language_code: ja
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Te gusta {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: スペイン語では gustar を使って好きなことを言います。その活動があなたの気に入る、という考え方で、te gusta + 不定詞 の形になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson06.listen.001
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: エレナとマテオは同じ料理教室の仲間なので、お互いに tú を使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit01.lesson06.translate.002
  lesson_content_key: es.a1.unit01.lesson06.cooking_workshop_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: スペイン語では、動詞の語尾で人称が分かるとき、主語の人称代名詞を省略します。vivo は「私は住んでいます」という意味です。
    language_code: ja
    direction: ltr
