    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「舞台と幕」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit83.lesson03.translate.001
  lesson_content_key: es.a1.unit83.lesson03.los_actores_y_la
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「俳優たちとチケット売り場」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit83.lesson04.match.001
  lesson_content_key: es.a1.unit83.lesson04.el_programa_de_la
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: スペイン語の単語を、それぞれの日本語の意味と組み合わせてください。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
