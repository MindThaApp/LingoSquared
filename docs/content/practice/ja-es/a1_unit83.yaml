schema_version: '1.0'
pack_key: practice.ja-es.a1.unit83
source_language: ja
target_language: es
unit_content_key: es.a1.unit83.theater
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_actores
    - w_butaca
    - w_butacas
    - w_descanso
    - w_función
    - w_obra
    - w_popular
    - w_satisfecho
    - w_telón
templates:
- content_key: practice.ja-es.es.a1.unit83.lesson01.choose.001
  lesson_content_key: es.a1.unit83.lesson01.vamos_hoy_al_teatro
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_función
        - w_popular
        - w_telón
        - w_actores
        - w_obra
        - w_descanso
        - w_butacas
        - w_butaca
        - w_satisfecho
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「今日は劇場に行きましょうか?」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit83.lesson02.listen.001
  lesson_content_key: es.a1.unit83.lesson02.el_escenario_y_el
  type: listen_select
  frame:
