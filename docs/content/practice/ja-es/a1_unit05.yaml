templates:
- content_key: practice.ja-es.es.a1.unit05.lesson01.order.001
  lesson_content_key: es.a1.unit05.lesson01.decir_la_hora_en_punto
  type: word_order
  frame:
    text: ¿Qué {item} es?
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Qué {item} es?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 「何時ですか」には son las + 時刻(son las dos)で答えますが、1時だけは es la una です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson01.choose.002
  lesson_content_key: es.a1.unit05.lesson01.decir_la_hora_en_punto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 時刻は horas(時間)を表すので女性形になります：las dos, las cuatro。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson02.order.001
  lesson_content_key: es.a1.unit05.lesson02.cuarto_y_media
  type: word_order
  frame:
    text: Son las cuatro y {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las cuatro y {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 4時15分です。30分は y media で表します：son las cuatro y media。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson02.translate.002
  lesson_content_key: es.a1.unit05.lesson02.cuarto_y_media
  type: translation
  frame:
    text: 5時15分前です。
    language_code: ja
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las cinco {item} cuarto.
      language_code: es
      direction: ltr
  feedback_frame:
    text: スペイン語では次の時刻から数えて戻ります：5時引く15分、という言い方をします。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson03.order.001
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: word_order
  frame:
    text: Son las ocho de la {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Son las ocho de la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: De la mañana, de la tarde, de la noche は、午前・午後のように使います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson03.translate.002
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: translation
  frame:
    text: ワークショップは午後4時に始まります。
    language_code: ja
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: El taller empieza a las cuatro de la {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 「~時に」は a las + 時刻で表します：a las cuatro。1時だけは a la una です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson03.match.003
  lesson_content_key: es.a1.unit05.lesson03.partes_del_dia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mañana は「朝」(la mañana)の意味と「明日」の意味があり、たいてい冠詞で見分けます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson04.fill.001
  lesson_content_key: es.a1.unit05.lesson04.proponer_una_hora_para_verse
  type: fill_in_blank
  frame:
    text: De {item}, a las tres y media. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: De acuerdo は、予定に同意するときの標準的な言い方です：了解、決まりです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson04.translate.002
  lesson_content_key: es.a1.unit05.lesson04.proponer_una_hora_para_verse
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Antes de は「~の前に」という意味です：antes del taller(ワークショップの前に)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson05.listen.001
  lesson_content_key: es.a1.unit05.lesson05.leer_el_horario_del_dia
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Almorzar は「昼食をとる」ことです。スペインでは、たいてい2時から3時の間に昼食をとります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson05.fill.002
  lesson_content_key: es.a1.unit05.lesson05.leer_el_horario_del_dia
  type: fill_in_blank
  frame:
    text: Al día {item}, Elena y Mateo almuerzan juntos. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al día siguiente は「翌日」という意味です。siguiente は名詞のあとに来ます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson06.order.001
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: word_order
  frame:
    text: ¡Buena {item}! Comemos mañana.
    language_code: es
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: ¡Buena {item}! Comemos mañana.
      language_code: es
      direction: ltr
  feedback_frame:
    text: いい考えですね！明日食べましょう。idea は女性名詞なので、「いい」は buena になります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson06.translate.002
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: translation
  frame:
    text: この近くにレストランがあります。
    language_code: ja
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Hay un {item} cerca de aquí.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Hay は新しく出てくるものを示します：hay un restaurante。すでに知っている場所には está を使います：el restaurante está cerca。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit05.lesson06.choose.003
  lesson_content_key: es.a1.unit05.lesson06.planear_el_almuerzo_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¿Tienes hambre? スペイン語では「お腹が空いている」ではなく、「空腹を持つ」と言います。
    language_code: ja
    direction: ltr
