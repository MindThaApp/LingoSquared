  feedback_frame:
    text: '{item} は、この単元の「語学カフェでスペイン語を練習する」のレッスンに出てくる単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit57.lesson01.order.002
  lesson_content_key: es.a1.unit57.lesson01.estudiar_y_una_formacion
  type: word_order
  frame:
    text: A los dos les gusta {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_estudiar
  answer_derivation:
    kind: render_frame
    frame:
      text: A los dos les gusta {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 二人とも勉強が好きです。estudiar は「勉強する」という意味です。
    language_code: ja
    direction: ltr
