    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、この単元の「講座を受けることと学ぶこと」のレッスンに出てくる単語です。'
    language_code: ja
    direction: ltr
