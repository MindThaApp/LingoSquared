schema_version: '1.0'
pack_key: practice.ja-es.a1.unit15
source_language: ja
target_language: es
unit_content_key: es.a1.unit15.comparisons
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - es_a1_u15
    - w_viejo
    - w_equipo
    - w_espacio
    - w_mudarme
    - w_cocinas
    - w_sentido
slot_presets:
  content: &id002
    language_code: es
    part_of_speech:
    - noun
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic: es_a1_u15
  viejo: &id001
    language_code: es
    part_of_speech: adjective
    agreement_tags:
      semantic: w_viejo
  equipo: &id003
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_equipo
  espacio: &id004
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_espacio
  mudarme: &id005
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_mudarme
  cocinas: &id006
    language_code: es
    part_of_speech: verb
    agreement_tags:
      semantic: w_cocinas
  sentido: &id007
    language_code: es
    part_of_speech: noun
    agreement_tags:
      semantic: w_sentido
templates:
- content_key: practice.ja-es.es.a1.unit15.lesson02.order.001
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: word_order
  frame:
    text: El apartamento nuevo es más grande que el {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: El apartamento nuevo es más grande que el {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 新しいアパートは古いアパートより大きいです。Más + 形容詞 + que で二つのものを比べます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit15.lesson02.choose.002
  lesson_content_key: es.a1.unit15.lesson02.comparar_los_apartamentos
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: スペイン語では、más ... que(~より多い)、menos ... que(~より少ない)、tan ... como(~と同じくらい)で比べます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit15.lesson04.translate.001
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: translation
  frame:
    text: 私たちはいいチームです。
    language_code: ja
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Somos un buen {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Bueno は、男性単数名詞の前では buen になります：un buen equipo。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit15.lesson04.listen.002
  lesson_content_key: es.a1.unit15.lesson04.tan_bien_como
  type: listen_select
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tan bien como は「~と同じくらい上手に」という意味です：cocinas tan bien como yo。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit15.lesson05.fill.001
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: fill_in_blank
  frame:
    text: El apartamento nuevo tiene más {item} para cocinar. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 名詞の前の más は「もっと多くの~」を表します：más espacio(より多くのスペース)。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit15.lesson05.match.002
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Mudarse は「引っ越す」という意味です。マテオ本人が引っ越すので、quiero mudarme と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit15.lesson06.order.001
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: word_order
  frame:
    text: El viejo es más pequeño. Por eso quiero {item}.
    language_code: es
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: El viejo es más pequeño. Por eso quiero {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 古いほうは小さいです。だから引っ越したいです。Por eso は「だから」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit15.lesson06.translate.002
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Viejo は物にも人にも使う「古い」で、nuevo はその反対です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit15.lesson06.fill.003
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: fill_in_blank
  frame:
    text: Tú {item} tan bien como yo. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tan + 副詞 + como は、二人が同じくらい上手に何かをすることを比べる表現です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit15.lesson06.translate.004
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: translation
  frame:
    text: とても筋が通っています。
    language_code: ja
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Tiene mucho {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: スペイン語では「たくさんの意味を持っている」と言います：tiene mucho sentido。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit15.lesson06.choose.005
  lesson_content_key: es.a1.unit15.lesson06.comparar_apartamentos_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ¡Exacto! は、同意を伝える手軽な言い方で、「その通り」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit15.lesson05.translate.003
  lesson_content_key: es.a1.unit15.lesson05.leer_la_comparacion
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Espacio は「スペース、余裕」のことです。más espacio para cocinar は「料理をするためのもっと広いスペース」という意味です。
    language_code: ja
    direction: ltr
