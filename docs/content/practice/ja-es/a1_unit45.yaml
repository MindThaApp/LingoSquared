      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_total
        - w_euros
        - w_pagar
        - w_tarjeta
        - w_efectivo
        - w_puedo
        - w_pago
        - w_dividimos
        - w_separado
        - w_cambio
        - w_platos
        - w_pedimos
        - w_amable
        - w_paga
