- content_key: practice.ja-es.es.a1.unit45.lesson06.translate.001
  lesson_content_key: es.a1.unit45.lesson06.elena_y_mateo_pagan
  type: translation
  frame:
    text: '{item}'
    language_code: ja
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
