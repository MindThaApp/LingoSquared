    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit45.lesson01.order.002
  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: word_order
  frame:
    text: ¿Cuánto cuesta en {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_total
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Cuánto cuesta en {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 合計でいくらですか？En total を付けると、1品だけの値段ではなく、全部を合わせた金額をたずねていることがはっきりします。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit45.lesson01.fill.003
  lesson_content_key: es.a1.unit45.lesson01.cuanto_cuesta_en_total
  type: fill_in_blank
  frame:
    text: Cuesta veinticinco {item} en total. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_euros
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_euros
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 合計で25ユーロです。Cuesta は costar(値段が〜である)の三人称単数形で、強勢のある母音が o から ue に変わります。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit45.lesson02.order.002
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: word_order
  frame:
    text: ¿Puedo {item} con tarjeta aquí?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_pagar
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedo {item} con tarjeta aquí?
      language_code: es
      direction: ltr
  feedback_frame:
    text: ここでカードで支払えますか？pagar は「支払う」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit45.lesson02.fill.003
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: fill_in_blank
  frame:
    text: ¿Quiere pagar en efectivo o con {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tarjeta
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tarjeta
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 現金とカード、どちらで支払いますか？Quiere は querer の usted(丁寧)の形で、ここでは初対面のレジ係が使っています。友達になら ¿quieres pagar...? と言います。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit45.lesson02.translate.004
  lesson_content_key: es.a1.unit45.lesson02.tarjeta_o_efectivo
  type: translation
  frame:
    text: 現金で支払います。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_efectivo
  answer_derivation:
    kind: render_frame
    frame:
      text: Pago en {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 現金で支払います。efectivo は「現金」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit45.lesson03.order.002
  lesson_content_key: es.a1.unit45.lesson03.dividir_la_cuenta
  type: word_order
  frame:
    text: ¿Puedo pagar por {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: adjective
      agreement_tags:
        semantic: w_separado
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Puedo pagar por {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 別々に支払ってもいいですか？Por separado(別々に)は支払い方を表し、pagar(支払う)はそのための日常的な動詞です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit45.lesson04.order.002
  lesson_content_key: es.a1.unit45.lesson04.el_cambio
  type: word_order
  frame:
    text: Aquí tiene su {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_cambio
  answer_derivation:
    kind: render_frame
    frame:
      text: Aquí tiene su {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: お釣りです。cambio は「お釣り」や「交換」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit45.lesson06.order.002
  lesson_content_key: es.a1.unit45.lesson06.elena_y_mateo_pagan
  type: word_order
  frame:
    text: Mateo {item} la cuenta.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_paga
  answer_derivation:
    kind: render_frame
    frame:
      text: Mateo {item} la cuenta.
      language_code: es
      direction: ltr
  feedback_frame:
    text: Mateo がお会計を払います。Paga は pagar(支払う)の三人称単数形です：Mateo paga la cuenta.
    language_code: ja
    direction: ltr
