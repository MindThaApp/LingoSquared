  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_altura
    - w_atracción
    - w_cola
    - w_divertido
    - w_metro
    - w_noria
    - w_plano
    - w_teatro
templates:
- content_key: practice.ja-es.es.a1.unit82.lesson01.choose.001
  lesson_content_key: es.a1.unit82.lesson01.vamos_hoy_al_parque
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_atracción
        - w_cola
        - w_noria
        - w_plano
        - w_altura
        - w_metro
        - w_divertido
        - w_teatro
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語です。「今日は遊園地に行きましょうか？」のレッスンに出てきます。'
    language_code: ja
    direction: ltr
