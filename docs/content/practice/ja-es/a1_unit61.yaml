    language_code: es
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、切手・住所・書くことのレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
