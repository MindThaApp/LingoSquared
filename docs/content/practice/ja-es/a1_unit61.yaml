schema_version: '1.0'
pack_key: practice.ja-es.a1.unit61
source_language: ja
target_language: es
unit_content_key: es.a1.unit61.post
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-es by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Japanese). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_carta
    - w_compra
    - w_correos
    - w_desea
    - w_dirección
    - w_empleado
    - w_escribe
    - w_escribir
    - w_llegas
    - w_paquete
    - w_sello
    - w_tarda
    - w_tardar
templates:
- content_key: practice.ja-es.es.a1.unit61.lesson01.choose.001
  lesson_content_key: es.a1.unit61.lesson01.la_carta_y_el
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_carta
        - w_paquete
        - w_sello
        - w_dirección
        - w_escribir
        - w_llegas
        - w_tardar
        - w_tarda
        - w_empleado
        - w_desea
        - w_compra
        - w_correos
        - w_escribe
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} は、手紙と小包のレッスンに出てくるこのユニットの単語です。'
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit61.lesson02.listen.001
  lesson_content_key: es.a1.unit61.lesson02.el_sello_la_direccion
  type: listen_select
