  type: multiple_choice
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
  slots:
    item: &id001
      language_code: es
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_fresco
        - w_dulce
        - w_cruasán
        - w_unidad
        - w_cruasanes
        - w_heladería
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、パンとお菓子のレッスンで学ぶ、このユニットの単語です。'
    language_code: ja
    direction: ltr
