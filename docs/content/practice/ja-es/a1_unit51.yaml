- content_key: practice.ja-es.es.a1.unit51.lesson04.match.001
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: es
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: スペイン語の単語を、それぞれの日本語の意味と組み合わせてください。単語はこのユニットのレッスンから出ています。
    language_code: ja
    direction: ltr
