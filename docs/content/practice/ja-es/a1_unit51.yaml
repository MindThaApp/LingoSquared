    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit51.lesson06.order.002
  lesson_content_key: es.a1.unit51.lesson06.elena_y_mateo_de
  type: word_order
  frame:
    text: No hay {item}, todavía tenemos tiempo para un café.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_problema
  answer_derivation:
    kind: render_frame
    frame:
      text: No hay {item}, todavía tenemos tiempo para un café.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 大丈夫です、まだコーヒーを飲む時間はありますよ。No hay problema は気軽に安心させるときによく使う表現です。
    language_code: ja
    direction: ltr
