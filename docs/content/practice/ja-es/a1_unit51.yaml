  feedback_frame:
    text: 出口はどこですか。salida は「出口」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit51.lesson04.translate.004
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
  type: translation
  frame:
    text: 待合室はどこですか。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_espera
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Dónde está la sala de {item}?
      language_code: es
      direction: ltr
  feedback_frame:
