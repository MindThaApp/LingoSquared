        - w_precio
        - w_cuarenta
        - w_ahí
        - w_panel
        - w_problema
        - w_justo
        - w_suben
        - w_allá
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}は、このユニットの単語で、切符を買うレッスンに出てきます。'
