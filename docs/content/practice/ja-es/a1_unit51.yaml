- content_key: practice.ja-es.es.a1.unit51.lesson01.order.002
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: word_order
  frame:
    text: Quisiera un {item} a Toledo.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_billete
  answer_derivation:
    kind: render_frame
    frame:
      text: Quisiera un {item} a Toledo.
      language_code: es
      direction: ltr
  feedback_frame:
    text: トレドまでの切符がほしいのですが。billete は「切符」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit51.lesson01.fill.003
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: fill_in_blank
  frame:
    text: ¿Quiere un billete de ida o de ida y {item}? ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_vuelta
    hint:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_vuelta
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 片道切符になさいますか、それとも往復ですか。Quiere は querer の丁寧な usted の形で、ここでは初対面の駅員に対して使われています。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit51.lesson01.translate.004
  lesson_content_key: es.a1.unit51.lesson01.comprar_un_billete
  type: translation
  frame:
    text: 窓口では、ふつう丁寧な形の usted を使います。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_taquilla
  answer_derivation:
    kind: render_frame
    frame:
      text: En la {item} se suele usar la forma de cortesía usted.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 窓口では、ふつう丁寧な形の usted を使います。サービスを提供する立場の初対面の人には、tú ではなく usted で話しかけます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit51.lesson02.order.002
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: word_order
  frame:
    text: ¿De qué {item} sale el tren a Toledo?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_andén
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿De qué {item} sale el tren a Toledo?
      language_code: es
      direction: ltr
  feedback_frame:
    text: トレド行きの電車は何番ホームから出ますか。andén は「ホーム」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit51.lesson02.fill.003
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: fill_in_blank
  frame:
    text: El tren {item} a las diez menos cuarto del andén cinco. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_sale
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_sale
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 電車は9時45分に5番ホームから出ます。Las diez menos cuarto は、時刻のレッスンで学んだ「〜時の15分前」を表す言い方と同じです。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit51.lesson02.translate.004
  lesson_content_key: es.a1.unit51.lesson02.a_que_hora_sale
  type: translation
  frame:
    text: 電車は何時に到着しますか。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_tren
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿A qué hora llega el {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 電車は何時に到着しますか。¿A qué hora llega ...? は到着時刻をたずねる表現です。llegar は規則動詞で、時刻の前に a las を付けます。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit51.lesson03.order.002
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: word_order
  frame:
    text: Atención, el tren a Toledo lleva {item}.
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_retraso
  answer_derivation:
    kind: render_frame
    frame:
      text: Atención, el tren a Toledo lleva {item}.
      language_code: es
      direction: ltr
  feedback_frame:
    text: お知らせします。トレド行きの電車は遅れています。retraso は「遅れ」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit51.lesson03.fill.003
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: fill_in_blank
  frame:
    text: El tren {item} diez minutos de retraso. ({hint})
    language_code: es
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_lleva
    hint:
      language_code: es
      part_of_speech: verb
      agreement_tags:
        semantic: w_lleva
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 電車は10分遅れています。Lleva retraso(直訳は「遅れを運んでいる」)は、遅れていると言うときの自然な言い方です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit51.lesson03.translate.004
  lesson_content_key: es.a1.unit51.lesson03.retraso
  type: translation
  frame:
    text: 電車は5番ホームではなく3番ホームから出ます。
    language_code: ja
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_lugar
  answer_derivation:
    kind: render_frame
    frame:
      text: El tren sale del andén tres en {item} del andén cinco.
      language_code: es
      direction: ltr
  feedback_frame:
    text: 電車は5番ホームではなく3番ホームから出ます。En lugar de は「〜の代わりに、〜ではなく」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit51.lesson04.order.002
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
  type: word_order
  frame:
    text: ¿Dónde está la {item}?
    language_code: es
    direction: ltr
  slots:
    item:
      language_code: es
      part_of_speech: noun
      agreement_tags:
        semantic: w_entrada
  answer_derivation:
    kind: render_frame
    frame:
      text: ¿Dónde está la {item}?
      language_code: es
      direction: ltr
  feedback_frame:
    text: 入口はどこですか。entrada は「入口」という意味です。
    language_code: ja
    direction: ltr
- content_key: practice.ja-es.es.a1.unit51.lesson04.fill.003
  lesson_content_key: es.a1.unit51.lesson04.orientarse_en_la_estacion
