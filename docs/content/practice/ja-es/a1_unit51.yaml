    - w_lleva
    - w_lugar
    - w_panel
    - w_precio
    - w_problema
    - w_quisiera
    - w_recto
    - w_retraso
    - w_sale
    - w_salida
    - w_suben
    - w_taquilla
    - w_tren
    - w_vuelta
