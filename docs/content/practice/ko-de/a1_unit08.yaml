    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Was kosten ...?은 가격을 묻는 표현이며, 상품이 복수이면 동사도 복수형을 사용해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit08.lesson03.choose.004
  lesson_content_key: de.a1.unit08.lesson03.preisschilder_lesen
