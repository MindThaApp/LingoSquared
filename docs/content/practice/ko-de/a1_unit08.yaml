    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Markt는 명사이므로 첫 글자를 대문자로 쓰고, natürlich는 소문자로 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit08.lesson02.translate.017
  lesson_content_key: de.a1.unit08.lesson02.nach_preisen_fragen
  type: translation
  frame:
    text: 신선한가요?
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Ist es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: '예·아니요로 답하는 의문문에서는 동사가 맨 앞에 와요: Ist es frisch?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit08.lesson02.translate.018
  lesson_content_key: de.a1.unit08.lesson02.nach_preisen_fragen
  type: translation
  frame:
    text: 사과 가격이 얼마예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Was {item} die Äpfel?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Was kosten ...?은 가격을 물을 때 일상적으로 쓰는 표현이에요. 여기서는 주어가 복수형인 die Äpfel이므로 kosten을 써요.
    language_code: ko
    direction: ltr
