    slot: item
  feedback_frame:
    text: 복수형은 Äpfel에는 움라우트가 붙고, Eier에는 -er, Tomaten에는 -n이 붙어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit08.lesson03.translate.016
  lesson_content_key: de.a1.unit08.lesson03.preisschilder_lesen
  type: translation
  frame:
