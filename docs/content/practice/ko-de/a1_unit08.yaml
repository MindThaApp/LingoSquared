  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pfund, Dutzend, Kilo는 수사 뒤에서도 단수형을 유지해요: zwei Pfund, zwei Kilo.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit08.lesson01.listen.002
  lesson_content_key: de.a1.unit08.lesson01.einkaufsmengen
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Äpfel과 Eier는 복수형이고, 여기서 Reis는 복수형을 사용하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit08.lesson02.choose.003
  lesson_content_key: de.a1.unit08.lesson02.nach_preisen_fragen
