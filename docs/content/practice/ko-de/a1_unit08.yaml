    slot: item
  feedback_frame:
    text: Preisschild는 Preis(가격)와 Schild(표지판)가 합쳐진 합성어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit08.lesson04.listen.005
