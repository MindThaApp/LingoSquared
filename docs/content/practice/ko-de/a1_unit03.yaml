templates:
- content_key: practice.ko-de.de.a1.unit03.lesson01.choose.001
  lesson_content_key: de.a1.unit03.lesson01.null_bis_zehn
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 명사 앞에서는 eins가 ein으로 바뀌지만(ein Jahr), 수를 셀 때는 eins를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit03.lesson02.listen.001
  lesson_content_key: de.a1.unit03.lesson02.elf_bis_zwanzig
  type: listen_select
