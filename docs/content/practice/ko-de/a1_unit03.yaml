    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 16과 17은 기본 숫자에서 일부 글자가 빠져 sechzehn, siebzehn이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit03.lesson03.choose.001
  lesson_content_key: de.a1.unit03.lesson03.die_zehnerzahlen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 20보다 큰 수는 일의 자리 수를 먼저 놓아요. einundzwanzig는 말 그대로 ‘하나 그리고 스물’이라는 구조예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit03.lesson05.listen.001
  lesson_content_key: de.a1.unit03.lesson05.im_gespraech_ueber_das_alter
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Wenn ich fragen darf는 말 그대로 ‘제가 여쭤봐도 된다면’이라는 뜻의 정중한 완곡 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit03.lesson04.order.001
  lesson_content_key: de.a1.unit03.lesson04.wie_alt_sind_sie
  type: word_order
  frame:
    text: Ich bin {age} Jahre alt.
    language_code: de
    direction: ltr
  slots:
    age: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich bin {age} Jahre alt.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 독일어에서는 sein을 사용해 나이를 말해요. Ich bin zwanzig Jahre alt는 말 그대로 ‘나는 스무 살만큼 나이가 들었다’라는 구조예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit03.lesson04.order.002
  lesson_content_key: de.a1.unit03.lesson04.wie_alt_sind_sie
  type: word_order
  frame:
