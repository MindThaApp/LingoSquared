templates:
- content_key: practice.ko-de.de.a1.unit02.lesson01.choose.001
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ich는 문장 맨 앞에서만 대문자로 쓰고, 문장 중간에서는 ich처럼 소문자로 써요. 한국어의 '나'와 달리 독일어에서는 문장 위치에 따라 대소문자가 달라져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit02.lesson02.listen.001
  lesson_content_key: de.a1.unit02.lesson02.ich_bin_du_bist
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '동사 어미는 인칭에 따라 달라져요: ich komme, du kommst.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit02.lesson04.choose.001
  lesson_content_key: de.a1.unit02.lesson04.woher_kommen_sie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Woher는 어디에서 왔는지를 물으며, 대답할 때는 aus를 사용해요: Ich komme aus Deutschland.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit02.lesson01.listen.002
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Freut mich와 Ganz meinerseits는 처음 만났을 때 주고받는 공손한 표현이에요: 만나서 반가워요, 저도 반가워요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit02.lesson01.order.003
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: word_order
  frame:
    text: Ich heiße {item}.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich heiße {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Heiße는 heißen의 ich 형태이고, du와 함께 쓰면 heißt가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit02.lesson02.order.002
