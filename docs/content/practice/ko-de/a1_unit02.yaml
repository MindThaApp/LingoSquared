      direction: ltr
  feedback_frame:
    text: Bist는 sein의 du 형태이고, ich와 함께 쓸 때는 bin을 사용해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit02.lesson04.order.002
