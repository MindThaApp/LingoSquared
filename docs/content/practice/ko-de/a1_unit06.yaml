    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson03.fill.010
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: fill_in_blank
  frame:
    text: Ich {item} zwei Schwestern. ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ich habe는 ‘나는 …을 가지고 있다’라는 뜻이며, ich 뒤에서는 동사가 두 번째 자리에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson03.fill.011
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: fill_in_blank
  frame:
    text: Ich bin {item}. ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Einzelkind는 명사이므로 첫 글자를 대문자로 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson04.fill.012
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: fill_in_blank
  frame:
    text: Ist das {item} Familie? ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Familie는 여성 명사이므로 존칭 ‘당신의’는 대문자로 시작하는 Ihre예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson01.translate.013
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 가족 관련 단어를 포함한 모든 독일어 명사는 첫 글자를 대문자로 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson03.translate.014
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: 저는 자매가 두 명 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich habe zwei {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 'Schwester의 복수형에는 -n이 붙어요: zwei Schwestern.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson02.translate.015
  lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
  type: translation
  frame:
    text: 당신의 아버지는 누구세요?
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Wer ist {item} Vater?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Vater는 남성 명사이므로 존칭 ‘당신의’는 Ihre가 아니라 Ihr예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson03.translate.016
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: 이분은 제 어머니예요.
    language_code: ko
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Das ist {item} Mutter.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Mutter는 여성 명사이므로 ‘나의’가 meine로 바뀌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson04.translate.017
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: translation
  frame:
    text: 남자 형제가 있으세요?
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Haben Sie {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Brüder는 Bruder의 복수형이며 움라우트가 붙어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson03.translate.018
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: 아니요, 형제자매가 없어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Nein, ich habe {item} Geschwister.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Keine는 복수 명사와 여성 명사 앞에서 ‘없는’이라는 뜻을 나타낼 때 써요.
    language_code: ko
    direction: ltr
