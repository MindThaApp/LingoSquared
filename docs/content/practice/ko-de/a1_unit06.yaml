templates:
- content_key: practice.ko-de.de.a1.unit06.lesson01.choose.001
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Eltern은 부모님, Geschwister는 형제자매라는 뜻이며 둘 다 복수로 쓰이는 집합적인 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson02.listen.002
  lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 독일어에서는 사촌의 성별을 구분해 Cousin은 남자 사촌, Cousine는 여자 사촌을 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson03.choose.003
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Einzelkind는 글자 그대로 ‘한 명뿐인 아이’라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson04.choose.004
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lehrerin은 교사를 뜻하는 말의 여성형이고, Bruder의 복수형은 모음이 바뀐 Brüder예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson01.order.005
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: word_order
  frame:
    text: Das ist meine {item}.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Das ist meine {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 소유사는 명사에 맞춰요. 여기 나온 명사는 모두 여성 명사이므로 meine를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson03.order.006
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: word_order
  frame:
    text: Haben Sie {item}?
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Haben Sie {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Haben Sie는 존칭으로 상대를 가리키는 표현이며, 예·아니요로 답하는 의문문에서는 동사가 맨 앞에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson04.order.007
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: word_order
  frame:
    text: Meine {item} ist Lehrerin.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Meine {item} ist Lehrerin.
      language_code: de
      direction: ltr
  feedback_frame:
    text: '여성 명사에는 meine를 써요: meine Schwester, meine Tante, meine Cousine.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson01.match.008
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
