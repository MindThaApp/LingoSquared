    text: Eltern(부모님)은 복수형으로만 쓰이고, Geschwister(형제자매)는 형제와 자매를 함께 가리켜요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit06.lesson02.match.009
  lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
