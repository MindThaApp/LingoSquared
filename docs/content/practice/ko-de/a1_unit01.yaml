    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 높임말의 Sie, Ihnen, Ihr는 대문자로 쓰지만, 반말의 du와 dir는 대문자로 쓰지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson04.match.002
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: de
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
