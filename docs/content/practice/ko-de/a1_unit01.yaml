templates:
- content_key: practice.ko-de.de.a1.unit01.lesson01.choose.001
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Guten Morgen은 아침에, Guten Tag은 낮 동안, Guten Abend은 저녁부터 사용해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson02.listen.001
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tschüss는 친근한 작별 인사이고, Auf Wiedersehen은 낯선 사람이나 격식을 차리는 자리에서 쓰는 정중한 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson03.choose.001
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 독일어에는 '당신'을 나타내는 두 단어가 있어요. Sie는 낯선 사람이나 공적인 관계에서 쓰는 높임말이고, du는 친구, 가족, 어린이에게 쓰는 반말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson04.listen.001
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bitte는 부탁할 때의 말과 감사에 답하는 말을 모두 나타내며, Entschuldigung은 누군가의 주의를 끌거나 사과할 때 사용해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson03.order.002
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: word_order
  frame:
    text: Wie geht es {item}?
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Wie geht es Ihnen?은 어떻게 지내는지 정중하게 묻는 표현이고, 친구에게는 Wie geht's?라고 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson02.order.002
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: word_order
  frame:
    text: Bis {item}!
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Bis {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bis는 '~까지'라는 뜻이므로 Bis bald는 '곧 또 봐요', Bis später는 '나중에 봐요'와 같은 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson01.order.002
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: word_order
  frame:
    text: Guten {item}!
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Guten {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Morgen, Tag, Abend은 남성 명사이므로 Guten은 -n으로 끝나요. 여성 명사 Nacht에는 Gute Nacht를 사용해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson02.match.003
  lesson_content_key: de.a1.unit01.lesson02.abschied
  type: matching_pairs
