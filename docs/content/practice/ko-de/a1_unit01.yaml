    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Tschüss는 친근한 표현이고, Auf Wiedersehen은 잘 모르는 사람에게 쓰는 정중한 작별 인사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson03.match.003
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: de
    direction: ltr
  slots:
    first: *id008
