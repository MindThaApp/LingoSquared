    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Danke와 bitte는 일상에서 쓰는 두 가지 예의 표현이며, bitte는 '천만에요'라는 뜻으로도 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson03.fill.004
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: fill_in_blank
  frame:
    text: Und {item}? ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 여기서 반말 형태는 소문자로 쓰는 dir이고, 높임말 질문은 Und Ihnen?이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson04.fill.003
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: fill_in_blank
  frame:
    text: '{item} geschehen. ({hint})'
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gern geschehen은 danke에 답하는 일반적인 표현으로, 글자 그대로는 '기꺼이 일어난 일' 정도의 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson01.translate.003
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 독일어의 모든 명사는 대문자로 시작하므로 Morgen, Tag, Abend, Nacht도 첫 글자를 대문자로 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson03.translate.005
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sie와 du는 '당신'에 해당하는 주격 형태이고, Ihnen과 dir는 '당신에게'라는 뜻의 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson04.translate.004
  lesson_content_key: de.a1.unit01.lesson04.hoeflichkeit
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kein Problem은 감사나 가벼운 사과에 일상적으로 답하는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson01.translate.004
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: translation
  frame:
    text: 좋은 {item}이에요!
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Guten {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Guten Tag은 늦은 아침부터 사용할 수 있으며, 일반적인 인사말로도 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-de.de.a1.unit01.lesson02.translate.004
