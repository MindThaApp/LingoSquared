  notes: Derived from practice.en-fa by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Romanian). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - noun
  - verb
  - phrase
  agreement_tags:
    semantic:
    - plan_core_word
    - accept_word
    - decline_word
    - invitation_word
    - reviewed_phrase
    - en_fa_a1_unit12_lesson02_words
    - en_fa_a1_unit12_lesson04_words
slot_presets:
  plan_core_word: &id002
    language_code: fa
    part_of_speech:
    - noun
    - verb
    agreement_tags:
      semantic: plan_core_word
  accept_word: &id003
    language_code: fa
    part_of_speech: verb
    agreement_tags:
      semantic: accept_word
  decline_word: &id004
    language_code: fa
    part_of_speech: verb
    agreement_tags:
      semantic: decline_word
  invitation_word: &id005
    language_code: fa
    part_of_speech:
    - noun
    - verb
    agreement_tags:
      semantic: invitation_word
  unit12_review_word: &id001
    language_code: fa
    part_of_speech:
    - noun
    - verb
    - phrase
    agreement_tags:
      semantic:
      - plan_core_word
      - accept_word
      - decline_word
      - invitation_word
      - en_fa_a1_unit12_lesson02_words
