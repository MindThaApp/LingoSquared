templates:
- content_key: practice.ro-fa.fa.a1.unit12.lesson01.plan_core_choice.001
  lesson_content_key: fa.a1.unit12.lesson01.plan_vocabulary
  type: multiple_choice
  frame:
    text: '{plan_core_word}'
    language_code: fa
    direction: rtl
  slots:
    plan_core_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: plan_core_word
  feedback_frame:
    text: '{plan_core_word} este un cuvânt folosit pentru a face planuri.'
    language_code: ro
    direction: ltr
