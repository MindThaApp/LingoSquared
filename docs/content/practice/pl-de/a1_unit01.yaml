      text: Wie geht es {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Wie geht es Ihnen? to oficjalne „jak się Pan/Pani miewa?”; do przyjaciela mówisz Wie geht's?
    language_code: pl
    direction: ltr
- content_key: practice.pl-de.de.a1.unit01.lesson02.order.002
  lesson_content_key: de.a1.unit01.lesson02.abschied
