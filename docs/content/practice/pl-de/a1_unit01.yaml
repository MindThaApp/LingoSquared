  answer_derivation:
    kind: render_frame
    frame:
      text: Bis {item}!
      language_code: de
      direction: ltr
  feedback_frame:
    text: Bis znaczy „do”, więc Bis bald to „do zobaczenia wkrótce”, a Bis später – „do zobaczenia później”.
    language_code: pl
    direction: ltr
- content_key: practice.pl-de.de.a1.unit01.lesson01.order.002
