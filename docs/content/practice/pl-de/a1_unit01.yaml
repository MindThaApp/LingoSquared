    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Niemiecki ma dwa słowa na „ty”: Sie jest oficjalne (obcy, urzędnicy), du nieformalne (przyjaciele, rodzina, dzieci).'
    language_code: pl
    direction: ltr
