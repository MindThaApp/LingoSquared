  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Bitte oznacza zarówno „proszę”, jak i „nie ma za co”, a Entschuldigung służy do zwrócenia na siebie uwagi albo do przeproszenia.
    language_code: pl
    direction: ltr
- content_key: practice.pl-de.de.a1.unit01.lesson03.order.002
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: word_order
  frame:
    text: Wie geht es {item}?
    language_code: de
    direction: ltr
