  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tschüss to swobodne pożegnanie; Auf Wiedersehen jest grzeczne, używane wobec obcych i w sytuacjach oficjalnych.
    language_code: pl
    direction: ltr
- content_key: practice.pl-de.de.a1.unit01.lesson03.choose.001
  lesson_content_key: de.a1.unit01.lesson03.formell_und_informell
  type: multiple_choice
