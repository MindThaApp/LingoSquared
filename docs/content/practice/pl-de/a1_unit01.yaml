templates:
- content_key: practice.pl-de.de.a1.unit01.lesson01.choose.001
  lesson_content_key: de.a1.unit01.lesson01.hallo_und_tageszeiten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Guten Morgen mówimy rano, Guten Tag w ciągu dnia, a Guten Abend od wieczora.
    language_code: pl
    direction: ltr
- content_key: practice.pl-de.de.a1.unit01.lesson02.listen.001
