      part_of_speech:
      - adjective
      - adverb
      - preposition
      agreement_tags:
        semantic:
        - w_usually
        - w_every
        - w_after
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Usually, every și after stau înaintea verbului sau la începutul unei expresii de timp: I usually go, every day, after that.'
    language_code: ro
    direction: ltr
