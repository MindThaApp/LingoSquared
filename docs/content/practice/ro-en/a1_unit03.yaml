    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ascultă numărul de silabe: seven și zero au două silabe, celelalte numere până la zece doar una.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit03.lesson02.choose.003
  lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
