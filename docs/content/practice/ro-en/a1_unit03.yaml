    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: It's {item} dollars.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'La prețuri, numărul stă înaintea substantivului dollars, iar substantivul este la plural: five dollars.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit03.lesson03.order.008
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
