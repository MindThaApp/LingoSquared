  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Fifteen și fifty sună asemănător, dar se deosebesc prin accent: fifteen accentuează a doua silabă, fifty prima.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit03.lesson03.choose.005
  lesson_content_key: en.a1.unit03.lesson03.ages_prices_phones
  type: multiple_choice
  frame:
