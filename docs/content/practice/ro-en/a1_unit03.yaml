templates:
- content_key: practice.ro-en.en.a1.unit03.lesson01.choose.001
  lesson_content_key: en.a1.unit03.lesson01.zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cu numerele de la zero la zece spui vârsta, prețurile și numerele de telefon; numerele de telefon le spui cifră cu cifră.
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit03.lesson01.listen.002
