  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'În conversația de la piață întrebi prețul și vârsta cu aceleași forme ca înainte: How much …? și How old …?'
    language_code: ro
    direction: ltr
