  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'La numerele de la treisprezece la nouăsprezece, cuvântul englezesc se termină în -teen, iar la zeci în -ty: thirteen față de thirty.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit03.lesson02.listen.004
  lesson_content_key: en.a1.unit03.lesson02.eleven_to_hundred
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
