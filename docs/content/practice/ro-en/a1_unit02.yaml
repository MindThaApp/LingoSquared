    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Yes și no răspund la o întrebare, ca „da” și „nu”; student și teacher sunt roluri care cer un articol.
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson03.fill.013
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: fill_in_blank
  frame:
    text: Welcome to {item} library. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Articolul hotărât the rămâne neschimbat, indiferent dacă substantivul ar fi masculin, feminin sau neutru.
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson01.translate.014
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: Cum te cheamă? (informal)
    language_code: ro
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: What's {item} name?
      language_code: en
      direction: ltr
  feedback_frame:
    text: În engleză întrebi literal „Care este numele tău?”; întrebarea sună la fel față de prieteni și față de necunoscuți.
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson01.translate.015
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: translation
  frame:
    text: Numele meu este Leila.
    language_code: ro
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} name is Leila.'
      language_code: en
      direction: ltr
  feedback_frame:
    text: My este cuvântul posesiv pentru „meu”; în propoziție stă înaintea substantivului name.
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson02.translate.016
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rolurile precum student sau teacher au în engleză aceeași formă pentru femei și bărbați; nu există o terminație feminină separată.
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson02.translate.017
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: translation
  frame:
    text: Ea este inginer. (scris complet, fără formă scurtă)
    language_code: ro
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: She is {item} engineer.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Multe nume de profesii englezești nu au o formă feminină proprie: „inginer” și „inginer(ă)” se spun amândouă engineer.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson03.translate.018
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ro
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Welcome se folosește ca salut la intrare; thank face parte din thank you.
    language_code: ro
    direction: ltr
