templates:
- content_key: practice.ro-en.en.a1.unit02.lesson01.choose.001
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Your și my sunt cuvinte posesive: my name este „numele meu”, your name este „numele tău” sau „numele dumneavoastră”, pentru că engleza nu face deosebirea între tu și dumneavoastră.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson01.listen.002
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'What''s este forma scurtă de la what is și deschide întrebarea despre nume: What''s your name?'
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson02.choose.003
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'În engleză, înaintea unei profesii se pune de obicei un articol: a student, a teacher, dar an engineer, pentru că următorul cuvânt începe cu o vocală.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson02.listen.004
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'He se referă la un bărbat și she la o femeie; ambele se folosesc cu is: he is, she is.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson03.choose.005
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La bibliotecă auzi Welcome to the library; the este articolul hotărât și rămâne la fel pentru orice substantiv.
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson03.listen.006
  lesson_content_key: en.a1.unit02.lesson03.library_dialogue
  type: listen_select
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Thank you este formula politicoasă standard pentru „mulțumesc”.
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson01.order.007
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: word_order
  frame:
    text: My {item} is Leila.
    language_code: en
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: My {item} is Leila.
      language_code: en
      direction: ltr
  feedback_frame:
    text: În engleză spui literal „Numele meu este …”; verbul is stă între name și nume.
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson02.order.008
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: word_order
  frame:
    text: I am a {item}.
    language_code: en
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: I am a {item}.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'Înaintea unei profesii sau a unui rol, engleza cere articolul a: I am a student; în română articolul lipsește de obicei.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson01.fill.009
  lesson_content_key: en.a1.unit02.lesson01.exchange_names
  type: fill_in_blank
  frame:
    text: What's {item} name? ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Your corespunde lui you, adică lui „tu” și „dumneavoastră”; pentru „meu” folosești my.
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson02.fill.010
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: fill_in_blank
  frame:
    text: She is {item} engineer. ({hint})
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Înaintea unui sunet vocalic folosești an în loc de a: an engineer, dar a teacher.'
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson02.fill.011
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: fill_in_blank
  frame:
    text: '{item} is a teacher. ({hint})'
    language_code: en
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: He este forma masculină; pentru o femeie folosești she, iar pentru mai multe persoane they.
    language_code: ro
    direction: ltr
- content_key: practice.ro-en.en.a1.unit02.lesson02.match.012
  lesson_content_key: en.a1.unit02.lesson02.exchange_roles
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: en
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
