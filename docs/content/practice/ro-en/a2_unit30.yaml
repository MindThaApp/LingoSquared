      part_of_speech: verb
      agreement_tags:
        semantic: w_being
  answer_derivation:
    kind: render_frame
    frame:
      text: One of my strengths is {item} organized.
      language_code: en
      direction: ltr
  feedback_frame:
    text: 'După is urmează being: One of my strengths is being organized, adică „a fi organizat” ca trăsătură.'
    language_code: ro
    direction: ltr
