  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi امر رسمی است و برای صحبت با یک غریبه مناسب است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit09.lesson01.translate.007
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Il یا la بسته به جنس اسم عوض می‌شود، ولی قبل از مصوت l'' می‌آید: l''ufficio.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit09.lesson02.choose.001
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: C'è می‌پرسد یا می‌گوید چیزی وجود دارد؛ ce n'è با «یکی‌اش» جواب می‌دهد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit09.lesson02.listen.002
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ce n''è una یعنی «یکی‌اش هست»: ne به معنی «از آن‌ها» است.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit09.lesson02.fill.003
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
