templates:
- content_key: practice.fa-it.it.a1.unit09.lesson01.choose.001
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La farmacia، la banca و la stazione مؤنث هستند؛ l'ufficio postale مذکر است و حرف تعریفش کوتاه شده است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit09.lesson01.listen.002
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Via می‌تواند به معنی خیابان یا جاده باشد و در اسم‌هایی مثل Via Roma به کار می‌رود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit09.lesson01.order.003
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: word_order
  frame:
    text: Scusi, dov'è la {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dov'è la به‌اضافه‌ی یک اسم مؤنث می‌پرسد یک مکان کجاست؛ scusi شکل رسمی «ببخشید» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit09.lesson01.fill.004
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: fill_in_blank
