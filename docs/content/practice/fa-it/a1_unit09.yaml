    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Accanto alla یعنی «کنارِ»؛ alla از a به‌اضافه‌ی la ساخته شده است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit09.lesson02.fill.006
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
