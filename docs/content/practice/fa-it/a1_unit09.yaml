    slot: item
  feedback_frame:
    text: Alla از ترکیب a و la قبل از یک اسم مؤنث ساخته می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit09.lesson02.translate.007
