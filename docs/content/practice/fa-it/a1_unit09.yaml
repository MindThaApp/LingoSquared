  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: C'è una banca? می‌پرسد آیا اصلاً بانکی این دور و بر هست.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit09.lesson02.order.004
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: word_order
  frame:
    text: Sì, {item} una qui vicino.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, {item} una qui vicino.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ce n'è una جواب سؤال‌هایی مثل c'è una ... است و می‌گوید یکی هست.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit09.lesson02.fill.005
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
