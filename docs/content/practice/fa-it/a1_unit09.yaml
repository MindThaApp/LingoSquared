    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Qui vicino یعنی این نزدیکی، همین دور و بر.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit09.lesson01.match.005
