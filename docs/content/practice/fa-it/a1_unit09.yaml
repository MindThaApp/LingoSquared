- content_key: practice.fa-it.it.a1.unit09.lesson01.translate.006
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: ببخشید، داروخانه کجاست؟ (رسمی)
    language_code: fa
    direction: rtl
