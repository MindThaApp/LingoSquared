  feedback_frame:
    text: Per favore عبارت مؤدبانه‌ای است که به هر سفارش اضافه می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit07.lesson01.order.003
  lesson_content_key: it.a1.unit07.lesson01.al_bar
