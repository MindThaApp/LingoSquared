  feedback_frame:
    text: Basta così عبارتی ثابت است به معنی «همین کافیه، دیگر نه».
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit07.lesson03.listen.002
  lesson_content_key: it.a1.unit07.lesson03.il_conto
