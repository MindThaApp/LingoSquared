  frame:
    text: لطفاً یک قهوه و یک کروسان می‌خواستم.
    language_code: fa
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un cornetto, per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un با اسم‌های مذکر مثل caffè و cornetto می‌آید؛ per favore درخواست را تمام می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit07.lesson01.translate.006
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: چه میل دارید؟ (رسمی، Lei)
    language_code: fa
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Desidera شکل رسمی Lei است که گارسون یا باریستا به کار می‌برد، نه شکل غیررسمی tu.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit07.lesson03.choose.001
  lesson_content_key: it.a1.unit07.lesson03.il_conto
