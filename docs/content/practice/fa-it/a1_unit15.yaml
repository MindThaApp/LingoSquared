    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson01.translate.006
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: translation
  frame:
    text: سیب‌ها از گوجه‌فرنگی‌ها گران‌ترن.
    language_code: fa
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Le mele costano più {item} pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dei همان di + i است و با pomodori، یعنی چیزی که با آن مقایسه می‌کنیم، هماهنگ می‌شود، نه با mele.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson01.translate.007
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: translation
  frame:
    text: گوجه‌فرنگی‌ها از سیب‌ها ارزون‌ترن.
    language_code: fa
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: I pomodori costano meno {item} mele.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Meno delle یعنی «کمتر از» و قبل از اسم جمع مؤنث می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson03.choose.001
  lesson_content_key: it.a1.unit15.lesson03.buone_come
