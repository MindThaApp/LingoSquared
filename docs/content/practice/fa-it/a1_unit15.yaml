    text: Dei با اسم‌های جمع مذکر و delle با اسم‌های جمع مؤنث می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson01.order.003
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: word_order
  frame:
    text: Voglio {item} caffè, meno tè.
    language_code: it
    direction: ltr
  slots:
