      language_code: it
      direction: ltr
  feedback_frame:
    text: Più یعنی بیشتر و meno یعنی کمتر.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson01.order.004
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: word_order
  frame:
