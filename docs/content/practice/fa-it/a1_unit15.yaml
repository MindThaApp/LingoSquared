  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quale یعنی کدام و در این سؤال قبل از فعل می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson02.translate.003
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: translation
  frame:
    text: سلام، کدوم رو ترجیح می‌دی، سیب‌ها یا گوجه‌فرنگی‌ها؟ (صمیمی، tu)
    language_code: fa
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, {item} preferisci, le mele o i pomodori?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Preferisci شکل صمیمی tu است، پس این سؤال برای یک دوست است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson03.choose.002
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
