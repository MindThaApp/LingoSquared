  feedback_frame:
    text: Quale یعنی کدام و از شما می‌خواهد بین گزینه‌ها یکی را انتخاب کنید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson02.order.001
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: word_order
  frame:
    text: Ciao, {item} preferisci, le mele o i pomodori?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, {item} preferisci, le mele o i pomodori?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Quale preferisci? می‌پرسد از بین دو چیز کدام را ترجیح می‌دهی.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson02.fill.002
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
