  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buone شکل جمع مؤنث buono است و با mele هماهنگ می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson03.listen.003
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buone به -e ختم می‌شود چون اسم جمع مؤنث را توصیف می‌کند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson03.order.004
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: word_order
  frame:
    text: Sì, le mele sono {item} come i pomodori.
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, le mele sono {item} come i pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Sono buone جمع است، برای همین buono با mele که جمع مؤنث است می‌شود buone.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson03.fill.005
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: fill_in_blank
  frame:
    text: Le mele sono {item} come i pomodori. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Come دو چیزِ برابر را به هم وصل می‌کند: buone come یعنی «به خوبیِ».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit15.lesson03.translate.006
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: translation
  frame:
    text: سیب‌ها به اندازهٔ گوجه‌فرنگی‌ها خوشمزه‌ان.
    language_code: fa
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Le mele sono {item} come i pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Buone با mele هماهنگ است؛ come در این مقایسه یعنی «مثل».
    language_code: fa
    direction: rtl
