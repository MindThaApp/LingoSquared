templates:
- content_key: practice.fa-it.it.a1.unit01.lesson01.choose.001
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu برای دوست‌ها، خانواده و هم‌سن‌وسال‌هاست؛ Lei، با L بزرگ، شکل محترمانه برای غریبه‌ها، افراد مسن‌تر و محیط‌های کاری است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson01.listen.002
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ciao هم برای سلام و هم برای خداحافظی به کار می‌رود، ولی buongiorno سلام مؤدبانه‌ی روز است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson01.order.003
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: word_order
  frame:
    text: Ciao, come {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Come stai? را برای پرسیدن حال دوست می‌گویید؛ به یک غریبه باید گفت Come sta?
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson01.match.004
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'بسیاری از صفت‌های ایتالیایی با پایانِ -ale از یک ساختار می‌آیند: informale یعنی غیررسمی و formale یعنی رسمی.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson01.translate.005
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Rispettoso به Lei رسمی می‌خورد: نشان می‌دهد به کسانی که خوب نمی‌شناسید احترام می‌گذارید.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson01.translate.006
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: سلام، حالت چطوره؟ (غیررسمی، به یک دوست)
    language_code: fa
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Stai شکل tu است؛ شکل محترمانه‌ی Lei برای همین سؤال Buongiorno, come sta? می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson02.choose.001
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Arrivederla خداحافظی رسمی است؛ -la در آخرش به Lei برمی‌گردد. با دوست‌ها ایتالیایی‌ها ciao می‌گویند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson02.listen.002
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buonasera سلام عصر است؛ buonanotte فقط وقتی گفته می‌شود که کسی می‌خواهد بخوابد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson02.order.003
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: word_order
  frame:
    text: Ciao, ci {item} domani!
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, ci {item} domani!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo معنای تحت‌اللفظی‌اش «همدیگر را می‌بینیم» است؛ روش روزمره برای گفتن «بعداً می‌بینمت» است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson02.fill.004
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: fill_in_blank
  frame:
    text: Arrivederla, a {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A domani یعنی «فردا می‌بینمت»؛ a بخشی از همین عبارت ثابت است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson02.translate.005
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bene جواب Come stai? است و به‌تنهایی هم می‌تواند به معنی «خوب» یا «خوبم» باشد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson03.choose.001
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scusi روش مؤدبانه برای جلب توجه یک غریبه است؛ شکل رسمی (Lei) است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson03.listen.002
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Benvenuto مذکر است؛ وقتی به یک زن خوش‌آمد می‌گویید benvenuta می‌شود.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson03.order.003
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: word_order
  frame:
    text: Mi chiamo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mi chiamo تحت‌اللفظی یعنی «خودم را می‌نامم»؛ اسم هم ساده در آخر می‌آید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit01.lesson03.fill.004
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: fill_in_blank
  frame:
    text: Come ti {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ti «تو»ی غیررسمی است؛ با Lei سؤال می‌شود Come si chiama?
    language_code: fa
    direction: rtl
