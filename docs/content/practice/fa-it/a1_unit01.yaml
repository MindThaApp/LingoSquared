    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Piacere هم اسم است به معنی «لذت» و هم جوابی است که موقع آشنایی می‌دهید: خوشبختم.'
    language_code: fa
    direction: rtl
