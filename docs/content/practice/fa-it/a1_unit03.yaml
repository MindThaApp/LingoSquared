- content_key: practice.fa-it.it.a1.unit03.lesson01.choose.001
  lesson_content_key: it.a1.unit03.lesson01.contare_da_zero_a_dieci
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Uno عدد شمارشی است؛ قبل از اسم مذکر به un کوتاه می‌شود و قبل از اسم مؤنث به una تبدیل می‌شود.
    language_code: fa
    direction: rtl
