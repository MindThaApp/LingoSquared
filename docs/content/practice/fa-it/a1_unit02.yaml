    text: Che {item} fai?
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} fai?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che lavoro fai? یعنی «چه کاری می‌کنی؟»؛ شکل مؤدبانه‌اش Che lavoro fa, Lei? است.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit02.lesson03.fill.004
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: fill_in_blank
  frame:
    text: Che lavoro {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fai شکل tu از fare است؛ با Lei می‌شود fa.
    language_code: fa
    direction: rtl
