    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'پایان واژه جنسیت را نشان می‌دهد: -o برای مرد (americano)، -a برای زن (americana).'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit02.lesson01.translate.005
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: '{item}'
    language_code: fa
    direction: rtl
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'در ایتالیایی ملیت‌ها و زبان‌ها با حرف بزرگ شروع نمی‌شوند: italiano، inglese.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit02.lesson01.translate.006
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: تو اهل کجایی؟ (خودمانی)
    language_code: fa
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Di dove sei? پرسش tu است؛ شکل مؤدبانهٔ Lei این است: Di dov''è, Lei?'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit02.lesson02.choose.001
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'پایان فعل نشان می‌دهد چه کسی کار را انجام می‌دهد: parlo یعنی «حرف می‌زنم»، parli یعنی «تو حرف می‌زنی» (غیررسمی)، parla یعنی «شما حرف می‌زنید» (رسمی) یا «او حرف می‌زند».'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit02.lesson02.listen.002
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Parli و parla شبیه هم شنیده می‌شوند: مصوت آخر مشخص می‌کند که tu است (-i) یا Lei (-a).'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit02.lesson02.order.003
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: word_order
  frame:
    text: Parlo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parlo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'بعد از parlare معمولاً برای زبان حرف تعریف لازم نیست: parlo inglese، parlo italiano.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit02.lesson02.fill.004
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: fill_in_blank
  frame:
    text: Da {item} studi? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Da quanto studi? می‌پرسد چه مدت است که درس می‌خوانی؛ ایتالیایی برای این کار با da زمان حال به کار می‌برد.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit02.lesson02.translate.005
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: translation
  frame:
    text: انگلیسی حرف می‌زنی؟ (غیررسمی)
    language_code: fa
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Parli {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Parli شکل tu است؛ برای یک غریبه شکل Lei را به کار می‌برید: Parla inglese?'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit02.lesson03.choose.001
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Fai و fa هر دو صرف fare هستند: fai برای tu است و fa برای Lei یا او.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit02.lesson03.listen.002
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تکیهٔ Ingegnere روی هجای ماقبل آخر است: in-ge-GNE-re.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit02.lesson03.order.003
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: word_order
