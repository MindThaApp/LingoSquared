  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'جمع sorella می‌شود sorelle: پایان -a به -e تبدیل می‌شود.'
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit06.lesson02.translate.005
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: من یک برادر و یک خواهر دارم.
    language_code: fa
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ho یعنی «دارم»؛ قبل از اسم مذکر un و قبل از اسم مؤنث una به کار ببرید.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit06.lesson02.translate.006
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: برادر یا خواهر داری؟ (غیررسمی، tu)
    language_code: fa
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai fratelli o {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai شکل غیررسمی tu برای «داشتن» است؛ پس این سؤال را به دوست یا همکار می‌گویید.
    language_code: fa
    direction: rtl
