    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Figli یعنی فرزندان به‌طور کلی؛ figlio و figlia به پسر و دختر می‌گویند.
    language_code: fa
    direction: rtl
- content_key: practice.fa-it.it.a1.unit06.lesson03.listen.003
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: listen_select
  frame:
