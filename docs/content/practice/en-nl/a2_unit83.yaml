schema_version: '1.0'
pack_key: practice.en-nl.a2.unit83
source_language: en
target_language: nl
unit_content_key: nl.a2.unit83.wat_gebeurde_er
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 79-86 pass): dumped every slot's unit-scope and course-scope pool (a2 + unit83 filter) and read every gloss; band, zin and vooropgezette stay excluded as the authoring note says; the lekke anchor has one course-wide candidate, so Ik kreeg een {item} band. is deterministic. 2 fixes - (1) the three multiple-choice feedback frames claimed every word described an incident ({item} is used to describe an incident ...) although the pool includes grammar words such as noemt and verbindt; they now render the English gloss (This Dutch word means {item}.); (2) lesson05 (twintig is its only lexeme) had no hosting template; lesson05 translate.003 now drills the number nouns (unit scope twintig, course scope the A2 number words), so every lexeme-bearing lesson is covered. Capacity after fixes: 15 templates, ALL 72%, recognition 68%, structured 70%, production 70%; lessons 5/5 overall and in production, 4/5 in recognition and structured (lesson05 has a single lexeme, below the multiple-choice floor).

    Authored for the five lessons in A2 unit 83 that have backfilled lexemes. The
    broad imperfectum and incident-story tag union supports recognition, six-pair
    matching and bare-word production across all five lessons; a one-member
    adjective constraint supports the sentence-based word-order and fill-in-blank
    templates. Excluded band (backfill gloss "the band", but the unit teaches
    "tyre"), zin ("desire; mood", but the grammar note means "clause/sentence")
    and vooropgezette ("placed first", but the grammar note means
    "fronted/preposed") from every answer pool. Native review should confirm the
    naturalness of the feedback wording and the sentence Ik kreeg een lekke band.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - irregular_imperfectum_forms
    - imperfectum_forms_mixed
    - toen_terwijl_clauses
    - small_incident_story
    - busy_morning_reading
    - number

templates:
# lesson01 -- Onregelmatige vormen
- content_key: practice.en-nl.nl.a2.unit83.lesson01.choose.001
  lesson_content_key: nl.a2.unit83.lesson01.onregelmatige_vormen
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &broad_item
      language_code: nl
      part_of_speech: [verb, adverb, preposition, pronoun]
      agreement_tags:
        semantic: [irregular_imperfectum_forms, imperfectum_forms_mixed,
                   toen_terwijl_clauses, small_incident_story,
                   busy_morning_reading]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: 'This Dutch word means {item}.'
    slot_rendering: {item: english_gloss}
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit83.lesson01.match.002
  lesson_content_key: nl.a2.unit83.lesson01.onregelmatige_vormen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &match_item
      language_code: nl
      part_of_speech: [verb, adverb, preposition, pronoun]
      agreement_tags:
        semantic: [irregular_imperfectum_forms, imperfectum_forms_mixed,
                   toen_terwijl_clauses, small_incident_story,
                   busy_morning_reading]
    second: *match_item
    third: *match_item
    fourth: *match_item
    fifth: *match_item
    sixth: *match_item
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit83.lesson01.translate.003
  lesson_content_key: nl.a2.unit83.lesson01.onregelmatige_vormen
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *broad_item
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

