schema_version: '1.0'
pack_key: practice.en-nl.b2.unit03
source_language: en
target_language: nl
unit_content_key: nl.b2.unit03.nuance
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-08-02 against docs/content/PRACTICE_PACK_RECIPE.md to unblock the
    nl.b2.unit03 (Nuance: hedging/softening, cautious phrasing, emphasis and focus)
    checkpoint, which returns checkpoint_unavailable because the unit has lexemes but
    no practice pack. This is a GRAMMAR/discourse unit, so the §8.1 pattern is used:
    slots UNION the unit's own lesson tags and are shaped with part_of_speech; the
    per-lesson-tag vocabulary pattern would leave the thin lessons (L05 5 lexemes,
    L06 4 lexemes) under the MC/matching floors. 15 templates over all 6 lessons:
    listen_select x2, multiple_choice x2, matching_pairs x3, word_order x2,
    translation x6 (4 bare-word + 2 fixed-sentence hero). Every slot is satisfiable
    from THIS unit's own lexemes at checkpoint (unit) scope. Measured with the recipe
    §9.4 model against the real backfill data: ALL coverage 34/51 (67%), recognition
    24/51 (47%), structured 30/51 (59%), production 27/51 (53%); all three tiers reach
    6/6 lessons that have lexemes; no dead templates. THREE MIS-GLOSSED tokens were
    found in the classifier pool and deliberately kept OUT of every gloss-showing slot
    (MC/listen_select/matching_pairs/bare-word translation) per recipe §0.1 - reviewer
    please route to the backfill lane: (1) 'best' carries gloss "best" but the unit
    teaches it as the hedge "quite/pretty" (best goed = quite good); it is also a
    self-gloss, so it is excluded by never using [adjective]+hedging_softening in a
    gloss slot; (2) 'begin' carries gloss "start (with ik)" (verb) but the unit's L05
    reading teaches the NOUN "the beginning" (Het begin is enigszins traag) - excluded
    by never using [verb]+review_reading in a gloss slot (its clean L05 neighbours
    nieuwe/traag are hosted via [adjective]+review_reading instead); (3) 'waar' carries
    gloss "where" but the unit teaches it as "true" (Dat is waar) - excluded by never
    using [adverb]+opinion_nuance_dialogue in a gloss slot (L06's clean content word
    'vond' is hosted via [verb]+opinion_nuance_dialogue). One softer flag: 'zin'
    carries "desire; mood"; the unit uses it in "in zekere zin" (= in a sense) - it is
    a legitimate dictionary sense of the word so it is kept in noun pools, but a
    reviewer may prefer a context gloss. GRAMMAR SHOWCASE + Item-7 culminating act:
    the two fixed-sentence translations deliver the SAME propositional content (the
    film is mooi/nice) once HEDGED (De film is naar mijn idee nogal mooi) and once
    EMPHATIC (De film is echt ontzettend mooi), both anchored on the single-member
    equal_adj tag (mooi) so the render is deterministic; that is the spine act
    (deliver the same content tentatively / emphatically) rendered within the six
    mechanical practice types. Reviewer double-checks: (a) the only single-member
    course-scope anchors in this unit are mooi (equal_adj) and lang (height_adj);
    every word_order / fixed-sentence translation uses one of those two, so every
    course-scope candidate of every frame-bearing slot is exactly one grammatical
    token - the defect-1.14 / course-grammaticality re-read was done by hand (the
    integrity script's a*_unit*.yaml glob skips this b2_ pack); (b) listen_select
    frames are bare '{item}', so no distractor can be a word the audio itself says
    (defect 1.22); (c) matching_pairs pools were read by hand for interchangeable
    English glosses - the emphasis adverbs heel/erg (both "very") are kept out of every
    matching pool (Struct-A is [noun,verb] only) and out of production (Prod-D is
    hedging adverbs only) to avoid the synonym/underdetermination trap. heel/erg are
    NEVER placed in any gloss-graded slot (multiple_choice/listen_select slot_gloss,
    matching_pairs, or bare-word translation): they co-occur ONLY in the lesson03
    word_order (De film is {item} mooi), which is token-exact - each instance renders
    one adverb and the learner assembles the given Dutch tiles, so the shared "very"
    gloss is never a competing answer. Recognition of lesson03's emphasis vocabulary is
    carried by lesson05.listen.001 (emphasis adjectives); the lesson04 recognition MC
    pools only the four distinct-gloss non-emphasis adverbs eigenlijk/nogal/degelijk/
    juist. (Earlier drafts routed emphasis recognition through a slot_gloss MC that
    pooled heel+erg, where "very" was a valid-but-marked-wrong distractor - removed.)
    Register: informal jij is preserved (no direct address appears in these frames).
    Needs the standard fresh-context review before import.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): read all 15
    templates against their unit- and course-scoped pools and the nl b2_unit03
    realization/en-nl overlay; confirmed best now carries "quite; pretty" (the authoring
    note's best/begin/waar exclusions still hold for begin and waar). FIXED
    (distractor): lesson04.choose.001 pooled best "quite; pretty" with nogal "rather;
    fairly" in a 5-member adverb pool (the overlay teaches best as "quite / pretty
    (fairly)" and nogal as "rather / fairly"), so the distractor was also correct in
    about three of four best/nogal items; switched the union from [hedging_softening,
    focus_marking] to [focus_marking, cautious_phrasing] adverbs (pool
    enigszins/erop/juist/degelijk; course + misschien). Lesson01 recognition is still
    carried by lesson01.listen.001. The feedback frame was also reworded to the neutral
    'Remember the meaning of {item}.' because it would have been false for the new pool.
    FIXED (feedback-hint): lesson03.order.003 feedback always showed 'De film is heel
    mooi.' whatever adverb the item used; it now renders '{item}'. lesson06.match.002
    feedback said the words come "from the conversation" (most are from lessons 02/04);
    now neutral. lesson06.translate.003 prompt began "Now deliver the SAME claim", which
    points to a different item that is not shown in randomized practice; now "Deliver
    this claim emphatically". DEFERRED (lexeme-gloss): zin "desire; mood" vs the unit's
    "in zekere zin" = in a sense (already noted by the author). DEFERRED (duplicate-ambiguous):
    the lesson03.translate.003 pool eigenlijk/best/nogal has the same
    best/nogal overlap (prompt "rather; fairly" accepts only nogal); there is no tag
    that separates them. NATIVE-FLAG: lesson03.order.003 renders 'De film is absoluut
    mooi.' (absoluut is natural with extreme adjectives, but is it natural with plain
    mooi?) and, at course scope, 'De film is zeker mooi.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - hedging_softening
    - cautious_phrasing
    - emphasis
    - focus_marking
    - review_reading
    - opinion_nuance_dialogue
    - equal_adj
    - height_adj

templates:

# ---------- lesson01 (afzwakken / hedging) ----------
- content_key: practice.en-nl.nl.b2.unit03.lesson01.listen.001
  lesson_content_key: nl.b2.unit03.lesson01.afzwakken
  type: listen_select
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech:
      - noun
      agreement_tags:
        semantic:
        - hedging_softening
        - cautious_phrasing
        - focus_marking
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: You heard {item}.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit03.lesson01.translate.002
  lesson_content_key: nl.b2.unit03.lesson01.afzwakken
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: nl
      part_of_speech:
      - noun
      agreement_tags:
        semantic:
        - hedging_softening
        - cautious_phrasing
        - emphasis
        - focus_marking
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit03.lesson01.translate.003
  lesson_content_key: nl.b2.unit03.lesson01.afzwakken
  type: translation
  frame:
    text: >-
      Hedge this claim, lowering your commitment. Keep this exact Dutch word order --
      De film is naar mijn idee nogal ... -- and end with the word for nice/pretty:
      The film is, in my view, rather nice.
    language_code: en
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech:
      - adjective
      agreement_tags:
        semantic: equal_adj
  answer_derivation:
    kind: render_frame
    frame:
      text: De film is naar mijn idee nogal {item}.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: De film is naar mijn idee nogal mooi. -- A hedged version of "the film is nice".
    language_code: en
    direction: ltr

# ---------- lesson02 (voorzichtig / cautious phrasing) ----------
- content_key: practice.en-nl.nl.b2.unit03.lesson02.order.001
  lesson_content_key: nl.b2.unit03.lesson02.voorzichtig
  type: word_order
  frame:
    text: De film is enigszins te {item}.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech:
      - adjective
      agreement_tags:
        semantic: height_adj
  answer_derivation:
    kind: render_frame
    frame:
      text: De film is enigszins te {item}.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: De film is enigszins te lang. -- The film is somewhat too long.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit03.lesson02.match.002
  lesson_content_key: nl.b2.unit03.lesson02.voorzichtig
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &adjpool
      language_code: nl
      part_of_speech:
      - adjective
      agreement_tags:
        semantic:
        - cautious_phrasing
        - emphasis
        - review_reading
    second: *adjpool
    third: *adjpool
    fourth: *adjpool
    fifth: *adjpool
    sixth: *adjpool
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each descriptive adjective with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit03.lesson02.translate.003
  lesson_content_key: nl.b2.unit03.lesson02.voorzichtig
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: nl
      part_of_speech:
      - adjective
      agreement_tags:
        semantic:
        - cautious_phrasing
        - emphasis
        - review_reading
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

# ---------- lesson03 (benadrukken / emphasis) ----------
# Recognition of degree/focus adverbs. The pool is deliberately the NON-emphasis
# adverbs (hedging_softening + focus_marking): eigenlijk / nogal / degelijk / juist,
# four DISTINCT non-interchangeable glosses. The emphasis adverbs heel and erg both
# gloss to "very", so they are NEVER placed in a gloss-graded (slot_gloss) pool --
# they are exercised token-exact in the word_order below, where grading is on the
# Dutch token, not the shared English meaning. Recognition of lesson03's emphasis
# vocabulary is carried by lesson05.listen.001 (emphasis adjectives).
- content_key: practice.en-nl.nl.b2.unit03.lesson04.choose.001
  lesson_content_key: nl.b2.unit03.lesson04.focus
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech:
      - adverb
      agreement_tags:
        semantic:
        - focus_marking
        - cautious_phrasing
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Remember the meaning of {item}.'
    language_code: en
    direction: ltr
# Emphasis adverbs, token-exact. heel and erg (both "very") co-occur in this pool
# but NEVER compete: each generated instance renders exactly one adverb into the
# frame and the learner assembles the given Dutch tiles -- the answer is the token,
# not a chosen gloss, so the synonym is not a valid-but-marked-wrong distractor.
- content_key: practice.en-nl.nl.b2.unit03.lesson03.order.003
  lesson_content_key: nl.b2.unit03.lesson03.benadrukken
  type: word_order
  frame:
    text: De film is {item} mooi.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech:
      - adverb
      agreement_tags:
        semantic: emphasis
  answer_derivation:
    kind: render_frame
    frame:
      text: De film is {item} mooi.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: De film is {item} mooi. -- Place the intensifier before the adjective it strengthens.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit03.lesson03.order.002
  lesson_content_key: nl.b2.unit03.lesson03.benadrukken
  type: word_order
  frame:
    text: De film is echt heel {item}.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech:
      - adjective
      agreement_tags:
        semantic: equal_adj
  answer_derivation:
    kind: render_frame
    frame:
      text: De film is echt heel {item}.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: De film is echt heel mooi. -- The film is really very beautiful.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit03.lesson03.translate.003
  lesson_content_key: nl.b2.unit03.lesson03.benadrukken
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: nl
      part_of_speech:
      - adverb
      agreement_tags:
        semantic: hedging_softening
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

