    - sixth
  feedback_frame:
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit03.lesson04.translate.002
  lesson_content_key: nl.b2.unit03.lesson04.focus
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: nl
      part_of_speech:
      - verb
      agreement_tags:
        semantic:
        - opinion_nuance_dialogue
        - focus_marking
        - cautious_phrasing
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

# ---------- lesson05 (recensie / reading) ----------
- content_key: practice.en-nl.nl.b2.unit03.lesson05.listen.001
  lesson_content_key: nl.b2.unit03.lesson05.recensie
