- content_key: practice.en-nl.nl.b2.unit03.lesson06.translate.003
  lesson_content_key: nl.b2.unit03.lesson06.in_gesprek
  type: translation
  frame:
    text: >-
      Deliver this claim emphatically, raising your commitment. Keep this exact
