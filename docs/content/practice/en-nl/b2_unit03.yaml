- content_key: practice.en-nl.nl.b2.unit03.lesson06.choose.001
  lesson_content_key: nl.b2.unit03.lesson06.in_gesprek
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
