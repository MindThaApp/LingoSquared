schema_version: '1.0'
pack_key: practice.en-nl.b2.unit05
source_language: en
target_language: nl
unit_content_key: nl.b2.unit05.register
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-08-02 against docs/content/PRACTICE_PACK_RECIPE.md to unblock the
    en-nl B2 unit05 (register) checkpoint (the unit's lessons already produce 51
    lexemes via scripts/backfill_lexemes_en_nl.py but had no pack, so
    generate_checkpoint() returned checkpoint_unavailable). This is a GRAMMAR/FUNCTION
    unit, so the §8.1 union-of-lesson-tags pattern is used: every slot draws from the
    unit's own semantic tags, widened by unioning sibling-lesson tags only where a
    single tag could not clear the MC 3-option or matching 6-token floor, and narrowed
    by part_of_speech to keep function/proper-noun/mis-glossed tokens out of any pool
    whose gloss is shown. 20 templates over all 6 lessons that have lexemes:
    multiple_choice x6, word_order x3, matching_pairs x3, translation x8. Measured with
    the recipe's capacity model (f'.{LEVEL}.{UNIT}.' filter) against the real backfill
    data: 39/51 unit lexemes hostable (76%); recognition/structured/production each
    cover all 6 lessons; per-tier coverage recognition 76% / structured 53% /
    production 73%. REGISTER: this unit deliberately teaches BOTH the informal jij and
    the formal u register; every PRODUCTION/word_order exercise is internally
    consistent to one register (formal: "Ik schrijf u een bericht.", "Zou u het willen
    doen, alstublieft?", "Zou het mogelijk zijn om onze afspraak te verzetten,
    alstublieft?"; informal: "Kunnen we de afspraak naar volgende week verzetten?"),
    and the recognition/matching items are meaning-recognition of the contrast itself
    (jou vs u, alsjeblieft vs alstublieft, Groetjes vs Hoogachtend), which is the
    unit's whole point. Item-7 (culminating): the pack renders the SAME reschedule
    request in BOTH registers as two full-sentence translations
    (lesson04.translate.004 informal, lesson06.translate.004 formal) so a learner must
    produce the complete register-appropriate utterance, not just drilled words.
    MIS-GLOSSES found in the classifier pool and EXCLUDED from every gloss-shown pool
    (route to backfill lane): (a) 'Met' -> "This is" (phone-identity sense) but this
    unit uses it in "Met vriendelijke groet"; kept out by dropping preposition POS.
    (b) 'schrijf' -> "prescribe; write (with ik)" and (c) 'schrijven' -> "write (part
    of 'inschrijven', to register)" -- both wrong for this unit's "write a message"
    sense; kept out of MC/matching/translation by using pronoun/noun/adverb POS on
    lesson01 gloss pools (they still appear only as literal Dutch tiles in the
    lesson01 word_order frame, where no gloss is shown). REVIEWER, please double-check:
    (1) 'hé' ("hey") was dropped from every lesson02 pool because its gloss is
    interchangeable with 'hoi' ("hi") -- an unanswerable pair otherwise; confirm that
    is acceptable. (2) 'Geachte' ("dear (formal salutation)") and 'Beste' ("Dear
    (letter/email salutation)") co-occur in the lesson02 pools; this is kept as the
    unit's taught formal-vs-neutral salutation distinction (parenthetical qualifiers
    disambiguate), not a paraphrase -- confirm. (3) 'schikken'/'schikt' ("to suit" /
    "suits") and 'mailen'/'mail' ("to e-mail" / "e-mail (with ik)") are
    infinitive/conjugated pairs kept together (distinct glosses), same precedent as
    grappig/grappigs in b1_unit11. (4) 'Zou' displays capitalized (sentence-initial
    citation form); it is a safe typed answer (practice answers are casefolded) but
    would display capitalized in a matching left -- it is only used here inside MC
    recognition and translation prompts, never as a matching left. Needs the standard
    fresh-context review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - register_choice_address
    - polite_address
    - salutation_signoff
    - directness_politeness
    - vervoer_alstublieft_single
    - reschedule_request
    - register_two_messages
    - register_selection
    - gemeente_schikken_single
templates:

# ============================ LESSON 01 — jij of u? ============================
- content_key: practice.en-nl.nl.b2.unit05.lesson01.choose.001
  lesson_content_key: nl.b2.unit05.lesson01.jij_of_u
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech:
      - pronoun
      agreement_tags:
        semantic:
        - register_choice_address
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is one of the address pronouns this unit uses to set the register.'
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit05.lesson01.order.002
  lesson_content_key: nl.b2.unit05.lesson01.jij_of_u
  type: word_order
  frame:
    text: Ik schrijf {item} een bericht.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech:
      - pronoun
      agreement_tags:
        semantic:
        - polite_address
  answer_derivation:
    kind: render_frame
    frame:
      text: Ik schrijf {item} een bericht.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: Ik schrijf u een bericht. -- I am writing you a message. (formal, u)
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit05.lesson01.translate.003
  lesson_content_key: nl.b2.unit05.lesson01.jij_of_u
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: nl
      part_of_speech:
      - pronoun
      - noun
      - adverb
      agreement_tags:
        semantic:
        - register_choice_address
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

