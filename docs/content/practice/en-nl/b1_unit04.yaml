schema_version: '1.0'
pack_key: practice.en-nl.b1.unit04
source_language: en
target_language: nl
unit_content_key: nl.b1.unit04.ingewikkelde_zinnen
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md, as part of the en-nl B1 unit01-11
    practice-pack wave that unblocks these units'' checkpoints (the units already had lexemes from scripts/backfill_lexemes_en_nl.py
    but no pack at all, so generate_checkpoint() returned checkpoint_unavailable). 20 templates across
    6 lesson(s) with lexemes: listen_select x1, matching_pairs x3, multiple_choice x5, translation x7,
    word_order x4. Every slot is satisfiable from THIS unit''s own lexemes, because generate_checkpoint()
    calls _material() with only this unit''s lesson ids; slots use the unit''s own per-lesson semantic
    tags (unioned where a single lesson tag could not reach the >=3-option multiple_choice floor or the
    6-token matching_pairs floor), narrowed by part_of_speech to content words so no exercise ever shows
    ''the'' or ''and'' as its answer. Measured with the recipe''s capacity/coverage model against the
    real backfill data: 40 of 49 unit lexemes hostable (82%), recognition 80% / structured 80% / production
    76%, and all three tiers reach 6/6 of the lessons that have lexemes. Distinct-target capacity: recognition
    55, production 39, structured effectively unbounded (matching_pairs combinatorics). 11 of 20 templates
    carry >=5 variants. REVIEWER: lesson06 introduces exactly one lexeme, the pronoun ''wie'', so the
    lesson06 templates must include POS pronoun or the lesson is invisible to the checkpoint. lesson05''s
    word_order anchors on semantic: activity_leuk (POS verb -> ''wandelen'', the only B1 verb with that
    tag). General double-checks for this wave: (a) every word_order/fill_in_blank frame was verified against
    its slot''s whole-B1-course candidate pool, not just the unit pool, so Endless Practice cannot render
    an ungrammatical sentence; (b) no frame''s literal text contains any of its own slot''s candidate
    values (defect 1.14); (c) listen_select frames are bare ''{item}'' so no distractor can be a word
    the audio itself says (defect 1.22); (d) matching_pairs pools were read by hand for interchangeable
    English glosses. Needs the standard fresh-context review before import.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - activity_leuk
    - b1_unit_review
    - relative_clause_dat
    - relative_clause_die
    - relative_clause_reading
    - relative_clause_waar
    - small_world_dialogue
