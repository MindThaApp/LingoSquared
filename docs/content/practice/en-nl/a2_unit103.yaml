schema_version: '1.0'
pack_key: practice.en-nl.a2.unit103
source_language: en
target_language: nl
unit_content_key: nl.a2.unit103.zorg_voor_jezelf
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 102-108 pass): 0 fixes. Dumped the unit-scope
    pool (61 of 77 unit lexemes hostable) and the A2 course-scope pool (154) of the single union
    slot and read every gloss. All 15 templates are bare-word, so frame grammaticality and
    self-reference do not arise. Capacity: lessons 01-05 in every tier, 79% coverage per tier, no
    dead templates, MC and listen pools far over 3 glosses, matching pools over 6 tokens. Lesson06
    has a single lexeme (the particle nee) and cannot host a template without opening the slot to
    every particle; that is unchanged. Backfill gloss issues routed for a fix (not editable here):
    was carries "do the dishes (with ik)" while this unit teaches "Ik was me" (I wash myself) - it
    is shown as the right answer in multiple choice and matching, and it cannot be kept out of the
    pool because it carries three of the five unit tags; vervelen carries "to bore" while the unit
    teaches zich vervelen (to be bored). Authored for the lessons of A2 unit 103 that have
    backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a
    unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective,
    adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course
    scope. Pronouns, proper nouns, particles and phrases are left out.  Native speaker should
    confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - reflexive_feelings
    - reflexive_pronoun_paradigm
    - reflexive_vs_non_reflexive
    - grooming_dialogue
    - busy_morning_reading
templates:
- content_key: practice.en-nl.nl.a2.unit103.lesson01.choose.001
  lesson_content_key: nl.a2.unit103.zorg_voor_jezelf.lesson01.hoe_voel_je_je
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [reflexive_feelings, reflexive_pronoun_paradigm, reflexive_vs_non_reflexive, grooming_dialogue, busy_morning_reading]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit103.lesson01.match.002
  lesson_content_key: nl.a2.unit103.zorg_voor_jezelf.lesson01.hoe_voel_je_je
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit103.lesson01.translate.003
  lesson_content_key: nl.a2.unit103.zorg_voor_jezelf.lesson01.hoe_voel_je_je
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

