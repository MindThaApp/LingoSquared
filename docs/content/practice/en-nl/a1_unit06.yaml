schema_version: "1.0"
pack_key: practice.en-nl.a1.unit06
source_language: en
target_language: nl
unit_content_key: nl.a1.unit06.food
review:
  status: reviewed
  required_next_reviewer: null
  fresh_context: "false"
  notes: >-
    Original authoring notes (2026-07-05): keyed to lexemes added to
    scripts/backfill_lexemes_en_nl.py's unit05-06 extension. One gloss fix
    made while authoring: "broodje"/"Broodje" simplified from "sandwich
    (roll)" to "sandwich roll" to avoid a parenthetical leaking into
    translation frames. De/het risk was consciously avoided in most
    templates via the article-free "een".

    Independent fresh-context content audit found and fixed two real bugs
    the authoring pass missed, both in the menukaart lesson (lesson05).
    **Bug 1**: the "menu_item" semantic tag was assigned to EVERY token
    introduced in that one teaching card, not just genuine food items --
    it actually captured "Menukaart" (the word "menu" itself), "euro", and
    the numbers "twee"/"vijftig" (from the same card's price-spelling
    teaching item) alongside the capitalized price-tag forms of Koffie/
    Thee/Broodje/Appelsap. lesson05.complete.003's "Ik wil een {item}."
    could therefore generate "Ik wil een Menukaart."/"Ik wil een euro."/"Ik
    wil een twee."/"Ik wil een vijftig." -- a capitalization leak (capital
    mid-sentence) for the menu-card items and an ungrammatical/nonsensical
    filler for the number/currency tokens. **Fix**: swapped all three
    lesson05 templates (choose.001, match.002, complete.003) from the
    over-broad "menu_item" preset to the already-defined, already-verified
    "food_noun" preset (semantic: food_request; appel/appelsap/brood/
    broodje/kaas/koffie, all lowercase, all genuine food/drink items,
    already proven safe in lessons 02/04/06's identical "Ik wil(graag) een
    {item}." frames) -- removed the now-unused "menu_item" slot preset
    definition. Re-verified with the standalone harness: all three
    templates now resolve to exactly 6 safe candidates, and compiler
    validation re-run clean. Rest of the pack hand-checked and found sound:
    drink/food_noun frames are grammatical for every filler (Dutch cafe
    orders freely use "een + mass noun" for a serving, same as English "a
    coffee"), polite_word (alsjeblieft/alstublieft) correctly varies
    register in "Ik wil graag twee thee, {item}." with no
    over/under-generation. No self-reference, no other capitalization
    leaks, no jargon leaks, no stray YAML booleans. Compiler validation
    re-run together with units 01-05, 07-09: 0 errors/0 warnings.

    **Follow-up fix, 2026-07-06 (real user report, same bug class found in
    en-nl unit01's je/jij)**: this entry's own "correctly varies register
    with no over/under-generation" claim was wrong for lesson03.complete.002
    specifically -- "Ik wil graag twee thee, {item}." (fill_in_blank) gives
    no way to tell which register was intended, so alsjeblieft/alstublieft
    are both equally valid and only one was ever marked correct. Fixed via
    the new `interchangeable: true` answer_derivation flag (AUTHORING_
    GUIDE.md#17); the word_order/translation siblings for this same
    lesson were already safe by construction (word_order hands you the
    tile, translation names the register directly) and are unchanged.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [drink, food_request, polite_request, menu_item, food_dialogue]
slot_presets:
  drink: &drink {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: drink}}
  food_noun: &food_noun {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: food_request}}
  polite_word: &polite_word {language_code: nl, part_of_speech: phrase, agreement_tags: {semantic: polite_request}}
templates:
  - content_key: practice.en-nl.nl.a1.unit06.lesson01.choose.001
    lesson_content_key: nl.a1.unit06.lesson01.dranken
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *drink}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a drink word from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson01.order.002
    lesson_content_key: nl.a1.unit06.lesson01.dranken
    type: word_order
    frame: {text: "Ik wil graag een {item}.", language_code: nl, direction: ltr}
    slots: {item: *drink}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil graag een {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} completes this drink order.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson01.translate.003
    lesson_content_key: nl.a1.unit06.lesson01.dranken
    type: translation
    frame:
      text: "I would like a {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *drink}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil graag een {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik wil graag een {item} -- I would like a {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson02.listen.001
    lesson_content_key: nl.a1.unit06.lesson02.ik_wil_graag
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *food_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the food or drink word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson02.order.002
    lesson_content_key: nl.a1.unit06.lesson02.ik_wil_graag
    type: word_order
    frame: {text: "Ik wil graag een {item}.", language_code: nl, direction: ltr}
    slots: {item: *food_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil graag een {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} completes this order.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson02.translate.003
    lesson_content_key: nl.a1.unit06.lesson02.ik_wil_graag
    type: translation
    frame:
      text: "I would like a {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *food_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil graag een {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik wil graag een {item} -- I would like a {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson03.order.001
    lesson_content_key: nl.a1.unit06.lesson03.aantallen_bestellen
    type: word_order
    frame: {text: "Ik wil graag twee thee, {item}.", language_code: nl, direction: ltr}
    slots: {item: *polite_word}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil graag twee thee, {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} sets the register (formal or informal) of this order.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson03.complete.002
    lesson_content_key: nl.a1.unit06.lesson03.aantallen_bestellen
    type: fill_in_blank
    frame:
      text: "Ik wil graag twee thee, {item}."
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Complete the Dutch sentence.", language_code: en, direction: ltr}
    slots: {item: *polite_word}
    # interchangeable: true -- found live 2026-07-06, same-class bug as the
    # en-nl unit01 je/jij fix (AUTHORING_GUIDE.md#17): "Ik wil graag twee
    # thee, ___." gives no way to tell informal (alsjeblieft) from polite
    # (alstublieft) register was intended, so both must grade correct.
    answer_derivation: {kind: slot_text, slot: item, interchangeable: true}
    feedback_frame: {text: "{item} sets the register (formal or informal) of this order.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson03.translate.003
    lesson_content_key: nl.a1.unit06.lesson03.aantallen_bestellen
    type: translation
    frame:
      text: "Translate using {item}: I would like two teas, please."
      language_code: en
      direction: ltr
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *polite_word}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil graag twee thee, {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik wil graag twee thee, {item} uses the register you were asked for.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson04.choose.001
    lesson_content_key: nl.a1.unit06.lesson04.wat_wilt_u
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *food_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a food or drink word from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson04.translate.003
    lesson_content_key: nl.a1.unit06.lesson04.wat_wilt_u
    type: translation
    frame:
      text: "May I have a {item}, please?"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *food_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Mag ik een {item}, alsjeblieft?", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Mag ik een {item}, alsjeblieft? -- may I have a {item}, please?", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson05.choose.001
    lesson_content_key: nl.a1.unit06.lesson05.menukaart
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *food_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a word from the menu card.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson05.match.002
    lesson_content_key: nl.a1.unit06.lesson05.menukaart
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: nl, direction: ltr}
    slots: {first: *food_noun, second: *food_noun, third: *food_noun, fourth: *food_noun, fifth: *food_noun, sixth: *food_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each menu word with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson06.listen.001
    lesson_content_key: nl.a1.unit06.lesson06.taalcafe_bestelling
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *food_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the food or drink word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson06.order.002
    lesson_content_key: nl.a1.unit06.lesson06.taalcafe_bestelling
    type: word_order
    frame: {text: "Ik wil graag een {item}, alstublieft.", language_code: nl, direction: ltr}
    slots: {item: *food_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil graag een {item}, alstublieft.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} completes this formal order.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit06.lesson06.translate.003
    lesson_content_key: nl.a1.unit06.lesson06.taalcafe_bestelling
    type: translation
    frame:
      text: "I would like a {item}, please."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *food_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil graag een {item}, alstublieft.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik wil graag een {item}, alstublieft -- I would like a {item}, please.", language_code: en, direction: ltr}
