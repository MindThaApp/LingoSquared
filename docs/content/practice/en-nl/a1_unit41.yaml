schema_version: '1.0'
pack_key: practice.en-nl.a1.unit41
source_language: en
target_language: nl
unit_content_key: nl.a1.unit41.persoonlijkheid
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-24 (en-nl practice pass, session 10): 3 fixes -- lesson03/04/05 choose feedback
    described the lesson dialogue but the pools include unrelated level-scope words -> neutral wording.
    Native flags: nieuw/nieuwe and ik/Ik share glosses at level scope.

    Vocabulary unit (persoonlijkheid / personality traits), 15 unit lexemes
    across lessons 01-05 per scripts/backfill_lexemes_en_nl.py; lesson06
    (nina_beschrijft_zichzelf) has ZERO lexemes and is unhostable in any
    slot -- flagging for the coordinator to route a backfill extension.
    lesson01/lesson02 only had 2/1 own-tag tokens (trait_kind_funny,
    trait_calm_patient), under the multiple_choice 3-distinct floor, so both
    fall back to the union tag persoonlijkheid_vocab (S3.1a/S8.1) restricted
    to part_of_speech:adjective (5 distinct). lesson03 (trait_curious_shy),
    lesson04 (personality_dialogue), lesson05 (personality_reading) each had
    >=3 of their own tokens and use their own union tag. word_order and
    fill_in_blank both anchor on the single-member
    persoonlijkheid_persoon_single tag (persoon), course-scope-safe by
    construction. Capacity/coverage measured via RECIPE S9 step 4 (see
    report).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist):
    checked all templates against the real unit- and course-scope pools,
    every gloss vs the unit41 realization (taalcafe canon: Lotte
    aardig/geduldig, Sander grappig, Fenna nieuwsgierig, Nina verlegen),
    frame grammar/taught vocabulary, self-reference, matching
    confusability, booleans and jargon. FIXED (frame-pool):
    lesson01.choose.001, lesson01.listen.003, lesson02.choose.001 slot
    narrowed from persoonlijkheid_vocab to [trait_kind_funny,
    trait_calm_patient, trait_curious_shy] adjectives (same 5 unit
    lexemes; course scope now adds only rustig) -- the old course pool
    made the feedback 'describes a personality trait' false (nieuw,
    Spaans, lang) and put leuk 'nice; pleasant' beside aardig 'nice; kind'
    as competing options. FIXED (untaught-vocab): lesson03.order.003 'Mijn
    zusje is heel {item}.' used never-taught 'zusje' -> 'Mijn zus is heel
    {item}.' (zus taught unit05; feedback updated). FIXED (feedback-hint):
    match feedback 'personality word' -> 'Match each word with its English
    meaning.' (course pool includes ben, taalcafe, verpleegkundige).
    DEFERRED (lexeme-gloss, course scope): Ze is glossed 'she', so a
    lesson04/lesson05 bare-word translation prompt 'she' accepts only ze
    and rejects the equally correct zij; gloss should read 'she
    (unstressed)' in the backfill. No native-judgment flags.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - persoonlijkheid_vocab
    - trait_curious_shy
    - personality_dialogue
    - personality_reading
    - persoonlijkheid_persoon_single
    - trait_kind_funny
    - trait_calm_patient

templates:

# -- lesson01: aardig_en_grappig ----------------------------------------------
- content_key: practice.en-nl.nl.a1.unit41.lesson01.choose.001
  lesson_content_key: nl.a1.unit41.lesson01.aardig_en_grappig
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: adjective
      agreement_tags: {semantic: [trait_kind_funny, trait_calm_patient, trait_curious_shy]}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} describes a personality trait.'
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit41.lesson01.translate.002
  lesson_content_key: nl.a1.unit41.lesson01.aardig_en_grappig
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: nl
      part_of_speech: adjective
      agreement_tags: {semantic: trait_kind_funny}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit41.lesson01.listen.003
  lesson_content_key: nl.a1.unit41.lesson01.aardig_en_grappig
  type: listen_select
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: adjective
      agreement_tags: {semantic: [trait_kind_funny, trait_calm_patient, trait_curious_shy]}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: You heard {item}.
    language_code: en
    direction: ltr

