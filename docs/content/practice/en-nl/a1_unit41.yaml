    kind: render_frame
    frame:
      text: Mijn zus is heel {item}.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: Mijn zus is heel nieuwsgierig. -- My sister is very curious.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit41.lesson03.fill.004
  lesson_content_key: nl.a1.unit41.lesson03.nieuwsgierig_verlegen
  type: fill_in_blank
  frame:
    text: Nina is een aardige {item}.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: persoonlijkheid_persoon_single}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: Nina is een aardige persoon. -- Nina is a kind person.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit41.lesson03.match.005
  lesson_content_key: nl.a1.unit41.lesson03.nieuwsgierig_verlegen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &trait_word
      language_code: nl
      part_of_speech: [noun, verb, adjective]
      agreement_tags: {semantic: persoonlijkheid_vocab}
    second: *trait_word
    third: *trait_word
    fourth: *trait_word
    fifth: *trait_word
    sixth: *trait_word
  slot_relations:
  - {kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each word with its English meaning.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit41.lesson03.order.006
  lesson_content_key: nl.a1.unit41.lesson03.nieuwsgierig_verlegen
  type: word_order
  frame:
    text: Nina is een heel aardige {item}.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: persoonlijkheid_persoon_single}
  answer_derivation:
