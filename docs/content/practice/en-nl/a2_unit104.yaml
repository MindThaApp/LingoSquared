schema_version: '1.0'
pack_key: practice.en-nl.a2.unit104
source_language: en
target_language: nl
unit_content_key: nl.a2.unit104.hem_haar_ze_er
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 102-108 pass): 1 fix - (1) the shared slot
    dropped preposition from part_of_speech, which removes over and met from every pool: over
    carries the backfill gloss "past; after; in (a duration ...)" while this unit teaches praten
    over (about), so a multiple-choice or matching item showed a wrong meaning as the right answer.
    Dumped the unit-scope pool (now 50 of 59 unit lexemes) and the A2 course-scope pool (78) and
    read every gloss. All 18 templates are bare-word, so frame grammaticality and self-reference do
    not arise. Capacity after the fix: 6/6 lessons in every tier, 85% coverage per tier, no dead
    templates, MC and listen pools far over 3 glosses, matching pools over 6 tokens. Backfill issues
    routed for a fix (not editable here): over gloss as above; Bloemen and bloemen are two lexemes
    with the same gloss "flowers" (a sentence-initial capital that should fold onto bloemen; both
    can land in one matching exercise), and Praten, Heb, Goed, Leuk, Mag, Natuurlijk are other
    position-only capitals; kijken carries "watch (with we)" and schrijven "write (part of
    'inschrijven', to register)" while the unit teaches kijken naar (look at) and plain schrijven.
    Authored for the lessons of A2 unit 104 that have backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases are left out.  Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - object_pronoun_vocabulary
    - object_pronouns_hem_haar_het_ze
    - stressed_unstressed_object_pronouns
    - quantity_er
    - er_plus_preposition
    - library_return_dialogue
templates:
- content_key: practice.en-nl.nl.a2.unit104.lesson01.choose.001
  lesson_content_key: nl.a2.unit104.lesson01.cadeaus_en_boeken
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [object_pronoun_vocabulary, object_pronouns_hem_haar_het_ze, stressed_unstressed_object_pronouns, quantity_er, er_plus_preposition, library_return_dialogue]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit104.lesson01.match.002
  lesson_content_key: nl.a2.unit104.lesson01.cadeaus_en_boeken
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit104.lesson01.translate.003
  lesson_content_key: nl.a2.unit104.lesson01.cadeaus_en_boeken
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

