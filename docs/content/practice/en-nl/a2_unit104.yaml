schema_version: '1.0'
pack_key: practice.en-nl.a2.unit104
source_language: en
target_language: nl
unit_content_key: nl.a2.unit104.hem_haar_ze_er
review:
  status: unreviewed
  fresh_context: 'false'
  required_next_reviewer: native_speaker_review
  notes: >-
    Authored for the lessons of A2 unit 104 that have backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases are left out.  Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - object_pronoun_vocabulary
    - object_pronouns_hem_haar_het_ze
    - stressed_unstressed_object_pronouns
    - quantity_er
    - er_plus_preposition
    - library_return_dialogue
templates:
- content_key: practice.en-nl.nl.a2.unit104.lesson01.choose.001
  lesson_content_key: nl.a2.unit104.lesson01.cadeaus_en_boeken
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [object_pronoun_vocabulary, object_pronouns_hem_haar_het_ze, stressed_unstressed_object_pronouns, quantity_er, er_plus_preposition, library_return_dialogue]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit104.lesson01.match.002
  lesson_content_key: nl.a2.unit104.lesson01.cadeaus_en_boeken
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit104.lesson01.translate.003
  lesson_content_key: nl.a2.unit104.lesson01.cadeaus_en_boeken
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit104.lesson02.listen.001
  lesson_content_key: nl.a2.unit104.lesson02.hem_haar_het_ze
  type: listen_select
