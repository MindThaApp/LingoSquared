unit_content_key: nl.a2.unit78.afgelopen_weekend
review:
  status: reviewed
  fresh_context: 'false'
  required_next_reviewer: native_speaker_review
  notes: 'Authored 2026-10-25 (session 12) for A2 unit 78 "Afgelopen weekend", the Dutch Wave-0 pilot of the perfectum.
    The unit had realization and overlay content (language-reviewed twice) but was missing from scripts/content_manifest.txt,
    so it was never imported and had no lexemes or practice pack. It is now wired into the en-nl-a2 manifest line
    (as unit 11 of Dutch A2, the same position the local dev DB already gave it), scripts/backfill_lexemes_en_nl.py
    classifies it (15 new English-only glosses and parts of speech, six lesson_categories entries, two unit-scoped
    glosses for blijven and lang, curated pools weekend_* gated on the unit''s lessons) and this pack covers it.


    41 templates over all 6 lessons: multiple_choice x6, listen_select x5, matching_pairs x5, word_order x6, fill_in_blank
    x3, translation x16 (6 bare-word, 10 fixed-sentence). Fixed sentences use one-member anchor tags and carry accepted_variants
    for the verb-second order the unit teaches (time word or place moved to the front). English contraction expansions
    are folded by the shared grader and are not listed. Every fill_in_blank slot has exactly one course-wide candidate.


    NATIVE SPEAKER CHECK (items for the reviewer):

    (1) Pool grouping: the zijn pool holds gegaan, gekomen, geweest, geworden, gebleven, thuisgebleven; the regular
    pool holds gewerkt, gekookt, gewandeld, gespeeld, gefietst, gesport; the irregular pool holds gezien, gelezen,
    geslapen, gegeten, gedronken, gehad. Please confirm the grouping labels in feedback ("regular", "goes with zijn")
    are acceptable at A2.

    (2) Accepted variants: Ik heb zaterdag boodschappen gedaan; In het park heb ik gewandeld; Naar mijn oom ben
    ik gegaan; Ik heb ''s avonds gekookt; Zaterdagochtend ... en ik heb brood gekocht. Please confirm each is natural.

    (3) The bare-word items for Middags and Avonds exist only as recognition (the pool tokens are the capitalised
    sentence-initial forms from the reading, after ''s); no typed-answer item asks for them.

    (4) Glosses: blijven "to stay; to remain" and lang "long; for a long time" are unit-scoped; the bare infinitive
    gloss "to eat; eat" for eten is inherited from earlier units.

    (5) The sentence for brood is the reading''s own first sentence with the ''s dropped; please confirm "Zaterdagochtend
    ben ik naar de markt gegaan en heb ik brood gekocht" reads naturally as an answer.

    (6) Zaterdag/zaterdag and Zondag/zondag exist as separate capitalised and lowercase lexemes (inherited); no
    template draws either.


    Not hosted: afgelopen, zaterdag, zondag (and the capitalised twins), oom, Heb, rustig, lang, Leuk, Amsterdam
    (self-gloss), and the phrase lexemes. Needs the standard fresh-context review before import.'
