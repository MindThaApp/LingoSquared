schema_version: '1.0'
pack_key: practice.en-nl.a1.unit35
source_language: en
target_language: nl
unit_content_key: nl.a1.unit35.opleiding
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. en-nl A1
    unit35 (opleiding: study/course/university vocab) has 23 lexemes across all
    6 lessons; 22 of 23 carry the unit-wide `opleiding_vocab` tag (excluded:
    `Nu` = "now", an adverb mis-anchored to lesson03 that carries only
    unrelated tags -- flagged here, not used in any pool). Every
    recognition/production slot unions `opleiding_vocab` (22 distinct glosses,
    well over the 3-option MC floor / 6-pair matching floor). 16 templates:
    multiple_choice x6 (one per lesson), translation (bare-word) x6,
    listen_select x1 (nl target has TTS), matching_pairs x1 (6 pairs over
    opleiding_vocab), word_order x1 ("Fenna studeert aan de {item}." anchored
    to the single-member `opleiding_hogeschool_single` tag = hogeschool only),
    fill_in_blank x1 ("Sander volgt een cursus aan de {item}." same
    single-member anchor, reused deliberately -- it is the only *_single tag
    this unit has, so both structured-precision templates pin to it; each
    still contributes a distinct checkpoint item). Recognition 7 (6 MC + 1
    listen), structured 3 (order/fill/match), production 6 -- all three tiers
    clear the >=3 template bar. Course-scope check: both the word_order and
    fill_in_blank frames use `opleiding_hogeschool_single`, whose course-wide
    pool is exactly 1 token (hogeschool) -- deterministic, no grammaticality
    risk. Mis-glossed/mis-anchored lexeme found: `Nu` ("now") sits in
    lesson03's lexeme list under education_institution-adjacent tags with no
    opleiding_vocab tag of its own -- correctly excluded from every pool here,
    flagged for the backfill lane. Needs the standard fresh-context review
    before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - opleiding_vocab
    - opleiding_hogeschool_single
templates:

# lesson01 -- studeren, opleiding
- content_key: practice.en-nl.nl.a1.unit35.lesson01.choose.001
  lesson_content_key: nl.a1.unit35.lesson01.studeren_opleiding
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adjective]
      agreement_tags: {semantic: opleiding_vocab}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} belongs to this unit''s study/education vocabulary.'
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit35.lesson01.translate.002
  lesson_content_key: nl.a1.unit35.lesson01.studeren_opleiding
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adjective]
      agreement_tags: {semantic: opleiding_vocab}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit35.lesson01.order.003
  lesson_content_key: nl.a1.unit35.lesson01.studeren_opleiding
  type: word_order
  frame: {text: 'Fenna studeert aan de {item}.', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: opleiding_hogeschool_single}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Fenna studeert aan de {item}.', language_code: nl, direction: ltr}
  feedback_frame:
    text: Fenna studeert aan de hogeschool. -- Fenna studies at the college.
    language_code: en
    direction: ltr

