schema_version: "1.0"
pack_key: practice.en-nl.a1.unit31
source_language: en
target_language: nl
unit_content_key: nl.a1.unit31.animals
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-09 by the practice-template depth-closing pass
    (same pass as a1_unit29.yaml/a1_unit30.yaml -- see a1_unit29.yaml's
    review.notes for the full manifest-gap context). This file covers
    unit31 (animals and pets). Extended scripts/backfill_lexemes_en_nl.py
    with 5 new semantic tags scoped to this unit's own real vocabulary
    (pet_noun: 4-member hond/kat/vis/vogel, verified safe generatively in
    'Ik heb een {item}.' via translation ONLY -- the English side
    disambiguates which pet is meant, never a bare Dutch fill_in_blank on
    this pool, matching this unit's own real realization file's
    review.notes, which explicitly flagged blanking any animal noun
    directly as genuinely ambiguous; pet_noun_plural: 4-member honden/
    katten/vissen/vogels, verified safe in 'Ik houd van {item}.' (all four
    grammatical there); pet_care_verb: 3-member bare-infinitive
    recognition-only pool uitlaten/geven/spelen, no shared generative
    frame since each takes a different object/preposition per this unit's
    own doc, same discipline as unit10's routine_verb_infinitive/unit17's
    work_vocab; animal_elke_single/animal_van_single: single-member tags
    reusing already-classified tokens (elke from unit29, van from unit8)
    for this unit's own real fill_in_blank resolutions -- 'Ik laat de hond
    ___ dag uit.'/'Ik houd ___ dieren.' -- matching the realization file's
    own choice verbatim). Real, live bug caught and fixed while building
    this: a first draft casefolded pet_care_verb's token match, which
    silently pulled in this unit's own capitalized sentence-initial
    'Uitlaten' (from its lesson02 grammar note) as a case-duplicate second
    member -- fixed with an exact-case token check, same convention as
    a1_unit30.yaml's identical age_adj catch in this same pass. Every
    generative frame's literal text was checked against its own slot's
    candidate set for self-reference (none found -- 'Ik heb een {item}.'/
    'Ik houd van {item}.' share no literal word with pet_noun/
    pet_noun_plural's own members). Real course-wide candidate counts
    verified with a standalone lexeme_matches()-replicating harness before
    writing these templates. 17 templates across all 6 lessons:
    multiple_choice x4, listen_select x4, matching_pairs x1 (8-pair
    pet_noun+pet_noun_plural pool anchored lesson05), fill_in_blank x2
    (both single-candidate), word_order x2, translation x4. Needs the
    standard fresh-context review before import. Blocking dependency, same
    as every other en-nl pack: backfill_lexemes_en_nl.py has not actually
    been run against a real database yet.

    REAUTH 2026-07-24 (unit-scope DEAD/FLOOR fix pass, pack-only, no
    backfill/realization edits): this file's own notes above already flag
    that animal_elke_single/animal_van_single 'reus[e] already-classified
    tokens (elke from unit29, van from unit8)' -- confirmed by scripts/
    _practice_unit_scope_check.py that both are 0-candidate at unit scope
    (elke's only course-wide token is introduced unit05, not unit29 as
    claimed; van is unit08) -- classic DO-NOT #2, invisible to
    generate_checkpoint(). Searched every semantic tag this unit's own
    lexemes carry for one that is ALSO course-wide single-token (the only
    way to build a fill_in_blank anchor without a new backfill tag); none
    exists natively for lesson02 or lesson03. Per the recipe's HARD RULES
    (a fix requiring a new backfill tag can't be done pack-only), replaced
    both DEAD fill_in_blank templates with a same-tier (structured), no-new-
    tag alternative instead of dropping them: lesson02.fill.004 ->
    lesson02.match.004, a 6-pair matching_pairs over a new
    `pet_care_or_noun` preset unioning this unit's OWN pet_noun (4) +
    pet_care_verb (3) tags (7 unit-scoped distinct tokens, no shared
    generative sentence exists for pet_care_verb per this file's own notes,
    so matching_pairs -- pure token/gloss pairs, no frame sentence -- sidesteps
    that entirely); lesson03.fill.004 -> lesson03.order.004, a word_order
    reusing this file's own already-verified-grammatical 'Ik houd van
    {item}.' frame over pet_noun_plural (word_order has no candidate floor).
    Note this frame text is identical to lesson04.order.002's (same verified
    sentence, different lesson anchor/content_key) -- accepted as a known
    minor duplication rather than risk an unverified new sentence against
    all 4 plurals. Also fixed lesson05.match.001: its two SEPARATE 4-slot
    `distinct` relations (pet_noun x4, pet_noun_plural x4) made
    _practice_unit_scope_check.py report 'declares only 4 slots (<6-pair
    floor)' since it takes the max relation size, not the total 8 pairs
    actually shown -- collapsed into ONE 8-slot `distinct` relation over a
    new `pet_noun_all` preset (union of the same two already-listed tags),
    which is both what the checker's single-pool model expects and exactly
    what recipe SS6.3's standard shape looks like (uniform preset, one
    relation); the two pools' 8 tokens are all distinct strings (singular
    vs plural), so nothing else about the exercise changed. Removed the now
    -unused animal_elke_single/animal_van_single presets and tag_schema
    entries. Template count unchanged at 17 (2 fill_in_blank -> 1
    matching_pairs + 1 word_order; net type mix: multiple_choice x4,
    listen_select x4, matching_pairs x2, word_order x3, translation x4).
    Post-fix: 0 DEAD, 0 FLOOR for this pack."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [pet_noun, pet_noun_plural, pet_care_verb]
slot_presets:
  pet_noun: &pet_noun {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: pet_noun}}
  pet_noun_plural: &pet_noun_plural {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: pet_noun_plural}}
  pet_care_verb: &pet_care_verb {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: pet_care_verb}}
  pet_noun_all: &pet_noun_all {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: [pet_noun, pet_noun_plural]}}
  pet_care_or_noun: &pet_care_or_noun {language_code: nl, part_of_speech: [noun, verb], agreement_tags: {semantic: [pet_noun, pet_care_verb]}}
templates:
  - content_key: practice.en-nl.nl.a1.unit31.lesson01.choose.001
    lesson_content_key: nl.a1.unit31.lesson01.huisdieren_woorden
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *pet_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a pet noun from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit31.lesson01.listen.002
    lesson_content_key: nl.a1.unit31.lesson01.huisdieren_woorden
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *pet_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit31.lesson01.translate.003
    lesson_content_key: nl.a1.unit31.lesson01.huisdieren_woorden
    type: translation
    frame:
      text: "I have a {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *pet_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Ik heb een {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik heb een {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit31.lesson01.order.004
    lesson_content_key: nl.a1.unit31.lesson01.huisdieren_woorden
    type: word_order
    frame: {text: "Ik heb een {item}.", language_code: nl, direction: ltr}
    slots: {item: *pet_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Ik heb een {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik heb een {item}. -- I have a {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit31.lesson02.choose.001
    lesson_content_key: nl.a1.unit31.lesson02.zorg_voor_huisdieren
    type: multiple_choice
    frame:
