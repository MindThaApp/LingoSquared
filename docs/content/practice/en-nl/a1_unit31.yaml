    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: nl, direction: ltr}
    slots: {first: *pet_care_or_noun, second: *pet_care_or_noun, third: *pet_care_or_noun, fourth: *pet_care_or_noun, fifth: *pet_care_or_noun, sixth: *pet_care_or_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each animal or pet-care word from this unit with its English meaning.", language_code: en, direction: ltr}
