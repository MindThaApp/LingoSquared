    slots: {item: *pet_care_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a pet-care verb from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit31.lesson02.listen.002
