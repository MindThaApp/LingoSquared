schema_version: '1.0'
pack_key: practice.en-nl.b2.unit01
source_language: en
target_language: nl
unit_content_key: nl.b2.unit01.argumentatie
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-08-02 against docs/content/PRACTICE_PACK_RECIPE.md to unblock the
    en-nl B2 unit01 (argumentatie) checkpoint, which returns checkpoint_unavailable
    with no pack. This is a GRAMMAR/FUNCTION unit (§8.1): every lesson's per-lesson
    tag is dominated by function words, so slots use each lesson's own dominant
    argument_* tag NARROWED by part_of_speech to content words [noun, verb,
    adjective, adverb] (which excludes de/het/een/dat/niet/ik/je/op etc.), never a
    bare tag. 20 templates over all 6 lessons: recognition 6 multiple_choice,
    structured 6 matching_pairs + 2 word_order (hero sentences that put the argument
    structure in the frame), production 6 bare-word translation. Every slot is
    satisfiable from THIS
    unit's own lexemes (generate_checkpoint feeds _material only unit01's lesson
    ids). Measured capacity/coverage with the recipe §9.4 model on the real
    backfill_lexemes_en_nl data (LEVEL='b2', UNIT='unit01', '.{LEVEL}.{UNIT}.'
    filter): 96 unit lexemes, ALL coverage 72% (69/96 content words; the other 27
    are function words no content-word slot hosts), recognition 72% / structured
    72% / production 72%, all three tiers reach 6/6 lessons, no dead templates, no
    sub-3 multiple_choice pools. lesson06 production is now a short deterministic
    bare-word translation (translate.003, argument_defense_production) with a single
    natural rendering; the whole-spine culminating act (claim + support + concession
    + rebuttal) is delivered by the realization's lesson exercises, not this pack.
    Register: informal
    jij/je throughout (nl lane pin) - je bespaar/mis je/denk je - matching the
    realization. defect 1.14 checked BY HAND at course scope for both word_order
    heroes (a*/b* glob skips b2_ packs); no frame literal
    word is a candidate of its own slot. listen_select: authored ZERO (not needed;
    nl TTS is configured but bare-word MC already fills recognition and avoids the
    1.22 self-distractor class entirely). REVIEWER MUST DOUBLE-CHECK: (1) lesson06
    production is now a short deterministic bare-word translation (translate.003)
    with a single natural rendering, so the former multi-sentence exact-match
    fragility no longer applies; the whole-spine culminating act is delivered by
    the realization's lesson exercises, not this pack. (2) Several lessons pool conjugation/number form-variants in the
    same matching_pairs / multiple_choice pool whose glosses are close but distinct
    strings: bespaar 'save (time/money)' / bespaart 'saves' / besparen 'to save
    (time, money)' (lesson02); mis/missen/mist (lesson03); voordeel/voordelen,
    nadeel/nadelen, wegen/weegt (lesson04); productief/productiever, eerste/tweede
    (lesson02). These discriminate on real form (like skill/skills in the recipe)
    and each right uniquely identifies its left, but confirm none reads as
    unanswerable. No mis-glossed lexeme found in any pool I used (all content-word
    glosses match what unit01 teaches). Needs the standard fresh-context review
    before import.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): read all 20
    templates against their real unit- and course-scoped pools (practice_dump) and the
    nl b2_unit01 realization; checked glosses, MC/matching gloss collisions, word_order
    course-scope pools (infinitive_hebben = {werken}, source_conflict adverb = {toch}),
    self-reference, booleans, jargon, register. FIXED (feedback-hint): the five per-lesson
    multiple_choice feedback frames (lesson01/02/03/04/06 choose.001) claimed
    every pool member is "a word you use to state a position / support your position /
    acknowledge the other side / rebut / defend", which is false for most of the pool
    (kantoor, reistijd, collega, heeft, weg, daar, zit...); reworded to "{item} is a
    word from the lesson on ...". DEFERRED (lexeme-gloss, backfill lane): 'wat' carries
    "what" but lesson06 teaches it as "something" (Daar zit wat in) and it is in the
    exactly-6 lesson06 matching pool, so it cannot be excluded without killing that
    template; 'zit' gloss mentions the unrelated idiom 'zit vol'. DEFERRED (systemic):
    nouns glossed with an English article ("the advantage", "the side", "the colleague")
    invite a typed 'het voordeel'/'de kant', which the single-answer bare-word
    translation marks wrong. Native flag: none.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - argument_claim
    - argument_support
    - argument_concession
    - argument_rebuttal
    - argument_reading
    - argument_defense_production
    - infinitive_hebben
    - source_conflict
templates:
# ---------------- lesson01: een standpunt (stating a claim) ----------------
- content_key: practice.en-nl.nl.b2.unit01.lesson01.choose.001
  lesson_content_key: nl.b2.unit01.lesson01.een_standpunt
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: argument_claim
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is a word from the lesson on stating a position.'
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit01.lesson01.match.002
  lesson_content_key: nl.b2.unit01.lesson01.een_standpunt
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &claim
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: argument_claim
    second: *claim
    third: *claim
    fourth: *claim
    fifth: *claim
    sixth: *claim
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each Dutch word for stating a position with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit01.lesson01.order.003
  lesson_content_key: nl.b2.unit01.lesson01.een_standpunt
  type: word_order
  frame:
    text: Ik vind dat thuiswerken beter is dan op kantoor {item}.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: [verb]
      agreement_tags:
        semantic: infinitive_hebben
  answer_derivation:
    kind: render_frame
    frame:
      text: Ik vind dat thuiswerken beter is dan op kantoor {item}.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: Ik vind dat thuiswerken beter is dan op kantoor werken. -- I think working from home is better than working at the office.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit01.lesson01.translate.004
  lesson_content_key: nl.b2.unit01.lesson01.een_standpunt
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: argument_claim
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr
