review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md, as part of the en-nl B1 unit01-11
    practice-pack wave that unblocks these units'' checkpoints (the units already had lexemes from scripts/backfill_lexemes_en_nl.py
    but no pack at all, so generate_checkpoint() returned checkpoint_unavailable). 18 templates across
    6 lesson(s) with lexemes: listen_select x1, matching_pairs x2, multiple_choice x3, translation x7,
    word_order x5. Every slot is satisfiable from THIS unit''s own lexemes, because generate_checkpoint()
    calls _material() with only this unit''s lesson ids; slots use the unit''s own per-lesson semantic
    tags (unioned where a single lesson tag could not reach the >=3-option multiple_choice floor or the
    6-token matching_pairs floor), narrowed by part_of_speech to content words so no exercise ever shows
    ''the'' or ''and'' as its answer. Measured with the recipe''s capacity/coverage model against the
    real backfill data: 23 of 28 unit lexemes hostable (82%), recognition 79% / structured 82% / production
    75%, and all three tiers reach 6/6 of the lessons that have lexemes. Distinct-target capacity: recognition
    36, production 22, structured effectively unbounded (matching_pairs combinatorics). 8 of 18 templates
    carry >=5 variants. REVIEWER: lesson04''s word_order anchors on semantic: workplace_dialogue POS pronoun
    -> ''ergens''; the adverbs of that tag (mee, zo) are NOT usable in the frame and are excluded by part-of-speech.
    Two matching_pairs cover disjoint halves of the unit so the structured tier reaches all 6 lessons.
    General double-checks for this wave: (a) every word_order/fill_in_blank frame was verified against
    its slot''s whole-B1-course candidate pool, not just the unit pool, so Endless Practice cannot render
    an ungrammatical sentence; (b) no frame''s literal text contains any of its own slot''s candidate
    values (defect 1.14); (c) listen_select frames are bare ''{item}'' so no distractor can be a word
    the audio itself says (defect 1.22); (d) matching_pairs pools were read by hand for interchangeable
    English glosses. Needs the standard fresh-context review before import. Fresh-context review 2026-10-10 (content-reviewer.md checklist): read all 18 templates against unit- and course-scoped pools. FIXED: (1) lesson03.translate.003 prompt ''Could you help me with the schedule?'' did not say which register the single answer (formal ''Zou u mij ...'') wants, so an informal ''je'' answer was graded wrong - prompt now ends ''(formal)''. (2) lesson04.choose.001 feedback claimed every option ''is said in the conversation with meneer Bakker'', false for taak/belangrijke (lesson06) - neutralised to ''{item} is a word from your lessons.'' DEFERRED: same translation still accepts only ''mij'' and one word order (me/mij variant rejected; systemic one-answer limit). 2 defects fixed, 1 deferred, no native flag.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
