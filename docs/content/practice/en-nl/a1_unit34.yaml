schema_version: '1.0'
pack_key: practice.en-nl.a1.unit34
source_language: en
target_language: nl
unit_content_key: nl.a1.unit34.technologie
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. en-nl A1
    unit34 (technologie: phone/computer/internet/app/message/look-up vocab) is a
    thin vocabulary unit -- 12 lexemes total across 4 lessons that carry lexemes
    (lesson01/02/03/06; lesson04/05 have zero introduced lexemes and cannot be
    represented). All 12 lexemes carry the unit-wide `technologie_vocab` tag, so
    every recognition/production slot below unions that single tag (12 distinct
    glosses, well over the 3-option MC floor and the 6-pair matching floor).
    12 templates: multiple_choice x4 (one per lesson with lexemes), translation
    (bare-word) x4, listen_select x1 (nl target has TTS), matching_pairs x1 (6
    pairs over technologie_vocab), word_order x1 (hero sentence "Ik gebruik
    {item} elke dag." anchored to the single-member `schermtijd_telefoon_single`
    tag = telefoon only), fill_in_blank x1 ("Heb je {item} thuis?" anchored to
    the single-member `technologie_internet_single` tag = internet only).
    Recognition 5 (4 MC + 1 listen), structured 3 (order/fill/match), production
    4 -- all three tiers clear the >=3 template bar. Course-scope check: the
    word_order frame "Ik gebruik {item} elke dag." and the fill_in_blank frame
    "Heb je {item} thuis?" both use `*_single` anchor tags, so their course-wide
    pool is exactly 1 token each (telefoon / internet) -- deterministic and safe,
    no course-scope grammaticality risk. No mis-glossed lexeme found in this
    pool; all glosses read consistent with the unit's own teaching content.
    Needs the standard fresh-context review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - technologie_vocab
    - schermtijd_telefoon_single
    - technologie_internet_single
templates:

# lesson01 -- telefoon, computer, internet
- content_key: practice.en-nl.nl.a1.unit34.lesson01.choose.001
  lesson_content_key: nl.a1.unit34.lesson01.telefoon_computer_internet
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: technologie_vocab}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is technology vocabulary from this unit.'
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit34.lesson01.translate.002
  lesson_content_key: nl.a1.unit34.lesson01.telefoon_computer_internet
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: technologie_vocab}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit34.lesson01.order.003
  lesson_content_key: nl.a1.unit34.lesson01.telefoon_computer_internet
  type: word_order
  frame: {text: 'Ik gebruik {item} elke dag.', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: schermtijd_telefoon_single}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ik gebruik {item} elke dag.', language_code: nl, direction: ltr}
  feedback_frame:
    text: Ik gebruik mijn telefoon elke dag. -- I use my phone every day.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit34.lesson01.fill.004
  lesson_content_key: nl.a1.unit34.lesson01.telefoon_computer_internet
  type: fill_in_blank
  frame: {text: 'Heb je {item} thuis?', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: technologie_internet_single}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: Heb je internet thuis? -- Do you have internet at home?
    language_code: en
    direction: ltr

