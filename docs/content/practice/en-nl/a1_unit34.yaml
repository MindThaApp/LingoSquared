  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &tech_word
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: technologie_vocab}
    second: *tech_word
    third: *tech_word
    fourth: *tech_word
    fifth: *tech_word
    sixth: *tech_word
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
