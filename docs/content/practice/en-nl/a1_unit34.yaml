schema_version: '1.0'
pack_key: practice.en-nl.a1.unit34
source_language: en
target_language: nl
unit_content_key: nl.a1.unit34.technologie
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-24 (en-nl practice pass, session 10): 2 fixes -- choose/match feedback no longer claims every course-wide extra (tien, dag, weer, voetbal...) is technology vocabulary. Native flags: Telefoon (capitalised level-scope variant) can show as a capitalised tile in order.003.

    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. en-nl A1
    unit34 (technologie: phone/computer/internet/app/message/look-up vocab) is a
    thin vocabulary unit -- 12 lexemes total across 4 lessons that carry lexemes
    (lesson01/02/03/06; lesson04/05 have zero introduced lexemes and cannot be
    represented). All 12 lexemes carry the unit-wide `technologie_vocab` tag, so
    every recognition/production slot below unions that single tag (12 distinct
    glosses, well over the 3-option MC floor and the 6-pair matching floor).
    12 templates: multiple_choice x4 (one per lesson with lexemes), translation
    (bare-word) x4, listen_select x1 (nl target has TTS), matching_pairs x1 (6
    pairs over technologie_vocab), word_order x1 (hero sentence "Ik gebruik
    {item} elke dag." anchored to the single-member `schermtijd_telefoon_single`
    tag = telefoon only), fill_in_blank x1 ("Heb je {item} thuis?" anchored to
    the single-member `technologie_internet_single` tag = internet only).
    Recognition 5 (4 MC + 1 listen), structured 3 (order/fill/match), production
    4 -- all three tiers clear the >=3 template bar. Course-scope check: the
    word_order frame "Ik gebruik mijn {item} elke dag." and the fill_in_blank frame
    "Heb je {item} thuis?" both use `*_single` anchor tags, so their course-wide
    pool is exactly 1 token each (telefoon / internet) -- deterministic and safe,
    no course-scope grammaticality risk. No mis-glossed lexeme found in this
    pool; all glosses read consistent with the unit's own teaching content.
    Needs the standard fresh-context review before import.

    REAUTH 2026-07-24: lesson02.translate.002's slot was tagged
    `tech_message_dialogue`, a tag with ZERO unit-scoped candidates -- it was
    never a real semantic tag any lesson02 lexeme carries (app/boodschap/
    sturen/stuurt/leest all carry `app_message` instead). Re-anchored the slot
    to `app_message` (5 unit-native lesson02 members, distinct glosses "the
    app"/"the message"/"to send"/"sends (with hij/zij/u)"/"reads (with hij/
    zij)"), which is exactly the tag lesson02's own vocab carries. Verified 0
    DEAD via scripts/_practice_unit_scope_check.py after the fix.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked
    all 12 templates against unit- and course-scoped pools, every rendering,
    gloss senses vs the nl a1_unit34 realization, matching confusables,
    self-reference, booleans and jargon. 1 defect fixed:
    lesson02.translate.002 (bare-word, app_message) could prompt 'the
    message' with the only accepted answer boodschap, while lesson02 teaches
    het bericht as the word for message (boodschap appears only inside a
    grammar note) -- a learner typing bericht would be marked wrong; slot
    narrowed to part_of_speech [verb] (sturen/stuurt/leest unit-native).
    Deferred (backfill lane): zoekt is glossed 'is looking for' though
    unit34 uses it in 'zoekt ... op' (looks up) -- still a valid sense, so
    left in pools; kent 'know (with hij/zij/je)' (course scope) also fits
    weet; Telefoon (unit45, capitalized) joins schermtijd_telefoon_single
    course-wide and displays mid-sentence in order.003 tiles (display only,
    casefolded grading). No native-judgment flag.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - technologie_vocab
    - schermtijd_telefoon_single
    - technologie_internet_single
    - device_vocabulary
    - app_message
    - looking_something_up
    - tech_plan_dialogue
templates:

# lesson01 -- telefoon, computer, internet
- content_key: practice.en-nl.nl.a1.unit34.lesson01.choose.001
  lesson_content_key: nl.a1.unit34.lesson01.telefoon_computer_internet
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: technologie_vocab}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: Remember the English meaning of {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit34.lesson01.translate.002
  lesson_content_key: nl.a1.unit34.lesson01.telefoon_computer_internet
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: device_vocabulary}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit34.lesson01.order.003
  lesson_content_key: nl.a1.unit34.lesson01.telefoon_computer_internet
  type: word_order
  frame: {text: 'Ik gebruik mijn {item} elke dag.', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: schermtijd_telefoon_single}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ik gebruik mijn {item} elke dag.', language_code: nl, direction: ltr}
  feedback_frame:
    text: Ik gebruik mijn telefoon elke dag. -- I use my phone every day.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit34.lesson01.fill.004
  lesson_content_key: nl.a1.unit34.lesson01.telefoon_computer_internet
  type: fill_in_blank
  frame: {text: 'Heb je {item} thuis?', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: technologie_internet_single}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: Heb je internet thuis? -- Do you have internet at home?
    language_code: en
    direction: ltr

# lesson02 -- de app, bericht
- content_key: practice.en-nl.nl.a1.unit34.lesson02.choose.001
  lesson_content_key: nl.a1.unit34.lesson02.de_app_bericht
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: technologie_vocab}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: Remember the English meaning of {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit34.lesson02.translate.002
  lesson_content_key: nl.a1.unit34.lesson02.de_app_bericht
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: nl
      # verb-only (2026-10-10): the noun boodschap is glossed 'the message',
      # but lesson02 teaches het bericht for 'message', so a bare-word
      # prompt 'the message' graded only against boodschap is underdetermined.
      part_of_speech: [verb]
      agreement_tags: {semantic: app_message}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit34.lesson02.listen.003
  lesson_content_key: nl.a1.unit34.lesson02.de_app_bericht
  type: listen_select
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: technologie_vocab}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: You heard {item}.
    language_code: en
    direction: ltr

# lesson03 -- iets opzoeken
- content_key: practice.en-nl.nl.a1.unit34.lesson03.choose.001
  lesson_content_key: nl.a1.unit34.lesson03.iets_opzoeken
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: technologie_vocab}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: Remember the English meaning of {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit34.lesson03.translate.002
  lesson_content_key: nl.a1.unit34.lesson03.iets_opzoeken
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: looking_something_up}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit34.lesson03.match.003
  lesson_content_key: nl.a1.unit34.lesson03.iets_opzoeken
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &tech_word
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: technologie_vocab}
    second: *tech_word
    third: *tech_word
    fourth: *tech_word
    fifth: *tech_word
    sixth: *tech_word
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr

