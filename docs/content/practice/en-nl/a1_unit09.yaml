      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *command_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch command verb is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit09.lesson03.choose.001
