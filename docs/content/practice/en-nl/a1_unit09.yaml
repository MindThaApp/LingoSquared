schema_version: "1.0"
pack_key: practice.en-nl.a1.unit09
source_language: en
target_language: nl
unit_content_key: nl.a1.unit09.directions
review:
  status: unreviewed
  required_next_reviewer: null
  fresh_context: "false"
  notes: >-
    Original authoring notes (2026-07-06): added a 5-member "direction_word"
    tag for bare-word recognition and a narrower 2-member "turn_direction"
    tag (linksaf/rechtsaf only) for "Sla {item}." -- "rechtdoor" deliberately
    excluded since it idiomatically pairs with "ga", not "sla". Reused
    unit08's "place_non_station" tag for lessons 03-06's bare-word
    recognition (legitimate cross-unit vocabulary reuse, per this unit's own
    overlay explicitly recalling "de supermarkt" etc. from unit08).

    Independent fresh-context content audit confirms this pack is clean,
    including the ONE place this unit reuses unit08's place_non_station tag
    embedded in a de/het-sensitive way -- checked carefully given unit08's
    own gender-agreement bug found in this same review pass, but unit09
    only ever uses place_non_station in fully isolated "{item}" recognition
    templates (choose/listen, lessons 03-06), never embedded with a fixed
    article, so the de/het risk that affected unit08 does not apply here.
    Standalone lexeme_matches()-replicating harness confirms candidate
    counts: direction_word=5, turn_direction=2, place_non_station=12
    (lowercase + capitalized map-label forms, both safe since always used
    standalone). Hand-checked every filler: "Sla {item}."/"Sla {item} bij
    het station." are grammatical for both linksaf and rechtsaf ("Sla
    linksaf."/"Sla linksaf bij het station." etc.), and the turn_direction/
    rechtdoor exclusion is correctly upheld (rechtdoor never appears in a
    "Sla ___" frame anywhere in this pack). No self-reference, no
    capitalization leaks, no jargon leaks, no stray YAML booleans. Compiler
    validation re-run together with units 01-08: 0 errors/0 warnings.

    **Fixed 2026-07-07 (Dutch live-QA pass)**: both lesson04 templates
    anchored `lesson_content_key` to `nl.a1.unit09.lesson04.korte_route`,
    which introduces ZERO new lexemes (every token in that lesson --
    de/bank/bibliotheek/Ga/rechtdoor/tot/het/station/Sla/rechtsaf/bij/Loop/
    De/is/tegenover -- was already taught by lessons 01-03 of this unit or
    unit08), so no Lexeme row is ever created with that lesson as
    provenance and `_practice_lesson_id()` could never resolve it --
    confirmed via `scripts/backfill_lexemes_en_nl.py`'s own classification
    (the key never appears as any spec's `lesson_content_key`). Same root
    cause/fix pattern as the fa-en unit23 `what_do_you_do` fix from earlier
    this session. Repointed to the closest earlier lesson already proven
    to resolve for each template's actual slot tag: `choose.001`
    (place_non_station) -> `lesson03.de_weg_vragen` (same tag already used
    by that lesson's own templates above); `order.002` (turn_direction) ->
    `lesson02.bevelsvormen` (same tag already used there too). Both are
    safe, no-forward-reference anchors within the same unit.

    **Re-authoring fix, 2026-07-24 (unit-scope DEAD-template pass)**: the
    2026-07-06 authoring note's own words -- "Reused unit08's
    place_non_station tag ... legitimate cross-unit vocabulary reuse" --
    turned out to be exactly the anti-pattern
    docs/content/PRACTICE_PACK_RECIPE.md's DO-NOT #2 warns about:
    `place_non_station` is entirely unit08's own vocabulary (supermarkt,
    apotheek, etc.); unit09's own lessons (verified via iter_specs())
    introduce ZERO tokens carrying that tag. `generate_checkpoint()` is
    unit-scoped, so all 5 templates built on it --
    `lesson03.choose.001`/`lesson03.listen.002`/`lesson04.choose.001`/
    `lesson05.choose.001`/`lesson06.listen.001` -- had 0 candidates and
    could never generate at checkpoint scope, even though they looked fine
    in Endless Practice (course-scoped). This unit teaches directions and
    routes, not places, so re-anchored all 5 to unit09's own `route_map`
    tag instead (renamed the `place_non_station` preset alias to
    `route_word` and repointed its `semantic` value to `route_map`; no
    other template referenced the old alias). `route_map` pools unit09's
    own route/route_op_de_kaart. Unit-scoped candidates: route ("the
    route"), Route ("Route"), START ("START"), DOEL ("DESTINATION") -- 4
    distinct glosses, clearing the >=3 MC/listen floor for all 5 templates
    (bare `{item}` MC/listen frames have no grammaticality-in-frame
    requirement, so course-scope pool diversity is not a risk here). Note
    for the coordinator: `route`/`Route` is a genuine case-duplicate in the
    underlying backfill data (same word, two case variants, both tagged
    identically with no way to exclude one via the pack alone) -- a minor,
    pre-existing content-quality wrinkle, not introduced by this fix, and
    out of PACK-ONLY scope to resolve (would need a `route_map_pure` tag
    analogous to this file's own `direction_word_pure`). Updated the
    "place word" feedback_frame text on all 5 templates to describe route
    vocabulary accurately.

    Also fixed the below-floor `lesson01.match.003` (matching_pairs
    declared 5 slots against `direction_word_pure`, which has exactly 5
    members course-wide -- links/rechts/linksaf/rechtsaf/rechtdoor -- a
    closed, complete A1 direction-word set with no 6th member reachable
    inside this unit). Widening to `direction_word` (the non-pure sibling)
    does not help -- identical 5 members, no capitalized duplicate exists
    for this specific set. The only other unit-scoped pool large enough
    (`imperative_direction`, the lesson02 command verbs ga/sla/loop) is a
    genuine case-duplicate trap: each verb's bare and sentence-initial
    capitalized forms (ga/Ga, sla/Sla, loop/Loop) share the identical
    `imperative_direction` tag with no way to exclude one case variant
    (no `_pure` sibling exists for it), so unioning it in would recreate
    the exact §6.3 case-duplicate defect this recipe warns against for
    matching_pairs. DROPPED `lesson01.match.003` per the recipe's explicit
    guidance for a genuinely-capped-below-6 unit; the structured tier
    still has 3 live `word_order` templates
    (`lesson02.order.001`/`lesson04.order.002`/`lesson06.order.002`), so
    the tier survives.

    **Tier-polish, 2026-07-24 (wave 2, tier-thinness pass)**: production
    tier had only 1 live template (lesson01.translate.004). Added two:
    lesson02.translate.004, a bare-word translation over a new
    `command_verb` preset (unit09's own `imperative_direction` verbs
    ga/sla/loop + sentence-initial Ga/Sla/Loop; 3 distinct casefolded
    answers, glosses go/turn/walk unambiguous; case variants harmless --
    practice grading casefolds typed answers); and lesson06.translate.003,
    a sentence translation "Go {item}." -> "Ga {item}." over the existing
    `direction_word` tag (every member -- links/rechts/linksaf/rechtsaf/
    rechtdoor -- is grammatical after "Ga", checked at course scope where
    the pool is the same 5 tokens; prompt varies with the gloss so the
    answer stays deterministic). tag_schema extended with
    `imperative_direction`. Production tier now 3 live.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [direction_word, direction_word_pure, turn_direction, route_map, imperative_direction]
slot_presets:
  direction_word: &direction_word {language_code: nl, part_of_speech: adverb, agreement_tags: {semantic: direction_word}}
  # direction_word_pure: exact-case (no capitalized "Rechtdoor" duplicate),
  # safe for matching_pairs -- see scripts/backfill_lexemes_en_nl.py's
  # direction_word_pure comment. This file's OTHER templates below keep
  # using the plain "direction_word" tag unchanged.
  direction_word_pure: &direction_word_pure {language_code: nl, part_of_speech: adverb, agreement_tags: {semantic: direction_word_pure}}
  turn_direction: &turn_direction {language_code: nl, part_of_speech: adverb, agreement_tags: {semantic: turn_direction}}
  # route_word: unit09's own route/map vocabulary (route, Route, START,
  # DOEL from lesson05's route_op_de_kaart) -- re-anchored 2026-07-24 from
  # a dead cross-unit "place_non_station" (unit08-only vocabulary, 0
  # unit09-scoped candidates). See review notes above.
  route_word: &route_word {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: route_map}}
  # command_verb: unit09's own lesson02 imperative verbs (ga/sla/loop plus
  # their sentence-initial Ga/Sla/Loop variants) -- added 2026-07-24 for the
  # bare-word production template below; case variants are harmless in a
  # bare-word prompt (typed answers are casefolded at grading).
  command_verb: &command_verb {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: imperative_direction}}
templates:
  - content_key: practice.en-nl.nl.a1.unit09.lesson01.choose.001
    lesson_content_key: nl.a1.unit09.lesson01.richtingswoorden
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *direction_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a direction word from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit09.lesson01.listen.002
    lesson_content_key: nl.a1.unit09.lesson01.richtingswoorden
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *direction_word}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the direction word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit09.lesson01.translate.004
    lesson_content_key: nl.a1.unit09.lesson01.richtingswoorden
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *direction_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit09.lesson02.order.001
    lesson_content_key: nl.a1.unit09.lesson02.bevelsvormen
    type: word_order
    frame: {text: "Sla {item}.", language_code: nl, direction: ltr}
    slots: {item: *turn_direction}
    answer_derivation: {kind: render_frame, frame: {text: "Sla {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the direction in this command.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit09.lesson02.listen.003
    lesson_content_key: nl.a1.unit09.lesson02.bevelsvormen
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
