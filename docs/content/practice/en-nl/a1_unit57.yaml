schema_version: '1.0'
pack_key: practice.en-nl.a1.unit57
source_language: en
target_language: nl
unit_content_key: nl.a1.unit57.museum
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Vocabulary unit (museum), all 6 lessons have lexemes. Recognition/production templates union
    the unit''s lesson tags via museum_vocab (8 distinct content tokens, unit-scoped). matching_pairs
    (lesson05) uses 6 of the 8 (bezoeken, tentoonstelling, bezoek, sluiten, gids, schilderij), omitting
    concert (lesson06, kept as a production/recognition item only) and schilderijen (plural near-duplicate
    of schilderij) to avoid a confusable pair. word_order (lesson02, ''Ik bezoek de {item}.'') and fill_in_blank
    (lesson05, same frame) both anchor museum_tentoonstelling_single (exactly 1 course-wide candidate,
    verified against backfill_lexemes_en_nl) reusing the realization''s own recurring sentence ''Ik bezoek
    de tentoonstelling.'' (it appears verbatim in both lesson02 and lesson05''s source material), so both
    are grammatical and course-scope safe by construction. The course-wide ''visit_noun_pure'' tag (afspraak/bezoek/huisarts/reden,
    4 members) was deliberately NOT used for any fixed-sentence frame -- those 4 nouns are not interchangeable
    in one frame, so it was avoided entirely per the underdetermined-production-prompt rule (DO-NOT #11).
    Capacity/coverage measured with the official §9 script; see report.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 20 templates against
    unit- and course-scoped pools, glosses vs the realization, frame grammar/self-reference, floors,
    booleans and jargon. 0 defects fixed in this pack. DEFERRED (lexeme gloss, backfill lane): bezoek is
    introduced in lesson02 as the verb form in ''Ik bezoek de tentoonstelling.'' (I visit) but carries
    the noun gloss ''the visit'' (pos noun), so MC/translation/matching show a sense the unit never
    teaches; not worked around (every unit tag carrying it is load-bearing). Also the ''the''-prefixed
    noun glosses (tentoonstelling, gids, schilderij, concert) make typed ''de tentoonstelling'' grade
    wrong. No native-judgment flags.'
