schema_version: '1.0'
pack_key: practice.en-nl.c1.unit05
source_language: en
target_language: nl
unit_content_key: nl.c1.unit05.contrafeitelijk_redeneren
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md to give nl.c1.unit05 (Contrafeitelijk
    redeneren: unreal past conditions, regret, mixed conditionals, counterfactual chains) a checkpoint
    and Endless Practice material. This is a grammar/discourse unit, so the recipe''s section 8.1 pattern
    is used: broad slots pool across the whole unit and are narrowed by part_of_speech, while each template
    stays anchored to one lesson. 23 templates over all 6 lessons (L01 3, L02 5, L03 4, L04 5, L05 3,
    L06 3). Recognition 5 multiple_choice; structured 3 matching_pairs + 6 word_order + 3 fill_in_blank;
    production 3 bare-word translation + 3 fixed-sentence translation. No listen_select. Tags (new, in
    the c1u05_ namespace, to be merged into the backfill): c1u05_inhoud is a curated content group holding
    all 66 unit tokens except Amsterdam (self-gloss proper noun) and had (gloss "had" sits next to gehad
    "had (past participle of hebben)" and would make options and pairs confusable); it feeds every multiple_choice
    and matching_pairs slot. c1u05_vertaal is the production-safe subset (50 tokens) used by the bare-word
    translations; it also leaves out heb, ben, kun, moeten, wonen, staan, heel and voltooid because their
    glosses (have, am/are, can, must, live, to be placed, very, completed) admit other correct Dutch answers
    (heeft, bent, kan, moet, woon, leven, erg, afgerond) under exact-match grading. Eleven single-member
    anchors (c1u05_<token>_single for verhuisd, gegrepen, gezien, woonde, heden, ontmoet, zat, afgewezen,
    misschien, leren, kennen) make every word_order, fill_in_blank and fixed-sentence translation deterministic;
    every frame is a hero sentence from the realization. Measured with the C1 harness at unit scope: ALL
    64/66 (97%), recognition 64/66 (97%), structured 58/66 (88%), production 50/66 (76%), 6/6 lessons
    in every tier, no dead or under-floor templates. Course scope: every sentence frame''s slot has exactly
    1 course-wide candidate (its anchor), which is grammatical in the frame and is not a literal word
    of it (defect 1.14 checked by hand). Gloss read (section 0.1): no outright mis-gloss found; soft flags
    - leren carries "to learn" while the unit teaches it inside leren kennen (to get to know), a legitimate
    dictionary sense; voorwaarde, woonde, gemengde and wilde carry a stray ordinal_number tag and vijf
    carries hour_number (harmless here, no slot uses those tags). Reviewer double-checks: (a) naturalness
    of the three fixed-sentence translations and their English instructions, which name the required Dutch
    form so only one rendering is correct; (b) the matching_pairs verb pool keeps heb (have) / gehad (had,
    past participle) and zat (sat; was) / ben (am; are) together - judged discriminable; (c) fill_in_blank
    frames show no hint, so blanks were chosen inside fixed collocations (achteraf gezien, het verleden
    ... het heden, leren kennen). Register: informal jou/jullie, matching the realization.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - c1u05_inhoud
    - c1u05_vertaal
    - c1u05_verhuisd_single
    - c1u05_gegrepen_single
    - c1u05_gezien_single
