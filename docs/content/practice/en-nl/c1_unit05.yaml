unit_content_key: nl.c1.unit05.contrafeitelijk_redeneren
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md to give nl.c1.unit05 (Contrafeitelijk redeneren: unreal past conditions, regret, mixed conditionals, counterfactual chains) a checkpoint and Endless Practice material. This is a grammar/discourse unit, so the recipe''s section 8.1 pattern is used: broad slots pool across the whole unit and are narrowed by part_of_speech, while each template stays anchored to one lesson. 23 templates over all 6 lessons (L01 3, L02 5, L03 4, L04 5, L05 3, L06 3). Recognition 5 multiple_choice; structured 3 matching_pairs + 7 word_order + 2 fill_in_blank; production 3 bare-word translation + 3 fixed-sentence translation. No listen_select. Tags (new, in the c1u05_ namespace, to be merged into the backfill): c1u05_inhoud is a curated content group holding 63 unit tokens, leaving out Amsterdam (self-gloss proper noun), had (gloss had sits next to gehad and would make options and pairs confusable) and vijf (a numeral carried as a noun, kept out of noun pools); it feeds every multiple_choice and matching_pairs slot. c1u05_vertaal is the production-safe subset (39 tokens) used by the bare-word translations; it leaves out every token whose gloss admits another correct Dutch answer under exact-match grading: heb, ben, kun, moeten, wonen, staan, heel, voltooid, woonde (leefde), zat (was), werkelijkheid (realiteit), tegenfeitelijke (contrafeitelijke), afgewezen (geweigerd), gegrepen (aangegrepen), aangenomen (geaccepteerd), uitdrukken (uiten), nadenken (overdenken) and loopt (rent). Glosses sharpened for this unit: woonde, gegrepen, uitdrukken, afgewezen, keten, gezien (no longer quotes Dutch), kreeg, achteraf and loopt. Eleven single-member anchors (c1u05_<token>_single for verhuisd, gegrepen, gezien, woonde, heden, ontmoet, zat, afgewezen, misschien, leren, kennen) make every word_order, fill_in_blank and fixed-sentence translation deterministic; every frame is a hero sentence from the realization. The two remaining fill_in_blank frames sit inside fixed pairings (het verleden ... het heden, leren kennen); the Achteraf gezien frame is a word_order because achteraf also takes bekeken. The fixed-sentence regret translation names the verb grijpen so aangegrepen is excluded. Multiple-choice feedback uses neutral unit-level wording true for every pool member. Measured with the C1 harness at unit scope: ALL 63/66 (95%), recognition 63/66 (95%), structured 57/66 (86%), production 41/66 (62%), 6/6 lessons in every tier, no dead or under-floor templates. Course scope: every sentence frame''s slot has exactly 1 course-wide candidate (its anchor), grammatical in the frame and not a literal word of it. Register: informal jou/jullie, matching the realization. Fresh-context review 2026-10-10: 12 findings (3 blocker, 9 minor), all addressed (fixed, or the affected token excluded from the pool), confirmed by a pool-level scan.'
