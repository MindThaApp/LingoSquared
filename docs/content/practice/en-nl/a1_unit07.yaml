schema_version: "1.0"
pack_key: practice.en-nl.a1.unit07
source_language: en
target_language: nl
unit_content_key: nl.a1.unit07.shopping
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "true"
  notes: >-
    Review 2026-10-24 (en-nl practice pass, session 10): 0 pack fixes. Native
    flags: word_order hint shows "een a kilo" (gloss).

    Original authoring notes (2026-07-05): added a "produce" tag (appels/
    peren/tomaten/paprika's, both lowercase and the capitalized price-label
    variants -- 8 real lexemes) reused across the unit, and a narrower
    "market_quantity" tag (kilo/pond) for the "Een {item} tomaten,
    alstublieft." frame. "zijn" (from "Wat mag het zijn?") correctly never
    used as a slot value.

    Independent fresh-context content audit found and fixed a real,
    repeated bug the authoring pass introduced despite explicitly knowing
    about the case duplication: the "produce" tag's inclusion of BOTH the
    lowercase lesson01 forms (appels/peren/tomaten/paprika's) AND the
    capitalized lesson04 price-tag-label forms (Appels/Peren/Tomaten/
    Paprika's) of the exact same words meant every template that embedded
    "{item}" mid-sentence could render a capitalized word where a lowercase
    one belongs -- e.g. lesson02's "Hoeveel kost een kilo {item}?" could
    generate "Hoeveel kost een kilo Appels?", and lesson05/06's "Dan neem
    ik een kilo {item}, alstublieft." could generate "...een kilo Peren,
    alstublieft." (capitalization leak mid-sentence, the exact bug class
    this review was watching for -- same root cause as the project's known
    "Mijn"-mid-sentence precedent, but NOT excluded here the way "Mijn"
    was). Also affected the parallel English translation-prompt frames via
    slot_rendering:english_gloss (capitalized glosses "Apples"/"Pears" mid
    English sentence). No existing tag in scripts/backfill_lexemes_en_nl.py
    isolates the 4 lowercase forms alone (the only shared tag besides
    "produce" is "market_place", which also pulls in markt/winkel/kraam --
    verified this directly against the script's real output before
    concluding no clean tag-only fix exists within pack-YAML-only editing
    permissions). **Fix**: restructured the 8 affected templates
    (lesson02.order/complete/translate, lesson05.order/complete/translate,
    lesson06.order/complete) to instead slot the already-safe, already
    lowercase-only "market_quantity" tag (kilo/pond) for the QUANTITY word
    while baking the specific produce noun as fixed lowercase text matching
    the lesson's own already-taught example sentence ("appels" for
    lesson02's "Hoeveel kost een {item} appels?", matching
    teach.ask_apples; "peren" for lesson05/06's "Dan neem ik een {item}
    peren, alstublieft.", matching teach.take_pears) -- both kilo and pond
    are fully grammatical in these positions ("een pond appels/peren" is
    natural, already-taught Dutch), eliminating the case-ambiguity risk
    entirely while keeping genuine 2-way slot variety. The isolated-word
    recognition templates (lesson01/03/04/06's choose/listen/match/
    translate-single-word) were left untouched since standalone-word
    display has no mid-sentence capitalization risk. Re-verified with the
    standalone harness (all 8 fixed templates now resolve to exactly
    {kilo, pond}) and the compiler (0 errors/0 warnings, run together with
    units 01-06, 08-09).
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [produce, produce_pure, market_quantity]
slot_presets:
  produce: &produce {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: produce}}
  # produce_pure: exact-case (no capitalized sentence-initial duplicates),
  # safe for matching_pairs -- see scripts/backfill_lexemes_en_nl.py's
  # produce_pure comment. This file's OTHER templates below keep using the
  # plain "produce" tag unchanged.
  produce_pure: &produce_pure {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: produce_pure}}
  market_quantity: &market_quantity {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: market_quantity}}
templates:
  - content_key: practice.en-nl.nl.a1.unit07.lesson01.choose.001
    lesson_content_key: nl.a1.unit07.lesson01.op_de_markt
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *produce}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a market produce word from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson01.listen.002
    lesson_content_key: nl.a1.unit07.lesson01.op_de_markt
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *produce}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the produce word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson01.translate.003
    lesson_content_key: nl.a1.unit07.lesson01.op_de_markt
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *produce}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson02.order.001
    lesson_content_key: nl.a1.unit07.lesson02.prijs_vragen
    type: word_order
    frame: {text: "Hoeveel kost een {item} appels?", language_code: nl, direction: ltr}
    slots: {item: *market_quantity}
    answer_derivation: {kind: render_frame, frame: {text: "Hoeveel kost een {item} appels?", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the quantity asked about.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson02.translate.003
    lesson_content_key: nl.a1.unit07.lesson02.prijs_vragen
    type: translation
    frame:
      text: "How much does {item} of apples cost?"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *market_quantity}
    answer_derivation: {kind: render_frame, frame: {text: "Hoeveel kost een {item} appels?", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Hoeveel kost een {item} appels? -- how much does {item} of apples cost?", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson03.order.001
    lesson_content_key: nl.a1.unit07.lesson03.hoeveelheden
    type: word_order
    frame: {text: "Een {item} tomaten, alstublieft.", language_code: nl, direction: ltr}
    slots: {item: *market_quantity}
    answer_derivation: {kind: render_frame, frame: {text: "Een {item} tomaten, alstublieft.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the quantity requested.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson03.listen.003
    lesson_content_key: nl.a1.unit07.lesson03.hoeveelheden
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *produce}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the produce word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson04.choose.001
    lesson_content_key: nl.a1.unit07.lesson04.prijskaartjes
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *produce}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a word from the price labels.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson04.match.002
    lesson_content_key: nl.a1.unit07.lesson04.prijskaartjes
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth}", language_code: nl, direction: ltr}
    slots: {first: *produce_pure, second: *produce_pure, third: *produce_pure, fourth: *produce_pure}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "Match each produce word with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson04.translate.003
    lesson_content_key: nl.a1.unit07.lesson04.prijskaartjes
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *produce}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson05.order.001
    lesson_content_key: nl.a1.unit07.lesson05.kopen_en_betalen
    type: word_order
    frame: {text: "Dan neem ik een {item} peren, alstublieft.", language_code: nl, direction: ltr}
    slots: {item: *market_quantity}
    answer_derivation: {kind: render_frame, frame: {text: "Dan neem ik een {item} peren, alstublieft.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the quantity being bought.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson05.translate.003
    lesson_content_key: nl.a1.unit07.lesson05.kopen_en_betalen
    type: translation
    frame:
      text: "Then I'll take {item} of pears, please."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *market_quantity}
    answer_derivation: {kind: render_frame, frame: {text: "Dan neem ik een {item} peren, alstublieft.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Dan neem ik een {item} peren, alstublieft -- then I'll take {item} of pears, please.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson06.listen.001
    lesson_content_key: nl.a1.unit07.lesson06.marktgesprek
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *produce}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the produce word you heard in this dialogue.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit07.lesson06.order.002
    lesson_content_key: nl.a1.unit07.lesson06.marktgesprek
    type: word_order
    frame: {text: "Dan neem ik een {item} peren, alstublieft.", language_code: nl, direction: ltr}
    slots: {item: *market_quantity}
    answer_derivation: {kind: render_frame, frame: {text: "Dan neem ik een {item} peren, alstublieft.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the quantity being bought.", language_code: en, direction: ltr}
