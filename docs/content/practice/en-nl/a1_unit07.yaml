  - content_key: practice.en-nl.nl.a1.unit07.lesson04.match.002
    lesson_content_key: nl.a1.unit07.lesson04.prijskaartjes
    type: matching_pairs
    frame: {text: "{first} · {second}", language_code: nl, direction: ltr}
    slots: {first: *produce, second: *produce}
