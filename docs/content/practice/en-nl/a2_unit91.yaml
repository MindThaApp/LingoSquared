schema_version: '1.0'
pack_key: practice.en-nl.a2.unit91
source_language: en
target_language: nl
unit_content_key: nl.a2.unit91.beginnen_stoppen_proberen
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 87-94 pass): 0 pack fixes. Dumped the shared union slot at unit scope (22 lexemes) and A2 course scope (78) and read every gloss; capacity with the '.a2.unit91.' filter: 15 templates, 100% coverage overall and in every tier, 5/5 lessons in every tier, no dead templates, pools above the MC and matching floors. Bare-word frames only. Backfill glosses for the coordinator (course scope, not excludable without dropping lessons from the union): bank 'the bank' while this unit teaches de bank 'the sofa'; vroeger 'in the past; formerly' while this unit teaches 'earlier'; deur carries an idiom note; zit 'sits; is (... is full)'. Roken 'smoking' / roken 'to smoke' are an unfolded case pair (grading casefolds, so a matching item stays answerable). Earlier notes: Authored for the lessons of A2 unit 91 that have backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases are left out. Backfill glosses to double-check: hoog, snoep/snoepen, game/gamen, rook, and the Roken/roken case pair. Conjugated forms (begin, stop, bel) carry (with ik) notes that the display layer strips. Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - beginnen_te_infinitive
    - stoppen_met_activity
    - proberen_vergeten_te
    - posture_verb_te_infinitive
    - habit_plan_reading
templates:
- content_key: practice.en-nl.nl.a2.unit91.lesson01.choose.001
  lesson_content_key: nl.a2.unit91.lesson01.ik_begin_te_sporten
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [beginnen_te_infinitive, stoppen_met_activity, proberen_vergeten_te, posture_verb_te_infinitive, habit_plan_reading]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit91.lesson01.match.002
  lesson_content_key: nl.a2.unit91.lesson01.ik_begin_te_sporten
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit91.lesson01.translate.003
  lesson_content_key: nl.a2.unit91.lesson01.ik_begin_te_sporten
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

