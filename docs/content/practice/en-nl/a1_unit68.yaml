schema_version: '1.0'
pack_key: practice.en-nl.a1.unit68
source_language: en
target_language: nl
unit_content_key: nl.a1.unit68.bakker
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. THIN
    vocabulary unit: 10 lexemes total (lesson01 x1, lesson02 x2, lesson03
    x1, lesson04 x4, lesson06 x2); lesson05
    (bij_de_toonbank_bij_de_bakker, dialogue-only) has ZERO classified
    lexemes and is excluded from the checkpoint -- not an oversight. Used
    the union broad tag `bakker_vocab` (9 distinct tokens: toonbank, gebak,
    zoet, croissant, bakkerij, croissants, gebakken, zak, ijssalon --
    excludes the proper noun Peters; all glosses read against the
    realization and confirmed correct -- "ijssalon" is legitimately this
    unit's own lexeme, introduced conversationally in lesson06's
    forward-referencing proposal line, not a forward-reference to a LATER
    LESSON of this same unit). Only single-member anchor available is
    `bakker_toonbank_single` (toonbank, lesson01), used for both the
    fill_in_blank and word_order templates with two different literal
    frames; the word_order frame's literal word "bakker" is a course-wide
    lexeme (classified separately, under unit67's own tags) but is NOT a
    candidate of the toonbank_single slot at any scope, so it is not a
    same-slot self-reference. 15 templates, all 5 lexeme-bearing lessons
    covered by both multiple_choice and translation; matching_pairs
    anchored to lesson02 and lesson04 (broad tag, 6 pairs each, all distinct
    glosses -- croissant/croissants are a legitimate singular/plural
    discrimination, not a case-duplicate). Recognition 6 (5 MC + 1
    listen_select), structured 4 (2 matching_pairs + 1 fill_in_blank + 1
    word_order), production 5 (translation). Needs standard fresh-context
    review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - bakker_vocab
    - bakker_toonbank_single
templates:

