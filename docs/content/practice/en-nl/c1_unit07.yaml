review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: >-
    Review 2026-10-24 (en-nl C1 practice pass, session 10; same checklist as the A1-B2 pass): every template
    re-dumped with unit- and level-scope pools (C1 tags are unit-curated, so both scopes are identical) and
    checked for feedback truth, frame language codes, fixed-sentence determinism, broken renders, same-gloss
    cards in MC/matching pools, typed-answer ambiguity in bare-word translation, and Dutch naturalness. 1 fix:
    lesson04.order.002 English feedback 'how loud something is' -> 'sounds' (matches klinkt). Backfill: vat
    gloss 'grasps; sums up (with hij/zij; separable, the particle goes to the end)' -> 'sums up (with
    hij/zij)' (authoring text showed in lesson01 MC). Native flag: lesson05.order.003 'zijn het eens,
    behoudens dit punt' register.
    Authored against docs/content/PRACTICE_PACK_RECIPE.md (§8.1 grammar/discourse-unit pattern) to make the nl
    C1 unit07 (bronnen bemiddelen / mediating sources) checkpoint work. 22 templates over all 6 lessons (all
    have lexemes): multiple_choice x6 (recognition); word_order x7 + matching_pairs x3 (structured); bare-word
    translation x6 (production). No listen_select, no fill_in_blank, no fixed-sentence translation.
    Recognition and production slots use hand-curated per-lesson tags (c1u07_l0N_mc, c1u07_l0N_tr) holding
    only this unit's own tokens, so course-scope pools are exactly the checked lists. MC pools leave out the
    pure cognates park/decibel/term. Translation pools additionally leave out every token whose gloss a common
    Dutch synonym or other form also answers: vat/leg/legt/zet/spreekt/bepaal/vermeld/verluidt/eens (separable
    or fixed-phrase forms), kernpunt, standpunt, schrijver (auteur), windmolenpark (windpark),
    overlast/hinder/geluidsoverlast, molens, bewoners (inwoners), bezorgdheid (zorg), rapport (verslag),
    onderzoek (studie), uitleggen (verklaren), behouden (houden), geluid (lawaai), maat, tegenspraak,
    andere/ene, gewone, hard, helder (duidelijk), Beste (Geachte), stelt, bewezen. Structured tier puts the
    unit's mediation constructions in the frame (Wie bemiddelt, vat ... samen; Het plan stelt dat ...; Volgens
    het onderzoek is dat nog niet bewezen; dat wil zeggen hoe hard iets klinkt; naar verluidt; De twee bronnen
    zijn het eens, behoudens dit punt; Behoudens het punt van tegenspraak is de situatie helder) with
    single-member anchors c1u07_vat_single, c1u07_stelt_single, c1u07_bewezen_single, c1u07_hard_single,
    c1u07_verluidt_single, c1u07_behoudens_single, c1u07_helder_single (each exactly 1 course-scope candidate,
    never in sentence-first position). matching_pairs use three hand-curated groups (c1u07_match_nouns,
    c1u07_match_verbs, c1u07_match_modifiers) with no interchangeable glosses. Unit gloss fixes (scratchpad
    gloss_fixes.json): no gloss quotes its own Dutch token any more (vat, leg, legt, spreekt, bepaal, zet,
    eens, wijst, verluidt, vermeld, hard); helder 'clear; lucid', gewone 'ordinary (inflected)', behoudens
    'barring; subject to (formal)', moet 'must; has to', artikel 'the article (piece of writing)', punt 'the
    point (of discussion)', noemt/kiest carry (with hij/zij). These extra tags and glosses live in the
    scratchpad json files and must be merged into the backfill before import. Feedback frames on MC are
    neutral ('{item} is a word from this unit.'). Measured (c1 harness): ALL 92% (82/89), recognition 92%,
    structured 54%, production 54%; every tier 6/6 lessons; no dead/thin templates. Register: frames are
    third-person reporting sentences. Fresh-context review 2026-10-10: 17 findings (7 blocker, 10 minor), all
    addressed (fixed, or the affected token excluded from the pool), confirmed by a pool-level scan.

    Second independent fresh-context review 2026-10-11 (one reviewer per unit, no access to the authoring
    notes or the first review), followed by a third fresh-context verification pass on the fixed pack.
    Pack-wide fix shared by all C1 units: C1 noun glosses no longer start with 'the' (backfill
    nl_c1_bare_gloss), so a bare-word translation no longer invites 'de/het X' and word_order hints no longer
    render 'de the X' (registry 1.40). 2nd review: 9 minor findings. Fixed: glosses buurtonderzoek, eerlijk,
    behoudens (and its 'barring this point' feedback), gemeten, bevestigd; two match feedback lines made true.
    3rd pass: 4 minor (behoudens/behalve, begrijpt/snapt, kant/zijde, deze 'this; these'), all fixed.
    Deferred: stray tags on Beste (no C1 slot selects them); alternative word orders in lesson03/05/06 order
    templates (engine). Status kept unreviewed: the third pass found defects, now fixed, so one more clean
    fresh-context pass is needed.

    NATIVE-REVIEW FLAGS for Ramin (unchanged, need a native judgement): begrijpt/snapt (now out of the pool);
    samenvatten/resumeren; kortom/kortweg; postposed 'behoudens dit punt'; 'punt van tegenspraak';
    vakterm/vakwoord; hinder 'hindrance' vs 'nuisance'.

    Language review 2026-10-20 (fresh context; no access to the authoring session): read every template
    against its real course-scope pool (backfill_lexemes_en_nl iter_specs + lexeme_matches) and the nl
    realization: Dutch frames and feedback sentences, English feedback translations, MC/matching gloss
    collisions, typed-translation alternatives, fill_in_blank uniqueness, register. 0 defects: mediation
    frames correct, including naar verluidt and behoudens; feedback accurate. Status moves to reviewed.
    Native flags above unchanged. Gloss note for the backfill lane: standpunt is glossed 'a position;
    point of view' with a leading article, unlike the other C1 noun glosses.
