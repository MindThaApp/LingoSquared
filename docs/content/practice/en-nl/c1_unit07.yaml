  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - c1u07_behoudens_single
    - c1u07_bewezen_single
    - c1u07_hard_single
    - c1u07_helder_single
    - c1u07_l01_mc
