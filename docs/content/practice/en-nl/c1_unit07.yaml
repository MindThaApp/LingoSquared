schema_version: '1.0'
pack_key: practice.en-nl.c1.unit07
source_language: en
target_language: nl
unit_content_key: nl.c1.unit07.bronnen_bemiddelen
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored against docs/content/PRACTICE_PACK_RECIPE.md (§8.1 grammar/discourse-unit pattern)
    to make the nl C1 unit07 (bronnen bemiddelen / mediating sources) checkpoint work. 22 templates over
    all 6 lessons (all have lexemes): multiple_choice x6 (recognition); word_order x6 + fill_in_blank
    x1 + matching_pairs x3 (structured); bare-word translation x6 (production). No listen_select, no fixed-sentence
    translation. Recognition/production slots are per-lesson (each lesson''s own c1u07_<slug> tag, narrowed
    by part_of_speech to content words; preposition added on lesson01/05 to host volgens/behoudens; lesson02
    translation omits adjectives to keep ene "the one" out of a typed-answer pool). Every slot is satisfiable
    from THIS unit''s lexemes. Structured tier puts the unit''s own mediation constructions in the frame
    (Wie bemiddelt, vat ... samen; Het plan stelt dat ...; Volgens het onderzoek is dat nog niet bewezen;
    dat wil zeggen hoe hard iets klinkt; naar verluidt; Behoudens dit punt ...; Behoudens het punt van
    tegenspraak is de situatie helder) with single-member anchors c1u07_vat_single, c1u07_stelt_single,
    c1u07_bewezen_single, c1u07_hard_single, c1u07_verluidt_single, c1u07_behoudens_single, c1u07_helder_single
    (each exactly 1 course-scope candidate, so every frame is deterministic and no literal frame word
    is a candidate of its own slot). matching_pairs use three hand-curated groups (c1u07_match_nouns 15,
    c1u07_match_verbs 15, c1u07_match_modifiers 12) chosen so no two members have interchangeable glosses:
    excluded overlast/hinder/geluidsoverlast, kernpunt/standpunt/punt/artikel ("item" overlap), stelt/beweert/vermeld/noemt,
    leg/legt/zet ("put"), bewoners/buren, klein/minimaal. These extra tags live in the scratchpad tags.json
    and must be merged into NL_C1_EXTRA_TAGS before import. Measured (c1 harness, .c1.unit07. filter):
    ALL 96% (85/89), recognition 96%, structured 54%, production 90%; every tier 6/6 lessons; no dead/thin
    templates. Course scope: lesson tags widen to include earlier-C1 tokens re-used in unit07 (e.g. probleem,
    duidelijk, kort, vrezen, plan, maak, beperkt, op/met/naar); every course-scope translation pool was
    read and no two members share an answerable gloss. REVIEWER double-check: (1) park "the park" (lesson03)
    refers to the wind farm in this unit -- literal translation still right, kept; (2) moet carries "must;
    is due" (the "is due" sense is not taught here) -- harmless as a prompt but could be trimmed in the
    backfill; (3) artikel "the item; article" leads with the A-level shopping sense, unit teaches "article"
    -- kept in lesson01 MC/translation, consider a gloss reorder; (4) Beste (lesson06) also carries ordinal_number/superlative_word
    from earlier levels'' tagging -- harmless here (slots use only c1u07 tags); (5) word_order hint lines
    show the long backfill glosses (e.g. "is rumoured (in ''naar verluidt'' = reportedly)") in place of
    the slot. Register: informal jij/je where relevant (frames are third-person reporting sentences).'
