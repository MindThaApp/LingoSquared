schema_version: '1.0'
pack_key: practice.en-nl.c1.unit07
source_language: en
target_language: nl
unit_content_key: nl.c1.unit07.bronnen_bemiddelen
review:
  status: unreviewed
  fresh_context: 'false'
  notes: "Authored against docs/content/PRACTICE_PACK_RECIPE.md (\xA78.1 grammar/discourse-unit pattern) to make the nl C1\
      \ unit07 (bronnen bemiddelen / mediating sources) checkpoint work. 22 templates over all 6 lessons (all have lexemes):\
      \ multiple_choice x6 (recognition); word_order x7 + matching_pairs x3 (structured); bare-word translation x6 (production).\
      \ No listen_select, no fill_in_blank, no fixed-sentence translation. Recognition and production slots use hand-curated\
      \ per-lesson tags (c1u07_l0N_mc, c1u07_l0N_tr) holding only this unit's own tokens, so course-scope pools are\
      \ exactly the checked lists. MC pools leave out the pure cognates park/decibel/term. Translation pools additionally\
      \ leave out every token whose gloss a common Dutch synonym or other form also answers: vat/leg/legt/zet/spreekt/bepaal/vermeld/verluidt/eens\
      \ (separable or fixed-phrase forms), kernpunt, standpunt, schrijver (auteur), windmolenpark (windpark), overlast/hinder/geluidsoverlast,\
      \ molens, bewoners (inwoners), bezorgdheid (zorg), rapport (verslag), onderzoek (studie), uitleggen (verklaren),\
      \ behouden (houden), geluid (lawaai), maat, tegenspraak, andere/ene, gewone, hard, helder (duidelijk), Beste (Geachte),\
      \ stelt, bewezen. Structured tier puts the unit's mediation constructions in the frame (Wie bemiddelt, vat ...\
      \ samen; Het plan stelt dat ...; Volgens het onderzoek is dat nog niet bewezen; dat wil zeggen hoe hard iets klinkt;\
      \ naar verluidt; De twee bronnen zijn het eens, behoudens dit punt; Behoudens het punt van tegenspraak is de situatie\
      \ helder) with single-member anchors c1u07_vat_single, c1u07_stelt_single, c1u07_bewezen_single, c1u07_hard_single,\
      \ c1u07_verluidt_single, c1u07_behoudens_single, c1u07_helder_single (each exactly 1 course-scope candidate, never\
      \ in sentence-first position). matching_pairs use three hand-curated groups (c1u07_match_nouns, c1u07_match_verbs,\
      \ c1u07_match_modifiers) with no interchangeable glosses. Unit gloss fixes (scratchpad gloss_fixes.json): no gloss\
      \ quotes its own Dutch token any more (vat, leg, legt, spreekt, bepaal, zet, eens, wijst, verluidt, vermeld, hard);\
      \ helder 'clear; lucid', gewone 'ordinary (inflected)', behoudens 'barring; subject to (formal)', moet 'must;\
      \ has to', artikel 'the article (piece of writing)', punt 'the point (of discussion)', noemt/kiest carry (with\
      \ hij/zij). These extra tags and glosses live in the scratchpad json files and must be merged into the backfill\
      \ before import. Feedback frames on MC are neutral ('{item} is a word from this unit.'). Measured (c1 harness):\
      \ ALL 92% (82/89), recognition 92%, structured 54%, production 54%; every tier 6/6 lessons; no dead/thin templates.\
      \ Register: frames are third-person reporting sentences. Fresh-context review 2026-10-10: 17 findings (7 blocker, 10 minor),\
      \ all addressed (fixed, or the affected token excluded from the pool), confirmed by a pool-level scan."
