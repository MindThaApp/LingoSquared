schema_version: '1.0'
pack_key: practice.en-nl.a2.unit79
source_language: en
target_language: nl
unit_content_key: nl.a2.unit79.vakantieplannen
review:
  status: reviewed
  fresh_context: 'false'
  required_next_reviewer: native_speaker_review
  notes: 'Authored 2026-10-27 (session 17) for A2 unit 79 "Vakantieplannen" (holiday plans). 37 templates over all 6 lessons:
    multiple_choice, listen_select, matching_pairs, word_order, fill_in_blank and translation (bare-word and fixed-sentence).
    The lexeme backfill (scripts/backfill_lexemes_en_nl.py) classifies the unit: new glosses and parts of speech, six lesson_categories
    entries, a unit-scoped verb gloss for boeken, and curated pools plan_* gated on the unit''s lessons. Fixed sentences use
    one-member anchor tags (plan_single_*) so every fill_in_blank slot has exactly one course-wide candidate; accepted_variants
    cover the verb-second order the unit teaches (time word first or after ik). English contraction expansions are folded
    by the shared grader and are not listed. Needs the standard fresh-context review and the native-speaker pass before import.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - plan_infinitives
    - plan_nouns
    - plan_single_blijf
    - plan_single_boeken
    - plan_single_ga
    - plan_single_ouders
    - plan_single_reizen
    - plan_single_sparen
    - plan_single_verhuizen
    - plan_single_volgen
    - plan_single_wie
    - plan_single_zus
    - plan_time_nouns
    - plan_times
