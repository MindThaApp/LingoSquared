    direction: ltr
- content_key: practice.en-nl.nl.a1.unit45.lesson06.translate.002
  lesson_content_key: nl.a1.unit45.lesson06.sander_checkt_zijn_portemonnee
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
