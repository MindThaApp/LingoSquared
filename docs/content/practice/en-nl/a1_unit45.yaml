    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a1.unit45.lesson02.order.001
  lesson_content_key: nl.a1.unit45.lesson02.telefoon_rugzak_portemonnee
  type: word_order
  frame:
    text: Ik ben mijn {item} kwijt.
    language_code: nl
    direction: ltr
  slots:
    item: *u45_telefoon_single
  answer_derivation:
    kind: render_frame
    frame:
      text: Ik ben mijn {item} kwijt.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: Ik ben mijn {item} kwijt. -- I have lost my {item}.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a1.unit45.lesson02.translate.002
  lesson_content_key: nl.a1.unit45.lesson02.telefoon_rugzak_portemonnee
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *u45_lost_item_noun
  answer_derivation:
