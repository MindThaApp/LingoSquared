schema_version: "1.0"
pack_key: practice.en-nl.a1.unit02
source_language: en
target_language: nl
unit_content_key: nl.a1.unit02.numbers
review:
  status: reviewed
  required_next_reviewer: null
  fresh_context: "true"
  notes: >-
    Independent fresh-context content audit completed (zero access to the
    authoring reasoning above). Every lesson_content_key matches a real
    nl.a1.unit02 realization lesson (all 6 confirmed). Standalone
    lexeme_matches()-replicating harness against scripts/
    backfill_lexemes_en_nl.py's real iter_specs() output confirms every slot
    far exceeds the required candidate bar: number (lesson01/02) = 90 real
    candidates spanning both nul_tot_twaalf and vanaf_dertien (0-99, an
    incremental within-unit extension of an already-introduced category, not
    a genuine forward-reference violation -- consistent with how this
    project treats continuous number sequences elsewhere), number_symbol
    (lesson03-06) = 45. Hand-checked every frame against every possible
    filler: "Mijn huisnummer is {item}.", "Ik ben {item} jaar.", "Dat kost
    {item} euro.", "Het taalcafé is in zaal {item}." are all grammatical for
    any digit-string or number-word filler (no gender/agreement dependency on
    a plain cardinal number). No capitalization leaks, no self-reference, no
    jargon leaks, no stray YAML booleans. One minor (non-blocking) quality
    note for a future pass, not a correctness bug: the shared "number" tag's
    candidate pool mixes digit-symbol lexemes (e.g. token "5", glossed as
    literal "5") with spelled-out word lexemes (e.g. "vijf", glossed "five")
    -- occasionally produces a slightly redundant-looking multiple_choice
    option pair or a trivial digit-to-digit translate round, but never an
    incorrect grading outcome or ungrammatical sentence. Compiler validation
    re-run together with units 01, 03-09: 0 errors/0 warnings.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [register_language, wellbeing, name_exchange, origin_language, cafe_small_talk, first_meeting_dialogue, number, contact_number, age_quantity, price, library_registration, weekday, month, ordinal_number, date_expression, library_date, cafe_appointment, clock_time, quarter_hour, time_question, time_of_day, schedule, cafe_meetup_time, informal_address, polite_address, greeting, wellbeing_answer, person_name, place_name, country, language_or_nationality]
    register: [informal, polite]
slot_presets:
  informal_address: &informal_address {language_code: nl, part_of_speech: pronoun, agreement_tags: {semantic: informal_address}}
  greeting: &greeting {language_code: nl, part_of_speech: phrase, agreement_tags: {semantic: greeting}}
  person_name: &person_name {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: person_name}}
  country: &country {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: country}}
  number: &number {language_code: nl, part_of_speech: [symbol, noun], agreement_tags: {semantic: number}}
  number_symbol: &number_symbol {language_code: nl, part_of_speech: symbol, agreement_tags: {semantic: number}}
  weekday: &weekday {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: weekday}}
  month: &month {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: month}}
  ordinal_number: &ordinal_number {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: ordinal_number}}
  time_of_day: &time_of_day {language_code: nl, part_of_speech: [noun, adverb], agreement_tags: {semantic: time_of_day}}
templates:
  - content_key: practice.en-nl.nl.a1.unit02.lesson01.listen.001
    lesson_content_key: nl.a1.unit02.lesson01.nul_tot_twaalf
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *number}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the number you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit02.lesson01.choose.002
    lesson_content_key: nl.a1.unit02.lesson01.nul_tot_twaalf
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English value.", language_code: en, direction: ltr}
    slots: {item: *number}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} has this numerical value.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit02.lesson01.translate.003
    lesson_content_key: nl.a1.unit02.lesson01.nul_tot_twaalf
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *number}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch number is {item}.", language_code: en, direction: ltr}
