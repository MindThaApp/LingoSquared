source_language: en
target_language: nl
unit_content_key: nl.b1.unit18.plannen_en_voorspellingen
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: "Fresh-context review 2026-11-27 (en-nl B1 units 12-19 pass): dumped every slot's unit-scope (16 lexemes, 6 lessons) and B1 course-scope pool (49 MC/translation, 57 matching) and read every gloss against the realization; all frames are bare '{item}' or matching_pairs, so defect 1.14 self-reference has no literal frame text to hit (checked by hand, clean) and listen_select cannot leak a frame word. b1_unit_review is kept because it carries lesson06's lexemes voorspelling and slimme. Capacity: 19 templates, ALL 14/16 (88%), recognition, structured and production 14/16 each, 6/6 lessons in every tier, no dead template, MC pool 14 distinct glosses (Naar and welke stay out by part of speech). weet 'know (with ik)' vs weten 'to know' is a fair finite/infinitive discrimination. 0 fixes. ROUTE (backfill gloss): the course-scope lexeme of (unit05) is glossed 'or', but B1 units 05 and 18 teach of = whether; it reaches only the matching pool here, where 'or' is still a true meaning, so it was left in. NATIVE FLAGS: at course scope ben 'am; are' and zijn 'are' can meet in one MC. DEFERRED (systemic): bare-word translation shows the gloss without its bracket note. Earlier notes: Authored against docs/content/PRACTICE_PACK_RECIPE.md as part of the en-nl B1 fill (units 12-19). Every slot unions this unit's own lesson tags so the multiple_choice and matching_pairs floors are met from the unit's own lexemes; translation and multiple_choice use slot_gloss only, with no fixed-sentence frames. Needs the standard fresh-context review before import."
