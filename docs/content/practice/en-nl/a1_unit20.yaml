    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson03.order.001
    lesson_content_key: nl.a1.unit20.lesson03.welke_kleur
    type: word_order
    frame: {text: "Ik wil de jas in het {item}.", language_code: nl, direction: ltr}
    slots: {item: *color}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil de jas in het {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the color requested.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson03.translate.002
    lesson_content_key: nl.a1.unit20.lesson03.welke_kleur
    type: translation
    frame:
      text: "I want the coat in {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *color}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil de jas in het {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik wil de jas in het {item}.", language_code: en, direction: ltr}
