schema_version: "1.0"
pack_key: practice.en-nl.a1.unit20
source_language: en
target_language: nl
unit_content_key: nl.a1.unit20.clothing
review:
  status: reviewed
  fresh_context: "true"
  required_next_reviewer: native_speaker_review
  notes: "Review 2026-10-24 (en-nl practice pass, session 10): 7 fixes -- feedback and matching text no longer call maat, kleur and the receipt/number extras clothing words (choose, match); translate.005 prompt pins the verb (zoeken vs op zoek zijn); past_het order feedback true for the level-scope extra is; 2 Dutch feedback frames retagged nl. Native flags: Ik wil de jas in het zwart vs in zwart.

    Authored 2026-07-06 by the Claude session extending the en-nl
    Endless Practice pool to cover the real content gap flagged this
    session: en-nl practice templates only went through unit16 while the
    actual Dutch lesson content already goes through unit23. This file
    covers unit20 (buying clothes): looking for a garment, stating size,
    choosing a color, checking fit, and reading a receipt. A separate
    parallel session covered units 17-19 (work, housing, weather) the same
    day -- both passes share scripts/backfill_lexemes_en_nl.py, widened
    together to cover units 17-23; this pass added the unit20-23 glosses,
    part-of-speech classifications, lesson_categories entries, and
    semantic tags. Added a 6-member 'clothing_noun' recognition-only tag
    (jas/trui/broek/schoenen/maat/kleur -- schoenen is always plural with
    no article and maat/kleur don't collocate with the other 4's 'Ik zoek
    een X' shape, so this stays recognition-only) and a narrower 3-member
    'clothing_item_singular' generative tag (jas/trui/broek, verified safe
    in 'Ik zoek een {item}.'). A 2-member 'color' tag (zwart/blauw) is
    translation/word_order-only (below the >=3-distinct floor for
    multiple_choice/listen_select), safe in 'Ik wil de jas in het {item}.'
    per this unit's own teaching note that color always takes 'in het'
    regardless of the color word's own gender. A 2-member 'size_too_adj'
    tag reuses unit14's existing klein/groot comparative-lesson adjectives
    bare (not comparative) in this unit's own 'Het is te {item}.' pattern,
    same translation/word_order-only discipline. Every slot's real
    candidate count was verified with a standalone lexeme_matches()-
    replicating harness against this script's actual output before
    writing these templates. Needs the standard fresh-context review
    before import. Same blocking dependency as every earlier en-nl pack:
    backfill_lexemes_en_nl.py has not actually been run against a real
    database yet.

    2026-07-24 unit-scope re-authoring pass (checkpoint-viability fix,
    PACK-ONLY, see docs/content/PRACTICE_PACK_RECIPE.md): three DEAD
    templates found by scripts/_practice_unit_scope_check.py.
    (1) lesson01.match.003 declared 6 slots over 'clothing_noun' alone,
    but that tag has only 5 unit-native distinct tokens (jas, broek,
    schoenen, maat, kleur) -- never generates (recipe DO-NOT #5).
    Widened to the union 'clothing_noun'+'receipt_reading', which adds
    'Winterjas' (unit20-native, lesson05) for 6 distinct tokens; no
    case-duplicate risk (Winterjas/kleur have no capitalized siblings in
    this pool). (2) lesson04.order.001 ('Het is te {item}.') and
    (3) lesson04.translate.002 both constrained `item` to 'size_too_adj'
    (klein/groot) -- but those adjectives are unit14-native, not unit20-
    native (this unit's own lesson04 only ever reintroduces them, it
    doesn't introduce them), so both had 0 unit-scoped candidates
    (recipe DO-NOT #2). lesson04's OWN real vocabulary is 'Past'/'past'
    ('Fits'/'fits', clothing_fit tag) from its actually-taught phrase
    'Het past goed.' -- order.001 re-anchored to frame 'Het {item}
    goed.' (renders the exact taught sentence for 'past'); course-scope
    re-read (dropping the unit filter, keeping '.a1.') widens
    clothing_fit+verb to {is, Past, past} -- 'Het is goed.'/'Het past
    goed.'/'Het Past goed.' are all grammatical (the last is just a
    mid-sentence capital, a display-quality note only, not a grading
    hazard per the recipe's §6.6 correction). translate.002 converted
    from the old fixed-English-sentence shape (unsafe over a >1-member
    slot -- the underdetermined-production-prompt defect) to a bare-word
    translation over the same clothing_fit tag, which is safe with any
    pool size. Verified via scripts/_practice_unit_scope_check.py: 0
    DEAD, 0 below-floor after this pass (was 3 DEAD, 0 below-floor).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist):
    checked all 14 templates against unit- and course-scoped pools
    (practice_dump), every rendering, gloss senses vs the nl a1_unit20
    realization, matching confusables/case duplicates, self-reference,
    booleans and jargon. 1 defect fixed: lesson01.translate.005 rendered
    the prompt 'I am looking for a the coat.' / 'I am looking for a the
    pants; the trousers.' because the lexeme glosses carry 'the'; prompt
    changed to 'I am looking for {item}.' and the answer/feedback frame
    to 'Ik zoek de {item}.' (every course-wide pool member
    jas/broek/trui is a de-word, so the article now matches the English
    and the answer stays deterministic). Noted, not changed:
    feedback_frame strings like 'kleur is a clothing word' are loose but
    feedback_frame is not rendered by the current practice service; the
    lesson01.order.004 hint line still shows 'Ik zoek een *the coat*.'
    (word-by-word gloss hint, engine behaviour). No native-judgment
    flag."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [clothing_noun, clothing_item_singular, color, clothing_fit, clothing_fit_pure, receipt_reading]
slot_presets:
  clothing_noun: &clothing_noun {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: clothing_noun}}
  clothing_item_singular: &clothing_item_singular {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: clothing_item_singular}}
  color: &color {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: color}}
  # clothing_noun ∪ receipt_reading: widens lesson01.match.003's pool from 5
  # to 6 distinct unit-native tokens (adds 'Winterjas'/'kleur' from lesson05
  # -- see review.notes' 2026-07-24 entry). size_too_adj (klein/groot) is
  # dropped: those adjectives are unit14-native, not unit20-native, so the
  # tag had 0 unit-scoped candidates here; clothing_fit is its replacement.
  clothing_noun_or_receipt: &clothing_noun_or_receipt {language_code: nl, part_of_speech: [noun], agreement_tags: {semantic: [clothing_noun, receipt_reading]}}
  clothing_fit: &clothing_fit {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: clothing_fit}}
  # clothing_fit_pure: exact-case verb {is, past} (excludes the capitalized "Past"
  # reading-label variant) so word_order/translate never bake "Het Past goed."
  # Added 2026-07-29.
  clothing_fit_pure: &clothing_fit_pure {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: clothing_fit_pure}}
templates:
  - content_key: practice.en-nl.nl.a1.unit20.lesson01.choose.001
    lesson_content_key: nl.a1.unit20.lesson01.ik_zoek_een_jas
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *clothing_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a word from the clothing-shop lessons.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson01.listen.002
    lesson_content_key: nl.a1.unit20.lesson01.ik_zoek_een_jas
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *clothing_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson01.match.003
    lesson_content_key: nl.a1.unit20.lesson01.ik_zoek_een_jas
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: nl, direction: ltr}
    slots: {first: *clothing_noun_or_receipt, second: *clothing_noun_or_receipt, third: *clothing_noun_or_receipt, fourth: *clothing_noun_or_receipt, fifth: *clothing_noun_or_receipt, sixth: *clothing_noun_or_receipt}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each word with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson01.order.004
    lesson_content_key: nl.a1.unit20.lesson01.ik_zoek_een_jas
    type: word_order
    frame: {text: "Ik zoek een {item}.", language_code: nl, direction: ltr}
    slots: {item: *clothing_item_singular}
    answer_derivation: {kind: render_frame, frame: {text: "Ik zoek een {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is what you are looking for.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson01.translate.005
    lesson_content_key: nl.a1.unit20.lesson01.ik_zoek_een_jas
    type: translation
    frame:
      text: "I am looking for {item}. (Use the verb zoeken.)"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *clothing_item_singular}
    answer_derivation: {kind: render_frame, frame: {text: "Ik zoek de {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik zoek de {item}.", language_code: nl, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson02.choose.001
    lesson_content_key: nl.a1.unit20.lesson02.welke_maat
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *clothing_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a word from the clothing-shop lessons.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson02.listen.002
    lesson_content_key: nl.a1.unit20.lesson02.welke_maat
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *clothing_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson03.order.001
    lesson_content_key: nl.a1.unit20.lesson03.welke_kleur
    type: word_order
    frame: {text: "Ik wil de jas in het {item}.", language_code: nl, direction: ltr}
    slots: {item: *color}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil de jas in het {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the color requested.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson03.translate.002
    lesson_content_key: nl.a1.unit20.lesson03.welke_kleur
    type: translation
    frame:
      text: "I want the coat in {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *color}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil de jas in het {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik wil de jas in het {item}.", language_code: nl, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson03.listen.003
    lesson_content_key: nl.a1.unit20.lesson03.welke_kleur
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *clothing_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson04.order.001
    lesson_content_key: nl.a1.unit20.lesson04.past_het
    type: word_order
    frame: {text: "Het {item} goed.", language_code: nl, direction: ltr}
    slots: {item: *clothing_fit_pure}
    answer_derivation: {kind: render_frame, frame: {text: "Het {item} goed.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the verb in this sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson04.translate.002
    lesson_content_key: nl.a1.unit20.lesson04.past_het
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *clothing_fit_pure}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson05.choose.001
    lesson_content_key: nl.a1.unit20.lesson05.bonnetje_lezen
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *clothing_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a word from the shopping lessons.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit20.lesson06.listen.001
    lesson_content_key: nl.a1.unit20.lesson06.winterjas_passen
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *clothing_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard in this dialogue.", language_code: en, direction: ltr}
