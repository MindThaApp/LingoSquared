schema_version: '1.0'
pack_key: practice.en-nl.a2.unit82
source_language: en
target_language: nl
unit_content_key: nl.a2.unit82.hoe_het_vroeger_was
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 79-86 pass): dumped every slot's unit-scope and course-scope pool (a2 + unit82 filter) and read every gloss against the realization; both fill_in_blank anchors (buiten, deed) have one course-wide candidate and the word_order frame De kinderen speelden {item}. stays grammatical at course scope; the six-pair pools have no case duplicates or interchangeable glosses; multiple-choice feedback starting with Choose is suppressed by the runtime and the listen feedback renders the heard token truthfully. 0 fixes. Capacity: 21 templates, ALL 100%, recognition 100%, structured 54%, production 100%, 6/6 lessons in every tier, no dead templates. Backfill note for the coordinator: anders carries different(ly) while the unit uses it as otherwise (Anders kies je -de); not wrong as a meaning of the bare word, so it was left in the pool.

    Authored for A2 unit 82, covering all six lexeme-bearing lessons with
    recognition, structured and production templates. Recognition and bare-word
    production use the unit's six semantic pools with content-word parts of speech.
    Matching uses a curated noun pool with distinct glosses and an imperfectum-form
    pool without case duplicates. The fill and word-order frames use buiten, the
    sole A2 adverb in the imperfectum_te_de pool, so both remain grammatical and
    unambiguous at course scope. All 76 dumped lexeme glosses were checked against
    the realization; none was mis-glossed or excluded. Capacity was measured after
    authoring; native review should confirm the naturalness of the learner-facing
    Dutch frames and the usefulness of the broad content-word recognition pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - then_and_now_vocabulary
    - imperfectum_te_de
    - imperfectum_number
    - old_neighbourhood_habits
    - childhood_reading
    - past_habits_dialogue
    - wat_deed_single

templates:
- content_key: practice.en-nl.nl.a2.unit82.lesson01.choose.001
  lesson_content_key: nl.a2.unit82.lesson01.vroeger_en_nu
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &broad_content
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [then_and_now_vocabulary, imperfectum_te_de, imperfectum_number,
          old_neighbourhood_habits, childhood_reading, past_habits_dialogue]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit82.lesson01.listen.002
  lesson_content_key: nl.a2.unit82.lesson01.vroeger_en_nu
  type: listen_select
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: *broad_content
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is the word you heard.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit82.lesson01.translate.003
  lesson_content_key: nl.a2.unit82.lesson01.vroeger_en_nu
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *broad_content
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'The Dutch answer is {item}.', language_code: en, direction: ltr}

