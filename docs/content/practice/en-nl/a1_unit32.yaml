schema_version: "1.0"
pack_key: practice.en-nl.a1.unit32
source_language: en
target_language: nl
unit_content_key: nl.a1.unit32.sporten
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-09 by the practice-template depth-closing pass
    (same pass as a1_unit29-31.yaml -- see a1_unit29.yaml's review.notes
    for the full manifest-gap context). This file covers unit32 (sports
    and exercise). Extended scripts/backfill_lexemes_en_nl.py with 2 new
    semantic tags scoped to this unit's own real vocabulary (sport_noun:
    4-member voetbal/yoga/hardlopen/zwemmen -- hardlopen/zwemmen classified
    as NOUNS since every real use in this unit is as the object of aan/van
    (doen aan hardlopen, houden van zwemmen), the infinitive-as-gerund
    pattern Dutch uses after prepositions, matching how hardlopen is also
    used as a bare subject ('Hardlopen is niet scheidbaar') -- verified
    safe generatively in 'Ik doe aan {item}.'/'Ik houd van {item}.' via
    translation ONLY, matching this unit's own real realization file's
    review.notes, which explicitly avoided any bare Dutch fill_in_blank on
    this pool and even converted an original fill_in_blank draft to
    translation for the identical ambiguity reason on its 'keer' frame;
    sport_dicht_single: single-member tag for this unit's own real
    fill_in_blank, 'In het park, ___ bij mijn huis.' -> dicht). Also
    REUSES a1_unit29.yaml's already-classified freq_adverb tag
    (altijd/vaak/soms/nooit) against this unit's own real sentence 'Ik doe
    {item} aan voetbal.' (verified grammatical for all four: 'Ik doe
    altijd/vaak/soms/nooit aan voetbal.') -- safe course-wide reuse since
    both units are the SAME A1 course (AUTHORING_GUIDE.md #18's A1/A2
    course-boundary caveat does not apply here). Real, live bug caught and
    fixed while building this: a first draft of sport_noun casefolded the
    token match, which silently pulled in this unit's own capitalized
    subject-position 'Hardlopen' (from its lesson04 grammar note) as a
    case-duplicate 5th member -- fixed with an exact-case token check,
    same convention as a1_unit30.yaml/a1_unit31.yaml's identical catches
    earlier in this same pass. Every generative frame's literal text was
    checked against its own slot's candidate set for self-reference (none
    found). Real course-wide candidate counts verified with a standalone
    lexeme_matches()-replicating harness before writing these templates.
    15 templates across all 6 lessons: multiple_choice x2, listen_select
    x3, matching_pairs x1 (8-pair sport_noun+freq_adverb combined pool,
    same combined-slot-preset technique as a2_unit24's
    gemeente_noun_or_verb, anchored lesson05), fill_in_blank x1
    (single-candidate), word_order x3, translation x5. Needs the standard
    fresh-context review before import. Blocking dependency, same as every
    other en-nl pack: backfill_lexemes_en_nl.py has not actually been run
    against a real database yet.

    REAUTH 2026-07-24 (unit-scope DEAD/FLOOR fix pass, pack-only, no
    backfill/realization edits): this file's own notes already admit
    freq_adverb is entirely a REUSE of a1_unit29's altijd/vaak/soms/nooit --
    what that framing missed is generate_checkpoint() only loads THIS
    unit's own lexemes, and unit32 introduces ZERO freq_adverb-tagged
    tokens of its own. scripts/_practice_unit_scope_check.py confirmed all
    5 uses were DEAD: lesson02.translate.001/order.002/choose.003 (freq_adverb
    alone, 0 unit-scoped candidates), lesson06.order.002 (same), and
    lesson05.match.001's sport_or_freq union (0 contribution from
    freq_adverb -> only sport_noun's 4 tokens against an 8-slot need).
    Genuinely thin lesson: lesson02 ('hoe_vaak_sport_je') introduces no
    vocabulary of its own beyond the adjective 'specifieke' (a grammar-note
    word, not usable as a floor-clearing pool), and lesson06
    ('taalcafe_samen_sporten') only 'proberen'. Rather than drop these 4
    templates outright (recipe: only drop if the pack stays viable across
    ALL THREE tiers -- pre-fix the structured tier already had only 2 live
    templates against the recipe's >=3 floor, so a bare drop would have
    made it worse, not better), re-anchored all 4 to this unit's own
    sport_noun (4-member, already used elsewhere in this pack) while
    keeping each lesson's original 'frequency' framing alive as FIXED,
    non-tested literal text in the frame -- 'Ik doe vaak aan {item}.'
    (lesson02) / 'Ik doe altijd aan {item}.' (lesson06) -- vaak/altijd are
    review vocabulary from earlier A1 units, exactly like every other
    surrounding function word in this pack's frames (heb/een/heeft/etc.),
    never part of the tested slot's own candidate pool, so this is NOT the
    forbidden untaught-vocabulary-in-the-pool padding -- only the SLOT
    (sport_noun) is unit-native and generative. Checked self-reference:
    neither 'vaak' nor 'altijd' is a sport_noun candidate. lesson05.match.001
    also re-pooled: dropped the freq_adverb half of its union entirely and
    replaced sport_or_freq with a new `unit_content_word` preset
    (part_of_speech: [noun, adjective, adverb], no semantic tag -- SS3.1c,
    safe here since matching_pairs has no literal frame text to be
    ungrammatical against at any scope), which pools this unit's own 11
    distinct content words across all 6 lessons (voetbal/yoga/hardlopen/
    zwemmen/huis/specifieke/Beide/dicht/rustig/hard/bijna, all distinct
    english_gloss text, no collisions) against the template's 8 slots.
    Removed the now-unused freq_adverb and sport_or_freq tag_schema
    entries/presets. sport_dicht_single and sport_noun's other standalone
    uses (lesson01, lesson03, lesson04, lesson06.translate.001) are
    untouched and were already unit-scope-satisfiable. Template count
    unchanged at 14 (this file's own 2026-07-09 notes above say '15
    templates' but the actual templates: list has always had 14 -- a
    pre-existing off-by-one in the prose, not something this pass
    introduced); tier balance after fix: recognition 5 live (was 4),
    structured 5 live (was 2), production 4 live (was 3). Post-fix: 0 DEAD,
    0 FLOOR for this pack."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [sport_noun, sport_dicht_single]
slot_presets:
  sport_noun: &sport_noun {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: sport_noun}}
  sport_dicht_single: &sport_dicht_single {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: sport_dicht_single}}
  unit_content_word: &unit_content_word {language_code: nl, part_of_speech: [noun, adjective, adverb]}
templates:
  - content_key: practice.en-nl.nl.a1.unit32.lesson01.choose.001
    lesson_content_key: nl.a1.unit32.lesson01.sport_woorden
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *sport_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a sport from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit32.lesson01.listen.002
    lesson_content_key: nl.a1.unit32.lesson01.sport_woorden
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *sport_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit32.lesson01.translate.003
    lesson_content_key: nl.a1.unit32.lesson01.sport_woorden
    type: translation
    frame:
      text: "I do {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *sport_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Ik doe aan {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik doe aan {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit32.lesson01.order.004
    lesson_content_key: nl.a1.unit32.lesson01.sport_woorden
    type: word_order
    frame: {text: "Ik doe aan {item}.", language_code: nl, direction: ltr}
    slots: {item: *sport_noun}
    answer_derivation: {kind: render_frame, frame: {text: "Ik doe aan {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik doe aan {item}. -- I do {item}.", language_code: en, direction: ltr}
