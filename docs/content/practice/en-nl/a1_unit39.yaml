  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &post_word
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: post_vocab}
    second: *post_word
    third: *post_word
    fourth: *post_word
    fifth: *post_word
    sixth: *post_word
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr

