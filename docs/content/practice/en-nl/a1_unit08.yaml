schema_version: "1.0"
pack_key: practice.en-nl.a1.unit08
source_language: en
target_language: nl
unit_content_key: nl.a1.unit08.places
review:
  status: unreviewed
  required_next_reviewer: null
  fresh_context: "false"
  notes: >-
    Original authoring notes (2026-07-05): added a "place" tag (7 members,
    both lowercase and capitalized map-label variants) plus a narrower
    "place_non_station" tag (6 members, excludes "station") specifically to
    avoid a self-referential "The station is next to the station." bug in
    "De {item} is naast het station." Also added a 4-member "position" tag
    (naast/tegenover/achter/voor), verified interchangeable in this unit's
    own sentence shapes.

    Independent fresh-context content audit confirms the self-reference fix
    is correct (place_non_station genuinely excludes "station", and the
    "position" 4-way swap is grammatical in every instance: naast/
    tegenover/achter/voor all correctly mean "next to/opposite/behind/in
    front of" and every generated "De bibliotheek is {item} het station."/
    "Het ziekenhuis is {item} de bibliotheek." reading is sound Dutch). But
    found and fixed a SEPARATE real bug the authoring pass missed: lesson02.
    choose_place.003's frame "De {item} is naast het station." hardcoded the
    common-gender article "De" while slotting place_non_station, which
    includes TWO neuter (het-word) nouns -- "ziekenhuis" and "postkantoor"
    (confirmed against the unit's own realization content: "Het ziekenhuis
    is achter de bibliotheek.", "Waar is het postkantoor?"). Two of the six
    possible fillers therefore generated a genuine de/het gender-agreement
    error ("De ziekenhuis is naast het station."/"De postkantoor is naast
    het station."), the exact bug class this review was watching for. No
    tag in scripts/backfill_lexemes_en_nl.py distinguishes de-words from
    het-words (its own docstring/notes elsewhere in this pack acknowledge
    no per-noun gender data exists in this pipeline yet), so a
    gender-correct embedded fix isn't available within pack-YAML-only
    editing permissions. **Fix**: converted this one template to an
    isolated-word "{item}" / "Choose the English meaning." recognition
    check (matching the safe pattern already used by lesson01.choose.001
    and every other place_non_station usage in this pack) -- this still
    tests the identical vocabulary with zero article/gender risk. Re-
    verified with the standalone harness (unchanged candidate count, 6) and
    the compiler (0 errors/0 warnings, run together with units 01-07, 09).
    No self-reference, no capitalization leaks, no jargon leaks, no stray
    YAML booleans elsewhere in the pack.

    **Tier-polish, 2026-07-24 (wave 2, tier-thinness pass)**: production
    tier had only 2 live templates (lesson01.translate.003,
    lesson05.translate.002). Added lesson03.translate.004, a bare-word
    translation over the existing `position` tag (unit-scoped pool:
    naast/tegenover/achter = 3 distinct prepositions with unambiguous
    glosses; course scope adds only `voor`, harmless in a bare-word prompt
    that varies with the answer). Production tier now 3 live. Reset
    review.status reviewed -> unreviewed since this adds unreviewed content
    to a previously reviewed pack.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [place, place_non_station, position]
slot_presets:
  place: &place {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: place}}
  place_non_station: &place_non_station {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: place_non_station}}
  position: &position {language_code: nl, part_of_speech: preposition, agreement_tags: {semantic: position}}
templates:
  - content_key: practice.en-nl.nl.a1.unit08.lesson01.choose.001
    lesson_content_key: nl.a1.unit08.lesson01.plaatsen
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *place}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a place word from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit08.lesson01.listen.002
    lesson_content_key: nl.a1.unit08.lesson01.plaatsen
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *place}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the place word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit08.lesson01.translate.003
    lesson_content_key: nl.a1.unit08.lesson01.plaatsen
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *place}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit08.lesson02.order.001
    lesson_content_key: nl.a1.unit08.lesson02.naast_en_tegenover
    type: word_order
    frame: {text: "De bibliotheek is {item} het station.", language_code: nl, direction: ltr}
    slots: {item: *position}
    answer_derivation: {kind: render_frame, frame: {text: "De bibliotheek is {item} het station.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} says where the library is relative to the station.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit08.lesson02.choose_place.003
