schema_version: '1.0'
pack_key: practice.en-nl.a1.unit52
source_language: en
target_language: nl
unit_content_key: nl.a1.unit52.fiets_huren
review:
  status: unreviewed
  fresh_context: 'false'
  notes: Vocabulary unit (bike rental). Recognition/production templates union the unit's own lesson tags
    via fietshuren_vocab (8 distinct content tokens, unit-scoped) per lessons 01/02/03/05; lesson04 (bij_de_fietsenwinkel)
    introduces only the proper noun Daan, so its MC/translation templates are anchored there using the
    same union tag for lesson round-robin coverage but cannot host a lesson-own target lexeme (noted as
    a real gap, not padded with untaught vocab). word_order and fill_in_blank both anchor the single-candidate
    tag fietshuren_borg_single (borg, exactly 1 course-wide candidate, verified against backfill_lexemes_en_nl)
    using the realization's own hero sentences ('Ik betaal vijftig euro borg.' / 'Ik betaal de borg contant
    of met kaart.') so both are grammatical and course-scope safe. matching_pairs uses 6 of the 8 fietshuren_vocab
    tokens (huren, borg, breng, fietsenwinkel, huurprijs, elektrische), omitting huur/huurprijzen as close
    near-duplicates of huren/huurprijs to avoid confusable pairs. No listen_select for lesson04 (would
    duplicate lesson01/02/03/05 audio-availability profile; nl has TTS so this is a coverage choice, not
    a capacity block). Capacity/coverage measured with the official §9 script; see report.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - fietshuren_vocab
    - fietshuren_borg_single
