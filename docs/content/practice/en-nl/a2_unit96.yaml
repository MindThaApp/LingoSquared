schema_version: '1.0'
pack_key: practice.en-nl.a2.unit96
source_language: en
target_language: nl
unit_content_key: nl.a2.unit96.weet_u_waar
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 95-101 pass): 0 fixes. Dumped the unit-scope
    pool (13 lexemes in lessons 01, 02, 04, 05) and the course-scope pool of the union slot
    (68 lexemes) and read every gloss; the unit's own glosses match what the unit teaches.
    Capacity: 13 live templates, 10/13 lexemes hosted (Wie, pardon and Pardon are excluded
    by part of speech), 4/4 lessons in every tier, no dead or under-floor template. Word-order
    frame Gaat u {item}? has the same 3 candidates at unit and course scope (rechtdoor, links,
    rechts), all grammatical and none a literal frame word. Course-scope note for the backfill
    lane: the union pool holds case pairs with one gloss (Weet/weet, Hoe/hoe, Waar/waar, Wanneer/wanneer,
    Morgen/morgen, Kunt/kunt, Kun/kun); multiple-choice distractors are case-folded at runtime,
    but an Endless Practice matching item could show two near-identical cards. Course-scope
    dicht carries "close; near" (unit 82 sense) while this unit teaches dicht = closed; it
    is not a unit-scope lexeme here. Authored for the lessons of A2 unit 96 that have backfilled
    lexemes (grammar-led unit). Recognition, matching and bare-word production use a unit-wide
    union of the unit lesson semantic tags over content words (noun, verb, adjective, adverb,
    preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course scope.
    Pronouns, proper nouns, particles and phrases are left out. Excluded pronoun Wie and phrase
    pardon/Pardon. Word-order frame Gaat u {item}? draws on direction_word_pure (links, rechts,
    rechtdoor), all grammatical in the frame. Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - indirect_question_waar
    - indirect_question_wanneer_hoe_laat
    - polite_indirect_request
    - indirect_question_message_reading
    - direction_word_pure
templates:
- content_key: practice.en-nl.nl.a2.unit96.lesson01.choose.001
  lesson_content_key: nl.a2.unit96.lesson01.weet_u_waar
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [indirect_question_waar, indirect_question_wanneer_hoe_laat, polite_indirect_request, indirect_question_message_reading]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit96.lesson01.match.002
  lesson_content_key: nl.a2.unit96.lesson01.weet_u_waar
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit96.lesson01.translate.003
  lesson_content_key: nl.a2.unit96.lesson01.weet_u_waar
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit96.lesson02.listen.001
  lesson_content_key: nl.a2.unit96.lesson02.wanneer_en_hoe_laat
  type: listen_select
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the meaning of the Dutch word you heard.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit96.lesson02.match.002
  lesson_content_key: nl.a2.unit96.lesson02.wanneer_en_hoe_laat
  type: matching_pairs
  frame: *match_frame
  slots: *match_slots
  slot_relations: *match_relations
  answer_derivation: *match_answer
  feedback_frame: *match_feedback
- content_key: practice.en-nl.nl.a2.unit96.lesson02.translate.003
  lesson_content_key: nl.a2.unit96.lesson02.wanneer_en_hoe_laat
  type: translation
  frame: *translation_frame
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: *translation_feedback

