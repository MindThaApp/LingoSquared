schema_version: '1.0'
pack_key: practice.en-nl.a1.unit46
source_language: en
target_language: nl
unit_content_key: nl.a1.unit46.afspraak
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-12 as an additive Endless Practice coverage backfill for en-nl A1 unit 46. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.

    REAUTH 2026-07-24: lesson01.translate.003's slot was tagged
    `appointment_scheduling`. That tag's real course-wide members (wil,
    graag, afspraak, maken) were all FIRST introduced in earlier units
    (a1.unit02/unit06/unit09/unit11/unit13/unit19) -- unit46's lesson01
    ("afspraak_maken") reintroduces the same tokens in a new lesson but the
    backfill classifier only registers a token's first-ever introduction, so
    unit46 itself has ZERO lexemes carrying that tag (0 unit-scoped
    candidates, confirmed dead). unit46's OWN native lexeme pool is only 8
    tokens (beschikbaar/Woensdag/computerhulp/Voor/Waarvoor/bevestigd/
    Bevestiging/herinneren, spread across lesson02/03/05/06 -- lesson01 has
    no own backfilled lexemes at all). Fixed by dropping the semantic
    constraint entirely on translate.003 (matches the pattern already used
    by this pack's own choose.001 and match.002, which are untagged and pull
    from the unit's full 8-lexeme pool -- safe for bare-word translation
    per PRACTICE_PACK_RECIPE.md §3.1(c)/§6.6(a): prompt varies with the
    answer, no literal frame text). Also widened lesson01.match.002 and its
    volume_match.007 duplicate from 4 to 6 pairs (AUTHORING_GUIDE §16 floor)
    using the same untagged 8-lexeme pool -- verified 8 distinct glosses
    (available/Wednesday/computer help/for/for what;what for/confirmed/
    Confirmation/to remind), comfortably clears 6. Removed the now-unused
    `appointment_scheduling` tag from tag_schema. Verified 0 DEAD, 0
    below-floor via scripts/_practice_unit_scope_check.py after the fix.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
slot_presets:
  unit_word:
    language_code: nl
    part_of_speech:
    - symbol
    - noun
    - proper_noun
    - pronoun
    - verb
    - adjective
    - adverb
    - preposition
    - particle
    - phrase
templates:
- content_key: practice.en-nl.nl.a1.unit46.lesson01.choose.001
  lesson_content_key: nl.a1.unit46.lesson01.afspraak_maken
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech:
      - symbol
      - noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Choose the English meaning of {item}.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a1.unit46.lesson01.match.002
  lesson_content_key: nl.a1.unit46.lesson01.afspraak_maken
  type: matching_pairs
  frame:
    text: '{first} — {second} — {third} — {fourth} — {fifth} — {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &unit46_match_word
      language_code: nl
      part_of_speech:
      - symbol
      - noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
    second: *unit46_match_word
    third: *unit46_match_word
    fourth: *unit46_match_word
    fifth: *unit46_match_word
    sixth: *unit46_match_word
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a1.unit46.lesson01.translate.003
  lesson_content_key: nl.a1.unit46.lesson01.afspraak_maken
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: nl
      part_of_speech:
      - symbol
      - noun
      - pronoun
      - verb
      - adjective
      - adverb
      - preposition
      - particle
      - phrase
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Translate into the target language.
    language_code: en
    direction: ltr
