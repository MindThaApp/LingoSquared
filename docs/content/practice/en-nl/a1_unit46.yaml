schema_version: '1.0'
pack_key: practice.en-nl.a1.unit46
source_language: en
target_language: nl
unit_content_key: nl.a1.unit46.afspraak
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-24 (en-nl practice pass, session 10): 5 fixes -- lesson01.choose.001 and
    lesson01.translate.003 untagged -> unit tag union; lesson02.choose feedback made neutral;
    lesson02.order.002 feedback showed Dutch token inside English -> 'I am available on Wednesday.';
    authoring text removed (volume_match.007). Native flags: lexeme parts of speech for
    bevestigd/Waarvoor (listed as nouns) and capitalised Voor/Woensdag/Bevestiging.

    Authored 2026-07-12 as an additive Endless Practice coverage backfill for en-nl A1 unit 46. Uses the established
    broad bare-word recognition, matching_pairs, and translation shapes only; no new frame-specific grammar assumptions.

    REAUTH 2026-07-24: lesson01.translate.003's slot was tagged
    `appointment_scheduling`. That tag's real course-wide members (wil,
    graag, afspraak, maken) were all FIRST introduced in earlier units
    (a1.unit02/unit06/unit09/unit11/unit13/unit19) -- unit46's lesson01
    ("afspraak_maken") reintroduces the same tokens in a new lesson but the
    backfill classifier only registers a token's first-ever introduction, so
    unit46 itself has ZERO lexemes carrying that tag (0 unit-scoped
    candidates, confirmed dead). unit46's OWN native lexeme pool is only 8
    tokens (beschikbaar/Woensdag/computerhulp/Voor/Waarvoor/bevestigd/
    Bevestiging/herinneren, spread across lesson02/03/05/06 -- lesson01 has
    no own backfilled lexemes at all). Fixed by dropping the semantic
    constraint entirely on translate.003 (matches the pattern already used
    by this pack's own choose.001 and match.002, which are untagged and pull
    from the unit's full 8-lexeme pool -- safe for bare-word translation
    per PRACTICE_PACK_RECIPE.md §3.1(c)/§6.6(a): prompt varies with the
    answer, no literal frame text). Also widened lesson01.match.002 and its
    volume_match.007 duplicate from 4 to 6 pairs (AUTHORING_GUIDE §16 floor)
    using the same untagged 8-lexeme pool -- verified 8 distinct glosses
    (available/Wednesday/computer help/for/for what;what for/confirmed/
    Confirmation/to remind), comfortably clears 6. Removed the now-unused
    `appointment_scheduling` tag from tag_schema. Verified 0 DEAD, 0
    below-floor via scripts/_practice_unit_scope_check.py after the fix.

    POLISH 2026-07-24 (tier-thinness + POS-only matching_pairs pass):
    (1) lesson01.match.002 and volume_match.007 kept the REAUTH's untagged
    constraint, which is unit-safe but pools 1000+ course-wide content
    words at Endless-Practice COURSE scope (off-theme pairs). Re-tagged
    both with a semantic union [appointment_time_availability,
    appointment_purpose, appointment_wrapup_dialogue] (part_of_speech
    noun/adjective/preposition): exactly 6 distinct unit-scope tokens/
    glosses (beschikbaar/Woensdag/computerhulp/Voor/Waarvoor/bevestigd).
    confirmation_reading was deliberately left OUT of the union: at course
    scope it carries unit03's 'woensdag' (identical 'Wednesday' gloss --
    duplicate card next to this unit's 'Woensdag') and unit49's
    'bevestiging' ('the confirmation', near-duplicate of 'Bevestiging').
    Verb POS was left out to keep course-wide is/Is ('is'/'is') out.
    Course extras are appointment-themed (tien/uur/om/afspraak/goed/Mooi/
    Dank/fijn); the goed/Mooi/fijn gloss proximity ('good'/'nice; good'/
    'nice') is a known residual, only visible if two of them are sampled
    into one course-scope instance. The two templates keep identical pools
    distinguished by text_block, per this file's own REAUTH precedent.
    (2) Tiers were 1 recognition / 2 structured / 1 production; brought all
    three to 3 live: recognition += lesson02.choose.001
    ([appointment_time_availability, appointment_purpose], 5 unit glosses)
    and lesson03.listen.001 (appointment_purpose, 3 unit glosses exactly at
    the MC floor -- computer help / for / for what;what for; bare-word
    frame so defect-1.22-safe); structured += lesson02.order.002 ('Ik ben
    woensdag {item}.' anchored on the single-member job_beschikbaar_single
    tag -- course-wide pool is exactly 'beschikbaar' (a1+a2 carry the same
    token), deterministic and grammatical; lowercase 'woensdag' in the
    frame is correct Dutch and is not a slot candidate, so no defect-1.14
    self-reference); production += lesson05.translate.001
    (confirmation_reading nouns, unit scope = computerhulp/bevestigd/
    Bevestiging -- the tag is safe in TRANSLATION even though it was
    excluded from the matching union, because a bare-word translation
    prompt always names the one exact gloss being asked for, so
    course-scope near-duplicates never collide inside one instance) and
    lesson06.translate.001 (appointment_wrapup_dialogue
    verb -> herinneren, single-member is fine for translation, no candidate
    floor). Lessons 01/04 have no own backfilled lexemes; lesson01 keeps
    only its original three untagged/broad templates.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - appointment_time_availability
    - appointment_purpose
    - appointment_wrapup_dialogue
    - confirmation_reading
    - job_beschikbaar_single
slot_presets:
  appointment_match_word: &u46_appointment_match_word
    language_code: nl
    part_of_speech: [noun, adjective, preposition]
    agreement_tags:
      semantic: [appointment_time_availability, appointment_purpose, appointment_wrapup_dialogue]
  appointment_choose_word: &u46_appointment_choose_word
    language_code: nl
    part_of_speech: [noun, adjective, preposition]
    agreement_tags:
      semantic: [appointment_time_availability, appointment_purpose]
  appointment_purpose_word: &u46_appointment_purpose_word
    language_code: nl
    part_of_speech: [noun, preposition]
    agreement_tags:
      semantic: [appointment_purpose]
  beschikbaar_single: &u46_beschikbaar_single
    language_code: nl
    part_of_speech: adjective
    agreement_tags:
      semantic: [job_beschikbaar_single]
  confirmation_noun: &u46_confirmation_noun
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: [confirmation_reading]
  appointment_wrapup_verb: &u46_appointment_wrapup_verb
    language_code: nl
    part_of_speech: verb
    agreement_tags:
      semantic: [appointment_wrapup_dialogue]
templates:
- content_key: practice.en-nl.nl.a1.unit46.lesson01.choose.001
  lesson_content_key: nl.a1.unit46.lesson01.afspraak_maken
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, adjective, preposition, verb]
      agreement_tags: {semantic: [appointment_time_availability, appointment_purpose, appointment_wrapup_dialogue, confirmation_reading]}
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Choose the English meaning of {item}.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a1.unit46.lesson01.match.002
  lesson_content_key: nl.a1.unit46.lesson01.afspraak_maken
  type: matching_pairs
  frame:
    text: '{first} — {second} — {third} — {fourth} — {fifth} — {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: *u46_appointment_match_word
    second: *u46_appointment_match_word
    third: *u46_appointment_match_word
    fourth: *u46_appointment_match_word
    fifth: *u46_appointment_match_word
    sixth: *u46_appointment_match_word
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a1.unit46.lesson01.translate.003
  lesson_content_key: nl.a1.unit46.lesson01.afspraak_maken
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, adjective, preposition, verb]
      agreement_tags: {semantic: [appointment_time_availability, appointment_purpose, appointment_wrapup_dialogue, confirmation_reading]}
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Translate into the target language.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a1.unit46.lesson01.match.002.volume_match.007
  lesson_content_key: nl.a1.unit46.lesson01.afspraak_maken
  type: matching_pairs
  frame:
