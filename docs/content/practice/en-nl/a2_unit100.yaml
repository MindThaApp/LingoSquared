schema_version: '1.0'
pack_key: practice.en-nl.a2.unit100
source_language: en
target_language: nl
unit_content_key: nl.a2.unit100.een_mooie_rode_jas
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 95-101 pass): 1 fix - verb was dropped
    from the shared slot's part_of_speech. That removes leer, which carries the backfill gloss
    "learn" while this unit teaches van leer = (made of) leather, and zit, whose gloss is
    about sitting and "is full" while the unit uses In de tas zit = is in; it also removes
    the case pair is/Is and the low-value forms heb, ben, zijn, heeft, Kun and helpen. Dumped
    the unit-scope pool (101 lexemes in all 6 lessons) and the course-scope pool (109 after
    the fix) and read every gloss. Backfill gloss notes, kept in the pool: Haar (lesson04
    "Haar grote tas" = her) is classified as a noun glossed "Hair"; zacht carries "soft (in
    the idiom 'to put it mildly')" while the unit teaches het bed is zacht; In is a capitalized
    sentence-position form glossed "In". All frames are bare-word, so no frame-grammar or
    self-reference risk. Capacity after the fix: 18 live templates, 62/101 lexemes hosted
    (61%), 6/6 lessons in every tier, no dead or under-floor template. Authored for the lessons
    of A2 unit 100 that have backfilled lexemes (grammar-led unit). Recognition, matching
    and bare-word production use a unit-wide union of the unit lesson semantic tags over content
    words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the
    3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases
    are left out.  Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - clothes_colours_vocabulary
    - adjective_e_definite
    - adjective_e_indefinite
    - adjective_material_description
    - busy_morning_reading
    - lost_coat_dialogue
templates:
- content_key: practice.en-nl.nl.a2.unit100.lesson01.choose.001
  lesson_content_key: nl.a2.unit100.lesson01.kleren_en_kleuren
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, adjective, adverb, preposition]
      agreement_tags:
        semantic: [clothes_colours_vocabulary, adjective_e_definite, adjective_e_indefinite, adjective_material_description, busy_morning_reading, lost_coat_dialogue]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit100.lesson01.match.002
  lesson_content_key: nl.a2.unit100.lesson01.kleren_en_kleuren
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit100.lesson01.translate.003
  lesson_content_key: nl.a2.unit100.lesson01.kleren_en_kleuren
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

