schema_version: "1.0"
pack_key: practice.en-nl.a1.unit05
source_language: en
target_language: nl
unit_content_key: nl.a1.unit05.family
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "true"
  notes: >-
    Review 2026-10-24 (en-nl practice pass, session 10): 1 fix -- possessive
    translation prompt reworded ("This is ___ brother."). Native flags: kind
    glossed "the child" (backfill).

    Original authoring notes (2026-07-05, this Claude session's own
    practice-pool-sync pass): built with the same recognition/structured/
    production type variety as the reviewed en-nl unit01/unit04 packs,
    keyed to lexemes added to scripts/backfill_lexemes_en_nl.py for nl
    realization units 5-6. Deliberately does NOT use "zijn" (his) as a
    generation slot value anywhere, since the backfill script's bare-token
    classifier already committed "zijn" to the verb "are" from units 1-4 (a
    genuine homograph collision) -- baked as literal frame text in every
    lesson04 template instead.

    Independent fresh-context content audit completed separately (zero
    access to the paragraph above during the actual review pass). Every
    lesson_content_key matches a real nl.a1.unit05 realization lesson (all 6
    confirmed). Standalone lexeme_matches()-replicating harness confirms
    candidate counts: family_singular=9, sibling=2, extended_only=4,
    possessive_flexible=3, person_name=7, place_name=7 (all above the >=1
    bar for these non-recognition types; extended_only's listen/match uses
    also clear the >=4 recognition bar). Hand-checked every filler: "Ik heb
    een {item}." is grammatical for every sibling/extended_only noun
    regardless of Dutch gender (indefinite "een" doesn't inflect for
    de/het). Confirmed the capitalized "Mijn" (sentence-initial, from units
    2-4) is correctly excluded from possessive_flexible via the backfill
    script's exact-case check, so "Dit is {item} broer." never renders a
    mid-sentence capitalization error -- verified this exclusion holds by
    checking the harness's actual token list (mijn/je/jouw only, no "Mijn").
    "Dit is zijn {item}."/"Dat is haar {item}." are grammatical for all 9
    family_singular nouns. place_name (Nederland/België/Duitsland/Egypte/
    Rotterdam/Utrecht/Amsterdam) is safe in "Mijn ouders wonen in {item}."
    for both countries and cities. No self-reference, no capitalization
    leaks, no jargon leaks, no stray YAML booleans. The blocking DB-level
    dependency noted above (no real backfill_lexemes_en_nl.py run yet, admin
    import not yet exercised for units 5+) is a deployment/CODE-lane
    prerequisite, not a content defect, and doesn't block a content review
    verdict. Compiler validation re-run together with units 01-04, 06-09: 0
    errors/0 warnings.

    **Follow-up fix, 2026-07-06 (real user report, same bug class found in
    en-nl unit01's je/jij)**: lesson03.complete.002's possessive_flexible
    slot (mijn/je/jouw) in "Dit is {item} broer." has no context anywhere
    in the frame to say whose brother is meant, so all three fillers are
    equally valid Dutch and only one was ever marked correct. Fixed via
    the new `interchangeable: true` answer_derivation flag (AUTHORING_
    GUIDE.md#17) -- any of this slot's own matching candidates now grades
    correct.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [family_member, family_singular, sibling, extended_only, extended_family_member, possessive_pronoun, possessive_flexible, family_profile, family_dialogue, person_name, place_name, city_name, country]
    register: [informal, polite]
slot_presets:
  family_singular: &family_singular {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: family_singular}}
  sibling: &sibling {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: sibling}}
  extended_only: &extended_only {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: extended_only}}
  possessive_flexible: &possessive_flexible {language_code: nl, part_of_speech: pronoun, agreement_tags: {semantic: possessive_flexible}}
  person_name: &person_name {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: person_name}}
  place_name: &place_name {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: place_name}}
  city_name: &city_name {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: city_name}}
templates:
  - content_key: practice.en-nl.nl.a1.unit05.lesson01.choose.001
    lesson_content_key: nl.a1.unit05.lesson01.direct_family
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *family_singular}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a family word from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson01.order.002
    lesson_content_key: nl.a1.unit05.lesson01.direct_family
    type: word_order
    frame: {text: "Ik heb een {item}.", language_code: nl, direction: ltr}
    slots: {item: *sibling}
    answer_derivation: {kind: render_frame, frame: {text: "Ik heb een {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} completes 'I have a ...' for this sibling.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson01.translate.003
    lesson_content_key: nl.a1.unit05.lesson01.direct_family
    type: translation
    frame:
      text: "I have a {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *sibling}
    answer_derivation: {kind: render_frame, frame: {text: "Ik heb een {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik heb een {item} -- I have a {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson02.listen.001
    lesson_content_key: nl.a1.unit05.lesson02.extended_family
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *extended_only}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the extended-family word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson02.order.002
    lesson_content_key: nl.a1.unit05.lesson02.extended_family
    type: word_order
    frame: {text: "Ik heb een {item}.", language_code: nl, direction: ltr}
    slots: {item: *extended_only}
    answer_derivation: {kind: render_frame, frame: {text: "Ik heb een {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} completes 'I have a(n) ...' for this relative.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson02.match.003
    lesson_content_key: nl.a1.unit05.lesson02.extended_family
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth}", language_code: nl, direction: ltr}
    slots: {first: *extended_only, second: *extended_only, third: *extended_only, fourth: *extended_only}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "Match each extended-family word with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson03.order.001
    lesson_content_key: nl.a1.unit05.lesson03.mijn_je
    type: word_order
    frame: {text: "Dit is {item} broer.", language_code: nl, direction: ltr}
    slots: {item: *possessive_flexible}
    answer_derivation: {kind: render_frame, frame: {text: "Dit is {item} broer.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} can introduce whose brother this is.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson03.complete.002
    lesson_content_key: nl.a1.unit05.lesson03.mijn_je
    type: fill_in_blank
    frame:
      text: "Dit is {item} broer."
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Complete the Dutch sentence.", language_code: en, direction: ltr}
    slots: {item: *possessive_flexible}
    # interchangeable: true -- found live 2026-07-06 alongside the same-class
    # en-nl unit01 je/jij bug (AUTHORING_GUIDE.md#17): "Dit is ___ broer."
    # gives no way to tell whose brother is meant, so mijn/je/jouw (my/your/
    # your-emphatic) are all equally valid completions here -- fittingly,
    # this preset was already named "possessive_flexible" by its own author.
    answer_derivation: {kind: slot_text, slot: item, interchangeable: true}
    feedback_frame: {text: "{item} can introduce whose brother this is.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson03.translate.003
    lesson_content_key: nl.a1.unit05.lesson03.mijn_je
    type: translation
    frame:
      text: "Translate using {item}: This is ___ brother."
      language_code: en
      direction: ltr
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *possessive_flexible}
    answer_derivation: {kind: render_frame, frame: {text: "Dit is {item} broer.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Dit is {item} broer uses the possessive form you were asked for.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson04.order.001
    lesson_content_key: nl.a1.unit05.lesson04.zijn_haar
    type: word_order
    frame: {text: "Dit is zijn {item}.", language_code: nl, direction: ltr}
    slots: {item: *family_singular}
    answer_derivation: {kind: render_frame, frame: {text: "Dit is zijn {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Zijn shows the family member belongs to a male person.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson04.translate.003
    lesson_content_key: nl.a1.unit05.lesson04.zijn_haar
    type: translation
    frame:
      text: "That is her {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *family_singular}
    answer_derivation: {kind: render_frame, frame: {text: "Dat is haar {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Dat is haar {item} -- that is her {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson05.order.001
    lesson_content_key: nl.a1.unit05.lesson05.lotte_profiel
    type: word_order
    frame: {text: "Ik heet {item}.", language_code: nl, direction: ltr}
    slots: {item: *person_name}
    answer_derivation: {kind: render_frame, frame: {text: "Ik heet {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the name given.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson05.translate.003
    lesson_content_key: nl.a1.unit05.lesson05.lotte_profiel
    type: translation
    frame:
      text: "My name is {item}."
      language_code: en
      direction: ltr
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *person_name}
    answer_derivation: {kind: render_frame, frame: {text: "Ik heet {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik heet {item} -- my name is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson06.listen.001
    lesson_content_key: nl.a1.unit05.lesson06.taalcafe_familie_dialoog
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *place_name}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the place named in the dialogue.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson06.order.002
    lesson_content_key: nl.a1.unit05.lesson06.taalcafe_familie_dialoog
    type: word_order
    frame: {text: "Mijn ouders wonen in {item}.", language_code: nl, direction: ltr}
    slots: {item: *place_name}
    answer_derivation: {kind: render_frame, frame: {text: "Mijn ouders wonen in {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} completes where the parents live.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit05.lesson06.translate.003
    lesson_content_key: nl.a1.unit05.lesson06.taalcafe_familie_dialoog
    type: translation
    frame:
      text: "My parents live in {item}."
      language_code: en
      direction: ltr
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *city_name}
    answer_derivation: {kind: render_frame, frame: {text: "Mijn ouders wonen in {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Mijn ouders wonen in {item} -- my parents live in {item}.", language_code: en, direction: ltr}
