schema_version: '1.0'
pack_key: practice.en-nl.a2.unit102
source_language: en
target_language: nl
unit_content_key: nl.a2.unit102.nog_niet_geen_meer
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 102-108 pass): 0 fixes. Dumped the unit-scope
    pool (49 of 58 unit lexemes hostable) and the A2 course-scope pool (72) of the single union slot
    and read every gloss. All 18 templates are bare-word (multiple_choice, listen_select,
    matching_pairs, translation), so frame grammaticality and self-reference do not arise. Capacity:
    6/6 lessons in every tier, 84% coverage per tier, no dead templates, every MC and listen pool
    well over 3 glosses and every matching pool over 6 tokens. Backfill gloss issues routed for a
    fix (not editable here): boeking "the booking; reservation" overlaps reservering "the
    reservation", so a multiple-choice item for reservering can show the boeking gloss as a second
    right-looking option; toch carries "still; nevertheless" while this unit teaches the tag
    question "..., toch?" (right?). Kept in the pool because excluding them would drop every
    lesson01 noun or every adverb from the unit. Authored for the lessons of A2 unit 102 that have
    backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a
    unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective,
    adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course
    scope. Pronouns, proper nouns, particles and phrases are left out.  Native speaker should
    confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - negation_niet_geen_intro
    - niet_position
    - niet_vs_geen
    - nog_niet_nog_geen
    - niet_meer_geen_meer
    - negation_room_dialogue
templates:
- content_key: practice.en-nl.nl.a2.unit102.lesson01.choose.001
  lesson_content_key: nl.a2.unit102.lesson01.niet_en_geen
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [negation_niet_geen_intro, niet_position, niet_vs_geen, nog_niet_nog_geen, niet_meer_geen_meer, negation_room_dialogue]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit102.lesson01.match.002
  lesson_content_key: nl.a2.unit102.lesson01.niet_en_geen
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit102.lesson01.translate.003
  lesson_content_key: nl.a2.unit102.lesson01.niet_en_geen
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit102.lesson02.listen.001
  lesson_content_key: nl.a2.unit102.lesson02.plaats_van_niet
