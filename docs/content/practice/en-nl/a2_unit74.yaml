review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-07-11, first Endless Practice pack for any of the four new Dutch A2 units 74-77 (travel disruption,
    screen time, weekly schedule, shopping complaint/returns) -- these units had zero practice templates before this pass
    despite being reviewed lesson content, a real gap against the ≥10hr practice-depth publish-gate bar. This file covers
    unit74 (reisvertraging: reporting a train delay, a cancelled connection due to a signal failure, missing a connection,
    and asking the NS service desk for an alternative route).

    scripts/backfill_lexemes_en_nl.py already had broad recognition-only tags for this unit from its 2026-07-11 UNIT_FILES_A2
    extension (travel_disruption_vocab: 8 nouns -- seinstoring/aansluiting/ servicebalie/verbinding/intercity/mededeling/reisplanner/spoor;
    travel_disruption_verb: 5 verbs -- rijden/omreizen/adviseren/ raadplegen/weten), deliberately left without finer per-lesson
    tags per that pass''s own docstring note (''add them alongside that future practice-template pass''). This pass adds exactly
    that: 5 new single-member *_single tags (reisvertraging_vertraging_single/ _seinstoring_single/_aansluiting_single/_verbinding_single/
    _spoor_single) anchoring each lesson''s hero full sentence for word_order/translation/fill_in_blank via render_frame/slot_text
    -- single-member by construction, so no AUTHORING_GUIDE.md #17 candidate-pool ambiguity judgment call is needed (only
    one candidate exists, full stop). The two pre-existing broad tags are reused as-is, unchanged, for every bare-word multiple_choice/listen_select/
    matching_pairs template below (each has 5-8 members, comfortably above the 3-candidate MC/listen_select floor and the
    matching_pairs slot count used here).

    14 templates across all 6 lessons: multiple_choice x2, listen_select x4, matching_pairs x2 (5-pair travel_disruption_vocab
    pool in lesson03, 4-pair travel_disruption_verb pool in lesson05), word_order x4, fill_in_blank x1, translation x2. fill_in_blank''s
    single slot (seinstoring_single) has exactly 1 course-wide candidate, verified by construction (the tag has one member)
    -- also spot- checked by re-running scripts/_fill_in_blank_ambiguity_check.py after adding the PACKS entry for this file,
    0 flagged. All other templates use exercise types with no candidate-floor requirement (word_order/translation, single-member
    tags) or a comfortably-sized pool (MC/listen_select/matching_pairs). scripts/_practice_slot_check.py also re-run against
    the updated backfill script output to confirm every slot''s real candidate count. Needs the standard fresh-context review
    before import. Same blocking dependency as every other en-nl pack: backfill_lexemes_en_nl.py has not actually been run
    against a real database yet (only --dry-run, which succeeds: 1870 nl lexemes parsed with 0 KeyError after this pass''s
    additions).'
