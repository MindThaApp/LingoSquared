review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md, as part of the en-nl B1 unit01-11
    practice-pack wave that unblocks these units'' checkpoints (the units already had lexemes from scripts/backfill_lexemes_en_nl.py
    but no pack at all, so generate_checkpoint() returned checkpoint_unavailable). 22 templates across
    6 lesson(s) with lexemes: listen_select x1, matching_pairs x4, multiple_choice x5, translation x7,
    word_order x5. Every slot is satisfiable from THIS unit''s own lexemes, because generate_checkpoint()
    calls _material() with only this unit''s lesson ids; slots use the unit''s own per-lesson semantic
    tags (unioned where a single lesson tag could not reach the >=3-option multiple_choice floor or the
    6-token matching_pairs floor), narrowed by part_of_speech to content words so no exercise ever shows
    ''the'' or ''and'' as its answer. Measured with the recipe''s capacity/coverage model against the
    real backfill data: 51 of 79 unit lexemes hostable (65%), recognition 65% / structured 62% / production
    65%, and all three tiers reach 6/6 of the lessons that have lexemes. Distinct-target capacity: recognition
    95, production 53, structured effectively unbounded (matching_pairs combinatorics). 12 of 22 templates
    carry >=5 variants. REVIEWER: The lesson06 matching_pairs deliberately pools the whole unit (48 unit-scoped
    content words) so the structured tier reaches every lesson; check that werk / werkt / werken and zou
    / zouden and jaar / jaren read as distinguishable pairs. Slot constraints deliberately EXCLUDE the
    tag unreal_conditional_als from every gloss-showing template except the lesson03 ones, because the
    backfill glosses ''was'' as ''do the dishes (with ik)'' - a homograph collision (defect 1.29) that
    would be shown as the correct answer. lesson02''s word_order anchors on semantic: relative_clause_dat
    (POS noun -> ''huis'', the only B1 noun with that tag) purely as a single-member anchor; if a noun
    is ever added to that tag the frame must be re-checked. General double-checks for this wave: (a) every
    word_order/fill_in_blank frame was verified against its slot''s whole-B1-course candidate pool, not
    just the unit pool, so Endless Practice cannot render an ungrammatical sentence; (b) no frame''s literal
    text contains any of its own slot''s candidate values (defect 1.14); (c) listen_select frames are
    bare ''{item}'' so no distractor can be a word the audio itself says (defect 1.22); (d) matching_pairs
    pools were read by hand for interchangeable English glosses. Needs the standard fresh-context review
    before import.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): all 22 templates checked against their unit- and course-scoped (B1) pools from the current backfill data, every pool gloss read against the b1_unit01 realization; word_order and fixed-sentence frames re-read at course scope (lesson04.order.002 also renders ''Ik zou meteen stoppen met eten.'', grammatical); self-reference, listen_select distractors, matching_pairs confusables (zou/zouden, werk/werkt/werken, jaar/jaren, reizen/rondreizen are all gloss-distinguished), YAML booleans and jargon checked. 0 defects found in this pack. The backfill now glosses was as ''was; were (past tense of zijn)'', so the exclusion of unreal_conditional_als verbs is no longer required (harmless). Deferred to the backfill lane: goede (unit07) and belangrijke (unit10) are inflected forms glossed bare ''good''/''important''; at course scope they enter lesson06.translate.003 via b1_unit_review, where a learner typing goed/belangrijk only gets ''almost''.'
