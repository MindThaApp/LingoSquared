schema_version: "1.0"
pack_key: practice.en-nl.a1.unit12
source_language: en
target_language: nl
unit_content_key: nl.a1.unit12.past_events
review:
  status: reviewed
  required_next_reviewer: native_speaker_pass
  fresh_context: "false"
  notes: >-
    Original authoring notes (2026-07-06): hebben/zijn auxiliary choice is a
    hard constraint on tag design -- "Ik heb gegaan" is ungrammatical
    (gaan/komen take zijn) -- so participle_hebben (gedronken/gegeten/
    gewerkt/gekocht) and participle_zijn (gegaan/gekomen, only 2 members)
    are kept strictly separate, matching the real content's own explicit
    contrast lesson (met_zijn's auxiliary_contrast note). Deliberately no
    generative "Ik heb {participle}." frame even for the hebben group,
    since 3 of 4 participles need an object to sound natural -- bare-word
    recognition/translation only throughout.

    Independent fresh-context content audit (2026-07-06): confirmed all 6
    lesson_content_key references match real nl.a1.unit12 lessons exactly,
    including nl.a1.unit12.lesson03.teach.auxiliary_contrast, which does
    genuinely read "Ik heb gewerkt, maar ik ben naar de supermarkt
    gegaan." -- the auxiliary-split design claim is real, not just
    asserted. Standalone lexeme_matches()-replicating harness confirms:
    participle_hebben=4, infinitive_hebben=4, participle_zijn=2,
    recent_time=4 (2 lexical forms + 2 capitalized sentence-initial
    variants, translation-only so this is harmless). Audited every
    template (12 total): NO template ever combines a hebben-group and
    zijn-group verb in the same slot or the same matching_pairs pair set,
    and NO template builds a full "Ik heb/ben {participle}." sentence at
    all (every frame is a bare "{item}" recognition/translation or a
    matching_pairs pair of same-group verbs) -- so the "Ik heb gegaan"
    failure mode this pack was explicitly designed to avoid cannot occur
    with the templates as authored. No self-reference, no capitalization
    leaks, no jargon leaks, no stray YAML booleans. Compiler validation
    re-run together with units 01-13: 0 errors/0 warnings.

    Flagging transparently (not this pass's to resolve): this unit's own
    underlying overlay (docs/content/overlays/en-nl/a1_unit12.yaml) is
    still review.status: unreviewed itself, same as unit13's. This
    practice pack's correctness is independent of that -- the templates
    generate grammatically sound Dutch regardless -- but if the underlying
    lesson content changes during its own future review pass, this pack's
    lesson_content_key references and vocabulary should be re-diffed
    against it.

    **Fixed 2026-07-07 (Dutch live-QA pass)**: the 2026-07-06 audit's "all 6
    lesson_content_key references match real lessons" check confirmed the
    keys EXIST but missed that lesson06 (`lotte_en_omar_gisteren`)
    introduces ZERO new lexemes (every token in its dialogue -- Lotte/
    Wat/heb/je/gisteren/gedaan/Omar/Ik/gewerkt/Daarna/ben/naar/de/
    supermarkt/gegaan/appels/gekocht/etc. -- was already taught by lessons
    01-05), so no Lexeme row is ever created with that lesson as
    provenance and `_practice_lesson_id()` could never resolve it --
    confirmed via `scripts/backfill_lexemes_en_nl.py`'s own classification
    (the key never appears as any spec's `lesson_content_key`). Same root
    cause/fix pattern as the fa-en unit23 `what_do_you_do` fix from earlier
    this session. Repointed `listen.001` (participle_hebben tag) to
    `lesson05.een_kort_verslag_lezen`, the closest earlier lesson already
    proven to resolve for the same tag (used by that lesson's own template
    above) -- a safe, no-forward-reference anchor.

    2026-07-24 tier-thinness polish pass (structured tier had only 1 live
    template): (a) widened lesson01.match.003 from 4 slots over
    participle_hebben to the standard 6 slots over the participle_hebben +
    participle_zijn union (6 distinct tokens / 6 distinct glosses at unit
    scope, zero course-scope extras). This deliberately relaxes the
    original "never combine hebben-group and zijn-group in one
    matching_pairs pair set" audit claim: that rule exists to prevent
    ungrammatical GENERATIVE sentences (*Ik heb gegaan), and matching
    bare participles to glosses builds no sentence, so the failure mode
    cannot occur here. (b) added lesson03.order.003 "Ik ben naar de
    supermarkt {item}." (participle_zijn; both members grammatical,
    course pool == unit pool) and lesson05.order.002 "Ik heb veel
    {item}." (participle_hebben; veel makes all four participles natural
    without an object -- the reason the original pass authored no bare
    "Ik heb {item}." frame -- and the capitalized Ik tile pins a unique
    word order). Deliberately did NOT author a recent_time word_order:
    with those adverbs both "Gisteren heb ik gewerkt" and "Ik heb
    gisteren gewerkt" are valid orders, so any such frame mis-grades a
    correct learner.

    Fresh-context review 2026-10-11 (content-reviewer.md checklist):
    checked every template against the unit12 realization/overlay, real
    lexeme pools at unit and course scope (participle_hebben 4,
    participle_zijn 2, participle_all 6 distinct glosses, recent_time 4,
    infinitive_hebben 1 at unit scope / 4 at course scope), frame
    vocabulary, distractor correctness, feedback truthfulness, YAML
    booleans and jargon. Fixes: lesson05.order.002 REMOVED (frame "Ik
    heb veel {item}." used veel, which is not taught anywhere in A1
    units 01-13; no taught adverb makes all four hebben participles
    natural without an object, so no replacement frame was authored).
    lesson03.translate.001 instruction "Translate into Dutch." ->
    "Translate into Dutch (past participle)." (gloss "went; gone"/"came;
    come" would otherwise invite ging, glossed "went" in unit22, which
    the template marks wrong). lesson03.reverse_translate.002 and
    lesson04.reverse_translate.002 DELETED as exact duplicates of
    lesson03.translate.001 / lesson04.translate.001 (same type, slot and
    en-to-nl direction). lesson06.listen.001 feedback "{item} is the
    participle you heard in this dialogue." -> "{item} is the participle
    you heard." (audio is a single word; template is anchored to the
    lesson05 reading). NATIVE FLAGS (not counted as defects):
    lesson03.order.003 accepts only participle-final "Ik ben naar de
    supermarkt gegaan." (the taught order; spoken "Ik ben gegaan naar de
    supermarkt." is rejected), and "... gekomen" is grammatical but
    semantically slightly odd; recent_time translation accepts only
    vanmorgen for "this morning" (vanochtend untaught in A1). DEFERRED
    (scripts/backfill_lexemes_en_nl.py, owned by another session):
    recent_time pool carries case duplicates Gisteren/Vanmorgen with
    capitalized glosses; lesson02.choose.001 (infinitive_hebben) has
    only 1 candidate (kopen) at unit scope so it never builds at the
    checkpoint (works in Endless Practice) -- pack owner to decide
    whether to keep it.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [participle_hebben, infinitive_hebben, participle_zijn, recent_time]
slot_presets:
  participle_hebben: &participle_hebben {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: participle_hebben}}
  infinitive_hebben: &infinitive_hebben {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: infinitive_hebben}}
  participle_zijn: &participle_zijn {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: participle_zijn}}
  recent_time: &recent_time {language_code: nl, part_of_speech: adverb, agreement_tags: {semantic: recent_time}}
  participle_all: &participle_all {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: [participle_hebben, participle_zijn]}}
templates:
  - content_key: practice.en-nl.nl.a1.unit12.lesson01.choose.001
    lesson_content_key: nl.a1.unit12.lesson01.voltooide_tijd
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *participle_hebben}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a past participle from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit12.lesson01.listen.002
    lesson_content_key: nl.a1.unit12.lesson01.voltooide_tijd
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *participle_hebben}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the participle you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit12.lesson01.match.003
    lesson_content_key: nl.a1.unit12.lesson01.voltooide_tijd
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: nl, direction: ltr}
    slots: {first: *participle_all, second: *participle_all, third: *participle_all, fourth: *participle_all, fifth: *participle_all, sixth: *participle_all}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each past participle with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit12.lesson02.choose.001
    lesson_content_key: nl.a1.unit12.lesson02.met_hebben
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *infinitive_hebben}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is an infinitive that uses hebben in the perfect tense.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit12.lesson02.listen.002
    lesson_content_key: nl.a1.unit12.lesson02.met_hebben
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *participle_hebben}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the participle you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit12.lesson02.translate.003
    lesson_content_key: nl.a1.unit12.lesson02.met_hebben
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *infinitive_hebben}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit12.lesson03.translate.001
    lesson_content_key: nl.a1.unit12.lesson03.met_zijn
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch (past participle).", language_code: en, direction: ltr}
    slots: {item: *participle_zijn}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit12.lesson03.order.003
    lesson_content_key: nl.a1.unit12.lesson03.met_zijn
    type: word_order
    frame: {text: "Ik ben naar de supermarkt {item}.", language_code: nl, direction: ltr}
    slots: {item: *participle_zijn}
    answer_derivation: {kind: render_frame, frame: {text: "Ik ben naar de supermarkt {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is a past participle that takes zijn.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit12.lesson04.translate.001
    lesson_content_key: nl.a1.unit12.lesson04.wanneer_gebeurde_het
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *recent_time}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit12.lesson05.choose.001
    lesson_content_key: nl.a1.unit12.lesson05.een_kort_verslag_lezen
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *participle_hebben}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a past participle from the account.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit12.lesson06.listen.001
    lesson_content_key: nl.a1.unit12.lesson05.een_kort_verslag_lezen
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *participle_hebben}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the participle you heard.", language_code: en, direction: ltr}
