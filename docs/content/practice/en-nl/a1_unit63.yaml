review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. en-nl A1
    unit63 (rondvaart / "Een dag met een rondvaart") has 6 lexemes
    (backfill_lexemes_en_nl.py's auto-generated rondvaart_vocab/
    rondvaart_steiger_single tags), all nouns, 1 of which (Watertocht) is a
    proper noun excluded from every pool via part_of_speech. Lesson05 has zero
    introduced_tokens and is correctly NOT anchored (recipe DO-NOT #8);
    lessons 01/02/03/04/06 are all anchored.

    14 templates: multiple_choice x5 + translation bare-word x5 (one of each
    per anchor lesson; rondvaart_vocab pool = boot/gracht/brug/steiger/
    wedstrijd, 5 distinct glosses -- "wedstrijd" is the unit's own
    wrap-up-dialogue forward reference to next unit's topic, legitimately
    taught in this unit's lesson06), listen_select x1 (rondvaart_vocab,
    anchored lesson03, the richest lesson), word_order x2 + fill_in_blank x1
    on the single-member rondvaart_steiger_single anchor, all reusing the
    unit's own taught sentences verbatim: "De steiger is klein.", "Ik zie de
    steiger en de gids.", and the taught dialogue fragment "Om elf uur. Bij de
    steiger." No matching_pairs: rondvaart_noun pool is only 5 distinct
    tokens, short of the 6-pair floor -- documented here rather than padded
    with an ungrammatical filler pool. Checkpoint-thin per §12: this unit's
    recognition/production tiers are capped at ~5 distinct answer values by
    real capacity, not authoring choice.

    Read every gloss (§0.1): all 5 usable tokens' glosses match what the
    realization teaches. No mis-glosses found.

    §9 step 5 course-scope check: rondvaart_steiger_single is generated only
    for token "steiger" (NL_A1_VOLUME_SINGLE_ANCHORS), a direction-wide-unique
    anchor, so it stays a single course-wide candidate in all 3 frames. None
    of "De"/"is"/"klein", "Ik"/"zie"/"de"/"en"/"de"/"gids", or "Om"/"elf"/
    "uur"/"Bij"/"de" is ever a rondvaart_steiger_single candidate (its only
    member is "steiger" itself, absent from all three frames' literal text).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): all 14
    templates checked against the real lexeme pools at unit scope (6
    lexemes, 5 rondvaart_vocab) and course scope (rondvaart_vocab 46,
    rondvaart_steiger_single 1); every gloss read against the realization
    (boot/gracht/brug/steiger/wedstrijd correct); "De steiger is klein.",
    "Ik zie de steiger en de gids." and the employee line "Om elf uur. Bij
    de steiger." are all taught verbatim; no self-reference, no booleans or
    jargon. 0 defects found.
