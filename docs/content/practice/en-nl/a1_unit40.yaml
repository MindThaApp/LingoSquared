schema_version: '1.0'
pack_key: practice.en-nl.a1.unit40
source_language: en
target_language: nl
unit_content_key: nl.a1.unit40.koken
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-24 (en-nl practice pass, session 10): 1 fix -- lesson06.choose feedback claimed every
    candidate is said when finishing a meal (false for proef/allemaal/level words) -> neutral wording.
    Native flags: smakelijk and lekker both gloss as 'tasty' (ambiguous in matching pools; gloss
    override proposed).

    Vocabulary unit (koken / cooking), 15 unit lexemes across all 6 lessons per
    scripts/backfill_lexemes_en_nl.py. Union tag koken_vocab (13 distinct tokens)
    used as the broad fallback for lessons whose own lesson-specific tag was
    under the multiple_choice 3-distinct-gloss floor (lesson02, lesson04,
    lesson05); lesson01 (ingredient_cutting), lesson03 (preparing_tasting) and
    lesson06 (meal_wrapup_dialogue) had their own union already >=3. MISGLOSS
    FOUND (S0.1): the lexeme dump also carries `bakken` (gloss "bins", noun)
    and `bak` (gloss "bin", noun) under this unit's lesson02
    (de_pan_bakken/de_pan_bakken) -- both are homograph collisions with a
    waste-sorting course elsewhere and do NOT carry the koken_vocab or
    koken_noun tags, so they were never pulled into any slot here; flagging for
    the coordinator to route a backfill fix (this lesson actually teaches
    `bakken` = "to bake/fry", not "bins"). Noun-only slots use koken_noun (pan,
    tomaat, ui) instead of koken_vocab specifically so those two mis-glossed
    nouns are structurally excluded (koken_noun never carries them; see
    RECIPE S3.1b). word_order/fill_in_blank both anchor on the single-member
    koken_tomaat_single tag (tomaat), course-scope-safe by construction.
    Capacity/coverage measured via RECIPE S9 step 4 (see report).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist):
    checked all templates against the real unit- and course-scope pools,
    every gloss vs the unit40 realization, frame grammar/taught
    vocabulary, self-reference, matching confusability, booleans and
    jargon. FIXED (untaught-vocab): lesson01.order.003 'Ik snijd de {item}
    in stukjes.' used never-taught 'stukjes' -> 'Ik snijd de {item} voor
    het eten.' (lesson01's own taught sentence); lesson01.fill.004 'Kun je
    de ___ even wassen?' used never-taught 'wassen' and was equally
    satisfied by the unit's 'ui' -> 'Ik snijd de ui en de {item}.'
    (feedbacks updated). FIXED (feedback-hint): choose feedbacks in
    lesson01/02/03/04/05 asserted category facts false for course-scope
    pool members (heb, opstaan, uitlaten, scheidbaar, keuken...) ->
    'Remember the English meaning of {item}.'; match feedback -> 'Match
    each word with its English meaning.'. DEFERRED (lexeme-gloss):
    bakken/bak in lesson02 are glossed 'bins'/'bin' (waste-sorting sense)
    but this unit teaches 'to fry'/'fry (with ik)'; the pack already keeps
    them out of every pool (they lack koken_vocab), backfill gloss fix
    needed. No native-judgment flags.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - ingredient_cutting
    - koken_noun
    - preparing_tasting
    - koken_vocab
    - meal_wrapup_dialogue
    - koken_tomaat_single

templates:

# -- lesson01: de_ui_de_tomaat_snijden ---------------------------------------
- content_key: practice.en-nl.nl.a1.unit40.lesson01.choose.001
  lesson_content_key: nl.a1.unit40.lesson01.de_ui_de_tomaat_snijden
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: ingredient_cutting}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: Remember the English meaning of {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit40.lesson01.translate.002
  lesson_content_key: nl.a1.unit40.lesson01.de_ui_de_tomaat_snijden
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb]
      agreement_tags: {semantic: ingredient_cutting}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit40.lesson01.order.003
  lesson_content_key: nl.a1.unit40.lesson01.de_ui_de_tomaat_snijden
  type: word_order
  frame:
    text: Ik snijd de {item} voor het eten.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: koken_tomaat_single}
  answer_derivation:
    kind: render_frame
    frame:
      text: Ik snijd de {item} voor het eten.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: Ik snijd de tomaat voor het eten. -- I cut the tomato for the meal.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit40.lesson01.fill.004
  lesson_content_key: nl.a1.unit40.lesson01.de_ui_de_tomaat_snijden
  type: fill_in_blank
  frame:
    text: Ik snijd de ui en de {item}.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: koken_tomaat_single}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: Ik snijd de ui en de tomaat. -- I cut the onion and the tomato.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit40.lesson01.listen.005
  lesson_content_key: nl.a1.unit40.lesson01.de_ui_de_tomaat_snijden
  type: listen_select
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adjective]
      agreement_tags: {semantic: koken_vocab}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: You heard {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit40.lesson01.match.006
  lesson_content_key: nl.a1.unit40.lesson01.de_ui_de_tomaat_snijden
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &koken_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags: {semantic: koken_vocab}
    second: *koken_word
    third: *koken_word
    fourth: *koken_word
    fifth: *koken_word
    sixth: *koken_word
  slot_relations:
  - {kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each word with its English meaning.
    language_code: en
    direction: ltr

