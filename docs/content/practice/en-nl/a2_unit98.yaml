schema_version: '1.0'
pack_key: practice.en-nl.a2.unit98
source_language: en
target_language: nl
unit_content_key: nl.a2.unit98.degene_die_en_dat
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 95-101 pass): 0 fixes. Dumped the unit-scope
    pool (19 lexemes over all 6 lessons) and the course-scope pool of the union slot (267
    lexemes, widened by the shared past_habits_dialogue and busy_morning_reading tags) and
    read every unit gloss. All frames are bare-word, so the wide course pool raises no frame-grammar
    or self-reference risk. Backfill gloss notes: vond carries "thought; found (with je)"
    while this unit uses vond = found with ik and third-person subjects; Echt is a capitalized
    sentence-position form. Capacity: 18 live templates, 17/19 lexemes hosted (Succes and
    degene are excluded by part of speech), 6/6 lessons in every tier, no dead or under-floor
    template. Authored for the lessons of A2 unit 98 that have backfilled lexemes (grammar-led
    unit). Recognition, matching and bare-word production use a unit-wide union of the unit
    lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so
    every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns,
    proper nouns, particles and phrases are left out.  Native speaker should confirm the lexical
    set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - relative_people_things
    - relative_die_dat
    - relative_subject_object
    - in_de_winkel
    - busy_morning_reading
    - past_habits_dialogue
templates:
- content_key: practice.en-nl.nl.a2.unit98.lesson01.choose.001
  lesson_content_key: nl.a2.unit98.lesson01.mensen_en_spullen
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [relative_people_things, relative_die_dat, relative_subject_object, in_de_winkel, busy_morning_reading, past_habits_dialogue]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit98.lesson01.match.002
  lesson_content_key: nl.a2.unit98.lesson01.mensen_en_spullen
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit98.lesson01.translate.003
  lesson_content_key: nl.a2.unit98.lesson01.mensen_en_spullen
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit98.lesson02.listen.001
  lesson_content_key: nl.a2.unit98.lesson02.die_of_dat
