schema_version: '1.0'
pack_key: practice.en-nl.a1.unit58
source_language: en
target_language: nl
unit_content_key: nl.a1.unit58.concert
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-24 (en-nl practice pass, session 10): 4 fixes -- feedback_frame texts that named
    "this unit" or claimed topic membership (false for the level-scope pool) replaced with true generic
    feedback; fixed-sentence feedback now gives the full Dutch sentence with English. Native flags:
    bare-verb glosses carrying '(with ik)' style hints, 'kaart' gloss (map vs card), 'zwemmen =
    swimming', 'dicht = close' (see report).

    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. en-nl A1 unit58 (concert / "Naar
    het concert: een kaartje kopen") is a thin vocabulary unit: only 6 lexemes total
    (backfill_lexemes_en_nl.py's concert_vocab/concert_noun/concert_podium_single auto-tags), 2 of which
    are proper nouns (Sven, Wandelaars) excluded from every pool via part_of_speech. Lessons 02/03 have
    zero introduced_tokens and are correctly NOT anchored (recipe DO-NOT #8); lessons 01/04/05/06 have
    lexemes and are all anchored. Lesson04's only lexeme is the proper noun Sven, so its MC/translate
    templates pool across the unit-wide concert_vocab tag per §8.1 step 2 ("anchor templates per lesson,
    pool across the unit") rather than a lesson-only tag.

    12 templates: multiple_choice x4 (one per anchor lesson, concert_vocab:
    band/podium/publiek/geweldig, 4 distinct glosses), translation bare-word x4 (same tag/lessons),
    listen_select x1 (concert_vocab, anchored lesson05), word_order x2 + fill_in_blank x1 (all on the
    single-member concert_podium_single anchor -- podium is the unit's only *_single token, so
    structured tier reuses it across 3 templates with 3 different sentences taken from/modeled on the
    unit's own realization: "Het podium is groot." (taught verbatim), "Ik zie de band op het podium.",
    "Vanaf het podium zwaait de zangeres." -- all read grammatical with the single candidate). No
    matching_pairs: concert_noun pool is only 3 distinct tokens (band/podium/publiek), short of the
    6-pair floor -- documented here rather than padded with an ungrammatical filler pool.
    Checkpoint-thin per §12: this unit sits at the 12-template floor exactly and its recognition/
    production tiers are capped at ~4-5 distinct answer values by real capacity, not authoring choice.

    Read every gloss in the pool (§0.1): band/podium/publiek/geweldig all match what the realization
    teaches; no mis-glosses found.

    §9 step 5 course-scope check: concert_podium_single is generated only for token "podium"
    (NL_A1_VOLUME_SINGLE_ANCHORS), a direction-wide-unique anchor by construction, so it stays a single
    course-wide candidate in all 3 frames above. None of "Het", "is", "groot", "Ik", "zie", "de",
    "band", "op", "Vanaf", "zwaait", "de", "zangeres" is ever a concert_podium_single candidate (its
    only member is "podium" itself, which does not appear in the literal frame text of any of the three
    sentences).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 12 templates against
    unit- and course-scoped pools, glosses vs the realization, frame grammar/self-reference, floors,
    booleans and jargon. FIXED lesson05.order.006: 'Vanaf het {item} zwaait de zangeres.' used zwaait
    and zangeres, which are taught nowhere in the nl course (vanaf only in unit09); frame now 'De band
    staat op het {item}.' (all words taught; feedback updated). DEFERRED (lexeme gloss, backfill lane):
    band 'the band', podium 'the stage', publiek 'the audience' carry 'the' while tokens are bare, so
    typing 'de band' in bare-word translations is graded wrong. No native-judgment flags.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - concert_vocab
    - concert_podium_single
