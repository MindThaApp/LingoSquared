schema_version: '1.0'
pack_key: practice.en-nl.b1.unit02
source_language: en
target_language: nl
unit_content_key: nl.b1.unit02.mening_en_nuance
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md, as part of the en-nl B1 unit01-11
    practice-pack wave that unblocks these units'' checkpoints (the units already had lexemes from scripts/backfill_lexemes_en_nl.py
    but no pack at all, so generate_checkpoint() returned checkpoint_unavailable). 19 templates across
    6 lesson(s) with lexemes: listen_select x1, matching_pairs x3, multiple_choice x5, translation x7,
    word_order x3. Every slot is satisfiable from THIS unit''s own lexemes, because generate_checkpoint()
    calls _material() with only this unit''s lesson ids; slots use the unit''s own per-lesson semantic
    tags (unioned where a single lesson tag could not reach the >=3-option multiple_choice floor or the
    6-token matching_pairs floor), narrowed by part_of_speech to content words so no exercise ever shows
    ''the'' or ''and'' as its answer. Measured with the recipe''s capacity/coverage model against the
    real backfill data: 34 of 45 unit lexemes hostable (76%), recognition 76% / structured 73% / production
    73%, and all three tiers reach 6/6 of the lessons that have lexemes. Distinct-target capacity: recognition
    62, production 34, structured effectively unbounded (matching_pairs combinatorics). 13 of 19 templates
    carry >=5 variants. REVIEWER: Every gloss-showing template that could reach ''waar'' as an ANSWER
    is restricted to POS noun/verb/adjective, because the backfill glosses lesson04''s ''waar'' (''Dat
    is waar'' = that is true) as ''where'' - correct for unit04 lesson03, wrong here (defect 1.29). General
    double-checks for this wave: (a) every word_order/fill_in_blank frame was verified against its slot''s
    whole-B1-course candidate pool, not just the unit pool, so Endless Practice cannot render an ungrammatical
    sentence; (b) no frame''s literal text contains any of its own slot''s candidate values (defect 1.14);
    (c) listen_select frames are bare ''{item}'' so no distractor can be a word the audio itself says
    (defect 1.22); (d) matching_pairs pools were read by hand for interchangeable English glosses. Needs
    the standard fresh-context review before import.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - b1_unit_review
