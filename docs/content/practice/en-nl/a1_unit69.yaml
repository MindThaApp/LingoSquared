schema_version: '1.0'
pack_key: practice.en-nl.a1.unit69
source_language: en
target_language: nl
unit_content_key: nl.a1.unit69.ijssalon
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. THIN
    vocabulary unit: 10 lexemes total (lesson01 x1, lesson02 x1, lesson03
    x1, lesson04 x4, lesson05 x1, lesson06 x2); all 6 lessons have >=1
    lexeme, unlike most units in this batch. Used the union broad tag
    `ijssalon_vocab` (9 distinct tokens: vitrine, ijs, bolletje, hoorntje,
    verse, smaken, bolletjes, bakje, bloemist -- excludes the proper noun
    Smit; all glosses read against the realization and confirmed correct --
    "bloemist" is legitimately this unit's own lexeme, introduced
    conversationally in lesson06's forward-referencing proposal line,
    bolletje/bolletjes and ijssalon_vocab's verse/vers-type entries are
    legitimate singular/plural or inflection discriminations, not
    duplicates). Only single-member anchor available is
    `ijssalon_vitrine_single` (vitrine, lesson01), used for both the
    fill_in_blank and word_order templates with two different literal
    frames; the word_order frame's literal word "ijssalon" is itself a
    broad-tag pool member but is NOT a candidate of the vitrine_single slot
    at any scope, so it is not a same-slot self-reference. 17 templates,
    all 6 lexeme-bearing lessons covered by both multiple_choice and
    translation; matching_pairs anchored to lesson03 and lesson06 (broad
    tag, 6 pairs each, all distinct glosses, no case-duplicates).
    Recognition 7 (6 MC + 1 listen_select), structured 4 (2 matching_pairs +
    1 fill_in_blank + 1 word_order), production 6 (translation). Needs
    standard fresh-context review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - ijssalon_vocab
    - ijssalon_vitrine_single
templates:

