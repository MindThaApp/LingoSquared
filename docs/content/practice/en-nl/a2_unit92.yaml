schema_version: '1.0'
pack_key: practice.en-nl.a2.unit92
source_language: en
target_language: nl
unit_content_key: nl.a2.unit92.omdat_want_dus
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 87-94 pass): 0 pack fixes. Dumped the shared union slot at unit scope (9 lexemes) and A2 course scope (140) and read every gloss; capacity with the '.a2.unit92.' filter: 12 templates, 82% coverage (9/11), lessons 3/4 in every tier, no dead templates, unit pool 9 distinct glosses. Known gap, unchanged: lesson02's only lexeme is the particle Omdat, which no tier hosts; a particle slot cannot be made safe here because the A2 particle pool under these tags also holds de, het, een, er, of, niet, want and dus, and Want 'because; for' would sit next to Omdat 'because' as a near-synonym option. Backfill glosses for the coordinator (course scope): was 'do the dishes (with ik)', bus carries an idiom note ('the tin ...'), Met 'This is', zin 'desire; mood'. Earlier notes: Authored for the lessons of A2 unit 92 that have backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases are left out. Thin unit (11 hostable lexemes). Conjunctions (Omdat, Want) are particles and are excluded because their glosses (because / because; for) are confusable as multiple-choice options. Check Staat and voorop glosses. Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - reason_result_vocabulary
    - omdat_verb_final
    - omdat_want_dus_contrast
    - busy_morning_reading
templates:
- content_key: practice.en-nl.nl.a2.unit92.lesson01.choose.001
  lesson_content_key: nl.a2.unit92.lesson01.reden_en_gevolg
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [reason_result_vocabulary, omdat_verb_final, omdat_want_dus_contrast, busy_morning_reading]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit92.lesson01.match.002
  lesson_content_key: nl.a2.unit92.lesson01.reden_en_gevolg
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit92.lesson01.translate.003
  lesson_content_key: nl.a2.unit92.lesson01.reden_en_gevolg
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

