  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &noun_slot
      language_code: nl
      part_of_speech:
      - noun
      agreement_tags:
        semantic:
        - negotiation_proposal
        - polite_refusal
        - condition_setting
        - reaching_agreement
        - agreement_reading
        - negotiation_dialogue
    second: *noun_slot
    third: *noun_slot
    fourth: *noun_slot
    fifth: *noun_slot
    sixth: *noun_slot
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each noun from the negotiation with its English meaning.
