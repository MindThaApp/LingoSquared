schema_version: '1.0'
pack_key: practice.en-nl.b2.unit07
source_language: en
target_language: nl
unit_content_key: nl.b2.unit07.onderhandelen
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-08-02 against docs/content/PRACTICE_PACK_RECIPE.md (§8.1
    grammar-unit pattern) to unblock the nl B2 unit07 (Onderhandelen /
    negotiation) checkpoint, which returns checkpoint_unavailable with no pack.
    16 templates over all 6 lessons that have lexemes: multiple_choice x4,
    listen_select x1 (recognition), matching_pairs x2 + word_order x3
    (structured), translation x6 (production). This is a GRAMMAR/function unit,
    so per §8.1 the per-lesson-tag pattern does not clear the floors; recognition
    and production templates anchor lesson_content_key per lesson but union the
    slot semantic tags (OR-matched) to clear the >=3 multiple_choice / >=6
    matching_pairs floors, and part_of_speech excludes function words. Every slot
    is satisfiable from THIS unit's own lexemes (generate_checkpoint feeds
    _material only this unit's lesson ids). Ground-truth pool (backfill iter_specs,
    unit scope) = 39 lexemes across lesson01(16) lesson02(7) lesson03(7)
    lesson04(6) lesson05(2) lesson06(1). Measured capacity/coverage (§9 step 4,
    .{LEVEL}.{UNIT}. filter, TTS=True): ALL 95%, recognition ~87%, structured 74%,
    production ~87%; every tier covers all 6 lessons; no !! dead/thin templates.
    COURSE-SCOPE SAFETY (§1.1, defect 1.14 -- integrity script skips b2 packs so
    checked by hand): all six B2 negotiation semantic tags are polluted course-wide
    (they appear across ~10 other B2 units via the shared backfill), so every
    word_order and the fixed-sentence translation uses a slot that resolves to
    exactly ONE token at COURSE scope -- akkoord (polite_refusal+adjective),
    alleen (condition_setting+adverb), Nee (negotiation_dialogue+particle) -- making
    each frame deterministic and trivially grammatical, and no frame's literal words
    are a candidate value of its own slot. The two matching_pairs use the 6-tag noun
    union (7 unit nouns; course-wide adds only 'idee', all distinct glosses, no
    case/exact-gloss dups) and the 6-tag verb union (19 unit verbs; verified ZERO
    exact-gloss and ZERO case duplicates at course scope). REVIEWER, double-check:
    (1) the verb matching_pairs (lesson01 match.002) pool contains inflectional
    twins koken/kook/kookt ("to cook" / "cook (with ik)" / "cooks"), doe/doet,
    gaat/gaan, afwassen/afwast, betalen/betaalt -- glosses are all DISTINCT and
    encode the inflection (treated as acceptable sing/plural-style discriminations
    per §6.3, not interchangeable paraphrases), but confirm they read as answerable;
    (2) lesson06 translate.001 is the CULMINATING full-negotiation production
    (item-7): a fixed-sentence render_frame graded by exact string against one
    canonical three-move answer -- the realization's lesson06 speak_response supplies
    phrasing variants but a practice pack accepts one form, so the English prompt is
    written to pin the exact Dutch; (3) capitalized citation forms in the pool (We,
    Daar, Helemaal, Afgesproken, Nee) are safe as TYPED answers (practice path
    casefolds) but display capitalized as matching_pairs lefts / MC prompts -- a
    backfill sentence-initial fold would clean this up (route to backfill lane). No
    mis-glossed lexeme found: every gloss matches what this from-scratch unit teaches.
    Register: informal jij/je throughout (nl lane pin).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - negotiation_proposal
    - polite_refusal
    - condition_setting
    - reaching_agreement
    - agreement_reading
    - negotiation_dialogue
