schema_version: '1.0'
pack_key: practice.en-nl.a1.unit72
source_language: en
target_language: nl
unit_content_key: nl.a1.unit72.dierenwinkel
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-23 per docs/content/PRACTICE_PACK_RECIPE.md, en-nl batch
    en-nl_05. Unit72 (dierenwinkel / pet shop, A1 volume batch) is the
    THINNEST unit in this batch: 7 lexemes total (voer, riem, mand, slaapt,
    vogelvoer, Vrolik, speeltje), measured with the recipe's
    f'.{LEVEL}.{UNIT}.' filter. **lesson01
    (zullen_we_naar_de_dierenwinkel_gaan) and lesson05
    (bij_de_toonbank_in_de_dierenwinkel) have ZERO classified lexemes** for
    this unit -- per DO-NOT #8 neither is anchored by any template here.
    Lessons 02, 03, 04, 06 have >=1 lexeme and are anchored. `Vrolik` (business
    name, lesson04) is `proper_noun` and is excluded from every slot via the
    part_of_speech constraint (never noun/verb/adjective), so it never
    surfaces as an MC/translation self-gloss.


    Same §8.1 grammar-unit pattern as unit70/71 in this batch: every
    multiple_choice/listen_select/translation/matching_pairs slot uses the
    unioned semantic:dierenwinkel_vocab tag, anchored per-lesson via
    lesson_content_key but pooling the unit's content-word vocabulary, always
    excluding the proper noun Vrolik via part_of_speech. **Correction found
    during §9 capacity checking: noun-only gives just 5 distinct tokens
    (voer, riem, mand, vogelvoer, speeltje) -- one short of the matching_pairs
    6-slot floor.** matching_pairs therefore uses part_of_speech [noun, verb]
    (admitting "slaapt") to reach exactly 6 distinct tokens; choose/listen/
    translate use [noun, verb, adjective] as in the other two packs. Only
    bare-item/bare-pair frames use this broad tag; no literal-sentence frame
    uses it.


    13 templates, all 4 lexeme-bearing lessons, all 3 tiers (recognition 5 [4
    choose + 1 listen_select], structured 4 [2 matching_pairs + 1 word_order +
    1 fill_in_blank], production 4 [bare-word translation]). word_order and
    fill_in_blank both use the single-member anchor tag
    dierenwinkel_speeltje_single (exactly 1 course-wide candidate:
    "speeltje"), so both are course-scope-safe by construction. The word_order
    frame ("De hond heeft nu een {item}.") is lifted verbatim from the
    realization's own lesson06 dialogue line ("De hond heeft nu een
    speeltje."); the fill_in_blank frame ("Wij kopen een {item} voor de
    hond.") is an original but grammatically straightforward sentence around
    the same single anchor.


    No mis-glossed lexeme found (all 6 admissible glosses read correctly
    against the realization). THIN UNIT flag: only 6 admissible content
    tokens (7 total lexemes minus 1 excluded proper noun) across 4 represented
    lessons -- this is the thinnest unit of the three in this batch, authored
    to full pool capacity and not padded, per HARD RULE #3. lessons 01 and 05
    are unrepresentable in the checkpoint regardless of pack content; flagging
    for the coordinator to route a backfill_lexemes_en_nl extension if
    coverage of those two lessons is wanted.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - dierenwinkel_vocab
    - dierenwinkel_speeltje_single
templates:

