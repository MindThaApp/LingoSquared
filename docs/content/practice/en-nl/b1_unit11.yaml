review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-24 (en-nl practice pass, session 10): 2 fixes -- lesson01 and lesson04 feedback no longer over-claim. Native flags: lesson02.order.001 still admits belde (ungrammatical with op) at Endless scope: no exclusive tag exists; nam/opnam/grappigs glosses proposed.

    Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md, as part of the en-nl B1 unit01-11
    practice-pack wave that unblocks these units'' checkpoints (the units already had lexemes from scripts/backfill_lexemes_en_nl.py
    but no pack at all, so generate_checkpoint() returned checkpoint_unavailable). 16 templates across
    6 lesson(s) with lexemes: listen_select x1, matching_pairs x2, multiple_choice x2, translation x7,
    word_order x4. Every slot is satisfiable from THIS unit''s own lexemes, because generate_checkpoint()
    calls _material() with only this unit''s lesson ids; slots use the unit''s own per-lesson semantic
    tags (unioned where a single lesson tag could not reach the >=3-option multiple_choice floor or the
    6-token matching_pairs floor), narrowed by part_of_speech to content words so no exercise ever shows
    ''the'' or ''and'' as its answer. Measured with the recipe''s capacity/coverage model against the
    real backfill data: 17 of 17 unit lexemes hostable (100%), recognition 76% / structured 100% / production
    65%, and all three tiers reach 6/6 of the lessons that have lexemes. Distinct-target capacity: recognition
    22, production 12, structured effectively unbounded (matching_pairs combinatorics). 4 of 16 templates
    carry >=5 variants. REVIEWER: Only 17 lexemes and four lessons with 2-4; several templates are single-variant
    anchors. The lesson01 matching_pairs deliberately includes POS particle so the storytelling connectors
    (Terwijl / Eerst / Toen / En) are matchable - they are the point of the unit. ''grappig'' and ''grappigs''
    both appear in the lesson04 matching pool; their glosses spell out the difference (''funny'' vs ''funny
    (indeclinable form after iets)''). General double-checks for this wave: (a) every word_order/fill_in_blank
    frame was verified against its slot''s whole-B1-course candidate pool, not just the unit pool, so
    Endless Practice cannot render an ungrammatical sentence; (b) no frame''s literal text contains any
    of its own slot''s candidate values (defect 1.14); (c) listen_select frames are bare ''{item}'' so
    no distractor can be a word the audio itself says (defect 1.22); (d) matching_pairs pools were read
    by hand for interchangeable English glosses. Needs the standard fresh-context review before import. Fresh-context review 2026-10-10 (content-reviewer.md checklist): read all 16 templates against unit- and course-scoped pools (frame grammaticality incl. ''Eerst belde ik niet op'' for the course member belde, derived answers, distractor/gloss collisions, matching confusables incl. grappig/grappigs and de/het, self-reference, booleans, jargon); none of the logged lexeme defects reach these pools. 0 defects found in the templates. DEFERRED: fixed-sentence translation.005 accepts one rendering only (e.g. ''Terwijl ik kookte, ...'' is rejected; systemic). 0 fixed, 1 deferred, no native flag.'
