review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md, as part of the en-nl B1 unit01-11
    practice-pack wave that unblocks these units'' checkpoints (the units already had lexemes from scripts/backfill_lexemes_en_nl.py
    but no pack at all, so generate_checkpoint() returned checkpoint_unavailable). 17 templates across
    6 lesson(s) with lexemes: listen_select x1, matching_pairs x2, multiple_choice x4, translation x7,
    word_order x3. Every slot is satisfiable from THIS unit''s own lexemes, because generate_checkpoint()
    calls _material() with only this unit''s lesson ids; slots use the unit''s own per-lesson semantic
    tags (unioned where a single lesson tag could not reach the >=3-option multiple_choice floor or the
    6-token matching_pairs floor), narrowed by part_of_speech to content words so no exercise ever shows
    ''the'' or ''and'' as its answer. Measured with the recipe''s capacity/coverage model against the
    real backfill data: 20 of 26 unit lexemes hostable (77%), recognition 77% / structured 77% / production
    73%, and all three tiers reach 6/6 of the lessons that have lexemes. Distinct-target capacity: recognition
    35, production 20, structured effectively unbounded (matching_pairs combinatorics). 7 of 17 templates
    carry >=5 variants. REVIEWER: This unit has only 26 lexemes across 6 lessons (3 lessons have 1-3),
    so several templates are single-variant by construction. ''vroeg'' is glossed ''early'' by the backfill
    although this unit teaches it as the past tense of ''vragen'' (defect 1.29); it is therefore excluded
    from every gloss-showing template by part-of-speech. lesson04''s word_order anchors on semantic: reported_speech_dialogue
    (POS noun -> ''station''). General double-checks for this wave: (a) every word_order/fill_in_blank
    frame was verified against its slot''s whole-B1-course candidate pool, not just the unit pool, so
    Endless Practice cannot render an ungrammatical sentence; (b) no frame''s literal text contains any
    of its own slot''s candidate values (defect 1.14); (c) listen_select frames are bare ''{item}'' so
    no distractor can be a word the audio itself says (defect 1.22); (d) matching_pairs pools were read
    by hand for interchangeable English glosses. Needs the standard fresh-context review before import.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): all 17 templates checked against their unit- and course-scoped (B1) pools, every pool gloss read against the b1_unit05 realization; word_order and fixed-sentence frames (Hij zei dat hij moe was; Kun je me ophalen van het station; Ik zei dat dat geen probleem was) re-read at course scope and match the realization''s taught word order; self-reference, listen_select distractors, matching_pairs confusables (kun/kunnen, kon/konden, kom/komen are gloss-distinguished), YAML booleans and jargon checked. The backfill now glosses vroeg as ''asked (past tense of vragen)'', so the known vroeg defect no longer reaches this pack. 0 defects found in this pack. Deferred to the backfill lane: kun is glossed bare ''can'' (lesson03.translate.001; a learner typing kan gets only ''almost'' - suggest ''can (with je/jij)''); Heb is glossed bare ''have''.'
