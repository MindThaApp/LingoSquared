schema_version: "1.0"
pack_key: practice.en-nl.a1.unit29
source_language: en
target_language: nl
unit_content_key: nl.a1.unit29.hobbies
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-09 by the practice-template depth-closing pass:
    en-nl's practice packs only went through unit23/a2_unit24-28 while the
    actual Dutch A1 lesson content (docs/content/realizations/nl/) now goes
    through a1_unit56 -- units 29-56 (the file-numbered range appended after
    unit23 in scripts/content_manifest.txt's en-nl line, still the same
    Dutch A1 course, not a level change) had zero practice packs. This file
    covers unit29 (hobbies/free-time activities), the first unit in that
    gap. Extended scripts/backfill_lexemes_en_nl.py: widened UNIT_FILES'
    filter to also include units 29-33, added real Dutch glosses/POS for
    every genuinely new token this unit introduces, and 5 new semantic
    tags scoped to this unit's own real vocabulary (hobby_verb: 6-member
    bare-infinitive recognition-only pool, lezen/sporten/koken/luisteren/
    tekenen/gamen, no shared generative frame since each collocates
    differently, same discipline as unit10's routine_verb_infinitive;
    freq_adverb: 4-member altijd/vaak/soms/nooit, verified grammatical in
    'Ik lees {item} een boek.'/'Ik sport {item} op zaterdag.'/'Ik kook
    {item} voor vrienden.' -- used ONLY via translation/word_order, where
    the English side disambiguates which word is meant, never a bare
    Dutch fill_in_blank on this pool, matching this unit's own real
    realization file's review.notes, which explicitly flagged blanking
    frequency adverbs as an unfair ambiguous blank even though they are
    not true synonyms of each other; hobby_boek_single/
    hobby_vrienden_single/hobby_vrije_single: single-member tags for the
    unit's own real fill_in_blank resolutions, boek/vrienden/vrije,
    matching the realization file's own choice verbatim). Every generative
    frame's literal text was checked against its own slot's candidate set
    for self-reference (none found). Real course-wide candidate counts
    verified with a standalone lexeme_matches()-replicating harness before
    writing these templates. 16 templates across all 6 lessons:
    multiple_choice x3, listen_select x3, matching_pairs x2 (6-pair
    hobby_verb pool anchored lesson01/lesson05), fill_in_blank x3 (all
    single-candidate), word_order x2, translation x3. Needs the standard
    fresh-context review before import. Blocking dependency, same as every
    other en-nl pack: backfill_lexemes_en_nl.py has not actually been run
    against a real database yet."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [hobby_verb, freq_adverb, hobby_boek_single, hobby_vrienden_single, hobby_vrije_single]
slot_presets:
  hobby_verb: &hobby_verb {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: hobby_verb}}
  freq_adverb: &freq_adverb {language_code: nl, part_of_speech: adverb, agreement_tags: {semantic: freq_adverb}}
  hobby_boek_single: &hobby_boek_single {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: hobby_boek_single}}
  hobby_vrienden_single: &hobby_vrienden_single {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: hobby_vrienden_single}}
  hobby_vrije_single: &hobby_vrije_single {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: hobby_vrije_single}}
templates:
  - content_key: practice.en-nl.nl.a1.unit29.lesson01.choose.001
    lesson_content_key: nl.a1.unit29.lesson01.lezen_sporten_koken
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *hobby_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a hobby verb from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit29.lesson01.listen.002
    lesson_content_key: nl.a1.unit29.lesson01.lezen_sporten_koken
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *hobby_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit29.lesson01.match.003
    lesson_content_key: nl.a1.unit29.lesson01.lezen_sporten_koken
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: nl, direction: ltr}
    slots: {first: *hobby_verb, second: *hobby_verb, third: *hobby_verb, fourth: *hobby_verb, fifth: *hobby_verb, sixth: *hobby_verb}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each hobby verb with its English meaning.", language_code: en, direction: ltr}
