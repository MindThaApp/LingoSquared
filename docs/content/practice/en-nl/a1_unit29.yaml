    lesson_content_key: nl.a1.unit29.lesson01.lezen_sporten_koken
    type: fill_in_blank
    frame: {text: "Ik lees graag een {item}.", language_code: nl, direction: ltr}
    slots: {item: *hobby_boek_single}
    answer_derivation: {kind: slot_text, slot: item}
