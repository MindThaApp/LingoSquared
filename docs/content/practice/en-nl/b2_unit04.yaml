  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, adjective, adverb]
      agreement_tags:
        semantic: narrative_background
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} sets the background scene of the story.'
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit04.lesson01.order.002
  lesson_content_key: nl.b2.unit04.lesson01.achtergrond
  type: word_order
  frame:
    text: Het was {item} buiten.
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: [adjective]
      agreement_tags:
        semantic: weather_adj_pure
  answer_derivation:
    kind: render_frame
    frame:
      text: Het was {item} buiten.
      language_code: nl
      direction: ltr
  feedback_frame:
    text: Het was koud buiten. -- It was cold outside.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit04.lesson01.translate.003
  lesson_content_key: nl.b2.unit04.lesson01.achtergrond
  type: translation
  frame:
