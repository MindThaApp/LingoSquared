schema_version: '1.0'
pack_key: practice.en-nl.b2.unit04
source_language: en
target_language: nl
unit_content_key: nl.b2.unit04.verhaal
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-08-02 against docs/content/PRACTICE_PACK_RECIPE.md to unblock the
    nl.b2.unit04 (narrative time / shifting past reference) checkpoint, which returns
    checkpoint_unavailable until this pack exists. This is a GRAMMAR unit, so the
    §8.1 pattern is used: templates are anchored one-or-more per lesson, but slots
    union the unit's own lesson tags and narrow by part_of_speech to content words,
    with word_order/fixed-translation carrying the grammar in the frame via
    single-member anchor tags. 20 templates over 6 lessons: multiple_choice x5,
    listen_select x1 (recognition); word_order x5 + matching_pairs x2 (structured);
    translation x7 (production, incl. one short single-sentence deterministic
    item). Every slot is
    satisfiable from THIS unit's own lexemes (generate_checkpoint calls _material with
    only this unit's lesson ids). Measured with the recipe §9.4 model on the real
    backfill data: ALL 86% / recognition ~73% / structured ~55% / production ~76%,
    all three tiers reach 6/6 lessons, no dead/underfloor templates.
    MIS-GLOSS FOUND (§0.1) — route to backfill lane: token 'was' carries gloss
    "do the dishes (with ik)" but this unit teaches it as the imperfectum 'was' (Ik
    was moe). It is the ONLY mis-glossed token in the unit. It is EXCLUDED from every
    gloss/hint-showing slot: every narrative_background slot narrows part_of_speech to
    [noun, adjective, adverb], which drops all four narrative_background verbs (was,
    regende, regenen, had) since they share only that one tag and cannot be
    tag-separated from 'was'. 'was'/'regende'/'had' still appear as LITERAL frame text
    in hero sentences, so they are taught, just not target-hosted; the other three are
    clean glosses and could be re-added once 'was' is re-classified.
    REVIEWER double-checks: (a) single-member word_order anchors verified at b2 COURSE
    scope (koud=weather_adj_pure, daarna=drukkeweek_daarna_single, station=place,
    al=synthesis_dialogue, wakker=storytelling_reading+adjective) each return exactly
    1 candidate, so every word_order frame is deterministic and defect-1.14-clean by
    hand (b1_/b2_ packs are skipped by _practice_content_integrity_check.py's
    a*_unit*.yaml glob). (b) The near-synonym time connectors toen/wanneer/als/terwijl
    are deliberately kept OUT of the matching_pairs pools (part_of_speech [noun, verb]
    for m7) to avoid an interchangeable-gloss "when/when" confusable; they are hosted
    in the recognition and production tiers instead. (c) The lesson06 production is
    now a short deterministic single-sentence item (lesson06 translate.003: English
    prompt 'The train had already left.' rendered as 'De trein was al vertrokken.'
    via a single-member 'al' slot), so it has a single natural rendering rather than
    a multi-clause exact-match answer — the whole spine act (imperfectum background
    + toen event + plusquamperfectum pre-past) is delivered by the realization's
    lesson exercises, not this pack. (d) Register: informal jij/je throughout
    (nl lane pin) — 'je' used in the lesson06 anchor sentences.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): read all 20
    templates against their unit- and course-scoped pools and the nl b2_unit04
    realization; all word_order and fixed-translation anchors re-confirmed single at
    course scope (koud, daarna, station, al, wakker). FIXED (duplicate-ambiguous):
    lesson03.translate.004 hosted wanneer with prompt "when", but this lesson explicitly
    teaches toen/wanneer/als as three Dutch words for "when", so a learner typing toen
    or als was marked wrong. part_of_speech is narrowed to [noun, verb] (drops wanneer
    and altijd from this production slot; both remain in lesson03.choose.001
    recognition). FIXED (answer-key): lesson02.translate.003 included particle, and at
    course scope this pulls in 'de' with prompt "the" (het is equally correct); dropped
    particle (eerst stays in recognition and in the word_order frame). FIXED (feedback-hint):
    lesson02.choose.001 feedback said every word "moves the story forward to the
    next event" (false for heb, gekomen, course de/trein); now 'Remember the meaning of
    {item}.' DEFERRED (lexeme-gloss): 'was' still carries "do the dishes (with ik)"
    (author already excluded it from all gloss slots); vertrok (lesson03) and vertrokken
    (lesson04) both carry "left; departed", and miste/gemist both carry "missed", so the
    bare-word translations cannot say which form they want (propose adding "(simple
    past)" / "(past participle)"); heb "have" (propose "have (with ik)") and gekomen
    "came; come" ("came" invites kwam; propose "come (past participle)"). Native flag:
    none.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - narrative_background
    - weather_adj_pure
    - narrative_event_sequence
    - drukkeweek_daarna_single
    - narrative_time_conjunctions
    - place
    - past_perfect
    - synthesis_dialogue
    - storytelling_reading
    - narrative_production
