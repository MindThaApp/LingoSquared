schema_version: "1.0"
pack_key: practice.en-nl.a1.unit30
source_language: en
target_language: nl
unit_content_key: nl.a1.unit30.appearance
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-09 by the practice-template depth-closing pass
    (same pass as a1_unit29.yaml -- see that file's review.notes for the
    full manifest-gap context). This file covers unit30 (describing
    physical appearance). Extended scripts/backfill_lexemes_en_nl.py with 6
    new semantic tags scoped to this unit's own real vocabulary
    (hair_color_adj: 4-member bare-form pool blond/bruin/grijs/zwart
    -- reusing unit20's already-classified 'zwart' -- verified safe in
    'Lotte heeft lang {item} haar.'; eye_color_adj: 3-member INFLECTED -e
    pool blauwe/bruine/groene, since 'ogen' is plural and takes agreement
    per this unit's own ogen_agreement_note -- reuses unit13's already-
    classified 'blauwe' -- verified safe in 'Lotte heeft {item} ogen.';
    height_adj/age_adj: 2-member lang/klein and oud/jong, kept OUT of
    multiple_choice/listen_select per this unit's own realization file's
    explicit review.notes warning -- blanking either pair directly is
    genuinely ambiguous with no in-frame disambiguation -- translation/
    word_order only, where the English side always disambiguates which
    word is meant; appearance_ogen_single/appearance_eruit_single:
    single-member tags, the latter reusing unit10's already-classified
    'eruit' token). Real, live bug caught and fixed while building this:
    a first draft of hair_color_adj/pet_care_verb-style tags casefolded
    the token match (t in {...}), which silently pulled in this unit's own
    capitalized sentence-initial 'Oud' (from its lesson01 grammar note) as
    a case-duplicate second member of age_adj -- fixed with an exact-case
    token check, same convention as this file's existing huisarts_single/
    weekday_pure precedents. Deliberately did NOT build any fill_in_blank
    on the noun 'haar' (hair) itself: that token is already classified as
    the possessive pronoun 'haar' (her, unit05) via nl_part_of_speech's
    exact-token keying, so a noun-POS slot_preset could never resolve to
    it -- baked as literal frame text everywhere instead, matching this
    file's own documented 'zijn'/'werk' homograph precedent, and confirmed
    this doesn't block anything since 'ogen'/'eruit' cover this unit's real
    fill_in_blank content instead. Every generative frame's literal text
    was checked against its own slot's candidate set for self-reference
    (none found). Real course-wide candidate counts verified with a
    standalone lexeme_matches()-replicating harness before writing these
    templates. 17 templates across all 6 lessons: multiple_choice x3,
    listen_select x3, matching_pairs x1 (7-pair hair_color_adj+
    eye_color_adj pool anchored lesson05), fill_in_blank x2 (both
    single-candidate), word_order x3, translation x5. Needs the standard
    fresh-context review before import. Blocking dependency, same as every
    other en-nl pack: backfill_lexemes_en_nl.py has not actually been run
    against a real database yet."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [hair_color_adj, eye_color_adj, height_adj, age_adj, appearance_ogen_single, appearance_eruit_single]
slot_presets:
  hair_color_adj: &hair_color_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: hair_color_adj}}
  eye_color_adj: &eye_color_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: eye_color_adj}}
  height_adj: &height_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: height_adj}}
  age_adj: &age_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: age_adj}}
  appearance_ogen_single: &appearance_ogen_single {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: appearance_ogen_single}}
  appearance_eruit_single: &appearance_eruit_single {language_code: nl, part_of_speech: adverb, agreement_tags: {semantic: appearance_eruit_single}}
