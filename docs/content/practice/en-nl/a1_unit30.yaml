schema_version: "1.0"
pack_key: practice.en-nl.a1.unit30
source_language: en
target_language: nl
unit_content_key: nl.a1.unit30.appearance
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-09 by the practice-template depth-closing pass
    (same pass as a1_unit29.yaml -- see that file's review.notes for the
    full manifest-gap context). This file covers unit30 (describing
    physical appearance). Extended scripts/backfill_lexemes_en_nl.py with 6
    new semantic tags scoped to this unit's own real vocabulary
    (hair_color_adj: 4-member bare-form pool blond/bruin/grijs/zwart
    -- reusing unit20's already-classified 'zwart' -- verified safe in
    'Lotte heeft lang {item} haar.'; eye_color_adj: 3-member INFLECTED -e
    pool blauwe/bruine/groene, since 'ogen' is plural and takes agreement
    per this unit's own ogen_agreement_note -- reuses unit13's already-
    classified 'blauwe' -- verified safe in 'Lotte heeft {item} ogen.';
    height_adj/age_adj: 2-member lang/klein and oud/jong, kept OUT of
    multiple_choice/listen_select per this unit's own realization file's
    explicit review.notes warning -- blanking either pair directly is
    genuinely ambiguous with no in-frame disambiguation -- translation/
    word_order only, where the English side always disambiguates which
    word is meant; appearance_ogen_single/appearance_eruit_single:
    single-member tags, the latter reusing unit10's already-classified
    'eruit' token). Real, live bug caught and fixed while building this:
    a first draft of hair_color_adj/pet_care_verb-style tags casefolded
    the token match (t in {...}), which silently pulled in this unit's own
    capitalized sentence-initial 'Oud' (from its lesson01 grammar note) as
    a case-duplicate second member of age_adj -- fixed with an exact-case
    token check, same convention as this file's existing huisarts_single/
    weekday_pure precedents. Deliberately did NOT build any fill_in_blank
    on the noun 'haar' (hair) itself: that token is already classified as
    the possessive pronoun 'haar' (her, unit05) via nl_part_of_speech's
    exact-token keying, so a noun-POS slot_preset could never resolve to
    it -- baked as literal frame text everywhere instead, matching this
    file's own documented 'zijn'/'werk' homograph precedent, and confirmed
    this doesn't block anything since 'ogen'/'eruit' cover this unit's real
    fill_in_blank content instead. Every generative frame's literal text
    was checked against its own slot's candidate set for self-reference
    (none found). Real course-wide candidate counts verified with a
    standalone lexeme_matches()-replicating harness before writing these
    templates. 17 templates across all 6 lessons: multiple_choice x3,
    listen_select x3, matching_pairs x1 (7-pair hair_color_adj+
    eye_color_adj pool anchored lesson05), fill_in_blank x2 (both
    single-candidate), word_order x3, translation x5. Needs the standard
    fresh-context review before import. Blocking dependency, same as every
    other en-nl pack: backfill_lexemes_en_nl.py has not actually been run
    against a real database yet.

    REAUTH 2026-07-24 (unit-scope DEAD/FLOOR fix pass, pack-only, no
    backfill/realization edits): every course-wide candidate count this
    file's original notes cite (hair_color_adj 4-member incl. unit20's
    zwart; eye_color_adj 3-member incl. unit13's blauwe; appearance_eruit_
    single via unit10's eruit) is course-scoped, not unit-scoped, and
    generate_checkpoint() only loads THIS unit's own lexemes -- so all
    three were silently invisible at checkpoint time. scripts/
    _practice_unit_scope_check.py confirmed: (1) lesson03.fill.005's
    appearance_eruit_single had 0 unit-scoped candidates (eruit is
    unit10/unit76 vocabulary only) -- re-anchored to appearance_ogen_single
    (ogen IS this unit's own lesson03 token) with a new sentence, 'Nina
    heeft bruine {item}.', distinct from fill.004's existing 'Lotte heeft
    blauwe {item}.' on the same anchor. (2) lesson05.match.001's declared
    4-slot hair_color_adj group had only 3 unit-scoped tokens
    (blond/bruin/grijs -- zwart is unit20) -- the checker's single-slot
    scan doesn't separately re-verify the template's second group, but by
    hand the 3-slot eye_color_adj group was ALSO short (bruine/groene only,
    2 unit-scoped tokens -- blauwe is unit13), so the whole 7-pair
    two-group design could never fill either relation from this unit's own
    vocabulary. Replaced it with a single uniform 6-pair matching_pairs
    over a new `appearance_adj` preset (part_of_speech: adjective, no
    semantic tag -- SS3.1c: safe here since the frame is a bare
    dot-separated placeholder list with no literal text to be
    ungrammatical against), which pools all 11 of this unit's own
    adjectives (lang/jong/Oud/blond/bruin/grijs/groen/bruine/groene/
    anders/langer) course-wide moot since matching_pairs has no
    course-scope grammaticality requirement; checked for gloss collapse --
    all 11 have distinct english_gloss text, including the
    inflected/bare pairs (bruin \"brown\"/bruine \"brown (inflected)\",
    groen \"green\"/groene \"green (inflected)\"), which is the same
    accepted singular/plural-style discrimination the original author
    already relied on for bruin+bruine coexisting in one pool. (3) three
    multiple_choice/listen_select templates constrained to eye_color_adj
    alone (lesson03.choose.001, lesson03.listen.002, lesson04.choose.002)
    were below the 3-distinct floor at unit scope (bruine/groene only, 2
    distinct glosses) -- widened all three to a new `hair_or_eye_color_adj`
    preset unioning the two ALREADY-LISTED semantic tags (SS3.1a), which
    pools blond/bruin/grijs/bruine/groene = 5 unit-scoped distinct glosses,
    and updated their feedback_frame text from 'is an eye-color word' to
    'is a hair- or eye-color word' since the pool is no longer eye-only.
    Removed the now-unused appearance_eruit_single preset and its
    tag_schema entry (no template references it anymore); left
    hair_color_adj/eye_color_adj/height_adj/age_adj/appearance_ogen_single
    untouched, including their narrow standalone uses in lesson01/lesson02
    translation/word_order templates, which have no candidate floor and
    were already unit-scope-satisfiable (lang x1, jong x1). Post-fix: 0
    DEAD, 0 FLOOR for this pack.

    POLISH 2026-07-24 (POS-only matching_pairs pass): the REAUTH's
    appearance_adj preset (part_of_speech: adjective, no semantic tag) was
    unit-safe but pooled all 193 course-wide adjectives at Endless-Practice
    COURSE scope (off-theme pairs). Replaced with a semantic union of the
    pack's own four already-declared tags (hair_color_adj/eye_color_adj/
    height_adj/age_adj): 7 distinct unit-scope tokens (blond/bruin/grijs/
    bruine/groene/lang/jong, 7 distinct glosses) >= 6 slots, and the
    course-scope pool adds only the 4 on-theme appearance adjectives from
    sibling units (zwart/blauwe/klein/oud). Removed the now-unused
    appearance_adj preset."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [hair_color_adj, eye_color_adj, height_adj, age_adj, appearance_ogen_single]
slot_presets:
  hair_color_adj: &hair_color_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: hair_color_adj}}
  eye_color_adj: &eye_color_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: eye_color_adj}}
  height_adj: &height_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: height_adj}}
  age_adj: &age_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: age_adj}}
  appearance_ogen_single: &appearance_ogen_single {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: appearance_ogen_single}}
  appearance_union_adj: &appearance_union_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: [hair_color_adj, eye_color_adj, height_adj, age_adj]}}
  hair_or_eye_color_adj: &hair_or_eye_color_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: [hair_color_adj, eye_color_adj]}}
templates:
  - content_key: practice.en-nl.nl.a1.unit30.lesson01.translate.001
    lesson_content_key: nl.a1.unit30.lesson01.lang_klein_oud_jong
    type: translation
    frame:
      text: "He is {item}."
