schema_version: '1.0'
pack_key: practice.en-nl.a1.unit64
source_language: en
target_language: nl
unit_content_key: nl.a1.unit64.voetbalwedstrijd
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. THIN
    vocabulary unit: only 12 lexemes total across the unit (lesson01 x3,
    lesson02 x2, lesson03 x2, lesson04 x3, lesson06 x2); lesson05
    (bij_de_kassa_van_het_stadion, a dialogue-only lesson) has ZERO
    classified lexemes and therefore CANNOT be represented in the checkpoint
    -- excluded, not an oversight. Used the union broad tag
    `voetbalwedstrijd_vocab` (12 distinct tokens: stadion, supporter,
    vanavond, team, speler, doelpunt, stand, scorebord, thuisteam, uitteam,
    winnaar, pretpark -- all glosses read against the realization and
    confirmed correct, no mis-glosses found) for every multiple_choice,
    translation, listen_select and matching_pairs slot, anchored per-lesson
    per §8's vocabulary-unit breadth pattern. Only single-member anchor
    available is `voetbalwedstrijd_scorebord_single` (scorebord, lesson04),
    used for both the fill_in_blank and the word_order template with two
    different literal frames; both frames' literal words (Ik/lees/het/bij/de/
    ingang) were checked and are not candidate values of the scorebord_single
    slot at any scope. 15 templates, all 5 lexeme-bearing lessons covered by
    both multiple_choice and translation; matching_pairs anchored to
    lesson02 and lesson06 (broad tag, 6 pairs each, all distinct glosses,
    no case-duplicates). Recognition 6 (5 MC + 1 listen_select), structured
    4 (2 matching_pairs + 1 fill_in_blank + 1 word_order), production 5
    (translation). Needs standard fresh-context review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - voetbalwedstrijd_vocab
    - voetbalwedstrijd_scorebord_single
templates:

