    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a verb from Omar's routine.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson06.listen.001
    lesson_content_key: nl.a1.unit10.lesson06.een_dag_bij_het_taalcafe
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the verb you heard in this dialogue.", language_code: en, direction: ltr}
