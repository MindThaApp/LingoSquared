schema_version: "1.0"
pack_key: practice.en-nl.a1.unit10
source_language: en
target_language: nl
unit_content_key: nl.a1.unit10.routines
review:
  status: reviewed
  required_next_reviewer: null
  fresh_context: "false"
  notes: >-
    Original authoring notes (2026-07-06): 7-member "routine_verb_infinitive"
    tag (opstaan/aankleden/ontbijten/werken/eten/afwassen/slapen) used ONLY
    for bare-word recognition, since each verb's conjugated ik-form is
    irregular/separable and no shared generative sentence frame exists
    across all seven. 3-member "sequence_word" tag (eerst/dan/daarna)
    translation-only (below the >=4 recognition threshold).

    Independent fresh-context content audit (2026-07-06): confirmed all 6
    lesson_content_key references match real nl.a1.unit10 lessons exactly.
    Standalone lexeme_matches()-replicating harness confirms real candidate
    counts: routine_verb_infinitive=7 (all lowercase bare infinitives, no
    capitalization or homograph contamination), sequence_word=6 (3 lexical
    forms + 3 capitalized sentence-initial variants, translation-only so
    the capitalization difference is harmless -- each is a standalone
    single-word answer, not embedded in a larger frame). Hand-read every
    possible filler for every template: the 7 routine-verb translations each
    render a coherent standalone English gloss ("to get up"/"to get
    dressed"/etc.), and the sequence_word translations are correctly
    isolated ("first"/"then"/"after that", plus capitalized variants). No
    template combines two slots or embeds a slot inside a larger fixed
    frame, so the "no shared frame across separable/irregular verbs" design
    claim holds -- verified independently, not just trusted from the
    authoring notes. No self-reference, no capitalization leaks in a
    frame-embedded context, no jargon leaks, no stray YAML booleans.
    Compiler validation re-run together with units 01-13: 0 errors/0
    warnings.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [routine_verb_infinitive, sequence_word]
slot_presets:
  routine_verb_infinitive: &routine_verb_infinitive {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: routine_verb_infinitive}}
  sequence_word: &sequence_word {language_code: nl, part_of_speech: [adverb, particle], agreement_tags: {semantic: sequence_word}}
templates:
  - content_key: practice.en-nl.nl.a1.unit10.lesson01.choose.001
    lesson_content_key: nl.a1.unit10.lesson01.dagelijkse_activiteiten
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a daily-routine verb from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson01.listen.002
    lesson_content_key: nl.a1.unit10.lesson01.dagelijkse_activiteiten
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the verb you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson01.match.003
    lesson_content_key: nl.a1.unit10.lesson01.dagelijkse_activiteiten
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth} · {seventh}", language_code: nl, direction: ltr}
    slots: {first: *routine_verb_infinitive, second: *routine_verb_infinitive, third: *routine_verb_infinitive, fourth: *routine_verb_infinitive, fifth: *routine_verb_infinitive, sixth: *routine_verb_infinitive, seventh: *routine_verb_infinitive}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth, seventh]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth, seventh]}
    feedback_frame: {text: "Match each routine verb with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson01.translate.004
    lesson_content_key: nl.a1.unit10.lesson01.dagelijkse_activiteiten
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson02.listen.001
    lesson_content_key: nl.a1.unit10.lesson02.scheidbare_werkwoorden
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the verb you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson02.translate.002
    lesson_content_key: nl.a1.unit10.lesson02.scheidbare_werkwoorden
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson03.choose.001
    lesson_content_key: nl.a1.unit10.lesson03.activiteiten_en_tijden
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a daily-routine verb from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson04.translate.001
    lesson_content_key: nl.a1.unit10.lesson04.eerst_dan_daarna
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *sequence_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson04.reverse_translate.002
    lesson_content_key: nl.a1.unit10.lesson04.eerst_dan_daarna
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *sequence_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson05.choose.001
    lesson_content_key: nl.a1.unit10.lesson05.omars_routine_lezen
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
