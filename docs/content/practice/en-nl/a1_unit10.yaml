schema_version: "1.0"
pack_key: practice.en-nl.a1.unit10
source_language: en
target_language: nl
unit_content_key: nl.a1.unit10.routines
review:
  status: unreviewed
  required_next_reviewer: null
  fresh_context: "false"
  notes: >-
    Original authoring notes (2026-07-06): 7-member "routine_verb_infinitive"
    tag (opstaan/aankleden/ontbijten/werken/eten/afwassen/slapen) used ONLY
    for bare-word recognition, since each verb's conjugated ik-form is
    irregular/separable and no shared generative sentence frame exists
    across all seven. 3-member "sequence_word" tag (eerst/dan/daarna)
    translation-only (below the >=4 recognition threshold).

    Independent fresh-context content audit (2026-07-06): confirmed all 6
    lesson_content_key references match real nl.a1.unit10 lessons exactly.
    Standalone lexeme_matches()-replicating harness confirms real candidate
    counts: routine_verb_infinitive=7 (all lowercase bare infinitives, no
    capitalization or homograph contamination), sequence_word=6 (3 lexical
    forms + 3 capitalized sentence-initial variants, translation-only so
    the capitalization difference is harmless -- each is a standalone
    single-word answer, not embedded in a larger frame). Hand-read every
    possible filler for every template: the 7 routine-verb translations each
    render a coherent standalone English gloss ("to get up"/"to get
    dressed"/etc.), and the sequence_word translations are correctly
    isolated ("first"/"then"/"after that", plus capitalized variants). No
    template combines two slots or embeds a slot inside a larger fixed
    frame, so the "no shared frame across separable/irregular verbs" design
    claim holds -- verified independently, not just trusted from the
    authoring notes. No self-reference, no capitalization leaks in a
    frame-embedded context, no jargon leaks, no stray YAML booleans.
    Compiler validation re-run together with units 01-13: 0 errors/0
    warnings.

    **Fixed 2026-07-07 (Dutch live-QA pass)**: the 2026-07-06 audit's "all 6
    lesson_content_key references match real lessons" check confirmed the
    keys EXIST but missed that lesson05 (`omars_routine_lezen`) introduces
    ZERO new lexemes (every token in it -- the full routine narration --
    was already taught by lessons 01-04), so no Lexeme row is ever created
    with that lesson as provenance and `_practice_lesson_id()` could never
    resolve it -- confirmed via `scripts/backfill_lexemes_en_nl.py`'s own
    classification (the key never appears as any spec's
    `lesson_content_key`). Same root cause/fix pattern as the fa-en unit23
    `what_do_you_do` fix from earlier this session. Repointed `choose.001`
    (routine_verb_infinitive tag) to `lesson03.activiteiten_en_tijden`, the
    closest earlier lesson already proven to resolve for the same tag (used
    by that lesson's own template above) -- a safe, no-forward-reference
    anchor.

    **Re-authoring fix, 2026-07-24 (unit-scope DEAD-template pass)**: the
    "routine_verb_infinitive=7 (all lowercase bare infinitives, no ...
    homograph contamination)" candidate count above was measured without
    isolating provenance by unit -- `eten` (the 7th verb in the claimed
    opstaan/aankleden/ontbijten/werken/eten/afwassen/slapen set) is a real
    homograph collision (defect 1.29/§0.1 class, not sense-related here but
    provenance-related): `eten`'s canonical `iter_specs()` lexeme record is
    classified under `nl.a1.unit06.lesson04.wat_wilt_u` (already introduced
    there for food-ordering), so `routine_verb_infinitive` has only 6
    unit10-scoped members (opstaan/aankleden/ontbijten/werken/afwassen/
    slapen), not 7. `lesson01.match.003` declared 7 slots against a
    6-member unit-scoped pool and could never generate at checkpoint scope.
    Fixed by reducing the template to 6 slots (first..sixth), matching the
    real unit-scoped pool exactly at the 6-pair floor. `eten` remains a
    valid member of the tag for Endless Practice (course scope still
    includes it) and for this pack's other `routine_verb_infinitive`
    templates (choose/listen/translate), none of which were flagged --
    they all only need >=1 (translation) or >=3 (MC/listen) candidates,
    comfortably met by the 6 that remain even before counting `eten`.

    **Tier-polish, 2026-07-24 (wave 2, tier-thinness pass)**: structured
    tier had only 1 live template (lesson01.match.003). A shared word_order
    frame remains impossible here (the separable/reflexive ik-forms need
    op/me aan/af, per the original design note), and a sequence-word
    word_order allows valid alternative orders ("ik ontbijt daarna") that
    would grade wrong -- so both additions are fill_in_blank on the unit's
    own hero sentences instead: lesson04.fill.003 blanks the third opener
    of the taught sequence "Eerst sta ik op. Dan kleed ik me aan. {item}
    ontbijt ik." (slot pinned to `drukkeweek_daarna_single` = daarna/Daarna,
    two case-variant tokens course-wide, hence interchangeable: true --
    genuinely the same word, and practice grading casefolds anyway; the
    eerst->dan context forces daarna specifically, so no eerst/dan
    ambiguity); lesson06.fill.002 blanks eruit in the realization's own
    "Hoe ziet jouw dag eruit?" (slot pinned to `appearance_eruit_single`,
    exactly 1 distinct course-wide token, deterministic). tag_schema
    extended with both singleton tags. Structured tier now 3 live.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [routine_verb_infinitive, sequence_word, drukkeweek_daarna_single, appearance_eruit_single]
slot_presets:
  routine_verb_infinitive: &routine_verb_infinitive {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: routine_verb_infinitive}}
  sequence_word: &sequence_word {language_code: nl, part_of_speech: [adverb, particle], agreement_tags: {semantic: sequence_word}}
templates:
  - content_key: practice.en-nl.nl.a1.unit10.lesson01.choose.001
    lesson_content_key: nl.a1.unit10.lesson01.dagelijkse_activiteiten
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a daily-routine verb from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson01.listen.002
    lesson_content_key: nl.a1.unit10.lesson01.dagelijkse_activiteiten
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the verb you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson01.match.003
    lesson_content_key: nl.a1.unit10.lesson01.dagelijkse_activiteiten
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: nl, direction: ltr}
    slots: {first: *routine_verb_infinitive, second: *routine_verb_infinitive, third: *routine_verb_infinitive, fourth: *routine_verb_infinitive, fifth: *routine_verb_infinitive, sixth: *routine_verb_infinitive}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each routine verb with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson01.translate.004
    lesson_content_key: nl.a1.unit10.lesson01.dagelijkse_activiteiten
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson02.listen.001
    lesson_content_key: nl.a1.unit10.lesson02.scheidbare_werkwoorden
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the verb you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson02.translate.002
    lesson_content_key: nl.a1.unit10.lesson02.scheidbare_werkwoorden
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson03.choose.001
    lesson_content_key: nl.a1.unit10.lesson03.activiteiten_en_tijden
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a daily-routine verb from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson04.translate.001
    lesson_content_key: nl.a1.unit10.lesson04.eerst_dan_daarna
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *sequence_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson04.reverse_translate.002
    lesson_content_key: nl.a1.unit10.lesson04.eerst_dan_daarna
    type: translation
    frame: {text: "{item}", language_code: nl, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *sequence_word}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "De Engelse vertaling is {item}.", language_code: nl, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson04.fill.003
    lesson_content_key: nl.a1.unit10.lesson04.eerst_dan_daarna
    type: fill_in_blank
    frame:
      text: "Eerst sta ik op. Dan kleed ik me aan. {item} ontbijt ik."
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Complete the Dutch sentence.", language_code: en, direction: ltr}
    slots:
      item: {language_code: nl, part_of_speech: adverb, agreement_tags: {semantic: drukkeweek_daarna_single}}
    answer_derivation: {kind: slot_text, slot: item, interchangeable: true}
    feedback_frame: {text: "After eerst and dan, {item} introduces the next step, and the verb stays before ik.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson05.choose.001
    lesson_content_key: nl.a1.unit10.lesson03.activiteiten_en_tijden
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a verb from Omar's routine.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson06.listen.001
    lesson_content_key: nl.a1.unit10.lesson06.een_dag_bij_het_taalcafe
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *routine_verb_infinitive}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the verb you heard in this dialogue.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit10.lesson06.fill.002
    lesson_content_key: nl.a1.unit10.lesson06.een_dag_bij_het_taalcafe
    type: fill_in_blank
    frame:
      text: "Hoe ziet jouw dag {item}?"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Complete the Dutch question.", language_code: en, direction: ltr}
    slots:
      item: {language_code: nl, part_of_speech: adverb, agreement_tags: {semantic: appearance_eruit_single}}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "{item} completes the phrase ziet ... eruit, which asks what something looks like.", language_code: en, direction: ltr}
