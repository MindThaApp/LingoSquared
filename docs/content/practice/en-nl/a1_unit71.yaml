schema_version: '1.0'
pack_key: practice.en-nl.a1.unit71
source_language: en
target_language: nl
unit_content_key: nl.a1.unit71.boekwinkel
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-07-23 per docs/content/PRACTICE_PACK_RECIPE.md, en-nl batch
    en-nl_05. Unit71 (boekwinkel / bookshop, A1 volume batch) is a THIN unit: 8
    lexemes total (roman, titel, schrijver, bekend, kinderboek, kinderboeken,
    bladwijzer, dierenwinkel), measured with the recipe's
    f'.{LEVEL}.{UNIT}.' filter. **lesson01 (zullen_we_naar_de_boekwinkel_gaan)
    has ZERO classified lexemes** in backfill_lexemes_en_nl for this unit (its
    tokens "boekwinkel"/"boek" resolve to earlier-unit provenance) -- per DO-NOT
    #8 it is NOT anchored by any template here. Lessons 02-06 all have >=1
    lexeme and are anchored.


    Same §8.1 grammar-unit pattern as unit70/72 in this batch: every
    multiple_choice/listen_select/translation/matching_pairs slot uses the
    unioned semantic:boekwinkel_vocab tag (noun/verb/adjective for
    choose/listen/translate; noun-only for matching_pairs), anchored per-lesson
    via lesson_content_key but pooling the unit's full 8-token vocabulary. Only
    bare-item/bare-pair frames use this broad tag, so the tag's much wider
    COURSE-scope pool (function words like "is"/"hebt" that also carry
    boekwinkel_vocab from other units, since the checker showed the tag is not
    exclusively unit-local at the semantic-value level even though the
    UNIT-anchored Lexeme provenance is) never touches a literal-sentence
    frame.


    15 templates, 5/5 lexeme-bearing lessons, all 3 tiers (recognition 6 [5
    choose + 1 listen_select], structured 4 [2 matching_pairs + 1 word_order +
    1 fill_in_blank], production 5 [bare-word translation]). word_order and
    fill_in_blank both use the single-member anchor tag
    boekwinkel_bladwijzer_single (exactly 1 course-wide candidate:
    "bladwijzer"), so both are course-scope-safe by construction; their
    frames ("Ik gebruik een {item} in het boek." / "De {item} ligt in het
    boek.") are original but grammatically straightforward NL sentences built
    around the single anchor noun (de-word), not lifted verbatim from the
    realization (which does not narrate a bladwijzer sentence directly, only
    lists it in a matching_pairs card).


    No mis-glossed lexeme found (all 8 glosses read correctly against the
    realization; "bekend" = well-known matches the counter-staff description
    context, not a stale sense). THIN UNIT flag: only 8 base tokens across 5
    represented lessons -- authored to full pool capacity, not padded, per HARD
    RULE #3. lesson01 is unrepresentable in the checkpoint regardless of
    pack content; flagging for the coordinator to route a
    backfill_lexemes_en_nl extension if lesson01 coverage is wanted.


    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all
    templates against unit- and course-scoped pools (practice_dump), glosses,
    frames, distractor overlap, matching confusability, booleans and jargon.
    Fixed: lesson06.fill.003 frame 'De {item} ligt in het boek.' used 'ligt',
    never introduced in any en-nl A1 unit -- replaced with the lesson06 taught
    example 'Omar heeft een boek met een {item}.' (feedback updated); 5
    multiple_choice feedback frames ('...belongs to this unit's bookshop
    vocabulary.') false at course scope -- changed to 'The Dutch word is
    {item}.'; 2 matching_pairs feedback frames neutralised to 'Match each word
    with its English meaning.'. Deferred (systemic, not fixable in-pack): bare-
    word translation glosses carry the English article ('the flower') while the
    single accepted answer is the bare token (bloem), so a learner typing 'de
    bloem' is graded wrong; needs an engine-side article tolerance or a gloss
    convention change. No native-judgment flags.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - boekwinkel_vocab
    - boekwinkel_bladwijzer_single
