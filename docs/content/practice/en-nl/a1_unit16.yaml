schema_version: "1.0"
pack_key: practice.en-nl.a1.unit16
source_language: en
target_language: nl
unit_content_key: nl.a1.unit16.health
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-06 by the Claude session syncing Endless Practice
    template pools to lesson content growth (en-nl lane, continuing after
    unit15). This unit (unit16) covers describing a basic health problem:
    symptoms, asking what's wrong, a pharmacy visit, and reading advice.
    Extended scripts/backfill_lexemes_en_nl.py's UNIT_FILES numeric-range
    filter to <=16 and added 37 new Dutch token classifications. The core
    grammar point (the real content's own explicit zijn_note lesson) is
    that symptom NOUNS take hebben ('Ik heb hoofdpijn.') while symptom
    ADJECTIVES take zijn ('Ik ben ziek.') -- these two tags must NEVER be
    mixed (mixing would generate 'Ik heb ziek.'/'Ik ben hoofdpijn.', both
    ungrammatical), same discipline as unit12's hebben/zijn perfect-tense
    split earlier this session. Added a 4-member 'symptom_hebben' tag
    (hoofdpijn/buikpijn/keelpijn/koorts, 5 real candidates counting a
    capitalized label variant) for 'Ik heb {item}.' plus bare-word
    recognition, and a 2-member 'symptom_zijn' tag (ziek/verkouden, 3 real
    candidates) for 'Ik ben {item}.', kept out of multiple_choice/
    listen_select since it doesn't clear the >=4 threshold. Every slot's
    real candidate count was verified with a standalone
    lexeme_matches()-replicating harness against this script's actual
    output. Needs the standard fresh-context review before import. Same
    blocking dependency as every earlier en-nl pack: backfill_lexemes_en_nl.py
    has not actually been run against a real database yet.

    2026-07-24 tier-thinness polish pass (production tier had only 1 live
    template): added two bare-word translations -- lesson02.translate.003
    over symptom_hebben_pure (4 unit tokens, zero course-scope extras)
    and lesson04.translate.002 over the pharmacy_visit tag narrowed to
    nouns (3 unit tokens: apotheek/hoofdpijn/tablet; course scope adds 8
    sensible nouns like apotheker/pijnstillers/tabletten, all safe as
    varied bare-word prompts). Note the lesson01.match.003 matching_pairs
    stays at 4 pairs: the unit has only 4 clean symptom nouns, and every
    widening union (symptom_zijn brings the ziek/Ziek case-duplicate,
    fever_cold brings grammar-jargon adjectives like 'bijvoeglijke') would
    put confusable or off-theme cards in the exercise -- honest-thin by
    the polish rubric, not fixable pack-side."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [symptom_hebben, symptom_hebben_pure, symptom_zijn, pharmacy_visit]
slot_presets:
  symptom_hebben: &symptom_hebben {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: symptom_hebben}}
  # symptom_hebben_pure: exact-case (no capitalized "Koorts" duplicate),
  # safe for matching_pairs -- see scripts/backfill_lexemes_en_nl.py's
  # symptom_hebben_pure comment. This file's OTHER templates below keep
  # using the plain "symptom_hebben" tag unchanged.
  symptom_hebben_pure: &symptom_hebben_pure {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: symptom_hebben_pure}}
  symptom_zijn: &symptom_zijn {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: symptom_zijn}}
  pharmacy_noun: &pharmacy_noun {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: pharmacy_visit}}
templates:
  - content_key: practice.en-nl.nl.a1.unit16.lesson01.order.001
    lesson_content_key: nl.a1.unit16.lesson01.niet_lekker_voelen
    type: word_order
    frame: {text: "Ik heb {item}.", language_code: nl, direction: ltr}
    slots: {item: *symptom_hebben}
    answer_derivation: {kind: render_frame, frame: {text: "Ik heb {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the symptom in this sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit16.lesson01.match.003
    lesson_content_key: nl.a1.unit16.lesson01.niet_lekker_voelen
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth}", language_code: nl, direction: ltr}
    slots: {first: *symptom_hebben_pure, second: *symptom_hebben_pure, third: *symptom_hebben_pure, fourth: *symptom_hebben_pure}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "Match each symptom word with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit16.lesson02.choose.001
    lesson_content_key: nl.a1.unit16.lesson02.wat_scheelt_eraan
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *symptom_hebben}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a symptom from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit16.lesson02.listen.002
    lesson_content_key: nl.a1.unit16.lesson02.wat_scheelt_eraan
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *symptom_hebben}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit16.lesson02.translate.003
    lesson_content_key: nl.a1.unit16.lesson02.wat_scheelt_eraan
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *symptom_hebben_pure}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit16.lesson03.order.001
    lesson_content_key: nl.a1.unit16.lesson03.koorts_en_verkouden
    type: word_order
    frame: {text: "Ik ben {item}.", language_code: nl, direction: ltr}
    slots: {item: *symptom_zijn}
    answer_derivation: {kind: render_frame, frame: {text: "Ik ben {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the condition in this sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit16.lesson03.translate.003
    lesson_content_key: nl.a1.unit16.lesson03.koorts_en_verkouden
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *symptom_zijn}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
