schema_version: '1.0'
pack_key: practice.en-nl.c1.unit08
source_language: en
target_language: nl
unit_content_key: nl.c1.unit08.retorisch_overtuigen
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md (§8.1 grammar/discourse-unit
    pattern) for the en-nl C1 unit08 (Retorisch overtuigen) checkpoint. 21 templates over
    all 5 lessons that have lexemes (lesson06 volledig_appel has zero unit-provenance lexemes
    and cannot host a template): multiple_choice x5 (recognition); matching_pairs x2 + word_order
    x6 + fill_in_blank x3 (structured); bare-word translation x5 (production). Recognition
    and production slots are anchored one lesson each but pool that lesson''s c1u08_<lesson>
    tag narrowed by part_of_speech [noun, verb, adjective] (+adverb for lessons 03 and 05)
    so pronouns/particles/prepositions stay out. Lesson04 MC/translation deliberately EXCLUDE
    adverbs: at course scope the c1u08_intensiteit_sturen tag also carries misschien ("maybe")
    and wellicht ("perhaps; possibly"), which are interchangeable glosses. Structured tier
    puts the unit''s hero rhetoric in the frame (van ... een parkeerterrein maken; Ik doe
    een beroep op iedereen; Juist daarom mogen we dit terrein niet opgeven; De groenstrook
    verdient onze steun; Het groen is wel degelijk van waarde; Je kunt je standpunt verzachten
    of versterken; Niet alleen voor onze kinderen, maar ook voor ons allemaal; De oproep vraagt
    het publiek om te handelen; Kom naar de buurtbijeenkomst en stem voor het behoud van het
    groen), each over a single-member c1u08_*_single anchor (1 course-scope candidate each,
    none a literal word of its own frame). The two matching_pairs use curated groups c1u08_match_nouns
    (15 nouns) and c1u08_match_verbs (13 verbs) chosen to avoid confusable glosses (left out:
    appel/beroep/oproep, einde/slot, toespraak/betoog, groen/groenstrook, sterker/krachtiger,
    doe/doet/doen, alle/allemaal). New tags (all c1u08_*) come from the scratch tags.json
    the coordinator merges into NL_C1_EXTRA_TAGS. Measured (c1_measure.py cap, .c1.unit08.
    filter): ALL 63/65 (97%), recognition 95%, structured 49%, production 95%, 5/5 lessons
    in every tier; the 2 unhosted lexemes are the pronouns ons/onze. Course-scope pools of
    the bare-word translation slots: 25/20/26/13/20 candidates, glosses read by hand for interchangeable
    pairs. REVIEWER, double-check: (1) doe carries "do (with je)" but the unit uses it as
    "Ik doe een beroep" (with ik) -- the form is still correct, gloss is incomplete, not excluded;
    (2) herken carries "recognize (with ik)" while the unit uses "herken je" (inverted) --
    same note; (3) stuur (unit03 provenance, in the lesson04 pool at course scope) carries
    "send (with ik)" while unit08 uses sturen = steer -- correct for its own unit, not a learner-facing
    error; (4) beroep''s gloss "the occupation; appeal (in ''een beroep doen op'' = to call
    upon)" sits beside appel "the appeal (rhetorical device)" in the lesson01 MC/translation
    pool -- distinguishable by the parentheticals, but confirm it reads cleanly; (5) sterker
    carries the literal "stronger" though the unit teaches "Sterker nog" (what''s more). Register:
    Omar''s public appeal uses formal u; no frame here needs a second-person pronoun except
    "Je kunt je standpunt ..." which is the realization''s own informal explanatory sentence.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
