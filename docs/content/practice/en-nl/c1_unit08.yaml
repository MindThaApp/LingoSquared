unit_content_key: nl.c1.unit08.retorisch_overtuigen
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md (§8.1 grammar/discourse-unit pattern) for the en-nl C1 unit08 (Retorisch overtuigen) checkpoint. 21 templates over all 5 lessons that have lexemes (lesson06 volledig_appel has zero unit-provenance lexemes and cannot host a template): multiple_choice x5 (recognition); matching_pairs x2 + word_order x9 (structured); bare-word translation x5 (production). No fill_in_blank: the three earlier fill frames (handelen, verzachten, stem) admitted other verbs with no English cue, so they are word_order over the same sentences. MC and translation slots each use a curated per-lesson pool (c1u08_mc_l01..l05, c1u08_tr_l01..l05) containing only this unit''s lexemes, so no other unit''s tokens enter at course scope; pronouns ons/onze are left out (the 2 unhosted lexemes). Translation pools leave out every token whose gloss a common Dutch synonym or variant also answers: buurt (wijk), parkeerterrein (parkeerplaats), plek (plaats), terrein, toespraak (speech/rede), betogende (overtuigende), einde (eind), boodschap (bericht), betoog (argument), allemaal (iedereen/alle), slot (conclusie), steeds, zorgt, beroep and appel (accent, and both answer ''appeal''), degelijk. MC l01 leaves out beroep beside appel. Structured tier puts the unit''s hero rhetoric in the frame (van ... een parkeerterrein maken; Ik doe een beroep op iedereen; Juist daarom mogen we dit terrein niet opgeven; De groenstrook verdient onze steun; Het groen is wel degelijk van waarde; Je kunt je standpunt verzachten of versterken; Niet alleen voor onze kinderen, maar ook voor ons allemaal; De oproep vraagt het publiek om te handelen; Kom naar de buurtbijeenkomst en stem voor het behoud van het groen), each over a single-member c1u08_*_single anchor (1 course-scope candidate each, none a literal word of its own frame, none sentence-initial). The two matching_pairs use curated groups c1u08_match_nouns (15 nouns) and c1u08_match_verbs (13 verbs) chosen to avoid confusable glosses. Gloss fixes for this unit (doe, dezelfde, allemaal, alle, beroep, groen, laten, roept, stem, zorgt, steeds, slot, degelijk, rust, kom, middelen) remove self-quoting Dutch and pin the taught sense; they and the new c1u08_* tags come from scratch json files the coordinator merges into the backfill. MC feedback is neutral (''{item} comes up in this unit''s lesson on ...''), true for every curated member. Measured (c1_measure.py cap): ALL 63/65 (97%), recognition 95%, structured 49%, production 72%, 5/5 lessons in every tier. Register: Omar''s public appeal uses formal u; only ''Je kunt je standpunt ...'' (the realization''s own explanatory sentence) uses je. Fresh-context review 2026-10-10: 20 findings (4 blocker, 16 minor), all addressed (fixed, or the affected token excluded from the pool), confirmed by a pool-level scan.'
