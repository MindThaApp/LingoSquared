schema_version: '1.0'
pack_key: practice.en-nl.b1.unit19
source_language: en
target_language: nl
unit_content_key: nl.b1.unit19.samenvatten_en_navertellen
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: "Fresh-context review 2026-11-27 (en-nl B1 units 12-19 pass): dumped every slot's unit-scope (16 lexemes, 6 lessons) and B1 course-scope pool and read every gloss against the realization; all frames are bare '{item}' or matching_pairs, so defect 1.14 self-reference has no literal frame text to hit (checked by hand, clean) and listen_select cannot leak a frame word. 1 fix - (1) removed adverb from every slot's part_of_speech: the pool held Kort 'in short' (lesson02) next to kort 'short' (lesson04), so a bare-word MC on either could offer the other's gloss as a second correct answer and a matching item could show the two case-variants with swappable glosses; bare Kort does not mean 'in short' on its own (that is kort gezegd), so it is treated as a mis-glossed token and kept out. This also drops nu 'now'. Capacity after the fix: 19 templates, ALL 11/16 (69%), recognition, structured and production 11/16 each, 6/6 lessons in every tier (lesson02 through gezegd), no dead template, MC pool 11 distinct glosses, matching pool 11 tokens; course-scope pool 46 (MC/translation) / 55 (matching). b1_unit_review is kept because it carries lesson06's only lexeme samenvatting. ROUTE (backfill gloss): Kort 'in short' (should fold onto kort or carry 'in short (kort gezegd)'); hoef 'need to (don't need to, with ik)' displays as 'need to' and collides with moeten 'must; need to' at course scope. DEFERRED (systemic): bare-word translation shows the gloss without its bracket note. Earlier notes: Authored against docs/content/PRACTICE_PACK_RECIPE.md as part of the en-nl B1 fill (units 12-19). Every slot unions this unit's own lesson tags so the multiple_choice and matching_pairs floors are met from the unit's own lexemes; translation and multiple_choice use slot_gloss only, with no fixed-sentence frames. Needs the standard fresh-context review before import."
