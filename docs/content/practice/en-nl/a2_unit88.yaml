schema_version: '1.0'
pack_key: practice.en-nl.a2.unit88
source_language: en
target_language: nl
unit_content_key: nl.a2.unit88.wat_kan_ik
review:
  status: unreviewed
  fresh_context: 'false'
  required_next_reviewer: native_speaker_review
  notes: >-
    Authored for the lessons of A2 unit 88 that have backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases are left out. Backfill glosses to double-check: spreken (gloss mentions the separable arrangement sense), Kun/Kunnen/kan near-duplicate can glosses. No word_order: the ability_kunnen pools mix kan, kunnen, kunt and zijn. Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - ability_kunnen_statement
    - ability_kunnen_question
    - modal_contrast_kunnen_willen_moeten
    - modal_plus_infinitive
    - possibility_kan_het
templates:
- content_key: practice.en-nl.nl.a2.unit88.lesson01.choose.001
  lesson_content_key: nl.a2.unit88.lesson01.dit_kan_ik
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [ability_kunnen_statement, ability_kunnen_question, modal_contrast_kunnen_willen_moeten, modal_plus_infinitive, possibility_kan_het]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit88.lesson01.match.002
  lesson_content_key: nl.a2.unit88.lesson01.dit_kan_ik
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit88.lesson01.translate.003
  lesson_content_key: nl.a2.unit88.lesson01.dit_kan_ik
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit88.lesson02.listen.001
