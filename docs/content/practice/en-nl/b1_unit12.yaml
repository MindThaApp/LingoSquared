schema_version: '1.0'
pack_key: practice.en-nl.b1.unit12
source_language: en
target_language: nl
unit_content_key: nl.b1.unit12.voorwaarden
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: "Fresh-context review 2026-11-27 (en-nl B1 units 12-19 pass): dumped every slot's unit-scope (12 lexemes, 5 lessons; lesson06 has none) and B1 course-scope pool and read every gloss against the realization; all frames are bare '{item}' or matching_pairs, so there is no literal frame text for defect 1.14 self-reference (checked by hand, clean) and no listen_select frame word can leak as a distractor. 1 fix - (1) removed b1_unit_review from every slot union: it contributed no unit-scope lexeme (lesson06 carries none) and at course scope pulled in goed='good' beside Goed='good; well', which made a bare-word MC for either token offer a second correct option (also moeten/moet, de/het, dat/Dat). Capacity unchanged: 19 templates, ALL 12/12 (100%), recognition 9/12, structured 12/12, production 9/12, 5/5 lessons in structured and 4/5 in recognition/production (lesson03's only lexeme is the particle tenzij, matchable only), no dead template, MC pool 9 distinct glosses, matching pool 12 tokens. Course-scope pool now 27 (MC/translation) / 34 (matching). NATIVE FLAGS: ga='go' and Ga='Go' are a case-duplicate pair at course scope (harmless under casefolded grading, but they can render as two identical options; a backfill citation fold of Ga onto ga would clear it). Earlier notes: Authored against docs/content/PRACTICE_PACK_RECIPE.md as part of the en-nl B1 fill (units 12-19). Every slot unions this unit's own lesson tags so the multiple_choice and matching_pairs floors are met from the unit's own lexemes; translation and multiple_choice use slot_gloss only, with no fixed-sentence frames. Needs the standard fresh-context review before import."
