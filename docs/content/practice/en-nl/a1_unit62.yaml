review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. en-nl A1
    unit62 (dierentuin / "Een dag naar de dierentuin") has 11 lexemes
    (backfill_lexemes_en_nl.py's auto-generated dierentuin_vocab/
    dierentuin_noun/dierentuin_leeuwenverblijf_single tags). Lesson01 has zero
    introduced_tokens and is correctly NOT anchored (recipe DO-NOT #8);
    lessons 02/03/04/05/06 are all anchored.

    14 templates: multiple_choice x5 + translation bare-word x5 (one of each
    per anchor lesson; dierentuin_vocab pool = leeuw/olifant/aap/giraffe/
    voederen/leeuwen/kaartjes/leeuwenverblijf/rondvaart/waren, 10 distinct
    glosses -- "rondvaart" is the unit's own wrap-up-dialogue forward
    reference to next unit's topic, legitimately taught in this unit's
    lesson06), listen_select x1 (dierentuin_vocab, anchored lesson05, the
    richest lesson), matching_pairs x1 (dierentuin_noun, 6 of the pool's 9
    nouns: leeuw/olifant/aap/giraffe/voederen/leeuwen/kaartjes/
    leeuwenverblijf/rondvaart -- leeuw/leeuwen is the recipe's
    explicitly-acceptable singular/plural discrimination), word_order x1 +
    fill_in_blank x1 on the single-member dierentuin_leeuwenverblijf_single
    anchor, both built around the unit's own taught dialogue line "Om twee
    uur. Bij het leeuwenverblijf."

    Read every gloss (§0.1): all 11 tokens' glosses match what the realization
    teaches ("waren" = "were (with wij/zij, past of zijn)" matches the
    lesson06 wrap-up dialogue). No mis-glosses found.

    §9 step 5 course-scope check: dierentuin_leeuwenverblijf_single is
    generated only for token "leeuwenverblijf" (NL_A1_VOLUME_SINGLE_ANCHORS),
    a direction-wide-unique anchor, so it stays a single course-wide
    candidate in both frames (note: "leeuw"/"leeuwen", the animal noun and
    its plural, are SEPARATE tokens and do not carry this tag). Neither
    "We"/"zien"/"de"/"leeuwen"/"bij"/"het" nor "Bij"/"het"/"is"/"het"/
    "voederen"/"om"/"twee"/"uur" is ever a dierentuin_leeuwenverblijf_single
    candidate (its only member is "leeuwenverblijf" itself, absent from both
    frames' literal text). "leeuwen" and "voederen" are literal words in the
    two frames and ARE dierentuin_vocab/dierentuin_noun candidates elsewhere,
    but that is a different slot -- not a self-reference (§1.1).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): all 14
    templates checked against the real lexeme pools at unit scope (11
    lexemes, 10 dierentuin_vocab) and course scope (dierentuin_vocab 49,
    dierentuin_noun 21, dierentuin_leeuwenverblijf_single 1); every gloss
    read against the realization (voederen = the feeding, waren = were,
    leeuw/leeuwen); both leeuwenverblijf frames are grammatical Dutch built
    from taught tokens (zien, leeuwen, bij het, voederen, om twee uur); no
    self-reference, no confusable matching rights, no booleans or jargon. 0
    defects found.
