  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &buurt_word
      language_code: nl
      part_of_speech: [noun, verb, adjective]
      agreement_tags: {semantic: buurt_vocab}
    second: *buurt_word
    third: *buurt_word
    fourth: *buurt_word
    fifth: *buurt_word
    sixth: *buurt_word
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each Dutch neighbourhood word with its English meaning.
    language_code: en
    direction: ltr

