source_language: en
target_language: nl
unit_content_key: nl.a1.unit54.zwembad
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Vocabulary unit (swimming pool), all 6 lessons have lexemes. MIS-GLOSS FOUND (§0.1): the backfill
    lexeme ''regel'' in lesson05 (de_openingstijden_lezen) carries the gloss ''arrange (with ik, part
    of regelen)'', but the realization actually teaches ''de regel'' = ''the rule'' (''Ik lees de regel.''
    / matching_pairs right: ''rule''). This token does NOT carry the zwembad_vocab tag (its own tags are
    only opening_hours_reading/shopping_complaint_verb), so it is automatically excluded from every pool
    in this pack; flagging for the backfill lane per §0.1/§10#10 rather than silently working around it.
    Recognition/production templates union the remaining unit lesson tags via zwembad_vocab (8 distinct
    content tokens after excluding regel, unit-scoped). matching_pairs (lesson06) picks 6 of the 8 (zwembad,
    kosten, openingstijden, kluisje, sluit, zwemtas), omitting douchen/douche since they are two citation
    forms of the same verb. word_order (''Wilt u ook een {item} huren?'') and fill_in_blank (''Een {item}
    kost één euro.'') both anchor zwembad_kluisje_single (exactly 1 course-wide candidate, verified against
    backfill_lexemes_en_nl), lifted verbatim from the lesson04 dialogue, so both are grammatical and course-scope
    safe by construction. Capacity/coverage measured with the official §9 script; see report.'
