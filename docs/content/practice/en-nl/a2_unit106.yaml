schema_version: '1.0'
pack_key: practice.en-nl.a2.unit106
source_language: en
target_language: nl
unit_content_key: nl.a2.unit106.een_bericht_aan_een_vriend
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 102-108 pass): 1 fix - (1) the shared slot
    dropped preposition from part_of_speech, which removes om and Tot from every pool: om carries
    the backfill gloss "at (a time); around" while this unit teaches om ... te before an infinitive,
    so the gloss shown as the right answer was not the taught sense. Dumped the unit-scope pool (now
    48 of 58 unit lexemes) and the A2 course-scope pool (84) and read every gloss. All 18 templates
    are bare-word, so frame grammaticality and self-reference do not arise. Capacity after the fix:
    6/6 lessons in every tier, 83% coverage per tier, no dead templates, MC and listen pools far
    over 3 glosses, matching pools over 6 tokens. Backfill issues routed for a fix (not editable
    here): om as above; bezoek carries "the visit" while the unit teaches the verb form ik bezoek;
    Gisteren/gisteren, Misschien/misschien, Volgende/volgende and Gezellig/gezellig are case pairs
    of one word (multiple choice folds them, but both can land in one matching exercise), so the
    sentence-initial forms should fold onto the lowercase citation form.
    Authored for the lessons of A2 unit 106 that have backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases are left out.  Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - informal_message_greetings
    - informal_message_what_happened
    - informal_message_plans
    - informal_message_reasons
    - informal_message_reading
    - informal_message_writing
templates:
- content_key: practice.en-nl.nl.a2.unit106.lesson01.choose.001
  lesson_content_key: nl.a2.unit106.lesson01.hoi_lotte_groetjes
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [informal_message_greetings, informal_message_what_happened, informal_message_plans, informal_message_reasons, informal_message_reading, informal_message_writing]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit106.lesson01.match.002
  lesson_content_key: nl.a2.unit106.lesson01.hoi_lotte_groetjes
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit106.lesson01.translate.003
  lesson_content_key: nl.a2.unit106.lesson01.hoi_lotte_groetjes
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit106.lesson02.listen.001
  lesson_content_key: nl.a2.unit106.lesson02.wat_is_er_gebeurd
  type: listen_select
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the meaning of the Dutch word you heard.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit106.lesson02.match.002
  lesson_content_key: nl.a2.unit106.lesson02.wat_is_er_gebeurd
  type: matching_pairs
