schema_version: '1.0'
pack_key: practice.en-nl.b1.unit03
source_language: en
target_language: nl
unit_content_key: nl.b1.unit03.werkoverleg
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md, as part of the en-nl B1 unit01-11
    practice-pack wave that unblocks these units'' checkpoints (the units already had lexemes from scripts/backfill_lexemes_en_nl.py
    but no pack at all, so generate_checkpoint() returned checkpoint_unavailable). 17 templates across
    6 lesson(s) with lexemes: listen_select x1, matching_pairs x3, multiple_choice x4, translation x7,
    word_order x2. Every slot is satisfiable from THIS unit''s own lexemes, because generate_checkpoint()
    calls _material() with only this unit''s lesson ids; slots use the unit''s own per-lesson semantic
    tags (unioned where a single lesson tag could not reach the >=3-option multiple_choice floor or the
    6-token matching_pairs floor), narrowed by part_of_speech to content words so no exercise ever shows
    ''the'' or ''and'' as its answer. Measured with the recipe''s capacity/coverage model against the
    real backfill data: 40 of 52 unit lexemes hostable (77%), recognition 69% / structured 65% / production
    77%, and all three tiers reach 6/6 of the lessons that have lexemes. Distinct-target capacity: recognition
    42, production 42, structured effectively unbounded (matching_pairs combinatorics). 12 of 17 templates
    carry >=5 variants. REVIEWER: lesson02''s word_order anchors on semantic: reported_speech_future (POS
    noun -> ''morgen'', the only B1 noun with that tag) as a single-member anchor. ''Met'' (glossed ''This
    is'', from ''Met vriendelijke groet'') is excluded from every template by part-of-speech (it is a
    preposition). General double-checks for this wave: (a) every word_order/fill_in_blank frame was verified
    against its slot''s whole-B1-course candidate pool, not just the unit pool, so Endless Practice cannot
    render an ungrammatical sentence; (b) no frame''s literal text contains any of its own slot''s candidate
    values (defect 1.14); (c) listen_select frames are bare ''{item}'' so no distractor can be a word
    the audio itself says (defect 1.22); (d) matching_pairs pools were read by hand for interchangeable
    English glosses. Needs the standard fresh-context review before import.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - b1_unit_review
    - meeting_agenda_question
    - meeting_dialogue
    - meeting_email_reading
    - meeting_proposal
    - polite_request_zou_u
    - reported_speech_future
