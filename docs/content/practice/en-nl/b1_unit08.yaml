review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md, as part of the en-nl B1 unit01-11
    practice-pack wave that unblocks these units'' checkpoints (the units already had lexemes from scripts/backfill_lexemes_en_nl.py
    but no pack at all, so generate_checkpoint() returned checkpoint_unavailable). 18 templates across
    6 lesson(s) with lexemes: listen_select x1, matching_pairs x2, multiple_choice x3, translation x7,
    word_order x5. Every slot is satisfiable from THIS unit''s own lexemes, because generate_checkpoint()
    calls _material() with only this unit''s lesson ids; slots use the unit''s own per-lesson semantic
    tags (unioned where a single lesson tag could not reach the >=3-option multiple_choice floor or the
    6-token matching_pairs floor), narrowed by part_of_speech to content words so no exercise ever shows
    ''the'' or ''and'' as its answer. Measured with the recipe''s capacity/coverage model against the
    real backfill data: 17 of 18 unit lexemes hostable (94%), recognition 94% / structured 94% / production
    83%, and all three tiers reach 6/6 of the lessons that have lexemes. Distinct-target capacity: recognition
    31, production 16, structured effectively unbounded (matching_pairs combinatorics). 8 of 18 templates
    carry >=5 variants. REVIEWER: Only 18 lexemes; lessons 01 and 02 introduce exactly one each (''regent'',
    ''Nederlands''), so their templates are single-variant anchors by construction. ''Nederlands'' is
    capitalised for Dutch orthographic reasons, not sentence position, so it is a safe typed answer. General
    double-checks for this wave: (a) every word_order/fill_in_blank frame was verified against its slot''s
    whole-B1-course candidate pool, not just the unit pool, so Endless Practice cannot render an ungrammatical
    sentence; (b) no frame''s literal text contains any of its own slot''s candidate values (defect 1.14);
    (c) listen_select frames are bare ''{item}'' so no distractor can be a word the audio itself says
    (defect 1.22); (d) matching_pairs pools were read by hand for interchangeable English glosses. Needs
    the standard fresh-context review before import. Fresh-context review 2026-10-10 (content-reviewer.md checklist): read all 18 templates against unit- and course-scoped pools (frame grammaticality, derived answers, distractor/gloss collisions, matching confusables, self-reference, booleans, jargon); logged lexeme defects (was, waar, rust, regel, vroeg) checked - none displayed wrongly here (was now glossed ''was; were''). FIXED: lesson05.choose.001 feedback claimed every option ''appears in the text about Sara''''s party'', false for voorwaarde (lesson06) and course-scope members - neutralised to ''{item} is a word from your lessons.'' DEFERRED: fixed-sentence translation.003 accepts one rendering only (systemic). 1 defect fixed, 1 deferred, no native flag. Language review 2026-10-20 (session 9, en-nl): 1 fix -- lesson05.order.002 frame, answer and feedback now say geen tijd, matching the corrected lesson05 reading (Nu heeft Lotte geen tijd. Als ze meer tijd had, ...).'
