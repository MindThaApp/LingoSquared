schema_version: '1.0'
pack_key: practice.en-nl.a1.unit70
source_language: en
target_language: nl
unit_content_key: nl.a1.unit70.bloemist
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-07-23 per docs/content/PRACTICE_PACK_RECIPE.md, en-nl batch
    en-nl_05. Unit70 (bloemist / florist shop, A1 volume batch) is a THIN unit:
    only 8 lexemes total across its 6 lessons (bloem, boeket, roos, tulp,
    bloemen, rozen, lint, boekwinkel -- 1-2 content nouns per lesson), measured
    with the recipe's f'.{LEVEL}.{UNIT}.' filter against
    backfill_lexemes_en_nl.iter_specs(). All 6 lessons have >=1 lexeme, so all
    6 are anchored.


    Per §8.1's grammar-unit pattern (necessary here even though this is a
    vocabulary unit, because each lesson individually has only 1-2 content
    words -- far under the multiple_choice/matching_pairs floors): every
    multiple_choice/listen_select/translation/matching_pairs slot uses the
    UNIONED semantic:bloemist_vocab tag (part_of_speech noun/verb/adjective for
    choose/listen/translate; noun-only for matching_pairs), giving all 6 lessons
    a full 8-candidate pool while remaining anchored per-lesson via
    lesson_content_key for checkpoint stratification. Verified bloemist_vocab
    is genuinely UNIT-anchored at the runtime provenance level (Lexeme rows for
    "is"/"was"/"hebt"/etc. that also carry this tag are NOT anchored to unit70,
    so they never enter the checkpoint's unit-scoped pool -- only the 8 tokens
    above are). The tag pools much wider at COURSE scope (Endless Practice), but
    every template using it here is a bare-word/bare-item frame (MC/listen_select/
    translation) or a bare-pair frame (matching_pairs) with no other literal
    text, so course-scope breadth is structurally safe (§3.1c) -- never used on a
    literal-sentence frame.


    17 templates, all 6 lessons, all 3 tiers (recognition 7 [6 choose + 1
    listen_select], structured 4 [2 matching_pairs + 1 word_order + 1
    fill_in_blank], production 6 [bare-word translation]). The one word_order
    and one fill_in_blank template both use the single-member anchor tag
    bloemist_boeket_single (exactly 1 course-wide candidate: "boeket"), so both
    are course-scope-safe by construction; their literal frames ("Het {item} is
    mooi." / "Ik zie het {item} en de kleur.") are lifted from/modeled on the
    unit's own lesson02 dialogue ("Het boeket is mooi.", "Ik zie het boeket en
    de kleur.").


    No mis-glossed lexeme found in this pool (all 8 glosses read correctly
    against the realization). Vrolik-style proper-noun exclusion N/A here (no
    proper nouns in this unit's pool). THIN UNIT flag: with only 8 base tokens,
    per-tier distinct-item counts are modest (see capacity script output in the
    report) -- authored to full pool capacity, not padded, per HARD RULE #3.


    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all
    17 templates against unit- and course-scoped pools (practice_dump), glosses,
    frames, distractor overlap, matching confusability, booleans and jargon.
    Fixed: 6 multiple_choice feedback frames ('{item} belongs to this unit's
    florist vocabulary.') were false at course scope (bloemist_vocab pools
    is/twee/euro/hebt etc. in Endless Practice) -- changed to 'The Dutch word is
    {item}.'; 2 matching_pairs feedback frames ('Match each Dutch florist
    word...') changed to the neutral 'Match each word with its English meaning.'
    for the same reason. Deferred (systemic, not fixable in-pack): bare-word
    translation glosses carry the English article ('the flower') while the
    single accepted answer is the bare token (bloem), so a learner typing 'de
    bloem' is graded wrong; needs an engine-side article tolerance or a gloss
    convention change. No native-judgment flags.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - bloemist_vocab
    - bloemist_boeket_single
