  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &strand_noun
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: strand_noun}
    second: *strand_noun
    third: *strand_noun
    fourth: *strand_noun
    fifth: *strand_noun
    sixth: *strand_noun
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each Dutch beach word with its English meaning.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit61.lesson03.order.005
  lesson_content_key: nl.a1.unit61.lesson03.zwemmen_in_de_zee
