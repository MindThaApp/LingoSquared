  frame: {text: 'De {item} is groot.', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: strand_parasol_single}
  answer_derivation:
    kind: render_frame
    frame: {text: 'De {item} is groot.', language_code: nl, direction: ltr}
  feedback_frame:
    text: De parasol is groot. -- The beach umbrella is big.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit61.lesson03.fill.006
  lesson_content_key: nl.a1.unit61.lesson03.zwemmen_in_de_zee
  type: fill_in_blank
  frame: {text: 'Ik zwem en ik zit onder de {item}.', language_code: nl, direction: ltr}
