- content_key: practice.en-nl.nl.a1.unit61.lesson01.choose.001
  lesson_content_key: nl.a1.unit61.lesson01.zullen_we_naar_het_strand_gaan
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, phrase]
      agreement_tags: {semantic: strand_vocab}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} belongs to this unit''s beach vocabulary.'
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit61.lesson01.translate.002
  lesson_content_key: nl.a1.unit61.lesson01.zullen_we_naar_het_strand_gaan
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, phrase]
      agreement_tags: {semantic: strand_vocab}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
