schema_version: '1.0'
pack_key: practice.en-nl.a1.unit61
source_language: en
target_language: nl
unit_content_key: nl.a1.unit61.strand
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. en-nl A1
    unit61 (strand / "Een dag naar het strand") has 8 lexemes
    (backfill_lexemes_en_nl.py's auto-generated strand_vocab/strand_noun/
    strand_parasol_single tags). Lesson05 has zero introduced_tokens and is
    correctly NOT anchored (recipe DO-NOT #8); lessons 01/02/03/04/06 are all
    anchored.

    14 templates: multiple_choice x5 + translation bare-word x5 (one of each
    per anchor lesson; strand_vocab pool = zee/zand/golf/parasol/zit/parasols/
    dierentuin, 7 distinct glosses -- "dierentuin" is the unit's own
    wrap-up-dialogue forward reference to next unit's topic, legitimately
    taught in this unit's lesson06), listen_select x1 (strand_vocab, anchored
    lesson03, the richest lesson), matching_pairs x1 (strand_noun, exactly 6
    of the pool's 6 nouns: zee/zand/golf/parasol/parasols/dierentuin --
    parasol/parasols is the recipe's explicitly-acceptable singular/plural
    discrimination), word_order x1 + fill_in_blank x1 on the single-member
    strand_parasol_single anchor, both reusing the unit's own taught sentences
    verbatim: "De parasol is groot." and "Ik zwem en ik zit onder de
    parasol."

    Read every gloss (§0.1): all 8 tokens' glosses match what the realization
    teaches. No mis-glosses found.

    §9 step 5 course-scope check: strand_parasol_single is generated only for
    token "parasol" (NL_A1_VOLUME_SINGLE_ANCHORS), a direction-wide-unique
    anchor, so it stays a single course-wide candidate in both frames (note:
    "parasols", the plural, is a SEPARATE token and does not carry this tag).
    Neither "De"/"is"/"groot" nor "Ik"/"zwem"/"en"/"ik"/"zit"/"onder"/"de" is
    ever a strand_parasol_single candidate (its only member is "parasol"
    itself, absent from both frames' literal text).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - strand_vocab
    - strand_noun
    - strand_parasol_single
templates:

