    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *housing_vocab}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit18.lesson05.choose.001
    lesson_content_key: nl.a1.unit18.lesson05.advertentie_lezen
    type: multiple_choice
    frame:
      text: "{item}"
