    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: nl, direction: ltr}
    slots: {first: *housing_vocab_pure, second: *housing_vocab_pure, third: *housing_vocab_pure, fourth: *housing_vocab_pure, fifth: *housing_vocab_pure, sixth: *housing_vocab_pure}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each home-related word with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit18.lesson06.listen.001
    lesson_content_key: nl.a1.unit18.lesson06.nieuw_appartement
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *housing_vocab}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a word from this dialogue.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit18.lesson06.translate.002
