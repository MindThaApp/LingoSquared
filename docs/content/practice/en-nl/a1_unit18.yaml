  - content_key: practice.en-nl.nl.a1.unit18.lesson05.match.002
    lesson_content_key: nl.a1.unit18.lesson05.advertentie_lezen
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth}", language_code: nl, direction: ltr}
    slots: {first: *room_word_pure, second: *room_word_pure, third: *room_word_pure, fourth: *room_word_pure, fifth: *room_word_pure}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth]}
    feedback_frame: {text: "Match each room word with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit18.lesson06.listen.001
    lesson_content_key: nl.a1.unit18.lesson06.nieuw_appartement
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *housing_vocab}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a word from this dialogue.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit18.lesson06.translate.002
    lesson_content_key: nl.a1.unit18.lesson06.nieuw_appartement
    type: translation
    frame:
      text: "The apartment is {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *home_adjective}
    answer_derivation: {kind: render_frame, frame: {text: "Het appartement is {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Het appartement is {item}.", language_code: en, direction: ltr}
