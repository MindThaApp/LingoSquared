- content_key: practice.en-nl.nl.a1.unit59.lesson02.choose.001
  lesson_content_key: nl.a1.unit59.lesson02.de_bomen_en_het_gras
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, phrase]
      agreement_tags: {semantic: park_vocab}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} belongs to this unit''s park vocabulary.'
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit59.lesson02.translate.002
  lesson_content_key: nl.a1.unit59.lesson02.de_bomen_en_het_gras
  type: translation
