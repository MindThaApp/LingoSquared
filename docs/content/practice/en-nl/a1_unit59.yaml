schema_version: '1.0'
pack_key: practice.en-nl.a1.unit59
source_language: en
target_language: nl
unit_content_key: nl.a1.unit59.park
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. en-nl A1
    unit59 (park / "Een middag in het park") has 10 lexemes across 4 lessons
    (backfill_lexemes_en_nl.py's auto-generated park_vocab/park_noun/
    park_picknick_single tags). Lessons 01/06 have zero introduced_tokens and
    are correctly NOT anchored (recipe DO-NOT #8); lessons 02/03/04/05 are all
    anchored.

    12 templates: multiple_choice x4 + translation bare-word x4 (one of each
    per anchor lesson, park_vocab: boom/gras/eend/eenden/lijn/picknick/fruit/
    bankje, 8 distinct nouns -- preposition "onder" is auto-excluded from
    _vocab by NL_A1_VOLUME_VOCAB_POS), listen_select x1 (park_vocab, anchored
    lesson05, the richest lesson), matching_pairs x1 (park_noun, 6 of the same
    8-noun pool -- clears the 6-pair floor), word_order x1 + fill_in_blank x1
    on the single-member park_picknick_single anchor. Both structured-tier
    sentences reuse the unit's own taught dialogue verbatim/near-verbatim:
    "Leuk! Zullen we een picknick maken?" (Omar's exact line) for word_order,
    "We eten fruit bij de picknick." for fill_in_blank (constructed, but
    "picknick" takes "de" per NL_A1_VOLUME_ARTICLES and the sentence is
    ordinary Dutch).

    Read every gloss (§0.1): boom/gras/eend/eenden/lijn/picknick/fruit/bankje
    all match what the realization teaches; eend "the duck" / eenden "ducks"
    is the recipe's explicitly-acceptable singular/plural discrimination, not
    a paraphrase collision. No mis-glosses found.

    §9 step 5 course-scope check: park_picknick_single is generated only for
    token "picknick" (NL_A1_VOLUME_SINGLE_ANCHORS), a direction-wide-unique
    anchor, so it stays a single course-wide candidate in both frames. Neither
    "Leuk"/"Zullen"/"we"/"een"/"maken" nor "We"/"eten"/"fruit"/"bij"/"de" is
    ever a park_picknick_single candidate (its only member is "picknick"
    itself, absent from both frames' literal text). "fruit" is a literal word
    in the fill_in_blank frame and IS a park_vocab candidate in other
    templates, but that is a different slot -- not a self-reference (§1.1).
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - park_vocab
    - park_noun
    - park_picknick_single
templates:

