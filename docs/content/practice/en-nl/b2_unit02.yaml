schema_version: '1.0'
pack_key: practice.en-nl.b2.unit02
source_language: en
target_language: nl
unit_content_key: nl.b2.unit02.speculatie
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-08-02 against docs/content/PRACTICE_PACK_RECIPE.md to unblock the
    en-nl B2 unit02 (speculatie) checkpoint (the unit compiles and has lexemes from
    scripts/backfill_lexemes_en_nl.py but had no practice pack, so
    generate_checkpoint() returned checkpoint_unavailable). This is a GRAMMAR/function
    unit (graded-certainty speculation about present AND past causes), so §8.1 was
    followed, NOT the §8 per-lesson-tag vocabulary pattern: the per-lesson tag is
    dominated by function words, so broad recognition/production/matching_pairs slots
    UNION the unit's six lesson tags (certainty_degree, deduction, possibility_guess,
    past_speculation, speculation_reading, speculation_dialogue), narrowed by
    part_of_speech to [noun, verb, adjective, adverb] so no function word (er/hij/te/
    wel/dus/iets/hem/zich/nee/Bram) is ever a candidate. 15 templates across all 6
    lessons: multiple_choice x4, listen_select x1 (recognition 5), matching_pairs x2 +
    word_order x4 (structured 6), translation x4 (production 4). Every slot is
    satisfiable from THIS unit's own lexemes at checkpoint (unit) scope.
    Single-member anchors used for the deterministic word_order and fixed-sentence
    translation frames were VERIFIED course-single at b2 scope (whole B2 Course, incl.
    unit01): schermtijd_telefoon_single -> {telefoon}, symptom_zijn_pure -> {ziek},
    travel_disruption_verb -> {weten}. The word_order frame "Hij moet de {item} gemist
    hebben." uses past_speculation+noun which pools {afspraak, trein} at course scope;
    both are grammatical ("de trein/afspraak missen"), so it is a safe multi-variant
    (not underdetermined -- word_order shows the gloss hint and renders each target's
    own answer). Capacity/coverage (recipe §9.4, f'.{LEVEL}.{UNIT}.' filter): 15 live
    templates, 56 unit lexemes, 6 lessons with lexemes; ALL 82% (46/56 = every
    content word), recognition 82%, structured 82%, production 82%, and every tier
    covers 6/6 lessons; no dead templates, no <3-candidate recognition slots. ITEM-7 (whole spine act): two
    culminating fixed-sentence translations require the full construction, one PAST
    cause by deduction ("...dus hij moet de trein gemist hebben") and one PRESENT
    cause ruled out with evidence ("Hij kan niet ziek zijn, want ik zag hem net"),
    covering speculation about present AND past causes with graded certainty.
    REVIEWER, double-check: (a) the two broad matching_pairs pool inflection pairs
    whose glosses differ but are semantically close (komt/komen "comes"/"to come",
    staat/staan, zien/zag, moet/moeten, gokken/gok, weten/weet, gebeuren/gebeurd) --
    treated as acceptable singular/plural-style discriminations per §6.3, but confirm
    a native reads them as answerable; (b) "je kunt dat niet weten" and "de afspraak
    gemist hebben" read as natural informal Dutch; (c) register is informal jij
    throughout (je kunt), no formal u. No mis-glossed lexeme found in the unit02 pool
    (every gloss read against the realization, §0.1). Needs standard fresh-context
    review before import.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): read all 15
    templates against their unit- and course-scoped pools and the nl b2_unit02
    realization/en-nl overlay; word_order/fixed-translation anchors re-confirmed single
    at course scope (ziek, weten, telefoon; trein/afspraak both grammatical in the
    gemist frame). FIXED (distractor): lesson02.choose.001 pooled moet "must; is due"
    with moeten "must; need to" (and kan "can" with kunnen "can (infinitive/plural)") in
    a 12-member pool, so the distractor was also a correct meaning in roughly a quarter
    of moet/moeten items; narrowed part_of_speech to [noun, adjective, adverb] (pool now
    file/ziek/net/auto, course + weg). The lesson02 verbs stay in recognition via the
    lesson01/lesson04 union templates; re-widen once the moet/moeten glosses are fixed.
    FIXED (feedback-hint): lesson02.choose.001 and lesson03.choose.001 feedback claimed
    every word is "used when you deduce a cause" / "guess without firm evidence" (false
    for auto, file, weten, and course-scope weg/thuis); now 'Remember the meaning of
    {item}.' DEFERRED (lexeme-gloss): moet "must; is due" vs moeten "must; need to"
    overlap (propose moet "must (with ik/hij)", moeten "must; to have to
    (infinitive/plural)"); vast "surely; definitely" overlaps zeker "certainly; for
    sure" (the overlay teaches vast as "surely / I bet"; propose dropping "definitely").
    These still co-occur in the broad 6-tag union pools (lesson01
    choose/match/translate, lesson04 listen/match) at low probability. DEFERRED
    (duplicate-ambiguous): misschien "maybe" and wellicht "perhaps; possibly" are true
    synonyms (the overlay itself teaches misschien as "maybe / perhaps"); they co-occur
    only in the broad union pools and in the union bare-word translation (prompt
    "perhaps; possibly" accepts only wellicht). Not separable by tag without dropping
    lesson03 structured coverage. DEFERRED (systemic): fixed-sentence translations
    accept one rendering only (e.g. 'omdat ik hem net zag'). Native flag: none.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - certainty_degree
    - deduction
    - possibility_guess
    - past_speculation
    - speculation_reading
    - speculation_dialogue
    - schermtijd_telefoon_single
    - symptom_zijn_pure
    - travel_disruption_verb
templates:

# ===== lesson01 hoe_zeker =====
- content_key: practice.en-nl.nl.b2.unit02.lesson01.choose.001
  lesson_content_key: nl.b2.unit02.lesson01.hoe_zeker
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic:
        - certainty_degree
        - deduction
        - possibility_guess
        - past_speculation
        - speculation_reading
        - speculation_dialogue
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} is one of this unit''s speculation words.'
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit02.lesson01.match.002
  lesson_content_key: nl.b2.unit02.lesson01.hoe_zeker
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &broad_match
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic:
        - certainty_degree
        - deduction
        - possibility_guess
        - past_speculation
        - speculation_reading
        - speculation_dialogue
    second: *broad_match
    third: *broad_match
    fourth: *broad_match
    fifth: *broad_match
    sixth: *broad_match
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each speculation word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit02.lesson01.translate.003
  lesson_content_key: nl.b2.unit02.lesson01.hoe_zeker
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic:
        - certainty_degree
        - deduction
        - possibility_guess
        - past_speculation
        - speculation_reading
        - speculation_dialogue
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

