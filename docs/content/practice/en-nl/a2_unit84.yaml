schema_version: '1.0'
pack_key: practice.en-nl.a2.unit84
source_language: en
target_language: nl
unit_content_key: nl.a2.unit84.ben_je_ooit_geweest
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 79-86 pass): dumped every slot's unit-scope and course-scope pool (a2 + unit84 filter; the unit has only 13 lexemes) and read every gloss. 4 fixes - (1) lesson01 choose.001 (2 unit candidates) and lesson02 listen.001 (1) were below the three-option floor and could never render in the checkpoint; both now use a noun/adverb union of experience_ooit_nooit, experience_al_nog_niet, experience_questionnaire and travel_profile_reading (4 unit candidates; adjectives stay out because eens carries the stale gloss agreed; in agreement in those tags); (2) lesson01 match.002 had 4 unit tokens for 6 slots and pulled both Gisteren and gisteren through recent_time; it now pools nouns/adjectives of perfectum_vs_imperfectum, language_or_nationality and experience_al_nog_niet (6 unit tokens, no case duplicates); (3) lesson03 choose.001 drops adverbs so Gisteren/gisteren (Yesterday/yesterday, equal under casefolding) cannot appear as correct answer and distractor; (4) lesson05 choose.001 and translate.003 used experience_questionnaire adjectives, which admit eens with its stale gloss at course scope; they now use the same safe noun/adjective union, and the three multiple-choice feedback frames render the English gloss instead of claims that did not fit every pool member. Egyptisch is no longer hosted (it only carries tags shared with eens). Left as is: lesson03 order.002 {item} at ik sushi. has no unit-scope candidate because gisteren is backfilled under a later unit; it still works in Endless Practice. Capacity after fixes: 15 templates, ALL 69%, recognition 62%, structured 54%, production 62%; lessons 5/5 except structured 4/5.

    Fifteen templates cover all five lessons with classified lexemes in recognition,
    structured and production tiers; lesson06 currently has no classified lexemes.
    Broad pools deliberately avoid perfectum_vs_imperfectum verbs because the
    course-scope token was carries the stale gloss "do the dishes (with ik)" while
    this unit teaches imperfectum "was". The pack instead reaches lesson03 through
    recent_time and carefully filtered unit tags. A native speaker should confirm
    that the generated word-order sentences with gisteren/vanmorgen and the language
    adjectives Belgisch/Duits/Engels/Nederlands sound natural in all combinations.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - experience_ooit_nooit
    - experience_al_nog_niet
    - experience_questionnaire
    - perfectum_vs_imperfectum
    - recent_time
    - language_or_nationality
    - travel_profile_reading

templates:
- content_key: practice.en-nl.nl.a2.unit84.lesson01.choose.001
  lesson_content_key: nl.a2.unit84.lesson01.ooit_en_nooit
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, adverb]
      agreement_tags:
        semantic: [experience_ooit_nooit, experience_al_nog_niet,
                   experience_questionnaire, travel_profile_reading]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: 'This Dutch word means {item}.'
    slot_rendering: {item: english_gloss}
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit84.lesson01.match.002
  lesson_content_key: nl.a2.unit84.lesson01.ooit_en_nooit
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &experience_word
      language_code: nl
      part_of_speech: [noun, adjective]
      agreement_tags:
        semantic: [perfectum_vs_imperfectum, language_or_nationality,
                   experience_al_nog_niet]
    second: *experience_word
    third: *experience_word
    fourth: *experience_word
    fifth: *experience_word
    sixth: *experience_word
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each Dutch experience word with its English meaning.
    language_code: en
    direction: ltr

