schema_version: '1.0'
pack_key: practice.en-nl.a2.unit84
source_language: en
target_language: nl
unit_content_key: nl.a2.unit84.ben_je_ooit_geweest
review:
  status: unreviewed
  fresh_context: 'false'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fifteen templates cover all five lessons with classified lexemes in recognition,
    structured and production tiers; lesson06 currently has no classified lexemes.
    Broad pools deliberately avoid perfectum_vs_imperfectum verbs because the
    course-scope token was carries the stale gloss "do the dishes (with ik)" while
    this unit teaches imperfectum "was". The pack instead reaches lesson03 through
    recent_time and carefully filtered unit tags. A native speaker should confirm
    that the generated word-order sentences with gisteren/vanmorgen and the language
    adjectives Belgisch/Duits/Engels/Nederlands sound natural in all combinations.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - experience_ooit_nooit
    - experience_al_nog_niet
    - experience_questionnaire
    - perfectum_vs_imperfectum
    - recent_time
    - language_or_nationality

templates:
- content_key: practice.en-nl.nl.a2.unit84.lesson01.choose.001
  lesson_content_key: nl.a2.unit84.lesson01.ooit_en_nooit
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, adverb]
      agreement_tags: {semantic: experience_ooit_nooit}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is used to talk about life experiences.'
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit84.lesson01.match.002
  lesson_content_key: nl.a2.unit84.lesson01.ooit_en_nooit
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &experience_word
      language_code: nl
      part_of_speech: [noun, adverb]
      agreement_tags:
        semantic: [experience_ooit_nooit, experience_al_nog_niet,
                   experience_questionnaire, recent_time]
    second: *experience_word
    third: *experience_word
    fourth: *experience_word
    fifth: *experience_word
    sixth: *experience_word
  slot_relations:
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each Dutch experience word with its English meaning.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit84.lesson01.translate.003
  lesson_content_key: nl.a2.unit84.lesson01.ooit_en_nooit
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, adverb]
      agreement_tags: {semantic: experience_ooit_nooit}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

