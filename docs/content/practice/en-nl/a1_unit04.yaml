schema_version: "1.0"
pack_key: practice.en-nl.a1.unit04
source_language: en
target_language: nl
unit_content_key: nl.a1.unit04.time
review:
  status: reviewed
  required_next_reviewer: null
  fresh_context: "true"
  notes: >-
    Independent fresh-context content audit completed (zero access to the
    authoring reasoning above). Every lesson_content_key matches a real
    nl.a1.unit04 realization lesson (all 6 confirmed). Standalone
    lexeme_matches()-replicating harness confirms candidate counts well past
    the required bar: number/hour_number=15 (lessons01-03, 05), weekday=10
    (lesson06), time_of_day (day_period)=4 (lesson04, the minimum for
    listen_select but genuinely correct -- exactly ochtend/middag/avond/nacht
    exist in Dutch, no more members are possible). Hand-checked every
    generated sentence: "Het is {item} uur."/"Het is kwart over/voor {item}."/
    "Het taalcafé begint om kwart over {item}."/"De workshop begint om kwart
    voor {item}." are all grammatical for any hour-number filler (no
    gender/agreement dependency). "de {item}" (lesson04) is safe because all
    4 day_period nouns (ochtend/middag/avond/nacht) are genuinely de-words in
    Dutch -- verified this explicitly since a de/het mismatch is exactly the
    bug class this review is watching for. "Prima, tot {item}middag!" with
    the weekday tag produces correct standard Dutch compounds
    (maandagmiddag, dinsdagmiddag, ... zondagmiddag) for every one of the 7
    weekdays. No self-reference, no capitalization leaks, no jargon leaks, no
    stray YAML booleans. Compiler validation re-run together with units
    01-03, 05-09: 0 errors/0 warnings.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [register_language, wellbeing, name_exchange, origin_language, cafe_small_talk, first_meeting_dialogue, number, hour_number, contact_number, age_quantity, price, library_registration, weekday, month, ordinal_number, date_expression, library_date, cafe_appointment, clock_time, quarter_hour, time_question, time_of_day, day_period, schedule, cafe_meetup_time, informal_address, polite_address, greeting, wellbeing_answer, person_name, place_name, country, language_or_nationality]
    register: [informal, polite]
slot_presets:
  informal_address: &informal_address {language_code: nl, part_of_speech: pronoun, agreement_tags: {semantic: informal_address}}
  greeting: &greeting {language_code: nl, part_of_speech: phrase, agreement_tags: {semantic: greeting}}
  person_name: &person_name {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: person_name}}
  country: &country {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: country}}
  number: &number {language_code: nl, part_of_speech: [symbol, noun], agreement_tags: {semantic: hour_number}}
  weekday: &weekday {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: weekday}}
  month: &month {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: month}}
  ordinal_number: &ordinal_number {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: ordinal_number}}
  time_of_day: &time_of_day {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: day_period}}
