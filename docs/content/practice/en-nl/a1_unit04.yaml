schema_version: "1.0"
pack_key: practice.en-nl.a1.unit04
source_language: en
target_language: nl
unit_content_key: nl.a1.unit04.time
review:
  status: reviewed
  required_next_reviewer: null
  fresh_context: "true"
  notes: >-
    Independent fresh-context content audit completed (zero access to the
    authoring reasoning above). Every lesson_content_key matches a real
    nl.a1.unit04 realization lesson (all 6 confirmed). Standalone
    lexeme_matches()-replicating harness confirms candidate counts well past
    the required bar: number/hour_number=15 (lessons01-03, 05), weekday=10
    (lesson06), time_of_day (day_period)=4 (lesson04, the minimum for
    listen_select but genuinely correct -- exactly ochtend/middag/avond/nacht
    exist in Dutch, no more members are possible). Hand-checked every
    generated sentence: "Het is {item} uur."/"Het is kwart over/voor {item}."/
    "Het taalcafé begint om kwart over {item}."/"De workshop begint om kwart
    voor {item}." are all grammatical for any hour-number filler (no
    gender/agreement dependency). "de {item}" (lesson04) is safe because all
    4 day_period nouns (ochtend/middag/avond/nacht) are genuinely de-words in
    Dutch -- verified this explicitly since a de/het mismatch is exactly the
    bug class this review is watching for. "Prima, tot {item}middag!" with
    the weekday tag produces correct standard Dutch compounds
    (maandagmiddag, dinsdagmiddag, ... zondagmiddag) for every one of the 7
    weekdays. No self-reference, no capitalization leaks, no jargon leaks, no
    stray YAML booleans. Compiler validation re-run together with units
    01-03, 05-09: 0 errors/0 warnings.

    **Re-authoring fix, 2026-07-24 (unit-scope DEAD-template pass)**: the
    "weekday tag produces correct Dutch compounds" claim above was never
    actually reachable at checkpoint scope -- `weekday` is entirely
    unit03's own vocabulary (maandag..zondag are all introduced by
    nl.a1.unit03's lessons); unit04 lesson06
    (`afspreken_bij_het_taalcafe`) introduces zero bare weekday tokens of
    its own, so `generate_checkpoint()` (unit-scoped) always saw 0
    candidates for both `lesson06.order.001` and `lesson06.translate.003`.
    This is exactly the "slot anchored to an earlier unit's vocabulary"
    defect -- confirmed via iter_specs(): lesson06's own real vocabulary is
    only `dus`/`hoe`/`Dan`/`vrijdagmiddag`, the last already the fused
    Friday+afternoon compound the lesson actually teaches (not a
    generic weekday+middag pattern). Re-anchoring the SAME frame/type was
    not viable: any semantic tag broad enough to have a unit-scoped
    candidate (`cafe_meetup_time`/`time_of_day`) pools course-wide members
    (taalcafé, twee, uur, kwart, workshop, ...) that are not grammatical in
    "Prima, tot {item}middag!" or a bare "Prima, tot {item}!" (checked at
    course scope, not just unit scope). REPLACED both with new templates
    anchored to lesson06's own vocabulary instead: `lesson06.choose.001`
    (multiple_choice, recognition) unions `cafe_meetup_time` across all of
    unit04's own lessons (uur/kwart/workshop/dus/hoe/Dan/vrijdagmiddag = 7
    distinct glosses, well past the 3-option floor; safe because a bare
    `{item}` MC frame has no grammaticality-in-frame requirement) and a
    rebuilt `lesson06.translate.003` (translation, production, bare-word
    shape) restricted to `cafe_meetup_time` nouns only
    (uur/kwart/workshop/vrijdagmiddag = 4 distinct) to avoid asking the
    learner to "translate" bare particles/adverbs. This incidentally moves
    the pack's recognition tier from 1 live template (lesson04's
    listen_select alone) to 2 -- still thin, but a pre-existing gap outside
    this fix's scope, noted here for whichever pass next touches this pack.

    **Tier-polish, 2026-07-24 (wave 2, tier-thinness pass)**: closed the
    recognition gap flagged above by adding lesson05.choose.004
    (multiple_choice over `schedule` nouns: rooster/Taalcafé/Welkom/
    Workshop/workshop/Pauze = 6 unit tokens, 5 distinct glosses -- the
    Workshop/workshop case pair collapses to one gloss, still well past
    the 3-option floor). Bare "{item}" frame, no grammaticality-in-frame
    risk; `schedule` was already declared in tag_schema. Recognition tier
    now 3 live (lesson04 listen.001, lesson05 choose.004, lesson06
    choose.001).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked
    all 13 templates at unit and course scope against the nl.a1.unit04
    realization. 7 defects fixed. The six kwart over/voor templates
    (lesson02/03/05 order + translate) slotted hour_number, whose ONLY
    unit-scoped members are 14/18, so every checkpoint item rendered "Het is
    kwart over 14." / "De workshop begint om kwart voor 18." (not Dutch --
    kwart over/voor takes 12-hour words; the unit itself teaches 14:15 as
    "kwart over twee" / "veertien uur vijftien") with English prompts like
    "a quarter past 14"; course scope added further bad fillers (twintig,
    achttien, 20). Rewrote them as the unit's own fixed sentences over
    single-member anchors: lesson02 "Het is kwart {over} twee." (over via
    preposition+text_exchange_reading, a1-wide singleton) and lesson03/05
    "Het taalcafe {begint} om kwart over twee." / "De workshop {begint} om
    kwart voor drie." (begint via verb+schedule, singleton); English prompts
    are now fixed and match the single answer; feedback frames rewritten to
    match. (7) lesson06.choose.001 pos [noun, particle, adverb] pooled
    course-wide het ("the; it") and de ("the"), so "the" was an also-correct
    distractor for het -- narrowed to [noun, adverb] (unit pool
    uur/kwart/workshop/hoe/vrijdagmiddag, 5 distinct). Deferred (engine
    limit): lesson01 translate "It is {gloss} o'clock." draws both digit (2,
    14) and word (twee) lexemes; the single accepted string rejects the
    other written form. No native-judgment flags.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [register_language, wellbeing, name_exchange, origin_language, cafe_small_talk, first_meeting_dialogue, number, hour_number, contact_number, age_quantity, price, library_registration, weekday, month, ordinal_number, date_expression, library_date, cafe_appointment, clock_time, quarter_hour, time_question, time_of_day, day_period, schedule, cafe_meetup_time, informal_address, polite_address, greeting, wellbeing_answer, person_name, place_name, country, language_or_nationality, text_exchange_reading]
    register: [informal, polite]
slot_presets:
  informal_address: &informal_address {language_code: nl, part_of_speech: pronoun, agreement_tags: {semantic: informal_address}}
  greeting: &greeting {language_code: nl, part_of_speech: phrase, agreement_tags: {semantic: greeting}}
  person_name: &person_name {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: person_name}}
  country: &country {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: country}}
  number: &number {language_code: nl, part_of_speech: [symbol, noun], agreement_tags: {semantic: hour_number}}
  weekday: &weekday {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: weekday}}
  month: &month {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: month}}
  ordinal_number: &ordinal_number {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: ordinal_number}}
  time_of_day: &time_of_day {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: day_period}}
  # Single-member anchors (a1 course-wide pool is exactly one token): `over`
  # (preposition + text_exchange_reading) and `begint` (verb + schedule). Used
  # by the fixed kwart over/voor sentences, which cannot take an hour slot:
  # this unit's only hour_number lexemes are 14/18, and "kwart over 14" is
  # not Dutch (kwart over/voor uses 12-hour words: kwart over twee).
  over_single: &over_single {language_code: nl, part_of_speech: preposition, agreement_tags: {semantic: text_exchange_reading}}
  begint_single: &begint_single {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: schedule}}
templates:
  - content_key: practice.en-nl.nl.a1.unit04.lesson01.order.001
    lesson_content_key: nl.a1.unit04.lesson01.hele_en_halve_uren
    type: word_order
    frame: {text: "Het is {item} uur.", language_code: nl, direction: ltr}
    slots: {item: *number}
    answer_derivation: {kind: render_frame, frame: {text: "Het is {item} uur.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The hour is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit04.lesson01.translate.003
    lesson_content_key: nl.a1.unit04.lesson01.hele_en_halve_uren
    type: translation
    frame:
      text: "It is {item} o'clock."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *number}
    answer_derivation: {kind: render_frame, frame: {text: "Het is {item} uur.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The hour is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit04.lesson02.order.001
    lesson_content_key: nl.a1.unit04.lesson02.kwartieren
    type: word_order
    frame: {text: "Het is kwart {item} twee.", language_code: nl, direction: ltr}
    slots: {item: *over_single}
    answer_derivation: {kind: render_frame, frame: {text: "Het is kwart {item} twee.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Kwart {item} twee = 2:15.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit04.lesson02.translate.003
    lesson_content_key: nl.a1.unit04.lesson02.kwartieren
    type: translation
    frame:
      text: "It is a quarter past two."
      language_code: en
      direction: ltr
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *over_single}
    answer_derivation: {kind: render_frame, frame: {text: "Het is kwart {item} twee.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Kwart {item} twee = 2:15.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit04.lesson03.order.001
    lesson_content_key: nl.a1.unit04.lesson03.hoe_laat
    type: word_order
    frame: {text: "Het taalcafé {item} om kwart over twee.", language_code: nl, direction: ltr}
    slots: {item: *begint_single}
    answer_derivation: {kind: render_frame, frame: {text: "Het taalcafé {item} om kwart over twee.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The language café starts (Dutch: {item}) at a quarter past two.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit04.lesson03.translate.003
    lesson_content_key: nl.a1.unit04.lesson03.hoe_laat
    type: translation
    frame:
      text: "The language café starts at a quarter past two."
      language_code: en
      direction: ltr
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *begint_single}
    answer_derivation: {kind: render_frame, frame: {text: "Het taalcafé {item} om kwart over twee.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Use {item} om kwart over twee for this start time.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit04.lesson04.listen.001
    lesson_content_key: nl.a1.unit04.lesson04.digitale_tijd_en_dagdelen
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *time_of_day}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the part of the day you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit04.lesson04.translate.003
    lesson_content_key: nl.a1.unit04.lesson04.digitale_tijd_en_dagdelen
    type: translation
    frame:
      text: "the {item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *time_of_day}
    answer_derivation: {kind: render_frame, frame: {text: "de {item}", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The part of the day is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit04.lesson05.order.001
    lesson_content_key: nl.a1.unit04.lesson05.rooster_lezen
    type: word_order
    frame: {text: "De workshop {item} om kwart voor drie.", language_code: nl, direction: ltr}
    slots: {item: *begint_single}
    answer_derivation: {kind: render_frame, frame: {text: "De workshop {item} om kwart voor drie.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The workshop starts (Dutch: {item}) at a quarter to three.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit04.lesson05.translate.003
    lesson_content_key: nl.a1.unit04.lesson05.rooster_lezen
    type: translation
    frame:
      text: "The workshop starts at a quarter to three."
      language_code: en
      direction: ltr
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *begint_single}
    answer_derivation: {kind: render_frame, frame: {text: "De workshop {item} om kwart voor drie.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Use {item} om kwart voor drie for this workshop time.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit04.lesson05.choose.004
    lesson_content_key: nl.a1.unit04.lesson05.rooster_lezen
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots:
      item: {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: schedule}}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a word from the language café schedule.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit04.lesson06.choose.001
    lesson_content_key: nl.a1.unit04.lesson06.afspreken_bij_het_taalcafe
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots:
      item: {language_code: nl, part_of_speech: [noun, adverb], agreement_tags: {semantic: cafe_meetup_time}}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "Choose the English meaning of {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit04.lesson06.translate.003
    lesson_content_key: nl.a1.unit04.lesson06.afspreken_bij_het_taalcafe
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots:
      item: {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: cafe_meetup_time}}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "Translate this word into Dutch.", language_code: en, direction: ltr}
