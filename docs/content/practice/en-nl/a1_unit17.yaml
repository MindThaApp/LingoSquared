schema_version: "1.0"
pack_key: practice.en-nl.a1.unit17
source_language: en
target_language: nl
unit_content_key: nl.a1.unit17.work
review:
  status: reviewed
  fresh_context: "true"
  notes: "Authored 2026-07-06 by the Claude session closing the en-nl
    practice-pool gap behind its lesson content (lesson content already
    goes through unit23; practice templates previously stopped at unit16).
    This unit (unit17) covers work and occupation: stating a job and
    workplace, a simple daily schedule, third-person -t verb endings, and
    reading/hearing two work profiles (Lotte = nurse/hospital,
    Omar = cook/restaurant). Widened scripts/backfill_lexemes_en_nl.py's
    UNIT_FILES numeric-range filter (a parallel session extended it to
    <=23 the same day for units 20-23; left that wider value alone per
    the standing coordination note) and added 25 new Dutch token
    classifications for this unit specifically.

    New semantic tags: an 8-member 'work_vocab'/'work_vocab_pure'
    (beroep/kok/verpleegkundige/restaurant/ziekenhuis/kantoor/baan/pauze,
    reusing unit8's existing 'ziekenhuis' lexeme rather than
    re-classifying it) for bare-word recognition only -- restaurant/
    ziekenhuis/kantoor each take a different article/preposition
    combination (een restaurant / het ziekenhuis / op kantoor with no
    article at all) verified directly from this unit's real content, so
    they are deliberately NEVER combined into one shared generative
    frame, same discipline as unit8's place/place_non_station split. A
    narrower 2-member 'occupation' tag (kok/verpleegkundige) IS safe
    generatively in 'Ik werk als {item}.' (both take 'werken als' + bare
    noun, no article). A 2-member 'schedule_verb' tag (begin/stop, both
    regular ik-form verbs) is safe in 'Ik {item} om {hour} uur.' --
    'pauze' is deliberately excluded from this tag since its real
    sentence uses a different verb ('Ik heb pauze om ... uur.'), not the
    {verb} slot itself. Extended the existing 'hour_number' tag with
    negen/twaalf/vijf/elf (the real clock hours this unit's schedule
    content uses), bringing it to 11 members. Reused the existing
    'person_name' tag (7 members) for the third-person -t drill
    ('{person} werkt als {item}.') -- reversed name/occupation pairings
    beyond what the real Lotte/Omar story establishes are still
    grammatically valid Dutch, a drill sentence not a factual claim, same
    precedent as unit14's comparative_adj tag this session.

    Real note on 'werk': it is already classified as a VERB (ik-form of
    werken, from unit10's daily-routine content), and this unit ALSO uses
    'werk' as a NOUN ('Wat doe je voor werk?', object of voor) -- the
    same token/different-POS homograph limitation documented in
    scripts/backfill_lexemes_en_nl.py's module docstring (see its 'zijn'
    note). Per that established precedent, 'werk' is NOT used as a
    generation slot value anywhere in this pack; the question phrase is
    baked as literal frame text where needed instead.

    Every slot's real candidate count was verified with the repo's
    standalone scripts/_practice_slot_check.py harness (which already
    globs en-nl, no changes needed there) against this script's actual
    output; every multiple_choice/listen_select slot clears the real
    >=3-distinct bar the backend's build_prompt() actually enforces (not
    the stricter >=4 this session initially assumed), and every
    matching_pairs slot has >=2 distinct tokens. Needs the standard
    fresh-context review before import. Same blocking dependency as every
    earlier en-nl pack: backfill_lexemes_en_nl.py has not actually been
    run against a real database yet.

    **Re-authoring fix, 2026-07-24 (unit-scope DEAD-template pass)**: two of
    the tags this note describes as unit17's own turned out, per the
    backfill script's ACTUAL current classification (checked via
    iter_specs()), to have zero unit17-scoped members -- both are exactly
    the DO-NOT #2 anti-pattern (a slot constrained to an earlier unit's
    vocabulary, invisible to generate_checkpoint()):

    - hour_number: the note above claims negen/twaalf/vijf/elf were added
    for this unit specifically, but their canonical lesson_content_key is
    nl.a1.unit02.lesson01.nul_tot_twaalf -- unit02, not unit17. All 3
    templates built on it (lesson03.order.001's hour slot,
    lesson05.translate.002, lesson06.order.002's hour slot) had 0
    unit-scoped candidates.
    - person_name: the note above calls this a legitimate reuse of an
    existing tag, but ALL 7 members (Noor/Lotte/Omar/Sander/Fenna/Jan/
    Marieke) are classified under unit01 or unit05 -- unit17 itself
    introduces zero proper nouns of any kind. Both lesson04.order.001 and
    lesson04.translate.002's person slot had 0 unit-scoped candidates.

    Fix applied -- put the grammar in the frame, not the pool, per the
    recipe's section 8.1 guidance, since neither tag has any viable
    unit17-native substitute:
    - lesson03.order.001: dropped the hour slot; the hour is now literal
    frame text (Ik {item} om negen uur.), leaving only the genuinely
    unit17-native schedule_verb slot (begin/stop, confirmed 2 members BOTH
    at unit and course scope, both grammatical in this frame).
    - lesson06.order.002: same pattern (Ik {item} om acht uur.), also
    re-slotting schedule_verb in place of the literal begin the original
    frame hardcoded, so this template now hosts either begin/stop rather
    than only ever begin.
    - lesson05.translate.002: hour_number had no unit17-native substitute
    at all (this lesson is a reading lesson, not a numbers lesson), so
    re-pointed the slot to work_vocab (noun) instead -- already alive and
    unit-native elsewhere in this pack.
    - lesson04.order.001 / lesson04.translate.002: dropped the person
    slot; both now hardcode the established course character Lotte as
    literal text (Lotte werkt als {item}. / Lotte works as {item}.),
    keeping only the genuinely unit17-native occupation slot
    (kok/verpleegkundige, confirmed 2 members at both unit and course
    scope). This follows the same precedent this pack's own original note
    already invokes for occupation/name pairing -- reversed
    name/occupation pairings beyond the real story are still
    grammatically valid Dutch, a drill sentence not a factual claim -- and
    is behaviourally identical to before from the learner's perspective:
    person was never translated (proper nouns render as their own token
    in English too), so the English side already only varied via item's
    gloss.

    tag_schema updated: removed hour_number and person_name (no longer
    referenced anywhere in this pack after the above).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): read
    all 16 templates against unit- and course-scoped pools and the nl
    a1_unit17 realization. 3 defects fixed: lesson04.translate.002 English
    prompt rendered ungrammatical 'Lotte works as cook.' and, together with
    lesson04.order.001, asserted 'Lotte werkt als kok', contradicting the
    unit's own canon (Lotte is the verpleegkundige, Omar the kok) -- both
    frames, the answer frame and feedback now use Hij werkt als {item}. / He
    works as a {item}. (Hij taught in lesson04; both pool members take 'a');
    lesson05.choose.001 feedback 'a word from the work profiles' was false
    for beroep/kantoor/baan -> 'a work-related word from this unit';
    lesson06.listen.001 feedback 'heard in this dialogue' was false for
    beroep/kantoor/pauze -> '{item} is the word you heard.'. No native-judgment
    flags."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [work_vocab, work_vocab_pure, occupation, schedule_verb]
slot_presets:
  occupation: &occupation {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: occupation}}
  work_vocab: &work_vocab {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: work_vocab}}
  # work_vocab_pure: exact-case (no capitalized "Pauze" duplicate), safe
  # for matching_pairs -- see scripts/backfill_lexemes_en_nl.py's
  # work_vocab_pure comment. This file's OTHER templates below keep
  # using the plain "work_vocab" tag unchanged.
  work_vocab_pure: &work_vocab_pure {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: work_vocab_pure}}
  schedule_verb: &schedule_verb {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: schedule_verb}}
templates:
  - content_key: practice.en-nl.nl.a1.unit17.lesson01.order.001
    lesson_content_key: nl.a1.unit17.lesson01.wat_doe_je_voor_werk
    type: word_order
    frame: {text: "Ik werk als {item}.", language_code: nl, direction: ltr}
    slots: {item: *occupation}
    answer_derivation: {kind: render_frame, frame: {text: "Ik werk als {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the occupation in this sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit17.lesson01.choose.002
    lesson_content_key: nl.a1.unit17.lesson01.wat_doe_je_voor_werk
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *work_vocab_pure}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a work-related word from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit17.lesson01.listen.003
    lesson_content_key: nl.a1.unit17.lesson01.wat_doe_je_voor_werk
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *work_vocab_pure}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit17.lesson01.match.004
    lesson_content_key: nl.a1.unit17.lesson01.wat_doe_je_voor_werk
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: nl, direction: ltr}
    slots: {first: *work_vocab_pure, second: *work_vocab_pure, third: *work_vocab_pure, fourth: *work_vocab_pure, fifth: *work_vocab_pure, sixth: *work_vocab_pure}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each work-related word with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit17.lesson02.translate.001
    lesson_content_key: nl.a1.unit17.lesson02.waar_werk_je
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *work_vocab_pure}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch word is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit17.lesson02.choose.002
    lesson_content_key: nl.a1.unit17.lesson02.waar_werk_je
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *work_vocab_pure}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a work-related word from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit17.lesson03.order.001
    lesson_content_key: nl.a1.unit17.lesson03.mijn_werkdag
    type: word_order
    frame: {text: "Ik {item} om negen uur.", language_code: nl, direction: ltr}
    slots: {item: *schedule_verb}
    answer_derivation: {kind: render_frame, frame: {text: "Ik {item} om negen uur.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik {item} om negen uur -- a simple schedule sentence.", language_code: en, direction: ltr}
