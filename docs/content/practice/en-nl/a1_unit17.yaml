    slots: {item: *schedule_verb}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch verb is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit17.lesson03.listen.003
    lesson_content_key: nl.a1.unit17.lesson03.mijn_werkdag
    type: listen_select
