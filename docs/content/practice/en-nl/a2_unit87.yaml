schema_version: '1.0'
pack_key: practice.en-nl.a2.unit87
source_language: en
target_language: nl
unit_content_key: nl.a2.unit87.wat_mag_en_moet
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 87-94 pass): 0 pack fixes. Dumped the unit-scope (21) and A2 course-scope (43) pool of the one shared union slot and read every gloss; capacity re-measured with the '.a2.unit87.' filter: 12 templates, 88% coverage overall and in each tier, 4/4 lessons with lexemes in every tier, no dead templates, MC/listen pools well over 3 distinct glosses, matching pool over 6. Bare-word frames only, so no self-reference or course-scope grammaticality risk. Backfill glosses for the coordinator (cannot be excluded without dropping whole lessons from the union): hoef and hoeft both display as 'need to' once the bracket note is stripped, and the sentence-initial Hoef ('need (to)') is not folded onto hoef, so a hoeven-form MC item can show a near-synonym distractor and a 'need to' translation prompt accepts only one of hoef/hoeft; regel carries 'arrange (with ik)' although it is tagged obligation_moeten for de regel 'the rule' (course scope); laten carries 'let (as in let's)' while the unit teaches laten zien 'to show'; Hier/hier and Mag/mag are unfolded case pairs at course scope. Earlier notes: Authored for the lessons of A2 unit 87 that have backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases are left out. Backfill glosses to double-check: kaart ("the map" where the unit means card/ticket), laten ("let (as in lets)"), hoog (odd under stoppen_met) and the roken/Roken case pair. No word_order (no safe course-wide frame). Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - permission_mogen
    - obligation_moeten
    - no_obligation_hoeven_te
    - pool_gym_rules
templates:
- content_key: practice.en-nl.nl.a2.unit87.lesson01.choose.001
  lesson_content_key: nl.a2.unit87.lesson01.mag_dat
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [permission_mogen, obligation_moeten, no_obligation_hoeven_te, pool_gym_rules]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit87.lesson01.match.002
  lesson_content_key: nl.a2.unit87.lesson01.mag_dat
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit87.lesson01.translate.003
  lesson_content_key: nl.a2.unit87.lesson01.mag_dat
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit87.lesson02.listen.001
  lesson_content_key: nl.a2.unit87.lesson02.dat_moet
  type: listen_select
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the meaning of the Dutch word you heard.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit87.lesson02.match.002
  lesson_content_key: nl.a2.unit87.lesson02.dat_moet
  type: matching_pairs
  frame: *match_frame
  slots: *match_slots
  slot_relations: *match_relations
  answer_derivation: *match_answer
  feedback_frame: *match_feedback
- content_key: practice.en-nl.nl.a2.unit87.lesson02.translate.003
