schema_version: '1.0'
pack_key: practice.en-nl.c1.unit04
source_language: en
target_language: nl
unit_content_key: nl.c1.unit04.toegeven_en_wegen
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md (§8.1 grammar/discourse-
    unit pattern) so the nl.c1.unit04 (concede, qualify, weigh) checkpoint can generate. 23
    templates over the 5 lessons that have lexemes (lesson06 subtiel_betoog introduces no
    tokens, so it cannot host a template): multiple_choice x5 (recognition); matching_pairs x3,
    word_order x5, fill_in_blank x3 (structured); translation x7 = 5 bare-word + 2 fixed-
    sentence (production). SLOT DESIGN: instead of the raw lesson tags, every broad slot uses a
    curated per-lesson content group (c1u04_toegeven_kern, c1u04_reikwijdte_kern,
    c1u04_tegenbewijs_kern, c1u04_afwegen_kern, c1u04_ontleden_kern; 12-16 tokens each) that
    drops function words and every token whose gloss is wrong for this unit or confusable with a
    pool neighbour. The raw lesson tags were not usable as pools because (a) they carry tokens
    re-introduced from earlier C1 units at course scope (bezwaar, voordeel, voordelen, wordt,
    betekent, ontkent, noodzakelijk, meer) and (b) they contain the exclusions listed below. The
    curated groups only exist on this unit's own tokens, so unit-scope pool = course-scope pool
    for every broad slot. Each group is kept inside one lesson so the cross-lesson near-synonyms
    (kwalificatie/begrenzing, tegenargument/tegenbewijs, conclusie/eindoordeel, weegt/wegen,
    maatschappelijk/maatschappelijke, klopt/waar) never share an MC, matching or translation
    pool. Every word_order / fill_in_blank / fixed-sentence translation uses a single-member
    anchor (c1u04_meebrengen_single, c1u04_gewicht_single, c1u04_openblijft_single,
    c1u04_doorslaggevend_single, c1u04_proef_single, c1u04_baat_single, c1u04_zwaarder_single,
    c1u04_afwegend_single, c1u04_nadeel_single, c1u04_bibliotheek_single) over the realization's
    own hero sentences, so each frame has exactly 1 course-scope candidate, is grammatical, and
    no literal frame word is its own slot's candidate (defect 1.14 checked by hand; the
    integrity script skips non-a* packs). ALL these tags come from the scratch tags.json the
    coordinator merges into NL_C1_EXTRA_TAGS; until that merge the compiler cannot see them.
    MEASURED (c1_measure.py cap, .c1.unit04. filter): ALL 72/90 (80%), recognition 71/90 (79%),
    structured 46/90 (51%), production 72/90 (80%), 5/5 lessons in every tier, no dead or under-
    floor templates. EXCLUDED / MIS-GLOSSED (route to backfill): geef carries "give (with ik)"
    but the unit only uses it in toegeven (geef toe = concede/admit) - kept out of every gloss
    pool; daar ("there") and staat ("stands; is placed") only occur in the fixed phrase Daar
    staat tegenover (= on the other hand) - literal glosses kept out of gloss pools; elk ("every
    (neuter)") and elke ("every") are interchangeable glosses - both kept out; extra is a self-
    gloss; hebben is trivial at C1; afgewogen and maatschappelijke kept out to avoid three-way
    weegt/afweging/afgewogen and inflection-twin confusion (afwegend is hosted only by its
    anchor); toe, voordat, tot, tegenover, terwijl, dan, via, naar are function words. REVIEWER
    DOUBLE-CHECK: (1) zwaarder carries "heavier"; the unit uses it in weegt zwaarder (= carries
    more weight / outweighs) - acceptable comparative but a context gloss would be better; (2)
    hoogte carries "extent (in 'tot op zekere hoogte'); height" - fine for recognition; (3) the
    two fixed-sentence translations name the construction in the English cue (er ... baat bij
    hebben; Alles afwegend + verdient ... de voorkeur) so exactly one Dutch rendering is
    accepted; (4) matching pools were read for interchangeable glosses (baat "benefit" vs nut
    "usefulness; value" share lesson03 - judged discriminable). Register: no direct address
    appears in any frame (unit pins informal jij/je between Lotte and Omar).
