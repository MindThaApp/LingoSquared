schema_version: '1.0'
pack_key: practice.en-nl.c1.unit04
source_language: en
target_language: nl
unit_content_key: nl.c1.unit04.toegeven_en_wegen
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: >-
    Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md (§8.1 grammar/discourse-unit pattern) so
    the nl.c1.unit04 (concede, qualify, weigh) checkpoint can generate. 23 templates over the 5 lessons that
    have lexemes (lesson06 subtiel_betoog introduces no tokens, so it cannot host a template): multiple_choice
    x5 (recognition); matching_pairs x3, word_order x8 (structured); translation x7 = 5 bare-word + 2
    fixed-sentence (production). No fill_in_blank: the runtime shows a fill frame without any English cue, and
    none of this unit's hero sentences forces a single word, so the three former fills (gewicht,
    doorslaggevend, bibliotheek) are word_order over the same sentence. SLOT DESIGN: every MC / matching slot
    uses a curated per-lesson content group (c1u04_toegeven_kern, c1u04_reikwijdte_kern,
    c1u04_tegenbewijs_kern, c1u04_afwegen_kern, c1u04_ontleden_kern; 12-16 tokens each) that drops function
    words, cognate self-glosses (extra, plan, via) and every token whose gloss is wrong for this unit or
    confusable with a pool neighbour. Every bare-word translation uses a stricter twin group (c1u04_*_vert =
    the kern group minus tokens whose gloss is equally answered by another common Dutch word: serieus/ernstig,
    wanneer/als/toen, filiaal/vestiging, zekere/bepaalde, doorslaggevend/beslissend, hoogte/mate,
    desalniettemin/niettemin, enerzijds and anderzijds/aan de ene-andere kant, toch/nog steeds,
    begrenzing/afbakening, gemotiveerd/beargumenteerd). The curated groups only exist on this unit's own
    tokens, so unit-scope pool = course-scope pool for every broad slot, and each group stays inside one
    lesson so the cross-lesson near-synonyms (kwalificatie/begrenzing, tegenargument/tegenbewijs,
    conclusie/eindoordeel, weegt/wegen, maatschappelijk/maatschappelijke, klopt/waar) never share a pool. MC
    feedback is neutral ("{item} comes up in this unit's lesson on ..."), true for every pool member. Every
    word_order and fixed- sentence translation uses a single-member anchor (c1u04_meebrengen_single,
    c1u04_gewicht_single, c1u04_openblijft_single, c1u04_doorslaggevend_single, c1u04_proef_single,
    c1u04_baat_single, c1u04_zwaarder_single, c1u04_afwegend_single, c1u04_nadeel_single,
    c1u04_bibliotheek_single) over the realization's own hero sentences, never in sentence-first position, so
    each frame has exactly 1 course-scope candidate and is grammatical. The two fixed-sentence translations
    pin every lexical choice in the English cue (studenten, werkenden, er ... baat bij hebben with aantoonbaar
    after er; Alles afwegend, verdient ... de voorkeur, proef). GLOSS FIXES (scratch gloss_fixes.json, route
    to backfill): ruimere "more extensive; wider (inflected)", benoemt "identifies; pins down", hoogte and
    baat reglossed without their own Dutch token, anderzijds "on the other hand (second half of a pair)",
    maatschappelijk(e) "societal", stijgen "rise; go up", zwaarder "heavier; weightier", bereik "the reach
    (how far something extends)", nut "the usefulness". ALL these tags come from the scratch tags.json the
    coordinator merges into NL_C1_EXTRA_TAGS; until that merge the compiler cannot see them. MEASURED
    (c1_measure.py cap): ALL 71/90 (79%), recognition 70/90 (78%), structured 46/90 (51%), production 59/90
    (66%), 5/5 lessons in every tier, no dead or under-floor templates. EXCLUDED (route to backfill): geef
    "give (with ik)" only occurs in toegeven; daar/staat only occur in Daar staat tegenover; elk/elke have
    interchangeable glosses; extra, plan and via are cognate self- glosses; hebben is trivial at C1; afgewogen
    and maatschappelijke kept out to avoid weegt/afweging/afgewogen and inflection-twin confusion; toe,
    voordat, tot, tegenover, terwijl, dan, naar are function words. Register: no direct address appears in any
    frame (unit pins informal jij/je between Lotte and Omar). Fresh-context review 2026-10-10: 12 findings (3
    blocker, 9 minor), all addressed (fixed, or the affected token excluded from the pool), confirmed by a
    pool-level scan.

    Second independent fresh-context review 2026-10-11 (one reviewer per unit, no access to the authoring
    notes or the first review), followed by a third fresh-context verification pass on the fixed pack.
    Pack-wide fix shared by all C1 units: C1 noun glosses no longer start with 'the' (backfill
    nl_c1_bare_gloss), so a bare-word translation no longer invites 'de/het X' and word_order hints no longer
    render 'de the X' (registry 1.40). 2nd review: 28 findings (13 blocker, all typed-translation
    alternatives). Fixed: ruimere, meebrengen, daarvoor, echte, concessie, benoemt, nodig, openblijft,
    beperkt, kwalificatie, bereik, beantwoordt, proef, baat, conclusie out of the *_vert pools; glosses
    kosten, klopt, kracht, vooral, omstandigheden, aantoonbaar, zwaarder, daarom, tot, toe, tegenover, tegen;
    false 'adverb serieus' feedback corrected; three match feedback lines made true for every pool member. 3rd
    pass: 9 findings (1 blocker: vooral 'above all' = bovenal), all fixed: vooral, daarom, klopt, nut out of
    the translation pools; glosses eindoordeel, stijgen, geef, daar; wanneer is now a particle 'when
    (conjunction)'. Deferred (engine): lesson04.order.002 / lesson05.order.002 inverted V2 orders,
    lesson02.order.003. Status kept unreviewed: the third pass found defects, now fixed, so one more clean
    fresh-context pass is needed.

    NATIVE-REVIEW FLAGS for Ramin (unchanged, need a native judgement): 'serieus gewicht'; 'niet noodzakelijk'
    vs noodzakelijkerwijs; 'Alles afwegend' vs 'Alles overwegende'; subclause order with openblijft; kracht vs
    overtuigingskracht; geldt/klopt; toegankelijkheid/bereikbaarheid.

    Language review 2026-10-20 (fresh context; no access to the authoring session): read every template
    against its real course-scope pool (backfill_lexemes_en_nl iter_specs + lexeme_matches) and the nl
    realization: Dutch frames and feedback sentences, English feedback translations, MC/matching gloss
    collisions, typed-translation alternatives, fill_in_blank uniqueness, register. 0 defects:
    concession, qualification and weighing frames correct; guided translations (er ... baat bij, Alles
    afwegend) pin word order; feedback accurate. Status moves to reviewed. Native flags above unchanged
    ('serieus gewicht', 'niet noodzakelijk' - both mirror the realization and overlay).
