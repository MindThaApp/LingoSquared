schema_version: '1.0'
pack_key: practice.en-nl.a1.unit36
source_language: en
target_language: nl
unit_content_key: nl.a1.unit36.verjaardag
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. en-nl A1
    unit36 (verjaardag: birthday/party vocab) has 12 lexemes across the 5
    lessons that carry lexemes (lesson01/02/03/05/06; lesson04 has zero
    introduced lexemes). 10 of 12 carry the unit-wide `verjaardag_vocab` tag
    (excluded: `Iedereen` "everyone" and `jullie` "you plural", both pronouns
    -- correctly kept out by the `part_of_speech` filter, not just the tag
    union). Every recognition/production slot unions `verjaardag_vocab` (10
    distinct glosses, over the 3-option MC floor / 6-pair matching floor).
    14 templates: multiple_choice x5, translation (bare-word) x5, listen_select
    x1 (nl target has TTS), matching_pairs x1 (6 pairs over verjaardag_vocab),
    word_order x1 ("Mijn {item} is op de achttiende april." anchored to the
    single-member `verjaardag_verjaardag_single` tag = verjaardag only),
    fill_in_blank x1 ("Wanneer is je {item}?" same single-member anchor,
    reused deliberately -- it is the only *_single tag this unit has).
    Recognition 6 (5 MC + 1 listen), structured 3 (order/fill/match),
    production 5 -- all three tiers clear the >=3 template bar. Course-scope
    check: both the word_order and fill_in_blank frames use
    `verjaardag_verjaardag_single`, whose course-wide pool is exactly 1 token
    (verjaardag) -- deterministic, no grammaticality risk. No mis-glossed
    lexeme found; `laten` ("let, in 'laten we' = let's") and `gefeliciteerd`
    ("congratulations") read correctly against the unit's own teaching
    content. Needs the standard fresh-context review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - verjaardag_vocab
    - verjaardag_verjaardag_single
templates:

# lesson01 -- de verjaardag
- content_key: practice.en-nl.nl.a1.unit36.lesson01.choose.001
  lesson_content_key: nl.a1.unit36.lesson01.de_verjaardag
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, phrase]
      agreement_tags: {semantic: verjaardag_vocab}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} belongs to this unit''s birthday/party vocabulary.'
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit36.lesson01.translate.002
  lesson_content_key: nl.a1.unit36.lesson01.de_verjaardag
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, phrase]
      agreement_tags: {semantic: verjaardag_vocab}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit36.lesson01.order.003
  lesson_content_key: nl.a1.unit36.lesson01.de_verjaardag
  type: word_order
  frame: {text: 'Mijn {item} is op de achttiende april.', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: verjaardag_verjaardag_single}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Mijn {item} is op de achttiende april.', language_code: nl, direction: ltr}
  feedback_frame:
    text: Mijn verjaardag is op de achttiende april. -- My birthday is on the eighteenth of April.
    language_code: en
    direction: ltr

