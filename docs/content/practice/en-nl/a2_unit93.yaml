schema_version: '1.0'
pack_key: practice.en-nl.a2.unit93
source_language: en
target_language: nl
unit_content_key: nl.a2.unit93.voordat_nadat_wanneer
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 87-94 pass): 0 pack fixes. Dumped the shared union slot at unit scope (23 lexemes) and A2 course scope (118) and read every gloss; capacity with the '.a2.unit93.' filter: 15 templates, 85% coverage overall and in every tier, 5/5 lessons in every tier, no dead templates, pools above the MC and matching floors. Bare-word frames only. Backfill glosses for the coordinator: steeds 'still (part of a two-word expression)' at course scope while this unit uses steeds 'again and again' (wat steeds gebeurt); bus carries an idiom note ('the tin ...'); Met 'This is'; thuiskom 'come home' sits next to thuiskomen 'to come home' as a near-synonym option, the same finite/infinitive pattern as the other grammar units; the unit pool also drills grammar metalanguage (bijzin, perfectum, heden, persoonsvorm at course scope). Earlier notes: Authored for the lessons of A2 unit 93 that have backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases are left out. Excluded conjunction particles (voordat, nadat, Als) because of confusable glosses. Backfill glosses to double-check: heden, een with accent, thuiskom/thuiskomen/thuiskwam, gedoucht. Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - voordat_clause
    - nadat_ik_gegeten_heb
    - voordat_nadat_contrast
    - wanneer_als_clauses
    - travel_day_reading
templates:
- content_key: practice.en-nl.nl.a2.unit93.lesson01.choose.001
  lesson_content_key: nl.a2.unit93.lesson01.voordat_ik_ga
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [voordat_clause, nadat_ik_gegeten_heb, voordat_nadat_contrast, wanneer_als_clauses, travel_day_reading]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit93.lesson01.match.002
  lesson_content_key: nl.a2.unit93.lesson01.voordat_ik_ga
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit93.lesson01.translate.003
  lesson_content_key: nl.a2.unit93.lesson01.voordat_ik_ga
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

