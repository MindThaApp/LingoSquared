schema_version: '1.0'
pack_key: practice.en-nl.a1.unit55
source_language: en
target_language: nl
unit_content_key: nl.a1.unit55.restaurant
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-24 (en-nl practice pass, session 10): 15 fixes -- feedback_frame texts that named
    "this unit" or claimed topic membership (false for the level-scope pool) replaced with true generic
    feedback; fixed-sentence feedback now gives the full Dutch sentence with English. Native flags:
    bare-verb glosses carrying '(with ik)' style hints, 'kaart' gloss (map vs card), 'zwemmen =
    swimming', 'dicht = close' (see report).

    Vocabulary unit (restaurant). lesson01 (ik_wil_naar_het_restaurant) and lesson03
    (mag_ik_de_rekening) produce ZERO backfilled lexemes (confirmed via the official §0 capacity dump)
    -- per recipe DO-NOT #8 no template is anchored to either; only lesson02/04/05/06 (4 of 6) are
    represented, and this is a real, noted capacity gap, not a defect in this pack.
    Recognition/production templates union the represented lessons' tags via restaurant_vocab (7
    distinct content tokens, unit-scoped). matching_pairs (lesson05) uses all 6 non-proper tokens
    available (menukaart, bestellen, gekozen, soep, dagmenu, dranken) -- bioscoop (lesson06) held back
    to keep the pair count at the standard 6. word_order ('Ik lees het {item}.') and fill_in_blank ('Wat
    kost het {item}?') both anchor restaurant_dagmenu_single (exactly 1 course-wide candidate, verified
    against backfill_lexemes_en_nl), reusing the realization's own example sentence and its lesson05
    hero phrase, so both are grammatical and course-scope safe by construction. Read every gloss against
    the realization text (gekozen='chosen (past participle of kiezen)' matches 'Heeft u al
    gekozen?'='Have you already chosen?' -- correct). Capacity/coverage measured with the official §9
    script; see report.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - restaurant_vocab
    - restaurant_dagmenu_single
