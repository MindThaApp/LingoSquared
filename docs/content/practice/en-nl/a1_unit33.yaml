schema_version: "1.0"
pack_key: practice.en-nl.a1.unit33
source_language: en
target_language: nl
unit_content_key: nl.a1.unit33.vervoer
review:
  status: reviewed
  fresh_context: "true"
  required_next_reviewer: native_speaker_review
  notes: "Review 2026-10-24 (en-nl practice pass, session 10): 6 fixes -- translate.003/.001 prompt no longer reads I travel by the bike (gloss carries the article); 3 feedback lines no longer put a Dutch word into the English half; 2 Dutch feedback frames retagged nl. Native flags: Ik reis met de fiets (ik ga met de fiets is more usual).

    Authored 2026-07-09 by the practice-template depth-closing pass
    (same pass as a1_unit29-32.yaml -- see a1_unit29.yaml's review.notes
    for the full manifest-gap context). This file covers unit33
    (transportation and commuting), the last unit in this pass's covered
    range (units 34+ remain a gap for a future pass -- see the
    practice_manifest.txt line-update instruction reported alongside this
    file). Extended scripts/backfill_lexemes_en_nl.py with 4 new semantic
    tags scoped to this unit's own real vocabulary (transport_noun:
    3-member trein/fiets/auto, verified safe generatively in 'Ik reis met
    de {item}.' via translation ONLY, matching this unit's own real
    realization file's review.notes, which explicitly avoided any bare
    Dutch fill_in_blank on this pool ('all four are grammatically valid
    completions of Ik reis met de ___'); transport_verb: 3-member
    conjugated recognition-only pool fietst/rijdt/reist, no shared
    generative frame since each takes a different subject, same discipline
    as unit31's pet_care_verb; transport_vocab: broader 8-member combined
    noun+verb recognition-only pool (trein/fiets/auto + fietst/rijdt/
    reist/lopen/reizen, the last two reusing already-classified verb
    infinitives) for a bigger matching_pairs finale, same combined-tag
    technique as a2_unit24's gemeente_noun_or_verb;
    vervoer_alstublieft_single: single-member tag reusing unit06's
    already-classified 'alstublieft' for this unit's own real
    fill_in_blank, 'Een kaartje naar Amsterdam, ___.' -- matching the
    realization file's own choice verbatim). Every generative frame's
    literal text was checked against its own slot's candidate set for
    self-reference (none found -- 'Ik reis met de {item}.' shares no
    literal word with trein/fiets/auto). Real course-wide candidate counts
    verified with a standalone lexeme_matches()-replicating harness before
    writing these templates -- confirmed no case-duplicate contamination
    on any of this unit's own capitalized forms (Die/Welk/Fietsen were all
    checked and none collide with a lowercase sibling used in these
    tags). 15 templates across all 6 lessons: multiple_choice x3,
    listen_select x4, matching_pairs x1 (8-pair transport_vocab pool
    anchored lesson05), fill_in_blank x1 (single-candidate), word_order x2,
    translation x4. Needs the standard fresh-context review before import.
    Blocking dependency, same as every other en-nl pack: backfill_
    lexemes_en_nl.py has not actually been run against a real database
    yet.

    REAUTH 2026-07-24 (unit-scope DEAD/FLOOR fix pass, pack-only, no
    backfill/realization edits): this file's own notes describe
    transport_noun as a '3-member trein/fiets/auto' pool, but trein is
    introduced in unit15/unit74, not this unit -- unit33 only natively
    contributes fiets/auto (2 tokens), so lesson01.choose.001/listen.002
    and lesson03.listen.001 (all transport_noun-only) were below the
    3-distinct MC/listen floor at unit scope. Similarly
    vervoer_alstublieft_single's only course-wide token, alstublieft, is
    unit06/unit24 vocabulary -- lesson03.fill.002 was DEAD (0 unit-scoped
    candidates). And transport_vocab's unit-scoped pool is 7 tokens
    (fiets/reist/auto/lopen/reizen/fietst/rijdt), one short of
    lesson05.match.001's declared 8-slot need (the 8th course-wide member
    is, again, unit15/74's trein) -- also DEAD. Fixes: (1) widened
    lesson01.choose.001/listen.002/lesson03.listen.001 from transport_noun
    to the pack's own already-defined transport_vocab (SS3.1a, union of
    transport_noun+transport_verb, already used successfully for
    lesson05's matching_pairs) -- 7 unit-scoped distinct glosses, well over
    the floor; updated feedback_frame text from 'is a mode of transport'
    to 'is a transport word from this unit' since the pool now includes
    verbs (reist/lopen/reizen/fietst/rijdt) alongside the two nouns.
    transport_noun's narrower, verified-grammatical use in
    translate.003/order.004/lesson04.order.002/lesson06.translate.001 ('Ik
    reis met de {item}.') is untouched -- 2 unit-scoped candidates is fine
    there, no floor applies to translation/word_order. (2) lesson03's
    fill_in_blank had no viable unit-native single-member replacement --
    searched every tag lesson03's own lexemes (loket/onbekende/Welk/
    centrum) carry; the only one available, `ticket_purchase`, is a
    generic cross-course tag with 30+ course-wide members, unusable as a
    fill_in_blank anchor without a new backfill tag. Per the recipe's HARD
    RULES, replaced it with a same-tier (structured) word_order instead:
    lesson03.order.002, reusing transport_noun (word_order has no
    candidate floor) with a NEW verified-grammatical frame, 'Ik neem de
    {item} naar het werk.' (checked for all 3 course-wide members --
    fiets/auto/trein all fit; deliberately a different sentence from
    lesson01/04/06's 'Ik reis met de {item}.' for variety) -- self-
    reference checked, none of Ik/neem/de/naar/het/werk is a transport_noun
    candidate. (3) lesson05.match.001 reduced from 8 to 7 slots/relation
    members (matching its true unit-scoped transport_vocab pool exactly),
    still comfortably inside the recipe's 6-12 pair range -- no tag change
    needed. Removed the now-unused vervoer_alstublieft_single preset and
    tag_schema entry. transport_verb's standalone lesson02/lesson04/
    lesson06 uses are untouched (3 unit-scoped candidates, already clears
    the floor). Template count unchanged at 14 (this file's own 2026-07-09
    notes above say '15 templates' but the actual templates: list has
    always had 14 -- a pre-existing off-by-one in the prose, not something
    this pass introduced; 1 fill_in_blank -> 1 word_order; matching_pairs
    still 1, now 7-pair not 8-pair). Post-fix: 0 DEAD, 0 FLOOR for this
    pack."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [transport_noun, transport_verb, transport_vocab]
slot_presets:
  transport_noun: &transport_noun {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: transport_noun}}
  transport_verb: &transport_verb {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: transport_verb}}
  transport_vocab: &transport_vocab {language_code: nl, part_of_speech: [noun, verb], agreement_tags: {semantic: transport_vocab}}
templates:
  - content_key: practice.en-nl.nl.a1.unit33.lesson01.choose.001
    lesson_content_key: nl.a1.unit33.lesson01.vervoer_woorden
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *transport_vocab}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a transport word from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit33.lesson01.listen.002
    lesson_content_key: nl.a1.unit33.lesson01.vervoer_woorden
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *transport_vocab}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit33.lesson01.translate.003
    lesson_content_key: nl.a1.unit33.lesson01.vervoer_woorden
    type: translation
    frame:
