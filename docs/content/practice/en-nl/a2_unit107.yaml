schema_version: '1.0'
pack_key: practice.en-nl.a2.unit107
source_language: en
target_language: nl
unit_content_key: nl.a2.unit107.uitnodigen_en_afslaan
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 102-108 pass): 0 fixes. Dumped the unit-scope
    pool (31 of 35 unit lexemes hostable) and the A2 course-scope pool (93) of the single union slot
    and read every gloss; Om carries "at (a time); around", which is the sense this unit uses (Om
    acht uur). All 18 templates are bare-word, so frame grammaticality and self-reference do not
    arise. Capacity: 6/6 lessons in every tier, 89% coverage per tier, no dead templates, MC and
    listen pools over 3 glosses, matching pools over 6 tokens. Backfill issue routed for a fix (not
    editable here): Zondag and zondag are two lexemes with the same gloss "Sunday" (multiple choice
    folds them, but both can land in one matching exercise); the sentence-initial form should fold
    onto zondag.
    Authored for the lessons of A2 unit 107 that have backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases are left out.  Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - invitation_events
    - invitation_accepting
    - invitation_declining
    - invitation_alternative
    - invitation_reading
    - holiday_dialogue
templates:
- content_key: practice.en-nl.nl.a2.unit107.lesson01.choose.001
  lesson_content_key: nl.a2.unit107.lesson01.een_uitnodiging
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [invitation_events, invitation_accepting, invitation_declining, invitation_alternative, invitation_reading, holiday_dialogue]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit107.lesson01.match.002
  lesson_content_key: nl.a2.unit107.lesson01.een_uitnodiging
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit107.lesson01.translate.003
  lesson_content_key: nl.a2.unit107.lesson01.een_uitnodiging
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit107.lesson02.listen.001
  lesson_content_key: nl.a2.unit107.lesson02.ja_graag
  type: listen_select
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the meaning of the Dutch word you heard.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit107.lesson02.match.002
