review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md, as part of the en-nl B1 unit01-11
    practice-pack wave that unblocks these units'' checkpoints (the units already had lexemes from scripts/backfill_lexemes_en_nl.py
    but no pack at all, so generate_checkpoint() returned checkpoint_unavailable). 14 templates across
    5 lesson(s) with lexemes: listen_select x1, matching_pairs x2, multiple_choice x2, translation x6,
    word_order x3. Every slot is satisfiable from THIS unit''s own lexemes, because generate_checkpoint()
    calls _material() with only this unit''s lesson ids; slots use the unit''s own per-lesson semantic
    tags (unioned where a single lesson tag could not reach the >=3-option multiple_choice floor or the
    6-token matching_pairs floor), narrowed by part_of_speech to content words so no exercise ever shows
    ''the'' or ''and'' as its answer. Measured with the recipe''s capacity/coverage model against the
    real backfill data: 12 of 15 unit lexemes hostable (80%), recognition 80% / structured 80% / production
    73%, and all three tiers reach 5/5 of the lessons that have lexemes. Distinct-target capacity: recognition
    19, production 12, structured effectively unbounded (matching_pairs combinatorics). 5 of 14 templates
    carry >=5 variants. REVIEWER: lesson03 (had_kunnen_ophalen) produces ZERO lexemes from scripts/backfill_lexemes_en_nl.py,
    so it has no template and cannot appear in the checkpoint - that is a backfill gap, not a pack gap.
    The unit has only 15 lexemes in total, the thinnest of B1 01-11, so most templates are 1-4 variants.
    ''kan'' and ''Kun'' share the gloss ''can'', so the two matching_pairs have one duplicate RIGHT value
    (legal many-to-one, AUTHORING_GUIDE #16). General double-checks for this wave: (a) every word_order/fill_in_blank
    frame was verified against its slot''s whole-B1-course candidate pool, not just the unit pool, so
    Endless Practice cannot render an ungrammatical sentence; (b) no frame''s literal text contains any
    of its own slot''s candidate values (defect 1.14); (c) listen_select frames are bare ''{item}'' so
    no distractor can be a word the audio itself says (defect 1.22); (d) matching_pairs pools were read
    by hand for interchangeable English glosses. Needs the standard fresh-context review before import. Fresh-context review 2026-10-10 (content-reviewer.md checklist): read all 14 templates against unit- and course-scoped pools (frame grammaticality, derived answers, distractor/gloss collisions, matching confusables, self-reference, booleans, jargon). FIXED: (1) lesson04.order.002 frame ''Kun jij die {item} ook?'' rendered the nonsense ''Kun jij die gemeente ook?'' for the pool member gemeente (no tag separates it from dag) - frame rewritten to ''Dat is een goede {item}.'', grammatical for every unit/course member (afspraak, gemeente, dag, maand), feedback example updated. (2) lesson04.translate.004 showed the bare prompt ''can'' with the single answer ''Kun'', so a learner typing the equally correct ''kan'' was not graded correct - verb dropped from the slot POS (pool now afspraak/gemeente/dag; maken loses this production template only). (3) lesson05.choose.001 feedback claimed every option ''appears in the text about Lotte and her passport'', false for mogelijkheid/goede (lesson06) and for course-scope members - neutralised to ''{item} is a word from your lessons.'' DEFERRED: lexeme glosses moet ''must; is due'' vs moeten ''must; need to'' are interchangeable as matching rights and both reach lesson04.match.003 at course scope (moeten via b1_unit_review) - fix belongs in backfill_lexemes_en_nl.py (e.g. moet ''must (ik/jij/hij moet)''); fixed-sentence translation.005 accepts one word order only (systemic). 3 defects fixed, 2 deferred, no native flag.'
