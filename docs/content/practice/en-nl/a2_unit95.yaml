schema_version: '1.0'
pack_key: practice.en-nl.a2.unit95
source_language: en
target_language: nl
unit_content_key: nl.a2.unit95.als_dan
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 95-101 pass): 0 fixes. Dumped the unit-scope
    pool (8 lexemes, lessons 01 and 04 only; strand, bon, korting, gratis, betaalt, krijg,
    vijftig, bezorging) and the course-scope pool of the union slot (41 lexemes) and read
    every gloss: all match the sense this unit teaches. Course scope has krijg and krijgen
    both glossed "get; receive"; identical rights in matching are legal and multiple-choice
    options are de-duplicated, so no item becomes unanswerable. All frames are bare-word,
    so no self-reference or frame-grammar risk. Capacity: 6 live templates, 8/8 lexemes hosted,
    2/2 lessons in every tier, no dead or under-floor template. The pack stays below the recipe's
    12-template and 3-per-tier bars because the backfill gives only 8 lexemes in two lessons;
    a checkpoint can still be drawn (8 multiple-choice, 8 listen, 8 translation items plus
    matching). Authored for the lessons of A2 unit 95 that have backfilled lexemes (grammar-led
    unit). Recognition, matching and bare-word production use a unit-wide union of the unit
    lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so
    every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns,
    proper nouns, particles and phrases are left out. Only lessons 01, 04, 05 and 06 carry
    lexemes; 02 and 03 have none, and 05/06 only hoi/Noor/Omar (particle/proper noun, excluded),
    so templates anchor on lessons 01 and 04. Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - als_condition_clause
    - shop_rules_conditionals
templates:
- content_key: practice.en-nl.nl.a2.unit95.lesson01.choose.001
  lesson_content_key: nl.a2.unit95.lesson01.als_het_regent
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [als_condition_clause, shop_rules_conditionals]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit95.lesson01.match.002
  lesson_content_key: nl.a2.unit95.lesson01.als_het_regent
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit95.lesson01.translate.003
  lesson_content_key: nl.a2.unit95.lesson01.als_het_regent
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit95.lesson04.listen.001
  lesson_content_key: nl.a2.unit95.lesson04.regels_in_de_winkel
  type: listen_select
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the meaning of the Dutch word you heard.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit95.lesson04.match.002
  lesson_content_key: nl.a2.unit95.lesson04.regels_in_de_winkel
  type: matching_pairs
  frame: *match_frame
  slots: *match_slots
  slot_relations: *match_relations
  answer_derivation: *match_answer
  feedback_frame: *match_feedback
- content_key: practice.en-nl.nl.a2.unit95.lesson04.translate.003
  lesson_content_key: nl.a2.unit95.lesson04.regels_in_de_winkel
  type: translation
  frame: *translation_frame
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: *translation_feedback

