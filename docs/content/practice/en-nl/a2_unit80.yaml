schema_version: '1.0'
pack_key: practice.en-nl.a2.unit80
source_language: en
target_language: nl
unit_content_key: nl.a2.unit80.afspraak_verzetten
review:
  status: reviewed
  fresh_context: 'false'
  required_next_reviewer: native_speaker_review
  notes: 'Authored 2026-10-27 (session 17) for A2 unit 80 "Een afspraak verzetten" (moving an appointment). 28 templates over
    all 6 lessons: multiple_choice, listen_select, matching_pairs, word_order, fill_in_blank and translation (bare-word and
    fixed-sentence). The lexeme backfill (scripts/backfill_lexemes_en_nl.py) classifies the unit: new glosses and parts of
    speech, six lesson_categories entries, a unit-scoped gloss for spijt, and curated pools verzet_* gated on the unit''s
    lessons. Fixed sentences use one-member anchor tags (verzet_single_*) so every fill_in_blank slot has exactly one course-wide
    candidate; accepted_variants cover the verb-second order (day first or after ik). English contraction expansions are folded
    by the shared grader and are not listed. Needs the standard fresh-context review and the native-speaker pass before import.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - verzet_infinitives
    - verzet_nouns
    - verzet_single_afspraak
    - verzet_single_annuleren
    - verzet_single_komen
