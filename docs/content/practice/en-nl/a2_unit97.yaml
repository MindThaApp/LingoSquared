schema_version: '1.0'
pack_key: practice.en-nl.a2.unit97
source_language: en
target_language: nl
unit_content_key: nl.a2.unit97.doorgeven_wat_iemand_zegt
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 95-101 pass): 0 fixes. Dumped the unit-scope
    pool (4 lexemes: briefje, vragen, doorgeven, o) and the course-scope pool of the union
    slot (30 lexemes) and read every gloss. vragen carries "to ask for" (request sense, shared
    with A1 unit 23) while this unit teaches vragen = to ask (a question); it is kept because
    removing it drops the pool under the 3-option floor, and it is reported for a backfill
    gloss fix. Capacity: 4 live templates, 3/4 lexemes hosted, lessons 2/3 for recognition
    and production, no structured template; no single-member tag exists that would make a
    grammatical word_order frame possible. The unit checkpoint stays unavailable until the
    backfill classifies more of the unit, as the original notes say. Authored for the lessons
    of A2 unit 97 that have backfilled lexemes (grammar-led unit). Recognition, matching and
    bare-word production use a unit-wide union of the unit lesson semantic tags over content
    words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the
    3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases
    are left out. VERY THIN: the unit has only 4 backfilled lexemes (3 hostable: briefje,
    vragen, doorgeven; o is a particle). No matching_pairs (below the 6-pair floor) and the
    unit checkpoint stays unavailable (under 12 items) until the backfill classifies more
    of the unit. Needs a backfill extension, not more pack templates. Native speaker should
    confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - reported_speech_statement_simple
    - relay_message_dialogue
templates:
- content_key: practice.en-nl.nl.a2.unit97.lesson01.choose.001
  lesson_content_key: nl.a2.unit97.lesson01.wat_zegt_hij
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [reported_speech_statement_simple, relay_message_dialogue]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit97.lesson01.translate.002
  lesson_content_key: nl.a2.unit97.lesson01.wat_zegt_hij
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit97.lesson04.listen.001
  lesson_content_key: nl.a2.unit97.lesson04.een_bericht_doorgeven
  type: listen_select
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the meaning of the Dutch word you heard.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit97.lesson04.translate.002
  lesson_content_key: nl.a2.unit97.lesson04.een_bericht_doorgeven
  type: translation
  frame: *translation_frame
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: *translation_feedback

