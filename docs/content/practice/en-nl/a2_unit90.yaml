schema_version: '1.0'
pack_key: practice.en-nl.a2.unit90
source_language: en
target_language: nl
unit_content_key: nl.a2.unit90.goede_raad
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 87-94 pass): 0 pack fixes. Dumped the shared union slot at unit scope (9 lexemes) and A2 course scope (178) and read every gloss; capacity with the '.a2.unit90.' filter: 18 templates, 100% coverage overall and in every tier, 5/5 lessons in every tier, no dead templates, unit pool 9 distinct glosses (MC floor 3, matching floor 6). Bare-word frames only. The union keeps past_habits_dialogue because it is the only tag on tips (lesson06); at course scope that tag is very broad (178 members) and brings in was 'do the dishes (with ik)', a known backfill mis-gloss, so the coordinator should route was and, ideally, narrow the past_habits_dialogue tag on tips. Earlier notes: Authored for the lessons of A2 unit 90 that have backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases are left out. Thin unit (13 hostable lexemes). Backfill glosses to double-check: bed, bedankt/Bedankt (phrase, excluded by part of speech). Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - advice_moeten
    - advice_zou_moeten
    - advice_strength_contrast
    - advice_waarom_niet
    - advice_message_reading
    - past_habits_dialogue
templates:
- content_key: practice.en-nl.nl.a2.unit90.lesson01.choose.001
  lesson_content_key: nl.a2.unit90.lesson01.je_moet_rusten
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [advice_moeten, advice_zou_moeten, advice_strength_contrast, advice_waarom_niet, advice_message_reading, past_habits_dialogue]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit90.lesson01.match.002
  lesson_content_key: nl.a2.unit90.lesson01.je_moet_rusten
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit90.lesson01.translate.003
  lesson_content_key: nl.a2.unit90.lesson01.je_moet_rusten
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit90.lesson02.listen.001
  lesson_content_key: nl.a2.unit90.lesson02.je_zou_moeten
  type: listen_select
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the meaning of the Dutch word you heard.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit90.lesson02.match.002
  lesson_content_key: nl.a2.unit90.lesson02.je_zou_moeten
  type: matching_pairs
  frame: *match_frame
  slots: *match_slots
  slot_relations: *match_relations
  answer_derivation: *match_answer
  feedback_frame: *match_feedback
