schema_version: '1.0'
pack_key: practice.en-nl.a2.unit77
source_language: en
target_language: nl
unit_content_key: nl.a2.unit77.iets_terugbrengen
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-07-11, alongside the sibling a2_unit74/75/76.yaml packs -- see a2_unit74.yaml''s own review notes
    for the shared background. This file covers unit77 (iets terugbrengen: reporting broken headphones, asking for a refund,
    the receipt/return-window exchange, and the shop''s retourbeleid).

    scripts/backfill_lexemes_en_nl.py already had broad recognition-only tags for this unit (shopping_complaint_vocab: 7 nouns
    -- koptelefoon/linkerkant/bonnetje/retourbeleid/artikel/aankoop/ exemplaar; shopping_complaint_verb: 4 verbs -- ruilen/terugkrijgen/
    terugbrengen/regel). This pass adds 6 new single-member *_single tags (terugbrengen_koptelefoon_single/_bonnetje_single/
    _retourbeleid_single/_ruilen_single/_artikel_single/ _terugkrijgen_single) anchoring each lesson''s hero full sentence
    for word_order/translation/fill_in_blank via render_frame/ slot_text -- single-member by construction.

    Real case-duplicate found and fixed while verifying shopping_complaint_vocab''s actual course-wide pool: it contains both
    lowercase ''retourbeleid'' (lesson04 vocab card) and capitalized ''Retourbeleid'' (lesson05 reading''s own heading), both
    meaning ''the return policy'' with an identical English gloss -- harmless for bare-word multiple_choice/listen_select
    (one word at a time) but a real risk for matching_pairs (could sample both as two simultaneous, effectively-duplicate
    cards). Added a new exact-case ''shopping_complaint_vocab_pure'' sibling to scripts/backfill_lexemes_en_nl.py (excludes
    the capitalized duplicate by construction, same fix class as this file''s existing job_interview_vocab_pure/housing_report_noun_pure
    precedent) and used THAT tag for both matching_pairs templates below instead of the plain casefolded tag.

    14 templates across all 6 lessons: multiple_choice x2, listen_select x3, matching_pairs x2 (4-pair shopping_complaint_vocab_pure
    pool in lesson03, 3-pair shopping_complaint_verb pool in lesson06), word_order x2, fill_in_blank x2, translation x3. Both
    fill_in_blank slots (bonnetje_single, artikel_single) have exactly 1 course-wide candidate by construction -- re-verified
    by re-running scripts/_fill_in_blank_ambiguity_check.py after adding this file''s PACKS entry, 0 flagged. Needs the standard
    fresh-context review before import. Same blocking dependency as every other en-nl pack: backfill_lexemes_en_nl.py has
    not actually been run against a real database yet (only --dry-run, which succeeds).'
