schema_version: '1.0'
pack_key: practice.en-nl.a2.unit81
source_language: en
target_language: nl
unit_content_key: nl.a2.unit81.een_drukke_ochtend
review:
  status: unreviewed
  fresh_context: 'false'
  required_next_reviewer: native_speaker_review
  notes: >-
    Authored for the six lessons of A2 unit 81. Recognition and production use a
    unit-wide union of safe morning-routine tags; structured practice uses the same
    union without adjectives in six-pair matching tasks, plus a transport word-order
    frame and a single-candidate fill-in-blank. The lexemes bus and was are excluded:
    bus carries the stale gloss "the tin (in an idiom for 'it adds up perfectly')"
    although this unit teaches the vehicle, and was carries "do the dishes (with ik)"
    although the reading uses the past tense of zijn. Native review should confirm
    that the broad word/gloss pools remain pedagogically clear for this grammar-led
    unit and that the feedback wording sounds natural in English.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic: &safe_tags
    - time_of_day
    - transport_noun
    - routine_verb_infinitive
    - morning_steps_vocabulary
    - participle_ge_contrast
    - morning_negation_dat_clause
    - place_non_station
    - busy_morning_dialogue

templates:
# lesson01 -- Ge- in het midden
- content_key: practice.en-nl.nl.a2.unit81.lesson01.choose.001
  lesson_content_key: nl.a2.unit81.lesson01.ge_in_het_midden
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &broad_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, particle, phrase]
      agreement_tags: {semantic: *safe_tags}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'This word is used to describe the busy morning.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit81.lesson01.listen.002
  lesson_content_key: nl.a2.unit81.lesson01.ge_in_het_midden
  type: listen_select
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots: {item: *broad_word}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'The Dutch word you heard means {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit81.lesson01.match.003
  lesson_content_key: nl.a2.unit81.lesson01.ge_in_het_midden
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: nl, direction: ltr}
  slots:
    first: &match_word
      language_code: nl
      part_of_speech: [noun, verb, adverb, particle, phrase]
      agreement_tags: {semantic: *safe_tags}
    second: *match_word
    third: *match_word
    fourth: *match_word
    fifth: *match_word
    sixth: *match_word
  slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
  answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
  feedback_frame: {text: 'Match each Dutch morning word with its English meaning.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit81.lesson01.order.004
  lesson_content_key: nl.a2.unit81.lesson01.ge_in_het_midden
  type: word_order
  frame: {text: 'Ik ga met de {item}.', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: noun
      agreement_tags: {semantic: transport_noun}
  answer_derivation:
    kind: render_frame
    frame: {text: 'Ik ga met de {item}.', language_code: nl, direction: ltr}
  feedback_frame: {text: 'Put the Dutch travel sentence in the correct order.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit81.lesson01.translate.005
  lesson_content_key: nl.a2.unit81.lesson01.ge_in_het_midden
  type: translation
  frame: {text: '{item}', language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
  slots: {item: *broad_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'The Dutch answer is {item}.', language_code: en, direction: ltr}

