    slots: {item: *payment_verb}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit23.lesson02.match.003
    lesson_content_key: nl.a1.unit23.lesson02.pinnen_of_contant
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: nl, direction: ltr}
    slots:
      first: {language_code: nl, part_of_speech: [verb, noun], agreement_tags: {semantic: [payment_verb, number]}}
      second: {language_code: nl, part_of_speech: [verb, noun], agreement_tags: {semantic: [payment_verb, number]}}
      third: {language_code: nl, part_of_speech: [verb, noun], agreement_tags: {semantic: [payment_verb, number]}}
      fourth: {language_code: nl, part_of_speech: [verb, noun], agreement_tags: {semantic: [payment_verb, number]}}
      fifth: {language_code: nl, part_of_speech: [verb, noun], agreement_tags: {semantic: [payment_verb, number]}}
      sixth: {language_code: nl, part_of_speech: [verb, noun], agreement_tags: {semantic: [payment_verb, number]}}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Match each word with its English meaning.", language_code: en, direction: ltr}
