schema_version: "1.0"
pack_key: practice.en-nl.a1.unit23
source_language: en
target_language: nl
unit_content_key: nl.a1.unit23.money
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-06 by the Claude session extending the en-nl
    Endless Practice pool to cover the real content gap flagged this
    session: en-nl practice templates only went through unit16 while the
    actual Dutch lesson content already goes through unit23. This file
    covers unit23 (money and paying): asking a total price, choosing card
    or cash, splitting a bill, handling change, and reading a restaurant
    bill. Reuses the EXISTING global 'number' semantic tag (already a
    broad, well-established cross-unit tag; vijfentwintig/vijfendertig
    were added to its member set as part of this pass) for 'Het kost
    {item} euro in totaal.' -- verified every cardinal number is
    grammatically valid stating a euro price. Added a 5-member
    'payment_verb' tag (betalen/pinnen/afrekenen/delen/vragen) verified
    safe in the polite request frame 'Mag ik {item}?' -- every member is
    a natural bare-infinitive answer to 'what would you like to do' after
    'mag ik' (pinnen/afrekenen directly attested in the real content;
    betalen/delen/vragen grammatically identical bare-infinitive slots in
    the same shape). A 3-member 'payment_noun' tag (rekening/wisselgeld/
    totaal) is recognition-only (each takes a different
    article/context), exactly meeting the >=3-distinct floor for
    multiple_choice/listen_select. Every slot's real candidate count was
    verified with a standalone lexeme_matches()-replicating harness
    against this script's actual output before writing these templates.
    Needs the standard fresh-context review before import. Same blocking
    dependency as every earlier en-nl pack: backfill_lexemes_en_nl.py has
    not actually been run against a real database yet.

    2026-07-24 unit-scope re-authoring pass (checkpoint-viability fix,
    PACK-ONLY, see docs/content/PRACTICE_PACK_RECIPE.md): lesson02's
    match.003 declared 5 slots over 'payment_verb', but the real
    backfilled pool for that tag is only 4 unit-native distinct tokens
    (betalen, delen, afrekenen, vragen -- 'pinnen' is not actually
    present as a classified lexeme in the current backfill despite this
    note's original claim; not something a pack-only pass can fix) --
    5 needed > 4 available, so the template never generated (recipe
    DO-NOT #5). Widened to the union 'payment_verb' + 'number' (both
    already declared in this file) at 6 slots: adds 'vijfentwintig'/
    'vijfendertig' (both unit23-native, lessons 01/05). Deliberately did
    NOT widen with 'payment_noun' instead, even though it looks like the
    more thematic choice: that tag's unit-native pool has a real
    case-duplicate trap -- 'rekening'/'Rekening' and 'totaal'/'Totaal'
    are the same word reintroduced with a capital in the lesson05
    receipt-reading card, both still carrying 'payment_noun', which
    would put two effectively identical cards in the same matching
    exercise (the defect class the recipe's §6.3 flags from
    a2_unit77). The verb+number union has no such duplicate.
    feedback_frame is left as the generic 'Match each payment word with
    its English meaning.', which is now slightly loose (2 of 6 cards are
    numbers, not payment words) but not inaccurate enough to warrant a
    learner-facing rewrite; flagging for the reviewer. Verified via
    scripts/_practice_unit_scope_check.py: 0 DEAD, 0 below-floor after
    this pass (was 1 DEAD, 0 below-floor).

    2026-07-24 tier-thinness polish pass (production tier had only 2 live
    templates, both the fixed 'It costs {item} euros in total.' sentence):
    added lesson06.translate.003, a bare-word translation over the
    bill_dialogue tag narrowed to verbs (6 unit tokens: betaalt/betalen/
    delen/geholpen/hebt/vragen, all with distinct glosses; course scope
    adds Kan/Zullen/is/kost/pinnen, all safe varied bare-word prompts).
    Deliberately did NOT use payment_verb for this typed exercise: its
    pool pairs betalen 'to pay' with afrekenen 'to settle the bill; to
    pay', and a learner shown the bare prompt 'to pay' who types
    afrekenen would be marked wrong -- fine for recognition (where those
    templates already use it), a mis-grade risk for production."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [number, payment_verb, payment_noun, payment_noun_pure, bill_dialogue]
slot_presets:
  number: &number {language_code: nl, part_of_speech: [symbol, noun], agreement_tags: {semantic: number}}
  payment_verb: &payment_verb {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: payment_verb}}
  payment_noun: &payment_noun {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: payment_noun}}
  # payment_noun_pure: exact-case (excludes capitalized Rekening/Totaal bill-label
  # variants that surface as reworded-gloss MC ambiguity). Added 2026-07-29.
  payment_noun_pure: &payment_noun_pure {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: payment_noun_pure}}
  bill_verb: &bill_verb {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: bill_dialogue}}
templates:
  - content_key: practice.en-nl.nl.a1.unit23.lesson01.translate.001
    lesson_content_key: nl.a1.unit23.lesson01.hoeveel_kost_het
    type: translation
    frame:
      text: "It costs {item} euros in total."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *number}
    answer_derivation: {kind: render_frame, frame: {text: "Het kost {item} euro in totaal.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Het kost {item} euro in totaal.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit23.lesson01.order.002
    lesson_content_key: nl.a1.unit23.lesson01.hoeveel_kost_het
    type: word_order
    frame: {text: "Het kost {item} euro in totaal.", language_code: nl, direction: ltr}
    slots: {item: *number}
    answer_derivation: {kind: render_frame, frame: {text: "Het kost {item} euro in totaal.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the price in this sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit23.lesson01.choose.003
    lesson_content_key: nl.a1.unit23.lesson01.hoeveel_kost_het
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *payment_noun_pure}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a money word from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit23.lesson02.choose.001
    lesson_content_key: nl.a1.unit23.lesson02.pinnen_of_contant
    type: multiple_choice
