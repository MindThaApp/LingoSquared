schema_version: '1.0'
pack_key: practice.en-nl.a1.unit49
source_language: en
target_language: nl
unit_content_key: nl.a1.unit49.accommodatie
review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Vocabulary unit (accommodatie / booking a room), 17 unit lexemes across
    all 6 lessons per scripts/backfill_lexemes_en_nl.py. lesson02
    (breakfast_included, 1 token) and lesson03 (key_and_wifi, 2 tokens) are
    under the multiple_choice floor on their own tag, so both fall back to
    the unit-wide union accommodatie_vocab (S3.1a/S8.1). lesson01
    (room_booking), lesson04 (checkin_dialogue), lesson05
    (confirmation_reading) and lesson06 (accommodation_wrapup_dialogue,
    restricted to part_of_speech:[verb,adjective] to exclude the proper noun
    Maastricht and the noun kamer that would otherwise duplicate lesson01)
    each had >=3 of their own tokens. word_order and fill_in_blank both
    anchor on the single-member accommodatie_bevestiging_single tag
    (bevestiging). Capacity/coverage measured via RECIPE S9 step 4 (see
    report).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 15 templates against
    unit- and course-scoped pools, glosses vs the realization, frame grammar/self-reference, floors,
    booleans and jargon. FIXED lesson05.choose.001: confirmation_reading pooled the unit46 
    case-duplicate Bevestiging => 'Confirmation' at course scope, so 'the confirmation' and 'Confirmation'
    could both appear as options (two correct answers); switched the slot to accommodatie_vocab [noun,
    verb] (unit pool 11 incl. lesson05's bevestiging/uitchecken) and made the feedback text match. FIXED
    lesson05.fill.004: 'Kunt u mij de {item} sturen?' was equally satisfied by reservering (taught
    lesson04) and graded only bevestiging; frame now 'Kunt u mij de {item} van de reservering sturen?'
    (feedback updated). DEFERRED (lexeme gloss, backfill lane): noun glosses carry 'the' while tokens
    are bare (kamer 'the room', sleutel 'the key', wifiwachtwoord, receptionist, reservering,
    bevestiging), so typing 'de kamer' in the bare-word translations is graded wrong -- glosses should
    drop 'the'. No native-judgment flags.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - room_booking
    - accommodatie_vocab
    - checkin_dialogue
    - confirmation_reading
    - accommodation_wrapup_dialogue
    - accommodatie_bevestiging_single

templates:

# -- lesson01: kamer_boeken ----------------------------------------------------
- content_key: practice.en-nl.nl.a1.unit49.lesson01.choose.001
  lesson_content_key: nl.a1.unit49.lesson01.kamer_boeken
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adverb]
      agreement_tags: {semantic: room_booking}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} is used when booking a room.'
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit49.lesson01.translate.002
  lesson_content_key: nl.a1.unit49.lesson01.kamer_boeken
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adverb]
      agreement_tags: {semantic: room_booking}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit49.lesson01.listen.003
  lesson_content_key: nl.a1.unit49.lesson01.kamer_boeken
  type: listen_select
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adjective]
      agreement_tags: {semantic: accommodatie_vocab}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: You heard {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit49.lesson01.match.004
  lesson_content_key: nl.a1.unit49.lesson01.kamer_boeken
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &accommodatie_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags: {semantic: accommodatie_vocab}
    second: *accommodatie_word
    third: *accommodatie_word
    fourth: *accommodatie_word
    fifth: *accommodatie_word
    sixth: *accommodatie_word
  slot_relations:
  - {kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}
  answer_derivation:
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame:
    text: Match each accommodation word with its English meaning.
    language_code: en
    direction: ltr

