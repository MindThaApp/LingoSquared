  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - c1u02_kern
    - c1u02_paar_adj
    - c1u02_vert
    - c1u02_afwijzing_single
    - c1u02_genoeg_single
    - c1u02_presentatie_single
    - c1u02_microfoon_single
    - c1u02_bepaald_single
    - c1u02_milde_single
    - c1u02_zacht_single
    - c1u02_teleurgesteld_single
    - c1u02_bedoeling_single
