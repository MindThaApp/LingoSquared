schema_version: '1.0'
pack_key: practice.en-nl.c1.unit02
source_language: en
target_language: nl
unit_content_key: nl.c1.unit02.tussen_de_regels
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md to make the nl.c1.unit02 (Tussen
    de regels: implication, irony, understatement, attitude, evidence-based inference) checkpoint work.
    Discourse/grammar unit, so the §8.1 pattern is used: broad slots pool across the whole unit and are
    shaped by part_of_speech, while every template''s lesson_content_key stays on one lesson. 21 templates
    over all 6 lessons: multiple_choice x5, matching_pairs x3, word_order x5, fill_in_blank x2, translation
    x6 (4 bare-word + 2 fixed-sentence). No listen_select. TAGS (new, from the c1_unit02 tags file the
    coordinator merges into the backfill): c1u02_kern is a CURATED content-word group of 70 unit-02 tokens
    (every noun/verb/adjective/adverb of the unit except the four excluded below); c1u02_paar_adj is the
    18 kern adjectives minus teleurgesteld, used only for the adjective matching_pairs so ontevreden "dissatisfied"
    and teleurgesteld "disappointed" never sit side by side as near-paraphrase cards; nine single-member
    anchors (c1u02_<token>_single) for afwijzing, genoeg, presentatie, microfoon, bepaald, milde, zacht,
    teleurgesteld, bedoeling pin every word_order / fill_in_blank / fixed-sentence translation slot to
    exactly one token. EXCLUDED from kern (so from every gloss-showing slot): laat (carries gloss "late;
    what time" - the "what time" sense is from hoe laat and is not what this unit teaches; route to backfill
    for a context gloss), is (gloss "is" is a self-gloss), was (gloss "was (with hij/zij, past of zijn)"
    is a self-gloss), milde (gloss "mild (inflected)" would collide with mild "mild" in the same pools;
    milde is hosted only by the lesson03 word_order anchor). Proper noun Lotte and all pronouns/particles/prepositions
    are excluded by part_of_speech. MEASURED (c1 harness, unit filter .c1.unit02., tags file applied):
    ALL 71/91 (78%), recognition 70/91 (77%), structured 65/91 (71%), production 70/91 (77%), 6/6 lessons
    in every tier, no dead templates, every MC slot >=3 distinct glosses, every matching pool >=6 (adj
    18, verb 22, noun 21). Course scope (whole C1): c1u02_kern resolves to the same 70 tokens, every anchor
    to exactly 1 token. Frames come from the realization''s own hero sentences (dat-clause verb-final
    inference, ironic/understated restraint). Reviewer double-checks: (a) matching verb pool contains
    betekent "means", impliceren "to imply" and suggereert "suggests" - judged distinguishable (distinct
    English words, cognate cues) but please confirm; (b) the two fixed-sentence translations carry a short
    usage hint in the English prompt (uitvallen past tense; the idiom built on uitgedrukt with the word
    for soft/gently) so that exactly one Dutch rendering is correct (De microfoon viel uit. / Dat is zacht
    uitgedrukt.) - without the hints viel weg / zwak uitgedrukt would also be valid Dutch; (c) defect-1.14
    self-reference was checked by hand (no frame literal word is its own slot''s candidate; every frame-bearing
    slot has exactly one course-scope candidate). Register: no direct address except generic je in the
    lesson01 hero sentence, matching the realization. Needs the standard fresh-context review before import.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - c1u02_kern
    - c1u02_paar_adj
    - c1u02_afwijzing_single
    - c1u02_genoeg_single
    - c1u02_presentatie_single
    - c1u02_microfoon_single
    - c1u02_bepaald_single
    - c1u02_milde_single
    - c1u02_zacht_single
    - c1u02_teleurgesteld_single
    - c1u02_bedoeling_single
