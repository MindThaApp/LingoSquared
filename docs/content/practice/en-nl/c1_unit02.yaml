schema_version: '1.0'
pack_key: practice.en-nl.c1.unit02
source_language: en
target_language: nl
unit_content_key: nl.c1.unit02.tussen_de_regels
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'true'
  notes: >-
    Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md to make the nl.c1.unit02 (Tussen de
    regels: implication, irony, understatement, attitude, evidence-based inference) checkpoint work.
    Discourse/grammar unit, so the §8.1 pattern is used: broad slots pool across the whole unit and are shaped
    by part_of_speech, while every template's lesson_content_key stays on one lesson. 21 templates over all 6
    lessons: multiple_choice x5, matching_pairs x3, word_order x7, translation x6 (4 bare-word + 2
    fixed-sentence). No fill_in_blank (the runtime shows no English cue, and neither blank was forced by its
    idiom, so both became word_order over the same sentence with the slot gloss as hint). No listen_select.
    TAGS (from the c1_unit02 tags file the coordinator merges into the backfill): c1u02_kern is a CURATED
    content-word group of 67 unit-02 tokens used by every multiple_choice and matching slot; it leaves out
    laat (gloss carries the hoe-laat sense), is and was (self-glosses), milde (would collide with mild), the
    identical cognates context and mild, and the numeral twintig (tagged noun; kept out of noun pools).
    c1u02_vert is the 52-token bare-word translation pool: kern minus every token whose gloss is equally
    answered by another common Dutch word (soepel/glad, bepaald/precies, vlekkeloos/feilloos, zacht/zachtjes,
    ernstig/serieus, behoorlijk/nogal, woordkeus/woordkeuze, rechtstreeks/direct, spreken/praten,
    wijzen/aanwijzen, ingehouden/terughoudend, blijkt/lijkt, alleen/slechts, bedoeling/intentie,
    duidelijk/helder). c1u02_paar_adj is the 17 kern adjectives minus teleurgesteld (so ontevreden and
    teleurgesteld never sit side by side as near-paraphrase cards), used only for the adjective
    matching_pairs. Nine single-member anchors (c1u02_<token>_single for afwijzing, genoeg, presentatie,
    microfoon, bepaald, milde, zacht, teleurgesteld, bedoeling) pin every word_order and fixed-sentence
    translation slot to exactly one token at course scope. GLOSSES (c1_unit02 gloss fixes file): every unit
    gloss that quoted its own Dutch token is rewritten in English only (regels, door, begrijp, nou, viel,
    bepaald, zacht, wijzen, zich); ernstig, duidelijk and rechtstreeks are reglossed to their sense here;
    finite past forms carry a person cue (ging, begon, zei, kon); verbergen is glossed to conceal. The
    fixed-sentence translations name the exact construction so one Dutch sentence is correct (De microfoon
    viel uit. via uitvallen in the simple past, not the present perfect; Dat is zacht uitgedrukt. via the
    idiom with zacht and uitgedrukt). MEASURED (c1 harness, unit filter .c1.unit02., tags and gloss fixes
    applied): ALL 68/91 (75%), recognition 67/91 (74%), structured 62/91 (68%), production 53/91 (58%), 6/6
    lessons in every tier, no dead templates, every MC slot >=3 distinct glosses, every matching pool >=6.
    Course scope: every word_order and fixed-sentence anchor resolves to exactly 1 token; no frame literal is
    its own slot's candidate. Register: no direct address except generic je in the lesson01 hero sentence,
    matching the realization. Fresh-context review 2026-10-10: 17 findings (5 blocker, 12 minor), all
    addressed (fixed, or the affected token excluded from the pool), confirmed by a pool-level scan. Needs a
    fresh-context re-review before import.

    Second independent fresh-context review 2026-10-11 (one reviewer per unit, no access to the authoring
    notes or the first review), followed by a third fresh-context verification pass on the fixed pack.
    Pack-wide fix shared by all C1 units: C1 noun glosses no longer start with 'the' (backfill
    nl_c1_bare_gloss), so a bare-word translation no longer invites 'de/het X' and word_order hints no longer
    render 'de the X' (registry 1.40). 2nd review: 16 findings (3 blocker: article glosses, afwijzing
    'refusal', misging main-clause form). Fixed: misging, begrijp, genoeg, rampzalig, ontevredenheid,
    verbergen out of c1u02_vert; glosses afwijzing, uitgedrukt, verliep, misging (no longer quote the Dutch
    infinitive), betekent, suggereert, begrijp, rechtstreeks, directeur; lesson03.translate.004 now says
    'without nog'. 3rd pass: 3 minor (uitgedrukt typed alternative, the four c1u02_vert translation templates
    overlapping, laat 'what time'), all fixed: uitgedrukt out of c1u02_vert, the four templates split by part
    of speech (noun / adjective / verb / adverb), laat 'late'. Deferred: lesson01.choose.001 (c1u02_kern, all
    parts of speech) still overlaps the other MC pools. Status kept unreviewed: the third pass found defects,
    now fixed, so one more clean fresh-context pass is needed.

    NATIVE-REVIEW FLAGS for Ramin (unchanged, need a native judgement): 'dat zijn stilte afwijzing betekent'
    (bare noun); dia vs 'slide'; 'zachtjes uitgedrukt'; 'Haar voorbehoud en vlakke toon'; ramp vs catastrofe;
    verliep vs 'went' in MC.

    Language review 2026-10-20 (fresh context; no access to the authoring session): read every template
    against its real course-scope pool (backfill_lexemes_en_nl iter_specs + lexeme_matches) and the nl
    realization: Dutch frames and feedback sentences, English feedback translations, MC/matching gloss
    collisions, typed-translation alternatives, fill_in_blank uniqueness, register. 0 defects: frames,
    sentence translations (uitvallen, zacht uitgedrukt) and feedback correct; the guided-translation
    prompts pin the one accepted wording. Status moves to reviewed. Native flags above unchanged; note
    also: 'zijn stilte afwijzing betekent' (bare noun) comes from the realization itself.
