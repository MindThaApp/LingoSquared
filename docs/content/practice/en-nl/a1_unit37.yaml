schema_version: '1.0'
pack_key: practice.en-nl.a1.unit37
source_language: en
target_language: nl
unit_content_key: nl.a1.unit37.huishouden
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. en-nl A1
    unit37 (huishouden: chores/tidying/vacuuming vocab) has 11 lexemes across
    the 5 lessons that carry lexemes (lesson01/02/03/04/06; lesson05 has zero
    introduced lexemes). All 11 carry the unit-wide `huishouden_vocab` tag.
    Every recognition/production slot unions `huishouden_vocab` (11 distinct
    glosses, over the 3-option MC floor / 6-pair matching floor). 14
    templates: multiple_choice x5, translation (bare-word) x5, listen_select
    x1 (nl target has TTS), matching_pairs x1 (6 pairs over huishouden_vocab),
    word_order x1 ("Ik moet het {item} doen." anchored to the single-member
    `huishouden_huishouden_single` tag = huishouden only), fill_in_blank x1
    ("Ik doe het {item} elke week." same single-member anchor, reused
    deliberately -- it is the only *_single tag this unit has). Recognition 6
    (5 MC + 1 listen), structured 3 (order/fill/match), production 5 -- all
    three tiers clear the >=3 template bar. Course-scope check: both the
    word_order and fill_in_blank frames use `huishouden_huishouden_single`,
    whose course-wide pool is exactly 1 token (huishouden) -- deterministic,
    no grammaticality risk. No mis-glossed lexeme found; `klaar` ("done;
    ready") is shared with cooking/laundry units elsewhere in the course but
    its gloss is consistent everywhere it appears, so no exclusion needed.
    Needs the standard fresh-context review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - huishouden_vocab
    - huishouden_huishouden_single
templates:

# lesson01 -- opruimen
- content_key: practice.en-nl.nl.a1.unit37.lesson01.choose.001
  lesson_content_key: nl.a1.unit37.lesson01.opruimen
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, verb, adjective]
      agreement_tags: {semantic: huishouden_vocab}
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame:
    text: '{item} belongs to this unit''s household-chores vocabulary.'
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit37.lesson01.translate.002
