schema_version: '1.0'
pack_key: practice.en-nl.a2.unit75
source_language: en
target_language: nl
unit_content_key: nl.a2.unit75.schermtijd
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-24 (en-nl practice pass, session 10): 5 fixes -- Dutch feedback tagged nl,
    feedback reworded, bad-habit translation prompt names steeds/op je telefoon. Native flags: none.

    Authored 2026-07-11, alongside the sibling a2_unit74/76/77.yaml packs -- see a2_unit74.yaml''s own review notes
    for the shared background (zero Endless Practice coverage existed for any of the four newest Dutch A2 units before this
    pass). This file covers unit75 (schermtijd: phone/social-media habits, screen time as an opinion topic reusing unit25''s
    vinden dat/volgens mij construction, and a suggestion to spend less time on the phone).

    scripts/backfill_lexemes_en_nl.py already had broad recognition-only tags for this unit (screen_time_vocab: 6 nouns --
    scherm/telefoon/ media/schermtijd/gewoonte/apps; screen_time_verb: 4 verbs -- chat/ doorbrengen/wegleggen/probeer). This
    pass adds 7 new single-member *_single tags (schermtijd_scherm_single/_telefoon_single/_chat_ single/_schermtijd_single/_doorbrengen_single/_gewoonte_single/
    _wegleggen_single) anchoring each lesson''s hero full sentence for word_order/translation/fill_in_blank via render_frame/slot_text
    -- single-member by construction, so no AUTHORING_GUIDE.md #17 candidate-pool ambiguity judgment call is needed. The two
    pre-existing broad tags are reused as-is for every bare-word multiple_choice/listen_select/matching_pairs template below.

    14 templates across all 6 lessons: multiple_choice x2, listen_select x4, matching_pairs x2 (both drawn from the 6-member
    screen_time_vocab pool, 5 pairs in lesson02 and 3 in lesson04 -- deliberately NOT screen_time_verb for either matching_pairs
    template: that tag''s real course-wide pool has a genuine case-duplicate, ''Probeer''/''probeer'' -- both glossed close
    enough to ''try'' that two simultaneous matching_pairs cards from the same pool risked reading as a near-duplicate pair,
    so screen_time_verb is only ever used bare-word (multiple_choice/listen_select, one word shown at a time, where this isn''t
    a problem) in this pack), word_order x2, fill_in_blank x2, translation x2. Both fill_in_blank slots (doorbrengen_single,
    wegleggen_single) have exactly 1 course-wide candidate by construction -- re-verified by re-running scripts/_fill_in_blank_ambiguity_check.py
    after adding this file''s PACKS entry, 0 flagged. Needs the standard fresh-context review before import. Same blocking
    dependency as every other en-nl pack: backfill_lexemes_en_nl.py has not actually been run against a real database yet
    (only --dry-run, which succeeds).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): all 18 templates checked against unit- and
    course-scoped pools. 2 defects fixed: (1) lesson02.choose.001 used screen_time_verb, whose pool holds both
    Probeer (Try (imperative)) and probeer (try (with ik)) -- the same word, so either gloss is a correct answer
    for either item; slot replaced by the union schermtijd_chat_single/doorbrengen_single/wegleggen_single (3
    options, still clears the floor); (2) lesson03.translate.002 and its volume_translate.003 twin translate I
    think ... with a single accepted answer using vind, so the equally correct Ik denk dat ik te veel schermtijd
    heb was graded wrong -- instruction now says to use vinden for think. Deferred (engine: one accepted string
    per translation template): lesson05.translate.002 accepts only Het is een slechte gewoonte om steeds op je
    telefoon te kijken; naar je telefoon kijken and blijven kijken are also natural -- flagged for the native
    pass. Observation: the two matching_pairs templates have 5 and 3 pairs (below the recipe 6-pair standard; pool
    only has 6 nouns) -- left as is.'
