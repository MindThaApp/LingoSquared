unit_content_key: nl.b1.unit09.eens_en_oneens
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: 'Review 2026-10-24 (en-nl practice pass, session 10): 2 fixes -- lesson04 word_order feedback now matches the chosen adjective; lesson06 feedback authoring wording. Native flags: goed/goede same gloss; eens/blijf/vierdaagse glosses proposed.

    Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md, as part of the en-nl B1 unit01-11
    practice-pack wave that unblocks these units'' checkpoints (the units already had lexemes from scripts/backfill_lexemes_en_nl.py
    but no pack at all, so generate_checkpoint() returned checkpoint_unavailable). 18 templates across
    6 lesson(s) with lexemes: fill_in_blank x1, listen_select x1, matching_pairs x2, multiple_choice x3,
    translation x7, word_order x4. Every slot is satisfiable from THIS unit''s own lexemes, because generate_checkpoint()
    calls _material() with only this unit''s lesson ids; slots use the unit''s own per-lesson semantic
    tags (unioned where a single lesson tag could not reach the >=3-option multiple_choice floor or the
    6-token matching_pairs floor), narrowed by part_of_speech to content words so no exercise ever shows
    ''the'' or ''and'' as its answer. Measured with the recipe''s capacity/coverage model against the
    real backfill data: 14 of 21 unit lexemes hostable (67%), recognition 57% / structured 67% / production
    62%, and all three tiers reach 6/6 of the lessons that have lexemes. Distinct-target capacity: recognition
    24, production 14, structured effectively unbounded (matching_pairs combinatorics). 5 of 18 templates
    carry >=5 variants. REVIEWER: ''rust'' is glossed ''rest (imperative, with u)'' by the backfill although
    lesson01 teaches the noun ''rust'' (defect 1.29); every gloss-showing template is restricted by part-of-speech
    so it can never be the shown answer. lesson03 introduces only ''Jij'' and ''zegt'', so its word_order
    anchors on semantic: informal_address (jij / je / Jij, all grammatical in the frame). General double-checks
    for this wave: (a) every word_order/fill_in_blank frame was verified against its slot''s whole-B1-course
    candidate pool, not just the unit pool, so Endless Practice cannot render an ungrammatical sentence;
    (b) no frame''s literal text contains any of its own slot''s candidate values (defect 1.14); (c) listen_select
    frames are bare ''{item}'' so no distractor can be a word the audio itself says (defect 1.22); (d)
    matching_pairs pools were read by hand for interchangeable English glosses. Needs the standard fresh-context
    review before import. Fresh-context review 2026-10-10 (content-reviewer.md checklist): read all 18 templates against unit- and course-scoped pools. FIXED: (1) logged lexeme defect waar glossed ''where'' (unit02, means ''true'' in ''Dat is waar'') is tagged debate_dialogue, so at course scope it reached lesson01.match.004, lesson04.choose.001, lesson04.listen.003 and lesson04.match.004 and would show ''where'' as its answer/pair - adverb dropped from those four slots (waar cannot be separated from Misschien by tag; Misschien therefore no longer has a template - every lesson keeps coverage). (2) lesson04.order.002 ''Toch blijf ik {item}.'' rendered the nonsensical ''Toch blijf ik gelukkiger.'' - frame rewritten to ''Misschien worden mensen {item}.'' (from the debate and reading), natural for both gelukkiger and sceptisch. (3) lesson03.translate.002 asked for ''You'' with the single answer ''Jij'', rejecting the equally correct ''je'' - pronoun dropped from the slot (Jij stays covered by lesson03.order.001). (4) lesson04.choose.001 feedback claimed every option ''is said in the debate'', false for zegt/praten/geeft - neutralised. DEFERRED: fixed-sentence translation.006 accepts one rendering only (systemic). 4 defects fixed, 1 deferred, no native flag.'
