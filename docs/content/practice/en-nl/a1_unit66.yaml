schema_version: '1.0'
pack_key: practice.en-nl.a1.unit66
source_language: en
target_language: nl
unit_content_key: nl.a1.unit66.theater
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. VERY
    THIN vocabulary unit: only 7 lexemes total across all 6 lessons (one
    per lesson except lesson04 which has two: Ster [proper noun, excluded]
    and toneelstuk). All 6 lessons have >=1 lexeme, unlike most units in
    this batch. Used the union broad tag `theater_vocab` (exactly 6 distinct
    tokens: populair, gordijn, acteurs, toneelstuk, stoel, tevreden --
    excludes the proper noun Ster; all glosses read against the realization
    and confirmed correct) for every multiple_choice, translation,
    listen_select and matching_pairs slot -- this is the MC/matching_pairs
    floor exactly, not comfortably above it, so this pack cannot absorb any
    further exclusion from this pool. Only single-member anchor available is
    `theater_gordijn_single` (gordijn, lesson02), used for both the
    fill_in_blank and word_order templates with two different literal
    frames; the word_order frame's literal word "podium" was checked against
    the full lexeme dump and is NOT itself a classified lexeme anywhere in
    this unit or elsewhere in the a1 course sample checked, so it cannot be a
    same-slot self-reference. 17 templates, all 6 lexeme-bearing lessons
    covered by both multiple_choice and translation; matching_pairs anchored
    to lesson03 and lesson05 (broad tag, 6 pairs each -- the full pool, so
    both matching_pairs instances draw the identical 6-token set; this is a
    direct consequence of the pool being exactly at the floor and is flagged
    for the coordinator). Recognition 7 (6 MC + 1 listen_select), structured
    4 (2 matching_pairs + 1 fill_in_blank + 1 word_order), production 6
    (translation). Needs standard fresh-context review before import.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - theater_vocab
    - theater_gordijn_single
templates:

# ---------------------------------------------------------------------------
# lesson01 -- Zullen we vandaag naar het theater gaan?
# ---------------------------------------------------------------------------
- content_key: practice.en-nl.nl.a1.unit66.lesson01.choose.001
  lesson_content_key: nl.a1.unit66.lesson01.zullen_we_vandaag_naar_het_theater_gaan
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech: [noun, adjective]
      agreement_tags:
        semantic: theater_vocab
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} belongs to this unit''s theatre vocabulary.'
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit66.lesson01.translate.002
  lesson_content_key: nl.a1.unit66.lesson01.zullen_we_vandaag_naar_het_theater_gaan
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: nl
      part_of_speech: [noun]
      agreement_tags:
        semantic: theater_vocab
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a1.unit66.lesson01.listen.003
  lesson_content_key: nl.a1.unit66.lesson01.zullen_we_vandaag_naar_het_theater_gaan
