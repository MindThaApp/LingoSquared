unit_content_key: nl.c1.unit01.betoogstructuur
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md to give the en-nl C1 unit01 (betoogstructuur) its first practice pack, so Endless Practice and the unit checkpoint can run. This is a discourse/grammar unit (recipe 8.1). 22 templates over all 6 lessons. Recognition: 6 multiple_choice, one per lesson, each over that lesson''s own c1u01 lesson tag narrowed to content words [noun, verb, adjective, adverb]; lesson pools are used instead of a unit-wide union because the union holds both daarna (''after that'') and vervolgens (''next; subsequently''), which would make interchangeable distractors. Every lesson pool has at least 3 distinct glosses (lesson06 has exactly 3: druk, ongezond, soms). MC feedback uses the neutral wording ''{item} comes up in this unit''s lesson on ...'', true for every pool member. Structured: 2 matching_pairs (lesson02 over its own tag; lesson06 over the union of the lesson03-06 tags, without daarna and vervolgens), 7 word_order and 1 fill_in_blank, each over a single-member *_single anchor framing a sentence taught in the realization (om te beginnen ... in grote lijnen; het belangrijkste voordeel, namelijk ...; terzijde wil ik ... noemen; om terug te komen op mijn hoofdgedachte; alles bij elkaar pleit dit voor een autoluwe binnenstad, the realization''s own word_order sentence; dit voorstel levert schonere lucht op; de binnenstad is druk en ongezond). The only fill_in_blank is the fixed idiom dat neemt niet weg dat, where the blank admits one word; the levert ... op frame was converted to word_order because the fill shows no English cue. Production: 6 bare-word translations, one per lesson. lesson01 is narrowed to [noun, verb, adverb] to drop grote (''big'', answerable with groot). lesson03 uses the curated tag c1u01_uitstapje_vertaal, which drops wil (''want'', answerable with willen) and een/één. lesson05 uses the curated tag c1u01_samenhang_vertaal, which drops levert and leveren (a learner may type the full separable verb opleveren or levert op). Gloss fixes for this unit (backfill lane, c1_unit01 gloss_fixes): maak ''make (with ik)'' (was ''with je'', which admitted maakt), maakt ''makes (with hij/zij/het)'', lijnen ''lines (in ''in broad terms'')'', hoort ''belongs; goes with (with hij/zij)'', levert ''yields; produces (with hij/zij; separable, with op)'', leveren ''to yield; to produce (separable, with op)'', pleit ''makes the case (for); argues (for) (with hij/zij)'' (none of these quotes its own Dutch token any more), eerst ''first of all; at first (adverb)'' (excludes eerste), druk ''busy; crowded (of a place)'' (excludes bezig), binnenstad ''the inner city; the city centre'' (excludes centrum). New tags, supplied through the c1_unit01 tags.json and NOT yet in the committed backfill: c1u01_schets_single, c1u01_namelijk_single, c1u01_noemen_single, c1u01_hoofdgedachte_single, c1u01_weg_single, c1u01_pleit_single, c1u01_levert_single, c1u01_druk_single, c1u01_uitstapje_vertaal, c1u01_samenhang_vertaal. Measured at unit scope with the c1 harness: 80 unit lexemes, ALL 74% (59/80, the other 21 are function words), recognition 74%, structured 64%, production 68%, 6/6 lessons in every tier. At course scope every anchor slot has exactly 1 candidate and every translation pool is exactly the checked unit list. No frame''s literal word is a candidate of its own slot. listen_select: none authored. Register: no address forms in any frame. REVIEWER MUST DOUBLE-CHECK: (1) the lesson02 translation pool keeps vervolgens (''next; subsequently'') while daarna is absent from that pool. (2) Form-variant pairs share pools: voordeel/voordelen, aantrekkelijke/aantrekkelijker, levert/leveren, maak/maakt; their glosses differ by form cue. (3) bezwaar, zorg and probleem are treated as distinct meanings. (4) The naturalness of the long word_order frames (up to 14 tiles). Fresh-context review 2026-10-10: 8 findings (1 blocker, 7 minor), all addressed (fixed, or the affected token excluded from the pool), confirmed by a pool-level scan.'
