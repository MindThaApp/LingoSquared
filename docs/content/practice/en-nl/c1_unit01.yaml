schema_version: '1.0'
pack_key: practice.en-nl.c1.unit01
source_language: en
target_language: nl
unit_content_key: nl.c1.unit01.betoogstructuur
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md to give the en-nl C1 unit01
    (betoogstructuur) its first practice pack, so Endless Practice and the unit checkpoint can run. This
    is a discourse/grammar unit (recipe 8.1). 22 templates over all 6 lessons. Recognition: 6 multiple_choice,
    one per lesson, each over that lesson''s own c1u01 lesson tag narrowed to content words [noun, verb,
    adjective, adverb]. Lesson pools were used instead of a unit-wide union because the union holds both
    daarna (''after that'') and vervolgens (''next; subsequently''), which would make interchangeable
    MC distractors and matching rights. Every lesson pool has at least 3 distinct glosses (lesson06 has
    exactly 3: druk, ongezond, soms). Structured: 2 matching_pairs (lesson02 over its own tag; lesson06
    over the union of the lesson03-06 tags, 39 tokens, without daarna and vervolgens), 6 word_order and
    2 fill_in_blank, each over a single-member *_single anchor and framing the unit''s own hero sentences
    (om te beginnen ... in grote lijnen; het belangrijkste voordeel, namelijk ...; terzijde wil ik ...
    noemen; om terug te komen op mijn hoofdgedachte; dat neemt niet weg dat; alles bij elkaar pleit dit
    voor; levert ... op; de binnenstad is druk en ongezond). Production: 6 bare-word translations, one
    per lesson, over the lesson''s own tag. lesson01 is narrowed to [noun, verb, adverb] to drop grote
    (gloss ''big'', which a learner would answer with groot). lesson03 uses the curated tag c1u01_uitstapje_vertaal,
    which drops wil (''want'', where a learner would type willen) and één (''one'', glossed as a noun;
    a learner may type een). New tags, all supplied through the c1_unit01 tags.json and NOT yet in the
    committed backfill: c1u01_schets_single, c1u01_namelijk_single, c1u01_noemen_single, c1u01_hoofdgedachte_single,
    c1u01_weg_single, c1u01_pleit_single, c1u01_levert_single, c1u01_druk_single, c1u01_uitstapje_vertaal.
    Measured at unit scope with the c1 harness (''.c1.unit01.'' filter): 80 unit lexemes, ALL 74% (59/80,
    the other 21 are function words), recognition 74%, structured 64%, production 70%, 6/6 lessons in
    every tier, no dead templates, no MC pool under 3 glosses, no matching pool under 6. At course scope
    every anchor slot has exactly 1 candidate and every lesson-tag pool equals its unit pool. Defect 1.14
    was checked by hand: no frame''s literal word is a candidate of its own slot. listen_select: none
    authored. Register: no address forms appear in any frame; the realization is informal jij/je. Gloss
    notes for the backfill lane: maak is glossed ''make (with je)'' but the unit teaches ''Nu maak ik'';
    the form is correct for ik too, so it was kept. één is tagged POS noun with the gloss ''one''. terzijde
    and belangrijkste carry an unrelated ''ordinal_number'' tag. None of these is a wrong meaning shown
    to the learner. REVIEWER MUST DOUBLE-CHECK: (1) the lesson02 translation pool keeps vervolgens (''next;
    subsequently'') while daarna is absent from that pool; confirm the gloss pins vervolgens. (2) Form-variant
    pairs share the lesson pools: voordeel/voordelen, aantrekkelijke/aantrekkelijker, levert/leveren,
    maak/maakt (maak/maakt co-occur only in the lesson06 union matching). They discriminate on form, like
    skill/skills. (3) bezwaar (''objection''), zorg (''concern'') and probleem (''problem'') are treated
    as distinct meanings. (4) The naturalness of the long word_order frames (up to 14 tiles).'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - c1u01_koers_aangeven
