schema_version: '1.0'
pack_key: practice.en-nl.a2.unit73
source_language: en
target_language: nl
unit_content_key: nl.a2.unit73.sollicitatiegesprek
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-24 (en-nl practice pass, session 10): 2 fixes -- Dutch feedback tagged nl,
    feedback reworded. Native flags: vaardigheid/vaardigheden and gesprek/sollicitatiegesprek share
    a matching pool.

    Authored 2026-07-22 as the PILOT pack proving docs/content/PRACTICE_PACK_RECIPE.md.
    en-nl A2 unit73 (sollicitatiegesprek / job application at Kantoor Bloem) had a full
    realization + overlay + a complete lexeme classification in
    scripts/backfill_lexemes_en_nl.py (41 lexemes across all 6 lessons, including the
    fine-grained job_interview_vocab_pure / job_beschikbaar_single / job_klantcontact_single
    tags that were added in 2026-07-11 explicitly "alongside that future practice-template
    pass") but no practice pack at all, so its unit checkpoint returned
    checkpoint_unavailable.


    18 templates across all 6 lessons: multiple_choice x4, listen_select x1,
    matching_pairs x3, word_order x2, fill_in_blank x2, translation x6 (a2_unit77 was used
    as the shape reference). Deliberately built to the recipe's CHECKPOINT-SCOPED bar, not
    just the Endless-Practice bar: every slot constraint is satisfiable by lexemes this
    unit's OWN lessons introduce, because generate_checkpoint() calls _material() with only
    this unit's lesson ids. Measured with the recipe's capacity/coverage model:
    35 of 41 unit lexemes hostable (85% vs. a 33% corpus median), all 6 lessons host >=1
    lexeme in EVERY difficulty tier (recognition 83%, structured 61%, production 54%), and
    distinct-item capacity is recognition 49 / structured 40726 / production 33 -- all
    three CHECKPOINT_MASTERY_BANDS tiers clear the >=12 bar with no repeats. A faithful
    offline port of generate_checkpoint() returns 15/15 distinct items on 5 different
    seeds, with a real format mix (MC 3-9, translation 3-6, matching 2-4, plus
    listen_select/word_order).


    Both fill_in_blank slots (job_beschikbaar_single, job_klantcontact_single) have exactly
    ONE distinct course-wide candidate by construction, so AUTHORING_GUIDE.md #17 /
    compile_content.py's ambiguity hard-fail is satisfied. No typed-answer slot
    (translation / fill_in_blank) can ever sample a sentence-initial capitalized form
    (Kan / Typen / Vertelt / Van / Zij / Daar / Mooi / Ervaring / Werktijden) -- those are
    reachable only through option-rendering types, because grading is case-sensitive.
    Needs the standard fresh-context review before import.


    Fresh-context review 2026-10-10 (content-reviewer.md checklist): all 18 templates checked against unit- and
    course-scoped lexeme pools (glosses, frame grammaticality per candidate, distractor overlap, matching_pairs
    confusability, fixed-answer translations, feedback, jargon, booleans). 3 defects fixed: (1) lesson02.order.002
    feedback hard-coded dinsdag/Tuesday although the weekday_pure slot also renders maandag/vrijdag
    (woensdag/donderdag course-wide) -- feedback now renders {item} and no longer names a fixed day; (2)
    lesson03.translate.003 sampled the inflected adjectives belangrijke/goede as typed answers for the prompts
    important/good, marking the citation forms belangrijk/goed wrong -- slot narrowed to part_of_speech noun; (3)
    lesson06.choose.001 could show Van with the wrong gloss Of (the unit teaches Van negen tot vijf uur = From
    nine to five) -- preposition removed from the slot. Deferred: lexeme gloss Van => Of should be From
    (backfill_lexemes_en_nl.py; worked around here); in Endless Practice lesson02.choose.001 can pair Kan (can)
    with kunt (can (with je/jij), although the unit itself uses Kunt u) as a near-equivalent distractor -- not
    fixable in-pack without dropping below the 3-option checkpoint floor. Note: feedback_frame is stored but not
    currently rendered by the practice runtime. No native-judgment flags.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - job_application_interest
    - job_interview_vocab_pure
    - job_interview_appointment
    - experience_and_skills
    - availability_and_hours
    - job_beschikbaar_single
    - job_klantcontact_single
    - job_interview_dialogue
    - weekday_pure
