schema_version: '1.0'
pack_key: practice.en-nl.a1.unit67
source_language: en
target_language: nl
unit_content_key: nl.a1.unit67.markt
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-24 (en-nl practice pass, session 10): 0 fixes. Native
    flags: gloss proposals (see reviewer report); fill_in_blank blanks give no
    English cue.

    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md.
    VERY THIN vocabulary unit: only 6 lexemes total (lesson01 x1, lesson02
    x2, lesson03 x1, lesson04 x1, lesson06 x1); lesson05
    (bij_de_kraam_op_de_markt, dialogue-only) has ZERO classified lexemes
    and is excluded from the checkpoint -- not an oversight. The union
    broad tag `markt_vocab` has only 5 distinct tokens (druk, groente,
    vers, marktkoopman, bakker -- excludes the proper noun Jansen), BELOW
    the recipe's matching_pairs floor of 6 -- **no matching_pairs authored
    for this unit; flagging as checkpoint-thin.** All glosses read against
    the realization and confirmed correct ("bakker" glossed "the bakery" is
    the corpus's established idiomatic usage of "naar de bakker gaan" =
    "go to the bakery/baker's", matching lesson06's own teaching sentence,
    not a mis-gloss). Single-member anchor `markt_marktkoopman_single`
    (marktkoopman, lesson03) is the ONLY single-member anchor this unit
    has; used for all three structured templates (1 fill_in_blank + 2
    word_order, three different literal frames), so structured coverage is
    concentrated entirely on lesson03. **COURSE-SCOPE CATCH:** an earlier
    draft used a second anchor built by narrowing the lesson02 tag
    `market_produce` to `part_of_speech: noun`, intending to leave only
    `groente` as a candidate (`vers` is an adjective, excluded). At UNIT
    scope that held, but the §9 step-5 course-scope re-read found
    `market_produce` is ALSO used, course-wide, by an unrelated a1 lesson
    on a different noun set (12 candidates including the neuter noun
    `fruit`) -- the frame `De {item} is vers.` is grammatical for `de
    groente` but wrong for `het fruit`. Removed that template rather than
    patch it; flagging the tag-name collision for the coordinator
    (`market_produce` is not actually unit67-unique despite reading that
    way from the unit-scoped dump alone). All single-member anchors kept in
    this batch (voetbalwedstrijd_scorebord_single, pretpark_reuzenrad_single,
    theater_gordijn_single, markt_marktkoopman_single, bakker_toonbank_single,
    ijssalon_vitrine_single) were re-checked at course scope and each has
    exactly 1 candidate course-wide -- safe. 14 templates, all 5
    lexeme-bearing lessons covered by both multiple_choice and translation
    (structured tier only covers lesson03 -- noted above). Recognition 6 (5
    MC + 1 listen_select), structured 3 (1 fill_in_blank + 2 word_order),
    production 5 (translation). Needs standard fresh-context review before
    import, and the coordinator should consider whether `markt_vocab` can
    be widened (e.g. a backfill pass adding more nouns from the unit's
    reading/dialogue lessons) to eventually support matching_pairs.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - markt_vocab
    - markt_marktkoopman_single
templates:

