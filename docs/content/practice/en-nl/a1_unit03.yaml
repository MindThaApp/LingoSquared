schema_version: "1.0"
pack_key: practice.en-nl.a1.unit03
source_language: en
target_language: nl
unit_content_key: nl.a1.unit03.calendar_dates
review:
  status: reviewed
  required_next_reviewer: null
  fresh_context: "true"
  notes: >-
    Independent fresh-context content audit completed (zero access to the
    authoring reasoning above). Every lesson_content_key matches a real
    nl.a1.unit03 realization lesson (all 6 confirmed). Standalone
    lexeme_matches()-replicating harness confirms candidate counts well past
    the required bar: weekday matching_pairs first/second=10/10, month=15,
    ordinal_number=33, weekday (other templates)=10. Hand-checked every
    generated sentence for every possible filler: "Vandaag is het {item}."/
    "...12 april." use the impersonal "het is + weekday" construction (no
    de/het article on the weekday noun itself, so no gender-agreement risk);
    "Het is de {item} april."/"Het boek moet op de {item} april terug." use
    the fixed "de + ordinal" date convention, which is correct Dutch
    regardless of which ordinal fills the slot (dates always take "de", not
    a noun-gender-dependent article) -- confirmed this is NOT a de/het bug
    since ordinals aren't gendered nouns here. No self-reference, no
    capitalization leaks, no jargon leaks, no stray YAML booleans. Compiler
    validation re-run together with units 01-02, 04-09: 0 errors/0 warnings.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [register_language, wellbeing, name_exchange, origin_language, cafe_small_talk, first_meeting_dialogue, number, contact_number, age_quantity, price, library_registration, weekday, weekday_pure, month, ordinal_number, date_expression, library_date, cafe_appointment, clock_time, quarter_hour, time_question, time_of_day, schedule, cafe_meetup_time, informal_address, polite_address, greeting, wellbeing_answer, person_name, place_name, country, language_or_nationality]
    register: [informal, polite]
slot_presets:
  informal_address: &informal_address {language_code: nl, part_of_speech: pronoun, agreement_tags: {semantic: informal_address}}
  greeting: &greeting {language_code: nl, part_of_speech: phrase, agreement_tags: {semantic: greeting}}
  person_name: &person_name {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: person_name}}
  country: &country {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: country}}
  number: &number {language_code: nl, part_of_speech: [symbol, noun], agreement_tags: {semantic: number}}
  weekday: &weekday {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: weekday}}
  # weekday_pure: exact-case, case-deduplicated 7-member weekday set, safe
  # for matching_pairs -- see scripts/backfill_lexemes_en_nl.py's
  # weekday_pure comment for why the plain "weekday" tag (used by this
  # file's OTHER, unmodified templates below) is unsafe for that purpose.
  weekday_pure: &weekday_pure {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: weekday_pure}}
  month: &month {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: month}}
  ordinal_number: &ordinal_number {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: ordinal_number}}
  time_of_day: &time_of_day {language_code: nl, part_of_speech: [noun, adverb], agreement_tags: {semantic: time_of_day}}
templates:
  - content_key: practice.en-nl.nl.a1.unit03.lesson01.match.001
    lesson_content_key: nl.a1.unit03.lesson01.weekdagen
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth} · {seventh}", language_code: nl, direction: ltr}
    slots: {first: *weekday_pure, second: *weekday_pure, third: *weekday_pure, fourth: *weekday_pure, fifth: *weekday_pure, sixth: *weekday_pure, seventh: *weekday_pure}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth, seventh]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth, seventh]}
    feedback_frame: {text: "Match each Dutch weekday with its English name.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit03.lesson01.translate.003
    lesson_content_key: nl.a1.unit03.lesson01.weekdagen
    type: translation
    frame:
      text: "Today is {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "Vandaag is het {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Today is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit03.lesson02.listen.001
    lesson_content_key: nl.a1.unit03.lesson02.maanden
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *month}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the month you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit03.lesson02.choose.002
    lesson_content_key: nl.a1.unit03.lesson02.maanden
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English month.", language_code: en, direction: ltr}
    slots: {item: *month}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is this month in Dutch.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit03.lesson02.translate.003
    lesson_content_key: nl.a1.unit03.lesson02.maanden
    type: translation
    frame:
      text: "{item}"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *month}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The Dutch month is {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit03.lesson03.choose.001
    lesson_content_key: nl.a1.unit03.lesson03.rangtelwoorden
    type: multiple_choice
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *ordinal_number}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is this ordinal number in Dutch.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit03.lesson03.translate.003
    lesson_content_key: nl.a1.unit03.lesson03.rangtelwoorden
    type: translation
    frame:
      text: "It is the {item} of April."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *ordinal_number}
    answer_derivation: {kind: render_frame, frame: {text: "Het is de {item} april.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The date uses {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit03.lesson04.order.001
    lesson_content_key: nl.a1.unit03.lesson04.datum_vragen
    type: word_order
    frame: {text: "Vandaag is het {item} 12 april.", language_code: nl, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "Vandaag is het {item} 12 april.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The date falls on {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit03.lesson04.translate.003
    lesson_content_key: nl.a1.unit03.lesson04.datum_vragen
    type: translation
    frame:
      text: "Today is {item}, 12 April."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "Vandaag is het {item} 12 april.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The Dutch date begins with the weekday {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit03.lesson05.order.001
    lesson_content_key: nl.a1.unit03.lesson05.bibliotheekdatum
    type: word_order
    frame: {text: "Het boek moet op de {item} april terug.", language_code: nl, direction: ltr}
    slots: {item: *ordinal_number}
    answer_derivation: {kind: render_frame, frame: {text: "Het boek moet op de {item} april terug.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The Dutch due date uses {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit03.lesson05.translate.003
    lesson_content_key: nl.a1.unit03.lesson05.bibliotheekdatum
    type: translation
    frame:
      text: "The book must be returned on the {item} of April."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *ordinal_number}
    answer_derivation: {kind: render_frame, frame: {text: "Het boek moet op de {item} april terug.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The Dutch due-date phrase uses op de {item} april.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit03.lesson06.order.001
    lesson_content_key: nl.a1.unit03.lesson06.taalcafe_afspraak
    type: word_order
    frame: {text: "Op {item} 12 april.", language_code: nl, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "Op {item} 12 april.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The next language café is on {item}, 12 April.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit03.lesson06.translate.003
    lesson_content_key: nl.a1.unit03.lesson06.taalcafe_afspraak
    type: translation
    frame:
      text: "On {item}, 12 April."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *weekday}
    answer_derivation: {kind: render_frame, frame: {text: "Op {item} 12 april.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The Dutch date begins with op {item}.", language_code: en, direction: ltr}
