schema_version: '1.0'
pack_key: practice.en-nl.b2.unit08
source_language: en
target_language: nl
unit_content_key: nl.b2.unit08.synthese
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-24 (en-nl practice pass, session 10): 5 fixes -- generic feedback on
    choose.001 (lesson01, lesson03, lesson06), lesson06 feedback English made natural,
    translate.004 prompt disambiguated. Native flags: 'Ik vind Thomas sterker' sense
    (more convincing).

    Authored 2026-08-02 against docs/content/PRACTICE_PACK_RECIPE.md to unblock
    the en-nl B2 unit08 (synthese) checkpoint, which returned
    checkpoint_unavailable because the unit had lexemes (from
    backfill_lexemes_en_nl.py) but no practice pack. This is a GRAMMAR/FUNCTION
    unit (§8.1), so slots union the unit's own lesson tags rather than using the
    per-lesson-tag vocabulary pattern. 18 templates across all 6 lessons:
    multiple_choice x4, listen_select x2, matching_pairs x2, word_order x4,
    translation x6 (incl. one short single-sentence deterministic item). Tiers:
    recognition 5, structured 6, production 7. Every slot is satisfiable from
    THIS unit's own lexemes (generate_checkpoint feeds _material only unit08
    lesson ids). Measured unit-scope: ALL coverage 77% (40/52), recognition
    58%, structured 52%, production 69%, every tier 6/6 lessons; no dead or
    <3-option templates.
    IMPORTANT for the reviewer -- these B2 semantic tags are SHARED ACROSS THE
    WHOLE B2 COURSE (440 lexemes, many units), not unit08-specific, so every
    word_order / fixed translation frame was re-read against its slot's
    course-wide (all-.b2.) pool, not just the unit pool. Single-member
    course-wide anchors used for the sentence frames: verschil (source_conflict
    noun), achttien (hour_number), sterker (comparative_adj). All are unique at
    course scope, so those frames render deterministically.
    MIS-GLOSS (route to backfill lane): token `stellen` carries gloss "to
    propose (part of voorstellen)" but unit08 teaches it as "to state/assert"
    (Sanne stelt dat het niet duur is). It is EXCLUDED from every pool here (no
    slot pools verb+source_attribution), so it is never shown; coordinator
    should fix the backfill gloss. Also note: token `eten` is classified verb
    "to eat" though the unit uses it as the noun "het eten" (food) -- it too is
    excluded from all gloss-shown pools (POS noun/adj/adverb only), so harmless
    here.
    Reviewer double-checks: (a) broad recognition/production pools use POS
    [noun, adjective, adverb] + the 6-tag union, which excludes proper nouns
    (Pauw/Sanne/Thomas), pronouns, and all verbs (incl. stellen); (b) the
    lesson03 word_order "Ze vinden {item}." pools {beide, hetzelfde} at course
    scope -- "Ze vinden hetzelfde" is fully natural, "Ze vinden beide" is
    grammatical but slightly bare (flagged); (c) matching pool M2 pulls in
    daarentegen "by contrast" alongside tegenstelling "contrast" only at Endless
    Practice / course scope (never at the unit-scope checkpoint) -- their full
    glosses differ and one is a connector, the other a noun, so not
    interchangeable, but please confirm; (d) leuk "nice; pleasant" and lekker
    "tasty; nice" both contain "nice" but have distinct full gloss strings;
    (e) the lesson06 production is now a short deterministic single-sentence item
    (lesson06 translate.004: English prompt 'I find Thomas stronger.' rendered as
    'Ik vind Thomas sterker.' via a single-member 'sterker' slot), graded by
    exact-string (+distance-1 typo tolerance) with a single natural rendering; the
    whole-outcome synthesis act is delivered by the realization's lesson exercises,
    not this pack. Needs the standard fresh-context review before import.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked every
    template against its real unit- and course-scope pools (practice_dump), every
    gloss shown as an answer, every word_order / fixed translation frame's
    course-wide pool, feedback text, jargon and boolean quoting. FIXED (1): removed
    lesson03.order.002 ('Ze vinden {item}.') -- its slot (pronoun +
    source_agreement) pools {hetzelfde, mijn} at course scope, so Endless Practice
    could present the ungrammatical 'Ze vinden mijn.' as correct; no tag or POS
    narrowing isolates hetzelfde (its only other tag, ordinal_number, adds beide,
    which does not fit the frame either), so the template was dropped as a last
    resort. Lesson03 stays covered by choose.001 and translate.003; the structured
    tier keeps 5 templates (2 matching_pairs, 3 word_order). The other frames are
    single-member at course scope (verschil, achttien, sterker). DEFERRED: (a)
    systemic synonymy in bare-word translation: the prompt "both" expects allebei,
    but beide (taught in lesson02) is equally correct and graded wrong; a gloss such
    as "both (allebei)" cannot be used because it shows the answer, so this needs a
    backfill/engine decision. (b) leuk "nice; pleasant" and lekker "tasty; nice"
    overlap on "nice" in the MC/listen pools; judged answerable (the first sense
    discriminates), noted for the backfill lane.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - source_attribution
    - source_comparison
    - source_agreement
    - source_conflict
    - two_reviews_reading
    - synthesis_dialogue
    - ordinal_number
    - hour_number
    - comparative_adj
templates:

# ---------------- lesson01 wie_zegt_wat ----------------
- content_key: practice.en-nl.nl.b2.unit08.lesson01.choose.001
  lesson_content_key: nl.b2.unit08.lesson01.wie_zegt_wat
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: nl
    direction: ltr
  slots:
    item:
      language_code: nl
      part_of_speech:
      - noun
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - source_attribution
        - source_comparison
        - source_agreement
        - source_conflict
        - two_reviews_reading
        - synthesis_dialogue
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Remember the meaning of {item}.'
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit08.lesson01.match.002
  lesson_content_key: nl.b2.unit08.lesson01.wie_zegt_wat
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots:
    first: &sa
      language_code: nl
      part_of_speech:
      - noun
      - adjective
      agreement_tags:
        semantic:
        - source_attribution
    second: *sa
    third: *sa
    fourth: *sa
    fifth: *sa
    sixth: *sa
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Match each word about the sources with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.b2.unit08.lesson01.translate.003
  lesson_content_key: nl.b2.unit08.lesson01.wie_zegt_wat
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item:
      language_code: nl
      part_of_speech:
      - noun
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - source_attribution
        - source_comparison
        - source_agreement
        - source_conflict
        - two_reviews_reading
        - synthesis_dialogue
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: The Dutch word is {item}.
    language_code: en
    direction: ltr

