schema_version: '1.0'
pack_key: practice.en-nl.a2.unit89
source_language: en
target_language: nl
unit_content_key: nl.a2.unit89.beleefd_vragen
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Fresh-context review 2026-11-27 (en-nl A2 units 87-94 pass): 0 pack fixes. Dumped the shared union slot at unit scope (35 lexemes) and A2 course scope (82) and read every gloss; capacity with the '.a2.unit89.' filter: 15 templates, 95% coverage overall and in every tier, 5/5 lessons in every tier, no dead templates, pools above the MC and matching floors. Bare-word frames only. Backfill glosses for the coordinator (not excludable without dropping lesson05 or other lessons from the union): hoor 'hear (with ik)' while the unit teaches the softening particle in Nee hoor; bakker 'the bakery' at course scope while this unit teaches de bakker 'the baker'; eens 'agreed; in agreement' at course scope while the unit teaches the softener Kijk eens / Wacht eens; kijken 'watch (with we)'; draag 'carry (with ik)' displays as 'carry' next to dragen 'to carry; to wear', a near-synonym distractor pattern shared by the other finite/infinitive pairs. Earlier notes: Authored for the lessons of A2 unit 89 that have backfilled lexemes (grammar-led unit). Recognition, matching and bare-word production use a unit-wide union of the unit lesson semantic tags over content words (noun, verb, adjective, adverb, preposition) so every hosted lesson reaches the 3-option and 6-pair floors at course scope. Pronouns, proper nouns, particles and phrases are left out. Backfill glosses to double-check: deur (idiom gloss), case pairs wacht/Wacht, geef/Geef, Ga/Gaat (imperative vs finite forms). Many conjugated verb forms are in the pool, so matching rights such as help (with ik) are confusable only by the person note. Native speaker should confirm the lexical set.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - polite_request_zou_je_kunnen
    - polite_request_je_or_u
    - offer_zal_ik
    - softener_even_eens
    - accept_decline_offer
templates:
- content_key: practice.en-nl.nl.a2.unit89.lesson01.choose.001
  lesson_content_key: nl.a2.unit89.lesson01.zou_je_kunnen
  type: multiple_choice
  frame: {text: '{item}', language_code: nl, direction: ltr}
  slots:
    item: &unit_word
      language_code: nl
      part_of_speech: [noun, verb, adjective, adverb, preposition]
      agreement_tags:
        semantic: [polite_request_zou_je_kunnen, polite_request_je_or_u, offer_zal_ik, softener_even_eens, accept_decline_offer]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: 'Choose the English meaning of {item}.', language_code: en, direction: ltr}
- content_key: practice.en-nl.nl.a2.unit89.lesson01.match.002
  lesson_content_key: nl.a2.unit89.lesson01.zou_je_kunnen
  type: matching_pairs
  frame: &match_frame
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: nl
    direction: ltr
  slots: &match_slots
    first: *unit_word
    second: *unit_word
    third: *unit_word
    fourth: *unit_word
    fifth: *unit_word
    sixth: *unit_word
  slot_relations: &match_relations
  - kind: distinct
    slots: [first, second, third, fourth, fifth, sixth]
  answer_derivation: &match_answer
    kind: matching_pairs
    slots: [first, second, third, fourth, fifth, sixth]
  feedback_frame: &match_feedback
    text: Match each Dutch word with its English meaning.
    language_code: en
    direction: ltr
- content_key: practice.en-nl.nl.a2.unit89.lesson01.translate.003
  lesson_content_key: nl.a2.unit89.lesson01.zou_je_kunnen
  type: translation
  frame: &translation_frame
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots: {item: *unit_word}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: &translation_feedback
    text: The Dutch answer is {item}.
    language_code: en
    direction: ltr

- content_key: practice.en-nl.nl.a2.unit89.lesson02.listen.001
