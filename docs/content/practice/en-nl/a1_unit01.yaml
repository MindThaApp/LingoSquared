schema_version: '1.0'
pack_key: practice.en-nl.a1.unit01
source_language: en
target_language: nl
unit_content_key: nl.a1.unit01.greetings_and_introductions
review:
  status: reviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "true"
  notes: 'Review 2026-10-24 (en-nl practice pass, session 10): 0 pack fixes (Opa/name glosses and Opa''s person_name tag logged for backfill). Native flags: none.

    Independent fresh-context content audit completed (zero access to the authoring reasoning above, per project convention).
    Confirmed every template''s lesson_content_key against the real nl.a1.unit01 realization lessons (all 6 match exactly).
    Wrote a standalone harness importing iter_specs() from scripts/backfill_lexemes_en_nl.py and replicating the backend''s
    lexeme_matches()/_requested_matches() logic exactly (language_code exact match, part_of_speech OR-membership, agreement_tags
    AND-of-OR) -- every slot has real candidate counts well above the >=4 (multiple_choice/ listen_select) / >=1 (other types)
    bar (informal_address=2, greeting=5, person_name=7, country=4, matching_pairs first/second=4/4). Hand-checked every generated
    sentence for every possible filler, not just the example already in the file: informal_address (jij/je) in "Ben {item}
    nieuw hier?"/"...taalcafé?" is grammatical for both; greeting phrases (Hallo/Hoi/ Goedemorgen/Goedemiddag/Goedenavond)
    all fit "{item}! Hoe gaat het?" naturally; person_name (Noor/Omar/Lotte/Sander/Fenna/Jan/Marieke) all fit "Ik heet {item}."/"Hoi,
    ik ben {item}." with no capitalization or gender issues (proper nouns, no article); country matching_pairs (Nederland/
    België/Duitsland/Egypte) is a genuine distinct-pair set with no self-reference or homograph risk. No jargon leaks, no
    forbidden YAML booleans, no capitalization leaks (no capitalized sentence-initial variant of any slot value is used mid-sentence).
    Compiler validation re-run together with units 02-09: 0 errors/0 warnings. The review.notes text above accurately describes
    what Session 3 did; this entry supersedes only the review.status field per the standing "author leaves unreviewed, a separate
    fresh-context reviewer upgrades" convention. Native-speaker review by Ramin (the standing nl exception) is still the final
    bar before a live deploy, but this pack is genuinely clean at the content-review level.

    **Follow-up fix, 2026-07-06 (real user report)**: the "grammatical for both" finding above about informal_address (jij/je)
    understated the problem -- grammatical for both means a `fill_in_blank` blanking "Ben {item} nieuw hier?"/"...taalcafé?"
    is genuinely unanswerable with certainty, since nothing in either frame lets a learner prefer jij over je or vice versa;
    only one was ever marked correct per generated instance, so a learner typing the other 100%-correct Dutch pronoun was
    wrongly marked wrong. Reproduced live via a fresh Endless Practice batch. Fixed by marking both `lesson01.complete.002`''s
    and `lesson05.complete.002`''s answer_derivation `interchangeable: true` (new additive, opt-in field -- backend/app/practice/service.py''s
    `build_prompt()` now accepts ANY of the slot''s own constraint-matching candidates as correct for such a template, via
    the same `{"canonical","accepted"}` multi-answer shape `grade()` already supports for hand-authored content). See AUTHORING_GUIDE.md#17.

    **Re-authoring fix, 2026-07-24 (unit-scope DEAD-template pass)**: `scripts/_practice_unit_scope_check.py`
    flagged 3 DEAD templates + 1 below-floor matching_pairs. Root cause for all 3 DEAD templates: the
    `volume_en_nl_a1_unit01_item_{02,07,12}_single` singleton tags anchor to bare tokens (''Je'', ''Jan'')
    whose canonical `iter_specs()` lexeme record is classified under a LATER unit (''Je'' -> a1.unit30.lesson05;
    ''Jan'' -> a1.unit05.lesson05), not this unit -- so at checkpoint (unit-scoped) generation each had 0
    candidates. This is a `backfill_lexemes_en_nl.py` token-provenance dedup artifact (a bare token is
    classified to a single lesson_content_key course-wide, and these two tokens'' canonical classification
    landed outside unit01 even though they are used inside unit01''s own lesson01/lesson03 sentences) --
    PACK-ONLY per this task''s mandate, so it is not fixable here; logged for the coordinator to route to a
    backfill fix. DROPPED `lesson01.order.001.volume_fill.002`, `lesson03.order.001.volume_fill.007`, and
    `lesson05.order.001.volume_fill.012` -- each duplicated ground already covered live by that lesson''s
    own `order.001`/`complete.002`/`translate.003` (or, for lesson03, `order.001`/`translate.003`), so
    nothing unit-scoped is lost. Left the two SIBLING volume_fill templates
    (`lesson02.translate.003.volume_fill.005` on ''Hoi'', `lesson04.translate.003.volume_fill.010` on
    ''België'') untouched -- both resolve to a lesson_content_key inside unit01 (even though the ''Hoi''
    token''s own lesson is lesson01, not lesson02) so the validator does not flag them DEAD.

    Fixed the below-floor `lesson04.match.001` (matching_pairs declared 4 slots; unit01''s own `country`
    pool only has 4 distinct members -- Nederland/België/Duitsland/Egypte -- so it could never reach the
    6-pair floor on that tag alone). Widened to 6 slots against a new union
    `agreement_tags.semantic: [person_name, country, place_name]` (part_of_speech: proper_noun, no shared
    preset with the country-only `translate.003` sibling, which keeps its narrower `country` tag
    unchanged) -- this pools all 7 of unit01''s own proper nouns (Noor, Nederland, België, Duitsland,
    Lotte, Omar, Egypte), all distinct glosses, no case-duplicates, no confusable rights. Matching_pairs
    frames have no literal surrounding text, so mixing names and countries in one matcher carries no
    grammaticality risk at either unit or course scope. tag_schema updated: removed
    `volume_en_nl_a1_unit01_item_{02,07,12}_single` (no longer referenced) and added `place_name` (needed
    by the new union; `person_name`/`country` were already declared).


    **Tier-polish, 2026-07-24 (wave 2, tier-thinness pass)**: recognition tier had only 1 live template
    (lesson02 listen.001). Added two multiple_choice templates over unit-native pools: lesson02.choose.004
    (greeting phrases, 5 unit tokens / 5 distinct glosses) and lesson04.choose.004 (language_or_nationality
    adjectives Nederlands/Belgisch/Engels/Duits, 4 distinct glosses). Both bare `{item}` frames (no
    grammaticality-in-frame risk at any scope); both tags were already declared in tag_schema. Recognition
    tier now 3 live.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 17 templates against unit-
    and course-scoped pools (rendered every candidate), the nl.a1.unit01 realization and the en-nl overlay
    glosses. 4 defects fixed. (1) lesson03.translate.003 prompt "My name is {item}." accepted only "Ik heet
    ..." although lesson03 also teaches "Mijn naam is Noor." with the identical overlay gloss -- prompt now
    "Translate using heet: My name is {item}.". (2) lesson02.translate.003 "{item}! How are you?" accepted
    only "Hoe gaat het?" while lesson02 teaches "Hoe gaat het met je/u?" with the same gloss -- prompt now
    names the short question. (3) lesson02...volume_fill.005 "___! Hoe gaat het?" (answer Hoi) and (4)
    lesson04...volume_fill.010 "Ik kom uit ___." (answer Belgie) had no cue, so every other taught
    greeting/country was an equally correct, rejected answer -- added the English sentence to each frame ("--
    Hi! How are you?" / "-- I come from Belgium."), the convention used by later en-nl packs. Deferred:
    course-scoped capitalized pronoun rows Jij/Je (units 23/30) render mid-sentence ("Ben Jij nieuw hier?") --
    grading is casefolded, display only; route a backfill case-fold. Course-scoped person_name includes Opa
    glossed "Grandpa (Lotte''s grandfather, used as a name)", which renders oddly in "My name is ..." --
    lexeme tag/gloss issue, not fixable pack-side without losing the unit''s own names. No native-judgment
    flags.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - register_language
    - wellbeing
    - name_exchange
    - origin_language
    - cafe_small_talk
    - first_meeting_dialogue
    - number
    - contact_number
    - age_quantity
    - price
    - library_registration
    - weekday
    - month
    - ordinal_number
    - date_expression
    - library_date
    - cafe_appointment
    - clock_time
    - quarter_hour
    - time_question
    - time_of_day
    - schedule
    - cafe_meetup_time
    - informal_address
    - polite_address
    - greeting
    - wellbeing_answer
    - person_name
    - place_name
    - country
    - language_or_nationality
    - place_name
    - volume_en_nl_a1_unit01_item_05_single
    - volume_en_nl_a1_unit01_item_10_single
    register:
    - informal
    - polite
slot_presets:
  informal_address: &id001
    language_code: nl
    part_of_speech: pronoun
    agreement_tags:
      semantic: informal_address
  greeting: &id002
    language_code: nl
    part_of_speech: phrase
    agreement_tags:
      semantic: greeting
  person_name: &id003
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: person_name
  country: &id004
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: country
  unit_proper_noun: &id005
    # Union of this unit's own proper-noun categories (names + countries),
    # used only by the lesson04 matching_pairs -- widens its unit-scoped
    # pool from 4 (country alone) to 7 so it clears the 6-pair floor. The
    # country-only `translate.003` sibling below keeps *id004 unchanged.
    language_code: nl
    part_of_speech: proper_noun
    agreement_tags:
      semantic: [person_name, country, place_name]
  number:
    language_code: nl
    part_of_speech:
    - symbol
    - noun
    agreement_tags:
      semantic: number
  weekday:
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: weekday
  month:
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: month
  ordinal_number:
    language_code: nl
    part_of_speech: noun
    agreement_tags:
      semantic: ordinal_number
  time_of_day:
    language_code: nl
    part_of_speech:
    - noun
    - adverb
    agreement_tags:
      semantic: time_of_day
