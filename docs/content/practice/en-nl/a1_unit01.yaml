schema_version: "1.0"
pack_key: practice.en-nl.a1.unit01
source_language: en
target_language: nl
unit_content_key: nl.a1.unit01.greetings_and_introductions
review:
  status: reviewed
  required_next_reviewer: null
  fresh_context: "true"
  notes: >-
    Independent fresh-context content audit completed (zero access to the
    authoring reasoning above, per project convention). Confirmed every
    template's lesson_content_key against the real nl.a1.unit01 realization
    lessons (all 6 match exactly). Wrote a standalone harness importing
    iter_specs() from scripts/backfill_lexemes_en_nl.py and replicating the
    backend's lexeme_matches()/_requested_matches() logic exactly (language_code
    exact match, part_of_speech OR-membership, agreement_tags AND-of-OR) --
    every slot has real candidate counts well above the >=4 (multiple_choice/
    listen_select) / >=1 (other types) bar (informal_address=2, greeting=5,
    person_name=7, country=4, matching_pairs first/second=4/4). Hand-checked
    every generated sentence for every possible filler, not just the example
    already in the file: informal_address (jij/je) in "Ben {item} nieuw
    hier?"/"...taalcafé?" is grammatical for both; greeting phrases (Hallo/Hoi/
    Goedemorgen/Goedemiddag/Goedenavond) all fit "{item}! Hoe gaat het?"
    naturally; person_name (Noor/Omar/Lotte/Sander/Fenna/Jan/Marieke) all fit
    "Ik heet {item}."/"Hoi, ik ben {item}." with no capitalization or gender
    issues (proper nouns, no article); country matching_pairs (Nederland/
    België/Duitsland/Egypte) is a genuine distinct-pair set with no
    self-reference or homograph risk. No jargon leaks, no forbidden YAML
    booleans, no capitalization leaks (no capitalized sentence-initial variant
    of any slot value is used mid-sentence). Compiler validation re-run
    together with units 02-09: 0 errors/0 warnings. The review.notes text
    above accurately describes what Session 3 did; this entry supersedes only
    the review.status field per the standing "author leaves unreviewed, a
    separate fresh-context reviewer upgrades" convention. Native-speaker
    review by Ramin (the standing nl exception) is still the final bar before
    a live deploy, but this pack is genuinely clean at the content-review
    level.

    **Follow-up fix, 2026-07-06 (real user report)**: the "grammatical for
    both" finding above about informal_address (jij/je) understated the
    problem -- grammatical for both means a `fill_in_blank` blanking
    "Ben {item} nieuw hier?"/"...taalcafé?" is genuinely unanswerable with
    certainty, since nothing in either frame lets a learner prefer jij
    over je or vice versa; only one was ever marked correct per generated
    instance, so a learner typing the other 100%-correct Dutch pronoun was
    wrongly marked wrong. Reproduced live via a fresh Endless Practice
    batch. Fixed by marking both `lesson01.complete.002`'s and
    `lesson05.complete.002`'s answer_derivation `interchangeable: true` (new
    additive, opt-in field -- backend/app/practice/service.py's
    `build_prompt()` now accepts ANY of the slot's own constraint-matching
    candidates as correct for such a template, via the same
    `{"canonical","accepted"}` multi-answer shape `grade()` already
    supports for hand-authored content). See AUTHORING_GUIDE.md#17.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [register_language, wellbeing, name_exchange, origin_language, cafe_small_talk, first_meeting_dialogue, number, contact_number, age_quantity, price, library_registration, weekday, month, ordinal_number, date_expression, library_date, cafe_appointment, clock_time, quarter_hour, time_question, time_of_day, schedule, cafe_meetup_time, informal_address, polite_address, greeting, wellbeing_answer, person_name, place_name, country, language_or_nationality]
    register: [informal, polite]
slot_presets:
  informal_address: &informal_address {language_code: nl, part_of_speech: pronoun, agreement_tags: {semantic: informal_address}}
  greeting: &greeting {language_code: nl, part_of_speech: phrase, agreement_tags: {semantic: greeting}}
  person_name: &person_name {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: person_name}}
  country: &country {language_code: nl, part_of_speech: proper_noun, agreement_tags: {semantic: country}}
  number: &number {language_code: nl, part_of_speech: [symbol, noun], agreement_tags: {semantic: number}}
  weekday: &weekday {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: weekday}}
  month: &month {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: month}}
  ordinal_number: &ordinal_number {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: ordinal_number}}
  time_of_day: &time_of_day {language_code: nl, part_of_speech: [noun, adverb], agreement_tags: {semantic: time_of_day}}
templates:
  - content_key: practice.en-nl.nl.a1.unit01.lesson01.order.001
    lesson_content_key: nl.a1.unit01.lesson01.jij_je_en_u
    type: word_order
    frame: {text: "Ben {item} nieuw hier?", language_code: nl, direction: ltr}
    slots: {item: *informal_address}
    answer_derivation: {kind: render_frame, frame: {text: "Ben {item} nieuw hier?", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is an informal form of address.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson01.complete.002
    lesson_content_key: nl.a1.unit01.lesson01.jij_je_en_u
    type: fill_in_blank
    frame:
      text: "Ben {item} nieuw hier?"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Complete the Dutch sentence.", language_code: en, direction: ltr}
    slots: {item: *informal_address}
    # interchangeable: true -- "Ben ___ nieuw hier?" gives no way to tell
    # jij (stressed) from je (unstressed) apart; both are the identical
    # informal "you" in this exact question, so either must grade correct.
    # Found live 2026-07-06 (real user report: unanswerable-with-certainty
    # blank). See AUTHORING_GUIDE.md#17.
    answer_derivation: {kind: slot_text, slot: item, interchangeable: true}
    feedback_frame: {text: "{item} is an informal form of address.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson01.translate.003
    lesson_content_key: nl.a1.unit01.lesson01.jij_je_en_u
    type: translation
    frame:
      text: "Translate using {item}: Are you new here?"
      language_code: en
      direction: ltr
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *informal_address}
    answer_derivation: {kind: render_frame, frame: {text: "Ben {item} nieuw hier?", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Use ben with the informal pronoun {item} in this question.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson02.listen.001
    lesson_content_key: nl.a1.unit01.lesson02.groeten_en_welzijn
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *greeting}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the greeting you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson02.translate.003
    lesson_content_key: nl.a1.unit01.lesson02.groeten_en_welzijn
    type: translation
    frame:
      text: "{item}! How are you?"
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *greeting}
    answer_derivation: {kind: render_frame, frame: {text: "{item}! Hoe gaat het?", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} opens the exchange.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson03.order.001
    lesson_content_key: nl.a1.unit01.lesson03.namen
    type: word_order
    frame: {text: "Ik heet {item}.", language_code: nl, direction: ltr}
    slots: {item: *person_name}
    answer_derivation: {kind: render_frame, frame: {text: "Ik heet {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The speaker gives the name {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson03.translate.003
    lesson_content_key: nl.a1.unit01.lesson03.namen
    type: translation
    frame:
      text: "My name is {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *person_name}
    answer_derivation: {kind: render_frame, frame: {text: "Ik heet {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The speaker gives the name {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson04.match.001
    lesson_content_key: nl.a1.unit01.lesson04.herkomst_en_taal
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth}", language_code: nl, direction: ltr}
    slots: {first: *country, second: *country, third: *country, fourth: *country}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "Match each country with its English name.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson04.translate.003
    lesson_content_key: nl.a1.unit01.lesson04.herkomst_en_taal
    type: translation
    frame:
      text: "I come from {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *country}
    answer_derivation: {kind: render_frame, frame: {text: "Ik kom uit {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The speaker comes from {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson05.order.001
    lesson_content_key: nl.a1.unit01.lesson05.taalcafe
    type: word_order
    frame: {text: "Ben {item} hier voor het taalcafé?", language_code: nl, direction: ltr}
    slots: {item: *informal_address}
    answer_derivation: {kind: render_frame, frame: {text: "Ben {item} hier voor het taalcafé?", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} keeps this question informal.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson05.complete.002
    lesson_content_key: nl.a1.unit01.lesson05.taalcafe
    type: fill_in_blank
    frame:
      text: "Ben {item} hier voor het taalcafé?"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Complete the Dutch sentence.", language_code: en, direction: ltr}
    slots: {item: *informal_address}
    # interchangeable: true -- same je/jij ambiguity as lesson01.complete.002
    # above; see that template's comment and AUTHORING_GUIDE.md#17.
    answer_derivation: {kind: slot_text, slot: item, interchangeable: true}
    feedback_frame: {text: "{item} keeps this question informal.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson05.translate.003
    lesson_content_key: nl.a1.unit01.lesson05.taalcafe
    type: translation
    frame:
      text: "Translate using {item}: Are you here for the language café?"
      language_code: en
      direction: ltr
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *informal_address}
    answer_derivation: {kind: render_frame, frame: {text: "Ben {item} hier voor het taalcafé?", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Use ben with the informal pronoun {item} in this question.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson06.order.001
    lesson_content_key: nl.a1.unit01.lesson06.eerste_ontmoeting
    type: word_order
    frame: {text: "Hoi, ik ben {item}.", language_code: nl, direction: ltr}
    slots: {item: *person_name}
    answer_derivation: {kind: render_frame, frame: {text: "Hoi, ik ben {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The speaker introduces themself as {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit01.lesson06.translate.003
    lesson_content_key: nl.a1.unit01.lesson06.eerste_ontmoeting
    type: translation
    frame:
      text: "Hi, I am {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *person_name}
    answer_derivation: {kind: render_frame, frame: {text: "Hoi, ik ben {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "The speaker introduces themself as {item}.", language_code: en, direction: ltr}
