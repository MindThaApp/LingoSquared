schema_version: '1.0'
pack_key: practice.en-nl.c1.unit03
source_language: en
target_language: nl
unit_content_key: nl.c1.unit03.registerbeheersing
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md to give nl.c1.unit03 (registerbeheersing:
    informal vs formal address, diplomatic softening, controlled emphasis, irony vs sincerity, style choice)
    a working checkpoint. C1 discourse/grammar unit, so the 8.1 pattern is used, but with CURATED unit-wide
    pools instead of a raw union of the lesson tags: the raw union is dominated by modals, pronouns and
    near-synonym pairs that cannot be excluded by part_of_speech alone. 22 templates over all 6 lessons:
    multiple_choice x5, matching_pairs x3, word_order x5, fill_in_blank x3, translation x6 (5 bare-word
    + 1 fixed-sentence). Pools (extra semantic tags, to be merged into the backfill from the c1_unit03
    tags file): c1u03_noun_core (27 nouns), c1u03_mod_core (21 adjectives/adverbs), c1u03_verb_core (20
    verbs); single-member anchors c1u03_antwoorden_single, c1u03_prijs_single, c1u03_benadrukken_single,
    c1u03_noodzakelijk_single, c1u03_voortreffelijk_single, c1u03_mislukt_single, c1u03_bepalen_single,
    c1u03_gelijk_single, c1u03_beschermt_single. Every word_order, fill_in_blank and fixed-sentence translation
    slot is a single-member anchor (1 course-scope candidate each), so every frame renders one way and
    no literal frame word is a candidate of its own slot (checked by hand; the integrity script does not
    read c1_ packs). Measured at unit scope (.c1.unit03. filter): ALL 68/91 (75%), recognition 68/91 (75%),
    structured 68/91 (75%), production 68/91 (75%), 6/6 lessons in every tier, no dead templates. Deliberately
    kept OUT of every gloss-showing pool: (1) stuur, glossed "send (with ik)" but the unit teaches the
    imperative "Stuur je antwoord" - soft mis-gloss, route to backfill; (2) the modals/auxiliaries zou,
    kunnen, kunt, willen, hebt (kunnen "can (infinitive/plural)" vs kunt "can (with u or jij)" are interchangeable
    as answers); (3) near-synonym pairs, one member dropped: vriendelijke (dup of vriendelijk), weer "again"
    vs alweer "yet again; once again" (weer is exercised token-exact in the lesson04 word_order frame
    instead), verhoogt vs verhogen ("raises" / "to raise"), keert vs omkeren ("turns ... om = reverses"
    / "to reverse"), reageert vs antwoorden ("responds" / "to answer; to reply"); (4) function words,
    names and the capitalised salutation: u, mij, met, aan, nog, als, zo, ander, wat, Omar, Vries, Geachte.
    Note: toon (from the lesson05 hero sentence) has no lexeme, so the lesson05 word_order anchors on
    bepalen and keeps toon literal. Register: the frames use u because the unit''s hero sentences address
    an institution formally, matching the realization''s register_policy. Reviewer double-checks: native
    naturalness of the five word_order / three fill_in_blank frames (all copied from the realization''s
    teaching sentences, except Diplomatie beschermt de relatie, which is a shortened form of its lesson06
    grammar note); whether the fixed translation hint ("putting alweer before the past participle") pins
    De levering is alweer mislukt as the only rendering; whether gelijk "equal" is a fair gloss for the
    blijft gelijk (= stays the same) sense.'
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - c1u03_noun_core
    - c1u03_mod_core
    - c1u03_verb_core
    - c1u03_antwoorden_single
    - c1u03_prijs_single
