schema_version: '1.0'
pack_key: practice.en-nl.c1.unit03
source_language: en
target_language: nl
unit_content_key: nl.c1.unit03.registerbeheersing
review:
  status: unreviewed
  fresh_context: 'false'
  notes: 'Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md to give nl.c1.unit03 (registerbeheersing:
      informal vs formal address, diplomatic softening, controlled emphasis, irony vs sincerity, style choice)
      a working checkpoint. C1 discourse/grammar unit, so the 8.1 pattern is used, but with CURATED unit-wide
      pools instead of a raw union of the lesson tags: the raw union is dominated by modals, pronouns and
      near-synonym pairs that cannot be excluded by part_of_speech alone. 22 templates over all 6 lessons:
      multiple_choice x5, matching_pairs x3, word_order x7, fill_in_blank x1, translation x6 (5 bare-word
      + 1 fixed-sentence). Pools (extra semantic tags, to be merged into the backfill from the c1_unit03 tags
      file): recognition/matching pools c1u03_noun_core (27 nouns), c1u03_mod_core (21 adjectives/adverbs),
      c1u03_verb_core (20 verbs); bare-word translation pools are narrower subsets, c1u03_noun_tr (23), c1u03_mod_tr
      (12), c1u03_verb_tr (10), which leave out every token whose gloss is equally answered by another common
      Dutch word under exact-match grading: nouns heer (meneer), termijn (deadline), voorrang (prioriteit),
      levering (bezorging); modifiers wellicht (misschien), noodzakelijk (nodig), werkelijk (echt), doeltreffend
      (effectief), passende (gepaste), alweer (weer/opnieuw), gelijk (hetzelfde), direct (rechtstreeks), voortreffelijk
      (uitmuntend); verbs stellen (zetten), bekijken (kijken naar), geregeld (georganiseerd), verhogen (vergroten),
      meen (bedoel), mislukt (gefaald), falen (mislukken), omkeren (omdraaien), veranderen (wijzigen), verkleint
      (vermindert). Single-member anchors c1u03_antwoorden_single, c1u03_prijs_single, c1u03_benadrukken_single,
      c1u03_noodzakelijk_single, c1u03_voortreffelijk_single, c1u03_mislukt_single, c1u03_bepalen_single,
      c1u03_gelijk_single, c1u03_beschermt_single. Every word_order, fill_in_blank and fixed-sentence translation
      slot is a single-member anchor (1 course-scope candidate each), so every frame renders one way and no
      literal frame word is a candidate of its own slot. The only fill_in_blank left is op {item} stellen
      (fixed idiom, prijs is the one word that fits); the former absoluut noodzakelijk and blijft gelijk blanks
      became word_order (lesson03.order.003, lesson05.order.004) because nodig/vereist and hetzelfde/ongewijzigd
      fit those blanks equally with no English cue. The fixed-sentence translation names levering, alweer
      and mislukken so De levering is alweer mislukt is the only rendering. Glosses (gloss fixes file for
      this unit) were rewritten so none quotes its own Dutch token (stellen, prijs, meen, falen, voorrang,
      ander, keert, focuszin, Vries), past participles no longer name their infinitive (mislukt, opgelost),
      voortreffelijk no longer names uitstekend, and gelijk is glossed in its taught sense (the same; unchanged).
      Measured at unit scope: ALL 68/91 (75%), recognition 68/91 (75%), structured 68/91 (75%), production
      46/91 (51%), 6/6 lessons in every tier, no dead templates. Deliberately kept OUT of every gloss-showing
      pool: stuur (glossed send (with ik) but taught as an imperative); the modals/auxiliaries zou, kunnen,
      kunt, willen, hebt; one member of each near-synonym pair (vriendelijke, weer, verhoogt, keert, reageert);
      function words, names and the capitalised salutation (u, mij, met, aan, nog, als, zo, ander, wat, Omar,
      Vries, Geachte). toon has no lexeme, so lesson05.order.002 anchors on bepalen and keeps toon literal.
      Register: the frames use u because the hero sentences address an institution formally, matching the
      realization''s register_policy. Fresh-context review 2026-10-10: 16 findings (7 blocker, 9 minor), all addressed (fixed, or the affected token excluded from the pool), confirmed by a pool-level scan.'
