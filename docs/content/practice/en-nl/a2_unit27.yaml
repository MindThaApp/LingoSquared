    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: nl, direction: ltr}
    slots: {first: *visit_noun_pure, second: *visit_noun_pure, third: *visit_noun_pure, fourth: *visit_noun_pure, fifth: *visit_noun_pure, sixth: *visit_noun_pure}
