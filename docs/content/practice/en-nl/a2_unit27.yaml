schema_version: "1.0"
pack_key: practice.en-nl.a2.unit27
source_language: en
target_language: nl
unit_content_key: nl.a2.unit27.huisarts
review:
  status: unreviewed
  fresh_context: "false"
  notes: "Authored 2026-07-07: the first en-nl A2 practice pack, closing the
    real content gap flagged this session -- en-nl practice templates
    stopped at unit23 (A1) while units 24-28 (A2) already had full lesson
    content with zero practice coverage. This file covers unit27 (a
    doctor's consultation: booking an appointment, describing symptoms,
    understanding a diagnosis, taking a prescription).

    New generative/recognition tags added to scripts/backfill_lexemes_en_
    nl.py's nl_agreement_tags(), each verified safe in the exact frame it
    fills: medical_professional (2 members: huisarts/dokter, safe in 'Ik
    wil graag een afspraak maken bij de {item}.'); symptom_word (3
    members: hoofdpijn/koorts/pijn, safe in 'Ik heb {item}.' -- klachten
    deliberately excluded, it's the umbrella term the doctor asks about,
    not something a patient states this way); visit_noun (9 members,
    recognition-only bare-word tag, no shared frame, same discipline as
    unit11's plan_vocab/unit22's communication_word) plus its exact-case
    visit_noun_pure sibling for matching_pairs (the capitalized
    lesson06-dialogue 'Huisarts' speaker label is a real separate token
    and would otherwise case-duplicate 'huisarts' as if it were a second
    pair); reassurance_adj (2 members: ernstig/vervelend, safe in both
    'Het is niet {item}.' and 'Is het {item}?', kept out of
    multiple_choice/listen_select for having only 2 members);
    separable_health_verb (2 members: innemen/terugkomen, matching_pairs
    only, exactly meets the >=2 distinct-token floor).

    Every slot's real candidate count was verified with a standalone
    lexeme_matches()-replicating harness against this script's actual
    updated output before writing these templates -- see
    scripts/_practice_slot_check.py's own run for the final confirmation.
    Every fill_in_blank candidate (there are none in this pack -- every
    single-slot template here uses render_frame/slot_gloss derivation
    instead, since this unit's thin per-frame candidate pools (mostly 1-3
    members) would either trivially pass or risk the exact
    AUTHORING_GUIDE #17 ambiguity bug flagged live this session) was
    swept with scripts/_fill_in_blank_ambiguity_check.py regardless, 0
    flagged. Needs the standard fresh-context review before import. Same
    blocking dependency as every earlier en-nl pack:
    backfill_lexemes_en_nl.py has not actually been run against a real
    database yet."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [medical_professional, symptom_word, visit_noun, visit_noun_pure, reassurance_adj, separable_health_verb]
slot_presets:
  medical_professional: &medical_professional {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: medical_professional}}
  symptom_word: &symptom_word {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: symptom_word}}
  visit_noun: &visit_noun {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: visit_noun}}
  visit_noun_pure: &visit_noun_pure {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: visit_noun_pure}}
  reassurance_adj: &reassurance_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: reassurance_adj}}
  separable_health_verb: &separable_health_verb {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: separable_health_verb}}
templates:
  - content_key: practice.en-nl.nl.a2.unit27.lesson01.translate.001
    lesson_content_key: nl.a2.unit27.lesson01.afspraak_bij_huisarts
    type: translation
    frame:
      text: "I would like to make an appointment with {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *medical_professional}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil graag een afspraak maken bij de {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik wil graag een afspraak maken bij de {item}.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a2.unit27.lesson01.order.002
    lesson_content_key: nl.a2.unit27.lesson01.afspraak_bij_huisarts
    type: word_order
    frame: {text: "Ik wil graag een afspraak maken bij de {item}.", language_code: nl, direction: ltr}
    slots: {item: *medical_professional}
    answer_derivation: {kind: render_frame, frame: {text: "Ik wil graag een afspraak maken bij de {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is who the appointment is with.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a2.unit27.lesson01.choose.003
    lesson_content_key: nl.a2.unit27.lesson01.afspraak_bij_huisarts
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *visit_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a word from this unit's doctor's-visit vocabulary.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a2.unit27.lesson01.listen.004
    lesson_content_key: nl.a2.unit27.lesson01.afspraak_bij_huisarts
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *visit_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a2.unit27.lesson01.match.005
    lesson_content_key: nl.a2.unit27.lesson01.afspraak_bij_huisarts
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth}", language_code: nl, direction: ltr}
    slots: {first: *visit_noun_pure, second: *visit_noun_pure, third: *visit_noun_pure, fourth: *visit_noun_pure}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth]}
    feedback_frame: {text: "Match each word or phrase with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a2.unit27.lesson02.translate.001
    lesson_content_key: nl.a2.unit27.lesson02.wat_zijn_de_klachten
    type: translation
    frame:
      text: "My symptom: {item}."
      language_code: en
      direction: ltr
      slot_rendering: {item: english_gloss}
      text_blocks:
        - {text: "Translate into Dutch.", language_code: en, direction: ltr}
    slots: {item: *symptom_word}
    answer_derivation: {kind: render_frame, frame: {text: "Ik heb {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "Ik heb {item}.", language_code: en, direction: ltr}
