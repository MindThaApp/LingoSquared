review:
  status: reviewed
  fresh_context: 'true'
  notes: >-
    Authored 2026-07-23 against docs/content/PRACTICE_PACK_RECIPE.md. en-nl A1
    unit60 (sportschool / "Een dag in de sportschool") has 12 lexemes with
    lexemes in ALL 6 lessons (backfill_lexemes_en_nl.py's auto-generated
    sportschool_vocab/sportschool_noun/sportschool_loopband_single tags).

    16 templates: multiple_choice x6 + translation bare-word x6 (one of each
    per lesson; sportschool_vocab pool = sportschool/abonnement/loopband/ren/
    gewichten/til/instructeur/yogales/dagpas/willen/strand, 11 distinct
    glosses -- "willen" carries over into unit60's own lesson05, "strand" into
    lesson06 as a forward-reference the unit's own dialogue introduces, both
    legitimately this unit's lexemes), listen_select x1 (sportschool_vocab,
    anchored lesson02, the richest lesson), matching_pairs x1
    (sportschool_noun, 6 of 8 nouns: sportschool/abonnement/loopband/
    gewichten/instructeur/yogales/dagpas/strand), word_order x1 + fill_in_blank
    x1 on the single-member sportschool_loopband_single anchor, both reusing
    the unit's own taught sentences verbatim: "Ik ren op de loopband." and
    "Ik gebruik de loopband en de gewichten."

    Read every gloss (§0.1): all 12 tokens' glosses match what the realization
    teaches ("ren" = "run (with ik)" matches "Ik ren op de loopband", "til" =
    "lift (with ik)" matches "Ik til de gewichten"). No mis-glosses found.

    §9 step 5 course-scope check: sportschool_loopband_single is generated
    only for token "loopband" (NL_A1_VOLUME_SINGLE_ANCHORS), a
    direction-wide-unique anchor, so it stays a single course-wide candidate
    in both frames. Neither "Ik"/"ren"/"op"/"de" nor "Ik"/"gebruik"/"de"/"en"/
    "de"/"gewichten" is ever a sportschool_loopband_single candidate (its only
    member is "loopband" itself, absent from both frames' literal text).
    "gewichten" is a literal word in the fill_in_blank frame and IS a
    sportschool_vocab/sportschool_noun candidate elsewhere, but that is a
    different slot -- not a self-reference (§1.1).

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): all 16
    templates checked against the real lexeme pools at unit scope (12
    lexemes, 11 sportschool_vocab) and course scope (sportschool_vocab 46,
    sportschool_noun 19, sportschool_loopband_single 1); every gloss read
    against the realization (ren/til with ik, abonnement = membership,
    willen, strand all match); "Ik ren op de loopband." and "Ik gebruik de
    loopband en de gewichten." are taught sentences; no duplicate glosses in
    the course-scope translation pool, no self-reference, no confusable
    matching rights, no booleans or jargon. 0 defects found.
