schema_version: "1.0"
pack_key: practice.en-nl.a1.unit21
source_language: en
target_language: nl
unit_content_key: nl.a1.unit21.emotions
review:
  status: reviewed
  fresh_context: "true"
  notes: "Fresh-context native review 2026-07-29 (batch 6): CLEAN — verified via
    iter_specs (feeling_adj is a hand-coded exact 5-token set, no capitalized/
    course-wide contamination), gates 0 DEAD / 0 self-ref / validate 0-0,
    realization↔overlay pairs+audio cross-checked, de/het + register clean. The
    lone 5-pair match.003 floor is the disclosed structural cap. Prior note
    follows. -- Authored 2026-07-06 by the Claude session extending the en-nl
    Endless Practice pool to cover the real content gap flagged this
    session: en-nl practice templates only went through unit16 while the
    actual Dutch lesson content already goes through unit23. This file
    covers unit21 (expressing feelings): naming basic feelings, giving a
    reason with omdat, asking/describing feelings with voelen zich.
    Added a 5-member 'feeling_adj' generative adjective tag (blij/
    verdrietig/boos/zenuwachtig/trots) verified safe in THREE distinct
    real sentence shapes from this unit's own content: 'Ik ben {item}.'
    (lesson01), 'Hij voelt zich {item}.' (lesson04), and 'Waarom ben je
    {item}?' (lesson02's own teaching card, reused generatively here).
    All five feelings take all three shapes grammatically (trots is not
    literally combined with 'Ik ben' in the source text but is
    grammatically identical to blij/zenuwachtig there, same reasoning
    already established for unit14's comparative_adj reversed-pairing
    note). Every slot's real candidate count was verified with a
    standalone lexeme_matches()-replicating harness against this script's
    actual output before writing these templates. Needs the standard
    fresh-context review before import. Same blocking dependency as every
    earlier en-nl pack: backfill_lexemes_en_nl.py has not actually been
    run against a real database yet."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [feeling_adj]
slot_presets:
  feeling_adj: &feeling_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: feeling_adj}}
templates:
  - content_key: practice.en-nl.nl.a1.unit21.lesson01.choose.001
    lesson_content_key: nl.a1.unit21.lesson01.blij_verdrietig_boos
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *feeling_adj}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a feeling word from this unit.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit21.lesson01.listen.002
    lesson_content_key: nl.a1.unit21.lesson01.blij_verdrietig_boos
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *feeling_adj}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit21.lesson01.match.003
    lesson_content_key: nl.a1.unit21.lesson01.blij_verdrietig_boos
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth}", language_code: nl, direction: ltr}
    slots: {first: *feeling_adj, second: *feeling_adj, third: *feeling_adj, fourth: *feeling_adj, fifth: *feeling_adj}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth]}
    feedback_frame: {text: "Match each feeling word with its English meaning.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit21.lesson01.order.004
    lesson_content_key: nl.a1.unit21.lesson01.blij_verdrietig_boos
    type: word_order
    frame: {text: "Ik ben {item}.", language_code: nl, direction: ltr}
    slots: {item: *feeling_adj}
    answer_derivation: {kind: render_frame, frame: {text: "Ik ben {item}.", language_code: nl, direction: ltr}}
    feedback_frame: {text: "{item} is the feeling in this sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a1.unit21.lesson02.order.001
    lesson_content_key: nl.a1.unit21.lesson02.waarom_ben_je_blij
    type: word_order
    frame: {text: "Waarom ben je {item}?", language_code: nl, direction: ltr}
