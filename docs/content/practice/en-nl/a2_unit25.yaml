schema_version: "1.0"
pack_key: practice.en-nl.a2.unit25
source_language: en
target_language: nl
unit_content_key: nl.a2.unit25.meningen
review:
  status: reviewed
  fresh_context: "true"
  required_next_reviewer: native_speaker_review
  notes: "Review 2026-10-24 (en-nl practice pass, session 10): 3 fixes --
    translate.004 prompt pins 'volgens mij'; lesson03 choose feedback no
    longer claims every verb is an opinion verb; fill.003 feedback
    punctuation. Native flags: gedeeltelijk blank also accepts helemaal in
    real Dutch.

    Authored 2026-07-07 by the Claude session filling en-nl's A2
    practice-pool gap (see a2_unit24.yaml's own notes for the full
    background). This file covers unit25 (meningen/opinions: giving
    opinions with reasons about a new bike path). Extended
    scripts/backfill_lexemes_en_nl.py with 7 new brand-new-string semantic
    tags scoped to this unit's own real vocabulary (opinion_noun: 9-member
    noun pool for recognition + matching_pairs; opinion_adj: 5-member
    generative adjective pool verified safe in 'Volgens mij is het
    fietspad {item}.' -- gevaarlijk/smal are directly attested there;
    veiliger/breder/duur are grammatically identical predicate adjectives
    in the same slot, same reversed-pairing convention already established
    by unit14's comparative_adj/unit21's feeling_adj; opinion_verb:
    7-member recognition-only verb pool; opinion_gedeeltelijk_single/
    opinion_veiliger_single: single-member tags guaranteeing a permanently
    unambiguous fill_in_blank slot, matching this unit's own real
    fill_in_blank exercises verbatim -- 'Ik ben het ___ met je eens.' and
    'Aan de andere kant is het fietspad wel ___ voor kinderen.'). Every
    tag's real course-wide candidate count was verified with a standalone
    lexeme_matches()-replicating harness against this script's actual
    output before writing these templates (also caught and fixed a real
    case-duplicate contamination live while verifying -- capitalized
    'Denk'/'Vind' from unrelated earlier A1 units (unit12/unit13)
    silently widening opinion_verb via casefold comparison against this
    unit's own lowercase 'denk'/'vind' -- fixed by switching to an
    exact-case token check, same class as this file's existing weekday/
    weekday_pure precedent). Note: opinion_veiliger_single deliberately
    duplicates one member already in the broader opinion_adj tag (veiliger
    is both a valid generic 'Volgens mij is het fietspad veiliger.' answer
    AND the one safe fill_in_blank candidate for the 'Aan de andere kant'
    frame) -- this is intentional, not a copy-paste error: the single-
    member tag exists purely to guarantee fill_in_blank safety for that
    specific frame regardless of what else opinion_adj ever grows to
    include. 13 templates across all 6 lessons: fill_in_blank x2
    (gedeeltelijk, veiliger -- both single-candidate, verified with
    scripts/_fill_in_blank_ambiguity_check.py), multiple_choice x2,
    listen_select x2, matching_pairs x2 (9-pair unit noun pool; 14-member
    combined noun+adjective finale pool anchored to lesson06), word_order
    x1, translation x2. Needs the standard fresh-context review before
    import. Blocking dependency, same as every other en-nl pack: backfill_
    lexemes_en_nl.py has not actually been run against a real database
    yet.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked
    all 14 templates against unit- and course-scoped pools (course pool
    equals unit pool for every tag here), glosses, frames, distractor
    overlap, matching confusability, booleans and jargon. Fixed:
    lesson02.translate.004 feedback_frame is Dutch text but was tagged
    language_code en -- set to nl. Otherwise 0 learner-facing defects found.
    Noted, not changed: lesson06.match.001 has 14 pairs (AUTHORING_GUIDE aim
    is 6-12; not a grading defect). Deferred (systemic, not fixable in-
    pack): bare-word translation glosses carry the English article ('the
    flower') while the single accepted answer is the bare token (bloem), so
    a learner typing 'de bloem' is graded wrong; needs an engine-side
    article tolerance or a gloss convention change. No native-judgment
    flags."
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [opinion_noun, opinion_adj, opinion_verb, opinion_gedeeltelijk_single, opinion_veiliger_single]
slot_presets:
  opinion_noun: &opinion_noun {language_code: nl, part_of_speech: noun, agreement_tags: {semantic: opinion_noun}}
  opinion_adj: &opinion_adj {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: opinion_adj}}
  opinion_verb: &opinion_verb {language_code: nl, part_of_speech: verb, agreement_tags: {semantic: opinion_verb}}
  opinion_noun_or_adj: &opinion_noun_or_adj {language_code: nl, part_of_speech: [noun, adjective], agreement_tags: {semantic: [opinion_noun, opinion_adj]}}
  opinion_gedeeltelijk_single: &opinion_gedeeltelijk_single {language_code: nl, part_of_speech: adverb, agreement_tags: {semantic: opinion_gedeeltelijk_single}}
  opinion_veiliger_single: &opinion_veiliger_single {language_code: nl, part_of_speech: adjective, agreement_tags: {semantic: opinion_veiliger_single}}
templates:
  - content_key: practice.en-nl.nl.a2.unit25.lesson01.choose.001
    lesson_content_key: nl.a2.unit25.lesson01.wat_vind_je_daarvan
    type: multiple_choice
    frame:
      text: "{item}"
      language_code: nl
      direction: ltr
      text_blocks:
        - {text: "Choose the English meaning.", language_code: en, direction: ltr}
    slots: {item: *opinion_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is a word from this unit about giving opinions.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a2.unit25.lesson01.listen.002
    lesson_content_key: nl.a2.unit25.lesson01.wat_vind_je_daarvan
    type: listen_select
    frame: {text: "{item}", language_code: nl, direction: ltr}
    slots: {item: *opinion_noun}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "{item} is the word you heard.", language_code: en, direction: ltr}
  - content_key: practice.en-nl.nl.a2.unit25.lesson01.match.003
    lesson_content_key: nl.a2.unit25.lesson01.wat_vind_je_daarvan
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth} · {seventh} · {eighth} · {ninth}", language_code: nl, direction: ltr}
    slots: {first: *opinion_noun, second: *opinion_noun, third: *opinion_noun, fourth: *opinion_noun, fifth: *opinion_noun, sixth: *opinion_noun, seventh: *opinion_noun, eighth: *opinion_noun, ninth: *opinion_noun}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth, ninth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth, seventh, eighth, ninth]}
    feedback_frame: {text: "Match each word with its English meaning.", language_code: en, direction: ltr}
