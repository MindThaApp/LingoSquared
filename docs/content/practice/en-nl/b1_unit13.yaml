schema_version: '1.0'
pack_key: practice.en-nl.b1.unit13
source_language: en
target_language: nl
unit_content_key: nl.b1.unit13.volgorde_van_gebeurtenissen
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: "Fresh-context review 2026-11-27 (en-nl B1 units 12-19 pass): dumped every slot's unit-scope (19 lexemes, 6 lessons) and B1 course-scope pool (57 MC/translation, 67 matching) and read every gloss against the realization; all frames are bare '{item}' or matching_pairs, so defect 1.14 self-reference has no literal frame text to hit (checked by hand, clean) and listen_select cannot leak a frame word. b1_unit_review is kept here because it carries this unit's lesson06 lexeme volgorde. Capacity: 19 templates, ALL 18/19 (95%), recognition 15/19, structured 18/19, production 15/19, 6/6 lessons in every tier, no dead template, MC pool 15 distinct glosses. 0 fixes. NATIVE FLAGS / ROUTE: (a) Voordat and voordat are a case-duplicate pair with the same gloss in the matching pool (lesson01 and lesson04 lexemes); a backfill citation fold would clear it; (b) at course scope the unit05 lexeme vroeg (gloss 'asked (past tense)') is pulled in through the mijn_dag_lezen tag, but this unit's reading uses vroeg = early - the item is still true, but the tag belongs to the other sense; (c) at course scope Mooi='nice; good' and goed='good' can meet in one MC. DEFERRED (systemic): bare-word translation shows the gloss without its '(with ik)' note, so prompts such as 'wait' or 'have' accept only the sampled form (wacht, hebt). Earlier notes: Authored against docs/content/PRACTICE_PACK_RECIPE.md as part of the en-nl B1 fill (units 12-19). Every slot unions this unit's own lesson tags so the multiple_choice and matching_pairs floors are met from the unit's own lexemes; translation and multiple_choice use slot_gloss only, with no fixed-sentence frames. Needs the standard fresh-context review before import."
