schema_version: '1.0'
pack_key: practice.en-nl.a2.unit76
source_language: en
target_language: nl
unit_content_key: nl.a2.unit76.drukke_week
review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-11, alongside the sibling a2_unit74/75/77.yaml packs -- see a2_unit74.yaml''s own review notes
    for the shared background. This file covers unit76 (drukke week: a weekly schedule, sequencing with eerst/daarna/ten slotte,
    weekday-vs- weekend contrast, and a full agenda).

    scripts/backfill_lexemes_en_nl.py already had broad recognition-only tags for this unit (weekly_schedule_vocab: 5 nouns
    -- rooster/ cursus/volgorde/agenda/verschil; sequence_connector: 3 connectors -- eerst/daarna/slotte). This pass adds
    6 new single-member *_single tags (drukkeweek_rooster_single/_daarna_single/_slotte_single/ _verschil_single/_agenda_single/_volgorde_single)
    anchoring each lesson''s hero full sentence for word_order/translation/ fill_in_blank via render_frame/slot_text -- single-member
    by construction. sequence_connector is deliberately used bare-word only (multiple_choice/listen_select) and never in a
    render_frame template: its real course-wide pool has case duplicates (''Eerst''/''eerst'', ''Daarna''/''daarna'') and
    ''slotte'' alone (without ''Ten'') isn''t grammatical standalone Dutch, so no safe generative multi-slot chain frame was
    attempted -- the single-member drukkeweek_daarna_single/_slotte_single tags sidestep this entirely by anchoring each connector
    inside its own already- disambiguating fixed frame (''Eerst werk ik, ___ ga ik sporten.'' / ''Ten ___ kook ik iets voor
    het avondeten.'') instead.

    Also reuses the pre-existing cross-unit ''weekday''/''weekday_pure'' tags (introduced by earlier A1 routines content,
    re-established within THIS A2 course by unit76 lesson01''s maandag/woensdag phrase and lesson05''s reading, per AUTHORING_GUIDE.md
    #18 -- verified the real A2-scoped pool has 5 members: dinsdag/donderdag/maandag/ vrijdag/woensdag, well above the multiple_choice/listen_select
    floor and comfortable for a 5-slot matching_pairs, via a standalone iter_specs()-replicating check, not just the pooled
    A1+A2 count).

    14 templates across all 6 lessons: multiple_choice x2, listen_select x3, matching_pairs x2 (5-pair weekly_schedule_vocab
    pool in lesson02, 5-pair weekday_pure pool in lesson05 -- exactly matches the real pool size, no margin, but the pool
    was independently re-verified, not estimated), word_order x2, fill_in_blank x1, translation x2. The one fill_in_blank
    slot (slotte_single) has exactly 1 course-wide candidate by construction -- re-verified by re-running scripts/_fill_in_blank_ambiguity_check.py
    after adding this file''s PACKS entry, 0 flagged. Needs the standard fresh-context review before import. Same blocking
    dependency as every other en-nl pack: backfill_lexemes_en_nl.py has not actually been run against a real database yet
    (only --dry-run, which succeeds).


    REAUTH 2026-07-24: the ''weekday''/''weekday_pure'' re-use above was
    measured at A2 COURSE scope (5 members: dinsdag/donderdag/maandag/
    vrijdag/woensdag), but generate_checkpoint() scopes candidates to
    unit76''s OWN lessons only, and within unit76 itself only ONE lexeme
    (donderdag, lesson05) carries either tag -- confirmed DEAD (matching_pairs
    needs 6, unit-scoped pool has 1) and separately lesson01.listen.002''s
    ''weekday'' slot had only 1 unit-scoped value (<3 floor) for the same
    reason: maandag/woensdag are lesson01''s own dialogue words but were
    FIRST introduced as lexemes in an earlier A1 unit, so unit76 never
    re-registers them. Fixed both by re-anchoring to tags unit76 genuinely
    owns: lesson01.listen.002 now uses weekly_schedule_vocab (*id001, same
    5-member pool already proven live for lesson01.choose.001, well over the
    3-option floor). lesson05.match.001 now uses a new weekly_schedule_reading
    preset (*id008, repurposed from the old weekday_pure anchor) built from
    lesson05''s own 10-member reading vocabulary (druk/woensdagavond/
    taalcursus/donderdag/sport/kookt/familie/leest/boek, excluding the bare
    preposition ''In''), widened from 5 to 6 pairs to also clear the 6-pair
    matching_pairs floor.

    Also fixed two below-floor lesson02 matching_pairs (match.002 and its
    volume_match.002 duplicate), which declared only 5 slots against a
    5-member weekly_schedule_vocab-only pool. Rather than reuse
    sequence_connector (its unit-scoped pool has real case-duplicates within
    this very unit -- ''Eerst''/''eerst'' and ''daarna''/''Daarna'' both carry it,
    lesson02 vs lesson06 -- which this file''s own notes above already flagged
    as a reason to avoid it in generative frames), widened via a new
    weekly_schedule_wide preset unioning weekly_schedule_vocab with
    lesson02''s own sequencing_activities tag, part_of_speech [noun, verb]
    only (excludes Eerst/daarna/Ten/slotte/iets, which are particles/adverbs/
    pronouns and were the source of the case-duplicate and unanswerable-pair
    risk). That pool is 9 distinct unit-scoped tokens (rooster/cursus/
    volgorde/verschil/agenda/ga/sporten/kook/avondeten) with 9 distinct,
    non-confusable glosses -- comfortably clears 6. Both lesson02
    matching_pairs templates widened from 5 to 6 pairs using this preset.

    tag_schema updated: removed the no-longer-used weekday/weekday_pure
    entries, added sequencing_activities and weekly_schedule_reading.
    Verified 0 DEAD, 0 below-floor via scripts/_practice_unit_scope_check.py
    after the fix.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): all 21 templates checked against unit- and
    course-scoped pools. 2 defects fixed: (1) the weekly_schedule_vocab pool held both rooster (schedule) and
    agenda (the schedule; planner), so in lesson01.choose.001, lesson01.listen.002, lesson03.listen.001,
    lesson06.listen.001 and volume_listen.002 a distractor was also a correct answer, and lesson02 matching_pairs
    could show two interchangeable rights -- the *id001 preset and the volume_listen.002 slot now union
    weekly_schedule_days + drukkeweek_volgorde_single + drukkeweek_verschil_single
    (rooster/cursus/volgorde/verschil at unit scope), and the *id012 matching preset unions weekly_schedule_days +
    drukkeweek_verschil_single + sequencing_activities (9 unit-scoped, 6 still clear); weekly_schedule_days added
    to tag_schema; (2) lesson04.translate.002 and volume_translate.002 render My schedule is completely full this
    week. with the single answer Mijn agenda zit deze week helemaal vol., while rooster is also taught as schedule
    and is ... vol is also correct -- instruction now names agenda and zit ... vol. Native flag:
    lesson06.translate.002 accepts only ... is altijd hetzelfde; ... is altijd dezelfde (de volgorde) may also be
    acceptable.'
