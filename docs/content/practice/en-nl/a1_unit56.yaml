schema_version: '1.0'
pack_key: practice.en-nl.a1.unit56
source_language: en
target_language: nl
unit_content_key: nl.a1.unit56.bioscoop
review:
  status: reviewed
  fresh_context: 'true'
  required_next_reviewer: native_speaker_review
  notes: >-
    Review 2026-10-24 (en-nl practice pass, session 10): 14 fixes -- feedback_frame texts that named
    "this unit" or claimed topic membership (false for the level-scope pool) replaced with true generic
    feedback; fixed-sentence feedback now gives the full Dutch sentence with English. Native flags:
    bare-verb glosses carrying '(with ik)' style hints, 'kaart' gloss (map vs card), 'zwemmen =
    swimming', 'dicht = close' (see report).

    THIN UNIT -- flagging explicitly. Vocabulary unit (cinema). lesson01 (ik_wil_een_film_kijken) and
    lesson02 (welke_film_wilt_u_zien) produce ZERO backfilled lexemes (confirmed via the official §0
    capacity dump); per DO-NOT #8 no template is anchored there. Of the remaining 4 lessons,
    bioscoop_vocab pools only 5 distinct non-proper content tokens unit-wide (voorstelling, programma,
    popcorn, kindervoorstelling, museum) -- BELOW the matching_pairs 6-pair floor, so NO matching_pairs
    template is authored here (per DO-NOT #5, never ship <6 pairs; padding with untaught vocabulary is
    explicitly forbidden by §0/§9 step 3 of this recipe). structured tier is instead carried entirely by
    word_order + fill_in_blank, both anchored to bioscoop_popcorn_single (popcorn, exactly 1 course-wide
    candidate, verified against backfill_lexemes_en_nl) using the realization's own sentence 'Ik wil
    popcorn kopen.' -- two different exercise types over the same anchor sentence, which is a deliberate
    compromise to still clear the '≥3 structured templates' floor on a 5-token unit; distinct-item
    volume in the structured tier will be low (documented in the §9 capacity numbers). lesson04
    (bij_de_bioscoop) introduces only the proper noun Iris, so only MC/translation are anchored there
    (no listen_select, to avoid an all-types-thin lesson looking padded). Recommend the coordinator
    route this unit's backfill for a richer lexeme set if unit56 checkpoints prove noticeably repetitive
    in practice. Capacity/coverage measured with the official §9 script; see report.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): checked all 14 templates against
    unit- and course-scoped pools, glosses vs the realization, frame grammar/self-reference, floors,
    booleans and jargon. FIXED lesson05.fill.005: 'Ik wil {item} kopen.' accepted any buyable noun
    (koffie, kaartjes...) but graded only popcorn; frame now 'In de bioscoop kost {item} drie euro
    vijftig.', tied to the lesson05 programme reading (Popcorn - drie euro vijftig); bioscoop taught in
    unit55. DEFERRED (lexeme gloss, backfill lane):
    voorstelling/programma/popcorn/kindervoorstelling/museum glosses carry 'the' while tokens are bare,
    so typing 'de voorstelling' in bare-word translations is graded wrong. No native-judgment flags.
