review:
  status: reviewed
  fresh_context: 'true'
  notes: 'Authored 2026-07-22 against docs/content/PRACTICE_PACK_RECIPE.md, as part of the en-nl B1 unit01-11
    practice-pack wave that unblocks these units'' checkpoints (the units already had lexemes from scripts/backfill_lexemes_en_nl.py
    but no pack at all, so generate_checkpoint() returned checkpoint_unavailable). 19 templates across
    6 lesson(s) with lexemes: listen_select x1, matching_pairs x3, multiple_choice x4, translation x7,
    word_order x4. Every slot is satisfiable from THIS unit''s own lexemes, because generate_checkpoint()
    calls _material() with only this unit''s lesson ids; slots use the unit''s own per-lesson semantic
    tags (unioned where a single lesson tag could not reach the >=3-option multiple_choice floor or the
    6-token matching_pairs floor), narrowed by part_of_speech to content words so no exercise ever shows
    ''the'' or ''and'' as its answer. Measured with the recipe''s capacity/coverage model against the
    real backfill data: 28 of 36 unit lexemes hostable (78%), recognition 78% / structured 78% / production
    64%, and all three tiers reach 6/6 of the lessons that have lexemes. Distinct-target capacity: recognition
    39, production 24, structured effectively unbounded (matching_pairs combinatorics). 11 of 19 templates
    carry >=5 variants. REVIEWER: ''regel'' (lesson06) is glossed ''arrange (with ik, part of regelen)''
    by the backfill although the unit teaches ''de regel'' = the rule; it is the only lesson06 lexeme,
    so the lesson06 templates cannot avoid it. Every gloss-showing template that could otherwise reach
    unit01''s ''was'' (glossed ''do the dishes'') is restricted by part-of-speech. General double-checks
    for this wave: (a) every word_order/fill_in_blank frame was verified against its slot''s whole-B1-course
    candidate pool, not just the unit pool, so Endless Practice cannot render an ungrammatical sentence;
    (b) no frame''s literal text contains any of its own slot''s candidate values (defect 1.14); (c) listen_select
    frames are bare ''{item}'' so no distractor can be a word the audio itself says (defect 1.22); (d)
    matching_pairs pools were read by hand for interchangeable English glosses. Needs the standard fresh-context
    review before import.

    Fresh-context review 2026-10-10 (content-reviewer.md checklist): all 19 templates checked against their unit- and course-scoped (B1) pools, every pool gloss read against the b1_unit06 realization; word_order and fixed-sentence frames re-read at course scope (lesson03.order.002 also renders ''Ik hoef vanavond niet te sporten.'', grammatical); self-reference, listen_select distractors, matching_pairs confusables, YAML booleans and jargon checked. Fixed: (1) lesson06.translate.002 was DEAD at unit scope (verb + b1_unit_review has 0 unit candidates); slot narrowed to part_of_speech noun, so it now serves regel (backfill gloss is now ''the rule'', the sense this unit teaches). (2) lesson02.choose.001 and lesson02.match.003 unioned obligation_moet with past_regret_had_moeten, which at course scope pools moet (''must; is due'') together with moeten (''must; need to'') - two correct ''must'' answers in one MC / matching set; obligation_moet dropped from both unions (moet and schoonmaken stay served by lesson01.translate.001). 0 other defects.'
