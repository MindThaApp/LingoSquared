schema_version: '1.0'
pack_key: practice.en-nl.c1.unit06
source_language: en
target_language: nl
unit_content_key: nl.c1.unit06.idioom_en_beeldspraak
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md (§8.1 grammar/discourse-unit
    pattern) for the nl C1 unit06 (Idioom en beeldspraak) checkpoint. 20 templates over all
    6 lessons (L01 4, L02 2, L03 4, L04 5, L05 2, L06 3): recognition = multiple_choice x4;
    structured = matching_pairs x3 + word_order x7 + fill_in_blank x2; production = translation
    x4 (3 bare-word + 1 fixed-sentence). No listen_select. Pools use CURATED unit-wide tags
    (supplied via the c1_unit06 tags file, to be merged into NL_C1_EXTRA_TAGS) instead of
    the raw lesson tags. Multiple choice and matching use c1u06_beeld_noun (9 idiom-image
    nouns), c1u06_taal_noun (18 language/text/decision nouns), c1u06_kern_verb (28 verbs) and
    c1u06_kern_mod (16 adjectives/adverbs). Bare-word translation uses separate, narrower
    translation-only tags, so that every gloss there admits exactly one common Dutch answer:
    c1u06_tr_verb (25 verbs; drops houd, which also has the form hou, beslissen, which competes
    with besluiten, and slaat, whose gloss also fits raakt), c1u06_tr_noun (22 nouns; drops chef,
    which competes with baas, beslissing (besluit), kleren (kleding), cijfers (getallen) and
    controle (toezicht)) and c1u06_tr_mod (14 adjectives/adverbs; drops precies, which competes
    with exact, and gewoon (normaal)). Slots also narrow by part_of_speech. Single-member anchors
    (exactly one token each, course scope verified): spijker, deur, knie, bal, pet, handdoek and
    nemen (word_order: the hero idiom of each lesson, frames copied from the realization, plus
    We moeten een beslissing nemen), koffiedik and mand (fill_in_blank, both fixed idioms where
    only one word fits the blank), and nemen again for the fixed-sentence translation, whose
    instruction names beslissing and the verb meaning 'to take' so that besluit, beslissen and
    treffen are ruled out. Measured with the C1 harness at unit scope (.c1.unit06. filter): ALL
    76/104 (73%), recognition 71/104 (68%), structured 49/104 (47%), production 61/104 (59%);
    every tier covers 6/6 lessons; no dead or sub-floor templates. Course scope: every
    word_order / fill_in_blank / fixed-sentence slot has exactly 1 course-scope candidate (the
    anchor), so each frame renders one grammatical sentence. Feedback frames use neutral wording
    that is true for every pool member. Glosses (via the unit's gloss fixes): ga is now "go
    (with ik)" and dacht "thought (past, with ik/hij/zij)", so each pins one form; glosses that
    quoted their own Dutch token (spijker, kop, koffiedik, kijken, mouw, deur, knie, gaten, ter,
    sprake, verbinding, vergelijk, raad, pet, bus, horen) now describe the idiom in English.
    EXCLUDED FROM EVERY GLOSS-SHOWING POOL: (1) MIS-GLOSSED, route to backfill: schrijf carries
    "prescribe; write (with ik)" but the unit teaches only "write"; valt carries "falls; is
    cancelled (with hij/zij, part of uitvallen)" but the unit uses plain vallen. (zie, glossed
    "see (with ik)" while the unit uses it in Zie je wel, is a true gloss and stays in.) (2) Identical cognates whose
    gloss is the Dutch word itself: warm, ring, hand, calque, me, we. (3) plaats ("place"; the
    unit uses it only in 'in plaats van', and plek competes). (4) Near-interchangeable twins
    kept apart: neem ("take", vs nemen "to take"), Engelse ("English (inflected)", vs Engels),
    vast ("firmly; fixed", vs vaste "fixed; set"). Function words (me, we, iedereen, wel, zoals,
    onder, binnen) excluded by part_of_speech. REVIEWER double-checks: (a) the verb pools keep
    inflection families with distinct glosses (slaat/sloeg, kwam/kwamen, gooit/gooien/gooide,
    ga/gaat) as tense/person discriminations; (b) vertaling/vertalingen share the taal_noun
    matching pool as a singular/plural discrimination; (c) backfill oddity: koude, vaste and
    gooide carry an unrelated ordinal_number semantic tag (not used here). Register: informal
    jij/je as in the realization (Je slaat de spijker op de kop); the other frames are first or
    third person, as in the realization. Fresh-context review 2026-10-10: 15 findings (5 blocker, 10 minor), all addressed (fixed, or the affected token excluded from the pool), confirmed by a pool-level scan.
