schema_version: '1.0'
pack_key: practice.en-nl.c1.unit06
source_language: en
target_language: nl
unit_content_key: nl.c1.unit06.idioom_en_beeldspraak
review:
  status: unreviewed
  fresh_context: 'false'
  notes: >-
    Authored 2026-10-10 against docs/content/PRACTICE_PACK_RECIPE.md (§8.1 grammar/discourse-unit
    pattern) for the nl C1 unit06 (Idioom en beeldspraak) checkpoint. 20 templates over all
    6 lessons (L01 4, L02 2, L03 4, L04 5, L05 2, L06 3): recognition = multiple_choice x4;
    structured = matching_pairs x3 + word_order x6 + fill_in_blank x3; production = translation
    x4 (3 bare-word + 1 fixed-sentence). No listen_select. Pools use CURATED unit-wide tags
    (supplied via the c1_unit06 tags file, to be merged into NL_C1_EXTRA_TAGS) instead of
    the raw lesson tags, so that every gloss-showing slot excludes problem tokens exactly:
    c1u06_beeld_noun (10 idiom-image nouns), c1u06_taal_noun (19 language/text/decision nouns),
    c1u06_kern_verb (28 verbs), c1u06_kern_mod (17 adjectives/adverbs); slots also narrow
    by part_of_speech. Single-member anchors (exactly one token each, course scope verified):
    spijker, deur, knie, bal, pet, handdoek (word_order hero idioms, one per lesson, frames
    copied from the realization), koffiedik, nemen, mand (fill_in_blank), nemen again for
    the fixed-sentence calque-avoidance translation (We moeten een beslissing nemen). Measured
    with the C1 harness at unit scope (.c1.unit06. filter): ALL 79/104 (76%), recognition
    74/104 (71%), structured 52/104 (50%), production 74/104 (71%); every tier covers 6/6
    lessons; no dead or sub-floor templates. Course scope: every word_order / fill_in_blank
    / fixed-sentence slot has exactly 1 course-scope candidate (the anchor), so each frame
    renders one grammatical sentence and no literal frame word is a candidate of its own slot
    (checked by hand; the integrity script skips non-a* packs). EXCLUDED FROM EVERY GLOSS-SHOWING
    POOL: (1) MIS-GLOSSED, route to backfill: schrijf carries "prescribe; write (with ik)"
    but the unit teaches only "write" (Zo schrijf je natuurlijk Nederlands); valt carries
    "falls; is cancelled (with hij/zij, part of uitvallen)" but the unit uses plain vallen
    (er valt niemand met een deur in huis). Softer: zie carries "see (with ik)" while the
    unit uses it in Zie je wel. (2) Glosses that quote the Dutch token itself and would give
    the answer away in multiple choice, matching and bare-word translation: spijker, kop,
    koffiedik, kijken, mouw, hand, deur, knie, gaten, ter, sprake, verbinding, vergelijk,
    raad, pet, bus, horen, calque. Several of these are still practised token-exact through
    the word_order / fill_in_blank anchors. (3) Near-interchangeable twins kept apart: neem
    ("take", vs nemen "to take"), Engelse ("English (inflected)", vs Engels), vast ("firmly;
    fixed", vs vaste "fixed; set"). Function words (me, we, iedereen, wel, zoals, onder, binnen)
    excluded by part_of_speech. REVIEWER double-checks: (a) the verb pool keeps inflection
    families with distinct glosses (slaat/sloeg, kwam/kwamen, gooit/gooien/gooide, ga/gaat)
    as tense/person discriminations in multiple choice and bare-word translation; (b) dacht
    "thought" in bare-word translation could tempt the noun gedachte; (c) vertaling/vertalingen
    share the taal_noun matching pool as a singular/plural discrimination; (d) backfill oddity:
    koude, vaste and gooide carry an unrelated ordinal_number semantic tag (not used here).
    Register: informal jij/je as in the realization (Je slaat de spijker op de kop); the other
    frames are first or third person, as in the realization.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - c1u06_beeld_noun
    - c1u06_taal_noun
    - c1u06_kern_verb
    - c1u06_kern_mod
    - c1u06_spijker_single
    - c1u06_deur_single
    - c1u06_knie_single
    - c1u06_bal_single
    - c1u06_pet_single
    - c1u06_handdoek_single
    - c1u06_koffiedik_single
    - c1u06_nemen_single
    - c1u06_mand_single
