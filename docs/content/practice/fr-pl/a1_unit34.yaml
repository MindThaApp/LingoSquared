        - w_paczce
        - w_dotrzeć
        - w_dotrze
        - w_czasownikiem
        - w_dokonanym
        - w_oznacza
        - w_przyszłość
        - w_dostawy
        - w_dni
        - w_pracownik
        - w_kupuje
        - w_poczcie
        - w_pisze
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur la lettre et le colis.'
    language_code: fr
    direction: ltr
