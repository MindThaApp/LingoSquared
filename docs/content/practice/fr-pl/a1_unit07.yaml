templates:
- content_key: practice.fr-pl.pl.a1.unit07.lesson01.choose.001
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Avec le verbe kosztować, le polonais utilise des adverbes : kosztuje tanio (n''est pas cher) et kosztuje drogo (est cher).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson01.listen.002
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cebula est féminin parce qu'il se termine par -a ; banan, pomidor, ogórek et ziemniak sont masculins.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson01.order.003
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: word_order
  frame:
    text: Ile kosztuje {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Ile kosztuje demande le prix d''une seule chose : le nom reste donc à sa forme de base du singulier.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson01.fill.004
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: fill_in_blank
  frame:
    text: Banany {item} tanio. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Le verbe s''accorde avec le nombre : kosztuje pour une seule chose, kosztują pour plusieurs.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson01.translate.005
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: Une banane n'est pas chère. (utilise le verbe « coûter »)
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Banan kosztuje {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Le polonais dit qu'une banane coûte « bon marché » (adverbe) plutôt que d'employer un adjectif à part.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson01.translate.006
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kosztować est la forme du dictionnaire ; dans les phrases, il devient kosztuje ou kosztują.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson02.choose.001
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pół signifie « demi » et se place avant kilo : pół kilo veut dire un demi-kilo.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson02.listen.002
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poproszę est une demande polie, utilisée pour commander ou acheter quelque chose.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson02.match.003
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Après kilo et pół kilo, le nom prend une terminaison de pluriel en -ów : banan devient bananów et pomidor devient pomidorów.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson02.order.004
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: word_order
  frame:
    text: Poproszę kilo {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Poproszę kilo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Après une quantité comme kilo, le nom se met au génitif pluriel, qui se termine par -ów pour ces mots.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson02.fill.005
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: fill_in_blank
  frame:
    text: Poproszę pół {item} bananów. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pół kilo signifie un demi-kilo ; kilo lui-même ne change pas ici.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson02.translate.006
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: translation
  frame:
    text: Je voudrais un kilo de tomates.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Poproszę kilo {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Pomidor devient pomidorów après kilo, car le nom suit une quantité.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson02.translate.007
  lesson_content_key: pl.a1.unit07.lesson02.kilogram_prosze
  type: translation
  frame:
