    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Les noms au pluriel comme pomidory demandent un adjectif au pluriel : « frais » devient donc świeże.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson03.fill.004
