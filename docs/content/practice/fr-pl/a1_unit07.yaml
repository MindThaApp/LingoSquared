  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mandarynka et pomarańcza sont féminins, tandis que grejpfrut est masculin.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson03.choose.001
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Świeże est la forme du pluriel de « frais » : elle convient donc à pomidory et banany.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson03.match.002
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id011
    second: *id011
    third: *id011
    fourth: *id011
    fifth: *id011
    sixth: *id011
  slot_relations:
