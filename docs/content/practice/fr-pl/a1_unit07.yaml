    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Pomidory est le pluriel de pomidor, c'est pourquoi l'adjectif est świeże.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit07.lesson03.fill.003
  lesson_content_key: pl.a1.unit07.lesson03.na_targu
