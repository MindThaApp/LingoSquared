templates:
- content_key: practice.fr-pl.pl.a1.unit01.lesson01.choose.001
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le polonais a deux façons de dire « vous/tu » : ty avec les amis et la famille, pan (à un homme) ou pani (à une femme) avec les inconnus et pour marquer le respect.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson01.fill.002
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: fill_in_blank
  frame:
    text: Jak się {item} ma? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Avec pan ou pani, le verbe est ma, comme si on disait « comment va monsieur/madame ? » ; avec ty, il devient masz : Jak się masz ?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson01.translate.003
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Pan et pani ne sont pas interchangeables : pan s’adresse à un homme et pani à une femme, tandis que ty est réservé aux personnes que tu connais bien.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson01.order.004
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: word_order
  frame:
    text: Jak się {item} ma?
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item} ma?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Jak się ma ? demande comment va quelqu’un ; pan ou pani se place au milieu, et le verbe reste ma.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson01.translate.005
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: Comment vas-tu ? (à un ami, familier)
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Avec un ami, la question se termine par masz ; la forme de politesse utilise ma avec pan ou pani.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson02.listen.001
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dzień dobry est la salutation de toute la journée jusqu’au soir, dobry wieczór s’emploie le soir, et dobranoc se dit seulement quand on se quitte pour la nuit.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson02.match.002
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cześć est le mot familier pour dire à la fois bonjour et au revoir ; il va donc avec ty, pas avec pan ou pani.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson02.order.003
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Do {item}!
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Do {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Do widzenia est l’au revoir standard ; do zobaczenia est le « à bientôt » plus amical.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson02.fill.004
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: fill_in_blank
  frame:
    text: Dobry {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dobry wieczór s’emploie le soir ; pendant la journée, on dit dzień dobry.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson02.translate.005
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cześć sert aussi bien pour bonjour que pour au revoir, mais seulement avec des personnes que tu tutoies (ty).
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson02.translate.006
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: Bonne journée !
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Miłego {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Miłego dnia est un souhait : le mot pour « jour » change donc de terminaison et devient dnia.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson03.choose.001
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En polonais, on omet généralement le pronom, car la terminaison du verbe indique la personne : jestem signifie « je suis », jesteś signifie « tu es ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson03.listen.002
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jestem z + pays indique d’où tu viens, et mieszkam w + ville indique où tu habites.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson03.translate.003
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Les terminaisons du verbe indiquent la personne : -m pour « je » (jestem, mieszkam) et -sz ou -ś pour « tu » (masz, jesteś).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson03.order.004
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: word_order
  frame:
    text: Jestem z {item}, ale mieszkam w Warszawie.
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem z {item}, ale mieszkam w Warszawie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Après z (« de, depuis »), le nom du pays prend une autre terminaison : Kanady.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson03.fill.005
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: fill_in_blank
  frame:
    text: Czy pan {item} po polsku? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Une question de politesse à propos d’un homme utilise la forme verbale de la 3e personne : Czy pan mówi po polsku ?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson03.translate.006
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: D’où viens-tu ? (à un ami, familier)
    language_code: fr
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Skąd {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Skąd signifie « d’où » ; avec un ami, le verbe est jesteś, tandis que la forme de politesse est Skąd pan jest ?
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit01.lesson03.translate.007
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: Enchanté(e) !
    language_code: fr
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo mi {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bardzo mi miło signifie littéralement « très agréable pour moi » et c’est la réponse habituelle quand on fait la connaissance de quelqu’un.
    language_code: fr
    direction: ltr
