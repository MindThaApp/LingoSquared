  type: word_order
  frame:
    text: Kasia ma {item} włosy niż Tomek.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_dłuższe
  answer_derivation:
    kind: render_frame
    frame:
      text: Kasia ma {item} włosy niż Tomek.
      language_code: pl
      direction: ltr
