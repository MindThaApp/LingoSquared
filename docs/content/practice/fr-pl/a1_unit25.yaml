    - w_siwe
    - w_stopień
    - w_wiek
    - w_wtedy
    - w_wygląda
    - w_wyglądają
    - w_wyglądasz
    - w_wysoka
    - w_wysoki
    - w_wyższa
    - w_włosy
    - w_zielony
