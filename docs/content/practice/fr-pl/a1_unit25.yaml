    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} est l’un des mots de cette unité, tiré de la leçon sur la description des cheveux.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit25.lesson03.translate.001
  lesson_content_key: pl.a1.unit25.lesson03.oczy_i_jak_ktos
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} est l’un des mots de cette unité, tiré de la leçon sur les yeux et la façon de demander à quoi ressemble une personne.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit25.lesson04.match.001
  lesson_content_key: pl.a1.unit25.lesson04.ewa_opisuje_nine
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Associe chaque mot polonais à sa signification en français ; les mots viennent des leçons de cette unité.
    language_code: fr
    direction: ltr
