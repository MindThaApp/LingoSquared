    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur le rangement.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit32.lesson02.listen.001
