    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit32.lesson02.order.002
  lesson_content_key: pl.a1.unit32.lesson02.balagan_i_odkurzanie
  type: word_order
  frame:
    text: Po imprezie jest dużo {item}.
    language_code: pl
    direction: ltr
