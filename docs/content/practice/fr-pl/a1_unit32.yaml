    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_bałaganu
  answer_derivation:
    kind: render_frame
    frame:
      text: Po imprezie jest dużo {item}.
      language_code: pl
      direction: ltr
