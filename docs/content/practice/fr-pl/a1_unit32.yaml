    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur le désordre et l’aspirateur.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit32.lesson03.translate.001
  lesson_content_key: pl.a1.unit32.lesson03.mozesz_pomoc
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon sur la manière de demander de l’aide.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit32.lesson04.match.001
  lesson_content_key: pl.a1.unit32.lesson04.ewa_pomaga_markowi_w
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Associe chaque mot polonais à sa signification en français ; les mots viennent des leçons de cette unité.
    language_code: fr
    direction: ltr
