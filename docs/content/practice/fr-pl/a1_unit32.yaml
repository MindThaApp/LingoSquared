        - w_sprząta
        - w_salon
        - w_bałagan
        - w_bałaganu
        - w_odkurzać
        - w_odkurzam
        - w_sprzątamy
        - w_odkurza
        - w_pomagać
        - w_zmywaniem
        - w_pomogę
        - w_naczynia
        - w_zmywać
        - w_zmęczony
        - w_wczorajszej
        - w_zająć
