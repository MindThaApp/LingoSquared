templates:
- content_key: practice.fr-pl.pl.a1.unit02.lesson01.choose.001
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le polonais n’a aucune logique qui relie les nombres de un à dix : chaque mot s’apprend séparément.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson01.listen.002
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En polonais, sz se prononce comme ch en français (chat) et cz correspond à un tch (comme dans tchèque) : sześć et cztery commencent donc par ces sons.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson01.translate.003
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le ć final de pięć, sześć, dziewięć et dziesięć est un son doux, proche d’un « tch » adouci ; l’accent compte dans l’orthographe.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson01.match.004
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Pięć, sześć, dziewięć et dziesięć se terminent par la lettre ć, alors que siedem et osiem non : il faut donc bien soigner chaque orthographe.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson01.order.005
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: word_order
  frame:
    text: Mam {item} lat.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} lat.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mam + nombre + lat sert à dire son âge, comme dans Mam trzydzieści lat.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson02.listen.001
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ile demande « combien », et kosztuje est le verbe qui l’accompagne pour demander un prix.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson02.choose.002
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Les nombres jedenaście, dwanaście et piętnaście se terminent en -naście, ce qui marque les nombres de 11 à 19.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson02.translate.003
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ile signifie « combien » aussi bien pour les prix que pour les choses que l’on compte.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson02.order.004
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: To kosztuje {item} złotych.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje {item} złotych.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Les nombres comme pięć, dwanaście ou trzydzieści sont suivis de złotych, alors que dwa, trzy et cztery prennent złote.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson02.fill.005
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: To kosztuje dwadzieścia {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Złotych est la forme utilisée après pięć, dwadzieścia, pięćdziesiąt et les nombres semblables ; dwa, trzy et cztery prennent złote.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson02.translate.006
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: Combien cela coûte-t-il ?
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile to kosztuje ? est la question habituelle pour demander un prix ; to signifie « ceci » ou « cela ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson03.choose.001
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pana est le « votre » formel pour un homme (pana numer), alors que twój est le « ton » informel (twój numer).
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson03.translate.002
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Numer telefonu signifie littéralement « le numéro du téléphone » ; le second mot est une forme modifiée du mot pour « téléphone ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson03.order.003
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: Jaki jest {item} numer telefonu?
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest {item} numer telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój est le « ton » informel et pana le « votre » formel pour un homme ; les deux conviennent devant numer telefonu.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson03.fill.004
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: Ile masz {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lat suit des nombres comme pięć, dwadzieścia ou trzydzieści ; lata suit dwa, trzy, cztery et les nombres composés qui se terminent ainsi, comme dans trzydzieści dwa lata.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson03.translate.005
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: J’ai trente-deux ans.
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam trzydzieści dwa {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Comme le nombre se termine par dwa, le mot pour « ans » est lata et non lat.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit02.lesson03.translate.006
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Quel est ton numéro de téléphone ? (informel ; utilise jest)
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest twój {item} telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój est le « ton » informel ; la version formelle pour un homme est Jaki jest pana numer telefonu ?
    language_code: fr
    direction: ltr
