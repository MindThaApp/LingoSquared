  answer_derivation:
    kind: render_frame
    frame:
      text: Apteka jest obok {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: La terminaison du génitif de ces noms masculins est -u, comme dans banku, hotelu et parku.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit08.lesson02.order.004
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: word_order
  frame:
    text: Park jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Park jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Blisko, daleko et niedaleko sont des adverbes : ils ne changent pas, quel que soit le nom.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit08.lesson02.fill.005
