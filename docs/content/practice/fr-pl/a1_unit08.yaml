  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: translation
  frame:
    text: La pharmacie est à côté de la banque.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Apteka jest obok {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Après obok, le lieu prend une terminaison du génitif : bank devient donc banku.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit08.lesson02.translate.007
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: translation
  frame:
