  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'En polonais, les noms de lieux s’emploient sans article : bank peut donc signifier « une banque » ou « la banque ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit08.lesson01.listen.002
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
