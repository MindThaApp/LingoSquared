    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Hotel, bank et park sont tous trois masculins.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit08.lesson01.order.004
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: word_order
  frame:
    text: Gdzie jest {item}?
    language_code: pl
