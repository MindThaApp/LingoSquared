    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: To jest présente une chose, et le nom qui suit reste à sa forme de base.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit08.lesson01.translate.006
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: translation
  frame:
    text: Où est la pharmacie ?
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Gdzie jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gdzie jest suivi d’un lieu est la question idéale pour trouver quelque chose.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit08.lesson01.translate.007
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
  type: translation
