  answer_derivation:
    kind: render_frame
    frame:
      text: Gdzie jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Gdzie jest sert à demander où se trouve quelque chose, et le lieu reste à sa forme de base.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit08.lesson01.fill.005
  lesson_content_key: pl.a1.unit08.lesson01.miejsca_w_miescie
