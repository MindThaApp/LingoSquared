    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Poczta, apteka et restauracja se terminent en -a et sont féminins ; bank, hotel et park sont masculins.
    language_code: fr
    direction: ltr
