      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Poczta est le mot courant et court pour désigner la poste.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit08.lesson02.choose.001
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Obok et naprzeciwko sont suivis du génitif, c’est pourquoi bank devient banku.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit08.lesson02.listen.002
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Les noms masculins comme bank, hotel et park prennent -u après obok, naprzeciwko et blisko.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit08.lesson02.order.003
  lesson_content_key: pl.a1.unit08.lesson02.blisko_czy_daleko
  type: word_order
  frame:
    text: Apteka jest obok {item}.
    language_code: pl
