templates:
- content_key: practice.fr-pl.pl.a1.unit11.lesson01.choose.001
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chcę est la forme « je » de chcieć et chcesz est la forme « tu », employée avec les amis et la famille.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson01.listen.002
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'La terminaison -sz marque le « tu » informel : chcesz, możesz, masz (jesteś est l’exception, avec la terminaison -ś).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson01.match.003
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Chcieć et móc suivent le même schéma : -ę pour « je » et -sz pour « tu ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson01.order.004
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: word_order
  frame:
    text: Dziś {item} iść do kina.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziś {item} iść do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Après chcę ou mogę, le second verbe reste à l’infinitif.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson01.fill.005
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: fill_in_blank
  frame:
    text: Czy {item} iść razem do kina? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Une question posée à un ami utilise la forme « tu » chcesz, avec czy en début de question.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson01.translate.006
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: translation
  frame:
    text: Aujourd’hui, je veux aller au cinéma.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Dziś {item} iść do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Chcę est suivi d’un infinitif : iść reste donc à la forme du dictionnaire.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson01.translate.007
  lesson_content_key: pl.a1.unit11.lesson01.propozycja
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Móc signifie « pouvoir » et s’emploie de la même façon que chcieć.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson02.choose.001
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Chętnie et niestety sont des adverbes : ils ne changent donc jamais de forme.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson02.listen.002
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Sobotę est la forme employée après w : les noms de jours féminins passent de -a à -ę, donc sobota devient sobotę.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson02.match.003
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Przyjść signifie « venir » et s’emploie à l’infinitif après mogę ou możesz.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson02.order.004
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: word_order
  frame:
    text: Czy możesz {item} w piątek?
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy możesz {item} w piątek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Czy możesz suivi d’un infinitif demande poliment à un ami s’il peut faire quelque chose.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson02.order.005
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: word_order
  frame:
    text: Czy możesz przyjść w {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy możesz przyjść w {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Les jours masculins comme piątek restent inchangés après w, mais les jours féminins comme sobota deviennent sobotę.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson02.fill.006
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: fill_in_blank
  frame:
    text: Niestety, nie {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nie mogę est la façon polie de dire que tu n’es pas disponible.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson02.fill.007
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: fill_in_blank
  frame:
    text: Tak, bardzo {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bardzo chętnie est une façon chaleureuse d’accepter une invitation.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson02.translate.008
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: translation
  frame:
    text: Malheureusement, je ne peux pas.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Niestety, nie {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Nie se place devant le verbe pour le mettre à la forme négative.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit11.lesson02.translate.009
  lesson_content_key: pl.a1.unit11.lesson02.tak_czy_nie
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Przyjść est la forme du dictionnaire de « venir », employée ici après mogę.
    language_code: fr
    direction: ltr
