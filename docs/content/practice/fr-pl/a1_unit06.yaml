    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Les terminaisons verbales indiquent la personne : -ę pour je (lubię) et -i pour il ou elle (lubi).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson02.order.003
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: word_order
  frame:
    text: Lubię {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Après lubię, ce que l''on aime prend la forme du complément : zupa devient zupę, alors que sok, chleb et ser ne changent pas.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson02.fill.004
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
