    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Masło et mleko se terminent en -o, terminaison typique du neutre, alors que chleb et ser se terminent par une consonne et sont masculins.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson02.choose.001
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lubić est la forme du dictionnaire ; lubię se dit pour parler de soi, et lubi pour parler de quelqu'un d'autre.
    language_code: fr
    direction: ltr
