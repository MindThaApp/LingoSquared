  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Już peut signifier « déjà » ou, comme dans Już podaję, « tout de suite ».
    language_code: fr
    direction: ltr
