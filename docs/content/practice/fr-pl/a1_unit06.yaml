    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Proszę o suivi de la forme du complément est la façon polie de demander quelque chose.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson01.translate.005
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: translation
  frame:
    text: De l'eau, s'il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę o {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Le nom après proszę o est à la forme du complément : woda devient wodę.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson01.translate.006
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: translation
  frame:
