    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Lubi est la forme de il ou elle : le pronom on peut donc l''accompagner.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson02.translate.005
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: translation
  frame:
    text: J'aime la soupe.
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Lubię {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Les noms féminins en -a prennent -ę quand ils sont compléments d''objet : zupa devient zupę.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson02.translate.006
  lesson_content_key: pl.a1.unit06.lesson02.wiecej_jedzenia
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'La paire lubię et lubi montre le principe : une terminaison différente pour chaque personne.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson03.listen.001
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Polecać fonctionne comme lubić : polecam signifie « je recommande » et poleca signifie « il/elle recommande » ou, avec pan ou pani, « vous recommandez ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson03.match.002
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Co pan poleca? utilise la forme poleca (il/elle), car pan et pani se construisent avec un verbe à la troisième personne.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson03.order.003
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: word_order
  frame:
    text: Polecam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Polecam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Polecam se construit aussi avec la forme du complément d'objet du nom, comme lubię.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson03.fill.004
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: fill_in_blank
  frame:
    text: Już {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Le serveur parle à la première personne, podaję, parce que c'est lui qui sert.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson03.translate.005
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: translation
  frame:
    text: Que recommandez-vous ? (à un homme, forme de politesse)
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Co pan {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Avec pan ou pani, le verbe est poleca, la même forme que pour « il » ou « elle ».
    language_code: fr
    direction: ltr
