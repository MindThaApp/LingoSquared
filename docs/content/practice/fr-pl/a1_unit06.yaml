templates:
- content_key: practice.fr-pl.pl.a1.unit06.lesson01.choose.001
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Chaque nom polonais a un genre : chleb et ser sont masculins, kawa, herbata et woda sont féminins, et masło et mleko sont neutres.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson01.listen.002
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Le polonais n''a pas d''articles (un, le, la) : chleb peut donc signifier du pain ou le pain.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson01.order.003
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: word_order
  frame:
    text: Proszę o {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Proszę o {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Après proszę o, les noms féminins en -a passent à -ę (kawa, kawę), alors que les noms masculins et neutres comme chleb et mleko ne changent pas.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit06.lesson01.fill.004
  lesson_content_key: pl.a1.unit06.lesson01.jedzenie_i_picie
  type: fill_in_blank
