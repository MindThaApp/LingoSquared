  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_dosyć
    - w_emocji
    - w_idziemy
    - w_informacja
    - w_informacji
    - w_kurtki
    - w_plecak
    - w_portfel
    - w_szuka
    - w_zajrzyj
    - w_zgubiony
    - w_zgubił
    - w_znaleziony
    - w_został
templates:
