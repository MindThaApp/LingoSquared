  lesson_content_key: pl.a1.unit40.lesson01.zgubione_i_znalezione
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_zgubiony
        - w_zgubił
        - w_znaleziony
        - w_został
        - w_plecak
        - w_informacji
        - w_portfel
        - w_informacja
        - w_idziemy
        - w_szuka
        - w_zajrzyj
        - w_kurtki
        - w_dosyć
        - w_emocji
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, tirés de la leçon sur les objets perdus et retrouvés.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit40.lesson02.listen.001
