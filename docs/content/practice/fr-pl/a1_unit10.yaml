    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Wracam do {item} wieczorem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: La terminaison de génitif -u revient dans domu, comme dans banku et parku.
    language_code: fr
    direction: ltr
