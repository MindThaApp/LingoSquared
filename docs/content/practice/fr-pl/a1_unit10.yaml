  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Obiad est le repas principal de la journée, pris vers midi : ce peut donc être le déjeuner ou le dîner.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit10.lesson02.match.003
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: matching_pairs
