templates:
- content_key: practice.fr-pl.pl.a1.unit10.lesson01.choose.001
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chaque verbe a une forme du dictionnaire (wstawać, jeść, pić) et une forme en « je » (wstaję, jem, piję).
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit10.lesson01.listen.002
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La forme en « je » se termine en général par -ę ou -m, comme dans wstaję, piję et jem.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit10.lesson01.match.003
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'L''infinitif et la forme en « je » sont deux mots différents : apprends les deux, jeść et jem.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit10.lesson01.order.004
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: word_order
  frame:
    text: Rano {item} o siódmej.
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Rano {item} o siódmej.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rano vient en premier pour dire quand, et o siódmej donne l'heure exacte.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit10.lesson01.fill.005
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: fill_in_blank
  frame:
