      language_code: pl
      direction: ltr
  feedback_frame:
    text: Après do, le nom se met au génitif, et dom devient domu comme bank devient banku.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit10.lesson02.fill.005
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
