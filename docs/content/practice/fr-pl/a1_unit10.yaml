  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Piję et wstaję se terminent tous deux en -ę, la terminaison typique de « je » pour ces verbes.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit10.lesson02.choose.001
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
