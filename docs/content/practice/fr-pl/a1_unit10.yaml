    slot: item
  feedback_frame:
    text: Pracować signifie travailler et wracać signifie rentrer ; leurs formes en « je » sont pracuję et wracam.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit10.lesson02.listen.002
  lesson_content_key: pl.a1.unit10.lesson02.praca_i_dom
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
