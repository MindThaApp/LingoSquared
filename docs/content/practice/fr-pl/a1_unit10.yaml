    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Jem est une forme en « je » irrégulière de jeść, à apprendre par cœur.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit10.lesson01.translate.006
  lesson_content_key: pl.a1.unit10.lesson01.rano
  type: translation
  frame:
    text: Je prends le petit-déjeuner.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jem {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Śniadanie est neutre : sa forme de complément est donc identique à sa forme de base.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit10.lesson01.translate.007
  lesson_content_key: pl.a1.unit10.lesson01.rano
