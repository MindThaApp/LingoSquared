  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_zatłoczony
        - w_stragan
        - w_warzywa
        - w_jabłka
        - w_sprzedawca
        - w_sprzedawcę
        - w_jabłek
        - w_każdą
        - w_podać
        - w_owocami
        - w_piekarni
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} est l’un des mots de cette unité, tiré de la leçon « On va au marché ? ».'
    language_code: fr
    direction: ltr
