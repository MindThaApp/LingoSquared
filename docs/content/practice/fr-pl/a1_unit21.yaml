    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
    hint:
      language_code: pl
      part_of_speech: adjective
      agreement_tags:
        semantic: w_pierwszą
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Salut Marek, comment te sens-tu avant ton premier service ? Przed pierwszą zmianą (avant ton premier service) reprend la structure przed + instrumental vue à la leçon 3. Czujesz się est la forme en ty.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit21.lesson03.translate.004
  lesson_content_key: pl.a1.unit21.lesson03.zdenerwowany_przed_czyms
  type: translation
  frame:
    text: Ne t’inquiète pas.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_martw
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} się.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ne t’inquiète pas. Nie martw się (littéralement « ne t’inquiète pas toi-même ») est la formule courante pour rassurer ; się est le pronom réfléchi.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit21.lesson04.order.002
  lesson_content_key: pl.a1.unit21.lesson04.pytanie_o_uczucia
  type: word_order
  frame:
    text: Jak {item} się Marek?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_czuje
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak {item} się Marek?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Comment se sent Marek ? Czuć się (se sentir, réfléchi) est la manière habituelle de demander ou de décrire un état émotionnel : Jak czuje się Marek ?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit21.lesson05.order.002
  lesson_content_key: pl.a1.unit21.lesson05.czytanie_wiadomosci_o_uczuciach
  type: word_order
  frame:
    text: Tak, ja też tak {item}.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_myślę
  answer_derivation:
    kind: render_frame
    frame:
      text: Tak, ja też tak {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Oui, je le pense aussi. Ja też tak myślę (littéralement « moi aussi je pense ainsi ») est la façon naturelle d’être d’accord ; ja est ajouté ici pour insister.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit21.lesson06.order.002
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: word_order
  frame:
    text: Szczerze {item}, jestem trochę zdenerwowany.
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mówiąc
  answer_derivation:
    kind: render_frame
    frame:
      text: Szczerze {item}, jestem trochę zdenerwowany.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Franchement, je suis un peu nerveux. Szczerze mówiąc (franchement, littéralement « en parlant sincèrement ») adoucit l’aveu.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit21.lesson06.fill.003
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: fill_in_blank
  frame:
    text: Nie martw się, dobrze sobie {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poradzisz
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ne t’inquiète pas, tu t’en sortiras bien ! Dobrze sobie poradzisz (littéralement « tu t’en sortiras bien ») est une expression figée d’encouragement ; poradzisz est le futur en ty de poradzić sobie.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit21.lesson06.translate.004
  lesson_content_key: pl.a1.unit21.lesson06.ewa_uspokaja_marka
  type: translation
  frame:
    text: Merci, ça m’aide vraiment.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_naprawdę
  answer_derivation:
    kind: render_frame
    frame:
      text: Dzięki, to {item} pomaga.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Merci, ça m’aide vraiment. Pomaga est la forme on/ona/ono de pomagać (aider) ; dzięki est un « merci » familier.
    language_code: fr
    direction: ltr
