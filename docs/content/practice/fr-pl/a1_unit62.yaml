        - w_księgarnia
        - w_książka
        - w_powieść
        - w_szukam
        - w_powieści
        - w_tytuł
        - w_tytułem
        - w_autor
        - w_znany
        - w_książeczka
        - w_książki
        - w_popularna
        - w_książeczki
        - w_zakładka
        - w_zakładką
        - w_interesująca
        - w_sklepu
        - w_zoologicznego
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} est l’un des mots de cette unité, tiré de la leçon « On va à la librairie ? ».'
    language_code: fr
    direction: ltr
