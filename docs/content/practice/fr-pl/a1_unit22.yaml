    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Avec qui est-ce que je parle ? Z kim rozmawiam ? (littéralement « avec qui je parle ? ») est la formule habituelle pour un appelant inconnu ; kim est l’instrumental après z.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Peux-tu répéter ? Możesz (peux-tu, de móc) + l’infinitif powtórzyć (répéter) + to (cela).
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ne parle pas si vite, s’il te plaît. Nie mów est l’impératif négatif (ne parle pas) ; tak szybko signifie « si vite ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: Je ne t’entends pas bien.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Je ne t’entends pas bien. Nie słyszę cię dobrze exprime un problème d’audition ; cię est l’accusatif de ty et dobrze signifie « bien ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Comment s’est passé ton premier service ? Jak ci poszła ... ? (littéralement « comment ... t’est-il allé ? ») sert à interroger sur quelque chose de déjà passé. Ci est le datif de ty, et poszła s’accorde avec le nom féminin zmiana.
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Son premier service s’est très bien passé. Jego (son) ne change jamais et se place avant le nom : jego pierwsza zmiana ; le nom féminin n’a pas d’influence.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: Ça s’est très bien passé, mieux que je ne le pensais.
    language_code: fr
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ça s’est très bien passé, mieux que je ne le pensais. Poszło est le passé de iść avec la terminaison -o (« ça » ; ici « se dérouler ») ; myślałem est le passé de myśleć (penser), à la forme d’un locuteur masculin.
    language_code: fr
    direction: ltr
