- content_key: practice.ko-hi.hi.a1.unit14.lesson01.choose.001
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
