  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: लंबा와 लंबी는 한 형용사의 남성형과 여성형이에요. बड़ा와 बड़ी처럼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit14.lesson01.listen.002
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: listen_select
