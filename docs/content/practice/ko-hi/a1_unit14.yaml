    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '형용사는 꾸미는 사람에 맞춰 달라져요: मेरा भाई लंबा है, मेरी बहन लंबी है.'
    language_code: ko
    direction: ltr
