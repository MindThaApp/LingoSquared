templates:
- content_key: practice.ko-hi.hi.a1.unit12.lesson01.choose.001
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '과거에는 है 대신 था와 थी를 쓰고, 주어에 맞춰 달라져요: दिन अच्छा था, फ़िल्म अच्छी थी.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson01.order.002
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: कल का दिन {item} था?
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: कल का दिन {item} था?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा는 남성 명사 दिन에 맞춘 형태예요. 여성 명사에는 कैसी를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson01.order.003
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: word_order
  frame:
    text: चाय की दुकान बहुत {item} थी।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: दुकान이 여성 명사라서 अच्छी도 여성형이고, थी도 이에 맞춰요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson01.fill.004
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: fill_in_blank
  frame:
    text: फ़िल्म अच्छी {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थी는 be동사의 여성형 과거형으로, 여성 명사 फ़िल्म에 맞춘 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson01.translate.005
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: 영화가 좋았어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फ़िल्म अच्छी {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म은 여성 명사라서 형용사와 be동사 과거형 모두 여성형을 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson01.translate.006
  lesson_content_key: hi.a1.unit12.lesson01.tha_thi
  type: translation
  frame:
    text: 찻집이 아주 좋았어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चाय की दुकान बहुत {item} थी।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की는 चाय를 여성 명사 दुकान과 이어 주고, अच्छी와 थी도 이에 맞춰요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson02.choose.001
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'जाना와 मिलना의 과거형은 남성이면 -आ, 여성이면 -ई로 끝나요: गया 또는 गई, मिला 또는 मिली.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson02.order.002
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: word_order
  frame:
    text: मैं वहाँ प्रिया से {item}।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं वहाँ प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '여기서 से는 ''~와/를''의 뜻이에요: प्रिया से मिला는 ''Priya를 만났다''이고, 어미는 말하는 사람에 따라 달라져요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson02.fill.003
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं कल बाज़ार {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 어미 -ई는 말하는 사람이 여성임을 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson02.fill.004
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: fill_in_blank
  frame:
    text: मैं वहाँ अर्जुन से {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: मिलना의 과거형은 말하는 사람에 맞춰요. 그래서 여성은 मिली라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson02.translate.005
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: 저는 집에 갔어요. (여성이 하는 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं घर {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 여성은 गई를 쓰고, 남성은 गया를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson02.translate.006
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: 저는 Priya를 만났어요. (여성이 하는 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं प्रिया से {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 만난 사람 뒤의 से는 '~와/를'의 뜻이고, 동사 어미는 말하는 사람에 따라 달라져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson02.translate.007
  lesson_content_key: hi.a1.unit12.lesson02.gaya_gai_mila_mili
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 동사의 과거형은 행위를 하는 사람에 맞춰요. 남성은 मिला, 여성은 मिली라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson03.choose.001
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'मिले는 हम, तुम, वे와 함께 써요: हम मिले, 우리는 만났어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson03.fill.002
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: fill_in_blank
  frame:
    text: वहाँ हम {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: हम와 함께 쓰는 과거형은 -ए로 끝나며, 남성 복수형과 같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit12.lesson03.translate.003
  lesson_content_key: hi.a1.unit12.lesson03.arjun_priya_kal
  type: translation
  frame:
    text: 우리는 만났어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: हम {item}।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: हम에는 모임에 누가 있든 복수형 मिले를 써요.
    language_code: ko
    direction: ltr
