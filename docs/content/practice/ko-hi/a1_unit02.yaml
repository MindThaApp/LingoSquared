templates:
- content_key: practice.ko-hi.hi.a1.unit02.lesson01.choose.001
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 힌디어 숫자 단어는 불규칙해서 하나씩 외워야 해요. 예를 들어 छह는 6이고 सात는 7이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit02.lesson01.listen.002
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 힌디어의 11부터 99까지 숫자 단어는 불규칙해서 पंद्रह(15)나 पचास(50)처럼 하나하나 따로 외워야 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit02.lesson02.match.001
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 힌디어 명사 नंबर, फ़ोन, कीमत은 관사 없이 쓰여요. '가격'인지 '그 가격'인지는 문맥이 정해 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit02.lesson02.fill.002
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: इसकी {item} पचास रुपये है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इसकी는 '이것의'라는 뜻이고 여성 명사 कीमत과 성이 일치해요. 그래서 -ा가 아니라 -ी로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit02.lesson02.order.003
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: इसकी कीमत {item} रुपये है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी कीमत {item} रुपये है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '힌디어에서는 수가 세는 대상 앞에 오고, 동사 है는 문장 끝에 와요: इसकी कीमत पचास रुपये है.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit02.lesson02.translate.004
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: 이것의 가격은 얼마예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी {item} क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 힌디어 의문문은 평서문과 어순이 같아요. इसकी कीमत पचास रुपये है는 इसकी कीमत क्या है?에 대한 답이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit02.lesson03.choose.001
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 소유 표현은 소유되는 대상과 성이 일치해요. आपका फ़ोन नंबर에서는 남성형 आपका를 쓰고, आपकी उम्र에서는 여성형 आपकी를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit02.lesson03.order.002
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: मेरी उम्र {item} साल है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {item} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 나이는 है와 함께 साल(해, 살) 앞에 수를 붙여 말해요. 직역하면 '제 나이는 서른 살이에요'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit02.lesson03.order.003
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: आपका {item} नंबर क्या है?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: आपका는 높임말 '당신의'예요. नंबर가 남성 명사라서 여기서는 남성형이에요. तुम에는 तुम्हारा를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit02.lesson03.fill.004
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: मेरी उम्र तीस {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: साल(해)은 수 뒤에서 복수형으로 바뀌지 않아요. तीस साल은 '서른 살'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit02.lesson03.translate.005
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: 제 나이는 {n}살이에요.
    language_code: ko
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {n} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: उम्र는 여성 명사라서 소유 표현은 मेरा가 아니라 मेरी를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit02.lesson03.translate.006
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: 전화번호가 어떻게 되세요? (격식)
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 힌디어에서는 전화번호를 한 자리씩 읽어요. 예를 들어 छह दो आठ तीन पाँच처럼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit02.lesson03.translate.007
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 1보다 큰 수 뒤에서는 돈을 복수형 रुपये로 세요. 단수형은 रुपया예요.
    language_code: ko
    direction: ltr
