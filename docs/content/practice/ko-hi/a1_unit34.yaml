schema_version: '1.0'
pack_key: practice.ko-hi.a1.unit34
source_language: ko
target_language: hi
unit_content_key: hi.a1.unit34.transport
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-hi by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_अनजान
    - w_आदमी
    - w_कहकर
    - w_कार
    - w_क्रिया
    - w_चलाता
    - w_चलाना
    - w_ज़्यादातर
    - w_जाऊँगी
    - w_ट्रांसपोर्ट
    - w_पैदल
    - w_बताते
    - w_बोलते
    - w_लूँ
    - w_साधन
    - w_सिटी
    - w_सेंटर
templates:
- content_key: practice.ko-hi.hi.a1.unit34.lesson01.choose.001
  lesson_content_key: hi.a1.unit34.lesson01.tren_saikil_kar_aur
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: &id001
      language_code: hi
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_कार
        - w_पैदल
        - w_चलाता
        - w_बताते
        - w_क्रिया
        - w_अनजान
        - w_आदमी
        - w_कहकर
        - w_बोलते
        - w_सिटी
        - w_सेंटर
        - w_ट्रांसपोर्ट
        - w_लूँ
        - w_ज़्यादातर
        - w_साधन
        - w_चलाना
        - w_जाऊँगी
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '기차, 자전거, 자동차, 걷기를 다룬 수업에 나오는 이 단원의 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit34.lesson02.listen.001
  lesson_content_key: hi.a1.unit34.lesson02.har_koee_alag_tarah
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '사람마다 다르게 이동한다는 수업에 나오는 이 단원의 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit34.lesson03.translate.001
  lesson_content_key: hi.a1.unit34.lesson03.tikat_khareedna
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 표 사기 수업에 나온 이 단원의 단어 중 하나예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit34.lesson04.match.001
  lesson_content_key: hi.a1.unit34.lesson04.neha_arjun_se_poochhtee
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 힌디어 단어를 한국어 뜻과 연결하세요. 단어는 이 단元의 수업에서 나왔어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit34.lesson05.choose.001
  lesson_content_key: hi.a1.unit34.lesson05.kaun_kaise_safar_karta
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '누가 어떻게 이동할까요? 수업에 나오는 이 단원의 단어: {item}'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit34.lesson06.translate.001
  lesson_content_key: hi.a1.unit34.lesson06.chalo_sath_men_saikil
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이번 단원의 단어예요. ''같이 자전거 탈까요?'' 수업에 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit34.lesson03.order.002
  lesson_content_key: hi.a1.unit34.lesson03.tikat_khareedna
  type: word_order
  frame:
    text: सिटी {item} के लिए मैं कौन सा ट्रांसपोर्ट लूँ?
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: hi
      part_of_speech: noun
      agreement_tags:
        semantic: w_सेंटर
  answer_derivation:
    kind: render_frame
    frame:
      text: सिटी {item} के लिए मैं कौन सा ट्रांसपोर्ट लूँ?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 시내 중심가에 가려면 어떤 교통수단을 타야 해요? सेंटर는 '중심'이라는 뜻이에요.
    language_code: ko
    direction: ltr
