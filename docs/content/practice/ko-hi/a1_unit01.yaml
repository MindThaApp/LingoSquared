templates:
- content_key: practice.ko-hi.hi.a1.unit01.lesson01.choose.001
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 힌디어에는 '당신'을 뜻하는 말이 두 가지 있습니다. आप는 격식 있고 공손한 표현이고, तुम은 친구나 또래, 손아랫사람에게 쓰는 친근한 표현입니다.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson01.fill.002
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: be동사에 해당하는 동사는 주어에 따라 달라집니다. मैं에는 हूँ, तुम에는 हो, आप에는 हैं이 붙습니다.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson01.order.003
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: word_order
  frame:
    text: आप {item} हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 의문사는 질문받는 사람에 맞춰 달라집니다. 남성에게는 कैसे, 여성에게는 कैसी를 쓰고, आप에는 항상 हैं이 붙습니다.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson01.translate.004
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: 어떻게 지내? (친근한 표현, 남성에게)
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'तुम에는 동사 हो를 씁니다. 여성에게 물을 때는 कैसे가 कैसी로 바뀝니다: तुम कैसी हो?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson01.translate.005
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: 안녕하세요? 잘 지내세요? (격식, 여성에게)
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 격식을 갖춘 आप는 한 사람에게 쓰더라도 복수처럼 보이는 हैं을 쓰고, कैसी는 '어떻게'의 여성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson02.listen.001
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अलविदा는 작별 인사예요. 일상 대화에서는 नमस्ते가 안녕하세요와 안녕히 가세요 둘 다로 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson02.order.002
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: word_order
  frame:
    text: आपका {item} अच्छा रहे।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} अच्छा रहे।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रहे는 '~하기를' 하는 바람을 나타내고(좋은 상태로 계속되길), आपका는 격식체 आप에 쓰는 말이에요. तुम에는 तुम्हारा를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson02.match.003
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 힌디어에는 관사에 해당하는 말이 없어요. 그래서 नाम은 문장에 따라 '이름', '어떤 이름', '그 이름'으로 해석될 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson03.choose.001
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 힌디어 의문문은 평서문의 어순을 그대로 유지해요. 의문사 कहाँ이 답이 들어갈 자리에 와요(आप कहाँ से हैं? 그리고 मैं भारत से हूँ).
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson03.order.002
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मेरा नाम {name} है।
    language_code: hi
    direction: ltr
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 힌디어는 동사가 맨 끝에 와요. 그래서 मेरा नाम ... है는 말 그대로 '제 이름은 ... 이에요'가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson03.order.003
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मैं {place} से हूँ।
    language_code: hi
    direction: ltr
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से는 장소 뒤에 오고 '~에서'라는 뜻이에요. 한국어 조사처럼 뒤에 붙는 후치사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson03.fill.004
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: fill_in_blank
  frame:
    text: आपसे मिलकर {item} हुई। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 격식을 갖춘 '만나서 반갑습니다'예요. 직역하면 '당신을 만나서 기쁨이 생겼습니다'이고, 격식 없는 표현은 तुमसे मिलकर अच्छा लगा예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson03.translate.005
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: 저는 {name}라고 해요.
    language_code: ko
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नाम은 남성 명사라서 남자든 여자든 모두 मेरा नाम이라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson03.translate.006
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: 저는 {place}에서 왔어요.
    language_code: ko
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 여성도 मैं भारत से हूँ라고 말해요. 동사 हूँ은 화자의 성별에 따라 바뀌지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson03.translate.007
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: 어디에서 왔어?
    language_code: ko
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} से हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '같은 질문을 격식 있게 하려면 आप와 हैं을 써요: आप कहाँ से हैं?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit01.lesson03.translate.008
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 힌디어 명사는 남성이거나 여성이에요. दिन, नाम, योग은 남성이고 खुशी는 여성이에요.
    language_code: ko
    direction: ltr
