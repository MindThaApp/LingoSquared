      language_code: hi
      part_of_speech: adjective
      agreement_tags:
        semantic: w_खुश
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} क्यों हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '왜 기뻐요? क्यों("왜")는 중심 단어 앞에 와요: तुम खुश क्यों हो?. तुम은 친근한 "너"예요.'
    language_code: ko
    direction: ltr
