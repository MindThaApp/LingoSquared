    frame:
      text: वह {item} क्यों महसूस कर रहा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '그는 왜 긴장하고 있어요? क्यों는 동사구 바로 앞에 와요: वह नर्वस क्यों महसूस कर रहा है?'
    language_code: ko
    direction: ltr
