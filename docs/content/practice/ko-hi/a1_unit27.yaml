  frame:
    text: अर्जुन कैसा {item} कर रहा है?
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: hi
      part_of_speech: noun
      agreement_tags:
        semantic: w_महसूस
  answer_derivation:
    kind: render_frame
    frame:
      text: अर्जुन कैसा {item} कर रहा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 아르준은 기분이 어때요? कैसा महसूस कर रहा है는 "기분이 어때요?"라는 뜻이에요. कैसा는 사람에 따라 달라져서 여성이면 कैसी가 돼요.
    language_code: ko
    direction: ltr
