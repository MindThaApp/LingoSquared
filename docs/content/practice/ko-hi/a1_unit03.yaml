templates:
- content_key: practice.ko-hi.hi.a1.unit03.lesson01.choose.001
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 힌디어 요일은 -वार(요일)로 끝나서 सोमवार, मंगलवार, रविवार는 끝부분이 모두 같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson02.listen.001
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 달 이름은 영어에서 온 말이라 जनवरी, मार्च, दिसंबर는 알아보기 쉬워요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson03.choose.001
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अगली는 '다음'이라는 뜻이고 여성 명사와 어울려요. अगली क्लास는 '다음 수업'이고, 남성 명사에는 अगला를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson03.match.002
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: आज(오늘)에는 따로 붙이는 말이 없지만, 요일에는 को(सोमवार को, 월요일에), 달에는 में(जनवरी में, 1월에)을 붙여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson01.order.002
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 요일이 문장의 주어라서 आज सोमवार है는 직역하면 '오늘 월요일이다'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson01.order.003
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: word_order
  frame:
    text: योग क्लास {item} को है।
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {item} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '요일 뒤의 को는 ''~에''라는 뜻이에요: सोमवार को는 ''월요일에''예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson02.fill.002
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: fill_in_blank
  frame:
    text: आज कितनी {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कितनी는 여성 명사 तारीख़와 어울려서 -ी로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson02.order.003
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: word_order
  frame:
    text: मेरा जन्मदिन {item} में है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {item} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '달 뒤의 में은 ''~에''라는 뜻이에요: जनवरी में은 ''1월에''예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson03.fill.003
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: अगली क्लास {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'कब는 ''언제''라는 뜻이고 답이 들어갈 자리에 와요: अगली क्लास मंगलवार को है.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson03.fill.004
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: fill_in_blank
  frame:
    text: कोई {item} नहीं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कोई बात नहीं은 감사나 사과에 대한 일상적인 대답으로, '괜찮아요'와 비슷해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson01.translate.004
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: 오늘은 무슨 요일이에요?
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} सा दिन है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कौन सा는 '어느 것'이라는 뜻이에요. आज कौन सा दिन है?에서는 무슨 요일인지 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson02.translate.004
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: 제 생일은 {month}에 있어요.
    language_code: ko
    direction: ltr
    slot_rendering:
      month: english_gloss
  slots:
    month: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा जन्मदिन {month} में है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 달에는 में(~에)을 쓰고, 요일에는 को(~에)를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson01.translate.005
  lesson_content_key: hi.a1.unit03.lesson01.days_of_week
  type: translation
  frame:
    text: 요가 수업은 {day}에 있어요.
    language_code: ko
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id001
  answer_derivation:
    kind: render_frame
    frame:
      text: योग क्लास {day} को है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 요일은 남성 명사이고, को는 무언가가 일어나는 요일을 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson03.translate.005
  lesson_content_key: hi.a1.unit03.lesson03.next_class_and_birthday
  type: translation
  frame:
    text: 생일이 언제야? (반말)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा जन्मदिन {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 높임말 आप를 쓰면 आपका जन्मदिन कब है?라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit03.lesson02.translate.005
  lesson_content_key: hi.a1.unit03.lesson02.months_and_dates
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 데바나가리 문자에는 대문자가 없어서 요일과 달 이름도 대문자 없이 써요.
    language_code: ko
    direction: ltr
