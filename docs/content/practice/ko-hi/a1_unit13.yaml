templates:
- content_key: practice.ko-hi.hi.a1.unit13.lesson01.choose.001
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: पसंद है는 '마음에 들다'라는 뜻이에요. मुझे चाय पसंद है는 '저는 차를 좋아해요'인데, 주어 자리에 मैं이 아니라 मुझे를 써서 만들어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson01.listen.002
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'है는 하나일 때, हैं은 둘 이상일 때 써요: किताब पसंद है, किताबें पसंद हैं.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson01.order.003
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 힌디어에는 관사에 해당하는 말이 없고, 좋아하는 대상은 मुझे와 पसंद 사이에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson01.order.004
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '여기서는 किताबें가 복수라서 동사가 हैं이에요: पसंद है가 पसंद हैं이 돼요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson01.fill.005
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पसंद는 힌디어에서 동사가 아니라 है와 함께 쓰는 말이에요. 그래서 문장은 '나에게 차가 마음에 든다'처럼 만들어져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson01.fill.006
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे {item} पसंद हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 좋아하는 대상이 복수이면 पसंद 뒤에 हैं이 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson01.translate.007
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: 저는 음악을 좋아해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 좋아하는 사람은 मुझे 자리에 들어가고, 음악은 마음에 드는 대상이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson01.translate.008
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: 저는 책을 좋아해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: किताबें는 복수라서 동사는 है가 아니라 हैं이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson01.translate.009
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 단수 किताब과 복수 किताबें는 어미 -ें만 달라요. 이 여성 명사에서 -ें이 복수를 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson02.choose.001
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'खेल는 ''스포츠''와 ''게임''을 모두 뜻하고, ज़्यादा는 ''더''라는 뜻이에요: मुझे चाय ज़्यादा पसंद है는 ''저는 차를 더 좋아해요''예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson02.order.002
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: word_order
  frame:
    text: मुझे यह {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: यह(이)는 가리키는 명사 바로 앞에 와요. यह खेल처럼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson02.fill.003
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} पसंद है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ज़्यादा는 पसंद 앞에 와서 둘 중 어느 쪽을 더 좋아하는지 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson02.translate.004
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: 저는 이 스포츠를 좋아해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: है는 좋아하는 사람이 아니라 좋아하는 대상(스포츠 하나)에 맞춰요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson02.translate.005
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: 저는 차를 더 좋아해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे चाय {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 힌디어는 직역하면 '나에게 차가 더 마음에 든다'이고, ज़्यादा가 पसंद 바로 앞에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit13.lesson02.translate.006
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खेल(스포츠, 게임)는 남성 명사이고, ज़्यादा(더)는 형태가 변하지 않아요.
    language_code: ko
    direction: ltr
