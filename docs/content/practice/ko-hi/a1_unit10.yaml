templates:
- content_key: practice.ko-hi.hi.a1.unit10.lesson01.choose.001
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '습관을 나타내는 동사는 남자는 -ता, 여자는 -ती로 끝나요: मैं उठता हूँ, मैं उठती हूँ.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson01.listen.002
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: वह는 '그 남자'도 '그 여자'도 될 수 있고, 어느 쪽인지는 동사 어미로 알 수 있어요. वे는 '그들'이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson01.order.003
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ सात बजे {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ सात बजे {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 동사 어미는 말하는 사람의 성별을 따라요. 남자는 उठता, 여자는 उठती이고, हूँ은 मैं와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson01.order.004
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ काम पर {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: काम पर जाना(일하러 가다)에는 पर가 필요하고, 동사 어미는 여전히 말하는 사람의 성별을 따라요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson01.fill.005
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: fill_in_blank
  frame:
    text: मैं रोज़ नाश्ता {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 힌디어의 많은 동작은 '명사 + करना'로 표현해요. नाश्ता करना는 '아침을 먹다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson01.translate.006
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: 저는 매일 일하러 가요. (여자가 하는 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 여자는 -ती 어미를 써서 जाती हूँ이라고 하고, 남자는 जाता हूँ이라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson01.translate.007
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: 저는 매일 아침을 먹어요. (남자가 하는 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ नाश्ता {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 한국어는 '아침을 먹다'라고 하지만, 힌디어는 नाश्ता करना, 직역하면 '아침을 하다'라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson02.choose.001
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'तुम과 함께 쓰면 동사는 남자는 -ते, 여자는 -ती로 끝나고 हो가 따라와요: तुम उठते हो, तुम उठती हो.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson02.match.002
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 습관을 나타내는 동사마다 남성형 -ता와 여성형 -ती가 있고, 말하는 사람에 따라 형태가 정해져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson02.order.003
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: word_order
  frame:
    text: तुम कब {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: तुम과 함께 남자에게 물을 때는 동사가 -ते हो가 되고, 어미는 듣는 사람을 따라요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson02.fill.004
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: fill_in_blank
  frame:
    text: मैं रात को ग्यारह बजे {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 여기서는 말하는 사람이 여자이므로 동사에 -ती가 붙어요. 어미는 자는 사람을 따라요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson02.translate.005
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: 너는 언제 자? (친근한 말투, 남자에게 묻는 경우)
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: तुम과 함께 쓸 때 어미는 묻는 사람이 아니라 질문을 받는 사람을 따라요. 남자는 सोते, 여자는 सोती예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson02.translate.006
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: 너는 언제 일어나? (친근한 말투, 여자에게 묻는 경우)
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '여자에게 물을 때는 동사가 -ती로 끝나요: तुम उठती हो.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson03.choose.001
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: तुम कब वापस आते हो?의 आते는 남자에게 물을 때 तुम과 함께 쓰는 -ते 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson03.fill.002
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: fill_in_blank
  frame:
    text: मैं शाम को छह बजे वापस {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: आता는 남성형이므로 말하는 사람이 남자예요. 여자라면 आती라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson03.translate.003
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: 저는 저녁에 돌아와요. (남자가 하는 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं शाम को वापस {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: शाम 뒤의 को는 '저녁에'라는 뜻이고, वापस आना는 '돌아오다'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson03.translate.004
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: 저는 저녁을 먹어요. (여자가 하는 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रात का खाना {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रात का खाना는 직역하면 '밤의 식사'이고 '저녁 식사'를 뜻해요. -ती 어미는 말하는 사람이 여자임을 보여 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit10.lesson03.translate.005
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'वापस는 ''다시 돌아와서''라는 뜻이고 आना 같은 동사와 함께 써요: वापस आता हूँ, 저는 돌아와요.'
    language_code: ko
    direction: ltr
