      direction: ltr
  feedback_frame:
    text: 힌디어는 문자 그대로 '나에게 가는 것이 있다'라고 말해요. 그래서 말하는 사람의 성별에 따라 동사가 바뀌지 않아요.
    language_code: ko
    direction: ltr
