templates:
- content_key: practice.ko-hi.hi.a1.unit15.lesson01.choose.001
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाना는 '가다'의 사전형이고, मुझे ... जाना है는 '저는 가야 해요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit15.lesson01.listen.002
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
