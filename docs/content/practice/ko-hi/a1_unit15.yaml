    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: टिकट, ट्रेन, प्लेटफ़ॉर्म은 일상 힌디어에서 쓰이는 영어 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit15.lesson01.order.003
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: word_order
  frame:
    text: मुझे स्टेशन {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे स्टेशन {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... जाना है는 필요나 의무를 나타내며, चाहिए처럼 말하는 사람의 성별에 따라 바뀌지 않아요.
    language_code: ko
    direction: ltr
