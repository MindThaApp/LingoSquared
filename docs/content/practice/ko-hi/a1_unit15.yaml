  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: word_order
  frame:
    text: मुझे दिल्ली का {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे दिल्ली का {item} चाहिए।
