templates:
- content_key: practice.ko-hi.hi.a1.unit06.lesson01.choose.001
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: खाना는 '음식' 또는 '식사'를 뜻하는 남성 명사예요. चाय와 कॉफ़ी는 여성, पानी와 जूस는 남성이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson01.listen.002
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 힌디어 명사는 음료에도 성이 있어요. पानी와 जूस는 남성, चाय와 कॉफ़ी는 여성이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson01.fill.003
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: fill_in_blank
  frame:
    text: आपको क्या {item}? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: चाहिए는 말하는 사람의 성에 따라 변하지 않고(चाहता, चाहती와 달라요), 뒤에 है가 오지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson01.translate.004
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: 뭐가 필요해? (친근한 말투)
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें क्या {item}?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: आप를 쓰면 같은 질문이 आपको क्या चाहिए?가 돼요. '당신'에 해당하는 말만 바뀌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson01.translate.005
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: 저는 차를 원해요, 감사합니다.
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} चाहिए, शुक्रिया।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए는 직역하면 '나에게 ...이(가) 필요하다'예요. 그래서 원하는 것이 두 단어 사이에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson01.translate.006
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 힌디어에는 관사가 없어서 खाना가 상황에 따라 '음식', '식사', '그 식사' 등을 뜻할 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson02.choose.001
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: रोटी, दाल, सब्ज़ी는 여성 명사이고, चावल(밥)은 남성 명사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson02.match.002
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 힌디어는 단위 명사를 먼저 말하고 '~의'에 해당하는 말을 쓰지 않아요. एक गिलास पानी는 직역하면 '한 잔 물'이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson02.order.003
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: word_order
  frame:
    text: मुझे एक प्लेट {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे एक प्लेट {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 힌디어에서는 '밥 한 접시'처럼 '~의'에 해당하는 말 없이 단위 명사가 음식 앞에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson02.order.004
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: word_order
  frame:
    text: यह {item} बहुत स्वादिष्ट है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बहुत स्वादिष्ट है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: स्वादिष्ट는 अच्छा, अच्छी와 달리 남성·여성 명사에 따라 변하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson02.fill.005
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: fill_in_blank
  frame:
    text: नहीं, {item}, शुक्रिया। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: नहीं, बस는 음식이나 음료를 더 권할 때 정중하게 거절하는 표현으로, '아니요, 충분해요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson02.fill.006
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: fill_in_blank
  frame:
    text: मुझे कॉफ़ी चाहिए, {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कृपया는 '부디, 제발'에 해당하는 정중한 말이며 요청의 끝에 올 수도 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson02.translate.007
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: translation
  frame:
    text: 물 한 잔 주세요.
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे एक {item} पानी चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: गिलास 같은 단위 명사는 '~의'에 해당하는 말 없이 세는 대상 바로 앞에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson02.translate.008
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: translation
  frame:
    text: 이 달은 아주 맛있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बहुत स्वादिष्ट है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: दाल은 여성 명사지만 स्वादिष्ट는 여성·남성 명사에 관계없이 그대로예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson03.choose.001
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: या는 तुम्हें चाय चाहिए या कॉफ़ी?처럼 두 선택지를 잇고, चलो 뒤의 खाते हैं은 권유를 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson03.fill.002
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: fill_in_blank
  frame:
    text: तुम्हें चाय चाहिए {item} कॉफ़ी? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 질문에서 या는 두 가지 중 하나를 고르게 해요. 한국어의 '또는, ~나'와 비슷해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit06.lesson03.translate.003
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: translation
  frame:
    text: 우리 뭐 좀 먹자!
    language_code: ko
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो에 복수형 -ते 동사와 हैं을 함께 쓰면 제안하는 일반적인 표현이 돼요.
    language_code: ko
    direction: ltr
