templates:
- content_key: practice.ko-hi.hi.a1.unit11.lesson01.choose.001
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'चलो에 -ते 동사와 हैं을 붙이면 함께 무언가를 하자는 제안이 돼요: चलो, फ़िल्म देखते हैं!'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson01.listen.002
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'साथ는 ''함께'' 또는 ''~와 같이''라는 뜻이며, 제안에 자주 들어가요: चलो, साथ चाय पीते हैं!'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson01.order.003
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, {item} देखते हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, {item} देखते हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म은 여성 명사지만, 제안형 -ते हैं은 그에 따라 바뀌지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson01.order.004
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, साथ चाय {item} हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, साथ चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 제안형은 -ते 동사에 हैं을 붙인 형태이며 '~하자'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson01.fill.005
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: अच्छा {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: अच्छा विचार है는 제안을 받아들일 때 흔히 쓰는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson01.fill.006
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: चलो, फ़िल्म {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: देखते는 -ते 형태로, हैं과 함께 쓰면 '우리는 봐요'이고 चलो 뒤에서는 '보자'가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson01.translate.007
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: 차 마시자!
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 힌디어에서 '~하자'는 चलो에 동사의 -ते हैं 형태를 더해 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson01.translate.008
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: '좋은 생각이야! (완전한 문장: 좋은 생각이다)'
    language_code: ko
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अच्छा {item} है!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: विचार는 남성 명사라서 형용사가 अच्छा가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson02.choose.001
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: माफ़ करना는 '미안해' 또는 '실례해요'를 뜻하는 친근한 표현으로, तुम으로 부르는 사람에게 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson02.match.002
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 정중하게 거절할 때 쓰는 힌디어 단어로는 '미안해'를 뜻하는 माफ़ करना와 '바쁜'을 뜻하는 व्यस्त가 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson02.fill.003
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: fill_in_blank
  frame:
    text: माफ़ करना, मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: माफ़ करना 뒤에는 바쁘다는 등 자신의 상황을 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson02.translate.004
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: 미안, 나 바빠. (친근한 표현)
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: माफ़ करना, मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: माफ़ करना는 친근하게 양해를 구하는 표현이에요. व्यस्त는 남자든 여자든 형태가 같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson02.translate.005
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: 그럼 우리 언제 만날까?
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तो {item} कब मिलते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'हम은 복수형 -ते हैं을 써요: हम मिलते हैं, 우리는 만나요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson03.choose.001
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'संदेश는 메시지예요. 약속을 잡는 문자 같은 것이죠: प्रिया, चलो शनिवार को फ़िल्म देखते हैं?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson03.order.002
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: word_order
  frame:
    text: प्रिया, चलो शनिवार को {item} देखते हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया, चलो शनिवार को {item} देखते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 이름으로 시작하면 그 사람을 직접 부르는 말이 되고, शनिवार 뒤의 को는 '토요일에'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit11.lesson03.translate.003
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: सुझाव는 상대에게 하는 제안이고, विचार는 아이디어나 생각이에요. अच्छा विचार है!는 '좋은 생각이에요!'라는 뜻이에요.
    language_code: ko
    direction: ltr
