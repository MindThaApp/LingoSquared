  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: &id001
      language_code: hi
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_अपॉइंटमेंट
        - w_उपलब्ध
        - w_रहेगा
        - w_कंप्यूटर
        - w_किसलिए
        - w_धन्यवाद
        - w_पक्का
        - w_कन्फ़र्मेशन
        - w_याद
        - w_दिलाऊँगा
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 예약하기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit47.lesson02.listen.001
  lesson_content_key: hi.a1.unit47.lesson02.ek_samay_upalbdh_hai
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어로, 가능한 시간에 관한 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit47.lesson03.translate.001
  lesson_content_key: hi.a1.unit47.lesson03.apointment_kislie_hai
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어로, 예약이 무엇을 위한 것인지 묻는 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit47.lesson04.match.001
  lesson_content_key: hi.a1.unit47.lesson04.neena_apointment_buk_kartee
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 힌디어 단어를 한국어 뜻과 연결하세요. 단어는 이 단元의 수업에서 나왔어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit47.lesson05.choose.001
  lesson_content_key: hi.a1.unit47.lesson05.kanfarmeshan_parhna
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어로, 확인서 읽기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit47.lesson06.translate.001
  lesson_content_key: hi.a1.unit47.lesson06.arjun_yad_dilata_hai
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '이 유닛의 단어 중 하나: {item} (레슨 "아르준이 기억하도록 도와줘요"에서)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit47.lesson03.order.002
  lesson_content_key: hi.a1.unit47.lesson03.apointment_kislie_hai
  type: word_order
  frame:
    text: अपॉइंटमेंट {item} है?
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: hi
      part_of_speech: adverb
      agreement_tags:
        semantic: w_किसलिए
  answer_derivation:
    kind: render_frame
    frame:
      text: अपॉइंटमेंट {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 약속은 무엇 때문일까요? किसलिए는 '무엇을 위해; 왜'라는 뜻이에요.
    language_code: ko
    direction: ltr
