templates:
- content_key: practice.ko-hi.hi.a1.unit17.lesson01.choose.001
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: शिक्षक는 남성 교사, शिक्षिका는 여성 교사예요. इंजीनियर는 남녀 모두에게 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit17.lesson01.listen.002
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: शिक्षक와 शिक्षिका처럼 여성형이 따로 있는 힌디어 직업 단어가 있고, इंजीनियर 같은 외래어는 그렇지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit17.lesson01.order.003
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: मैं {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 교사를 뜻하는 단어는 말하는 사람의 성별에 따라 달라져요. 남성은 शिक्षक, 여성은 शिक्षिका예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit17.lesson01.order.004
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: प्रिया {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 프리야는 여성이라서 शिक्षिका예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit17.lesson01.fill.005
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
