templates:
- content_key: practice.ko-hi.hi.a1.unit08.lesson01.choose.001
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이 장소 단어들은 모두 남성이라서, 함께 쓰는 동사나 형용사는 -ा 형태를 취해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson01.listen.002
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: यहाँ와 वहाँ는 부사라서 성이나 수에 따라 형태가 바뀌지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson01.order.003
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: word_order
  frame:
    text: मैं {item} में हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 장소 뒤의 में은 '~에(서)'라는 뜻이고, हूँ은 मैं와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson01.order.004
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: word_order
  frame:
    text: बैंक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 동사 है는 보통 장소 단어 뒤, 문장 맨 끝에 와요. बैंक वहाँ है는 말 그대로 '은행 저기 있다'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson01.fill.005
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: fill_in_blank
  frame:
    text: स्कूल {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: यहाँ는 말하는 사람 가까이에 있는 '여기'이고, वहाँ는 말하는 사람에게서 떨어진 '저기'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson01.translate.006
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: translation
  frame:
    text: 은행은 저기에 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 힌디어에는 관사가 없어서 बैंक는 '한 은행'도, '그 은행'도 될 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson01.translate.007
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 힌디어는 स्कूल, बैंक, पार्क, स्टेशन처럼 장소를 나타낼 때 외래어를 많이 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson02.choose.001
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पास, सामने, पीछे는 기준이 되는 장소 뒤에 के를 붙여요: बैंक के पास는 ''은행 근처''예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson02.match.002
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '힌디어 장소 단어는 반대말 짝으로 나와요: यहाँ와 वहाँ, पास와 दूर, सामने와 पीछे.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson02.order.003
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: word_order
  frame:
    text: स्कूल बैंक के {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: स्कूल बैंक के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'के는 기준이 되는 장소를 पास, सामने, पीछे와 이어 줘요. 한국어의 ''~의''와 비슷해요 (예: 학교의 앞).'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson02.fill.004
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: fill_in_blank
  frame:
    text: पार्क स्कूल के {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पीछे와 सामने는 반대말이라서, 같은 두 장소를 어느 쪽에서든 설명할 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson02.fill.005
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: fill_in_blank
  frame:
    text: स्टेशन {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'दूर는 혼자서도 쓸 수 있고(स्टेशन दूर है), 기준 장소와 함께 쓸 때는 के가 아니라 से를 써요: बैंक से दूर.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson02.translate.006
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: translation
  frame:
    text: 학교는 공원 앞에 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: स्कूल पार्क के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 기준 장소 뒤의 के는 그 장소를 सामने(앞에)와 이어 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson02.translate.007
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: translation
  frame:
    text: 은행은 학교 근처에 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक स्कूल के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 여기서 पास는 '근처'라는 뜻이에요. मेरे पास에서는 '나는 가지고 있다'라는 뜻이 되어, 한 단어에 두 가지 쓰임이 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson03.listen.001
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: हाँ, तो ...의 तो는 결론을 나타내고, थोड़ा는 '조금'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson03.order.002
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: word_order
  frame:
    text: यह {item} बैंक के पास है।
    language_code: hi
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बैंक के पास है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: डाकघर는 डाक(우편)과 घर(집)이 합쳐진 복합어로, 말 그대로 '우편 집'이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson03.fill.003
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: fill_in_blank
  frame:
    text: हाँ, {item} दूर है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थोड़ा를 형용사나 부사 앞에 쓰면 '조금'처럼 뜻을 부드럽게 해 줘요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit08.lesson03.translate.004
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: translation
  frame:
    text: 네, 우체국은 은행 근처에 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: हाँ, {item} बैंक के पास है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 기준 장소 बैंक가 먼저 오고, 그다음 के पास, 마지막에 है가 와요.
    language_code: ko
    direction: ltr
