templates:
- content_key: practice.ko-hi.hi.a1.unit04.lesson01.choose.001
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बजे(~시)는 숫자 뒤에 옵니다. 시각을 말할 때는 1시에만 एक बजा है라고 하고, 1시에(at one o'clock)는 여전히 एक बजे라고 합니다.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson02.listen.001
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 힌디어는 하루를 सुबह, दोपहर, शाम, रात로 나누며, 오전/오후를 나타내는 단일 단어는 없습니다.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson03.choose.001
  lesson_content_key: hi.a1.unit04.lesson03.agli_class_ka_samay
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कल은 내일과 어제를 모두 뜻하며, 어느 쪽인지는 동사의 시제로 알 수 있습니다.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson02.match.002
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 시간대를 나타내는 말은 관사 없이 쓰는 여성 또는 남성 명사이며, सुबह, शाम, रात는 모두 여성 명사입니다.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson01.order.002
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: word_order
  frame:
    text: अभी पाँच {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी पाँच {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '시각을 말할 때 1시를 제외한 모든 시는 बजे와 복수 동사를 씁니다: पाँच बजे हैं, 하지만 एक बजा है.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson01.order.003
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: word_order
  frame:
    text: अभी एक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '1시만 단수 बजा와 단수 है를 씁니다: एक बजा है.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson02.order.003
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: word_order
  frame:
    text: क्लास {item} सात बजे है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: क्लास {item} सात बजे है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '하루의 시간대는 시각 바로 앞에 오며, 그 사이에 다른 단어는 들어가지 않습니다: सुबह सात बजे.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson01.fill.004
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: fill_in_blank
  frame:
    text: क्लास {item} बजे है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कितने बजे है?는 어떤 일이 몇 시에 있는지 묻는 일상적인 표현입니다.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson01.fill.005
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: fill_in_blank
  frame:
    text: अभी पाँच {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '"~시예요"는 2시부터 12시까지 बजे हैं를 쓰고, बजे는 सुबह सात बजे처럼 "~시에"라는 뜻도 있습니다.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson03.fill.002
  lesson_content_key: hi.a1.unit04.lesson03.agli_class_ka_samay
  type: fill_in_blank
  frame:
    text: ठीक है, {item} मिलते हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ठीक है, कल मिलते हैं는 직역하면 "좋아요, 내일 만나요"이며, 힌디어에서는 현재 시제가 가까운 미래를 나타내는 경우가 많습니다.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson01.translate.006
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: translation
  frame:
    text: 몇 시예요?
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} बजे हैं?'
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '시각을 말하려면 숫자를 बजे 앞에 놓습니다: अभी पाँच बजे हैं.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson02.translate.004
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: translation
  frame:
    text: 다음 수업은 저녁 5시예요.
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: अगली क्लास {item} पाँच बजे है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अगली는 여성 명사 क्लास에 맞춰 -ा가 아니라 -ी로 끝납니다.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson01.translate.007
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: translation
  frame:
    text: 지금은 한 시예요.
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '1시는 단수 동사를 쓰는 유일한 시각입니다: एक बजा है, 하지만 दो बजे हैं.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit04.lesson02.translate.005
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '힌디어에는 정오를 뜻하는 별도의 단어가 없습니다: दोपहर가 한낮과 오후를 모두 가리킵니다.'
    language_code: ko
    direction: ltr
