schema_version: '1.0'
pack_key: practice.ko-hi.a1.unit28
source_language: ko
target_language: hi
unit_content_key: hi.a1.unit28.communication
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-hi by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_आवाज़
    - w_करूँगा
    - w_ज़रूरी
    - w_जितना
    - w_दोबारा
    - w_बतानी
    - w_बोल
    - w_भेजूँगा
    - w_मतलब
    - w_मैसेज
    - w_सुनकर
    - w_सोचा
templates:
- content_key: practice.ko-hi.hi.a1.unit28.lesson01.choose.001
  lesson_content_key: hi.a1.unit28.lesson01.main_tumhen_fon_karoonga
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: &id001
      language_code: hi
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_करूँगा
        - w_बोल
        - w_दोबारा
        - w_आवाज़
        - w_मैसेज
        - w_भेजूँगा
        - w_ज़रूरी
        - w_बतानी
        - w_जितना
        - w_सोचा
        - w_सुनकर
        - w_मतलब
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''전화할게요'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit28.lesson03.listen.001
  lesson_content_key: hi.a1.unit28.lesson03.kya_tum_yah_dobara
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''다시 말씀해 주시겠어요?'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit28.lesson04.translate.001
  lesson_content_key: hi.a1.unit28.lesson04.maisej_bhejna
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}은(는) 문자 보내기 수업에 나온 이번 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit28.lesson05.match.001
  lesson_content_key: hi.a1.unit28.lesson05.maisej_kee_batcheet_parhna
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 힌디어 단어를 한국어 뜻과 연결하세요. 단어는 이 단元의 수업에서 나왔어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit28.lesson06.choose.001
  lesson_content_key: hi.a1.unit28.lesson06.shift_ke_bad_ek
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''근무 후 전화 통화'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit28.lesson01.translate.002
  lesson_content_key: hi.a1.unit28.lesson01.main_tumhen_fon_karoonga
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. ''전화할게요'' 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit28.lesson03.order.002
  lesson_content_key: hi.a1.unit28.lesson03.kya_tum_yah_dobara
  type: word_order
  frame:
    text: क्या तुम यह {item} कह सकते हो?
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: hi
      part_of_speech: adverb
      agreement_tags:
        semantic: w_दोबारा
  answer_derivation:
    kind: render_frame
    frame:
      text: क्या तुम यह {item} कह सकते हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '다시 한번 말해 줄 수 있어요? सकते हो는 ''할 수 있다''라는 뜻이고 본동사 뒤에 와요: कह सकते हो. 맨 앞의 क्या는 문장을 의문문으로 만들어요.'
    language_code: ko
    direction: ltr
