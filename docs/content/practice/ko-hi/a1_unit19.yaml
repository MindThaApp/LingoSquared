    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: मौसम은 남성이라서 형용사가 -ा로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson02.translate.006
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: 오늘은 날씨가 더워요.
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: गर्म는 꾸며 주는 명사가 무엇이든 형태가 그대로예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson02.translate.007
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: 오늘은 구름이 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 여기서 बादल은 복수로 쓰여서 동사가 हैं이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson02.translate.008
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: 오늘은 날씨가 아주 추워요.
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम बहुत {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहुत는 형용사 앞에 오고, ठंडा는 मौसम에 맞춰 형태가 정해져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson03.choose.001
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बाहर는 '밖'이라는 뜻이고, चलो, बाहर जाते हैं!는 밖에 나가자고 제안하는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson03.fill.002
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: fill_in_blank
  frame:
    text: चलो, {item} जाते हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बाहर는 부사라서 성이나 수에 따라 변하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson03.translate.003
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: translation
  frame:
    text: 밖으로 나가요!
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, {item} जाते हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो에 -ते 동사와 हैं을 붙이면 함께 무언가를 하자고 제안하는 일반적인 표현이에요.
    language_code: ko
    direction: ltr
