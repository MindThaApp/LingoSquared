templates:
- content_key: practice.ko-hi.hi.a1.unit19.lesson01.choose.001
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: मौसम은 남성 명사라서 질문은 आज मौसम कैसा है?가 되고, कैसी가 아니라 कैसा를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson01.listen.002
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: धूप, बारिश, हवा 같은 날씨 단어는 है를 바로 붙여요. आज धूप है는 '오늘은 햇빛이 나요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson01.order.003
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '힌디어는 날씨 이름에 है만 붙이고 따로 주어 역할을 하는 단어를 쓰지 않아요: आज धूप है.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson01.order.004
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} कैसा है?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} कैसा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा는 남성 명사 मौसम에 맞춰 달라져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson01.fill.005
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: fill_in_blank
  frame:
    text: आज {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: धूप는 여성 명사이지만, 하나의 대상에는 है가 그대로 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson01.translate.006
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: 오늘은 날씨가 맑아요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 힌디어는 '화창하다'를 형용사 대신 명사 धूप에 है를 붙여 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson01.translate.007
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 힌디어는 날씨를 명사로 나타내요. धूप는 햇빛, बारिश는 비, हवा는 바람이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson02.choose.001
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: गर्म는 어떤 명사와도 형태가 같지만 ठंडा는 달라져요. 남성은 ठंडा, 여성은 ठंडी예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson02.match.002
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '날씨 형용사: गर्म는 성에 따라 변하지 않지만, ठंडा와 ठंडी는 변해요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson02.order.003
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: word_order
  frame:
    text: आज मौसम बहुत {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम बहुत {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मौसम은 남성이라서 ठंडा와 बुरा는 -ा 형태를 쓰고, गर्म는 절대 변하지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson02.order.004
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: word_order
  frame:
    text: आज हवा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आज हवा {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'हवा(바람)는 여성이라서 형용사가 -ी로 끝나요: ठंडी हवा.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit19.lesson02.fill.005
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: fill_in_blank
  frame:
    text: आज मौसम {item} है। ({hint})
    language_code: hi
