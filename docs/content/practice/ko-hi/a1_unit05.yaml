templates:
- content_key: practice.ko-hi.hi.a1.unit05.lesson01.choose.001
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: माता-पिता(부모님)는 어머니를 뜻하는 격식 있는 말 माता와 पिता(아버지)를 짝지은 말이에요. दादा-दादी가 조부모 두 분을 함께 가리키는 것과 같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson02.listen.001
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 힌디어는 친할아버지·친할머니(दादा, दादी)와 외할아버지·외할머니(नाना, नानी)를 구분해서 불러요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson03.choose.001
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बड़ा와 छोटा는 남성 명사에, बड़ी와 छोटी는 여성 명사에 쓰이며, 나이를 나타낼 때도 각각 손위(나이가 많은)와 손아래(나이가 어린)의 뜻으로 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson02.match.002
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '힌디어 가족 호칭은 남성과 여성이 짝을 이뤄요: भाई와 बहन, दादा와 दादी, नाना와 नानी.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson01.order.002
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरा {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: भाई는 남성이라서 मेरा와 함께 쓰고, बहन 같은 여성 단어에는 मेरी를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson01.order.003
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहन은 여성이므로 소유 표현은 मेरा가 아니라 मेरी예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson01.order.004
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: word_order
  frame:
    text: यह मेरे {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 손윗사람에 대한 존중의 뜻으로 मेरा는 मेरे로, है는 हैं으로 바뀌어요. 한 분을 가리켜도 마찬가지예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson02.order.003
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: word_order
  frame:
    text: मेरे माता-पिता {city} में रहते हैं।
    language_code: hi
    direction: ltr
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 도시 이름 뒤의 में은 '~에'라는 뜻이고, 존대하는 복수 주어와 함께 쓰는 동사는 रहते हैं이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson03.order.002
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: word_order
  frame:
    text: मेरा एक {item} भाई भी है।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा एक {item} भाई भी है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बड़ा와 छोटा는 남성 명사 भाई에 맞춰 쓰이고, 여기서 एक는 '하나'보다는 '한(어떤)'의 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson01.fill.005
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: fill_in_blank
  frame:
    text: तुम्हारा {item} कहाँ रहता है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: परिवार는 단수 남성으로 취급하므로 동사는 रहता है예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson02.fill.004
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: fill_in_blank
  frame:
    text: मेरे दादा-दादी दिल्ली में {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 존경받는 복수 대상인 조부모님과 함께 쓸 때는 रहता है가 아니라 रहते हैं을 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson03.fill.003
  lesson_content_key: hi.a1.unit05.lesson03.priya_aur_arjun_ka_parivar
  type: fill_in_blank
  frame:
    text: मेरी भी एक {item} बहन है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बहन이 여성이라서 छोटी라는 여성형을 써요. 남자 형제라면 छोटा를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson02.translate.005
  lesson_content_key: hi.a1.unit05.lesson02.dada_dadi_aur_nana_nani
  type: translation
  frame:
    text: 저희 부모님은 {city}에 살아요.
    language_code: ko
    direction: ltr
    slot_rendering:
      city: english_gloss
  slots:
    city: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरे माता-पिता {city} में रहते हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 부모님은 존경하는 손윗사람이라서 मेरे와 복수 동사 रहते हैं을 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson01.translate.006
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: 너희 가족은 어디에 살아? (친근한 말투)
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हारा {item} कहाँ रहता है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 격식을 갖춘 आप를 쓰면 आपका परिवार कहाँ रहता है?라고 말해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson01.translate.007
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: 이분은 저의 아버지세요. (존중해서 하는 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: यह मेरे {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: '존중이 두 번 드러나요: मेरा 대신 मेरे, है 대신 हैं을 써요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit05.lesson01.translate.008
  lesson_content_key: hi.a1.unit05.lesson01.mera_parivar
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 힌디어에는 할아버지를 가리키는 말이 둘, 할머니를 가리키는 말이 둘 있어요. 아버지 쪽인지 어머니 쪽인지에 따라 달라요.
    language_code: ko
    direction: ltr
