- content_key: practice.ko-hi.hi.a1.unit18.lesson01.choose.001
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कमरा는 방 하나, कमरे는 방 여러 개를 뜻해요. बाथरूम과 बेडरूम은 외래어이고, रसोई는 '부엌'을 뜻하는 힌디어 고유어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-hi.hi.a1.unit18.lesson01.listen.002
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
