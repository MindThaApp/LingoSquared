templates:
- content_key: practice.ko-it.it.a1.unit12.lesson01.choose.001
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Stasera는 '오늘 저녁'이라는 뜻이며, questa sera에서 왔어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson01.listen.002
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Andiamo는 andare의 '우리' 형태이고, 제안할 때 써요. '가요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson01.order.003
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: word_order
  frame:
    text: Andiamo al {item} stasera?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Andiamo al {item} stasera?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Al은 a와 il이 합쳐진 말이에요. al cinema는 '영화관에'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson01.fill.004
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: fill_in_blank
  frame:
    text: Andiamo al cinema {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Stasera는 '오늘 저녁'이라는 뜻이고, 작별 인사 a stasera('오늘 저녁에 봐요')에도 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson01.fill.005
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: fill_in_blank
  frame:
    text: Va bene, {item}! ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Andiamo는 제안에 대답할 때도 써요. '가요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson01.translate.006
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: translation
  frame:
    text: 오늘 저녁에 영화관에 갈까요?
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Andiamo al {item} stasera?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Andiamo를 끝을 올려 말하면 제안이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson01.translate.007
  lesson_content_key: it.a1.unit12.lesson01.andiamo_al_cinema_stasera
  type: translation
  frame:
    text: 좋아요, 가요!
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, {item}!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Va bene, andiamo!는 제안을 받아들이는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson02.choose.001
  lesson_content_key: it.a1.unit12.lesson02.a_che_ora_ci_vediamo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Davanti al cinema는 '영화관 앞에'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson03.listen.001
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Allora는 '그러면' 또는 '그래서'라는 뜻일 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson02.order.002
  lesson_content_key: it.a1.unit12.lesson02.a_che_ora_ci_vediamo
  type: word_order
  frame:
    text: Ci vediamo alle otto, {item} al cinema.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ci vediamo alle otto, {item} al cinema.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Davanti al 뒤에 장소가 오면 '그 장소 앞에'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson02.fill.003
  lesson_content_key: it.a1.unit12.lesson02.a_che_ora_ci_vediamo
  type: fill_in_blank
  frame:
    text: Perfetto, a stasera {item}! ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A stasera allora는 '그럼 오늘 저녁에 봐요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson02.translate.004
  lesson_content_key: it.a1.unit12.lesson02.a_che_ora_ci_vediamo
  type: translation
  frame:
    text: 8시에 영화관 앞에서 만나요.
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ci vediamo alle otto, {item} al cinema.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo alle 뒤에 시간이 오면 만날 시간을 정하는 말이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson03.choose.002
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Se는 '만약'이라는 뜻이고 non은 '~지 않다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson03.fill.003
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: fill_in_blank
  frame:
    text: Allora, {item} stasera non va bene, andiamo domani. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Se는 조건을 시작해요. 오늘 저녁이 안 되면, 이런 식이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson03.fill.004
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: fill_in_blank
  frame:
    text: Se stasera {item} va bene, andiamo domani. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Non은 동사 앞에 놓아서 부정문을 만들어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson03.translate.005
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: translation
  frame:
    text: 오늘 저녁이 안 되면 내일 가요.
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Se stasera {item} va bene, andiamo domani.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Non va bene는 '잘 맞지 않아요', 직역하면 '괜찮지 않아요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson03.match.006
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id012
    second: *id012
    third: *id012
    fourth: *id012
    fifth: *id012
    sixth: *id012
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Se는 '만약', non은 '~지 않다', allora는 '그러면'이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit12.lesson03.translate.007
  lesson_content_key: it.a1.unit12.lesson03.se_stasera_non_va_bene
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
