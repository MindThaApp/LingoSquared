  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_affollato
    - w_bancarella
    - w_chili
    - w_fresca
    - w_panetteria
    - w_rosse
    - w_venditore
    - w_verdura
templates:
- content_key: practice.ko-it.it.a1.unit75.lesson01.choose.001
  lesson_content_key: it.a1.unit75.lesson01.andiamo_al_mercato
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_affollato
        - w_bancarella
        - w_verdura
        - w_fresca
        - w_rosse
        - w_venditore
        - w_chili
        - w_panetteria
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) ''시장에 갈까요?'' 수업에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit75.lesson02.listen.001
  lesson_content_key: it.a1.unit75.lesson02.la_verdura_e_la
