    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 한국어에는 관사가 없지만, 이탈리아어에서는 ho la febbre처럼 증상 앞에 la를 써요.
    language_code: ko
    direction: ltr
