  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Devo는 '~해야 해요'라는 뜻이고, 뒤에 andare 같은 동사원형이 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit16.lesson03.order.003
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: word_order
  frame:
    text: Devo {item} dal dottore.
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Devo {item} dal dottore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Devo 뒤에 동사원형을 쓰면 '~해야 해요'라는 뜻이 돼요.
    language_code: ko
    direction: ltr
