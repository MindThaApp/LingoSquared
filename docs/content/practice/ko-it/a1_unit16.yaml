  feedback_frame:
    text: Mi fa male la testa는 '머리가 아파요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit16.lesson01.order.003
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
