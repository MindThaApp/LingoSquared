  frame:
    text: Prendi questa medicina e {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Riposa는 '쉬어요'라는 친근한 명령형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit16.lesson03.translate.005
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: translation
  frame:
    text: 남자 의사에게 가야 해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Devo andare dal {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dal은 da와 il이 합쳐진 형태로, 사람에게 갈 때 써요. 그래서 dal dottore는 '의사에게'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit16.lesson03.translate.006
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: translation
  frame:
    text: 이 약을 먹고 쉬어요. (친근한 말투, tu)
    language_code: ko
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Prendi questa {item} e riposa.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Prendi와 riposa는 tu로 부르는 사람에게 쓰는 친근한 명령형이에요.
    language_code: ko
    direction: ltr
