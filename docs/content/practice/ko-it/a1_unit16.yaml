    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dottore는 남자 의사, dottoressa는 여자 의사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit16.lesson03.listen.002
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
