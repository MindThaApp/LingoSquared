templates:
- content_key: practice.ko-it.it.a1.unit06.lesson01.choose.001
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '소유 형용사와 함께 쓰면 단수 가족 명사에는 관사를 쓰지 않아요: mio padre, mia madre.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson01.listen.002
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: padre와 madre는 둘 다 -e로 끝나지만 성이 달라요. 그래서 각 단어를 성과 함께 외워야 해요. nonno와 nonna는 -o와 -a로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson01.order.003
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: word_order
  frame:
    text: Questo è mio {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Questo è mio {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'questo와 mio는 남성형이라 남성 명사와 함께 써요: questo è mio padre.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson01.fill.004
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: fill_in_blank
  frame:
    text: Questa è mia {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: questa와 mia는 여성형이고 madre와 성이 일치해요. '이분은 제 어머니예요.'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson01.translate.005
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: 이분은 제 어머니예요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Questa è mia {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 여성 명사에는 questa와 mia를, 남성 명사에는 questo와 mio를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson01.translate.006
  lesson_content_key: it.a1.unit06.lesson01.i_membri_della_famiglia
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: madre와 padre, fratello와 sorella, nonno와 nonna는 남성과 여성으로 짝을 이루는 가족 단어예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson02.choose.001
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: fratelli는 fratello의 복수형이고, '형제자매'라는 뜻으로도 쓸 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson02.listen.002
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: marito와 moglie는 '남편'과 '아내'예요. moglie는 -e로 끝나지만 여성 명사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson02.order.003
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: word_order
  frame:
    text: Ho un fratello e una {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'un은 남성 명사 앞에, una는 여성 명사 앞에 써요: un fratello, una sorella.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson02.fill.004
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: fill_in_blank
  frame:
    text: Hai fratelli o {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: sorella의 복수형은 sorelle이에요. 어미 -a가 -e로 바뀌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson02.translate.005
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: 저는 형제 한 명과 자매 한 명이 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho un fratello e una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: ho는 '나는 가지고 있다'라는 뜻이에요. 남성 명사 앞에는 un을, 여성 명사 앞에는 una를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson02.translate.006
  lesson_content_key: it.a1.unit06.lesson02.hai_fratelli_o_sorelle
  type: translation
  frame:
    text: 형제나 자매가 있어요? (친근한 말, tu)
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai fratelli o {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: hai는 '가지고 있다'의 친근한 tu 형태라서, 이 질문은 친구나 동료에게 하는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson03.match.001
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '가족 단어는 남성과 여성 짝으로 있어요: marito와 moglie, figlio와 figlia.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson03.choose.002
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: figli는 성별 구분 없이 '자녀들'을 뜻해요. figlio와 figlia는 각각 아들과 딸이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson03.listen.003
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: maschio와 femmina는 가족 안에서 사내아이와 여자아이를 말할 때 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson03.fill.004
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: fill_in_blank
  frame:
    text: Sì, ho due {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: figli는 figlio의 복수형이고, 성별에 관계없이 자녀들을 가리켜요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson03.translate.005
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: translation
  frame:
    text: 아이가 있어요? (친근한 말, tu)
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Hai {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai figli?는 상대에게 아이가 있는지 친근하게 묻는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit06.lesson03.translate.006
  lesson_content_key: it.a1.unit06.lesson03.hai_figli
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: figlio와 figlia는 아들과 딸이라는 뜻이고, maschio와 femmina는 자녀 중 사내아이와 여자아이를 나타내요.
    language_code: ko
    direction: ltr
