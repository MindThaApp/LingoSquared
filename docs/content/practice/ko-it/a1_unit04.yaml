templates:
- content_key: practice.ko-it.it.a1.unit04.lesson01.choose.001
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 이탈리아어 요일은 보통 소문자로 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson01.listen.002
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Martedì와 mercoledì는 마지막 음절에 강세 부호가 있고, 그 음절을 강하게 발음해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson01.order.003
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: word_order
  frame:
    text: Che {item} è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} è oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che giorno è oggi?는 요일을 묻는 말이고, 날짜를 물을 때는 Che data è oggi?라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson01.fill.004
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: fill_in_blank
  frame:
    text: Che giorno è {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Oggi는 '오늘', domani는 '내일'이에요. 두 단어 모두 같은 질문에 쓸 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson01.match.005
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 월요일부터 금요일까지는 '날'을 뜻하는 dies에서 온 -dì로 끝나요. sabato와 domenica는 그렇지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson01.translate.006
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: translation
  frame:
    text: 오늘은 {day}이에요.
    language_code: ko
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi è {day}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: '이 쓰임에서는 요일 앞에 관사를 쓰지 않아요: Oggi è lunedì라고 하고, Oggi è il lunedì라고는 하지 않아요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson02.choose.001
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이탈리아어 달 이름은 대문자로 시작하지 않아요: gennaio, febbraio, marzo.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson02.listen.002
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Febbraio에는 b가 두 개 있어요. 길게 끄는 자음에 귀를 기울여 보세요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson02.order.003
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: word_order
  frame:
    text: Che {item} è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} è oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Data는 '날짜'예요. Che data è oggi?는 요일이 아니라 날짜(달과 일)를 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson02.fill.004
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: fill_in_blank
  frame:
    text: Oggi è il {item} marzo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '날짜는 il + 기수로 말해요: il quindici marzo는 3월 15일이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson02.translate.005
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gennaio, febbraio, marzo, aprile는 1월, 2월, 3월, 4월 순서예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson02.translate.006
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: translation
  frame:
    text: 오늘은 {month} 5일이에요.
    language_code: ko
    direction: ltr
    slot_rendering:
      month: english_gloss
  slots:
    month: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi è il cinque {month}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: '이탈리아어는 일을 먼저 말해요: il cinque gennaio, 직역하면 ''5 1월''이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson03.choose.001
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Arrivo는 '(나는) 도착해요', arrivi는 '(너는) 도착해요'(친한 사이에 쓰는 말)예요. 어미 -i가 tu를 나타내요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson03.order.002
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: word_order
  frame:
    text: Quando arrivi a {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Quando arrivi a {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Roma는 '로마'예요. 이탈리아 도시 이름은 다른 언어와 다른 경우가 많아요. 도시 앞에서 a는 '~에'를 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson03.fill.003
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: fill_in_blank
  frame:
    text: Quando {item} a Roma? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quando arrivi?는 친구에게 언제 도착하는지 묻는 말이고, 높임 표현은 Quando arriva?예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson03.match.004
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Dopodomani는 dopo(~후)와 domani(내일)가 합쳐진 말로, '모레'를 뜻해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson03.translate.005
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Arrivo는 '(나는) 도착해요', arrivi는 '(너는) 도착해요'예요. 끝 모음만 바뀌어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit04.lesson03.translate.006
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: translation
  frame:
    text: 목요일 오후에 도착해요.
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Arrivo giovedì {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: '이탈리아어는 요일 앞에 ''~에''에 해당하는 말이 필요 없어요: arrivo giovedì는 ''목요일에 도착해요''예요.'
    language_code: ko
    direction: ltr
