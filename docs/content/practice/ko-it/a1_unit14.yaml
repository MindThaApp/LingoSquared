  type: translation
  frame:
    text: 너는? (친구에게, 무언가가 좋다고 말한 뒤 되물을 때)
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: E a {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'a 같은 전치사 뒤에서 tu는 te가 돼요: a te, ''너에게''.'
    language_code: ko
    direction: ltr
