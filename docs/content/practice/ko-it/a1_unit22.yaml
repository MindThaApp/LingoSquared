    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sam은 남자라서 Stanco가 -o로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit22.lesson01.translate.006
  lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
  type: translation
  frame:
