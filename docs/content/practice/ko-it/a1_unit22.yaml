    slot: item
  feedback_frame:
    text: Perché는 '왜냐하면'과 '왜'를 둘 다 뜻할 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit22.lesson02.order.002
  lesson_content_key: it.a1.unit22.lesson02.perche_vedo_elena
