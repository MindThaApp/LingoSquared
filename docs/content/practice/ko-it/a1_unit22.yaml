      language_code: it
      direction: ltr
  feedback_frame:
    text: Felice와 triste는 -e로 끝나며 성별에 따라 바뀌지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit22.lesson01.order.004
  lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
  type: word_order
  frame:
    text: Come ti {item} oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Come ti {item} oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Senti는 친근한 tu 형태예요: 기분이 어때요?'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit22.lesson01.fill.005
