      direction: ltr
  feedback_frame:
    text: Stanca는 여성형이고, 여자가 말할 때 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit22.lesson02.fill.004
  lesson_content_key: it.a1.unit22.lesson02.perche_vedo_elena
  type: fill_in_blank
  frame:
    text: Sono felice {item} oggi c'è il sole. ({hint})
