    slot: item
  feedback_frame:
    text: Felice와 triste는 감정을 나타내는 말이고, stanco와 nervoso는 남성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit22.lesson02.choose.001
  lesson_content_key: it.a1.unit22.lesson02.perche_vedo_elena
