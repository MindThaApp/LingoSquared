    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono {item} oggi.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Felice는 남자와 여자가 똑같이 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit22.lesson01.translate.007
  lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
  type: translation
  frame:
    text: 오늘 기분이 어때요? (친구에게, tu)
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Come ti {item} oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Come ti senti?는 친근하게 묻는 질문이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit22.lesson01.translate.008
  lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
  type: translation
  frame:
    text: 오늘은 긴장돼요. (남자가 말할 때)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono {item} oggi.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 여자는 nervosa라고 하고, 남자는 nervoso라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit22.lesson01.translate.009
  lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
  type: translation
