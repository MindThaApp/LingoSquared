templates:
- content_key: practice.ko-it.it.a1.unit22.lesson01.choose.001
  lesson_content_key: it.a1.unit22.lesson01.sentimenti_base
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Stanco와 nervoso는 남자가 말할 때 -o로 끝나고, felice와 triste는 -e로 끝나요.
    language_code: ko
    direction: ltr
