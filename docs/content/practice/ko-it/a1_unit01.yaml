templates:
- content_key: practice.ko-it.it.a1.unit01.lesson01.choose.001
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu는 친구, 가족, 또래에게 쓰고, 대문자 L로 쓰는 Lei는 낯선 사람, 연장자, 직장 같은 공식적인 자리에서 쓰는 높임 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson01.listen.002
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ciao는 만날 때와 헤어질 때 모두 쓰지만, buongiorno는 낮에 쓰는 공손한 인사예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson01.order.003
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: word_order
  frame:
    text: Ciao, come {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Come stai?는 친구에게 안부를 묻는 말이고, 낯선 사람에게는 Come sta?라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson01.match.004
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: informale은 '비격식의', formale은 '격식 있는'이라는 뜻이에요. 둘 다 -ale로 끝나는 형용사라서 남성형과 여성형이 같아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson01.translate.005
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Rispettoso는 격식 있는 Lei와 어울려요. 잘 모르는 사람에게 존중을 나타내는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson01.translate.006
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: 안녕, 잘 지내? (친구에게, 비격식)
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Stai는 tu 형태이고, 같은 질문의 높임 Lei 형태는 Buongiorno, come sta?예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson02.choose.001
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Arrivederla는 격식 있는 작별 인사로, 끝의 -la는 Lei를 가리켜요. 친구끼리는 ciao라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson02.listen.002
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buonasera는 저녁 인사이고, buonanotte는 누군가 잠자리에 들 때만 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson02.order.003
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: word_order
  frame:
    text: Ciao, ci {item} domani!
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, ci {item} domani!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo는 직역하면 '우리는 서로 본다'인데, '또 봐요'라는 뜻으로 일상에서 흔히 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson02.fill.004
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: fill_in_blank
  frame:
    text: Arrivederla, a {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A domani는 '내일 봐요'라는 뜻이고, a는 이 관용구의 일부예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson02.translate.005
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bene는 Come stai?에 대한 대답이고, 단독으로 '좋아요', '괜찮아요'라는 뜻으로도 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson03.choose.001
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scusi는 낯선 사람의 주의를 끌 때 쓰는 공손한 표현으로, 격식(Lei) 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson03.listen.002
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Benvenuto는 남성형이고, 여성을 환영할 때는 benvenuta가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson03.order.003
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: word_order
  frame:
    text: Mi chiamo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mi chiamo는 직역하면 '나는 나를 ~라고 부른다'이고, 이름은 그냥 맨 뒤에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson03.fill.004
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: fill_in_blank
  frame:
    text: Come ti {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ti는 비격식의 '너'를 가리키고, Lei에게는 Come si chiama?라고 물어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson03.match.005
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Piacere는 명사 '기쁨'이기도 하고, 사람을 만났을 때 하는 인사 '반가워요'이기도 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson03.translate.006
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mille는 '천'이라는 뜻이라서 grazie mille는 '정말 고맙습니다'라는 따뜻한 감사 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit01.lesson03.translate.007
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: 제 이름은 Elena예요.
    language_code: ko
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 이탈리아어는 이름을 말할 때 mi chiamo, 즉 '나는 나를 ~라고 부른다'라고 해요.
    language_code: ko
    direction: ltr
