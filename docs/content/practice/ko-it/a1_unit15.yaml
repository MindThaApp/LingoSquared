templates:
- content_key: practice.ko-it.it.a1.unit15.lesson01.choose.001
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Più는 '더'라는 뜻이고, dei와 delle는 di + 정관사의 복수형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson01.listen.002
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dei는 남성 복수 명사와 함께 쓰고, delle는 여성 복수 명사와 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson01.order.003
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: word_order
  frame:
    text: Voglio {item} caffè, meno tè.
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Voglio {item} caffè, meno tè.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Più는 '더', meno는 '덜'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson01.order.004
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: word_order
  frame:
    text: I pomodori costano meno {item} mele.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: I pomodori costano meno {item} mele.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mele는 여성 복수형이라서 di + le가 delle가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson01.fill.005
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: fill_in_blank
  frame:
    text: Le mele costano più {item} pomodori. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pomodori는 남성 복수형이라서 di + i가 dei가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson01.translate.006
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: translation
  frame:
    text: 사과가 토마토보다 더 비싸요.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Le mele costano più {item} pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dei는 di + i이고, mele가 아니라 비교 대상인 pomodori에 맞춘 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson01.translate.007
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: translation
  frame:
    text: 토마토가 사과보다 덜 비싸요.
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: I pomodori costano meno {item} mele.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Meno delle는 여성 복수 명사 앞에서 '~보다 덜'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson03.choose.001
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Quale는 '어느 것'이라는 뜻이고, 여러 선택지 중에서 고르라고 물을 때 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson02.order.001
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: word_order
  frame:
    text: Ciao, {item} preferisci, le mele o i pomodori?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, {item} preferisci, le mele o i pomodori?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Quale preferisci?는 두 가지 중 어느 것을 더 좋아하는지 묻는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson02.fill.002
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: fill_in_blank
  frame:
    text: Ciao, {item} preferisci, il caffè o il tè? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quale는 '어느 것'이라는 뜻이고, 이 질문에서는 동사 앞에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson02.translate.003
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: translation
  frame:
    text: 안녕, 사과랑 토마토 중에 뭐가 더 좋아? (친구에게 하는 말, tu)
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, {item} preferisci, le mele o i pomodori?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Preferisci는 친구에게 쓰는 tu 형태라서, 이 질문은 친구에게 하는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson03.choose.002
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buone는 buono의 여성 복수형이고 mele에 맞춘 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson03.listen.003
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buone는 여성 복수 명사를 꾸미기 때문에 -e로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson03.order.004
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: word_order
  frame:
    text: Sì, le mele sono {item} come i pomodori.
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, le mele sono {item} come i pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Sono buone는 복수라서, 여성 복수형 mele에 맞춰 buono가 buone가 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson03.fill.005
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: fill_in_blank
  frame:
    text: Le mele sono {item} come i pomodori. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Come은 같은 정도의 두 대상을 이어 줘요. buone come은 '~만큼 맛있는'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit15.lesson03.translate.006
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: translation
  frame:
    text: 사과는 토마토만큼 맛있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Le mele sono {item} come i pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Buone는 mele에 맞춘 형태이고, 이 비교에서 come은 '~만큼'이라는 뜻이에요.
    language_code: ko
    direction: ltr
