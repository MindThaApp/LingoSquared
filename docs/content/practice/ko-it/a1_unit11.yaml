  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Torni는 tornare의 tu 형태이고, torno는 1인칭 단수형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit11.lesson02.listen.003
  lesson_content_key: it.a1.unit11.lesson02.a_che_ora_torni_a_casa
