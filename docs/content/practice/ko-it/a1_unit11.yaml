  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: E trenta는 30분을 더해요. alle sei e trenta는 6시 30분이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit11.lesson02.order.005
  lesson_content_key: it.a1.unit11.lesson02.a_che_ora_torni_a_casa
