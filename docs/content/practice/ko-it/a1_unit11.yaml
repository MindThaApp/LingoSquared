    text: Vado와 torno는 1인칭 단수형이고, faccio는 '해요' 또는 '만들어요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit11.lesson02.choose.002
  lesson_content_key: it.a1.unit11.lesson02.a_che_ora_torni_a_casa
