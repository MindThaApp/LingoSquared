    text: A casa는 '집에' 또는 '집으로'라는 뜻이고, 관사를 쓰지 않아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit11.lesson01.fill.005
  lesson_content_key: it.a1.unit11.lesson01.faccio_colazione_vado_al_lavoro
