      text: Vado a letto {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 여기서 presto는 '일찍'이라는 뜻이에요. 반면 '곧 만나요'라는 뜻의 a presto에서는 '곧'이라는 뜻이에요.
