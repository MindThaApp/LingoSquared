      direction: ltr
  feedback_frame:
    text: Torni는 친구나 동료에게 쓰는 친근한 '너/당신' 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit11.lesson02.order.006
  lesson_content_key: it.a1.unit11.lesson02.a_che_ora_torni_a_casa
  type: word_order
  frame:
    text: Vado a letto {item}.
    language_code: it
    direction: ltr
