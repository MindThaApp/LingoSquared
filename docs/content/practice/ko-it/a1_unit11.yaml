  lesson_content_key: it.a1.unit11.lesson01.faccio_colazione_vado_al_lavoro
  type: translation
  frame:
    text: 저는 7시에 아침을 먹어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Faccio {item} alle sette.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Faccio colazione은 문자 그대로 '아침을 만들다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit11.lesson01.translate.007
  lesson_content_key: it.a1.unit11.lesson01.faccio_colazione_vado_al_lavoro
  type: translation
  frame:
    text: 보통 몇 시에 아침을 먹어요? (친구에게, tu)
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: A che ora fai colazione di {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di solito는 '보통'이라는 뜻이고, fai는 tu에 해당하는 친근한 형태예요.
    language_code: ko
    direction: ltr
