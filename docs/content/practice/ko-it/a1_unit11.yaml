    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Vado a letto {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Presto는 '일찍' 또는 '곧'이라는 뜻일 수 있어요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit11.lesson03.choose.001
  lesson_content_key: it.a1.unit11.lesson03.la_mia_giornata
