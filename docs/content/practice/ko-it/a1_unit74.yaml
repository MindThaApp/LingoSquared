  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_popolare
        - w_sipario
        - w_attori
        - w_bravi
        - w_aperta
        - w_commedia
        - w_intervallo
        - w_posti
        - w_soddisfatto
        - w_benissimo
        - w_fantastici
