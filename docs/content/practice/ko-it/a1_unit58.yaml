  lesson_content_key: it.a1.unit58.lesson01.fissare_un_appuntamento
  type: fill_in_blank
  frame:
    text: Oggi alle dieci Nina ha un {item} per assistenza informatica. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_appuntamento
    hint:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_appuntamento
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nina는 오늘 10시에 컴퓨터 도움 예약이 있어요. appuntamento는 '예약'이라는 뜻이에요.
    language_code: ko
    direction: ltr
