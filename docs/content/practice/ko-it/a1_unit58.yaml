  lesson_content_key: it.a1.unit58.lesson02.un_orario_e_disponibile
  type: word_order
  frame:
    text: Mercoledì alle dieci è {item}.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags:
        semantic: w_disponibile
  answer_derivation:
