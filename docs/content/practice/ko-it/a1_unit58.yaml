schema_version: '1.0'
pack_key: practice.ko-it.a1.unit58
source_language: ko
target_language: it
unit_content_key: it.a1.unit58.appuntamento
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_appuntamento
    - w_conferma
    - w_confermato
    - w_disponibile
    - w_fissare
    - w_informatica
    - w_maggio
    - w_ricordare
    - w_tredici
templates:
- content_key: practice.ko-it.it.a1.unit58.lesson01.choose.001
  lesson_content_key: it.a1.unit58.lesson01.fissare_un_appuntamento
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_fissare
        - w_appuntamento
        - w_disponibile
        - w_informatica
        - w_confermato
        - w_conferma
        - w_tredici
        - w_maggio
        - w_ricordare
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 예약하기 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit58.lesson02.listen.001
  lesson_content_key: it.a1.unit58.lesson02.un_orario_e_disponibile
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}은(는) 이번 단원의 단어로, 가능한 시간에 관한 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit58.lesson03.translate.001
  lesson_content_key: it.a1.unit58.lesson03.per_che_cosa_e
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어로, 예약이 무엇을 위한 것인지 묻는 수업에 나와요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit58.lesson05.match.001
  lesson_content_key: it.a1.unit58.lesson05.leggere_una_conferma
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 이탈리아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit58.lesson06.choose.001
  lesson_content_key: it.a1.unit58.lesson06.marco_aiuta_nina_a
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
