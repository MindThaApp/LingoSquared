- content_key: practice.ko-it.it.a1.unit58.lesson01.order.003
  lesson_content_key: it.a1.unit58.lesson01.fissare_un_appuntamento
  type: word_order
  frame:
    text: Vorrei {item} un appuntamento.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags:
        semantic: w_fissare
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei {item} un appuntamento.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 예약을 하고 싶어요. fissare는 '정하다; (예약을) 잡다'라는 뜻이에요.
    language_code: ko
    direction: ltr
