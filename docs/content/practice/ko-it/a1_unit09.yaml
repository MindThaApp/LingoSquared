templates:
- content_key: practice.ko-it.it.a1.unit09.lesson01.choose.001
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La farmacia, la banca, la stazione은 여성형이고, l'ufficio postale은 남성형이며 관사가 축약된 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson01.listen.002
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Via는 거리나 길을 뜻하며 Via Roma처럼 이름에 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson01.order.003
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: word_order
  frame:
    text: Scusi, dov'è la {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dov'è la 뒤에 여성 명사를 붙이면 장소가 어디인지 묻는 말이 돼요. scusi는 공손한 '실례합니다'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson01.fill.004
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: fill_in_blank
  frame:
    text: È qui {item}, in Via Roma. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Qui vicino는 '바로 근처에'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson01.match.005
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Vicino는 '가까운'이라는 뜻이고, qui vicino는 '근처에'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson01.translate.006
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: 실례합니다, 약국이 어디예요? (공손한 표현)
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi는 공손한 명령형으로, 모르는 사람에게 말할 때 알맞아요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson01.translate.007
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'il이나 la는 명사의 성에 따라 달라지지만, 모음 앞에서는 l''를 써요: l''ufficio.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson02.choose.001
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: C'è는 무언가가 있는지 묻거나 있다고 말할 때 쓰고, ce n'è는 그중 하나가 있다고 답할 때 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson02.listen.002
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ce n'è una는 '하나 있어요'라는 뜻이고, ne는 '그것들 중'을 대신해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson02.fill.003
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: C'è una {item} qui vicino? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: C'è una banca?는 이 근처에 은행이 있는지 묻는 말이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson02.order.004
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: word_order
  frame:
    text: Sì, {item} una qui vicino.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, {item} una qui vicino.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ce n'è una는 c'è una ... 질문에 '하나 있어요'라고 답하는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson02.fill.005
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: È {item} alla stazione. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Accanto alla는 '~ 옆에'라는 뜻이고, alla는 a와 la가 합쳐진 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson02.fill.006
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: Sì, ce n'è una qui vicino, accanto {item} stazione. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alla는 여성 명사 앞에서 a와 la가 합쳐진 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson02.translate.007
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: 근처에 은행이 있어요?
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: C'è una {item} qui vicino?
      language_code: it
      direction: ltr
  feedback_frame:
    text: C'è una banca qui vicino?에서 banca가 여성형이라서 una를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson02.translate.008
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: 네, 근처에 하나 있어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, {item} una qui vicino.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ce n'è una는 '그중 하나가 있어요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit09.lesson02.translate.009
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: 역 옆이에요.
    language_code: ko
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: È {item} alla stazione.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Accanto alla stazione는 '역 옆'이라는 뜻이에요.
    language_code: ko
    direction: ltr
