templates:
- content_key: practice.ko-it.it.a1.unit10.lesson01.choose.001
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Vada와 giri는 격식체 명령형으로, 모르는 사람에게 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson01.listen.002
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Sempre dritto는 '곧장 앞으로'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson01.order.003
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: word_order
  frame:
    text: Vada sempre dritto, poi giri a {item} all'incrocio.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Vada sempre dritto, poi giri a {item} all'incrocio.
      language_code: it
      direction: ltr
  feedback_frame:
    text: A destra와 a sinistra는 방향을 도는 두 가지 쪽이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson01.fill.004
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: fill_in_blank
  frame:
    text: Scusi, come arrivo al {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al museo의 al은 a + il이 합쳐진 축약형으로, 남성 명사 장소 앞에 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson02.match.001
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Destra는 오른쪽, sinistra는 왼쪽이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson01.translate.005
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: translation
  frame:
    text: 실례합니다, 박물관에 어떻게 가나요? (격식체)
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, come arrivo al {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi는 모르는 사람에게 격식 있게 말을 걸 때 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson01.translate.006
  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: translation
  frame:
    text: 곧장 가세요, 그리고 교차로에서 오른쪽으로 도세요. (격식체)
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vada sempre dritto, poi giri a destra {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: All'incrocio는 '교차로에서'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson02.choose.002
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: A piedi는 '걸어서'라는 뜻이고, 직역하면 '발로'예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson02.listen.003
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Solo는 ''~밖에, 단지''라는 뜻이고 수량 앞에 와요: solo cinque minuti.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson02.fill.004
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: fill_in_blank
  frame:
    text: Sono {item} cinque minuti a piedi. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Solo를 cinque minuti 앞에 두면 '5분밖에'라는 뜻이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson02.order.005
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: word_order
  frame:
    text: È {item} da qui?
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: È {item} da qui?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Lontano da qui는 '여기서 멀다'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson02.translate.006
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: 여기서 멀어요?
    language_code: ko
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: È {item} da qui?
      language_code: it
      direction: ltr
  feedback_frame:
    text: È lontano da qui?는 거리를 물을 때 일상적으로 쓰는 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson02.translate.007
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: 아니요, 걸어서 5분밖에 안 걸려요.
    language_code: ko
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: No, sono {item} cinque minuti a piedi.
      language_code: it
      direction: ltr
  feedback_frame:
    text: minuti가 복수이기 때문에 Sono cinque minuti라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson02.translate.008
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: 정말 감사합니다, 친절하시네요. (격식체)
    language_code: ko
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Grazie mille, {item} gentile.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Molto gentile는 격식 있게 감사를 전하는 공손한 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson03.choose.001
  lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Continui, vada, giri는 모두 격식체 명령형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson03.order.002
  lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
  type: word_order
  frame:
    text: Poi {item} sempre dritto.
    language_code: it
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Poi {item} sempre dritto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Continui는 '계속하세요'를 뜻하는 격식체 명령형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson03.translate.003
  lesson_content_key: it.a1.unit10.lesson03.come_arrivo_al_museo
  type: translation
  frame:
    text: 그리고 계속 곧장 가세요. (격식체)
    language_code: ko
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Poi {item} sempre dritto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Continui는 continuare의 Lei 명령형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit10.lesson02.translate.009
  lesson_content_key: it.a1.unit10.lesson02.e_lontano_da_qui
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Destra와 sinistra는 오른쪽과 왼쪽이고, lontano는 '멀다'라는 뜻이에요.
    language_code: ko
    direction: ltr
