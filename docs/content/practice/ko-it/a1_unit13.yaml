    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Andata는 여성이, andato는 남성이 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson01.order.003
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: word_order
  frame:
    text: Sono {item} al cinema ieri.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono {item} al cinema ieri.
      language_code: it
      direction: ltr
  feedback_frame:
    text: sono와 함께 쓰는 과거형은 말하는 사람에 따라 달라져요. 남성은 andato, 여성은 andata를 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson01.fill.004
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: fill_in_blank
  frame:
    text: Ho {item} un bel film! ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Visto는 ho와 함께 써요. ho visto는 '봤어요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson01.fill.005
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: fill_in_blank
  frame:
    text: Ho visto un {item} film! ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bel은 남성 명사 앞에서 쓰는 bello의 짧은 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson01.order.006
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: word_order
  frame:
    text: Ho visto un bel {item}!
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho visto un bel {item}!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Film은 남성 명사라서 un과 bel을 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson01.translate.007
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: translation
  frame:
    text: 저는 어제 영화관에 갔어요. (남성이 하는 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono {item} al cinema ieri.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 남성은 sono andato, 여성은 sono andata라고 해요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson01.translate.008
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: translation
  frame:
    text: 어제 영화관에 갔어요. (여자가 하는 말)
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono {item} al cinema ieri.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Andare는 sono를 쓰기 때문에, 어미가 말하는 사람에 맞춰 달라져요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson01.translate.009
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: translation
  frame:
    text: 멋진 영화를 봤어요!
    language_code: ko
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho visto un bel {item}!
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Vedere는 ho를 써요: ho visto는 ''나는 봤어요''라는 뜻이에요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson02.match.001
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: '많은 과거형은 ho와 과거분사를 써요: ho visto, ho mangiato, ho fatto. andare는 대신 sono를 써요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson02.choose.002
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Pranzo는 ''점심''이라는 뜻이고 a와 함께 써요: a pranzo.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson02.listen.003
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ho mangiato는 '나는 먹었어요', hai fatto는 '너는 했어'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson02.fill.004
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: fill_in_blank
  frame:
    text: Ho {item} un panino a pranzo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mangiato는 ho 뒤에 쓰는 과거형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson02.fill.005
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: fill_in_blank
  frame:
    text: Ho mangiato un panino a {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A pranzo는 '점심으로', '점심때'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson02.order.006
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: word_order
  frame:
    text: Cosa hai {item} ieri?
    language_code: it
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa hai {item} ieri?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai fatto는 '너는 했어' 또는 '너는 만들었어'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson02.translate.007
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: translation
  frame:
    text: 점심에 샌드위치를 먹었어요.
    language_code: ko
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho mangiato un panino a {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: A pranzo는 '점심에'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson02.translate.008
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: translation
  frame:
    text: 어제 뭐 했어? (친구에게, tu)
    language_code: ko
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa hai {item} ieri?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Hai fatto는 친구에게 쓰는 tu 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson02.translate.009
  lesson_content_key: it.a1.unit13.lesson02.ho_mangiato_un_panino
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ieri는 '어제', stamattina는 '오늘 아침'이라는 뜻이에요.
    language_code: ko
    direction: ltr
