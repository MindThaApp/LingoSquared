templates:
- content_key: practice.ko-it.it.a1.unit13.lesson01.choose.001
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Andato와 andata는 '가다'의 과거형으로, 각각 남성형과 여성형이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit13.lesson01.listen.002
  lesson_content_key: it.a1.unit13.lesson01.sono_andato_al_cinema_ieri
  type: listen_select
