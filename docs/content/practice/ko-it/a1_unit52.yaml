    slot: item
  feedback_frame:
    text: Marco가 음식을 맛봐요. assaggia는 '그/그녀가 맛봐요' 또는 '맛봐!'(친근한 명령)라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit52.lesson05.order.002
  lesson_content_key: it.a1.unit52.lesson05.giulia_e_marco_cucinano
  type: word_order
  frame:
