schema_version: '1.0'
pack_key: practice.ko-it.a1.unit52
source_language: ko
target_language: it
unit_content_key: it.a1.unit52.cucina
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_appetito
    - w_assaggi
    - w_assaggia
    - w_assaggiare
    - w_buonissima
    - w_cena
    - w_cipolla
    - w_cucinano
    - w_entra
    - w_frigge
    - w_friggere
    - w_friggi
    - w_friggo
    - w_padella
    - w_pomodoro
    - w_prepara
    - w_preparare
    - w_prepari
    - w_prepariamo
    - w_preparo
    - w_pronta
    - w_tagliamo
    - w_tagliare
    - w_taglio
templates:
- content_key: practice.ko-it.it.a1.unit52.lesson01.choose.001
  lesson_content_key: it.a1.unit52.lesson01.la_cipolla_il_pomodoro
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_cipolla
        - w_pomodoro
        - w_tagliare
        - w_taglio
        - w_cena
        - w_padella
        - w_friggere
        - w_friggi
        - w_friggo
        - w_preparare
        - w_preparo
        - w_assaggiare
        - w_assaggia
        - w_entra
        - w_tagliamo
        - w_assaggi
        - w_cucinano
        - w_frigge
        - w_prepara
        - w_pronta
        - w_prepari
        - w_prepariamo
        - w_buonissima
        - w_appetito
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 양파, 토마토, 썰기 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit52.lesson02.listen.001
  lesson_content_key: it.a1.unit52.lesson02.la_padella_e_friggere
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 프라이팬과 볶기 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit52.lesson03.translate.001
  lesson_content_key: it.a1.unit52.lesson03.preparare_e_assaggiare
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item}: 이 단원의 단어예요. 준비하기와 맛보기 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit52.lesson04.match.001
  lesson_content_key: it.a1.unit52.lesson04.in_cucina_da_marco
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 각 이탈리아어 단어를 알맞은 한국어 뜻과 연결하세요. 이 단원의 수업에 나온 단어들이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit52.lesson05.choose.001
  lesson_content_key: it.a1.unit52.lesson05.giulia_e_marco_cucinano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} — ''Giulia와 Marco가 함께 요리해요'' 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit52.lesson06.translate.001
  lesson_content_key: it.a1.unit52.lesson06.luca_viene_a_cena
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} — ''Luca가 밥을 먹으러 와요'' 레슨에 나오는 이 단원의 단어예요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit52.lesson01.order.002
  lesson_content_key: it.a1.unit52.lesson01.la_cipolla_il_pomodoro
  type: word_order
  frame:
    text: Ho una {item}.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_cipolla
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 저는 양파가 하나 있어요. cipolla는 '양파'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit52.lesson01.fill.003
  lesson_content_key: it.a1.unit52.lesson01.la_cipolla_il_pomodoro
  type: fill_in_blank
  frame:
    text: Ho una cipolla e un {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_pomodoro
    hint:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_pomodoro
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 저는 양파와 토마토가 있어요. pomodoro는 토마토라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit52.lesson01.translate.004
  lesson_content_key: it.a1.unit52.lesson01.la_cipolla_il_pomodoro
  type: translation
  frame:
    text: 네, 제가 양파를 썰 테니 당신은 토마토를 볶아 주세요.
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags:
        semantic: w_taglio
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, io {item} la cipolla e tu friggi il pomodoro.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 네, 제가 양파를 썰 테니 당신은 토마토를 볶아 주세요. taglio는 '나는 썰어요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit52.lesson02.order.002
  lesson_content_key: it.a1.unit52.lesson02.la_padella_e_friggere
  type: word_order
  frame:
    text: Ho una {item}.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_padella
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho una {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 저는 프라이팬이 있어요. padella는 프라이팬이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit52.lesson02.fill.003
  lesson_content_key: it.a1.unit52.lesson02.la_padella_e_friggere
  type: fill_in_blank
  frame:
    text: Sì, io taglio la cipolla e tu {item} il pomodoro. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags:
        semantic: w_friggi
    hint:
      language_code: it
      part_of_speech: verb
      agreement_tags:
        semantic: w_friggi
  answer_derivation:
