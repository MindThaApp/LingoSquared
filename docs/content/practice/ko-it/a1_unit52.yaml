    slot: item
  feedback_frame:
    text: 네, 제가 양파를 썰 테니 당신은 토마토를 볶아 주세요. friggi는 '너는 볶아(튀겨)요'라는 뜻이에요(친근한 말투).
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit52.lesson03.order.002
  lesson_content_key: it.a1.unit52.lesson03.preparare_e_assaggiare
  type: word_order
  frame:
    text: Bene, io {item} la cena.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags:
        semantic: w_preparo
  answer_derivation:
    kind: render_frame
    frame:
      text: Bene, io {item} la cena.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 좋아요, 제가 음식을 준비할게요. preparo의 뜻은 '저는 준비해요'예요.
    language_code: ko
    direction: ltr
