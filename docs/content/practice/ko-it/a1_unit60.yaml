        - w_etichetta
        - w_paracetamolo
        - w_acqua
        - w_meglio
        - w_riposarsi
        - w_riposati
        - w_preso
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item} (''머리가 아파요'' 수업)'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit60.lesson02.listen.001
