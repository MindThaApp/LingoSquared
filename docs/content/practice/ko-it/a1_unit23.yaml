  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Chi는 '누구'라는 뜻이고 chi parla?에서 쓰여요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit23.lesson01.order.003
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
