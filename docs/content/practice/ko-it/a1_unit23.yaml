  answer_derivation:
    kind: render_frame
    frame:
      text: Pronto, {item} parla?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Pronto, chi parla?는 전화를 받을 때 쓰는 기본 표현이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit23.lesson01.order.004
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: word_order
  frame:
    text: Ti mando un {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ti mando un {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un messaggio는 남성 명사라서 un과 함께 써요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit23.lesson01.fill.005
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: fill_in_blank
  frame:
    text: Ti {item} un messaggio. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mando는 mandare의 '나' 형태로, '보내요'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit23.lesson01.translate.006
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: translation
  frame:
    text: 여보세요, 누구세요?
    language_code: ko
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Pronto, {item} parla?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Pronto는 전화를 받을 때 하는 말이고, chi는 '누구'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit23.lesson01.translate.007
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: translation
  frame:
    text: 너에게 메시지를 보낼게.
    language_code: ko
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Ti {item} un messaggio.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ti는 '너에게'라는 뜻이고 동사 앞에 와요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit23.lesson01.translate.008
  lesson_content_key: it.a1.unit23.lesson01.pronto_chi_parla
  type: translation
  frame:
    text: '{item}'
    language_code: ko
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 인사말로서 pronto는 전화에서만 써요. 다른 상황에서는 '준비된'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit23.lesson02.choose.001
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Puoi는 potere의 친근한 tu 형태로, '할 수 있어'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit23.lesson02.order.002
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: word_order
  frame:
    text: Sam, puoi {item}, per favore?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Sam, puoi {item}, per favore?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Puoi 뒤에 동사원형을 붙이면 상대에게 무언가를 부탁하는 말이 돼요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit23.lesson02.order.003
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: word_order
  frame:
    text: Parla più {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parla più {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Più piano는 '더 천천히'라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit23.lesson02.fill.004
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: fill_in_blank
  frame:
    text: Sam, {item} ripetere, per favore? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Puoi는 tu 형태라서 -i로 끝나요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit23.lesson02.translate.005
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: translation
  frame:
    text: 샘, 다시 한 번 말해 줄래? (친근한 표현, tu)
    language_code: ko
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Sam, {item} ripetere, per favore?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Puoi는 친구에게 쓰는 친근한 형태예요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit23.lesson02.translate.006
  lesson_content_key: it.a1.unit23.lesson02.puoi_ripetere
  type: translation
  frame:
    text: 천천히 말해 줘. (친근한 표현, tu)
    language_code: ko
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parla più {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Piano는 '느린' 또는 '느리게'라는 뜻이 될 수 있어요.
    language_code: ko
    direction: ltr
