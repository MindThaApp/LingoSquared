- content_key: practice.ko-it.it.a1.unit57.lesson01.order.003
  lesson_content_key: it.a1.unit57.lesson01.smarrito_e_trovato
  type: word_order
  frame:
    text: Il mio telefono è {item}.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: adjective
      agreement_tags:
        semantic: w_smarrito
  answer_derivation:
    kind: render_frame
    frame:
      text: Il mio telefono è {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 내 휴대폰이 없어졌어요. smarrito는 '분실된, 없어진'이라는 뜻이에요 (남성형).
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit57.lesson01.fill.004
  lesson_content_key: it.a1.unit57.lesson01.smarrito_e_trovato
  type: fill_in_blank
  frame:
    text: È stato {item} il mio telefono? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags:
        semantic: w_trovato
    hint:
      language_code: it
      part_of_speech: verb
      agreement_tags:
        semantic: w_trovato
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 내 휴대폰이 발견됐나요? trovato는 '발견된'이라는 뜻이에요 (과거분사).
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit57.lesson01.translate.005
  lesson_content_key: it.a1.unit57.lesson01.smarrito_e_trovato
  type: translation
  frame:
    text: '직원: 네, 이 휴대폰은 발견됐어요.'
    language_code: ko
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: verb
      agreement_tags:
        semantic: w_stato
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, questo telefono è {item} trovato.
      language_code: it
      direction: ltr
  feedback_frame:
    text: '직원: 네, 이 휴대폰은 발견됐어요. stato는 ''~였다, ~되었다''라는 뜻이에요 (è stato trovato = 발견되었어요).'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit57.lesson02.order.003
  lesson_content_key: it.a1.unit57.lesson02.telefono_zaino_e_portafoglio
  type: word_order
  frame:
    text: Il mio {item} è allo sportello.
    language_code: it
    direction: ltr
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_zaino
  answer_derivation:
    kind: render_frame
    frame:
      text: Il mio {item} è allo sportello.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 내 배낭은 창구에 있어요. zaino는 '배낭'이라는 뜻이에요.
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit57.lesson02.fill.004
  lesson_content_key: it.a1.unit57.lesson02.telefono_zaino_e_portafoglio
  type: fill_in_blank
  frame:
    text: Il mio {item} non è smarrito. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_portafoglio
    hint:
      language_code: it
      part_of_speech: noun
      agreement_tags:
        semantic: w_portafoglio
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 내 지갑은 없어지지 않았어요. portafoglio는 '지갑'이라는 뜻이에요.
    language_code: ko
    direction: ltr
