schema_version: '1.0'
pack_key: practice.ko-it.a1.unit57
source_language: ko
target_language: it
unit_content_key: it.a1.unit57.oggetti_smarriti
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Korean). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_abbastanza
    - w_addetto
    - w_emozionante
    - w_portafoglio
    - w_smarrito
    - w_stato
    - w_trovato
    - w_zaino
templates:
- content_key: practice.ko-it.it.a1.unit57.lesson01.choose.001
  lesson_content_key: it.a1.unit57.lesson01.smarrito_e_trovato
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_smarrito
        - w_trovato
        - w_stato
        - w_zaino
        - w_portafoglio
        - w_addetto
        - w_abbastanza
        - w_emozionante
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. 분실과 습득에 관한 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
- content_key: practice.ko-it.it.a1.unit57.lesson02.listen.001
  lesson_content_key: it.a1.unit57.lesson02.telefono_zaino_e_portafoglio
  type: listen_select
  frame:
