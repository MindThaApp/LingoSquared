    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '이 단원의 단어: {item}. 휴대폰, 배낭, 지갑에 관한 수업에서 나왔어요.'
    language_code: ko
    direction: ltr
