templates:
- content_key: practice.es-de.de.a1.unit06.lesson01.choose.001
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Eltern significa «padres» y Geschwister significa «hermanos»; ambas son palabras colectivas de forma plural.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson02.listen.002
  lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
