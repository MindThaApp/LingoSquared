    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Eltern («padres») solo existe en plural, y Geschwister («hermanos») abarca hermanos y hermanas juntos.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson02.match.009
  lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
