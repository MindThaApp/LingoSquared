  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'El alemán distingue el género en cousin: Cousin es masculino y Cousine es femenino, como «primo» y «prima».'
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson03.choose.003
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Einzelkind significa literalmente «niño único».
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson04.choose.004
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Lehrerin es la forma femenina de «profesor»; el plural de Bruder cambia la vocal: Brüder.'
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson01.order.005
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: word_order
  frame:
    text: Das ist meine {item}.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Das ist meine {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 'Los posesivos concuerdan con el sustantivo: todos estos son femeninos, así que llevan meine.'
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson03.order.006
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: word_order
  frame:
    text: Haben Sie {item}?
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Haben Sie {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Haben Sie es el trato de «usted»; en una pregunta de sí o no el verbo va primero.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson04.order.007
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: word_order
  frame:
    text: Meine {item} ist Lehrerin.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Meine {item} ist Lehrerin.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 'Los sustantivos femeninos llevan meine: meine Schwester, meine Tante, meine Cousine.'
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson01.match.008
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: matching_pairs
