    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: La e final de Cousine marca a la prima.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson03.fill.010
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: fill_in_blank
  frame:
    text: Ich {item} zwei Schwestern. ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ich habe significa «tengo»; el verbo conserva la segunda posición después de ich.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson03.fill.011
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: fill_in_blank
  frame:
    text: Ich bin {item}. ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Einzelkind es un sustantivo, así que conserva la mayúscula.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson04.fill.012
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: fill_in_blank
  frame:
    text: Ist das {item} Familie? ({hint})
    language_code: de
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Familie es femenino, así que el «su» formal es Ihre, con mayúscula.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson01.translate.013
  lesson_content_key: de.a1.unit06.lesson01.engste_familie
  type: translation
  frame:
    text: '{item}'
    language_code: es
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Todos los sustantivos alemanes llevan mayúscula inicial, también las palabras de familia.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson03.translate.014
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: Tengo dos hermanas.
    language_code: es
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich habe zwei {item}.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 'El plural de Schwester añade -n: zwei Schwestern.'
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson02.translate.015
  lesson_content_key: de.a1.unit06.lesson02.erweiterte_familie_und_possessivpronomen
  type: translation
  frame:
    text: ¿Quién es su padre? (formal)
    language_code: es
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Wer ist {item} Vater?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Vater es masculino, así que el «su» formal es Ihr, no Ihre.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson03.translate.016
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: Esta es mi madre.
    language_code: es
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Das ist {item} Mutter.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Mutter es femenino, así que «mi» se convierte en meine.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson04.translate.017
  lesson_content_key: de.a1.unit06.lesson04.im_gespraech_ueber_das_familienfoto
  type: translation
  frame:
    text: ¿Tiene usted hermanos varones? (formal)
    language_code: es
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Haben Sie {item}?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Brüder es el plural de Bruder, con diéresis (Umlaut).
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit06.lesson03.translate.018
  lesson_content_key: de.a1.unit06.lesson03.die_familie_beschreiben
  type: translation
  frame:
    text: No, no tengo hermanos ni hermanas.
    language_code: es
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Nein, ich habe {item} Geschwister.
      language_code: de
      direction: ltr
  feedback_frame:
    text: Keine se usa delante de sustantivos plurales y femeninos para decir «ningún / ninguna».
    language_code: es
    direction: ltr
