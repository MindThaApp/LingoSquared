    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Los números compuestos se escriben en una sola palabra, con la unidad antes de la decena.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit03.lesson01.translate.003
  lesson_content_key: de.a1.unit03.lesson01.null_bis_zehn
  type: translation
  frame:
