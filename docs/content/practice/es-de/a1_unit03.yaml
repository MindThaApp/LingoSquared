    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Los números del cero al diez son la base de todo lo que viene después.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit03.lesson02.translate.002
  lesson_content_key: de.a1.unit03.lesson02.elf_bis_zwanzig
  type: translation
  frame:
    text: '{item}'
