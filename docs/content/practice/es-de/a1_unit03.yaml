  answer_derivation:
    kind: render_frame
    frame:
      text: Wie alt {item} Sie?
      language_code: de
      direction: ltr
  feedback_frame:
    text: Sind es la forma de sein que va con Sie, así que la pregunta es Wie alt sind Sie?
    language_code: es
    direction: ltr
