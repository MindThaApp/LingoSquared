templates:
- content_key: practice.es-de.de.a1.unit03.lesson01.choose.001
  lesson_content_key: de.a1.unit03.lesson01.null_bis_zehn
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Eins pasa a ser ein delante de un sustantivo (ein Jahr), pero la forma para contar es eins.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit03.lesson02.listen.001
  lesson_content_key: de.a1.unit03.lesson02.elf_bis_zwanzig
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Los números 16 y 17 pierden letras de la base: sechzehn, siebzehn.'
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit03.lesson03.choose.001
  lesson_content_key: de.a1.unit03.lesson03.die_zehnerzahlen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Los números mayores que veinte ponen primero la unidad: einundzwanzig es literalmente «uno y veinte».'
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit03.lesson05.listen.001
  lesson_content_key: de.a1.unit03.lesson05.im_gespraech_ueber_das_alter
  type: listen_select
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Wenn ich fragen darf es una fórmula de cortesía que suaviza la pregunta, literalmente «si puedo preguntar».
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit03.lesson04.order.001
  lesson_content_key: de.a1.unit03.lesson04.wie_alt_sind_sie
  type: word_order
  frame:
    text: Ich bin {age} Jahre alt.
    language_code: de
    direction: ltr
  slots:
    age: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Ich bin {age} Jahre alt.
      language_code: de
      direction: ltr
  feedback_frame:
    text: 'El alemán dice la edad con sein: Ich bin zwanzig Jahre alt, literalmente «soy veinte años viejo».'
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit03.lesson04.order.002
  lesson_content_key: de.a1.unit03.lesson04.wie_alt_sind_sie
  type: word_order
  frame:
