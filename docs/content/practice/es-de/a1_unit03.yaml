  feedback_frame:
    text: Wie alt sind Sie? es la forma formal de preguntar la edad de alguien.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit03.lesson04.fill.004
  lesson_content_key: de.a1.unit03.lesson04.wie_alt_sind_sie
