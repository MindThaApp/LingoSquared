  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Del trece al diecinueve terminan en -zehn, y veinte es zwanzig.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit03.lesson03.translate.003
  lesson_content_key: de.a1.unit03.lesson03.die_zehnerzahlen
