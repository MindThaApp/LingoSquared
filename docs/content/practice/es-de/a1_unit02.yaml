templates:
- content_key: practice.es-de.de.a1.unit02.lesson01.choose.001
  lesson_content_key: de.a1.unit02.lesson01.namen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ich solo se escribe con mayúscula al principio de la frase; en medio de la frase va en minúscula, como «yo» en español.
    language_code: es
    direction: ltr
- content_key: practice.es-de.de.a1.unit02.lesson02.listen.001
  lesson_content_key: de.a1.unit02.lesson02.ich_bin_du_bist
