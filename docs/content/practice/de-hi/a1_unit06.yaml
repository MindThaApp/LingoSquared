templates:
- content_key: practice.de-hi.hi.a1.unit06.lesson01.choose.001
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: खाना ist ein maskulines Nomen und bedeutet „Essen“ oder „Mahlzeit“; चाय und कॉफ़ी sind feminin, पानी und जूस maskulin.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson01.listen.002
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Hindi-Nomen haben auch bei Getränken ein Genus: पानी und जूस sind maskulin, चाय und कॉफ़ी feminin.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson01.fill.003
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: fill_in_blank
  frame:
    text: आपको क्या {item}? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: चाहिए verändert sich nicht nach dem Geschlecht der sprechenden Person (anders als चाहता und चाहती) und wird nicht von है gefolgt.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson01.translate.004
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: Was möchtest du? (vertraut)
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम्हें क्या {item}?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Mit आप lautet dieselbe Frage आपको क्या चाहिए?; nur das Wort für „du/Sie“ ändert sich.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson01.translate.005
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: Ich möchte Tee, danke.
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} चाहिए, शुक्रिया।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए bedeutet wörtlich „mir ... ist nötig“, deshalb steht das Gewünschte zwischen den beiden Wörtern.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson01.translate.006
  lesson_content_key: hi.a1.unit06.lesson01.mujhe_chahiye
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hindi hat keine Artikel; deshalb kann खाना je nach Situation „Essen“, „eine Mahlzeit“ oder „die Mahlzeit“ bedeuten.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson02.choose.001
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: रोटी, दाल und सब्ज़ी sind feminine Nomen, चावल (Reis) dagegen ist maskulin.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson02.match.002
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Im Hindi steht das Gefäß zuerst, und ein Wort für „von“ fehlt: एक गिलास पानी heißt wörtlich „ein Glas Wasser“.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson02.order.003
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: word_order
  frame:
    text: मुझे एक प्लेट {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे एक प्लेट {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Im Hindi gibt es für „ein Teller Reis“ kein Wort für „von“: Das Gefäß steht vor dem Essen.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson02.order.004
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: word_order
  frame:
    text: यह {item} बहुत स्वादिष्ट है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बहुत स्वादिष्ट है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: स्वादिष्ट verändert sich nicht bei maskulinen oder femininen Nomen, anders als अच्छा und अच्छी.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson02.fill.005
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: fill_in_blank
  frame:
    text: नहीं, {item}, शुक्रिया। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'नहीं, बस lehnt höflich mehr Essen oder Trinken ab: „Nein, es reicht.“'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson02.fill.006
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: fill_in_blank
  frame:
    text: मुझे कॉफ़ी चाहिए, {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कृपया ist das höfliche Wort für „bitte“ und kann am Ende der Bitte stehen.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson02.translate.007
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: translation
  frame:
    text: Ich möchte ein Glas Wasser.
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे एक {item} पानी चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Ein Maßwort wie गिलास steht direkt vor dem Gemessenen, ohne Wort für „von“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson02.translate.008
  lesson_content_key: hi.a1.unit06.lesson02.khana_aur_matra
  type: translation
  frame:
    text: Dieses Dal ist sehr lecker.
    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बहुत स्वादिष्ट है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: दाल ist feminin, aber स्वादिष्ट bleibt bei femininen und maskulinen Nomen gleich.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson03.choose.001
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: या verbindet zwei Möglichkeiten, wie in तुम्हें चाय चाहिए या कॉफ़ी?, und खाते हैं nach चलो macht einen Vorschlag.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson03.fill.002
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: fill_in_blank
  frame:
    text: तुम्हें चाय चाहिए {item} कॉफ़ी? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: In einer Frage bietet या die Wahl zwischen zwei Dingen an, ähnlich wie „oder“ im Deutschen.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit06.lesson03.translate.003
  lesson_content_key: hi.a1.unit06.lesson03.priya_aur_arjun_ka_khana
  type: translation
  frame:
    text: Lass uns etwas essen!
    language_code: de
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो plus ein Verb im Plural auf -ते mit हैं ist die übliche Form, einen Vorschlag zu machen.
    language_code: de
    direction: ltr
