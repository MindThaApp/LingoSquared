    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इंजीनियर ist für Mann und Frau dasselbe Wort.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson01.translate.007
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Ich bin Lehrerin. (von einer Frau gesagt)
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Eine Frau sagt शिक्षिका; ein Mann würde शिक्षक sagen.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson01.translate.008
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Ich bin Lehrer. (von einem Mann gesagt)
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Ein Mann sagt शिक्षक; eine Frau würde शिक्षिका sagen.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson01.translate.009
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: Ich bin Ingenieur.
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: इंजीनियर ändert sich nicht nach Geschlecht, und Hindi hat kein Wort für „ein“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson02.choose.001
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दफ़्तर ist ein maskulines Nomen für „Büro“, und में danach bedeutet „im Büro“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson02.order.002
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: word_order
  frame:
    text: मैं {item} में काम करता हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में nach dem Ort bedeutet „in“, und der Ort steht vor dem Verb.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson02.fill.003
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: fill_in_blank
  frame:
