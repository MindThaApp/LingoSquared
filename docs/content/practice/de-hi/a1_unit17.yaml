templates:
- content_key: practice.de-hi.hi.a1.unit17.lesson01.choose.001
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: शिक्षक ist ein Lehrer und शिक्षिका eine Lehrerin; इंजीनियर gilt für beide.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson01.listen.002
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Manche Hindi-Berufsbezeichnungen haben eine eigene weibliche Form, etwa शिक्षक und शिक्षिका, Lehnwörter wie इंजीनियर dagegen nicht.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson01.order.003
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: मैं {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Das Wort für Lehrer richtet sich nach dem Geschlecht der sprechenden Person: शिक्षक für einen Mann, शिक्षिका für eine Frau.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson01.order.004
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: प्रिया {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: प्रिया ist eine Frau, deshalb ist sie eine शिक्षिका.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson01.fill.005
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: fill_in_blank
  frame:
