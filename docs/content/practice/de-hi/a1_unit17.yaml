      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: काम करना heißt „arbeiten“, und der Arbeitsort steht mit में.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson02.translate.004
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: Ich arbeite in einem Büro. (gesagt von einem Mann)
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Hindi hat kein Wort für „ein“, und der Ort steht vor काम करता हूँ.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson02.translate.005
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: Arjun arbeitet in einem Büro.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: अर्जुन {item} में काम करता है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Bei einem Namen endet das Verb auf है, nicht auf हूँ, und -ता zeigt, dass Arjun ein Mann ist.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson03.choose.001
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: multiple_choice
  frame:
