  frame:
    text: तुम रोज़ दफ़्तर {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Bei तुम endet das Verb auf -ते, gefolgt von हो, wenn man einen Mann anspricht.
    language_code: de
    direction: ltr
