    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: शिक्षिका bildet die weibliche Form mit -इका, ein Muster, das in mehreren Wörtern aus dem Sanskrit vorkommt.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit17.lesson01.fill.006
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
