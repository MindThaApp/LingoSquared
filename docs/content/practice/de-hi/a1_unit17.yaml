    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाते in तुम रोज़ दफ़्तर जाते हो ist die -ते-Form, die man bei तुम verwendet, wenn man einen Mann anspricht.
    language_code: de
    direction: ltr
