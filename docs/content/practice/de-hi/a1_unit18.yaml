  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कमरा ist ein Zimmer und कमरे sind mehrere Zimmer; बाथरूम und बेडरूम sind Lehnwörter aus dem Englischen, während रसोई das Hindi-Wort für Küche ist.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit18.lesson01.listen.002
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
