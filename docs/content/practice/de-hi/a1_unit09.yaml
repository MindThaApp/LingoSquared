templates:
- content_key: practice.de-hi.hi.a1.unit09.lesson01.choose.001
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'जाओ, मुड़ो und गिनो sind informelle Befehlsformen: Sie enden auf -ो und werden mit तुम verwendet.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson01.listen.002
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बाएँ und दाएँ sind Richtungsadverbien und verändern sich daher weder nach Genus noch nach Numerus.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson01.match.003
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Im Hindi wird der Weg mit einem Adverb plus Verb beschrieben: सीधे जाओ heißt wörtlich „geradeaus geh“, बाएँ मुड़ो „links biege ab“.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson01.order.004
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: word_order
  frame:
    text: यहाँ से {item} जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'से nach यहाँ bedeutet „von“: यहाँ से heißt „von hier“.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson01.order.005
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: word_order
  frame:
    text: फिर {item} मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर {item} मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Im Hindi steht die Richtung vor dem Verb: बाएँ मुड़ो heißt wörtlich „links biege ab“.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson01.fill.006
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: fill_in_blank
  frame:
    text: यहाँ से सीधे {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जाओ ist die informelle Befehlsform von जाना; in höflicher Sprache würde eine andere Endung stehen.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson01.translate.007
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: translation
  frame:
    text: Geh von hier aus geradeaus. (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: जाओ ist der Befehl auf तुम-Ebene; das Verb steht am Ende, nach der Richtung.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson01.translate.008
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: translation
  frame:
    text: Dann biege rechts ab. (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर {item} मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुड़ो ist die informelle Befehlsform von मुड़ना, „abbiegen“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson02.choose.001
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'तक bedeutet „bis“, zum Beispiel in बैंक तक सीधे जाओ: Geh geradeaus bis zur Bank.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson02.order.002
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: word_order
  frame:
    text: बैंक {item} सीधे जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} सीधे जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: तक markiert den Endpunkt der Bewegung und steht direkt hinter dem Ort.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson02.order.003
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: word_order
  frame:
    text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: पहले und फिर bedeuten „zuerst“ und „dann“, die Reihenfolge der Schritte entspricht also der Wortreihenfolge.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson02.fill.004
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: fill_in_blank
  frame:
    text: स्कूल कैसे {item}? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'जाऊँ ist die „Soll ich …?“-Form von जाना; स्कूल कैसे जाऊँ? fragt also: Wie komme ich zur Schule?'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson02.translate.005
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: translation
  frame:
    text: Wie komme ich zur Bank?
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक कैसे {item}?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'जाऊँ verwendet man, wenn man um Rat zur eigenen Handlung bittet: Wie soll ich gehen?'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson02.translate.006
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: translation
  frame:
    text: Geh von hier aus zuerst geradeaus, dann biege links ab. (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: पहले heißt „zuerst“ und फिर „dann“; beide Befehle enden auf -ो, weil sie तुम verwenden.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson03.choose.001
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पर nach einem Ort bedeutet „an“ oder „auf“: नुक्कड़ पर heißt „an der Ecke“.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson03.order.002
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: word_order
  frame:
    text: फिर बैंक के {item} पर बाएँ मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर बैंक के {item} पर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के verbindet बैंक mit der Ecke, und पर legt das Abbiegen dann an diese Ecke.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit09.lesson03.translate.003
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: translation
  frame:
    text: Biege dann an der Ecke der Bank links ab. (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर बैंक के {item} पर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Im Hindi steht zuerst der Bezugsort (बैंक के नुक्कड़ पर), dann die Richtung, dann das Verb.
    language_code: de
    direction: ltr
