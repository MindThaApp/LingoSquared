templates:
- content_key: practice.de-hi.hi.a1.unit10.lesson01.choose.001
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Verben für Gewohnheiten enden bei einem Mann auf -ता und bei einer Frau auf -ती: मैं उठता हूँ, मैं उठती हूँ.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson01.listen.002
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: वह heißt „er“ oder „sie“; die Verbendung zeigt, was gemeint ist. वे heißt „sie“ (Plural).
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson01.order.003
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ सात बजे {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ सात बजे {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Die Verbendung richtet sich nach dem Geschlecht des Sprechers: उठता bei einem Mann, उठती bei einer Frau; हूँ gehört zu मैं.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson01.order.004
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: word_order
  frame:
    text: मैं रोज़ काम पर {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: काम पर जाना, „zur Arbeit gehen“, braucht पर, aber die Verbendung richtet sich weiterhin nach dem Geschlecht des Sprechers.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson01.fill.005
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: fill_in_blank
  frame:
    text: मैं रोज़ नाश्ता {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Viele Hindi-Tätigkeiten bestehen aus Nomen + करना: नाश्ता करना heißt „frühstücken“.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson01.translate.006
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: Jeden Tag gehe ich zur Arbeit. (gesagt von einer Frau)
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ काम पर {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Eine Frau verwendet die Endung -ती: जाती हूँ; ein Mann würde जाता हूँ sagen.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson01.translate.007
  lesson_content_key: hi.a1.unit10.lesson01.uthna_nashta_kaam
  type: translation
  frame:
    text: Jeden Tag frühstücke ich. (gesagt von einem Mann)
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रोज़ नाश्ता {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Hindi sagt नाश्ता करना, wörtlich „Frühstück machen“; im Deutschen gibt es dafür das Verb „frühstücken“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson02.choose.001
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mit तुम endet das Verb bei einem Mann auf -ते, bei einer Frau auf -ती, und es steht mit हो: तुम उठते हो, तुम उठती हो.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson02.match.002
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Jedes Verb für Gewohnheiten hat eine männliche Form auf -ता und eine weibliche auf -ती; die Form richtet sich nach dem Sprecher.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson02.order.003
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: word_order
  frame:
    text: तुम कब {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Mit तुम heißt es -ते हो, wenn man einen Mann fragt; die Endung richtet sich nach der angesprochenen Person.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson02.fill.004
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: fill_in_blank
  frame:
    text: मैं रात को ग्यारह बजे {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hier spricht eine Frau, deshalb steht das Verb auf -ती; die Endung richtet sich nach der Person, die schläft.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson02.translate.005
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: Wann schläfst du? (informell, an einen Mann gerichtet)
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Mit तुम richtet sich die Endung nach der gefragten Person, nicht nach der fragenden: सोते bei einem Mann, सोती bei einer Frau.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson02.translate.006
  lesson_content_key: hi.a1.unit10.lesson02.tum_kab_uthte_ho
  type: translation
  frame:
    text: Wann stehst du auf? (informell, an eine Frau gerichtet)
    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम कब {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Fragt man eine Frau, endet das Verb auf -ती: तुम उठती हो.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson03.choose.001
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: आते in तुम कब वापस आते हो? ist die -ते-Form, die man mit तुम verwendet, wenn man einen Mann fragt.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson03.fill.002
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: fill_in_blank
  frame:
    text: मैं शाम को छह बजे वापस {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: आता ist die männliche Form, also spricht ein Mann; eine Frau würde आती sagen.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson03.translate.003
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: Ich komme abends zurück. (gesagt von einem Mann)
    language_code: de
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं शाम को वापस {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: को nach शाम bedeutet „abends“, und वापस आना heißt „zurückkommen“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson03.translate.004
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: Ich esse zu Abend. (gesagt von einer Frau)
    language_code: de
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं रात का खाना {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रात का खाना, wörtlich „das Essen der Nacht“, heißt „Abendessen“; die Endung -ती zeigt, dass eine Frau spricht.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit10.lesson03.translate.005
  lesson_content_key: hi.a1.unit10.lesson03.priya_arjun_dincharya
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'वापस heißt „zurück“ und verbindet sich mit Verben wie आना: वापस आता हूँ, „ich komme zurück“.'
    language_code: de
    direction: ltr
