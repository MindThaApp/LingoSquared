templates:
- content_key: practice.de-hi.hi.a1.unit08.lesson01.choose.001
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Alle diese Ortswörter sind maskulin, daher steht ein dazu passendes Verb oder Adjektiv in der -ा-Form.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson01.listen.002
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: यहाँ und वहाँ sind Adverbien und verändern sich daher nie nach Genus oder Numerus.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson01.order.003
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: word_order
  frame:
    text: मैं {item} में हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: में nach einem Ort bedeutet „in“, und हूँ gehört zu मैं.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson01.order.004
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: word_order
  frame:
    text: बैंक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Das Verb है steht normalerweise am Ende, nach dem Ortswort: बैंक वहाँ है heißt wörtlich „Bank dort ist“.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson01.fill.005
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: fill_in_blank
  frame:
    text: स्कूल {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: यहाँ bedeutet „hier“, in der Nähe der sprechenden Person, und वहाँ bedeutet „dort“, von der sprechenden Person entfernt.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson01.translate.006
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: translation
  frame:
    text: Die Bank ist dort.
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Hindi hat keinen Artikel, daher kann बैंक „eine Bank“ oder „die Bank“ bedeuten.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson01.translate.007
  lesson_content_key: hi.a1.unit08.lesson01.jagahen
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Hindi verwendet für Orte viele englische Lehnwörter, zum Beispiel स्कूल, बैंक, पार्क und स्टेशन.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson02.choose.001
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पास, सामने und पीछे stehen mit के nach dem Bezugsort: बैंक के पास, „bei der Bank“.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson02.match.002
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Hindi-Ortswörter treten in Gegensatzpaaren auf: यहाँ und वहाँ, पास und दूर, सामने und पीछे.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson02.order.003
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: word_order
  frame:
    text: स्कूल बैंक के {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: स्कूल बैंक के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'के verbindet den Bezugsort mit पास, सामने oder पीछे: बैंक के पास, स्कूल के सामने.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson02.fill.004
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: fill_in_blank
  frame:
    text: पार्क स्कूल के {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पीछे und सामने sind Gegensätze, daher lassen sich dieselben zwei Orte von beiden Seiten aus beschreiben.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson02.fill.005
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: fill_in_blank
  frame:
    text: स्टेशन {item} है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'दूर kann allein stehen (स्टेशन दूर है), und mit einem Bezugsort steht से, nicht के: बैंक से दूर.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson02.translate.006
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: translation
  frame:
    text: Die Schule ist vor dem Park.
    language_code: de
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: स्कूल पार्क के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के verbindet den Bezugsort mit सामने, „vor“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson02.translate.007
  lesson_content_key: hi.a1.unit08.lesson02.paas_aur_door
  type: translation
  frame:
    text: Die Bank ist bei der Schule.
    language_code: de
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक स्कूल के {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Dieses पास bedeutet „nahe“; in मेरे पास bedeutet es „ich habe“ – ein Wort mit zwei Verwendungen.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson03.listen.001
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: तो in हाँ, तो ... zeigt eine Schlussfolgerung an, und थोड़ा bedeutet „ein bisschen“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson03.order.002
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: word_order
  frame:
    text: यह {item} बैंक के पास है।
    language_code: hi
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: यह {item} बैंक के पास है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: डाकघर ist ein Kompositum aus डाक (Post) und घर (Haus), wörtlich „Posthaus“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson03.fill.003
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: fill_in_blank
  frame:
    text: हाँ, {item} दूर है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id017
    hint: *id017
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: थोड़ा vor einem Adjektiv oder Adverb schwächt es ab, ähnlich wie „ein bisschen“ im Deutschen.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit08.lesson03.translate.004
  lesson_content_key: hi.a1.unit08.lesson03.priya_arjun_ka_mohalla
  type: translation
  frame:
    text: Ja, die Post ist bei der Bank.
    language_code: de
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: हाँ, {item} बैंक के पास है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Zuerst steht der Bezugsort बैंक, dann के पास, dann है.
    language_code: de
    direction: ltr
