templates:
- content_key: practice.de-hi.hi.a1.unit01.lesson01.choose.001
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Hindi hat zwei Wörter für „Sie/du“: आप ist höflich und respektvoll, während तुम informell ist und bei Freunden und Gleichaltrigen oder Jüngeren verwendet wird.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson01.fill.002
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Das Verb „sein“ ändert sich mit dem Subjekt: हूँ gehört zu मैं, हो zu तुम und हैं zu आप.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson01.order.003
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: word_order
  frame:
    text: आप {item} हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Das Fragewort richtet sich nach der gefragten Person: कैसे für einen Mann und कैसी für eine Frau, während आप immer हैं verlangt.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson01.translate.004
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: Wie geht es dir? (informell, an einen Mann gerichtet)
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Bei तुम lautet das Verb हो; fragt man eine Frau, wird कैसे zu कैसी: तुम कैसी हो?'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson01.translate.005
  lesson_content_key: hi.a1.unit01.lesson01.aap_and_tum
  type: translation
  frame:
    text: Wie geht es Ihnen? (formell, an eine Frau gerichtet)
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: आप {item} हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Das formelle आप steht mit der pluralisch wirkenden Form हैं, auch für eine einzelne Person; कैसी ist die weibliche Form von „wie“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson02.listen.001
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: अलविदा ist ein Abschiedsgruß; in der Alltagssprache dient नमस्ते sowohl als Begrüßung als auch zum Abschied.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson02.order.002
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: word_order
  frame:
    text: आपका {item} अच्छा रहे।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} अच्छा रहे।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: रहे macht daraus einen Wunsch (möge es gut bleiben), und आपका zeigt, dass er mit dem formellen आप ausgesprochen wird; mit तुम hieße es तुम्हारा.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson02.match.003
  lesson_content_key: hi.a1.unit01.lesson02.greetings_and_farewells
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Hindi hat keine Wörter für „ein“ oder „der/die/das“: नाम kann je nach Satz „Name“, „ein Name“ oder „der Name“ bedeuten.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson03.choose.001
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Hindi-Fragen behalten die Wortstellung des Aussagesatzes: Das Fragewort कहाँ steht an der Stelle der Antwort (आप कहाँ से हैं? und मैं भारत से हूँ).'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson03.order.002
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मेरा नाम {name} है।
    language_code: hi
    direction: ltr
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Im Hindi steht das Verb am Ende, daher heißt मेरा नाम ... है wörtlich „Mein Name ... ist“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson03.order.003
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: word_order
  frame:
    text: मैं {place} से हूँ।
    language_code: hi
    direction: ltr
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से steht nach dem Ortsnamen und bedeutet „aus“ bzw. „von“; es ist eine Postposition, keine Präposition.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson03.fill.004
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: fill_in_blank
  frame:
    text: आपसे मिलकर {item} हुई। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Das ist das formelle „Freut mich, Sie kennenzulernen“, wörtlich „Freude ist beim Treffen mit Ihnen entstanden“; die informelle Variante lautet तुमसे मिलकर अच्छा लगा.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson03.translate.005
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Ich heiße {name}.
    language_code: de
    direction: ltr
    slot_rendering:
      name: english_gloss
  slots:
    name: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा नाम {name} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नाम ist ein maskulines Nomen, deshalb sagen alle, Männer wie Frauen, मेरा नाम.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson03.translate.006
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Ich komme aus {place}.
    language_code: de
    direction: ltr
    slot_rendering:
      place: english_gloss
  slots:
    place: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {place} से हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Auch eine Frau sagt मैं भारत से हूँ: Das Verb हूँ verändert sich nicht nach dem Geschlecht der sprechenden Person.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson03.translate.007
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: Woher kommst du? (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} से हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Um dieselbe Frage formell zu stellen, verwenden Sie आप mit हैं: आप कहाँ से हैं?'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit01.lesson03.translate.008
  lesson_content_key: hi.a1.unit01.lesson03.names_origin_and_dialogue
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Hindi-Nomen sind maskulin oder feminin: दिन, नाम und योग sind maskulin, खुशी ist feminin.'
    language_code: de
    direction: ltr
