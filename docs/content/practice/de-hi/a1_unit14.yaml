  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Das Adjektiv richtet sich nach der Person, die es beschreibt: मेरा भाई लंबा है, मेरी बहन लंबी है.'
    language_code: de
    direction: ltr
