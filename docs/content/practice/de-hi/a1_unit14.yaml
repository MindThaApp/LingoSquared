    slot: item
  feedback_frame:
    text: लंबा und लंबी sind die männliche und die weibliche Form desselben Adjektivs, genau wie बड़ा und बड़ी.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit14.lesson01.listen.002
