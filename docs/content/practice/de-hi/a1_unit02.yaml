templates:
- content_key: practice.de-hi.hi.a1.unit02.lesson01.choose.001
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hindi-Zahlwörter sind unregelmäßig und müssen einzeln gelernt werden; zum Beispiel ist छह sechs und सात sieben.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit02.lesson01.listen.002
  lesson_content_key: hi.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Die Hindi-Zahlwörter von elf bis neunundneunzig sind unregelmäßig, deshalb muss man jedes einzeln lernen, etwa पंद्रह (fünfzehn) oder पचास (fünfzig).
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit02.lesson02.match.001
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Hindi-Nomen wie नंबर, फ़ोन und कीमत stehen ohne Artikel; der Kontext entscheidet, ob „ein Preis“ oder „der Preis“ gemeint ist.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit02.lesson02.fill.002
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: इसकी {item} पचास रुपये है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इसकी bedeutet „sein/ihr“ und richtet sich nach dem femininen Nomen कीमत; deshalb endet es auf -ी und nicht auf -ा.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit02.lesson02.order.003
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: इसकी कीमत {item} रुपये है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी कीमत {item} रुपये है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Im Hindi steht die Zahl vor dem Gezählten, und das Verb है bleibt am Satzende: इसकी कीमत पचास रुपये है.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit02.lesson02.translate.004
  lesson_content_key: hi.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: Was kostet das?
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: इसकी {item} क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Im Hindi behält die Frage die Wortstellung des Aussagesatzes: इसकी कीमत पचास रुपये है ist die Antwort auf इसकी कीमत क्या है?'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit02.lesson03.choose.001
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Possessivwörter richten sich nach dem Besitztum: आपका फ़ोन नंबर hat das maskuline आपका, aber आपकी उम्र das feminine आपकी.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit02.lesson03.order.002
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: मेरी उम्र {item} साल है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {item} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Das Alter wird als Zahl mit साल (Jahre) und है angegeben, wörtlich: „Mein Alter ist dreißig Jahre.“'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit02.lesson03.order.003
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: आपका {item} नंबर क्या है?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: आपका ist das höfliche „Ihr“, hier maskulin, weil नंबर maskulin ist; bei तुम sagt man तुम्हारा.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit02.lesson03.fill.004
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: मेरी उम्र तीस {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'साल (Jahr) bleibt nach einer Zahl im Plural unverändert: तीस साल heißt „dreißig Jahre“.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit02.lesson03.translate.005
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Ich bin {n} Jahre alt.
    language_code: de
    direction: ltr
    slot_rendering:
      n: english_gloss
  slots:
    n: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी उम्र {n} साल है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: उम्र ist ein feminines Nomen, daher heißt es मेरी und nicht मेरा.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit02.lesson03.translate.006
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Wie lautet Ihre Telefonnummer?
    language_code: de
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आपका {item} नंबर क्या है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Eine Telefonnummer wird im Hindi Ziffer für Ziffer gelesen, zum Beispiel छह दो आठ तीन पाँच.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit02.lesson03.translate.007
  lesson_content_key: hi.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nach einer Zahl über eins steht bei Geldbeträgen der Plural रुपये; der Singular lautet रुपया.
    language_code: de
    direction: ltr
