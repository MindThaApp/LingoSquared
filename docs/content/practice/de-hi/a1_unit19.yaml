templates:
- content_key: practice.de-hi.hi.a1.unit19.lesson01.choose.001
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: मौसम ist ein maskulines Nomen, daher lautet die Frage आज मौसम कैसा है?, mit कैसा und nicht कैसी.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson01.listen.002
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Wetterwörter wie धूप, बारिश und हवा stehen direkt mit है: आज धूप है bedeutet „Heute ist es sonnig“.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson01.order.003
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Hindi nennt das Wetter beim Namen und fügt है hinzu, ein Wort für „es“ gibt es nicht: आज धूप है.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson01.order.004
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} कैसा है?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} कैसा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा richtet sich nach dem maskulinen Nomen मौसम.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson01.fill.005
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: fill_in_blank
  frame:
    text: आज {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: धूप ist feminin, aber है bleibt bei einer einzelnen Sache unverändert.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson01.translate.006
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: Heute ist es sonnig.
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Hindi verwendet für „sonnig“ das Nomen धूप mit है statt eines Adjektivs.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson01.translate.007
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Hindi benennt das Wetter mit Nomen: धूप ist Sonnenschein, बारिश ist Regen und हवा ist Wind.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson02.choose.001
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'गर्म bleibt bei jedem Nomen gleich, aber ठंडा verändert sich: ठंडा für maskuline, ठंडी für feminine Nomen.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson02.match.002
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Wetteradjektive: गर्म verändert sich nicht nach dem Genus, ठंडा und ठंडी dagegen schon.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson02.order.003
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: word_order
  frame:
    text: आज मौसम बहुत {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम बहुत {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मौसम ist maskulin, daher haben ठंडा und बुरा die Endung -ा, und गर्म verändert sich nie.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson02.order.004
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: word_order
  frame:
    text: आज हवा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आज हवा {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'हवा (Wind) ist feminin, daher endet das Adjektiv auf -ी: ठंडी हवा.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson02.fill.005
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: fill_in_blank
  frame:
    text: आज मौसम {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: मौसम ist maskulin, daher endet das Adjektiv auf -ा.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson02.translate.006
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: Heute ist das Wetter heiß.
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: गर्म bleibt gleich, egal welches Nomen es beschreibt.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson02.translate.007
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: Heute gibt es Wolken.
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बादल steht hier im Plural, daher lautet das Verb हैं.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson02.translate.008
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: Heute ist das Wetter sehr kalt.
    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम बहुत {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहुत steht vor dem Adjektiv, und ठंडा richtet sich nach मौसम.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson03.choose.001
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बाहर bedeutet „draußen“, und चलो, बाहर जाते हैं! ist ein Vorschlag, nach draußen zu gehen.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson03.fill.002
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: fill_in_blank
  frame:
    text: चलो, {item} जाते हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बाहर ist ein Adverb und verändert sich daher weder nach Genus noch nach Numerus.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit19.lesson03.translate.003
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: translation
  frame:
    text: Gehen wir nach draußen!
    language_code: de
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, {item} जाते हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो plus ein Verb auf -ते mit हैं ist die übliche Art, etwas gemeinsam vorzuschlagen.
    language_code: de
    direction: ltr
