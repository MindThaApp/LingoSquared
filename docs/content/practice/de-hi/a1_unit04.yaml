templates:
- content_key: practice.de-hi.hi.a1.unit04.lesson01.choose.001
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बजे („Uhr“) steht nach der Zahl; nur bei der Uhrzeitangabe für ein Uhr sagt man एक बजा है, während „um ein Uhr“ weiterhin एक बजे heißt.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson02.listen.001
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Hindi teilt den Tag in सुबह, दोपहर, शाम und रात ein; ein einzelnes Wort für „a. m.“ oder „p. m.“ gibt es nicht.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson03.choose.001
  lesson_content_key: hi.a1.unit04.lesson03.agli_class_ka_samay
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कल bedeutet sowohl „morgen“ als auch „gestern“; die Zeitform des Verbs zeigt, was gemeint ist.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson02.match.002
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Tageszeiten stehen im Hindi ohne Artikel; सुबह, शाम und रात sind alle feminin.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson01.order.002
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: word_order
  frame:
    text: अभी पाँच {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी पाँच {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Bei der Uhrzeit steht jede volle Stunde außer eins mit बजे und dem Verb im Plural: पाँच बजे हैं, aber एक बजा है.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson01.order.003
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: word_order
  frame:
    text: अभी एक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Nur „ein Uhr“ steht mit dem Singular बजा und dem singularischen है: एक बजा है.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson02.order.003
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: word_order
  frame:
    text: क्लास {item} सात बजे है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: क्लास {item} सात बजे है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Die Tageszeit steht direkt vor der Stunde, ohne ein Wort dazwischen: सुबह सात बजे.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson01.fill.004
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: fill_in_blank
  frame:
    text: क्लास {item} बजे है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कितने बजे है? ist die alltägliche Art zu fragen, um wie viel Uhr etwas stattfindet.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson01.fill.005
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: fill_in_blank
  frame:
    text: अभी पाँच {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: „Es ist … Uhr“ wird für jede Stunde von zwei bis zwölf mit बजे हैं gebildet; बजे bedeutet auch „um … Uhr“, wie in सुबह सात बजे.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson03.fill.002
  lesson_content_key: hi.a1.unit04.lesson03.agli_class_ka_samay
  type: fill_in_blank
  frame:
    text: ठीक है, {item} मिलते हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ठीक है, कल मिलते हैं bedeutet wörtlich „Okay, morgen treffen wir uns“; das Präsens bezieht sich oft auf die nahe Zukunft.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson01.translate.006
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: translation
  frame:
    text: Wie spät ist es?
    language_code: de
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} बजे हैं?'
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Um die Uhrzeit zu nennen, setzt man die Zahl vor बजे: अभी पाँच बजे हैं.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson02.translate.004
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: translation
  frame:
    text: Der nächste Unterricht ist um fünf Uhr abends.
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: अगली क्लास {item} पाँच बजे है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अगली richtet sich nach dem femininen Nomen क्लास und endet daher auf -ी, nicht auf -ा.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson01.translate.007
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: translation
  frame:
    text: Es ist jetzt ein Uhr.
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'Ein Uhr ist die einzige Stunde mit einem Verb im Singular: एक बजा है, aber दो बजे हैं.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit04.lesson02.translate.005
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Hindi hat kein eigenes Wort für „Mittag“: दोपहर deckt die Mittagszeit und den Nachmittag ab.'
    language_code: de
    direction: ltr
