templates:
- content_key: practice.de-hi.hi.a1.unit11.lesson01.choose.001
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'चलो plus ein Verb auf -ते und हैं drückt einen Vorschlag zum gemeinsamen Tun aus: चलो, फ़िल्म देखते हैं!'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson01.listen.002
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'साथ bedeutet „zusammen“ oder „mit“ und kommt oft in Vorschlägen vor: चलो, साथ चाय पीते हैं!'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson01.order.003
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, {item} देखते हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, {item} देखते हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म ist feminin, aber die Vorschlagsform -ते हैं ändert sich dadurch nicht.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson01.order.004
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, साथ चाय {item} हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, साथ चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Die Vorschlagsform besteht aus dem Verb auf -ते mit हैं und bedeutet „lass uns ...“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson01.fill.005
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: अच्छा {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: अच्छा विचार है ist eine gängige Art, einen Vorschlag anzunehmen.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson01.fill.006
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: चलो, फ़िल्म {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: देखते ist die -ते-Form, die mit हैं „wir sehen“ bedeutet und nach चलो „lass uns ansehen“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson01.translate.007
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: Lass uns Tee trinken!
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: „Lass uns“ heißt auf Hindi चलो plus die -ते हैं-Form des Verbs.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson01.translate.008
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: 'Gute Idee! (ganzer Satz: Gute Idee ist)'
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अच्छा {item} है!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: विचार ist maskulin, deshalb steht das Adjektiv als अच्छा.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson02.choose.001
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: माफ़ करना ist die informelle Art, „Entschuldigung“ oder „Tut mir leid“ zu sagen, bei Personen, die man mit तुम anspricht.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson02.match.002
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Zu den Hindi-Wörtern für höfliche Absagen gehören माफ़ करना für „Tut mir leid“ und व्यस्त für „beschäftigt“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson02.fill.003
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: fill_in_blank
  frame:
    text: माफ़ करना, मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nach माफ़ करना nennt man seine Lage, zum Beispiel, dass man beschäftigt ist.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson02.translate.004
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: Tut mir leid, ich bin beschäftigt. (informell)
    language_code: de
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: माफ़ करना, मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: माफ़ करना ist die informelle Art, sich zu entschuldigen; व्यस्त bleibt für Mann und Frau gleich.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson02.translate.005
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: Also, wann treffen wir uns?
    language_code: de
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तो {item} कब मिलते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'हम steht mit der Pluralform -ते हैं: हम मिलते हैं, „wir treffen uns“.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson03.choose.001
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'संदेश ist eine Nachricht, etwa eine SMS, mit der man etwas ausmacht: प्रिया, चलो शनिवार को फ़िल्म देखते हैं?'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson03.order.002
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: word_order
  frame:
    text: प्रिया, चलो शनिवार को {item} देखते हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया, चलो शनिवार को {item} देखते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: Beginnt man mit dem Namen, spricht man die Person direkt an; को nach शनिवार bedeutet „am Samstag“.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit11.lesson03.translate.003
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'सुझाव ist ein Vorschlag, den man jemandem macht, während विचार eine Idee oder ein Gedanke ist: अच्छा विचार है! heißt „Gute Idee!“.'
    language_code: de
    direction: ltr
