templates:
- content_key: practice.de-hi.hi.a1.unit07.lesson01.choose.001
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दुकानदार setzt sich aus दुकान (Laden) und -दार zusammen, einer häufigen Endung für eine Person, die etwas führt oder besitzt.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson01.listen.002
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कमीज़ und टोपी sind feminine Nomen, बैग dagegen ist maskulin.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson01.order.003
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: word_order
  frame:
    text: मुझे यह {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'यह (dieses) steht direkt vor dem Nomen, auf das es zeigt: मुझे यह कमीज़ चाहिए.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson01.fill.004
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: fill_in_blank
  frame:
    text: जी नहीं, {item} यह। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जी नहीं ist ein höfliches Nein; सिर्फ़ beschränkt die Bitte auf nur dies.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson01.match.005
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Hindi-Wörter für Geschäfte und Orte stehen hier ohne Artikel, daher kann बाज़ार „ein Markt“ oder „der Markt“ bedeuten.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson01.translate.006
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: Ich hätte gern dieses Hemd.
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए bleibt für alle Sprecher gleich, und यह zeigt auf das Nomen direkt danach.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson01.translate.007
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: In einem Hindi-Laden heißt die verkaufende Person दुकानदार und der Ort दुकान; der Markt selbst ist der बाज़ार.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson02.choose.001
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'सस्ता und महंगा verändern sich wie मेरा und मेरी: Feminine Nomen haben सस्ती und महंगी.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson02.order.002
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: word_order
  frame:
    text: यह टोपी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह टोपी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'टोपी ist feminin, deshalb endet das Adjektiv auf -ी: सस्ती oder महंगी.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson02.fill.003
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह कमीज़ बहुत {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कमीज़ ist feminin, deshalb heißt das Adjektiv महंगी und nicht महंगा.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson02.fill.004
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह बैग {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बैग ist maskulin, deshalb heißt das Adjektiv सस्ता und nicht सस्ती.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson02.translate.005
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 'Wie viel kostet dieses Hemd? (wörtlich: dieses Hemd ist von wie viel?)'
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: यह कमीज़ कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'का oder की in einer Preisfrage richtet sich nach der Sache, deren Preis erfragt wird, nicht nach कितने: कमीज़ ist feminin, also की.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson02.translate.006
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 'Wie viel kostet diese Tasche? (wörtlich: diese Tasche ist von wie viel?)'
    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह बैग कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 'का oder की in einer Preisfrage richtet sich nach der Sache, deren Preis erfragt wird: बैग ist maskulin, also का.'
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson03.listen.001
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: खरीदते हैं nach चलो ist ein Vorschlag, während खरीदना die Grundform „kaufen“ ist.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson03.order.002
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: word_order
  frame:
    text: ठीक है! {item} या टोपी?
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: ठीक है! {item} या टोपी?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: या verbindet die beiden Möglichkeiten; die Frage wird nur durch die steigende Stimme und das Fragezeichen angezeigt.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson03.fill.003
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: चलो, कुछ {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खरीदते mit हैं nach चलो bedeutet „lasst uns kaufen“; die Form auf -ते hängt nicht vom Geschlecht der Gruppe ab.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson03.fill.004
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: यह टोपी पाँच सौ रुपये {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: In यह टोपी पाँच सौ रुपये की है richtet sich की nach dem femininen Nomen टोपी.
    language_code: de
    direction: ltr
- content_key: practice.de-hi.hi.a1.unit07.lesson03.translate.005
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: translation
  frame:
    text: Lass uns etwas kaufen!
    language_code: de
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो plus ein Verb im Plural auf -ते mit हैं ist die übliche Form, einen Vorschlag zu machen.
    language_code: de
    direction: ltr
