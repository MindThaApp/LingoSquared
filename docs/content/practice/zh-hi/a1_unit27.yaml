        - w_नौकरी
        - w_होगा
        - w_कहूँ
        - w_मिलती
        - w_होगे
        - w_गर्व
        - w_ऐसा
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，出自“开心、难过还是生气？”这一课。'
    language_code: zh
    direction: ltr
