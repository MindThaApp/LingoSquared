- content_key: practice.zh-hi.hi.a1.unit27.lesson01.order.002
  lesson_content_key: hi.a1.unit27.lesson01.khush_udas_ya_naraz
  type: word_order
  frame:
    text: तुम {item} क्यों हो?
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: hi
      part_of_speech: adjective
      agreement_tags:
        semantic: w_खुश
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम {item} क्यों हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 你为什么开心？क्यों（“为什么”）放在主要词语之前：तुम खुश क्यों हो?。तुम 是非正式的“你”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit27.lesson02.order.002
  lesson_content_key: hi.a1.unit27.lesson02.tum_khush_kyon_ho
  type: word_order
  frame:
    text: तुम खुश {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: hi
      part_of_speech: adverb
      agreement_tags:
        semantic: w_क्यों
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम खुश {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 你为什么开心？क्यों（“为什么”）放在主要词语之前：तुम खुश क्यों हो?。तुम 是非正式的“你”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit27.lesson03.order.002
  lesson_content_key: hi.a1.unit27.lesson03.kisee_bat_ko_lekar
  type: word_order
  frame:
    text: वह {item} क्यों महसूस कर रहा है?
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: hi
      part_of_speech: adjective
      agreement_tags:
        semantic: w_नर्वस
  answer_derivation:
    kind: render_frame
    frame:
      text: वह {item} क्यों महसूस कर रहा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 他为什么感到紧张？क्यों 紧挨在动词短语之前：वह नर्वस क्यों महसूस कर रहा है?
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit27.lesson04.order.002
  lesson_content_key: hi.a1.unit27.lesson04.bhavnaon_ke_bare_men
  type: word_order
  frame:
    text: अर्जुन कैसा {item} कर रहा है?
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: hi
      part_of_speech: noun
      agreement_tags:
        semantic: w_महसूस
  answer_derivation:
    kind: render_frame
    frame:
      text: अर्जुन कैसा {item} कर रहा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 阿尔琼感觉怎么样？कैसा महसूस कर रहा है 的意思是“他感觉如何”。कैसा 随人物的性别变化，所以说女性时用 कैसी。
    language_code: zh
    direction: ltr
