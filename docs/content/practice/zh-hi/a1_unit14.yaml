    slot: item
  feedback_frame:
    text: नया 和 नई 分别是“新”的阳性和阴性形式;注意阴性结尾是 -ई,不是 -ी。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson02.order.002
