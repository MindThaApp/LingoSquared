templates:
- content_key: practice.zh-hi.hi.a1.unit14.lesson01.choose.001
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: लंबा 和 लंबी 是同一个形容词的阳性和阴性形式,就像 बड़ा 和 बड़ी。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson01.listen.002
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 形容词要与所描述的人保持一致:मेरा भाई लंबा है,मेरी बहन लंबी है。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson01.order.003
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: word_order
  frame:
    text: मेरा भाई {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरा भाई {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: भाई 是阳性,所以形容词用 -ा 形式 लंबा。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson01.order.004
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: word_order
  frame:
    text: मेरी बहन {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी बहन {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहन 是阴性,所以形容词用 -ी 形式 लंबी。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson01.fill.005
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: fill_in_blank
  frame:
    text: अर्जुन प्रिया से {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 被比较的人后面加 से,表示“比”,形容词与更高的那个人保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson01.fill.006
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这里说话的是女性,所以形容词以 -ी 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson01.translate.007
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: translation
  frame:
    text: 阿琼比普里亚高。(简单比较,没有表示“更”的词)
    language_code: zh
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: अर्जुन प्रिया से {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 被拿来比较的对象后面加 से,形容词与主语阿琼保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson01.translate.008
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: translation
  frame:
    text: 我姐姐/妹妹很高。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मेरी बहन {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 因为 बहन 是阴性,所以 मेरी 和形容词都以 -ी 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson01.translate.009
  lesson_content_key: hi.a1.unit14.lesson01.se_tulna
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 主语是阴性时,阳性的 -ा 结尾变为 -ी:लंबा 变成 लंबी。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson02.choose.001
  lesson_content_key: hi.a1.unit14.lesson02.vastu_tulna
  type: multiple_choice
  frame:
