    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बैग 后面的 से 表示“比”,形容词与阴性的 टोपी 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson02.fill.005
  lesson_content_key: hi.a1.unit14.lesson02.vastu_tulna
  type: fill_in_blank
  frame:
    text: बैग टोपी से {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 形容词与主语 बैग 保持一致,而不是与 से 后面的事物一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson02.translate.006
  lesson_content_key: hi.a1.unit14.lesson02.vastu_tulna
  type: translation
  frame:
    text: 帽子比包新。(简单比较,没有表示“更”的词)
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: टोपी बैग से {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 比较句中形容词跟随主语:टोपी 是阴性,所以用 नई。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson02.translate.007
  lesson_content_key: hi.a1.unit14.lesson02.vastu_tulna
  type: translation
  frame:
    text: 这个包是新的。
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह बैग {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नया 只有在像 टोपी 这样的阴性名词前才变成 नई。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit14.lesson02.translate.008
  lesson_content_key: hi.a1.unit14.lesson02.vastu_tulna
  type: translation
  frame:
