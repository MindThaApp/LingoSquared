    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: घर में तीन {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 数字大于一时，名词用复数，动词用 हैं。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit18.lesson01.fill.005
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
