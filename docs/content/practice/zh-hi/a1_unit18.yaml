templates:
- content_key: practice.zh-hi.hi.a1.unit18.lesson01.choose.001
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कमरा 是一个房间，कमरे 是多个房间；बाथरूम 和 बेडरूम 是外来词（借自英语），而 रसोई 是表示“厨房”的印地语本土词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit18.lesson01.listen.002
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 以 -ा 结尾的阳性名词，复数时变为 -े：कमरा → कमरे。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit18.lesson01.order.003
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: word_order
  frame:
    text: घर में एक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: घर में एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: एक 是数字“一”，同时也起到“一个”的作用：घर में एक रसोई है。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit18.lesson01.order.004
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: word_order
