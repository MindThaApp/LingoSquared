- content_key: practice.zh-hi.hi.a1.unit18.lesson01.translate.007
  lesson_content_key: hi.a1.unit18.lesson01.kamra_rasoi_bathroom_bedroom
  type: translation
  frame:
    text: 房子里有一个厨房。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: घर में एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 印地语先说地点：घर में，然后是数量，最后是事物。
    language_code: zh
    direction: ltr
