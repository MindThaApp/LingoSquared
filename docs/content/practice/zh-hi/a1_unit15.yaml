templates:
- content_key: practice.zh-hi.hi.a1.unit15.lesson01.choose.001
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाना 是动词原形，意思是“去”,而 मुझे ... जाना है 的意思是“我得去……”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson01.listen.002
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: टिकट、ट्रेन 和 प्लेटफ़ॉर्म 是日常印地语中使用的英语借词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson01.order.003
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: word_order
  frame:
    text: मुझे स्टेशन {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे स्टेशन {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... जाना है 表示“必须、需要”，和 चाहिए 一样，不随说话人的性别变化。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson01.order.004
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: word_order
  frame:
    text: मुझे दिल्ली का {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे दिल्ली का {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: का 把 दिल्ली 和阳性名词 टिकट 连接起来，意思是“德里的票”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson01.order.005
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: word_order
  frame:
    text: यह दिल्ली की {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह दिल्ली की {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की 是阴性形式，因为 ट्रेन 是阴性名词，所以这句话用 की 而不用 का。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson01.fill.006
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: fill_in_blank
  frame:
    text: मेरा {item} कहाँ है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: मेरा 是阳性形式，因为 टिकट 是阳性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson01.fill.007
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: fill_in_blank
  frame:
    text: मुझे स्टेशन {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 动词原形 जाना（去）与 है 连用，表示某事必须做。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson01.translate.008
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: translation
  frame:
    text: 我得去车站。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे स्टेशन {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 印地语字面上说的是“对我来说去是……”，所以说话人的性别不会改变动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson01.translate.009
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: translation
  frame:
    text: 我想要一张去德里的票。（印地语中没有对应“一张”的词）
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे दिल्ली का {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 印地语说“德里的票”，का 与阳性名词 टिकट 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson01.translate.010
  lesson_content_key: hi.a1.unit15.lesson01.station_jana
  type: translation
  frame:
    text: 这是去德里的火车。
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: यह दिल्ली की {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: की 与 ट्रेन 保持一致，ट्रेन 是阴性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson02.choose.001
  lesson_content_key: hi.a1.unit15.lesson02.platform_samay
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: प्लेटफ़ॉर्म 是印地语中使用的英语词“站台”，是阳性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson02.order.002
  lesson_content_key: hi.a1.unit15.lesson02.platform_samay
  type: word_order
  frame:
    text: ट्रेन {item} नंबर तीन से जाती है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ट्रेन {item} नंबर तीन से जाती है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: नंबर 放在 प्लेटफ़ॉर्म 之后，से 表示火车出发的地点。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson02.fill.003
  lesson_content_key: hi.a1.unit15.lesson02.platform_samay
  type: fill_in_blank
  frame:
    text: यह {item} बड़ा है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 形容词用 बड़ा，因为 प्लेटफ़ॉर्म 是阳性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson02.translate.004
  lesson_content_key: hi.a1.unit15.lesson02.platform_samay
  type: translation
  frame:
    text: 火车从三号站台出发。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: ट्रेन {item} नंबर तीन से जाती है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: से 表示火车出发的地点，जाती 与阴性名词 ट्रेन 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson03.listen.001
  lesson_content_key: hi.a1.unit15.lesson03.priya_arjun_station
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: हमें 是 मुझे 的 हम 形式：मुझे 是“对我”，हमें 是“对我们”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson03.order.002
  lesson_content_key: hi.a1.unit15.lesson03.priya_arjun_station
  type: word_order
  frame:
    text: प्रिया, {item} स्टेशन जाना है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया, {item} स्टेशन जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 以名字开头是称呼对方；हमें 则表示两个人都得去。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson03.fill.003
  lesson_content_key: hi.a1.unit15.lesson03.priya_arjun_station
  type: fill_in_blank
  frame:
    text: प्रिया, {item} स्टेशन जाना है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 当涉及不止一个人时，हमें 起 मुझे 的作用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit15.lesson03.translate.004
  lesson_content_key: hi.a1.unit15.lesson03.priya_arjun_station
  type: translation
  frame:
    text: Priya，我们得去车站。
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया, {item} स्टेशन जाना है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: हमें 的用法和 मुझे 一样，所以 जाना है 保持不变。
    language_code: zh
    direction: ltr
