templates:
- content_key: practice.zh-hi.hi.a1.unit09.lesson01.choose.001
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: जाओ、मुड़ो 和 गिनो 是非正式的命令式：以 -ो 结尾，用于 तुम。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson01.listen.002
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बाएँ 和 दाएँ 是表示方向的副词，因此不随性和数变化。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson01.match.003
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 印地语用“副词＋动词”来指路：सीधे जाओ 字面是“直走”，बाएँ मुड़ो 是“向左转”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson01.order.004
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: word_order
  frame:
    text: यहाँ से {item} जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: यहाँ 后面的 से 表示“从”：यहाँ से 就是“从这里”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson01.order.005
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: word_order
  frame:
    text: फिर {item} मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर {item} मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 印地语把方向放在动词前面：बाएँ मुड़ो 字面是“向左 转”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson01.fill.006
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: fill_in_blank
  frame:
    text: यहाँ से सीधे {item}। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जाओ 是 जाना 的非正式命令式；正式场合会用不同的词尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson01.translate.007
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: translation
  frame:
    text: 从这里直走。（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: जाओ 是对 तुम 使用的命令式；动词放在最后，在方向之后。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson01.translate.008
  lesson_content_key: hi.a1.unit09.lesson01.seedhe_baaen_daaen
  type: translation
  frame:
    text: 然后向右转。（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर {item} मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुड़ो 是 मुड़ना（转弯）的非正式命令式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson02.choose.001
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: तक 表示“到……为止”或“直到”，例如 बैंक तक सीधे जाओ，意思是一直走到银行。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson02.order.002
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: word_order
  frame:
    text: बैंक {item} सीधे जाओ।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक {item} सीधे जाओ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: तक 标明移动的终点，紧跟在地点之后。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson02.order.003
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: word_order
  frame:
    text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: पहले 和 फिर 表示“先”和“然后”，所以步骤的顺序与词语的顺序一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson02.fill.004
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: fill_in_blank
  frame:
    text: स्कूल कैसे {item}? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जाऊँ 是 जाना 表示“我该……吗”的形式，所以 स्कूल कैसे जाऊँ? 问的是“我该怎么去学校？”
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson02.translate.005
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: translation
  frame:
    text: 去银行怎么走？
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: बैंक कैसे {item}?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: जाऊँ 用于就自己的行动征求建议：我该怎么走？
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson02.translate.006
  lesson_content_key: hi.a1.unit09.lesson02.yahan_se_kaise_jaun
  type: translation
  frame:
    text: 从这里先直走，然后向左转。（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: यहाँ से {item} सीधे जाओ, फिर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: पहले 是“先”，फिर 是“然后”；这两个命令都以 -ो 结尾，因为用的是 तुम。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson03.choose.001
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 地点后面的 पर 表示“在”：नुक्कड़ पर 就是“在拐角处”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson03.order.002
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: word_order
  frame:
    text: फिर बैंक के {item} पर बाएँ मुड़ो।
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर बैंक के {item} पर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: के 把 बैंक 和拐角连起来，然后 पर 把转弯的位置定在那个拐角。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit09.lesson03.translate.003
  lesson_content_key: hi.a1.unit09.lesson03.priya_arjun_rasta_poochna
  type: translation
  frame:
    text: 然后在银行的拐角处向左转。（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: फिर बैंक के {item} पर बाएँ मुड़ो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 印地语先说参照地点（बैंक के नुक्कड़ पर），再说方向，最后是动词。
    language_code: zh
    direction: ltr
