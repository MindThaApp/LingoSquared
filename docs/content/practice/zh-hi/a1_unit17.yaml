templates:
- content_key: practice.zh-hi.hi.a1.unit17.lesson01.choose.001
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: शिक्षक指男老师，शिक्षिका指女老师；इंजीनियर男女通用。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson01.listen.002
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 有些印地语职业词有单独的阴性形式，如 शिक्षक 和 शिक्षिका；而像 इंजीनियर 这样的外来词则没有。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson01.order.003
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: मैं {item} हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: “老师”一词随说话人的性别而变：男性用 शिक्षक，女性用 शिक्षिका。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson01.order.004
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: word_order
  frame:
    text: प्रिया {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: प्रिया 是女性，所以她是 शिक्षिका。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson01.fill.005
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: fill_in_blank
  frame:
    text: मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: शिक्षिका 用 -इका 构成阴性，这一模式见于多个来自梵语的借词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson01.fill.006
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: fill_in_blank
  frame:
    text: अर्जुन {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: इंजीनियर 对男性和女性都是同一个词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson01.translate.007
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: 我是老师。（女性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 女性说 शिक्षिका；男性则说 शिक्षक。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson01.translate.008
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: 我是老师。（男性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 男性说 शिक्षक；女性则说 शिक्षिका。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson01.translate.009
  lesson_content_key: hi.a1.unit17.lesson01.shikshak_shikshika_engineer
  type: translation
  frame:
    text: 我是工程师。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: इंजीनियर 不随性别变化，印地语也没有相当于“一个”的冠词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson02.choose.001
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दफ़्तर 是阳性名词，意为办公室，后面加 में 表示“在办公室里”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson02.order.002
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: word_order
  frame:
    text: मैं {item} में काम करता हूँ।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 地点后面的 में 表示“在”，地点放在动词之前。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson02.fill.003
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: fill_in_blank
  frame:
    text: अर्जुन {item} में काम करता है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: काम करना 的意思是“工作”，工作地点后面要加 में。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson02.translate.004
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: 我在办公室工作。（男性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: मैं {item} में काम करता हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 印地语没有相当于“一个”的冠词，地点放在 काम करता हूँ 之前。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson02.translate.005
  lesson_content_key: hi.a1.unit17.lesson02.school_aspatal_daftar
  type: translation
  frame:
    text: 阿琼在办公室工作。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: अर्जुन {item} में काम करता है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 主语是人名时，动词以 है 结尾，而不是 हूँ；-ता 表示阿琼是男性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson03.choose.001
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: तुम रोज़ दफ़्तर जाते हो 中的 जाते 是对男性使用 तुम 时的 -ते 形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson03.order.002
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: word_order
  frame:
    text: तुम रोज़ दफ़्तर {item} हो?
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 对男性说话用 तुम 时，动词以 -ते 结尾，后面接 हो。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson03.fill.003
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: fill_in_blank
  frame:
    text: तुम रोज़ दफ़्तर {item} हो? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 是非问句可以用 क्या 开头，但它不是必需的，仅靠上扬的语调就足够了。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit17.lesson03.translate.004
  lesson_content_key: hi.a1.unit17.lesson03.priya_arjun_kaam
  type: translation
  frame:
    text: 你每天都去办公室。（非正式，对男性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: तुम रोज़ दफ़्तर {item} हो।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 对男性用 तुम 时，动词以 -ते 结尾，后面接 हो。
    language_code: zh
    direction: ltr
