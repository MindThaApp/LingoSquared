templates:
- content_key: practice.zh-hi.hi.a1.unit13.lesson01.choose.001
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: पसंद है 的意思是“令人喜欢”:मुझे चाय पसंद है 就是“我喜欢茶”,用的是 मुझे 而不是 मैं。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson01.listen.002
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: है 用于一个事物，हैं 用于多个事物：किताब पसंद है,किताबें पसंद हैं。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson01.order.003
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 印地语没有冠词，被喜欢的东西放在 मुझे 和 पसंद 之间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson01.order.004
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: word_order
  frame:
    text: मुझे {item} पसंद हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 这里动词用 हैं,因为 किताबें 是复数：पसंद है 变成 पसंद हैं。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson01.fill.005
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पसंद 在印地语中不是动词，而是与 है 搭配使用的词，所以句子的构造类似“对我来说茶是被喜欢的”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson01.fill.006
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: fill_in_blank
  frame:
    text: मुझे {item} पसंद हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 被喜欢的东西是复数时，पसंद 后面用 हैं。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson01.translate.007
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: 我喜欢音乐。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 喜欢的人放在 मुझे 的位置，音乐是令人喜欢的事物。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson01.translate.008
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: 我喜欢书。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे {item} पसंद हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: किताबें 是复数，所以动词是 हैं,不是 है。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson01.translate.009
  lesson_content_key: hi.a1.unit13.lesson01.pasand_hai
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 单数 किताब 和复数 किताबें 只差词尾 -ें,这个词尾是这个阴性名词的复数标记。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson02.choose.001
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: खेल 既可指运动也可指游戏，ज़्यादा 表示“更”:मुझे चाय ज़्यादा पसंद है 就是“我更喜欢茶”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson02.order.002
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: word_order
  frame:
    text: मुझे यह {item} पसंद है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: यह(这个)直接放在它所指的名词前，如 यह खेल。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson02.fill.003
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: fill_in_blank
  frame:
    text: मुझे चाय {item} पसंद है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ज़्यादा 放在 पसंद 前，表示两者中更喜欢哪一个。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson02.translate.004
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: 我喜欢这项运动。
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: है 与被喜欢的事物(一项运动)保持一致，而不是与喜欢的人一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson02.translate.005
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: 我更喜欢茶。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे चाय {item} पसंद है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 印地语的字面意思是“茶对我来说更令人喜欢”,ज़्यादा 就放在 पसंद 前面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit13.lesson02.translate.006
  lesson_content_key: hi.a1.unit13.lesson02.tumhein_kya_pasand
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खेल(运动或游戏)是阳性名词，而 ज़्यादा(更)的形式不会变化。
    language_code: zh
    direction: ltr
