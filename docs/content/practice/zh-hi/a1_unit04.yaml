templates:
- content_key: practice.zh-hi.hi.a1.unit04.lesson01.choose.001
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बजे（点钟）跟在数字后面；只有说“现在一点”时才用 एक बजा है，而“在一点”仍然是 एक बजे。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson02.listen.001
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 印地语把一天分为 सुबह、दोपहर、शाम 和 रात；没有表示上午或下午的单一词语。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson03.choose.001
  lesson_content_key: hi.a1.unit04.lesson03.agli_class_ka_samay
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कल 既表示明天也表示昨天，要靠动词的时态来判断是哪一个。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson02.match.002
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 表示时段的名词有阴性也有阳性，前面不带冠词；सुबह、शाम 和 रात 都是阴性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson01.order.002
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: word_order
  frame:
    text: अभी पाँच {item} हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी पाँच {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 报时时，除了一点以外，每个整点都用 बजे 加复数动词：पाँच बजे हैं，但是 एक बजा है。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson01.order.003
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: word_order
  frame:
    text: अभी एक {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 只有一点钟用单数的 बजा 和单数的 है：एक बजा है。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson02.order.003
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: word_order
  frame:
    text: क्लास {item} सात बजे है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: क्लास {item} सात बजे है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 时段直接放在钟点前面，中间不加别的词：सुबह सात बजे。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson01.fill.004
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: fill_in_blank
  frame:
    text: क्लास {item} बजे है? ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कितने बजे है? 是询问某事几点发生的日常说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson01.fill.005
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: fill_in_blank
  frame:
    text: अभी पाँच {item} हैं। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 表示“现在是……点”时，从两点到十二点都用 बजे हैं；बजे 也可以表示“在……点”，如 सुबह सात बजे。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson03.fill.002
  lesson_content_key: hi.a1.unit04.lesson03.agli_class_ka_samay
  type: fill_in_blank
  frame:
    text: ठीक है, {item} मिलते हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ठीक है, कल मिलते हैं 字面意思是“好，明天我们见面”；印地语常用现在时来表示不久的将来。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson01.translate.006
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: translation
  frame:
    text: 现在几点？
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} बजे हैं?'
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 报时时，把数字放在 बजे 前面：अभी पाँच बजे हैं。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson02.translate.004
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: translation
  frame:
    text: 下一节课在傍晚五点。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: अगली क्लास {item} पाँच बजे है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: अगली 与阴性名词 क्लास 保持一致，所以以 -ी 结尾，而不是 -ा。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson01.translate.007
  lesson_content_key: hi.a1.unit04.lesson01.kitne_baje_hain
  type: translation
  frame:
    text: 现在一点。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: अभी एक {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 一点钟是唯一用单数动词的整点：एक बजा है，但是 दो बजे हैं。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit04.lesson02.translate.005
  lesson_content_key: hi.a1.unit04.lesson02.din_ka_samay
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 印地语没有单独表示正午的词：दोपहर 涵盖中午和下午。
    language_code: zh
    direction: ltr
