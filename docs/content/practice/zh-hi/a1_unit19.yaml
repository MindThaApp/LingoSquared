templates:
- content_key: practice.zh-hi.hi.a1.unit19.lesson01.choose.001
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: मौसम是阳性名词,所以问句是 आज मौसम कैसा है?,用 कैसा 而不是 कैसी。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson01.listen.002
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: धूप、बारिश、हवा 等天气词直接加 है:आज धूप है 的意思是“今天是晴天”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson01.order.003
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 印地语直接说出天气名词,再加 है,不需要对应“有”或“是”的其他词:आज धूप है。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson01.order.004
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: word_order
  frame:
    text: आज {item} कैसा है?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} कैसा है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: कैसा 与阳性名词 मौसम 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson01.fill.005
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: fill_in_blank
  frame:
    text: आज {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: धूप 是阴性名词,但指单个事物时 है 形式不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson01.translate.006
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: 今天天气晴朗。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 印地语用名词 धूप 加 है 来表达“晴天”,而不用形容词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson01.translate.007
  lesson_content_key: hi.a1.unit19.lesson01.mausam_dhoop_baarish_hawa
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 印地语用名词来表示天气:धूप 是阳光,बारिश 是雨,हवा 是风。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson02.choose.001
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: गर्म 对所有名词都不变,但 ठंडा 会变化:阳性用 ठंडा,阴性用 ठंडी。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson02.match.002
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 天气形容词:गर्म 不随性变化,但 ठंडा 和 ठंडी 会变化。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson02.order.003
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: word_order
  frame:
    text: आज मौसम बहुत {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम बहुत {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मौसम 是阳性,所以 ठंडा 和 बुरा 用 -ा 形式,而 गर्म 永远不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson02.order.004
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: word_order
  frame:
    text: आज हवा {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: आज हवा {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: हवा(风)是阴性,所以形容词以 -ी 结尾:ठंडी हवा。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson02.fill.005
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: fill_in_blank
  frame:
    text: आज मौसम {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: मौसम 是阳性,所以形容词以 -ा 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson02.translate.006
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: 今天天气很热。
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 无论修饰哪个名词,गर्म 都保持不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson02.translate.007
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: 今天有云。
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: आज {item} हैं।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 这里 बादल 用复数,所以动词是 हैं。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson02.translate.008
  lesson_content_key: hi.a1.unit19.lesson02.garam_thanda_baadal
  type: translation
  frame:
    text: 今天天气很冷。
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: आज मौसम बहुत {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: बहुत 放在形容词前面,ठंडा 与 मौसम 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson03.choose.001
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बाहर 的意思是“外面”,चलो, बाहर जाते हैं! 是提议一起出去。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson03.fill.002
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: fill_in_blank
  frame:
    text: चलो, {item} जाते हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id014
    hint: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बाहर 是副词,所以不随性和数变化。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit19.lesson03.translate.003
  lesson_content_key: hi.a1.unit19.lesson03.priya_arjun_kal_ka_mausam
  type: translation
  frame:
    text: 我们出去吧!
    language_code: zh
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, {item} जाते हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो 加上 -ते 结尾的动词和 हैं,是提议一起做某事的常用说法。
    language_code: zh
    direction: ltr
