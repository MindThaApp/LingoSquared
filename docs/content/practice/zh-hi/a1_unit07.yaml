templates:
- content_key: practice.zh-hi.hi.a1.unit07.lesson01.choose.001
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: दुकानदार 由 दुकान(商店)加 -दार 构成,-दार 是常见的词尾,表示经营或拥有某物的人。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson01.listen.002
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: कमीज़ 和 टोपी 是阴性名词,而 बैग 是阳性名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson01.order.003
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: word_order
  frame:
    text: मुझे यह {item} चाहिए।
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: यह(这)紧贴在它所指的名词前面:मुझे यह कमीज़ चाहिए.
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson01.fill.004
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: fill_in_blank
  frame:
    text: जी नहीं, {item} यह। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: जी नहीं 是礼貌的“不”;सिर्फ़ 把要求限定为“只要这个”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson01.match.005
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 印地语的商店类词语前不用冠词,所以 बाज़ार 既可以指“一个市场”,也可以指“这个市场”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson01.translate.006
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: 我想要这件衬衫。
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: मुझे यह {item} चाहिए।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: मुझे ... चाहिए 对所有说话人都一样,而 यह 指的是紧跟在它后面的名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson01.translate.007
  lesson_content_key: hi.a1.unit07.lesson01.dukaan_mein
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在印地语的商店里,卖东西的人是 दुकानदार,店铺是 दुकान;市场本身是 बाज़ार。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson02.choose.001
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: सस्ता 和 महंगा 的变化方式像 मेरा 和 मेरी:阴性名词用 सस्ती 和 महंगी。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson02.order.002
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: word_order
  frame:
    text: यह टोपी {item} है।
    language_code: hi
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: यह टोपी {item} है।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: टोपी 是阴性名词,所以形容词以 -ी 结尾:सस्ती 或 महंगी。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson02.fill.003
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह कमीज़ बहुत {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कमीज़ 是阴性名词,所以形容词用 महंगी,而不是 महंगा。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson02.fill.004
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: fill_in_blank
  frame:
    text: यह बैग {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: बैग 是阳性名词,所以形容词用 सस्ता,而不是 सस्ती。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson02.translate.005
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 这件衬衫多少钱?(字面意思:这件衬衫是多少的?)
    language_code: zh
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: यह कमीज़ कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 问价格时,का 或 की 要与被问价的东西一致,而不是与 कितने 一致:कमीज़ 是阴性,所以用 की。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson02.translate.006
  lesson_content_key: hi.a1.unit07.lesson02.keemat_aur_matra
  type: translation
  frame:
    text: 这个包多少钱?(字面意思:这个包是多少的?)
    language_code: zh
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: यह बैग कितने {item} है?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 问价格时,का 或 की 要与被问价的东西一致:बैग 是阳性,所以用 का。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson03.listen.001
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: चलो 后面的 खरीदते हैं 表示提议“我们买吧”,而 खरीदना 是“买”的词典形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson03.order.002
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: word_order
  frame:
    text: ठीक है! {item} या टोपी?
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: ठीक है! {item} या टोपी?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: या 连接两个选项,疑问只靠上扬的语调和问号来表达。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson03.fill.003
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: चलो, कुछ {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: खरीदते 加 हैं 跟在 चलो 后面,意思是“我们买吧”;-ते 形式与这群人的性别无关。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson03.fill.004
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: fill_in_blank
  frame:
    text: यह टोपी पाँच सौ रुपये {item} है। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 यह टोपी पाँच सौ रुपये की है 中,की 与阴性名词 टोपी 一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit07.lesson03.translate.005
  lesson_content_key: hi.a1.unit07.lesson03.priya_aur_arjun_ki_khareedari
  type: translation
  frame:
    text: 我们去买点东西吧！
    language_code: zh
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, कुछ {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: चलो 加上复数的 -ते 动词再配 हैं,是提出建议的常用说法。
    language_code: zh
    direction: ltr
