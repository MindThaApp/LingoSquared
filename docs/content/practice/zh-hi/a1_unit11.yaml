templates:
- content_key: practice.zh-hi.hi.a1.unit11.lesson01.choose.001
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: चलो 加上 -ते 动词和 हैं，表示提议一起做某事：चलो, फ़िल्म देखते हैं!
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson01.listen.002
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: listen_select
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: साथ 意为“一起”或“和……在一起”，提议中常常用到它：चलो, साथ चाय पीते हैं!
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson01.order.003
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, {item} देखते हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, {item} देखते हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: फ़िल्म 是阴性名词，但提议形式 -ते हैं 不随它变化。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson01.order.004
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: word_order
  frame:
    text: चलो, साथ चाय {item} हैं!
    language_code: hi
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, साथ चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 提议形式是 -ते 动词加 हैं，意思是“咱们……吧”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson01.fill.005
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: अच्छा {item} है! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: अच्छा विचार है 是接受提议的常用说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson01.fill.006
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: fill_in_blank
  frame:
    text: चलो, फ़िल्म {item} हैं! ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: देखते 是 -ते 形式，与 हैं 连用表示“我们看”，在 चलो 之后则表示“咱们看……吧”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson01.translate.007
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: 我们喝茶吧！
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: चलो, चाय {item} हैं!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 印地语的“咱们……吧”是 चलो 加动词的 -ते हैं 形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson01.translate.008
  lesson_content_key: hi.a1.unit11.lesson01.prastaav_aur_sweekriti
  type: translation
  frame:
    text: 好主意！（完整句子：是个好主意）
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: अच्छा {item} है!
      language_code: hi
      direction: ltr
  feedback_frame:
    text: विचार 是阳性名词，所以形容词用 अच्छा。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson02.choose.001
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: माफ़ करना 是非正式的“抱歉”或“打扰了”，用于称呼为 तुम 的人。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson02.match.002
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: hi
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 印地语中礼貌拒绝的用语有：माफ़ करना 表示“抱歉”，व्यस्त 表示“忙”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson02.fill.003
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: fill_in_blank
  frame:
    text: माफ़ करना, मैं {item} हूँ। ({hint})
    language_code: hi
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 说完 माफ़ करना 之后，再说明自己的情况，比如很忙。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson02.translate.004
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: 抱歉，我很忙。（非正式）
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: माफ़ करना, मैं {item} हूँ।
      language_code: hi
      direction: ltr
  feedback_frame:
    text: माफ़ करना 是非正式的致歉说法；व्यस्त 对男性和女性都不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson02.translate.005
  lesson_content_key: hi.a1.unit11.lesson02.hum_kab_milte_hain
  type: translation
  frame:
    text: 那我们什么时候见面？
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: तो {item} कब मिलते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: हम 搭配复数的 -ते हैं 形式：हम मिलते हैं，意为“我们见面”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson03.choose.001
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: संदेश 是“消息”，比如用来约定计划的短信：प्रिया, चलो शनिवार को फ़िल्म देखते हैं?
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson03.order.002
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: word_order
  frame:
    text: प्रिया, चलो शनिवार को {item} देखते हैं?
    language_code: hi
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: प्रिया, चलो शनिवार को {item} देखते हैं?
      language_code: hi
      direction: ltr
  feedback_frame:
    text: 以名字开头是直接称呼对方；शनिवार 后面的 को 表示“在星期六”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-hi.hi.a1.unit11.lesson03.translate.003
  lesson_content_key: hi.a1.unit11.lesson03.priya_arjun_yojana
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: सुझाव 是你向别人提出的建议，而 विचार 是想法或念头：अच्छा विचार है! 的意思是“好主意！”
    language_code: zh
    direction: ltr
