templates:
- content_key: practice.hi-pl.pl.a1.unit04.lesson01.choose.001
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: घड़ी के घंटों के लिए स्त्रीलिंग क्रमसूचक संख्याएँ (pierwsza, druga, trzecia) आती हैं, क्योंकि वे अनकहे शब्द godzina के अनुसार चलती हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson01.listen.002
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: घड़ी का समय बताने के लिए पोलिश में pierwsza, druga, trzecia कहा जाता है, pierwszy, drugi, trzeci नहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson01.translate.003
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'घंटे क्रमसूचक संख्याएँ हैं: pierwsza का शाब्दिक अर्थ "पहली" है, इसलिए एक बजे का अर्थ है "पहला घंटा"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson01.order.004
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: word_order
  frame:
    text: Która jest godzina? Jest {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Która jest godzina? Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Która jest godzina? का उत्तर बस Jest + घंटा है, जिसमें स्त्रीलिंग क्रमसूचक संख्या आती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson01.fill.005
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: fill_in_blank
  frame:
    text: Która jest {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Która jest godzina? समय पूछने का मानक तरीका है; która स्त्रीलिंग है क्योंकि godzina स्त्रीलिंग है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson01.translate.006
  lesson_content_key: pl.a1.unit04.lesson01.ktora_godzina
  type: translation
  frame:
    text: तीन बजे हैं। (दो शब्द)
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jest {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: घड़ी का घंटा स्त्रीलिंग क्रमसूचक संख्या होता है, इसलिए तीन बजे के लिए trzecia आता है, trzy नहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson02.choose.001
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rano का अर्थ सुबह, wieczorem का शाम को और w nocy का रात में है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson02.listen.002
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ewa wstaje o siódmej rano में पहले घंटा आता है और उसके बाद दिन का हिस्सा।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson02.translate.003
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje और odjeżdża अन्य पुरुष एकवचन के रूप हैं, जिनका अंत -m पर नहीं, बल्कि -e या -a पर होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson02.match.004
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Rano (सुबह) और wieczorem (शाम को) के साथ पूर्वसर्ग नहीं लगता, लेकिन दोपहर और रात के लिए w południe और w nocy आते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson02.order.005
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: word_order
  frame:
    text: Ewa wstaje o siódmej {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ewa wstaje o siódmej {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ewa wstaje o siódmej rano में पहले घंटा आता है, फिर दिन का हिस्सा।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson02.order.006
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: word_order
  frame:
    text: Pociąg odjeżdża o czwartej po {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg odjeżdża o czwartej po {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Po południu का अर्थ दोपहर बाद है, जबकि ठीक दोपहर के लिए w południe आता है, जिसका अंत अलग है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson02.fill.007
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: fill_in_blank
  frame:
    text: Ewa {item} o siódmej rano. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Wstaje क्रिया का अन्य पुरुष रूप है, इसीलिए यह Ewa के साथ ठीक बैठता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson02.translate.008
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: किस समय? (तीन शब्द)
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: O której {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: O której godzinie का अर्थ "किस समय" है, और दोनों शब्द वही अंत लेते हैं जो o के बाद आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson02.translate.009
  lesson_content_key: pl.a1.unit04.lesson02.o_ktorej_godzinie
  type: translation
  frame:
    text: ट्रेन दोपहर बाद चार बजे छूटती है।
    language_code: hi
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: render_frame
    frame:
      text: Pociąg {item} o czwartej po południu.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'o के बाद घंटे का अंत बदलता है: czwarta बनता है o czwartej।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson03.order.001
  lesson_content_key: pl.a1.unit04.lesson03.ustalamy_godzine_spotkania
  type: word_order
  frame:
    text: Dobrze, {item} o czwartej po południu?
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może का अर्थ "शायद" है और यह सुझाव को नरम बनाता है, जैसे "शायद चार बजे?"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit04.lesson03.translate.002
  lesson_content_key: pl.a1.unit04.lesson03.ustalamy_godzine_spotkania
  type: translation
  frame:
    text: ठीक है, शायद दोपहर बाद चार बजे?
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Dobrze, {item} o czwartej po południu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Może प्रस्ताव को विनम्र सुझाव बना देता है, जैसे Może o czwartej? में।
    language_code: hi
    direction: ltr
