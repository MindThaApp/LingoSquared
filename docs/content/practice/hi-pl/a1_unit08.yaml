  feedback_frame:
    text: पोलिश में जगहों के नामों के साथ "एक" या "वह" जैसा कोई अतिरिक्त शब्द नहीं लगता, इसलिए bank का मतलब "एक बैंक" भी हो सकता है और "वह बैंक" भी।
