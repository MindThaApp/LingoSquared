  feedback_frame:
    text: 'हर पोलिश संज्ञा का एक लिंग होता है: chleb और ser पुल्लिंग हैं, kawa, herbata और woda स्त्रीलिंग हैं, और masło और mleko नपुंसकलिंग हैं।'
    language_code: hi
    direction: ltr
