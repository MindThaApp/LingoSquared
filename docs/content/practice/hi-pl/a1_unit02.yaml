templates:
- content_key: practice.hi-pl.pl.a1.unit02.lesson01.choose.001
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: पोलिश में एक से दस तक की संख्याओं को जोड़ने वाला कोई नियम नहीं है, इसलिए हर शब्द अलग से याद करना पड़ता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson01.listen.002
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: पोलिश में sz की ध्वनि हिंदी के "श" जैसी और cz की ध्वनि "च" जैसी होती है, इसलिए sześć और cztery इन्हीं ध्वनियों से शुरू होते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson01.translate.003
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: pięć, sześć, dziewięć और dziesięć के अंत का ć एक कोमल "च" जैसी ध्वनि है; वर्तनी में इस चिह्न का ध्यान रखना ज़रूरी है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson01.match.004
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Pięć, sześć, dziewięć और dziesięć अक्षर ć पर समाप्त होते हैं, जबकि siedem और osiem नहीं, इसलिए हर वर्तनी पर ध्यान दीजिए।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson01.order.005
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: word_order
  frame:
    text: Mam {item} lat.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} lat.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mam + संख्या + lat से अपनी उम्र बताई जाती है, जैसे Mam trzydzieści lat।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson02.listen.001
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ile का अर्थ "कितना" या "कितने" है, और कीमत पूछते समय इसके साथ क्रिया kosztuje आती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson02.choose.002
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ग्यारह से उन्नीस के बीच की संख्याएँ jedenaście, dwanaście और piętnaście -naście पर समाप्त होती हैं, यही उनकी पहचान है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson02.translate.003
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कीमत के लिए Ile का अर्थ "कितना" है और गिनी जाने वाली चीज़ों के लिए "कितने"।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson02.order.004
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: To kosztuje {item} złotych.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje {item} złotych.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: pięć, dwanaście या trzydzieści जैसी संख्याओं के बाद złotych आता है, जबकि dwa, trzy और cztery के साथ złote आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson02.fill.005
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: To kosztuje dwadzieścia {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Złotych वह रूप है जो pięć, dwadzieścia, pięćdziesiąt जैसी संख्याओं के बाद आता है; dwa, trzy और cztery के साथ złote आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson02.translate.006
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: यह कितने का है?
    language_code: hi
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile to kosztuje? कीमत पूछने का मानक प्रश्न है, जिसमें to का अर्थ "यह" है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson03.choose.001
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pana किसी पुरुष के लिए औपचारिक "आपका" है (pana numer), जबकि twój अनौपचारिक "तुम्हारा" है (twój numer)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson03.translate.002
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Numer telefonu का शाब्दिक अर्थ "फ़ोन का नंबर" है, और दूसरा शब्द "फ़ोन" वाले शब्द का बदला हुआ रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson03.order.003
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: Jaki jest {item} numer telefonu?
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest {item} numer telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój अनौपचारिक "तुम्हारा" है और pana किसी पुरुष के लिए औपचारिक "आपका"; numer telefonu से पहले इनमें से कोई भी आ सकता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson03.fill.004
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: Ile masz {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lat, pięć, dwadzieścia या trzydzieści जैसी संख्याओं के बाद आता है; lata, dwa, trzy, cztery और इन पर समाप्त होने वाली संख्याओं के बाद आता है, जैसे trzydzieści dwa lata।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson03.translate.005
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: मेरी उम्र बत्तीस साल है।
    language_code: hi
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam trzydzieści dwa {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: क्योंकि संख्या dwa पर समाप्त होती है, "साल" के लिए lat की जगह lata आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit02.lesson03.translate.006
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: तुम्हारा फ़ोन नंबर क्या है? (अनौपचारिक; jest का प्रयोग कीजिए)
    language_code: hi
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest twój {item} telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój अनौपचारिक "तुम्हारा" है; किसी पुरुष के लिए औपचारिक रूप है Jaki jest pana numer telefonu?
    language_code: hi
    direction: ltr
