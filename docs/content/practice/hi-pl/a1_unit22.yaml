- content_key: practice.hi-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'मैं किससे बात कर रहा हूँ? Z kim rozmawiam? (शाब्दिक अर्थ: ''किसके साथ मैं बात कर रहा हूँ?'') अनजान फ़ोन करने वाले से पूछने का सामान्य वाक्य है; kim, z के बाद आने वाला साधन कारक रूप है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: क्या आप इसे दोहरा सकते हैं? Możesz (क्या तुम सकते हो, móc से) + क्रिया का मूल रूप powtórzyć (दोहराना) + to (यह)।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: कृपया इतनी तेज़ मत बोलिए। Nie mów निषेधात्मक आज्ञार्थ रूप है (मत बोलो); tak szybko का अर्थ है 'इतनी तेज़'।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: मुझे तुम्हारी आवाज़ ठीक से नहीं आ रही।
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: मुझे आपकी आवाज़ ठीक से सुनाई नहीं दे रही। Nie słyszę cię dobrze सुनने की समस्या बताता है; cię, ty का कर्म कारक रूप है और dobrze का अर्थ 'अच्छी तरह' है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'आपकी पहली शिफ़्ट कैसी रही? Jak ci poszła ...? (शाब्दिक अर्थ: ''तुम्हारे लिए ... कैसे गई?'') किसी बीती बात के बारे में पूछता है। Ci, ty का संप्रदान कारक रूप है, और poszła स्त्रीलिंग संज्ञा zmiana के अनुसार बना है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'उसकी पहली शिफ़्ट सच में बहुत अच्छी रही। Jego (उसका) कभी नहीं बदलता और संज्ञा से पहले आता है: jego pierwsza zmiana; स्त्रीलिंग संज्ञा का इस पर कोई असर नहीं पड़ता।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: यह सच में बहुत अच्छा रहा, मेरी सोच से भी बेहतर।
    language_code: hi
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: यह सच में बहुत अच्छा रहा, मेरी सोच से भी बेहतर। Poszło, iść का भूतकाल रूप है जिसमें अंत -o ('यह') है; यहाँ अर्थ 'नतीजा निकलना' है। Myślałem, myśleć (सोचना) का भूतकाल है, जिसमें पुरुष वक्ता वाला अंत है।
    language_code: hi
    direction: ltr
