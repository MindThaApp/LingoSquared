    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Spotkanie jest piętnastego {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: तारीख़ में दिन का अंत -ego होता है और महीने में -a लगता है, सिवाय फ़रवरी के लिए lutego के।
    language_code: hi
    direction: ltr
