    - sixth
  feedback_frame:
    text: कुछ महीनों के नाम -eń पर समाप्त होते हैं (styczeń, kwiecień, sierpień, wrzesień), जिससे उन्हें पहचानना आसान हो जाता है।
    language_code: hi
    direction: ltr
