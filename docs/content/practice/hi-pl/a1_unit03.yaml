templates:
- content_key: practice.hi-pl.pl.a1.unit03.lesson01.choose.001
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: पोलिश में सप्ताह के दिनों और महीनों के नाम छोटे अक्षर से शुरू होने वाले रूप में लिखे जाते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit03.lesson01.translate.002
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Środa, sobota और niedziela के अंत में -a आता है, जबकि बाकी चार वार व्यंजन पर समाप्त होते हैं; w + वार वाले वाक्यांश में यह अंतर मायने रखता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit03.lesson01.match.003
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Dziś का अर्थ है आज, और tygodnia सप्ताह के लिए शब्द का बदला हुआ रूप है, जैसे dzień tygodnia में।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit03.lesson01.order.004
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: W {item} idę do kina.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: W {item} idę do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: w (को) के साथ poniedziałek, czwartek और piątek का रूप वही रहता है, पर wtorek उच्चारण में आसानी के लिए we wtorek बन जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit03.lesson01.fill.005
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: fill_in_blank
  frame:
    text: W {item} idę do kina. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Idę do kina का अर्थ है मैं सिनेमा जा रहा/रही हूँ, और w + सप्ताह का दिन उस दिन "को" बताता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit03.lesson01.order.006
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: Jaki dziś jest dzień {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki dziś jest dzień {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dzień tygodnia का अर्थ है सप्ताह का दिन, और दूसरे शब्द का अंत बदलकर tygodnia हो जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit03.lesson02.choose.001
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: पोलिश में महीनों के नामों के आगे कोई उपसर्ग या articles जैसा शब्द नहीं आता, और उन्हें बड़े अक्षर से शुरू करना ज़रूरी नहीं है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit03.lesson02.listen.002
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: बोली जाने वाली तारीख़ में पहले दिन आता है, जिसका अंत -ego होता है, फिर महीना अपने तारीख़ वाले रूप में, जो आमतौर पर -a पर समाप्त होता है (dziesiątego maja), पर फ़रवरी के लिए lutego आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit03.lesson02.translate.003
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
