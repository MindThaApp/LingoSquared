    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: पोलिश में महीनों के नाम बड़े अक्षर से शुरू नहीं होते, और urodziny (जन्मदिन) हमेशा बहुवचन होता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit03.lesson02.match.004
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
