templates:
- content_key: practice.hi-pl.pl.a1.unit01.lesson01.choose.001
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पोलिश में "आप/तुम" के दो रूप हैं: दोस्तों और परिवार के लिए ty, और अजनबियों से या सम्मान दिखाने के लिए pan (पुरुष के लिए) या pani (महिला के लिए)।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson01.fill.002
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: fill_in_blank
  frame:
    text: Jak się {item} ma? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'pan या pani के साथ क्रिया ma आती है, मानो आप पूछ रहे हों कि "श्रीमान या श्रीमती कैसे हैं"; ty के साथ यह masz हो जाती है: Jak się masz?'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson01.translate.003
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Pan और pani एक-दूसरे की जगह नहीं आते: pan पुरुष के लिए और pani महिला के लिए है, जबकि ty उन लोगों के लिए है जिन्हें आप अच्छी तरह जानते हैं।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson01.order.004
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: word_order
  frame:
    text: Jak się {item} ma?
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item} ma?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Jak się ma? पूछता है कि कोई कैसा है; pan या pani बीच में आता है और क्रिया ma ही रहती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson01.translate.005
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: तुम कैसे हो? (दोस्त से, अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: दोस्त से पूछते समय प्रश्न masz पर समाप्त होता है; औपचारिक रूप में ma के साथ pan या pani आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson02.listen.001
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dzień dobry शाम तक पूरे दिन का अभिवादन है, dobry wieczór शाम को कहा जाता है, और dobranoc केवल रात को विदा लेते समय कहा जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson02.match.002
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cześć नमस्ते और अलविदा दोनों के लिए अनौपचारिक शब्द है, इसलिए यह ty के साथ चलता है, pan या pani के साथ नहीं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson02.order.003
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Do {item}!
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Do {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Do widzenia सामान्य अलविदा है; do zobaczenia अधिक आत्मीय "फिर मिलेंगे" है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson02.fill.004
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: fill_in_blank
  frame:
    text: Dobry {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dobry wieczór शाम को कहा जाता है; दिन में आप dzień dobry कहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson02.translate.005
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cześć नमस्ते और अलविदा दोनों के रूप में चलता है, लेकिन केवल उन लोगों के साथ जिन्हें आप ty कहकर संबोधित करेंगे।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson02.translate.006
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: आपका दिन शुभ हो!
    language_code: hi
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Miłego {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Miłego dnia एक शुभकामना है, इसलिए "दिन" के लिए शब्द का अंत बदलकर dnia हो जाता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson03.choose.001
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'पोलिश में सर्वनाम प्रायः छोड़ दिया जाता है, क्योंकि क्रिया का अंत ही पुरुष बता देता है: jestem का अर्थ है "मैं हूँ", jesteś का अर्थ है "तुम हो"।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson03.listen.002
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jestem z + देश बताता है कि आप कहाँ से हैं, और mieszkam w + शहर बताता है कि आप कहाँ रहते हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson03.translate.003
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'क्रिया के अंत से पुरुष पता चलता है: "मैं" के लिए -m (jestem, mieszkam) और अनौपचारिक "तुम" के लिए -sz या -ś (masz, jesteś)।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson03.order.004
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: word_order
  frame:
    text: Jestem z {item}, ale mieszkam w Warszawie.
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem z {item}, ale mieszkam w Warszawie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'z (से) के बाद देश के नाम का अंत बदल जाता है: Kanady.'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson03.fill.005
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: fill_in_blank
  frame:
    text: Czy pan {item} po polsku? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'किसी पुरुष से औपचारिक प्रश्न में क्रिया का वही रूप आता है जो "वह" के लिए होता है: Czy pan mówi po polsku?'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson03.translate.006
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: तुम कहाँ से हो? (दोस्त से, अनौपचारिक)
    language_code: hi
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Skąd {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Skąd का अर्थ है "कहाँ से"; दोस्त के साथ क्रिया jesteś होती है, जबकि औपचारिक रूप है Skąd pan jest?
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit01.lesson03.translate.007
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: आपसे मिलकर बहुत अच्छा लगा।
    language_code: hi
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo mi {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bardzo mi miło का शाब्दिक अर्थ है "मुझे बहुत अच्छा लगा", और किसी से मिलने पर यही सामान्य उत्तर है।
    language_code: hi
    direction: ltr
