templates:
- content_key: practice.hi-pl.pl.a1.unit05.lesson01.choose.001
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: पोलिश में परिवार के शब्द पुल्लिंग और स्त्रीलिंग जोड़ियों में आते हैं, जैसे ojciec और matka या brat और siostra।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson01.listen.002
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rodzice (माता-पिता) हमेशा बहुवचन है, इसलिए इसके साथ mój या moja नहीं, moi आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson01.match.003
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'परिवार के शब्द लिंग के अनुसार जोड़ी बनाते हैं: dziadek और babcia, wujek और ciotka, syn और córka।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson01.order.004
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest mój {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest mój {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mój ojciec, brat और dziadek जैसी पुल्लिंग संज्ञाओं के साथ आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson01.order.005
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest moja {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest moja {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja स्त्रीलिंग संज्ञाओं के साथ आता है, जिनमें से ज़्यादातर -a पर समाप्त होती हैं।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson01.fill.006
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: fill_in_blank
  frame:
    text: To jest {item} ojciec. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'अधिकार-सूचक शब्द संज्ञा से मेल खाता है: mój ojciec, लेकिन moja matka।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson01.translate.007
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: ये मेरी माँ हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest {item} matka.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja "मेरी" का स्त्रीलिंग रूप है; पुल्लिंग रूप mój है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson01.translate.008
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: ये मेरे माता-पिता हैं।
    language_code: hi
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To są {item} rodzice.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rodzice बहुवचन है और लोगों के लिए आता है, इसलिए अधिकार-सूचक शब्द moi होता है, और क्रिया jest की जगह są आती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson02.choose.001
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mieć का अर्थ है "किसी के पास होना", और क्रिया का रूप इस पर निर्भर है कि किसके पास है: mam, masz, ma।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson02.translate.002
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieć (किसी के पास होना) कोश वाला रूप है; वाक्यों में यह mam, masz या ma के रूप में आता है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson02.order.003
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: word_order
  frame:
    text: Mam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Mam के बाद जो चीज़ आपके पास है, वह कर्म रूप लेती है: brat बदलकर brata और siostra बदलकर siostrę हो जाता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson02.fill.004
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: fill_in_blank
  frame:
    text: Tak, mam brata {item} siostrę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: शब्द i दो चीज़ों को जोड़ता है, जैसे brata i siostrę में, और इसका रूप कभी नहीं बदलता।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson02.translate.005
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: मेरा एक बेटा और एक बेटी है।
    language_code: hi
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam syna i {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: '-a पर समाप्त होने वाली स्त्रीलिंग संज्ञाएँ वस्तु बनने पर -ę हो जाती हैं: córka बदलकर córkę हो जाता है।'
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson03.choose.001
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: पोलिश में "वह" (पुरुष) के लिए on और "वह" (स्त्री) के लिए ona आता है, और क्रिया mieszka दोनों के साथ चलती है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson03.translate.002
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: '{item}'
    language_code: hi
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tylko का मतलब "सिर्फ़" है, जबकि lub "या" के अर्थ में विकल्प बताता है, जैसे brata lub siostrę में।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson03.order.003
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: word_order
  frame:
    text: Mój brat mieszka w {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mój brat mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: w के बाद शहरों के नामों में एक विशेष अंत लगता है, जैसे w Gdańsku और w Krakowie में।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson03.fill.004
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: fill_in_blank
  frame:
    text: Ona {item} w Krakowie. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieszka क्रिया का "वह" वाला रूप है, और पहली इकाई का mieszkam "मैं" वाला रूप है।
    language_code: hi
    direction: ltr
- content_key: practice.hi-pl.pl.a1.unit05.lesson03.translate.005
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: वह गदान्स्क में रहता है। (सर्वनाम ज़रूर लिखें)
    language_code: hi
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: On mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'w के बाद अंत -u बताता है कि कोई कहाँ रहता है: w Gdańsku।'
    language_code: hi
    direction: ltr
