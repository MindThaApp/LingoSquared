  feedback_frame:
    text: 'क्रिया kosztować के साथ पोलिश में क्रियाविशेषण आते हैं: kosztuje tanio (सस्ता है) और kosztuje drogo (महँगा है)।'
    language_code: hi
    direction: ltr
