    slot: item
  feedback_frame:
    text: Cebula स्त्रीलिंग है क्योंकि वह -a पर समाप्त होता है; banan, pomidor, ogórek और ziemniak पुल्लिंग हैं।
    language_code: hi
    direction: ltr
