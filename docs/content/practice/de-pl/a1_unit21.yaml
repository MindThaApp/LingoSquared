        - w_naprawdę
        - w_pomaga
        - w_pewno
        - w_będziesz
        - w_dumny
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} gehört zum Wortschatz dieser Einheit, aus der Lektion „Glücklich, traurig oder wütend?“.'
