  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_będziesz
    - w_czuje
    - w_deszcz
    - w_dumny
    - w_martw
    - w_myślę
    - w_mówiąc
    - w_naprawdę
    - w_nowe
    - w_pewno
    - w_pierwszą
    - w_pomaga
    - w_poradzisz
    - w_pracę
    - w_samodzielną
    - w_smutny
    - w_szczerze
    - w_szczęśliwy
    - w_zdenerwowany
    - w_zmianą
