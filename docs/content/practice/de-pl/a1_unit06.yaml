  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: translation
  frame:
    text: Was empfehlen Sie? (zu einem Mann, formell)
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Co pan {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mit pan oder pani lautet das Verb poleca, dieselbe Form wie für „er“ oder „sie“.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit06.lesson03.translate.006
  lesson_content_key: pl.a1.unit06.lesson03.w_restauracji
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
