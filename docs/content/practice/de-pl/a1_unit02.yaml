templates:
- content_key: practice.de-pl.pl.a1.unit02.lesson01.choose.001
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Im Polnischen gibt es kein Muster, das die Zahlen von eins bis zehn verbindet; jedes Wort muss einzeln gelernt werden.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson01.listen.002
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Polnisches sz klingt wie deutsches sch und cz wie tsch; deshalb beginnen sześć und cztery mit diesen Lauten.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson01.translate.003
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Das ć am Ende von pięć, sześć, dziewięć und dziesięć ist ein weicher Laut; das Zeichen über dem c ist für die Schreibung wichtig.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson01.match.004
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Pięć, sześć, dziewięć und dziesięć enden auf den Buchstaben ć, siedem und osiem dagegen nicht; deshalb muss man bei jeder Schreibweise genau hinsehen.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson01.order.005
  lesson_content_key: pl.a1.unit02.lesson01.numbers_zero_to_ten
  type: word_order
  frame:
    text: Mam {item} lat.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item} lat.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mam + Zahl + lat sagt, wie alt man ist, z. B. Mam trzydzieści lat.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson02.listen.001
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ile fragt nach „wie viel“ oder „wie viele“, und kosztuje ist das Verb, das bei der Frage nach dem Preis dazugehört.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson02.choose.002
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Die Zahlen jedenaście, dwanaście und piętnaście enden auf -naście; daran erkennt man die Zahlen zwischen zehn und zwanzig.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson02.translate.003
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ile bedeutet bei Preisen „wie viel“ und bei zählbaren Dingen „wie viele“.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson02.order.004
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: word_order
  frame:
    text: To kosztuje {item} złotych.
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To kosztuje {item} złotych.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Auf Zahlen wie pięć, dwanaście oder trzydzieści folgt złotych, auf dwa, trzy und cztery dagegen złote.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson02.fill.005
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: fill_in_blank
  frame:
    text: To kosztuje dwadzieścia {item}. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Złotych ist die Form, die nach pięć, dwadzieścia, pięćdziesiąt und ähnlichen Zahlen steht; dwa, trzy und cztery haben złote.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson02.translate.006
  lesson_content_key: pl.a1.unit02.lesson02.numbers_and_prices
  type: translation
  frame:
    text: Wie viel kostet das?
    language_code: de
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile to kosztuje? ist die Standardfrage nach dem Preis; to bedeutet hier „das“ oder „es“.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson03.choose.001
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Pana ist das förmliche „Ihr“ für einen Mann (pana numer), twój dagegen das informelle „dein“ (twój numer).
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson03.translate.002
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Numer telefonu bedeutet wörtlich „die Nummer des Telefons“; das zweite Wort ist eine veränderte Form des Wortes für „Telefon“.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson03.order.003
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: word_order
  frame:
    text: Jaki jest {item} numer telefonu?
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest {item} numer telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój ist das informelle „dein“, pana das förmliche „Ihr“ für einen Mann; beides passt vor numer telefonu.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson03.fill.004
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: fill_in_blank
  frame:
    text: Ile masz {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Lat steht nach Zahlen wie pięć, dwadzieścia oder trzydzieści; lata steht nach dwa, trzy, cztery und nach Zusammensetzungen, die darauf enden, wie in trzydzieści dwa lata.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson03.translate.005
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Ich bin zweiunddreißig Jahre alt.
    language_code: de
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam trzydzieści dwa {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Weil die Zahl auf dwa endet, heißt „Jahre“ hier lata und nicht lat.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit02.lesson03.translate.006
  lesson_content_key: pl.a1.unit02.lesson03.phone_and_age
  type: translation
  frame:
    text: Wie lautet deine Telefonnummer? (informell; mit jest)
    language_code: de
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki jest twój {item} telefonu?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Twój ist das informelle „dein“; die förmliche Variante für einen Mann lautet Jaki jest pana numer telefonu?
    language_code: de
    direction: ltr
