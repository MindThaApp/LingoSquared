templates:
- content_key: practice.de-pl.pl.a1.unit01.lesson01.choose.001
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Das Polnische kennt zwei Arten der Anrede: ty unter Freunden und in der Familie, pan (zu einem Mann) oder pani (zu einer Frau) bei Fremden und aus Respekt.'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson01.fill.002
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: fill_in_blank
  frame:
    text: Jak się {item} ma? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Bei pan oder pani lautet das Verb ma, als würde man fragen „Wie geht es dem Herrn bzw. der Dame?“; bei ty wird daraus masz: Jak się masz?'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson01.translate.003
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Pan und pani sind nicht austauschbar: pan spricht einen Mann an, pani eine Frau, während ty für Menschen gilt, die Sie gut kennen.'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson01.order.004
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: word_order
  frame:
    text: Jak się {item} ma?
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item} ma?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Jak się ma? fragt, wie es jemandem geht; pan oder pani steht in der Mitte, und das Verb bleibt ma.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson01.translate.005
  lesson_content_key: pl.a1.unit01.lesson01.address_and_wellbeing
  type: translation
  frame:
    text: Wie geht es dir? (zu einem Freund, informell)
    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak się {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bei einem Freund endet die Frage auf masz; die formelle Form verwendet ma mit pan oder pani.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson02.listen.001
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dzień dobry ist der Gruß für den ganzen Tag bis zum Abend, dobry wieczór sagt man am Abend, und dobranoc nur zum Abschied für die Nacht.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson02.match.002
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Cześć ist das informelle Wort für „Hallo“ und „Tschüss“ und gehört daher zu ty, nicht zu pan oder pani.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson02.order.003
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: word_order
  frame:
    text: Do {item}!
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Do {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Do widzenia ist der übliche Abschiedsgruß; do zobaczenia ist das freundlichere „Bis bald“.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson02.fill.004
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: fill_in_blank
  frame:
    text: Dobry {item}! ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Dobry wieczór sagt man am Abend; tagsüber sagt man dzień dobry.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson02.translate.005
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Cześć passt sowohl als Begrüßung als auch zum Abschied, aber nur bei Menschen, die Sie mit ty ansprechen.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson02.translate.006
  lesson_content_key: pl.a1.unit01.lesson02.greetings_by_time
  type: translation
  frame:
    text: Einen schönen Tag!
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Miłego {item}!
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Miłego dnia ist ein Wunsch, deshalb ändert das Wort für „Tag“ seine Endung zu dnia.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson03.choose.001
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Im Polnischen lässt man das Pronomen meist weg, weil die Verbendung die Person zeigt: jestem heißt „ich bin“, jesteś heißt „du bist“.'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson03.listen.002
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jestem z + Land sagt, woher Sie kommen, und mieszkam w + Stadt sagt, wo Sie wohnen.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson03.translate.003
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Die Verbendungen zeigen die Person: -m für „ich“ (jestem, mieszkam) und -sz oder -ś für „du“ (masz, jesteś).'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson03.order.004
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: word_order
  frame:
    text: Jestem z {item}, ale mieszkam w Warszawie.
    language_code: pl
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Jestem z {item}, ale mieszkam w Warszawie.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Nach z („aus“) bekommt der Ländername eine andere Endung: Kanady.'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson03.fill.005
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: fill_in_blank
  frame:
    text: Czy pan {item} po polsku? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id015
    hint: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Eine formelle Frage über einen Mann verwendet die Verbform der 3. Person: Czy pan mówi po polsku?'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson03.translate.006
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: Woher kommst du? (zu einem Freund, informell)
    language_code: de
    direction: ltr
  slots:
    item: *id016
  answer_derivation:
    kind: render_frame
    frame:
      text: Skąd {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Skąd fragt „woher“; bei einem Freund lautet das Verb jesteś, die formelle Form ist Skąd pan jest?
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit01.lesson03.translate.007
  lesson_content_key: pl.a1.unit01.lesson03.names_origin_and_smalltalk
  type: translation
  frame:
    text: Freut mich sehr.
    language_code: de
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: Bardzo mi {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Bardzo mi miło heißt wörtlich „sehr angenehm mir“ und ist die übliche Antwort beim Kennenlernen.
    language_code: de
    direction: ltr
