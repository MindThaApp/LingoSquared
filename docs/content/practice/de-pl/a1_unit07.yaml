    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Kosztować ist die Grundform; in Sätzen wird daraus kosztuje oder kosztują.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit07.lesson02.choose.001
