templates:
- content_key: practice.de-pl.pl.a1.unit07.lesson01.choose.001
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Bei kosztować verwendet das Polnische Adverbien: kosztuje tanio (ist billig) und kosztuje drogo (ist teuer).'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit07.lesson01.listen.002
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cebula ist feminin, weil es auf -a endet; banan, pomidor, ogórek und ziemniak sind maskulin.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit07.lesson01.order.003
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: word_order
  frame:
    text: Ile kosztuje {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Ile kosztuje {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ile kosztuje fragt nach dem Preis einer einzelnen Sache, daher bleibt das Nomen in der Grundform im Singular.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit07.lesson01.fill.004
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: fill_in_blank
  frame:
    text: Banany {item} tanio. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Das Verb richtet sich nach der Zahl: kosztuje für eine Sache, kosztują für mehrere.'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit07.lesson01.translate.005
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
    text: Eine Banane ist billig. (Verwenden Sie das Verb für „kosten“.)
    language_code: de
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Banan kosztuje {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Das Polnische sagt wörtlich „eine Banane kostet billig“ und verwendet kein eigenes Adjektiv.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit07.lesson01.translate.006
  lesson_content_key: pl.a1.unit07.lesson01.owoce_i_warzywa
  type: translation
  frame:
