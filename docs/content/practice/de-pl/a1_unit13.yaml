  lesson_content_key: pl.a1.unit13.lesson01.czy_lubisz
  type: translation
  frame:
    text: Magst du Musik? (an einen Freund, ty; beginnen Sie mit czy)
    language_code: de
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
