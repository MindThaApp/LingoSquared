  lesson_content_key: pl.a1.unit50.lesson01.chce_isc_na_koncert
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: &id001
      language_code: pl
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_zespół
        - w_zespołu
        - w_miejsce
        - w_trwać
        - w_trwa
        - w_scena
        - w_publiczność
        - w_zadowolona
        - w_wędrowcy
        - w_początek
        - w_wspaniały
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} gehört zu den Wörtern dieser Einheit, aus der Lektion „Ich möchte zum Konzert gehen“.'
    language_code: de
    direction: ltr
