    direction: ltr
- content_key: practice.de-pl.pl.a1.unit22.lesson02.order.002
  lesson_content_key: pl.a1.unit22.lesson02.z_kim_rozmawiam
  type: word_order
  frame:
    text: Z kim {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_rozmawiam
  answer_derivation:
    kind: render_frame
    frame:
      text: Z kim {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mit wem spreche ich? Z kim rozmawiam? (wörtlich „mit wem rede ich?“) ist die übliche Formulierung bei einem unbekannten Anrufer; kim ist der Instrumental nach z.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit22.lesson03.order.002
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: word_order
  frame:
    text: Możesz to {item}?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_powtórzyć
  answer_derivation:
    kind: render_frame
    frame:
      text: Możesz to {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Kannst du das wiederholen? Możesz (kannst du, von móc) + Infinitiv powtórzyć (wiederholen) + to (das).
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit22.lesson03.fill.003
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: fill_in_blank
  frame:
    text: Nie {item} tak szybko, proszę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
    hint:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_mów
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Sprich bitte nicht so schnell. Nie mów ist der verneinte Imperativ (sprich nicht); tak szybko bedeutet „so schnell“.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit22.lesson03.translate.004
  lesson_content_key: pl.a1.unit22.lesson03.mozesz_to_powtorzyc
  type: translation
  frame:
    text: Ich kann dich nicht gut hören.
    language_code: de
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_słyszę
  answer_derivation:
    kind: render_frame
    frame:
      text: Nie {item} cię dobrze.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Ich höre dich nicht gut. Nie słyszę cię dobrze nennt ein Hörproblem; cię ist der Akkusativ von ty und dobrze bedeutet „gut“.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit22.lesson06.order.002
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: word_order
  frame:
    text: Jak ci {item} pierwsza zmiana?
    language_code: pl
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: verb
      agreement_tags:
        semantic: w_poszła
  answer_derivation:
    kind: render_frame
    frame:
      text: Jak ci {item} pierwsza zmiana?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Wie ist deine erste Schicht gelaufen? Jak ci poszła ...? (wörtlich „wie ist dir ... gegangen?“) fragt nach etwas, das schon passiert ist. Ci ist der Dativ von ty, und poszła richtet sich nach dem femininen Nomen zmiana.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit22.lesson06.fill.003
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: fill_in_blank
  frame:
    text: Jego pierwsza {item} poszła bardzo dobrze. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
    hint:
      language_code: pl
      part_of_speech: noun
      agreement_tags:
        semantic: w_zmiana
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Seine erste Schicht ist sehr gut gelaufen. Jego (sein) verändert sich nie und steht vor dem Nomen: jego pierwsza zmiana; das feminine Nomen hat darauf keinen Einfluss.'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit22.lesson06.translate.004
  lesson_content_key: pl.a1.unit22.lesson06.telefon_po_zmianie
  type: translation
  frame:
    text: Es ist sehr gut gelaufen, besser, als ich dachte.
    language_code: de
    direction: ltr
  slots:
    item:
      language_code: pl
      part_of_speech: adverb
      agreement_tags:
        semantic: w_lepiej
  answer_derivation:
    kind: render_frame
    frame:
      text: Poszło bardzo dobrze, {item}, niż myślałem.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Es ist sehr gut gelaufen, besser, als ich dachte. Poszło ist die Vergangenheit von iść mit der Endung -o („es“; hier im Sinn von „ausgehen, verlaufen“); myślałem ist die Vergangenheit von myśleć (denken) in der Form für einen männlichen Sprecher.
    language_code: de
    direction: ltr
