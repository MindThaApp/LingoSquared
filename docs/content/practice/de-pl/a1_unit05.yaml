templates:
- content_key: practice.de-pl.pl.a1.unit05.lesson01.choose.001
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Polnische Familienwörter gibt es oft als maskulin-feminines Paar, zum Beispiel ojciec und matka oder brat und siostra.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson01.listen.002
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Rodzice (Eltern) steht immer im Plural und hat deshalb moi statt mój oder moja.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson01.match.003
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Familienwörter bilden Paare nach dem Geschlecht: dziadek und babcia, wujek und ciotka, syn und córka.'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson01.order.004
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest mój {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest mój {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Mój steht bei maskulinen Substantiven wie ojciec, brat und dziadek.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson01.order.005
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: word_order
  frame:
    text: To jest moja {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest moja {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja steht bei femininen Substantiven, von denen die meisten auf -a enden.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson01.fill.006
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: fill_in_blank
  frame:
    text: To jest {item} ojciec. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Das Possessivpronomen richtet sich nach dem Substantiv: mój ojciec, aber moja matka.'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson01.translate.007
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: Das ist meine Mutter.
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: To jest {item} matka.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Moja ist das feminine „mein“; das maskuline „mein“ heißt mój.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson01.translate.008
  lesson_content_key: pl.a1.unit05.lesson01.najblizsza_rodzina
  type: translation
  frame:
    text: Das sind meine Eltern.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: To są {item} rodzice.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Rodzice steht im Plural und bezeichnet Personen, daher lautet das Possessivpronomen moi; das Verb ist są statt jest.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson02.choose.001
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mieć bedeutet „haben“, und die Person, die etwas hat, bestimmt die Verbform: mam, masz, ma.'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson02.translate.002
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieć (haben) ist die Grundform; in Sätzen erscheint es als mam, masz oder ma.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson02.order.003
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: word_order
  frame:
    text: Mam {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Nach mam steht das, was man hat, in der Objektform: brat wird zu brata und siostra zu siostrę.'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson02.fill.004
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: fill_in_blank
  frame:
    text: Tak, mam brata {item} siostrę. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Das Wort i verbindet zwei Dinge, wie in brata i siostrę, und verändert sich nie.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson02.translate.005
  lesson_content_key: pl.a1.unit05.lesson02.dalsza_rodzina
  type: translation
  frame:
    text: Ich habe einen Sohn und eine Tochter.
    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Mam syna i {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Feminine Substantive auf -a erhalten als Objekt die Endung -ę: córka wird zu córkę.'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson03.choose.001
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Im Polnischen heißt „er“ on und „sie“ ona, und die Verbform mieszka passt zu beiden.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson03.translate.002
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Tylko bedeutet „nur“, während lub das „oder“ der Alternative ist, wie in brata lub siostrę.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson03.order.003
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: word_order
  frame:
    text: Mój brat mieszka w {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mój brat mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Nach w erhalten Städtenamen eine besondere Endung, wie in w Gdańsku und w Krakowie.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson03.fill.004
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: fill_in_blank
  frame:
    text: Ona {item} w Krakowie. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mieszka ist die Form für er/sie, und mieszkam aus der ersten Lektion ist die Form für ich.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit05.lesson03.translate.005
  lesson_content_key: pl.a1.unit05.lesson03.rozmowa_o_rodzinie
  type: translation
  frame:
    text: Er wohnt in Danzig. (mit Pronomen)
    language_code: de
    direction: ltr
  slots:
    item: *id017
  answer_derivation:
    kind: render_frame
    frame:
      text: On mieszka w {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Die Endung -u nach w zeigt an, wo jemand wohnt: w Gdańsku.'
    language_code: de
    direction: ltr
