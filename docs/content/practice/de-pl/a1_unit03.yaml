templates:
- content_key: practice.de-pl.pl.a1.unit03.lesson01.choose.001
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Polnische Wochentage und Monate werden kleingeschrieben – anders als im Deutschen.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson01.translate.002
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Środa, sobota und niedziela enden auf -a, die anderen vier Wochentage auf einen Konsonanten; dieser Unterschied im Ausgang spielt bei der Wendung w + Tag eine Rolle.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson01.match.003
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id003
    second: *id003
    third: *id003
    fourth: *id003
    fifth: *id003
    sixth: *id003
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Dziś bedeutet „heute“, und tygodnia ist eine veränderte Form des Wortes für „Woche“, wie in dzień tygodnia.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson01.order.004
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: W {item} idę do kina.
    language_code: pl
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: W {item} idę do kina.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Nach w („am“) behalten poniedziałek, czwartek und piątek ihre Form, aber wtorek wird zu we wtorek, damit es leichter auszusprechen ist.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson01.fill.005
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: fill_in_blank
  frame:
    text: W {item} idę do kina. ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Idę do kina heißt „Ich gehe ins Kino“, und w + Wochentag bedeutet „am“ diesem Tag.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson01.order.006
  lesson_content_key: pl.a1.unit03.lesson01.dni_tygodnia
  type: word_order
  frame:
    text: Jaki dziś jest dzień {item}?
    language_code: pl
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Jaki dziś jest dzień {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Dzień tygodnia bedeutet „Wochentag“, und das zweite Wort ändert seine Endung zu tygodnia.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson02.choose.001
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Polnische Monatsnamen werden nicht großgeschrieben und stehen ohne Präfix oder Artikel.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson02.listen.002
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: listen_select
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: In einem gesprochenen Datum steht zuerst der Tag mit der Endung -ego, danach der Monat in seiner Datumsform, meist auf -a (dziesiątego maja), aber lutego für Februar.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson02.translate.003
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Polnische Monate werden nicht großgeschrieben, und urodziny („Geburtstag“) steht immer im Plural.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson02.match.004
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: pl
    direction: ltr
  slots:
    first: *id009
    second: *id009
    third: *id009
    fourth: *id009
    fifth: *id009
    sixth: *id009
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Einige Monate enden auf -eń (styczeń, kwiecień, sierpień, wrzesień); daran erkennt man sie leichter.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson02.order.005
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: word_order
  frame:
    text: Spotkanie jest piętnastego {item}.
    language_code: pl
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: Spotkanie jest piętnastego {item}.
      language_code: pl
      direction: ltr
  feedback_frame:
    text: In einem Datum endet der Tag auf -ego, und der Monat erhält -a, außer lutego für Februar.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson02.fill.006
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: fill_in_blank
  frame:
    text: Kiedy są twoje {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Urodziny steht im Polnischen im Plural, darum lautet das Verb są („sind“) und nicht jest.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson02.translate.007
  lesson_content_key: pl.a1.unit03.lesson02.miesiace_i_daty
  type: translation
  frame:
    text: Wann ist das Treffen?
    language_code: de
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Kiedy jest {item}?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: Kiedy fragt nach dem „Wann“, und ein Substantiv im Singular wie spotkanie verlangt jest.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson03.choose.001
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: pl
    direction: ltr
  slots:
    item: *id013
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Panu und ci bedeuten beide „dir“ bzw. „Ihnen“; panu ist die förmliche Form für einen Mann, ci die informelle.
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson03.translate.002
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Możemy ist die Wir-Form des Verbs „können“, wie in Kiedy możemy się znowu spotkać?
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson03.order.003
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: word_order
  frame:
    text: Czy piątek {item} odpowiada?
    language_code: pl
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Czy piątek {item} odpowiada?
      language_code: pl
      direction: ltr
  feedback_frame:
    text: 'Odpowiada verlangt die gefragte Person im Dativ: panu (förmlich, an einen Mann) oder ci (informell).'
    language_code: de
    direction: ltr
- content_key: practice.de-pl.pl.a1.unit03.lesson03.fill.004
  lesson_content_key: pl.a1.unit03.lesson03.umawiamy_sie
  type: fill_in_blank
  frame:
    text: Kiedy możemy się znowu {item}? ({hint})
    language_code: pl
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id016
    hint: *id016
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Nach możemy bleibt das zweite Verb in der Grundform, spotkać.
    language_code: de
    direction: ltr
