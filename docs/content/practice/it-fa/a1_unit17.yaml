templates:
- content_key: practice.it-fa.fa.a1.unit17.lesson01.symptom_choice.001
  lesson_content_key: fa.a1.unit17.lesson01.basic_symptoms
  type: multiple_choice
  frame:
    text: '{symptom_word}'
    language_code: fa
    direction: rtl
  slots:
    symptom_word: *id001
  answer_derivation:
    kind: slot_gloss
    slot: symptom_word
  feedback_frame:
    text: '{symptom_word} descrive come si sente una persona.'
    language_code: it
    direction: ltr
- content_key: practice.it-fa.fa.a1.unit17.lesson01.symptom_have_order.002
  lesson_content_key: fa.a1.unit17.lesson01.basic_symptoms
  type: word_order
  frame:
    text: '{symptom_noun_word} دارم'
    language_code: fa
    direction: rtl
  slots:
    symptom_noun_word: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: '{symptom_noun_word} دارم'
      language_code: fa
      direction: rtl
  feedback_frame:
    text: دارم significa «ho», come in سردرد دارم (ho mal di testa).
    language_code: it
    direction: ltr
