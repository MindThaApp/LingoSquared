  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to French). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_aperta
    - w_attori
    - w_benissimo
    - w_bravi
    - w_commedia
    - w_fantastici
    - w_intervallo
    - w_popolare
    - w_posti
    - w_sipario
    - w_soddisfatto
templates:
- content_key: practice.fr-it.it.a1.unit74.lesson01.choose.001
  lesson_content_key: it.a1.unit74.lesson01.andiamo_a_teatro_oggi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_popolare
        - w_sipario
        - w_attori
        - w_bravi
        - w_aperta
        - w_commedia
        - w_intervallo
        - w_posti
        - w_soddisfatto
        - w_benissimo
        - w_fantastici
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon « On va au théâtre aujourd’hui ? ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit74.lesson02.listen.001
