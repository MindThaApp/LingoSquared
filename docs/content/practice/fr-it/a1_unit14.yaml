templates:
- content_key: practice.fr-it.it.a1.unit14.lesson01.choose.001
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Preferisco est la forme de « je » et preferisci la forme de « tu » (tutoiement) de preferire.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson01.listen.002
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Preferisco et preferisci ne diffèrent que par la dernière voyelle.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson01.order.003
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: word_order
  frame:
    text: Preferisci il caffè o il {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Preferisci il caffè o il {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Tè porte un accent pour le distinguer de te, toi.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson01.fill.004
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: fill_in_blank
  frame:
    text: Io {item} il caffè. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Preferisco se termine par -o parce que le sujet est « je ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson01.translate.005
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: translation
  frame:
    text: Tu préfères le café ou le thé ? (informel, tu)
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Preferisci il caffè o il {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Preferisci est la forme du verbe pour le tutoiement (tu).
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson03.translate.001
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: translation
  frame:
    text: Moi aussi, je préfère le café !
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Anch'io {item} il caffè!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Anch'io signifie moi aussi, et preferisco est la forme de « je ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson03.match.002
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Tè désigne le thé ; te est un pronom utilisé après une préposition.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson03.choose.003
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Piace s’emploie dans mi piace, qui signifie j’aime (cela me plaît).
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson02.listen.001
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mi piace molto signifie j’aime beaucoup.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson02.order.002
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: word_order
  frame:
    text: Mi {item} molto il cornetto.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi {item} molto il cornetto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Piace s’accorde avec la chose aimée, qui est ici au singulier.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson02.fill.003
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: fill_in_blank
  frame:
    text: E a {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A te signifie à toi et sert à renvoyer la même question à l’autre personne, au tutoiement.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson02.translate.004
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: translation
  frame:
    text: J’aime beaucoup le croissant.
    language_code: fr
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi {item} molto il cornetto.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mi piace molto signifie « j’aime beaucoup », littéralement « cela me plaît beaucoup ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson02.translate.005
  lesson_content_key: it.a1.unit14.lesson02.mi_piace_il_cornetto
  type: translation
  frame:
    text: Et toi ? (tutoiement, pour renvoyer la question après avoir dit que tu aimes quelque chose)
    language_code: fr
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: E a {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Après une préposition comme a, tu devient te : a te, à toi.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson03.fill.004
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: fill_in_blank
  frame:
    text: A {item} no, preferisco il tè. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A me signifie « à moi » ; après une préposition, io devient me.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson03.translate.005
  lesson_content_key: it.a1.unit14.lesson03.anch_io_preferisco_il_caffe
  type: translation
  frame:
    text: Pas moi, je préfère le thé.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: A {item} no, preferisco il tè.
      language_code: it
      direction: ltr
  feedback_frame:
    text: A me no signifie « pas moi ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit14.lesson01.translate.006
  lesson_content_key: it.a1.unit14.lesson01.preferisci_il_caffe_o_il_te
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Preferire signifie « préférer » ; preferisco signifie « je préfère ».
    language_code: fr
    direction: ltr
