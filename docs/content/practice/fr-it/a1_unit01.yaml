templates:
- content_key: practice.fr-it.it.a1.unit01.lesson01.choose.001
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Tu s'emploie avec les amis, la famille et les personnes de même niveau ; Lei, avec un L majuscule, est la forme de politesse pour les inconnus, les personnes plus âgées et les situations professionnelles.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson01.listen.002
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Ciao sert aussi bien à dire bonjour qu'au revoir, alors que buongiorno est un bonjour poli de la journée.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson01.order.003
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: word_order
  frame:
    text: Ciao, come {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Come stai? demande à un ami comment il va ; à un inconnu, tu dirais Come sta?
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson01.match.004
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Beaucoup d''adjectifs italiens en -ale ressemblent aux adjectifs français : informale, c''est « informel », formale, c''est « formel ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson01.translate.005
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Rispettoso va avec le Lei formel : il montre du respect envers les personnes que tu ne connais pas bien.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson01.translate.006
  lesson_content_key: it.a1.unit01.lesson01.tu_e_lei
  type: translation
  frame:
    text: Salut, comment vas-tu ? (informel, à un ami)
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, come {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Stai est la forme en tu ; la forme de politesse en Lei de la même question est Buongiorno, come sta?
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson02.choose.001
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Arrivederla est l'au revoir formel ; le -la final renvoie à Lei. Avec des amis, les Italiens disent ciao.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson02.listen.002
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buonasera est la salutation du soir ; buonanotte ne se dit que lorsque quelqu'un va se coucher.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson02.order.003
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: word_order
  frame:
    text: Ciao, ci {item} domani!
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, ci {item} domani!
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ci vediamo signifie littéralement « nous nous voyons » ; c'est la façon courante de dire « à bientôt ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson02.fill.004
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: fill_in_blank
  frame:
    text: Arrivederla, a {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: A domani signifie « à demain » ; le a fait partie de l'expression figée.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson02.translate.005
  lesson_content_key: it.a1.unit01.lesson02.stare_bene_e_salutarsi
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Bene répond à Come stai? et peut aussi s'employer seul pour dire « bien » ou « ça va ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson03.choose.001
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Scusi est la façon polie d'attirer l'attention d'un inconnu ; c'est la forme de politesse (Lei).
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson03.listen.002
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Benvenuto est masculin ; il devient benvenuta quand tu accueilles une femme.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson03.order.003
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: word_order
  frame:
    text: Mi chiamo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mi chiamo signifie littéralement « je m'appelle » ; le nom vient simplement à la fin.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson03.fill.004
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: fill_in_blank
  frame:
    text: Come ti {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ti est le pronom informel ; avec Lei, la question devient Come si chiama?
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson03.match.005
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id013
    second: *id013
    third: *id013
    fourth: *id013
    fifth: *id013
    sixth: *id013
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Piacere est à la fois le nom « plaisir » et la réponse qu''on donne en rencontrant quelqu''un : « enchanté ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson03.translate.006
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id014
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mille signifie « mille », donc grazie mille est un chaleureux « merci beaucoup ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit01.lesson03.translate.007
  lesson_content_key: it.a1.unit01.lesson03.presentarsi_in_ufficio
  type: translation
  frame:
    text: Je m'appelle Elena.
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Mi chiamo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Comme le français « je m''appelle », l''italien emploie un verbe pronominal : mi chiamo.'
    language_code: fr
    direction: ltr
