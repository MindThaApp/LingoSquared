  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
