    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Gennaio, febbraio, marzo et aprile suivent l’ordre de l’année, comme en français.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson02.translate.006
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: translation
  frame:
    text: Aujourd’hui, on est le cinq {month}.
    language_code: fr
    direction: ltr
    slot_rendering:
      month: english_gloss
  slots:
    month: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi è il cinque {month}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'L’italien met le jour en premier : il cinque gennaio, littéralement « le cinq janvier ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson03.choose.001
