    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Dopodomani est formé de dopo, après, et domani, demain : après-demain.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson03.translate.005
  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Arrivo signifie j’arrive et arrivi signifie tu arrives ; seule la voyelle finale change.
    language_code: fr
    direction: ltr
