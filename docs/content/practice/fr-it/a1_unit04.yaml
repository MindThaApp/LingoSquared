    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Martedì et mercoledì portent un accent écrit sur la dernière syllabe, qui est accentuée.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson01.order.003
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: word_order
  frame:
    text: Che {item} è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} è oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che giorno è oggi? demande le jour de la semaine ; pour la date, on demande Che data è oggi?
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson01.fill.004
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: fill_in_blank
  frame:
    text: Che giorno è {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Oggi signifie aujourd’hui ; domani signifie demain, et la même question fonctionne pour les deux.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson01.match.005
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id004
    second: *id004
    third: *id004
    fourth: *id004
    fifth: *id004
    sixth: *id004
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Du lundi au vendredi, les noms se terminent en -dì, du latin dies, jour ; sabato et domenica non.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson01.translate.006
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: translation
  frame:
    text: Aujourd’hui, c’est {day}.
    language_code: fr
    direction: ltr
    slot_rendering:
      day: english_gloss
  slots:
    day: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Oggi è {day}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'L’italien omet l’article avec les jours de la semaine employés ainsi : Oggi è lunedì, et non Oggi è il lunedì.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson02.choose.001
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Les mois italiens ne prennent pas de majuscule : gennaio, febbraio, marzo.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson02.listen.002
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Febbraio a un double b ; écoute bien la consonne tenue.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson02.order.003
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: word_order
  frame:
    text: Che {item} è oggi?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} è oggi?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Data signifie date ; Che data è oggi? demande le jour et le mois, pas le jour de la semaine.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson02.fill.004
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: fill_in_blank
  frame:
