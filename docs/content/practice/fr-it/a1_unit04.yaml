    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Les dates se forment avec il et un nombre cardinal : il quindici marzo, le quinze mars.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson02.translate.005
  lesson_content_key: it.a1.unit04.lesson02.che_data_e_oggi
  type: translation
  frame:
