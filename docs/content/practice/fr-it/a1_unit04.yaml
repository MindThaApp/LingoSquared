  lesson_content_key: it.a1.unit04.lesson03.quando_arrivi_a_roma
  type: translation
  frame:
    text: J’arrive jeudi après-midi.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Arrivo giovedì {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'L’italien n’a pas besoin de préposition devant un jour de la semaine : arrivo giovedì, j’arrive jeudi.'
    language_code: fr
    direction: ltr
