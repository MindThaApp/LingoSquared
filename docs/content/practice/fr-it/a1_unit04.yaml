- content_key: practice.fr-it.it.a1.unit04.lesson01.choose.001
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Les jours de la semaine italiens s’écrivent en minuscules, comme en français.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit04.lesson01.listen.002
  lesson_content_key: it.a1.unit04.lesson01.i_giorni_della_settimana
