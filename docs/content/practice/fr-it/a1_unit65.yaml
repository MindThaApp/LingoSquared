    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon « Quel film voudrais-tu voir ? ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit65.lesson03.translate.001
  lesson_content_key: it.a1.unit65.lesson03.a_che_ora_inizia
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
