schema_version: '1.0'
pack_key: practice.fr-it.a1.unit65
source_language: fr
target_language: it
unit_content_key: it.a1.unit65.cinema
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-it by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to French). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_avvincente
    - w_bambini
    - w_guardare
    - w_iniziare
    - w_nuovo
    - w_popcorn
    - w_spettacolo
    - w_vedere
templates:
- content_key: practice.fr-it.it.a1.unit65.lesson01.choose.001
  lesson_content_key: it.a1.unit65.lesson01.voglio_guardare_un_film
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_guardare
        - w_vedere
        - w_spettacolo
        - w_iniziare
        - w_nuovo
        - w_popcorn
        - w_bambini
        - w_avvincente
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon « Je veux regarder un film ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit65.lesson02.listen.001
  lesson_content_key: it.a1.unit65.lesson02.quale_film_vuole_vedere
  type: listen_select
