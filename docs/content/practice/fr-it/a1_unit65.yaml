    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} fait partie des mots de cette unité, dans la leçon « À quelle heure commence la séance ? ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit65.lesson04.match.001
  lesson_content_key: it.a1.unit65.lesson04.al_cinema
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: Associe chaque mot italien à sa signification en français ; les mots viennent des leçons de cette unité.
    language_code: fr
    direction: ltr
