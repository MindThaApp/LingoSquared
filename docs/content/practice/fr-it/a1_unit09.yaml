templates:
- content_key: practice.fr-it.it.a1.unit09.lesson01.choose.001
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: La farmacia, la banca et la stazione sont féminins ; l'ufficio postale est masculin, avec un article élidé.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson01.listen.002
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Via peut signifier « rue » ou « route » et s’emploie dans des noms comme Via Roma.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson01.order.003
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: word_order
  frame:
    text: Scusi, dov'è la {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dov'è la suivi d’un nom féminin demande où se trouve un lieu ; scusi est la forme de politesse pour « excusez-moi ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson01.fill.004
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: fill_in_blank
  frame:
    text: È qui {item}, in Via Roma. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Qui vicino signifie « tout près, ici près ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson01.match.005
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id005
    second: *id005
    third: *id005
    fourth: *id005
    fifth: *id005
    sixth: *id005
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: Vicino signifie « près » ; qui vicino signifie « près d’ici ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson01.translate.006
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: Excusez-moi, où est la pharmacie ? (forme de politesse)
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Scusi, dov'è la {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Scusi est l’impératif de politesse, adapté à un inconnu.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson01.translate.007
  lesson_content_key: it.a1.unit09.lesson01.i_luoghi_in_citta
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Il ou la change selon le genre, mais l'' s’emploie devant une voyelle : l''ufficio.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson02.choose.001
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: C'è demande ou affirme que quelque chose existe ; ce n'è répond en indiquant qu’il y en a un.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson02.listen.002
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ce n''è una signifie « il y en a une » : ne remplace « en ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson02.fill.003
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: C'è una {item} qui vicino? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: C'è una banca? demande s’il existe une banque près d’ici.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson02.order.004
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: word_order
  frame:
    text: Sì, {item} una qui vicino.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, {item} una qui vicino.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ce n'è una répond à une question en c'è una ... en disant qu’il y en a une.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson02.fill.005
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: È {item} alla stazione. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Accanto alla signifie « à côté de la » ; alla est a plus la.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson02.fill.006
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: fill_in_blank
  frame:
    text: Sì, ce n'è una qui vicino, accanto {item} stazione. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Alla réunit a et la devant un nom féminin.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson02.translate.007
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: Y a-t-il une banque près d’ici ?
    language_code: fr
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: C'è una {item} qui vicino?
      language_code: it
      direction: ltr
  feedback_frame:
    text: C'è una banca qui vicino? emploie una parce que banca est féminin.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson02.translate.008
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: Oui, il y en a une près d’ici.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, {item} una qui vicino.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ce n'è una signifie « il y en a une ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit09.lesson02.translate.009
  lesson_content_key: it.a1.unit09.lesson02.ce_una_banca_qui_vicino
  type: translation
  frame:
    text: C’est à côté de la gare.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: È {item} alla stazione.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Accanto alla stazione signifie « à côté de la gare ».
    language_code: fr
    direction: ltr
