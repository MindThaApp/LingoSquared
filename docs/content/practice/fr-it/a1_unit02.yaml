templates:
- content_key: practice.fr-it.it.a1.unit02.lesson01.choose.001
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Les nationalités changent selon la personne qui parle : americano pour un homme, americana pour une femme ; italiano et italiana fonctionnent de la même façon.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson01.order.002
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: word_order
  frame:
    text: Di {item} sei?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? demande à un ami d’où il vient ; à un inconnu, on dit Di dov'è, Lei?
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson01.fill.003
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: fill_in_blank
  frame:
    text: Sono italiana, di {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Les noms de villes italiennes diffèrent souvent des noms français : Milano, c’est Milan.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson01.match.004
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'La terminaison indique le genre : -o pour un homme (americano), -a pour une femme (americana).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson01.translate.005
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'L’italien ne met pas de majuscule aux nationalités ni aux langues : italiano, inglese.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson01.translate.006
  lesson_content_key: it.a1.unit02.lesson01.di_dove_sei
  type: translation
  frame:
    text: D’où viens-tu ? (informel)
    language_code: fr
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Di {item} sei?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Di dove sei? est la question avec tu ; la version polie avec Lei est Di dov'è, Lei?
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson02.choose.001
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'La terminaison du verbe indique qui fait l’action : parlo = je parle, parli = tu parles (informel), parla = vous parlez (formel) ou il/elle parle.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson02.listen.002
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Parli et parla se ressemblent à l’oreille : la dernière voyelle indique s’il s’agit de tu (-i) ou de Lei (-a).'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson02.order.003
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: word_order
  frame:
    text: Parlo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: Parlo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Après parlare, la langue n’a généralement pas besoin d’article : parlo inglese, parlo italiano.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson02.fill.004
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: fill_in_blank
  frame:
    text: Da {item} studi? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Da quanto studi? demande depuis combien de temps tu étudies ; l’italien emploie le présent avec da, « depuis ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson02.translate.005
  lesson_content_key: it.a1.unit02.lesson02.parlare_italiano
  type: translation
  frame:
    text: Tu parles anglais ? (informel)
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Parli {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Parli est la forme en tu ; pour un inconnu, on emploie la forme en Lei : Parla inglese?'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson03.choose.001
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Fai et fa sont deux formes de fare : fai s’emploie avec tu, fa avec Lei ou il/elle.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson03.listen.002
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Ingegnere est accentué sur l’avant-dernière syllabe : in-ge-GNE-re.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson03.order.003
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: word_order
  frame:
    text: Che {item} fai?
    language_code: it
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Che {item} fai?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Che lavoro fai? demande littéralement quel travail tu fais ; la version polie est Che lavoro fa, Lei?
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson03.fill.004
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: fill_in_blank
  frame:
    text: Che lavoro {item}? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Fai est la forme de fare avec tu ; avec Lei, elle devient fa.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson03.match.005
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id014
    second: *id014
    third: *id014
    fourth: *id014
    fifth: *id014
    sixth: *id014
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 'Che est un mot souple : il signifie « quel » dans Che lavoro fai? et « comme » dans Che bello!'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson03.translate.006
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id015
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Per signifie « pour » : per lavoro, c’est « pour le travail », per due anni, « pour deux ans ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit02.lesson03.translate.007
  lesson_content_key: it.a1.unit02.lesson03.il_lavoro_e_il_benvenuto
  type: translation
  frame:
    text: Je suis ici pour le travail.
    language_code: fr
    direction: ltr
  slots:
    item: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: Sono qui per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'L’italien emploie ici per sans article : per lavoro, « pour le travail ».'
    language_code: fr
    direction: ltr
