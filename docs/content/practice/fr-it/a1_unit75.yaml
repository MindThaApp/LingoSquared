    - w_panetteria
    - w_rosse
    - w_venditore
    - w_verdura
templates:
- content_key: practice.fr-it.it.a1.unit75.lesson01.choose.001
  lesson_content_key: it.a1.unit75.lesson01.andiamo_al_mercato
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: &id001
      language_code: it
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_affollato
        - w_bancarella
        - w_verdura
        - w_fresca
        - w_rosse
        - w_venditore
        - w_chili
        - w_panetteria
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} est l’un des mots de cette unité, tiré de la leçon « On va au marché ? ».'
    language_code: fr
    direction: ltr
