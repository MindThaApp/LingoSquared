    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: it
    direction: ltr
  slots:
    first: *id006
    second: *id006
    third: *id006
    fourth: *id006
    fifth: *id006
    sixth: *id006
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: En Italie, les fruits et légumes se vendent au kilo.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson01.translate.007
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: Combien coûtent les pommes ?
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto {item} le mele?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Avec un nom au pluriel, on emploie costano : quanto costano le mele.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson01.translate.008
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: Elles coûtent trois euros le kilo.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Costano tre euro al {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Après un nombre, euro reste invariable en italien : tre euro.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson01.translate.009
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: Je voudrais un kilo de pommes, s'il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un {item} di mele, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Di relie une quantité à ce qu''on achète : un chilo di mele.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson01.translate.010
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: translation
  frame:
    text: '{item}'
    language_code: fr
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Ici, mele, banane, pomodori et patate sont au pluriel, car on les achète au kilo.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson03.choose.002
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Lo prendo signifie « je le prends » ; lo renvoie à un article masculin.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson03.listen.003
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Va bene est une façon très courante de dire « d'accord ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson03.fill.004
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: fill_in_blank
  frame:
    text: Va bene, {item} prendo. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Lo signifie « le » et se place avant le verbe : lo prendo.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson03.order.005
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: word_order
  frame:
    text: Va bene, lo {item}.
    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Prendo est la forme de la première personne de prendere, « prendre », employée pour accepter un prix.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson03.translate.006
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: translation
  frame:
    text: D'accord, je le prends.
    language_code: fr
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: Va bene, lo {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Va bene, lo prendo est la formule habituelle pour conclure un achat.
    language_code: fr
    direction: ltr
