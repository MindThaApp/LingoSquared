templates:
- content_key: practice.fr-it.it.a1.unit08.lesson01.choose.001
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'Mele est le pluriel de mela : les noms féminins en -a forment leur pluriel en -e.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson01.listen.002
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Mele, banane et patate sont des féminins pluriels et prennent le ; pomodori est un masculin pluriel et prend i.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson01.order.003
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: word_order
  frame:
    text: Quanto costano le {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costano le {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Le s'emploie avec les noms féminins pluriels, et costano est le verbe au pluriel, parce qu'il s'agit de plusieurs articles.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson01.order.004
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: word_order
  frame:
    text: Quanto costano i {item}?
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Quanto costano i {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Pomodori est un masculin pluriel : il prend i, pas le.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson01.fill.005
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: fill_in_blank
  frame:
    text: Costano tre euro al {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Al chilo signifie « au kilo », la façon habituelle d'indiquer le prix des fruits et légumes.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson01.fill.006
  lesson_content_key: it.a1.unit08.lesson01.al_mercato
  type: fill_in_blank
  frame:
    text: Quanto {item} le mele? ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mele est au pluriel, donc le verbe est costano, pas costa.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit08.lesson03.match.001
  lesson_content_key: it.a1.unit08.lesson03.va_bene_lo_prendo
  type: matching_pairs
