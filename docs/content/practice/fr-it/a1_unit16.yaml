    slot: item
  feedback_frame:
    text: Ho la febbre et ho la tosse utilisent ho, « j’ai », avec la.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit16.lesson02.order.002
  lesson_content_key: it.a1.unit16.lesson02.non_mi_sento_bene
