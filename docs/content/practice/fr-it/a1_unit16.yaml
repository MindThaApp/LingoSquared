      direction: ltr
  feedback_frame:
    text: Devo plus un infinitif signifie « je dois faire quelque chose ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit16.lesson03.fill.004
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
