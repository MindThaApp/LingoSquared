  answer_derivation:
    kind: render_frame
    frame:
      text: Ho la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Ho la febbre signifie « j’ai de la fièvre » ; ho la tosse signifie « je tousse ».
    language_code: fr
    direction: ltr
