  frame:
    text: Prendi questa medicina e {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id013
    hint: *id013
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Riposa est l’impératif informel : repose-toi.'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit16.lesson03.translate.005
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: translation
  frame:
    text: Je dois aller chez le médecin (un homme).
    language_code: fr
    direction: ltr
  slots:
    item: *id014
  answer_derivation:
    kind: render_frame
    frame:
      text: Devo andare dal {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: 'Dal est da plus il : on l’emploie pour aller chez une personne, donc dal dottore signifie « chez le médecin ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit16.lesson03.translate.006
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
  type: translation
  frame:
    text: Prends ce médicament et repose-toi. (informel, tu)
    language_code: fr
    direction: ltr
  slots:
    item: *id015
  answer_derivation:
    kind: render_frame
    frame:
      text: Prendi questa {item} e riposa.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Prendi et riposa sont des impératifs informels, pour quelqu’un que tu tutoies.
    language_code: fr
    direction: ltr
