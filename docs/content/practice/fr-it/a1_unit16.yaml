  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Dottore désigne un médecin homme et dottoressa une femme médecin.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit16.lesson03.listen.002
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
