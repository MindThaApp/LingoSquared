    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Mi fa male signifie littéralement « ça me fait mal ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit16.lesson01.translate.005
