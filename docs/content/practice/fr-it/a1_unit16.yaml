    slot: item
  feedback_frame:
    text: Mi fa male la testa signifie « j’ai mal à la tête ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit16.lesson01.order.003
  lesson_content_key: it.a1.unit16.lesson01.mi_fa_male_la_testa
