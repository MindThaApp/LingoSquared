    language_code: it
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Devo signifie « je dois » et est suivi d’un infinitif, comme andare.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit16.lesson03.order.003
  lesson_content_key: it.a1.unit16.lesson03.devo_andare_dal_dottore
