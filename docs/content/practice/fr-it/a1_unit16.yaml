    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Ho la {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: En italien, on dit ho la febbre, avec l’article la devant febbre.
    language_code: fr
    direction: ltr
