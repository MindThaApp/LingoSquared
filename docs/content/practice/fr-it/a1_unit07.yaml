  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Basta così est une expression figée qui signifie « c’est tout, ça suffit ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit07.lesson03.listen.002
  lesson_content_key: it.a1.unit07.lesson03.il_conto
