    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Così signifie « ainsi » ou « comme ça », et dans basta così il conclut une commande.
    language_code: fr
    direction: ltr
