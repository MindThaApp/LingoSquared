- content_key: practice.fr-it.it.a1.unit07.lesson01.choose.001
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Cosa desidera? est la façon formelle dont un serveur de bar demande ce que tu veux.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit07.lesson01.listen.002
  lesson_content_key: it.a1.unit07.lesson01.al_bar
