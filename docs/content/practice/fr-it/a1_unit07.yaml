    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Per favore est la formule de politesse que l’on ajoute à chaque commande.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit07.lesson01.order.003
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: word_order
  frame:
    text: Vorrei un caffè e un {item}, per favore.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un {item}, per favore.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Vorrei signifie « je voudrais » et c’est la façon polie de commander.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit07.lesson01.fill.004
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: fill_in_blank
  frame:
    text: Vorrei un caffè, per {item}. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Per favore signifie « s’il vous plaît » et se place à la fin d’une demande.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit07.lesson01.translate.005
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: Je voudrais un café et un croissant, s’il vous plaît.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Vorrei un caffè e un cornetto, per {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Un s’emploie avec des noms masculins comme caffè et cornetto ; per favore termine la demande.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit07.lesson01.translate.006
  lesson_content_key: it.a1.unit07.lesson01.al_bar
  type: translation
  frame:
    text: Que désirez-vous ? (formel, Lei)
    language_code: fr
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: Cosa {item}?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Desidera est la forme de politesse Lei qu’emploie un serveur, et non la forme informelle en tu.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit07.lesson03.choose.001
  lesson_content_key: it.a1.unit07.lesson03.il_conto
