  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Comme formule d’accueil, pronto ne s’emploie qu’au téléphone ; ailleurs, il signifie « prêt ».
    language_code: fr
    direction: ltr
