    slot: item
  feedback_frame:
    text: Dei s’emploie avec les noms masculins pluriels et delle avec les noms féminins pluriels.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson01.order.003
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: word_order
  frame:
    text: Voglio {item} caffè, meno tè.
    language_code: it
    direction: ltr
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: Voglio {item} caffè, meno tè.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Più signifie « plus » et meno signifie « moins ».
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson01.order.004
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: word_order
  frame:
    text: I pomodori costano meno {item} mele.
    language_code: it
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: I pomodori costano meno {item} mele.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Mele est un féminin pluriel, donc di + le devient delle.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson01.fill.005
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: fill_in_blank
  frame:
    text: Le mele costano più {item} pomodori. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Pomodori est un masculin pluriel, donc di + i devient dei.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson01.translate.006
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: translation
  frame:
    text: Les pommes coûtent plus cher que les tomates.
    language_code: fr
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: Le mele costano più {item} pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Dei est di + i et s’accorde avec pomodori, le terme auquel on compare, et non avec mele.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson01.translate.007
  lesson_content_key: it.a1.unit15.lesson01.piu_meno_di
  type: translation
  frame:
    text: Les tomates coûtent moins cher que les pommes.
    language_code: fr
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: I pomodori costano meno {item} mele.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Meno delle signifie « moins que les », devant un nom féminin pluriel.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson03.choose.001
