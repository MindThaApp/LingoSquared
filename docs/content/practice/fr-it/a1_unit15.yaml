  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: word_order
  frame:
    text: Ciao, {item} preferisci, le mele o i pomodori?
    language_code: it
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, {item} preferisci, le mele o i pomodori?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Quale preferisci? demande lequel des deux tu préfères.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson02.fill.002
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: fill_in_blank
  frame:
