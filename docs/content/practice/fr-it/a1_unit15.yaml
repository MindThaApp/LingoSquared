    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Quale signifie « lequel » et se place avant le verbe dans cette question.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson02.translate.003
  lesson_content_key: it.a1.unit15.lesson02.quale_preferisci
  type: translation
  frame:
    text: Salut, tu préfères les pommes ou les tomates ? (tutoiement)
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Ciao, {item} preferisci, le mele o i pomodori?
      language_code: it
      direction: ltr
  feedback_frame:
    text: Preferisci est la forme du tu, donc cette question s’adresse à un ami.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson03.choose.002
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buone est le féminin pluriel de buono et s’accorde avec mele.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson03.listen.003
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: listen_select
  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Buone se termine par -e parce qu’il qualifie un nom féminin pluriel.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson03.order.004
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: word_order
  frame:
    text: Sì, le mele sono {item} come i pomodori.
    language_code: it
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Sì, le mele sono {item} come i pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Sono buone est au pluriel, donc buono devient buone avec le féminin pluriel mele.
    language_code: fr
    direction: ltr
