  frame:
    text: '{item}'
    language_code: it
    direction: ltr
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Più signifie « plus » ; dei et delle sont les formes plurielles de di + article défini.
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson01.listen.002
