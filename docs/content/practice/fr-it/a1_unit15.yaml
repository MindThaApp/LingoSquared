  frame:
    text: Le mele sono {item} come i pomodori. ({hint})
    language_code: it
    direction: ltr
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'Come relie deux choses égales : buone come signifie « aussi bonnes que ».'
    language_code: fr
    direction: ltr
- content_key: practice.fr-it.it.a1.unit15.lesson03.translate.006
  lesson_content_key: it.a1.unit15.lesson03.buone_come
  type: translation
  frame:
    text: Les pommes sont aussi bonnes que les tomates.
    language_code: fr
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: Le mele sono {item} come i pomodori.
      language_code: it
      direction: ltr
  feedback_frame:
    text: Buone s’accorde avec mele ; come signifie « que » dans cette comparaison.
    language_code: fr
    direction: ltr
