  lesson_content_key: it.a1.unit10.lesson01.a_destra_a_sinistra
  type: translation
  frame:
    text: Allez tout droit, puis tournez à droite au carrefour. (forme de politesse)
    language_code: fr
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: Vada sempre dritto, poi giri a destra {item}.
      language_code: it
      direction: ltr
  feedback_frame:
    text: All'incrocio signifie au carrefour.
    language_code: fr
    direction: ltr
