  stay_verb: &id004
    language_code: prs
    part_of_speech: verb
    agreement_tags:
      semantic: stay_verb
  hotel_or_stay: &id003
    language_code: prs
    part_of_speech:
    - noun
    - verb
    agreement_tags:
      semantic:
      - hotel_word
      - stay_verb
  dialogue_word: &id002
    language_code: prs
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic: dialogue_word
