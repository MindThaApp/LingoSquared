templates:
  - content_key: practice.en-ar.ar.a2.unit31.lesson01.choose.001
    lesson_content_key: ar.a2.unit31.lesson01.delay_reason
    type: multiple_choice
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l1a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "متأخر is masculine and agrees with القطار; فنية is feminine and agrees with مشكلة.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit31.lesson01.listen.002
    lesson_content_key: ar.a2.unit31.lesson01.delay_reason
    type: listen_select
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l1b}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "نصف ساعة is half an hour: two nouns side by side.", language_code: en, direction: ltr}
