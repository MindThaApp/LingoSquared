schema_version: "1.0"
pack_key: practice.en-ar.a2.unit26
source_language: en
target_language: ar
unit_content_key: ar.a2.unit26.araa
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-ar A2) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_ar.py (course en-ar-a2; tags ar_a2_u26*, single-member w_<token> anchors).
    Arabic is written without harakat, as in the realizations and the A1 packs. Every slot draws only on words
    this unit introduces; earlier words appear only as literal frame text. Fixed-sentence prompts name the
    addressee's gender in brackets where the Arabic form depends on it. Reviewer: confirm 'لا أوافقك الرأي' as
    the natural phrase for I disagree with you, and that 'الحصة' is the right word for a class session here.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_رأي, w_رأيك, w_أعتقد, w_الدرس, w_مفيد, w_سهل, w_الحصة, w_هادئ, w_هادئة, w_أن, w_لأنه, w_لأنها, w_الصباحية, w_الصباح, w_المسائية, w_أفضل, w_أوافقك, w_الرأي, w_أرى, w_تناسب, w_عملي, w_أفهم, w_أسهل, w_لكن]
slot_presets:
  l1a: &l1a {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_رأي, w_رأيك, w_أعتقد, w_الدرس, w_مفيد, w_سهل, w_الحصة, w_هادئ, w_هادئة]}}
  l1b: &l1b {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_رأي, w_الدرس, w_مفيد, w_سهل, w_الحصة, w_هادئ]}}
  rayak: &rayak {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_رأيك}}
  anna: &anna {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_أن}}
  dars: &dars {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_الدرس}}
  mufid: &mufid {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_مفيد}}
  sahl: &sahl {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_سهل}}
  liannahu: &liannahu {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_لأنه}}
  hadia: &hadia {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_هادئة}}
  liannaha: &liannaha {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_لأنها}}
  l2a: &l2a {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_الصباحية, w_الصباح, w_المسائية, w_أفضل, w_أوافقك, w_الرأي, w_أرى, w_تناسب, w_عملي, w_أفهم, w_أسهل]}}
  l2b: &l2b {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_الصباحية, w_المسائية, w_أفضل, w_الرأي, w_عملي, w_أسهل]}}
  sabahiyya: &sabahiyya {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_الصباحية}}
  masaiyya: &masaiyya {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_المسائية}}
  afdal: &afdal {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_أفضل}}
  uwafiq: &uwafiq {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_أوافقك}}
  alrai: &alrai {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_الرأي}}
  tunasib: &tunasib {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_تناسب}}
  lakin: &lakin {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_لكن}}
  afham: &afham {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_أفهم}}
  ashal: &ashal {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_أسهل}}
templates:
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.choose.001
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: multiple_choice
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l1a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "هادئ is masculine and هادئة is feminine; الدرس is masculine and الحصة is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.listen.002
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: listen_select
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l1b}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "رأي is an opinion; رأيك adds the ending ك for your.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.match.003
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ar, direction: rtl}
    slots: {first: *l1a, second: *l1a, third: *l1a, fourth: *l1a, fifth: *l1a, sixth: *l1a}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Adjectives used to give an opinion, with masculine and feminine forms.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.order.004
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: word_order
    frame: {text: "ما {item}؟", language_code: ar, direction: rtl}
    slots: {item: *rayak}
    answer_derivation: {kind: render_frame, frame: {text: "ما {item}؟", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The ending ك means your when attached to a noun.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.order.005
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: word_order
    frame: {text: "أعتقد {item} الدرس مفيد.", language_code: ar, direction: rtl}
    slots: {item: *anna}
    answer_derivation: {kind: render_frame, frame: {text: "أعتقد {item} الدرس مفيد.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "أن joins أعتقد to the statement that follows.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.order.006
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: word_order
    frame: {text: "الدرس {item}.", language_code: ar, direction: rtl}
    slots: {item: *mufid}
    answer_derivation: {kind: render_frame, frame: {text: "الدرس {item}.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "مفيد is masculine and agrees with الدرس.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.order.007
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: word_order
    frame: {text: "أعتقد أن الدرس مفيد {item} سهل.", language_code: ar, direction: rtl}
    slots: {item: *liannahu}
    answer_derivation: {kind: render_frame, frame: {text: "أعتقد أن الدرس مفيد {item} سهل.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "لأنه gives the reason for a masculine subject.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.order.008
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: word_order
    frame: {text: "الحصة {item}.", language_code: ar, direction: rtl}
    slots: {item: *hadia}
    answer_derivation: {kind: render_frame, frame: {text: "الحصة {item}.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "Feminine nouns take the adjective ending ة.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.order.009
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: word_order
    frame: {text: "أرى أن الحصة أفضل {item} هادئة.", language_code: ar, direction: rtl}
    slots: {item: *liannaha}
    answer_derivation: {kind: render_frame, frame: {text: "أرى أن الحصة أفضل {item} هادئة.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "لأنها gives the reason for a feminine subject.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.fill.010
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: fill_in_blank
    frame: {text: "أعتقد {item} الدرس مفيد. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *anna, hint: *anna}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "After أعتقد the statement is introduced by أن.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.fill.011
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: fill_in_blank
    frame: {text: "الدرس {item}. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *sahl, hint: *sahl}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "سهل is masculine, like الدرس.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.fill.012
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: fill_in_blank
    frame: {text: "أعتقد أن الدرس مفيد {item} سهل. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *liannahu, hint: *liannahu}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The ending ه refers back to a masculine noun.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.translate.013
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l1b}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "مفيد and سهل are masculine adjectives.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.translate.014
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: translation
    frame: {text: "What is your opinion?", language_code: en, direction: ltr}
    slots: {item: *rayak}
    answer_derivation: {kind: render_frame, frame: {text: "ما {item}", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The question uses ما followed by the noun with ك.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.translate.015
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: translation
    frame: {text: "I think the lesson is useful.", language_code: en, direction: ltr}
    slots: {item: *dars}
    answer_derivation: {kind: render_frame, frame: {text: "أعتقد أن {item} مفيد", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The word أن introduces what the speaker thinks.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson01.translate.016
    lesson_content_key: ar.a2.unit26.lesson01.opinion_reason
    type: translation
    frame: {text: "The class is quiet.", language_code: en, direction: ltr}
    slots: {item: *hadia}
    answer_derivation: {kind: render_frame, frame: {text: "الحصة {item}", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The adjective agrees with the feminine noun.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.choose.001
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: multiple_choice
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l2a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "الصباحية and المسائية are feminine adjectives, matching the feminine الحصة.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.listen.002
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: listen_select
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l2b}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "أسهل and أفضل are comparative forms: easier and better.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.match.003
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ar, direction: rtl}
    slots: {first: *l2a, second: *l2a, third: *l2a, fourth: *l2a, fifth: *l2a, sixth: *l2a}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words for comparing and responding to someone's opinion.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.order.004
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: word_order
    frame: {text: "الحصة {item} هادئة.", language_code: ar, direction: rtl}
    slots: {item: *sabahiyya}
    answer_derivation: {kind: render_frame, frame: {text: "الحصة {item} هادئة.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The adjective follows the noun and takes the article.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.order.005
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: word_order
    frame: {text: "الحصة {item} مفيدة.", language_code: ar, direction: rtl}
    slots: {item: *masaiyya}
    answer_derivation: {kind: render_frame, frame: {text: "الحصة {item} مفيدة.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "Both words take the article and are feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.order.006
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: word_order
    frame: {text: "الحصة المسائية {item} عملي.", language_code: ar, direction: rtl}
    slots: {item: *tunasib}
    answer_derivation: {kind: render_frame, frame: {text: "الحصة المسائية {item} عملي.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "تناسب is the feminine verb because الحصة is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.order.007
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: word_order
    frame: {text: "لا {item} الرأي.", language_code: ar, direction: rtl}
    slots: {item: *uwafiq}
    answer_derivation: {kind: render_frame, frame: {text: "لا {item} الرأي.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "لا before a verb negates it.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.order.008
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: word_order
    frame: {text: "أفهم رأيك، {item} الصباح أسهل لي.", language_code: ar, direction: rtl}
    slots: {item: *lakin}
    answer_derivation: {kind: render_frame, frame: {text: "أفهم رأيك، {item} الصباح أسهل لي.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "لكن introduces a contrast.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.order.009
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: word_order
    frame: {text: "الصباح {item} لي.", language_code: ar, direction: rtl}
    slots: {item: *ashal}
    answer_derivation: {kind: render_frame, frame: {text: "الصباح {item} لي.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "أسهل is a comparative with no gender change.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.fill.010
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: fill_in_blank
    frame: {text: "أرى أن الحصة المسائية {item}. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *afdal, hint: *afdal}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "أفضل means better.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.fill.011
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: fill_in_blank
    frame: {text: "لا أوافقك {item} في هذا الدرس. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *alrai, hint: *alrai}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "الرأي takes the article because a specific opinion is meant.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.fill.012
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: fill_in_blank
    frame: {text: "{item} رأيك، لكن الصباح أسهل لي. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *afham, hint: *afham}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "أفهم is the first person singular of the verb to understand.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.translate.013
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l2b}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "أسهل and أفضل are comparative adjectives.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.translate.014
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: translation
    frame: {text: "The morning class is quiet.", language_code: en, direction: ltr}
    slots: {item: *sabahiyya}
    answer_derivation: {kind: render_frame, frame: {text: "الحصة {item} هادئة", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The adjective agrees with الحصة in gender.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.translate.015
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: translation
    frame: {text: "I do not agree with you.", language_code: en, direction: ltr}
    slots: {item: *uwafiq}
    answer_derivation: {kind: render_frame, frame: {text: "لا {item} الرأي", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The Arabic idiom uses the verb with الرأي.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit26.lesson02.translate.016
    lesson_content_key: ar.a2.unit26.lesson02.respond_contrast
    type: translation
    frame: {text: "The evening class suits my work.", language_code: en, direction: ltr}
    slots: {item: *tunasib}
    answer_derivation: {kind: render_frame, frame: {text: "الحصة المسائية {item} عملي", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The verb is feminine to match الحصة.", language_code: en, direction: ltr}
