schema_version: "1.0"
pack_key: practice.en-ar.a1.unit17
source_language: en
target_language: ar
unit_content_key: ar.a1.unit17.health
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ar) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_ar.py (per-unit tags ar_a1_u17*, single-member w_<token> anchors). Pools are
    unit-scoped. The imperatives اشربي and استريحي are feminine singular (Yusuf advises Layla), so every
    English prompt says "(to a woman)"; استريحي and واستريحي are never in the same pool. أحتاج and عندي are
    written without a separate pronoun, so prompts add "(no separate word for I)". Matching draws 6 of the
    8 distinct-sense tokens. Canon checked: Layla is the woman in the unit's dialogue (قالت ليلى), Yusuf the
    man advising her. Reviewer: confirm "اشربي ماء واستريحي" and "أحتاج مساعدة".
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_ألم, w_الرأس, w_البطن, w_المشكلة, w_اشربي, w_استريحي, w_أحتاج, w_مساعدة, w_واستريحي]
slot_presets:
  l1: &l1 {language_code: ar, part_of_speech: noun, agreement_tags: {semantic: [w_ألم, w_الرأس, w_البطن]}}
  body: &body {language_code: ar, part_of_speech: noun, agreement_tags: {semantic: [w_الرأس, w_البطن]}}
  l2: &l2 {language_code: ar, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_المشكلة, w_اشربي, w_استريحي, w_أحتاج, w_مساعدة]}}
  m8: &m8 {language_code: ar, part_of_speech: [noun, verb], agreement_tags: {semantic: [w_ألم, w_الرأس, w_البطن, w_المشكلة, w_اشربي, w_استريحي, w_أحتاج, w_مساعدة]}}
  alam: &alam {language_code: ar, part_of_speech: noun, agreement_tags: {semantic: w_ألم}}
  ras: &ras {language_code: ar, part_of_speech: noun, agreement_tags: {semantic: w_الرأس}}
  batn: &batn {language_code: ar, part_of_speech: noun, agreement_tags: {semantic: w_البطن}}
  mushkila: &mushkila {language_code: ar, part_of_speech: noun, agreement_tags: {semantic: w_المشكلة}}
  ishrabi: &ishrabi {language_code: ar, part_of_speech: verb, agreement_tags: {semantic: w_اشربي}}
  istarihi: &istarihi {language_code: ar, part_of_speech: verb, agreement_tags: {semantic: w_استريحي}}
  wastarihi: &wastarihi {language_code: ar, part_of_speech: verb, agreement_tags: {semantic: w_واستريحي}}
  ahtaj: &ahtaj {language_code: ar, part_of_speech: verb, agreement_tags: {semantic: w_أحتاج}}
  musaada: &musaada {language_code: ar, part_of_speech: noun, agreement_tags: {semantic: w_مساعدة}}
templates:
  - content_key: practice.en-ar.ar.a1.unit17.lesson01.choose.001
    lesson_content_key: ar.a1.unit17.lesson01.basic_problem
    type: multiple_choice
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "ألم is pain; الرأس is the head and البطن the stomach, both with ال.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson01.listen.002
    lesson_content_key: ar.a1.unit17.lesson01.basic_problem
    type: listen_select
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "عندي ألم في الرأس is I have a pain in the head; the body part has ال.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson01.order.003
    lesson_content_key: ar.a1.unit17.lesson01.basic_problem
    type: word_order
    frame: {text: "عندي ألم في {item}.", language_code: ar, direction: rtl}
    slots: {item: *body}
    answer_derivation: {kind: render_frame, frame: {text: "عندي ألم في {item}.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "في (in) is followed by the body part with ال: في الرأس, في البطن.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson01.fill.004
    lesson_content_key: ar.a1.unit17.lesson01.basic_problem
    type: fill_in_blank
    frame: {text: "عندي ألم في {item}. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *ras, hint: *ras}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The head is الرأس; the sentence says I have a pain in the head.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson01.translate.005
    lesson_content_key: ar.a1.unit17.lesson01.basic_problem
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "ألم is a noun meaning pain, and the two body parts are nouns with ال.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson01.translate.006
    lesson_content_key: ar.a1.unit17.lesson01.basic_problem
    type: translation
    frame: {text: "I have a pain in the head.", language_code: en, direction: ltr}
    slots: {a: *alam, b: *ras}
    answer_derivation: {kind: render_frame, frame: {text: "عندي {a} في {b}", language_code: ar, direction: rtl}}
    feedback_frame: {text: "عندي (I have) needs no verb: عندي ألم is I have a pain.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson01.translate.007
    lesson_content_key: ar.a1.unit17.lesson01.basic_problem
    type: translation
    frame: {text: "I have a pain in the stomach.", language_code: en, direction: ltr}
    slots: {a: *alam, b: *batn}
    answer_derivation: {kind: render_frame, frame: {text: "عندي {a} في {b}", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The body part keeps ال after في: في البطن.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson02.choose.001
    lesson_content_key: ar.a1.unit17.lesson02.simple_advice
    type: multiple_choice
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "أحتاج is I need and مساعدة is help; the verb has no separate pronoun.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson02.listen.002
    lesson_content_key: ar.a1.unit17.lesson02.simple_advice
    type: listen_select
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "اشربي is the feminine command: drink, said to a woman.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson02.match.003
    lesson_content_key: ar.a1.unit17.lesson02.simple_advice
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ar, direction: rtl}
    slots: {first: *m8, second: *m8, third: *m8, fourth: *m8, fifth: *m8, sixth: *m8}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "اشربي and استريحي are commands to a woman; أحتاج is I need; المشكلة has ال, so it means the problem.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson02.order.004
    lesson_content_key: ar.a1.unit17.lesson02.simple_advice
    type: word_order
    frame: {text: "ما {item} يا ليلى؟", language_code: ar, direction: rtl}
    slots: {item: *mushkila}
    answer_derivation: {kind: render_frame, frame: {text: "ما {item} يا ليلى؟", language_code: ar, direction: rtl}}
    feedback_frame: {text: "ما المشكلة؟ is what is the problem; يا ليلى addresses her.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson02.order.005
    lesson_content_key: ar.a1.unit17.lesson02.simple_advice
    type: word_order
    frame: {text: "عندي ألم. أحتاج {item}.", language_code: ar, direction: rtl}
    slots: {item: *musaada}
    answer_derivation: {kind: render_frame, frame: {text: "عندي ألم. أحتاج {item}.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "أحتاج is followed directly by what is needed: أحتاج مساعدة.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson02.order.006
    lesson_content_key: ar.a1.unit17.lesson02.simple_advice
    type: word_order
    frame: {text: "يا ليلى {item} ماء.", language_code: ar, direction: rtl}
    slots: {item: *ishrabi}
    answer_derivation: {kind: render_frame, frame: {text: "يا ليلى {item} ماء.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The ending ـي marks a command to a woman: اشربي ماء.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson02.fill.007
    lesson_content_key: ar.a1.unit17.lesson02.simple_advice
    type: fill_in_blank
    frame: {text: "اشربي ماء {item}. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *wastarihi, hint: *wastarihi}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The و is written onto the next word: واستريحي means and rest.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson02.fill.008
    lesson_content_key: ar.a1.unit17.lesson02.simple_advice
    type: fill_in_blank
    frame: {text: "عندي ألم. {item} مساعدة. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *ahtaj, hint: *ahtaj}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "أحتاج is I need; the أ prefix marks I.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson02.translate.009
    lesson_content_key: ar.a1.unit17.lesson02.simple_advice
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "اشربي and استريحي are commands to a woman, ending in ـي.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson02.translate.010
    lesson_content_key: ar.a1.unit17.lesson02.simple_advice
    type: translation
    frame: {text: "Layla, drink water. (to a woman)", language_code: en, direction: ltr}
    slots: {item: *ishrabi}
    answer_derivation: {kind: render_frame, frame: {text: "يا ليلى {item} ماء", language_code: ar, direction: rtl}}
    feedback_frame: {text: "Yusuf tells Layla to drink: اشربي is the feminine command.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit17.lesson02.translate.011
    lesson_content_key: ar.a1.unit17.lesson02.simple_advice
    type: translation
    frame: {text: "I have a pain. I need help. (no separate word for I)", language_code: en, direction: ltr}
    slots: {a: *alam, b: *ahtaj, c: *musaada}
    answer_derivation: {kind: render_frame, frame: {text: "عندي {a}. {b} {c}.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "Both عندي and أحتاج carry I in their form, so no أنا is needed.", language_code: en, direction: ltr}
