    frame: {text: 'كنت قد {item} مفتاح المنزل.', language_code: ar, direction: rtl}
  feedback_frame: {text: 'I had forgotten the house key. كنت قد نسيت = ''I had forgotten'' -- كنت (I was) + قد + the plain past verb نسيت together form MSA''s pluperfect, marking this event as earlier than the surrounding narration.', language_code: en, direction: ltr}
