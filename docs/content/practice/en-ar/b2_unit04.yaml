      agreement_tags: {semantic: w_مفتاح}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'I had forgotten the house key, so I went back to get it. The pre-past event (كنت قد نسيت, the earliest link in the chain) explains a later action (رجعت) -- exactly the ''event before other past events'' this outcome targets.', language_code: en, direction: ltr}
