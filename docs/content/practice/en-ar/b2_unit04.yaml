    frame: {text: 'قبل ذلك، كنت قد نسيت مفتاح {item}، لذلك رجعت لآخذه.', language_code: ar, direction: rtl}
  feedback_frame: {text: 'Yusuf: Before that, I had forgotten the house key, so I went back to get it. قبل ذلك signals a flashback to the TRUE earliest event in the account.', language_code: en, direction: ltr}
