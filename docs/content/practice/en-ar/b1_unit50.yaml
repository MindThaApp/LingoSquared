  p2: &p2 {language_code: ar, part_of_speech: ["noun", "verb", "adjective", "adverb", "particle", "preposition"], agreement_tags: {semantic: ["w_الرغم", "w_الأمر", "w_يحمل", "w_مخاطرة", "w_أؤيد", "w_فتح", "w_مكتب", "w_ثان", "w_غير", "w_علينا", "w_نضع", "w_خطة", "w_دقيقة", "w_أولا", "w_رأيك"]}}
  p3: &p3 {language_code: ar, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_الرغم"]}}
  p4: &p4 {language_code: ar, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_الأمر"]}}
