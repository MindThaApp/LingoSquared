schema_version: '1.0'
pack_key: practice.en-ar.a1.unit34
source_language: en
target_language: ar
unit_content_key: ar.a1.unit34.neighbourhood
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ar backfill lexemes (tags ar_a1_u34 / w_<token>). 18 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_أسكن, w_أسلم, w_الجار, w_الحي, w_السوبرماركت, w_جار, w_جاري, w_حيك, w_حيي, w_وجارتي, w_ودود, w_ويحب, w_ويسلم, w_يسكن, w_يسلم, w_يعجبني, w_يعرف, w_يعرفان]
templates:
- content_key: practice.en-ar.ar.a1.unit34.lesson01.choose.001
  lesson_content_key: ar.a1.unit34.lesson01.alhy
  type: multiple_choice
  frame: {text: '{item}', language_code: ar, direction: rtl}
  slots:
    item: &id001
      language_code: ar
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_الحي, w_أسكن, w_السوبرماركت, w_حيي, w_الجار, w_جاري, w_يعرف, w_وجارتي, w_ودود, w_يسلم, w_أسلم, w_ويحب, w_يسكن, w_جار, w_ويسلم, w_يعرفان, w_يعجبني, w_حيك]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on the neighborhood.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.a1.unit34.lesson02.listen.001
  lesson_content_key: ar.a1.unit34.lesson02.jary_wjarty
  type: listen_select
  frame: {text: '{item}', language_code: ar, direction: rtl}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on my male and female neighbor.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.a1.unit34.lesson03.translate.001
  lesson_content_key: ar.a1.unit34.lesson03.wdwd_wyslm
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on friendly and greeting.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.a1.unit34.lesson05.match.001
  lesson_content_key: ar.a1.unit34.lesson05.mn_hw_mn_fy
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ar, direction: rtl}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Arabic word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.a1.unit34.lesson06.choose.001
