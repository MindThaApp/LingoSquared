schema_version: "1.0"
pack_key: practice.en-ar.a2.unit27
source_language: en
target_language: ar
unit_content_key: ar.a2.unit27.bank
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-ar A2) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_ar.py (course en-ar-a2; tags ar_a2_u27*, single-member w_<token> anchors).
    Arabic is written without harakat, as in the realizations and the A1 packs. Every slot draws only on words
    this unit introduces; earlier words appear only as literal frame text. Fixed-sentence prompts name the
    addressee's gender in brackets where the Arabic form depends on it. Reviewer: بنكي (masc.) and بنكية
    (fem.) are kept out of recognition pools because their glosses would be confusable with بنك. 'عندك' is
    glossed without gender because the written form is the same for a man and a woman.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_بنك, w_حساب, w_فتح, w_إثبات, w_عنوان, w_عندي, w_بطاقة, w_رسوم, w_الموظفة, w_يشمل, w_توجد, w_عندك, w_بنكي, w_وإثبات, w_مصرفية, w_شهرية, w_الحساب, w_الأساسي, w_أهلا]
slot_presets:
  l1a: &l1a {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_بنك, w_حساب, w_فتح, w_إثبات, w_عنوان, w_عندي]}}
  l1b: &l1b {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_بنك, w_حساب, w_فتح, w_إثبات, w_عنوان]}}
  m27: &m27 {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_بنك, w_حساب, w_فتح, w_إثبات, w_عنوان, w_بطاقة, w_رسوم, w_الموظفة, w_يشمل, w_توجد, w_عندي, w_عندك]}}
  fatah: &fatah {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_فتح}}
  banki: &banki {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_بنكي}}
  wa_ithbat: &wa_ithbat {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_وإثبات}}
  bank: &bank {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_بنك}}
  hisab: &hisab {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_حساب}}
  unwan: &unwan {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_عنوان}}
  ithbat: &ithbat {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_إثبات}}
  l2a: &l2a {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_بطاقة, w_مصرفية, w_رسوم, w_شهرية, w_الحساب, w_الأساسي, w_الموظفة]}}
  l2b: &l2b {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: [w_بطاقة, w_رسوم, w_الحساب, w_الموظفة, w_يشمل, w_توجد, w_عندك]}}
  alhisab: &alhisab {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_الحساب}}
  bitaqa: &bitaqa {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_بطاقة}}
  tujad: &tujad {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_توجد}}
  rusum: &rusum {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_رسوم}}
  shahriyya: &shahriyya {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_شهرية}}
  indak: &indak {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_عندك}}
  asasi: &asasi {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_الأساسي}}
  yashmal: &yashmal {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_يشمل}}
  ahlan: &ahlan {language_code: ar, part_of_speech: [noun, verb, adjective, adverb, pronoun, phrase, particle, preposition, proper_noun], agreement_tags: {semantic: w_أهلا}}
templates:
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.choose.001
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: multiple_choice
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l1a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "حساب is an account and عنوان is an address; عندي says I have.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.listen.002
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: listen_select
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l1b}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "فتح is the noun opening, used after أريد to say I want to open.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.match.003
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ar, direction: rtl}
    slots: {first: *m27, second: *m27, third: *m27, fourth: *m27, fifth: *m27, sixth: *m27}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Nouns and verbs from opening a bank account.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.order.004
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: word_order
    frame: {text: "أريد {item} حساب بنكي.", language_code: ar, direction: rtl}
    slots: {item: *fatah}
    answer_derivation: {kind: render_frame, frame: {text: "أريد {item} حساب بنكي.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "After أريد the noun فتح can follow directly.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.order.005
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: word_order
    frame: {text: "أريد فتح حساب {item}.", language_code: ar, direction: rtl}
    slots: {item: *banki}
    answer_derivation: {kind: render_frame, frame: {text: "أريد فتح حساب {item}.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "بنكي is masculine to agree with حساب.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.order.006
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: word_order
    frame: {text: "عندي جواز سفر {item} عنوان.", language_code: ar, direction: rtl}
    slots: {item: *wa_ithbat}
    answer_derivation: {kind: render_frame, frame: {text: "عندي جواز سفر {item} عنوان.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The و is written together with the word that follows.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.fill.007
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: fill_in_blank
    frame: {text: "هذا {item}. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *bank, hint: *bank}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "هذا points to a masculine noun.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.fill.008
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: fill_in_blank
    frame: {text: "أريد فتح {item}. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *hisab, hint: *hisab}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "حساب is an account.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.fill.009
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: fill_in_blank
    frame: {text: "عندي جواز سفر وإثبات {item}. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *unwan, hint: *unwan}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "إثبات عنوان is proof of address: two nouns side by side.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.translate.010
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l1b}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The loanword بنك is a bank; حساب is an account.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.translate.011
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: translation
    frame: {text: "I want to open a bank account.", language_code: en, direction: ltr}
    slots: {item: *banki}
    answer_derivation: {kind: render_frame, frame: {text: "أريد فتح حساب {item}", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The adjective follows the noun and agrees with it.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.translate.012
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: translation
    frame: {text: "I have proof of address.", language_code: en, direction: ltr}
    slots: {item: *ithbat}
    answer_derivation: {kind: render_frame, frame: {text: "عندي {item} عنوان", language_code: ar, direction: rtl}}
    feedback_frame: {text: "Two nouns together express of: proof of address.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson01.translate.013
    lesson_content_key: ar.a2.unit27.lesson01.account_requirements
    type: translation
    frame: {text: "This is a bank.", language_code: en, direction: ltr}
    slots: {item: *bank}
    answer_derivation: {kind: render_frame, frame: {text: "هذا {item}", language_code: ar, direction: rtl}}
    feedback_frame: {text: "Arabic has no word for is in this sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.choose.001
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: multiple_choice
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l2a}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "مصرفية and شهرية are feminine adjectives, matching the feminine بطاقة and رسوم.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.listen.002
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: listen_select
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l2b}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "الموظفة is the feminine employee; the masculine is الموظف.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.match.003
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ar, direction: rtl}
    slots: {first: *m27, second: *m27, third: *m27, fourth: *m27, fifth: *m27, sixth: *m27}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "Words for what a bank account includes.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.order.004
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: word_order
    frame: {text: "يشمل {item} بطاقة مصرفية.", language_code: ar, direction: rtl}
    slots: {item: *alhisab}
    answer_derivation: {kind: render_frame, frame: {text: "يشمل {item} بطاقة مصرفية.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "يشمل is masculine to agree with الحساب.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.order.005
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: word_order
    frame: {text: "يشمل الحساب {item} مصرفية.", language_code: ar, direction: rtl}
    slots: {item: *bitaqa}
    answer_derivation: {kind: render_frame, frame: {text: "يشمل الحساب {item} مصرفية.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "بطاقة is feminine, so the adjective ends in ة.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.order.006
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: word_order
    frame: {text: "هل {item} رسوم شهرية؟", language_code: ar, direction: rtl}
    slots: {item: *tujad}
    answer_derivation: {kind: render_frame, frame: {text: "هل {item} رسوم شهرية؟", language_code: ar, direction: rtl}}
    feedback_frame: {text: "توجد is the feminine verb for there is, since رسوم is treated as feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.order.007
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: word_order
    frame: {text: "لا توجد {item} شهرية.", language_code: ar, direction: rtl}
    slots: {item: *rusum}
    answer_derivation: {kind: render_frame, frame: {text: "لا توجد {item} شهرية.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "رسوم is the plural fees.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.order.008
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: word_order
    frame: {text: "هل {item} جواز سفر وإثبات عنوان؟", language_code: ar, direction: rtl}
    slots: {item: *indak}
    answer_derivation: {kind: render_frame, frame: {text: "هل {item} جواز سفر وإثبات عنوان؟", language_code: ar, direction: rtl}}
    feedback_frame: {text: "عندك means you have, and هل turns it into a question.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.fill.009
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: fill_in_blank
    frame: {text: "يشمل الحساب {item} مصرفية. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *bitaqa, hint: *bitaqa}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "مصرفية describes the card and is feminine.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.fill.010
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: fill_in_blank
    frame: {text: "هل توجد رسوم {item}؟ ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *shahriyya, hint: *shahriyya}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "شهرية is feminine like رسوم.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.fill.011
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: fill_in_blank
    frame: {text: "{item} الحساب بطاقة مصرفية. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *yashmal, hint: *yashmal}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "يشمل means includes.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.fill.012
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: fill_in_blank
    frame: {text: "هل {item} جواز سفر وإثبات عنوان؟ ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *indak, hint: *indak}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "عندك can address a man or a woman.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.translate.013
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l2b}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "الموظفة and الموظف differ by the feminine ending.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.translate.014
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: translation
    frame: {text: "Does the account include a bank card?", language_code: en, direction: ltr}
    slots: {item: *yashmal}
    answer_derivation: {kind: render_frame, frame: {text: "هل {item} الحساب بطاقة مصرفية", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The verb comes before its subject in this kind of sentence.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.translate.015
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: translation
    frame: {text: "There are no monthly fees.", language_code: en, direction: ltr}
    slots: {item: *tujad}
    answer_derivation: {kind: render_frame, frame: {text: "لا {item} رسوم شهرية", language_code: ar, direction: rtl}}
    feedback_frame: {text: "لا توجد says there are none.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.translate.016
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: translation
    frame: {text: "Do you have a passport and proof of address?", language_code: en, direction: ltr}
    slots: {item: *indak}
    answer_derivation: {kind: render_frame, frame: {text: "هل {item} جواز سفر وإثبات عنوان", language_code: ar, direction: rtl}}
    feedback_frame: {text: "عندك expresses you have.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a2.unit27.lesson02.translate.017
    lesson_content_key: ar.a2.unit27.lesson02.at_the_bank
    type: translation
    frame: {text: "Welcome, how can I help you?", language_code: en, direction: ltr}
    slots: {item: *ahlan}
    answer_derivation: {kind: render_frame, frame: {text: "{item} وسهلا، كيف أساعدك", language_code: ar, direction: rtl}}
    feedback_frame: {text: "أهلا وسهلا is the usual welcome.", language_code: en, direction: ltr}
