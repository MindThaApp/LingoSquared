    this unit introduces; earlier words appear only as literal frame text. Fixed-sentence prompts name the
    addressee's gender in brackets where the Arabic form depends on it. Lesson 1 has eight lexemes and lesson
    2 seven, so matching uses the unit-wide pool. Reviewer: confirm 'صالة الرياضة' for gym and 'أطبخ العشاء'
    for cook dinner.
