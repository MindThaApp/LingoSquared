schema_version: '1.0'
pack_key: practice.en-ar.b2.unit02
source_language: en
target_language: ar
unit_content_key: ar.b2.unit02.altakhmin
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ar backfill lexemes (tags ar_b2_u2 / w_<token>). 32 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_أستنتج, w_أين, w_اجتماع, w_الآن, w_الأمر, w_الاتصال, w_الاجتماع, w_الحافلة, w_الزميل, w_الصباح, w_المستحيل, w_المكتب, w_اليوم, w_برأيك, w_بسيط, w_جدا, w_حاول, w_ربما, w_سيصل, w_فاتته, w_قريبا, w_لذلك, w_لست, w_متأكدا, w_مشغولا, w_مغلق, w_نائم, w_نسي, w_هاتفه, w_يرد, w_يصل, w_يكون]
templates:
- content_key: practice.en-ar.ar.b2.unit02.lesson01.choose.001
  lesson_content_key: ar.b2.unit02.lesson01.altakhmin_alasasi
  type: multiple_choice
  frame: {text: '{item}', language_code: ar, direction: rtl}
  slots:
    item: &id001
      language_code: ar
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_الزميل, w_يصل, w_اجتماع, w_يكون, w_الآن, w_ربما, w_مشغولا, w_جدا, w_المستحيل, w_اليوم, w_نسي, w_الاجتماع, w_الحافلة, w_فاتته, w_الصباح, w_أستنتج, w_هاتفه, w_مغلق, w_لذلك, w_يرد, w_الاتصال, w_نائم, w_لست, w_متأكدا, w_المكتب, w_حاول, w_الأمر, w_بسيط, w_أين, w_برأيك, w_سيصل, w_قريبا]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on basic speculation.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson02.listen.001
  lesson_content_key: ar.b2.unit02.lesson02.alyaqin_alqawi
  type: listen_select
  frame: {text: '{item}', language_code: ar, direction: rtl}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on strong certainty.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson03.translate.001
  lesson_content_key: ar.b2.unit02.lesson03.altakhmin_hawl_almadi
  type: translation
  frame:
    text: '{item}'
    language_code: en
    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on speculating about the past.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson04.match.001
  lesson_content_key: ar.b2.unit02.lesson04.alistintaj_waltakhmin
  type: matching_pairs
  frame: {text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}', language_code: ar, direction: rtl}
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002 [first, second, third, fourth, fifth, sixth]
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame: {text: Match each Arabic word with its English meaning; the words come from this unit's lessons., language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson05.choose.001
  lesson_content_key: ar.b2.unit02.lesson05.qiraat_nass_takhmini
  type: multiple_choice
  frame: {text: '{item}', language_code: ar, direction: rtl}
  slots:
    item: *id001
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on reading a speculative text.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson06.translate.001
  lesson_content_key: ar.b2.unit02.lesson06.hiwar_takhmini_kamil
  type: translation
  frame:
