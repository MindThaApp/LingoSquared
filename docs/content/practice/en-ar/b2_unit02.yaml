      agreement_tags: {semantic: w_حاول}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Yusuf: He must have tried to call, but his phone is off. حاول means he tried (past).', language_code: en, direction: ltr}
