    frame: {text: 'الجو بارد، {item} أرتدي معطفا.', language_code: ar, direction: rtl}
  feedback_frame: {text: 'The weather is cold, therefore I wear a coat. لذلك means therefore.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson05.order.002
