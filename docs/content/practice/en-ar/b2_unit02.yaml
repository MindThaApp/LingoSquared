    direction: ltr
    slot_rendering: {item: english_gloss}
  slots:
    item: *id001
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on a full speculative dialogue.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson01.order.002
  lesson_content_key: ar.b2.unit02.lesson01.altakhmin_alasasi
  type: word_order
  frame: {text: 'لدينا {item} مهم اليوم.', language_code: ar, direction: rtl}
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags: {semantic: w_اجتماع}
  answer_derivation:
    kind: render_frame
    frame: {text: 'لدينا {item} مهم اليوم.', language_code: ar, direction: rtl}
  feedback_frame: {text: We have an important meeting today. اجتماع means meeting., language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson01.fill.003
  lesson_content_key: ar.b2.unit02.lesson01.altakhmin_alasasi
  type: fill_in_blank
  frame:
    text: قد {item} مريضا. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags: {semantic: w_يكون}
    hint:
      language_code: ar
      part_of_speech: verb
      agreement_tags: {semantic: w_يكون}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: He might be sick. يكون means to be; he is., language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson01.translate.004
  lesson_content_key: ar.b2.unit02.lesson01.altakhmin_alasasi
  type: translation
  frame: {text: Karim might be in a meeting now., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ar
      part_of_speech: adverb
      agreement_tags: {semantic: w_الآن}
  answer_derivation:
    kind: render_frame
    frame: {text: 'قد يكون كريم في اجتماع {item}.', language_code: ar, direction: rtl}
  feedback_frame: {text: 'Karim might be in a meeting now. The model weak-possibility speculation for this unit, about a PRESENT situation.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson02.order.002
  lesson_content_key: ar.b2.unit02.lesson02.alyaqin_alqawi
  type: word_order
  frame: {text: 'الاجتماع مهم {item}.', language_code: ar, direction: rtl}
  slots:
    item:
      language_code: ar
      part_of_speech: adverb
      agreement_tags: {semantic: w_جدا}
  answer_derivation:
    kind: render_frame
    frame: {text: 'الاجتماع مهم {item}.', language_code: ar, direction: rtl}
  feedback_frame: {text: The meeting is very important. جدا means very., language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson02.fill.003
  lesson_content_key: ar.b2.unit02.lesson02.alyaqin_alqawi
  type: fill_in_blank
  frame:
    text: من {item} أن يكون في اجتماع طوال اليوم. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags: {semantic: w_المستحيل}
    hint:
      language_code: ar
      part_of_speech: noun
      agreement_tags: {semantic: w_المستحيل}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: It's impossible that he is in a meeting all day. المستحيل means the impossible., language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson02.translate.004
  lesson_content_key: ar.b2.unit02.lesson02.alyaqin_alqawi
  type: translation
  frame: {text: He is busy today., language_code: en, direction: ltr}
  slots:
    item:
      language_code: ar
      part_of_speech: adverb
      agreement_tags: {semantic: w_اليوم}
  answer_derivation:
    kind: render_frame
    frame: {text: 'هو مشغول {item}.', language_code: ar, direction: rtl}
  feedback_frame: {text: He is busy today. اليوم means today., language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson03.order.002
  lesson_content_key: ar.b2.unit02.lesson03.altakhmin_hawl_almadi
  type: word_order
  frame: {text: 'لا بد أنه {item} الاجتماع.', language_code: ar, direction: rtl}
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags: {semantic: w_نسي}
  answer_derivation:
    kind: render_frame
    frame: {text: 'لا بد أنه {item} الاجتماع.', language_code: ar, direction: rtl}
  feedback_frame: {text: 'He must have forgotten the meeting. لا بد أنه نسي (must + he-forgot, a plain past-tense verb) is how MSA expresses ''must have forgotten'' -- there is no separate periphrastic perfect form the way English uses one.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson03.fill.003
  lesson_content_key: ar.b2.unit02.lesson03.altakhmin_hawl_almadi
  type: fill_in_blank
  frame:
    text: ربما فاتته {item} هذا الصباح. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering: {hint: english_gloss}
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags: {semantic: w_الحافلة}
    hint:
      language_code: ar
      part_of_speech: noun
      agreement_tags: {semantic: w_الحافلة}
  answer_derivation: {kind: slot_text, slot: item}
  feedback_frame: {text: 'Maybe he missed the bus this morning. ربما + a plain past-tense verb (فاتته) speculates about a PAST cause, at the weak-possibility level.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson03.translate.004
  lesson_content_key: ar.b2.unit02.lesson03.altakhmin_hawl_almadi
  type: translation
  frame: {text: 'Layla: He might be in a meeting, or maybe he missed the bus this morning.', language_code: en, direction: ltr}
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags: {semantic: w_فاتته}
  answer_derivation:
    kind: render_frame
    frame: {text: 'قد يكون في اجتماع، أو ربما {item} الحافلة هذا الصباح.', language_code: ar, direction: rtl}
  feedback_frame: {text: 'Layla: He might be in a meeting, or maybe he missed the bus this morning. فاتته means he missed it (past).', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson04.order.002
  lesson_content_key: ar.b2.unit02.lesson04.alistintaj_waltakhmin
  type: word_order
  frame: {text: 'أستنتج أن كريما مشغول، لأن {item} مغلق.', language_code: ar, direction: rtl}
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags: {semantic: w_هاتفه}
  answer_derivation:
    kind: render_frame
    frame: {text: 'أستنتج أن كريما مشغول، لأن {item} مغلق.', language_code: ar, direction: rtl}
  feedback_frame: {text: 'I deduce that Karim is busy, because his phone is off. A deduction names its evidence with لأن -- that is what separates أستنتج أن from a bare guess.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.b2.unit02.lesson04.fill.003
  lesson_content_key: ar.b2.unit02.lesson04.alistintaj_waltakhmin
