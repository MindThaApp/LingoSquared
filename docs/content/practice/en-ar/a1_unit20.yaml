schema_version: "1.0"
pack_key: practice.en-ar.a1.unit20
source_language: en
target_language: ar
unit_content_key: ar.a1.unit20.weather
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 10, en-ar) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_ar.py (per-unit tags ar_a1_u20*, single-member w_<token> anchors). Pools are
    unit-scoped. حار and وحار are never together in a pool. The weather adjectives are masculine to agree with
    الجو. Matching uses exactly 6 distinct-sense tokens. اليوم, كيف, ماء are earlier-unit words used as literal
    text. Reviewer: confirm "هيا نشرب ماء" and "الجو مشمس وحار".
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_الجو, w_مشمس, w_بارد, w_حار, w_هيا, w_نشرب, w_وحار]
slot_presets:
  l1: &l1 {language_code: ar, part_of_speech: [noun, adjective], agreement_tags: {semantic: [w_الجو, w_مشمس, w_بارد]}}
  adj: &adj {language_code: ar, part_of_speech: adjective, agreement_tags: {semantic: [w_مشمس, w_بارد, w_حار]}}
  m6: &m6 {language_code: ar, part_of_speech: [noun, verb, adjective, particle], agreement_tags: {semantic: [w_الجو, w_مشمس, w_بارد, w_حار, w_هيا, w_نشرب]}}
  l2: &l2 {language_code: ar, part_of_speech: [noun, verb, adjective, particle], agreement_tags: {semantic: [w_حار, w_هيا, w_نشرب, w_الجو]}}
  jaw: &jaw {language_code: ar, part_of_speech: noun, agreement_tags: {semantic: w_الجو}}
  mushmis: &mushmis {language_code: ar, part_of_speech: adjective, agreement_tags: {semantic: w_مشمس}}
  barid: &barid {language_code: ar, part_of_speech: adjective, agreement_tags: {semantic: w_بارد}}
  har: &har {language_code: ar, part_of_speech: adjective, agreement_tags: {semantic: w_حار}}
  hayya: &hayya {language_code: ar, part_of_speech: particle, agreement_tags: {semantic: w_هيا}}
  nashrab: &nashrab {language_code: ar, part_of_speech: verb, agreement_tags: {semantic: w_نشرب}}
  wahar: &wahar {language_code: ar, part_of_speech: adjective, agreement_tags: {semantic: w_وحار}}
templates:
  - content_key: practice.en-ar.ar.a1.unit20.lesson01.choose.001
    lesson_content_key: ar.a1.unit20.lesson01.weather_today
    type: multiple_choice
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "الجو is the weather; مشمس is sunny and بارد is cold.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson01.listen.002
    lesson_content_key: ar.a1.unit20.lesson01.weather_today
    type: listen_select
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l1}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "الجو مشمس اليوم is the weather is sunny today; مشمس describes الجو.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson01.match.003
    lesson_content_key: ar.a1.unit20.lesson01.weather_today
    type: matching_pairs
    frame: {text: "{first} · {second} · {third} · {fourth} · {fifth} · {sixth}", language_code: ar, direction: rtl}
    slots: {first: *m6, second: *m6, third: *m6, fourth: *m6, fifth: *m6, sixth: *m6}
    slot_relations: [{kind: distinct, slots: [first, second, third, fourth, fifth, sixth]}]
    answer_derivation: {kind: matching_pairs, slots: [first, second, third, fourth, fifth, sixth]}
    feedback_frame: {text: "الجو (the weather) is a noun; مشمس, بارد and حار are adjectives that describe it.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson01.order.004
    lesson_content_key: ar.a1.unit20.lesson01.weather_today
    type: word_order
    frame: {text: "الجو {item} اليوم.", language_code: ar, direction: rtl}
    slots: {item: *adj}
    answer_derivation: {kind: render_frame, frame: {text: "الجو {item} اليوم.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The adjective follows الجو directly, with no word for is: الجو بارد is the weather is cold.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson01.fill.005
    lesson_content_key: ar.a1.unit20.lesson01.weather_today
    type: fill_in_blank
    frame: {text: "الجو {item} اليوم. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *barid, hint: *barid}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "بارد is cold and is masculine to agree with الجو.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson01.fill.006
    lesson_content_key: ar.a1.unit20.lesson01.weather_today
    type: fill_in_blank
    frame: {text: "كيف {item} اليوم؟ ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *jaw, hint: *jaw}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "كيف الجو اليوم؟ is how is the weather today.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson01.translate.007
    lesson_content_key: ar.a1.unit20.lesson01.weather_today
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l1}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "الجو has ال and means the weather; the other two describe it.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson01.translate.008
    lesson_content_key: ar.a1.unit20.lesson01.weather_today
    type: translation
    frame: {text: "The weather is sunny today.", language_code: en, direction: ltr}
    slots: {item: *mushmis}
    answer_derivation: {kind: render_frame, frame: {text: "الجو {item} اليوم", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The adjective follows the noun: الجو مشمس.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson01.translate.009
    lesson_content_key: ar.a1.unit20.lesson01.weather_today
    type: translation
    frame: {text: "The weather is cold today.", language_code: en, direction: ltr}
    slots: {item: *barid}
    answer_derivation: {kind: render_frame, frame: {text: "الجو {item} اليوم", language_code: ar, direction: rtl}}
    feedback_frame: {text: "بارد is cold, and no word for is is needed.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson02.choose.001
    lesson_content_key: ar.a1.unit20.lesson02.weather_plan
    type: multiple_choice
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "حار is hot; it describes the masculine الجو.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson02.listen.002
    lesson_content_key: ar.a1.unit20.lesson02.weather_plan
    type: listen_select
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l2}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "هيا نشرب ماء is let's drink water; نشرب is the we-form of drink.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson02.order.003
    lesson_content_key: ar.a1.unit20.lesson02.weather_plan
    type: word_order
    frame: {text: "هيا {item} ماء.", language_code: ar, direction: rtl}
    slots: {item: *nashrab}
    answer_derivation: {kind: render_frame, frame: {text: "هيا {item} ماء.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "هيا (let's) is followed by the we-form verb: نشرب is we drink.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson02.order.004
    lesson_content_key: ar.a1.unit20.lesson02.weather_plan
    type: word_order
    frame: {text: "الجو {item} اليوم.", language_code: ar, direction: rtl}
    slots: {item: *har}
    answer_derivation: {kind: render_frame, frame: {text: "الجو {item} اليوم.", language_code: ar, direction: rtl}}
    feedback_frame: {text: "حار is hot and follows the noun it describes.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson02.fill.005
    lesson_content_key: ar.a1.unit20.lesson02.weather_plan
    type: fill_in_blank
    frame: {text: "الجو مشمس {item}. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *wahar, hint: *wahar}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "The و is attached to the next word: وحار means and hot.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson02.fill.006
    lesson_content_key: ar.a1.unit20.lesson02.weather_plan
    type: fill_in_blank
    frame: {text: "الجو حار. {item} نشرب ماء. ({hint})", language_code: ar, direction: rtl, slot_rendering: {hint: english_gloss}}
    slots: {item: *hayya, hint: *hayya}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "هيا invites people to do something together.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson02.translate.007
    lesson_content_key: ar.a1.unit20.lesson02.weather_plan
    type: translation
    frame: {text: "{item}", language_code: en, direction: ltr, slot_rendering: {item: english_gloss}}
    slots: {item: *l2}
    answer_derivation: {kind: slot_text, slot: item}
    feedback_frame: {text: "هيا is a particle for let's and نشرب is the we-form verb; حار is an adjective.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson02.translate.008
    lesson_content_key: ar.a1.unit20.lesson02.weather_plan
    type: translation
    frame: {text: "The weather is hot today.", language_code: en, direction: ltr}
    slots: {item: *har}
    answer_derivation: {kind: render_frame, frame: {text: "الجو {item} اليوم", language_code: ar, direction: rtl}}
    feedback_frame: {text: "The adjective takes the masculine form because الجو is masculine.", language_code: en, direction: ltr}
  - content_key: practice.en-ar.ar.a1.unit20.lesson02.translate.009
    lesson_content_key: ar.a1.unit20.lesson02.weather_plan
    type: translation
    frame: {text: "Let's drink water.", language_code: en, direction: ltr}
    slots: {b: *nashrab}
    answer_derivation: {kind: render_frame, frame: {text: "هيا {b} ماء", language_code: ar, direction: rtl}}
    feedback_frame: {text: "هيا plus the we-form verb makes a suggestion.", language_code: en, direction: ltr}
