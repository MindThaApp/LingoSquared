schema_version: '1.0'
pack_key: practice.en-ar.a1.unit40
source_language: en
target_language: ar
unit_content_key: ar.a1.unit40.emergencies
review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ar backfill lexemes (tags ar_a1_u40 / w_<token>). 16 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_أتصل, w_اذهبوا, w_اطلب, w_الأمر, w_الإسعاف, w_الإطفاء, w_الحريق, w_الخارج, w_الشرطة, w_الطوارئ, w_انتباه, w_اهدئي, w_تحتاج, w_حريق, w_عرفت, w_مخرج]
templates:
- content_key: practice.en-ar.ar.a1.unit40.lesson01.choose.001
  lesson_content_key: ar.a1.unit40.lesson01.almsaada_walhryq
  type: multiple_choice
  frame: {text: '{item}', language_code: ar, direction: rtl}
  slots:
    item: &id001
      language_code: ar
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_الحريق, w_حريق, w_الطوارئ, w_اطلب, w_مخرج, w_الشرطة, w_أتصل, w_الإسعاف, w_الإطفاء, w_انتباه, w_اذهبوا, w_اهدئي, w_تحتاج, w_الخارج, w_الأمر, w_عرفت]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on help and fire.', language_code: en, direction: ltr}
- content_key: practice.en-ar.ar.a1.unit40.lesson02.listen.001
