  p2: &p2 {language_code: ar, part_of_speech: ["preposition"], agreement_tags: {semantic: ["w_لدينا"]}}
  p3: &p3 {language_code: ar, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_لكنا"]}}
