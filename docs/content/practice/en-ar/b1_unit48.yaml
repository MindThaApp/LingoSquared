review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-ar B1 set) from scripts/backfill_lexemes_en_ar.py (course en-ar-b1; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Arabic is written without harakat, as in the realizations and the A1/A2 packs. Sentence translations accept optional variants: hamza and alef spellings (أ إ آ written as ا), final taa marbuta written as haa, alif maqsura written as yaa, and a few hand-checked alternatives (fronted time words, optional ف after the condition clause, VSO/SVO order of the subject, ولكن for لكن). Short-vowel marks are already ignored by the grader, so they are not repeated here. Gendered prompts name the addressee or speaker in brackets. Reviewer: confirm the glosses of verb forms that occur only after لم, إذا or لو, and the accepted word-order alternatives.
