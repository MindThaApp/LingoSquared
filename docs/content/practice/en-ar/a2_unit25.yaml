    lesson_content_key: ar.a2.unit25.lesson01.documents
    type: multiple_choice
    frame: {text: "{item}", language_code: ar, direction: rtl}
    slots: {item: *l1n}
    answer_derivation: {kind: slot_gloss, slot: item}
    feedback_frame: {text: "أحتاج is I need, and it is followed by إلى; يوم is day and الساعة is the hour.", language_code: en, direction: ltr}
