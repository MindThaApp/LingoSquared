review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-ar A2) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_ar.py (course en-ar-a2; tags ar_a2_u29*, single-member w_<token> anchors).
    Arabic is written without harakat, as in the realizations and the A1 packs. Every slot draws only on words
    this unit introduces; earlier words appear only as literal frame text. Fixed-sentence prompts name the
    addressee's gender in brackets where the Arabic form depends on it. Lesson 1 and 2 pools exclude the
    article forms (المشكلة, والمشكلة) from matching and recognition so glosses are not near-duplicates.
    Reviewer: confirm 'تزداد سوءا' (accusative of سوء) and 'سنرسل فنيا' as natural.
