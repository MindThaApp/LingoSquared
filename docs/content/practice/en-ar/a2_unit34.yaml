schema_version: "1.0"
pack_key: practice.en-ar.a2.unit34
source_language: en
target_language: ar
unit_content_key: ar.a2.unit34.shakwa
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-24 (session 11, en-ar A2) against PRACTICE_PACK_RECIPE.md and lexemes from
    scripts/backfill_lexemes_en_ar.py (course en-ar-a2; tags ar_a2_u34*, single-member w_<token> anchors).
    Arabic is written without harakat, as in the realizations and the A1 packs. Every slot draws only on words
    this unit introduces; earlier words appear only as literal frame text. Fixed-sentence prompts name the
    addressee's gender in brackets where the Arabic form depends on it. Yusuf (a man) is the customer and the
    shop assistant is a woman, so تريد is the masculine you-form here. Reviewer: confirm 'الحجم غير صحيح' and
    that 'معي' for I have is the natural reply about a receipt.
