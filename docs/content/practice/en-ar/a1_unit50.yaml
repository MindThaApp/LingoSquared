review: {status: unreviewed, required_next_reviewer: native_speaker_review, fresh_context: 'false', notes: 'Generated by scripts/derive_target.py packs from the unit''s realization/overlay and the en-ar backfill lexemes (tags ar_a1_u50 / w_<token>). 18 pool lexemes (pos noun/verb/adjective/adverb, one gloss each); unit-wide choose/listen/translate/match templates use the union of their w_ tags, sentence templates are single-lexeme anchors on the unit''s own teaching lines. Needs native review of frames and feedback.'}
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: [w_أزور, w_الحفل, w_الذهاب, w_القاعة, w_اللوحة, w_المعرض, w_الموسيقي, w_جميلا, w_حفل, w_ضروريا, w_كبيرة, w_للمتحف, w_للمعرض, w_لوحات, w_ليس, w_مرشدا, w_موسيقي, w_يزور]
