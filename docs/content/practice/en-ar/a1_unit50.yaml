  type: multiple_choice
  frame: {text: '{item}', language_code: ar, direction: rtl}
  slots:
    item: &id001
      language_code: ar
      part_of_speech: [noun, verb, adjective, adverb]
      agreement_tags:
        semantic: [w_الذهاب, w_يزور, w_أزور, w_للمتحف, w_المعرض, w_للمعرض, w_مرشدا, w_ليس, w_ضروريا, w_القاعة, w_كبيرة, w_اللوحة, w_لوحات, w_الحفل, w_الموسيقي, w_حفل, w_موسيقي, w_جميلا]
  answer_derivation: {kind: slot_gloss, slot: item}
  feedback_frame: {text: '{item} is one of this unit''s words, from the lesson on i want to go to the museum.', language_code: en, direction: ltr}
