schema_version: "1.0"
pack_key: practice.en-ar.b1.unit41
source_language: en
target_language: ar
unit_content_key: ar.b1.unit41.shurut
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: "false"
  notes: >-
    Authored 2026-10-25 (session 12, en-ar B1 set) from scripts/backfill_lexemes_en_ar.py (course en-ar-b1; w_<token> anchors, one token per sentence slot, unit-own lexemes only). Arabic is written without harakat, as in the realizations and the A1/A2 packs. Sentence translations accept optional variants: hamza and alef spellings (أ إ آ written as ا), final taa marbuta written as haa, alif maqsura written as yaa, and a few hand-checked alternatives (fronted time words, optional ف after the condition clause, VSO/SVO order of the subject, ولكن for لكن). Short-vowel marks are already ignored by the grader, so they are not repeated here. Gendered prompts name the addressee or speaker in brackets. Reviewer: confirm the glosses of verb forms that occur only after لم, إذا or لو, and the accepted word-order alternatives.
tag_schema:
  part_of_speech: [symbol, noun, proper_noun, pronoun, verb, adjective, adverb, preposition, particle, phrase]
  agreement_tags:
    semantic: ["w_أمطرت", "w_سنبقى", "w_البيت", "w_فسنبقى", "w_سنذهب", "w_الحديقة", "w_فسنذهب", "w_نهاية", "w_الأسبوع", "w_تمطر"]
slot_presets:
  p1: &p1 {language_code: ar, part_of_speech: ["noun", "verb"], agreement_tags: {semantic: ["w_أمطرت", "w_سنبقى", "w_البيت", "w_فسنبقى", "w_سنذهب", "w_الحديقة", "w_فسنذهب", "w_نهاية", "w_الأسبوع"]}}
  p2: &p2 {language_code: ar, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_أمطرت"]}}
  p3: &p3 {language_code: ar, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_فسنبقى"]}}
  p4: &p4 {language_code: ar, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_البيت"]}}
  p5: &p5 {language_code: ar, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_تمطر"]}}
  p6: &p6 {language_code: ar, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_فسنذهب"]}}
  p7: &p7 {language_code: ar, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_الحديقة"]}}
  p8: &p8 {language_code: ar, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_نهاية"]}}
  p9: &p9 {language_code: ar, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_الأسبوع"]}}
