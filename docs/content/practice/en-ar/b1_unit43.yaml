slot_presets:
  p1: &p1 {language_code: ar, part_of_speech: ["noun", "verb", "adjective", "preposition"], agreement_tags: {semantic: ["w_عملت", "w_المجال", "w_لمدة", "w_سنتين", "w_عطلة", "w_المديرة", "w_سألت", "w_كانت", "w_متاحة", "w_سألتها"]}}
  p2: &p2 {language_code: ar, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_عملت"]}}
  p3: &p3 {language_code: ar, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_المجال"]}}
  p4: &p4 {language_code: ar, part_of_speech: ["preposition"], agreement_tags: {semantic: ["w_لمدة"]}}
  p5: &p5 {language_code: ar, part_of_speech: ["noun"], agreement_tags: {semantic: ["w_المديرة"]}}
  p6: &p6 {language_code: ar, part_of_speech: ["verb"], agreement_tags: {semantic: ["w_سألت"]}}
