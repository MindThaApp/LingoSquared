- content_key: practice.zh-ar.ar.a1.unit13.lesson01.choose.001
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ذهبت 是“我去了”,اشتريت 是“我买了”;两个都是第一人称过去时动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit13.lesson01.listen.002
