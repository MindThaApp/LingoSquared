    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تفاحا 表示“苹果”，是被买的东西（宾语），所以以 alif 结尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit13.lesson01.translate.006
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ذهبت 是“我去了”；اشتريت 是“我买了”；تفاحا 是作为所买之物的“苹果”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit13.lesson01.translate.007
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: translation
  frame:
    text: 我昨天去了市场。（没有单独表示“我”的词）
    language_code: zh
    direction: ltr
  slots:
    a: *id005
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} إلى السوق {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 过去式的词尾 -ت 本身就表示“我”，所以不需要再加代词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit13.lesson01.translate.008
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: translation
  frame:
    text: 我买了苹果。（没有单独表示“我”的词）
    language_code: zh
    direction: ltr
  slots:
    a: *id006
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 所买之物要带 alif 词尾：تفاحا。
    language_code: zh
    direction: ltr
