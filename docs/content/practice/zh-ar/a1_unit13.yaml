    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: '{item} قهوة'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 过去式用 -ت 词尾表示“我”：شربت 是“我喝了”。
    language_code: zh
    direction: ltr
