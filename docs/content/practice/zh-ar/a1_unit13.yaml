  feedback_frame:
    text: فعلت（你做了）和 شربت（我喝了）都是以 -ت 结尾的过去式动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit13.lesson02.translate.008
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: translation
  frame:
    text: 优素福问蕾拉：你昨天做了什么？
    language_code: zh
    direction: ltr
  slots:
    a: *id008
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: فعلت 是过去式的“你”形式；无论对男性还是女性，书写形式都相同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit13.lesson02.translate.009
  lesson_content_key: ar.a1.unit13.lesson02.recent_event
  type: translation
