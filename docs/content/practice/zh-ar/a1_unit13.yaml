    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 过去时词尾 -ت 表示“我”(ذهبت、اشتريت、شربت);فعلت 是本单元问句中的“你做了”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit13.lesson01.order.004
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: word_order
  frame:
    text: ذهبت إلى السوق {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: ذهبت إلى السوق {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أمس（昨天）通常放在句末：我昨天去了市场。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit13.lesson01.fill.005
  lesson_content_key: ar.a1.unit13.lesson01.yesterday
  type: fill_in_blank
  frame:
