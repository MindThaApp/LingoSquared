templates:
- content_key: practice.zh-ar.ar.a1.unit10.lesson01.choose.001
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: يمين 是名词“右”,اليسار 是“左”,是在 يسار 前加了 ال;冠词 ال 构成了“左”这个词形。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson01.listen.002
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الأمام 的意思是“前面”,إلى الأمام 就是“一直往前”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson01.order.003
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: word_order
  frame:
    text: امش إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: إلى(向、往)放在方向词之前,方向词要带 ال:الأمام、اليمين 或 اليسار。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson01.fill.004
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: fill_in_blank
  frame:
    text: امش إلى {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: إلى الأمام 是表达“一直往前”的常用说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson01.translate.005
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: يمين 是“右”(方向),与 يسار 相反。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson01.translate.006
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: 一直往前走。(对男士说)
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: امش 是对男士说的命令;إلى الأمام 表示“向前”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson01.translate.007
  lesson_content_key: ar.a1.unit10.lesson01.direction_words
  type: translation
  frame:
    text: 向右走。(对男士说)
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: إلى 后面的方向词要带 ال:اليمين 就是“右”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson02.choose.001
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: امش 是对男士说的命令“走”;ثم 表示“然后”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson02.listen.002
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ثم 按先后顺序连接两个步骤,意思是“然后”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson02.order.003
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: word_order
  frame:
    text: امش إلى الأمام ثم إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى الأمام ثم إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ثم(然后)把第一步和第二步连接起来,每一步各有自己的 إلى。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson02.fill.004
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: fill_in_blank
  frame:
    text: امش إلى الأمام {item} إلى اليمين. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ثم 的意思是“然后”,位于两个方向之间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson02.fill.005
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: fill_in_blank
  frame:
    text: أين المكتبة؟ {item} إلى الأمام. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: امش 是对一位男士说的命令;回答 أين المكتبة؟ 时要指路。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson02.translate.006
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ثم 的意思是“然后”;امش 的意思是“走”,对男士说。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson02.translate.007
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: translation
  frame:
    text: 一直往前走,然后向右拐。(对男士说)
    language_code: zh
    direction: ltr
  slots:
    a: *id004
    b: *id007
    c: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {a} {b} إلى {c}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 路线分两步:先往前,然后向右。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit10.lesson02.translate.008
  lesson_content_key: ar.a1.unit10.lesson02.basic_route
  type: translation
  frame:
    text: 向左走。(对男士说)
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: امش إلى {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: اليسار 是“左”;与之相反的是 اليمين。
    language_code: zh
    direction: ltr
