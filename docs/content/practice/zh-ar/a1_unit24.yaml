- content_key: practice.zh-ar.ar.a1.unit24.lesson01.choose.001
  lesson_content_key: ar.a1.unit24.lesson01.pay_method
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: مال 是钱，بطاقة 是银行卡，نقدا 是现金；أدفع 是“我付”。
    language_code: zh
    direction: ltr
