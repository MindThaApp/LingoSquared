  feedback_frame:
    text: هيا 是表示“……吧”的小词，نشرب 是“我们”形式的动词；حار 是形容词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit20.lesson02.translate.008
  lesson_content_key: ar.a1.unit20.lesson02.weather_plan
  type: translation
  frame:
    text: 今天天气很热。
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
