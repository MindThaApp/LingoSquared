  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: الجو 带有 ال，意思是“天气”；另外两个词用来描述它。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit20.lesson01.translate.008
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
