    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: هيا 用来邀请大家一起做某事。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit20.lesson02.translate.007
  lesson_content_key: ar.a1.unit20.lesson02.weather_plan
  type: translation
  frame:
    text: '{item}'
    language_code: zh
