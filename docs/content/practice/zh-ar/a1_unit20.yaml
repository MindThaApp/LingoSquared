templates:
- content_key: practice.zh-ar.ar.a1.unit20.lesson01.choose.001
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الجو 是“天气”；مشمس 是“晴朗的”，بارد 是“冷的”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit20.lesson01.listen.002
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الجو مشمس اليوم 的意思是“今天天气晴朗”；مشمس 描述 الجو。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit20.lesson01.match.003
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: الجو（天气）是名词；مشمس、بارد 和 حار 是描述它的形容词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit20.lesson01.order.004
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: word_order
  frame:
    text: الجو {item} اليوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: الجو {item} اليوم.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 形容词直接跟在 الجو 后面，不需要表示“是”的词：الجو بارد 的意思是“天气很冷”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit20.lesson01.fill.005
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
  type: fill_in_blank
  frame:
    text: الجو {item} اليوم. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بارد 是“冷的”，为阳性，与 الجو 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit20.lesson01.fill.006
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
