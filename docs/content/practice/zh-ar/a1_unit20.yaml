    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: الجو {item} اليوم
      language_code: ar
      direction: rtl
  feedback_frame:
    text: بارد 是“冷的”，不需要表示“是”的词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit20.lesson02.choose.001
  lesson_content_key: ar.a1.unit20.lesson02.weather_plan
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: حار 是“热的”；它描述阳性的 الجو。
    language_code: zh
    direction: ltr
