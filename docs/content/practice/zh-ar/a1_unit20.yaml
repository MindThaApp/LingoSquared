    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كيف الجو اليوم؟ 的意思是“今天天气怎么样？”
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit20.lesson01.translate.007
  lesson_content_key: ar.a1.unit20.lesson01.weather_today
