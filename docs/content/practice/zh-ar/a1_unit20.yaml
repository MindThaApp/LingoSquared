  lesson_content_key: ar.a1.unit20.lesson02.weather_plan
  type: word_order
  frame:
    text: هيا {item} ماء.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: هيا {item} ماء.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هيا（……吧）后面接“我们”形式的动词：نشرب 是“我们喝”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit20.lesson02.order.004
  lesson_content_key: ar.a1.unit20.lesson02.weather_plan
  type: word_order
  frame:
    text: الجو {item} اليوم.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: الجو {item} اليوم.
