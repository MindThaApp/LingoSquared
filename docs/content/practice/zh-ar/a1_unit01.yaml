    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: مرحبا 以右边的 م 开头,因为阿拉伯语是从右向左阅读的。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit01.lesson01.translate.003
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 阿拉伯语拼写通常省略短元音,读者根据单词自行补出。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit01.lesson02.listen.001
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 阿拉伯语按时间段问候:早上说 صباح الخير,下午起说 مساء الخير。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit01.lesson02.match.002
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
