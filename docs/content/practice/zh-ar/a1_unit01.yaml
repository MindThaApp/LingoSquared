templates:
- content_key: practice.zh-ar.ar.a1.unit01.lesson01.choose.001
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 阿拉伯语从右向左书写,ر 和 ا 不与后面的字母连写。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit01.lesson01.match.002
  lesson_content_key: ar.a1.unit01.lesson01.script_ramp
  type: matching_pairs
  frame:
