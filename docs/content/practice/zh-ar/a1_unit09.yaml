    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: هنا 意思是“这里”；سوق 是市场。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson01.match.003
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: قرب（附近）是介词，هنا（这里）是副词；其余四个是名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson01.order.004
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: word_order
  frame:
    text: أين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أين 用来问“哪里”；地点名词带 ال：图书馆、市场或咖啡馆。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson01.fill.005
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: fill_in_blank
  frame:
    text: المكتبة {item} السوق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قرب（附近）放在所靠近的地点之前，这里是市场。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson01.translate.006
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مكتبة（图书馆）、سوق（市场）和 مقهى（咖啡馆）都是地点；مكان 是“地方”的通称。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson01.translate.007
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: 图书馆在哪里？
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ال 相当于阿拉伯语的“这／那”（定冠词），连写在名词前面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson01.translate.008
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: 市场在哪里？
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 阿拉伯语不需要表示“是／在”的词：أين السوق؟ 字面意思是“哪里 市场”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson01.order.009
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: word_order
  frame:
    text: المكتبة {item} قرب السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المكتبة {item} قرب السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هنا（这里）可以放在 قرب 之前：图书馆在这里，市场附近。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson02.choose.001
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: قرب 意思是“附近”；后面直接跟地点名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson02.listen.002
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: وأين 是 و（和）与 أين（哪里）连写：“那……在哪里”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson02.order.003
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: word_order
  frame:
    text: المقهى قرب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى قرب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: قرب 不需要额外的词：المقهى قرب المكتبة 就是“咖啡馆在图书馆附近”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson02.order.004
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: word_order
  frame:
    text: وأين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: وأين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: وأين المقهى؟ 用来接着对话往下问：那咖啡馆在哪里？
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson02.fill.005
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: fill_in_blank
  frame:
    text: أين المكتبة؟ {item} المقهى؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: وأين 中的 و 把新问题与前面的问题连接起来。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson02.translate.006
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: وأين 是“那……在哪里”，用于接着追问；قرب 是“附近”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson02.translate.007
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: 图书馆在市场附近。
    language_code: zh
    direction: ltr
  slots:
    a: *id004
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: المكتبة {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: قرب 后面的地点名词保留 ال：قرب السوق 是“在市场附近”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit09.lesson02.translate.008
  lesson_content_key: ar.a1.unit09.lesson02.locate_places
  type: translation
  frame:
    text: 咖啡馆在图书馆附近。
    language_code: zh
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى قرب {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 本单元的对话正是用这个句子回答 وأين المقهى؟
    language_code: zh
    direction: ltr
