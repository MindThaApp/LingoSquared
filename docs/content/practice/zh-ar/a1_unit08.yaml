  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: سعر 的意思是“价格”;كم سعر ...؟ 用来询问某物多少钱。
    language_code: zh
    direction: ltr
