  lesson_content_key: ar.a1.unit08.lesson01.prices
  type: translation
  frame:
    text: 苹果多少钱?
    language_code: zh
    direction: ltr
  slots:
    a: *id003
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: كم {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: التفاح 中的冠词 ال 表示特指的那些苹果,所以这个问句问的是特定苹果的价格。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit08.lesson01.translate.009
  lesson_content_key: ar.a1.unit08.lesson01.prices
  type: translation
  frame:
