    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: التفاح بعشرة {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 数字前加 ب 表示价格。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit08.lesson02.listen.001
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تفاحتين 是 تفاحة(一个苹果)加上双数词尾 ـين;前面的 ة 变成 ت,所以正好表示两个苹果。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit08.lesson02.order.002
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: word_order
  frame:
    text: أريد {item} من فضلك.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 阿拉伯语有专门的双数形式:تفاحتين 就是“两个苹果”,不需要另外的“二”字。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit08.lesson02.fill.003
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: fill_in_blank
  frame:
    text: أريد {item} من فضلك. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 双数词尾 ـين 表示两个;在它之前,تفاحة 的 ة 写成 ت:تفاحتين。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit08.lesson02.translate.004
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تفاح 泛指苹果,而带双数词尾的 تفاحتين 正好是两个。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit08.lesson02.translate.005
  lesson_content_key: ar.a1.unit08.lesson02.purchase
  type: translation
  frame:
    text: 我要两个苹果,谢谢。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 双数词尾 ـتين 本身就表示“二”,所以不再另用数词。
    language_code: zh
    direction: ltr
