  frame:
    text: 我很累，因为我有工作。(女性说)
    language_code: zh
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item} لأن عندي عملا
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 女性说 متعبة;在 لأن 之后，所拥有的东西要带宾格词尾，所以 عمل 变成 عملا。
    language_code: zh
    direction: ltr
