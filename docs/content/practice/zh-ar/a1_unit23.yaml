templates:
- content_key: practice.zh-ar.ar.a1.unit23.lesson01.choose.001
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أعد 是阳性命令式，意思是“重复”；تكلم 是“说”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson01.listen.002
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: لا أسمعك 是“我听不到你”；أسمعك 里包含宾语“你”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson01.match.003
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أعد 和 تكلم 是对男性的命令式；أسمعك 是“我听到你”；ببطء 是副词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson01.order.004
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: word_order
  frame:
    text: لا {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: لا {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: لا 放在动词前表示否定：لا أسمعك 是“我听不到你”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson01.order.005
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: word_order
  frame:
    text: لا أسمعك. {item} من فضلك.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: لا أسمعك. {item} من فضلك.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أعد 是阳性命令式“重复”，对象是优素福。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson01.order.006
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: word_order
  frame:
    text: يا يوسف تكلم {item} من فضلك.
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: يا يوسف تكلم {item} من فضلك.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ببطء 是“慢慢地”，放在动词之后。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson01.fill.007
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: fill_in_blank
  frame:
    text: لا {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أسمعك 把“我听”和“你”合在一起，所以不需要另外的“你”字。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson01.fill.008
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: fill_in_blank
  frame:
    text: يا يوسف تكلم {item} من فضلك. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ببطء 跟在它所修饰的动词后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson01.translate.009
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أعد 和 تكلم 是对男性的命令式，أسمعك 是带宾语的动词，ببطء 是副词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson01.translate.010
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: translation
  frame:
    text: 我听不到你说话。（不需要单独的“我”字）
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: لا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: لا 否定动词；أسمعك 已经同时包含“我”和“你”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson01.translate.011
  lesson_content_key: ar.a1.unit23.lesson01.phone_clarify
  type: translation
  frame:
    text: 优素福，请重复一遍。（对男性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: يا يوسف {item} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 莱拉用阳性命令式 أعد 对优素福说话。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson02.choose.001
  lesson_content_key: ar.a1.unit23.lesson02.phone_message
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: رسالة 是“留言”，الموعد 是“约会”，带有 ال。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson02.listen.002
  lesson_content_key: ar.a1.unit23.lesson02.phone_message
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الموعد في الساعة الخامسة 的意思是“约会在五点”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson02.order.003
  lesson_content_key: ar.a1.unit23.lesson02.phone_message
  type: word_order
  frame:
    text: 'قال يوسف: {item} في الساعة الخامسة.'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: 'قال يوسف: {item} في الساعة الخامسة.'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ال 使它成为特指的“那个约会”：الموعد في الساعة الخامسة。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson02.fill.004
  lesson_content_key: ar.a1.unit23.lesson02.phone_message
  type: fill_in_blank
  frame:
    text: هذه {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: هذه（这）是阴性，与以 ة 结尾的 رسالة 搭配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson02.fill.005
  lesson_content_key: ar.a1.unit23.lesson02.phone_message
  type: fill_in_blank
  frame:
    text: 'قال يوسف: {item} في الساعة الخامسة. ({hint})'
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 加上 ال，这个词的意思是“那个约会”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson02.translate.006
  lesson_content_key: ar.a1.unit23.lesson02.phone_message
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: رسالة、هاتف 和 الموعد 是名词；ببطء 是副词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit23.lesson02.translate.007
  lesson_content_key: ar.a1.unit23.lesson02.phone_message
  type: translation
  frame:
    text: 优素福，请说慢一点。（对男性说）
    language_code: zh
    direction: ltr
  slots:
    a: *id009
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: يا يوسف {a} {b} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: تكلم 是阳性命令式，ببطء 跟在它后面。
    language_code: zh
    direction: ltr
