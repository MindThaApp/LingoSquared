- content_key: practice.zh-ar.ar.a1.unit35.lesson01.order.003
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
  type: word_order
  frame:
    text: عندي رسالة {item}.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_لجدي
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي رسالة {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 我有一封信要给爷爷。لجدي 意为“给我的爷爷”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit35.lesson01.fill.004
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
