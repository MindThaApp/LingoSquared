    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自关于邮票、地址和书写的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit35.lesson03.translate.001
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自关于到达和花费时间的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit35.lesson05.match.001
  lesson_content_key: ar.a1.unit35.lesson05.lyla_trsl_trda
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id001
    second: *id001
    third: *id001
    fourth: *id001
    fifth: *id001
    sixth: *id001
  slot_relations:
  - kind: distinct
    slots: &id002
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots: *id002
  feedback_frame:
    text: 请将每个阿拉伯语单词与其中文意思配对；这些单词出自本单元的课程。
    language_code: zh
    direction: ltr
