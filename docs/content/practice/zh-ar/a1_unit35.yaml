    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_الطرد
    hint:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_الطرد
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我把地址写在包裹上。الطرد 意为“包裹”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit35.lesson01.translate.005
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
  type: translation
  frame:
    text: 我给贝鲁特寄一个包裹。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_طردا
  answer_derivation:
    kind: render_frame
    frame:
      text: أرسل {item} إلى بيروت.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 我给贝鲁特寄一个包裹。طردا 意为“包裹”(作为被寄出的东西)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit35.lesson02.order.002
  lesson_content_key: ar.a1.unit35.lesson02.altaba_walanwan_walktaba
  type: word_order
  frame:
    text: أشتري {item} للرسالة.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_طابعا
  answer_derivation:
    kind: render_frame
    frame:
      text: أشتري {item} للرسالة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 我为这封信买一张邮票。طابعا 意为“邮票”(作为被买的东西)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit35.lesson02.fill.003
  lesson_content_key: ar.a1.unit35.lesson02.altaba_walanwan_walktaba
  type: fill_in_blank
  frame:
    text: أشتري طابعا {item} العنوان على الطرد. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_وأكتب
    hint:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_وأكتب
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我买一张邮票,并把地址写在包裹上。وأكتب 意为“并且我写”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit35.lesson03.order.002
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: word_order
  frame:
    text: الطرد {item} غدا.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_يصل
  answer_derivation:
    kind: render_frame
    frame:
      text: الطرد {item} غدا.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 包裹明天到。يصل 意为“他到;它到”(阳性)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit35.lesson03.fill.003
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: fill_in_blank
  frame:
    text: الطرد {item} فنقول يصل، والرسالة مؤنثة فنقول تصل. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
    hint:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 包裹是阳性,所以说 يصل (yaṣil);信是阴性,所以说 تصل (taṣil)。现在时动词的词头:主语为阳性时用 ي,为阴性时用 ت,例如 الطرد يصل (aṭ-ṭard yaṣil) 和 الرسالة تصل。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit35.lesson03.translate.004
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: translation
  frame:
    text: 包裹明天到，信要花三天。
    language_code: zh
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_والرسالة
  answer_derivation:
    kind: render_frame
    frame:
      text: الطرد يصل غدا {item} تستغرق ثلاثة أيام.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 包裹明天到,信要三天。والرسالة 意为“而信”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit35.lesson05.order.002
  lesson_content_key: ar.a1.unit35.lesson05.lyla_trsl_trda
  type: word_order
  frame:
    text: ليلى ترسل طردا إلى جدها {item}.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_وجدتها
  answer_derivation:
    kind: render_frame
    frame:
      text: ليلى ترسل طردا إلى جدها {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 莱拉给她的爷爷奶奶寄一个包裹。وجدتها 意为“和她的奶奶”。
    language_code: zh
    direction: ltr
