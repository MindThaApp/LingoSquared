schema_version: '1.0'
pack_key: practice.zh-ar.a1.unit35
source_language: zh
target_language: ar
unit_content_key: ar.a1.unit35.post
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ar by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_أيام
    - w_البريد
    - w_الطابع
    - w_الطرد
    - w_تشتري
    - w_تصل
    - w_تكتب
    - w_جدها
    - w_جدي
    - w_طابعا
    - w_طردا
    - w_فنقول
    - w_لجدها
    - w_لجدي
    - w_للرسالة
    - w_مؤنثة
    - w_مذكر
    - w_نمشي
    - w_وأكتب
    - w_والرسالة
    - w_وجدتها
    - w_وجدتي
    - w_وطردا
    - w_يستغرق
    - w_يصل
    - w_يكتب
templates:
- content_key: practice.zh-ar.ar.a1.unit35.lesson01.choose.001
  lesson_content_key: ar.a1.unit35.lesson01.alrsala_waltrd
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: &id001
      language_code: ar
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_لجدي
        - w_الطرد
        - w_طردا
        - w_وطردا
        - w_جدي
        - w_وجدتي
        - w_الطابع
        - w_طابعا
        - w_للرسالة
        - w_يكتب
        - w_وأكتب
        - w_يصل
        - w_مذكر
        - w_فنقول
        - w_والرسالة
        - w_مؤنثة
        - w_تصل
        - w_يستغرق
        - w_أيام
        - w_لجدها
        - w_وجدتها
        - w_تشتري
        - w_البريد
        - w_تكتب
        - w_جدها
        - w_نمشي
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇之一，来自关于信和包裹的课。'
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit35.lesson02.listen.001
  lesson_content_key: ar.a1.unit35.lesson02.altaba_walanwan_walktaba
  type: listen_select
