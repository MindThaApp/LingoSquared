    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عندي ألم في الرأس 的意思是我头疼；身体部位带 ال。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson01.order.003
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: word_order
  frame:
    text: عندي ألم في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي ألم في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في(在……里)后面接带 ال 的身体部位：في الرأس、في البطن。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson01.fill.004
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: fill_in_blank
  frame:
    text: عندي ألم في {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 头是 الرأس;这句话的意思是我头疼。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson01.translate.005
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ألم 是名词，意思是疼痛；两个身体部位也是带 ال 的名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson01.translate.006
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: 我头疼。
    language_code: zh
    direction: ltr
  slots:
    a: *id004
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: عندي(我有)不需要动词：عندي ألم 就是我有疼痛。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson01.translate.007
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: translation
  frame:
    text: 我肚子疼。
    language_code: zh
    direction: ltr
  slots:
    a: *id004
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في 后面的身体部位保留 ال:في البطن。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson02.choose.001
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحتاج 是我需要，مساعدة 是帮助；动词本身已含“我”,不需要单独的代词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson02.listen.002
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: اشربي 是阴性命令式：喝，对女性说。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson02.match.003
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id007
    second: *id007
    third: *id007
    fourth: *id007
    fifth: *id007
    sixth: *id007
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: اشربي 和 استريحي 是对女性说的命令式；أحتاج 是我需要；المشكلة 带 ال,意思是这个问题。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson02.order.004
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: ما {item} يا ليلى؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} يا ليلى؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ما المشكلة؟ 的意思是问题是什么？;يا ليلى 是称呼她。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson02.order.005
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: عندي ألم. أحتاج {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي ألم. أحتاج {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أحتاج 后面直接接所需的东西：أحتاج مساعدة。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson02.order.006
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: word_order
  frame:
    text: يا ليلى {item} ماء.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: يا ليلى {item} ماء.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 词尾 ـي 表示对女性的命令：اشربي ماء。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson02.fill.007
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: fill_in_blank
  frame:
    text: اشربي ماء {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و 与后面的词连写：واستريحي 的意思是并且休息。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson02.fill.008
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: fill_in_blank
  frame:
    text: عندي ألم. {item} مساعدة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id012
    hint: *id012
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أحتاج 是我需要；前缀 أ 表示“我”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson02.translate.009
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: اشربي 和 استريحي 是对女性说的命令式，词尾为 ـي。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson02.translate.010
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: 蕾拉，喝点水。(对女性说)
    language_code: zh
    direction: ltr
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: يا ليلى {item} ماء
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 优素福让蕾拉喝水：اشربي 是阴性命令式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson02.translate.011
  lesson_content_key: ar.a1.unit17.lesson02.simple_advice
  type: translation
  frame:
    text: 我疼。我需要帮助。(“我”没有单独的词)
    language_code: zh
    direction: ltr
  slots:
    a: *id004
    b: *id012
    c: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a}. {b} {c}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: عندي 和 أحتاج 的形式本身就含有“我”,所以不需要 أنا。
    language_code: zh
    direction: ltr
