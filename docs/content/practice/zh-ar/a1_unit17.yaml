templates:
- content_key: practice.zh-ar.ar.a1.unit17.lesson01.choose.001
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ألم 是疼痛；الرأس 是头，البطن 是肚子，两者都带 ال。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit17.lesson01.listen.002
  lesson_content_key: ar.a1.unit17.lesson01.basic_problem
