schema_version: '1.0'
pack_key: practice.zh-ar.a1.unit15
source_language: zh
target_language: ar
unit_content_key: ar.a1.unit15.comparisons
review:
  status: unreviewed
  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ar by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_أكبر
    - w_أصغر
    - w_أقرب
    - w_أرخص
    - w_والسوق
slot_presets:
  l1: &id001
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic:
      - w_أكبر
      - w_أصغر
      - w_أقرب
  comp4: &id002
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic:
      - w_أكبر
      - w_أصغر
      - w_أقرب
      - w_أرخص
  l2: &id005
    language_code: ar
    part_of_speech:
    - noun
    - adjective
    agreement_tags:
      semantic:
      - w_أرخص
      - w_والسوق
      - w_أكبر
      - w_أقرب
  akbar:
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أكبر
  asghar: &id003
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أصغر
  aqrab: &id004
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أقرب
  arkhas: &id006
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_أرخص
  walsuq: &id007
    language_code: ar
    part_of_speech: noun
    agreement_tags:
      semantic: w_والسوق
templates:
- content_key: practice.zh-ar.ar.a1.unit15.lesson01.choose.001
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكبر、أصغر 和 أقرب 都是比较级；后面都接 من（比）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson01.listen.002
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 比较级形容词只有一种形式，后面接 من：أقرب من 意为“比……更近”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson01.order.003
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: السوق {item} من المقهى.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: السوق {item} من المقهى.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 比较级放在被比较的两者之间，第二个对象前加 من（比）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson01.order.004
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: word_order
  frame:
    text: المقهى {item} من السوق.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 阿拉伯语不需要表示“是”的词：المقهى أصغر من السوق 字面是“咖啡馆 更小 比 市场”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson01.fill.005
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: fill_in_blank
  frame:
    text: المقهى {item} من السوق. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أصغر 是“更小”；同样的形式还有 أكبر，“更大”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson01.translate.006
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 比较级是简短的阿拉伯语形容词，不需要单独表示“更”的词；后面接 من。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson01.translate.007
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: 咖啡馆比市场小。
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 比较级形式不变，后面接 من（比）。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson01.translate.008
  lesson_content_key: ar.a1.unit15.lesson01.basic_comparisons
  type: translation
  frame:
    text: 咖啡馆比市场近。
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {item} من السوق
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أقرب 意为“更近”，来自“近”的概念，后面接 من。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson02.choose.001
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أرخص 是“更便宜”；它和其他比较级的形式相同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson02.listen.002
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: والسوق 把 و（和）与 السوق（市场）连写成一个词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson02.order.003
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: word_order
  frame:
    text: الماء {item} من القهوة.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أرخص 是“更便宜”：الماء أرخص من القهوة 意为“水比咖啡便宜”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson02.fill.004
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: fill_in_blank
  frame:
    text: الماء {item} من القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: “更便宜”同样使用比较级形式，后面接 من。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson02.translate.005
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这是四个比较级：更大、更小、更近和更便宜。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson02.translate.006
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: 水比咖啡便宜。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: الماء {item} من القهوة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 第二个对象前要用 من：比咖啡便宜。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit15.lesson02.translate.007
  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: 咖啡馆比市场近，而且市场比咖啡馆大。
    language_code: zh
    direction: ltr
  slots:
    a: *id004
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {a} من السوق، {b} أكبر من المقهى
      language_code: ar
      direction: rtl
  feedback_frame:
    text: و（和）与后面的词连写：والسوق。
    language_code: zh
    direction: ltr
