templates:
- content_key: practice.zh-ar.ar.a1.unit04.lesson01.choose.001
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: اليوم 字面意思是“那一天”,前面连着定冠词 ال;阿拉伯语就是这样表达“今天”的。
    language_code: zh
    direction: ltr
