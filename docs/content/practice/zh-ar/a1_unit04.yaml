    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: 月份名称 مايو 和 يونيو 沿用国际通用的历法名称，即五月和六月。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson01.order.003
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: word_order
  frame:
    text: اليوم الخامس من {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم الخامس من {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 阿拉伯语的日期先读日，再读 من(的)和月份。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson01.fill.004
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: fill_in_blank
  frame:
    text: ما {item} اليوم؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ما تاريخ اليوم؟ 是询问今天日期的常用说法。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson01.translate.005
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 月份名称写成一个词：مايو 是五月，يونيو 是六月。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson01.translate.006
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: translation
  frame:
    text: 今天几号？
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: ما {item} اليوم
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 询问日期的句子用 ما(什么)加 تاريخ(日期)和 اليوم(今天)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson02.listen.001
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 像 الخامس(第五)这样的序数词带 ال;这里用阳性，因为它指的是阳性名词 يوم(日)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson02.match.002
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: في 表示“在”,是独立的一个词，不像 ب 要连写在后一个词上。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson02.order.003
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: word_order
  frame:
    text: اليوم {item} من مايو.
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {item} من مايو.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 序数词带 ال:الخامس 是“第五”,السادس 是“第六”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson02.fill.004
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: fill_in_blank
  frame:
    text: اليوم الخامس من {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 月份跟在 من 后面，所以 اليوم الخامس من يونيو 的意思是“今天是6月5日”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson02.order.005
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: word_order
  frame:
    text: الدرس {item} الخامس من مايو.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس {item} الخامس من مايو.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 日期前的 في 表示“在那一天”:في الخامس من مايو。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson02.translate.006
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: في 后面的词和普通名词一样：في الدرس 的意思是“在课上”,其中 ال 表示特指。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson02.translate.007
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: 今天是五月五日。
    language_code: zh
    direction: ltr
  slots:
    a: *id009
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {a} من {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: الخامس 是“第五”,السادس 是“第六”;两者都用阳性，因为它们指的是 يوم(日)。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson02.translate.008
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: 今天是六月六日。
    language_code: zh
    direction: ltr
  slots:
    a: *id011
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: اليوم {a} من {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: السادس 是“第六”;它和其他序数词一样，前面带 ال。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson01.listen.007
  lesson_content_key: ar.a1.unit04.lesson01.date_words
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 月份有各自的名称，而日和月之间用 من(的)连接：الخامس من مايو。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson02.choose.009
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 日期前的 في 表示“在那一天”,而 ال 表示序数词是“第五”或“第六”这样的特指。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit04.lesson02.translate.010
  lesson_content_key: ar.a1.unit04.lesson02.state_dates
  type: translation
  frame:
    text: 课在5月5日。
    language_code: zh
    direction: ltr
  slots:
    f: *id008
    d: *id009
    m: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: الدرس {f} {d} من {m}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 课程日期在序数词前用 في(在):الدرس في الخامس من مايو。
    language_code: zh
    direction: ltr
