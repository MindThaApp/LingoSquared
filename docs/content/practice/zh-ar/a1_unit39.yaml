  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: &id001
      language_code: ar
      part_of_speech:
      - noun
      - verb
      - adjective
      - adverb
      agreement_tags:
        semantic:
        - w_الفصل
        - w_فصل
        - w_الربيع
        - w_الصيف
        - w_الخريف
        - w_تمطر
        - w_الشتاء
        - w_تراه
        - w_نضع
        - w_يتزلج
        - w_الجليد
        - w_نتزلج
        - w_الحوار
        - w_الفصول
        - w_فصول
        - w_وأربعة
        - w_اختيارات
        - w_مفضلة
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: '{item} 是本单元的词汇，出自关于春天和夏天的课程。'
    language_code: zh
    direction: ltr
