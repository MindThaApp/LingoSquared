      hint: english_gloss
  slots:
    item: *id002
    hint: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: غدا 是“明天”;时间放在它后面。
    language_code: zh
    direction: ltr
