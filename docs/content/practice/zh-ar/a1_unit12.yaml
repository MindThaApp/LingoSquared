    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: نعم، في الساعة الخامسة. {item}. إلى اللقاء.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 在道别之前,用一个表示同意的短词来结束计划。
    language_code: zh
    direction: ltr
