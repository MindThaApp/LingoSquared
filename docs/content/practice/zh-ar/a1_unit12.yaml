  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: نذهب 是“去”的“我们”形式;“我们”形式以 ن 开头。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit12.lesson01.order.003
  lesson_content_key: ar.a1.unit12.lesson01.time_for_plans
  type: word_order
  frame:
    text: هل نذهب إلى المقهى {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: هل نذهب إلى المقهى {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: غدا(明天)通常放在句末:我们明天去咖啡馆好吗?
    language_code: zh
    direction: ltr
