    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit12.lesson02.translate.003
  lesson_content_key: ar.a1.unit12.lesson02.make_a_plan
  type: translation
  frame:
    text: '{item}'
