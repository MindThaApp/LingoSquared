- content_key: practice.zh-ar.ar.a1.unit12.lesson01.translate.008
  lesson_content_key: ar.a1.unit12.lesson01.time_for_plans
  type: translation
  frame:
    text: 我们明天去咖啡馆好吗？
    language_code: zh
    direction: ltr
  slots:
    a: *id003
    b: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {a} إلى المقهى {b}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 同一个动词形式 نذهب 既表示“我们去”,也表示“我们去……好吗”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit12.lesson02.choose.001
