  required_next_reviewer: native_speaker_review
  fresh_context: 'false'
  notes: Derived from practice.en-ar by scripts/derive_cross.py (templates, slots and tags unchanged; frame/feedback text translated to Chinese (Mandarin, Simplified)). Needs native review of frame grammar across the whole slot pool.
tag_schema:
  part_of_speech:
  - symbol
  - noun
  - proper_noun
  - pronoun
  - verb
  - adjective
  - adverb
  - preposition
  - particle
  - phrase
  agreement_tags:
    semantic:
    - w_غدا
    - w_نذهب
    - w_جيد
slot_presets:
  mc: &id001
    language_code: ar
    part_of_speech:
    - verb
    - adjective
    - adverb
    agreement_tags:
      semantic:
      - w_غدا
      - w_نذهب
      - w_جيد
  ghadan: &id002
    language_code: ar
    part_of_speech: adverb
    agreement_tags:
      semantic: w_غدا
  nadhhab: &id003
    language_code: ar
    part_of_speech: verb
    agreement_tags:
      semantic: w_نذهب
  jayyid: &id004
    language_code: ar
    part_of_speech: adjective
    agreement_tags:
      semantic: w_جيد
templates:
- content_key: practice.zh-ar.ar.a1.unit12.lesson01.choose.001
  lesson_content_key: ar.a1.unit12.lesson01.time_for_plans
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: غدا 是“明天”;نذهب 是“我们去”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit12.lesson01.listen.002
  lesson_content_key: ar.a1.unit12.lesson01.time_for_plans
