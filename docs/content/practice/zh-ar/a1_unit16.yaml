templates:
- content_key: practice.zh-ar.ar.a1.unit16.lesson01.choose.001
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تذكرة 是票，القطار 是火车，القاهرة 是开罗。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson01.listen.002
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: إلى 意为“到”,所以 إلى القاهرة 就是“到开罗”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson01.match.003
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أي(哪个)放在单数名词之前；الثاني(第二)放在它所修饰的名词之后。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson01.order.004
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: word_order
  frame:
    text: أريد {item} إلى القاهرة.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} إلى القاهرة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 想要的东西跟在 أريد 之后，إلى(到)引出目的地。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson01.order.005
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: word_order
  frame:
    text: أريد تذكرة إلى {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد تذكرة إلى {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 目的地直接跟在 إلى 之后；القاهرة 中的 ال 是城市名称的一部分。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson01.fill.006
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: fill_in_blank
  frame:
    text: أريد {item} إلى القاهرة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id003
    hint: *id003
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تذكرة 是票；أريد(我想要)不需要另外的“我”字。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson01.translate.007
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这是两个常见名词和一个城市名；القاهرة 中的 ال 属于名称本身。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson01.translate.008
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: 请给我一张去开罗的票。(不需要单独的“我”字)
    language_code: zh
    direction: ltr
  slots:
    a: *id003
    b: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a} إلى {b} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 买票的说法是 أريد + 票 + إلى + 目的地。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson01.translate.009
  lesson_content_key: ar.a1.unit16.lesson01.ticket_destination
  type: translation
  frame:
    text: 我要一张票。火车五点开。(不需要单独的“我”字)
    language_code: zh
    direction: ltr
  slots:
    a: *id003
    b: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {a}. {b} في الساعة الخامسة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 表示钟点用 في الساعة 加阴性序数词：الساعة الخامسة。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson02.choose.001
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الرصيف 是站台，因为指特定的站台，所以带 ال。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson02.listen.002
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: الثاني 是阳性的“第二”;它与阳性名词 الرصيف 保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson02.order.003
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: word_order
  frame:
    text: من أي {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: من أي {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أي(哪个)后面的名词不带 ال:من أي رصيف؟ 意为“从哪个站台？”
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson02.order.004
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: word_order
  frame:
    text: من الرصيف {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: من الرصيف {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 序数词放在名词之后，也要带 ال:الرصيف الثاني。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson02.fill.005
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: fill_in_blank
  frame:
    text: من أي {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id007
    hint: *id007
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 在 أي 之后，名词不带 ال:من أي رصيف؟
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson02.fill.006
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: fill_in_blank
  frame:
    text: من الرصيف {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id008
    hint: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 序数词要重复名词的 ال:الرصيف الثاني。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson02.translate.007
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这些词用来谈论站台；أي 意为“哪个”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson02.translate.008
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: 从哪个站台？
    language_code: zh
    direction: ltr
  slots:
    a: *id010
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: من {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 这个问句是 من + أي + 不带 ال 的名词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit16.lesson02.translate.009
  lesson_content_key: ar.a1.unit16.lesson02.departure_platform
  type: translation
  frame:
    text: 从二号站台。
    language_code: zh
    direction: ltr
  slots:
    a: *id011
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: من {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 名词和序数词都要带 ال:الرصيف الثاني。
    language_code: zh
    direction: ltr
