templates:
- content_key: practice.zh-ar.ar.a1.unit19.lesson01.choose.001
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: بيت 是房子，غرفة 是房间，مطبخ 是厨房；这里的名词都不带 ال。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson01.listen.002
