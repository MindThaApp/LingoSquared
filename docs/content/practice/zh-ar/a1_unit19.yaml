  answer_derivation:
    kind: render_frame
    frame:
      text: في بيتي {item} واحدة.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 数词“一”放在名词后面，并与名词保持一致：غرفة واحدة 是阴性。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson01.order.005
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: word_order
  frame:
    text: في بيتي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: في بيتي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في بيتي 放在句首，意思是“在我家”；里面的东西放在后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson01.fill.006
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: fill_in_blank
  frame:
    text: في {item} غرفة واحدة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: بيت 后面的 ـي 词尾表示“我的”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson01.translate.007
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这是四个与家有关的名词：房子、房间、厨房和桌子。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson01.translate.008
  lesson_content_key: ar.a1.unit19.lesson01.rooms
  type: translation
  frame:
    text: 我家有一个房间。
    language_code: zh
    direction: ltr
  slots:
    a: *id005
    b: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: في {a} {b} واحدة
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 阿拉伯语没有表示“有”的动词：في بيتي غرفة 字面意思是“在我家 一个房间”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson02.choose.001
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: طاولة 是桌子；الغرفة 中的 ال 表示特指“那个房间”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson02.listen.002
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: عندك 的意思是“你有”；它由 عند 加词尾 ـك 构成。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson02.order.003
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: عندي طاولة في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي طاولة في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في الغرفة 是“在房间里”，用 ال 表示特定的房间。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson02.order.004
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: أين {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 词尾 ـك 表示“你的”，所以 أين بيتك؟ 的意思是“你家在哪里？”
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson02.order.005
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: word_order
  frame:
    text: هل {item} طاولة؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {item} طاولة؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هل 用来构成是非疑问句：هل عندك طاولة؟ 的意思是“你有桌子吗？”
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson02.fill.006
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: fill_in_blank
  frame:
    text: في بيتي غرفة واحدة {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و 与后面的词连写：ومطبخ 的意思是“和一个厨房”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson02.translate.007
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 词尾 ـي（我的）和 ـك（你的）都加在 بيت 后面。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson02.translate.008
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: 我在房间里有一张桌子。
    language_code: zh
    direction: ltr
  slots:
    a: *id012
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: عندي {a} في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 在短语 في الغرفة 中，في 后面仍保留 ال。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson02.translate.009
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: 你有桌子吗？
    language_code: zh
    direction: ltr
  slots:
    a: *id009
    b: *id012
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هل 放在句首构成疑问句，其余语序不变。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson02.translate.010
  lesson_content_key: ar.a1.unit19.lesson02.location_objects
  type: translation
  frame:
    text: 优素福，你家在哪里？
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item} يا يوسف
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 蕾拉用表示“你的”的 ـك 词尾向优素福提问。
    language_code: zh
    direction: ltr
