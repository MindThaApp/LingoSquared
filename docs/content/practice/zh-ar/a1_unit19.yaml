  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: بيتك 是 بيت（房子）加 ـك（你的）；عندك 的意思是“你有”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit19.lesson01.order.004
  lesson_content_key: ar.a1.unit19.lesson01.rooms
