- content_key: practice.zh-ar.ar.a1.unit38.lesson03.order.002
  lesson_content_key: ar.a1.unit38.lesson03.wrdy_wbnfsjy
  type: word_order
  frame:
    text: كلمة اللون {item}، فنقول أريد اللون الوردي.
    language_code: ar
    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكرة
  answer_derivation:
    kind: render_frame
    frame:
      text: كلمة اللون {item}، فنقول أريد اللون الوردي.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: “颜色”一词是阳性，所以后面的颜色也用阳性：我想要粉色。أريد (urīd) 的意思是“我想要”。对比 الورود وردية（玫瑰花是粉色的）：指物的复数要用阴性单数形容词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit38.lesson03.fill.003
  lesson_content_key: ar.a1.unit38.lesson03.wrdy_wbnfsjy
  type: fill_in_blank
  frame:
    text: أريد اللون {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_الوردي
    hint:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_الوردي
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 我想要粉色。الوردي 的意思是粉色的那个（阳性）。
    language_code: zh
    direction: ltr
