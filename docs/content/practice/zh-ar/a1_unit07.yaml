templates:
- content_key: practice.zh-ar.ar.a1.unit07.lesson01.choose.001
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أريد 的意思是“我想要”；男女都用同一个形式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson01.listen.002
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: ماء 是水，قهوة 是咖啡；خبز（面包）是你还可以要的第三样东西。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson01.match.003
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: و（和）与后面的词连写：وقهوة 是“和咖啡”。من فضلك 是礼貌的“请”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson01.order.004
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: word_order
  frame:
    text: أريد {item} من فضلك.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أريد 加名词就是“我想要……”；من فضلك（请）放在请求的末尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson01.fill.005
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: fill_in_blank
  frame:
    text: أريد ماء {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 这里 و 是后面那个词的一部分：وقهوة 是“和咖啡”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson01.fill.006
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: fill_in_blank
  frame:
    text: أريد ماء وقهوة من {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: من فضلك 字面意思是“出于您的恩惠”，是日常说“请”的方式。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson01.translate.007
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أريد 是动词，意思是“我想要”；这里的其他词都是可以要的东西。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson01.translate.008
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: translation
  frame:
    text: 请给我水。
    language_code: zh
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 阿拉伯语的名词前不用“一个”这类冠词：أريد ماء 就是“我想要水”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson01.translate.009
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: translation
  frame:
    text: 请给我咖啡。
    language_code: zh
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: قهوة 以 ة 结尾，这是常见的阴性词尾。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson02.listen.001
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تريدين 是“想要”的阴性“你”形式；称呼男士时词尾不同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson02.choose.002
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: قطعة 的意思是“片、块”；قطعة خبز 是“一片面包”，后面的 واحدة（一）要与它保持一致。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson02.order.003
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: word_order
  frame:
    text: هل تريدين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل تريدين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هل 把陈述句变成是非疑问句；خبزا 是作为所要之物的“面包”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson02.order.004
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: word_order
  frame:
    text: نعم، أريد قطعة خبز {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: نعم، أريد قطعة خبز {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: واحدة 是阴性的“一”，与阴性词 قطعة 相配。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson02.fill.005
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: fill_in_blank
  frame:
    text: هل {item} خبزا؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تريدين 是（阴性）“你想要”，所以 هل تريدين خبزا؟ 是在问一位女士“你要面包吗？”
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson02.translate.006
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تفضلي 是对女士说的，意思是“给你”；男士听到的词尾则不同。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson02.translate.007
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: translation
  frame:
    text: 你要面包吗？（对女士说）
    language_code: zh
    direction: ltr
  slots:
    a: *id011
    b: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 词尾 -ين 标志阴性的“你”形式，而作为所要之物的“面包”写作 خبزا。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit07.lesson02.translate.008
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: translation
  frame:
    text: 一片面包
    language_code: zh
    direction: ltr
  slots:
    a: *id012
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} خبز {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: واحدة 跟在 قطعة 之后，并与它的阴性保持一致。
    language_code: zh
    direction: ltr
