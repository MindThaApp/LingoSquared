templates:
- content_key: practice.zh-ar.ar.a1.unit18.lesson01.choose.001
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: مهندس 是“工程师”（阳性）；阴性要加 ة。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson01.listen.002
