  feedback_frame:
    text: أعمل في مكتب 意思是“我在办公室工作”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson01.fill.007
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
