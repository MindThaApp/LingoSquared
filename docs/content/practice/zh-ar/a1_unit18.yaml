      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 词尾 ـك 表示“你的”：عملك 是“你的工作”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson01.translate.008
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: عملك 带有词尾 ـك（你的）；أعمل 是第一人称动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson01.translate.009
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: translation
  frame:
    text: 我是工程师。（男性说）
    language_code: zh
    direction: ltr
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 男性说 مهندس；不需要相当于“是”的动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson01.translate.010
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: translation
  frame:
    text: 我在办公室工作。（不单独用“我”这个词）
    language_code: zh
    direction: ltr
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أعمل في {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: أعمل 本身就是“我工作”，所以不需要 أنا。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson02.choose.001
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أكتب 是“我写”，أقرأ 是“我读”；两者都是第一人称动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson02.listen.002
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id006
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: العمل 带有 ال，所以是“这份工作”；في العمل 是“在工作中”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson02.order.003
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: word_order
  frame:
    text: أنا {item} في العمل.
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item} في العمل.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 这些动词本身已经表示“我写”和“我读”，所以 أنا（我）可以省略。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson02.order.004
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: word_order
  frame:
    text: أكتب وأقرأ في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أكتب وأقرأ في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في العمل 意思是“在工作中”；ال 是 العمل 的一部分。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson02.fill.005
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: fill_in_blank
  frame:
    text: أكتب {item} في العمل. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: و 连写在动词前面：وأقرأ 意思是“并且我读”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson02.translate.006
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: '{item}'
    language_code: zh
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أكتب 和 أقرأ 是第一人称动词；العمل 是带 ال 的“工作”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson02.translate.007
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: 我在工作中写东西。（不单独用“我”这个词）
    language_code: zh
    direction: ltr
  slots:
    item: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أكتب في {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في 加 العمل 意思是“在工作中”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson02.translate.008
  lesson_content_key: ar.a1.unit18.lesson02.work_activity
  type: translation
  frame:
    text: 我在工作中阅读。（不单独用“我”这个词）
    language_code: zh
    direction: ltr
  slots:
    b: *id008
  answer_derivation:
    kind: render_frame
    frame:
      text: أقرأ في {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 动词在前，然后是 في 和地点。
    language_code: zh
    direction: ltr
