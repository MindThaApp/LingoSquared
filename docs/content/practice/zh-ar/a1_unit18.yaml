    slot: item
  feedback_frame:
    text: أعمل في مكتب 意思是“我在办公室工作”；أعمل 是第一人称动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson01.match.003
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
