    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: عمل 是名词“工作”，而 أعمل 是动词“我工作”；أكتب 和 أقرأ 也是第一人称动词。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson01.order.004
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: word_order
  frame:
    text: أنا {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أنا {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 阿拉伯语不需要相当于“是”的词：أنا مهندس 字面意思是“我 工程师”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson01.order.005
  lesson_content_key: ar.a1.unit18.lesson01.job_workplace
  type: word_order
  frame:
    text: أعمل في {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id004
  answer_derivation:
    kind: render_frame
    frame:
      text: أعمل في {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: في（在）后面接地点；مكتب 是“办公室”。
    language_code: zh
    direction: ltr
- content_key: practice.zh-ar.ar.a1.unit18.lesson01.fill.006
