    language_code: de
    direction: ltr
  slots:
    item: *id005
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: ال ist der arabische bestimmte Artikel; er wird vorn an das Nomen geschrieben.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit09.lesson01.translate.008
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
    text: Wo ist der Markt?
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أين {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Das Arabische braucht kein Wort für „ist“: أين السوق؟ heißt wörtlich „Wo der Markt?“.'
    language_code: de
    direction: ltr
