  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: مكتبة (Bibliothek), سوق (Markt) und مقهى (Café) sind Orte; مكان ist das allgemeine Wort „Ort“.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit09.lesson01.translate.007
  lesson_content_key: ar.a1.unit09.lesson01.common_places
  type: translation
  frame:
