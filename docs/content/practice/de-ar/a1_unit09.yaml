    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المكتبة {item} قرب السوق.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'هنا („hier“) kann vor قرب stehen: Die Bibliothek ist hier, in der Nähe des Marktes.'
    language_code: de
    direction: ltr
