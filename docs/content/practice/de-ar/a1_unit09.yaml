    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: قرب („nahe bei“) steht vor dem Ort, in dessen Nähe etwas ist, hier der Markt.
    language_code: de
    direction: ltr
