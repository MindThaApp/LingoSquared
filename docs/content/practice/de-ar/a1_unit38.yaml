    text: 'Das Wort für „Farbe“ ist maskulin, daher ist auch die darauf folgende Farbe maskulin: Ich möchte Rosa. أريد (urīd) bedeutet „ich will“ oder „ich möchte“. Vergleichen Sie الورود وردية (die Rosen sind rosa): Ein Plural von Dingen steht mit einem Adjektiv im Femininum Singular.'
