    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: حال bedeutet „Zustand“ und die Endung ـك „dein“; die Frage heißt also wörtlich „Wie ist dein Zustand?“.
    language_code: de
    direction: ltr
