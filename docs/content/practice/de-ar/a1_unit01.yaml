    text: مع السلامة bedeutet wörtlich „mit Sicherheit/Wohlergehen“; ال ist der bestimmte Artikel und wird mit dem Nomen zusammengeschrieben.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit01.lesson02.translate.004
  lesson_content_key: ar.a1.unit01.lesson02.everyday_greetings
