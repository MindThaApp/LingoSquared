  answer_derivation:
    kind: render_frame
    frame:
      text: كيف {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Das geschriebene Wort حالك ist für Mann und Frau gleich; nur der kurze Vokal am Ende unterscheidet sich beim Sprechen.
    language_code: de
    direction: ltr
