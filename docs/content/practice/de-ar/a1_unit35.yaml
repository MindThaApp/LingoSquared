    direction: rtl
  slots:
    item:
      language_code: ar
      part_of_speech: verb
      agreement_tags:
        semantic: w_يصل
  answer_derivation:
    kind: render_frame
    frame:
      text: الطرد {item} غدا.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Das Paket kommt morgen an. يصل bedeutet „er kommt an; es kommt an“ (maskulin).
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit35.lesson03.fill.003
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: fill_in_blank
  frame:
    text: الطرد {item} فنقول يصل، والرسالة مؤنثة فنقول تصل. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
    hint:
      language_code: ar
      part_of_speech: adjective
      agreement_tags:
        semantic: w_مذكر
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Das Paket ist maskulin, deshalb sagen wir يصل (yaṣil). Der Brief ist feminin, deshalb sagen wir تصل (taṣil). Ein Verb im Präsens beginnt bei einem maskulinen Subjekt mit ي und bei einem femininen mit ت, wie in الطرد يصل (aṭ-ṭard yaṣil) und الرسالة تصل.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit35.lesson03.translate.004
  lesson_content_key: ar.a1.unit35.lesson03.alwswl_wastghraq_alwqt
  type: translation
  frame:
    text: Das Paket kommt morgen an und der Brief braucht drei Tage.
    language_code: de
    direction: ltr
  slots:
    item:
      language_code: ar
      part_of_speech: noun
      agreement_tags:
        semantic: w_والرسالة
  answer_derivation:
    kind: render_frame
    frame:
      text: الطرد يصل غدا {item} تستغرق ثلاثة أيام.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Das Paket kommt morgen an und der Brief braucht drei Tage. والرسالة bedeutet „und der Brief“.
    language_code: de
    direction: ltr
