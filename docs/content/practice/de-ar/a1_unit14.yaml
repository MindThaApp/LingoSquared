    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'ولا besteht aus و (und) plus لا (nicht): und nicht.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson01.match.003
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id002
    second: *id002
    third: *id002
    fourth: *id002
    fifth: *id002
    sixth: *id002
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: أحب heißt „ich mag“ und أفضل heißt „ich bevorzuge“; ولا („und nicht“) verbindet eine verneinte Aussage mit der vorhergehenden.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson01.order.004
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Das Gemochte steht nach أحب, mit ال für die allgemeine Art: أحب القهوة heißt „Ich mag Kaffee“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson01.order.005
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: word_order
  frame:
    text: لا أحب {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: لا أحب {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'لا vor dem Verb verneint es: لا أحب heißt „ich mag nicht“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson01.fill.006
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أحب القهوة {item} أحب الشاي. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'ولا verbindet einen verneinten Satz: Ich mag Kaffee und ich mag keinen Tee.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson01.fill.007
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: fill_in_blank
  frame:
    text: أنا {item} الماء. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id005
    hint: *id005
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أنا („ich“) kann zur Betonung hinzugefügt werden, aber أحب allein bedeutet schon „ich mag“.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson01.translate.008
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: شاي ist „Tee“ ohne Artikel, الماء dagegen ist „das Wasser“ mit ال; أحب heißt „ich mag“.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson01.translate.009
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: Ich mag Wasser. (kein eigenes Wort für „ich“)
    language_code: de
    direction: ltr
  slots:
    a: *id005
    b: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Nach أحب steht im Arabischen ال für eine Sache im Allgemeinen, also heißt „Ich mag Wasser“ أحب الماء.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson01.translate.010
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: translation
  frame:
    text: Das ist Tee.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Ohne ال bedeutet شاي einfach „Tee“, und das Arabische braucht kein Wort für „ist“: هذا شاي.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson02.choose.001
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أفضل heißt „ich bevorzuge“; تفضل mit dem Präfix ت ist die maskuline Form für „du“.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson02.listen.002
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'تفضل heißt „du bevorzugst“, zu einem Mann gesagt: ماذا تفضل يا يوسف؟'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson02.order.003
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
    text: ماذا {item} يا يوسف؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} يا يوسف؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Das Präfix ت kennzeichnet „du“; ماذا تفضل؟ fragt einen Mann, was er bevorzugt.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson02.order.004
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: word_order
  frame:
    text: أفضل {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: أفضل {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Nach أفضل folgt das Bevorzugte mit ال: أفضل القهوة.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson02.fill.005
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: fill_in_blank
  frame:
    text: أنا {item} القهوة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id010
    hint: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أفضل heißt „ich bevorzuge“; das Präfix أ kennzeichnet „ich“, wie in أحب und أريد.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson02.translate.006
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أفضل heißt „ich bevorzuge“ und تفضل „du bevorzugst“ (männlich); das Präfix أ oder ت zeigt, wer gemeint ist.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson02.translate.007
  lesson_content_key: ar.a1.unit14.lesson02.choices
  type: translation
  frame:
    text: Was bevorzugst du, Yusuf?
    language_code: de
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: ماذا {item} يا يوسف
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Yusuf ist ein Mann, deshalb lautet die Form für „du“ تفضل.
    language_code: de
    direction: ltr
