templates:
- content_key: practice.de-ar.ar.a1.unit14.lesson01.choose.001
  lesson_content_key: ar.a1.unit14.lesson01.likes
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: أحب ist das Verb ich mag; direkt danach folgt, was man mag.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit14.lesson01.listen.002
  lesson_content_key: ar.a1.unit14.lesson01.likes
