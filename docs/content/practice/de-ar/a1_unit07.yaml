  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: أريد ist ein Verb und bedeutet ich möchte; die anderen Wörter hier sind Dinge, um die man bitten kann.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit07.lesson01.translate.008
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: translation
  frame:
    text: Ich möchte Wasser, bitte.
    language_code: de
    direction: ltr
  slots:
    item: *id006
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Im Arabischen steht vor dem Nomen kein unbestimmter Artikel: أريد ماء heißt ich möchte Wasser.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit07.lesson01.translate.009
  lesson_content_key: ar.a1.unit07.lesson01.food_drink
  type: translation
  frame:
    text: Ich möchte Kaffee, bitte.
    language_code: de
    direction: ltr
  slots:
    item: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: أريد {item} من فضلك
      language_code: ar
      direction: rtl
  feedback_frame:
    text: قهوة endet auf ة, die häufige feminine Endung.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit07.lesson02.listen.001
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: تريدين ist die feminine Du-Form von „wollen“; einen Mann würde man mit einer anderen Endung ansprechen.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit07.lesson02.choose.002
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id008
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: قطعة bedeutet Stück; قطعة خبز ist ein Stück Brot, und das nächste Wort واحدة (eins) richtet sich danach.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit07.lesson02.order.003
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: word_order
  frame:
    text: هل تريدين {item}؟
    language_code: ar
    direction: rtl
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل تريدين {item}؟
      language_code: ar
      direction: rtl
  feedback_frame:
    text: هل macht aus einer Aussage eine Ja-Nein-Frage; خبزا ist Brot als das Gewünschte.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit07.lesson02.order.004
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: word_order
  frame:
    text: نعم، أريد قطعة خبز {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: نعم، أريد قطعة خبز {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: واحدة ist feminines „eins“ und passt zum femininen Wort قطعة.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit07.lesson02.fill.005
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: fill_in_blank
  frame:
    text: هل {item} خبزا؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id011
    hint: *id011
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'تريدين heißt du (fem.) möchtest, also fragt هل تريدين خبزا؟ eine Frau: Möchtest du Brot?'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit07.lesson02.translate.006
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id008
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: تفضلي sagt man zu einer Frau; es bedeutet bitte sehr. Ein Mann würde eine andere Endung hören.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit07.lesson02.translate.007
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: translation
  frame:
    text: Möchtest du Brot? (zu einer Frau gesagt)
    language_code: de
    direction: ltr
  slots:
    a: *id011
    b: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: هل {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Die Endung -ين kennzeichnet die feminine Du-Form, und Brot als das Gewünschte wird خبزا geschrieben.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit07.lesson02.translate.008
  lesson_content_key: ar.a1.unit07.lesson02.cafe_exchange
  type: translation
  frame:
    text: ein Stück Brot
    language_code: de
    direction: ltr
  slots:
    a: *id012
    b: *id010
  answer_derivation:
    kind: render_frame
    frame:
      text: '{a} خبز {b}'
      language_code: ar
      direction: rtl
  feedback_frame:
    text: واحدة folgt auf قطعة und passt sich dem femininen Geschlecht an.
    language_code: de
    direction: ltr
