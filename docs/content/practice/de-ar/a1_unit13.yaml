      text: ماذا {a} {b}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: فعلت ist die Form der Vergangenheit für „du“; geschrieben sieht sie für einen Mann und eine Frau gleich aus.
    language_code: de
    direction: ltr
