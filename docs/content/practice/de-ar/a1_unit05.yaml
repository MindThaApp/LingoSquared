    text: 'Die Stundenzahlen sind feminin und richten sich nach الساعة: الثالثة und الخامسة enden auf ة, anders als die maskulinen Ordnungszahlen, die bei Datumsangaben verwendet werden.'
    language_code: de
    direction: ltr
