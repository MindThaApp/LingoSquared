templates:
- content_key: practice.de-ar.ar.a1.unit03.lesson01.choose.001
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id001
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: Jedes Zahlwort wird von rechts nach links gelesen; ثلاثة beginnt mit ث, das wie das stimmlose th im englischen „think“ klingt.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson01.match.002
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
