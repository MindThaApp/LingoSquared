    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: ثلاثة (drei) und ثمانية (acht) beginnen beide mit ث, dem th-Laut; am Rest des Wortes erkennt man den Unterschied.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson01.order.003
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: word_order
  frame:
    text: واحد، اثنان، {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id003
  answer_derivation:
    kind: render_frame
    frame:
      text: واحد، اثنان، {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: Das Wort für drei, ثلاثة, endet auf ة, wie viele andere arabische Nomen.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson01.fill.004
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: fill_in_blank
  frame:
    text: واحد، {item}، ثلاثة. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id004
    hint: *id004
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Das Arabische hat eine eigene Dualendung ـان für zwei Dinge; اثنان ist das Wort „zwei“ selbst.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson01.translate.005
  lesson_content_key: ar.a1.unit03.lesson01.numbers_one_to_five
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id001
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: Die Zahlen von drei bis zehn enden beim Zählen auf ة, zum Beispiel ثلاثة und خمسة.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson02.listen.001
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: listen_select
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id005
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: 'سبعة (sieben) und تسعة (neun) enden auf dieselben Buchstaben عة; achten Sie daher auf den ersten Laut: s oder t.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson02.order.002
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: word_order
  frame:
    text: رقمي {item}.
    language_code: ar
    direction: rtl
  slots:
    item: *id002
  answer_derivation:
    kind: render_frame
    frame:
      text: رقمي {item}.
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'رقمي bedeutet „meine Nummer“: رقم ist „Nummer“ und die Endung ـي bedeutet „mein“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson02.fill.003
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: fill_in_blank
  frame:
    text: ثمانية، تسعة، {item}. ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id006
    hint: *id006
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: عشرة ist zehn; wie alle Zählzahlen von drei bis zehn endet es auf ة.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson02.translate.004
  lesson_content_key: ar.a1.unit03.lesson02.numbers_six_to_ten
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id002
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: ستة (sechs) und سبعة (sieben) beginnen beide mit س; an den Endbuchstaben erkennen Sie den Unterschied.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson03.choose.001
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: multiple_choice
  frame:
    text: '{item}'
    language_code: ar
    direction: rtl
  slots:
    item: *id007
  answer_derivation:
    kind: slot_gloss
    slot: item
  feedback_frame:
    text: كم fragt nach „wie viel“ oder „wie viele“, und هذا zeigt auf etwas in Ihrer Nähe.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson03.match.002
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: matching_pairs
  frame:
    text: '{first} · {second} · {third} · {fourth} · {fifth} · {sixth}'
    language_code: ar
    direction: rtl
  slots:
    first: *id008
    second: *id008
    third: *id008
    fourth: *id008
    fifth: *id008
    sixth: *id008
  slot_relations:
  - kind: distinct
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  answer_derivation:
    kind: matching_pairs
    slots:
    - first
    - second
    - third
    - fourth
    - fifth
    - sixth
  feedback_frame:
    text: بخمسة und بعشرة beginnen mit ب, das hier „für“ oder „zum Preis von“ bedeutet.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson03.fill.003
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: fill_in_blank
  frame:
    text: كم {item}؟ ({hint})
    language_code: ar
    direction: rtl
    slot_rendering:
      hint: english_gloss
  slots:
    item: *id009
    hint: *id009
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: كم هذا fragt nach dem Preis einer einzelnen Sache; هذا („dieses“) ist die maskuline Form.
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson03.translate.004
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: '{item}'
    language_code: de
    direction: ltr
    slot_rendering:
      item: english_gloss
  slots:
    item: *id010
  answer_derivation:
    kind: slot_text
    slot: item
  feedback_frame:
    text: 'وهذا besteht aus و („und“) und هذا („dieses“): „und das?“'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson03.translate.005
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: Wie viel kostet das?
    language_code: de
    direction: ltr
  slots:
    item: *id009
  answer_derivation:
    kind: render_frame
    frame:
      text: كم {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Im Arabischen gibt es in dieser Frage kein Wort für „ist“: كم هذا heißt wörtlich „wie viel das“.'
    language_code: de
    direction: ltr
- content_key: practice.de-ar.ar.a1.unit03.lesson03.translate.006
  lesson_content_key: ar.a1.unit03.lesson03.using_numbers
  type: translation
  frame:
    text: Das kostet fünf.
    language_code: de
    direction: ltr
  slots:
    item: *id011
  answer_derivation:
    kind: render_frame
    frame:
      text: هذا {item}
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Die Präposition ب wird direkt an die Zahl geschrieben: ب + خمسة ergibt بخمسة.'
    language_code: de
    direction: ltr
