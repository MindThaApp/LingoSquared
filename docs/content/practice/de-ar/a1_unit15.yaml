  lesson_content_key: ar.a1.unit15.lesson02.compare_choices
  type: translation
  frame:
    text: Das Café ist näher als der Markt, und der Markt ist größer als das Café.
    language_code: de
    direction: ltr
  slots:
    a: *id004
    b: *id007
  answer_derivation:
    kind: render_frame
    frame:
      text: المقهى {a} من السوق، {b} أكبر من المقهى
      language_code: ar
      direction: rtl
  feedback_frame:
    text: 'Das و („und“) wird mit dem folgenden Wort zusammengeschrieben: والسوق.'
    language_code: de
    direction: ltr
